# Push-gate settings for the machine-wide pre-push hook (~/.claude/githooks/pre-push),
# which .githooks/pre-push hands off to. git-config format; a key in a clone's own
# .git/config wins over this file. local-gate.md § 6.2.
[ants "gate"]
	command = ./scripts/ci_local.sh
	docsMode = --docs
	# Only prose counts. Not docs/*: docs/ also holds requirements.txt and an env
	# example. Markdown that tests read is covered by ci_local.sh --docs.
	docsGlob = *.md|LICENSE
