# Gitleaks allowlist for RetroDB.
#
# A false positive in tracked source is excused per finding, never by path:
# an inline `gitleaks:allow` on the line, or its fingerprint in
# .gitleaksignore (global standards/security.md § 2). This file holds only
# scan scope and one content rule that cannot match a secret.

[extend]
useDefault = true

[[allowlists]]
description = "Scan scope, not excuses: git-ignored runtime state (user-edited settings and tokens, logs, the DB) and scraped binary media. None of it is project source."
paths = [
  '''logs/.*''',
  '''data/scraper_settings\.json$''',
  '''data/settings\.json$''',
  '''data/psn_tokens\.json$''',
  '''data/xbox_tokens\.json$''',
  '''database/.*''',
  '''static/images/.*''',
  '''static/videos/.*''',
]

[[allowlists]]
description = "Claude model identifiers (e.g. claude-haiku-4-5-20251001) in the settings templates' <select> options trip generic-api-key."
# Anchored to the whole matched secret and limited to a model family name
# followed by digit-only groups, so it cannot excuse a real credential:
# Anthropic keys start `sk-ant-`, and a digits-and-dashes tail carries no
# entropy. Any other finding in these templates still fires. Pass 59.87.
regexTarget = "secret"
regexes = [
  '''^claude-(opus|sonnet|haiku)(-\d+)+$''',
]
