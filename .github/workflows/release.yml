name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v2.77.6)"
        required: true
      build_standalone:
        description: "Also build standalone PyInstaller binaries (Linux/macOS/Windows). ~600 MB each; triples CI minutes."
        type: boolean
        default: false

# Force Node 24 for all JavaScript actions — see .github/workflows/ci.yml.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# SLSA build provenance + keyless cosign signatures need `id-token: write`
# for the OIDC exchange with Sigstore. `attestations: write` publishes the
# generated attestation back to the repo. `contents: write` is for the
# release itself.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # All third-party actions are pinned by commit SHA — tag references can
      # be force-pushed under Dependabot's feet, SHAs can't. Dependabot's
      # github-actions ecosystem (.github/dependabot.yml) will open PRs to
      # bump the SHA + trailing version comment together.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"

      - name: Install build + SBOM tooling
        run: |
          python -m pip install --upgrade pip
          # Install from the hash-pinned lockfile (not the unpinned
          # requirements.txt): the SBOM below is generated from
          # requirements.lock, so the release build environment must match
          # the exact dependency set the SBOM describes.
          pip install --require-hashes -r requirements.lock
          pip install cyclonedx-bom  # provides the `cyclonedx-py` CLI

      # Pass 45.19 — the Python body is passed via an env-var with the YAML
      # block-literal scalar, then run with `python -c "$VAR"`. The YAML
      # parser strips the indent baseline from the env-var content before
      # bash ever sees it. The older bash here-doc form preserved the
      # 10-space YAML indent and Python rejected it with `IndentationError:
      # unexpected indent`, which silently broke every tag-driven release
      # since the workflow landed.
      - name: Build Linux / macOS / Windows ZIPs
        env:
          # build_dist.py reads RETRODB_STAGING_DIR for the output dir
          # (Pass 39.6) — CI sets it here so we don't write to the
          # maintainer's /mnt/Storage path that doesn't exist on the runner.
          RETRODB_STAGING_DIR: /tmp/staging
        run: |
          mkdir -p /tmp/staging
          cp config.example.py config.py
          python build_dist.py
          ls -la /tmp/staging

      - name: Generate SBOM (CycloneDX)
        run: |
          # One SBOM per release — all three ZIPs share the same Python
          # dependency set (only the start-script varies per platform).
          cyclonedx-py requirements requirements.lock \
            --output-format JSON \
            --output-file /tmp/staging/RetroDB-${{ github.event.inputs.tag || github.ref_name }}-sbom.cdx.json
          ls -la /tmp/staging

      - name: Emit SHA-256 checksums for ZIPs + SBOM
        working-directory: /tmp/staging
        run: |
          sha256sum RetroDB-*.zip RetroDB-*-sbom.cdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Install cosign (keyless signing)
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003  # v4.1.1

      - name: Sign ZIPs + SBOM with cosign (keyless OIDC)
        working-directory: /tmp/staging
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # Keyless signing uses the GitHub Actions OIDC token — no long-lived
          # private key to rotate. Each .sig + .pem pair goes into the release
          # so downstream Patreon recipients can verify via:
          #   cosign verify-blob --certificate ZIP.pem --signature ZIP.sig \
          #     --certificate-identity-regexp '.*' \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          #     ZIP
          #
          # --new-bundle-format=false (2026-06-30): recent cosign flipped the
          # sign-blob default to the single-file .bundle format, which *ignores*
          # --output-signature/--output-certificate and then aborts on the empty
          # --bundle path ("create bundle file: open : no such file or
          # directory"), silently breaking every signed release. Pin the legacy
          # behaviour so the .sig/.pem pair (and the verify command above) keep
          # working. Migrate to --bundle if/when cosign removes the legacy path.
          for f in RetroDB-*.zip RetroDB-*-sbom.cdx.json SHA256SUMS.txt; do
            cosign sign-blob --yes \
              --new-bundle-format=false \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done
          ls -la

      - name: Generate SLSA build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: |
            /tmp/staging/RetroDB-*.zip
            /tmp/staging/RetroDB-*-sbom.cdx.json

      - name: Extract changelog entry
        id: changelog
        env:
          # Pass 45.19 — see the build step's note. Same bash-here-doc
          # indent bug was here too; same fix.
          EXTRACT_CHANGELOG_SCRIPT: |
            import yaml, os, sys
            tag = os.environ.get('GITHUB_REF_NAME', '').lstrip('v')
            with open('data/changelog.yaml') as f:
                entries = yaml.safe_load(f)
            for e in entries:
                if str(e.get('version')) == tag:
                    body = e.get('body', '').strip()
                    # GitHub Actions multi-line output
                    print('body<<EOF')
                    print(body)
                    print('EOF')
                    sys.exit(0)
            print('body=No changelog entry found.')
        run: |
          pip install pyyaml
          python -c "$EXTRACT_CHANGELOG_SCRIPT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: RetroDB ${{ github.event.inputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: true
          files: |
            /tmp/staging/RetroDB-v*-*.zip
            /tmp/staging/RetroDB-*-sbom.cdx.json
            /tmp/staging/SHA256SUMS.txt
            /tmp/staging/*.sig
            /tmp/staging/*.pem

  # ---------------------------------------------------------------------------
  # Optional standalone PyInstaller binaries (Pass 46.3 Part 4).
  # ---------------------------------------------------------------------------
  # Gated to a MANUAL workflow_dispatch that opts in via build_standalone=true —
  # never runs on an automatic tag push. Each OS bundle is ~600 MB and the build
  # is slow, so a 3-OS matrix triples CI minutes per release (the trade-off
  # called out in the roadmap). PyInstaller cannot cross-compile, hence one
  # native runner per target OS. Runs after build-and-release so the draft
  # release already exists to attach assets to.
  build-standalone:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_standalone }}
    needs: build-and-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"

      - name: Build CPU-only standalone bundle
        shell: bash
        env:
          # runner.temp is the cross-OS writable scratch dir (the source job's
          # hardcoded /tmp/staging isn't valid on the Windows runner).
          RETRODB_STAGING_DIR: ${{ runner.temp }}/staging
        run: |
          mkdir -p "$RETRODB_STAGING_DIR"
          cp config.example.py config.py
          # --cpu-only builds in an isolated venv with vanilla onnxruntime,
          # producing the portable ~600 MB CPU bundle. CI runners have no AMD
          # GPU, so the CPU variant is the only sensible one to ship from here;
          # the flag also keeps the artifact name (-CPU) unambiguous against a
          # maintainer's locally-built GPU bundle.
          python build_dist.py --standalone --cpu-only
          ls -la "$RETRODB_STAGING_DIR"

      - name: Emit SHA-256 checksum per zip
        shell: bash
        env:
          RETRODB_STAGING_DIR: ${{ runner.temp }}/staging
          # Env-var block scalar + `python -c` — the repo's standard idiom for
          # inline Python in this workflow (see the build job's Pass 45.19 note:
          # bash heredocs inherit the YAML indent and break with IndentationError).
          # Python is used over sha256sum/shasum so the step is identical on all
          # three runner OSes.
          CHECKSUM_SCRIPT: |
            import hashlib, glob, os
            staging = os.environ['RETRODB_STAGING_DIR']
            for z in sorted(glob.glob(os.path.join(staging, 'RetroDB-*-Standalone.zip'))):
                h = hashlib.sha256()
                with open(z, 'rb') as f:
                    for chunk in iter(lambda: f.read(1 << 20), b''):
                        h.update(chunk)
                with open(z + '.sha256', 'w') as out:
                    out.write(h.hexdigest() + '  ' + os.path.basename(z) + '\n')
                print(z + '.sha256')
        run: python -c "$CHECKSUM_SCRIPT"

      - name: Upload standalone bundle to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: |
            ${{ runner.temp }}/staging/RetroDB-*-Standalone.zip
            ${{ runner.temp }}/staging/RetroDB-*-Standalone.zip.sha256
