name: Dependabot lockfile regeneration

# Pass 39.5 — Dependabot bumps `requirements.txt` natively but doesn't know
# how to recompile our generated `requirements.lock`. Without this workflow,
# every Dependabot PR fails the lockfile-drift check in CI until a human
# recompiles the lock and pushes a follow-up commit. This workflow does that
# automatically the moment Dependabot opens
# the PR, then pushes the regenerated lockfile back to the same branch so
# the original Dependabot PR goes green on its own.

on:
  pull_request:
    branches: [main]
    paths:
      - "requirements.txt"

# Allow this workflow to push a commit back to the Dependabot PR branch.
# `pull-requests: write` is needed for the `gh` API call that re-runs the
# subsequent CI workflow once the new commit lands. Scoped narrowly:
# everything else stays read.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate-lockfile:
    # Only run for Dependabot PRs that actually touched requirements.txt;
    # human-authored PRs already include the regenerated lockfile, and the
    # `paths:` filter above keeps the workflow itself dormant.
    #
    # Gate on the PR's AUTHOR, not on `github.actor`. `github.actor` is whoever
    # most recently caused the event, so a human re-running this workflow on a
    # Dependabot PR makes it their login — the check then fails open or closed
    # depending on who touched it last, which is not the question being asked
    # (zizmor bot-conditions). The PR author is fixed for the life of the PR.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # The default GITHUB_TOKEN cannot trigger downstream workflows on
          # the resulting push. We don't need a downstream re-run here — the
          # original CI run on the Dependabot PR is what the lockfile commit
          # is meant to satisfy. Keep the default token; no PAT required.
          #
          # persist-credentials MUST stay on here: the last step does a real
          # `git push`, which reads the credential this checkout leaves in
          # .git/config. This is the one checkout in the repo that cannot take
          # `persist-credentials: false` — zizmor's artipacked finding on this
          # line is accepted, not overlooked.
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Regenerate requirements.lock with hashes
        run: |
          # Match exactly the recipe baked into the lockfile header so the
          # CI drift check stays comparable. Pass 39.4 added --generate-hashes;
          # without it the resulting lockfile won't satisfy `pip install
          # --require-hashes` in the installers. Pass 57.3 moved the compiler
          # from pip-tools to uv — see the note in ci.yml's drift job.
          uv pip compile requirements.txt --strip-extras --generate-hashes \
            --quiet -o requirements.lock

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- requirements.lock; then
            echo "No lockfile changes — Dependabot bump didn't move pinned versions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          git commit -m "deps: regenerate requirements.lock for Dependabot bump"
          git push
