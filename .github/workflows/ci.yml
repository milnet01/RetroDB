name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime + audit deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff semgrep pytest

      - name: Ruff (bugs only — E, F, B, S)
        run: ruff check .

      - name: Semgrep (security-audit + python + flask)
        run: |
          semgrep \
            --config p/security-audit \
            --config p/python \
            --config p/flask \
            --error \
            --timeout 60 \
            --metrics=off \
            --exclude logs \
            --exclude data \
            --exclude database \
            --exclude static/images \
            --exclude static/videos \
            .
        continue-on-error: true  # security findings surface as warnings until we drive the actionable count to zero

      - name: Import smoke test
        env:
          RETRODB_DEBUG: "false"
        run: |
          cp config.example.py config.py
          python -c "import app; print('app imports cleanly')"

      - name: Pytest
        run: pytest
