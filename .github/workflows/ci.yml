name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Force Node 24 for all JavaScript actions — checkout@v4, setup-python@v5, etc.
# ship with Node 20 which GitHub deprecates on 2026-09-16. Opting in early keeps
# CI green through the transition without pinning action versions we don't control.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # The single interpreter the run-once / interpreter-independent checks use
  # (semgrep, pip-audit, lockfile-drift, coverage). The lint-and-smoke matrix
  # runs ruff + import-smoke + pytest on every listed interpreter; the dedicated
  # `semgrep` / `pip-audit` / `lockfile-drift` jobs always run on this one.
  PRIMARY_PYTHON: "3.13"

# local-gate.md § 9: the event is in the key, and only a non-default branch
# cancels a superseded run, so a cancelled run on main never hides which
# commit broke.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

# Tag references can be force-pushed under our feet; SHA pins can't.
# Mirrors release.yml. Dependabot's github-actions ecosystem bumps the
# SHA + trailing version comment together. OWASP CICD-SEC-4.
permissions:
  contents: read

# Each job only sets up a machine and calls scripts/ci_local.sh, which holds the
# checks themselves and is also the local pre-push gate. So the two run one list
# and cannot drift apart (tests/test_ci_gate_parity.py pins this). The script
# reads python-version and PRIMARY_PYTHON from this file, and tool versions come
# from requirements.lock and requirements-ci.txt.
jobs:
  # ---------------------------------------------------------------------------
  # lint-and-smoke — per-interpreter ruff + JS syntax + import smoke + pytest.
  # Heavy checks have dedicated jobs below, so the matrix lanes finish faster.
  # ---------------------------------------------------------------------------
  lint-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      # Users on long-term distros (Debian stable, openSUSE Leap) still ship
      # 3.12 — keep it green. 3.14 free-threaded is intentionally excluded:
      # it hurts single-threaded Flask perf 30-50%.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No job here pushes, so the checkout credential is dead weight left
          # in .git/config for every later step to read (zizmor artipacked).
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          # No `cache: pip` — we install via uv (10–30× faster than pip), and
          # uv has its own on-disk cache at ~/.cache/uv handled by the
          # `actions/cache` step below. setup-python's pip-cache layer would
          # never be read by uv anyway.

      # uv cache, keyed on the exact versions. Same versions → instant warm
      # cache, near-zero install time. A version change → cold install (still
      # uv-fast). The `lint-and-smoke-v2` suffix isolates this cache from the
      # dedicated audit-job caches that install a different (much smaller)
      # tool set under the same lockfile hash.
      - name: Restore uv wheels
        id: uv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-lint-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements.lock', 'requirements-ci.txt') }}-v2
          restore-keys: |
            uv-lint-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-ci.txt uv

      - name: Ruff, JS syntax, import smoke, pytest
        env:
          PYTHON_LEG: ${{ matrix.python-version }}
        run: ./scripts/ci_local.sh --job lint-and-smoke --python "$PYTHON_LEG"

      - name: Upload coverage artifact
        if: matrix.python-version == env.PRIMARY_PYTHON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      # local-gate.md § 9: save even when the job fails or times out, so
      # the next run still starts warm.
      - name: Save uv wheels
        if: always() && steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}

  # ---------------------------------------------------------------------------
  # semgrep — security scan of the source tree. Independent of the matrix
  # (result is interpreter-independent). Runs in parallel with lint-and-smoke
  # so the critical path is max(lanes), not sum.
  # ---------------------------------------------------------------------------

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No job here pushes, so the checkout credential is dead weight left
          # in .git/config for every later step to read (zizmor artipacked).
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}

      - name: Restore uv wheels (semgrep)
        id: uv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/uv
          # Tool-only cache: semgrep doesn't read the project lockfile, so only
          # the tool's own pin is in the key.
          key: uv-semgrep-${{ runner.os }}-py${{ env.PRIMARY_PYTHON }}-${{ hashFiles('requirements-ci.txt') }}-v2

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-ci.txt uv

      - name: Semgrep (calibrated via .semgrep-excludes.txt)
        run: ./scripts/ci_local.sh --job semgrep

      # local-gate.md § 9: save even when the job fails or times out, so
      # the next run still starts warm.
      - name: Save uv wheels
        if: always() && steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}

  # ---------------------------------------------------------------------------
  # pip-audit — CVE check against requirements.lock. Also interpreter-
  # independent; runs in parallel.
  # ---------------------------------------------------------------------------

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No job here pushes, so the checkout credential is dead weight left
          # in .git/config for every later step to read (zizmor artipacked).
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}

      - name: Restore uv wheels (pip-audit)
        id: uv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-audit-${{ runner.os }}-py${{ env.PRIMARY_PYTHON }}-${{ hashFiles('requirements-ci.txt') }}-v2

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-ci.txt uv

      - name: pip-audit (CVEs in pinned lockfile)
        run: ./scripts/ci_local.sh --job pip-audit

      # local-gate.md § 9: save even when the job fails or times out, so
      # the next run still starts warm.
      - name: Save uv wheels
        if: always() && steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}

  # ---------------------------------------------------------------------------
  # lockfile-drift — compile round-trip to catch "added a dep to
  # requirements.txt but forgot to recompile the lock".
  # ---------------------------------------------------------------------------

  lockfile-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No job here pushes, so the checkout credential is dead weight left
          # in .git/config for every later step to read (zizmor artipacked).
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}

      - name: Restore uv wheels (lockfile-drift)
        id: uv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-drift-${{ runner.os }}-py${{ env.PRIMARY_PYTHON }}-${{ hashFiles('requirements-ci.txt') }}-v2

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-ci.txt uv

      - name: Lockfile drift check
        run: ./scripts/ci_local.sh --job lockfile-drift

      # local-gate.md § 9: save even when the job fails or times out, so
      # the next run still starts warm.
      - name: Save uv wheels
        if: always() && steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}

  # ---------------------------------------------------------------------------
  # i18n-fresh — the catalog-freshness gate documented in CLAUDE.md step 8.
  # Fails when a t('...')/`_()` string was wrapped but the catalog was not
  # re-extracted, or build_js.py was not re-run after a JS msgid changed. Running
  # it here too means a `git push --no-verify` can't ship stale translations.
  # Interpreter-independent; runs in parallel with the matrix.
  # ---------------------------------------------------------------------------

  i18n-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # No job here pushes, so the checkout credential is dead weight left
          # in .git/config for every later step to read (zizmor artipacked).
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}

      - name: Restore uv wheels (i18n-fresh)
        id: uv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-i18n-${{ runner.os }}-py${{ env.PRIMARY_PYTHON }}-${{ hashFiles('requirements.lock') }}-v2
          restore-keys: |
            uv-i18n-${{ runner.os }}-py${{ env.PRIMARY_PYTHON }}-

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements-ci.txt uv

      - name: i18n freshness gate
        run: ./scripts/ci_local.sh --job i18n-fresh

      # local-gate.md § 9: save even when the job fails or times out, so
      # the next run still starts warm.
      - name: Save uv wheels
        if: always() && steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/uv
          key: ${{ steps.uv-cache.outputs.cache-primary-key }}
