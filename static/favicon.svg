<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff00d4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- dark rounded tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#0a0a12"
        stroke="#1b1b2e" stroke-width="4"/>
  <g filter="url(#glow)" fill="none" stroke="url(#pad)" stroke-width="18"
     stroke-linejoin="round" stroke-linecap="round">
    <!-- gamepad body -->
    <path d="M168 196
             h176
             a68 68 0 0 1 66 84
             l-20 84
             a48 48 0 0 1 -90 8
             l-12 -30
             h-128
             l-12 30
             a48 48 0 0 1 -90 -8
             l-20 -84
             a68 68 0 0 1 66 -84 Z"/>
    <!-- d-pad -->
    <path d="M150 268 h56 M178 240 v56"/>
    <!-- action buttons -->
    <circle cx="330" cy="256" r="13"/>
    <circle cx="372" cy="292" r="13"/>
    <circle cx="330" cy="292" r="13"/>
    <circle cx="372" cy="256" r="13"/>
  </g>
</svg>
