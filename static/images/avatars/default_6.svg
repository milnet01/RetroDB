<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <circle cx="32" cy="32" r="32" fill="#151b24"/>
  <!-- Game Cartridge -->
  <g fill="#4cc9f0">
    <!-- Cart body -->
    <rect x="16" y="14" width="32" height="36" rx="2"/>
    <!-- Top notch (slot grip) -->
    <rect x="24" y="10" width="16" height="6" rx="1"/>
    <!-- Label area -->
    <rect x="20" y="18" width="24" height="18" rx="1" fill="#0a0e17"/>
    <!-- Label decoration -->
    <rect x="24" y="21" width="16" height="3" fill="#4cc9f0" opacity="0.4"/>
    <rect x="24" y="26" width="10" height="2" fill="#4cc9f0" opacity="0.3"/>
    <rect x="24" y="30" width="12" height="2" fill="#4cc9f0" opacity="0.3"/>
    <!-- Bottom pins area -->
    <rect x="22" y="42" width="20" height="6" fill="#0a0e17"/>
    <!-- Pin contacts -->
    <rect x="24" y="43" width="2" height="4" fill="#f59e0b" opacity="0.6"/>
    <rect x="28" y="43" width="2" height="4" fill="#f59e0b" opacity="0.6"/>
    <rect x="32" y="43" width="2" height="4" fill="#f59e0b" opacity="0.6"/>
    <rect x="36" y="43" width="2" height="4" fill="#f59e0b" opacity="0.6"/>
    <!-- Corner notch -->
    <rect x="16" y="14" width="4" height="4" fill="#151b24"/>
  </g>
</svg>
