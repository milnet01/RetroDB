<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <circle cx="32" cy="32" r="32" fill="#151b24"/>
  <!-- Pixel Sword -->
  <g fill="#f59e0b">
    <!-- Blade tip -->
    <rect x="40" y="10" width="4" height="4"/>
    <rect x="36" y="14" width="8" height="4"/>
    <!-- Blade -->
    <rect x="32" y="18" width="8" height="4"/>
    <rect x="28" y="22" width="8" height="4"/>
    <rect x="24" y="26" width="8" height="4"/>
    <!-- Cross-guard -->
    <rect x="16" y="30" width="20" height="4" fill="#e8eaed"/>
    <rect x="14" y="30" width="4" height="4" fill="#9aa0a6"/>
    <rect x="34" y="30" width="4" height="4" fill="#9aa0a6"/>
    <!-- Grip -->
    <rect x="22" y="34" width="4" height="4" fill="#8b5e3c"/>
    <rect x="20" y="38" width="4" height="4" fill="#6d4a30"/>
    <rect x="22" y="38" width="4" height="4" fill="#8b5e3c"/>
    <!-- Pommel -->
    <rect x="18" y="42" width="8" height="4" fill="#f59e0b"/>
    <rect x="16" y="44" width="4" height="4" fill="#f59e0b" opacity="0.7"/>
    <!-- Sparkle -->
    <rect x="44" y="8" width="2" height="2" fill="#fff" opacity="0.8"/>
    <rect x="42" y="6" width="2" height="2" fill="#fff" opacity="0.5"/>
    <rect x="46" y="10" width="2" height="2" fill="#fff" opacity="0.5"/>
  </g>
</svg>
