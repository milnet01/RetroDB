<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <circle cx="32" cy="32" r="32" fill="#151b24"/>
  <!-- Arcade Cabinet -->
  <g fill="#22c55e">
    <!-- Cabinet top -->
    <rect x="20" y="8" width="24" height="6" rx="2"/>
    <!-- Marquee -->
    <rect x="22" y="14" width="20" height="4" fill="#0a0e17"/>
    <rect x="26" y="15" width="12" height="2" fill="#22c55e" opacity="0.6"/>
    <!-- Screen area -->
    <rect x="20" y="18" width="24" height="4"/>
    <rect x="22" y="22" width="20" height="14" fill="#0a0e17"/>
    <!-- Screen content -->
    <rect x="26" y="25" width="4" height="4" fill="#22c55e" opacity="0.8"/>
    <rect x="34" y="27" width="4" height="4" fill="#22c55e" opacity="0.5"/>
    <rect x="30" y="30" width="3" height="3" fill="#22c55e" opacity="0.6"/>
    <!-- Control panel -->
    <rect x="20" y="36" width="24" height="6"/>
    <circle cx="27" cy="39" r="2" fill="#0a0e17"/>
    <rect x="33" y="38" width="4" height="3" rx="1" fill="#0a0e17"/>
    <!-- Base -->
    <rect x="22" y="42" width="20" height="12" rx="1"/>
    <!-- Coin slot -->
    <rect x="30" y="47" width="4" height="2" rx="1" fill="#0a0e17"/>
  </g>
</svg>
