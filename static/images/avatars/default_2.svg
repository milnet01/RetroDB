<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <circle cx="32" cy="32" r="32" fill="#151b24"/>
  <!-- Retro Controller -->
  <g fill="#f72585">
    <!-- Main body -->
    <rect x="14" y="24" width="36" height="16" rx="4"/>
    <!-- Left grip -->
    <rect x="10" y="28" width="8" height="12" rx="3"/>
    <!-- Right grip -->
    <rect x="46" y="28" width="8" height="12" rx="3"/>
    <!-- D-Pad -->
    <rect x="19" y="29" width="3" height="9" fill="#151b24"/>
    <rect x="16" y="32" width="9" height="3" fill="#151b24"/>
    <!-- Buttons -->
    <circle cx="44" cy="30" r="2.5" fill="#151b24"/>
    <circle cx="40" cy="34" r="2.5" fill="#151b24"/>
    <!-- Center buttons -->
    <rect x="29" y="33" width="6" height="2" rx="1" fill="#151b24"/>
  </g>
</svg>
