<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <circle cx="32" cy="32" r="32" fill="#151b24"/>
  <!-- Pixel Ghost -->
  <g fill="#f72585">
    <!-- Top of head -->
    <rect x="24" y="12" width="16" height="4"/>
    <!-- Head sides -->
    <rect x="20" y="16" width="24" height="4"/>
    <rect x="18" y="20" width="28" height="4"/>
    <!-- Eyes row -->
    <rect x="18" y="24" width="28" height="4"/>
    <rect x="22" y="24" width="6" height="6" fill="#fff"/>
    <rect x="36" y="24" width="6" height="6" fill="#fff"/>
    <!-- Pupils -->
    <rect x="24" y="26" width="3" height="3" fill="#151b24"/>
    <rect x="38" y="26" width="3" height="3" fill="#151b24"/>
    <!-- Body -->
    <rect x="18" y="28" width="28" height="4"/>
    <rect x="18" y="32" width="28" height="4"/>
    <rect x="18" y="36" width="28" height="4"/>
    <rect x="18" y="40" width="28" height="4"/>
    <!-- Wavy bottom -->
    <rect x="18" y="44" width="6" height="4"/>
    <rect x="28" y="44" width="8" height="4"/>
    <rect x="40" y="44" width="6" height="4"/>
    <!-- Bottom wave -->
    <rect x="24" y="48" width="4" height="2"/>
    <rect x="36" y="48" width="4" height="2"/>
  </g>
</svg>
