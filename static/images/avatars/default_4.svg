<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <circle cx="32" cy="32" r="32" fill="#151b24"/>
  <!-- Space Invader Alien -->
  <g fill="#a855f7">
    <!-- Top antennas -->
    <rect x="22" y="12" width="4" height="4"/>
    <rect x="38" y="12" width="4" height="4"/>
    <!-- Head row 1 -->
    <rect x="26" y="16" width="12" height="4"/>
    <!-- Head row 2 (full) -->
    <rect x="18" y="20" width="28" height="4"/>
    <!-- Eyes row -->
    <rect x="18" y="24" width="28" height="4"/>
    <rect x="22" y="24" width="4" height="4" fill="#151b24"/>
    <rect x="34" y="24" width="4" height="4" fill="#151b24"/>
    <!-- Body row 1 -->
    <rect x="18" y="28" width="28" height="4"/>
    <!-- Body row 2 - gap pattern -->
    <rect x="22" y="32" width="8" height="4"/>
    <rect x="34" y="32" width="8" height="4"/>
    <!-- Arms/tentacles -->
    <rect x="18" y="36" width="4" height="4"/>
    <rect x="26" y="36" width="4" height="4"/>
    <rect x="34" y="36" width="4" height="4"/>
    <rect x="42" y="36" width="4" height="4"/>
    <!-- Bottom row -->
    <rect x="22" y="40" width="4" height="4"/>
    <rect x="30" y="40" width="4" height="4"/>
    <rect x="38" y="40" width="4" height="4"/>
  </g>
</svg>
