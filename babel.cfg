# Babel extraction mapping (Pass 43.1 foundation; JS bridge added Pass 43.3).
# Regenerate the catalog template with:
#   pybabel extract -F babel.cfg \
#     --ignore-dirs='.* __pycache__ node_modules venv .venv env build dist staging tests' \
#     -o messages.pot .
# --ignore-dirs is MANDATORY: Babel's default directory filter skips '_'-prefixed
# dirs, which would silently drop every templates/_modals, _settings_tabs and
# _macros partial (43.5 bug). The flag REPLACES that filter, so it must re-list
# the junk dirs to skip. Keep it byte-identical to
# scripts/check_i18n_fresh.py::I18N_IGNORE_DIRS.
#
# NOTE: there is deliberately NO [javascript:] mapping. Babel's JS extractor
# mis-parses this codebase's template literals / ES6 and silently drops t('...')
# calls. Instead build_js.py regex-scans the JS sources and writes
# services/js_i18n_strings.py, whose generated _() anchors the [python:] mapping
# below extracts — so JS msgids reach the catalog via the reliable Python
# extractor. See docs/specs/i18n.md §6.
[python: **.py]
[jinja2: **/templates/**.html]
extensions=jinja2.ext.i18n
