# Babel extraction mapping (Pass 43.1 — i18n foundation).
# Regenerate the catalog template with:
#   pybabel extract -F babel.cfg -o messages.pot .
# See docs/specs/i18n.md for the full wrap -> extract -> pseudolocale -> compile
# workflow.
[python: **.py]
[jinja2: **/templates/**.html]
extensions=jinja2.ext.i18n
