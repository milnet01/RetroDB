# RetroDB is not a packaged library — this file only holds tool config.
# Runtime deps live in requirements.txt (user-facing install).
# Pinned versions live in requirements.lock (generated by `pip-compile`).

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "logs",
    "data",
    "database",
    "static/images",
    "static/videos",
    ".ruff_cache",
    "__pycache__",
]

[tool.ruff.lint]
# Audit-friendly default: bug-class rules, skip cosmetic style.
# E = pycodestyle errors, F = pyflakes, B = flake8-bugbear, S = bandit-lite.
select = ["E", "F", "B", "S"]
ignore = [
    # --- cleanup-class rules (not bugs, just tidiness) ---
    "F401",    # unused import — cleanup pass, separate from audit
    "F402",    # import shadowed by loop var — cleanup
    "F541",    # f-string without placeholders — cosmetic
    "F811",    # redefined name — often intentional (late imports)
    "F841",    # unused local — cleanup
    "E401",    # multi-import on one line — cosmetic
    "E402",    # module-level import not at top — late imports break circulars
    "E501",    # line length — soft-enforced, not a bug
    "E701",    # multi-statement one-line — dense config dicts
    "E731",    # lambda assigned to name — style only
    "E741",    # ambiguous var name (l, I, O)
    "B007",    # unused loop variable — cleanup
    "B008",    # function call in default arg — Flask pattern
    "B018",    # useless expression — sometimes a placeholder
    "B905",    # zip without strict — cosmetic
    # --- bandit rules that don't apply to a localhost desktop app ---
    "S101",    # assert — used in test scaffolding
    "S104",    # hardcoded 0.0.0.0 — intentional default for LAN access
    "S110",    # try-except-pass — common in scraper retry/fallback paths
    "S112",    # try-except-continue — same rationale
    "S201",    # Flask debug=True — now gated behind RETRODB_DEBUG env var
    "S301",    # pickle — we don't use it
    "S310",    # urllib.request.urlopen — scraper uses it with validated upstream URLs
    "S311",    # non-crypto random — placeholder shuffles only
    "S324",    # insecure hash (MD5/SHA1) — RetroAchievements + ScreenScraper APIs require these
    "S603",    # subprocess — rom tools with validated paths
    "S606",    # subprocess partial path — bundled helpers (ffmpeg/7z)
    "S607",    # subprocess partial path — same
    "S608",    # hard-coded SQL string — allowlists validated via services.database.safe_column()
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scraper/*" = ["B904"]  # re-raise chaining not needed when logging the original error

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
