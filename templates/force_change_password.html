{% extends "base.html" %}

{% block title %}Change Password - RetroDB{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 80px auto; padding: 0 var(--spacing-lg);">
    <div class="card">
        <h2 class="card-title">Change Default Password</h2>
        <div class="card-body">
            <p style="color: var(--text-secondary); margin-bottom: var(--spacing-lg);">
                You are using the default admin password. For security, you must set a new password before continuing.
            </p>

            <div id="error-message" style="display: none; background: rgba(247, 37, 133, 0.15); border: 1px solid rgba(247, 37, 133, 0.4); border-radius: var(--radius-md); padding: var(--spacing-md); margin-bottom: var(--spacing-lg); color: var(--secondary-magenta);"></div>

            <form id="change-password-form" onsubmit="return handlePasswordChange(event)">
                <div style="margin-bottom: var(--spacing-lg);">
                    <label style="display: block; color: var(--text-secondary); margin-bottom: var(--spacing-sm); font-size: 0.9rem;" for="new_password">New Password</label>
                    <input type="password" id="new_password" class="form-input" style="width: 100%;" required minlength="4" autocomplete="new-password">
                </div>
                <div style="margin-bottom: var(--spacing-lg);">
                    <label style="display: block; color: var(--text-secondary); margin-bottom: var(--spacing-sm); font-size: 0.9rem;" for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" class="form-input" style="width: 100%;" required minlength="4" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Set New Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function handlePasswordChange(e) {
    e.preventDefault();
    const newPw = document.getElementById('new_password').value;
    const confirmPw = document.getElementById('confirm_password').value;
    const errorDiv = document.getElementById('error-message');

    if (newPw !== confirmPw) {
        errorDiv.textContent = 'Passwords do not match.';
        errorDiv.style.display = 'block';
        return false;
    }
    if (newPw.length < 4) {
        errorDiv.textContent = 'Password must be at least 4 characters.';
        errorDiv.style.display = 'block';
        return false;
    }

    fetch('/api/profile/force-change-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({new_password: newPw})
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            window.location.href = '/dashboard';
        } else {
            errorDiv.textContent = data.error || 'Failed to change password.';
            errorDiv.style.display = 'block';
        }
    })
    .catch(() => {
        errorDiv.textContent = 'Network error. Please try again.';
        errorDiv.style.display = 'block';
    });
    return false;
}
</script>
{% endblock %}
