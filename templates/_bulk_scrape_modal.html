<!-- Bulk Scrape Modal - Shared Component -->
<!-- Usage: include '_bulk_scrape_modal.html' in your template -->

<div id="bulkScrapeModal" class="bulk-scrape-modal">
    <div class="bulk-scrape-content glass-panel">
        <div class="bulk-scrape-header">
            <h2><span data-themed-icon="loading"></span> Bulk Scraping</h2>
            <button type="button" class="modal-close-btn" onclick="closeBulkScrapeModal()" id="bulkCloseBtn" style="display: none;">×</button>
        </div>
        <div class="bulk-scrape-body">
            <div class="bulk-progress-info">
                <div class="bulk-progress-text">
                    <span id="bulkCurrentGame">Preparing...</span>
                </div>
                <div class="bulk-progress-numbers">
                    <span id="bulkProgress">0</span> / <span id="bulkTotal">0</span>
                </div>
            </div>
            <div class="bulk-progress-bar">
                <div class="bulk-progress-fill" id="bulkProgressFill"></div>
            </div>
            <div class="bulk-status" id="bulkStatus">
                Initializing...
            </div>
            <!-- Live Results - shown during processing -->
            <div class="bulk-results bulk-results-live" id="bulkResultsLive">
                <div class="bulk-result-item success">
                    <span class="result-icon" data-themed-icon="stat-success"></span>
                    <span>Successful: <strong id="bulkSuccessCountLive">0</strong></span>
                </div>
                <div class="bulk-result-item failed">
                    <span class="result-icon" data-themed-icon="stat-failed"></span>
                    <span>Failed: <strong id="bulkFailedCountLive">0</strong></span>
                </div>
                <div class="bulk-result-item skipped">
                    <span class="result-icon" data-themed-icon="stat-skipped"></span>
                    <span>Skipped: <strong id="bulkSkippedCountLive">0</strong></span>
                </div>
            </div>
            <div class="bulk-controls-row" id="bulkControlsRow">
                <button type="button" class="btn btn-secondary btn-sm" id="bulkBackgroundBtn" onclick="runInBackground()">
                    <span data-themed-icon="background"></span> Background
                </button>
                <button type="button" class="btn btn-warning btn-sm" id="bulkPauseBtn" onclick="toggleBulkPause()">
                    <span id="bulkPauseBtnIcon" data-themed-icon="paused"></span>
                    <span id="bulkPauseBtnText">Pause</span>
                </button>
                <button type="button" class="btn btn-danger btn-sm" id="bulkCancelBtn" onclick="cancelBulkScrape()">
                    <span data-themed-icon="cancel"></span> Cancel
                </button>
            </div>
            <!-- Final Results - shown after completion -->
            <div class="bulk-results" id="bulkResults" style="display: none;">
                <div class="bulk-result-item success">
                    <span class="result-icon" data-themed-icon="stat-success"></span>
                    <span>Successful: <strong id="bulkSuccessCount">0</strong></span>
                </div>
                <div class="bulk-result-item failed">
                    <span class="result-icon" data-themed-icon="stat-failed"></span>
                    <span>Failed: <strong id="bulkFailedCount">0</strong></span>
                </div>
                <div class="bulk-result-item skipped">
                    <span class="result-icon" data-themed-icon="stat-skipped"></span>
                    <span>Skipped: <strong id="bulkSkippedCount">0</strong></span>
                </div>
            </div>
        </div>
        <div class="bulk-scrape-footer" id="bulkFooter" style="display: none;">
            <button type="button" class="btn btn-primary" onclick="closeBulkScrapeModal(); location.reload();">Done</button>
        </div>
    </div>
</div>
