{# Boxart zoom / lightbox — inherits game_detail.html context. #}
<div id="boxartZoomModal" class="modal" role="dialog" aria-modal="true" aria-label="{{ _('Game Cover') }}" data-focus-trap data-focus-trap-content="self" data-focus-trap-onescape="closeBoxartZoom" data-on-click="closeBoxartZoom" data-args='["$event"]'>
    <button type="button" class="modal-close" data-on-click="closeBoxartZoom" data-args='["$event"]' aria-label="{{ _('Close') }}">×</button>
    <img class="modal-content boxart-zoom-image" id="boxartZoomImage" src="" alt="Game Cover">
</div>
