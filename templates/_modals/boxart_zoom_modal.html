{# Boxart zoom / lightbox — inherits game_detail.html context. #}
<div id="boxartZoomModal" class="modal" data-focus-trap data-focus-trap-onescape="closeBoxartZoom" data-on-click="closeBoxartZoom" data-args='["$event"]'>
    <span class="modal-close" data-on-click="closeBoxartZoom" data-args='["$event"]'>×</span>
    <img class="modal-content" id="boxartZoomImage" src="" alt="Game Cover">
</div>
