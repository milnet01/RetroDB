# Pre-commit hooks for RetroDB — the per-COMMIT checks: ruff + gitleaks.
#
# Install with ./scripts/setup-hooks.sh, which also links the pre-push gate
# (.githooks/pre-push). Run manually across the whole tree:
#   pre-commit run --all-files
#
# Ruff config is read from pyproject.toml; gitleaks from .gitleaks.toml.
# Pytest / mypy are intentionally NOT wired into the per-COMMIT stage — too
# slow for an interactive loop. They run in the pre-push gate instead
# (scripts/ci_local.sh, which mirrors .github/workflows/ci.yml).
# ruff-format is intentionally omitted — the repo is not currently
# format-clean and adopting it needs its own reviewable pass.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
