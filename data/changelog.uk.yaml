  body: |
    <ul>
      <li><strong>Шукайте будь-яку гру чи консоль з кожної
        сторінки.</strong> Під вашим ім'ям на бічній панелі тепер є поле
        пошуку. Введіть дві або більше літер, щоб побачити відповідні консолі
        й до восьми відповідних ігор, кожну з її консоллю. Клацніть одну або
        виберіть її клавішами зі стрілками й натисніть Enter, щоб відкрити.
        «Показати всі результати» відкриває Бібліотеку з цим пошуком.
        Натисніть /, щоб перейти до поля, коли сторінка не має власного поля
        пошуку.</li>
      <li><strong>Зручніше користуватися на телефоні чи планшеті.</strong> На
        вузькому екрані панель угорі містить кнопку меню й кнопку пошуку, яка
        відкриває меню з курсором уже в полі пошуку. Панель унизу одним
        дотиком веде до Панелі керування, Бібліотеки, Систем і Досягнень.
        Меню тепер непрозоре, тож сторінка більше не просвічує крізь нього.
        Торкніться поза ним або натисніть Escape, щоб закрити його. У вікнах
        розміру планшета не було кнопки меню, тож меню взагалі не
        відкривалося; тепер вона є. Панелі вкладок і фільтрів, що лишаються на
        екрані під час прокручування, зупиняються одразу під верхньою
        панеллю, а не за нею.</li>
      <li><strong>Налаштування &gt; Емулятори вміщуються на
        телефоні.</strong> Таблиці були ширші за телефон, тож кнопки
        «Редагувати» й «Налаштування» опинялися за межами екрана. На телефоні
        кожен рядок тепер — картка з кнопками всередині.</li>
      <li><strong>Очищення зображень гри більше не залишає зайвих
        файлів.</strong> Якщо ви очищали зображення гри, поки RetroDB ще
        покращував їхню чіткість у фоні, він міг записати їх назад як файли,
        які не використовує жодна гра. Тепер він спершу перевіряє й пропускає
        їх. Лічильник «Покращення зображень» теж одразу прибирає очищену
        гру.</li>
      <li><strong>Назви, які ви вводите, зберігаються під час
        скрапінгу.</strong> Скрапінг, навіть Повторний скрапінг, замінював
        назву, яку ви ввели у вікні редагування, назвою від скрапера. Тепер
        змінена вами назва зберігається. Це показує новий прапорець
        «Зберігати цю назву під час скрапінгу» під назвою; зніміть його, щоб
        скрапери знову могли перейменовувати гру. «Скинути» на сторінці гри
        теж це дозволяє.</li>
      <li><strong>Офіційні назви ваших ігор, перевірені вами.</strong> В
        Інструментах ROM з'явилася нова сторінка «Офіційні назви». Натисніть
        «Запитати ШІ» для однієї системи або для всіх, і ШІ запропонує повну
        офіційну назву кожної гри, під якою її випустили в регіоні її ROM,
        тож японський ROM Mega Man стає Rockman. Ви бачите стару й нову назви
        поруч, позначаєте потрібні й приймаєте їх. Нічого не змінюється, доки
        ви цього не зробите. Стара назва зберігається як альтернативна, а
        прийнята назва зберігається під час скрапінгу. Відхилену назву більше
        не пропонують. Для цього потрібен провайдер ШІ в Налаштування &gt;
        Скрапінг.</li>
      <li><strong>Ігри, датовані лише роком, можна редагувати, і вони
        зберігають свій рік.</strong> Багато ігор датовано лише роком,
        наприклад 1985. На сторінці гри вікно редагування відмовлялося їх
        зберігати. У вікні редагування Бібліотеки збереження такої гри
        стирало її рік. Тепер обидва приймають рік, рік і місяць або повну
        дату.</li>
    </ul>
