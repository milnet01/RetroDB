  body: |
    <ul>
      <li><strong>RetroDB оновлюється сам.</strong> Коли виходить нова
        версія, адміністратори бачать це на Панелі керування та в
        Налаштування &gt; Система &gt; Оновлення разом із переліком нового.
        «Завантажити оновлення» отримує її й перевіряє, що це саме
        опублікований файл; «Встановити й перезапустити» створює резервну
        копію вашої бази даних, ставить нову версію на місце й
        перезапускається. Якщо нова версія не запускається, RetroDB сам
        повертається до старої й пояснює чому. Ваші ігри, налаштування,
        зображення й журнали не змінюються. RetroDB перевіряє оновлення раз
        на день; це можна вимкнути. Копія, запущена з git або менеджером
        процесів, отримує повідомлення про оновлення, але не оновлюється.</li>
      <li><strong>Отримайте RetroArch просто з RetroDB.</strong> У
        Налаштування &gt; Емулятори є новий розділ «Грати в RetroDB».
        Натисніть «Отримати RetroArch», і RetroDB завантажить офіційний
        RetroArch від libretro, перевірить, що завантажено саме очікуваний
        файл, і налаштує його як RetroArch (RetroDB) з власними
        налаштуваннями й збереженнями, окремо від будь-якого RetroArch, яким
        ви вже користуєтеся. Потім він завантажує найкраще ядро для кожної
        системи під час першої гри. Працює в Linux і Windows; macOS ще не
        перевірено.</li>
      <li><strong>Наступний диск працює для ігор, запущених у
        RetroDB.</strong> Для гри на кількох дисках кнопка «Наступний диск»
        тепер досягає власного RetroArch від RetroDB без жодного
        налаштування. RetroArch слухає команди RetroDB лише поки працює така
        гра, а в Windows і macOS — поки працює будь-яка гра.</li>
      <li><strong>Картки ігор вирівнюються на телефоні та після зміни
        розміру вікна.</strong> На телефоні сторінки Бібліотеки й консолей
        показували одну картку, а потім довгий порожній проміжок; тепер
        картки розташовуються одна під одною. Якщо зробити вікно вужчим чи
        ширшим, картки перевпорядковуються, а не лишаються в старих
        стовпцях.</li>
      <li><strong>Отримані скрапером рейтинги й кількість гравців
        точніші.</strong> Вікові рейтинги з IGDB для CERO, USK, GRAC,
        ClassInd і ACB тепер читаються правильно, тож гра з рейтингом CERO Z
        чи USK 18 отримує саме його. TheGamesDB, RAWG, IGDB і ES-DE більше
        не вгадують «1 гравець», коли не знають; імпорт з ES-DE більше не
        перезаписує встановлені вами кількість гравців чи режими гри.
        TheGamesDB більше не зберігає число замість назви видавця чи
        розробника після невдалого пошуку.</li>
      <li><strong>ScreenScraper зберігає свої дані, коли він основне
        джерело.</strong> Його назва, опис, дата, розробник, видавець і
        гравці зберігаються під час кожного скрапінгу, а не лише в перші
        кілька хвилин після пошуку. Завантажені відео й посібники отримують
        правильне ім'я файлу.</li>
      <li><strong>Очищення отриманих даних повертає ім'я файлу як
        назву.</strong> «Clear Scraped Data» очищало дані, але залишало
        отриману скрапером назву.</li>
      <li><strong>Оновлення RetroAchievements для однієї консолі знову
        працює.</strong> Воно щоразу завершувалося помилкою.</li>
      <li><strong>Пошук дублікатів знімків екрана працює в завантаженій
        програмі.</strong> Там він не знаходив жодного знімка, а видалення
        дубліката залишало файл на диску.</li>
      <li><strong>Паролі ScreenScraper приховано, а останній адміністратор
        лишається адміністратором.</strong> Налаштування тепер показують
        ваші паролі ScreenScraper прихованими, як і інші ключі. Єдиний
        обліковий запис адміністратора більше не можна перевести в
        редактори чи вимкнути, бо тоді ніхто не зміг би керувати
        RetroDB.</li>
      <li><strong>Перервані завдання пропонуються лише тим, кому дозволено
        їх запускати.</strong> Банер перерваного завдання на Панелі
        керування тепер показує завдання лише тому, кому дозволено його
        запустити, наприклад масовий скрапінг — лише редакторам і
        адміністраторам. Інші облікові записи більше його не бачать і не
        можуть закрити.</li>
      <li><strong>Імпортовані логотипи консолей, незвичні назви в
        Налаштуваннях і бонусні диски.</strong> У завантаженій програмі
        «Оновити логотипи систем» тепер знаходить логотипи консолей,
        імпортовані з ES-DE, і віддає їм перевагу над вбудованими. Назва
        контролера, консолі чи резервної копії із символами на кшталт &lt;
        або лапок більше не ламає сторінку Налаштувань. Зняття позначки
        бонусного диска повністю від'єднує його, тож він більше не
        вважається бонусним диском своєї колишньої гри.</li>
      <li><strong>Швидші трофеї, імпорт бібліотек та інструменти
        обслуговування.</strong> Сторінка Трофеїв, імпорт бібліотек Steam,
        Xbox і PlayStation, колекційні трофеї, підрахунок місця на диску й
        пошук невикористаних медіафайлів виконують значно менше роботи на
        великій бібліотеці. Спливні вікна прогресу завдань оновлюються й
        тоді, коли сервер зайнятий, а завдання HowLongToBeat і
        альтернативних назв більше не затримують інші зміни під час
        роботи.</li>
      <li><strong>Дізнайтеся, як кожна гра PS3 працює в RPCS3.</strong>
        Ігри PS3 у Бібліотеці, на сторінці PlayStation 3 і на сторінці гри
        показують стан сумісності RPCS3: «Можна грати», «У грі», «Заставка»,
        «Завантажується» або «Не працює» з датою останньої перевірки.
        RetroDB бере його з RPCS3 на вашому комп'ютері, тож у RPCS3 один раз
        виберіть Manage &gt; Databases &gt; Download Compatibility Database
        і повторюйте це, коли захочете новіших результатів. Показано лише
        ігри з ROM на диску; імпортовані ігри — ні. RetroDB тепер також
        читає ідентифікатор гри з PSN і встановлених тек ігор, а також з
        тек і файлів, у назві яких він є, як-от [BLUS30443].</li>
      <li><strong>Дані про продажі ваших ігор.</strong> Коли ШІ заповнює
        прогалини під час скрапінгу і коли ви натискаєте «Заповнення ШІ»,
        його тепер також питають, скільки копій гри продано на її консолі,
        за вільно опублікованими даними, як-от звіти видавця, списки
        бестселерів платформ, Famitsu, Wikipedia і VGChartz. Сторінка гри
        показує це число. Гра без опублікованих даних лишається порожньою,
        а не отримує здогадку.</li>
      <li><strong>Перемикач «Франшиза / серія» працює на сторінці
        гри.</strong> У вікні редагування на сторінці гри клацання
        перемикача «Франшиза / серія» для гри, позначеної «Окремо», нічого
        не робило, тож її не можна було додати до серії. Тепер він
        перемикається, як і перемикач «Доступність на платформах».</li>
      <li><strong>Усі вкладки Досягнень однакової ширини.</strong>
        RetroAchievements, RPCS3, PSN, Steam і Xbox підганяли сторінку під
        власні картки, тож ширина сторінки змінювалася під час переходу між
        вкладками. Тепер у них одна ширина.</li>
      <li><strong>RetroDB знаходить налаштування RPCS3 у Windows і
        macOS.</strong> У Windows RPCS3 зберігає налаштування поруч із
        rpcs3.exe, і RetroDB тепер шукає там і в портативній теці, тож
        налаштування окремих ігор і список сумісності знаходяться.</li>
      <li><strong>Заповнення ШІ працює для ігор з оцінкою, але без
        вікового рейтингу.</strong> Заповнення ШІ могло завершитися
        помилкою для такої гри під час визначення її вікового
        рейтингу.</li>
      <li><strong>Підписи на картках ігор відповідають вашій
        мові.</strong> Стан проходження й підказки до оцінок на картках
        Бібліотеки завжди були англійською.</li>
      <li><strong>Дати випуску для кожного регіону.</strong> Коли ШІ
        заповнює прогалини під час скрапінгу і коли ви натискаєте
        «Заповнення ШІ», його тепер також питають дату виходу гри в кожному
        регіоні, як-от Північна Америка, Європа та Японія. Сторінка гри й
        швидкий перегляд показують їх від найранішої, з датами й назвами
        регіонів вашою мовою. Власна дата випуску гри не змінюється.</li>
      <li><strong>Попередня й наступна гра на сторінці гри.</strong> Поруч
        зі шляхом угорі сторінки гри є посилання «Назад» і «Далі» та
        місце гри в списку. Вони відповідають сторінці, з якої ви прийшли:
        відкриті з Бібліотеки, вони гортають Бібліотеку, а зі сторінки
        консолі — цю консоль, у тому самому порядку й з тими самими
        фільтрами та пошуком, що були там.</li>
      <li><strong>Завантажені обкладинки й знімки екрана обробляються так
        само, як отримані скрапером.</strong> Обкладинка, 3D-коробка чи
        знімок екрана, які ви завантажуєте у вікні редагування, тепер
        зберігаються в тому самому форматі зображень, що й отримані
        скрапером, зменшуються до того самого розміру, а для обкладинок
        створюються менші копії, які використовує Бібліотека. Знімок
        екрана, що виглядає так само, як уже наявний у гри, не додається, і
        вам повідомляють, скільки знімків пропущено. Завантаження нової
        обкладинки також видаляє файл, який вона замінює.</li>
      <li><strong>RetroAchievements показується на сторінці гри для кожної
        гри, яка їх має.</strong> Деякі ігри мали значок RA у Бібліотеці,
        але не мали картки RetroAchievements на своїй сторінці, як-от
        Metroid Prime і Metroid Prime 2 на GameCube. Сторінка тепер
        використовує те саме посилання RetroAchievements, що й значок, і
        завантажується швидше, бо більше не звертається щоразу до
        RetroAchievements.</li>
      <li><strong>Кількість необроблених на сторінці Систем збігається з
        фільтром «Необроблено».</strong> До кількості входили бонусні диски,
        яких список ігор консолі ніколи не показує, тож консоль могла
        показувати 2 необроблені, тоді як її фільтр «Необроблено» не
        показував жодної.</li>
      <li><strong>Сторінки Бібліотеки й систем оновлюються наживо під час
        масового скрапінгу.</strong> Картка кожної гри оновлюється, щойно
        гру оброблено, незалежно від того, чи вікно масового скрапінгу
        відкрите, закрите чи працює у фоні.</li>
      <li><strong>Заповнення ШІ дає кожній грі її офіційну назву.</strong>
        Коли ШІ заповнює прогалини — під час скрапінгу однієї гри, у
        масовому скрапінгу і кнопкою «Заповнення ШІ», — воно також називає
        офіційну назву гри, під якою її випущено в регіоні її ROM, і гру
        перейменовують на неї. Стара назва зберігається як альтернативна.
        Назву, яку ви ввели самі або прийняли в «Офіційних назвах», ніколи
        не буде перейменовано.</li>
      <li><strong>Офіційні назви знову пропонують назви.</strong> З OpenAI,
        а іноді й з Gemini, відповіді ШІ не вдавалося прочитати, тож
        виконання завершувалося без жодної запропонованої назви.</li>
      <li><strong>Джерела шукають лише в системах, які вони
        охоплюють.</strong> RAWG не має ігор Intellivision, тож у ньому
        більше не шукають їх; раніше він знаходив замість них ігри з інших
        платформ. IGDB, TheGamesDB і RAWG тепер завжди шукають у власній
        системі гри. Також виправлено кілька хибних прив'язок платформ RAWG
        (Atari ST, ColecoVision, PC Engine, DOS).</li>
      <li><strong>Кільце прогресу скрапінгу більше не стрибає
        назад.</strong> Після кількох пошуків у вікні «Пошук метаданих» одне
        натискання «Застосувати» запускало скрапінг кілька разів, і кільце
        стрибало між ними.</li>
      <li><strong>За збільшеною 3D-коробкою більше немає
        квадрата.</strong> Коробка лежить просто на затемненому тлі.</li>
      <li><strong>Повідомлення більше не показують HTML-код.</strong> Деякі
        вікна підтвердження й результатів в Інструментах ROM показували
        теги на кшталт &lt;br&gt; замість розривів рядків. Перегляд журналу
        й вибір батьківської гри для бонусного диска в Налаштуваннях знову
        працюють.</li>
    </ul>
