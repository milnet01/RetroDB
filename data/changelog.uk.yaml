    label: Майстер налаштування показує, на якому ви кроці і які кроки необов'язкові
  - type: feature
    label: Фільтруйте Бібліотеку за кількома жанрами, серіями чи видавцями одночасно
  body: |
    <ul>
      <li><strong>RetroDB готовий до власного ігрового плеєра.</strong> Для
        RetroDB створюється плеєр на основі RetroArch. Коли він з'явиться,
        RetroDB запускатиме в ньому ігри з налаштуваннями, дібраними для
        кожної гри, і зберігатиме налаштування, які ви змінюєте під час гри.
        Свої збереження й налаштування він триматиме у власній теці, окремо
        від вашого RetroArch. Він вибирає найкраще ядро для кожної консолі й
        завантажує його, коли ви вперше натискаєте «Грати»; тим часом на
        кнопці написано «Завантаження ядра…». Він запускає ігри для будь-якої
        консолі, що не має робочого емулятора, і ніколи не замінює емулятор,
        який ви налаштували. Для кожної гри можна вибрати інше ядро, екранний
        ефект, цілочисельне масштабування та зменшення затримки введення.
        Адміністратори можуть установити чи оновити всі ядра одразу або
        вимкнути завантаження. Доки плеєр не встановлено, нічого не
        змінюється; до того його немає в списку в Налаштування &gt;
        Емулятори.</li>
      <li><strong>Вкладки Музею знову перемикаються.</strong> Починаючи з
        версії 3.30.0, на сторінці консолі в Музеї натискання
        «Характеристики», «Топ-10 ігор» або «Контролери» нічого не робило й
        показувало повідомлення «Неочікувана помилка». Тепер відкривається
        кожна вкладка.</li>
      <li><strong>Ігри для PlayStation 3, збережені як тека, можна
        запустити.</strong> Дискова гра для PS3 зазвичай є текою, назва якої
        закінчується на «.PS3». RetroDB відмовлявся її запускати й не
        показував кнопку «Грати», бо очікував один файл. Тепер він передає
        емулятору теку, як того очікує RPCS3.</li>
      <li><strong>Стовпці «Пошуку метаданих» вирівняні, і він вміщується на
        телефоні.</strong> Джерело, що мало більше результатів, ніж
        вміщувалося, отримувало смугу прокрутки. Вона звужувала назви, тож та
        сама назва переносилася в одному стовпці й не переносилася в
        сусідньому. Тепер кожен стовпець має однакову ширину й тонку смугу
        прокрутки в кольорах теми. На телефоні чи у вузькому вікні вікно
        пошуку стискалося поруч із прихованою бічною панеллю; тепер воно
        заповнює весь екран.</li>
      <li><strong>Нове встановлення на Windows або Mac правильно називає ядра
        RetroArch.</strong> RetroDB усюди налаштовував RetroArch з іменами
        файлів ядер для Linux, тож на Windows і macOS жодне ядро не
        знаходилося. Нове встановлення тепер використовує імена, прийняті на
        кожному комп'ютері. Наявне встановлення зберігає свої імена; змініть
        їх у таблиці відповідностей.</li>
      <li><strong>Переглядач знімків екрана показує обидві стрілки, кожну
        всередині її кнопки.</strong> Бічна панель закривала ліву стрілку, тож
        повернутися до попереднього знімка мишею було неможливо. Права
        стрілка до того ж була нижче своєї кнопки. Тепер видно обидві, по
        центру своїх кнопок.</li>
      <li><strong>Сторінка налаштувань «Емулятори» показується вашою
        мовою.</strong> Більша частина Налаштування &gt; Емулятори була
        англійською, яку б мову ви не вибрали: заголовки, таблиця емуляторів,
        результати сканування та вікно «Редагувати емулятор». Тепер усе це
        перекладено.</li>
      <li><strong>Поле «Гравці» приймає більше ніж 16.</strong> Обидва вікна
        редагування зупинялися на 16, тож не можна було ввести 256 гравців
        MAG. Гру, якій скрапер указав більше ніж 16, взагалі не можна було
        зберегти, доки ви не зменшували число. Тепер верхньої межі немає.</li>
      <li><strong>«Заповнення ШІ» дає іграм для ПК тип збереження для ПК, а не
        для консолі.</strong> Гра для Windows могла отримати «Карта пам'яті»,
        бо ШІ описував її версію для PlayStation 2. Тепер ШІ просять
        описувати випуск для платформи вашої гри. ПК, а також консолі,
        починаючи з PlayStation 3 і Xbox 360, зберігають у «Внутрішню
        пам'ять».</li>
      <li>Щоб виправити гру, яка вже має неправильний тип збереження, знову
        виконайте для неї скрапінг або запустіть «Заповнення ШІ». Обидва
        способи знову питають ШІ й замінюють старе значення.</li>
      <li><strong>Підключення PlayStation спершу просить увійти.</strong> У
        Налаштування &gt; Обліковий запис &gt; PSN сторінка облікового запису
        Sony показувала лише «Invalid login», якщо ви ще не ввійшли в
        PlayStation, а в кроках про це не було сказано. Тепер крок 1 має
        кнопку «Увійти в PlayStation», яку треба натиснути першою.</li>
      <li><strong>Сортуйте Бібліотеку й показуйте лише необроблені
        ігри.</strong> Бібліотека та сторінка кожної системи мають меню
        «Сортувати за» поруч із лічильником ігор: назва, спершу новіші чи
        старіші за датою виходу, оцінка критиків, оцінка гравців або
        нещодавно додані. Ігри без дати чи оцінки йдуть останніми. Панель
        A–Z працює під час сортування за назвою, а в інших випадках
        неактивна. Нова кнопка «Необроблено» показує лише ті ігри, які ще не
        заповнив жоден скрапер.</li>
      <li><strong>Фільтр без збігів так і повідомляє.</strong> Раніше сторінка
        ставала порожньою. Тепер на ній написано, що жодна гра не підходить,
        і є кнопка, щоб очистити фільтри.</li>
      <li><strong>Панель фільтрів Бібліотеки тримає все на своїх
        місцях.</strong> Раніше натискання «Вибрати», фільтрування чи
        сортування зсували ігри вниз сторінкою. Тепер інструменти вибору
        з'являються на панелі вздовж нижнього краю вікна. Кнопка «Очистити»
        є завжди й неактивна, доки не ввімкнено фільтр. Активні фільтри
        показуються поруч із лічильником ігор. «Показати бонуси» тепер
        називається «Бонусні диски» й підсвічується, коли ввімкнено. На
        телефоні кнопки фільтрів відкриваються поверх сторінки з однієї
        кнопки «Фільтри».</li>
      <li><strong>Порожня бібліотека показує привітання з кнопкою
        сканування.</strong> Раніше нове встановлення показувало оцінку
        стану, що застигла на 0%, і порожню Бібліотеку. Тепер обидві
        сторінки кажуть, що бібліотека порожня, і пропонують кнопку
        «Сканувати бібліотеку». Панель керування також дає посилання на
        налаштування теки ROM. Користувачам, які не є адміністраторами,
        радять звернутися до адміністратора. «Випадкова гра» прихована, доки
        немає з чого вибирати.</li>
      <li><strong>«Сканувати бібліотеку» працює зі сторінки «Системи» та з
        Налаштувань.</strong> Ці дві кнопки «Сканувати бібліотеку» нічого не
        робили після натискання. Працювала лише кнопка на Панелі керування.
        Тепер сама кнопка «Сканувати бібліотеку» на Панелі керування видна
        лише адміністраторам: тільки їм дозволено сканувати.</li>
      <li><strong>Майстер налаштування показує, на якому ви кроці і які кроки
        необов'язкові.</strong> Він пише «Крок 3 з 6», нумерує кожен крок,
        позначає галочкою пройдені та позначає ES-DE і «Ключі API» як
        необов'язкові. На телефоні він показує номери й назву поточного
        кроку.</li>
      <li><strong>Фільтруйте Бібліотеку за кількома жанрами, серіями чи
        видавцями одночасно.</strong> У фільтрах «Жанр», «Серія», «Видавець»,
        «Розробник», «Режим гри», «Перспектива» та «Вимір» позначте скільки
        завгодно значень і натисніть «Застосувати»: гра показується, якщо
        має будь-яке з них. Перемкніть вікно на «НЕ Є», щоб приховати ігри,
        які мають будь-яке з позначених значень. Кожне значення отримує свій
        тег, і його ✕ прибирає лише це значення.</li>
    </ul>
