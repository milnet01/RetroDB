  body: |
    <ul>
      <li><strong>Чити для RetroArch (RetroDB), DuckStation і
        PCSX2.</strong> У розділі Налаштування &gt; Емулятори з'явився новий
        розділ «Чити». Завантажте там безкоштовні загальнодоступні пакети
        читів або імпортуйте теки з читами, які у вас уже є; RetroDB
        копіює файли й ніколи не змінює вашу теку. Тоді сторінка гри
        показує її чити, кожен із перемикачем «увімк./вимк.», а коли їх
        багато &mdash; ще й поле пошуку. У RetroArch (RetroDB) чити, які ви
        ввімкнули, застосуються, коли ви наступного разу натиснете «Грати»,
        а зміни, зроблені в меню RetroArch під час гри, зберігаються. Для
        DuckStation і PCSX2 перемикачі зберігаються у власних налаштуваннях
        емулятора для цієї гри, тож зміни, зроблені в самому емуляторі,
        теж видно на сторінці. RetroDB ніколи не перезаписує файл читів,
        який емулятор уже має. Увімкнений чит призупиняє режим хардкор
        RetroAchievements.</li>
      <li><strong>Імпорт 3D-коробки Slipcase до гри.</strong> На сторінці
        гри під обкладинкою є кнопка «Імпортувати 3D-коробку». Виберіть
        файл <code>.box.json</code>, збережений Slipcase, разом із його
        зображеннями, і RetroDB збереже для цієї гри передню, бічну, задню
        та інші грані коробки. Slipcase 1.4.0 або новіший зберігає цей файл поруч із кожним експортованим зображенням. Ваше зображення обкладинки 3D не
        змінюється. Якщо гра вже має грані, RetroDB спершу запитає, чи
        замінити їх, а «Видалити» їх видаляє.</li>
      <li><strong>Обертайте 3D-коробку гри, наче в руках.</strong> Натисніть
        на обкладинку гри з імпортованою коробкою Slipcase, і коробка
        з'явиться в 3D. Перетягніть її або скористайтеся клавішами зі
        стрілками, щоб обернути й побачити бік, зворот, верх і низ.
        Прокрутіть або натисніть + і -, щоб масштабувати; двічі клацніть
        або натисніть Home, щоб повернути її на місце. Гра без імпортованої
        коробки, як і раніше, збільшує своє зображення обкладинки.</li>
      <li><strong>Налаштування містять посилання на сторінку
        Емуляторів.</strong> На сторінку Емуляторів ніде в Налаштуваннях не
        було посилання, тож потрапити на неї можна було, лише ввівши її
        адресу. Тепер адміністратори бачать вкладку «Емулятори» після
        «Система», а сторінка Емуляторів показує ту саму панель вкладок,
        тож інші вкладки за один клік.</li>
      <li><strong>Збільшена обкладинка більше не ховається за
        меню.</strong> На телефоні верхня й нижня панелі лежали поверх
        збільшеної обкладинки та ховали її кнопку закриття, а на комп'ютері
        бічна панель закривала її ліву частину. Тепер збільшення
        відкривається поверх усього.</li>
      <li><strong>Моделі Claude 5.5 для ШІ.</strong> Налаштування &gt; Скрапінг показує найновіші моделі Claude від Anthropic: Haiku 5.5 — нову типову і найдешевшу, Sonnet 5.5 та Opus 5.5, з поточними цінами. RetroDB більше не надсилає параметр, який Sonnet 5.5 відхиляє.</li>
      <li><strong>Продажі гри можна ввести вручну.</strong> В обох вікнах редагування під полем «Розробник» є поле «Продано копій». Введене число показується на сторінці гри, як і знайдене ШІ. Очистьте поле, щоб прибрати його.</li>
      <li><strong>Перевірка ключа ШІ в налаштуваннях.</strong> У розділі Налаштування &gt; Скрапінг під постачальником ШІ є кнопка «Перевірити збережений ключ ШІ». Вона показує, чи працює ключ, а якщо ні — чому: ключ відхилено, немає коштів або досягнуто ліміту. Раніше відхилений ключ виглядав робочим.</li>
      <li><strong>Claude може шукати в інтернеті дані про продажі.</strong> У розділі Налаштування &gt; Скрапінг під моделлю Claude є перемикач «Дозволити Claude шукати в інтернеті», спершу вимкнений. Без пошуку Claude відповідає з того, що вже знає, і залишає поле «Продано копій» порожнім. Якщо перемикач увімкнено, Claude знаходить цифри. Anthropic бере плату за кожен пошук, тож Заповнення ШІ робить не більше 5 пошуків на гру, до 5 центів США; вимкніть перемикач перед великим масовим скрапінгом.</li>
      <li><strong>Заповнення ШІ для цілої системи одразу.</strong> В Інструментах ROM з’явилася сторінка Масове заповнення ШІ, на якій також є Офіційні назви. Виберіть систему або «Усі системи», увімкніть потрібні поля й натисніть «Заповнити з ШІ»: RetroDB запускає Заповнення ШІ для кожної гри, так само як кнопка Заповнення ШІ на сторінці гри, і одразу зберігає відповіді в грі. Індикатор виконання та сповіщення Заповнення ШІ показують, як далеко просунулася робота, а поки вона триває, сторінку можна залишити. Перед запуском RetroDB показує, скільки ігор буде заповнено, і питає підтвердження, адже ваш постачальник ШІ бере плату за кожну гру. Ігри, які вже пройшли Заповнення ШІ, пропускаються, доки ви не ввімкнете їх назад, а запуск сам зупиняється, якщо ШІ перестає відповідати.</li>
      <li><strong>Сповіщення про завдання беруть кольори вашої теми.</strong> Вікна, що показують виконуване завдання, наприклад Масовий скрапінг і RA Sync, та індикатори виконання тепер використовують кольори вибраної теми. Завдання, яке не можна призупинити, більше не показує заголовок кольором паузи.</li>
      <li><strong>Сторінка «Емулятори» має вигляд як інші вкладки налаштувань.</strong> Налаштування &gt; Емулятори тепер поділено на картки, а смуга під вкладками переходить до кожної з них: RetroArch, Грати в RetroDB, Ядра, Чити, Теки, Емулятори та Прив'язка. Смуга лишається вгорі під час прокручування й позначає розділ, у якому ви перебуваєте.</li>
      <li><strong>Поступ завантаження біля кнопки.</strong> Коли ви завантажуєте RetroArch, ядра плеєра або пакет читів, примітка біля кнопки показує у відсотках, наскільки просунулося завантаження. Раніше під кнопками з'являвся рядок і зсував решту сторінки вниз.</li>
      <li><strong>Вибір емулятора для кожної системи зі списку.</strong> Прив'язка до систем у розділі Налаштування &gt; Емулятори тепер показує кожну систему один раз, зі списком пов'язаних із нею емуляторів. Вибраний емулятор кнопка «Грати» використовує для ігор цієї системи, якщо гра не задає власний. Емулятор, який RetroDB не може знайти, позначено як «не знайдено». Раніше кожна система мала окремий рядок для кожного емулятора, з маленькою крапкою для вибору типового. Власний RetroArch від RetroDB тепер є у списку кожної вказаної системи, яку він може запускати, зокрема систем, де ще немає ігор.</li>
      <li><strong>Кнопка «Огляд» біля кожного поля шляху.</strong> Адміністратори тепер можуть вибрати теку або програму, переходячи теками комп'ютера, замість того щоб вводити шлях: Налаштування &gt; Емулятори, Бібліотека, Скрапінг і Обліковий запис, а також налаштування розділу «Інструменти ROM». Поля, де потрібна програма, показують і файли. Приховані теки, як-от <code>.config</code>, йдуть наприкінці списку.</li>
      <li><strong>Лівий стік працює як D-Pad у RetroArch від RetroDB.</strong> В іграх для систем без стіка, таких як NES або Mega Drive, тепер можна рухатися і лівим стіком, і D-Pad. Коли ядро емулятора гри саме зчитує стік, як на Nintendo 64, стік залишається справжнім стіком.</li>
      <li><strong>Вхід у RetroAchievements із налаштувань.</strong> Налаштування &gt; Обліковий запис тепер дає змогу ввійти для RetroArch від RetroDB, тож досягнення відкриваються під час гри без входу всередині емулятора. Пароль передається лише RetroAchievements і не зберігається. Кожен користувач RetroDB має власний вхід і власний перемикач Режиму хардкор, який спочатку вимкнений. DuckStation і PCSX2 і далі входять через власні меню.</li>
      <li><strong>Видно, який емулятор використає «Грати».</strong> На сторінці гри біля кнопки «Грати» тепер вказано «Запускається в:» і назву емулятора або повідомляється, що емулятор не налаштовано.</li>
      <li><strong>Панель «Чити» пояснює, чому гра не має читів.</strong> Якщо емулятор гри не може використовувати чити, панель тепер називає причину, а не залишається прихованою.</li>
      <li><strong>Довгі шляхи до тек вміщуються на екрані телефона.</strong> Довгий шлях до теки в налаштуваннях більше не змушує сторінку прокручуватися вбік.</li>
    </ul>
