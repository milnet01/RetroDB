- version: 3.21.0
  date: 2026-07-05
  tags:
  - type: feature
    label: Запуск одним кліком — запускайте RetroDB із закріпленого значка, без терміналу
  - type: feature
    label: Справжня іконка застосунку — неоновий геймпад у вкладці браузера та на панелі задач
  - type: feature
    label: Нова кнопка «Вимкнути сервер» на сторінці Налаштувань
  body: |
    <ul>
      <li><strong>Запуск одним кліком.</strong> Тепер RetroDB має повноцінний
        засіб запуску, який можна закріпити на панелі задач &mdash; клацніть
        його, і застосунок запуститься (якщо він ще не працює) та автоматично
        відкриється у вашому браузері. Більше не потрібно відкривати термінал і
        вводити команду. У Linux один раз виконайте
        <code>python3 scripts/install_launcher.py</code>, щоб додати
        &ldquo;RetroDB&rdquo; до меню застосунків, а потім закріпіть його.</li>
      <li><strong>Справжня іконка застосунку.</strong> Тепер RetroDB має іконку
        неонового геймпада &mdash; кіберпанковий блакитний і пурпуровий на темній
        плитці &mdash; у вкладці браузера (favicon), на засобі запуску панелі
        задач і на самій програмі Windows. Вона замінює простий
        емодзі-заповнювач.</li>
      <li><strong>Кнопка «Вимкнути сервер».</strong> У розділі «Керування
        сервером» на сторінці Налаштувань тепер є червона кнопка
        <strong>Вимкнути сервер</strong> поруч із «Перезапустити». Вона коректно
        зупиняє застосунок (спершу дозволяючи всім запущеним завданням завершити
        збереження), тож більше не потрібно перемикатися на термінал і натискати
        Ctrl+C.</li>
      <li><strong>Завантажувані збірки відкривають браузер за вас.</strong>
        Готові до запуску завантаження для Windows, Mac і Linux тепер відкривають
        ваш браузер за мить після запуску, тож застосунок опиняється перед вами
        без жодного додаткового кроку.</li>
    </ul>
- version: 3.20.0
  date: 2026-07-05
  tags:
  - type: feature
    label: Одинадцять нових мов — RetroDB тепер розмовляє 21 мовою
  body: |
    <ul>
      <li><strong>Одинадцять нових мовних пакетів.</strong> Інтерфейс
        RetroDB, нотатки про випуски та посібник довідки тепер перекладені
        на <strong>Afrikaans, isiZulu, isiXhosa, Dutch, Norwegian
        (Bokm&aring;l), Russian, Polish, Turkish, Ukrainian, Indonesian
        та Hebrew</strong> &mdash; на додачу до вже наявних German, Spanish,
        French, Italian, Japanese, Korean, Brazilian Portuguese та Simplified
        &amp; Traditional Chinese. Оберіть свою мову в розділі Налаштування
        &rarr; Параметри відображення &rarr; Мова; застосунок
        перезавантажиться обраною мовою.</li>
      <li>Кожна мова охоплює весь застосунок цілком: кожну кнопку, підпис і
        повідомлення, повну історію нотаток про випуски та повний посібник
        довідки.</li>
      <li><strong>isiZulu &amp; isiXhosa</strong> також включені. Оскільки
        ці мови мають небагато усталеної технічної лексики, деякі терміни
        (ROM, scraper, box art) залишені англійською там, де немає
        природного відповідника &mdash; перш ніж покладатися на ці
        переклади, варто перевірити їх носієм мови.</li>
      <li><strong>Hebrew</strong> постачається з повністю перекладеним
        текстом; доопрацьоване розташування сторінки справа наліво (щоб
        інтерфейс правильно віддзеркалювався) з'явиться в одному з наступних
        оновлень. Arabic приєднається, щойно ця робота над розташуванням
        буде завершена.</li>
    </ul>
- version: 3.19.1
  date: 2026-07-05
  tags:
  - type: performance
    label: Швидший скрапінг — скриншоти гри тепер завантажуються одночасно
  body: |
    <ul>
      <li><strong>Скриншоти завантажуються паралельно.</strong> За тим самим
        підходом, що й у популярному фронтенді ES-DE (який отримує всі
        медіафайли гри одночасно), RetroDB тепер завантажує скриншоти гри
        <strong>одночасно</strong>, а не один за одним, для кожного джерела
        (TheGamesDB, IGDB, RAWG, ScreenScraper). Ігри з кількома скриншотами
        завершуються помітно швидше.</li>
      <li>Перевірка на дублікати скриншотів, як і раніше, виконується після
        цього по черзі, тож точність видалення дублікатів зображень
        залишається такою самою, як і раніше &mdash; прискорилося лише саме
        завантаження. Завантаження обмежені чотирма одночасно, щоб жодне
        джерело не перевантажувалося.</li>
      <li>Покращення швидкості "під капотом"; набуває чинності після
        наступного перезапуску.</li>
    </ul>
- version: 3.19.0
  date: 2026-07-05
  tags:
  - type: performance
    label: Швидший скрапінг — джерела тепер опитуються одночасно
  body: |
    <ul>
      <li><strong>Скрапінг став швидшим для кожної гри.</strong> Коли
        RetroDB шукає гру, він перевіряє кілька баз даних (ES-DE, TheGamesDB,
        IGDB, RAWG, ScreenScraper). Раніше він опитував їх <em>по одній</em>
        і чекав на відповідь кожної, перш ніж звернутися до наступної
        &mdash; тож час очікування дорівнював сумі всіх запитів. Тепер він
        опитує їх усі <strong>одночасно</strong> і чекає лише на
        найповільнішу, що дає помітне прискорення для кожної гри. Результати,
        як і раніше, впорядковуються та оцінюються так само, як і до
        цього.</li>
      <li><strong>Менше зайвих з'єднань при завантаженні артів.</strong>
        Завантаження зображень тепер повторно використовують уже відкрите
        з'єднання замість того, щоб відкривати нове для кожного окремого
        зображення, що заощаджує час для ігор із великою кількістю
        скриншотів.</li>
      <li>Це вдосконалення швидкості "під капотом" &mdash; у тому, як ви
        користуєтеся RetroDB, нічого не змінюється, і навантаження на бази
        даних не зростає (ті самі запити, просто виконуються паралельно).
        Набуває чинності після наступного перезапуску.</li>
    </ul>
- version: 3.18.0
  date: 2026-07-05
  tags:
  - type: feature
    label: Додано китайські (Китай) вікові рейтинги як 9-ту систему класифікації
  body: |
    <ul>
      <li><strong>Нова система вікових рейтингів: Китай (CADPA).</strong>
        RetroDB тепер підтримує офіційну китайську схему вікових рекомендацій
        для ігор (&ldquo;网络游戏适龄提示&rdquo;, видану CADPA) поряд з
        наявними вісьмома системами (ESRB, PEGI, CERO, USK, ACB, FPB, GRAC і
        ClassInd). Вона використовує три рівні &mdash; <strong>8+</strong>,
        <strong>12+</strong> і <strong>16+</strong> &mdash; що
        відображаються простим зеленим значком.</li>
      <li><strong>Заповнюється сам, як і інші.</strong> Якщо гра вже має
        рейтинг з будь-якої іншої країни, RetroDB автоматично визначає
        відповідний китайський рівень (і навпаки). Ви також можете обрати чи
        змінити його вручну на екрані редагування гри та вибрати його як
        бажану систему відображення в розділі Налаштування &rarr;
        Бібліотека. Примітка: більшість західних баз даних ігор не
        публікують китайський рейтинг, тож для ігор без жодного рейтингу він
        визначається на основі вмісту гри під час скрапінгу / AI Fill.</li>
      <li>Зелені значки &mdash; це власна проста графіка RetroDB (що
        відповідає стилю інших систем), а не офіційний логотип CADPA, тож
        жодних обмежень щодо ліцензування зображень немає.</li>
    </ul>
- version: 3.17.0
  date: 2026-07-04
  tags:
  - type: feature
    label: Очищення записів бази даних для медіафайлів, яких немає на диску
  - type: security
    label: Захист від видалення всіх зображень бібліотеки, якщо папка з медіафайлами зникає
  body: |
    <ul>
      <li><strong>Новий інструмент обслуговування: &ldquo;Відсутні посилання
        на медіафайли&rdquo;</strong> (Налаштування &rarr; Система &rarr;
        Обслуговування). Це дзеркальне відображення наявного очищення
        &ldquo;Осиротілі медіафайли&rdquo;: замість пошуку зайвих файлів
        зображень без гри, він знаходить ігри, у яких обкладинка,
        3D-обкладинка, скриншоти, фан-арт, відео чи мануал вказують на
        файли, яких більше немає на диску. Виконайте пошук, а потім очистіть
        застарілі посилання одним клацанням, щоб скрапери могли завантажити
        арт знову. Самі записи ігор ніколи не змінюються.</li>
      <li><strong>Безпечніше автоматичне очищення під час скрапінгу.</strong>
        Коли RetroDB повторно скрапить гру, він непомітно очищує посилання
        на медіафайли, що зникли з диска. Раніше, якщо ціла папка з
        медіафайлами зникала одразу &mdash; наприклад, через відключення
        зовнішнього диска чи масове видалення &mdash; це очищення могло
        стерти інформацію про арт для тисяч ігор, змушуючи виконувати дорогі
        повторні скрапінги. Тепер RetroDB розпізнає цей сигнал: якщо папка з
        медіафайлами відсутня або повністю порожня, він зберігає посилання
        та записує попередження в журнал замість їх видалення. Новий
        інструмент обслуговування застосовує той самий захист і чітко
        позначає будь-яку папку, яку він зберіг.</li>
    </ul>
- version: 3.16.0
  date: 2026-07-04
  tags:
  - type: feature
    label: Нова панель "Швидкі виправлення" на панелі приладів
  body: |
    <ul>
      <li><strong>Нова панель &ldquo;Швидкі виправлення&rdquo; на панелі
        приладів</strong> перетворює розрізнені завдання з обслуговування
        бібліотеки на список справ, який видно одразу. Вона показує, скільки
        ігор досі не мають обкладинки, і надає ярлики в один клік для пошуку
        дублікатів ROM та перевірки непрацюючих шляхів ROM (ігор, файли яких
        було переміщено чи видалено). Кожен ярлик веде безпосередньо на
        сторінку, де можна це виправити. Панель з'являється, щойно у вашій
        бібліотеці з'являються ігри.</li>
    </ul>
- version: 3.15.0
  date: 2026-07-03
  tags:
  - type: accessibility
    label: Програми зчитування з екрана тепер озвучують прогрес виконання завдань
  body: |
    <ul>
      <li><strong>Тривалі завдання тепер озвучують свій прогрес для програм
        зчитування з екрана.</strong> Під час масового скрапінгу,
        синхронізації досягнень (RetroAchievements чи PlayStation) або зміни
        розміру зображень користувачі програм зчитування з екрана раніше не
        чули нічого між &ldquo;розпочато&rdquo; і &ldquo;завершено&rdquo;.
        Тепер RetroDB озвучує періодичні етапи (наприклад, &ldquo;Масовий
        скрапінг: 12 з 40&rdquo;) та голосове повідомлення про завершення
        &mdash; без жодних додаткових спливаючих вікон на екрані. Оголошення
        розподілені в часі так, щоб інформувати, не набридаючи, і
        відповідають обраній вами мові.</li>
    </ul>
- version: 3.14.0
  date: 2026-07-01
  tags:
  - type: feature
    label: Нові мови — китайська (спрощена та традиційна) тепер доступна
  body: |
    <ul>
      <li><strong>RetroDB тепер доступний китайською мовою.</strong> Два
        варіанти розташовані в розділі <strong>Налаштування &rarr; Система
        &rarr; Мова</strong>: <strong>中文 (简体)</strong> (спрощена, для
        материкового Китаю) і <strong>中文 (繁體)</strong> (традиційна, для
        Гонконгу та Тайваню). Весь інтерфейс &mdash; меню, кнопки,
        повідомлення та вбудований посібник довідки &mdash; перекладено, а
        все, що ще не перекладено, непомітно повертається до англійської. Це
        доводить кількість підтримуваних мов до десяти (англійська, німецька,
        іспанська, французька, італійська, японська, бразильська
        португальська, корейська, а тепер і спрощена та традиційна
        китайська).</li>
    </ul>
- version: 3.12.0
  date: 2026-06-30
  tags:
  - type: feature
    label: Нова мова — корейська (한국어) тепер доступна
  body: |
    <ul>
      <li><strong>RetroDB тепер доступний корейською мовою (한국어).</strong>
        Виберіть її в розділі Налаштування &rarr; Система &rarr; Мова. Весь
        інтерфейс &mdash; меню, кнопки, повідомлення та вбудований посібник
        довідки &mdash; перекладено, що доводить кількість підтримуваних мов
        до восьми (англійська, німецька, іспанська, французька, італійська,
        японська, бразильська португальська та корейська). Корейська
        завершує покриття для кожної системи вікових рейтингів ігор, яку
        відображає RetroDB, включно з південнокорейською GRAC.</li>
    </ul>
- version: 3.11.0
  date: 2026-06-30
  tags:
  - type: enhancement
    label: Підтримайте RetroDB на Patreon — додано нове посилання для пожертв
  body: |
    <ul>
      <li><strong>Тепер ви можете підтримати RetroDB на Patreon.</strong>
        Посилання на Patreon розташоване поруч із наявною кнопкою
        &ldquo;Стати спонсором на GitHub&rdquo; у розділі
        <strong>Налаштування &rarr; Система &rarr; Підтримати
        розробку</strong>, на панелі "Про програму" та у файлі README
        проєкту. RetroDB залишається повністю безкоштовним і з відкритим
        кодом &mdash; пожертви абсолютно необов'язкові й просто допомагають
        підтримувати розробку одним розробником.</li>
    </ul>
- version: 3.10.0
  date: 2026-06-26
  tags:
  - type: enhancement
    label: Журнал змін тепер завантажується швидше завдяки кнопці "Завантажити ще"
  body: |
    <ul>
      <li><strong>Сторінка журналу змін тепер відкривається набагато
        швидше.</strong> Замість того, щоб щоразу відображати всю історію
        випусків (сотні записів), RetroDB тепер показує 20 останніх записів
        і додає кнопку <strong>Завантажити ще</strong> внизу. Натисніть на
        неї, щоб показати наступну партію, і так далі &mdash; старіша
        історія все ще там, вона просто завантажується за потреби, а не
        сповільнює перше відображення.</li>
    </ul>
- version: 3.9.0
  date: 2026-06-17
  tags:
  - type: feature
    label: Посібник довідки та останні нотатки випусків тепер перекладені всіма 6 мовами
  body: |
    <ul>
      <li><strong>Повний вбудований посібник довідки тепер доступний усіма
        шістьма мовами</strong> &mdash; німецькою, французькою, іспанською,
        італійською, японською та бразильською португальською &mdash; а не
        лише англійською. RetroDB показує посібник тією мовою, яку ви обрали
        в Налаштуваннях, і непомітно повертається до англійської, якщо щось
        ще не перекладено.</li>
      <li><strong>Цей журнал змін тепер також з'являється вашою
        мовою</strong> для найновіших випусків, а нові випуски
        перекладатимуться з цього моменту. Старіша історія залишається
        англійською.</li>
      <li><strong>Сторінка списку бажань і останні залишки англійського
        тексту</strong> &mdash; партія спливаючих повідомлень про помилки та
        статус, які були пропущені, коли мовні пакети вперше з'явилися у
        версії 3.8.0 &mdash; тепер коректно перекладаються по всьому
        додатку.</li>
    </ul>
- version: 3.8.2
  date: 2026-06-17
  tags:
  - type: security
    label: Оновлення залежності безпеки + виправлення CI
  body: |
    <ul>
      <li><strong>Безпека:</strong> оновлено вбудовану бібліотеку
        <code>cryptography</code> (47 → 49), щоб усунути опубліковану
        вразливість (GHSA-537c-gmf6-5ccf). Жодних змін у поведінці &mdash;
        лише безпечніша версія.</li>
      <li>Виправлено конвеєр автоматизованого тестування: відсутній
        допоміжний пакет, потрібний лише для тестів
        (<code>beautifulsoup4</code>), призводив до збою тестового запуску з
        версії v3.7.0, а новий скрипт збірки пакування спричиняв
        спрацювання перевірки статичного аналізу, яка є відомим хибним
        спрацюванням (він виконує довірені команди збірки, а не введені
        користувачем дані) &mdash; тепер це задокументовано та
        відкалібровано. Лише обслуговування; у самому додатку нічого не
        змінюється.</li>
    </ul>
- version: 3.8.1
  date: 2026-06-17
  tags:
  - type: improvement
    label: Менший варіант завантаження, впорядкування пожертв і виправлення перекладу (Pass 46.3 / 47.6)
  body: |
    <ul>
      <li><strong>Незабаром з'явиться значно менше завантаження.</strong>
        Готова до запуску версія RetroDB "просто розпакуй і клацни двічі"
        тепер може збиратися у варіанті <strong>тільки для CPU</strong>
        (~600&nbsp;МБ) для тих, хто не має відеокарти AMD &mdash; це
        приблизно одна шоста розміру повної версії. Обидва варіанти
        пропонуватимуться поруч, щоб ви могли обрати той, що підходить
        вашому комп'ютеру.</li>
      <li><strong>Панель "Підтримати розробку" в Налаштуваннях тепер
        перекладається</strong> разом з рештою додатку &mdash; вона була
        випадково залишена англійською, коли мовні пакети з'явилися у версії
        3.8.0.</li>
      <li>Впорядковано посилання на пожертви (значок GitHub Sponsors у
        README; файл фінансування готовий для Patreon і
        Buy&nbsp;Me&nbsp;A&nbsp;Coffee, щойно вони будуть налаштовані).
        Жодних нав'язливих спливаючих вікон, ніколи.</li>
      <li>За лаштунками: конвеєр випуску тепер може автоматично збирати
        готові до запуску версії для Windows, macOS і Linux. Примітка:
        об'ємний вбудований посібник <em>Довідка</em> наразі все ще
        доступний лише англійською &mdash; це занесено до планів на
        майбутнє.</li>
    </ul>
- version: 3.8.0
  date: 2026-06-12
  tags:
  - type: feature
    label: Повний переклад інтерфейсу + 6 мов (Pass 43.2/43.3/43.5)
  body: |
    <ul>
      <li><strong>RetroDB тепер розмовляє ще 6 мовами.</strong> На основі
        фундаменту, закладеного у версії 3.7.0, весь інтерфейс було зроблено
        придатним для перекладу та машинно перекладено <strong>німецькою,
        французькою, іспанською, італійською, японською та бразильською
        португальською</strong>. Оберіть свою мову в розділі Налаштування
        &rarr; Параметри відображення &rarr; Мова; вона слідує вашому
        збереженому вибору, потім мові браузера, а потім повертається до
        англійської &mdash; вона ніколи не може &ldquo;застрягти&rdquo; на
        відсутній мові.</li>
      <li><strong>Охоплено все, що є на екрані</strong>: текст сторінок і
        кнопки, спливаючі повідомлення (маленькі сповіщення "toast"),
        діалогові вікна редагування та налаштувань, підказки та мітки для
        програм зчитування з екрана. Жанри ігор, перспективи та режими гри
        (наприклад, &ldquo;First-Person-Shooter&rdquo;) тепер також
        показуються вашою мовою &mdash; тоді як базові дані залишаються
        англійською, тож ваша бібліотека та фільтри продовжують працювати
        точно так само, як і раніше.</li>
      <li>Вбудована <strong>мова &ldquo;Pseudo&rdquo;</strong> (видима в
        меню вибору мови) &mdash; це інструмент контролю якості для
        перекладачів, який бере в дужки та додає діакритику до кожної мітки,
        роблячи миттєво очевидним будь-який пропущений текст.</li>
      <li>Машинні переклади &mdash; це лише відправна точка і місцями
        можуть звучати трохи неприродно &mdash; їх легко вдосконалювати з
        часом, а будь-який неперекладений текст просто показується
        англійською.</li>
    </ul>
