  body: |
    <ul>
      <li><strong>Регіональні версії гри показуються як одна гра.</strong>
        Пов'яжіть версії, які у вас є (скажімо, американський, європейський і
        японський випуски), і Бібліотека покаже одну картку зі значком
        &#127760;. Картка відкриває і запускає версію з вашого типового
        регіону. Сторінка гри показує всі версії поруч і дає змогу
        перемикатися між ними. Інструменти ROM &gt; Регіональні версії
        пропонують групи, які редактори підтверджують; без вас нічого не
        пов'язується. Продовження ніколи не пропонується як версія першої
        гри. Пов'язані версії більше не позначаються як дублікати за назвою.
        Один раз запустіть «Заповнення альтернативних назв», щоб пропозиціям
        було з чим працювати.</li>
      <li><strong>ШІ може коротко описати, чим відрізняються регіональні
        версії.</strong> На сторінці гри з пов'язаними версіями редактори
        можуть натиснути «Описати відмінності за допомогою ШІ» в розділі
        «Регіональні версії». ШІ перелічує відомі відмінності, як-от цензуру,
        складність чи вилучений вміст. Список позначено як написаний ШІ, він
        показується на сторінці кожної версії й ховається, коли ви
        пов'язуєте чи від'єднуєте версію, доки його не напишуть знову.
        Потрібен провайдер ШІ, налаштований у Налаштування &gt;
        Скрапінг.</li>
      <li><strong>Ігри PlayStation запускаються з добрими
        налаштуваннями.</strong> Для DuckStation, PCSX2 і RPCS3 RetroDB тепер,
        коли ви натискаєте «Грати», задає масштаб роздільності та
        співвідношення сторін кожної гри у власному файлі налаштувань
        емулятора для цієї гри, а також чи запускатися на весь екран.
        Змінюйте їх для цілої системи кнопкою «Налаштування» в Налаштування
        &gt; Емулятори або для однієї гри в новій панелі «Налаштування
        емулятора» на її сторінці. Налаштування, яке ви змінили в самому
        емуляторі, завжди має перевагу. RetroDB читає серійний номер кожного
        диска, щоб знайти потрібний файл; для дисків CHD потрібен
        встановлений chdman.</li>
      <li><strong>«Заповнення ШІ» більше не можна скерувати текстом,
        введеним у поля гри.</strong> Коли «Заповнення ШІ» перевіряє наявних
        видавця, розробника, видання чи інші платформи гри, воно тепер
        спершу очищує цей текст, так само як уже очищувало назву.</li>
      <li><strong>Сканування Інструментів ROM не виходять за межі вашої теки
        ROM.</strong> «Конвертер CHD» і «Перевірка CHD» більше не йдуть за
        ярликом (символьним посиланням), що вказує за її межі, а розпакування
        багатодискового архіву ігнорує будь-який ярлик, запакований в
        архів.</li>
      <li><strong>Сторінки відмовляються запускати підкинуті в них
        скрипти.</strong> Ваш браузер тепер блокує будь-який скрипт, який
        RetroDB не написав сам, тож текст, що протягує код у назву гри, тег чи
        отриманий скрапінгом опис, не може його запустити. Кнопки й меню
        працюють як раніше.</li>
      <li><strong>Один зіпсований знімок екрана більше не зупиняє пошук
        дублікатів для гри.</strong> Знімок, який не вдається прочитати,
        відкладається, і перевірка триває.</li>
      <li><strong>Завдання Інструментів ROM більше не застрягають у стані
        «виконується».</strong> Файл, видалений після сканування «Перевірка
        CHD», вважається недійсним, а будь-яка неочікувана помилка в
        конвертації CHD, «Перевірці CHD» чи «Пошуку дублікатів» завершує
        завдання як невдале, з помилкою в його журналі.</li>
      <li><strong>Поки налаштування не завершено, запити застосунку по дані
        отримують зрозумілу відповідь.</strong> Вони відповідають «Потрібне
        налаштування», а не повертають сторінку налаштування. Сторінки, як і
        раніше, ведуть вас до майстра налаштування.</li>
      <li><strong>Продовження більше не показують досягнення першої
        гри.</strong> Зіставлення RetroAchievements ігнорувало номер у назві,
        тому Donkey Kong Country 2 і 3 були пов'язані з Donkey Kong Country.
        Тепер номери (2, II, 3, III тощо) враховуються. Щоб виправити вже
        пов'язані ігри, один раз запустіть оновлення RetroAchievements для
        всіх систем.</li>
      <li><strong>Синхронізація PlayStation більше не стирає кількість ваших
        трофеїв.</strong> Коли відповідь PlayStation не містила загальної
        кількості трофеїв гри, RetroDB записував нулі поверх уже наявних
        чисел. Тепер він їх зберігає, і під час масового оновлення трофеїв
        теж.</li>
      <li><strong>Відкриття набору трофеїв, якого вже немає на диску, показує
        повідомлення.</strong> Сторінка «Трофеї» раніше падала з помилкою;
        тепер вона каже, що набір не знайдено, і повертає вас до
        списку.</li>
      <li><strong>Таблиці Інструментів ROM правильно підписують стовпець
        кнопок будь-якою мовою.</strong> Заголовок стовпця мав той самий текст,
        що й жанр ігор Action, тож деякі мови показували там назву
        жанру.</li>
      <li><strong>Ігри GameCube, 3DS і Super Famicom отримують емулятор
        автоматично.</strong> RetroDB шукав ці системи під назвами тек, яких
        бібліотеки не використовують (gamecube, 3ds, superfamicom замість gc,
        n3ds, sfc), тож Dolphin і Citra ніколи до них не під'єднувалися.
        Один раз перезапустіть RetroDB, щоб це підхопити.</li>
      <li><strong>Завантаження без Python (автономне) знову налаштовує
        емулятори.</strong> У ньому бракувало файлу, що їх перелічує.</li>
      <li><strong>Близько 170 нових кнопок, підписів і повідомлень
        перекладено</strong> всіма мовами. Раніше вони показувалися
        англійською, а кілька показували хибну здогадку (деякі мови писали
        «резервне копіювання не вдалося», коли гра не запускалася).</li>
      <li><strong>Escape закриває лише верхнє вікно.</strong> Коли поверх
        іншого вікна було відкрите запитання, Escape раніше закривав обидва;
        деякі вікна ще й продовжували працювати після того, як Escape їх
        ховав, а натискання Escape на сторінці гри могло відновити масовий
        скрапінг, який ви поставили на паузу. Тепер кожне вікно закривається
        власною дією «Закрити», утримує фокус клавіатури всередині, поки
        відкрите, і повертає фокус кнопці, яка його відкрила. Вікна прогресу
        запущених завдань лишаються відкритими, доки завдання не
        завершиться.</li>
      <li><strong>Діаграми Аналітики — вашою мовою.</strong> Назви жанрів,
        перспектив, вимірів і режимів, заголовки діаграм, назви осей і
        легенди були англійською в усіх мовах.</li>
      <li><strong>Дані RetroAchievements у більшій безпеці.</strong> Якщо
        список ігор RetroAchievements для консолі не вдається завантажити,
        оновлення RA тепер залишає ігри цієї консолі пов'язаними, а не
        від'єднує їх усі. «Очистити дані RA» тепер очищує лише прогрес
        RetroAchievements; прогрес Steam і Xbox залишається.</li>
      <li><strong>Паролі всюди мають бути щонайменше 12 символів.</strong>
        Перше налаштування приймало пароль адміністратора будь-якої довжини,
        а сторінки примусової зміни пароля та налаштування казали, що досить
        4 символів. Тепер усі три вимагають 12, як і решта застосунку.</li>
      <li><strong>Підсумки досягнень правильні й саме ваші.</strong>
        Синхронізація однієї гри з RetroAchievements тепер зберігає, скільки в
        неї досягнень, а не 0. Підсумки досягнень на Панелі керування
        враховують лише ваші ігри, а Трофеї колекціонера більше не рахують
        кожне досягнення Steam чи Xbox двічі.</li>
      <li><strong>Фонові синхронізації використовують ваші власні облікові
        записи.</strong> Синхронізація системи RetroAchievements входить із
        вашим власним обліковим записом RetroAchievements, якщо ви його
        задали. Масове оновлення PlayStation повторно використовує ваш
        збережений вхід, а не входить щоразу з нуля.</li>
      <li><strong>Лише ви можете зупинити чи відновити свою
        синхронізацію.</strong> Інший користувач більше не може скасувати
        вашу синхронізацію RetroAchievements, Steam чи Xbox, а відновлення
        перерваного завдання потребує тих самих прав, що й запуск.
        Адміністратори, як і раніше, можуть і те, й інше.</li>
      <li><strong>Теку трофеїв RPCS3 перевіряють, коли ви її
        зберігаєте.</strong> Тека, якої не існує, шлях, що не є повним, або
        системна тека відхиляються, як це вже було в основних
        налаштуваннях.</li>
      <li><strong>«Отримати всі зображення» в Музеї працює у фоні.</strong>
        Сторінка більше не чекає хвилинами на кожне зображення контролера.
        Вона показує, наскільки просунулося отримання, має кнопку
        «Скасувати» і знову підхоплює прогрес, якщо ви підете зі сторінки й
        повернетеся.</li>
      <li><strong>Інструменти ROM краще захищають ваші файли.</strong>
        Очищення більше не спорожнює архів: шаблон на кшталт
        <code>*</code> не можна зберегти, а очищення зупиняється, якщо шаблони
        вилучили б усі файли. «Конвертер CHD» зберігає оригінал, коли
        «перевіряти» вимкнено, і не чіпає наявний CHD, коли увімкнено
        «пропускати наявні». «Пошук дублікатів» завжди залишає одну копію
        кожної гри, навіть якщо запит просить видалити всі.</li>
      <li><strong>Завдання Інструментів ROM поводяться так, як кажуть
        кнопки.</strong> «Пауза» тепер призупиняє конвертацію CHD, «Перевірку
        CHD», «Пошук дублікатів» і «Дедуплікацію знімків екрана», а
        призупинене завдання можна скасувати. Сканування «Дедуплікації
        знімків екрана», що натрапило на помилку, тепер завершується як
        невдале, а не працює вічно.</li>
      <li><strong>«Створити M3U» більше не тримає архіви в тимчасовій
        теці.</strong> Переміщені архіви тепер потрапляють до власної теки
        даних RetroDB, яка не очищується під час перезапуску. Сканер архівів
        показує, куди вони поділися, а підтвердження пакетної дії каже, що їх
        буде переміщено. Скидання налаштувань Інструментів ROM тепер скидає
        всі параметри.</li>
      <li><strong>Міняйте диски з RetroDB.</strong> Поки працює гра
        RetroArch, запущена зі списку дисків .m3u, список &#9654; «Зараз
        грає» угорі кожної сторінки показує назву гри та кнопку «Наступний
        диск», тож гра, що просить другу сторону, продовжується одним
        натисканням із браузера чи телефона. У RetroArch має бути увімкнено
        Налаштування &gt; Мережа &gt; Мережеві команди (порт 55355); якщо це
        вимкнено, кнопка про це скаже.</li>
      <li><strong>Скрипт запуску відкриває RetroDB, коли той готовий.</strong>
        start.sh, start.command і start.bat відкривали браузер через фіксовані
        3 секунди, часто ще до того, як сервер міг відповісти, тож сторінка
        не завантажувалася. Тепер RetroDB відкриває її, щойно сервер почав
        слухати. Якщо його запущено з LocalWebServerManager, він не
        відкриває жодної сторінки; скористайтеся кнопкою «Відкрити» в
        менеджері.</li>
      <li><strong>Відео ігор можуть бути до 500 МБ.</strong> Обмеження було
        50 МБ, замало для більшості трейлерів. Завелике завантаження тепер
        показує повідомлення на сторінці гри, а не замінює сторінку простим
        текстом. Відео, яке відхилено (завелике або не того типу файлу),
        тепер про це каже, а не зникає без жодного слова.</li>
      <li><strong>Запуск іде за шляхом, який ви задали.</strong> Перевизначення
        шляху до виконуваного файлу в рядку RetroArch у Налаштування &gt;
        Емулятори тепер має перевагу над шляхом до RetroArch угорі цієї
        сторінки; раніше шлях із рядка ігнорувався. Подвійне натискання
        «Зупинити» більше не просить гру вийти двічі; у Linux RetroArch
        сприймає другий запит як «вийти без збереження», тож ваше
        збереження в грі могло загубитися.
        Налаштування запускача, що лишилося від так і не створеного
        віддаленого режиму, більше не заважає запуску кожної гри.</li>
      <li><strong>Невдалі дії правильно повідомляють про свої
        помилки.</strong> Коли збереження, імпорт, синхронізація чи
        сканування не вдаються, RetroDB тепер відповідає справжнім статусом
        помилки й показує причину в повідомленні, а не відповідає так, ніби
        все спрацювало. Збереження коду входу PSN, з яким не вдається
        під'єднатися, більше не показує внутрішніх подробиць помилки. Вхід,
        керування користувачами, ваш профіль, досягнення, імпорти,
        «Заповнення ШІ» та пошук у HowLongToBeat тепер роблять так само, а
        мова, яку не вдається зберегти, пояснює чому, а не пише «Помилка
        мережі».</li>
      <li><strong>Ігри, названі за правилами No-Intro, тепер
        скрапляться.</strong> Назва на кшталт "Legend of Zelda, The" або
        "Legend of Zelda, The - Ocarina of Time" тепер збігається з
        результатами "The Legend of Zelda", а не відкидається фільтром
        збігів. «Звіти ROM» також більше не позначають ці назви як
        невідповідні.</li>
      <li><strong>Назви, взяті з імен файлів, втрачають усі свої
        теги.</strong> Тепер вилучаються і складений регіон, як-от "(USA,
        Europe)", і "(UK)". На домашніх комп'ютерах, як-от ZX Spectrum,
        прибирається все, починаючи з року, тож "Chuckie Egg 2 (UK) (1985)
        (A'n'F Software) (tzx)" стає "Chuckie Egg 2". Ім'я файлу, що
        закінчується на "..zip", більше не лишає зайвої крапки. Пошук
        скраперів, скидання даних гри та пропозиції «Регіональних версій»
        використовують ці чистіші назви.</li>
      <li><strong>Хибна назва більше не повторюється під час повторного
        скрапінгу.</strong> Масовий скрапінг тепер шукає за назвою з файлу
        ROM, а не за назвою, збереженою для гри. Гра, яка колись збіглася з
        неправильною грою, під час нового скрапінгу знаходить
        правильну.</li>
      <li><strong>Скрапери віддають перевагу вашому типовому
        регіону.</strong> Коли два результати рівні, тепер перемагає той, що
        з вашого типового регіону або World, а не завжди американський. Дві
        назви, які складаються лише з тегів регіону, більше не вважаються
        ідеальним збігом. «Регіональні версії» більше не приймають X у
        "X-Men" за номер продовження. Вибір версії, яку показує картка, тепер
        читає лише ім'я файлу ROM, а не теки над ним, і розуміє старі теги,
        як-от "(U)" і "(E)".</li>
      <li><strong>Журнал показує, на що йде час скрапінгу кожної
        гри.</strong> Після кожної гри RetroDB записує в журнал один рядок із
        секундами, витраченими на пошук, у кожному джерелі, на завантаження,
        обробку зображень, ШІ та збереження. Це перший крок до швидшого
        скрапінгу.</li>
      <li><strong>Скрапінг закінчується швидше: малі зображення
        покращуються потім.</strong> Скрапінг тепер зберігає гру з
        зображеннями такими, як їх завантажено. Малі обкладинки й знімки
        екрана потім збільшуються у фоні, по одній грі за раз. Повторювані
        знімки екрана відкидаються ще до цієї роботи. Якщо RetroDB
        зупиниться на півдорозі, він продовжить під час наступного
        запуску.</li>
      <li><strong>Читайте інструкцію до гри на її сторінці.</strong> Кнопка
        «Інструкція» тепер відкриває PDF у вікні поверх сторінки гри.
        Гортайте сторінки кнопками «Назад» і «Далі», клавішами зі стрілками,
        Home і End або свайпом на телефоні; кожна сторінка перегортається, як
        у книжці, або просто змінюється, якщо ваша система просить менше
        анімації. «Відкрити PDF у новій вкладці» нікуди не зникло, а
        Ctrl-клік на «Інструкції» відкриває вкладку одразу.</li>
      <li><strong>Бічна панель показує, що зображення ще
        покращуються.</strong> Поки зображення покращуються у фоні, на бічній
        панелі написано «Покращення зображень — Залишилось ігор: N». Гра, що
        ще чекає, каже про це на своїй сторінці, а її чіткіші зображення
        з'являються там самі, щойно будуть готові. Перемикач обкладинки 2D/3D
        більше не закриває цей рядок.</li>
      <li><strong>Резервні джерела опитуються одночасно.</strong> Коли основне
        джерело лишає прогалини, RetroDB тепер опитує інші джерела всі разом,
        а не одне за одним. Їхні відповіді, як і раніше, використовуються в
        порядку з ваших Налаштувань, тож кожне поле виграє те саме
        джерело.</li>
      <li><strong>ES-DE читає свій список ігор один раз.</strong> Кожен
        скрапінг, зокрема масовий, раніше читав файл gamelist.xml системи
        ES-DE двічі для кожної гри. Тепер RetroDB читає його один раз і
        перечитує лише тоді, коли файл змінюється.</li>
      <li><strong>«Застосувати» в «Пошуку метаданих» більше не шукає
        вдруге.</strong> На сторінці гри позначені вами результати
        отримуються просто з їхнього джерела, а не шукаються ще раз. Якщо
        нічого не позначено, прогалини заповнюють лише застосоване джерело та
        ШІ.</li>
      <li><strong>ScreenScraper знаходить ігри з підзаголовком.</strong> Для
        назви на кшталт "Alone in the Dark: The New Nightmare" він нічого не
        знаходив, якщо перед двокрапкою не було пробілу. Тепер RetroDB шукає
        саме так, а потім за частиною до двокрапки, якщо й тоді нічого не
        знайдено.</li>
      <li><strong>Ігри, в які нема чого запускати, більше не пропонують
        «Грати».</strong> Гра, додана імпортом із CLZ, Steam, Xbox чи PSN, не
        має файлу ROM. Її сторінка тепер не показує ні кнопки «Грати», ні
        «Налаштувань емулятора», ні розділу «Запуск» під час редагування, як і
        картки в Бібліотеці.</li>
      <li><strong>Ігри RetroArch захищені від двох поганих
        налаштувань.</strong> Тепер RetroDB щоразу, коли запускає гру, дає
        RetroArch невеликий власний файл налаштувань поверх ваших. Він
        налаштовує клавіатуру відповідно до вашого робочого столу (Wayland чи
        X11), тож клавіатура ніколи не мертва, і дозволяє перемотуванню
        вперед працювати на повній швидкості, яким ігри Commodore 64
        користуються для швидкого завантаження. Усі інші ваші налаштування
        RetroArch не змінюються.</li>
      <li><strong>«Створити M3U» залишає гру у вашій бібліотеці.</strong>
        Перетворення багатодискового архіву на плейлист раніше лишало гру з
        посиланням на архів, який уже перемістили. Тепер гра вказує на новий
        плейлист і зберігає свої подробиці та зображення. Коли один архів
        містить кілька випусків гри, кожен на власному наборі дисків,
        плейлист тепер використовує диски першого випуску, а не всі, і
        каже, які диски він пропустив.</li>
      <li><strong>Повторний скрапінг може зберегти вже наявні
        медіафайли.</strong> Позначте «Зберегти наявні медіафайли» поруч із
        перемикачем повторного скрапінгу. Текстові подробиці все одно
        оновлюються, але зображення, відео та інструкції, що вже є на диску,
        лишаються як є, а не завантажуються знову. Без цієї позначки
        повторний скрапінг більше не відкидає знімки екрана, які він
        завантажив раніше.</li>
      <li><strong>Фонові завдання більше не губять і не пропускають
        роботу.</strong> Оновлення RetroAchievements, що натрапило на одну
        погану гру, більше не викидає ігри, які вже встигло оновити.
        Відновлена синхронізація чи оновлення більше не пропускає гру, на
        якій зупинилися. Відновлена з дуже старого знімка стану
        синхронізація RetroAchievements чи Steam тепер зупиняється з
        повідомленням, а не повідомляє про успіх, нічого не синхронізувавши.
        Конвертація у WebP перевіряє залишений файл WebP, перш ніж йому
        довіряти, і не запускається, якщо не може прочитати обсяг вільного
        місця на диску.</li>
      <li><strong>Оновлення дуже старої інсталяції більше не може непомітно
        втратити дані.</strong> Три старі кроки оновлення бази даних у
        рідкісних станах могли губити рядки. Тепер вони копіюють рядки або
        зупиняються зі зрозумілою помилкою, а не втрачають їх.</li>
      <li><strong>Кнопки вікна «Про програму» більше не обрізаються.</strong>
        Вікно ширше, а чотири кнопки стоять у два ряди, тож кожен підпис
        видно повністю; на телефоні вони стають одна під одною.</li>
      <li><strong>Ваша тема йде за вами в новий браузер.</strong> Вхід у
        браузері, яким ви раніше не користувалися, тепер показує вашу
        збережену тему. Раніше сторінка входу спершу зберігала Cyberpunk, і
        так воно й лишалося.</li>
      <li><strong>Поле пароля для входу більше не пише «Admin
        Login».</strong> Кожен обліковий запис входить із паролем, тож
        діалог тепер пише просто «Увійти». Сторінка облікового запису та
        Довідка тепер кажуть так само.</li>
      <li><strong>Довідка актуальна всіма мовами.</strong> Перекладені
        сторінки Довідки тепер описують «Регіональні версії», кажуть, що
        кожному обліковому запису потрібен пароль, і що вашу тему
        збережено разом з обліковим записом. Довідка всіма мовами, зокрема
        англійською, тепер називає справжній мінімум пароля — 12
        символів.</li>
      <li><strong>Дрібні виправлення:</strong> фанарт, ім'я файлу якого
        містить апостроф, тепер показується на сторінках ігор і трофеїв;
        Налаштування більше не показують помилку скрипту для облікових
        записів без прав адміністратора, а програми читання з екрана тепер
        чують, яку вкладку Налаштувань вибрано; вихід зі сторінки більше не
        засипає консоль браузера помилками скасованих запитів; модель
        збільшення зображень спершу завантажується з робочої адреси; а
        інсталятор більше не падає в Windows, коли його вивід зберігається
        у файл.</li>
      <li><strong>Великий набір виправлень надійності.</strong> Збереження гри
        з порожньою назвою більше не губить інші ваші зміни. Перезапуск тепер
        дає запущеним завданням спершу коректно зупинитися. «Створити M3U»
        відмовляється перезаписувати наявний плейлист чи теку. Очищення
        списку небажаних файлів в Інструментах ROM тепер означає «нічого не
        видаляти», а два шаблони більше не чіпляють справжні назви ROM, як-от
        "Release of the Dragon". Один пошкоджений файл трофеїв PS3 більше не
        стирає трофеї всіх ігор. «Заповнення ШІ» записує один регіон.
        Аналітика враховує кожну гру в діаграмі оцінок один раз. Імпорти CLZ
        використовують стандартні назви жанрів. У вікнах редагування жанр та
        інші теги можна вилучити будь-якою мовою, а клавіатурні скорочення
        більше не перехоплюють Ctrl+D чи Ctrl+G. Глядачі бачать статус
        проходження гри, але більше не можуть його змінити, бо він спільний
        для всіх.</li>
      <li><strong>Програми читання з екрана читають перемикач «Platform Match
        Required» за його видимою назвою</strong> у Налаштування → Скрапінг.</li>
      <li>Іншими мовами Налаштування тепер перекладають «Типовий регіон», а
        вкладка «Скрапінг» читається як назва, а не як «триває скрапінг».
        Сторінки довідки вживають ті самі слова.</li>
      <li><strong>Гра, яка не закривається, більше не показується
        закритою.</strong> Якщо емулятор пережив «Зупинити», RetroDB і далі
        показує його запущеним. Відхилений запуск RetroArch більше не
        записує спершу свій файл налаштувань, а емулятор, що одразу
        завершується збоєм, показує своє повідомлення про помилку вже під час
        першої перевірки.</li>
      <li>Оновлені бібліотеки: Pillow 13 (обробка зображень), numpy 2.5.4 і
        onnxruntime 1.31 (збільшення зображень), а також найновіші версії
        інструментів збирання та випуску.</li>
      <li>За лаштунками: код запуску ігор упорядковано, щоб його було легше
        читати, вилучено код, який не використовувався (адресу API, допоміжну
        функцію PSN, скрипт трофеїв, який не завантажувала жодна сторінка, і
        загальносайтове налаштування теми, яке ніщо не читало), відповіді
        застосунку браузеру тепер формуються в одному місці, кілька
        документів із дизайну виправлено відповідно до коду, набір тестів
        упорядковано, а нова перевірка ловить синтаксичну помилку JavaScript
        до випуску. Старіші записи списку змін, що описували вилучений код,
        тепер про це кажуть.</li>
    </ul>
- version: 3.29.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Інші назви гри показують регіон, з якого вони походять
  body: |
    <ul>
      <li><strong>Інші назви гри показують регіон, з якого вони
        походять.</strong> Картка «Інші назви» на сторінці гри позначає кожну
        назву її країною чи регіоном вашою мовою, як-от Японія для
        "Rockman". Позначені назви йдуть першими, згруповані за регіоном.
        Наведіть курсор на назву, щоб побачити її джерело й примітку, як-от
        «Робоча назва».</li>
      <li>Назви з IGDB тепер зберігають свій регіон. Раніше регіон мали лише
        назви зі ScreenScraper.</li>
      <li>Мітка "SS" від ScreenScraper більше не показується як регіон. Це
        власна назва гри в ScreenScraper, а не місце.</li>
      <li>Інструменти ROM → «Заповнення альтернативних назв» тепер перевіряє
        кожну гру, для якої виконано скрапінг, тож назви, які у вас уже є,
        отримують свої регіони. Запустіть його один раз, щоб позначити вашу
        наявну бібліотеку.</li>
    </ul>
- version: 3.28.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Вкажіть RetroDB теку з емуляторами, і він їх налаштує
  - type: fix
    label: Виправлення сторінки Налаштування → Емулятори
  body: |
    <ul>
      <li><strong>Вкажіть RetroDB теку з емуляторами, і він їх
        налаштує.</strong> У Налаштування → Емулятори з'явився новий список
        «Теки емуляторів». Додайте теку, де живуть ваші емулятори, і RetroDB
        знайде в ній кожен — як AppImage, портативний скрипт чи встановлений
        Flatpak — і пов'яже його із системами, які він запускає. Система, що
        вже має робочий емулятор, його зберігає.</li>
      <li><strong>Дивіться, які системи готові до гри.</strong> Таблиця
        зіставлення за системами тепер перелічує емулятори кожної системи,
        каже, чи працює кожен, і дає вибрати типовий для системи. Для
        DuckStation, PCSX2, RPCS3 і RetroArch вона також каже, чи на місці
        файли BIOS, і називає відсутні. RetroDB лише читає файли BIOS; він
        ніколи їх не копіює й не завантажує.</li>
      <li>Сканування емуляторів тепер знаходить кожен емулятор на великому
        диску з емуляторами. Раніше воно могло зупинитися передчасно
        всередині власної теки налаштувань емулятора.</li>
      <li>Кнопки «Автовизначення» та «Зберегти» для RetroArch знову
        працюють, а вікно «Редагувати емулятор» більше не видно на сторінці,
        доки ви не натиснете «Редагувати».</li>
    </ul>
- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Застосування метаданих показує, наскільки воно просунулося
  body: |
    <ul>
      <li><strong>Застосування метаданих показує, наскільки воно
        просунулося.</strong> Коли ви вибираєте результат у вікні «Пошук
        метаданих», кільце заповнюється від 0 до 100 % з відсотком у центрі, а
        рядок під ним повідомляє, що відбувається: який сайт зараз опитується,
        яке зображення чи відео завантажується або що зображення обробляються.
        Велике завантаження, наприклад відео, рухає кільце в міру надходження
        даних. На 100 % сторінка, як і раніше, перезавантажується з
        результатом.</li>
      <li>Кільце може рухатися нерівномірно. Кожне джерело вирішує, скільки
        зображень надіслати, лише коли відповідає, тому перше джерело з
        великою кількістю зображень може заповнити значну частину кільця, а
        наступні — менше.</li>
      <li>Якщо застосування не вдалося, кільце закривається і з'являється
        повідомлення про це, без перезавантаження сторінки.</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Кожна сторінка тепер підлаштовується під своє вікно
  - type: enhancement
    label: Сторінка гри показує інші назви в окремій картці та має кнопку «Інструкція»
  body: |
    <ul>
      <li><strong>Кожна сторінка тепер підлаштовується під своє вікно.</strong>
        Сторінки з картками (Системи, Музей, Теги, Списки, Інструменти ROM,
        трофеї та досягнення) додають стовпець щоразу, коли вміщується ще одна
        ціла картка, &mdash; до чотирьох у ряд. Таблиці, інструменти та сторінки
        з подробицями трохи розширюються, але зупиняються там, де більша ширина
        лише розсунула б їхні стовпці. Налаштування зберігають для своїх блоків
        зручну для читання ширину.</li>
      <li><strong>Довідка та список змін зберігають зручну довжину
        рядка.</strong> У широкому вікні посилання на розділи Довідки
        переходять у стовпець поруч із текстом; у вузькому вони стоять в одному
        рядку, який можна гортати пальцем, замість блоку, що закривав значну
        частину екрана телефона.</li>
      <li><strong>Сторінка гри:</strong> у широкому вікні знімки екрана йдуть
        угорі, а під ними поруч стоять відео та нова картка <strong>Також
        відомо як</strong>, на рівні обкладинки. Інші назви раніше були блідим
        текстом під заголовком; тепер вони на картці, яку легко читати.
        <strong>Інструкція</strong> тепер кнопка поруч із «Грати», а «Історія
        скрапінгу» спочатку згорнута.</li>
      <li>«Трофеї PSN» показують від одного до чотирьох стовпців залежно від
        вікна, а не завжди три.</li>
      <li>Кілька сторінок більше не прокручуються вбік на телефоні: Трофеї,
        Трофеї колекціонера, сторінка системи RetroAchievements, Довідка,
        Налаштування, Аналітика, Імпорти ігор і сторінки з подробицями
        досягнень і трофеїв. Широкі таблиці там тепер прокручуються всередині
        себе.</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Сторінки Бібліотеки, систем та ігор тепер підлаштовуються під своє вікно
  body: |
    <ul>
      <li><strong>Сторінки використовують широке вікно, коли це допомагає, і
        лише тоді.</strong> Бібліотека та кожна сторінка системи додають
        стовпець карток ігор щоразу, коли вміщується ще одна ціла картка,
        &mdash; до чотирьох у ряд. Телефон показує одну, вікно на пів екрана
        &mdash; дві чи три, широке вікно &mdash; чотири. Раніше сторінки
        зупинялися на фіксованій ширині й залишали більшу частину великого вікна
        порожньою.</li>
      <li><strong>Сторінка гри ставить обкладинку та подробиці поруч зі
        знімками екрана й відео,</strong> коли вони вміщуються поруч, а інакше
        розташовує їх одне під одним. Опис зберігає зручну довжину рядка.</li>
      <li><strong>Кнопка «Грати» переїхала у верхній правий кут кожної
        картки,</strong> стала меншою і вирівняна по центру. Тепер вона ще й
        перевіряє, що файл ROM гри досі на місці й має тип, який приймає її
        система, тож з'являється лише там, де натискання справді запустить гру.
        Вона ховається, поки ви вибираєте ігри для масових дій.</li>
      <li>Кнопка «Наверх» і спливаючі вікна прогресу тепер розташовані одразу
        біля вмісту сторінки, а не на самих краях вікна.</li>
      <li>Сторінка гри більше не прокручується вбік на телефоні.</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: Тестову мову «Pseudo» пропонують лише адміністраторам
  body: |
    <ul>
      <li><strong>«Pseudo» більше не з'являється у списку мов для
        всіх.</strong> Це інструмент для розробників, який показує кожне слово
        в дужках і з діакритичними знаками, тому тепер його пропонують лише
        адміністраторам. Усі інші, хто її вибрав, бачать застосунок англійською,
        а в Налаштуваннях вибрано англійську.</li>
    </ul>
- version: 3.24.1
  date: '2026-10-17'
  tags:
  - type: fix
    label: Завантаження для Windows знову встановлюється, і після зміни розміру вікна немає потоку помилок
  body: |
    <ul>
      <li><strong>Звичайне завантаження для Windows не вдавалося
        встановити.</strong> Інсталятор зупинявся на повідомленні «Core
        dependencies failed to install», бо в його зафіксованому списку пакетів
        бракувало пакета, потрібного лише Windows. Тепер список охоплює всі
        платформи. Завантаження для Windows без Python це не зачепило.</li>
      <li><strong>У верхньому правому куті постійно з'являлися повідомлення про
        помилки</strong> в темі Cyberpunk після того, як вікно браузера ставало
        ширшим, наприклад після розгортання на весь екран. Анімований фон тепер
        змінює розмір без збоїв.</li>
    </ul>
- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Запускайте гру просто зі сторінок Бібліотеки та систем
  body: |
    <ul>
      <li><strong>Кнопка ▶ «Грати» на кожній картці гри.</strong> Вона
        з'являється в нижньому лівому куті обкладинки на сторінці Бібліотеки та
        на кожній сторінці системи. Натисніть її, і гра запуститься в
        емуляторі; ви залишаєтеся у списку, а не відкриваєте спершу сторінку
        гри.</li>
      <li>Кнопка показується лише там, де натискання може спрацювати: вашому
        обліковому запису дозволено запускати ігри, а емулятор гри увімкнено,
        встановлено і, для RetroArch, має своє ядро. Ігри систем без робочого
        емулятора кнопки не мають.</li>
      <li>Якщо запуск усе ж не вдається, наприклад тому, що файл ROM
        перемістили, причина з'являється в повідомленні, а сторінка лишається
        такою, як була.</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: Коротша бічна панель з однією сторінкою «Досягнення» для всіх платформ
  body: |
    <ul>
      <li><strong>Одне посилання «Досягнення» замінює п'ять.</strong>
        RetroAchievements, RPCS3, PSN, Steam і Xbox тепер є вкладками на одній
        сторінці, а посилання знову відкриває вкладку, якою ви користувалися
        востаннє. Якщо у вас немає ігор RetroAchievements, воно відкривається
        на вкладці RPCS3, а не повертає вас на Панель керування.</li>
      <li><strong>Звіти ROM тепер у розділі Інструменти ROM,</strong> як
        вкладка поруч з іншими інструментами та картка на сторінці Інструменти
        ROM.</li>
      <li><strong>Жодні два посилання бічної панелі не мають однакового
        значка:</strong> Панель керування тепер 🏠, а Перегляд журналу 🧾.
        У бічній панелі тепер 16 посилань замість 21.</li>
      <li>Вкладки інструментів на сторінці налаштувань Інструментів ROM завжди
        були англійською; тепер вони йдуть за вашою мовою.</li>
    </ul>
- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: Пошук How Long To Beat знову працює
  body: |
    <ul>
      <li><strong>Кожен пошук How Long To Beat повідомляв, що гру не
        знайдено.</strong> Сайт переніс свій пошук на нову адресу, тож запити
        RetroDB відхилялися; збій стався між кінцем липня та кінцем вересня.
        Тепер RetroDB використовує нову адресу й надсилає фільтри платформи та
        року в новому форматі сайту, бо старі сайт почав ігнорувати. Пошук для
        однієї гри та масовий пошук в Інструментах ROM знову працюють.</li>
    </ul>
- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: RetroDB тепер прямо каже, що не схвалює піратство
  - type: fix
    label: Вікно «Про програму» знову відкривається повного розміру
  body: |
    <ul>
      <li><strong>У застосунку тепер є повідомлення проти піратства.</strong>
        Воно з'являється у вікні «Про програму» та під «Шляхом до бібліотеки
        ROM» у Налаштуваннях, усіма мовами. У ньому сказано, що RetroDB не
        поширює й не зберігає файли ROM, що варто використовувати лише ігри,
        скопійовані з дисків і картриджів, якими ви володієте, і що RetroDB не
        пов'язаний із жодним виробником консолей, видавцем чи базою даних ігор.
        Формулювання збігається з вебсайтом і трейлером RetroDB.</li>
      <li><strong>Вікно «Про програму» було стиснуте в бічну панель.</strong>
        Тепер воно відкривається посередині екрана звичайного розміру, а на
        малому екрані прокручується, замість того щоб ховати свій заголовок і
        кнопку закриття.</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: RetroDB запускає та перейменовує лише справжні типи файлів ROM
  body: |
    <ul>
      <li><strong>Гру можна було запустити з файлом, який не є
        ROM.</strong> Перейменування ROM приймало будь-яку назву, тож
        <code>crash.bin</code> міг стати <code>crash.cfg</code>, і його
        передавали емулятору. Тепер під час запуску тип файлу перевіряється за
        списком у файлі <code>systeminfo.txt</code> папки цієї системи &mdash;
        тим самим списком, який використовує сканування бібліотеки, &mdash; а
        перейменування відмовляє, якщо типу немає в цьому списку. Якщо в папці
        системи немає списку, її ігри не запускатимуться, а повідомлення назве
        відсутній файл.</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: Лише адміністратор може змінювати аргументи запуску гри
  - type: fix
    label: Аргументи запуску з кількох слів або із зайвими лапками тепер працюють
  - type: fix
    label: RetroDB більше не тримає в пам'яті кожен завершений запуск
  body: |
    <ul>
      <li><strong>Редактор міг додати аргументи запуску, які запускали інший
        код.</strong> <em>Власні аргументи запуску</em> гри йдуть прямо до
        емулятора, а з RetroArch вони могли завантажити будь-який програмний
        файл на комп'ютері. Тепер для їх зміни потрібна роль адміністратора, а
        для всіх інших це поле приховане.</li>
      <li><strong>Аргументи запуску з кількох слів доходили до емулятора як
        одне.</strong> <code>--a --b</code> тепер надходить як два аргументи, а
        порожнє значення нічого не додає. Відсутня закривна лапка раніше ламала
        кожен запуск цієї гри помилкою сервера; тепер з'являється повідомлення,
        яке називає поле, що треба виправити. Мітку
        <code>{disc_paths}</code> прибрано: вона завжди була порожня.</li>
      <li><strong>Завершені запуски накопичувалися в пам'яті, доки RetroDB не
        перезапускали.</strong> Запуск, що завершився понад годину тому, тепер
        прибирається.</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: Вибір мови в Налаштуваннях знову працює
  body: |
    <ul>
      <li><strong>Вибір мови в Налаштування &rarr; Бібліотека &rarr;
        Відображення нічого не робив.</strong> Натомість з'являлася помилка, а
        сторінка лишалася старою мовою. Це зламалося у версії 3.23.8. Тепер
        вибрана мова зберігається, а сторінка перезавантажується цією
        мовою.</li>
    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: Значки трофеїв і платформ знову є в завантаженні
  body: |
    <ul>
      <li><strong>У завантаженні бракувало значків трофеїв і платформ
        RetroDB.</strong> Кожна картка гри з RetroAchievements показувала
        зламане зображення там, де мав бути її значок, а рівнів трофеїв і
        логотипів PSN, Steam, Xbox і RPCS3 теж не було. Тепер вони є в кожному
        завантаженні.</li>
    </ul>
- version: 3.23.14
  date: '2026-10-10'
  tags:
  - type: security
    label: Дві вбудовані бібліотеки оновлено заради опублікованих виправлень безпеки
  body: |
    <ul>
      <li><strong>urllib3 і Werkzeug мали відомі проблеми безпеки.</strong>
        Тепер RetroDB постачається з urllib3 2.8.0 і Werkzeug 3.1.9 &mdash;
        версіями, що їх виправляють. Встановлення з вихідного коду отримає їх,
        якщо знову запустити <code>install.py</code>, який встановлює пакети з
        <code>requirements.lock</code>.</li>
    </ul>
- version: 3.23.13
  date: '2026-09-26'
  tags:
  - type: fix
    label: Медіа, збережені як шлях до папки, більше не вважаються відсутніми
  body: |
    <ul>
      <li><strong>В автономній збірці «очищення посилань на відсутні медіа»
        могло стерти медіа, які насправді були на місці.</strong> Так
        траплялося, коли база даних зберігала медіа як шлях до папки, наприклад
        <code>images/boxart/…</code>, а не просто як назву файлу. Тепер RetroDB
        шукає їх у правильній папці.</li>
    </ul>
- version: 3.23.12
  date: '2026-09-26'
  tags:
  - type: fix
    label: Панель керування показує масовий скрапінг, що триває, плюс чотири дрібні виправлення
  body: |
    <ul>
      <li><strong>Картка прогресу скрапінгу на Панелі керування ніколи не
        з'являлася.</strong> Тепер вона показується, поки триває масовий
        скрапінг, і повідомляє, коли його призупинено.</li>
      <li><strong>Більше жодних помилок у консолі браузера на сторінці
        входу.</strong> Вона більше не перевіряє фонові завдання, доки ніхто не
        ввійшов.</li>
      <li><strong>Майстер налаштування більше не пише «Налаштування
        завершено!», якщо зберегти не вдалося.</strong> Тепер він повідомляє,
        що налаштування не вдалося зберегти.</li>
      <li><strong>Два масові скрапінги, запущені в ту саму секунду, більше не
        мають спільного ідентифікатора</strong>, тож дії в черзі, як-от
        скасування, застосовуються до правильного.</li>
    </ul>
- version: 3.23.11
  date: '2026-09-26'
  tags:
  - type: ui
    label: Кнопки пожертв тепер кажуть, що саме вони підтримують
  body: |
    <ul>
      <li><strong>Зрозуміліші формулювання щодо пожертв.</strong> Кнопки в
        заголовку тепер мають написи «Sponsor RetroDB» і «Support RetroDB».
        У README сказано, що кожен випуск безкоштовний і що пожертви
        фінансують сам RetroDB, а не емулятори та ядра, які він може
        запускати.</li>
    </ul>
- version: 3.23.10
  date: '2026-09-26'
  tags:
  - type: fix
    label: Сторінки Інструментів ROM враховують збережені налаштування, а сторінки журналів та Інструментів ROM знову працюють
  body: |
    <ul>
      <li><strong>Сторінка журналів і деякі сторінки Інструментів ROM були
        зламані.</strong> Скрипт на цих сторінках давав збій під час
        завантаження, тож перегляд журналу та спільні помічники Інструментів ROM
        так і не запускалися. Тепер вони завантажуються належно.</li>
      <li><strong>Налаштування Інструментів ROM тепер діють.</strong> Пошук
        дублікатів і Конвертер CHD відкриваються з параметрами, заданими на
        сторінці налаштувань Інструментів ROM, і ви все одно можете змінити їх
        для одного запуску.</li>
      <li><strong>Перемикачі Конвертера CHD ігнорувалися.</strong> Якщо
        вимкнути на сторінці «Видалити оригінальні файли», видалення все одно
        відбувалося, коли ваше збережене налаштування казало видаляти. Тепер
        вирішують перемикачі на сторінці.</li>
      <li><strong>Налаштування тимчасового шляху використовується.</strong>
        Файли, які проміжно зберігаються під час створення плейлистів M3U,
        тепер потрапляють туди.</li>
    </ul>
- version: 3.23.9
  date: '2026-09-26'
  tags:
  - type: security
    label: Журнали скраперів більше не зберігають паролі й токени, а спроби входу знову обмежено
  - type: fix
    label: Збереження налаштувань більше не стирає ваші налаштування, а видалення користувача працює
  body: |
    <ul>
      <li><strong>Файли журналів зберігали секрети відкритим текстом.</strong>
        Журнали скраперів мали приховувати токени входу та ключі API, але крок
        приховування ніколи не виконувався, тож їх записували повністю. Тепер
        їх приховано. Старіші файли журналів досі їх містять; видаліть старі
        файли в <code>logs/</code>, якщо ви ділитеся своїм встановленням.</li>
      <li><strong>Обмеження спроб входу не діяли.</strong> Обмеження на
        повторні входи та на важкі дії (сканування, скрапінг, імпорт) були
        налаштовані, але так і не ввімкнені. Тепер вони працюють, а
        заблокований запит отримує зрозуміле повідомлення «забагато
        запитів».</li>
      <li><strong>Пошкоджений файл налаштувань міг бути стертий.</strong> Якщо
        <code>data/settings.json</code> не вдавалося прочитати, наступне
        збереження замінювало його типовими значеннями. Тепер перед збереженням
        RetroDB зберігає пошкоджений файл як
        <code>settings.json.corrupt-&lt;time&gt;</code>. Якщо файл знову
        читається нормально, збереження натомість відхиляється.</li>
      <li><strong>Рядок найменування «Рушій» втрачав інші налаштування.</strong>
        Додавання тегу до рядка «Рушій» у налаштуваннях найменування не
        вдавалося, а ще викидало збережені разом із ним налаштування артиклів і
        регіону. Тепер він зберігається належно.</li>
      <li><strong>Видалення користувача не вдавалося.</strong> Користувача з
        тегами, списками, елементами списку бажань або даними PSN не можна було
        видалити. Тепер видалення прибирає користувача та все, що йому
        належить.</li>
      <li><strong>Два скрапінги могли йти одночасно.</strong> Обмін місцями
        або переміщення масового скрапінгу, що триває, у черзі запускало два
        скрапінги зі спільним лічильником прогресу. Тепер працює лише
        один.</li>
      <li><strong>Прогрес масового скрапінгу міг виглядати як помилка.</strong>
        До першого успіху масовий скрапінг повідомляв свій стан так, що деякі
        екрани сприймали це як збій. Це виправлено.</li>
      <li><strong>Після входу ви тепер повертаєтеся на сторінку, яку
        запитували.</strong> Раніше вхід завжди вів на Панель керування.</li>
      <li><strong>Файлові дії адміністратора не виходять за межі ваших
        папок.</strong> Інструмент зміни розміру зображень і дії
        перейменування ROM тепер відмовляють у всьому, що поза вашою папкою
        медіа або папкою ROM.</li>
      <li><strong>Старі файли входу PSN і Xbox переносяться у ваш обліковий
        запис.</strong> Залишений <code>data/psn_tokens.json</code> або
        <code>data/xbox_tokens.json</code> завантажується у ваш обліковий запис
        і перейменовується із закінченням <code>.migrated-015</code>. Цей файл
        досі містить токен, тож видаліть його, щойно перевірите, що вхід
        працює.</li>
      <li><strong>Зрозуміліші помилки від сервера.</strong> На хибний запит
        тепер надходить належне повідомлення про помилку замість «Сталася
        внутрішня помилка».</li>
    </ul>
- version: 3.23.8
  date: '2026-09-25'
  tags:
  - type: fix
    label: Імпорт CLZ знову працює, обкладинки списків показуються, а кілька сторінок більше не ламаються через апостроф
  - type: security
    label: Скрапнуті назви та шляхи до файлів більше не можуть вирватися за межі кнопок сторінки
  body: |
    <ul>
      <li><strong>Імпорт CLZ нічого не робив.</strong> Завантажений PDF із CLZ
        надсилався на адресу, якої на сервері немає, тож кожне завантаження
        завершувалося помилкою «Parse failed». Тепер він потрапляє до
        обробника.</li>
      <li><strong>На сторінці списку не було жодної обкладинки.</strong>
        Сторінка списку запитувала кожну обкладинку за хибною адресою, а
        стовпець «Система» завжди був порожній. Тепер показується і те, і те.
        Обкладинки в пошуку «додати гру» на цій сторінці теж виправлено.</li>
      <li><strong>Кнопки ламалися на назвах з апострофом.</strong> Видалення
        «Assassin's Creed» зі списку, видалення знімка екрана, збільшення
        обкладинки чи видалення тегу жанру могли непомітно нічого не зробити,
        якщо назва містила апостроф. Та сама вада дозволяла спеціально
        підготовленій скрапнутій назві виконати код на сторінці. Тепер назви
        передаються цим кнопкам так, що їх неможливо сприйняти як код.</li>
      <li><strong>Адреси зображень і посилань тепер екрануються
        всюди.</strong> Кілька сторінок будували адреси зображень зі скрапнутих
        назв файлів без екранування, а п'ять сторінок мали власну слабшу копію
        допоміжної функції екранування. Тепер усі вони використовують
        спільну.</li>
      <li><strong>Сторінка Налаштувань могла відкриватися порожньою.</strong>
        Якщо вкладку, якою ви користувалися востаннє, оновлення
        перейменувало, Налаштування відкривалися без жодної видимої панелі.
        Тепер вкладка, якої більше не існує, ігнорується. Посилання на кшталт
        <code>/settings#account</code> знову відкривають свою вкладку.</li>
      <li><strong>Ваша тема тепер переходить із вами на інші пристрої.</strong>
        Вибрана тема зберігається у вашому обліковому записі. Браузер, якому ще
        ніколи не задавали тему, використовує вашу збережену замість
        типової.</li>
      <li><strong>Спливаючі вікна прогресу завдань показують правильний
        значок.</strong> Призупинені, завершені та поставлені в чергу завдання
        показували той самий значок «виконується». Тепер кожен стан має власний,
        для кожної теми.</li>
      <li><strong>Список клавіатурних скорочень тепер можна
        перекласти.</strong> Його написи були невидимі для інструментів
        перекладу, тож лишалися англійською в кожній мові.</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: Вікові рейтинги часто були хибними, а скрапнуті ігри могли втрачати свої подробиці
  body: |
    <ul>
      <li><strong>Вікові рейтинги часто були хибними, і помилка
        поширювалася.</strong> Коли рейтинг надходив із TheGamesDB, застосунок
        шукав код рейтингу будь-де в тексті замість того, щоб прочитати його
        правильно &mdash; тож «T - Teen», «M - Mature 17+», «AO - Adults Only
        18+» і «RP - Rating Pending» зберігалися з хибним рейтингом, і гру для
        дорослих могли записати як придатну для всіх. Гірше того, цей хибний
        рейтинг потім використовувався для заповнення восьми інших систем
        рейтингів, тож одне хибне прочитання поширювалося на всі. Тепер рейтинг
        читається з коду на початку тексту.</li>
      <li><strong>Перетворені рейтинги виходили надто м'якими.</strong> Під
        час заповнення відсутнього рейтингу з наявного застосунок міг узяти
        рейтинг, який сам щойно обчислив, а не той, з якого ви насправді
        почали. Кожен такий крок трохи знижував суворість. Тепер він завжди
        перетворює з рейтингів, які гра справді має.</li>
      <li><strong>Повторний скрапінг стирав вибрані вручну Регіон і Тип
        збереження.</strong> Жоден із них не надходить від скрапера &mdash;
        застосунок обчислює їх сам &mdash; тож Повторний скрапінг замінював
        ваше ретельно вибране «Japan» типовим «USA». Тепер ваші значення
        зберігаються, якщо джерело справді не надає нового.</li>
      <li><strong>Скрапер міг прийняти не ту гру.</strong> Результати
        ScreenScraper зазвичай перевіряються за оцінкою збігу перед
        використанням, але пошук, що повертав рівно один результат, повністю
        пропускав цю перевірку. Тепер оцінюється кожен результат.</li>
      <li><strong>Гра могла втратити всі скрапнуті подробиці через одне
        відсутнє поле.</strong> Якщо IGDB або ScreenScraper залишали одне поле
        порожнім у несподіваний спосіб, усе оновлення відкидалося &mdash;
        видавець, розробник, зображення та все інше. Тепер ці випадки
        обробляються, а решта подробиць зберігається.</li>
      <li><strong>Невдале зображення могло бути записане як успіх.</strong>
        Якщо завантажена картинка виявлялася непридатним зображенням, застосунок
        нічого не видаляв і все одно зберігав назву файлу, залишаючи зламане
        посилання. Тепер файл видаляється, а поле лишається без змін.</li>
      <li><strong>Режими гри тепер мають однакові формулювання.</strong> Різні
        скрапери писали «Single-player» і «Single-Player», а також просто
        «Multiplayer», якого немає серед власних позначок застосунку, тож ці
        ігри не можна було перекласти чи знайти фільтром «Режими». Тепер усі
        джерела пишуть однакові позначки. Наявні ігри зберігають старі
        формулювання, доки ви не скрапнете їх знову або не запустите інструмент
        нормалізації в Налаштуваннях.</li>
      <li><strong>Пошук Xbox тепер поводиться як усі інші джерела.</strong>
        Він робив власні вебзапити, тож не мав повторної спроби, коли Xbox Live
        просив сповільнитися, і не мав обмеження на обсяг даних у відповіді.
        Тепер він використовує те саме спільне з'єднання, що й інші
        скрапери.</li>
      <li><strong>Невикористаний код ScreenScraper прибрано.</strong> Дві
        функції, які ніщо в застосунку не викликало, видалено. Одна з них
        повертала вебадресу з вашим паролем ScreenScraper усередині, тож
        передала б пароль будь-чому, що її використало. «System Media
        Endpoint», згаданий у нотатках до випусків 3.6.x, був однією з них
        &mdash; він ніколи не був доступний ніде в застосунку.</li>
    </ul>
