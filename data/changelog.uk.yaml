- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Застосування метаданих показує, наскільки воно просунулося
  body: |
    <ul>
      <li><strong>Застосування метаданих показує, наскільки воно
        просунулося.</strong> Коли ви вибираєте результат у вікні «Пошук
        метаданих», кільце заповнюється від 0 до 100 % з відсотком у центрі, а
        рядок під ним повідомляє, що відбувається: який сайт зараз опитується,
        яке зображення чи відео завантажується або що зображення обробляються.
        Велике завантаження, наприклад відео, рухає кільце в міру надходження
        даних. На 100 % сторінка, як і раніше, перезавантажується з
        результатом.</li>
      <li>Кільце може рухатися нерівномірно. Кожне джерело вирішує, скільки
        зображень надіслати, лише коли відповідає, тому перше джерело з
        великою кількістю зображень може заповнити значну частину кільця, а
        наступні — менше.</li>
      <li>Якщо застосування не вдалося, кільце закривається і з'являється
        повідомлення про це, без перезавантаження сторінки.</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Кожна сторінка тепер підлаштовується під своє вікно
  - type: enhancement
    label: Сторінка гри показує інші назви в окремій картці та має кнопку «Інструкція»
  body: |
    <ul>
      <li><strong>Кожна сторінка тепер підлаштовується під своє вікно.</strong>
        Сторінки з картками (Системи, Музей, Теги, Списки, Інструменти ROM,
        трофеї та досягнення) додають стовпець щоразу, коли вміщується ще одна
        ціла картка, &mdash; до чотирьох у ряд. Таблиці, інструменти та сторінки
        з подробицями трохи розширюються, але зупиняються там, де більша ширина
        лише розсунула б їхні стовпці. Налаштування зберігають для своїх блоків
        зручну для читання ширину.</li>
      <li><strong>Довідка та список змін зберігають зручну довжину
        рядка.</strong> У широкому вікні посилання на розділи Довідки
        переходять у стовпець поруч із текстом; у вузькому вони стоять в одному
        рядку, який можна гортати пальцем, замість блоку, що закривав значну
        частину екрана телефона.</li>
      <li><strong>Сторінка гри:</strong> у широкому вікні знімки екрана йдуть
        угорі, а під ними поруч стоять відео та нова картка <strong>Також
        відомо як</strong>, на рівні обкладинки. Інші назви раніше були блідим
        текстом під заголовком; тепер вони на картці, яку легко читати.
        <strong>Інструкція</strong> тепер кнопка поруч із «Грати», а «Історія
        скрапінгу» спочатку згорнута.</li>
      <li>«Трофеї PSN» показують від одного до чотирьох стовпців залежно від
        вікна, а не завжди три.</li>
      <li>Кілька сторінок більше не прокручуються вбік на телефоні: Трофеї,
        Трофеї колекціонера, сторінка системи RetroAchievements, Довідка,
        Налаштування, Аналітика, Імпорти ігор і сторінки з подробицями
        досягнень і трофеїв. Широкі таблиці там тепер прокручуються всередині
        себе.</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Сторінки Бібліотеки, систем та ігор тепер підлаштовуються під своє вікно
  body: |
    <ul>
      <li><strong>Сторінки використовують широке вікно, коли це допомагає, і
        лише тоді.</strong> Бібліотека та кожна сторінка системи додають
        стовпець карток ігор щоразу, коли вміщується ще одна ціла картка,
        &mdash; до чотирьох у ряд. Телефон показує одну, вікно на пів екрана
        &mdash; дві чи три, широке вікно &mdash; чотири. Раніше сторінки
        зупинялися на фіксованій ширині й залишали більшу частину великого вікна
        порожньою.</li>
      <li><strong>Сторінка гри ставить обкладинку та подробиці поруч зі
        знімками екрана й відео,</strong> коли вони вміщуються поруч, а інакше
        розташовує їх одне під одним. Опис зберігає зручну довжину рядка.</li>
      <li><strong>Кнопка «Грати» переїхала у верхній правий кут кожної
        картки,</strong> стала меншою і вирівняна по центру. Тепер вона ще й
        перевіряє, що файл ROM гри досі на місці й має тип, який приймає її
        система, тож з'являється лише там, де натискання справді запустить гру.
        Вона ховається, поки ви вибираєте ігри для масових дій.</li>
      <li>Кнопка «Наверх» і спливаючі вікна прогресу тепер розташовані одразу
        біля вмісту сторінки, а не на самих краях вікна.</li>
      <li>Сторінка гри більше не прокручується вбік на телефоні.</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: Тестову мову «Pseudo» пропонують лише адміністраторам
  body: |
    <ul>
      <li><strong>«Pseudo» більше не з'являється у списку мов для
        всіх.</strong> Це інструмент для розробників, який показує кожне слово
        в дужках і з діакритичними знаками, тому тепер його пропонують лише
        адміністраторам. Усі інші, хто її вибрав, бачать застосунок англійською,
        а в Налаштуваннях вибрано англійську.</li>
    </ul>
- version: 3.24.1
  date: '2026-10-17'
  tags:
  - type: fix
    label: Завантаження для Windows знову встановлюється, і після зміни розміру вікна немає потоку помилок
  body: |
    <ul>
      <li><strong>Звичайне завантаження для Windows не вдавалося
        встановити.</strong> Інсталятор зупинявся на повідомленні «Core
        dependencies failed to install», бо в його зафіксованому списку пакетів
        бракувало пакета, потрібного лише Windows. Тепер список охоплює всі
        платформи. Завантаження для Windows без Python це не зачепило.</li>
      <li><strong>У верхньому правому куті постійно з'являлися повідомлення про
        помилки</strong> в темі Cyberpunk після того, як вікно браузера ставало
        ширшим, наприклад після розгортання на весь екран. Анімований фон тепер
        змінює розмір без збоїв.</li>
    </ul>
- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Запускайте гру просто зі сторінок Бібліотеки та систем
  body: |
    <ul>
      <li><strong>Кнопка ▶ «Грати» на кожній картці гри.</strong> Вона
        з'являється в нижньому лівому куті обкладинки на сторінці Бібліотеки та
        на кожній сторінці системи. Натисніть її, і гра запуститься в
        емуляторі; ви залишаєтеся у списку, а не відкриваєте спершу сторінку
        гри.</li>
      <li>Кнопка показується лише там, де натискання може спрацювати: вашому
        обліковому запису дозволено запускати ігри, а емулятор гри увімкнено,
        встановлено і, для RetroArch, має своє ядро. Ігри систем без робочого
        емулятора кнопки не мають.</li>
      <li>Якщо запуск усе ж не вдається, наприклад тому, що файл ROM
        перемістили, причина з'являється в повідомленні, а сторінка лишається
        такою, як була.</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: Коротша бічна панель з однією сторінкою «Досягнення» для всіх платформ
  body: |
    <ul>
      <li><strong>Одне посилання «Досягнення» замінює п'ять.</strong>
        RetroAchievements, RPCS3, PSN, Steam і Xbox тепер є вкладками на одній
        сторінці, а посилання знову відкриває вкладку, якою ви користувалися
        востаннє. Якщо у вас немає ігор RetroAchievements, воно відкривається
        на вкладці RPCS3, а не повертає вас на Панель керування.</li>
      <li><strong>Звіти ROM тепер у розділі Інструменти ROM,</strong> як
        вкладка поруч з іншими інструментами та картка на сторінці Інструменти
        ROM.</li>
      <li><strong>Жодні два посилання бічної панелі не мають однакового
        значка:</strong> Панель керування тепер 🏠, а Перегляд журналу 🧾.
        У бічній панелі тепер 16 посилань замість 21.</li>
      <li>Вкладки інструментів на сторінці налаштувань Інструментів ROM завжди
        були англійською; тепер вони йдуть за вашою мовою.</li>
    </ul>
- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: Пошук How Long To Beat знову працює
  body: |
    <ul>
      <li><strong>Кожен пошук How Long To Beat повідомляв, що гру не
        знайдено.</strong> Сайт переніс свій пошук на нову адресу, тож запити
        RetroDB відхилялися; збій стався між кінцем липня та кінцем вересня.
        Тепер RetroDB використовує нову адресу й надсилає фільтри платформи та
        року в новому форматі сайту, бо старі сайт почав ігнорувати. Пошук для
        однієї гри та масовий пошук в Інструментах ROM знову працюють.</li>
    </ul>
- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: RetroDB тепер прямо каже, що не схвалює піратство
  - type: fix
    label: Вікно «Про програму» знову відкривається повного розміру
  body: |
    <ul>
      <li><strong>У застосунку тепер є повідомлення проти піратства.</strong>
        Воно з'являється у вікні «Про програму» та під «Шляхом до бібліотеки
        ROM» у Налаштуваннях, усіма мовами. У ньому сказано, що RetroDB не
        поширює й не зберігає файли ROM, що варто використовувати лише ігри,
        скопійовані з дисків і картриджів, якими ви володієте, і що RetroDB не
        пов'язаний із жодним виробником консолей, видавцем чи базою даних ігор.
        Формулювання збігається з вебсайтом і трейлером RetroDB.</li>
      <li><strong>Вікно «Про програму» було стиснуте в бічну панель.</strong>
        Тепер воно відкривається посередині екрана звичайного розміру, а на
        малому екрані прокручується, замість того щоб ховати свій заголовок і
        кнопку закриття.</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: RetroDB запускає та перейменовує лише справжні типи файлів ROM
  body: |
    <ul>
      <li><strong>Гру можна було запустити з файлом, який не є
        ROM.</strong> Перейменування ROM приймало будь-яку назву, тож
        <code>crash.bin</code> міг стати <code>crash.cfg</code>, і його
        передавали емулятору. Тепер під час запуску тип файлу перевіряється за
        списком у файлі <code>systeminfo.txt</code> папки цієї системи &mdash;
        тим самим списком, який використовує сканування бібліотеки, &mdash; а
        перейменування відмовляє, якщо типу немає в цьому списку. Якщо в папці
        системи немає списку, її ігри не запускатимуться, а повідомлення назве
        відсутній файл.</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: Лише адміністратор може змінювати аргументи запуску гри
  - type: fix
    label: Аргументи запуску з кількох слів або із зайвими лапками тепер працюють
  - type: fix
    label: RetroDB більше не тримає в пам'яті кожен завершений запуск
  body: |
    <ul>
      <li><strong>Редактор міг додати аргументи запуску, які запускали інший
        код.</strong> <em>Власні аргументи запуску</em> гри йдуть прямо до
        емулятора, а з RetroArch вони могли завантажити будь-який програмний
        файл на комп'ютері. Тепер для їх зміни потрібна роль адміністратора, а
        для всіх інших це поле приховане.</li>
      <li><strong>Аргументи запуску з кількох слів доходили до емулятора як
        одне.</strong> <code>--a --b</code> тепер надходить як два аргументи, а
        порожнє значення нічого не додає. Відсутня закривна лапка раніше ламала
        кожен запуск цієї гри помилкою сервера; тепер з'являється повідомлення,
        яке називає поле, що треба виправити. Мітку
        <code>{disc_paths}</code> прибрано: вона завжди була порожня.</li>
      <li><strong>Завершені запуски накопичувалися в пам'яті, доки RetroDB не
        перезапускали.</strong> Запуск, що завершився понад годину тому, тепер
        прибирається.</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: Вибір мови в Налаштуваннях знову працює
  body: |
    <ul>
      <li><strong>Вибір мови в Налаштування &rarr; Бібліотека &rarr;
        Відображення нічого не робив.</strong> Натомість з'являлася помилка, а
        сторінка лишалася старою мовою. Це зламалося у версії 3.23.8. Тепер
        вибрана мова зберігається, а сторінка перезавантажується цією
        мовою.</li>
    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: Значки трофеїв і платформ знову є в завантаженні
  body: |
    <ul>
      <li><strong>У завантаженні бракувало значків трофеїв і платформ
        RetroDB.</strong> Кожна картка гри з RetroAchievements показувала
        зламане зображення там, де мав бути її значок, а рівнів трофеїв і
        логотипів PSN, Steam, Xbox і RPCS3 теж не було. Тепер вони є в кожному
        завантаженні.</li>
    </ul>
- version: 3.23.14
  date: '2026-10-10'
  tags:
  - type: security
    label: Дві вбудовані бібліотеки оновлено заради опублікованих виправлень безпеки
  body: |
    <ul>
      <li><strong>urllib3 і Werkzeug мали відомі проблеми безпеки.</strong>
        Тепер RetroDB постачається з urllib3 2.8.0 і Werkzeug 3.1.9 &mdash;
        версіями, що їх виправляють. Встановлення з вихідного коду отримає їх,
        якщо знову запустити <code>install.py</code>, який встановлює пакети з
        <code>requirements.lock</code>.</li>
    </ul>
- version: 3.23.13
  date: '2026-09-26'
  tags:
  - type: fix
    label: Медіа, збережені як шлях до папки, більше не вважаються відсутніми
  body: |
    <ul>
      <li><strong>В автономній збірці «очищення посилань на відсутні медіа»
        могло стерти медіа, які насправді були на місці.</strong> Так
        траплялося, коли база даних зберігала медіа як шлях до папки, наприклад
        <code>images/boxart/…</code>, а не просто як назву файлу. Тепер RetroDB
        шукає їх у правильній папці.</li>
    </ul>
- version: 3.23.12
  date: '2026-09-26'
  tags:
  - type: fix
    label: Панель керування показує масовий скрапінг, що триває, плюс чотири дрібні виправлення
  body: |
    <ul>
      <li><strong>Картка прогресу скрапінгу на Панелі керування ніколи не
        з'являлася.</strong> Тепер вона показується, поки триває масовий
        скрапінг, і повідомляє, коли його призупинено.</li>
      <li><strong>Більше жодних помилок у консолі браузера на сторінці
        входу.</strong> Вона більше не перевіряє фонові завдання, доки ніхто не
        ввійшов.</li>
      <li><strong>Майстер налаштування більше не пише «Налаштування
        завершено!», якщо зберегти не вдалося.</strong> Тепер він повідомляє,
        що налаштування не вдалося зберегти.</li>
      <li><strong>Два масові скрапінги, запущені в ту саму секунду, більше не
        мають спільного ідентифікатора</strong>, тож дії в черзі, як-от
        скасування, застосовуються до правильного.</li>
    </ul>
- version: 3.23.11
  date: '2026-09-26'
  tags:
  - type: ui
    label: Кнопки пожертв тепер кажуть, що саме вони підтримують
  body: |
    <ul>
      <li><strong>Зрозуміліші формулювання щодо пожертв.</strong> Кнопки в
        заголовку тепер мають написи «Sponsor RetroDB» і «Support RetroDB».
        У README сказано, що кожен випуск безкоштовний і що пожертви
        фінансують сам RetroDB, а не емулятори та ядра, які він може
        запускати.</li>
    </ul>
- version: 3.23.10
  date: '2026-09-26'
  tags:
  - type: fix
    label: Сторінки Інструментів ROM враховують збережені налаштування, а сторінки журналів та Інструментів ROM знову працюють
  body: |
    <ul>
      <li><strong>Сторінка журналів і деякі сторінки Інструментів ROM були
        зламані.</strong> Скрипт на цих сторінках давав збій під час
        завантаження, тож перегляд журналу та спільні помічники Інструментів ROM
        так і не запускалися. Тепер вони завантажуються належно.</li>
      <li><strong>Налаштування Інструментів ROM тепер діють.</strong> Пошук
        дублікатів і Конвертер CHD відкриваються з параметрами, заданими на
        сторінці налаштувань Інструментів ROM, і ви все одно можете змінити їх
        для одного запуску.</li>
      <li><strong>Перемикачі Конвертера CHD ігнорувалися.</strong> Якщо
        вимкнути на сторінці «Видалити оригінальні файли», видалення все одно
        відбувалося, коли ваше збережене налаштування казало видаляти. Тепер
        вирішують перемикачі на сторінці.</li>
      <li><strong>Налаштування тимчасового шляху використовується.</strong>
        Файли, які проміжно зберігаються під час створення плейлистів M3U,
        тепер потрапляють туди.</li>
    </ul>
- version: 3.23.9
  date: '2026-09-26'
  tags:
  - type: security
    label: Журнали скраперів більше не зберігають паролі й токени, а спроби входу знову обмежено
  - type: fix
    label: Збереження налаштувань більше не стирає ваші налаштування, а видалення користувача працює
  body: |
    <ul>
      <li><strong>Файли журналів зберігали секрети відкритим текстом.</strong>
        Журнали скраперів мали приховувати токени входу та ключі API, але крок
        приховування ніколи не виконувався, тож їх записували повністю. Тепер
        їх приховано. Старіші файли журналів досі їх містять; видаліть старі
        файли в <code>logs/</code>, якщо ви ділитеся своїм встановленням.</li>
      <li><strong>Обмеження спроб входу не діяли.</strong> Обмеження на
        повторні входи та на важкі дії (сканування, скрапінг, імпорт) були
        налаштовані, але так і не ввімкнені. Тепер вони працюють, а
        заблокований запит отримує зрозуміле повідомлення «забагато
        запитів».</li>
      <li><strong>Пошкоджений файл налаштувань міг бути стертий.</strong> Якщо
        <code>data/settings.json</code> не вдавалося прочитати, наступне
        збереження замінювало його типовими значеннями. Тепер перед збереженням
        RetroDB зберігає пошкоджений файл як
        <code>settings.json.corrupt-&lt;time&gt;</code>. Якщо файл знову
        читається нормально, збереження натомість відхиляється.</li>
      <li><strong>Рядок найменування «Рушій» втрачав інші налаштування.</strong>
        Додавання тегу до рядка «Рушій» у налаштуваннях найменування не
        вдавалося, а ще викидало збережені разом із ним налаштування артиклів і
        регіону. Тепер він зберігається належно.</li>
      <li><strong>Видалення користувача не вдавалося.</strong> Користувача з
        тегами, списками, елементами списку бажань або даними PSN не можна було
        видалити. Тепер видалення прибирає користувача та все, що йому
        належить.</li>
      <li><strong>Два скрапінги могли йти одночасно.</strong> Обмін місцями
        або переміщення масового скрапінгу, що триває, у черзі запускало два
        скрапінги зі спільним лічильником прогресу. Тепер працює лише
        один.</li>
      <li><strong>Прогрес масового скрапінгу міг виглядати як помилка.</strong>
        До першого успіху масовий скрапінг повідомляв свій стан так, що деякі
        екрани сприймали це як збій. Це виправлено.</li>
      <li><strong>Після входу ви тепер повертаєтеся на сторінку, яку
        запитували.</strong> Раніше вхід завжди вів на Панель керування.</li>
      <li><strong>Файлові дії адміністратора не виходять за межі ваших
        папок.</strong> Інструмент зміни розміру зображень і дії
        перейменування ROM тепер відмовляють у всьому, що поза вашою папкою
        медіа або папкою ROM.</li>
      <li><strong>Старі файли входу PSN і Xbox переносяться у ваш обліковий
        запис.</strong> Залишений <code>data/psn_tokens.json</code> або
        <code>data/xbox_tokens.json</code> завантажується у ваш обліковий запис
        і перейменовується із закінченням <code>.migrated-015</code>. Цей файл
        досі містить токен, тож видаліть його, щойно перевірите, що вхід
        працює.</li>
      <li><strong>Зрозуміліші помилки від сервера.</strong> На хибний запит
        тепер надходить належне повідомлення про помилку замість «Сталася
        внутрішня помилка».</li>
    </ul>
- version: 3.23.8
  date: '2026-09-25'
  tags:
  - type: fix
    label: Імпорт CLZ знову працює, обкладинки списків показуються, а кілька сторінок більше не ламаються через апостроф
  - type: security
    label: Скрапнуті назви та шляхи до файлів більше не можуть вирватися за межі кнопок сторінки
  body: |
    <ul>
      <li><strong>Імпорт CLZ нічого не робив.</strong> Завантажений PDF із CLZ
        надсилався на адресу, якої на сервері немає, тож кожне завантаження
        завершувалося помилкою «Parse failed». Тепер він потрапляє до
        обробника.</li>
      <li><strong>На сторінці списку не було жодної обкладинки.</strong>
        Сторінка списку запитувала кожну обкладинку за хибною адресою, а
        стовпець «Система» завжди був порожній. Тепер показується і те, і те.
        Обкладинки в пошуку «додати гру» на цій сторінці теж виправлено.</li>
      <li><strong>Кнопки ламалися на назвах з апострофом.</strong> Видалення
        «Assassin's Creed» зі списку, видалення знімка екрана, збільшення
        обкладинки чи видалення тегу жанру могли непомітно нічого не зробити,
        якщо назва містила апостроф. Та сама вада дозволяла спеціально
        підготовленій скрапнутій назві виконати код на сторінці. Тепер назви
        передаються цим кнопкам так, що їх неможливо сприйняти як код.</li>
      <li><strong>Адреси зображень і посилань тепер екрануються
        всюди.</strong> Кілька сторінок будували адреси зображень зі скрапнутих
        назв файлів без екранування, а п'ять сторінок мали власну слабшу копію
        допоміжної функції екранування. Тепер усі вони використовують
        спільну.</li>
      <li><strong>Сторінка Налаштувань могла відкриватися порожньою.</strong>
        Якщо вкладку, якою ви користувалися востаннє, оновлення
        перейменувало, Налаштування відкривалися без жодної видимої панелі.
        Тепер вкладка, якої більше не існує, ігнорується. Посилання на кшталт
        <code>/settings#account</code> знову відкривають свою вкладку.</li>
      <li><strong>Ваша тема тепер переходить із вами на інші пристрої.</strong>
        Вибрана тема зберігається у вашому обліковому записі. Браузер, якому ще
        ніколи не задавали тему, використовує вашу збережену замість
        типової.</li>
      <li><strong>Спливаючі вікна прогресу завдань показують правильний
        значок.</strong> Призупинені, завершені та поставлені в чергу завдання
        показували той самий значок «виконується». Тепер кожен стан має власний,
        для кожної теми.</li>
      <li><strong>Список клавіатурних скорочень тепер можна
        перекласти.</strong> Його написи були невидимі для інструментів
        перекладу, тож лишалися англійською в кожній мові.</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: Вікові рейтинги часто були хибними, а скрапнуті ігри могли втрачати свої подробиці
  body: |
    <ul>
      <li><strong>Вікові рейтинги часто були хибними, і помилка
        поширювалася.</strong> Коли рейтинг надходив із TheGamesDB, застосунок
        шукав код рейтингу будь-де в тексті замість того, щоб прочитати його
        правильно &mdash; тож «T - Teen», «M - Mature 17+», «AO - Adults Only
        18+» і «RP - Rating Pending» зберігалися з хибним рейтингом, і гру для
        дорослих могли записати як придатну для всіх. Гірше того, цей хибний
        рейтинг потім використовувався для заповнення восьми інших систем
        рейтингів, тож одне хибне прочитання поширювалося на всі. Тепер рейтинг
        читається з коду на початку тексту.</li>
      <li><strong>Перетворені рейтинги виходили надто м'якими.</strong> Під
        час заповнення відсутнього рейтингу з наявного застосунок міг узяти
        рейтинг, який сам щойно обчислив, а не той, з якого ви насправді
        почали. Кожен такий крок трохи знижував суворість. Тепер він завжди
        перетворює з рейтингів, які гра справді має.</li>
      <li><strong>Повторний скрапінг стирав вибрані вручну Регіон і Тип
        збереження.</strong> Жоден із них не надходить від скрапера &mdash;
        застосунок обчислює їх сам &mdash; тож Повторний скрапінг замінював
        ваше ретельно вибране «Japan» типовим «USA». Тепер ваші значення
        зберігаються, якщо джерело справді не надає нового.</li>
      <li><strong>Скрапер міг прийняти не ту гру.</strong> Результати
        ScreenScraper зазвичай перевіряються за оцінкою збігу перед
        використанням, але пошук, що повертав рівно один результат, повністю
        пропускав цю перевірку. Тепер оцінюється кожен результат.</li>
      <li><strong>Гра могла втратити всі скрапнуті подробиці через одне
        відсутнє поле.</strong> Якщо IGDB або ScreenScraper залишали одне поле
        порожнім у несподіваний спосіб, усе оновлення відкидалося &mdash;
        видавець, розробник, зображення та все інше. Тепер ці випадки
        обробляються, а решта подробиць зберігається.</li>
      <li><strong>Невдале зображення могло бути записане як успіх.</strong>
        Якщо завантажена картинка виявлялася непридатним зображенням, застосунок
        нічого не видаляв і все одно зберігав назву файлу, залишаючи зламане
        посилання. Тепер файл видаляється, а поле лишається без змін.</li>
      <li><strong>Режими гри тепер мають однакові формулювання.</strong> Різні
        скрапери писали «Single-player» і «Single-Player», а також просто
        «Multiplayer», якого немає серед власних позначок застосунку, тож ці
        ігри не можна було перекласти чи знайти фільтром «Режими». Тепер усі
        джерела пишуть однакові позначки. Наявні ігри зберігають старі
        формулювання, доки ви не скрапнете їх знову або не запустите інструмент
        нормалізації в Налаштуваннях.</li>
      <li><strong>Пошук Xbox тепер поводиться як усі інші джерела.</strong>
        Він робив власні вебзапити, тож не мав повторної спроби, коли Xbox Live
        просив сповільнитися, і не мав обмеження на обсяг даних у відповіді.
        Тепер він використовує те саме спільне з'єднання, що й інші
        скрапери.</li>
      <li><strong>Невикористаний код ScreenScraper прибрано.</strong> Дві
        функції, які ніщо в застосунку не викликало, видалено. Одна з них
        повертала вебадресу з вашим паролем ScreenScraper усередині, тож
        передала б пароль будь-чому, що її використало. «System Media
        Endpoint», згаданий у нотатках до випусків 3.6.x, був однією з них
        &mdash; він ніколи не був доступний ніде в застосунку.</li>
    </ul>
- version: 3.23.5
  date: '2026-09-02'
  tags:
  - type: fix
    label: Пакетне завантаження не могло запуститися, та інші виправлення збірки
  body: |
    <ul>
      <li><strong>Автономне завантаження взагалі не могло
        запуститися.</strong> Пакетна збірка містить власний Python, але
        засіб запуску всередині неї був написаний для встановлення з вихідного
        коду &mdash; він шукав файли Python, яких у пакетній збірці немає, і
        зупинявся на першому ж рядку. Тепер пакет постачається з власним
        засобом запуску, який просто запускає застосунок і відкриває ваш
        браузер, щойно сервер запрацює.</li>
      <li><strong>Ярлик на робочому столі в завантаженні для Linux нічого не
        запускав.</strong> Він постачався з текстом-заповнювачем там, де мав
        бути шлях до застосунку. Тепер поруч із засобом запуску є
        <code>install-launcher.sh</code> &mdash; запустіть його один раз, і
        ярлик буде записано зі справжнім шляхом туди, куди ви його
        розпакували.</li>
      <li><strong>Запуск із вихідного коду встановлював неперевірені
        залежності.</strong> Коли Flask був відсутній, скрипт запуску
        завантажував пакети просто з інтернету без перевірки контрольних сум і
        ще й обходив системний менеджер пакетів. Тепер він передає роботу
        <code>install.py</code>, який використовує файл блокування з
        контрольними сумами.</li>
      <li><strong>Завантаження вихідного коду містило файли супровідника, яких
        там не мало бути.</strong> Список того, що слід виключити, вели вручну, і
        він відстав, тож результати аудиту та залишені теки збірки пакувалися
        разом із застосунком. Тепер завантаження збирається зі списку файлів,
        які справді є в проєкті, і цей список не може розійтися з
        дійсністю.</li>
      <li><strong>Дві панелі Налаштувань ламалися в пакетній збірці.</strong>
        Панелі статистики бібліотеки та стану API шукали головну програму за
        назвою, якої вона в пакетній збірці не має, тож обидві давали
        збій.</li>
      <li><strong>Частину тексту на екрані неможливо було перекласти.</strong>
        Три новіші частини застосунку &mdash; налаштування емуляторів, кнопка
        запуску та панель «зараз грає» &mdash; пропускалися скануванням для
        перекладу, а перевірка, яка мала це виявити, дивилася на той самий
        неповний список. Тепер сканування автоматично охоплює кожен файл, а
        їхній текст додано до перекладів.</li>
      <li><strong>Перебудова перекладів могла непомітно нічого не
        робити.</strong> Після додавання тексту до скрипту окремої сторінки
        перебудова вважала, що робити нічого, тож новий текст так і не потрапляв
        у файл перекладу.</li>
      <li><strong>Обхідне рішення для відеокарти застосовувалося до
        всіх.</strong> Скрипт запуску для Linux примусово вмикав налаштування,
        призначене для однієї конкретної карти AMD, на кожному комп'ютері, що
        могло спричиняти зависання засобу збільшення зображень на іншому
        обладнанні AMD. Тепер воно застосовується лише тоді, коли ця карта
        справді є, і ніколи не перекриває значення, яке ви задали самі.</li>
      <li><strong>Скрипт випуску міг опублікувати не ту версію.</strong>
        Залишений тег від попередньої спроби непомітно використовувався знову,
        тож збірку могли зробити зі старішого знімка, повідомивши при цьому про
        успіх.</li>
    </ul>
- version: 3.23.4
  date: '2026-09-02'
  tags:
  - type: fix
    label: Закрито дев'ять способів, якими ваша бібліотека могла втратити дані
  body: |
    <ul>
      <li><strong>«Очистити скрапнуті дані» очищало всю вашу
        бібліотеку.</strong> Вікно підтвердження рахувало лише ігри, які
        справді скрапили, а потім дія стирала всі ігри без винятку &mdash; тож
        вона могла пообіцяти дюжину й очистити тисячі. З увімкненими
        зображеннями вона також видаляла обкладинки, які ви завантажили вручну,
        і скидала назви, які ви відредагували самі, навіть в іграх, які ніколи
        не скрапили. Тепер вона робить саме те, що написано у вікні.</li>
      <li><strong>3D-обкладинка залишала по собі зламане посилання.</strong>
        Очищення разом із зображеннями видаляло 3D-обкладинку з диска, але база
        даних і далі на неї вказувала, тож застосунок шукав файл, якого вже не
        було.</li>
      <li><strong>Перемикач «Додати» в масовому редагуванні замінював замість
        додавання.</strong> Для Перспективи та Виміру він робив точно протилежне
        до свого напису, перезаписуючи наявні значення в усіх вибраних іграх
        одразу, без можливості скасувати.</li>
      <li><strong>Автономні збірки могли одним кліком стерти всі посилання на
        зображення.</strong> У пакетному завантаженні застосунок шукав ваші
        медіа не в тому місці, вирішував, що бракує кожного зображення, і тоді
        «очищення посилань на відсутні медіа» спорожняло записи обкладинок,
        знімків екрана, відео та інструкцій для всієї бібліотеки. Перевірка
        безпеки, яка існує саме для того, щоб це виявити, не могла цього
        побачити. Це стосувалося лише пакетної збірки.</li>
      <li><strong>Прибирання файлів-сиріт могло видаляти зображення щойно після
        їх появи.</strong> Обкладинку, завантажену під час прибирання, могли
        вважати сиротою й видалити.</li>
      <li><strong>Створення плейлистів переміщувало ваші архіви без
        запиту.</strong> Пакетне створення плейлистів M3U переміщувало ваші
        оригінальні архіви навіть тоді, коли цей параметр було вимкнено &mdash;
        а коли ви про це просили, повідомляло про збій переміщення, яке
        вдалося.</li>
      <li><strong>Засіб зміни розміру зображень роздував вашу папку
        медіа.</strong> Він вважав маленькі мініатюри, які сам створює, новими
        зображеннями для збільшення, розтягував їх до повного розміру, а потім
        робив із них мініатюри. Кожен запуск додавав більше файлів, сторінки
        непомітно віддавали повнорозмірні зображення замість мініатюр, а
        ШІ-збільшення обробляло приблизно втричі більше файлів, ніж мало.</li>
      <li><strong>Заповнення ШІ перезаписувало подробиці, які ви
        виправили.</strong> Під час звичайного скрапінгу воно могло замінити
        вашого власного видавця, розробника, жанр, вікові рейтинги тощо. Тепер
        воно лише заповнює порожні поля; кнопка «Заповнення ШІ», яку ви
        натискаєте самі, не змінилася.</li>
      <li><strong>Повторний скрапінг міг видалити хороший знімок
        екрана.</strong> Ігри, скрапнуті з RAWG, використовували ті самі назви
        файлів, тож другий скрапінг перезаписував збережений знімок екрана, а
        потім видаляв його як дублікат, хоча бібліотека й далі його
        показувала.</li>
    </ul>
- version: 3.23.3
  date: '2026-09-01'
  tags:
  - type: fix
    label: Ролі в домогосподарстві тепер роблять саме те, що заявлено, а вимкнений обліковий запис справді заблоковано
  body: |
    <ul>
      <li><strong>Деактивація користувача тепер завершує його сеанс.</strong>
        Вимкнення облікового запису ховало його з усіх екранів, але будь-хто,
        хто вже ввійшов у цей обліковий запис, міг нормально працювати ще до
        тижня. Деактивація &mdash; єдиний спосіб заблокувати когось, не
        видаляючи, тож тепер вона діє з першого ж його кліку.</li>
      <li><strong>Облікові записи лише для читання більше не можуть змінювати
        дані ігор.</strong> Три дії «How Long To Beat» були відкриті для
        кожного, хто ввійшов, зокрема для тих, хто має лише перегляд &mdash; тож
        обліковий запис лише для читання міг перезаписати час проходження або
        стерти його з усіх ігор бібліотеки. Тепер для них потрібні права на
        редагування, як і для кожної іншої дії, що змінює гру.</li>
      <li><strong>Відстеження трофеїв знову працює для всіх.</strong>
        Оновлення власних трофеїв колекціонера вимагало прав редактора, яких
        немає в ролей Гравець і Глядач &mdash; а це єдине, що записує ці
        трофеї. Такі облікові записи ніколи не могли їх здобути, а кнопка
        «Оновити» лише показувала помилку. Це ваш власний прогрес, тож тепер
        для нього не потрібні жодні особливі права.</li>
      <li><strong>Оновлення PlayStation однієї людини більше не може зупинити
        хтось інший.</strong> Будь-який обліковий запис, що ввійшов, міг
        призупинити або скасувати оновлення, яке запустив хтось інший, і
        бачити, на якій грі ця людина. Тепер обидві дії доступні лише тому, хто
        його запустив.</li>
      <li><strong>Імпорт Steam використовує ваш власний обліковий запис, а не
        того, хто першим зберіг свій.</strong> Імпорт бібліотеки читав одну
        спільну копію облікових даних Steam замість ваших, тож міг отримати
        чужу бібліотеку &mdash; а ваші збережені дані при цьому здавалися
        відсутніми.</li>
      <li><strong>Вгадати пароль адміністратора знову важко.</strong> Обмеження
        невдалих спроб входу було спільним для всіх у мережі, тож будь-хто з
        власним обліковим записом міг скинути його, увійшовши, і вгадувати
        далі без кінця. Тепер обмеження діє для кожного облікового запису
        окремо.</li>
      <li><strong>Помилки застосунку тепер доходять до сторінки, а не
        зникають.
        </strong> Коли дію відхиляли, 115 із них відповідали у формі, яку
        сторінка не могла прочитати, тож здавалося, що дія спрацювала. Тепер
        вони належно повідомляють про відмову, і ви бачите справжнє
        повідомлення.</li>
    </ul>
- version: 3.23.2
  date: '2026-08-06'
  tags:
  - type: fix
    label: Сторінки налаштувань скраперів завантажуються швидше й ніколи не показують застарілий ключ API
  body: |
    <ul>
      <li><strong>Сторінки Налаштування та конфігурації скраперів більше не
        перечитують файл налаштувань скраперів під час кожного запиту.</strong>
        Чотири місця відкривали й заново розбирали його з диска щоразу, коли
        працювала сторінка чи перевірка, хоча спільний засіб читання з кешем
        уже існував. Тепер усі вони користуються ним, тож ці сторінки
        виконують менше роботи за кожне відвідування.</li>
      <li><strong>Збереження, як і раніше, діє миттєво.</strong> Кеш, що
        забуває за таймером, міг би показувати вам старі значення до пів
        хвилини після збереження. Тепер кожне збереження очищає кеш під час
        запису, тож ви бачите саме те, що щойно зберегли.</li>
      <li><strong>Ваші справжні ключі API більше не можуть бути замінені їхнім
        власним замаскованим значенням.</strong> Сторінки налаштувань
        показують збережені ключі як <code>***1234</code>, а не справжнє
        значення. Оскільки сторінка отримувала ту саму копію налаштувань, що й
        скрапери, це маскування могло перезаписати справжні ключі в пам'яті, і
        скрапери входили б із зірочками, доки не мине термін дії кешу.</li>
      <li><strong>Автономні збірки тепер шукають налаштування скраперів у
        правильному місці.</strong> Скрапери визначали розташування файлу
        інакше, ніж сторінки, які його зберігають. У звичайному встановленні
        обидва шляхи вели до того самого файлу; в автономній збірці (запуск
        подвійним кліком) — ні, тож збережені ключі API могли потрапити туди,
        куди скрапери ніколи не заглядали.</li>
    </ul>
- version: 3.23.1
  date: '2026-08-06'
  tags:
  - type: fix
    label: Порт сервера, який ви зберігаєте в Налаштуваннях, тепер справді використовується
  body: |
    <ul>
      <li><strong>Збереження порту сервера справді переносить сервер.</strong>
        Налаштування приймали порт, перевіряли його, зберігали й казали вам, що
        для застосування потрібен перезапуск &mdash; а потім сервер однаково
        запускався на 5000. Значення ніхто ніколи не зчитував. Тепер воно є
        частиною ланцюжка запуску, тож перезапуск справді переносить RetroDB на
        вибраний вами порт. Значення із середовища, як і раніше, мають
        пріоритет, тож засіб запуску чи контейнер, що призначає порт, це не
        зачіпає.</li>
      <li><strong>Два налаштування, які ніколи нічого не робили, прибрано, а не
        виправлено.</strong> «Хост сервера» і «режим налагодження»
        зберігалися й давали ту саму хибну обіцянку. Увімкнення режиму
        налагодження з вебформи відкрило б інтерактивну консоль Python у
        браузері, а адреса прив'язки визначає, які комп'ютери взагалі можуть
        дістатися до RetroDB &mdash; жодне з них не має бути за формою
        налаштувань. Обидва й далі налаштовуються через середовище, де вони вже
        були. Якщо ваш файл налаштувань досі їх містить, вони тихо
        відкидаються під час завантаження; нічого робити не треба.</li>
      <li><strong>Тепер ніщо не обіцяє, що перезапуск щось застосує, якщо
        перезапуск цього не застосовує.</strong> Саме це було справжньою вадою
        &mdash; мертве налаштування лише неохайне, а хибна обіцянка марнує
        пів дня.</li>
    </ul>
- version: 3.23.0
  date: '2026-08-06'
  tags:
  - type: enhancement
    label: Запускайте RetroDB на порту, який вибрав хтось інший
  body: |
    <ul>
      <li><strong>RetroDB тепер читає налаштування <code>PORT</code> зі свого
        середовища.</strong> Якщо ви запускаєте RetroDB з іншого інструмента
        &mdash; панелі керування, контейнера, панелі домашнього сервера &mdash;
        цей інструмент тепер може передати RetroDB потрібний порт, і нікому не
        доведеться редагувати файл. Задайте <code>PORT</code>, і RetroDB
        прив'яжеться до нього; не чіпайте його, і нічого не зміниться.
        Наявний <code>RETRODB_PORT</code> працює точно так, як і раніше, а
        <code>PORT</code> має пріоритет, якщо задано обидва.</li>
      <li><strong>Хибний номер порту тепер так і повідомляється, а не
        вгадується.</strong> Раніше нечитабельний порт спричиняв стіну тексту
        помилок Python, а порт поза допустимим діапазоном виявлявся лише тоді,
        коли сервер не міг запуститися. Тепер RetroDB одразу зупиняється з
        одним рядком, що називає значення, яке не вдалося використати. Він
        ніколи тихо не запуститься на іншому порту, ніж той, про який його
        просили, &mdash; бути непомітно переміщеним гірше, ніж почути
        відмову.</li>
      <li><strong>Банер запуску та вкладка браузера тепер ідуть за справжнім
        портом.</strong> Адреса, яку RetroDB виводить під час запуску, і
        сторінка, яку він відкриває для вас, раніше завжди показували 5000,
        хоч який порт насправді використовувався.</li>
    </ul>
- version: 3.22.1
  date: '2026-07-31'
  tags:
  - type: fix
    label: Робочий файл бази даних більше не росте без обмежень
  body: |
    <ul>
      <li><strong>Журнал бази даних знову має межу.</strong> SQLite зберігає робочий файл (файл <code>-wal</code>) поруч із базою даних вашої бібліотеки. RetroDB мав обмежити його до 64&nbsp;МБ, але обмеження діяло лише для фонових завдань &mdash; звичайні завантаження сторінок і редагування працювали взагалі без межі. Після одного незвично великого запису файл назавжди лишався максимального розміру, іноді більшого за саму базу. Тепер межа діє всюди, тож місце повертається.</li>
    </ul>
- version: 3.22.0
  date: '2026-07-05'
  tags:
  - type: enhancement
    label: Скрапте гру одразу з її спливаючого вікна, без зайвого кроку
  body: |
    <ul>
      <li><strong>Скрапінг зі спливаючого вікна гри.</strong> Швидке спливаюче
        вікно гри (те, що з'являється, коли ви клацаєте гру у своїй Бібліотеці)
        тепер має кнопку <strong>Скрапити</strong> поруч із «Заповнення&nbsp;ШІ»
        та «Редагувати». Клацніть її, і RetroDB одразу перенесе вас до цієї гри
        з уже відкритим пошуком метаданих &mdash; більше не потрібно відкривати
        повну сторінку та шукати кнопку «Скрапити».</li>
    </ul>
- version: 3.21.0
  date: 2026-07-05
  tags:
  - type: feature
    label: Запуск одним кліком — запускайте RetroDB із закріпленого значка, без терміналу
  - type: feature
    label: Справжня іконка застосунку — неоновий геймпад у вкладці браузера та на панелі задач
  - type: feature
    label: Нова кнопка «Вимкнути сервер» на сторінці Налаштувань
  body: |
    <ul>
      <li><strong>Запуск одним кліком.</strong> Тепер RetroDB має повноцінний
        засіб запуску, який можна закріпити на панелі задач &mdash; клацніть
        його, і застосунок запуститься (якщо він ще не працює) та автоматично
        відкриється у вашому браузері. Більше не потрібно відкривати термінал і
        вводити команду. У Linux один раз виконайте
        <code>python3 scripts/install_launcher.py</code>, щоб додати
        &ldquo;RetroDB&rdquo; до меню застосунків, а потім закріпіть його.</li>
      <li><strong>Справжня іконка застосунку.</strong> Тепер RetroDB має іконку
        неонового геймпада &mdash; кіберпанковий блакитний і пурпуровий на темній
        плитці &mdash; у вкладці браузера (favicon), на засобі запуску панелі
        задач і на самій програмі Windows. Вона замінює простий
        емодзі-заповнювач.</li>
      <li><strong>Кнопка «Вимкнути сервер».</strong> У розділі «Керування
        сервером» на сторінці Налаштувань тепер є червона кнопка
        <strong>Вимкнути сервер</strong> поруч із «Перезапустити». Вона коректно
        зупиняє застосунок (спершу дозволяючи всім запущеним завданням завершити
        збереження), тож більше не потрібно перемикатися на термінал і натискати
        Ctrl+C.</li>
      <li><strong>Завантажувані збірки відкривають браузер за вас.</strong>
        Готові до запуску завантаження для Windows, Mac і Linux тепер відкривають
        ваш браузер за мить після запуску, тож застосунок опиняється перед вами
        без жодного додаткового кроку.</li>
    </ul>
- version: 3.20.0
  date: 2026-07-05
  tags:
  - type: feature
    label: Одинадцять нових мов — RetroDB тепер розмовляє 21 мовою
  - type: fix
    label: 'Виправлено нешкідливу помилку в консолі під час виходу зі списку ігор'
  body: |
    <ul>
      <li><strong>Одинадцять нових мовних пакетів.</strong> Інтерфейс
        RetroDB, нотатки про випуски та посібник довідки тепер перекладені
        на <strong>Afrikaans, isiZulu, isiXhosa, Dutch, Norwegian
        (Bokm&aring;l), Russian, Polish, Turkish, Ukrainian, Indonesian
        та Hebrew</strong> &mdash; на додачу до вже наявних German, Spanish,
        French, Italian, Japanese, Korean, Brazilian Portuguese та Simplified
        &amp; Traditional Chinese. Оберіть свою мову в розділі Налаштування
        &rarr; Параметри відображення &rarr; Мова; застосунок
        перезавантажиться обраною мовою.</li>
      <li>Кожна мова охоплює весь застосунок цілком: кожну кнопку, підпис і
        повідомлення, повну історію нотаток про випуски та повний посібник
        довідки.</li>
      <li><strong>isiZulu &amp; isiXhosa</strong> також включені. Оскільки
        ці мови мають небагато усталеної технічної лексики, деякі терміни
        (ROM, scraper, box art) залишені англійською там, де немає
        природного відповідника &mdash; перш ніж покладатися на ці
        переклади, варто перевірити їх носієм мови.</li>
      <li><strong>Hebrew</strong> постачається з повністю перекладеним
        текстом; доопрацьоване розташування сторінки справа наліво (щоб
        інтерфейс правильно віддзеркалювався) з'явиться в одному з наступних
        оновлень. Arabic приєднається, щойно ця робота над розташуванням
        буде завершена.</li>
      <li><strong>Виправлення:</strong> під час виходу з Бібліотеки чи списку ігор системи в консолі браузера більше не з’являється нешкідлива &laquo;ReferenceError&raquo; (залишок попереднього прибирання коду). Видимих змін немає &mdash; лише чистіша консоль.</li>
    </ul>
- version: 3.19.1
  date: 2026-07-05
  tags:
  - type: performance
    label: Швидший скрапінг — скриншоти гри тепер завантажуються одночасно
  body: |
    <ul>
      <li><strong>Скриншоти завантажуються паралельно.</strong> За тим самим
        підходом, що й у популярному фронтенді ES-DE (який отримує всі
        медіафайли гри одночасно), RetroDB тепер завантажує скриншоти гри
        <strong>одночасно</strong>, а не один за одним, для кожного джерела
        (TheGamesDB, IGDB, RAWG, ScreenScraper). Ігри з кількома скриншотами
        завершуються помітно швидше.</li>
      <li>Перевірка на дублікати скриншотів, як і раніше, виконується після
        цього по черзі, тож точність видалення дублікатів зображень
        залишається такою самою, як і раніше &mdash; прискорилося лише саме
        завантаження. Завантаження обмежені чотирма одночасно, щоб жодне
        джерело не перевантажувалося.</li>
      <li>Покращення швидкості "під капотом"; набуває чинності після
        наступного перезапуску.</li>
    </ul>
- version: 3.19.0
  date: 2026-07-05
  tags:
  - type: performance
    label: Швидший скрапінг — джерела тепер опитуються одночасно
  body: |
    <ul>
      <li><strong>Скрапінг став швидшим для кожної гри.</strong> Коли
        RetroDB шукає гру, він перевіряє кілька баз даних (ES-DE, TheGamesDB,
        IGDB, RAWG, ScreenScraper). Раніше він опитував їх <em>по одній</em>
        і чекав на відповідь кожної, перш ніж звернутися до наступної
        &mdash; тож час очікування дорівнював сумі всіх запитів. Тепер він
        опитує їх усі <strong>одночасно</strong> і чекає лише на
        найповільнішу, що дає помітне прискорення для кожної гри. Результати,
        як і раніше, впорядковуються та оцінюються так само, як і до
        цього.</li>
      <li><strong>Менше зайвих з'єднань при завантаженні артів.</strong>
        Завантаження зображень тепер повторно використовують уже відкрите
        з'єднання замість того, щоб відкривати нове для кожного окремого
        зображення, що заощаджує час для ігор із великою кількістю
        скриншотів.</li>
      <li>Це вдосконалення швидкості "під капотом" &mdash; у тому, як ви
        користуєтеся RetroDB, нічого не змінюється, і навантаження на бази
        даних не зростає (ті самі запити, просто виконуються паралельно).
        Набуває чинності після наступного перезапуску.</li>
    </ul>
- version: 3.18.0
  date: 2026-07-05
  tags:
  - type: feature
    label: Додано китайські (Китай) вікові рейтинги як 9-ту систему класифікації
  body: |
    <ul>
      <li><strong>Нова система вікових рейтингів: Китай (CADPA).</strong>
        RetroDB тепер підтримує офіційну китайську схему вікових рекомендацій
        для ігор (&ldquo;网络游戏适龄提示&rdquo;, видану CADPA) поряд з
        наявними вісьмома системами (ESRB, PEGI, CERO, USK, ACB, FPB, GRAC і
        ClassInd). Вона використовує три рівні &mdash; <strong>8+</strong>,
        <strong>12+</strong> і <strong>16+</strong> &mdash; що
        відображаються простим зеленим значком.</li>
      <li><strong>Заповнюється сам, як і інші.</strong> Якщо гра вже має
        рейтинг з будь-якої іншої країни, RetroDB автоматично визначає
        відповідний китайський рівень (і навпаки). Ви також можете обрати чи
        змінити його вручну на екрані редагування гри та вибрати його як
        бажану систему відображення в розділі Налаштування &rarr;
        Бібліотека. Примітка: більшість західних баз даних ігор не
        публікують китайський рейтинг, тож для ігор без жодного рейтингу він
        визначається на основі вмісту гри під час скрапінгу / AI Fill.</li>
      <li>Зелені значки &mdash; це власна проста графіка RetroDB (що
        відповідає стилю інших систем), а не офіційний логотип CADPA, тож
        жодних обмежень щодо ліцензування зображень немає.</li>
    </ul>
- version: 3.17.0
  date: 2026-07-04
  tags:
  - type: feature
    label: Очищення записів бази даних для медіафайлів, яких немає на диску
  - type: security
    label: Захист від видалення всіх зображень бібліотеки, якщо папка з медіафайлами зникає
  body: |
    <ul>
      <li><strong>Новий інструмент обслуговування: &ldquo;Відсутні посилання
        на медіафайли&rdquo;</strong> (Налаштування &rarr; Система &rarr;
        Обслуговування). Це дзеркальне відображення наявного очищення
        &ldquo;Осиротілі медіафайли&rdquo;: замість пошуку зайвих файлів
        зображень без гри, він знаходить ігри, у яких обкладинка,
        3D-обкладинка, скриншоти, фан-арт, відео чи мануал вказують на
        файли, яких більше немає на диску. Виконайте пошук, а потім очистіть
        застарілі посилання одним клацанням, щоб скрапери могли завантажити
        арт знову. Самі записи ігор ніколи не змінюються.</li>
      <li><strong>Безпечніше автоматичне очищення під час скрапінгу.</strong>
        Коли RetroDB повторно скрапить гру, він непомітно очищує посилання
        на медіафайли, що зникли з диска. Раніше, якщо ціла папка з
        медіафайлами зникала одразу &mdash; наприклад, через відключення
        зовнішнього диска чи масове видалення &mdash; це очищення могло
        стерти інформацію про арт для тисяч ігор, змушуючи виконувати дорогі
        повторні скрапінги. Тепер RetroDB розпізнає цей сигнал: якщо папка з
        медіафайлами відсутня або повністю порожня, він зберігає посилання
        та записує попередження в журнал замість їх видалення. Новий
        інструмент обслуговування застосовує той самий захист і чітко
        позначає будь-яку папку, яку він зберіг.</li>
    </ul>
- version: 3.16.0
  date: 2026-07-04
  tags:
  - type: feature
    label: Нова панель "Швидкі виправлення" на панелі приладів
  body: |
    <ul>
      <li><strong>Нова панель &ldquo;Швидкі виправлення&rdquo; на панелі
        приладів</strong> перетворює розрізнені завдання з обслуговування
        бібліотеки на список справ, який видно одразу. Вона показує, скільки
        ігор досі не мають обкладинки, і надає ярлики в один клік для пошуку
        дублікатів ROM та перевірки непрацюючих шляхів ROM (ігор, файли яких
        було переміщено чи видалено). Кожен ярлик веде безпосередньо на
        сторінку, де можна це виправити. Панель з'являється, щойно у вашій
        бібліотеці з'являються ігри.</li>
    </ul>
- version: 3.15.0
  date: 2026-07-03
  tags:
  - type: accessibility
    label: Програми зчитування з екрана тепер озвучують прогрес виконання завдань
  body: |
    <ul>
      <li><strong>Тривалі завдання тепер озвучують свій прогрес для програм
        зчитування з екрана.</strong> Під час масового скрапінгу,
        синхронізації досягнень (RetroAchievements чи PlayStation) або зміни
        розміру зображень користувачі програм зчитування з екрана раніше не
        чули нічого між &ldquo;розпочато&rdquo; і &ldquo;завершено&rdquo;.
        Тепер RetroDB озвучує періодичні етапи (наприклад, &ldquo;Масовий
        скрапінг: 12 з 40&rdquo;) та голосове повідомлення про завершення
        &mdash; без жодних додаткових спливаючих вікон на екрані. Оголошення
        розподілені в часі так, щоб інформувати, не набридаючи, і
        відповідають обраній вами мові.</li>
    </ul>
- version: 3.14.0
  date: 2026-07-01
  tags:
  - type: feature
    label: Нові мови — китайська (спрощена та традиційна) тепер доступна
  body: |
    <ul>
      <li><strong>RetroDB тепер доступний китайською мовою.</strong> Два
        варіанти розташовані в розділі <strong>Налаштування &rarr; Система
        &rarr; Мова</strong>: <strong>中文 (简体)</strong> (спрощена, для
        материкового Китаю) і <strong>中文 (繁體)</strong> (традиційна, для
        Гонконгу та Тайваню). Весь інтерфейс &mdash; меню, кнопки,
        повідомлення та вбудований посібник довідки &mdash; перекладено, а
        все, що ще не перекладено, непомітно повертається до англійської. Це
        доводить кількість підтримуваних мов до десяти (англійська, німецька,
        іспанська, французька, італійська, японська, бразильська
        португальська, корейська, а тепер і спрощена та традиційна
        китайська).</li>
    </ul>
- version: 3.12.0
  date: 2026-06-30
  tags:
  - type: feature
    label: Нова мова — корейська (한국어) тепер доступна
  body: |
    <ul>
      <li><strong>RetroDB тепер доступний корейською мовою (한국어).</strong>
        Виберіть її в розділі Налаштування &rarr; Система &rarr; Мова. Весь
        інтерфейс &mdash; меню, кнопки, повідомлення та вбудований посібник
        довідки &mdash; перекладено, що доводить кількість підтримуваних мов
        до восьми (англійська, німецька, іспанська, французька, італійська,
        японська, бразильська португальська та корейська). Корейська
        завершує покриття для кожної системи вікових рейтингів ігор, яку
        відображає RetroDB, включно з південнокорейською GRAC.</li>
    </ul>
- version: 3.11.0
  date: 2026-06-30
  tags:
  - type: enhancement
    label: Підтримайте RetroDB на Patreon — додано нове посилання для пожертв
  body: |
    <ul>
      <li><strong>Тепер ви можете підтримати RetroDB на Patreon.</strong>
        Посилання на Patreon розташоване поруч із наявною кнопкою
        &ldquo;Стати спонсором на GitHub&rdquo; у розділі
        <strong>Налаштування &rarr; Система &rarr; Підтримати
        розробку</strong>, на панелі "Про програму" та у файлі README
        проєкту. RetroDB залишається повністю безкоштовним і з відкритим
        кодом &mdash; пожертви абсолютно необов'язкові й просто допомагають
        підтримувати розробку одним розробником.</li>
    </ul>
- version: 3.10.0
  date: 2026-06-26
  tags:
  - type: enhancement
    label: Журнал змін тепер завантажується швидше завдяки кнопці "Завантажити ще"
  body: |
    <ul>
      <li><strong>Сторінка журналу змін тепер відкривається набагато
        швидше.</strong> Замість того, щоб щоразу відображати всю історію
        випусків (сотні записів), RetroDB тепер показує 20 останніх записів
        і додає кнопку <strong>Завантажити ще</strong> внизу. Натисніть на
        неї, щоб показати наступну партію, і так далі &mdash; старіша
        історія все ще там, вона просто завантажується за потреби, а не
        сповільнює перше відображення.</li>
    </ul>
- version: 3.9.0
  date: 2026-06-17
  tags:
  - type: feature
    label: Посібник довідки та останні нотатки випусків тепер перекладені всіма 6 мовами
  body: |
    <ul>
      <li><strong>Повний вбудований посібник довідки тепер доступний усіма
        шістьма мовами</strong> &mdash; німецькою, французькою, іспанською,
        італійською, японською та бразильською португальською &mdash; а не
        лише англійською. RetroDB показує посібник тією мовою, яку ви обрали
        в Налаштуваннях, і непомітно повертається до англійської, якщо щось
        ще не перекладено.</li>
      <li><strong>Цей журнал змін тепер також з'являється вашою
        мовою</strong> для найновіших випусків, а нові випуски
        перекладатимуться з цього моменту. Старіша історія залишається
        англійською.</li>
      <li><strong>Сторінка списку бажань і останні залишки англійського
        тексту</strong> &mdash; партія спливаючих повідомлень про помилки та
        статус, які були пропущені, коли мовні пакети вперше з'явилися у
        версії 3.8.0 &mdash; тепер коректно перекладаються по всьому
        додатку.</li>
    </ul>
- version: 3.8.2
  date: 2026-06-17
  tags:
  - type: security
    label: Оновлення залежності безпеки + виправлення CI
  body: |
    <ul>
      <li><strong>Безпека:</strong> оновлено вбудовану бібліотеку
        <code>cryptography</code> (47 → 49), щоб усунути опубліковану
        вразливість (GHSA-537c-gmf6-5ccf). Жодних змін у поведінці &mdash;
        лише безпечніша версія.</li>
      <li>Виправлено конвеєр автоматизованого тестування: відсутній
        допоміжний пакет, потрібний лише для тестів
        (<code>beautifulsoup4</code>), призводив до збою тестового запуску з
        версії v3.7.0, а новий скрипт збірки пакування спричиняв
        спрацювання перевірки статичного аналізу, яка є відомим хибним
        спрацюванням (він виконує довірені команди збірки, а не введені
        користувачем дані) &mdash; тепер це задокументовано та
        відкалібровано. Лише обслуговування; у самому додатку нічого не
        змінюється.</li>
    </ul>
- version: 3.8.1
  date: 2026-06-17
  tags:
  - type: improvement
    label: Менший варіант завантаження, впорядкування пожертв і виправлення перекладу (Pass 46.3 / 47.6)
  body: |
    <ul>
      <li><strong>Незабаром з'явиться значно менше завантаження.</strong>
        Готова до запуску версія RetroDB "просто розпакуй і клацни двічі"
        тепер може збиратися у варіанті <strong>тільки для CPU</strong>
        (~600&nbsp;МБ) для тих, хто не має відеокарти AMD &mdash; це
        приблизно одна шоста розміру повної версії. Обидва варіанти
        пропонуватимуться поруч, щоб ви могли обрати той, що підходить
        вашому комп'ютеру.</li>
      <li><strong>Панель "Підтримати розробку" в Налаштуваннях тепер
        перекладається</strong> разом з рештою додатку &mdash; вона була
        випадково залишена англійською, коли мовні пакети з'явилися у версії
        3.8.0.</li>
      <li>Впорядковано посилання на пожертви (значок GitHub Sponsors у
        README; файл фінансування готовий для Patreon і
        Buy&nbsp;Me&nbsp;A&nbsp;Coffee, щойно вони будуть налаштовані).
        Жодних нав'язливих спливаючих вікон, ніколи.</li>
      <li>За лаштунками: конвеєр випуску тепер може автоматично збирати
        готові до запуску версії для Windows, macOS і Linux. Примітка:
        об'ємний вбудований посібник <em>Довідка</em> наразі все ще
        доступний лише англійською &mdash; це занесено до планів на
        майбутнє.</li>
    </ul>
- version: 3.8.0
  date: 2026-06-12
  tags:
  - type: feature
    label: Повний переклад інтерфейсу + 6 мов (Pass 43.2/43.3/43.5)
  body: |
    <ul>
      <li><strong>RetroDB тепер розмовляє ще 6 мовами.</strong> На основі
        фундаменту, закладеного у версії 3.7.0, весь інтерфейс було зроблено
        придатним для перекладу та машинно перекладено <strong>німецькою,
        французькою, іспанською, італійською, японською та бразильською
        португальською</strong>. Оберіть свою мову в розділі Налаштування
        &rarr; Параметри відображення &rarr; Мова; вона слідує вашому
        збереженому вибору, потім мові браузера, а потім повертається до
        англійської &mdash; вона ніколи не може &ldquo;застрягти&rdquo; на
        відсутній мові.</li>
      <li><strong>Охоплено все, що є на екрані</strong>: текст сторінок і
        кнопки, спливаючі повідомлення (маленькі сповіщення "toast"),
        діалогові вікна редагування та налаштувань, підказки та мітки для
        програм зчитування з екрана. Жанри ігор, перспективи та режими гри
        (наприклад, &ldquo;First-Person-Shooter&rdquo;) тепер також
        показуються вашою мовою &mdash; тоді як базові дані залишаються
        англійською, тож ваша бібліотека та фільтри продовжують працювати
        точно так само, як і раніше.</li>
      <li>Вбудована <strong>мова &ldquo;Pseudo&rdquo;</strong> (видима в
        меню вибору мови) &mdash; це інструмент контролю якості для
        перекладачів, який бере в дужки та додає діакритику до кожної мітки,
        роблячи миттєво очевидним будь-який пропущений текст.</li>
      <li>Машинні переклади &mdash; це лише відправна точка і місцями
        можуть звучати трохи неприродно &mdash; їх легко вдосконалювати з
        часом, а будь-який неперекладений текст просто показується
        англійською.</li>
    </ul>
