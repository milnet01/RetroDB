    label: Full reskraping erstatter ikke lenger en aldersgrense eller kontroller du har satt med et gjett, og en skraping som feiler underveis skriver ikke lenger via en mindre nøye rute
  body: "<ul>\n  <li><strong>AI-svar sier at de er AI.</strong> Aldersgrenser fra AI\n    beholdes, merket som et gjett basert på innholdet i spillet, med året hvert\n    klassifiseringsorgan startet. Scorer og salgstall fra AI er også merket.</li>\n  <li><strong>RetroAchievements viser riktig spill.</strong> Oppfølgere har ikke\n    lenger det første spillets prestasjoner. Etter oppdateringen tilbyr\n    dashbordet én gang en RetroAchievements-oppdatering. Trykk på den for å reparere\n    gamle lenker. Fremdrift lagret under en feil lenke fjernes, og neste\n    synkronisering fyller den inn igjen.</li>\n  <li><strong>Totalene for spilletid stemmer.</strong> Tider under én time ble\n    regnet som timer, så totalene på dashbordet og samlertrofeene var for høye.\n    Noen totaler og trofeer vil gå ned.</li>\n  <li><strong>HowLongToBeat finner riktig spill.</strong> En oppfølger blir ikke lenger\n    tatt for spillet du har, og systemet og året til spillet teller nå.\n    Et treff på et annet system, eller fra flere år senere, venter på deg på\n    gjennomgangssiden.</li>\n  <li><strong>Sjekk det som allerede er lagret.</strong> Trykk på Sjekk lagrede spilletider\n    i ROM-verktøy for å sende tvilsomme lagrede treff til gjennomgangssiden.\n    Ingenting endres før du bestemmer deg.</li>\n  <li><strong>Serienavn er ekte.</strong> Serien til et spill kommer ikke lenger\n    fra å dele opp tittelen. Etter oppdateringen fjernes serienavn som var\n    gjettet, også noen som var riktige. Neste skraping\n    fyller dem ut fra kilder som oppgir en serie.</li>\n  <li><strong>Ren tekst.</strong> Beskrivelser viser ikke lenger webkoder eller\n    overskriftstegn. Ett selskap har én stavemåte, et spill har én region, og\n    filnavn som dosbox.exe listes ikke lenger som andre titler. Dette\n    skjer én gang, av seg selv, etter oppdateringen.</li>\n  <li><strong>Full reskraping beholder valgene dine.</strong> En aldersgrense eller\n    kontroller du har satt, beholdes med mindre en kilde faktisk oppgir en.</li>\n</ul>\n"
