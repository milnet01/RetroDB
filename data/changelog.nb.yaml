    label: På 8-bits og 16-bits systemer legger skraping ikke lenger til IGDB- eller RAWG-skjermbilder på et spill utgitt på flere systemer, siden de kunne vise en annen systemversjon
  - type: fix
    label: Et spills emulator står nå på kortet for Emulator-innstillinger, ikke ved siden av Spill
  body: "<ul>\n  <li><strong>Hver skraper søker på riktig konsoll.</strong> Atari\n    Lynx, arcade CPS, Super Famicom og andre ble søkt på feil\n    maskin, og mange flere systemer blir nå søkt på i det hele tatt,\n    av alle kilder og for prestasjoner.</li>\n  <li><strong>Et spills region kommer først fra eget filnavn.</strong>\n    En merkelapp som (USA) avgjør nå regionen, og AI-en blir ikke lenger\n    spurt. ROM-verktøy har et nytt verktøy, Fiks regioner fra filnavn,\n    for spillene som eldre skrapinger fikk feil.</li>\n  <li><strong>ScreenScraper følger spillets region.</strong> Eske,\n    3D-eske, manual, tittel og utgivelsesdato kommer nå fra spillets egen\n    region, ikke den som kom først i alfabetet. ROM-verktøy har et\n    nytt verktøy, Fiks eske- og manualregioner, for eldre skrapinger.\n    Videoer prøver nå den minste filen først.</li>\n  <li><strong>RAWG-bilder er ikke lenger esketrekk.</strong> De er ofte\n    skjermbilder, og de blokkerte et ekte cover. Nå brukes de som\n    fankunst. ROM-verktøy har et nytt verktøy, Fjern RAWG-bilder fra\n    esketrekk, for de eldre skrapinger har lagret. RetroDB krediterer også\n    RAWG med en lenke i sidefeltet, slik RAWG ber om.</li>\n  <li><strong>ES-DE beholder plassen sin i skraperrekkefølgen.</strong> Når\n    det ikke var hovedkilden, erstattet senere kilder og AI-en teksten og\n    coverne, og skjermbildene ble droppet. Nå blir de værende.\n    Det kopierer ikke lenger medier et spill allerede har, og det leser\n    oppføringen for spillets egen ROM-fil. PS3-mappespill finner nå ES-DE-coverne\n    sine. Import av systemlogoer tar ikke lenger et urelatert bilde.\n    En full reskraping sletter ikke lenger en eske som en annen kilde nettopp\n    har lastet ned.</li>\n  <li><strong>Skjermbildegjennomgang.</strong> Et nytt verktøy i ROM-verktøy viser\n    skjermbilder fra ZX Spectrum, Commodore 64 og Game Boy med de mest\n    mistenkelige først, og fjerner bare det du velger. Skraping avviser nå et\n    Game Boy-skjermbilde der originalen har langt flere gråtoner\n    enn maskinen kunne vise. På 8-bits og 16-bits systemer legger det ikke\n    lenger til IGDB- eller RAWG-skjermbilder på et spill utgitt på flere\n    systemer.</li>\n  <li><strong>RetroAchievements-pålogging når DuckStation og PCSX2</strong>\n    når du trykker Spill.</li>\n  <li><strong>På et spills side:</strong> venstre- og høyrepil går\n    til forrige og neste spill, Juksekoder-delen kan foldes sammen og husker det,\n    panelene nederst passer i vinduet, og emulatoren står\n    på kortet for Emulator-innstillinger, ikke ved siden av Spill.</li>\n  <li><strong>Importer en 3D-eske</strong> finner du nå i Rediger-vinduet, ved siden av\n    de andre bildene.</li>\n  <li><strong>Et vindu som starter på et tekstfelt,</strong> som Skrap,\n    setter nå markøren i feltet i stedet for på lukkeknappen.</li>\n</ul>\n"
