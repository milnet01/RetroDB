    label: 'Venstre stikke fungerer som D-Pad i RetroDBs RetroArch'
  - type: feature
    label: 'Logg inn på RetroAchievements fra Innstillinger'
  body: |
    <ul>
      <li><strong>Juksekoder for RetroArch (RetroDB), DuckStation og
        PCSX2.</strong> Innstillinger &gt; Emulatorer har en ny Juksekoder-del.
        Last ned de gratis offentlige juksekodepakkene der, eller importer
        juksekodemapper du allerede har; RetroDB kopierer filene og endrer
        aldri mappen din. Spillsiden viser da juksekodene for spillet, hver
        med en av/på-bryter, og et søkefelt når det er mange.
        I RetroArch (RetroDB) gjelder juksekodene du slår på neste gang du
        trykker Spill, og endringer du gjør i RetroArchs meny mens du spiller,
        blir beholdt. For DuckStation og PCSX2 lagres bryterne i emulatorens
        egne innstillinger for spillet, så endringer gjort inne i emulatoren
        vises også på siden. RetroDB overskriver aldri en juksekodefil en
        emulator allerede har. En juksekode som er på, setter
        RetroAchievements hardcore-modus på pause.</li>
      <li><strong>Importer en Slipcase-3D-boks til et spill.</strong> Spillsiden
        har en Importer 3D-boks-knapp under omslaget. Velg
        <code>.box.json</code>-filen Slipcase lagret, sammen med bildene som
        hører til, så tar RetroDB vare på boksens forside, rygg, bakside og
        andre flater for det spillet. 3D-boksbildet ditt endres ikke. Et
        spill som allerede har flater, spør før de erstattes, og Fjern
        sletter dem.</li>
      <li><strong>Snu et spills 3D-boks i hendene.</strong> Klikk på
        omslaget til et spill med en importert Slipcase-boks, så vises boksen
        i 3D. Dra den, eller bruk piltastene, for å snu den og se ryggen,
        baksiden, toppen og bunnen. Rull eller trykk + og - for å zoome;
        dobbeltklikk eller trykk Home for å sette den tilbake. Et spill uten
        importert boks zoomer fortsatt inn på omslagsbildet.</li>
      <li><strong>Innstillinger lenker til Emulatorer-siden.</strong>
        Emulatorer-siden hadde ingen lenke noe sted i Innstillinger, så du
        kunne bare nå den ved å skrive inn adressen. Administratorer ser nå en
        Emulatorer-fane etter System, og Emulatorer-siden viser den samme
        fanelinjen, så de andre fanene er ett klikk unna.</li>
      <li><strong>Omslagszoomen skjules ikke lenger bak menyene.</strong> På
        en telefon lå topp- og bunnlinjen over det zoomede omslaget og skjulte
        lukkeknappen, og på en datamaskin dekket sidepanelet venstre side.
        Zoomen åpnes nå over alt annet.</li>
      <li><strong>Claude 5.5-modeller for KI-en.</strong> Innstillinger &gt; Skraper viser Anthropics nyeste Claude-modeller: Haiku 5.5, den nye standarden og den billigste, Sonnet 5.5 og Opus 5.5, med dagens priser. RetroDB sender ikke lenger en innstilling som Sonnet 5.5 avviser.</li>
      <li><strong>Skriv inn salgstallet for et spill.</strong> Begge redigeringsvinduene har et felt for Solgte eksemplarer under Utvikler. Et tall du skriver inn, vises på spillsiden på samme måte som et KI-en har funnet. Tøm feltet for å fjerne det.</li>
      <li><strong>Test KI-nøkkelen i Innstillinger.</strong> Innstillinger &gt; Skraper har en knapp, «Test lagret KI-nøkkel», under KI-leverandøren. Den viser om nøkkelen virker, og hvis ikke, hvorfor: en avvist nøkkel, ingen kreditt eller en bruksgrense. Før så en avvist nøkkel ut som en som virket.</li>
      <li><strong>Claude kan søke på nettet etter salgstall.</strong> Innstillinger &gt; Skraper har en bryter, «La Claude søke på nettet», under Claude-modellen, av til å begynne med. Uten søk svarer Claude ut fra det den allerede vet og lar solgte eksemplarer stå tomt. Med bryteren på slår Claude opp tallene. Anthropic tar betalt for hvert søk, så AI-utfylling gjør høyst 5 søk per spill, opptil 5 amerikanske cent; slå av bryteren før en stor masseskraping.</li>
      <li><strong>AI-utfylling for et helt system på en gang.</strong> ROM-verktøy har en ny side, Mass-AI-utfylling, som også rommer Offisielle navn. Velg et system, eller Alle systemer, slå på feltene du vil ha fylt, og trykk Fyll med KI: RetroDB kjører AI-utfylling på hvert spill, på samme måte som AI-utfylling-knappen på et spills side, og lagrer svarene rett i spillet. En fremdriftslinje og en varselboks for AI-utfylling viser hvor langt det har kommet, og du kan forlate siden mens det kjører. Det viser hvor mange spill det vil fylle og spør først, fordi KI-leverandøren din tar betalt for hvert spill. Spill som AI-utfylling allerede har gjort, hoppes over med mindre du slår dem på igjen, og kjøringen stopper av seg selv hvis KI-en slutter å svare.</li>
      <li><strong>Jobbvarslene bruker temaets farger.</strong> Boksene som viser en jobb som kjører, som masseskraping og RA Sync, og fremdriftslinjene bruker nå fargene til temaet du valgte. En jobb som ikke kan settes på pause, viser ikke lenger tittelen i pausefargen.</li>
      <li><strong>Emulatorsiden ser ut som de andre fanene i Innstillinger.</strong> Innstillinger &gt; Emulatorer er nå delt inn i kort, og en linje under fanene hopper til hvert av dem: RetroArch, Spill i RetroDB, Kjerner, Juksekoder, Mapper, Emulatorer og Tilordning. Linjen blir værende øverst når du ruller, og markerer delen du er i.</li>
      <li><strong>Nedlastingsfremdrift ved siden av knappen.</strong> Når du laster ned RetroArch, spillerens kjerner eller en juksekodepakke, viser en merknad ved siden av knappen hvor langt nedlastingen har kommet i prosent. Før dukket det opp en linje under knappene som dyttet resten av siden nedover.</li>
      <li><strong>Velg emulatoren for hvert system fra en liste.</strong> Tilordning per system under Innstillinger &gt; Emulatorer viser nå hvert system én gang, med en liste over emulatorene som er knyttet til det. Den du velger, er den Spill bruker for spillene til det systemet, med mindre et spill har sin egen. En emulator RetroDB ikke finner, er merket «ikke funnet». Før hadde hvert system én rad per emulator, med en liten prikk for å velge standarden. RetroDBs egen RetroArch er nå i listen for hvert oppførte system den kan kjøre, også systemer som ikke har spill ennå.</li>
      <li><strong>En Bla gjennom-knapp ved hver stiboks.</strong> Administratorer kan nå velge en mappe eller et program ved å klikke seg gjennom datamaskinens mapper i stedet for å skrive inn stien: Innstillinger &gt; Emulatorer, Bibliotek, Skraping og Konto, og innstillingene for ROM-verktøy. Bokser som vil ha et program, viser også filer. Skjulte mapper som <code>.config</code> står sist.</li>
      <li><strong>Venstre stikke fungerer som D-Pad i RetroDBs RetroArch.</strong> I spill for systemer uten stikke, som NES eller Mega Drive, kan du nå bevege deg med venstre stikke i tillegg til D-Paden. Når emulatorkjernen til et spill leser stikken selv, som på Nintendo 64, forblir stikken en ekte stikke.</li>
      <li><strong>Logg inn på RetroAchievements fra Innstillinger.</strong> Innstillinger &gt; Konto kan nå logge deg inn for RetroDBs RetroArch, slik at prestasjoner låses opp mens du spiller, uten innlogging inne i emulatoren. Passordet ditt går bare til RetroAchievements og lagres ikke. Hver RetroDB-bruker har sin egen innlogging og sin egen Hardcore-modus-bryter, som starter av. DuckStation og PCSX2 logger fortsatt inn fra sine egne menyer.</li>
    </ul>
