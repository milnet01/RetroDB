  - type: fix
    label: Kassettspill får ikke lenger en funnet-på Battery Save-type, og nye AI-svar blir ikke lenger Standard Edition som standard
  - type: fix
    label: Serien til et spill kommer ikke lenger fra å dele opp tittelen, så Need For Speed er ikke lenger i en serie som heter Need. Serienavn fra IGDB leses igjen, og gamle gjetninger fjernes så neste skraping kan fylle dem ut på nytt
  - type: fix
    label: Beskrivelser viser ikke lenger webkoder i stedet for anførselstegn, eller overskriftstegn som
  - type: fix
    label: Ett selskap har nå én stavemåte, så et klikk på Sega finner alle SEGA-spill. Regioner har én verdi, og plattformer bruker navnene i listen
  - type: fix
    label: Spilltitler fra RAWG får ikke lenger lagt til et årstall, og alternative titler lister ikke lenger filnavn som dosbox.exe
