- version: 4.0.0
  date: '2026-11-22'
  tags:
  - type: fix
    label: "MobyGames finner nå et spill det oppgir med et navn skrevet med punktum, som M.U.S.H.A. for MUSHA: når hele navnet ikke gir treff, spør det igjen bokstav for bokstav"
    en: "MobyGames now finds a game it lists under a name written with dots, such as M.U.S.H.A. for MUSHA: when the whole name finds nothing, it asks again letter by letter"
  - type: fix
    label: "Svak grå tekst er lettere å lese i alle temaer: hint, plassholdere og små etiketter er lysere. Merker som var vanskelige å lese, er også tydeligere: PEGI-merket på spillkort, konsollmerkene, Gi nytt navn-knappen, RetroAchievements-tallet og rødfargen i temaet Cathedral"
    en: "Faint grey text is easier to read in every theme: hints, placeholders and small labels are brighter. Badges that were hard to read are clearer too: the PEGI badge on game cards, the console badges, the Rename button, the RetroAchievements count and the Cathedral theme's red"
  - type: fix
    label: "MobyGames blir nå spurt før KI-en, som planlagt, også der rekkefølgen på kildene ble lagret før MobyGames kom til, så KI-en fyller ikke lenger inn det MobyGames vet. MobyGames avviser også RetroDB sine forespørsler sjeldnere: RetroDB venter nå litt lenger mellom dem, og når du lagrer API-nøklene, kan ingen forespørsel lenger snike i køen"
    en: "MobyGames is now asked before the AI, as planned, even where the order of sources was saved before MobyGames was added, so the AI no longer fills in what MobyGames knows. MobyGames also refuses RetroDB's requests less often: RetroDB now waits a little longer between them, and saving your API keys no longer lets a request jump the queue"
  - type: fix
    label: "På mobil er listen over kilder i Innstillinger > Skraping lesbar igjen: hvert navn og hver beskrivelse bruker hele bredden, med status og av/på-bryter på linjen under. Før ble teksten klemt til ett ord per linje og bryteren kuttet av"
    en: "On a phone, the list of sources in Settings > Scraping is readable again: each name and description uses the full width, with its status and on/off switch on the line below. Before, the text was squeezed to one word a line and the switch was cut off"
  - type: fix
    label: "Mer av RetroDB fungerer nå med bare tastaturet. Kolonnene i rapportene sorteres med Enter, og Slett-knappen for skjermbilder vises når Tab når den. Når du fjerner en tagg eller et bibliotekfilter, trykker Load More på Endringslogg-siden eller oppdaterer ønskelisten under en skraping, blir du nå stående der du var i stedet for å sendes tilbake til toppen av siden"
    en: "More of RetroDB now works with the keyboard alone. Report columns sort with Enter, and the screenshot Delete button appears when Tab reaches it. Removing a tag or a library filter, pressing Load More on the Changelog, or a wishlist refresh during a scrape now keeps your place instead of sending you back to the top of the page"
  - type: fix
    label: "Med en skjermleser sier flere knapper og felt nå hva de er. Avkrysningsbokser nevner spillet eller filen sin, og søke- og filterfelt har navn. Knapper som bare viser et symbol (×, ✎, 🗑️) sier hva de gjør, og diagrammene i Analytics har navn. Filterknappene i Logger, Rapporter og PSN Trophies sier om de er på, og feil ved innlogging og oppsett leses opp"
    en: "With a screen reader, more buttons and boxes now say what they are. Tick boxes name their game or file, and search and filter boxes have names. Buttons showing only a symbol (×, ✎, 🗑️) say what they do, and Analytics charts are named. The filter buttons on Logs, Reports and PSN Trophies say whether they are on, and sign-in and setup errors are read out"
  - type: feature
    label: "Den åpne 3D-esken viser nå den ekte platen eller kassetten for flere spill: når MobyGames ikke har noe bilde av den, bruker RetroDB bildet fra ScreenScraper, eller det ES-DE allerede har lastet ned. Skrap et spill på nytt for å legge det til"
    en: "The open 3D box now shows the real disc or cartridge for more games: when MobyGames has no picture of it, RetroDB uses ScreenScraper's, or the one ES-DE has already downloaded. Scrape a game again to add it"
  - type: enhancement
    label: "Endringslogg-siden er lettere å lese: hver versjon viser ett lite merke for hver type endring, og selve endringene er vanlig tekst gruppert under Nye funksjoner, Forbedringer, Rettelser og Sikkerhet. Siden er også bredere"
    en: "The Changelog page is easier to read: each version shows one small badge for each kind of change, and the changes themselves are ordinary text grouped under New features, Improvements, Fixes and Security. The page is also wider"
  - type: feature
    label: "3D-esken til et Mega Drive-, Genesis- eller Master System-spill har nå butikkens opphengsflik øverst, med spalten sin, og en hevet kant og et dypere trinn der etuiet åpnes, som på det ekte etuiet. Game Gear-esker får også fliken. Kjør Lag 3D-esker på nytt for å oppdatere kanten på esker laget tidligere"
    en: "The 3D box of a Mega Drive, Genesis or Master System game now has the shop's hanging tab at the top, with its slot, and a raised lip and a deeper step where the case opens, as on the real case. Game Gear boxes get the tab too. Run Build 3D Boxes again to update the lip on boxes built before"
  - type: fix
    label: "Beregn filstørrelser under Innstillinger > System sier nå hva den fant, i en boks som blir stående under knappen, og leter ikke lenger på disken etter importerte spill, som ikke har noen fil"
    en: "Calculate File Sizes in Settings > System now says what it found, in a box that stays under the button, and no longer looks on disk for imported games, which have no file"
  - type: fix
    label: "MobyGames finner nå et spill der navnet er skrevet litt annerledes, for eksempel 'Castlevania Bloodlines' for 'Castlevania: Bloodlines', og prøver hovedordet i navnet når hele navnet ikke gir noe treff. Et søk rett etter at du har åpnet Oversikt eller Innstillinger kommer ikke lenger tilbake tomt, og MobyGames-statusen der sier ikke lenger Tilkoblingsfeil når MobyGames er treg"
    en: "MobyGames now finds a game whose name is written a little differently, such as 'Castlevania Bloodlines' for 'Castlevania: Bloodlines', and tries the name's main word when the whole name finds nothing. A search just after opening the Dashboard or Settings no longer comes back empty, and the MobyGames status there no longer says Connection error when MobyGames is slow"
  - type: feature
    label: "Hver bruker kan nå fjerne sin egen RetroAchievements-fremgang for én konsoll, med Clear My Progress ('Fjern min fremgang') på Prestasjoner-siden. Andre brukere beholder sin; å fjerne alles data er fortsatt opp til administratoren"
    en: "Every user can now clear their own RetroAchievements progress for one console, with Clear My Progress on its Achievements page. Other users keep theirs; clearing everyone's data stays with the admin"
  - type: fix
    label: "Raden Lignende spill på en spillside uteblir ikke lenger når serveren svarer raskt"
    en: "The Similar Games row on a game page no longer fails to show when the server answers quickly"
  - type: fix
    label: "Vinduet Søk metadata blir nå bredere for å få plass til hver kilde du har slått på, og på en mindre skjerm deler det kildene i jevne rader i stedet for å presse dem sammen"
    en: "The Search Metadata window now widens to fit every source you have switched on, and on a smaller screen splits the sources into even rows instead of squeezing them"
  - type: feature
    label: "MobyGames er en ny skrapekilde, spurt sist før KI-en når du lagrer din egen MobyGames API-nøkkel. Den fyller tomme detaljer, boksens for- og bakside og skjermbilder, og beholder hver skanning av den ekte boksen, ryggen, platen og manualen til 3D-boksen. MobyGames tillater noen hundre forespørsler i timen; et spill som ble hoppet over da timen var brukt opp, blir spurt om igjen av seg selv etter tilbakestillingen. En spillside med opplysninger fra MobyGames lenker til spillet på MobyGames.com"
    en: "MobyGames is a new scrape source, asked last before the AI once you save your own MobyGames API key. It fills empty details, the box front and back and screenshots, and keeps every scan of the real box, spine, disc and manual for the 3D box. MobyGames allows a few hundred requests an hour; a game skipped when the hour runs out is asked about again by itself after the reset"
  - type: feature
    label: "Skrapede spill med omslag får nå selv en 3D-eske som kan snus, på det ekte etuiet for konsollen og regionen, laget av skanningene av esken, med en trykt rygg når ingen ble skannet. Bygg 3D-esker i ROM-verktøy gjør dette for spill som ble skrapet før. En eske importert fra Slipcase endres aldri"
    en: "Scraped games with a cover now get a turning 3D box by themselves, on the real case for their console and region, made from the box scans, with a printed spine when none was scanned. Build 3D Boxes in ROM Tools does this for games scraped before. A box imported from Slipcase is never changed"
  - type: feature
    label: "3D-esken kan nå åpnes. Lokket svinger opp på hengselen og viser hva som er inni, som i det ekte etuiet: platen på navet eller kassetten, manualen under klipsene og innsiden av omslaget, fra skanningene av spillets eske. Hver skanning kan også vises for seg. DVD-etuier, klaffeetuier og etuier for håndholdte konsoller viser også de avrundede kantene og skjøten der de åpnes; kjør Bygg 3D-esker igjen for å oppdatere esker som ble bygget før"
    en: "The 3D box now opens. Its lid swings open on the hinge and shows what is inside, as in the real case: the disc on its hub or the cartridge, the manual under its clips and the inside cover, from the game's box scans. Each scan can also be viewed on its own. Keep cases, clamshells and handheld cases also show their rounded edges and the seam where they open; run Build 3D Boxes again to update boxes built before"
  - type: fix
    label: "Fjern på spillsiden sletter ikke lenger bildene til en boks importert fra Slipcase"
    en: "Clear on the game page no longer deletes the pictures of a box imported from Slipcase"
  - type: fix
    label: "Innstillinger > Emulatorer finner nå Azahar, 3DS-emulatoren: Windows-programmet, Linux-AppImage-en og Flatpak-en"
    en: "Settings > Emulators now finds Azahar, the 3DS emulator: its Windows program, its Linux AppImage and its Flatpak"
  - type: fix
    label: "Et spill som lukkes i det øyeblikket det starter, blir nå alltid ryddet opp etter, for eksempel ved å ta tilbake RetroAchievements-påloggingen RetroDB ga den oppstarten"
    en: "A game that closes the moment it starts is now always tidied up after, such as taking back the RetroAchievements sign-in RetroDB gave that launch"
  - type: fix
    label: "En standardemulator du har valgt for et system, forblir nå systemets eneste standard når RetroDB legger til sine egne emulatorforslag ved oppstart"
    en: "A default emulator you picked for a system now stays its only default when RetroDB adds its own emulator suggestions at start-up"
  - type: fix
    label: "Hvis oppdateringen av spillerens shadere mislykkes, beholdes shaderne du hadde. Listen over installerte kjerner kan ikke lenger gå tapt midt i lagringen, og en kjerneliste som ikke lar seg laste ned, prøves igjen etter fem minutter i stedet for en time"
    en: "If updating the player's shaders fails, the shaders you had are kept. The list of installed cores can no longer be lost part-way through saving, and a core list that fails to download is tried again after five minutes instead of an hour"
  - type: fix
    label: "På Linux-systemer som beskytter sin egen Python, som Debian, Ubuntu og Fedora, lager installasjonsprogrammet nå en egen Python-mappe for RetroDB i stedet for å tvinge delene inn i systemets Python, noe som kunne ødelegge systemverktøy"
    en: "On Linux systems that protect their own Python, such as Debian, Ubuntu and Fedora, the installer now gives RetroDB its own Python folder instead of forcing its parts into the system's Python, which could break system tools"
  - type: security
    label: "Innstillingsfilene installasjonsprogrammet lager, som inneholder passord og nøkler, kan nå bare leses av din egen konto, ikke av andre som bruker den samme datamaskinen"
    en: "The settings files the installer creates, which hold passwords and keys, can now be read only by your own account, not by other people who use the same computer"
  - type: fix
    label: "Etter installasjonen åpner installasjonsprogrammet nå RetroDB på porten det faktisk bruker, så snart RetroDB er klart. Før åpnet det alltid port 5000 etter en fast ventetid, noe som kunne vise en feilside"
    en: "After installing, the installer now opens RetroDB on the port it really uses, once RetroDB is ready. Before, it always opened port 5000 after a fixed wait, which could show an error page"
  - type: enhancement
    label: "På Windows og macOS kan RetroDB nå finne emulatorene dine og RetroArch for deg under Innstillinger > Emulatorer, og leter i de vanlige mappene for det systemet med mindre du oppgir dine egne"
    en: "On Windows and macOS, RetroDB can now find your emulators and RetroArch for you in Settings > Emulators, looking in the usual folders for that system unless you list your own"
  - type: fix
    label: "På Windows og macOS finner RetroDB nå innstillingsmappene til DuckStation og PCSX2, så innstillinger per spill og BIOS-sjekken virker der. På Linux blir DuckStation-mappen også funnet når XDG_CONFIG_HOME er satt"
    en: "On Windows and macOS, RetroDB now finds DuckStation's and PCSX2's settings folders, so per-game settings and the BIOS check work there. On Linux, DuckStation's folder is also found when XDG_CONFIG_HOME is set"
  - type: fix
    label: "Konvertering av en plate til CHD kan ikke lenger slette en fil utenfor spillets egen mappe når .cue- eller .gdi-arket peker dit"
    en: "Converting a disc to CHD can no longer delete a file outside the game's own folder when its .cue or .gdi sheet points there"
  - type: fix
    label: "Når en plate får nytt navn eller konverteres, oppdateres flerplate-spillelisten (.m3u) trygt: en spilleliste som ikke kan leses, blir latt være i stedet for å tømmes, og platenavn med aksentbokstaver fra eldre systemer beholder bokstavene sine"
    en: "When a disc is renamed or converted, its multi-disc playlist (.m3u) is updated safely: a playlist that cannot be read is left alone instead of being emptied, and disc names with accented letters from older systems keep their letters"
  - type: fix
    label: "Velger du en ny standardemulator for et system og den ikke kan lagres, beholdes den gamle standarden i stedet for at systemet står uten standardemulator"
    en: "Choosing a new default emulator for a system that then fails to save keeps the old default, instead of leaving the system with no default emulator"
  - type: fix
    label: "Hvis grafikkortet slutter å svare under en KI-oppskalering, slipper RetroDB det nå innen omtrent to minutter og fortsetter oppskaleringen med prosessoren. Før forble kortet opptatt til RetroDB ble startet på nytt"
    en: "If the graphics card stops responding during an AI upscale, RetroDB now lets go of it within about two minutes and carries on upscaling with the processor. Before, the card stayed busy until RetroDB was restarted"
  - type: fix
    label: "På en treg internettforbindelse blir den første nedlastingen av KI-modellene for oppskalering og bakgrunnsfjerning ikke lenger avbrutt som om den hadde stoppet. Hvis nedlastingen for oppskalering mislykkes, prøver RetroDB igjen 15 minutter senere i stedet for å la KI-oppskalering være av til en omstart"
    en: "On a slow internet connection, the first download of the AI upscaling and background-removal models is no longer cut off as if it had stopped. If the upscaling download fails, RetroDB tries again 15 minutes later instead of leaving AI upscaling off until a restart"
  - type: fix
    label: "Et skadet Museum-bilde får ikke lenger bakgrunnsfjerningen til å slutte å bruke grafikkortet for alle bildene etter det"
    en: "A damaged Museum photo no longer makes background removal stop using the graphics card for every photo after it"
  - type: security
    label: "Før en oppdatering installeres, sjekker RetroDB nå at den har en ekte signatur fra RetroDBs egen utgivelsesprosess. En nedlasting som noen har endret eller byttet ut, avvises, selv om sjekksumfilen også er byttet ut"
    en: "Before an update installs, RetroDB now checks that it carries a genuine signature from RetroDB's own release process. A download someone has changed or swapped is refused, even if its checksum file was swapped too"
  - type: fix
    label: "Hvis en oppdatering mislykkes og RetroDB går tilbake til versjonen du hadde, går ingenting tapt av det du lagret mens den holdt på å lukkes. Kopien av biblioteket ditt som gjenopprettes, tas nå etter at RetroDB har stoppet helt, og gjenopprettes bare hvis den nye versjonen startet. Programbiblioteker som oppdateringen installerte, settes også tilbake til de gamle versjonene"
    en: "If an update fails and RetroDB goes back to the version you had, nothing you saved while it was closing down is lost. The copy of your library it restores is now taken after RetroDB has fully stopped, and is only restored if the new version started. Program libraries the update installed are put back to the old versions too"
  - type: fix
    label: "Hurtigvinduer dekker nå den øverste og nederste linjen på mobilen, og sidefeltet på datamaskinen. Før ble linjene liggende lyse oppå vinduer som Bibliotekets filterlister, trofeskanningene og vinduene under Rapporter og Innstillinger, og de kunne fortsatt trykkes på"
    en: "Pop-up windows now cover the phone's top and bottom bars, and the sidebar on a computer. Before, the bars stayed bright on top of windows such as the Library's filter lists, the trophy scans and the Reports and Settings windows, and could still be pressed"
  - type: fix
    label: "Spillkort i Biblioteket og på et systems side går ikke lenger over kortet under når listen viser to eller flere kolonner. Et kort som vokste etter at det var plassert, for eksempel når aldersgrenseikonene brøt over til en ny rad, dekket før toppen av neste kort"
    en: "Game cards in the Library and on a system's page no longer run over the card below them when the list shows two or more columns. A card that grew after it was placed, such as one whose rating icons wrapped onto a second row, used to cover the top of the next card"
  - type: fix
    label: En melding som vises mens et vindu er åpent, for eksempel «Dette spillet er allerede på ønskelisten din», vises nå øverst over vinduet. Før havnet den bak den mørke bakgrunnen, så det virket som om ingenting skjedde når du trykket på en knapp som Legg til på ønskeliste
    en: A message shown while a window is open, such as "This game is already on your wishlist", now shows on top of the window. Before, it hid behind the dark backdrop, so pressing a button like Add to Wishlist seemed to do nothing
  - type: fix
    label: ROM Tools-lenken i sidefeltet lyser nå opp på alle ROM Tools-sider. Regionversjoner, Samlet AI-utfylling, MAME-navn, Fix Box og Manual Regions og HLTB Pending Review lot den stå mørk
    en: The ROM Tools link in the sidebar now lights up on every ROM Tools page. Regional Versions, Bulk AI Fill, MAME Names, Fix Box and Manual Regions and HLTB Pending Review left it dark
  - type: fix
    label: Reparer regioner for coverbokser og manualer og HLTB venter på gjennomgang viser nå raden med ROM-verktøy-faner øverst, slik som de andre verktøyene, så du kan gå fra ett verktøy til det neste. Reparer regioner for coverbokser og manualer har en egen fane på hver verktøyside
    en: Fix Box and Manual Regions and HLTB Pending Review now show the row of ROM Tools tabs at the top, like the other tools, so you can go from one tool to the next. Fix Box and Manual Regions has a tab of its own on every tool page
  - type: fix
    label: Knapper og meldinger som tidligere ble vist på engelsk uansett språk, vises nå på ditt eget språk, i alle språk RetroDB tilbyr. Noen manglet oversettelse, og noen hadde feil oversettelse, for eksempel Create Backup, som på tysk sto som «gjenopprett sikkerhetskopi»
    en: Buttons and messages that showed in English whatever your language now show in it, in every language RetroDB offers. Some had no translation, and some showed a wrong one, such as Create Backup reading as "restore backup" in German
  - type: enhancement
    label: Administratorer og redaktører kan krysse av for språkene de leser under Innstillinger > Konto > Språk jeg kan lese. Når et spill ikke har noe esketbilde eller navn fra sin egen region, velger RetroDB ett på et språk som en som skraper kan lese. Alle som ikke krysser av noe, regnes som at de leser skjermspråket sitt
    en: Admins and editors can tick the languages they read, under Settings > Account > Languages I can read. When a game has no box picture or name from its own region, RetroDB picks one in a language someone who scrapes can read. Anyone who ticks none counts as reading their screen language
  - type: fix
    label: En Europa-kopi får ikke lenger tysk, fransk, spansk eller italiensk esketbilde eller navn bare fordi ScreenScraper ikke har noe generelt for Europa. Den får det britiske, eller ett fra regionlisten din, for eksempel Verden eller USA, med mindre en som skraper leser det språket. Fiks eske- og manualregioner ser på nytt på eskene og manualene som ble byttet til et språk ingen leser
    en: A Europe copy no longer gets a German, French, Spanish or Italian box picture or name just because ScreenScraper has no general Europe one. It gets the UK one, or one from your region list such as World or USA, unless someone who scrapes reads that language. Fix Box and Manual Regions looks again at the boxes and manuals it swapped into a language nobody reads
  - type: enhancement
    label: Fiks eske- og manualregioner har sin egen side, som åpnes fra kortet under ROM-verktøy. Listen Hva som er endret viser alle spill der rettelsen byttet ut en eske, 3D-eske eller manual, gruppert etter konsoll, med esken slik den er nå og regionen hver nye fil kom fra, slik at du kan kontrollere dem. Spill som ble fikset før denne oppdateringen, vises også
    en: Fix Box and Manual Regions has its own page, opened from its ROM Tools card. Its What changed list shows every game the fix swapped a box, 3D box or manual for, grouped by console, with the box as it is now and the region each new file came from, so you can check them. Games already fixed before this update are listed too
  - type: enhancement
    label: Fiks eske- og manualregioner kan settes på pause, fortsettes og stoppes med knapper på siden sin. Før kunne du bare stoppe den ved å trykke på kortet igjen, noe ingenting på skjermen sa
    en: Fix Box and Manual Regions can be paused, resumed and stopped with buttons on its page. Before, the only way to stop it was to press its card again, which nothing on screen said
  - type: enhancement
    label: Fiks eske- og manualregioner viser en fremdriftslinje ved siden av knappene mens den kjører. Listen Hva som er endret husker hvilke konsoller du lukket, så de forblir lukket neste gang du åpner siden i denne nettleseren
    en: Fix Box and Manual Regions shows a progress bar beside its buttons while it runs. Its What changed list remembers which consoles you closed, so they stay closed the next time you open the page in this browser
  - type: enhancement
    label: Mens Fiks eske- og manualregioner kjører, havner hvert spill den bytter ut med en gang i listen Hva som er endret, under konsollen sin. Før måtte du laste siden på nytt for å se dem
    en: While Fix Box and Manual Regions runs, each game it swaps joins its What changed list straight away, under its console. Before, you had to reload the page to see them
  - type: fix
    label: En fremdriftslinje som ikke har startet ennå, viser ikke lenger en enslig «%» ytterst til venstre
    en: A progress bar that has not started yet no longer shows a lone "%" at its left end
  - type: fix
    label: Logoene til Wii U, PlayStation Vita, Xbox og Xbox One på Systemer-siden fyller plassen sin som de andre. PlayStation Vita-logoen og ONE i Xbox One er nå hvite, så de kan leses i alle temaer
    en: The Wii U, PlayStation Vita, Xbox and Xbox One logos on the Systems page fill their space like the others. The PlayStation Vita logo and the ONE in Xbox One are now white, so they can be read on every theme
  - type: enhancement
    label: Xbox Series X|S, som Xbox-importen legger til, har sin egen logo, og vinduet som ℹ️-knappen åpner, viser et bilde av konsollene. Det har også det fulle navnet sitt, Microsoft Xbox Series X|S, og spesifikasjonene sine
    en: Xbox Series X|S, which the Xbox import adds, has its own logo, and the window its ℹ️ button opens shows a picture of the consoles. It also has its full name, Microsoft Xbox Series X|S, and its specifications
  - type: fix
    label: Et system som importen fra Steam, Xbox, PSN eller CLZ legger til, får nå logo, type og fullt navn der RetroDB kjenner dem. System som ble lagt til på den måten tidligere, får dem når RetroDB oppdateres
    en: A system the Steam, Xbox, PSN or CLZ import adds now gets its logo, its type and its full name where RetroDB knows one. Systems added that way before get them when RetroDB updates
  - type: enhancement
    label: Fiks eske- og manualregioner spør ScreenScraper om hvert spill bare én gang. Før startet hver kjøring på nytt med første spill og spurte om alle, selv spill den allerede hadde sjekket. Spill som er skrapet etter den første kjøringen, har allerede riktige esker, så de hoppes over uten spørring
    en: Fix Box and Manual Regions asks ScreenScraper about each game only once. Before, every run started again at the first game and asked about every one, even games it had already checked. Games scraped after its first run already have the right boxes, so it skips them without asking
  - type: fix
    label: ROM-verktøysidene som skanner eller konverterer (Screenshot Dedup, Screenshot Review, Duplicate Finder, CHD Converter og CHD Verify) beholder siste kjøring når du forlater siden og kommer tilbake. En skanning som pågår, viser fortsatt fremdriften, og en ferdig skanning viser resultatene igjen i 30 minutter etter at den er ferdig. Før kom siden tilbake tom
    en: The ROM tool pages that scan or convert (Screenshot Dedup, Screenshot Review, Duplicate Finder, CHD Converter and CHD Verify) keep their last run when you leave the page and come back. A running scan carries on showing its progress, and a finished one shows its results again, for 30 minutes after it ends. Before, the page came back empty
  - type: fix
    label: Oversatte hjelpesider kaller hver knapp, fane og side det appen viser på det språket, og siterer meldingene slik appen viser dem. Avsnittet om Bulk AI Fill nevner ikke lenger et kort appen ikke har. Bakgrunn-knappen leses nå riktig på italiensk, koreansk og kinesisk, og noen zulu-etiketter begynner ikke lenger med en løs «N:»
    en: Translated help pages call every button, tab and page by the name the app shows in that language, and quote its messages as the app shows them. The Bulk AI Fill section no longer names a card the app does not have. The Background button now reads correctly in Italian, Korean and Chinese, and some Zulu labels no longer start with a stray "N:"
  - type: feature
    label: 'Arkadespill med RetroAchievements kan nå tjene dem. De starter i RetroArch (RetroDB) med FinalBurn Neo-kjernen, som RetroAchievements støtter, i stedet for MAME, som den ikke støtter. Alle andre arkadespill blir i MAME. En ny juksekodepakke for FinalBurn Neo-arkade under Innstillinger → Emulatorer → Juksekoder viser juksekodene til hvert slikt spill på spillets side. FinalBurn Neo slår av juksekoder hver gang et spill starter, så du slår dem på i RetroArchs meny mens du spiller: F1, deretter Core Options, deretter Cheat'
    en: 'Arcade games with RetroAchievements now earn them. They start in RetroArch (RetroDB) with the FinalBurn Neo core, which RetroAchievements supports, instead of MAME, which it does not; every other arcade game stays in MAME. A new FinalBurn Neo arcade cheats pack under Settings → Emulators → Cheats lists each such game''s cheats on its page. FinalBurn Neo turns cheats off each time a game starts, so you switch them on in RetroArch''s menu while you play: F1, then Core Options, then Cheat'
  - type: performance
    label: 'Innstillinger åpnes raskere for administratorer. Den sjekker ikke lenger logoen og maskinvarebildet til hvert system når den åpnes: den tabellen fylles når du åpner fanen Tilpasning. Et trykk på Lagre rett etter åpning venter ikke lenger bak disse sjekkene'
    en: 'Settings opens faster for admins. It no longer checks every system''s logo and hardware picture as it opens: that table fills when you open the Customization tab. A Save pressed straight after opening no longer waits behind those checks'
  - type: enhancement
    label: 'Innstillinger er ryddigere. Dine egne valg ligger samlet under Innstillinger → Konto: Tema og språk (med bevegelig bakgrunn), og hvor lenge meldinger står på skjermen, som nå er hver persons eget valg. Bibliotek → Baner har alle de fire mappene under én Lagre. System → Server viser porten og hvor databasen ligger. Støtt utviklingen er flyttet til slutten av Hjelp-siden'
    en: 'Settings is tidier. Your own choices sit together under Settings → Account: Theme and Language (with the moving background), and how long messages stay on screen, which is now each person''s own. Library → Paths holds all four folders under one Save. System → Server shows the port and where the database is. Support Development moved to the end of the Help page'
  - type: enhancement
    label: 'Kontrollere har sin egen side. Innstillinger → Tilpasning → Åpne kontrollere fører dit: velg standardkontrollere for hvert system, legg til egne og rediger kontrollerbiblioteket'
    en: 'Controllers have their own page. Settings → Customization → Open Controllers goes there: set each system''s default controllers, add your own and edit the controller library'
  - type: enhancement
    label: 'Bulk Scrape Match Filtering har tre enkle valg i stedet for et poengtall og tabellen: Streng, Normal og Løs. Normal er den gamle standarden. En innstilling du har laget selv tidligere, vises som Egendefinert til du velger en annen'
    en: 'Bulk Scrape Match Filtering offers three plain choices instead of a score number and its table: Strict, Normal and Loose. Normal is the old default. A setting you made yourself before shows as Custom until you pick another'
  - type: enhancement
    label: Min profil har én knapp, Lagre min profil, i stedet for tre. Den sjekker et nytt PlayStation-token eller Xbox-nøkkel mens den lagrer, og beholder det fungerende PlayStation-tokenet ditt hvis Sony avviser det nye. Bytt passord sier nå at det trenger minst 12 tegn og ber om det nye passordet to ganger
    en: My Profile has one Save My Profile button instead of three. It checks a new PlayStation token or Xbox key as it saves, and keeps your working PlayStation token if Sony refuses the new one. Change Password now says it needs at least 12 characters and asks for the new password twice
  - type: fix
    label: Enklere ord i Innstillinger. Min profil forklarer hva RetroAchievements-nøkkelen og passordpåloggingen gjør hver for seg. API-nøkler sier at en persons egen RetroAchievements- eller Steam-nøkkel brukes først. TheGamesDBs nøkler heter Hovednøkkel og Reservenøkkel. Vinduet Rediger emulator sier Programplassering og Kommandolinjevalg. Tøm skrapede data sier at bilde- og videofilene blir liggende på disken med mindre du krysser av i boksen. Listene over AI-modeller viser ikke lenger priser, som ble utdaterte
    en: Plainer words in Settings. My Profile says what the RetroAchievements key and the password sign-in each do. API Keys says a person's own RetroAchievements or Steam key is used first. TheGamesDB's keys are named Main key and Backup key. The Edit emulator window says Program location and Command-line options. Clear Scraped Data says the picture and video files stay on disk unless you tick the box. The AI model lists no longer show prices, which went out of date
  - type: fix
    label: 'Innstillinger fjerner det som sto der to ganger eller ikke gjorde noe: kortet Bibliotekstatistikk (Dashbordet har det), Innstillinger-kopien av Scan Trophies (PS3-trofésiden har det), den separate knappen Importer systemlogoer (Oppdater systemlogoer kopierer nå først logoene fra ES-DE) og seks lagrede innstillinger som ingenting brukte. En meldingstid på 0 sekunder avvises i stedet for å lagres uten videre, og når du lagrer en ny ROM-mappe, står det ikke lenger at RetroDB må startes på nytt'
    en: 'Settings drops what was there twice or did nothing: the Library Statistics card (the Dashboard has it), the Settings copy of Scan Trophies (the PS3 trophies page has it), the separate Import System Logos button (Refresh System Logos now copies ES-DE''s logos first) and six stored settings nothing used. A message time of 0 seconds is refused instead of quietly saved, and saving a new ROM folder no longer says RetroDB must restart'
  - type: performance
    label: RetroDB er mye lettere for datamaskinen din. Den bevegelige tåken i Cyberpunk-temaet holdt én prosessorkjerne helt opptatt så lenge en RetroDB-side var åpen. Nå tegnes den av grafikkortet, og prosessoren merker det knapt. Den tegner også halvparten så mange bilder, noe som ser likt ut fordi tåken driver sakte
    en: RetroDB is far lighter on your computer. The Cyberpunk theme's moving mist kept one processor core fully busy for as long as any RetroDB page was open; the graphics card now draws it, and the processor barely notices. It also draws half as many frames, which looks the same because the mist drifts slowly
  - type: feature
    label: 'Bevegelige bakgrunner (tåke, regn, stjerner, støv) settes nå på pause når du ikke bruker RetroDB: når vinduet ikke er foran, fanen er skjult, eller det går et minutt uten mus eller tastatur. De starter igjen med en gang du kommer tilbake. En ny bryter, Bevegelig bakgrunn, under Innstillinger → Konto → Tema og språk holder dem i ro på den datamaskinen'
    en: 'Moving backgrounds (mist, rain, stars, dust) now pause when you are not using RetroDB: when its window is not in front, its tab is hidden, or a minute passes without the mouse or keyboard. They start again the moment you come back. A new Moving background switch under Settings → Account → Theme and Language keeps them still on that computer'
  - type: performance
    label: Sidetitler beholder gløden, men pulserer ikke lenger hele tiden, og de flimrende «glitch»-titlene i konsoll- og spillistene flimrer bare mens musen er over dem
    en: Page titles keep their glow but no longer pulse all the time, and the flickering "glitch" titles on the console and game lists flicker only while the mouse is over them
  - type: feature
    label: 'Juksekoder for arkadespill i MAME. Last ned «MAME XML Cheats Collection» fra mamecheat.co.uk i nettleseren og importer den under Innstillinger → Emulatorer → Juksekoder. Hvert arkadespills side viser da juksekodene sine med av/på-brytere, og MAME starter med dem du slo på. En juksekode som tar en verdi, stilles inn i MAME mens du spiller: trykk Tab, deretter Plugin Options, deretter Cheat'
    en: 'Cheats for arcade games in MAME. Download the "MAME XML Cheats Collection" from mamecheat.co.uk in your browser and import it under Settings → Emulators → Cheats. Each arcade game''s page then lists its cheats with on/off switches, and MAME starts with the ones you switched on. A cheat that takes a value is set in MAME while you play: press Tab, then Plugin Options, then Cheat'
  - type: fix
    label: Forrige og Neste på et spills side blir nå i den filtrerte listen din etter at du har skrapet det spillet. Med filteret Uskrapet på førte skraping av et spill til at det forsvant fra listen, så Neste gikk gjennom hele konsollen i stedet for til neste uskrapede spill
    en: Previous and Next on a game's page now stay in your filtered list after you scrape that game. With the Unscraped filter on, scraping a game took it out of the list, so Next stepped through the whole console instead of going to the next unscraped game
  - type: fix
    label: 'Mer av RetroDB følger nå språket ditt: delene Bonusplater, Sikkerhetskopi og ROM-navn i Innstillinger, overskriften Min profil, skrapesøkevinduet og meldingene om «ingen tillatelse». De ble stående på engelsk uansett hvilket språk du valgte'
    en: 'More of RetroDB now follows your language: the Bonus Discs, Backup and ROM Naming parts of Settings, the My Profile heading, the scrape search window and the "no permission" messages. They stayed in English whatever language you chose'
  - type: fix
    label: Legg til bruker ber nå om den nye personens første passord (12 tegn eller mer), og personen velger sitt eget første gang vedkommende logger inn. Før fikk hver nye konto i det stille det samme passordet, «changeme», som hvem som helst kunne bruke til eieren logget inn
    en: Add User now asks for the new person's first password (12 characters or more), and they choose their own the first time they sign in. Before, every new account quietly got the same password, "changeme", which anyone could use until its owner signed in
  - type: fix
    label: Innstillinger viser hver person bare det rollen deres kan endre. Seere og spillere ser fanen Konto, redaktører ser også Bonusplater og Kontrollere. Før så de administratorinnstillinger der Lagre-knappen så ble avvist, og noen viste feil verdier
    en: Settings shows each person only what their role can change. Viewers and players see the Account tab; editors also see Bonus Discs and Controllers. They used to see admin settings whose Save button was then refused, some showing wrong values
  - type: fix
    label: Innstillinger → System har ikke lenger knappen Clear Stuck RA Sync. Den sa at synkroniseringen var ryddet selv når den ikke var det. Stopp en RetroAchievements-synkronisering med knappene på fremdriftsmeldingen
    en: Settings → System no longer has the Clear Stuck RA Sync button. It said it had cleared the sync even when it had not; stop a RetroAchievements sync with the buttons on its progress notice
  - type: fix
    label: 'Små rettelser i Innstillinger: Tilbakestill til standard i skraperlisten sier at du må trykke Lagre skraperinnstillinger for å beholde det. En ny installasjon viser ScreenScraper slått på, slik det faktisk er. Hjelpen for Steam-ID ber om tallet med 17 siffer. Emulatorer-siden nevner ikke lenger en Legg til-knapp den ikke har. Oppsettsveiviseren skjuler API-nøklene dine mens du skriver dem'
    en: 'Small Settings fixes: Reset to Default on the scraper list says to press Save Scraper Settings to keep it; a new install shows ScreenScraper switched on, as it really is; the Steam ID help asks for the 17-digit number; the Emulators page no longer mentions an Add button it does not have; the Setup Wizard hides your API keys as you type them'
  - type: enhancement
    label: Hjelpemanualen har nå et søkefelt. Skriv inn et ord for å se bare de delene av manualen som nevner det, med ordet markert. Det ignorerer aksenter og fungerer på alle språk
    en: The help manual now has a search box. Type a word to see only the parts of the manual that mention it, with the word marked. It ignores accents and works in every language
  - type: fix
    label: 'Feilsøkingsdelen i hjelpemanualen dekker nå hver funksjon: legge til spill, skraping, AI-utfylling, bilder, spilling, juksekoder, prestasjoner, kontoer, sikkerhetskopier og oppdateringer. Noen av de gamle rådene pekte på knapper som ikke finnes lenger. Den sier heller ikke lenger at HowLongToBeat-oppslag fungerer uten nett eller at skraperhastigheten kan stilles inn'
    en: 'The help manual''s Troubleshooting section now covers each feature: adding games, scraping, AI Fill, pictures, playing, cheats, achievements, accounts, backups and updates. Some of its old advice pointed at buttons that no longer exist. It also no longer says HowLongToBeat lookups work offline or that scraper speed can be set'
  - type: fix
    label: Innstillinger → System har ikke lenger boksen for feilsøking av Bulk Scrape. Den leste rester av den gamle bulk-skrapingen og kunne ikke stoppe en ekte. Stopp en bulk-skraping med Avbryt i vinduet
    en: Settings → System no longer has the Bulk Scrape troubleshooting box. It read leftovers of the old bulk scrape and could not stop a real one; stop a bulk scrape with Cancel in its window
  - type: fix
    label: Installasjonsprogrammet ber nå om Python 3.12 eller nyere, som bibliotekene til RetroDB trenger. Det slapp gjennom eldre versjoner, og installasjonen feilet så halvveis. README har en ny feilsøkingsdel for problemer med installasjon og oppstart
    en: The installer now asks for Python 3.12 or newer, which RetroDB's libraries need. It let older versions through, and the install then failed partway. The README has a new Troubleshooting section for install and start-up problems
  - type: fix
    label: Fanen PSN i Spillimport sier nå at NPSSO-tokenet legges under Innstillinger → Min profil. Den nevnte en API-nøkler-side som ikke har noen slik boks
    en: Game Imports' PSN tab now says the NPSSO token goes under Settings → My Profile. It named an API Keys page that has no such box
  - type: fix
    label: Hjelpemanualen lister nå den kinesiske aldersgrensen (CADPA) sammen med de andre, kaller Fortsett å spille-delen på hjemmesiden ved det virkelige navnet, og gir tryggere råd når bilder ikke vil lagres
    en: The help manual now lists the Chinese age rating (CADPA) with the others, calls the home page's Continue Playing section by its real name, and gives safer advice when pictures will not save
  - type: fix
    label: 'Innstillinger → Skraping følger nå språket ditt: skraperlisten, API-nøkler, ES-DE-baner, treffilter og AI-innstillinger, med status- og resultatmeldingene. Det ble stående på engelsk uansett hvilket språk du valgte'
    en: 'Settings → Scraping now follows your language: the scraper list, API keys, ES-DE paths, match filtering and AI settings, with their status and result messages. It stayed in English whatever language you chose'
  - type: enhancement
    label: Når AI-tjenesten avviser en skraping (feil API-nøkkel, ingen kreditt eller fakturering igjen, eller for mange forespørsler), sier RetroDB nå hvilken av dem det er, og hva du bør sjekke, i stedet for å la felt som salgstall og utgivelsesdatoer stå tomme uten beskjed. Den slutter så å spørre den AI-en en stund, så du får beskjed én gang, ikke én gang per spill
    en: When the AI service refuses a scrape (a wrong API key, no credit or billing left, or too many requests), RetroDB now says which, and what to check, instead of quietly leaving fields such as sales figures and release dates empty. It then stops asking that AI for a while, so you are told once, not once per game
  - type: enhancement
    label: '3D-esken viser nå fingerhullet slik Slipcase laget det: med firkantede ender, og over eller under midten av siden, der esken har det slik. Importer esken på nytt for å se det'
    en: 'The 3D box now shows the finger slot as Slipcase made it: with square ends, and above or below the middle of the side, where the case has it so. Import the box again to see it'
  - type: fix
    label: 'Innstillinger → System følger nå språket ditt: vedlikeholdsverktøyene, loggingsinnstillingene og feilsøkingsdelene, med resultater og feilmeldinger. De ble stående på engelsk uansett hvilket språk du valgte. Gjenværende engelske meldinger på andre sider er også oversatt'
    en: 'Settings → System now follows your language: the maintenance tools, logging settings and troubleshooting sections, with their results and error messages. They stayed in English whatever language you chose. Leftover English messages on other pages are translated too'
  - type: fix
    label: På en konsollside under Prestasjoner glir ikke lenger raden med konsollknapper under fanene øverst når du ruller; den ruller nå bort. På alle Prestasjoner-sider blir A–Å-linjen nå rett under fanene i stedet for å skjule seg bak dem
    en: On an Achievements console page, the row of console buttons no longer slides under the section tabs as you scroll; it now scrolls away. On every Achievements page the A–Z letter bar now stays just below the section tabs instead of hiding behind them
  - type: fix
    label: Når du fjerner et bilde i vinduet Rediger spill, slettes ikke lenger filen hvis et annet spill bruker det samme bildet; det andre spillet beholder det
    en: Removing a picture in the Edit Game window no longer deletes the file when another game uses the same picture; the other game keeps it
  - type: fix
    label: Bilder av baksiden av esken som en skraping lagrer i liten størrelse, forstørres nå i bakgrunnen, slik forsidene allerede blir
    en: Back-of-box pictures that a scrape saves small are now enlarged in the background, as front covers already are
  - type: fix
    label: Lagre i vinduet Rediger spill venter ikke lenger mens små opplastede esketrykk eller skjermbilder forstørres; det skjer nå etterpå, vist som «Forbedrer bilder». Et bilde som er merket for fjerning, slettes først når lagringen har lykkes, så en mislykket lagring mister det ikke lenger
    en: Saving in the Edit Game window no longer waits while small uploaded box art or screenshots are enlarged; that now happens afterwards, shown as "Improving images". A picture ticked for removal is deleted only once the save has worked, so a failed save no longer loses it
  - type: fix
    label: Tallet for «manglende metadata» øverst på Bibliotek- og konsollsidene teller nå et spill med flere regionale versjoner én gang, slik filteret Uskrapet gjør. Før ble hver versjon telt
    en: The "missing metadata" count at the top of the Library and console pages now counts a game with several regional versions once, as the Unscraped filter does. It counted each version
  - type: enhancement
    label: Innstillinger → Bonusplater viser nå alle plater som er merket som bonusplate, med spillet de hører til. Knappen «Ikke en bonusplate» (for redaktører og administratorer) legger en feilmerket plate tilbake i spill-listene dine, og Auto-Link lar den da være i fred
    en: Settings → Bonus Discs now lists every disc marked as a bonus disc, with the game it belongs to. Its "Not a bonus disc" button (editors and admins) puts a wrongly marked disc back in your game lists, and Auto-Link then leaves it alone
  - type: fix
    label: Firmanavn som «Nintendo Co., Ltd.» og «GameTek, Inc.» forblir nå hele. De ble delt ved kommaet, slik at «Ltd.» og «Inc.» vistes som egne navn i Bibliotek-filtrene, Innstillinger → Datanormalisering og Statistikk. Spillsidene viser dem også hele. Et navn med komma inne i parentes, som «Majesco (licensed from Konami, Disney)», forblir også helt
    en: Company names such as "Nintendo Co., Ltd." and "GameTek, Inc." now stay whole. They were split at the comma, so "Ltd." and "Inc." showed as names of their own in the Library filters, Settings → Data Normalization and Stats. Game pages show them whole too. A name with a comma inside brackets, such as "Majesco (licensed from Konami, Disney)", stays whole as well
  - type: enhancement
    label: 'Innstillinger → Datanormalisering kan nå slå sammen ulike navn på samme firma. Under Utgiver og Utvikler viser «Navn som kan være ett firma» lignende navn som «Eidos» og «Eidos Interactive». Ingenting slås sammen automatisk, fordi lignende navn kan være ulike firmaer: velg navnet som skal beholdes, huk av navnene som er samme firma og trykk Slå sammen. Navnene endres på alle spill, og senere skrapinger bruker navnet du beholdt'
    en: 'Settings → Data Normalization can now merge one company''s different names. Under Publisher and Developer, "Names that may be one company" lists look-alikes such as "Eidos" and "Eidos Interactive". Nothing is merged for you, because look-alikes can be different companies: pick the name to keep, tick the names that are the same company and press Merge. The names change on every game, and later scrapes use the kept name'
  - type: enhancement
    label: Innstillinger → Datanormalisering har nå knappene Franchise, Utgiver og Utvikler. Hver viser navn som er skrevet med ulike store bokstaver, som «Doom» og «DOOM», med hvor mange spill som bruker hver stavemåte, og den mest brukte er valgt. Velg en og trykk Bruk for å gjøre dem til ett navn. Et nytt skrapet navn som bare skiller seg i store bokstaver, får stavemåten fra biblioteket ditt, og AI-utfylling ber om offisielle store bokstaver
    en: Settings → Data Normalization now has Franchise, Publisher and Developer buttons. Each lists the names spelled with different capitals, such as "Doom" and "DOOM", with how many games use each spelling and the most-used one picked. Choose one and press Apply to make them one name. A newly scraped name that differs only in capitals takes your library's spelling, and AI Fill asks for official capitals
  - type: fix
    label: Filtrene i Biblioteket matcher nå hele verdier. Når du velger sjangeren «Action», vises ikke lenger «Action-Adventure»-spill også, så resultatet stemmer med tallet ved siden av. Merkelistene på en spillside og Lignende spill matcher på samme måte
    en: The Library's filters now match whole values. Choosing the genre "Action" no longer also shows "Action-Adventure" games, so the result matches the count beside it. A game page's tag lists and Similar Games match the same way
  - type: security
    label: Innstillinger → Min profil sender ikke lenger din lagrede RetroAchievements-nøkkel, PSN-token eller Steam-nøkkel til siden. Hvert felt viser bare de fire siste tegnene, slik nøklene under fanen Skraping allerede gjorde. Hvis du lagrer uten å skrive inn på nytt, beholdes den lagrede nøkkelen
    en: Settings → My Profile no longer sends your saved RetroAchievements key, PSN token or Steam key to the page. Each box shows only its last four characters, as the Scraping tab's keys already did. Saving without retyping keeps the saved key
  - type: fix
    label: Loggvisningen åpner ikke lenger med «Ugyldig loggfil». Den listet hjelpelogger den ikke ville vise, og åpnet en av dem først; nå lister den bare logger den kan åpne
    en: The Log Viewer no longer opens on "Invalid log file". It listed helper logs it would not show, and opened one of them first; it now lists only logs it can open
  - type: fix
    label: Fanen PSN under Spillimport sender deg nå til Innstillinger → Min profil for NPSSO-token, der feltet er, i stedet for Innstillinger → API-nøkler, og tilkoblingsstatusen kan oversettes
    en: Game Imports' PSN tab now sends you to Settings → My Profile for the NPSSO token, where the box is, instead of Settings → API Keys, and its connection status can be translated
  - type: fix
    label: Når du er logget inn som seer, ber ikke sidene lenger serveren om informasjon bare for administratorer som du ikke kan få, så serverloggen fylles ikke lenger med avviste forespørsler
    en: Signed in as a viewer, pages no longer ask the server for admin-only information they cannot have, so the server log no longer fills with refused requests
  - type: security
    label: Navn som kommer utenfra RetroDB (skrapede data, fil- og mappenavn, svar fra nettjenester) vises nå alltid som ren tekst, på spillsiden, i Innstillinger, Rapporter, ROM-verktøyene, trofésidene og mer. Sidene kjører også bare handlingene til sine egne knapper, så et konstruert navn kan ikke få en side til å gjøre noe, og en «gå tilbake til»-lenke i en fremdriftsmelding kan ikke lenger føre til et annet nettsted
    en: Names that come from outside RetroDB (scraped data, file and folder names, replies from online services) now always show as plain text, on the game page, Settings, Reports, the ROM tools, the trophy pages and more. Pages also run only their own buttons' actions, so a crafted name cannot make a page do something, and a progress toast's "return to" link can no longer lead to another website
  - type: enhancement
    label: Skrapinger i kø får en Endre rekkefølge-knapp. Den åpner Købehandleren, der en ventende skraping kan kjøre tidligere, senere eller bytte plass med den som kjører nå. Hver melding om køen beholder også plassnummeret sitt etter en endring
    en: Queued bulk scrapes get a Reorder button. It opens the Queue Manager, where a waiting scrape can run sooner, later, or swap with the one running now. Each queued toast also keeps its place number after a change
  - type: fix
    label: Jobbfremdrift setter seg ikke lenger fast og gjentar seg ikke. En CHD-kontroll eller konvertering som krasjer, ender nå med årsaken; Avbryt gir siden knappene tilbake; en avvist avbrytelse, pause eller fjerning sier fra om det; «fullført» dukker ikke lenger opp igjen en time senere; og Synkroniser-knappen på prestasjonssiden kommer tilbake når synkroniseringen er ferdig
    en: Job progress no longer gets stuck or repeats itself. A CHD check or conversion that crashes now ends with its reason; Cancel gives the page its buttons back; a refused cancel, pause or remove says so; "completed" no longer pops up again an hour later; and the achievements page's Sync button comes back when its sync ends
  - type: fix
    label: Å lagre en HowLongToBeat-match på spillsiden sletter ikke lenger HLTB-lenken og spillerantallet, og en mislykket lagring kan prøves på nytt. Hurtigredigering viser ikke lenger alle lagrede matcher som «100 % match». Filtermerker i Biblioteket viser navnet på et system i stedet for nummeret, og søk mens du skriver fungerer på listesider og i Sammenlign
    en: Saving a HowLongToBeat match on the game page no longer wipes its HLTB link and player count, and a failed save can be retried. Quick Edit no longer shows every saved match as "100% match". Library filter tags show a system's name instead of its number, and search-as-you-type works on list pages and Compare
  - type: fix
    label: Alle kontoer kan endre sitt eget passord i Innstillinger → Min profil, og en administrator kan tilbakestille passordet til hvem som helst. Emulatormapper fungerer nå på Windows. Oversikten forteller ikke lenger redaktører og seere at API-ene deres er frakoblet, og «Spill uten esketrykk» åpner Biblioteket med bare de spillene. En passordbehandler kan nå fylle ut innloggingsfeltet
    en: Every account can change its own password in Settings → My Profile, and an admin can reset anyone's. Emulator folders now work on Windows. The dashboard no longer tells editors and viewers that their APIs are offline, and "Games missing box art" opens the Library showing just those games. A password manager can now fill the sign-in box
  - type: fix
    label: 'ROM-verktøy: CHD-kontroll setter hvert merke for Gyldig eller Ugyldig på riktig fil; loggvisningen viser modulnavn igjen og sier fra når fillisten feiler; «velg alle» i Spillimport importerer bare spillene filteret viser; og Tilbakestill i ROM-verktøyinnstillinger gjenoppretter ROM-mappen til denne datamaskinen'
    en: 'ROM tools: CHD Verify puts each Valid or Invalid badge on the right file; the log viewer shows module names again and says when its file list fails; Game Imports'' select-all imports only the games your filter shows; and ROM Tools Settings'' Reset restores this computer''s own ROM folder'
  - type: fix
    label: Tidspunkter for Steam-opplåsing vises som datoer; A–Å-linjen fungerer på Lokale trofeer; Velg-modus for PSN fortsetter å fungere på spill som lastes mens du ruller; seere ser ikke lenger Synkroniser- eller Gi nytt navn-knapper de ikke kan bruke; en samlet omdøping hopper over en fil som er omdøpt siden skanningen; og Analyse kan kopiere på et vanlig HTTP-nettverk og eksporterer tall som tall
    en: Steam unlock times show as dates; the A-Z bar works on Local Trophies; PSN Select mode keeps working on games that load as you scroll; viewers no longer see Sync or Rename buttons they cannot use; a batch rename skips a file renamed since the scan; and Analytics can copy on a plain-HTTP network and exports numbers as numbers
  - type: fix
    label: I et bekreftelsesvindu avbryter nå Enter på Avbryt eller × i stedet for å bekrefte. Et vindu åpnet av OK forsvinner ikke lenger, og Tab fortsetter å fungere etter at snarveislisten eller et fremdriftsvindu lukkes
    en: In a confirm window, Enter on Cancel or × now cancels instead of confirming. A window opened by OK no longer vanishes, and Tab keeps working after the shortcuts list or a progress window closes
  - type: enhancement
    label: 'Mange kontroller som bare fungerte med mus, fungerer nå fra tastaturet (Tab, deretter Enter eller mellomrom): innloggingsprofilene, søkeresultater i Sammenlign, merker og knappene Rediger og Slett for dem, spillkort for prestasjoner, loggøkter, valg av tema og avatar, bilder i Museum, × som fjerner en sjanger eller et filter, oppsettsmapper, avkrysningsbokser for skrapkilder og CLZ-importen. Av/på-brytere viser nå tastaturringen'
    en: 'Many controls that worked only with a mouse now work from the keyboard (Tab, then Enter or Space): the sign-in profiles, Compare search results, tags and their Edit and Delete buttons, achievement game cards, log sessions, theme and avatar choices, Museum pictures, the × that removes a genre or filter, setup folders, scrape-source tick boxes and the CLZ import. On/off switches now show the keyboard ring'
  - type: performance
    label: Bakgrunnsfjerneren i Museum blir ikke lenger liggende i minnet. Den klippet kontrollerbilder ut av bakgrunnen med en AI-modell som brukte over 2 GB etter første bruk, og opptil rundt 9 GB mens et bilde ble behandlet, helt til RetroDB ble startet på nytt. Nå kjører den i et hjelpeprogram som starter ved behov og lukkes to minutter etter siste bilde, slik at alt det minnet blir gitt tilbake
    en: The Museum's background remover no longer stays in memory. It cut controller photos out of their background with an AI model that took over 2 GB once used, and up to about 9 GB during a photo, until RetroDB restarted. It now runs in a helper that starts when needed and closes two minutes after its last photo, giving all of that memory back
  - type: feature
    label: 'Xbox-import trenger ikke lenger en Microsoft Azure-konto. Nå limer hver person inn sin egen gratis OpenXBL-nøkkel (fra xbl.io) under Innstillinger → Min profil, og det virker fra hvilken som helst datamaskin på nettverket ditt. Importen utelater også apper og spill kun for telefon, legger PC-spill under Windows i stedet for Xbox One, leser Xbox 360-prestasjoner riktig og viser ingen dato for en låst prestasjon. Den gratis nøkkelen tillater 150 forespørsler i timen: en stor synkronisering av prestasjoner som når grensen, stopper, sier fra og starter neste gang med spillene den ikke rakk'
    en: 'Xbox import no longer needs a Microsoft Azure account. Each person now pastes their own free OpenXBL key (from xbl.io) under Settings → My Profile, and it works from any computer on your network. The import also leaves out apps and phone-only games, files PC games under Windows instead of Xbox One, reads Xbox 360 achievements the right way, and shows no date for a locked achievement. The free key allows 150 requests an hour: a big achievement sync that reaches it stops, says so, and next time starts with the games it had not reached'
  - type: enhancement
    label: En synkronisering eller oppdatering av RetroAchievements som du ber om mens en annen kjører, venter nå på serveren og starter av seg selv når den forrige er ferdig, selv om du lukker siden eller ba om den fra en annen enhet. Alle sider viser den samme ventelisten med hver jobbs plass i køen, og ✕ fjerner en jobb. Etter en omstart av serveren blir ventende jobber tilbudt på nytt på oversikten
    en: A RetroAchievements Sync or Refresh you ask for while another one runs now waits on the server and starts by itself when that one finishes, even if you close the page or asked from another device. Every page shows the same waiting list with each job's place in line, and ✕ takes a job out. After a server restart, waiting jobs are offered back on the Dashboard
  - type: fix
    label: Knappen Oppdater RA på en konsolls side fungerer igjen. Den oppga ikke hvilken konsoll det gjaldt, så serveren svarte «Ikke funnet»
    en: The Refresh RA button on a console's page works again. It did not say which console, so the server answered "Not found"
  - type: fix
    label: Kontrollen av ROM-navn behandler nå hvert system som den typen Systemer-siden viser. Macintosh, ZX Spectrum Next, Coleco Adam og Thomson kontrolleres som datamaskiner, og 3DS og PS Vita som håndholdte, i stedet for som konsoller. En type du har satt på Systemer-siden blir også fulgt nå
    en: The ROM naming check now treats each system as the kind the Systems page shows. Macintosh, ZX Spectrum Next, Coleco Adam and Thomson are checked as computers, and 3DS and PS Vita as handhelds, instead of as consoles. A type you set on the Systems page is now followed too
  - type: performance
    label: RetroDB bruker mye mindre minne mens den venter. AI-bildeoppskaleren lastes nå bare inn når den skalerer opp, i en hjelpeprosess som lukkes to minutter etter det siste bildet. En server i hvilemodus gikk fra rundt 1,4 GB til under 100 MB. Hvis grafikkdriveren krasjer under oppskalering, stopper bare hjelpeprosessen, aldri serveren
    en: RetroDB uses far less memory while it waits. The AI image upscaler now loads only while it is upscaling, in a helper that closes two minutes after its last picture; an idle server dropped from about 1.4 GB to under 100 MB. If the graphics driver crashes during an upscale, only the helper stops, never the server
  - type: performance
    label: AI-utfylling med Claude-nettsøk koster mindre. Claude leser søkeresultatene på nytt etter hvert søk; RetroDB ber nå Anthropic om å ha dem klare, og en ny gjennomlesing koster da en tidel av prisen eller mindre
    en: AI Fill with Claude web search costs less. Claude reads the search results again after each search; RetroDB now asks Anthropic to keep them ready, and a re-read then costs a tenth of the price or less
  - type: fix
    label: 'Zulu og xhosa er blitt bedre å lese: 133 linjer som sa noe feil, er rettet, for eksempel «Edition» som ble vist som «Chapter», og «must be text» som ble vist som «must be a letter». Hver rettelse ble godkjent av to separate KI-kontroller'
    en: 'Zulu and Xhosa read better: 133 lines that said the wrong thing are corrected, such as "Edition" shown as "Chapter" and "must be text" shown as "must be a letter". Each correction was agreed by two separate AI checks'
  - type: fix
    label: Når et spill ikke vil starte, vises meldingen nå på ditt språk, og den nevner fortsatt emulatoren, kjernen eller filen som har skylden. En feil inne i selve datamaskinen viser nå «Kunne ikke starte» og navnet på programmet, med detaljene i serverloggen, i stedet for rå systemtekst. Hvis RetroAchievements avviser en pålogging, vises RetroAchievements' egen begrunnelse inne i en oversatt setning
    en: When a game will not start, the message is now in your language and still names the emulator, core or file at fault. A failure inside the computer itself now says "Could not start" and the program's name, with the details in the server log, instead of raw system text. A refused RetroAchievements sign-in shows RetroAchievements' own reason inside a translated sentence
  - type: fix
    label: Når du avbryter en skrape-, synkroniserings- eller bildejobb som allerede er ferdig, forsvinner nå den fastlåste fremdriftsvisningen. Hvis du starter en jobb som allerede kjører, vises den faktiske årsaken, for eksempel «A scrape for SNES is already running», i stedet for «Network error». Feil med kontrollerbilder i Museum forklarer nå hva som gikk galt, og hvis du avbryter en annen brukers RetroAchievements-synkronisering, får du beskjed om at den tilhører den brukeren, i stedet for at den later som om den avbrytes
    en: Cancelling a scrape, sync or image job that has already finished now clears its stuck progress popup. Starting a job that is already running shows the real reason, such as "A scrape for SNES is already running", instead of "Network error". Controller image errors in the Museum now say what went wrong, and cancelling another user's RetroAchievements sync says it is theirs instead of pretending to cancel it
  - type: security
    label: Loggvisningen skjuler nå passord og nøkler også i eldre loggfiler. Logger som ble skrevet før RetroDB lærte å skjule et bestemt passord, for eksempel fra ScreenScraper, viste det i klartekst når de ble vist eller lastet ned
    en: The log viewer now hides passwords and keys in older log files too. Logs written before RetroDB learned to hide a particular password, such as ScreenScraper's, showed it in plain text when viewed or downloaded
  - type: security
    label: Når du tilbakestiller alle innstillinger til standard, beholdes nå ROM-mappen din og beskjeden om at oppsettet er ferdig. Før åpnet en tilbakestilling oppsettsidene for første gangs bruk på nytt. De fungerer uten pålogging, helt til en administrator kjørte oppsettet igjen
    en: Resetting all settings to their defaults now keeps your ROM folder and the fact that setup is done. Before, a reset reopened the first-time setup pages, which work without signing in, until an admin ran setup again
  - type: feature
    label: Arkadespill kan igjen gi RetroAchievements. RetroDB kobler nå et arkadespill bare når RetroAchievements kjenner det nøyaktige filnavnet, for eksempel sf2 for Street Fighter II, så det gjetter ikke lenger ut fra titler og kobler feil spill. Arkadespillene dine kobles neste gang RetroAchievements-dataene deres oppdateres eller de skrapes
    en: Arcade games can earn RetroAchievements again. RetroDB now links an arcade game only when RetroAchievements knows its exact file name, such as sf2 for Street Fighter II, so it no longer guesses from titles and links the wrong game. Your arcade games link the next time their RetroAchievements data is refreshed or they are scraped
  - type: fix
    label: Synkronisering av PlayStation-trofeer retter nå opp spillkoblinger som tidligere ble gjort feil, for eksempel mange spill koblet til et urelatert spill kalt «D». En kobling du har satt selv, endres aldri av en synkronisering. Neste synkronisering sjekker alle eldre koblinger på nytt, så noen nesten-treff kan bli frakoblet. Koble dem til på nytt manuelt
    en: PlayStation trophy sync now corrects game links it made wrongly before, such as many games linked to an unrelated game called "D". A link you set yourself is never changed by a sync. The next sync checks all older links again, so a few near matches may come unlinked; link those again by hand
  - type: fix
    label: Hvis du flytter en ventende masseskrape foran en som kjører, legges ikke lenger det siste spillet fra den gamle skrapen til tallene for den nye. Hvis du klikker «Scrape all» på ønskelisten mens en allerede kjører, får du nå beskjed om det i stedet for at den påstår å ha startet
    en: Moving a waiting bulk scrape ahead of a running one no longer adds the old scrape's last game to the new one's counts. Clicking "Scrape all" on the wishlist while one is already running now says so, instead of claiming it started
  - type: accessibility
    label: 'Med skjermleser sier «kjører»-knappen nå «1 game running» bare når antallet endres, i stedet for å lese opp et nakent tall med noen sekunders mellomrom. Listen åpnes som et navngitt vindu med markøren inni, knappene Kill og Next disk sier hvilket spill de gjelder, og etter Kill går markøren tilbake til et fornuftig sted. Hvert spillkort i biblioteket kan nå åpnes med tastaturet fra tittelen, og filterknappene sier hva de filtrerer, for eksempel «Filter by Developer: Konami»'
    en: 'With a screen reader, the "running" button now says "1 game running" only when the count changes, instead of reading a bare number every few seconds. Its list opens as a named window with the cursor inside, its Kill and Next disk buttons say which game they act on, and after Kill the cursor returns to a sensible place. Each game card in the library now opens with the keyboard from its title, and its filter buttons say what they filter, such as "Filter by Developer: Konami"'
  - type: feature
    label: Alle medlemmer kan nå legge til sin egen Steam-nøkkel og Steam-ID under Innstillinger → Min profil, og importere sitt eget Steam-bibliotek og sine egne prestasjoner. Til nå kunne bare en administrator det
    en: Every member can now add their own Steam key and Steam ID under Settings → My Profile, and import their own Steam library and achievements. Until now only an admin could
  - type: fix
    label: Når du lagrer detaljer om et spill, settes ikke lenger tomt spillerantall til 1, og aldersgrensene RetroDB har funnet ut selv, markeres ikke lenger som skrevet av deg. AI-utfylling beholder et spill du har markert som Exclusive, og beholder alle endringer du gjør i et spill mens det venter på svar fra AI-en. Historikken til en skrape viser nå bare detaljene den faktisk lagret
    en: Saving a game's details no longer sets an empty player count to 1, and no longer marks the age ratings RetroDB worked out for you as typed by you. AI Fill keeps a game you marked Exclusive, and keeps any change you make to a game while it is waiting for the AI's answer. A scrape's history now lists only the details it actually saved
  - type: fix
    label: Gjennomgang av skjermbilder stopper ikke lenger halvveis når ett lagret skjermbilde er altfor stort til å åpnes. Bildet telles som uleselig, og gjennomgangen fortsetter. Innholdslisten på hjelpesiden lenker nå til Emulatorer og Spilling, og utviklernotatene om pålogging, bakgrunnsjobber, skraping, bilder, oppdateringer og feilsvar beskriver nå hva programmet faktisk gjør
    en: Screenshot Review no longer stops halfway when one stored screenshot is far too large to open; it counts that picture as unreadable and carries on. The help page's contents list now links to Emulators and Playing, and the developer notes on sign-in, background jobs, scraping, pictures, updates and error replies now say what the program really does
  - type: fix
    label: En redaktør som starter en skanning i ROM-verktøy, kan nå sette den på pause, fortsette eller avbryte den. Andres skanninger kan fortsatt bare stoppes av en administrator. Tagger og lister avviser manglende navn eller ugyldig farge med en tydelig melding i stedet for en feilside, og det å gi et ønskelistespill samme navn som et annet du allerede ønsker deg, avvises, slik det også gjøres når du legger det til. Clear RA Data glemmer nå også om kopien din gir prestasjoner. Et trofé RetroDB ikke lenger tilbyr, teller ikke lenger med i samlerrangeringen din. Windows-ROM-stier matcher nå RetroAchievements-spill ut fra filnavn
    en: An editor who starts a ROM Tools scan can now pause, resume or cancel it; other people's scans stay an admin's to stop. Tags and lists refuse a missing name or a bad colour with a clear message instead of an error page, and renaming a wishlist game onto another one you already wish for is refused, as adding it is. Clear RA Data now also forgets whether your copy earns achievements. A trophy RetroDB no longer offers stops counting toward your collector rank. Windows ROM paths now match RetroAchievements games by file name
  - type: fix
    label: Vedlikeholdsrettinger. Et arkiv med flere disker som ikke lar seg pakke ut, etterlater ikke lenger en halvferdig mappe som blokkerer alle nye forsøk. Calculate Storage teller nå alle filer i en PS3-spillmappe. Clear Scraped Data sletter bilder bare når du ber om det. En bibliotekskanning som støter på et spill en annen skanning nettopp la til, fortsetter med resten av spillene til den konsollen
    en: Maintenance fixes. A multi-disc archive that fails to unpack no longer leaves a half-made folder behind that blocks every retry. Calculate Storage now counts every file inside a PS3 game folder. Clear Scraped Data deletes pictures only when you ask it to. A library scan that meets a game another scan has just added carries on with the rest of that console's games
  - type: fix
    label: Gjenoppretting av en sikkerhetskopi er tryggere. Den skrives nå inn i bibliotekdatabasen slik databasen selv forventer, så en del av RetroDB som har den åpen, ser de gjenopprettede dataene i stedet for å risikere skade. Når du sletter et spill, slettes nå også eskebildene, det ventende bildet og emulatorinnstillingene til spillet, så et nytt spill aldri kan arve dem. To innstillinger som lagres samtidig, mister ikke lenger den ene
    en: Restoring a backup is safer. It is now written into the library database the way the database itself expects, so a part of RetroDB that has it open sees the restored data instead of risking damage. Deleting a game now also deletes its box pictures and its waiting picture and emulator-setting entries, so a new game can never inherit them. Two settings saved at the same moment no longer lose one of them
  - type: fix
    label: Bilderettinger. GIF-er sendes ikke lenger gjennom oppskaleringen bare for å bli kastet. Oppskaleringsmodellen sjekkes mot det publiserte fingeravtrykket, og en dårlig nedlasting hentes på nytt i stedet for at oppskalering slås av for godt. Logoer og bilder med gjennomsiktige deler beholder gjennomsiktigheten når de forstørres. Convert to WebP tar nå også med bakdeksler og logoer, og avviser ikke lenger et stort bibliotek på grunn av plass det ikke trenger. To sider av en eskefil kan dele ett bilde, og når en eske med en skadet post fjernes, fjernes også bildene dens
    en: Picture fixes. GIFs are no longer run through the upscaler only to be thrown away. The upscaler model is checked against its published fingerprint, and a bad download is fetched again instead of turning upscaling off for good. Logos and pictures with see-through parts keep their transparency when enlarged. Convert to WebP now takes back covers and logos too, and no longer refuses a large library for want of room it does not need. Two faces of a box file can share one picture, and removing a box with a damaged record removes its pictures
  - type: fix
    label: Import fra CLZ, Steam, Xbox og PlayStation behandler ikke lenger alle titler skrevet bare på japansk eller et annet ikke-latinsk skriftsystem som det samme spillet, og legger ikke lenger til spill uten ID. CLZ-forhåndsvisningen legger ikke lenger til konsoller før du bekrefter importen, og en seer som ser på et Steam-, Xbox- eller PlayStation-bibliotek, legger dem heller ikke til. Et Steam-spill som er fjernet fra butikken, det spørres om én gang, ikke ved hver synkronisering
    en: Imports from CLZ, Steam, Xbox and PlayStation no longer treat every title written only in Japanese or another non-Latin script as the same game, and no longer add a game with no id. The CLZ preview no longer adds consoles before you confirm the import, and a viewer looking at a Steam, Xbox or PlayStation library no longer adds them either. A Steam game removed from the store is asked about once, not on every sync
  - type: fix
    label: Analytics grupperer nå mange flere konsoller under produsenten i stedet for «Other», og Recently Scraped-listen på dashbordet viser et spill du har skrapet på nytt, ikke bare nylig tillagte spill
    en: Analytics now groups many more consoles under their maker instead of "Other", and the dashboard's Recently Scraped list shows a game you scraped again, not only newly added games
  - type: fix
    label: Kontrollerbilder du legger til i Museum, beholdes når frittstående versjon oppdateres. Når en nettjeneste settes på pause ved grensen sin, vises tidspunktet den spørres igjen i din egen tidssone
    en: Controller pictures you add in the Museum are kept when the standalone version updates. When an online service pauses at its limit, the time it will be asked again is shown in your own time zone
  - type: fix
    label: En bonusdisk kan ikke lenger kobles til seg selv eller til en annen bonusdisk, og Auto-link kobler ikke lenger en disk til en som den selv markerer som bonusdisk i samme kjøring
    en: A bonus disc can no longer be linked to itself or to another bonus disc, and Auto-link no longer links a disc to one it marks as a bonus disc in the same run
  - type: fix
    label: Bibliotek- og konsollsidene teller ikke lenger arkade-BIOS-filer som spill, verken i totalene eller i bokstavlinjen. Lignende spill og listen du får når du klikker på en sjanger eller utgiver på et spills side, viser ikke lenger spillets egne regionversjoner, bonusdisker eller BIOS-filer
    en: The Library and console pages no longer count arcade BIOS files as games, in their totals or the letter bar. Similar games, and the list you get by clicking a genre or publisher on a game's page, no longer show the game's own regional versions, bonus discs or BIOS files
  - type: fix
    label: Velg alle sier nå fra når en veldig stor liste er kuttet, i stedet for stille å velge bare en del av den
    en: Select all now says so when a very large list is cut short, instead of quietly selecting only part of it
  - type: fix
    label: Bibliotekkortene oppdateres nå når prestasjons- eller trofé-fremgangen din endres, og når et spill blir spillbart eller slutter å være det
    en: Library cards now update when your achievement or trophy progress changes, and when a game becomes playable or stops being playable
  - type: fix
    label: Masseredigering kan ikke lenger endre feil spill når den får et ugyldig utvalg, og en masseredigering som mislykkes, markerer ikke lenger spillene som redigert av deg
    en: Bulk edit can no longer change the wrong games when it is sent a bad selection, and a bulk edit that fails no longer marks the games as edited by you
  - type: fix
    label: Et HowLongToBeat-treff som bare passer 1 %, vises ikke lenger som 100 % treff, og en side som ikke lastes, viser feilsiden i stedet for rå feiltekst
    en: A HowLongToBeat match that is only a 1% fit is no longer shown as a 100% match, and a page that fails to load shows the error page instead of the raw error text
  - type: security
    label: Når du bytter passord, eller en administrator tilbakestiller det, logges kontoen nå ut på alle andre enheter. Derfor må alle logge inn én gang til etter denne oppdateringen. Oppsettsiden ved første gangs bruk får også samme beskyttelse mot andre nettsteder som alle andre sider
    en: Changing your password, or an admin resetting it, now signs that account out on every other device. Because of this, everyone signs in once more after this update. The first-run setup page also gets the same protection against other websites as every other page
  - type: fix
    label: Et bilde som avvises som avatar, sletter ikke lenger avataren du hadde
    en: A picture that is refused as your avatar no longer deletes the avatar you had
  - type: fix
    label: Skraping er skånsommere mot nettjenestene. En tjeneste som stadig feiler, hoppes over en stund når hull fylles, slik det allerede ble gjort i søk, og oppslag av spill hos ScreenScraper respekterer nå også dens daglige grenser
    en: Scrapes are gentler on the online services. A service that keeps failing is skipped for a while when filling gaps, as it already was in searches, and ScreenScraper game lookups now respect its daily limits too
  - type: fix
    label: En skrape feiler ikke lenger på et spill med ukjent utgivelsesår, for eksempel «TBA», og et spill som er oppført for regioner utenfor listen din, for eksempel «Brazil, Korea», beholder regionen sin i stedet for å bli din standard
    en: A scrape no longer fails on a game whose release year is unknown, such as "TBA", and a game listed for regions outside your list, such as "Brazil, Korea", keeps its region instead of becoming your default
  - type: fix
    label: ES-DE-mapper skrevet som ~/ fungerer nå, og en veldig stor ES-DE-fil kopieres ikke lenger. Foreslåtte regionversjoner setter aldri sammen igjen to spill du har sagt ikke er versjoner av hverandre
    en: ES-DE folders written as ~/ now work, and a very large ES-DE file is no longer copied. Suggested regional versions never put back together two games you said are not versions of each other
  - type: security
    label: RetroDB avviser noen flere private nettverksadresser når bilder hentes fra nettet, og følger omdirigeringen til en nettadresse riktig
    en: RetroDB refuses a few more private network addresses when fetching pictures from the web, and follows a web address's redirect correctly
  - type: fix
    label: De siste skjermene som fortsatt var på engelsk, følger nå også språket ditt, blant annet oppsettsveiviseren, Tagger, Lister, Sammenlign spill, innstillinger for ROM-verktøy, masseskrapekøen, listen over avbrutte jobber på dashbordet, etikettene på bibliotekkortene og mange feilmeldinger
    en: The last screens still in English now follow your language too, including the setup wizard, Tags, Lists, Compare Games, ROM Tools settings, the bulk scrape queue, the dashboard's interrupted-jobs list, the library card labels and many error messages
  - type: security
    label: Et systemnavn som inneholder nettkode, kan ikke lenger kjøre den i vinduet for masseskrapekøen
    en: A system name holding web code can no longer run it in the bulk scrape queue window
  - type: accessibility
    label: Uansett hvor du er på en side, vises tastaturets plass nå med en tykk ring i temaets farge, på alle knapper, bokser og lenker. Før viste mange kontroller bare en svak linje, den samme som når musen er over dem
    en: Wherever you are on a page, the keyboard's place is now marked with a bold ring in your theme's colour, on every button, box and link. Before, many controls showed only a faint line, the same as when the mouse passed over them
  - type: accessibility
    label: Lenkene for sjanger, serie, utvikler og utgiver på bibliotekkortene fungerer nå fra tastaturet. «Kjører»-knappen for spill som spilles, åpnes også fra tastaturet, og Esc eller et klikk utenfor lukker listen
    en: The Genre, Series, Developer and Publisher links on library cards now work from the keyboard. The "running" button for games in play opens from the keyboard too, and Esc or a click elsewhere closes its list
  - type: accessibility
    label: Skjermlesere navngir nå hver tagfarge og sier hvilken som er valgt, og leser trofébilder som Platina, Gull, Sølv og Bronse i stedet for enkeltbokstaver. Mens et spill starter, flytter ikke Tab seg lenger bak startskjermen
    en: Screen readers now name each tag colour and say which one is chosen, and read trophy pictures as Platinum, Gold, Silver and Bronze instead of single letters. While a game starts, Tab no longer moves behind the starting screen
  - type: fix
    label: Hvis en oppdatering stopper før den begynner å bytte filer, starter RetroDB nå versjonen du hadde igjen, i stedet for å forbli lukket
    en: If an update stops before it starts swapping files, RetroDB now starts the version you had again, instead of staying closed
  - type: fix
    label: Hvis du trykker på Spill to ganger samtidig, kan det ikke lenger starte to spill i den innebygde spilleren. Ventingen på nedlasting av en kjerne gir nå opp etter en stund, eller når RetroDB slutter å svare, i stedet for å vente for alltid, og spørsmålet om at spillet allerede kjører, bruker RetroDBs egen dialog
    en: Pressing Play twice at once can no longer start two games on the built-in player. Waiting for a core download now gives up after a while, or when RetroDB stops answering, instead of waiting forever, and the "already running" question uses RetroDB's own dialog
  - type: fix
    label: Juksekoder du slår på eller av under spilling, beholdes for riktig spill og hentes aldri fra et annet spill med samme filnavn. Et problem med juksekoder hindrer aldri at et spill starter
    en: Cheats you switch on or off during play are kept for the right game, never taken from another game whose file has the same name. A cheat problem never stops a game starting
  - type: fix
    label: RetroDB skriver en emulators innstillingsfil tryggere. En innstillingsfil som er en lenke, forblir en lenke, beholder tillatelsene sine og beholder tegn den ikke kan lese, og en mislykket lagring etterlater ingen løs fil
    en: RetroDB writes an emulator's settings file more safely. A settings file that is a link stays a link, keeps its permissions, and keeps letters it cannot read, and a failed save leaves no stray file behind
  - type: fix
    label: En masseskrape du flytter nedover i køen, bytter med en annen eller gjenopptar mens en kjører, går ikke lenger tapt når RetroDB starter på nytt. Dashbordet tilbyr den, fra der den stoppet. En utbyttet skrape fortsetter ikke lenger å kjøre ved siden av den nye, og to raske klikk på Gjenoppta starter jobben bare én gang
    en: A bulk scrape you move down the queue, swap with another or resume while one runs is no longer lost when RetroDB restarts; the dashboard offers it, from where it stopped. A swapped-out scrape no longer keeps running beside the new one, and two quick clicks on Resume start a job once
  - type: fix
    label: Feil i ett spill, for eksempel at nettverket faller ut, avslutter ikke lenger en hel kjøring av AI-utfylling eller Reparer regioner for coverbokser og manualer. Spillet telles som mislykket, og resten fortsetter. Når RetroDB stoppes, stoppes nå også kjernenedlastinger på en ryddig måte
    en: One game's error, such as the network dropping, no longer ends a whole AI Fill run or a Fix Box and Manual Regions run; that game counts as failed and the rest go on. Stopping RetroDB now also stops core downloads cleanly
  - type: fix
    label: Ønskelisteelementer blir ikke lenger stående på «skraper» for alltid etter en feil eller omstart, og to Skrap alle-kjøringer for samme ønskeliste kjører ikke lenger samtidig
    en: Wishlist items no longer stay on "scraping" forever after an error or a restart, and two Scrape All runs for the same wishlist no longer run at once
  - type: fix
    label: Et skript eller en ekstra kopi av RetroDB som starter, markerer ikke lenger jobbene til den kjørende serveren som avbrutt, og to kopier som starter samtidig kan ikke lenger sette databasen tilbake én versjon
    en: A script or a second copy of RetroDB starting up no longer marks the running server's jobs as interrupted, and two copies starting at once can no longer set the database back a version
  - type: fix
    label: Å starte en PlayStation-synkronisering får ikke lenger alles fremdriftslinjer til å vente mens den logger inn hos Sony. Den daglige PlayStation-vedlikeholdsjobben fornyer nå innloggingen først mot slutten av de 10 dagene, ikke hver dag
    en: Starting a PlayStation sync no longer makes everyone's progress bars wait while it signs in to Sony. The daily PlayStation keep-alive now renews a sign-in only near the end of its 10 days, instead of every day
  - type: fix
    label: En skraping skriver ikke lenger over en endring du gjør mens den kjører, og tømmer ikke lenger en sjanger, modus eller visning den ikke har navn på. Den endrer ikke lenger et lagret spillerantall for å passe til spillets moduser
    en: A scrape no longer writes over a change you make while it runs, and no longer empties a genre, mode or view it has no name for. It no longer changes a stored player count to match the game's modes
  - type: fix
    label: AI-utfylling endrer ikke lenger det du har skrevet selv, for eksempel en utgiver eller sjanger du har rettet for hånd; den korrigerer bare skrapede verdier. Den melder ikke lenger en verdi som endret når den bare er skrevet annerledes, for eksempel 4 spillere som «1-4» eller de samme sjangrene i en annen rekkefølge
    en: AI Fill no longer changes what you typed yourself, such as a publisher or genre you corrected by hand; it corrects only scraped values. It no longer reports a value as changed when it only wrote it differently, such as 4 players as "1-4" or the same genres in another order
  - type: fix
    label: En kontroller du skriver inn for et spill beholdes; konsollens standardkontroller erstatter nå bare skrapede verdier og AI-verdier. En aldersgrense konvertert fra et annet system sitt AI-gjett er nå også merket som et gjett
    en: A controller you type for a game is kept; the console's default controller now replaces only scraped and AI values. An age rating converted from another board's AI guess is now marked as a guess too
  - type: fix
    label: Når du lagrer redigeringsvinduet til et spill, tømmes ikke lenger felt som vinduet ikke viser. Tilbakestill på et spills side fjerner nå alt det sier at den gjør, inkludert visning, utgave og andre navn, sletter spillets bilder og videoer med mindre et annet spill bruker dem, og oppdaterer bibliotekfiltrene med en gang
    en: Saving a game's edit window no longer empties fields the window does not show. Reset on a game's page now clears everything it says it does, including the view, edition and other names, deletes the game's pictures and videos unless another game uses them, and updates the library filters straight away
  - type: fix
    label: Tøm skrapede data tømmer nå også visning, 2D eller 3D, og spillstruktur. En CLZ-import av et spill med bare årstall beholder bare året, ikke 1. januar
    en: Clear Scraped Data now also clears the view, 2D or 3D, and game structure. A CLZ import of a game with only a year keeps just the year, not 1 January
  - type: security
    label: Steam-synkronisering låner ikke lenger Steam-nøkkelen fra Innstillinger for alle i husholdningen. Et medlem uten egen Steam-nøkkel fikk adminens Steam-bibliotek og prestasjoner på sin konto. Nøkkelen i Innstillinger gjelder nå bare administratorer
    en: Steam sync no longer borrows the Steam key from Settings for every household member. A member with no Steam key of their own was getting the admin's Steam library and achievements under their account. The key in Settings now serves admins only
  - type: fix
    label: Oppslaget til How Long to Beat for mange spill lagrer nå tidene det er sikkert på. Før feilet alle sikre treff og ingenting ble lagret. Oppdatering av RetroAchievements sjekker nå også hver spillfil mot listen til RetroAchievements, slik en skraping gjør, så et spill kobles til nøyaktig den versjonen du har
    en: How Long to Beat's lookup for many games now saves the times it is sure of. Before, every sure match failed and nothing was saved. RetroAchievements Refresh now also checks each game's file against RetroAchievements' list, as a scrape does, so a game is linked to the exact version you have
  - type: fix
    label: Meldingen om at en bakgrunnsjobb er ferdig vises igjen, og fremdriftsboksen til en jobb merker når serveren tar opp jobben etter en omstart. Før dukket ingen av dem opp
    en: The message that a background job has finished shows again, and a job's progress box notices when the server picks the job up after a restart. Before, neither ever appeared
  - type: fix
    label: 'PlayStation-trofeer: et spill du har koblet for hånd forblir koblet etter en full synkronisering, og en synkronisering kobler ikke lenger et spill til oppfølgeren, for eksempel «Doom» til «Doom Eternal». Import av PlayStation-spill kobler nå et spill som allerede er i biblioteket, slik Steam- og Xbox-import gjør, så trofeene vises på det'
    en: 'PlayStation trophies: a game you linked by hand stays linked after a full sync, and a sync no longer links a game to its sequel, such as "Doom" to "Doom Eternal". Importing PlayStation games now links a game already in your library, as Steam and Xbox imports do, so its trophies show on it'
  - type: fix
    label: Xbox viser ikke lenger gamertaggen din som Ukjent etter at innloggingen fornyer seg selv, og en treg eller mislykket tilkobling logger deg ikke lenger ut av Xbox. Bare hvis Microsoft nekter innloggingen skjer det
    en: Xbox no longer shows your gamertag as Unknown after its sign-in renews itself, and a slow or failed connection no longer signs you out of Xbox. Only Microsoft refusing the sign-in does that
  - type: fix
    label: To personer kan nå hver ha en etikett med samme navn; før feilet den andre med en feil. Alle innloggede brukere kan nå skanne sine egne RPCS3-trofeer på nytt; før kunne bare en administrator det, og alle andre så gamle trofeer til RetroDB ble startet på nytt
    en: Two people can now each have a tag of the same name; before, the second one failed with an error. Any signed-in user can now rescan their own RPCS3 trophies; before, only an admin could, and everyone else saw old trophies until RetroDB restarted
  - type: security
    label: Innloggingene dine forblir private. Sikkerhetskopier av databasen kan ikke lenger leses av andre kontoer på datamaskinen, og en mislykket sikkerhetskopi sletter ikke lenger den forrige. Når en bruker slettes eller slås av, logges den også ut av RetroAchievements i DuckStation og PCSX2. En RetroAchievements-innlogging lagret fra spillerens egen meny går ikke lenger over til neste person som spiller. Logger og lagrede jobbfeil skjuler RetroAchievements-tokens, et annet medlems PlayStation-feil vises bare for dem, og gamle PlayStation- og Xbox-innloggingsfiler i ren tekst fjernes
    en: Your sign-ins stay private. Database backups can no longer be read by other accounts on the computer, and a failed backup no longer deletes the one before it. Deleting or switching off a user also signs them out of RetroAchievements in DuckStation and PCSX2. A RetroAchievements sign-in saved from the player's own menu no longer carries over to the next person who plays. Logs and saved job errors hide RetroAchievements tokens, another member's PlayStation error is shown only to them, and old plain-text PlayStation and Xbox sign-in files are removed
  - type: fix
    label: RetroDBs egne kontroller kan ikke lenger røre biblioteket ditt mens de kjører. De bruker alltid en engangskopi av databasen, bildene og innstillingene, og nekter å starte hvis noen av dem peker til de virkelige filene dine
    en: RetroDB's own checks can no longer touch your library while they run. They always use a throwaway copy of the database, pictures and settings, and refuse to start if any of them points at your real files
  - type: fix
    label: Rydd opp foreldreløse filer sletter ikke lenger bildene til ønskelisten din. Å åpne et spill får det ikke lenger til å glemme skjermbilder det ikke finner. Før mistet hvert spill du åpnet hele skjermbildelisten når bildestasjonen var frakoblet; nå beholdes listen, og et manglende bilde skjules bare
    en: Clean orphaned files no longer deletes your wishlist's pictures. Opening a game no longer makes it forget screenshots it cannot find. Before, with the picture drive unplugged, every game you opened lost its whole screenshot list; now the list is kept, and a missing picture is only hidden
  - type: fix
    label: En nedlasting av video eller manual som feiler underveis ødelegger ikke lenger kopien spillet allerede hadde, og en mislykket nedlasting etterlater ikke lenger en skjult halv fil i mediemappen. Oppskaleringen i bakgrunnen lagrer ikke lenger et gammelt bilde over et nyere som ble lastet ned i mellomtiden. Konverter til WebP lar alle spill som deler et bilde fortsatt peke til det, og rører aldri en fil utenfor bildemappene
    en: A video or manual download that fails part-way no longer damages the copy the game already had, and a failed download no longer leaves a hidden half-file in the media folder. The background upscaler no longer saves an old picture over a newer one downloaded meanwhile. Convert to WebP keeps every game that shares a picture pointing at it, and never touches a file outside the picture folders
  - type: fix
    label: Å slette et spill eller et ønskelisteelement sletter nå også bildene, videoene og manualene, men beholder det et annet spill eller ønskelisteelement fortsatt bruker. Lagrede bilder kan igjen leses av andre kontoer på datamaskinen, og Endre størrelse på bilder teller et bilde som ikke kunne lagres som mislykket, ikke som ferdig
    en: Deleting a game or a wishlist item now deletes its pictures, videos and manuals too, but keeps any another game or wishlist item still uses. Saved pictures can be read by other accounts on the computer again, and Resize Images counts a picture it could not save as failed, not as done
  - type: fix
    label: Duplikatsøk foreslår ikke lenger en fungerende fil for sletting. Ved søk på navn kaller det ikke lenger et spills .cue- og .bin-kopier for kopier av hverandre. Det foreslår aldri sporfilen til en plate, som to versjoner av et spill kan dele. Det sletter ikke en plate som er oppført i en spilleliste. Et spill der du sletter filen flyttes nå til kopien du beholder, så det blir i biblioteket
    en: Duplicate Finder no longer offers a working file for deletion. Looking by name, it no longer calls a game's .cue and .bin copies of each other. It never offers a disc's track file, which two versions of a game can share. It will not delete a disc that a playlist lists. A game whose file you delete now moves to the copy you keep, so it stays in the library
  - type: fix
    label: Organiser flere plater skriver ikke lenger over en eksisterende spilleliste eller en fil som allerede ligger i spillets mappe; den stopper og sier hvilken. Spillelisten den lager viser hver plates .cue, ikke sporfilene. Spill der filene flyttes følger nå med inn i mappen, så Fjern manglende ROM-er fjerner dem ikke lenger
    en: Organize Multi-Disc no longer writes over an existing playlist or a file already in the game's folder; it stops and says which. The playlist it makes lists each disc's .cue, not its track files. Games whose files it moves now follow them into the folder, so Clean missing ROMs no longer removes them
  - type: fix
    label: Konvertering til CHD med «slett originaler» sletter nå også platens sporfiler, men beholder et spor som en annen .cue fortsatt bruker. Spillet og alle spillelister som listet den gamle platen peker nå til den nye .chd-filen. Å gi nytt navn til et spills fil oppdaterer nå spillelisten som viser den, og en sporfil som en .cue trenger kan ikke få nytt navn. Fjerning av filer fra en zip fjerner bare filene du valgte, selv når et navn inneholder [ eller ]. Skjermbildeopprydding sletter bare kopiene skanningen fant, og beholder alltid én
    en: Converting to CHD with "delete originals" now deletes the disc's track files too, but keeps a track another .cue still uses. The game and any playlist that listed the old disc now point at the new .chd. Renaming a game's file now updates the playlist that lists it, and a track file a .cue needs cannot be renamed. Removing files from a zip removes only the files you picked, even when a name holds [ or ]. Screenshot Dedup deletes only the copies its scan found, and always keeps one
  - type: fix
    label: How Long to Beat på et spills side søker etter det du skriver. Før gjorde en tittel det ikke fant at det søkte etter spillets andre navn i stedet, og det kunne foreslå et annet spill, for eksempel en fan-nyinnspilling. Det prøver fortsatt de andre navnene når boksen inneholder spillets eget navn
    en: How Long to Beat on a game's page searches for what you type. Before, a title it could not find made it search the game's other names instead, and it could offer a different game, such as a fan remake. It still tries the other names when the box holds the game's own name
  - type: fix
    label: Trinnene for How Long to Beat i hjelpemanualen stemmer nå med skjermen. De sa at du skulle velge et treff fra en liste; siden viser ett treff med Lagre og Avbryt. PlayStation-hjelpen sier ikke lenger at innloggingen varer i omtrent to måneder, siden RetroDB logger inn på nytt av seg selv. Alle 20 oversatte manualer har begge endringene
    en: The help manual's How Long to Beat steps match the screen. They said to pick a match from a list; the page shows one match with Save and Cancel. The PlayStation help no longer says the sign-in lasts about two months, since RetroDB signs in again by itself. All 20 translated manuals carry both changes
  - type: fix
    label: Hver bokstavlinje starter nå med en Alle-knapp. På sidene Bibliotek, konsoll og PSN-trofeer viser valg av en bokstav bare spillene med den bokstaven, og før fantes det ingen knapp for å få tilbake resten. På de andre prestasjonssidene går Alle tilbake til det første spillet
    en: Every letter bar now starts with an All button. On the Library, console and PSN Trophies pages, picking a letter shows only that letter's games, and before there was no button to bring the rest back. On the other achievement pages, All goes back to the first game
  - type: fix
    label: Et nytt PlayStation-innloggingstoken du limer inn i Innstillinger brukes nå med en gang. Før brukte RetroDB den gamle innloggingen til den gikk ut, og Lagre og test tilkobling meldte at den gamle innloggingen fungerte. Et token som Sony nekter erstatter ikke lenger et som fungerer
    en: A new PlayStation sign-in token you paste in Settings is now used straight away. Before, RetroDB kept using the old sign-in until it ran out, and Save & Test Connection reported that old sign-in as working. A token Sony refuses no longer replaces one that works
  - type: enhancement
    label: 'PlayStation-innloggingen i Innstillinger er enklere å holde i gang. Banneret teller ikke lenger ned dager du aldri trengte å gjøre noe i, fordi RetroDB logger inn på nytt av seg selv; det blir bare rødt når Sony nekter det lagrede tokenet ditt. Knappen Lim inn her får ikke lenger nettleseren til å be om tilgang til utklippstavlen: den setter markøren i boksen så du kan trykke Ctrl+V. Trinnene sier nå at du først skal logge ut av PlayStation når du bytter et token som fortsatt fungerer, og meldingene kan oversettes'
    en: 'The PlayStation sign-in in Settings is easier to keep going. The banner no longer counts down days you never had to act on, because RetroDB signs in again by itself; it turns red only when Sony refuses your saved token. The Paste here button no longer makes the browser ask to read your clipboard: it puts the cursor in the box for Ctrl+V. The steps now say to sign out of PlayStation first when you replace a token that still works, and their messages can be translated'
  - type: enhancement
    label: Meldinger i vinduer og spørsmålsbokser, som «Innstillinger lagret» eller «Slette denne listen?», kan nå oversettes på alle sider. Før ble de fleste stående på engelsk uansett hvilket språk du valgte
    en: Pop-up messages and question boxes, such as "Settings saved" or "Delete this list?", can now be translated on every page. Before, most of them stayed in English whatever language you chose
  - type: enhancement
    label: Meldingene som forklarer hvorfor en PlayStation-innlogging feilet, som «NPSSO-en din kan ha utløpt», kan nå oversettes
    en: The messages that say why a PlayStation sign-in failed, such as "Your NPSSO may have expired", can now be translated
  - type: fix
    label: Hjelpemanualen på alle språk stemmer nå med den engelske. Den får Søk overalt, Behold en tittel, MAME-navn og baksiden av esken, og eldre avsnitt som hadde havnet etter er oppdatert
    en: The help manual in every language now matches the English one. It gains Search Anywhere, Keeping a Title, MAME Names and the back of the box, and older paragraphs that had fallen behind are up to date
  - type: fix
    label: På tysk, afrikaans og spansk sier Tilbake-knappen på et spills omslag nå baksiden av esken, ikke «gå tilbake»
    en: In German, Afrikaans and Spanish, the Back button on a game's cover now says the back of the box, not "go back"
  - type: feature
    label: Når du trykker Spill, fyller spillets logo på bakgrunnsbildet skjermen mens spillet starter, eller navnet i store bokstaver hvis det ikke har logo. Den forsvinner av seg selv når spillvinduet åpnes, eller når du trykker Esc eller klikker
    en: Pressing Play now fills the screen with the game's logo on its background picture while the game starts, or its name in large letters when it has no logo. It goes away by itself when the game's window opens, or when you press Esc or click
  - type: feature
    label: 'Den roterbare 3D-esken har nå den ekte formen til et PS5-etui: avrundede hjørner og kanter, den hevede kanten rundt omslaget, linjen der de to halvdelene møtes og fingerhakket i den åpnende siden. Den trenger en eskefil fra en Slipcase-versjon som skriver formen; importer esken på nytt for å få den. Andre esker ser ut som før'
    en: 'The turnable 3D box now has the real shape of a PS5 case: rounded corners and edges, the raised lip round the cover, the line where the two halves meet, and the finger slot in the opening side. It needs a box file from a Slipcase version that writes the shape; import the box again to get it. Other boxes look as before'
  - type: enhancement
    label: Oppdater RetroAchievements er flyttet fra Innstillinger til RetroAchievements-siden, og heter nå Finn spill med prestasjoner. Hver knapp der har nå en linje som sier hva den gjør, så Finn spill og Synkroniser fremdrift er lette å skille. Når ingen spill er koblet ennå, viser siden en administrator Finn-knappen i stedet for å gå videre til neste fane
    en: Refresh RetroAchievements moved from Settings to the RetroAchievements page, and is now called Find Games with Achievements. Every button there now has a line saying what it does, so Find Games and Sync Progress are easy to tell apart. With no games linked yet, the page shows an admin the Find button instead of moving on to the next tab
  body: "<ul>\n  <li><strong>4.0 er den siste store nettversjonen av RetroDB.</strong> Nye versjoner kommer som skrivebordsapp for Windows, Linux og macOS, og som Android-app, og vil åpne det eksisterende biblioteket ditt. Nettversjonen er fortsatt tilgjengelig og får fortsatt feilrettinger, og innimellom en ny funksjon. Innstillinger → Oppdateringer lenker til skrivebordsappen når den er klar.</li>\n  <li><strong>Hjelpemanualen er oppdatert på alle språk.</strong>\n    Deler som bare fantes i den engelske manualen, er nå oversatt.</li>\n</ul>\n"
  body_en: "<ul>\n  <li><strong>4.0 is the last big web version of RetroDB.</strong> New versions\n    will be a desktop app for Windows, Linux and macOS, and an Android app,\n    and will open your existing library. The web version stays available\n    and still gets bug fixes, and now and then a new feature.\n    Settings → Updates links to the desktop app when it is out.</li>\n  <li><strong>The help manual is up to date in every language.</strong>\n    Sections that were only in the English manual are now translated.</li>\n</ul>\n"
- version: 3.35.4
  date: '2026-11-03'
  tags:
  - type: fix
    label: Et skjermbilde du sletter fra et spill, forblir nå slettet. Før kunne neste skraping kopiere det tilbake fra ES-DE eller laste det ned igjen fra en nettkilde. Å slette en ekstra kopi i verktøyet Duplikate skjermbilder teller ikke, fordi du beholder bildet én gang
  - type: feature
    label: 'Spill får nå logoen sin: skrapingen lagrer den fra ES-DE, ScreenScraper, TheGamesDB, IGDB og Steam, og spillsiden viser den over tittelen, eller i stedet for en manglende eske. Du kan laste opp eller slette en logo i Rediger-vinduet. Kjør en massehenting med Fyll ut manglende for å fylle inn logoer for spill du har skrapet før'
  - type: fix
    label: IGDB gir ikke lenger et spill logoen som sidebakgrunn
  - type: feature
    label: 'Spill får nå baksiden av esken: skrapingen lagrer den fra ES-DE, ScreenScraper og TheGamesDB, og en Bak-knapp på spillsidens omslag viser den. Klikk på baksiden for å zoome. Du kan laste opp eller slette en bakside i Rediger-vinduet. Baksider fylles inn hver gang et spill skrapes, men Fyll ut manglende skraper ikke et spill på nytt bare for baksiden'
  - type: fix
    label: Et spill uten forside på TheGamesDB får ikke lenger baksiden av esken som omslag
  - type: fix
    label: Hvis du slår av en skraper i Innstillinger mens en massehenting pågår, stemmer antallet spill som ikke ble funnet nå fra og med neste spill. Før kunne et spill bli talt som stoppet i stedet
  - type: enhancement
    label: På et system uten oppsatt emulator er Spill-knappen grået ut. Hold musepekeren over den for å se hvorfor, eller klikk på den for å få en boks som sier at ingen emulator er satt opp. Før stod det en tekstlinje ved siden av knappen
  body: "<ul>\n  <li><strong>Spill får logoen sin.</strong> Skrapingen lagrer logoen til hvert spill, og spillsiden viser den over tittelen, eller i stedet for en manglende eske. Kjør en massehenting med Fyll ut manglende for å fylle inn logoer for spill du har skrapet før.</li>\n  <li><strong>Spill får baksiden av esken.</strong> En Bak-knapp på spillsidens omslag viser den, og du kan klikke på den for å zoome. Baksider fylles inn hver gang et spill skrapes.</li>\n  <li><strong>Et slettet skjermbilde forblir slettet.</strong> Neste skraping kopierer det ikke lenger tilbake og laster det ikke ned igjen.</li>\n  <li><strong>Spill sier hvorfor det ikke kan starte.</strong> På et system uten oppsatt emulator er Spill-knappen grået ut og sier hvorfor.</li>\n</ul>\n"
- version: 3.35.3
  date: '2026-11-02'
  tags:
  - type: feature
    label: 'Nytt verktøy for MAME-navn i ROM-verktøy: MAME-spill får sine ekte navn, år og utgivere fra MAMEs egen liste, og filene beholder de korte navnene sine. En skraping finner deretter hvert spill, og du kan filtrere MAME-listen etter kategori, for eksempel for å utelate spilleautomater. BIOS-sett skjules fra listen'
  - type: fix
    label: ROM-rapporter tilbyr ikke lenger å gi MAME-filer nye navn, fordi en fil med nytt navn slutter å fungere i MAME
  - type: fix
    label: Innstillinger forklarer nå hva Microsoft krever før en Xbox-app kan registreres. Xbox-pålogging kunne ikke testes på grunn av dette
  - type: enhancement
    label: Det separate kortet Offisielle navn er fjernet fra Samlet AI-utfylling, fordi bryteren Offisielt navn i utfyllingen allerede gjør denne jobben
  - type: fix
    label: Når Sony avviser en lagret PlayStation-pålogging, sier dashbordet og Innstillinger fra om det og ber deg koble til på nytt. Før viste loggen en meningsløs feil ved hver serverstart, og ingenting fortalte deg det
  - type: feature
    label: Import fra Steam fyller nå ut hvert spills beskrivelse, medvirkende, Metacritic-score, aldersgrenser, spillmoduser, coverbilde, bakgrunn og skjermbilder fra butikksiden, i bakgrunnen. Skrap et spill for å få sjanger og utgivelsesdato
  - type: feature
    label: En Steam-synkronisering beholder nå spilletiden din og når du sist spilte, og spillsiden viser dem
  - type: fix
