  - type: fix
    label: Et Steam- eller Xbox-spill som allerede ligger i biblioteket ditt under samme navn, kobles nå til det spillet ved import, slik at prestasjonene synkroniseres. Før ble det hoppet over og aldri koblet
  - type: fix
    label: Spill importert fra Steam, Xbox og PlayStation sorteres nå riktig med en gang, for eksempel Final Fantasy IX før Final Fantasy X, og Steams varemerketegn er utelatt fra navnene
  - type: feature
    label: På systemer der RetroAchievements bruker en vanlig filhash, som Mega Drive og Game Boy, sier spillsiden om kopien din gir prestasjoner, og hashen kobler til riktig spill. Kjør RA-oppdatering for å fylle ut dette
  - type: fix
    label: En skraping spør nå ScreenScraper om den nøyaktige filen din før den søker på navn, slik at du får riktig spill og ikke et med lignende tittel. Resultater du selv haker av, gjelder fortsatt først
  - type: enhancement
    label: Fremdriftsboksen for bildestørrelse nevner nå hvilket spill og system hvert bilde hører til
  - type: feature
    label: Skraping henter nå tittelskjermer fra ScreenScraper og TheGamesDB, flere offisielle navn fra IGDB og TheGamesDB (som et spills japanske tittel), og de andre konsollene et spill kom ut på fra IGDB
  - type: feature
    label: Et spill uten brukerscore får nå aldersgrensen fra ES-DE-samlingen din, hvis den har en
  - type: feature
    label: Spillsiden viser hvor mange spillere som har tidfestet et HowLongToBeat-resultat, og lenker til siden. Resultater lagret før dette viser det neste gang du slår dem opp
  - type: feature
    label: RetroAchievements-siden viser hvor mange som spiller et spill, og hvor stor andel av dem som har oppnådd hver prestasjon
  - type: fix
    label: Mappeleseren i ROM-verktøy åpner nå i ROM-mappen din når den ikke har noen mappe å starte fra, i stedet for å feile. Et uleselig svar fra IGDB koster nå bare den ene detaljen, ikke alt IGDB sendte for spillet
  - type: fix
    label: ScreenScrapers daglige grense gjør nå at RetroDB slutter å spørre til senere, og en samlet skraping sier fra om det og fortsetter med de andre kildene sine. Før så en brukt opp grense ut som «spill ikke funnet», og kallene fortsatte hele natten
  - type: fix
    label: Et spill som ingen kilde kunne svare for mens en tjeneste var på grensen, markeres ikke lenger som skrapt, så neste kjøring prøver det på nytt
  - type: fix
    label: Når en TheGamesDB-nøkkel har brukt opp måneden, bytter RetroDB til den andre nøkkelen din, og slutter å spørre når begge er brukt opp
  - type: fix
    label: RAWGs månedlige grense gjør nå også at RetroDB slutter å spørre, og IGDB holdes innenfor grensen på fire forespørsler i sekundet
  - type: fix
    label: HowLongToBeats samlede oppslag avsluttes nå med en melding når nettstedet sier det har fått for mange forespørsler, og alle forespørsler til nettstedet har nå mellomrom
  - type: fix
    label: Fiks regioner for coverbilde og manual gir ikke lenger opp etter 25 spill på rad som ScreenScraper ikke kjenner. Den stopper bare når ScreenScraper sier at grensen er nådd
  - type: fix
    label: På spillsiden står hver aldersgrense nå sentrert over AI-gjetningsetiketten sin
  - type: fix
    label: TheGamesDB-kvoten i Innstillinger bruker nå kontrollen som ikke bruker opp kvoten din, og viser ikke lenger en oppdiktet nullstillingsdato når tjenesten ikke oppgir noen
  body: |
    <ul>
      <li><strong>MAME-spill får sine ekte navn.</strong> Det nye verktøyet MAME Names i ROM Tools henter navn, år og utviklere fra MAMEs egen liste.
        Filene beholder de korte navnene sine, fordi MAME trenger dem. Du kan
        filtrere MAME-listen etter kategori, og BIOS-sett er skjult.</li>
      <li><strong>Steam-importer gir mye mer.</strong> Hvert spill fyller ut
        beskrivelse, medvirkende, Metacritic-score, aldersgrenser, spillmodi og
        bilder fra butikksiden sin. En synkronisering beholder spilletiden din og når du
        sist spilte. Et spill som allerede ligger i biblioteket ditt under samme navn, blir nå
        koblet til det, slik at prestasjonene synkroniseres.</li>
      <li><strong>Skraping finner akkurat ditt spill.</strong> En skraping spør
        ScreenScraper om den nøyaktige filen din før den søker på navn. Skraping
        henter også tittelskjermer, flere offisielle navn og de andre konsollene
        et spill kom ut på.</li>
      <li><strong>RetroAchievements kjenner din kopi.</strong> På systemer som
        bruker en vanlig filhash, som Mega Drive og Game Boy, sier spillsiden
        om kopien din gir prestasjoner. Kjør RA Refresh for å fylle ut
        dette. RetroAchievements-siden viser også hvor mange som spiller et spill
        og hvor stor andel av dem som har oppnådd hver prestasjon.</li>
      <li><strong>Grenser på nett respekteres.</strong> Når ScreenScraper,
        TheGamesDB eller RAWG når grensen sin, slutter RetroDB å spørre til senere,
        og en massekjøring av skraping fortsetter med de andre kildene. Et spill som ingen kilde
        kunne svare for på det tidspunktet, prøves igjen i neste kjøring.</li>
      <li><strong>En avvist PlayStation-pålogging sier fra.</strong> Dashbordet
        og Innstillinger ber deg nå koble til på nytt når Sony avviser en lagret
        pålogging.</li>
      <li><strong>Official Names har flyttet.</strong> Det separate kortet er borte
        fra Bulk AI Fill, fordi bryteren Official name i utfyllingen
        gjør den samme jobben.</li>
    </ul>
