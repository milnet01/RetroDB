  - type: new
    label: Spillsiden merker anmeldelsesscorer og salgstall som kom fra AI. Hvis du selv endrer en vurdering eller et salgstall, fjernes merket
  - type: fix
    label: En score fra AI på feil skala avvises, så et populært spill får ikke lenger 7 av 100 fra en ny skraping
  - type: fix
    label: Et antall scorer fra AI lagres ikke lenger ved siden av scoren fra et annet nettsted, og spillsiden viser ikke lenger et som er lagret slik
  - type: fix
