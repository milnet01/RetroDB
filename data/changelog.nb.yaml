  - type: fix
    label: Spill som bare kan spilles online fra IGDB, vises ikke lenger som lokal flerspiller, og et spill som krever to spillere, vises ikke lenger som enspiller
  body: "<ul>\n  <li><strong>Skraping slutter å ta feil spill.</strong> En oppfølger\n    regnes ikke lenger som spillet du har, så Street Fighter II får ingenting\n    fra Street Fighter, og en massekjøring av skraping krever at tittelen stemmer, ikke\n    bare konsollen. IGDB-modder, DLC og pakker treffer ikke lenger med mindre\n    ROM-en har akkurat det navnet.</li>\n  <li><strong>RAWG slutter å blande versjoner av et spill.</strong> Når oppføringen\n    dekker flere konsoller, gir den ikke lenger utvikler, utgiver, aldersgrense\n    eller flerspillermoduser, og den gjetter ikke på antall spillere.\n    Den blir ikke lenger søkt i for Commodore 64- og DOS-spill.</li>\n  <li><strong>Rekkefølgen på skraperne avgjør mellom like treff.</strong>\n    RAWG får ikke lenger ekstra poeng for bilde eller Metacritic-score, og nye\n    installasjoner setter den sist.</li>\n  <li><strong>En utgivelsesdato viser bare det kilden vet.</strong> Et\n    spill som bare har årstall, viser det året. Datoer fra IGDB og RAWG\n    tilhører spillets egen konsoll, og listen over utgivelsesdatoer fylles nå\n    også fra IGDB og ScreenScraper.</li>\n  <li><strong>Ett sett med navn for sjangere, perspektiver og moduser.</strong>\n    Filtre finner nå alle spill, og spill som bare kan spilles online, vises ikke lenger\n    som lokal flerspiller.</li>\n  <li><strong>To nye ROM-verktøykort.</strong> Rydd utgivelsesdatoer og Rydd\n    sjangere, perspektiver og moduser retter det eldre skrapinger lagret. Trykk\n    på dem, og kjør deretter en massekjøring av skraping med Fyll ut manglende.</li>\n  <li><strong>Antall spillere kommer fra spillets egen konsoll,</strong> og\n    et ScreenScraper-resultat du velger, er alltid spillet du får.</li>\n</ul>\n"
