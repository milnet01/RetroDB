  body: |
    <ul>
      <li><strong>Søk etter et hvilket som helst spill eller konsoll fra hver
        side.</strong> Et søkefelt står nå under navnet ditt i sidefeltet.
        Skriv to eller flere bokstaver for å se konsoller som passer og opptil
        åtte spill som passer, hvert med sin konsoll. Klikk på ett, eller velg
        det med piltastene og trykk Enter, for å åpne det. «Se alle
        resultater» åpner Bibliotek med det søket. Trykk / for å hoppe til
        feltet når en side ikke har et eget søkefelt.</li>
      <li><strong>Enklere å finne fram på telefon eller nettbrett.</strong> På
        en smal skjerm har en linje øverst menyknappen og en søkeknapp som
        åpner menyen med markøren allerede i søkefeltet. En linje nederst tar
        deg til Oversikt, Bibliotek, Systemer og Prestasjoner med ett trykk.
        Menyen er nå ugjennomsiktig, så siden synes ikke lenger gjennom den.
        Trykk utenfor den eller trykk Escape for å lukke den. I vinduer på
        størrelse med et nettbrett manglet menyknappen, så menyen kunne ikke
        åpnes i det hele tatt; nå er den der. Fane- og filterlinjer som blir
        stående på skjermen når du ruller, stopper rett under den øverste
        linjen, ikke bak den.</li>
      <li><strong>Innstillinger &gt; Emulatorer passer på en telefon.</strong>
        Tabellene var bredere enn en telefon, så knappene Rediger og
        Innstillinger havnet utenfor skjermen. På en telefon er hver rad nå et
        kort med knappene inni.</li>
      <li><strong>Å fjerne bildene til et spill etterlater ikke lenger løse
        filer.</strong> Hvis du fjernet bildene til et spill mens RetroDB
        fortsatt gjorde dem skarpere i bakgrunnen, kunne den skrive dem
        tilbake som filer ingen spill bruker. Nå sjekker den først og hopper
        over dem. Telleren «Forbedrer bilder» fjerner også det tømte spillet
        med en gang.</li>
      <li><strong>Titler du skriver, beholdes ved skraping.</strong> En
        skraping, selv en Full reskraping, erstattet før en tittel du hadde
        skrevet i redigeringsvinduet med skraperens navn. Nå beholdes en
        tittel du endrer. En ny avkrysningsboks, «Behold denne tittelen ved
        skraping», under tittelen viser dette; fjern haken for å la skrapere
        gi spillet nytt navn igjen. Tilbakestill på siden til et spill lar dem
        også gjøre det.</li>
      <li><strong>Offisielle navn på spillene dine, kontrollert av
        deg.</strong> ROM-verktøy har en ny side, Offisielle navn. Trykk «Spør
        AI-en» for ett system eller alle, så foreslår AI-en hvert spills fulle
        offisielle navn slik det ble utgitt i ROM-ens egen region, så en
        japansk Mega Man-ROM blir Rockman. Du ser hvert gamle og nye navn side
        om side, krysser av for dem du vil ha og godtar dem. Ingenting endres
        før du gjør det. Det gamle navnet beholdes som alternativ tittel, og
        et godtatt navn beholdes ved skraping. Et avvist navn foreslås ikke
        igjen. Det krever en AI-leverandør i Innstillinger &gt; Skraper.</li>
      <li><strong>Spill som bare har årstall, kan redigeres og beholder året
        sitt.</strong> Mange spill er datert bare med året, for eksempel 1985.
        På siden til et spill nektet redigeringsvinduet å lagre dem. I
        redigeringsvinduet i Bibliotek slettet lagring året. Begge godtar nå
        et år, et år og en måned, eller en full dato.</li>
    </ul>
