    label: 'Test KI-nøkkelen i Innstillinger'
  - type: feature
    label: 'Claude kan søke på nettet etter salgstall'
  - type: feature
    label: 'AI-utfylling for et helt system på en gang'
  - type: fix
    label: 'Jobbvarslene bruker temaets farger'
  - type: fix
    label: 'Emulatorsiden ser ut som de andre fanene i Innstillinger'
  - type: feature
    label: 'Nedlastingsfremdrift ved siden av knappen'
