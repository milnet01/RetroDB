  body: |
    <ul>
      <li><strong>Regionale versjoner av et spill vises som ett spill.</strong>
        Koble sammen versjonene du har (for eksempel den amerikanske, europeiske
        og japanske utgaven), så viser Bibliotek ett kort med et &#127760;-merke.
        Kortet åpner og spiller versjonen fra Standardregion. Spillsiden viser
        alle versjonene side om side og lar deg bytte mellom dem. ROM-verktøy
        &gt; Regionale versjoner foreslår grupper som redaktører bekrefter;
        ingenting kobles uten deg. Den foreslår aldri en oppfølger som en versjon
        av det første spillet. Sammenkoblede versjoner rapporteres ikke lenger
        som duplikater på grunn av navnet. Kjør Etterfyll alternative titler én
        gang for å gi forslagene mer å jobbe med.</li>
      <li><strong>AI kan oppsummere hvordan regionale versjoner er
        forskjellige.</strong> På et spill med sammenkoblede versjoner kan
        redaktører trykke Oppsummer forskjeller med AI i avsnittet Regionale
        versjoner. AI-en lister kjente forskjeller som sensur, vanskelighetsgrad
        eller fjernet innhold. Listen er merket som skrevet av AI, vises på
        siden til hver versjon, og skjules når du kobler til eller fra en
        versjon, til den er skrevet på nytt. Krever at en AI-leverandør er satt
        opp i Innstillinger &gt; Skraping.</li>
      <li><strong>PlayStation-spill starter med gode innstillinger.</strong> For
        DuckStation, PCSX2 og RPCS3 setter RetroDB nå oppløsningsskala og
        sideforhold for hvert spill i emulatorens egen innstillingsfil per spill
        når du trykker Spill, og om spillet starter i fullskjerm. Endre dem for
        et helt system med Settings-knappen i Innstillinger &gt; Emulatorer,
        eller for ett spill i det nye panelet Emulatorinnstillinger på
        spillsiden. En innstilling du endrer inne i emulatoren, vinner alltid.
        RetroDB leser serienummeret på hver disk for å finne riktig fil;
        CHD-disker krever at chdman er installert.</li>
      <li><strong>AI-utfylling kan ikke lenger styres av tekst skrevet inn i et
        spills felt.</strong> Når AI-utfylling sjekker et spills eksisterende
        utgiver, utvikler, utgave eller andre plattformer, renser den nå teksten
        først, slik den allerede renset tittelen.</li>
      <li><strong>Skanninger i ROM-verktøy holder seg inne i ROM-mappen
        din.</strong> CHD-konverterer og CHD-verifisering følger ikke lenger en
        snarvei (symbolsk lenke) som peker ut av den, og utpakking av et
        flerdiskarkiv ignorerer snarveier som er pakket inn i arkivet.</li>
      <li><strong>Sider nekter å kjøre skript som er smuglet inn i
        dem.</strong> Nettleseren din blokkerer nå alle skript RetroDB ikke har
        skrevet selv, så tekst som sniker kode inn i et spills tittel, en
        merkelapp eller en skrapet beskrivelse, kan ikke kjøre den. Knapper og
        menyer virker som før.</li>
      <li><strong>Ett ødelagt skjermbilde stopper ikke lenger duplikatsjekker
        for et spill.</strong> Et skjermbilde som ikke kan leses, legges til side,
        og sjekken fortsetter.</li>
      <li><strong>ROM-verktøy-jobber blir ikke lenger hengende på
        «kjører».</strong> En fil som er slettet etter en CHD-verifiseringsskanning,
        telles som ugyldig, og enhver uventet feil i CHD-konvertering,
        CHD-verifisering eller Duplikatsøker avslutter jobben som mislykket, med
        feilen i loggen.</li>
      <li><strong>Før oppsettet er ferdig, får appens dataforespørsler et tydelig
        svar.</strong> De svarer «Oppsett kreves» i stedet for å sende tilbake
        oppsettsiden. Sider tar deg fortsatt til oppsettveiviseren.</li>
      <li><strong>Oppfølgere viser ikke lenger prestasjonene til det første
        spillet.</strong> RetroAchievements-matchingen overså tallet i en tittel,
        så Donkey Kong Country 2 og 3 ble koblet til Donkey Kong Country. Tall (2,
        II, 3, III og så videre) teller nå. For å rette opp spill som allerede er
        koblet, kjør Oppdater RetroAchievements for alle systemer én gang.</li>
      <li><strong>En PlayStation-synkronisering visker ikke lenger ut
        trofétallene dine.</strong> Når svaret fra PlayStation manglet et spills
        trofétotaler, lagret RetroDB nuller over tallene den allerede hadde. Nå
        beholder den dem, også i masseoppdateringen av trofeer.</li>
      <li><strong>Å åpne et trofésett som ikke lenger finnes på disken, viser en
        melding.</strong> Trofeer-siden feilet tidligere med en feil; nå sier den
        at settet ikke ble funnet, og tar deg tilbake til listen.</li>
      <li><strong>Tabellene i ROM-verktøy merker knappekolonnen riktig på alle
        språk.</strong> Kolonneoverskriften delte ordlyd med spillsjangeren
        Action, så noen språk viste sjangernavnet der.</li>
      <li><strong>GameCube-, 3DS- og Super Famicom-spill får emulatoren satt opp
        automatisk.</strong> RetroDB lette etter disse systemene under
        mappenavn som biblioteker ikke bruker (gamecube, 3ds, superfamicom i
        stedet for gc, n3ds, sfc), så Dolphin og Citra ble aldri koblet til dem.
        Start RetroDB på nytt én gang for å ta dette i bruk.</li>
      <li><strong>Nedlastingen uten Python (frittstående) setter opp emulatorer
        igjen.</strong> Den manglet filen som lister dem.</li>
      <li><strong>Rundt 170 flere knapper, etiketter og meldinger er
        oversatt</strong> på alle språk. De ble vist på engelsk før, og noen få
        viste en feil gjetning (noen språk sa «sikkerhetskopiering mislyktes» når
        et spill ikke kunne startes).</li>
      <li><strong>Escape lukker bare vinduet som ligger øverst.</strong> Med et
        spørsmål åpent over et annet vindu lukket Escape tidligere begge; noen
        vinduer fortsatte også å kjøre etter at Escape skjulte dem, og Escape på
        en spillside kunne gjenoppta en masseskraping du hadde satt på pause.
        Hvert vindu lukkes nå med sin egen Lukk-handling, holder tastaturfokus
        inne i seg mens det er åpent, og gir fokus tilbake til knappen som åpnet
        det. Fremdriftsvinduer for jobber som kjører, holder seg åpne til jobben
        er ferdig.</li>
      <li><strong>Diagrammene i Analyse er på ditt språk.</strong> Navn på
        sjangre, perspektiver, dimensjoner og moduser, diagramtitler, aksenavn og
        forklaringer var på engelsk på alle språk.</li>
      <li><strong>RetroAchievements-data er tryggere.</strong> Hvis
        RetroAchievements-spillisten for en konsoll ikke kan lastes, lar
        RA-oppdatering nå den konsollens spill være koblet i stedet for å koble
        fra alle. Fjern RA-data fjerner nå bare RetroAchievements-fremdrift;
        fremdrift fra Steam og Xbox blir værende.</li>
      <li><strong>Passord må være minst 12 tegn overalt.</strong>
        Førstegangsoppsettet godtok et administratorpassord av hvilken som helst
        lengde, og sidene for tvunget passordbytte og oppsett sa at 4 tegn var
        nok. Alle tre ber nå om 12, som resten av appen.</li>
      <li><strong>Prestasjonstotalene stemmer, og er dine egne.</strong> Når du
        synkroniserer ett spill fra RetroAchievements, lagres nå hvor mange
        prestasjoner det har, i stedet for 0. Prestasjonstotalene i Oversikt
        teller bare spillene dine, og Samlertrofeer teller ikke lenger hver
        Steam- eller Xbox-prestasjon to ganger.</li>
      <li><strong>Synkroniseringer i bakgrunnen bruker dine egne
        kontoer.</strong> En RetroAchievements-systemsynkronisering logger inn
        med din egen RetroAchievements-konto når du har satt opp en.
        Masseoppdateringen for PlayStation gjenbruker den lagrede innloggingen
        din i stedet for å logge inn fra bunnen av hver gang.</li>
      <li><strong>Bare du kan stoppe eller gjenoppta din egen
        synkronisering.</strong> En annen bruker kan ikke lenger avbryte
        RetroAchievements-, Steam- eller Xbox-synkroniseringen din, og å
        gjenoppta en avbrutt jobb krever de samme rettighetene som å starte den.
        Administratorer kan fortsatt gjøre begge deler.</li>
      <li><strong>RPCS3-trofémappen din sjekkes når du lagrer den.</strong> En
        mappe som ikke finnes, ikke er en full sti eller er en systemmappe, blir
        avvist, slik den allerede ble i hovedinnstillingene.</li>
      <li><strong>«Hent alle bilder» i Museum kjører i bakgrunnen.</strong> Siden
        venter ikke lenger i minutter på hvert kontrollerbilde. Den viser hvor
        langt hentingen har kommet, har en Avbryt-knapp og tar opp igjen
        fremdriften hvis du forlater siden og kommer tilbake.</li>
      <li><strong>ROM-verktøy beskytter filene dine bedre.</strong> Rydding
        tømmer ikke lenger et arkiv: et mønster som <code>*</code> kan ikke
        lagres, og ryddingen stopper hvis mønstrene ville fjerne alle filene.
        CHD-konverterer beholder originalen når «verify» er av, og lar en
        eksisterende CHD være i fred når «skip existing» er på. Duplikatsøker
        beholder alltid én kopi av hvert spill, selv om en forespørsel ber om
        alle.</li>
      <li><strong>ROM-verktøy-jobber gjør det knappene sier.</strong> Pause setter
        nå CHD-konvertering, CHD-verifisering, Duplikatsøker og
        Skjermbildeduplikatfjerning på pause, og en jobb på pause kan avbrytes.
        En skanning i Skjermbildeduplikatfjerning som får en feil, avsluttes nå
        som mislykket i stedet for å kjøre for alltid.</li>
      <li><strong>Opprett M3U legger ikke lenger arkiver i en midlertidig
        mappe.</strong> Flyttede arkiver havner nå i RetroDBs egen datamappe,
        som ikke tømmes ved omstart. Arkivskanner viser hvor de ble av, og
        bekreftelsen for masseoppretting sier at de blir flyttet. Når du
        tilbakestiller innstillingene for ROM-verktøy, tilbakestilles nå alle
        valgene.</li>
      <li><strong>Bytt disk fra RetroDB.</strong> Mens et RetroArch-spill som er
        startet fra en .m3u-diskliste, kjører, viser &#9654; Spiller nå-listen
        øverst på hver side spillets tittel og en Neste disk-knapp, så et spill
        som ber om side to, fortsetter med ett klikk, fra nettleseren eller en
        telefon. RetroArch må ha Settings &gt; Network &gt; Network Commands slått
        på (port 55355); knappen sier fra hvis det er av.</li>
      <li><strong>Oppstartsskriptet åpner RetroDB når den er klar.</strong>
        start.sh, start.command og start.bat åpnet nettleseren etter faste 3
        sekunder, ofte før serveren kunne svare, så siden ikke ble lastet.
        RetroDB åpner den nå så snart serveren lytter. Startet fra
        LocalWebServerManager åpner den ingen side i det hele tatt; bruk Open-knappen
        i manageren.</li>
      <li><strong>Spillvideoer kan være opptil 500 MB.</strong> Grensen var 50 MB,
        for lite for de fleste spilltrailere. En opplasting som er for stor,
        viser nå en melding på spillsiden i stedet for å erstatte siden med ren
        tekst. En video som blir avvist (for stor eller feil filtype), sier nå fra
        i stedet for å bli forkastet uten et ord.</li>
      <li><strong>Oppstart følger stien du har satt.</strong> En Binary path
        override på RetroArch-raden i Innstillinger &gt; Emulatorer vinner nå over
        RetroArch-stien øverst på den siden; før ble radens sti oversett. Å trykke
        Stopp to ganger ber ikke lenger et spill om å avslutte to ganger; på Linux
        tolker RetroArch en ny forespørsel som «avslutt uten å lagre», så lagringen
        din i spillet kunne gå tapt.
        En oppstartsinnstilling som var igjen fra en fjernmodus som aldri ble
        bygget, hindrer ikke lenger alle spill i å starte.</li>
      <li><strong>Mislykkede handlinger melder feilene sine riktig.</strong> Når
        lagring, import, synkronisering eller skanning mislykkes, svarer RetroDB
        nå med en ekte feilstatus og viser årsaken i meldingen, i stedet for å
        svare som om det hadde gått bra. Å lagre en PSN-innloggingskode som ikke
        får kontakt, viser ikke lenger interne feildetaljer. Innlogging,
        brukeradministrasjon, profilen din, prestasjoner, importer, AI-utfylling
        og oppslag i HowLongToBeat gjør nå det samme, og et språk som ikke kan
        lagres, sier hvorfor i stedet for «Nettverksfeil».</li>
      <li><strong>Spill navngitt på No-Intro-måten skrapes nå.</strong> En tittel
        som «Legend of Zelda, The» eller «Legend of Zelda, The - Ocarina of Time»
        samsvarer nå med «The Legend of Zelda»-resultater i stedet for å bli
        avvist av samsvarsfilteret. ROM-rapporter slutter også å merke disse
        navnene som avvik.</li>
      <li><strong>Titler hentet fra filnavn mister alle merkene sine.</strong> En
        sammensatt region som «(USA, Europe)» og «(UK)» fjernes nå. På
        hjemmedatamaskiner som ZX Spectrum forsvinner alt fra årstallet og
        utover, så «Chuckie Egg 2 (UK) (1985) (A'n'F Software) (tzx)» blir til
        «Chuckie Egg 2». Et filnavn som slutter på «..zip», etterlater ikke lenger
        et løst punktum. Skrapesøk, tilbakestilling av et spills data og forslag i
        Regionale versjoner bruker disse renere navnene.</li>
      <li><strong>En feil tittel gjentar seg ikke ved ny skraping.</strong>
        Masseskraping søker nå med navnet fra ROM-filen, ikke tittelen som er
        lagret for spillet. Et spill som en gang ble matchet med feil spill,
        finner det riktige når det skrapes igjen.</li>
      <li><strong>Skraperne foretrekker Standardregion.</strong> Når to resultater
        står likt, vinner nå det fra Standardregion eller World, ikke alltid det
        amerikanske. To titler som bare er regionmerker, regnes ikke lenger som et
        perfekt treff. Regionale versjoner forveksler ikke lenger X-en i «X-Men»
        med et oppfølgernummer. Valget av hvilken versjon et kort viser, leser nå
        bare ROM-filens navn, ikke mappene over den, og forstår gamle merker som
        «(U)» og «(E)».</li>
      <li><strong>Loggen viser hvor skrapetiden for hvert spill går.</strong>
        Etter hvert spill logger RetroDB én linje med sekundene som gikk med til
        søk, i hver kilde, til nedlasting, bildebehandling, AI og lagring. Det er
        første steg mot raskere skraping.</li>
      <li><strong>Skraping blir ferdig raskere: små bilder gjøres skarpere
        etterpå.</strong> En skraping lagrer nå et spill med bildene slik de ble
        lastet ned. Små omslagsbilder og skjermbilder forstørres deretter i
        bakgrunnen, ett spill om gangen. Dupliserte skjermbilder fjernes før noe
        av dette arbeidet. Hvis RetroDB stopper underveis, fortsetter den neste
        gang den starter.</li>
      <li><strong>Les et spills manual på spillsiden.</strong> Manual-knappen
        åpner nå PDF-en i et vindu over spillsiden. Bla med Forrige og Neste,
        piltastene, Home og End, eller et sveip på telefonen; hver side blas som i
        en bok, eller byttes ganske enkelt hvis systemet ditt ber om mindre
        bevegelse. «Åpne PDF i ny fane» finnes fortsatt, og Ctrl-klikk på Manual
        åpner fanen direkte.</li>
      <li><strong>Sidepanelet viser når bilder fortsatt forbedres.</strong> Mens
        bilder gjøres skarpere i bakgrunnen, står det «Forbedrer bilder — Spill
        igjen: N» i sidepanelet. Et spill som fortsatt venter, sier fra på siden
        sin, og de skarpere bildene dukker opp der av seg selv når de er klare.
        Bryteren for 2D/3D-omslag dekker ikke lenger den linjen.</li>
      <li><strong>Reservekilder spørres samtidig.</strong> Når hovedkilden
        etterlater hull, spør RetroDB nå de andre kildene alle på en gang i
        stedet for én etter én. Svarene brukes fortsatt i rekkefølgen fra
        Innstillinger, så den samme kilden vinner hvert felt.</li>
      <li><strong>ES-DE leser spillisten sin én gang.</strong> Hver skraping,
        masseskrapinger inkludert, leste tidligere et systems ES-DE gamelist.xml
        to ganger for hvert spill. RetroDB leser den nå én gang, og leser den
        på nytt bare når filen endres.</li>
      <li><strong>Bruk i Søk metadata søker ikke lenger på nytt.</strong> På en
        spillside hentes resultatene du krysset av, rett fra kilden sin i stedet
        for å bli slått opp en gang til. Uten noe avkrysset fyller bare kilden du
        brukte og AI hullene.</li>
      <li><strong>ScreenScraper finner spill med undertittel.</strong> Den fant
        ingenting for en tittel som «Alone in the Dark: The New Nightmare» med
        mindre kolonet hadde et mellomrom foran seg. RetroDB søker nå på den
        måten, og deretter på delen før kolonet hvis det fortsatt ikke finner
        noe.</li>
      <li><strong>Spill uten noe å spille tilbyr ikke lenger Spill.</strong> Et
        spill som er lagt til fra en CLZ-, Steam-, Xbox- eller PSN-import, har
        ingen ROM-fil. Siden til spillet viser nå ingen Spill-knapp, ingen
        Emulatorinnstillinger og ingen Start-del når du redigerer det, slik
        kortene i Bibliotek gjør.</li>
      <li><strong>RetroArch-spill er beskyttet mot to dårlige
        innstillinger.</strong> RetroDB gir nå RetroArch en liten egen
        innstillingsfil hver gang den starter et spill, oppå dine egne. Den
        stiller tastaturet etter skrivebordet ditt (Wayland eller X11), så
        tastaturet aldri er dødt, og lar hurtigspoling gå i full fart, noe
        Commodore 64-spill bruker for å laste raskt. Alle de andre
        RetroArch-innstillingene dine er urørt.</li>
      <li><strong>Opprett M3U beholder spillet i biblioteket ditt.</strong> Når
        et flerdiskarkiv ble gjort om til en spilleliste, pekte spillet tidligere
        fortsatt på arkivet, som var flyttet bort. Spillet peker nå på den nye
        spillelisten og beholder detaljene og bildene sine. Når ett arkiv
        inneholder flere utgivelser av et spill, hver med sitt eget sett med
        disker, bruker spillelisten nå diskene fra den første utgivelsen i stedet
        for alle, og sier hvilke disker den utelot.</li>
      <li><strong>Full reskraping kan beholde mediene du allerede har.</strong>
        Kryss av for «Behold eksisterende medier» ved siden av bryteren Full
        reskraping. Tekstdetaljer oppdateres fortsatt, men bilder, videoer og
        manualer som allerede ligger på disken, blir værende som de er i stedet
        for å lastes ned på nytt. Uten avkrysningen mister en full reskraping ikke
        lenger skjermbilder den har lastet ned før.</li>
      <li><strong>Bakgrunnsjobber mister eller hopper ikke lenger over
        arbeid.</strong> En RetroAchievements-oppdatering som traff ett dårlig
        spill, kaster ikke lenger bort spillene den allerede hadde oppdatert. En
        gjenopptatt synkronisering eller oppdatering hopper ikke lenger over
        spillet den var på da den stoppet. En gjenopptatt RetroAchievements- eller
        Steam-synkronisering fra et svært gammelt øyeblikksbilde stopper nå med en
        melding i stedet for å melde suksess uten å ha synkronisert noe.
        WebP-konverteringen sjekker en gjenværende WebP-fil før den stoler på den,
        og starter ikke hvis den ikke kan lese hvor mye ledig diskplass det
        er.</li>
      <li><strong>Oppgradering av en svært gammel installasjon kan ikke lenger
        miste data i det stille.</strong> Tre gamle trinn i
        databaseoppgraderingen kunne miste rader i sjeldne tilstander. Nå kopierer
        de radene, eller stopper med en tydelig feil i stedet for å miste
        dem.</li>
      <li><strong>Knappene i Om-vinduet kuttes ikke lenger av.</strong> Vinduet er
        bredere og de fire knappene står i to rader, så hver etikett vises i sin
        helhet; på en telefon stables de.</li>
      <li><strong>Temaet ditt følger deg til en ny nettleser.</strong> Når du
        logger inn i en nettleser du ikke har brukt før, vises nå det lagrede
        temaet ditt. Før lagret innloggingssiden Cyberpunk først, og det ble
        sittende.</li>
      <li><strong>Passordboksen for innlogging sier ikke lenger «Admin
        Login».</strong> Hver konto logger inn med passord, så dialogen sier nå
        bare Logg inn. Konto-siden og Hjelp-siden sier det samme.</li>
      <li><strong>Hjelp er oppdatert på alle språk.</strong> De oversatte
        Hjelp-sidene beskriver nå Regionale versjoner, sier at hver konto trenger
        et passord, og at temaet ditt lagres med kontoen din. Hjelp på alle språk,
        engelsk inkludert, oppgir nå det reelle minstekravet på 12 tegn for
        passord.</li>
      <li><strong>Små rettelser:</strong> fanart med apostrof i filnavnet vises nå
        på spill- og trofésider; Innstillinger viser ikke lenger en skriptfeil for
        kontoer som ikke er administratorer, og skjermlesere hører nå hvilken fane
        i Innstillinger som er valgt; når du forlater en side, fylles ikke
        nettleserkonsollen lenger med feil om avbrutte forespørsler;
        oppskaleringsmodellen lastes ned fra en adresse som virker først; og
        installasjonsprogrammet krasjer ikke lenger på Windows når utdataene
        lagres til en fil.</li>
      <li><strong>En bred runde med pålitelighetsrettelser.</strong> Å lagre et
        spill med tom tittel mister ikke lenger de andre endringene dine. Omstart
        lar nå jobber som kjører, stoppe ryddig først. Opprett M3U nekter å
        overskrive en eksisterende spilleliste eller mappe. Å tømme listen over
        uønskede filer i ROM-verktøy betyr nå «slett ingenting», og to mønstre
        fanger ikke lenger opp ekte ROM-navn som «Release of the Dragon». Én
        skadet PS3-trofefil tømmer ikke lenger trofeene til alle spill.
        AI-utfylling skriver én enkelt region. Analyse teller hvert spill én gang
        i vurderingsdiagrammet. CLZ-importer bruker standard sjangernavn. I
        redigeringsdialoger kan sjanger og andre merker fjernes på alle språk, og
        hurtigtaster kaprer ikke lenger Ctrl+D eller Ctrl+G. Seere ser et spills
        fullføringsstatus, men kan ikke lenger endre den, siden den deles av
        alle.</li>
      <li><strong>Skjermlesere leser bryteren Platform Match Required med det
        synlige navnet</strong> under Innstillinger → Skraping.</li>
      <li>På andre språk oversetter Innstillinger nå «Standardregion», og fanen
        Skraping leses som et navn i stedet for «skraping pågår». Hjelp-sidene
        bruker de samme ordene.</li>
      <li><strong>Et spill som ikke vil lukkes, vises ikke lenger som
        lukket.</strong> Hvis en emulator overlever Stopp, fortsetter RetroDB å
        vise den som kjørende. En RetroArch-oppstart som blir avvist, skriver ikke
        lenger innstillingsfilen sin først, og en emulator som feiler med en gang,
        viser feilmeldingen sin ved første sjekk.</li>
      <li>Oppdaterte biblioteker: Pillow 13 (bildehåndtering), numpy 2.5.4 og
        onnxruntime 1.31 (oppskalering), pluss de nyeste versjonene av bygge- og
        utgivelsesverktøyene.</li>
      <li>Bak kulissene: koden for spilloppstart ble ryddet så den er lettere å
        følge, ubrukt kode ble fjernet (en API-adresse, en PSN-hjelper, et
        trofeskript ingen side lastet, og en tema-innstilling for hele nettstedet
        som ingenting leste), appens svar til nettleseren bygges på ett sted,
        flere designdokumenter ble rettet så de stemmer med koden,
        testsamlingen ble ryddet, og en ny sjekk fanger opp en
        JavaScript-syntaksfeil før en utgivelse. De eldre oppføringene i
        endringsloggen som beskrev den fjernede koden, sier nå det.</li>
    </ul>
- version: 3.29.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Et spills andre navn viser regionen de kommer fra
  body: |
    <ul>
      <li><strong>Et spills andre navn viser regionen de kommer fra.</strong>
        Kortet Også kjent som på spillsiden merker hvert navn med landet eller
        regionen sin, for eksempel Japan for «Rockman», på ditt eget språk.
        Merkede navn kommer først, gruppert etter region. Hold pekeren over et
        navn for å se kilden og eventuelle merknader, som «Arbeidstittel».</li>
      <li>Navn fra IGDB beholder nå regionen sin. Før hadde bare navn fra
        ScreenScraper en region.</li>
      <li>ScreenScrapers «SS»-merke vises ikke lenger som en region. Det er
        ScreenScrapers eget navn på spillet, ikke et sted.</li>
      <li>ROM-verktøy → Etterfyll alternative titler sjekker nå hvert skrapet
        spill, så navn du allerede har, får regionene sine. Kjør det én gang for
        å merke biblioteket du har.</li>
    </ul>
- version: 3.28.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Pek RetroDB mot emulatormappen din, så setter den dem opp
  - type: fix
    label: Rettelser på siden Innstillinger → Emulatorer
  body: |
    <ul>
      <li><strong>Pek RetroDB mot emulatormappen din, så setter den dem
        opp.</strong> Innstillinger → Emulatorer har en ny liste,
        Emulatormapper. Legg til mappen emulatorene dine ligger i, så finner
        RetroDB hver av dem der, som AppImage, et portabelt skript eller en
        installert Flatpak, og kobler den til systemene den kjører. Et system som
        allerede har en emulator som virker, beholder den.</li>
      <li><strong>Se hvilke systemer som er klare til å spilles.</strong>
        Tabellen Per-system mapping lister nå alle emulatorene for hvert system,
        sier om hver av dem virker, og lar deg velge standard for et system. For
        DuckStation, PCSX2, RPCS3 og RetroArch sier den også om BIOS-filene er på
        plass, og nevner dem som mangler. RetroDB leser bare BIOS-filer; den
        kopierer eller laster aldri ned noen.</li>
      <li>Emulatorskanningen finner nå hver emulator på en stor emulatordisk.
        Før kunne den stoppe tidlig inne i en emulators egen
        innstillingsmappe.</li>
      <li>Knappene Auto-detect og Lagre for RetroArch virker igjen, og vinduet
        for å redigere en emulator vises ikke lenger på siden før du trykker
        Rediger.</li>
    </ul>
- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Når metadata tas i bruk, ser du hvor langt det har kommet
  body: |
    <ul>
      <li><strong>Når metadata tas i bruk, ser du hvor langt det har
        kommet.</strong> Når du velger et resultat i Søk metadata, fylles en
        ring fra 0 til 100 % med prosenten i midten, og linjen under forteller
        hva som skjer: hvilket nettsted det søkes på, hvilket bilde eller
        hvilken video som lastes ned, eller at bilder behandles. En stor
        nedlasting, for eksempel en video, flytter ringen etter hvert som den
        kommer inn. Ved 100 % lastes siden inn på nytt med resultatet, som
        før.</li>
      <li>Ringen kan bevege seg ujevnt. Hver kilde bestemmer først hvor mange
        bilder den sender når den svarer, så den første kilden med mange
        bilder kan fylle mye av ringen og senere kilder mindre.</li>
      <li>Hvis bruken mislykkes, lukkes ringen og en melding sier fra, uten at
        siden lastes inn på nytt.</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Hver side passer nå til vinduet den vises i
  - type: enhancement
    label: Spillsiden viser andre navn i et eget kort, og har en Manual-knapp
  body: |
    <ul>
      <li><strong>Hver side passer nå til vinduet den vises i.</strong> Sider med
        kort (Systemer, Museum, Merkelapper, Lister, ROM-verktøy, trofeer og
        prestasjoner) legger til en kolonne hver gang et helt kort til får plass,
        opptil fire per rad. Tabeller, verktøy og detaljsider blir litt bredere,
        men stopper der mer bredde bare ville spredt kolonnene fra hverandre.
        Innstillinger holder boksene sine i en bredde som er lett å lese.</li>
      <li><strong>Hjelp og endringsloggen holder en behagelig
        linjelengde.</strong> I et bredt vindu flyttes lenkene til Hjelp-avsnittene
        inn i en kolonne ved siden av teksten; i et smalt vindu ligger de på én
        rad du kan sveipe, i stedet for en blokk som dekket mye av
        telefonskjermen.</li>
      <li><strong>Spillsiden:</strong> i et bredt vindu ligger skjermbildene
        øverst, med videoen og et nytt <strong>Også kjent
        som</strong>-kort side om side under, på høyde med omslaget. De andre
        navnene var svak tekst under tittelen; nå står de på et kort som er
        lett å lese. <strong>Manual</strong> er en knapp ved siden av Spill, og
        Skrapehistorikk starter sammenfoldet.</li>
      <li>PSN-trofeer viser én til fire kolonner etter vinduets størrelse i
        stedet for alltid tre.</li>
      <li>Flere sider ruller ikke lenger sidelengs på telefon: Trofeer,
        Samlertrofeer, RetroAchievements-systemsiden, Hjelp, Innstillinger,
        Analyse, Spillimport og detaljsidene for prestasjoner og trofeer.
        Brede tabeller ruller nå inni seg selv der.</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Biblioteket, systemsidene og spillsidene passer nå til vinduet de vises i
  body: |
    <ul>
      <li><strong>Sidene bruker et bredt vindu når det hjelper, og bare da.</strong>
        Biblioteket og hver systemside legger til en kolonne med spillkort
        hver gang et helt kort til får plass, opptil fire per rad. En telefon viser
        ett, et vindu på halve skjermen to eller tre, et bredt vindu fire. Før
        stoppet sidene ved en fast bredde og lot det meste av et stort vindu stå tomt.</li>
      <li><strong>Spillsiden plasserer omslaget og detaljene ved siden av
        skjermbildene og videoen</strong> når begge får plass side om side, og
        stabler dem ellers. Beskrivelsen holder en behagelig linjelengde.</li>
      <li><strong>Spill-knappen er flyttet til øvre høyre hjørne av hvert kort,</strong>
        mindre og midtstilt. Den sjekker nå også at spillets ROM-fil fortsatt
        finnes og er av en type systemet godtar, så den vises bare der
        et trykk faktisk starter spillet. Den skjules mens du velger flere spill
        samtidig.</li>
      <li>Til toppen-knappen og fremdriftsvinduene ligger rett ved siden av
        sidens innhold i stedet for helt ute ved vinduskantene.</li>
      <li>Spillsiden ruller ikke lenger sidelengs på telefon.</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: Testspråket «Pseudo» tilbys bare til administratorer
  body: |
    <ul>
      <li><strong>«Pseudo» vises ikke lenger i språklisten for
        alle.</strong> Det er et utviklerverktøy som viser hvert ord med
        klammer og aksenter, så det tilbys nå bare til administratorer. Andre
        som hadde valgt det, ser appen på engelsk, med engelsk valgt i
        Innstillinger.</li>
    </ul>
- version: 3.24.1
  date: '2026-10-17'
  tags:
  - type: fix
    label: Windows-nedlastingen installeres igjen, og ingen flom av feil etter endring av vindusstørrelse
  body: |
    <ul>
      <li><strong>Den vanlige Windows-nedlastingen kunne ikke installeres.</strong>
        Installasjonsprogrammet stoppet ved «Core dependencies failed to install»,
        fordi den låste pakkelisten manglet en pakke som bare Windows
        trenger. Listen dekker nå alle plattformer. Windows-nedlastingen
        uten Python ble ikke berørt.</li>
      <li><strong>Feilmeldinger dukket stadig opp i øvre høyre hjørne</strong>
        med Cyberpunk-temaet etter at nettleservinduet ble gjort bredere, for
        eksempel ved å maksimere det. Den animerte bakgrunnen endrer nå størrelse
        uten problemer.</li>
    </ul>
- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Spill et spill rett fra Bibliotek- og systemsidene
  body: |
    <ul>
      <li><strong>En ▶ Spill-knapp på hvert spillkort.</strong> Den vises i
        nedre venstre hjørne av omslagsbildet på Bibliotek-siden og på
        hver systemside. Trykk på den, og spillet starter i emulatoren sin; du
        blir værende i listen i stedet for å åpne spillets side først.</li>
      <li>Knappen vises bare der et trykk kan fungere: kontoen din har
        lov til å starte spill, og spillets emulator er aktivert, installert
        og, for RetroArch, har sin kjerne. Spill på systemer uten en emulator
        som fungerer, viser ingen knapp.</li>
      <li>Hvis en oppstart likevel mislykkes, for eksempel fordi ROM-filen er
        flyttet, vises årsaken i en melding, og siden blir som den
        var.</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: En kortere sidelinje, med én Prestasjoner-side for alle plattformer
  body: |
    <ul>
      <li><strong>Én «Prestasjoner»-lenke erstatter fem.</strong>
        RetroAchievements, RPCS3, PSN, Steam og Xbox er nå faner på én
        side, og lenken åpner igjen fanen du brukte sist. Hvis du ikke har
        RetroAchievements-spill, åpnes RPCS3-fanen i stedet for at du
        sendes tilbake til Oversikt.</li>
      <li><strong>ROM-rapporter ligger nå i ROM-verktøy,</strong> som en fane
        ved siden av de andre verktøyene og et kort på ROM-verktøy-siden.</li>
      <li><strong>Ingen sidelinjelenker deler ikon lenger:</strong> Oversikt er
        nå 🏠 og Loggviser 🧾. Sidelinjen har 16 lenker i stedet for
        21.</li>
      <li>Verktøyfanene på innstillingssiden for ROM-verktøy var alltid på
        engelsk; nå følger de språket ditt.</li>
    </ul>
- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: Oppslag i How Long To Beat fungerer igjen
  body: |
    <ul>
      <li><strong>Hvert oppslag i How Long To Beat sa at spillet ikke ble
        funnet.</strong> Nettstedet flyttet søket sitt til en ny adresse, så
        forespørslene fra RetroDB ble avvist; feilen oppsto mellom slutten av
        juli og slutten av september. RetroDB bruker nå den nye adressen, og sender
        plattform- og årstallsfiltrene i nettstedets nye format, som nettstedet
        hadde begynt å overse. Både oppslag for enkeltspill og masseoppslaget i
        ROM-verktøy fungerer igjen.</li>
    </ul>
- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: RetroDB sier nå tydelig at det ikke støtter piratkopiering
  - type: fix
    label: Om-vinduet åpnes i full størrelse igjen
  body: |
    <ul>
      <li><strong>Appen har nå en merknad mot piratkopiering.</strong> Den
        vises i Om-vinduet og under Sti til ROM-bibliotek i
        Innstillinger, på alle språk. Den sier at RetroDB ikke distribuerer eller
        lagrer ROM-filer, at du bare skal bruke spill kopiert fra plater og
        kassetter du eier, og at RetroDB ikke er tilknyttet noen
        konsollprodusent, utgiver eller spilldatabase. Ordlyden er den samme som på
        RetroDB-nettstedet og i traileren.</li>
      <li><strong>Om-vinduet ble klemt inn i sidelinjen.</strong>
        Nå åpnes det midt på skjermen i vanlig størrelse, og
        ruller på en liten skjerm i stedet for å skjule tittelen og
        lukkeknappen.</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: RetroDB starter og gir bare nytt navn til ekte ROM-filtyper
  body: |
    <ul>
      <li><strong>Et spill kunne startes med en fil som ikke er en
        ROM.</strong> Når du ga en ROM nytt navn, ble ethvert navn godtatt, så
        <code>crash.bin</code> kunne bli til <code>crash.cfg</code>, og
        emulatoren fikk den. Ved oppstart sjekkes nå filtypen mot
        listen i systemmappens <code>systeminfo.txt</code>, den samme listen
        som biblioteksskanningen bruker, og nytt navn avvises hvis typen ikke står
        på listen. Hvis en systemmappe ikke har noen liste, starter ikke spillene i den, og
        meldingen sier hvilken fil som mangler.</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: Bare en administrator kan endre startargumentene til et spill
  - type: fix
    label: Startargumenter med flere ord, eller et løst anførselstegn, fungerer nå
  - type: fix
    label: RetroDB holder ikke lenger hver avsluttede oppstart i minnet
  body: |
    <ul>
      <li><strong>En redaktør kunne legge til startargumenter som kjørte annen
        kode.</strong> Et spills <em>Egendefinerte startargumenter</em> går rett til
        emulatoren, og med RetroArch kunne de laste hvilken som helst programfil på
        datamaskinen. Å endre dem krever nå administratorrollen, og feltet er
        skjult for alle andre.</li>
      <li><strong>Startargumenter med mer enn ett ord kom fram til
        emulatoren som ett.</strong> <code>--a --b</code> kommer nå fram som to
        argumenter, og en tom verdi legger ikke til noe. Et manglende avsluttende
        anførselstegn ødela tidligere hver oppstart av spillet med en serverfeil; nå
        vises en melding som sier hvilket felt som må rettes.
        <code>{disc_paths}</code>-symbolet er fjernet: det var alltid tomt.</li>
      <li><strong>Avsluttede oppstarter hopet seg opp i minnet til RetroDB
        ble startet på nytt.</strong> En oppstart som ble avsluttet for mer enn en time siden, blir nå
        ryddet bort.</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: Valg av språk i Innstillinger fungerer igjen
  body: |
    <ul>
      <li><strong>Å velge et språk under Innstillinger &rarr; Bibliotek &rarr;
        Visning gjorde ingenting.</strong> Det viste en feil i stedet, og siden
        ble værende på det gamle språket. Dette sluttet å virke i 3.23.8. Når du velger et språk,
        lagres det nå, og siden lastes inn på nytt på det språket.</li>
    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: Trofé- og plattformikonene er tilbake i nedlastingen
  body: |
    <ul>
      <li><strong>Nedlastingen manglet RetroDBs trofé- og plattformikoner.</strong>
        Hvert spillkort med RetroAchievements viste et ødelagt
        bilde der merket skulle vært, og trofénivåene og logoene for PSN, Steam,
        Xbox og RPCS3 manglet også. Nå følger de med i alle
        nedlastinger.</li>
    </ul>
- version: 3.23.14
  date: '2026-10-10'
  tags:
  - type: security
    label: To medfølgende biblioteker oppdatert med publiserte sikkerhetsrettelser
  body: |
    <ul>
      <li><strong>urllib3 og Werkzeug hadde kjente sikkerhetsproblemer.</strong>
        RetroDB leveres nå med urllib3 2.8.0 og Werkzeug 3.1.9, versjonene som
        retter dem. En kildeinstallasjon får dem ved å kjøre
        <code>install.py</code> på nytt, som installerer fra
        <code>requirements.lock</code>.</li>
    </ul>
- version: 3.23.13
  date: '2026-09-26'
  tags:
  - type: fix
    label: Media lagret som en mappesti meldes ikke lenger som manglende
  body: |
    <ul>
      <li><strong>I den frittstående versjonen kunne «fjern manglende
        mediereferanser» tømme media som faktisk fantes.</strong> Dette
        skjedde når databasen lagret mediet som en mappesti, for eksempel
        <code>images/boxart/…</code>, i stedet for bare et filnavn. RetroDB
        leter nå etter det i riktig mappe.</li>
    </ul>
- version: 3.23.12
  date: '2026-09-26'
  tags:
  - type: fix
    label: Oversikten viser en pågående masseskraping, og fire små rettelser
  body: |
    <ul>
      <li><strong>Kortet for skrapefremdrift på oversikten dukket aldri opp.</strong>
        Nå vises det mens en masseskraping pågår, og det sier fra når den er
        satt på pause.</li>
      <li><strong>Ingen flere feil i nettleserkonsollen på
        påloggingssiden.</strong> Den sjekker ikke lenger bakgrunnsjobber før noen er
        logget inn.</li>
      <li><strong>Oppsettsveiviseren sier ikke lenger «Oppsett fullført!» når
        lagringen mislyktes.</strong> Nå sier den at innstillingene ikke kunne
        lagres.</li>
      <li><strong>To masseskrapinger startet i samme sekund deler ikke lenger
        id</strong>, så køhandlinger som avbryt virker på den riktige.</li>
    </ul>
- version: 3.23.11
  date: '2026-09-26'
  tags:
  - type: ui
    label: Donasjonsknappene sier nå hva de støtter
  body: |
    <ul>
      <li><strong>Tydeligere ordlyd om donasjoner.</strong> Knappene i toppfeltet heter nå
        «Sponsor RetroDB» og «Støtt RetroDB». README-filen sier at hver
        utgivelse er gratis, og at donasjoner finansierer selve RetroDB, ikke
        emulatorene og kjernene det kan starte.</li>
    </ul>
- version: 3.23.10
  date: '2026-09-26'
  tags:
  - type: fix
    label: ROM-verktøy-sidene følger de lagrede innstillingene dine, og Logger- og ROM-verktøy-sidene fungerer igjen
  body: |
    <ul>
      <li><strong>Logger-siden og noen ROM-verktøy-sider var ødelagt.</strong>
        Et skript på disse sidene feilet under innlasting, så loggviseren og
        de delte ROM-verktøy-hjelperne startet aldri. Nå lastes de som de
        skal.</li>
      <li><strong>Innstillingene for ROM-verktøy gjør nå noe.</strong> Duplikatsøker
        og CHD-konverterer åpnes med valgene hentet fra innstillingssiden for
        ROM-verktøy, og du kan fortsatt endre dem for én kjøring.</li>
      <li><strong>Bryterne i CHD-konverterer ble oversett.</strong> Å slå
        av «Slett originalfiler» på siden stoppet ikke slettingen hvis
        den lagrede innstillingen sa at filene skulle slettes. Nå er det bryterne på siden som
        bestemmer.</li>
      <li><strong>Innstillingen for midlertidig sti brukes.</strong> Filer som klargjøres
        mens M3U-spillelister bygges, havner nå der.</li>
    </ul>
- version: 3.23.9
  date: '2026-09-26'
  tags:
  - type: security
    label: Loggfilene fra skraperne lagrer ikke lenger passord og tokener, og påloggingsforsøk er begrenset igjen
  - type: fix
    label: Lagring av innstillinger sletter ikke lenger innstillingene dine, og sletting av en bruker fungerer
  body: |
    <ul>
      <li><strong>Loggfiler lagret hemmeligheter i klartekst.</strong> Loggfilene
        fra skraperne skulle skjule påloggingstokener og API-nøkler, men skjulingen
        kjørte aldri, så de ble skrevet i sin helhet. Nå skjules de.
        Eldre loggfiler inneholder dem fortsatt; slett gamle filer i
        <code>logs/</code> hvis du deler installasjonen din.</li>
      <li><strong>Grensene for påloggingsforsøk ble ikke håndhevet.</strong> Grensene
        for gjentatte pålogginger og for tunge handlinger (skanninger, skraping, import) var
        satt opp, men aldri slått på. Nå virker de, og en blokkert forespørsel
        får en tydelig melding om «for mange forsøk».</li>
      <li><strong>En skadet innstillingsfil kunne bli slettet.</strong> Hvis
        <code>data/settings.json</code> ikke kunne leses, erstattet neste lagring
        den med standardverdiene. RetroDB tar nå vare på den skadede filen som
        <code>settings.json.corrupt-&lt;time&gt;</code> før lagring. Hvis
        filen kan leses igjen, avvises lagringen i stedet.</li>
      <li><strong>Motor-raden i navneinnstillingene mistet andre innstillinger.</strong> Å legge
        til en merkelapp i Motor-raden i navneinnstillingene mislyktes, og kastet også
        artikkel- og regionsinnstillingene som ble lagret sammen med den. Nå lagres den
        som den skal.</li>
      <li><strong>Sletting av en bruker mislyktes.</strong> En bruker med merkelapper, lister,
        ønskelisteelementer eller PSN-data kunne ikke slettes. Nå fjerner sletting
        brukeren og alt brukeren eier.</li>
      <li><strong>To skrapinger kunne kjøre samtidig.</strong> Å bytte om eller
        flytte en pågående masseskraping i køen startet to skrapinger som
        delte én fremdriftsteller. Nå kjører bare én.</li>
      <li><strong>Fremdriften for masseskraping kunne se ut som en feil.</strong>
        Før første vellykkede treff rapporterte en masseskraping statusen sin på en måte
        noen skjermbilder tolket som en feil. Det er rettet.</li>
      <li><strong>Pålogging sender deg nå tilbake til siden du ba om.</strong>
        Før gikk den alltid til oversikten.</li>
      <li><strong>Administratorens filhandlinger holder seg innenfor mappene dine.</strong> Verktøyet
        for å endre bildestørrelse og handlingene for å gi ROM-er nytt navn avviser nå alt
        utenfor mediemappen eller ROM-mappen din.</li>
      <li><strong>Gamle påloggingsfiler for PSN og Xbox flyttes inn i
        kontoen din.</strong> En gjenværende <code>data/psn_tokens.json</code> eller
        <code>data/xbox_tokens.json</code> lastes inn i kontoen din og
        får nytt navn som slutter på <code>.migrated-015</code>. Den filen inneholder fortsatt
        tokenet, så slett den når du har sjekket at påloggingen fungerer.</li>
      <li><strong>Tydeligere feilmeldinger fra serveren.</strong> En ugyldig forespørsel
        svarer nå med en ordentlig feilmelding i stedet for «En intern feil
        oppstod».</li>
    </ul>
- version: 3.23.8
  date: '2026-09-25'
  tags:
  - type: fix
    label: CLZ-import fungerer igjen, listeomslag vises, og flere sider slutter å feile på en apostrof
  - type: security
    label: Skrapte navn og filstier kan ikke lenger bryte ut av knappene på siden
  body: |
    <ul>
      <li><strong>CLZ-import gjorde ingenting.</strong> Opplasting av en CLZ-PDF sendte den
        til en adresse serveren ikke har, så hver opplasting mislyktes med
        «Parse failed». Nå kommer den fram til tolkeren.</li>
      <li><strong>Alle omslagene på en listeside manglet.</strong> Listesiden
        ba om hvert omslag på feil adresse, og System-kolonnen var
        alltid tom. Nå vises begge. Omslagsbildene i sidens søk for å «legge til et
        spill» er også rettet.</li>
      <li><strong>Knapper sluttet å virke på navn med apostrof.</strong> Å fjerne
        «Assassin's Creed» fra en liste, slette et skjermbilde, zoome inn på et omslag
        eller fjerne en sjangermerkelapp kunne stille og rolig gjøre ingenting når navnet
        inneholdt en apostrof. Den samme feilen lot et konstruert skrapt navn kjøre
        kode på siden. Nå sendes navn til disse knappene på en måte som
        ikke kan misforstås som kode.</li>
      <li><strong>Bilde- og lenkeadresser er escapet overalt.</strong> Noen få
        sider bygde bildeadresser fra skrapte filnavn uten å escape
        dem, og fem sider hadde sin egen svakere kopi av escape-hjelperen.
        Nå bruker alle den felles.</li>
      <li><strong>Innstillinger-siden kunne åpnes tom.</strong> Hvis fanen du
        brukte sist hadde fått nytt navn i en oppdatering, åpnet Innstillinger uten noe panel
        synlig. Nå overses en fane som ikke lenger finnes. Lenker som
        <code>/settings#account</code> åpner den fanen igjen.</li>
      <li><strong>Temaet ditt følger deg nå til andre enheter.</strong>
        Temaet du velger, lagres på kontoen din. En nettleser som aldri har fått
        beskjed om et tema, bruker det lagrede i stedet for standardtemaet.</li>
      <li><strong>Fremdriftsvinduene for jobber viser riktig ikon.</strong> Jobber som var satt på pause,
        fullført eller i kø, viste det samme «kjører»-ikonet. Nå har hver tilstand
        sitt eget, per tema.</li>
      <li><strong>Listen over hurtigtaster kan nå oversettes.</strong>
        Etikettene var usynlige for oversettelsesverktøyene, så de forble på
        engelsk på alle språk.</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: Aldersgrensene var ofte feil, og skrapte spill kunne miste detaljene sine
  body: |
    <ul>
      <li><strong>Aldersgrensene var ofte feil, og feilen spredte seg.</strong>
        Når en aldersgrense kom fra TheGamesDB, lette appen etter vurderingskoden
        hvor som helst i teksten i stedet for å lese den ordentlig &mdash; så
        «T - Teen», «M - Mature 17+», «AO - Adults Only 18+» og
        «RP - Rating Pending» ble alle lagret som feil aldersgrense, og et spill for voksne
        kunne bli registrert som egnet for alle. Enda verre: den feile aldersgrensen
        ble så brukt til å fylle ut de åtte andre vurderingssystemene, så én feil
        avlesning spredte seg til alle. Aldersgrenser leses nå fra koden i
        starten av teksten.</li>
      <li><strong>Omregnede aldersgrenser ble for milde.</strong> Når appen fylte
        inn en manglende aldersgrense ut fra en du allerede hadde, kunne den bruke en
        aldersgrense den nettopp hadde regnet ut, i stedet for den du
        faktisk startet med. Hvert ledd mistet litt strenghet. Nå regner den
        alltid om fra aldersgrensene spillet faktisk har.</li>
      <li><strong>Full reskraping slettet håndvalgt Region og Lagringstype.</strong>
        Ingen av dem kommer fra en skraper &mdash; appen regner dem ut
        &mdash; så en Full reskraping erstattet din kuraterte «Japan» med
        standardverdien «USA». Verdiene dine beholdes nå med mindre en kilde faktisk
        leverer en ny.</li>
      <li><strong>En skraper kunne godta feil spill.</strong> Resultater fra ScreenScraper
        sjekkes vanligvis mot en treffpoengsum før de brukes,
        men et søk som ga nøyaktig ett resultat, hoppet helt over den sjekken.
        Nå får hvert resultat en poengsum.</li>
      <li><strong>Et spill kunne miste alle skrapte detaljer på grunn av ett manglende
        felt.</strong> Hvis IGDB eller ScreenScraper lot ett enkelt felt stå tomt på en
        uventet måte, ble hele oppdateringen kastet &mdash; utgiver,
        utvikler, grafikk og alt. Disse tilfellene håndteres nå, og resten av
        detaljene beholdes.</li>
      <li><strong>Et mislykket bilde kunne bli registrert som vellykket.</strong> Hvis et
        nedlastet bilde viste seg å ikke være brukbart, slettet appen
        ingenting og lagret likevel filnavnet, slik at en ødelagt referanse ble liggende igjen. Filen
        fjernes nå, og feltet lar den være i fred.</li>
      <li><strong>Spillmoduser bruker nå konsekvent ordlyd.</strong> Ulike
        skrapere skrev «Single-player» og «Single-Player» og et enkelt
        «Multiplayer» som ikke var en av appens egne etiketter, så de spillene
        kunne ikke oversettes eller treffes av Moduser-filteret. Alle kilder skriver nå
        de samme etikettene. Eksisterende spill beholder den gamle ordlyden til du
        skraper dem på nytt eller kjører normaliseringsverktøyet i Innstillinger.</li>
      <li><strong>Xbox-oppslag oppfører seg nå som alle andre kilder.</strong> De
        gjorde sine egne nettforespørsler, så de prøvde ikke på nytt når Xbox Live
        ba dem senke farten, og hadde ingen grense for hvor mye data et svar kunne
        dra inn. Nå bruker de den samme delte tilkoblingen som de andre
        skraperne.</li>
      <li><strong>Ubrukt ScreenScraper-kode er fjernet.</strong> To funksjoner
        som ingenting i appen kalte, er slettet. Den ene returnerte en nett-
        adresse med ScreenScraper-passordet ditt fortsatt i seg, noe som ville ha
        gitt passordet til alt som brukte den. «System Media
        Endpoint» som ble nevnt i utgivelsesnotatene for 3.6.x, var en av disse &mdash; den
        kunne aldri nås fra noe sted i appen.</li>
    </ul>
- version: 3.23.5
  date: '2026-09-02'
  tags:
  - type: fix
    label: Den pakkede nedlastingen kunne ikke starte, og andre byggrettelser
  body: |
    <ul>
      <li><strong>Den frittstående nedlastingen kunne ikke starte i det hele tatt.</strong> Den
        pakkede versjonen har sin egen Python, men oppstarteren i den var
        den som var skrevet for kildeinstallasjonen &mdash; den lette etter
        Python-filer som en pakket versjon ikke inneholder, og stoppet på den
        første linjen. Pakken har nå sin egen oppstarter, som ganske enkelt kjører
        appen og åpner nettleseren når serveren er oppe.</li>
      <li><strong>Skrivebordssnarveien i Linux-nedlastingen startet
        ingenting.</strong> Den ble levert med plassholdertekst der stien til
        appen skulle stått. Nå finnes det en <code>install-launcher.sh</code>
        ved siden av oppstarteren &mdash; kjør den én gang, så skrives snarveien
        med den faktiske stien til stedet du pakket den ut.</li>
      <li><strong>Oppstart fra kildekode installerte ubekreftede
        avhengigheter.</strong> Når Flask manglet, hentet oppstartsskriptet
        pakker rett fra internett uten kontrollsumsjekk, og tvang seg
        forbi systemets pakkebehandler underveis. Nå overlater det jobben til
        <code>install.py</code>, som bruker låsefilen med kontrollsummer.</li>
      <li><strong>Kildenedlastingen inneholdt vedlikeholderfiler den ikke
        skulle ha.</strong> Listen over hva som skulle utelates, ble vedlikeholdt for hånd og
        hadde sakket akterut, så revisjonsutdata og gjenværende byggmapper ble
        pakket med appen. Nedlastingen bygges nå fra listen
        over filer som faktisk finnes i prosjektet, og den kan ikke komme ut av takt.</li>
      <li><strong>To paneler i Innstillinger sluttet å virke i den pakkede versjonen.</strong>
        Panelene for bibliotekstatistikk og API-status slo opp hovedprogrammet med
        et navn det ikke har i en pakket versjon, så begge feilet.</li>
      <li><strong>Noe tekst på skjermen kunne aldri oversettes.</strong> Tre
        nyere deler av appen &mdash; emulatorinnstillingene, startknappen
        og «spilles nå»-linjen &mdash; ble hoppet over av oversettelses-
        skanningen, og sjekken som skulle fange opp det, så på den samme
        ufullstendige listen. Skanningen dekker nå alle filer automatisk, og
        teksten deres er lagt til i oversettelsene.</li>
      <li><strong>Gjenoppbygging av oversettelser kunne stille og rolig gjøre ingenting.</strong>
        Når tekst ble lagt til i et sidespesifikt skript, trodde gjenoppbyggingen at det
        ikke var noe å gjøre, så den nye teksten nådde aldri
        oversettelsesfilen.</li>
      <li><strong>En løsning for et bestemt grafikkort ble brukt på alle.</strong>
        Oppstartsskriptet for Linux tvang en innstilling ment for ett bestemt AMD-kort
        på alle maskiner, noe som kunne få bildeoppskalereren til å henge på annen AMD-
        maskinvare. Nå brukes den bare når det kortet faktisk finnes, og
        overstyrer aldri en verdi du har satt selv.</li>
      <li><strong>Utgivelsesskriptet kunne publisere feil versjon.</strong>
        En gjenværende tagg fra et tidligere forsøk ble stille gjenbrukt, så
        versjonen kunne bygges fra et eldre øyeblikksbilde mens den meldte
        suksess.</li>
    </ul>
- version: 3.23.4
  date: '2026-09-02'
  tags:
  - type: fix
    label: Ni måter biblioteket ditt kunne miste data på, tettet
  body: |
    <ul>
      <li><strong>«Fjern skrapte data» tømte hele biblioteket ditt.</strong>
        Bekreftelsesboksen telte bare spillene som faktisk var skrapet,
        og så slettet handlingen alle spill uansett &mdash; så den kunne
        love et dusin og tømme tusenvis. Med bilder slått på slettet den også
        omslagsbilder du hadde lastet opp for hånd, og tilbakestilte titler du hadde
        redigert selv, på spill som aldri var skrapet i det hele tatt. Nå gjør den
        nøyaktig det boksen sier.</li>
      <li><strong>3D-omslag etterlot en ødelagt lenke.</strong> Fjerning med
        bilder slettet 3D-omslaget fra disken, men databasen pekte fortsatt på
        det, så appen lette etter en fil som var borte.</li>
      <li><strong>Bryteren «Legg til» i masseredigering erstattet i stedet for å legge til.</strong>
        For Perspektiv og Dimensjon gjorde den det stikk motsatte av det den het,
        og overskrev de eksisterende verdiene på alle valgte spill på én gang, uten
        angremulighet.</li>
      <li><strong>Frittstående versjoner kunne slette alle bildereferanser med ett
        klikk.</strong> I den pakkede nedlastingen lette appen etter mediene dine
        på feil sted, konkluderte med at hvert eneste bilde manglet, og
        «fjern manglende mediereferanser» tømte deretter omslag, skjermbilder,
        video og manualer for hele biblioteket. Sikkerhetssjekken som
        finnes nettopp for å fange opp dette, kunne ikke se det. Bare den pakkede versjonen
        ble berørt.</li>
      <li><strong>Opprydding av foreldreløse filer kunne slette grafikk idet den kom inn.</strong>
        Et omslag lastet ned mens oppryddingen pågikk, kunne bli behandlet som
        foreldreløst og fjernet.</li>
      <li><strong>Oppretting av spillelister flyttet arkivene dine uten å spørre.</strong>
        Masseoppretting av M3U-spillelister flyttet de originale arkivfilene dine selv
        når du hadde latt det valget være av &mdash; og når du faktisk ba om det,
        meldte den feil for en flytting som hadde gått bra.</li>
      <li><strong>Bildeskaleringen blåste opp mediemappen din.</strong> Den
        behandlet de små miniatyrbildene den lager som nye bilder som skulle forstørres,
        blåste dem opp til full størrelse og lagde så miniatyrbilder av dem. Hver
        kjøring la til flere filer, sider viste stille bilder i full størrelse i stedet for
        miniatyrbilder, og AI-oppskalereren kjørte på omtrent tre ganger så mange
        filer som tiltenkt.</li>
      <li><strong>AI-utfylling overskrev detaljer du hadde rettet.</strong> Ved en
        vanlig skraping kunne den erstatte din egen utgiver, utvikler, sjanger, aldersgrenser
        og mer. Nå fyller den bare inn tomme felt; AI-utfylling-knappen du trykker på
        selv, er uendret.</li>
      <li><strong>Gjentatte skrapinger kunne slette et godt skjermbilde.</strong> Spill
        skrapet fra RAWG gjenbrukte de samme filnavnene, så en ny skraping
        overskrev et lagret skjermbilde, og fjernet det deretter som duplikat mens
        biblioteket fortsatt viste det.</li>
    </ul>
- version: 3.23.3
  date: '2026-09-01'
  tags:
  - type: fix
    label: Husstandsrollene gjør nå nøyaktig det de sier, og en deaktivert konto er virkelig utestengt
  body: |
    <ul>
      <li><strong>Når du deaktiverer noen, avsluttes nå økten deres.</strong> Å slå
        av en konto skjulte den fra alle skjermbilder, men alle som allerede var logget inn
        på den kontoen, kunne fortsette som normalt i opptil en uke. Deaktivering
        er den eneste måten å stenge noen ute på uten å slette dem, så den
        trer nå i kraft ved deres aller neste klikk.</li>
      <li><strong>Skrivebeskyttede kontoer kan ikke lenger endre spilldata.</strong>
        Tre «how long to beat»-handlinger var åpne for alle innloggede,
        også dem med bare visningstilgang — så en skrivebeskyttet konto kunne overskrive en
        spilletid, eller slette den fra alle spill i biblioteket. Nå krever de
        redigeringsrettigheter, som alle andre handlinger som endrer et spill.</li>
      <li><strong>Trofésporeren fungerer for alle igjen.</strong>
        Å oppdatere dine egne samlertrofeer krevde redaktørrettigheter, som rollene
        Spiller og Seer ikke har — og det er det eneste som
        skriver disse trofeene. Disse kontoene kunne aldri tjene et, og
        Oppdater-knappen viste bare en feil. Det er din egen fremgang, så det
        krever nå ingen spesielle rettigheter i det hele tatt.</li>
      <li><strong>Én persons PlayStation-oppdatering kan ikke lenger stoppes av
        andre.</strong> Enhver innlogget konto kunne sette på pause eller avbryte en
        oppdatering noen andre hadde startet, og kunne se hvilket spill den personen
        var på. Begge deler er nå forbeholdt den som startet den.</li>
      <li><strong>Steam-import bruker din egen konto, ikke den som lagret sin
        først.</strong> Bibliotekimporten leste én felles kopi av Steam-
        påloggingsdetaljene i stedet for dine, så den kunne hente noen andres
        bibliotek — mens dine egne lagrede detaljer så ut til å mangle.</li>
      <li><strong>Det er vanskelig å gjette et administratorpassord igjen.</strong> Grensen
        for mislykkede påloggingsforsøk ble delt av alle på nettverket,
        så alle med sin egen konto kunne nullstille den ved å logge inn og fortsette å
        gjette i det uendelige. Grensen gjelder nå per konto.</li>
      <li><strong>Feil fra appen når nå fram til siden i stedet for å forsvinne.
        </strong> Når en handling ble avvist, svarte 115 av dem i en form
        siden ikke kunne lese, så det så ut som om handlingen hadde virket. Nå
        melder de avvisningen ordentlig, og du ser den virkelige meldingen.</li>
    </ul>
- version: 3.23.2
  date: '2026-08-06'
  tags:
  - type: fix
    label: Sidene for skraperinnstillinger laster raskere og viser aldri en utdatert API-nøkkel
  body: |
    <ul>
      <li><strong>Innstillinger- og skraperkonfigurasjonssidene slutter å lese
        skraperinnstillingsfilen på nytt ved hver forespørsel.</strong> Fire steder
        åpnet og tolket den fra disken hver gang en side eller sjekk kjørte,
        selv om en delt, mellomlagret leser allerede fantes. Nå bruker alle
        den, så disse sidene gjør mindre arbeid per besøk.</li>
      <li><strong>Lagring trer fortsatt i kraft umiddelbart.</strong> En mellomlager som
        glemmer etter en tidsfrist, kunne ha vist deg de gamle verdiene i opptil et halvt
        minutt etter en lagring. Hver lagring tømmer nå mellomlageret idet den skriver,
        så det du ser, er det du nettopp lagret.</li>
      <li><strong>De ekte API-nøklene dine kan ikke lenger erstattes av sin egen
        maskerte visningsverdi.</strong> Innstillingssidene viser lagrede nøkler som
        <code>***1234</code> i stedet for de ekte. Fordi siden fikk
        den samme kopien av innstillingene som skraperne bruker, kunne maskeringen
        ha overskrevet de ekte nøklene i minnet, slik at skraperne
        logget inn med stjerner til mellomlageret utløp.</li>
      <li><strong>Frittstående versjoner ser nå etter skraperinnstillingene på riktig
        sted.</strong> Skraperne fant filens plassering på en annen måte
        enn sidene som lagrer den. I en vanlig installasjon havnet begge på
        samme fil; i en frittstående versjon (dobbeltklikk) ville de ikke gjort det,
        så lagrede API-nøkler kunne ha havnet et sted skraperne aldri
        så.</li>
    </ul>
- version: 3.23.1
  date: '2026-08-06'
  tags:
  - type: fix
    label: Serverporten du lagrer i Innstillinger, er nå porten den bruker
  body: |
    <ul>
      <li><strong>Når du lagrer en serverport, flyttes serveren faktisk.</strong>
        Innstillinger godtok en port, sjekket den, lagret den og fortalte deg at en omstart
        trengtes for å ta den i bruk &mdash; og så startet serveren på 5000 likevel.
        Ingenting leste noen gang verdien tilbake. Den er nå en del av oppstartskjeden,
        så en omstart flytter virkelig RetroDB til porten du valgte. Alt som er
        satt i miljøet, vinner fortsatt, så en oppstarter eller container som
        tildeler en port, påvirkes ikke.</li>
      <li><strong>To innstillinger som aldri gjorde noe, er fjernet
        i stedet for reparert.</strong> «Serververt» og «feilsøkingsmodus» ble
        lagret og ga det samme falske løftet. Å slå på feilsøkingsmodus fra
        et nettskjema ville ha åpnet en interaktiv Python-konsoll i
        nettleseren, og bindingsadressen styrer hvilke maskiner som i det hele tatt kan nå
        RetroDB &mdash; ingen av dem hører hjemme bak et innstillingsskjema. Begge kan fortsatt
        konfigureres fra miljøet, der de allerede hørte hjemme. Hvis
        innstillingsfilen din fortsatt inneholder dem, forkastes de stille ved innlasting;
        du trenger ikke gjøre noe.</li>
      <li><strong>Ingenting påstår nå at en omstart tar det i bruk, med mindre en omstart
        faktisk gjør det.</strong> Det var den egentlige feilen &mdash; en død innstilling er
        rotete, men et falskt løfte kaster bort en ettermiddag.</li>
    </ul>
- version: 3.23.0
  date: '2026-08-06'
  tags:
  - type: enhancement
    label: Start RetroDB på en port noen andre har valgt
  body: |
    <ul>
      <li><strong>RetroDB leser nå en <code>PORT</code>-innstilling fra
        miljøet sitt.</strong> Hvis du starter RetroDB fra et annet verktøy &mdash; et
        kontrollpanel, en container, et panel for hjemmeserver &mdash; kan det verktøyet nå
        gi RetroDB porten det vil ha, uten at noen redigerer en fil.
        Sett <code>PORT</code>, så binder RetroDB seg dit; la den være, så
        endres ingenting i det hele tatt. Den eksisterende <code>RETRODB_PORT</code> fungerer fortsatt
        nøyaktig som før, og <code>PORT</code> vinner hvis begge er satt.</li>
      <li><strong>Et ugyldig portnummer sier nå fra i stedet for å gjette.</strong>
        Før ga en uleselig port en vegg av Python-feiltekst, og
        en port utenfor det brukbare området ble først oppdaget når serveren
        ikke klarte å starte. RetroDB stopper nå umiddelbart med én linje som nevner
        verdien den ikke kunne bruke. Den starter aldri stille på en annen port
        enn den den ble bedt om &mdash; å bli flyttet i det stille er verre enn
        å få et nei.</li>
      <li><strong>Oppstartsbanneret og nettleserfanen følger den virkelige
        porten.</strong> Adressen som skrives ut når RetroDB starter, og siden den
        åpner for deg, sa begge 5000 uansett hvilken port som faktisk var
        i bruk.</li>
    </ul>
- version: 3.22.1
  date: '2026-07-31'
  tags:
  - type: fix
    label: Hindrer at databasens arbeidsfil vokser uten grense
  body: |
    <ul>
      <li><strong>Databasejournalen har grense igjen.</strong> SQLite holder en arbeidsfil (<code>-wal</code>-filen) ved siden av bibliotekdatabasen din. RetroDB skulle begrense den til 64&nbsp;MB, men grensen gjaldt bare bakgrunnsjobber &mdash; vanlige sidelastinger og redigeringer kjørte helt uten grense. Etter én uvanlig stor skriving ble filen liggende på sin største størrelse for alltid, iblant større enn selve databasen. Nå gjelder grensen overalt, så plassen frigis.</li>
    </ul>
- version: 3.22.0
  date: '2026-07-05'
  tags:
  - type: enhancement
    label: Skrap et spill rett fra popup-vinduet, uten det ekstra hoppet
  body: |
    <ul>
      <li><strong>Skrap fra spill-popupen.</strong> Den raske spill-popupen
        (den som vises når du klikker på et spill i biblioteket ditt) har nå en
        <strong>Skrap</strong>-knapp ved siden av AI-utfylling og Rediger. Klikk
        på den, og RetroDB tar deg rett til det spillet med metadatasøket allerede
        åpent &mdash; ikke mer åpning av hele siden og leting etter Skrap-knappen
        først.</li>
    </ul>
- version: 3.21.0
  date: 2026-07-05
  tags:
  - type: feature
    label: Start med ett klikk — start RetroDB fra et festet ikon, ingen terminal
  - type: feature
    label: Et ekte appikon — neongamepad i nettleserfanen og oppgavelinjen
  - type: feature
    label: Ny knapp Slå av server på Innstillinger-siden
  body: |
    <ul>
      <li><strong>Start med ett klikk.</strong> RetroDB har nå en ordentlig
        oppstarter du kan feste til oppgavelinjen &mdash; klikk på den, og appen
        starter (hvis den ikke allerede kjører) og åpnes automatisk i
        nettleseren. Ikke mer åpning av terminal og skriving av kommandoer. På
        Linux kjører du <code>python3 scripts/install_launcher.py</code> én gang
        for å legge til &ldquo;RetroDB&rdquo; i appmenyen, og fester den
        deretter.</li>
      <li><strong>Et ekte appikon.</strong> RetroDB bærer nå et
        neongamepad-ikon &mdash; cyberpunk-cyan og -magenta på en mørk flis
        &mdash; i nettleserfanen (favikonet), på oppstarteren i oppgavelinjen og
        på selve Windows-programmet. Det erstatter den enkle
        emoji-plassholderen.</li>
      <li><strong>Knappen Slå av server.</strong> Serverkontrollene på
        Innstillinger-siden har nå en rød <strong>Slå av server</strong>-knapp
        ved siden av Start på nytt. Den stopper appen ryddig (slik at eventuelle
        kjørende jobber får lagret ferdig først), så du trenger ikke lenger bytte
        til terminalen og trykke Ctrl+C.</li>
      <li><strong>Nedlastbare bygg åpner nettleseren for deg.</strong> De
        ferdige nedlastingene for Windows, Mac og Linux åpner nå nettleseren din
        et øyeblikk etter oppstart, slik at appen er foran deg uten noe ekstra
        steg.</li>
    </ul>
- version: 3.20.0
  date: 2026-07-05
  tags:
  - type: feature
    label: Elleve nye språk — RetroDB snakker nå 21 språk
  - type: fix
    label: 'Rettet en ufarlig konsollfeil når du forlater spillisten'
  body: |
    <ul>
      <li><strong>Elleve nye språkpakker.</strong> RetroDBs grensesnitt,
        versjonsnotater og hjelpemanual er nå oversatt til
        <strong>Afrikaans, isiZulu, isiXhosa, Dutch, Norwegian (Bokm&aring;l),
        Russian, Polish, Turkish, Ukrainian, Indonesian og Hebrew</strong>
        &mdash; i tillegg til de eksisterende tysk, spansk, fransk, italiensk,
        japansk, koreansk, brasiliansk portugisisk, og forenklet &amp;
        tradisjonell kinesisk. Velg ditt under Innstillinger &rarr;
        Visningsinnstillinger &rarr; Språk; appen laster på nytt på språket du
        velger.</li>
      <li>Hvert språk dekker hele appen: hver knapp, etikett og melding,
        hele historikken med versjonsnotater, og den komplette hjelpemanualen.</li>
      <li><strong>isiZulu &amp; isiXhosa</strong> er også inkludert. Som språk
        med lite eksisterende programvareordforråd beholder de vanlige
        tekniske uttrykk (ROM, scraper, box art) på engelsk der det ikke
        finnes et naturlig ord &mdash; korrekturlesing av en morsmålsbruker er
        velkommen før du stoler på dem.</li>
      <li><strong>Hebrew</strong> leveres med fullstendig oversatt tekst; et
        polert høyre-til-venstre-sideoppsett (slik at grensesnittet speiler
        riktig) kommer i en senere oppdatering. Arabic følger så snart det
        oppsettarbeidet er på plass.</li>
      <li><strong>Feilretting:</strong> når du forlater Biblioteket eller et systems spilliste, logges ikke lenger en ufarlig &laquo;ReferenceError&raquo; i nettleserkonsollen (en rest etter en tidligere opprydding). Ingen synlig effekt &mdash; bare en ryddigere konsoll.</li>
    </ul>
- version: 3.19.1
  date: 2026-07-05
  tags:
  - type: performance
    label: Raskere skraping — et spills skjermbilder lastes nå ned samtidig
  body: |
    <ul>
      <li><strong>Skjermbilder lastes ned parallelt.</strong> Etter samme
        tilnærming som den populære ES-DE-frontenden (som henter alle
        mediene til et spill på én gang), laster RetroDB nå ned et spills
        skjermbilder <strong>samtidig</strong> i stedet for ett etter ett,
        for hver kilde (TheGamesDB, IGDB, RAWG, ScreenScraper). Spill med
        flere skjermbilder blir merkbart raskere ferdig.</li>
      <li>Kontrollen for duplikate skjermbilder kjører fortsatt etterpå i
        rekkefølge, så fjerning av dobbeltbilder er akkurat like nøyaktig
        som før &mdash; det er bare selve nedlastingen som er blitt
        raskere. Nedlastinger er begrenset til fire om gangen, slik at én
        enkelt kilde aldri overbelastes.</li>
      <li>Ytelsesforbedring under panseret; trer i kraft etter neste
        omstart.</li>
    </ul>
- version: 3.19.0
  date: 2026-07-05
  tags:
  - type: performance
    label: Raskere skraping — kildene spørres nå samtidig
  body: |
    <ul>
      <li><strong>Skraping går raskere per spill.</strong> Når RetroDB slår
        opp et spill, sjekker den flere databaser (ES-DE, TheGamesDB, IGDB,
        RAWG, ScreenScraper). Tidligere spurte den dem <em>én om
        gangen</em> og ventet på svar fra hver før den spurte den neste
        &mdash; så ventetiden var summen av alle sammen. Nå spør den dem
        alle <strong>samtidig</strong> og venter bare på den tregeste, noe
        som gir en merkbar hastighetsøkning for hvert spill. Resultatene
        sorteres og poengsettes fortsatt akkurat som før.</li>
      <li><strong>Færre bortkastede håndtrykk ved nedlasting av
        bilder.</strong> Bildenedlastinger gjenbruker nå en allerede åpen
        tilkobling i stedet for å åpne en ny for hvert enkelt bilde, noe
        som sparer tid på spill med mange skjermbilder.</li>
      <li>Dette er forbedringer under panseret &mdash; ingenting endrer
        seg i hvordan du bruker RetroDB, og det belaster ikke databasene
        noe mer (samme forespørsler, bare overlappende). Trer i kraft
        etter neste omstart.</li>
    </ul>
- version: 3.18.0
  date: 2026-07-05
  tags:
  - type: feature
    label: Lagt til kinesisk (Kina) aldersgrense som 9. klassifiseringssystem
  body: |
    <ul>
      <li><strong>Nytt aldersklassifiseringssystem: Kina (CADPA).</strong>
        RetroDB støtter nå Kinas offisielle aldersanbefalingsordning for
        spill (&ldquo;网络游戏适龄提示&rdquo;, utstedt av CADPA) i tillegg
        til de åtte eksisterende ordningene (ESRB, PEGI, CERO, USK, ACB,
        FPB, GRAC og ClassInd). Den bruker tre nivåer &mdash;
        <strong>8+</strong>, <strong>12+</strong> og <strong>16+</strong>
        &mdash; vist med et enkelt grønt merke.</li>
      <li><strong>Den fylles ut selv, akkurat som de andre.</strong> Når et
        spill allerede har en klassifisering fra et annet land, regner
        RetroDB automatisk ut det tilsvarende kinesiske nivået (og
        omvendt). Du kan også velge eller endre den manuelt i
        redigeringsvisningen for et spill, og velge den som foretrukket
        visningssystem under Innstillinger &rarr; Bibliotek. Merk: de
        fleste vestlige spilldatabaser publiserer ikke en kinesisk
        klassifisering, så for spill uten noen klassifisering blir den
        fylt ut fra spillets innhold under skraping / AI-utfylling.</li>
      <li>De grønne merkene er RetroDBs egen enkle illustrasjon (i tråd
        med husstilen til de andre ordningene), ikke CADPAs offisielle
        logo, så det følger ingen bilderettighetsbindinger med.</li>
    </ul>
- version: 3.17.0
  date: 2026-07-04
  tags:
  - type: feature
    label: Fjern databaseoppføringer for mediefiler som mangler på disk
  - type: security
    label: Vern mot at hele biblioteket ditt mister illustrasjoner hvis en mediemappe
      forsvinner
  body: |
    <ul>
      <li><strong>Nytt vedlikeholdsverktøy: &ldquo;Manglende
        mediereferanser&rdquo;</strong> (Innstillinger &rarr; System &rarr;
        Vedlikehold). Det er speilbildet av det eksisterende
        opprydding-verktøyet &ldquo;Foreldreløse medier&rdquo;: i stedet
        for å finne overflødige bildefiler uten noe spill, finner det
        spill der omslag, 3D-omslag, skjermbilder, fan-art, video eller
        manual peker til filer som ikke lenger finnes på disk. Søk etter
        dem, og fjern så disse foreldede referansene med ett klikk, slik
        at skraperne kan laste ned illustrasjonene på nytt. Selve
        spilloppføringene røres aldri.</li>
      <li><strong>Tryggere automatisk opprydding under skraping.</strong>
        Når RetroDB skraper et spill på nytt, fjerner den stille
        referanser til mediefiler som har forsvunnet fra disk. Tidligere
        kunne denne oppryddingen &mdash; hvis en hel mediemappe forsvant
        på én gang, for eksempel en frakoblet ekstern disk eller en
        massesletting &mdash; slette informasjonen om hvilke
        illustrasjoner tusenvis av spill hadde, noe som tvang frem
        kostbare nye skrapinger. RetroDB kjenner nå igjen dette signalet:
        hvis en mediemappe mangler eller er helt tom, beholder den
        referansene og logger en advarsel i stedet for å slette dem. Det
        nye vedlikeholdsverktøyet bruker den samme beskyttelsen og merker
        tydelig enhver mappe det har holdt tilbake.</li>
    </ul>
- version: 3.16.0
  date: 2026-07-04
  tags:
  - type: feature
    label: Nytt panel for «Hurtigfikser» på dashbordet
  body: |
    <ul>
      <li><strong>Et nytt &ldquo;Hurtigfikser&rdquo;-panel på
        dashbordet</strong> gjør spredte biblioteksgjøremål om til en
        oversiktlig gjøremålsliste. Det viser hvor mange spill som
        fortsatt mangler omslag, og gir ett-klikks-snarveier for å finne
        duplikat-ROM-er og sjekke for ødelagte ROM-baner (spill der
        filene er flyttet eller slettet). Hver snarvei fører rett til
        siden som fikser det. Panelet vises så snart du har spill i
        biblioteket ditt.</li>
    </ul>
- version: 3.15.0
  date: 2026-07-03
  tags:
  - type: accessibility
    label: Skjermlesere leser nå opp fremdriften i jobber
  body: |
    <ul>
      <li><strong>Langvarige jobber forteller nå fremdriften sin høyt til
        skjermlesere.</strong> Når en massskraping, en
        prestasjonssynkronisering (RetroAchievements eller PlayStation)
        eller en endring av bildestørrelse pågår, hørte
        skjermleser-brukere tidligere ingenting mellom &ldquo;startet&rdquo;
        og &ldquo;ferdig&rdquo;. RetroDB varsler nå regelmessige
        milepæler (for eksempel &ldquo;Massskraping: 12 av 40&rdquo;) og
        en talt fullføring &mdash; uten ekstra sprettoppvinduer på
        skjermen. Varslene er tidsstyrt slik at de informerer uten å
        skravle, og de følger språket du har valgt.</li>
    </ul>
- version: 3.14.0
  date: 2026-07-01
  tags:
  - type: feature
    label: Nye språk — kinesisk (forenklet og tradisjonelt) nå tilgjengelig
  body: |
    <ul>
      <li><strong>RetroDB er nå tilgjengelig på kinesisk.</strong> To valg
        finnes under <strong>Innstillinger &rarr; System &rarr;
        Språk</strong>: <strong>中文 (简体)</strong> (forenklet, for det
        kinesiske fastlandet) og <strong>中文 (繁體)</strong> (tradisjonelt,
        for Hongkong og Taiwan). Hele grensesnittet &mdash; menyer,
        knapper, meldinger og den innebygde hjelpemanualen &mdash; er
        oversatt, og alt som ennå ikke er oversatt, faller stille tilbake
        til engelsk. Dette bringer antallet støttede språk opp til ti
        (engelsk, tysk, spansk, fransk, italiensk, japansk, brasiliansk
        portugisisk, koreansk, og nå forenklet &amp; tradisjonelt
        kinesisk).</li>
    </ul>
- version: 3.12.0
  date: 2026-06-30
  tags:
  - type: feature
    label: Nytt språk — koreansk (한국어) er nå tilgjengelig
  body: |
    <ul>
      <li><strong>RetroDB er nå tilgjengelig på koreansk (한국어).</strong>
        Velg det under Innstillinger &rarr; System &rarr; Språk. Hele
        grensesnittet &mdash; menyer, knapper, meldinger og den
        innebygde hjelpemanualen &mdash; er oversatt, noe som bringer
        antallet støttede språk opp til åtte (engelsk, tysk, spansk,
        fransk, italiensk, japansk, brasiliansk portugisisk og
        koreansk). Koreansk runder av dekningen for alle
        spillaldersgrensetavler RetroDB viser, inkludert Sør-Koreas
        GRAC.</li>
    </ul>
- version: 3.11.0
  date: 2026-06-30
  tags:
  - type: enhancement
    label: Støtt RetroDB på Patreon — ny donasjonslenke lagt til
  body: |
    <ul>
      <li><strong>Du kan nå støtte RetroDB på Patreon.</strong> En
        Patreon-lenke ligger ved siden av den eksisterende
        &ldquo;Sponsor på GitHub&rdquo;-knappen i <strong>Innstillinger
        &rarr; System &rarr; Støtt utviklingen</strong>, i Om-panelet, og
        i prosjektets README. RetroDB forblir helt gratis og åpen
        kildekode &mdash; donasjoner er helt valgfrie og bidrar bare til
        å holde soloutviklingen i gang.</li>
    </ul>
- version: 3.10.0
  date: 2026-06-26
  tags:
  - type: enhancement
    label: Endringsloggen laster nå raskere med en «Last inn mer»-knapp
  body: |
    <ul>
      <li><strong>Endringslogg-siden åpnes nå mye raskere.</strong> I
        stedet for å tegne opp hele utgivelseshistorikken (hundrevis av
        oppføringer) hver gang du åpner den, viser RetroDB nå de 20
        nyeste og legger til en <strong>Last inn mer</strong>-knapp
        nederst. Klikk på den for å vise neste omgang, og så videre
        &mdash; den eldre historikken er fortsatt der, den lastes bare
        inn ved behov i stedet for å bremse den første visningen.</li>
    </ul>
- version: 3.9.0
  date: 2026-06-17
  tags:
  - type: feature
    label: Hjelpemanual og nylige versjonsnotater nå oversatt til alle 6 språk
  body: |
    <ul>
      <li><strong>Den fullstendige innebygde hjelpemanualen er nå
        tilgjengelig på alle seks språk</strong> &mdash; tysk, fransk,
        spansk, italiensk, japansk og brasiliansk portugisisk &mdash;
        ikke bare engelsk. RetroDB viser manualen på det språket du har
        valgt i Innstillinger, og faller stille tilbake til engelsk hvis
        noe ikke er oversatt ennå.</li>
      <li><strong>Denne endringsloggen vises nå også på ditt
        språk</strong> for de nyeste utgivelsene, og nye utgivelser vil
        bli oversatt fra nå av. Eldre historikk forblir på engelsk.</li>
      <li><strong>Ønskeliste-siden og de siste restene av engelsk
        tekst</strong> &mdash; en gruppe sprettopp-feil- og
        statusmeldinger som ble oversett da språkpakkene først kom i
        3.8.0 &mdash; oversettes nå riktig i hele appen.</li>
    </ul>
- version: 3.8.2
  date: 2026-06-17
  tags:
  - type: security
    label: Sikkerhetsoppdatering av avhengighet + CI-fikser
  body: |
    <ul>
      <li><strong>Sikkerhet:</strong> oppdaterte det medfølgende
        <code>cryptography</code>-biblioteket (47 → 49) for å rette et
        publisert sikkerhetsvarsel (GHSA-537c-gmf6-5ccf). Ingen
        atferdsendring — bare en tryggere versjon.</li>
      <li>Fikset den automatiserte testpipelinen: en manglende
        testverktøy-hjelper (<code>beautifulsoup4</code>) hadde fått
        testkjøringen til å feile siden v3.7.0, og det nye
        pakkebyggeskriptet utløste en statisk analysesjekk som er et
        kjent falskt positivt (det kjører betrodde byggekommandoer, ikke
        brukerinndata) — nå dokumentert og kalibrert. Kun vedlikehold;
        ingenting endrer seg i selve appen.</li>
    </ul>
- version: 3.8.1
  date: 2026-06-17
  tags:
  - type: improvement
    label: Mindre nedlastingsalternativ, opprydding av donasjoner og
      oversettelsesfiks (Pass 46.3 / 47.6)
  body: |
    <ul>
      <li><strong>En mye mindre nedlasting er på vei.</strong> Den
        ferdig-til-bruk «bare pakk ut og dobbeltklikk»-versjonen av
        RetroDB kan nå bygges i en <strong>kun-CPU</strong>-variant
        (~600&nbsp;MB) for de som ikke har et AMD-skjermkort &mdash;
        omtrent en sjettedel av størrelsen på fullversjonen. Begge vil
        tilbys side om side, slik at du kan velge den som passer
        maskinen din.</li>
      <li><strong>«Støtt utviklingen»-panelet i Innstillinger oversettes
        nå</strong> sammen med resten av appen &mdash; det hadde blitt
        liggende igjen på engelsk ved en feil da språkpakkene kom i
        3.8.0.</li>
      <li>Ryddet opp i donasjonslenkene (GitHub Sponsors-merket i README;
        finansieringsfilen er klar for Patreon og Buy&nbsp;Me&nbsp;A&nbsp;Coffee
        når de er satt opp). Ingen mas-skjermer, noensinne.</li>
      <li>Bak kulissene: utgivelsespipelinen kan nå bygge de
        ferdig-til-bruk-versjonene for Windows, macOS og Linux automatisk.
        Merk: den omfattende innebygde <em>Hjelp</em>-manualen er
        fortsatt kun på engelsk foreløpig &mdash; det er notert som
        fremtidig arbeid.</li>
    </ul>
- version: 3.8.0
  date: 2026-06-12
  tags:
  - type: feature
    label: Full oversettelse av grensesnittet + 6 språk (Pass 43.2/43.3/43.5)
  body: |
    <ul>
      <li><strong>RetroDB snakker nå 6 flere språk.</strong> Med
        grunnlaget fra 3.7.0 som utgangspunkt er hele grensesnittet gjort
        oversettbart og maskinoversatt til <strong>tysk, fransk, spansk,
        italiensk, japansk og brasiliansk portugisisk</strong>. Velg
        språket ditt under Innstillinger &rarr; Visningsinnstillinger
        &rarr; Språk; det følger din lagrede preferanse, deretter
        nettleseren din, og faller til slutt tilbake til engelsk &mdash;
        det kan aldri sette seg fast på et manglende språk.</li>
      <li><strong>Alt som vises på skjermen er dekket</strong>: sidetekst
        og knapper, sprettoppmeldinger (de små «toast»-varslene),
        redigerings- og innstillingsdialogene, verktøytips og etiketter
        for skjermlesere. Spillsjangre, perspektiver og spillmodus (f.eks.
        &ldquo;First-Person-Shooter&rdquo;) vises nå også på ditt språk
        &mdash; mens de underliggende dataene forblir på engelsk, slik at
        biblioteket og filtrene dine fortsetter å fungere akkurat som
        før.</li>
      <li>Et innebygd <strong>&ldquo;Pseudo&rdquo;-språk</strong> (synlig
        i Språk-menyen) er et kvalitetssikringsverktøy for oversettere
        som setter parenteser og aksenter rundt hver etikett, slik at det
        umiddelbart blir tydelig om noe tekst er glemt.</li>
      <li>Maskinoversettelser er et utgangspunkt og kan virke litt stive
        enkelte steder &mdash; de er enkle å finpusse over tid, og all
        tekst uten oversettelse vises rett og slett på engelsk.</li>
    </ul>
