  body: |
    <ul>
      <li><strong>RetroDB 已为自己的游戏播放器做好准备。</strong>一款基于 RetroArch 的播放器正在为 RetroDB 打造。它推出后，RetroDB 会用为每个游戏选定的设置在其中启动游戏，并保留你在游玩时更改的任何设置。它会把存档和设置放在自己的文件夹中，与你自己的 RetroArch 分开。它会为每台主机挑选最合适的核心，并在你第一次按下“游玩”时下载；下载期间按钮会显示“正在下载核心…”。它可以运行任何没有可用模拟器的主机，并且绝不会替换你已设置好的模拟器。你可以为每个游戏选择其他核心、画面效果、整数缩放和输入延迟降低。管理员可以一次安装或更新所有核心，也可以关闭下载。在播放器安装之前什么都不会改变；在此之前，它不会出现在 设置 &gt; 模拟器 中。</li>
      <li><strong>博物馆的标签页又能切换了。</strong>自 3.30.0 版起，在某台主机的博物馆页面上点击“规格参数”“游戏 Top 10”或“手柄”没有任何反应，并显示“意外错误”消息。现在每个标签页都能打开。</li>
      <li><strong>以文件夹形式存放的 PlayStation 3 游戏可以游玩了。</strong>PS3 光盘游戏通常是一个以“.PS3”结尾的文件夹。RetroDB 因为预期的是单个文件，所以拒绝启动它，也不显示“游玩”按钮。现在它会按照 RPCS3 的要求，把文件夹交给模拟器。</li>
      <li><strong>“搜索元数据”的各列对齐了，也能适配手机。</strong>结果多到放不下的来源会出现滚动条，挤窄了标题，于是同一个标题在一列中换行，在下一列中却不换行。现在每一列都保持相同的宽度，并使用随主题变化的细滚动条。在手机或窄窗口上，搜索窗口曾被挤在一个隐藏的侧边栏旁边；现在它会占满整个屏幕。</li>
      <li><strong>在 Windows 或 Mac 上全新安装时，RetroArch 核心名称正确。</strong>RetroDB 在所有系统上都用 Linux 的核心文件名设置 RetroArch，所以在 Windows 和 macOS 上找不到任何核心。现在全新安装会使用每台电脑自己的名称。已有的安装保留现有名称；请在映射表中更改。</li>
      <li><strong>截图查看器显示两个箭头，并各自位于按钮内。</strong>侧边栏遮住了左箭头，所以无法用鼠标返回上一张截图。右箭头也落在按钮下方。现在两个箭头都会显示，并在各自的按钮中居中。</li>
      <li><strong>模拟器设置页面以你的语言显示。</strong>无论你选择哪种语言，设置 &gt; 模拟器 的大部分内容都是英文：标题、模拟器表格、扫描结果和“编辑模拟器”窗口。现在全部都已翻译。</li>
      <li><strong>“玩家人数”框可以填大于 16 的数。</strong>两个编辑窗口都止步于 16，所以无法填入 MAG 的 256 名玩家。抓取器给出大于 16 的游戏，在你调低数字之前根本无法保存。现在没有上限了。</li>
      <li><strong>AI 填充为 PC 游戏设置 PC 存档类型，而不是主机的。</strong>由于 AI 描述的是 PlayStation 2 版本，Windows 游戏可能会得到“记忆卡”。现在会要求 AI 描述你的游戏所在平台上的版本。PC 以及 PlayStation 3 和 Xbox 360 及之后的主机，都存档到内置存储。</li>
      <li>要修正已经存有错误存档类型的游戏，请重新抓取或运行 AI 填充。两者都会重新询问 AI 并替换旧值。</li>
      <li><strong>连接 PlayStation 时会提示你先登录。</strong>在 设置 &gt; 账户 &gt; PSN 中，除非你已经登录 PlayStation，否则 Sony 账户页面只显示“Invalid login”，而步骤说明也没有提到这一点。现在第 1 步有一个“登录 PlayStation”按钮，请先按下它。</li>
      <li><strong>对游戏库排序，并只显示未抓取的游戏。</strong>游戏库和每个系统页面的游戏数量旁边都有“排序方式”菜单：名称、最新或最早发行、媒体评分、用户评分，或最近添加。没有日期或评分的游戏排在最后。A–Z 栏在按名称排序时可用，其他情况下变为灰色。新的“未抓取”按钮只显示还没有被任何抓取器填写过的游戏。</li>
      <li><strong>没有匹配结果的筛选会明确告诉你。</strong>以前页面会变成空白。现在它会提示没有匹配的游戏，并提供一个清除筛选的按钮。</li>
      <li><strong>游戏库的筛选栏让一切保持原位。</strong>以前按下“选择”、筛选或排序都会把游戏往页面下方推。现在选择工具出现在窗口底部的一条栏中。“清除”始终存在，在启用筛选之前呈灰色。生效中的筛选显示在游戏数量旁边。“Show Bonus”现在改为“附赠光盘”，开启时会高亮。在手机上，筛选按钮会从一个“筛选”按钮中展开，覆盖在页面上方。</li>
      <li><strong>空游戏库显示带扫描按钮的欢迎信息。</strong>以前全新安装会显示一个卡在 0% 的健康分数和一个空白的游戏库。现在这两个页面都会说明游戏库是空的，并提供“扫描游戏库”按钮。仪表盘还会链接到 ROM 文件夹设置。非管理员用户会被告知去找管理员。在有可选的游戏之前，“随机游戏”会被隐藏。</li>
      <li><strong>“扫描游戏库”在系统页面和设置中可以使用了。</strong>那两个“扫描游戏库”按钮按下后没有任何反应。只有仪表盘上的那个能用。现在仪表盘自己的“扫描游戏库”按钮只向管理员显示，因为只有管理员才可以扫描。</li>
      <li><strong>设置向导显示你所在的步骤，以及哪些步骤可选。</strong>它会显示“第 3 步，共 6 步”，为每一步编号，勾选你已完成的步骤，并把 ES-DE 和“API 密钥”标为可选。在手机上，它会显示编号和当前步骤的名称。</li>
      <li><strong>同时按多个类型、系列或发行商筛选游戏库。</strong>在“类型”“系列”“发行商”“开发商”“游玩模式”“视角”和“维度”筛选中，勾选任意多个值并按“应用”：游戏只要有其中任何一个值就会显示。把窗口切换为“不是”，即可隐藏含有任何已勾选值的游戏。每个值都有自己的标签，点它的 ✕ 只会移除该值。</li>
    </ul>
