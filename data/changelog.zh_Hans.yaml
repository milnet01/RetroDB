- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 应用元数据时会显示进度
  body: |
    <ul>
      <li><strong>应用元数据时会显示进度。</strong>在“搜索元数据”中选择一个结果后，一个圆环会从 0 填充到 100%，中心显示百分比，下方的一行说明正在进行的操作：正在搜索哪个网站、正在下载哪张图片或哪个视频，或者正在处理图片。较大的下载（例如视频）会随着数据到达推动圆环前进。到达 100% 时，页面会像以前一样重新加载并显示结果。</li>
      <li>圆环的前进可能不均匀。每个来源只有在响应时才决定发送多少张图片，因此第一个图片很多的来源可能填满圆环的大部分，之后的来源则较少。</li>
      <li>如果应用失败，圆环会关闭，并显示一条说明失败的消息，页面不会重新加载。</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 每个页面现在都会适应所在的窗口
  - type: enhancement
    label: 游戏页面用单独的卡片显示其他名称，并新增说明书按钮
  body: |
    <ul>
      <li><strong>每个页面现在都会适应所在的窗口。</strong>卡片类页面
        （系统、博物馆、标签、列表、ROM 工具、奖杯和成就）只要还能再放下一整张卡片，
        就会多加一列，每行最多四张。表格、工具和详情页面会稍微变宽，但在继续变宽
        只会让各列彼此拉开时停下。设置页面让各个框保持易读的宽度。</li>
      <li><strong>帮助和更新日志保持舒适的行宽。</strong>在宽窗口中，帮助的章节链接
        会移到正文旁边的一栏；在窄窗口中，它们排成一行可以左右滑动，而不再是一大块
        占据大半个手机屏幕的区域。</li>
      <li><strong>游戏页面：</strong>在宽窗口中，截图横排在顶部，下面是并排的视频和
        新增的<strong>又名</strong>卡片，与封面齐平。其他名称以前是标题下方的浅色小字，
        现在放在一张易于阅读的卡片上。<strong>说明书</strong>成了“游玩”旁边的一个按钮，
        抓取历史默认折叠。</li>
      <li>PSN 奖杯会根据窗口显示一到四列，而不再总是三列。</li>
      <li>多个页面在手机上不再左右滚动：奖杯、收藏家奖杯、RetroAchievements 系统页面、
        帮助、设置、分析、游戏导入，以及成就和奖杯详情页面。那里的宽表格现在会在
        表格内部滚动。</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 游戏库、系统和游戏页面现在会适应所在的窗口
  body: |
    <ul>
      <li><strong>页面只在有帮助时才利用宽窗口。</strong>
        游戏库和每个系统页面只要还能再放下一整张游戏卡片，就会多加一列，每行最多四张。
        手机显示一列，半屏窗口显示两到三列，宽窗口显示四列。以前页面会停在固定宽度，
        让大窗口的大部分空着。</li>
      <li><strong>游戏页面在并排放得下时，会把封面和详细信息放在截图和视频旁边</strong>，
        否则就上下排列。游戏描述保持舒适的行宽。</li>
      <li><strong>“游玩”按钮移到了每张卡片的右上角，</strong>
        变得更小并居中。它现在还会检查游戏的 ROM 文件是否仍在原处、类型是否被所属系统
        接受，因此只会出现在按下后确实能启动游戏的地方。批量选择游戏时它会隐藏。</li>
      <li>“返回顶部”按钮和进度弹窗现在紧挨着页面内容，而不是位于窗口的最边缘。</li>
      <li>游戏页面在手机上不再左右滚动。</li>
    </ul>
