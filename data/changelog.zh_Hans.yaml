  body: |
    <ul>
      <li><strong>一个游戏的各地区版本显示为一个游戏。</strong>把你拥有的各个版本（例如美版、欧版和日版）关联起来，游戏库就只显示一张带 &#127760; 徽标的卡片。这张卡片会打开并运行你“默认地区”的版本。游戏页面并排列出所有版本，并让你在它们之间切换。ROM 工具 &gt; 地区版本会建议分组，由编辑者确认；没有你的同意，什么都不会被关联。它绝不会把续作当作第一部游戏的一个版本。已关联的版本不再因名称相同而被报告为重复。运行一次“回填别名标题”，可以让建议有更多依据。</li>
      <li><strong>AI 可以总结各地区版本之间的差异。</strong>在有关联版本的游戏上，编辑者可以在“地区版本”部分按下“用 AI 总结差异”。AI 会列出已知的差异，例如审查删改、难度或被删除的内容。这份列表标明由 AI 撰写，显示在每个版本的页面上；当你关联或取消关联某个版本时，它会隐藏，直到重新生成。需要先在 设置 &gt; 抓取 中设置一个 AI 提供商。</li>
      <li><strong>PlayStation 游戏一开始就有合适的设置。</strong>对于 DuckStation、PCSX2 和 RPCS3，RetroDB 现在会在你按下“游玩”时，在模拟器自己的单游戏设置文件中写入该游戏的分辨率缩放和宽高比，以及是否全屏启动。你可以用 设置 &gt; 模拟器 中的“设置”按钮为整个系统更改它们，也可以在游戏页面新增的“模拟器设置”面板中只为一个游戏更改。你在模拟器内部更改的设置始终优先。RetroDB 会读取每张光盘的序列号来找到正确的文件；CHD 光盘需要安装 chdman。</li>
      <li><strong>AI 填充不再会被输入到游戏字段中的文字操纵。</strong>AI 填充在检查游戏现有的发行商、开发商、版本或其他平台时，现在会先清理这些文字，就像它早已对标题所做的那样。</li>
      <li><strong>ROM 工具的扫描会留在你的 ROM 文件夹内。</strong>CHD 转换器和 CHD 校验不再跟随指向文件夹外部的快捷方式（符号链接），解压多光盘压缩包时也会忽略包内打包的任何快捷方式。</li>
      <li><strong>页面会拒绝运行被偷偷塞进来的脚本。</strong>你的浏览器现在会阻止任何不是 RetroDB 自己编写的脚本，因此混入游戏标题、标签或抓取到的描述中的代码无法运行。按钮和菜单照常工作。</li>
      <li><strong>一张损坏的截图不再让某个游戏的重复检查停下来。</strong>无法读取的截图会被放到一边，检查继续进行。</li>
      <li><strong>ROM 工具任务不再卡在“运行中”。</strong>CHD 校验扫描后被删除的文件会被算作无效，而 CHD 转换、CHD 校验或重复查找器中的任何意外错误都会让任务以失败结束，错误会记录在它的日志中。</li>
      <li><strong>在完成初始设置之前，应用的数据请求会得到明确的答复。</strong>它们会回答“需要初始设置”，而不是返回设置页面。普通页面仍会带你进入设置向导。</li>
      <li><strong>续作不再显示第一部游戏的成就。</strong>RetroAchievements 匹配时忽略了标题中的数字，所以 Donkey Kong Country 2 和 3 被关联到了 Donkey Kong Country。现在数字（2、II、3、III 等）会被计入。要更正已经关联的游戏，请为所有系统运行一次 RetroAchievements 刷新。</li>
      <li><strong>PlayStation 同步不再清空你的奖杯数量。</strong>当 PlayStation 的回复漏掉某个游戏的奖杯总数时，RetroDB 会用零覆盖已有的数量。现在它会保留这些数量，批量奖杯刷新也是如此。</li>
      <li><strong>打开一个已不在磁盘上的奖杯组会显示一条消息。</strong>奖杯页面以前会报错失败；现在它会说明未找到该奖杯组，并带你回到列表。</li>
      <li><strong>ROM 工具表格中按钮列的标题在每种语言中都正确了。</strong>这个列标题与“动作”游戏类型共用同一个词，所以有些语言在那里显示的是类型名称。</li>
      <li><strong>GameCube、3DS 和 Super Famicom 游戏会自动设置好模拟器。</strong>RetroDB 以前用游戏库并不使用的文件夹名称（gamecube、3ds、superfamicom，而不是 gc、n3ds、sfc）查找这些系统，所以 Dolphin 和 Citra 从未与它们关联。重启一次 RetroDB 即可生效。</li>
      <li><strong>无需 Python 的（独立版）下载又能设置模拟器了。</strong>它缺少列出模拟器的那个文件。</li>
      <li><strong>大约 170 个按钮、标签和消息在每种语言中都翻译好了。</strong>它们以前显示为英文，还有几个显示的是错误的猜测（有些语言在游戏启动失败时显示“备份失败”）。</li>
      <li><strong>Esc 键只关闭最上层的窗口。</strong>当一个询问框打开在另一个窗口之上时，按 Esc 以前会把两者都关闭；有些窗口被 Esc 隐藏后还在继续运行，在游戏页面上按 Esc 还可能让你暂停的批量抓取恢复运行。现在每个窗口都通过自己的“关闭”操作关闭，打开期间键盘焦点保持在窗口内，关闭后焦点回到打开它的按钮上。正在运行的任务的进度窗口会一直打开，直到任务结束。</li>
      <li><strong>分析图表使用你的语言。</strong>类型、视角、维度和模式名称，以及图表标题、坐标轴名称和图例，以前在每种语言中都是英文。</li>
      <li><strong>RetroAchievements 数据更安全了。</strong>如果某个主机的 RetroAchievements 游戏列表加载失败，RA 刷新现在会让该主机的游戏保持关联，而不是全部取消关联。“清除 RA 数据”现在只清除 RetroAchievements 进度；Steam 和 Xbox 进度会保留。</li>
      <li><strong>密码在所有地方都必须至少 12 个字符。</strong>首次设置接受任意长度的管理员密码，强制修改密码页面和设置页面也说 4 个字符就够了。现在这三处都要求 12 个字符，与应用的其他部分一致。</li>
      <li><strong>成就总数正确，而且只算你自己的。</strong>从 RetroAchievements 同步单个游戏时，现在会保存它拥有的成就数量，而不是 0。仪表盘的成就总数只统计你的游戏，收藏家奖杯也不再把每个 Steam 或 Xbox 成就算两次。</li>
      <li><strong>后台同步使用你自己的账户。</strong>如果你设置了自己的 RetroAchievements 账户，RetroAchievements 系统同步会用它登录。PlayStation 批量刷新会重用你保存的登录信息，而不是每次都从头登录。</li>
      <li><strong>只有你自己能停止或恢复你的同步。</strong>其他用户不再能取消你的 RetroAchievements、Steam 或 Xbox 同步，恢复一个被中断的任务所需的权限与启动它相同。管理员仍然可以做这两件事。</li>
      <li><strong>保存 RPCS3 奖杯文件夹时会进行检查。</strong>不存在的文件夹、不是完整路径的文件夹或系统文件夹都会被拒绝，与主设置中原有的做法一样。</li>
      <li><strong>博物馆的“获取所有图片”在后台运行。</strong>页面不再为了每一张手柄图片等上好几分钟。它会显示获取进度，提供“取消”按钮，并且在你离开页面后再回来时继续显示进度。</li>
      <li><strong>ROM 工具能更好地保护你的文件。</strong>“清理”不再会把压缩包清空：像 <code>*</code> 这样的规则无法保存，如果这些规则会删除所有文件，“清理”就会停止。CHD 转换器在关闭“校验”时会保留原文件，在开启“跳过已存在”时不会动已有的 CHD。重复查找器始终为每个游戏保留一份副本，即使请求要求删除全部副本。</li>
      <li><strong>ROM 工具任务的行为与按钮所说一致。</strong>“暂停”现在可以暂停 CHD 转换、CHD 校验、重复查找器和截图去重，已暂停的任务也可以取消。遇到错误的截图去重扫描现在会以失败结束，而不是一直运行下去。</li>
      <li><strong>创建 M3U 不再把压缩包暂存在临时文件夹中。</strong>被移走的压缩包现在会放进 RetroDB 自己的数据文件夹，重启时不会被清空。压缩包扫描器会显示它们被放到了哪里，批量确认也会说明它们将被移动。重置 ROM 工具设置现在会重置每一个选项。</li>
      <li><strong>在 RetroDB 中切换光盘。</strong>当一个从 .m3u 光盘列表启动的 RetroArch 游戏正在运行时，每个页面顶部的 &#9654; 正在游玩列表会显示游戏标题和一个“下一张光盘”按钮，因此游戏要求换到第二面时，只需点一下就能继续，无论是在浏览器中还是在手机上。RetroArch 必须开启 Settings &gt; Network &gt; Network Commands（端口 55355）；如果没有开启，按钮会提示你。</li>
      <li><strong>启动脚本会在 RetroDB 准备好后再打开它。</strong>start.sh、start.command 和 start.bat 以前固定在 3 秒后打开浏览器，常常早于服务器能够响应，导致页面加载失败。RetroDB 现在会在服务器开始监听后再打开页面。如果是从 LocalWebServerManager 启动的，它根本不会打开页面；请使用管理器的 Open 按钮。</li>
      <li><strong>游戏视频最大可达 500 MB。</strong>以前的上限是 50 MB，对大多数游戏预告片来说太小了。过大的上传现在会在游戏页面上显示一条消息，而不是用纯文本替换整个页面。被拒绝的视频（太大或文件类型不对）现在会给出说明，而不是悄无声息地被丢弃。</li>
      <li><strong>启动会使用你设置的路径。</strong>在 设置 &gt; 模拟器 中，RetroArch 那一行上的二进制路径覆盖现在优先于页面顶部的 RetroArch 路径；以前那一行的路径会被忽略。按两次“停止”不再会让游戏退出两次；在 Linux 上，RetroArch 会把第二次请求当作“不保存直接退出”，因此你的游戏内存档可能会丢失。一个尚未实现的远程模式遗留下来的启动器设置不再导致所有游戏都无法启动。</li>
      <li><strong>失败的操作会正确报告错误。</strong>当保存、导入、同步或扫描失败时，RetroDB 现在会返回真正的错误状态，并在消息中说明原因，而不是像成功了一样回复。保存一个无法连接的 PSN 登录代码时，不再显示内部错误细节。登录、用户管理、你的个人资料、成就、导入、AI 填充和 HowLongToBeat 查询现在也是如此；无法保存语言时会说明原因，而不是显示“网络错误”。</li>
      <li><strong>按 No-Intro 方式命名的游戏现在可以抓取了。</strong>像 “Legend of Zelda, The” 或 “Legend of Zelda, The - Ocarina of Time” 这样的标题，现在能匹配 “The Legend of Zelda” 的结果，而不会被匹配筛选拒绝。ROM 报告也不再把这些名称标记为不匹配。</li>
      <li><strong>从文件名得到的标题会去掉所有标记。</strong>像 “(USA, Europe)” 这样的组合地区和 “(UK)” 现在都会被移除。在 ZX Spectrum 等家用电脑上，从年份开始往后的内容都会去掉，所以 “Chuckie Egg 2 (UK) (1985) (A'n'F Software) (tzx)” 会变成 “Chuckie Egg 2”。以 “..zip” 结尾的文件名不再留下多余的句点。抓取器搜索、重置游戏数据和地区版本建议都会使用这些更干净的名称。</li>
      <li><strong>错误的标题不再在重新抓取时重复出现。</strong>批量抓取现在使用 ROM 文件中的名称搜索，而不是游戏已保存的标题。曾经匹配到错误游戏的游戏，再次抓取时会找到正确的游戏。</li>
      <li><strong>抓取器优先使用你的默认地区。</strong>当两个结果不分高下时，现在会选择来自你的默认地区或“世界”版的那个，而不是总选美版。两个只有地区标记的标题不再被算作完全匹配。地区版本不再把 “X-Men” 中的 X 误当作续作编号。选择卡片显示哪个版本时，现在只读取 ROM 的文件名，而不看它上层的文件夹，并且能理解 “(U)” 和 “(E)” 这样的旧标记。</li>
      <li><strong>日志会显示每个游戏的抓取时间花在了哪里。</strong>每个游戏抓取完后，RetroDB 会记录一行，列出在搜索、各个来源、下载、图片处理、AI 和保存上花费的秒数。这是让抓取变快的第一步。</li>
      <li><strong>抓取更快完成：小图片会在之后再变清晰。</strong>抓取现在会用下载下来的原图先保存游戏。较小的封面和截图随后会在后台放大，一次处理一个游戏。重复的截图会在这些处理之前就被丢弃。如果 RetroDB 中途停止，下次启动时会接着处理。</li>
      <li><strong>在游戏页面上阅读游戏说明书。</strong>“说明书”按钮现在会在游戏页面上方的窗口中打开 PDF。你可以用“上一页”和“下一页”、方向键、Home 和 End 键，或在手机上滑动来翻页；每一页都会像书一样翻过去，如果你的系统要求减少动画，则直接切换。“在新标签页中打开 PDF”仍然保留，按住 Ctrl 点击“说明书”会直接打开新标签页。</li>
      <li><strong>侧边栏会显示图片仍在优化中。</strong>当图片在后台变清晰时，侧边栏会显示“正在优化图片 — 剩余游戏：N”。仍在等待的游戏会在自己的页面上说明这一点，准备好后，更清晰的图片会自动出现在那里。2D/3D 封面切换开关不再挡住这一行。</li>
      <li><strong>备用来源会同时被询问。</strong>当主要来源留下空缺时，RetroDB 现在会一次性询问其他所有来源，而不是一个接一个地问。它们的答复仍按你在设置中的顺序使用，因此每个字段仍由同一个来源胜出。</li>
      <li><strong>ES-DE 的游戏列表只读取一次。</strong>以前每次抓取（包括批量抓取）都会为每个游戏把系统的 ES-DE gamelist.xml 读取两次。RetroDB 现在只读取一次，只有在文件变化时才重新读取。</li>
      <li><strong>“搜索元数据”的“应用”不再重新搜索。</strong>在游戏页面上，你勾选的结果会直接从其来源获取，而不是再查找一遍。如果什么都没有勾选，就只由你应用的来源和 AI 来填补空缺。</li>
      <li><strong>ScreenScraper 能找到带副标题的游戏。</strong>对于 “Alone in the Dark: The New Nightmare” 这样的标题，除非冒号前有一个空格，否则它什么也找不到。RetroDB 现在会按那种方式搜索；如果仍然找不到，再用冒号前面的部分搜索。</li>
      <li><strong>没有可玩内容的游戏不再提供“游玩”。</strong>从 CLZ、Steam、Xbox 或 PSN 导入添加的游戏没有 ROM 文件。现在它的页面不显示“游玩”按钮、不显示“模拟器设置”，编辑时也不显示“启动”部分，与游戏库卡片保持一致。</li>
      <li><strong>RetroArch 游戏不再受两个不良设置的影响。</strong>RetroDB 现在每次启动游戏时，都会在你的设置之上再给 RetroArch 一个它自己的小设置文件。这个文件会让键盘与你的桌面（Wayland 或 X11）相匹配，因此键盘永远不会失灵；它还会让快进以全速运行，Commodore 64 游戏就是靠快进来快速加载的。你的其他 RetroArch 设置都保持不变。</li>
      <li><strong>创建 M3U 后游戏仍留在你的游戏库中。</strong>把多光盘压缩包转成播放列表后，游戏以前仍指向那个已被移走的压缩包。现在游戏会指向新的播放列表，并保留它的详细信息和图片。当一个压缩包里有同一游戏的多个发行版本、各自有一套光盘时，播放列表现在只使用第一个版本的光盘，而不是全部，并会说明它略过了哪些光盘。</li>
      <li><strong>完整重新抓取可以保留你已有的媒体。</strong>勾选“完整重新抓取”开关旁边的“保留现有媒体”。文字信息仍会刷新，但已经在磁盘上的图片、视频和说明书会保持原样，不会重新下载。不勾选时，完整重新抓取也不再丢掉它以前下载过的截图。</li>
      <li><strong>后台任务不再丢失或跳过工作。</strong>RetroAchievements 刷新遇到一个有问题的游戏时，不再丢弃它已经更新过的游戏。恢复的同步或刷新不再跳过它停下时正在处理的那个游戏。从非常旧的快照恢复的 RetroAchievements 或 Steam 同步现在会停止并显示消息，而不是什么都没同步却报告成功。WebP 转换会先检查遗留的 WebP 文件再信任它，如果无法读取磁盘剩余空间，就不会开始。</li>
      <li><strong>升级非常旧的安装不再会悄悄丢失数据。</strong>三个旧的数据库升级步骤在少数情况下可能丢弃数据行。现在它们会复制这些行，或者停止并给出明确的错误，而不是让数据丢失。</li>
      <li><strong>“关于”窗口的按钮不再被截断。</strong>窗口变宽了，四个按钮分成两行排列，因此每个按钮的文字都能完整显示；在手机上它们会上下堆叠。</li>
      <li><strong>你的主题会跟着你到新的浏览器。</strong>在一个从未用过的浏览器上登录时，现在会显示你保存的主题。以前登录页面会先存下赛博朋克主题，然后就一直保持那样。</li>
      <li><strong>登录密码框不再写着“管理员登录”。</strong>每个账户都用密码登录，所以这个对话框现在只写“登录”。账户页面和帮助页面也是这么说的。</li>
      <li><strong>每种语言的帮助都是最新的。</strong>翻译后的帮助页面现在介绍了地区版本，说明每个账户都需要密码，并说明你的主题会随账户保存。每种语言的帮助（包括英文）现在都给出了真实的 12 个字符密码下限。</li>
      <li><strong>小修复：</strong>文件名含有撇号的同人图现在能在游戏和奖杯页面上显示；设置页面不再对非管理员账户显示脚本错误，屏幕阅读器现在也能听出选中的是哪个设置标签页；离开页面时不再在浏览器控制台中留下大量“请求已取消”的错误；放大模型会先从一个可用的地址下载；安装程序在 Windows 上把输出保存到文件时不再崩溃。</li>
      <li><strong>一大批可靠性修复。</strong>保存标题为空的游戏时，不再丢失你的其他编辑。重启现在会先让正在运行的任务干净地停止。创建 M3U 会拒绝覆盖已有的播放列表或文件夹。在 ROM 工具中清空“不需要的文件”列表现在表示“什么都不删除”，并且有两条规则不再误中 “Release of the Dragon” 这样的真实 ROM 名称。一个损坏的 PS3 奖杯文件不再让所有游戏的奖杯都变成空白。AI 填充只写入一个地区。分析在评分图表中把每个游戏只统计一次。CLZ 导入使用标准的类型名称。在编辑对话框中，类型和其他标签在每种语言中都能删除，键盘快捷键也不再抢占 Ctrl+D 或 Ctrl+G。查看者能看到游戏的完成状态，但不再能更改它，因为它是所有人共享的。</li>
      <li><strong>屏幕阅读器会按 Platform Match Required 开关的可见名称朗读它</strong>，位于 设置 → 抓取。</li>
      <li>在其他语言中，设置现在会翻译“默认地区”，“抓取”标签页读起来是一个名称，而不是“抓取中”。帮助页面也使用相同的用词。</li>
      <li><strong>无法关闭的游戏不再显示为已关闭。</strong>如果模拟器在按下“停止”后仍在运行，RetroDB 会继续显示它正在运行。被拒绝的 RetroArch 启动不再先写入它的设置文件，一启动就失败的模拟器会在第一次检查时就显示它的错误消息。</li>
      <li>更新的程序库：Pillow 13（图片处理）、numpy 2.5.4 和 onnxruntime 1.31（图片放大），以及最新版本的构建和发布工具。</li>
      <li>幕后改进：游戏启动代码经过整理，更容易看懂；删除了未使用的代码（一个 API 地址、一个 PSN 辅助程序、一个没有页面加载的奖杯脚本，以及一个没有任何地方读取的全站主题设置）；应用对浏览器的回复现在在同一个地方生成；几份设计文档已更正为与代码一致；测试套件经过整理；还新增了一项检查，会在发布前发现 JavaScript 语法错误。描述那些已删除代码的旧更新日志条目现在也注明了这一点。</li>
    </ul>
- version: 3.29.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 游戏的其他名称会显示它们来自哪个地区
  body: |
    <ul>
      <li><strong>游戏的其他名称会显示它们来自哪个地区。</strong>游戏页面的“又名”卡片会用你的语言为每个名称标上它的国家或地区，例如 “Rockman” 标为日本。带标记的名称排在前面，并按地区分组。把鼠标悬停在名称上，可以看到它的来源和任何备注，例如“开发代号”。</li>
      <li>来自 IGDB 的名称现在会保留它们的地区。以前只有 ScreenScraper 的名称才有地区。</li>
      <li>ScreenScraper 的 “SS” 标记不再显示为地区。它是 ScreenScraper 自己给游戏起的名称，而不是一个地方。</li>
      <li>ROM 工具 → 回填别名标题现在会检查每个已抓取的游戏，因此你已有的名称也会获得地区。运行一次，就能为你现有的游戏库加上标记。</li>
    </ul>
- version: 3.28.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 把 RetroDB 指向你的模拟器文件夹，它就会帮你设置好
  - type: fix
    label: 设置 → 模拟器页面的修复
  body: |
    <ul>
      <li><strong>把 RetroDB 指向你的模拟器文件夹，它就会帮你设置好。</strong>设置 → 模拟器 中新增了“模拟器文件夹”列表。添加存放模拟器的文件夹后，RetroDB 会在其中找到每一个模拟器（无论是 AppImage、便携脚本还是已安装的 Flatpak），并把它关联到它能运行的系统。已经有可用模拟器的系统会保留原来的模拟器。</li>
      <li><strong>看看哪些系统已经可以游玩。</strong>按系统映射表现在会列出每个系统的模拟器，说明每个是否可用，并让你选择系统的默认模拟器。对于 DuckStation、PCSX2、RPCS3 和 RetroArch，它还会说明 BIOS 文件是否就位，并列出缺少的文件。RetroDB 只读取 BIOS 文件，从不复制或下载任何 BIOS。</li>
      <li>模拟器扫描现在能在大型模拟器硬盘上找到每一个模拟器。以前它可能在某个模拟器自己的设置文件夹里提前停下。</li>
      <li>RetroArch 的“自动检测”和“保存”按钮又能用了，“编辑模拟器”窗口也不再在你按下“编辑”之前就显示在页面上。</li>
    </ul>
- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 应用元数据时会显示进度
  body: |
    <ul>
      <li><strong>应用元数据时会显示进度。</strong>在“搜索元数据”中选择一个结果后，一个圆环会从 0 填充到 100%，中心显示百分比，下方的一行说明正在进行的操作：正在搜索哪个网站、正在下载哪张图片或哪个视频，或者正在处理图片。较大的下载（例如视频）会随着数据到达推动圆环前进。到达 100% 时，页面会像以前一样重新加载并显示结果。</li>
      <li>圆环的前进可能不均匀。每个来源只有在响应时才决定发送多少张图片，因此第一个图片很多的来源可能填满圆环的大部分，之后的来源则较少。</li>
      <li>如果应用失败，圆环会关闭，并显示一条说明失败的消息，页面不会重新加载。</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 每个页面现在都会适应所在的窗口
  - type: enhancement
    label: 游戏页面用单独的卡片显示其他名称，并新增说明书按钮
  body: |
    <ul>
      <li><strong>每个页面现在都会适应所在的窗口。</strong>卡片类页面
        （系统、博物馆、标签、列表、ROM 工具、奖杯和成就）只要还能再放下一整张卡片，
        就会多加一列，每行最多四张。表格、工具和详情页面会稍微变宽，但在继续变宽
        只会让各列彼此拉开时停下。设置页面让各个框保持易读的宽度。</li>
      <li><strong>帮助和更新日志保持舒适的行宽。</strong>在宽窗口中，帮助的章节链接
        会移到正文旁边的一栏；在窄窗口中，它们排成一行可以左右滑动，而不再是一大块
        占据大半个手机屏幕的区域。</li>
      <li><strong>游戏页面：</strong>在宽窗口中，截图横排在顶部，下面是并排的视频和
        新增的<strong>又名</strong>卡片，与封面齐平。其他名称以前是标题下方的浅色小字，
        现在放在一张易于阅读的卡片上。<strong>说明书</strong>成了“游玩”旁边的一个按钮，
        抓取历史默认折叠。</li>
      <li>PSN 奖杯会根据窗口显示一到四列，而不再总是三列。</li>
      <li>多个页面在手机上不再左右滚动：奖杯、收藏家奖杯、RetroAchievements 系统页面、
        帮助、设置、分析、游戏导入，以及成就和奖杯详情页面。那里的宽表格现在会在
        表格内部滚动。</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 游戏库、系统和游戏页面现在会适应所在的窗口
  body: |
    <ul>
      <li><strong>页面只在有帮助时才利用宽窗口。</strong>
        游戏库和每个系统页面只要还能再放下一整张游戏卡片，就会多加一列，每行最多四张。
        手机显示一列，半屏窗口显示两到三列，宽窗口显示四列。以前页面会停在固定宽度，
        让大窗口的大部分空着。</li>
      <li><strong>游戏页面在并排放得下时，会把封面和详细信息放在截图和视频旁边</strong>，
        否则就上下排列。游戏描述保持舒适的行宽。</li>
      <li><strong>“游玩”按钮移到了每张卡片的右上角，</strong>
        变得更小并居中。它现在还会检查游戏的 ROM 文件是否仍在原处、类型是否被所属系统
        接受，因此只会出现在按下后确实能启动游戏的地方。批量选择游戏时它会隐藏。</li>
      <li>“返回顶部”按钮和进度弹窗现在紧挨着页面内容，而不是位于窗口的最边缘。</li>
      <li>游戏页面在手机上不再左右滚动。</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: “Pseudo”测试语言只向管理员提供
  body: |
    <ul>
      <li><strong>“Pseudo”不再出现在所有人的语言列表中。</strong>它是一个开发者工具，
        会把每个词都显示在括号里并加上重音符号，因此现在只向管理员提供。其他之前选了它的人
        会看到英文界面，设置中也会选中 English。</li>
    </ul>
