  date: '2026-10-17'
  tags:
  - type: feature
    label: 直接从游戏库和系统页面游玩游戏
  body: |
    <ul>
      <li><strong>每张游戏卡片上都有一个 ▶ 游玩按钮。</strong>它出现在游戏库页面和
