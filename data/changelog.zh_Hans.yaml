- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: RetroDB 现在明确声明不支持盗版
  - type: fix
    label: “关于”对话框重新以完整尺寸打开
  body: |
    <ul>
      <li><strong>应用中现在有一则反盗版声明。</strong>它出现在“关于”对话框中，
        以及设置里的 ROM 库路径下方，所有语言都有。声明指出 RetroDB 不分发也不托管
        ROM 文件，你只应使用从自己拥有的光盘和卡带中复制的游戏，并且 RetroDB 与任何
        游戏机厂商、发行商或游戏数据库均无关联。其措辞与 RetroDB 网站和宣传片一致。</li>
      <li><strong>“关于”对话框曾被挤进侧边栏。</strong>
        现在它会以正常尺寸在屏幕中央打开，在小屏幕上则可以滚动，而不会遮住标题和
        关闭按钮。</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: RetroDB 只会启动或重命名为真正的 ROM 文件类型
  body: |
    <ul>
      <li><strong>游戏可能会用一个不是 ROM 的文件启动。</strong>重命名 ROM 时接受任何名称，
        因此 <code>crash.bin</code> 可以被改成 <code>crash.cfg</code>，然后交给模拟器。
        现在启动时会对照该系统文件夹中 <code>systeminfo.txt</code> 的列表检查文件类型
        （与游戏库扫描使用的列表相同），重命名时也会拒绝列表中没有的类型。如果某个系统
        文件夹没有这份列表，其中的游戏将无法启动，提示消息会指出缺少的文件。</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: 只有管理员才能更改游戏的启动参数
  - type: fix
    label: 包含多个词或多余引号的启动参数现在可以正常使用
  - type: fix
    label: RetroDB 不再把每次已结束的启动都保留在内存中
  body: |
    <ul>
      <li><strong>编辑者可以添加会运行其他代码的启动参数。</strong>游戏的
        <em>自定义启动参数</em>会直接传给模拟器，而在 RetroArch 下它们可以加载电脑上的
        任何程序文件。现在更改它们需要管理员角色，其他人看不到这个字段。</li>
      <li><strong>包含多个词的启动参数到达模拟器时被当成了一个。</strong>
        <code>--a --b</code> 现在会作为两个参数传入，空值则不添加任何内容。缺少结尾引号
        以前会让该游戏每次启动都出现服务器错误；现在会显示一条消息，指出需要修改的字段。
        <code>{disc_paths}</code> 标记已移除：它一直是空的。</li>
      <li><strong>已结束的启动会堆积在内存中，直到 RetroDB 重启。</strong>
        超过一小时前结束的启动现在会被清除。</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: 在设置中选择语言恢复正常
  body: |
    <ul>
      <li><strong>在“设置 &rarr; 游戏库 &rarr; 显示”下选择语言没有任何效果。</strong>
        它反而显示一个错误，页面仍保持原来的语言。此问题始于 3.23.8。现在选择语言后
        会保存设置，并以该语言重新加载页面。</li>
    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: 奖杯和平台图标回到了下载版中
  body: |
    <ul>
      <li><strong>下载版缺少 RetroDB 的奖杯和平台图标。</strong>每张带有
        RetroAchievements 的游戏卡片都在徽章位置显示一张损坏的图片，奖杯等级以及
        PSN、Steam、Xbox 和 RPCS3 的标志也都缺失了。现在每个下载版都会包含它们。</li>
    </ul>
- version: 3.23.14
  date: '2026-10-10'
  tags:
  - type: security
    label: 更新了两个内置库，以纳入已公布的安全修复
  body: |
    <ul>
      <li><strong>urllib3 和 Werkzeug 存在已知的安全问题。</strong>
        RetroDB 现在随附 urllib3 2.8.0 和 Werkzeug 3.1.9，即修复这些问题的版本。
        源码安装只需再次运行 <code>install.py</code> 即可获得它们，该脚本会根据
        <code>requirements.lock</code> 进行安装。</li>
    </ul>
- version: 3.23.13
  date: '2026-09-26'
  tags:
  - type: fix
    label: 以文件夹路径存储的媒体不再被报告为缺失
  body: |
    <ul>
      <li><strong>在独立版中，“清除缺失的媒体引用”可能会清空实际存在的媒体。</strong>
        这发生在数据库以文件夹路径（例如 <code>images/boxart/…</code>）而不是单纯的
        文件名存储媒体时。RetroDB 现在会到正确的文件夹中查找。</li>
    </ul>
- version: 3.23.12
  date: '2026-09-26'
  tags:
  - type: fix
    label: 仪表盘会显示正在运行的批量抓取，另有四项小修复
  body: |
    <ul>
      <li><strong>仪表盘的抓取进度卡片从未出现。</strong>
        现在批量抓取运行时它会显示，暂停时也会注明。</li>
      <li><strong>登录页面不再在浏览器控制台中报错。</strong>
        在有人登录之前，它不再检查后台任务。</li>
      <li><strong>设置向导在保存失败时不再显示“设置完成！”。</strong>
        现在它会告诉你设置无法保存。</li>
      <li><strong>同一秒内启动的两个批量抓取不再共用同一个 ID</strong>，
        因此取消等队列操作会作用于正确的那一个。</li>
    </ul>
- version: 3.23.11
  date: '2026-09-26'
  tags:
  - type: ui
    label: 捐助按钮现在说明了所支持的对象
  body: |
    <ul>
      <li><strong>捐助说明更清楚了。</strong>页眉上的按钮现在显示为“Sponsor RetroDB”
        和“Support RetroDB”。README 说明每个版本都是免费的，捐助资助的是 RetroDB
        本身，而不是它可以启动的模拟器和核心。</li>
    </ul>
- version: 3.23.10
  date: '2026-09-26'
  tags:
  - type: fix
    label: ROM 工具页面遵循你保存的设置，日志和 ROM 工具页面恢复正常
  body: |
    <ul>
      <li><strong>日志页面和部分 ROM 工具页面无法使用。</strong>
        这些页面上的一个脚本在加载时出错，因此日志查看器和 ROM 工具共用的辅助功能
        从未启动。现在它们可以正常加载。</li>
      <li><strong>ROM 工具设置现在真正起作用了。</strong>重复查找器和 CHD 转换器打开时，
        其选项会按 ROM 工具设置页面中的设定来设置，你仍可以只为某一次运行更改它们。</li>
      <li><strong>CHD 转换器的开关被忽略了。</strong>如果你保存的设置是删除，那么在页面上
        关闭“删除原始文件”并不能阻止删除。现在由页面上的开关决定。</li>
      <li><strong>“临时路径”设置会被使用了。</strong>创建 M3U 播放列表时暂存的文件
        现在会放在其中。</li>
    </ul>
- version: 3.23.9
  date: '2026-09-26'
  tags:
  - type: security
    label: 抓取器日志文件不再保存密码和令牌，登录尝试也重新受到频率限制
  - type: fix
    label: 保存设置不再清空你的设置，删除用户也恢复正常
  body: |
    <ul>
      <li><strong>日志文件以明文保存机密信息。</strong>抓取器日志文件本应隐藏登录令牌和
        API 密钥，但隐藏步骤从未运行，因此它们被完整写入。现在它们会被隐藏。
        较早的日志文件中仍然包含这些信息；如果你会与他人共享你的安装，请删除
        <code>logs/</code> 中的旧文件。</li>
      <li><strong>登录尝试次数限制没有生效。</strong>针对重复登录和重型操作（扫描、抓取、
        导入）的限制已经设置，却从未启用。现在它们会生效，被拦截的请求会收到一条清楚的
        “请求过多”消息。</li>
      <li><strong>损坏的设置文件可能被清空。</strong>如果无法读取
        <code>data/settings.json</code>，下一次保存就会用默认值替换它。RetroDB 现在会在
        保存前将损坏的文件保留为 <code>settings.json.corrupt-&lt;time&gt;</code>。如果该
        文件又能正常读取，则会改为拒绝保存。</li>
      <li><strong>“引擎”命名行会丢失其他设置。</strong>在命名设置中向“引擎”行添加标签
        会失败，还会丢弃与它一起保存的冠词和地区设置。现在可以正常保存。</li>
      <li><strong>删除用户失败。</strong>拥有标签、列表、愿望单条目或 PSN 数据的用户
        无法被删除。现在删除会移除该用户及其拥有的一切。</li>
      <li><strong>可能同时运行两个抓取。</strong>在队列中交换或移动正在运行的批量抓取，
        会启动两个共用一个进度计数的抓取。现在只会运行一个。</li>
      <li><strong>批量抓取的进度可能看起来像错误。</strong>
        在第一次成功之前，批量抓取报告状态的方式会被某些界面当作失败。此问题已修复。</li>
      <li><strong>登录后现在会回到你原本要访问的页面。</strong>
        以前总是跳转到仪表盘。</li>
      <li><strong>管理员的文件操作会限制在你的文件夹内。</strong>图片缩放工具和 ROM
        重命名操作现在会拒绝媒体文件夹或 ROM 文件夹以外的任何内容。</li>
      <li><strong>旧的 PSN 和 Xbox 登录文件会被移入你的账户。</strong>遗留的
        <code>data/psn_tokens.json</code> 或 <code>data/xbox_tokens.json</code>
        会被载入你的账户，并重命名为以 <code>.migrated-015</code> 结尾。该文件仍保存着
        令牌，因此在确认登录正常后请将其删除。</li>
      <li><strong>服务器的错误信息更清楚了。</strong>错误的请求现在会返回一条恰当的
        错误消息，而不是“发生内部错误”。</li>
    </ul>
- version: 3.23.8
  date: '2026-09-25'
  tags:
  - type: fix
    label: CLZ 导入恢复正常，列表封面可以显示，多个页面不再因撇号而出错
  - type: security
    label: 抓取到的名称和文件路径再也无法突破页面按钮
  body: |
    <ul>
      <li><strong>CLZ 导入没有任何效果。</strong>上传 CLZ PDF 时会把它发送到服务器上
        不存在的地址，因此每次上传都以“Parse failed”（解析失败）告终。现在它会送达解析器。</li>
      <li><strong>列表页面上的封面全部缺失。</strong>列表页面向错误的地址请求每张封面，
        而且“系统”列总是空白。现在两者都能显示。页面中“添加游戏”搜索里的封面图片
        也已修复。</li>
      <li><strong>名称中带撇号时按钮会失灵。</strong>当名称中含有撇号时，从列表中移除
        “Assassin's Creed”、删除截图、放大封面或移除类型标签可能会悄无声息地毫无反应。
        同一个缺陷还会让精心构造的抓取名称在页面中运行代码。现在名称会以不可能被误读为
        代码的方式传给这些按钮。</li>
      <li><strong>图片和链接地址在所有地方都会被转义。</strong>少数页面用抓取到的文件名
        拼接图片地址却没有转义，另有五个页面各自带有一份较弱的转义辅助函数副本。
        现在它们都使用共享的那一个。</li>
      <li><strong>设置页面可能打开后一片空白。</strong>如果你上次使用的标签页在更新中被
        改了名，设置页面打开时就不会显示任何面板。现在它会忽略已不存在的标签页。
        <code>/settings#account</code> 这类链接又能打开对应的标签页了。</li>
      <li><strong>你的主题现在会跟随你到其他设备。</strong>你选择的主题会保存到你的账户中。
        从未设置过主题的浏览器会使用你保存的主题，而不是默认主题。</li>
      <li><strong>任务进度弹窗会显示正确的图标。</strong>已暂停、已完成和排队中的任务
        以前都显示同一个“运行中”图标。现在每种状态都有各自的图标，并随主题而变。</li>
      <li><strong>键盘快捷键列表现在可以翻译了。</strong>它的标签对翻译工具不可见，
        因此在所有语言中都保持英文。</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: 年龄分级经常出错，抓取过的游戏可能丢失详细信息
  body: |
    <ul>
      <li><strong>年龄分级经常出错，而且错误还会扩散。</strong>
        当分级来自 TheGamesDB 时，应用会在整段文字中的任意位置寻找分级代码，而不是正确地
        读取它 &mdash; 因此“T - Teen”“M - Mature 17+”“AO - Adults Only 18+”和
        “RP - Rating Pending”都被存成了错误的分级，一款成人级游戏可能被归为适合所有人。
        更糟的是，这个错误的分级随后被用来填写其他八种分级制度，于是一次错误的读取波及了
        全部分级。现在分级会从文字开头的代码读取。</li>
      <li><strong>换算出的分级过于宽松。</strong>在用你已有的分级补全缺失的分级时，
        应用可能会使用它刚刚推算出来的分级，而不是你最初真正拥有的那个。每换算一次就会
        降低一点严格程度。现在它总是从游戏实际拥有的分级进行换算。</li>
      <li><strong>完整重新抓取会清除手动挑选的地区和存档类型。</strong>
        这两项都不来自抓取器 &mdash; 它们由应用推算 &mdash; 因此完整重新抓取会把你精心设置的
        “Japan”替换为默认的“USA”。现在除非某个来源确实提供了新值，否则会保留你的值。</li>
      <li><strong>抓取器可能接受错误的游戏。</strong>ScreenScraper 的结果通常会在使用前
        对照匹配分数进行检查，但只返回一个结果的搜索会完全跳过这项检查。
        现在每个结果都会评分。</li>
      <li><strong>游戏可能因为一个缺失的字段而丢失所有抓取到的详细信息。</strong>
        如果 IGDB 或 ScreenScraper 以意料之外的方式让某一个字段留空，整个更新就会被丢弃
        &mdash; 发行商、开发商、图片等等全部丢失。现在这些情况都会被处理，其余的详细信息
        会被保留。</li>
      <li><strong>下载失败的图片可能被记录为成功。</strong>如果下载的图片最终无法使用，
        应用不会删除任何东西，却仍然保存文件名，留下一个损坏的引用。现在该文件会被删除，
        字段保持不变。</li>
      <li><strong>游戏模式现在使用一致的措辞。</strong>不同的抓取器分别写入
        “Single-player”“Single-Player”以及一个并非应用自身标签的“Multiplayer”，因此
        这些游戏无法被翻译，也无法被“模式”筛选匹配。现在所有来源都写入相同的标签。
        现有游戏会保留旧的措辞，直到你重新抓取它们或在设置中运行规范化工具。</li>
      <li><strong>Xbox 查询现在与其他所有来源的行为一致。</strong>它们以前自行发起网络
        请求，因此在 Xbox Live 要求放慢速度时不会重试，也不限制一次回复能拉取多少数据。
        现在它们与其他抓取器使用同一个共享连接。</li>
      <li><strong>移除了未使用的 ScreenScraper 代码。</strong>删除了应用中从未调用过的
        两个函数。其中一个返回的网址里仍带着你的 ScreenScraper 密码，任何使用它的地方
        都会拿到这个密码。3.6.x 发行说明中列出的“System Media Endpoint”就是其中之一
        &mdash; 应用中从来没有任何地方能用到它。</li>
    </ul>
- version: 3.23.5
  date: '2026-09-02'
  tags:
  - type: fix
    label: 打包下载版无法启动，以及其他构建修复
  body: |
    <ul>
      <li><strong>独立版下载完全无法启动。</strong>打包版自带 Python，但其中的启动器
        却是为源码安装编写的那个 &mdash; 它会去寻找打包版中并不包含的 Python 文件，
        并在第一行就停下。现在打包版附带自己的启动器，只需运行应用，并在服务器启动后
        打开你的浏览器。</li>
      <li><strong>Linux 下载版中的桌面快捷方式什么也启动不了。</strong>
        它在本应填写应用路径的地方放着占位文字。现在启动器旁边有一个
        <code>install-launcher.sh</code> &mdash; 运行一次，快捷方式就会写入你解压位置的
        真实路径。</li>
      <li><strong>从源码启动时会安装未经验证的依赖。</strong>
        缺少 Flask 时，启动脚本会直接从互联网获取软件包而不做校验和检查，途中还会强行绕过
        你的系统包管理器。现在它会交给 <code>install.py</code> 处理，后者使用带校验和的
        锁定文件。</li>
      <li><strong>源码下载包中带有不该包含的维护者文件。</strong>
        需要排除的文件列表是手工维护的，早已落后，因此审计输出和遗留的构建文件夹被一起
        打包进了应用。现在下载包根据项目中实际存在的文件列表构建，不会再偏离。</li>
      <li><strong>打包版中有两个设置面板失效。</strong>游戏库统计和 API 状态面板用一个
        在打包版中并不存在的名称查找主程序，因此两者都失败了。</li>
      <li><strong>有些屏幕文字永远无法被翻译。</strong>应用中较新的三个部分
        &mdash; 模拟器设置、启动按钮和“正在游玩”栏 &mdash; 被翻译扫描遗漏了，而本应发现
        这一问题的检查看的也是同一份不完整的列表。现在扫描会自动涵盖每个文件，
        这些文字也已加入翻译。</li>
      <li><strong>重新生成翻译可能悄无声息地什么也没做。</strong>
        向某个页面专用脚本添加文字后，重新生成时会认为无事可做，因此新文字从未进入翻译
        文件。</li>
      <li><strong>一个显卡相关的变通设置被应用到了所有人。</strong>
        Linux 启动脚本把一项只针对某款 AMD 显卡的设置强加给每台机器，这可能会让其他 AMD
        硬件上的图片放大器卡住。现在只有在确实存在该显卡时才会应用，并且绝不会覆盖你自己
        设置的值。</li>
      <li><strong>发布脚本可能发布错误的版本。</strong>
        之前一次尝试遗留的标签会被悄悄重用，因此构建可能基于较旧的快照完成，却仍报告
        成功。</li>
    </ul>
- version: 3.23.4
  date: '2026-09-02'
  tags:
  - type: fix
    label: 堵上了九种可能让你的游戏库丢失数据的漏洞
  body: |
    <ul>
      <li><strong>“清除抓取数据”会清空你的整个游戏库。</strong>确认框只统计了真正抓取过的
        游戏，但随后该操作却不加区分地清除了每个游戏 &mdash; 因此它可能承诺清除十几个，
        实际却清除了几千个。如果勾选了图片，它还会删除你手动上传的封面，并重置你亲自编辑过
        的标题，即使那些游戏从未被抓取过。现在它的行为与确认框所说的完全一致。</li>
      <li><strong>3D 封面留下了损坏的链接。</strong>连同图片一起清除时，会从磁盘删除 3D 封面，
        但数据库仍指向它，于是应用会去寻找一个已经不存在的文件。</li>
      <li><strong>批量编辑的“追加”开关是替换而不是添加。</strong>
        对于视角和维度，它的行为与标签恰恰相反，会一次性覆盖所有选中游戏的现有值，
        且无法撤销。</li>
      <li><strong>独立版可能一键清空所有图片引用。</strong>
        在打包下载版中，应用到错误的位置寻找你的媒体，认定每一张图片都已缺失，于是
        “清除缺失的媒体引用”就清空了整个游戏库的图片、截图、视频和说明书条目。专门用来
        防止这种情况的安全检查却看不到它。只有打包版受到影响。</li>
      <li><strong>孤立文件清理可能删除刚到达的图片。</strong>
        在清理运行期间下载的封面可能被当作孤立文件而删除。</li>
      <li><strong>创建播放列表时会未经询问就移动你的压缩包。</strong>
        批量创建 M3U 播放列表时，即使你没有开启该选项，也会把你的原始压缩文件移走
        &mdash; 而当你确实要求移动时，它又对已经成功的移动报告失败。</li>
      <li><strong>图片缩放工具让你的媒体文件夹不断膨胀。</strong>它把自己生成的小缩略图
        当作需要放大的新图片，把它们放大到完整尺寸，再为这些图片生成缩略图。每运行一次就会
        增加更多文件，页面悄悄地用完整尺寸的图片代替缩略图，AI 放大器处理的文件数量大约是
        预期的三倍。</li>
      <li><strong>AI 补全会覆盖你修正过的详细信息。</strong>在普通抓取中，它可能替换你自己
        填写的发行商、开发商、类型、年龄分级等内容。现在它只填写空白项；你亲手按下的
        AI 填充按钮保持不变。</li>
      <li><strong>重复抓取可能删除一张完好的截图。</strong>从 RAWG 抓取的游戏会重复使用
        相同的文件名，因此第二次抓取会覆盖已保存的截图，然后在游戏库仍列出它的情况下，
        把它当作重复文件删除。</li>
    </ul>
- version: 3.23.3
  date: '2026-09-01'
  tags:
  - type: fix
    label: 家庭成员角色现在名副其实，停用的账户也确实会被锁定
  body: |
    <ul>
      <li><strong>停用某人的账户现在会结束其会话。</strong>关闭一个账户会让它从所有界面中
        隐藏，但已经用该账户登录的人仍可正常使用长达一周。除了删除账户之外，停用是锁定
        某人的唯一方法，因此现在它会在对方下一次点击时立即生效。</li>
      <li><strong>只读账户再也无法更改游戏数据。</strong>
        三个“通关时长”操作向所有已登录的人开放，包括仅能查看的账户 &mdash; 因此只读账户
        可以覆盖某个游戏时长，或将其从游戏库中的每个游戏中清除。现在它们与其他所有更改游戏
        的操作一样，需要编辑权限。</li>
      <li><strong>奖杯追踪器重新对所有人可用。</strong>
        刷新你自己的收藏家奖杯需要编辑者权限，而玩家和查看者角色没有这个权限 &mdash; 而且
        这是唯一能写入这些奖杯的功能。这些账户永远无法获得奖杯，刷新按钮也只会显示错误。
        这是你自己的进度，因此现在不再需要任何特殊权限。</li>
      <li><strong>一个人的 PlayStation 刷新不再能被其他人中止。</strong>
        任何已登录的账户都可以暂停或取消别人发起的刷新，还能看到对方正处理到哪个游戏。
        现在这两项都只限于发起刷新的人。</li>
      <li><strong>Steam 导入使用你自己的账户，而不是最先保存账户的那个人。</strong>
        游戏库导入读取的是一份共享的 Steam 凭据，而不是你的，因此它可能获取到别人的游戏库
        &mdash; 而你自己保存的信息却显示为缺失。</li>
      <li><strong>猜测管理员密码重新变得困难。</strong>登录失败次数的限制由网络上的
        所有人共享，因此任何拥有自己账户的人都可以通过登录来清除它，并无限次地继续猜测。
        现在该限制按账户计算。</li>
      <li><strong>应用的错误现在会传到页面上，而不是凭空消失。
        </strong>当某个操作被拒绝时，其中 115 个以页面无法读取的形式回复，看起来就像操作
        成功了一样。现在它们会正确报告拒绝，你会看到真实的消息。</li>
    </ul>
- version: 3.23.2
  date: '2026-08-06'
  tags:
  - type: fix
    label: 抓取器设置页面加载更快，并且不会再显示过时的 API 密钥
  body: |
    <ul>
      <li><strong>设置和抓取器配置页面不再在每次请求时重新读取抓取器设置文件。</strong>
        有四个地方在每次页面加载或检查运行时都从磁盘打开并重新解析该文件，尽管已经有一个
        共享的缓存读取器。现在它们都使用它，因此这些页面每次访问所做的工作更少。</li>
      <li><strong>保存仍然会立即生效。</strong>按定时器失效的缓存可能会在保存后长达半分钟内
        向你显示旧值。现在每次保存都会在写入时清除缓存，因此你看到的就是你刚刚保存的内容。</li>
      <li><strong>你真实的 API 密钥再也不会被它们自己的遮掩显示值替换。</strong>
        设置页面将已保存的密钥显示为 <code>***1234</code>，而不是真实内容。由于页面拿到的是
        抓取器使用的同一份设置副本，这种遮掩可能会覆盖内存中的真实密钥，导致抓取器在缓存
        过期前一直用星号登录。</li>
      <li><strong>独立版现在会到正确的位置寻找抓取器设置。</strong>
        抓取器推算该文件位置的方式与保存它的页面不同。在普通安装中两者指向同一个文件；
        在独立版（双击运行）中则不然，因此保存的 API 密钥可能被存到抓取器从不查找的
        地方。</li>
    </ul>
- version: 3.23.1
  date: '2026-08-06'
  tags:
  - type: fix
    label: 你在设置中保存的服务器端口现在就是它实际使用的端口
  body: |
    <ul>
      <li><strong>保存服务器端口现在真的会让服务器换到该端口。</strong>
        设置页面接受端口、检查端口、保存端口，并告诉你需要重启才能生效 &mdash; 结果服务器
        仍然在 5000 上启动。从来没有任何地方读回这个值。现在它已纳入启动流程，因此重启后
        RetroDB 确实会换到你选择的端口。环境中设置的值仍然优先，因此由启动器或容器分配端口
        的情况不受影响。</li>
      <li><strong>两个从未起过作用的设置已被移除，而不是修复。</strong>
        “服务器主机”和“调试模式”同样被保存下来，并做出同样的虚假承诺。从网页表单开启调试
        模式会在浏览器中暴露一个交互式 Python 控制台，而绑定地址决定了哪些机器能够访问
        RetroDB &mdash; 两者都不应放在设置表单后面。它们仍可通过环境进行配置，那里本来就是
        它们的所在。如果你的设置文件中仍包含它们，加载时会被悄悄丢弃；你无需做任何事。</li>
      <li><strong>现在除非重启真的能让设置生效，否则不会再声称重启即可生效。</strong>
        这才是真正的缺陷 &mdash; 一个失效的设置只是不整洁，而一个虚假的承诺会浪费你一个下午。</li>
    </ul>
- version: 3.23.0
  date: '2026-08-06'
  tags:
  - type: enhancement
    label: 让 RetroDB 在由其他程序指定的端口上启动
  body: |
    <ul>
      <li><strong>RetroDB 现在会从其环境中读取 <code>PORT</code> 设置。</strong>
        如果你从其他工具启动 RetroDB &mdash; 仪表盘、容器、家庭服务器面板 &mdash; 该工具现在
        可以告诉 RetroDB 它要使用的端口，无需任何人编辑文件。设置 <code>PORT</code>，
        RetroDB 就会绑定到该端口；不设置则一切照旧。现有的 <code>RETRODB_PORT</code>
        仍与以前完全一样有效，如果两者都设置了，以 <code>PORT</code> 为准。</li>
      <li><strong>错误的端口号现在会直接说明，而不是瞎猜。</strong>
        以前无法读取的端口会产生一大堆 Python 错误文字，而超出可用范围的端口要等到服务器
        启动失败时才会被发现。RetroDB 现在会立即停止，并用一行文字指出它无法使用的值。
        它绝不会悄悄地在与要求不同的端口上启动 &mdash; 被悄悄挪走比被直接拒绝更糟。</li>
      <li><strong>启动横幅和浏览器标签页会跟随实际端口。</strong>
        RetroDB 启动时打印的地址，以及它为你打开的页面，以前无论实际使用哪个端口都显示
        5000。</li>
    </ul>
- version: 3.22.1
  date: '2026-07-31'
  tags:
  - type: fix
    label: 数据库的临时文件不再无限增长
  body: |
    <ul>
      <li><strong>数据库日志重新有了上限。</strong>SQLite 会在你的库数据库旁保留一个临时文件（<code>-wal</code> 文件）。RetroDB 本打算将它限制在 64&nbsp;MB，但这个上限只对后台任务生效 &mdash; 普通的页面加载和编辑完全没有上限。一次异常大的写入之后，该文件就会永远停留在最大体积，有时甚至比数据库本身还大。现在上限处处生效，空间会被归还。</li>
    </ul>
- version: 3.22.0
  date: '2026-07-05'
  tags:
  - type: enhancement
    label: 直接从游戏弹窗抓取，无需额外跳转
  body: |
    <ul>
      <li><strong>从游戏弹窗抓取。</strong>快捷游戏弹窗（在游戏库中单击游戏时出现的
        那个）现在在 AI&nbsp;填充和编辑旁边新增了一个<strong>抓取</strong>按钮。
        单击它，RetroDB 便会直接带你进入该游戏，并已打开元数据搜索 &mdash; 再也不用
        先打开完整页面去寻找抓取按钮了。</li>
    </ul>
- version: 3.21.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: 一键启动 — 从固定的图标启动 RetroDB，无需终端
  - type: feature
    label: 真正的应用图标 — 浏览器标签页和任务栏中的霓虹游戏手柄
  - type: feature
    label: 设置页面新增“关闭服务器”按钮
  body: |
    <ul>
      <li><strong>一键启动。</strong>RetroDB 现在有了一个可以固定到任务栏的正式
        启动器 &mdash; 单击它，应用便会启动（如果尚未运行），并自动在浏览器中打开。
        再也不用打开终端输入命令了。在 Linux 上，运行一次
        <code>python3 scripts/install_launcher.py</code> 即可将
        &ldquo;RetroDB&rdquo; 添加到应用菜单，然后固定它。</li>
      <li><strong>真正的应用图标。</strong>RetroDB 现在拥有了一个霓虹游戏手柄图标
        &mdash; 深色方块上的赛博朋克青色与洋红色 &mdash; 显示在浏览器标签页
        （网站图标）、任务栏启动器以及 Windows 程序本身上。它取代了原先朴素的
        表情符号占位图。</li>
      <li><strong>关闭服务器按钮。</strong>设置页面的服务器控制中，现在在重启旁边
        新增了一个红色的<strong>关闭服务器</strong>按钮。它会干净地停止应用
        （先让正在运行的任务完成保存），因此你再也不用切换到终端按 Ctrl+C 了。</li>
      <li><strong>可下载版本会为你打开浏览器。</strong>开箱即用的 Windows、Mac
        和 Linux 下载版现在会在启动片刻后自动弹出浏览器，让应用无需任何额外步骤
        便呈现在你眼前。</li>
    </ul>
- version: 3.20.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: 新增 11 种语言 — RetroDB 现已支持 21 种语言
  - type: fix
    label: '修复离开游戏列表时出现的无害控制台错误'
  body: |
    <ul>
      <li><strong>新增 11 个语言包。</strong>RetroDB 的界面、发行说明
        和帮助手册现已翻译为
        <strong>Afrikaans、isiZulu、isiXhosa、Dutch、Norwegian（Bokmål）、
        Russian、Polish、Turkish、Ukrainian、Indonesian 和 Hebrew</strong>
        &mdash; 加入现有的 German、Spanish、French、Italian、Japanese、
        Korean、Brazilian Portuguese，以及 Simplified &amp; Traditional
        Chinese。在设置 &rarr; 显示偏好 &rarr; 语言 中选择你的语言；
        应用会以你选择的语言重新加载。</li>
      <li>每种语言都覆盖整个应用：每一个按钮、标签和提示信息、完整的
        发行说明历史，以及完整的帮助指南。</li>
      <li><strong>isiZulu 和 isiXhosa</strong> 也包含在内。由于这两种
        语言现有的软件词汇还很有限，在没有自然对应词的地方，常见技术
        术语（ROM、scraper、box art）会保留英文原文 &mdash; 欢迎母语者
        校对。</li>
      <li><strong>Hebrew</strong> 已提供完整翻译文本；精细的从右到左
        排版（让界面正确镜像显示）将在后续更新中提供。待该排版工作
        完成后，Arabic 也会随之推出。</li>
      <li><strong>错误修复：</strong>离开游戏库或某个系统的游戏列表时，浏览器控制台不再记录一条无害的“ReferenceError”（早前清理留下的残余）。没有可见影响 &mdash; 只是控制台更干净了。</li>
    </ul>
- version: 3.19.1
  date: '2026-07-05'
  tags:
  - type: performance
    label: 抓取更快 —— 同一游戏的截图现在会同时下载
  body: |
    <ul>
      <li><strong>截图并行下载。</strong>沿用广受欢迎的 ES-DE
        前端的做法（它会一次性获取一个游戏的所有媒体），RetroDB 现在会为每个
        来源（TheGamesDB、IGDB、RAWG、ScreenScraper）<strong>并发</strong>下载
        游戏的截图，而不再一张接一张地下载。拥有多张截图的游戏会明显
        更快完成。</li>
      <li>重复截图检查仍会随后按顺序运行，因此图片去重的准确度
        与以往完全一致 &mdash; 加速的只是下载环节。下载最多同时进行四个，
        以免单个来源被过度占用。</li>
      <li>底层的速度改进；将在下次重启后生效。</li>
    </ul>
- version: 3.19.0
  date: '2026-07-05'
  tags:
  - type: performance
    label: 抓取更快 —— 现在会同时查询各个来源
  body: |
    <ul>
      <li><strong>每个游戏的抓取更快了。</strong>当 RetroDB 查询某个
        游戏时，它会检索多个数据库（ES-DE、TheGamesDB、IGDB、RAWG、
        ScreenScraper）。以前它<em>一次只问一个</em>，并等待每一个
        回答后再问下一个 &mdash; 因此等待时间是所有来源之和。现在它会
        <strong>同时</strong>询问全部来源，只等待最慢的那个，这在每个游戏上
        都是明显的提速。结果的排序和评分方式与以往完全相同。</li>
      <li><strong>下载图片时减少无谓的握手。</strong>现在图片下载
        会复用一个已经打开的连接，而不是为每一张图片都重新打开
        一个连接，从而为拥有大量截图的游戏节省时间。</li>
      <li>这些都是底层的速度改进 &mdash; 你使用 RetroDB 的方式毫无变化，
        它也不会对数据库造成更大压力（请求相同，只是重叠进行）。将在下次
        重启后生效。</li>
    </ul>
- version: 3.18.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: 新增中国（大陆）年龄分级，成为第 9 套分级体系
  body: |
    <ul>
      <li><strong>新增年龄分级体系：中国（CADPA）。</strong>RetroDB 现在
        支持中国官方的游戏适龄提示方案
        （&ldquo;网络游戏适龄提示&rdquo;，由 CADPA 发布），与现有的
        八套机构（ESRB、PEGI、CERO、USK、ACB、FPB、GRAC 和 ClassInd）并列。它采用
        三个等级 &mdash; <strong>8+</strong>、<strong>12+</strong> 和
        <strong>16+</strong> &mdash; 以简洁的绿色徽标显示。</li>
      <li><strong>它会像其他体系一样自行填充。</strong>当某个游戏已经
        拥有来自任何其他国家/地区的分级时，RetroDB 会自动推算出对应的中国
        等级（反之亦然）。你也可以在游戏的编辑界面中手动选择或更改它，并
        在设置 &rarr; 游戏库中将其设为你偏好的显示体系。注意：大多数西方游戏数据库
        并不发布中国分级，因此对于任何来源都没有分级的游戏，会在抓取 /
        AI Fill 期间根据游戏内容进行填充。</li>
      <li>这些绿色徽标是 RetroDB 自制的简洁图案（与其他机构的整体
        风格一致），并非 CADPA 的官方标志，因此不涉及任何图片
        授权限制。</li>
    </ul>
- version: 3.17.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: 清除数据库中指向磁盘上已丢失媒体文件的记录
  - type: security
    label: 当媒体文件夹丢失时，防止整个游戏库的图片被误删
  body: |
    <ul>
      <li><strong>新增维护工具：&ldquo;缺失的媒体引用&rdquo;</strong>
        （设置 &rarr; 系统 &rarr; 维护）。它是现有&ldquo;孤立媒体&rdquo;清理功能的
        镜像：后者查找没有对应游戏的多余图片文件，而它则查找那些封面、3D
        封面、截图、粉丝艺术图、视频或说明书指向磁盘上已不存在文件的游戏。
        先扫描它们，然后一键清除这些失效的引用，以便抓取器可以重新下载相应
        图片。你的游戏记录本身绝不会被改动。</li>
      <li><strong>抓取期间更安全的自动清理。</strong>当 RetroDB 重新抓取某个
        游戏时，它会悄然清除指向磁盘上已消失媒体文件的引用。以前，如果整个
        媒体文件夹一次性消失 &mdash; 比如某个已卸载的外置硬盘，或一次批量删除
        &mdash; 这项清理可能会抹去成千上万款游戏的图片记录，迫使你付出高昂代价
        重新抓取。现在 RetroDB 能识别这一信号：如果某个媒体文件夹丢失或完全
        为空，它会保留这些引用并记录一条警告，而不是将其清除。新的维护工具
        采用同样的保护机制，并会清楚地标出任何被它保留下来的文件夹。</li>
    </ul>
- version: 3.16.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: 仪表盘新增&ldquo;快速修复&rdquo;面板
  body: |
    <ul>
      <li><strong>仪表盘上新增的&ldquo;快速修复&rdquo;面板</strong>
        把零散的游戏库杂务整理成一目了然的待办清单。它会显示还有多少款游戏
        缺少封面，并提供一键快捷方式，用于查找重复的 ROM 以及检查失效的 ROM
        路径（文件已被移动或删除的游戏）。每个快捷方式都直接链接到能修复对应
        问题的页面。当你的游戏库中有游戏后，该面板便会出现。</li>
    </ul>
- version: 3.15.0
  date: '2026-07-03'
  tags:
  - type: accessibility
    label: 屏幕阅读器现在会朗读任务进度
  body: |
    <ul>
      <li><strong>耗时较长的任务现在会向屏幕阅读器朗读进度。</strong>在批量抓取、
        成就同步（RetroAchievements 或 PlayStation）或图片缩放运行期间，屏幕阅读器
        用户以前在&ldquo;开始&rdquo;和&ldquo;完成&rdquo;之间听不到任何提示。现在
        RetroDB 会定期朗读进度节点（例如&ldquo;40个中的12个&rdquo;）以及完成情况，
        并且不会在屏幕上增加额外的弹窗。播报经过节流处理，做到有信息而不啰嗦，并会
        遵循您所选择的语言。</li>
    </ul>
- version: 3.14.0
  date: '2026-07-01'
  tags:
  - type: feature
    label: 新增语言 — 现已支持中文（简体和繁体）
  body: "<ul>\n  <li><strong>RetroDB 现已支持中文。</strong>在\n    <strong>设置 &rarr; 系统 &rarr; 语言</strong> 下有两个选择:\n    <strong>中文 (简体)</strong>（简体，面向中国大陆）和\n    <strong>中文 (繁體)</strong>（繁体，面向中国香港和台湾）。整个界面\n    &mdash; 菜单、按钮、消息以及应用内帮助手册 &mdash; 均已翻译,\n    尚未翻译的内容会悄然回退为英文。至此,支持的语言达到十种(英语、德语、\n    西班牙语、法语、意大利语、日语、巴西葡萄牙语、韩语,以及现在的简体中文\n    &amp; 繁体中文)。</li>\n</ul>\n"
- version: 3.13.0
  date: '2026-06-30'
  tags:
  - type: enhancement
    label: PlayStation Network 登录不再那么麻烦
  body: "<ul>\n  <li><strong>你的 PlayStation 登录现在会自行续期。</strong>\n    以前你大约每隔几个月就得重新粘贴一次 NPSSO 令牌（PlayStation\n    登录码）。RetroDB 现在会在会话过期<em>之前</em>在后台悄悄\n    刷新它，因此在正常使用中你应该很少 &mdash; 甚至从不 &mdash; 需要输入\n    新的令牌。它只刷新仍然有效的会话；对已经过期的会话则不去理会\n    （不做无谓的探测）。</li>\n  <li><strong>过期前会有提醒。</strong>如果你的 PlayStation\n    会话距离过期不到两周（或已经过期），仪表盘\n    现在会显示一条可关闭的小提醒，附带一键\n    重新关联的链接 &mdash; 这样你可以在自己方便的时候修复，而不是\n    通过一次同步失败才发现问题。</li>\n  <li><strong>一键获取令牌。</strong>PlayStation 设置\n    向导现在提供一个可选的书签小工具：把它拖到浏览器的\n    书签栏一次，之后在索尼的令牌页面上单击一下即可复制你的\n    NPSSO &mdash; 无需再全选后复制。手动粘贴仍然\n    和以前完全一样可用。</li>\n  <li>整理了应用内的 PlayStation 帮助，使其与令牌的实际\n    存储方式相符（安全地按用户存储在 RetroDB 的数据库中），并\n    修正了备份清单。</li>\n</ul>\n"
- version: 3.12.1
  date: '2026-06-30'
  tags:
  - type: fix
    label: 全新安装现在会构建完整的数据库；可靠性修复
  body: "<ul>\n  <li><strong>全新安装现在开箱即用。</strong>之前\n    全新安装构建游戏数据库时缺少了应用所需的若干\n    列和表（评分、RetroAchievements\n    数据、手柄信息），因此在干净的环境中打开游戏库可能会显示错误。\n    新增的数据库升级步骤会补齐所有缺失的\n    部分。现有游戏库不受影响 &mdash; 该步骤只是\n    确认这些部分已经存在。</li>\n  <li><strong>成就与奖杯同步不再丢失某个游戏的\n    进度。</strong>如果某个游戏在同步途中失败（RetroAchievements、\n    Steam、Xbox），恢复步骤可能会悄悄丢弃上一个\n    游戏刚刚保存好的进度，即便它已被算作完成。\n    现在每个游戏都单独保存，因此一次小故障不会回滚\n    相邻的游戏。PSN 奖杯同步在首次\n    运行时也不再报错。</li>\n  <li><strong>&ldquo;清除抓取的数据&rdquo;更安全了。</strong>在同时\n    删除图片时，应用现在会先清除数据库引用，\n    再删除文件，这样即使清理过程被中断也不会让\n    游戏库指向已经消失的图片。</li>\n  <li><strong>表单和导入现在能干净地处理空的或格式错误的请求</strong>\n    （修改密码、编辑用户、Steam/Xbox/PSN 导入、\n    ROM 重命名、删除截图）&mdash; 它们现在会返回一条整洁的消息\n    而不是内部错误。</li>\n  <li><strong>带引号的游戏名称不再破坏页面。</strong>\n    多个将系统或 ROM 名称嵌入页面的界面现在\n    会正确转义它，因此撇号或不寻常的字符不会\n    阻止页面加载。</li>\n  <li>底层加固：更安全的设置文件写入（两次保存\n    重叠时不会产生损坏的文件）、更健壮的游戏元数据抓取（一条坏\n    记录不再中止整个来源）、对外发图片抓取上可用的 DNS 重绑定\n    防护，以及现在针对一次性数据库运行的\n    测试套件，因此它绝不会触及你真正的游戏库。</li>\n</ul>\n"
- version: 3.12.0
  date: '2026-06-30'
  tags:
  - type: feature
    label: 新增语言 — 现已支持韩语（한국어）
  body: "<ul>\n  <li><strong>RetroDB 现已提供韩语（한국어）版本。</strong>在\n    设置 &rarr; 系统 &rarr; 语言 中选择它。整个界面\n    &mdash; 菜单、按钮、消息以及应用内的帮助手册 &mdash;\n    都已翻译，使支持的语言增至八种（英语、德语、\n    西班牙语、法语、意大利语、日语、巴西葡萄牙语和韩语）。\n    韩语补全了 RetroDB 所显示的每一个游戏\n    分级机构的覆盖，包括韩国的 GRAC。</li>\n</ul>\n"
- version: 3.11.0
  date: '2026-06-30'
  tags:
  - type: enhancement
    label: 在 Patreon 上支持 RetroDB — 新增捐赠链接
  body: "<ul>\n  <li><strong>你现在可以在 Patreon 上支持 RetroDB。</strong>一个 Patreon\n    链接位于\n    <strong>设置 &rarr; 系统 &rarr; 支持开发</strong> 中现有的\n    &ldquo;在 GitHub 上赞助&rdquo;按钮旁，也出现在关于面板\n    以及项目的 README 中。RetroDB 始终保持完全\n    免费和开源 &mdash; 捐赠完全是可选的，只是\n    帮助个人开发得以持续。</li>\n</ul>\n"
- version: 3.10.0
  date: '2026-06-26'
  tags:
  - type: enhancement
    label: 更新日志现在通过“加载更多”按钮加载更快
  body: "<ul>\n  <li><strong>更新日志页面现在打开快得多。</strong>RetroDB 现在\n    不再在每次打开时绘制整个发行历史（数百条\n    条目），而是显示最近的 20 条，并在底部添加一个\n    <strong>加载更多</strong>按钮。点击它即可显示\n    下一批，以此类推 &mdash; 较早的历史仍然全部\n    保留，只是按需加载，而不再拖慢首次\n    浏览。</li>\n</ul>\n"
- version: 3.9.0
  date: '2026-06-17'
  tags:
  - type: feature
    label: 帮助手册和近期发行说明现已翻译成全部 6 种语言
  body: "<ul>\n  <li><strong>完整的应用内帮助手册现已提供全部六种\n    语言</strong> &mdash; 德语、法语、西班牙语、意大利语、日语\n    和巴西葡萄牙语 &mdash; 而不仅仅是英语。RetroDB 会以\n    你在设置中选择的语言显示手册，并在某些内容\n    尚未翻译时悄悄回退到英语。</li>\n  <li><strong>这份更新日志现在也会以你的语言显示</strong>，\n    针对最近的发行版本，今后的新发行也将从这里开始翻译。\n    较早的历史仍保留英语。</li>\n  <li><strong>愿望单页面和最后残留的英文文本</strong>\n    &mdash; 一批在 3.8.0 语言包首次落地时被遗漏的\n    弹出错误和状态消息 &mdash; 现在也能在整个应用中\n    正确翻译了。</li>\n</ul>\n"
- version: 3.8.2
  date: '2026-06-17'
  tags:
  - type: security
    label: 安全依赖更新 + CI 修复
  body: "<ul>\n  <li><strong>安全：</strong>更新了捆绑的 <code>cryptography</code>\n    库（47 → 49）以清除一条已发布的公告（GHSA-537c-gmf6-5ccf）。\n    行为没有变化 —— 只是更安全的版本。</li>\n  <li>修复了自动化测试流水线：一个仅供测试用的缺失辅助库\n    (<code>beautifulsoup4</code>) 自 v3.7.0 起一直导致测试运行失败，\n    而新的打包构建脚本触发了一项已知的静态分析误报\n    （它运行的是受信任的构建命令，而非用户输入）\n    —— 现已记录并校准。仅为维护；应用本身\n    没有任何变化。</li>\n</ul>\n"
- version: 3.8.1
  date: '2026-06-17'
  tags:
  - type: improvement
    label: 更小的下载选项、捐赠整理与翻译修复（Pass 46.3 / 47.6）
  body: "<ul>\n  <li><strong>一个小得多的下载版本即将到来。</strong>\n    RetroDB 那个“解压即双击运行”的现成版本现在可以\n    构建为<strong>仅 CPU</strong>版本（约 600&nbsp;MB），供\n    没有 AMD 显卡的用户使用 &mdash; 大约只有完整\n    版本的六分之一大小。两者将并列提供，方便你选择\n    适合你机器的那一个。</li>\n  <li><strong>设置中的“支持开发”面板现在会翻译了</strong>，\n    与应用的其余部分保持一致 &mdash; 之前它在语言包于\n    3.8.0 落地时被意外遗漏在英语中。</li>\n  <li>整理了捐赠链接（README 中的 GitHub Sponsors 徽章；\n    资金文件已为 Patreon 和 Buy&nbsp;Me&nbsp;A&nbsp;Coffee 准备就绪，\n    只待它们设置完成）。永远不会有唠叨弹窗。</li>\n  <li>幕后：发行流水线现在可以自动为 Windows、macOS\n    和 Linux 构建现成运行的版本。注意：冗长的\n    应用内<em>帮助</em>手册目前仍然仅有英语 &mdash; 这已\n    记录为后续工作。</li>\n</ul>\n"
- version: 3.8.0
  date: '2026-06-12'
  tags:
  - type: feature
    label: 完整的界面翻译 + 6 种语言（Pass 43.2/43.3/43.5）
  body: "<ul>\n  <li><strong>RetroDB 现在又多会说 6 种语言了。</strong>在\n    3.7.0 打下的基础上，整个界面已变得可翻译，并\n    经机器翻译为<strong>德语、法语、西班牙语、意大利语、\n    日语和巴西葡萄牙语</strong>。在\n    设置 &rarr; 显示偏好 &rarr; 语言 中选择你的语言；它会遵循你保存的\n    偏好，然后是你的浏览器，最后回退到英语 &mdash; 它\n    绝不会卡在某个缺失的语言上。</li>\n  <li><strong>屏幕上的一切都已覆盖</strong>：页面文本和按钮、\n    弹出消息（那些小小的&ldquo;toast&rdquo;通知）、编辑\n    和设置对话框、工具提示以及屏幕阅读器标签。游戏类型、\n    视角和游戏模式（例如&ldquo;First-Person-Shooter&rdquo;）现在也会\n    以你的语言显示 &mdash; 而底层数据仍保持\n    英语，因此你的游戏库和筛选依旧和以前完全一样地工作。</li>\n  <li>内置的\n    <strong>&ldquo;Pseudo&rdquo;语言</strong>（可在\n    语言菜单中看到）是一个供翻译人员使用的 QA 工具，它给每个\n    标签加上括号和重音符号，让任何被漏掉的文本一目了然。</li>\n  <li>机器翻译只是一个起点，某些地方读起来可能\n    有点生硬 &mdash; 它们很容易随时间改进，任何没有\n    翻译的文本会直接显示为英语。</li>\n</ul>\n"
