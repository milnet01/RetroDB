  body: |
    <ul>
      <li><strong>한 게임의 지역판들이 게임 하나로 표시됩니다.</strong>
        가지고 있는 판(예: 미국판, 유럽판, 일본판)을 연결하면 라이브러리에
        &#127760; 배지가 붙은 카드 하나가 표시됩니다. 카드는 기본 지역의 판을
        열고 실행합니다. 게임 페이지는 모든 판을 나란히 보여 주고 서로 전환할
        수 있게 해 줍니다. ROM 도구 &gt; 지역별 버전이 편집자가 확인할 그룹을
        제안하며, 직접 확인하지 않으면 아무것도 연결되지 않습니다. 후속작을 첫
        작품의 다른 판으로 제안하는 일은 없습니다. 연결된 판은 더 이상 이름이
        같다는 이유로 중복으로 보고되지 않습니다. 제안의 근거를 늘리려면 대체
        제목 백필을 한 번 실행하세요.</li>
      <li><strong>AI가 지역판 사이의 차이를 요약해 줍니다.</strong> 판이
        연결된 게임에서 편집자는 지역별 버전 섹션의 AI로 차이점 요약을 누를 수
        있습니다. AI는 검열, 난이도, 삭제된 내용처럼 알려진 차이를 나열합니다.
        이 목록에는 AI가 작성했다는 표시가 붙고, 모든 판의 페이지에 표시되며,
        판을 연결하거나 연결을 해제하면 다시 작성될 때까지 숨겨집니다. 설정 &gt;
        스크래핑에서 AI 제공자를 설정해야 합니다.</li>
      <li><strong>PlayStation 게임이 좋은 설정으로 시작합니다.</strong>
        DuckStation, PCSX2, RPCS3의 경우 실행을 누르면 RetroDB가 이제 에뮬레이터
        자체의 게임별 설정 파일에 해상도 배율과 화면 비율, 그리고 전체 화면으로
        시작할지를 기록합니다. 시스템 전체는 설정 &gt; 에뮬레이터의 Settings
        버튼으로, 게임 하나는 게임 페이지의 새 에뮬레이터 설정 패널에서 바꿀 수
        있습니다. 에뮬레이터 안에서 바꾼 설정이 항상 우선합니다. RetroDB는 각
        디스크의 시리얼 번호를 읽어 알맞은 파일을 찾으며, CHD 디스크에는 chdman이
        설치되어 있어야 합니다.</li>
      <li><strong>게임 필드에 입력한 텍스트로 더 이상 AI 채우기를 조종할 수
        없습니다.</strong> AI 채우기가 게임의 기존 배급사, 개발사, 에디션이나
        다른 플랫폼을 확인할 때, 이미 제목에 하던 것과 같은 방식으로 그 텍스트를
        먼저 정리합니다.</li>
      <li><strong>ROM 도구 검사가 ROM 폴더 안에서만 이루어집니다.</strong> CHD
        변환기와 CHD 검증은 폴더 밖을 가리키는 바로 가기(심볼릭 링크)를 더 이상
        따라가지 않으며, 여러 디스크로 된 압축 파일을 풀 때 그 안에 들어 있는
        바로 가기는 무시합니다.</li>
      <li><strong>페이지가 몰래 끼워 넣은 스크립트를 실행하지 않습니다.</strong>
        이제 브라우저가 RetroDB가 직접 작성하지 않은 스크립트를 모두 막으므로,
        게임 제목, 태그, 스크랩한 설명에 코드를 숨겨 넣어도 실행되지 않습니다.
        버튼과 메뉴는 이전처럼 작동합니다.</li>
      <li><strong>깨진 스크린샷 하나 때문에 게임의 중복 검사가 멈추지
        않습니다.</strong> 읽을 수 없는 스크린샷은 따로 두고 검사를 계속합니다.</li>
      <li><strong>ROM 도구 작업이 더 이상 "실행 중"에 멈춰 있지 않습니다.</strong>
        CHD 검증 검사 후에 삭제된 파일은 잘못된 파일로 집계되며, CHD 변환, CHD
        검증, 중복 찾기에서 예기치 않은 오류가 나면 작업이 실패로 끝나고 로그에
        오류가 남습니다.</li>
      <li><strong>설정을 마치기 전에도 앱의 데이터 요청이 분명한 답을
        받습니다.</strong> 설정 페이지를 돌려주는 대신 "설정이 필요합니다"라고
        답합니다. 페이지는 여전히 설정 마법사로 안내합니다.</li>
      <li><strong>후속작에 더 이상 첫 작품의 업적이 표시되지 않습니다.</strong>
        RetroAchievements 매칭이 제목의 숫자를 무시해서 Donkey Kong Country 2와
        3이 Donkey Kong Country에 연결되었습니다. 이제 숫자(2, II, 3, III 등)를
        구별합니다. 이미 연결된 게임을 바로잡으려면 모든 시스템에 대해
        RetroAchievements 새로고침을 한 번 실행하세요.</li>
      <li><strong>PlayStation 동기화가 더 이상 트로피 수를 지우지 않습니다.</strong>
        PlayStation의 응답에 게임의 트로피 합계가 빠져 있으면 RetroDB는 이미 있던
        수 위에 0을 저장했습니다. 이제 기존 수를 유지하며, 일괄 트로피
        새로고침에서도 마찬가지입니다.</li>
      <li><strong>디스크에 없는 트로피 세트를 열면 메시지가 표시됩니다.</strong>
        트로피 페이지가 오류로 실패하곤 했지만, 이제 세트를 찾을 수 없다고 알려
        주고 목록으로 돌아갑니다.</li>
      <li><strong>ROM 도구 표의 버튼 열 제목이 모든 언어에서 올바르게
        표시됩니다.</strong> 이 열 제목이 액션 게임 장르와 같은 문구를 써서, 일부
        언어에서는 그 자리에 장르 이름이 표시되었습니다.</li>
      <li><strong>GameCube, 3DS, Super Famicom 게임의 에뮬레이터가 자동으로
        설정됩니다.</strong> RetroDB가 이 시스템들을 라이브러리에서 쓰지 않는 폴더
        이름(gc, n3ds, sfc 대신 gamecube, 3ds, superfamicom)으로 찾았기 때문에
        Dolphin과 Citra가 연결되지 않았습니다. 반영하려면 RetroDB를 한 번 다시
        시작하세요.</li>
      <li><strong>Python 없는(독립 실행형) 다운로드가 다시 에뮬레이터를
        설정합니다.</strong> 에뮬레이터 목록이 담긴 파일이 빠져 있었습니다.</li>
      <li><strong>약 170개의 버튼, 레이블, 메시지가 추가로 번역되었습니다</strong>
        (모든 언어). 이전에는 영어로 표시되었고, 몇 개는 잘못 추측한 문구가
        표시되었습니다(일부 언어에서는 게임 실행에 실패했을 때 "백업
        실패"라고 표시되었습니다).</li>
      <li><strong>Escape는 맨 위의 창만 닫습니다.</strong> 다른 창 위에 질문이
        열려 있을 때 Escape를 누르면 둘 다 닫혔고, 일부 창은 Escape로 숨겨진 뒤에도
        계속 실행되었으며, 게임 페이지에서 Escape를 누르면 일시정지한 일괄
        스크래핑이 다시 시작될 수 있었습니다. 이제 모든 창은 자신의 닫기 동작으로
        닫히고, 열려 있는 동안 키보드 포커스를 안에 유지하며, 닫히면 창을 연
        버튼으로 포커스를 돌려줍니다. 실행 중인 작업의 진행 창은 작업이 끝날
        때까지 열려 있습니다.</li>
      <li><strong>분석 차트가 사용자의 언어로 표시됩니다.</strong> 장르, 시점,
        차원, 모드 이름과 차트 제목, 축 이름, 범례가 모든 언어에서 영어였습니다.</li>
      <li><strong>RetroAchievements 데이터가 더 안전해졌습니다.</strong> 어떤
        콘솔의 RetroAchievements 게임 목록을 불러오지 못하면, RA 새로고침은 이제
        그 콘솔의 게임 연결을 모두 해제하는 대신 그대로 둡니다. RA 데이터 지우기는
        이제 RetroAchievements 진행 상황만 지우고 Steam과 Xbox 진행 상황은
        남겨 둡니다.</li>
      <li><strong>비밀번호는 어디서나 12자 이상이어야 합니다.</strong> 첫 실행
        설정은 길이에 상관없이 관리자 비밀번호를 받아들였고, 강제 비밀번호 변경
        페이지와 설정 페이지는 4자면 충분하다고 안내했습니다. 이제 세 곳 모두 앱의
        나머지 부분과 같이 12자를 요구합니다.</li>
      <li><strong>업적 합계가 정확하고, 내 것만 셉니다.</strong>
        RetroAchievements에서 게임 하나를 동기화하면 이제 0 대신 그 게임의 업적
        수를 저장합니다. 대시보드의 업적 합계는 내 게임만 세고, 수집가 트로피는
        Steam이나 Xbox 업적을 더 이상 두 번 세지 않습니다.</li>
      <li><strong>백그라운드 동기화가 내 계정을 사용합니다.</strong>
        RetroAchievements 시스템 동기화는 내 RetroAchievements 계정을 설정해 두었으면
        그 계정으로 로그인합니다. PlayStation 일괄 새로고침은 매번 처음부터
        로그인하는 대신 저장된 로그인 정보를 다시 사용합니다.</li>
      <li><strong>내 동기화는 나만 중지하거나 재개할 수 있습니다.</strong> 다른
        사용자가 더 이상 내 RetroAchievements, Steam, Xbox 동기화를 취소할 수
        없으며, 중단된 작업을 재개하려면 시작할 때와 같은 권한이 필요합니다.
        관리자는 여전히 둘 다 할 수 있습니다.</li>
      <li><strong>RPCS3 트로피 폴더를 저장할 때 확인합니다.</strong> 존재하지
        않는 폴더, 전체 경로가 아닌 폴더, 시스템 폴더는 주 설정에서와 마찬가지로
        거부됩니다.</li>
      <li><strong>박물관의 "모든 이미지 가져오기"가 백그라운드에서
        실행됩니다.</strong> 페이지가 모든 컨트롤러 이미지를 기다리느라 몇 분씩
        멈추지 않습니다. 가져오기가 어디까지 진행되었는지 보여 주고, 취소 버튼이
        있으며, 페이지를 떠났다가 돌아와도 진행 상황을 다시 이어서 보여 줍니다.</li>
      <li><strong>ROM 도구가 파일을 더 잘 보호합니다.</strong> 정리 기능이 더 이상
        압축 파일을 비우지 않습니다. <code>*</code> 같은 패턴은 저장할 수 없고,
        패턴이 모든 파일을 지우게 되면 정리가 멈춥니다. CHD 변환기는 "verify"가
        꺼져 있으면 원본을 남겨 두고, "skip existing"이 켜져 있으면 기존 CHD를
        건드리지 않습니다. 중복 찾기는 요청이 모두 지우라고 해도 각 게임의 사본을
        항상 하나 남깁니다.</li>
      <li><strong>ROM 도구 작업이 버튼에 적힌 대로 작동합니다.</strong> 일시정지가
        이제 CHD 변환, CHD 검증, 중복 찾기, 스크린샷 중복 제거를 멈추며, 일시정지된
        작업을 취소할 수 있습니다. 오류가 난 스크린샷 중복 제거 검사는 끝없이
        실행되는 대신 실패로 끝납니다.</li>
      <li><strong>M3U 만들기가 더 이상 압축 파일을 임시 폴더에 두지
        않습니다.</strong> 옮겨진 압축 파일은 이제 다시 시작해도 지워지지 않는
        RetroDB 자체 데이터 폴더로 갑니다. 아카이브 스캐너는 파일이 어디로 갔는지
        보여 주고, 일괄 확인 창은 파일이 옮겨진다고 알려 줍니다. ROM 도구 설정을
        초기화하면 이제 모든 옵션이 초기화됩니다.</li>
      <li><strong>RetroDB에서 디스크를 바꿀 수 있습니다.</strong> .m3u 디스크
        목록으로 시작한 RetroArch 게임이 실행되는 동안, 모든 페이지 위쪽의
        &#9654; 플레이 중 목록에 게임 제목과 다음 디스크 버튼이 표시됩니다. 그래서
        두 번째 면을 요구하는 게임도 브라우저나 휴대폰에서 한 번 클릭으로 계속할 수
        있습니다. RetroArch에서 Settings &gt; Network &gt; Network Commands를
        켜 두어야 하며(포트 55355), 꺼져 있으면 버튼이 알려 줍니다.</li>
      <li><strong>시작 스크립트가 RetroDB가 준비되면 엽니다.</strong> start.sh,
        start.command, start.bat은 정해진 3초 뒤에 브라우저를 열어서, 서버가
        응답하기 전에 열리는 일이 잦았고 페이지가 로드되지 않았습니다. 이제
        RetroDB는 서버가 요청을 받을 준비가 되면 페이지를 엽니다.
        LocalWebServerManager에서 시작하면 페이지를 전혀 열지 않으니, 관리자의
        Open 버튼을 사용하세요.</li>
      <li><strong>게임 동영상은 500 MB까지 가능합니다.</strong> 한도가 50 MB여서
        대부분의 게임 트레일러에는 너무 작았습니다. 너무 큰 업로드는 이제 페이지를
        일반 텍스트로 바꾸는 대신 게임 페이지에 메시지를 표시합니다. 거부된
        동영상(너무 크거나 파일 형식이 잘못된 경우)은 아무 말 없이 버려지는 대신
        그렇다고 알려 줍니다.</li>
      <li><strong>실행이 설정한 경로를 따릅니다.</strong> 설정 &gt; 에뮬레이터의
        RetroArch 행에 있는 Binary path override가 이제 그 페이지 맨 위의
        RetroArch 경로보다 우선합니다. 이전에는 행의 경로가 무시되었습니다. 중지를
        두 번 눌러도 더 이상 게임에 종료를 두 번 요청하지 않습니다. Linux에서
        RetroArch는 두 번째 요청을 "저장하지 않고 종료"로 받아들여 게임 내 저장이
        사라질 수 있었습니다.
        만들지 않은 원격 모드에서 남은 실행기 설정이 더 이상 모든 게임의 시작을
        막지 않습니다.</li>
      <li><strong>실패한 작업이 오류를 제대로 알립니다.</strong> 저장, 가져오기,
        동기화, 검사가 실패하면 RetroDB는 이제 성공한 것처럼 답하는 대신 실제 오류
        상태로 답하고 메시지에 이유를 보여 줍니다. 연결할 수 없는 PSN 로그인
        코드를 저장해도 더 이상 내부 오류 세부 정보가 표시되지 않습니다. 로그인,
        사용자 관리, 프로필, 업적, 가져오기, AI 채우기, HowLongToBeat 조회도 이제
        같은 방식으로 작동하며, 저장할 수 없는 언어는 "네트워크 오류" 대신 이유를
        알려 줍니다.</li>
      <li><strong>No-Intro 방식으로 이름 붙인 게임도 이제 스크랩됩니다.</strong>
        "Legend of Zelda, The"나 "Legend of Zelda, The - Ocarina of Time" 같은
        제목이 이제 일치 필터에서 거부되지 않고 "The Legend of Zelda" 결과와
        일치합니다. ROM 리포트도 이런 이름을 더 이상 불일치로 표시하지
        않습니다.</li>
      <li><strong>파일 이름에서 가져온 제목의 태그가 모두 제거됩니다.</strong>
        "(USA, Europe)" 같은 복합 지역과 "(UK)"도 이제 제거됩니다. ZX Spectrum
        같은 홈 컴퓨터에서는 연도부터 뒤쪽이 모두 빠지므로, "Chuckie Egg 2 (UK)
        (1985) (A'n'F Software) (tzx)"는 "Chuckie Egg 2"가 됩니다. "..zip"으로
        끝나는 파일 이름이 더 이상 점을 하나 남기지 않습니다. 스크래퍼 검색, 게임
        데이터 초기화, 지역별 버전 제안이 이 깔끔한 이름을 사용합니다.</li>
      <li><strong>잘못된 제목이 재스크랩 때 되풀이되지 않습니다.</strong> 일괄
        스크래핑이 이제 게임에 저장된 제목이 아니라 ROM 파일의 이름으로
        검색합니다. 한때 다른 게임과 잘못 일치했던 게임도 다시 스크랩하면 올바른
        게임을 찾습니다.</li>
      <li><strong>스크래퍼가 기본 지역을 우선합니다.</strong> 두 결과가 동점이면
        이제 항상 미국판이 아니라 기본 지역이나 World의 결과가 이깁니다. 지역
        태그뿐인 두 제목은 더 이상 완벽히 일치하는 것으로 치지 않습니다. 지역별
        버전은 "X-Men"의 X를 더 이상 후속작 번호로 착각하지 않습니다. 카드에 표시할
        판을 고를 때는 이제 그 위의 폴더가 아닌 ROM 파일 이름만 읽으며, "(U)"와
        "(E)" 같은 옛 태그도 이해합니다.</li>
      <li><strong>게임마다 스크래핑 시간이 어디에 쓰이는지 로그에
        남습니다.</strong> 게임 하나가 끝날 때마다 RetroDB는 검색, 각 소스,
        다운로드, 이미지 처리, AI, 저장에 쓴 초를 한 줄로 기록합니다. 스크래핑을
        빠르게 하기 위한 첫걸음입니다.</li>
      <li><strong>스크래핑이 더 빨리 끝납니다. 작은 그림은 나중에 선명하게
        만듭니다.</strong> 스크래핑은 이제 다운로드한 그대로의 그림과 함께 게임을
        저장합니다. 작은 박스 아트와 스크린샷은 그 뒤에 백그라운드에서 한 게임씩
        확대됩니다. 중복된 스크린샷은 그 작업 전에 버립니다. RetroDB가 도중에
        멈추면 다음에 시작할 때 이어서 진행합니다.</li>
      <li><strong>게임 페이지에서 설명서를 읽을 수 있습니다.</strong> 설명서
        버튼이 이제 게임 페이지 위의 창에서 PDF를 엽니다. 이전과 다음 버튼,
        화살표 키, Home과 End, 또는 휴대폰에서 밀기로 페이지를 넘깁니다. 각
        페이지는 책장처럼 넘어가며, 시스템에서 동작 줄이기를 설정했다면 그냥
        바뀝니다. "새 탭에서 PDF 열기"도 그대로 있고, 설명서를 Ctrl-클릭하면 바로
        탭이 열립니다.</li>
      <li><strong>사이드바에 이미지가 아직 개선 중인지 표시됩니다.</strong>
        그림이 백그라운드에서 선명해지는 동안 사이드바에 "이미지 개선 중 — 남은
        게임: N"이 표시됩니다. 아직 기다리는 게임은 페이지에 그렇다고 표시되고,
        더 선명한 이미지가 준비되면 그 자리에 저절로 나타납니다. 2D/3D 표지
        전환 버튼이 더 이상 그 줄을 가리지 않습니다.</li>
      <li><strong>보조 소스에 한꺼번에 묻습니다.</strong> 주 소스가 빈칸을
        남기면 RetroDB는 이제 다른 소스들에 하나씩 차례로 묻는 대신 동시에
        묻습니다. 답은 여전히 설정의 순서대로 사용되므로, 각 필드에는 같은 소스가
        이깁니다.</li>
      <li><strong>ES-DE 게임 목록을 한 번만 읽습니다.</strong> 일괄 스크래핑을
        포함한 모든 스크래핑이 게임마다 시스템의 ES-DE gamelist.xml을 두 번씩
        읽었습니다. RetroDB는 이제 한 번 읽고, 파일이 바뀔 때만 다시 읽습니다.</li>
      <li><strong>메타데이터 검색의 적용이 더 이상 다시 검색하지 않습니다.</strong>
        게임 페이지에서 선택한 결과를 두 번째로 찾는 대신 해당 소스에서 바로
        가져옵니다. 아무것도 선택하지 않으면 적용한 소스와 AI만 빈칸을
        채웁니다.</li>
      <li><strong>ScreenScraper가 부제가 있는 게임을 찾습니다.</strong>
        "Alone in the Dark: The New Nightmare" 같은 제목은 콜론 앞에 공백이
        없으면 아무것도 찾지 못했습니다. RetroDB는 이제 그런 형태로 검색하고,
        그래도 찾지 못하면 콜론 앞부분으로 검색합니다.</li>
      <li><strong>실행할 것이 없는 게임에는 실행 버튼이 없습니다.</strong> CLZ,
        Steam, Xbox, PSN 가져오기로 추가한 게임에는 ROM 파일이 없습니다. 이제 그
        게임의 페이지에는 라이브러리 카드와 마찬가지로 실행 버튼과 에뮬레이터 설정이
        없고, 편집할 때 실행 섹션도 표시되지 않습니다.</li>
      <li><strong>RetroArch 게임이 두 가지 나쁜 설정으로부터 보호됩니다.</strong>
        RetroDB는 이제 게임을 시작할 때마다 사용자의 설정 위에 RetroArch 전용의
        작은 설정 파일을 하나 줍니다. 이 파일은 키보드를 데스크톱(Wayland 또는
        X11)에 맞춰서 키보드가 먹통이 되지 않게 하고, Commodore 64 게임이 빨리
        로드하는 데 쓰는 빨리 감기가 최고 속도로 돌게 합니다. 다른 RetroArch
        설정은 모두 그대로입니다.</li>
      <li><strong>M3U 만들기 후에도 게임이 라이브러리에 남습니다.</strong> 여러
        디스크로 된 압축 파일을 재생 목록으로 바꾸면, 게임이 다른 곳으로 옮겨진
        압축 파일을 계속 가리키곤 했습니다. 이제 게임은 새 재생 목록을 가리키고
        정보와 그림도 유지합니다. 압축 파일 하나에 한 게임의 여러 발매판이 각자의
        디스크 세트로 들어 있으면, 재생 목록은 이제 전부가 아니라 첫 발매판의
        디스크를 사용하고 어떤 디스크를 뺐는지 알려 줍니다.</li>
      <li><strong>전체 재스크랩에서 이미 가진 미디어를 유지할 수 있습니다.</strong>
        전체 재스크랩 스위치 옆의 "기존 미디어 유지"를 체크하세요. 텍스트 정보는
        여전히 새로 고쳐지지만, 디스크에 이미 있는 아트, 동영상, 설명서는 다시
        다운로드하지 않고 그대로 둡니다. 체크하지 않아도 전체 재스크랩이 더 이상
        이전에 다운로드한 스크린샷을 버리지 않습니다.</li>
      <li><strong>백그라운드 작업이 더 이상 작업을 잃거나 건너뛰지
        않습니다.</strong> RetroAchievements 새로고침이 문제 있는 게임 하나를
        만나도 이미 업데이트한 게임들을 더 이상 버리지 않습니다. 재개한 동기화나
        새로고침이 멈췄을 때 처리하던 게임을 더 이상 건너뛰지 않습니다. 아주 오래된
        스냅샷에서 재개한 RetroAchievements나 Steam 동기화는 아무것도 동기화하지
        않고 성공이라고 보고하는 대신 메시지와 함께 멈춥니다. WebP 변환은 남아 있던
        WebP 파일을 믿기 전에 확인하고, 남은 디스크 공간을 읽을 수 없으면 시작하지
        않습니다.</li>
      <li><strong>아주 오래된 설치를 업그레이드해도 더 이상 데이터가 몰래
        사라지지 않습니다.</strong> 오래된 데이터베이스 업그레이드 단계 세 개가
        드문 상황에서 행을 잃을 수 있었습니다. 이제 행을 복사하거나, 잃는 대신
        분명한 오류와 함께 멈춥니다.</li>
      <li><strong>정보 창의 버튼이 더 이상 잘리지 않습니다.</strong> 창이 더
        넓어지고 네 개의 버튼이 두 줄로 놓여서 모든 레이블이 다 보입니다.
        휴대폰에서는 세로로 쌓입니다.</li>
      <li><strong>테마가 새 브라우저에서도 따라옵니다.</strong> 전에 쓰지 않은
        브라우저에서 로그인하면 이제 저장된 테마가 표시됩니다. 이전에는 로그인
        페이지가 Cyberpunk를 먼저 저장해서 그대로 굳어 버렸습니다.</li>
      <li><strong>로그인 비밀번호 상자에 더 이상 "Admin Login"이라고 표시되지
        않습니다.</strong> 모든 계정이 비밀번호로 로그인하므로 대화 상자에는 이제
        그냥 로그인이라고 표시됩니다. 계정 페이지와 도움말 페이지도 그렇게
        안내합니다.</li>
      <li><strong>도움말이 모든 언어에서 최신 상태입니다.</strong> 번역된 도움말
        페이지가 이제 지역별 버전을 설명하고, 모든 계정에 비밀번호가 필요하며
        테마가 계정과 함께 저장된다고 안내합니다. 영어를 포함한 모든 언어의
        도움말이 이제 실제 비밀번호 최소 길이인 12자를 알려 줍니다.</li>
      <li><strong>작은 수정:</strong> 파일 이름에 아포스트로피가 있는 팬아트가
        이제 게임 페이지와 트로피 페이지에 표시됩니다. 관리자가 아닌 계정에서
        설정 페이지가 더 이상 스크립트 오류를 표시하지 않으며, 화면 낭독기가 어떤
        설정 탭이 선택되었는지 알려 줍니다. 페이지를 떠날 때 브라우저 콘솔이 더
        이상 취소된 요청 오류로 가득 차지 않습니다. 업스케일러 모델은 작동하는
        주소에서 먼저 다운로드합니다. 설치 프로그램은 출력을 파일로 저장할 때
        Windows에서 더 이상 충돌하지 않습니다.</li>
      <li><strong>안정성을 높이는 수정을 폭넓게 했습니다.</strong> 제목이 빈
        게임을 저장해도 더 이상 다른 편집 내용을 잃지 않습니다. 다시 시작은 이제
        실행 중인 작업이 먼저 깔끔하게 멈추게 합니다. M3U 만들기는 기존 재생
        목록이나 폴더를 덮어쓰지 않습니다. ROM 도구의 불필요 파일 목록을 비우면
        이제 "아무것도 지우지 않음"을 뜻하며, 두 패턴이 더 이상 "Release of the
        Dragon" 같은 실제 ROM 이름을 잡아내지 않습니다. 손상된 PS3 트로피 파일
        하나가 더 이상 모든 게임의 트로피를 비우지 않습니다. AI 채우기는 지역을
        하나만 씁니다. 분석은 평점 차트에서 각 게임을 한 번만 셉니다. CLZ
        가져오기는 표준 장르 이름을 사용합니다. 편집 대화 상자에서 장르와 다른
        태그를 모든 언어에서 지울 수 있고, 키보드 단축키가 더 이상 Ctrl+D나
        Ctrl+G를 가로채지 않습니다. 보기 전용 사용자는 게임의 완료 상태를 볼 수
        있지만, 모두가 함께 쓰는 값이므로 더 이상 바꿀 수 없습니다.</li>
      <li><strong>화면 낭독기가 Platform Match Required 스위치를 화면에 보이는
        이름으로 읽습니다</strong>(설정 → 스크래핑).</li>
      <li>다른 언어에서 설정이 이제 "기본 지역"을 번역하고, 스크래핑 탭은
        "스크래핑 중"이 아니라 이름으로 읽힙니다. 도움말 페이지도 같은 단어를
        사용합니다.</li>
      <li><strong>닫히지 않은 게임이 더 이상 닫힌 것으로 표시되지
        않습니다.</strong> 중지 후에도 에뮬레이터가 살아 있으면 RetroDB는 계속
        실행 중으로 표시합니다. 거부된 RetroArch 실행은 더 이상 설정 파일을 먼저
        쓰지 않으며, 곧바로 실패한 에뮬레이터는 첫 확인 때 오류 메시지를
        보여 줍니다.</li>
      <li>업데이트된 라이브러리: Pillow 13(이미지 처리), numpy 2.5.4와
        onnxruntime 1.31(업스케일링), 그리고 빌드 및 릴리스 도구의 최신 버전.</li>
      <li>내부 작업: 게임 실행 코드를 따라가기 쉽게 정리했고, 쓰이지 않는 코드(API
        주소 하나, PSN 도우미 하나, 어떤 페이지도 불러오지 않던 트로피 스크립트,
        아무도 읽지 않던 사이트 전체 테마 설정)를 제거했습니다. 앱이 브라우저에
        보내는 응답은 한곳에서 만들어지고, 여러 설계 문서를 코드에 맞게
        바로잡았으며, 테스트 모음을 정리했고, 새 검사가 릴리스 전에 JavaScript
        문법 오류를 잡아냅니다. 제거된 코드를 설명하던 이전 변경 내역 항목에도
        이제 그렇게 적혀 있습니다.</li>
    </ul>
- version: 3.29.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 게임의 다른 이름에 출신 지역이 표시됩니다
  body: |
    <ul>
      <li><strong>게임의 다른 이름에 출신 지역이 표시됩니다.</strong> 게임
        페이지의 다른 이름 카드가 각 이름에 나라나 지역을 사용자의 언어로
        표시합니다(예: "Rockman"에는 일본). 지역이 표시된 이름이 먼저 나오며
        지역별로 묶입니다. 이름 위에 마우스를 올리면 출처와 "가제" 같은 메모를 볼
        수 있습니다.</li>
      <li>IGDB에서 가져온 이름도 이제 지역을 유지합니다. 이전에는 ScreenScraper
        이름에만 지역이 있었습니다.</li>
      <li>ScreenScraper의 "SS" 표시는 더 이상 지역으로 표시되지 않습니다. 장소가
        아니라 ScreenScraper가 게임에 붙인 자체 이름입니다.</li>
      <li>ROM 도구 → 대체 제목 백필이 이제 스크랩된 모든 게임을 확인하므로, 이미
        가진 이름에도 지역이 붙습니다. 기존 라이브러리에 표시하려면 한 번
        실행하세요.</li>
    </ul>
- version: 3.28.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 에뮬레이터 폴더를 알려 주면 RetroDB가 설정해 줍니다
  - type: fix
    label: 설정 → 에뮬레이터 페이지 수정
  body: |
    <ul>
      <li><strong>에뮬레이터 폴더를 알려 주면 RetroDB가 설정해
        줍니다.</strong> 설정 → 에뮬레이터에 새 에뮬레이터 폴더 목록이
        생겼습니다. 에뮬레이터가 들어 있는 폴더를 추가하면 RetroDB가 그 안에서
        AppImage, 포터블 스크립트, 설치된 Flatpak 형태의 에뮬레이터를 하나하나
        찾아 실행할 수 있는 시스템에 연결합니다. 이미 작동하는 에뮬레이터가 있는
        시스템은 그대로 유지됩니다.</li>
      <li><strong>어떤 시스템이 플레이할 준비가 되었는지 볼 수 있습니다.</strong>
        Per-system mapping 표가 이제 시스템마다 에뮬레이터를 모두 나열하고, 각각이
        작동하는지 알려 주며, 시스템의 기본 에뮬레이터를 고를 수 있게 해 줍니다.
        DuckStation, PCSX2, RPCS3, RetroArch의 경우 BIOS 파일이 제자리에 있는지도
        알려 주고 빠진 파일의 이름을 보여 줍니다. RetroDB는 BIOS 파일을 읽기만
        하며, 복사하거나 다운로드하지 않습니다.</li>
      <li>에뮬레이터 검사가 이제 큰 에뮬레이터 드라이브에 있는 에뮬레이터를 모두
        찾습니다. 이전에는 에뮬레이터 자체의 설정 폴더 안에서 일찍 멈출 수
        있었습니다.</li>
      <li>RetroArch의 Auto-detect와 저장 버튼이 다시 작동하며, 에뮬레이터 편집
        창이 편집을 누르기 전까지 페이지에 표시되지 않습니다.</li>
    </ul>
- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 메타데이터 적용 시 진행 정도가 표시됩니다
  body: |
    <ul>
      <li><strong>메타데이터 적용 시 진행 정도가 표시됩니다.</strong> 메타데이터 검색에서 결과를 선택하면 링이
        0%에서 100%까지 채워지고 가운데에 백분율이 표시되며, 그 아래 줄에는 지금 무슨 일이 일어나고 있는지 표시됩니다. 어느
        사이트를 검색 중인지, 어떤 이미지나 동영상을 다운로드 중인지, 또는 이미지를 처리 중인지 알려 줍니다. 동영상처럼 큰
        다운로드는 데이터가 도착하는 대로 링을 움직입니다. 100%가 되면 이전처럼 결과와 함께 페이지가 다시 로드됩니다.</li>
      <li>링은 고르지 않게 움직일 수 있습니다. 각 소스는 응답할 때가 되어서야 보낼 이미지 수를 정하므로, 이미지가 많은 첫 번째
        소스가 링의 상당 부분을 채우고 이후 소스는 더 적게 채울 수 있습니다.</li>
      <li>적용에 실패하면 링이 닫히고 메시지로 알려 주며, 페이지는 다시 로드되지 않습니다.</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 이제 모든 페이지가 창 크기에 맞춰집니다
  - type: enhancement
    label: 게임 페이지에서 다른 이름을 별도 카드로 보여 주고, 설명서 버튼이 생겼습니다
  body: |
    <ul>
      <li><strong>이제 모든 페이지가 창 크기에 맞춰집니다.</strong> 카드 페이지
        (시스템, 박물관, 태그, 목록, ROM 도구, 트로피와 업적)는 카드가 하나 더
        온전히 들어갈 때마다 열을 하나씩 늘리며, 한 줄에 최대 네 개까지 표시합니다.
        표, 도구, 상세 페이지는 조금 넓어지지만, 더 넓히면 열 사이만 벌어지는
        지점에서 멈춥니다. 설정 페이지의 상자들은 읽기 편한 너비를 유지합니다.</li>
      <li><strong>도움말과 변경 내역은 읽기 편한 줄 길이를
        유지합니다.</strong> 넓은 창에서는 도움말 섹션 링크가 본문 옆의 열로
        이동합니다. 좁은 창에서는 휴대폰 화면의 상당 부분을 가리던 덩어리 대신,
        밀어서 넘길 수 있는 한 줄로 표시됩니다.</li>
      <li><strong>게임 페이지:</strong> 넓은 창에서는 스크린샷이 위쪽에 가로로
        펼쳐지고, 그 아래에 동영상과 새로운 <strong>다른
        이름</strong> 카드가 표지와 같은 높이로 나란히 놓입니다. 다른
        이름들은 제목 아래에 흐릿한 글씨로 표시되었지만, 이제 읽기 쉬운 카드에
        들어갑니다. <strong>설명서</strong>는 실행 버튼 옆의 버튼이 되었고,
        스크래핑 기록은 접힌 상태로 시작합니다.</li>
      <li>PSN 트로피는 항상 세 열 대신 창에 맞춰 한 열에서 네 열까지
        표시합니다.</li>
      <li>여러 페이지가 이제 휴대폰에서 옆으로 스크롤되지 않습니다: 트로피,
        수집가 트로피, RetroAchievements 시스템 페이지, 도움말, 설정,
        분석, 게임 가져오기, 업적 및 트로피 상세 페이지.
        넓은 표는 이제 표 안에서 스크롤됩니다.</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 라이브러리, 시스템, 게임 페이지가 이제 창 크기에 맞춰집니다
  body: |
    <ul>
      <li><strong>페이지가 넓은 창을 쓸모 있을 때만 활용합니다.</strong>
        라이브러리와 모든 시스템 페이지는 게임 카드가 하나 더 온전히 들어갈
        때마다 열을 하나씩 늘리며, 한 줄에 최대 네 개까지 표시합니다. 휴대폰은
        한 개, 반 화면 창은 두세 개, 넓은 창은 네 개를 보여 줍니다. 예전에는
        페이지가 고정된 너비에서 멈춰 큰 창의 대부분이 비어 있었습니다.</li>
      <li><strong>게임 페이지는 표지와 세부 정보를 스크린샷과 동영상
        옆에 놓습니다.</strong> 나란히 들어갈 공간이 있을 때만 그렇게 하고,
        아니면 위아래로 쌓습니다. 설명은 읽기 편한 줄 길이를 유지합니다.</li>
      <li><strong>실행 버튼이 각 카드의 오른쪽 위 모서리로 옮겨졌습니다.</strong>
        더 작아지고 가운데에 정렬됩니다. 이제 게임의 ROM 파일이 아직 있는지,
        그리고 해당 시스템이 받아들이는 형식인지도 확인하므로, 눌렀을 때 게임이
        시작되는 곳에만 나타납니다. 여러 게임을 한꺼번에 선택하는 동안에는
        숨겨집니다.</li>
      <li>맨 위로 버튼과 진행 상황 팝업이 창의 맨 가장자리가 아니라 페이지
        내용 바로 옆에 표시됩니다.</li>
      <li>게임 페이지가 휴대폰에서 더 이상 옆으로 스크롤되지 않습니다.</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: '"Pseudo" 테스트 언어는 이제 관리자에게만 제공됩니다'
  body: |
    <ul>
      <li><strong>"Pseudo"가 더 이상 모든 사람의 언어 목록에 나타나지
        않습니다.</strong> 이것은 모든 단어를 괄호와 악센트로 감싸 보여 주는
        개발자용 도구이므로, 이제 관리자에게만 제공됩니다. 다른 사용자가 이를
        선택해 두었다면 앱이 영어로 표시되고, 설정에서도 영어가 선택된 상태가
        됩니다.</li>
    </ul>
- version: 3.24.1
  date: '2026-10-17'
  tags:
  - type: fix
    label: Windows 다운로드가 다시 설치되며, 창 크기를 바꾼 뒤 오류가 쏟아지지 않습니다
  body: |
    <ul>
      <li><strong>일반 Windows 다운로드를 설치할 수 없었습니다.</strong>
        설치 프로그램이 "Core dependencies failed to install"에서 멈췄습니다.
        고정된 패키지 목록에 Windows에서만 필요한 패키지 하나가 빠져 있었기
        때문입니다. 이제 목록이 모든 플랫폼을 포함합니다. Python이 필요 없는
        Windows 다운로드는 영향을 받지 않았습니다.</li>
      <li><strong>오류 메시지가 오른쪽 위 모서리에 계속 나타났습니다.</strong>
        Cyberpunk 테마에서 브라우저 창을 넓혔을 때(예: 최대화) 발생했습니다.
        이제 움직이는 배경의 크기가 깔끔하게 조정됩니다.</li>
    </ul>
- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 라이브러리와 시스템 페이지에서 바로 게임 실행
  body: |
    <ul>
      <li><strong>각 게임 카드에 ▶ 실행 버튼이 생겼습니다.</strong> 라이브러리
        페이지와 모든 시스템 페이지에서 박스 아트의 왼쪽 아래 모서리에
        나타납니다. 누르면 게임이 에뮬레이터에서 시작되며, 게임 페이지를 먼저
        열지 않고 목록에 그대로 머무릅니다.</li>
      <li>버튼은 누르면 실제로 작동할 수 있는 곳에만 표시됩니다: 계정에 게임
        실행 권한이 있고, 게임의 에뮬레이터가 활성화되어 설치되어 있으며,
        RetroArch의 경우 코어가 있어야 합니다. 작동하는 에뮬레이터가 없는
        시스템의 게임에는 버튼이 표시되지 않습니다.</li>
      <li>그래도 실행에 실패하면(예: ROM 파일이 옮겨진 경우) 그 이유가
        메시지로 표시되고 페이지는 그대로 유지됩니다.</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: 더 짧아진 사이드바, 모든 플랫폼을 위한 하나의 업적 페이지
  body: |
    <ul>
      <li><strong>"업적" 링크 하나가 다섯 개를 대신합니다.</strong>
        RetroAchievements, RPCS3, PSN, Steam, Xbox가 이제 한 페이지의 탭이
        되었고, 링크를 누르면 마지막으로 사용한 탭이 다시 열립니다.
        RetroAchievements 게임이 없으면 대시보드로 돌려보내는 대신 RPCS3 탭이
        열립니다.</li>
      <li><strong>ROM 리포트가 이제 ROM 도구 안에 있습니다.</strong> 다른
        도구들 옆의 탭과 ROM 도구 페이지의 카드로 표시됩니다.</li>
      <li><strong>사이드바 링크끼리 같은 아이콘을 쓰지 않습니다:</strong>
        대시보드는 이제 🏠, 로그 뷰어는 🧾입니다. 사이드바 링크가 21개에서
        16개로 줄었습니다.</li>
      <li>ROM 도구 설정 페이지의 도구 탭은 항상 영어로 표시되었지만, 이제
        선택한 언어를 따릅니다.</li>
    </ul>
- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: How Long To Beat 조회가 다시 작동합니다
  body: |
    <ul>
      <li><strong>How Long To Beat 조회가 모두 게임을 찾을 수 없다고
        나왔습니다.</strong> 사이트가 검색 기능을 새 주소로 옮기면서
        RetroDB의 요청이 거부되었습니다. 이 문제는 7월 말에서 9월 말 사이에
        생겼습니다. 이제 RetroDB는 새 주소를 사용하며, 사이트가 무시하기
        시작한 플랫폼과 연도 필터도 사이트의 새 형식으로 보냅니다. 게임 하나씩
        조회하는 기능과 ROM 도구의 일괄 조회 모두 다시 작동합니다.</li>
    </ul>
- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: RetroDB가 불법 복제를 용인하지 않는다고 분명히 밝힙니다
  - type: fix
    label: 정보 대화 상자가 다시 원래 크기로 열립니다
  body: |
    <ul>
      <li><strong>이제 앱에 불법 복제 반대 안내문이 있습니다.</strong>
        정보 대화 상자와 설정의 ROM 라이브러리 경로 아래에 모든 언어로
        표시됩니다. RetroDB는 ROM 파일을 배포하거나 호스팅하지 않으며, 직접
        소유한 디스크와 카트리지에서 복사한 게임만 사용해야 하고, RetroDB는
        어떤 콘솔 제조사, 퍼블리셔, 게임 데이터베이스와도 관련이 없다는
        내용입니다. 문구는 RetroDB 웹사이트 및 트레일러와 같습니다.</li>
      <li><strong>정보 대화 상자가 사이드바 안에 끼어 좁게 표시되었습니다.</strong>
        이제 화면 가운데에 원래 크기로 열리며, 작은 화면에서는 제목과 닫기
        버튼을 가리는 대신 스크롤됩니다.</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: RetroDB는 실제 ROM 파일 형식으로만 실행하거나 이름을 바꿉니다
  body: |
    <ul>
      <li><strong>ROM이 아닌 파일로 게임이 실행될 수 있었습니다.</strong>
        ROM 이름 변경이 어떤 이름이든 받아들였기 때문에
        <code>crash.bin</code>이 <code>crash.cfg</code>가 되어 그대로
        에뮬레이터에 전달될 수 있었습니다. 이제 실행할 때 파일 형식을 해당
        시스템 폴더의 <code>systeminfo.txt</code>에 있는 목록과 대조합니다.
        라이브러리 스캔이 사용하는 것과 같은 목록이며, 이름 변경도 그 목록에
        없는 형식은 거부합니다. 시스템 폴더에 목록이 없으면 그 시스템의 게임은
        실행되지 않으며, 메시지에 빠진 파일 이름이 표시됩니다.</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: 게임의 실행 인수는 관리자만 바꿀 수 있습니다
  - type: fix
    label: 여러 단어로 된 실행 인수나 따옴표가 하나 남은 인수도 이제 작동합니다
  - type: fix
    label: RetroDB가 더 이상 끝난 실행을 모두 메모리에 쌓아 두지 않습니다
  body: |
    <ul>
      <li><strong>편집자가 다른 코드를 실행하는 실행 인수를 추가할 수
        있었습니다.</strong> 게임의 <em>사용자 지정 실행 인수</em>는 그대로
        에뮬레이터에 전달되며, RetroArch에서는 컴퓨터에 있는 어떤 프로그램
        파일이든 불러올 수 있었습니다. 이제 이를 바꾸려면 관리자 역할이
        필요하며, 다른 사용자에게는 이 입력란이 숨겨집니다.</li>
      <li><strong>여러 단어로 된 실행 인수가 에뮬레이터에 한 단어로
        전달되었습니다.</strong> 이제 <code>--a --b</code>는 두 개의 인수로
        전달되고, 빈 값은 아무것도 추가하지 않습니다. 닫는 따옴표가 빠지면
        그 게임을 실행할 때마다 서버 오류가 났지만, 이제는 고쳐야 할 입력란을
        알려 주는 메시지가 표시됩니다. <code>{disc_paths}</code> 토큰은
        삭제되었습니다. 항상 비어 있었기 때문입니다.</li>
      <li><strong>끝난 실행 기록이 RetroDB를 다시 시작할 때까지 메모리에
        쌓였습니다.</strong> 이제 끝난 지 한 시간이 넘은 실행은 정리됩니다.</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: 설정에서 언어 선택이 다시 작동합니다
  body: |
    <ul>
      <li><strong>설정 &rarr; 라이브러리 &rarr; 표시에서 언어를 골라도
        아무 일도 일어나지 않았습니다.</strong> 대신 오류가 표시되고 페이지는
        이전 언어 그대로였습니다. 3.23.8에서 생긴 문제입니다. 이제 언어를
        선택하면 저장되고 페이지가 그 언어로 다시 열립니다.</li>
    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: 트로피와 플랫폼 아이콘이 다운로드에 다시 포함됩니다
  body: |
    <ul>
      <li><strong>다운로드에 RetroDB의 트로피와 플랫폼 아이콘이 빠져
        있었습니다.</strong> RetroAchievements가 있는 모든 게임 카드에서 배지
        자리에 깨진 그림이 보였고, 트로피 등급과 PSN, Steam, Xbox, RPCS3 로고도
        없었습니다. 이제 모든 다운로드에 포함됩니다.</li>
    </ul>
- version: 3.23.14
  date: '2026-10-10'
  tags:
  - type: security
    label: 공개된 보안 수정을 반영해 포함된 라이브러리 두 개를 업데이트했습니다
  body: |
    <ul>
      <li><strong>urllib3와 Werkzeug에 알려진 보안 문제가 있었습니다.</strong>
        이제 RetroDB는 이를 수정한 버전인 urllib3 2.8.0과 Werkzeug 3.1.9를
        포함합니다. 소스로 설치한 경우 <code>install.py</code>를 다시
        실행하면 반영되며, 이 스크립트는
        <code>requirements.lock</code>에서 설치합니다.</li>
    </ul>
- version: 3.23.13
  date: '2026-09-26'
  tags:
  - type: fix
    label: 폴더 경로로 저장된 미디어가 더 이상 없는 것으로 보고되지 않습니다
  body: |
    <ul>
      <li><strong>독립 실행형 빌드에서 "누락된 미디어 참조 지우기"가 실제로
        있는 미디어를 지울 수 있었습니다.</strong> 데이터베이스가 미디어를
        파일 이름만이 아니라 <code>images/boxart/…</code> 같은 폴더 경로로
        저장한 경우에 발생했습니다. 이제 RetroDB가 올바른 폴더에서 찾습니다.</li>
    </ul>
- version: 3.23.12
  date: '2026-09-26'
  tags:
  - type: fix
    label: 대시보드에 진행 중인 일괄 스크래핑이 표시되며, 작은 수정 네 가지
  body: |
    <ul>
      <li><strong>대시보드의 스크래핑 진행 카드가 나타나지 않았습니다.</strong>
        이제 일괄 스크래핑이 진행되는 동안 표시되며, 일시 중지되면 그렇다고
        알려 줍니다.</li>
      <li><strong>로그인 페이지에서 브라우저 콘솔에 더 이상 오류가 나지
        않습니다.</strong> 아무도 로그인하지 않은 상태에서는 백그라운드 작업을
        확인하지 않습니다.</li>
      <li><strong>설정 마법사가 저장에 실패했는데도 "설정 완료!"라고 하지
        않습니다.</strong> 이제 설정을 저장할 수 없었다고 알려 줍니다.</li>
      <li><strong>같은 초에 시작한 일괄 스크래핑 두 개가 더 이상 같은 ID를
        공유하지 않습니다.</strong> 그래서 취소 같은 대기열 작업이 올바른
        스크래핑에 적용됩니다.</li>
    </ul>
- version: 3.23.11
  date: '2026-09-26'
  tags:
  - type: ui
    label: 후원 버튼이 무엇을 지원하는지 알려 줍니다
  body: |
    <ul>
      <li><strong>더 명확한 후원 문구.</strong> 헤더 버튼이 이제
        "Sponsor RetroDB"와 "Support RetroDB"로 표시됩니다. README에는 모든
        릴리스가 무료이며, 후원금은 RetroDB가 실행할 수 있는 에뮬레이터와
        코어가 아니라 RetroDB 자체에 쓰인다고 적혀 있습니다.</li>
    </ul>
- version: 3.23.10
  date: '2026-09-26'
  tags:
  - type: fix
    label: ROM 도구 페이지가 저장된 설정을 따르며, 로그 페이지와 ROM 도구 페이지가 다시 작동합니다
  body: |
    <ul>
      <li><strong>로그 페이지와 일부 ROM 도구 페이지가 고장 나 있었습니다.</strong>
        해당 페이지의 스크립트가 불러오는 도중 실패해서 로그 뷰어와 공용 ROM
        도구 기능이 시작되지 않았습니다. 이제 제대로 불러옵니다.</li>
      <li><strong>ROM 도구 설정이 이제 실제로 적용됩니다.</strong> 중복 찾기와
        CHD 변환기가 ROM 도구 설정 페이지에서 정한 옵션으로 열리며, 한 번
        실행할 때만 옵션을 바꿀 수도 있습니다.</li>
      <li><strong>CHD 변환기의 스위치가 무시되었습니다.</strong> 저장된 설정이
        삭제하도록 되어 있으면, 페이지에서 "원본 파일 삭제"를 꺼도 삭제가
        멈추지 않았습니다. 이제 페이지의 스위치가 결정합니다.</li>
      <li><strong>임시 경로 설정이 사용됩니다.</strong> M3U 재생 목록을 만드는
        동안 임시로 두는 파일이 이제 그 경로 안에 놓입니다.</li>
    </ul>
- version: 3.23.9
  date: '2026-09-26'
  tags:
  - type: security
    label: 스크래퍼 로그 파일에 더 이상 비밀번호와 토큰이 저장되지 않으며, 로그인 시도 제한이 다시 적용됩니다
  - type: fix
    label: 설정을 저장해도 더 이상 설정이 지워지지 않으며, 사용자 삭제가 작동합니다
  body: |
    <ul>
      <li><strong>로그 파일에 비밀 정보가 그대로 남았습니다.</strong> 스크래퍼
        로그 파일은 로그인 토큰과 API 키를 가리도록 되어 있었지만, 가리는
        단계가 실행되지 않아 전부 그대로 기록되었습니다. 이제는 가려집니다.
        예전 로그 파일에는 아직 남아 있으니, 설치본을 공유한다면
        <code>logs/</code>의 오래된 파일을 삭제하세요.</li>
      <li><strong>로그인 시도 제한이 적용되지 않았습니다.</strong> 반복된
        로그인과 무거운 작업(스캔, 스크래핑, 가져오기)에 대한 제한이 설정은
        되어 있었지만 켜지지 않았습니다. 이제 작동하며, 차단된 요청에는 "요청이
        너무 많습니다"라는 분명한 메시지가 표시됩니다.</li>
      <li><strong>손상된 설정 파일이 지워질 수 있었습니다.</strong>
        <code>data/settings.json</code>을 읽을 수 없으면 다음 저장 때 기본값으로
        덮어썼습니다. 이제 RetroDB는 저장하기 전에 손상된 파일을
        <code>settings.json.corrupt-&lt;time&gt;</code>으로 보관합니다. 파일을
        다시 정상적으로 읽을 수 있게 되면 그때는 저장을 거부합니다.</li>
      <li><strong>엔진 이름 규칙 줄이 다른 설정을 잃어버렸습니다.</strong>
        이름 규칙 설정의 엔진 줄에 태그를 추가하면 실패했고, 함께 저장된 관사와
        지역 설정까지 버려졌습니다. 이제 제대로 저장됩니다.</li>
      <li><strong>사용자 삭제가 실패했습니다.</strong> 태그, 목록, 위시리스트
        항목 또는 PSN 데이터가 있는 사용자는 삭제할 수 없었습니다. 이제 삭제하면
        사용자와 그 사용자의 모든 데이터가 함께 제거됩니다.</li>
      <li><strong>스크래핑 두 개가 동시에 실행될 수 있었습니다.</strong>
        대기열에서 진행 중인 일괄 스크래핑의 순서를 바꾸거나 옮기면, 하나의
        진행 횟수를 공유하는 스크래핑 두 개가 시작되었습니다. 이제 하나만
        실행됩니다.</li>
      <li><strong>일괄 스크래핑 진행 상황이 오류처럼 보일 수 있었습니다.</strong>
        첫 번째 성공 전까지 일괄 스크래핑이 상태를 보고하는 방식을 일부 화면이
        실패로 읽었습니다. 이 문제가 수정되었습니다.</li>
      <li><strong>로그인하면 이제 원래 요청한 페이지로 돌아갑니다.</strong>
        예전에는 항상 대시보드로 이동했습니다.</li>
      <li><strong>관리자 파일 작업이 내 폴더 안에서만 이루어집니다.</strong>
        이미지 크기 조정 도구와 ROM 이름 변경 작업은 이제 미디어 폴더나 ROM
        폴더 밖의 대상은 거부합니다.</li>
      <li><strong>예전 PSN 및 Xbox 로그인 파일이 계정으로 옮겨집니다.</strong>
        남아 있는 <code>data/psn_tokens.json</code> 또는
        <code>data/xbox_tokens.json</code>은 계정으로 불러온 뒤 이름 끝에
        <code>.migrated-015</code>가 붙습니다. 그 파일에는 여전히 토큰이 들어
        있으니, 로그인이 잘 되는지 확인한 다음 삭제하세요.</li>
      <li><strong>서버 오류 메시지가 더 명확해졌습니다.</strong> 잘못된 요청에는
        이제 "An internal error occurred" 대신 제대로 된 오류 메시지로
        응답합니다.</li>
    </ul>
- version: 3.23.8
  date: '2026-09-25'
  tags:
  - type: fix
    label: CLZ 가져오기가 다시 작동하고, 목록 표지가 표시되며, 여러 페이지가 아포스트로피 때문에 고장 나지 않습니다
  - type: security
    label: 스크래핑한 이름과 파일 경로가 더 이상 페이지 버튼 밖으로 빠져나갈 수 없습니다
  body: |
    <ul>
      <li><strong>CLZ 가져오기가 아무 일도 하지 않았습니다.</strong> CLZ PDF를
        올리면 서버에 없는 주소로 보내져서, 모든 업로드가 "Parse failed"로
        실패했습니다. 이제 분석기에 제대로 전달됩니다.</li>
      <li><strong>목록 페이지의 표지가 모두 보이지 않았습니다.</strong> 목록
        페이지가 각 표지를 잘못된 주소로 요청했고, 시스템 열은 항상 비어
        있었습니다. 이제 둘 다 표시됩니다. 페이지의 "게임 추가" 검색에 나오는
        표지 그림도 고쳐졌습니다.</li>
      <li><strong>아포스트로피가 들어간 이름에서 버튼이 고장 났습니다.</strong>
        목록에서 "Assassin's Creed"를 제거하거나, 스크린샷을 삭제하거나, 표지를
        확대하거나, 장르 태그를 제거할 때 이름에 아포스트로피가 있으면 아무
        표시 없이 아무 일도 일어나지 않을 수 있었습니다. 같은 결함 때문에
        조작된 스크래핑 이름이 페이지에서 코드를 실행할 수도 있었습니다. 이제
        이름이 코드로 잘못 읽힐 수 없는 방식으로 버튼에 전달됩니다.</li>
      <li><strong>이미지와 링크 주소가 모든 곳에서 이스케이프됩니다.</strong>
        몇몇 페이지가 스크래핑한 파일 이름으로 그림 주소를 만들면서 이스케이프하지
        않았고, 다섯 페이지는 이스케이프 도우미의 더 약한 자체 사본을 쓰고
        있었습니다. 이제 모두 공용 도우미를 사용합니다.</li>
      <li><strong>설정 페이지가 빈 화면으로 열릴 수 있었습니다.</strong>
        마지막으로 사용한 탭의 이름이 업데이트로 바뀌었다면, 설정이 아무 패널도
        보이지 않은 채 열렸습니다. 이제 더 이상 없는 탭은 무시합니다.
        <code>/settings#account</code> 같은 링크도 다시 해당 탭을 엽니다.</li>
      <li><strong>테마가 이제 다른 기기에서도 따라옵니다.</strong> 선택한 테마는
        계정에 저장됩니다. 테마를 한 번도 지정받은 적 없는 브라우저는 기본값
        대신 저장된 테마를 사용합니다.</li>
      <li><strong>작업 진행 팝업에 올바른 아이콘이 표시됩니다.</strong> 일시
        중지됨, 완료됨, 대기 중인 작업이 모두 같은 "실행 중" 아이콘을
        보였습니다. 이제 테마마다 상태별로 고유한 아이콘이 있습니다.</li>
      <li><strong>키보드 단축키 목록을 이제 번역할 수 있습니다.</strong> 그
        라벨들이 번역 도구에 보이지 않아서, 모든 언어에서 영어로
        남아 있었습니다.</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: 연령 등급이 자주 틀렸고, 스크래핑한 게임이 세부 정보를 잃을 수 있었습니다
  body: |
    <ul>
      <li><strong>연령 등급이 자주 틀렸고, 그 실수가 퍼져 나갔습니다.</strong>
        등급이 TheGamesDB에서 왔을 때 앱이 등급 코드를 제대로 읽지 않고 글 안의
        아무 곳에서나 찾았습니다 &mdash; 그래서
        "T - Teen", "M - Mature 17+", "AO - Adults Only 18+",
        "RP - Rating Pending"이 모두 잘못된 등급으로 저장되었고, 성인용 게임이
        전체 이용가로 분류될 수도 있었습니다. 더 나쁜 것은, 그 잘못된 등급이
        나머지 여덟 가지 등급 체계를 채우는 데 쓰여서 한 번의 잘못된 읽기가
        전체로 퍼졌다는 점입니다. 이제 등급은 글 맨 앞의 코드에서 읽습니다.</li>
      <li><strong>변환된 등급이 너무 관대하게 나왔습니다.</strong> 이미 있는
        등급으로 빠진 등급을 채울 때, 앱이 처음에 가지고 있던 등급이 아니라
        조금 전에 계산해 낸 등급을 쓸 수 있었습니다. 변환을 거칠 때마다 엄격함이
        조금씩 줄었습니다. 이제는 항상 게임이 실제로 가진 등급에서
        변환합니다.</li>
      <li><strong>전체 재스크랩이 직접 고른 지역과 저장 방식을 지웠습니다.</strong>
        둘 다 스크래퍼에서 오는 값이 아닙니다 &mdash; 앱이 직접 계산합니다
        &mdash; 그래서 전체 재스크랩을 하면 직접 정한 "Japan"이 기본값 "USA"로
        바뀌었습니다. 이제 출처가 실제로 새 값을 제공하지 않는 한 사용자의 값이
        유지됩니다.</li>
      <li><strong>스크래퍼가 엉뚱한 게임을 받아들일 수 있었습니다.</strong>
        ScreenScraper 결과는 보통 사용하기 전에 일치 점수로 확인하지만, 검색
        결과가 정확히 하나일 때는 이 확인을 완전히 건너뛰었습니다. 이제 모든
        결과에 점수를 매깁니다.</li>
      <li><strong>필드 하나가 빠져서 게임의 스크래핑 세부 정보가 모두 사라질 수
        있었습니다.</strong> IGDB나 ScreenScraper가 필드 하나를 예상치 못한
        방식으로 비워 두면, 업데이트 전체가 버려졌습니다 &mdash; 퍼블리셔,
        개발사, 아트워크까지 전부. 이제 이런 경우를 처리하며 나머지 세부 정보는
        유지됩니다.</li>
      <li><strong>실패한 이미지가 성공으로 기록될 수 있었습니다.</strong>
        다운로드한 그림이 쓸 수 있는 이미지가 아닌 것으로 밝혀져도 앱은 아무것도
        삭제하지 않고 파일 이름을 저장해서, 깨진 참조가 남았습니다. 이제 파일을
        삭제하고 필드는 그대로 둡니다.</li>
      <li><strong>게임 모드가 이제 일관된 표현을 씁니다.</strong> 스크래퍼마다
        "Single-player"와 "Single-Player", 그리고 앱의 라벨에 없는
        "Multiplayer"를 따로 써서, 그런 게임은 번역되지 않거나 모드 필터에
        걸리지 않았습니다. 이제 모든 출처가 같은 라벨을 씁니다. 기존 게임은
        다시 스크래핑하거나 설정의 정규화 도구를 실행할 때까지 예전 표현을
        유지합니다.</li>
      <li><strong>Xbox 조회가 이제 다른 출처와 똑같이 동작합니다.</strong>
        자체적으로 웹 요청을 보내고 있어서, Xbox Live가 속도를 늦추라고 할 때
        재시도하지 않았고, 응답으로 받아들이는 데이터 양에도 제한이 없었습니다.
        이제 다른 스크래퍼와 같은 공용 연결을 사용합니다.</li>
      <li><strong>쓰이지 않는 ScreenScraper 코드를 제거했습니다.</strong> 앱
        어디에서도 호출하지 않던 함수 두 개를 삭제했습니다. 그중 하나는
        ScreenScraper 비밀번호가 그대로 들어 있는 웹 주소를 돌려주어, 그것을
        사용하는 모든 것에 비밀번호를 넘겨줄 수 있었습니다. 3.6.x 릴리스
        노트에 나온 "System Media Endpoint"가 바로 그중 하나였습니다 &mdash;
        앱 어디에서도 접근할 수 없었습니다.</li>
    </ul>
- version: 3.23.5
  date: '2026-09-02'
  tags:
  - type: fix
    label: 패키지 다운로드가 시작되지 않던 문제와 기타 빌드 수정
  body: |
    <ul>
      <li><strong>독립 실행형 다운로드가 아예 시작되지 않았습니다.</strong>
        패키지 빌드에는 자체 Python이 들어 있지만, 그 안의 실행기는 소스
        설치용으로 만든 것이었습니다 &mdash; 패키지 빌드에는 없는 Python 파일을
        찾다가 첫 줄에서 멈췄습니다. 이제 번들에 전용 실행기가 들어 있어, 앱을
        실행하고 서버가 준비되면 브라우저를 엽니다.</li>
      <li><strong>Linux 다운로드의 바탕 화면 바로 가기가 아무것도 실행하지
        않았습니다.</strong> 앱 경로가 들어가야 할 자리에 임시 문구가 들어간 채로
        배포되었습니다. 이제 실행기 옆에 <code>install-launcher.sh</code>가
        있습니다 &mdash; 한 번 실행하면 압축을 푼 위치의 실제 경로로 바로 가기가
        만들어집니다.</li>
      <li><strong>소스에서 시작할 때 검증되지 않은 의존성을
        설치했습니다.</strong> Flask가 없으면 시작 스크립트가 체크섬 확인 없이
        인터넷에서 바로 패키지를 받았고, 그 과정에서 시스템 패키지 관리자를
        무시했습니다. 이제는 체크섬이 들어 있는 잠금 파일을 사용하는
        <code>install.py</code>에 맡깁니다.</li>
      <li><strong>소스 다운로드에 들어가면 안 되는 관리자용 파일이
        포함되었습니다.</strong> 제외할 항목 목록을 손으로 관리하다 보니 뒤처져서,
        감사 결과물과 남은 빌드 폴더가 앱과 함께 묶이고 있었습니다. 이제
        다운로드는 프로젝트에 실제로 있는 파일 목록으로 만들어지므로 어긋날 수
        없습니다.</li>
      <li><strong>패키지 빌드에서 설정 패널 두 개가 고장 났습니다.</strong>
        라이브러리 통계 패널과 API 상태 패널이 패키지 빌드 안에서는 쓰이지 않는
        이름으로 메인 프로그램을 찾아서, 둘 다 실패했습니다.</li>
      <li><strong>일부 화면 문구는 번역될 수 없었습니다.</strong> 앱에서 새로
        생긴 세 부분 &mdash; 에뮬레이터 설정, 실행 버튼, "지금 플레이 중" 막대
        &mdash; 이 번역 검사에서 빠졌고, 이를 잡아내야 할 검사도 똑같이 불완전한
        목록을 보고 있었습니다. 이제 검사가 모든 파일을 자동으로 포함하며, 해당
        문구도 번역에 추가되었습니다.</li>
      <li><strong>번역을 다시 만들어도 조용히 아무 일도 하지 않을 수
        있었습니다.</strong> 특정 페이지용 스크립트에 문구를 추가해도 다시 만들기
        과정은 할 일이 없다고 판단해서, 새 문구가 번역 파일에 전혀 들어가지
        않았습니다.</li>
      <li><strong>그래픽 카드용 우회 설정이 모든 사람에게 적용되었습니다.</strong>
        Linux 시작 스크립트가 특정 AMD 카드 하나를 위한 설정을 모든 컴퓨터에
        강제로 적용해서, 다른 AMD 하드웨어에서는 이미지 업스케일러가 멈출 수
        있었습니다. 이제 그 카드가 실제로 있을 때만 적용되며, 직접 정한 값은
        절대 덮어쓰지 않습니다.</li>
      <li><strong>릴리스 스크립트가 잘못된 버전을 게시할 수 있었습니다.</strong>
        이전 시도에서 남은 태그를 아무 말 없이 다시 사용해서, 성공했다고 보고하면서
        실제로는 더 오래된 스냅샷으로 빌드할 수 있었습니다.</li>
    </ul>
- version: 3.23.4
  date: '2026-09-02'
  tags:
  - type: fix
    label: 라이브러리 데이터를 잃을 수 있던 아홉 가지 경로를 막았습니다
  body: |
    <ul>
      <li><strong>"스크래핑 데이터 지우기"가 라이브러리 전체를 지웠습니다.</strong>
        확인 상자는 실제로 스크래핑된 게임만 세었지만, 작업은 상관없이 모든
        게임을 지웠습니다 &mdash; 그래서 열두 개라고 해 놓고 수천 개를 지울 수
        있었습니다. 이미지 옵션을 켜면 직접 올린 표지 그림까지 삭제하고, 직접
        고친 제목도 되돌렸습니다. 한 번도 스크래핑하지 않은 게임에서도요. 이제
        상자에 적힌 그대로만 작동합니다.</li>
      <li><strong>3D 박스 아트가 깨진 링크를 남겼습니다.</strong> 이미지와 함께
        지우면 디스크에서 3D 표지는 삭제했지만 데이터베이스는 계속 그것을 가리켜서,
        앱이 이미 없는 파일을 찾으러 갔습니다.</li>
      <li><strong>대량 편집의 "추가" 스위치가 추가하는 대신 바꿔
        버렸습니다.</strong> 시점과 차원에서는 라벨과 정반대로 작동해서, 선택한 모든
        게임의 기존 값을 한꺼번에 덮어썼고 되돌릴 수도 없었습니다.</li>
      <li><strong>독립 실행형 빌드에서 클릭 한 번으로 모든 이미지 참조가 지워질
        수 있었습니다.</strong> 패키지 다운로드에서 앱이 미디어를 엉뚱한 곳에서
        찾아 모든 이미지가 없다고 판단했고, 그러면 "누락된 미디어 참조 지우기"가
        라이브러리 전체의 아트, 스크린샷, 동영상, 설명서 항목을 비웠습니다.
        바로 이런 경우를 잡으려고 있는 안전 검사도 이를 알아채지 못했습니다.
        패키지 빌드만 영향을 받았습니다.</li>
      <li><strong>고아 파일 정리가 막 도착한 아트를 삭제할 수 있었습니다.</strong>
        정리가 진행되는 동안 내려받은 표지가 고아 파일로 취급되어 제거될 수
        있었습니다.</li>
      <li><strong>재생 목록을 만들 때 묻지도 않고 압축 파일을 옮겼습니다.</strong>
        M3U 재생 목록을 일괄로 만들면 그 옵션을 꺼 두었어도 원본 압축 파일을
        다른 곳으로 옮겼습니다 &mdash; 그리고 옵션을 켰을 때는 성공한 이동을
        실패로 보고했습니다.</li>
      <li><strong>이미지 크기 조정 도구가 미디어 폴더를 부풀리고
        있었습니다.</strong> 스스로 만든 작은 썸네일을 확대할 새 이미지로 취급해서,
        원래 크기로 키운 다음 그것의 썸네일을 또 만들었습니다. 실행할 때마다 파일이
        늘어났고, 페이지는 썸네일 자리에 원래 크기 이미지를 조용히 보여 주었으며,
        AI 업스케일러는 의도한 것보다 약 세 배 많은 파일을 처리했습니다.</li>
      <li><strong>AI 채우기가 직접 고친 세부 정보를 덮어썼습니다.</strong> 일반
        스크래핑 중에 직접 입력한 퍼블리셔, 개발사, 장르, 연령 등급 등을 바꿀 수
        있었습니다. 이제는 빈칸만 채웁니다. 직접 누르는 AI 채우기 버튼은
        그대로입니다.</li>
      <li><strong>반복 스크래핑이 멀쩡한 스크린샷을 삭제할 수 있었습니다.</strong>
        RAWG에서 스크래핑한 게임은 같은 파일 이름을 다시 써서, 두 번째 스크래핑이
        저장된 스크린샷을 덮어쓴 다음, 라이브러리에는 아직 남아 있는데도 중복으로
        보고 제거했습니다.</li>
    </ul>
- version: 3.23.3
  date: '2026-09-01'
  tags:
  - type: fix
    label: 가족 구성원 역할이 이제 설명 그대로 작동하며, 비활성화된 계정은 확실히 잠깁니다
  body: |
    <ul>
      <li><strong>계정을 비활성화하면 이제 세션이 끝납니다.</strong> 계정을 끄면
        모든 화면에서 숨겨졌지만, 이미 그 계정으로 로그인한 사람은 최대 일주일
        동안 평소처럼 계속 쓸 수 있었습니다. 삭제하지 않고 누군가를 막는 방법은
        비활성화뿐이므로, 이제 그 사람이 다음에 클릭하는 순간 바로 적용됩니다.</li>
      <li><strong>읽기 전용 계정은 더 이상 게임 데이터를 바꿀 수 없습니다.</strong>
        "How Long to Beat" 작업 세 가지가 보기만 가능한 계정을 포함해 로그인한
        모든 사람에게 열려 있었습니다. 그래서 읽기 전용 계정이 플레이 시간을
        덮어쓰거나 라이브러리의 모든 게임에서 지울 수 있었습니다. 이제 게임을
        바꾸는 다른 모든 작업처럼 편집 권한이 필요합니다.</li>
      <li><strong>트로피 추적기가 다시 모든 사람에게 작동합니다.</strong> 내
        수집가 트로피를 새로고침하려면 편집자 권한이 필요했는데, 플레이어와
        뷰어 역할에는 그 권한이 없습니다. 게다가 그 트로피를 기록하는 것은
        새로고침뿐입니다. 그래서 이런 계정은 트로피를 하나도 얻을 수 없었고,
        새로고침 버튼은 오류만 보여 주었습니다. 내 진행 상황이므로 이제 특별한
        권한이 전혀 필요 없습니다.</li>
      <li><strong>한 사람의 PlayStation 새로고침을 더 이상 다른 사람이 멈출 수
        없습니다.</strong> 로그인한 계정이라면 누구나 다른 사람이 시작한
        새로고침을 일시 중지하거나 취소할 수 있었고, 그 사람이 어떤 게임을
        처리 중인지도 볼 수 있었습니다. 이제 둘 다 새로고침을 시작한 사람만
        할 수 있습니다.</li>
      <li><strong>Steam 가져오기가 먼저 저장한 다른 사람의 계정이 아니라 내 계정을
        사용합니다.</strong> 라이브러리 가져오기가 내 Steam 자격 증명 대신 공용
        사본 하나를 읽어서, 다른 사람의 라이브러리를 가져올 수 있었습니다.
        그동안 내가 저장한 정보는 없는 것처럼 보였습니다.</li>
      <li><strong>관리자 비밀번호를 추측하기가 다시 어려워졌습니다.</strong>
        로그인 실패 횟수 제한이 네트워크의 모든 사람에게 공유되어서, 자기 계정이
        있는 사람은 로그인해서 제한을 초기화하고 끝없이 추측을 계속할 수
        있었습니다. 이제 제한은 계정별로 적용됩니다.</li>
      <li><strong>앱의 오류가 사라지지 않고 이제 페이지에 표시됩니다.
        </strong> 작업이 거부되었을 때 그중 115개는 페이지가 읽을 수 없는
        형식으로 응답해서, 작업이 성공한 것처럼 보였습니다. 이제 거부를 제대로
        보고하므로 실제 메시지를 볼 수 있습니다.</li>
    </ul>
- version: 3.23.2
  date: '2026-08-06'
  tags:
  - type: fix
    label: 스크래퍼 설정 페이지가 더 빨리 열리고 오래된 API 키를 보여 주지 않습니다
  body: |
    <ul>
      <li><strong>설정 페이지와 스크래퍼 구성 페이지가 요청마다 스크래퍼 설정
        파일을 다시 읽지 않습니다.</strong> 공용 캐시 리더가 이미 있었는데도,
        네 곳에서 페이지나 확인이 실행될 때마다 디스크에서 파일을 열어 다시
        분석하고 있었습니다. 이제 모두 그 리더를 사용하므로, 페이지를 열 때마다
        하는 작업이 줄었습니다.</li>
      <li><strong>저장하면 여전히 바로 적용됩니다.</strong> 시간이 지나야 비워지는
        캐시였다면 저장한 뒤 최대 30초 동안 예전 값을 보여 줄 수 있었습니다.
        이제 저장할 때마다 캐시를 비우므로, 보이는 값이 방금 저장한 값입니다.</li>
      <li><strong>실제 API 키가 더 이상 가려진 표시 값으로 바뀔 수
        없습니다.</strong> 설정 페이지는 저장된 키를 실제 값이 아니라
        <code>***1234</code>처럼 보여 줍니다. 페이지가 스크래퍼와 같은 설정
        사본을 받았기 때문에, 그 가리기 처리가 메모리에 있는 진짜 키를 덮어써서
        캐시가 만료될 때까지 스크래퍼가 별표로 로그인하게 만들 수 있었습니다.</li>
      <li><strong>독립 실행형 빌드가 이제 올바른 위치에서 스크래퍼 설정을
        찾습니다.</strong> 스크래퍼는 설정 파일의 위치를 그 파일을 저장하는
        페이지와 다른 방식으로 계산했습니다. 일반 설치에서는 둘 다 같은 파일을
        가리켰지만, 독립 실행형(더블 클릭) 빌드에서는 그렇지 않아서, 저장한 API
        키가 스크래퍼가 찾지 않는 곳에 들어갈 수 있었습니다.</li>
    </ul>
- version: 3.23.1
  date: '2026-08-06'
  tags:
  - type: fix
    label: 설정에서 저장한 서버 포트가 이제 실제로 사용됩니다
  body: |
    <ul>
      <li><strong>서버 포트를 저장하면 실제로 서버가 그 포트로 옮겨 갑니다.</strong>
        설정은 포트를 받아서 확인하고 저장한 뒤, 적용하려면 다시 시작해야 한다고
        알려 주었습니다 &mdash; 그런데 서버는 결국 5000번 포트로 시작했습니다.
        아무것도 그 값을 다시 읽지 않았기 때문입니다. 이제 그 값이 시작 과정에
        포함되어, 다시 시작하면 RetroDB가 정말로 선택한 포트로 옮겨 갑니다.
        환경에 설정된 값이 여전히 우선하므로, 포트를 지정하는 실행기나 컨테이너는
        영향을 받지 않습니다.</li>
      <li><strong>아무 일도 하지 않던 설정 두 개는 고치는 대신
        제거했습니다.</strong> "서버 호스트"와 "디버그 모드"는 저장은 되었지만
        똑같이 거짓 약속을 했습니다. 웹 양식에서 디버그 모드를 켜면 브라우저에
        대화형 Python 콘솔이 노출되었을 것이고, 바인드 주소는 어떤 컴퓨터가
        RetroDB에 접속할 수 있는지를 정합니다 &mdash; 둘 다 설정 양식에 있으면
        안 되는 것입니다. 둘 다 원래 있던 환경 변수로 계속 설정할 수 있습니다.
        설정 파일에 아직 남아 있다면 불러올 때 조용히 무시되니, 따로 할 일은
        없습니다.</li>
      <li><strong>이제 다시 시작해서 적용되는 설정만 다시 시작하면 적용된다고
        안내합니다.</strong> 이것이 진짜 결함이었습니다 &mdash; 쓸모없는 설정은
        지저분할 뿐이지만, 거짓 약속은 오후 한나절을 낭비하게 만듭니다.</li>
    </ul>
- version: 3.23.0
  date: '2026-08-06'
  tags:
  - type: enhancement
    label: 다른 도구가 정한 포트로 RetroDB 시작하기
  body: |
    <ul>
      <li><strong>RetroDB가 이제 환경에서 <code>PORT</code> 설정을
        읽습니다.</strong> 다른 도구 &mdash; 대시보드, 컨테이너, 홈 서버 패널
        &mdash; 에서 RetroDB를 실행한다면, 이제 그 도구가 누구도 파일을 고치지
        않고 원하는 포트를 RetroDB에 넘겨줄 수 있습니다.
        <code>PORT</code>를 설정하면 RetroDB가 그 포트를 사용하고, 설정하지
        않으면 아무것도 바뀌지 않습니다. 기존 <code>RETRODB_PORT</code>도
        예전과 똑같이 작동하며, 둘 다 설정되어 있으면 <code>PORT</code>가
        우선합니다.</li>
      <li><strong>잘못된 포트 번호는 이제 추측하지 않고 그렇다고 알려
        줍니다.</strong> 예전에는 읽을 수 없는 포트를 넣으면 Python 오류 문구가
        잔뜩 나왔고, 사용할 수 없는 범위의 포트는 서버가 시작에 실패하고 나서야
        드러났습니다. 이제 RetroDB는 사용할 수 없는 값을 한 줄로 알려 주고 바로
        멈춥니다. 요청받은 포트와 다른 포트로 조용히 시작하는 일은 절대 없습니다
        &mdash; 말없이 옮겨지는 것보다 안 된다고 듣는 편이 낫기 때문입니다.</li>
      <li><strong>시작 배너와 브라우저 탭이 실제 포트를 따릅니다.</strong>
        RetroDB가 시작할 때 출력하는 주소와 자동으로 여는 페이지가, 실제로 어떤
        포트를 쓰든 예전에는 항상 5000을 표시했습니다.</li>
    </ul>
- version: 3.22.1
  date: '2026-07-31'
  tags:
  - type: fix
    label: 데이터베이스 작업 파일이 무한정 커지지 않도록 수정
  body: |
    <ul>
      <li><strong>데이터베이스 저널에 다시 상한이 생겼습니다.</strong> SQLite는 라이브러리 데이터베이스 옆에 작업 파일(<code>-wal</code> 파일)을 유지합니다. RetroDB는 이를 64&nbsp;MB로 제한하려 했지만, 그 제한은 백그라운드 작업에만 적용되고 있었습니다 &mdash; 일반적인 페이지 로드와 편집에는 제한이 전혀 없었습니다. 유난히 큰 쓰기가 한 번 일어나면 작업 파일은 최대 크기 그대로 남아, 때로는 데이터베이스 자체보다 커지기도 했습니다. 이제 어디서나 제한이 적용되어 공간이 반환됩니다.</li>
    </ul>
- version: 3.22.0
  date: '2026-07-05'
  tags:
  - type: enhancement
    label: 팝업에서 바로 게임 스크래핑 — 추가 단계 없이
  body: |
    <ul>
      <li><strong>게임 팝업에서 스크래핑.</strong> 빠른 게임 팝업(라이브러리에서
        게임을 클릭하면 나타나는 것)에 이제 AI 채우기와 편집 옆에
        <strong>스크래핑</strong> 버튼이 있습니다. 클릭하면 RetroDB가 메타데이터
        검색이 이미 열린 상태로 해당 게임으로 바로 이동합니다 &mdash; 더 이상 전체
        페이지를 열어 스크래핑 버튼을 먼저 찾을 필요가 없습니다.</li>
    </ul>
- version: 3.21.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: 원클릭 실행 — 고정된 아이콘으로 RetroDB 시작, 터미널 불필요
  - type: feature
    label: 진짜 앱 아이콘 — 브라우저 탭과 작업 표시줄의 네온 게임패드
  - type: feature
    label: 설정 페이지에 새로운 서버 종료 버튼
  body: |
    <ul>
      <li><strong>클릭 한 번으로 실행.</strong> 이제 RetroDB에는 작업 표시줄에
        고정할 수 있는 제대로 된 실행기가 있습니다 &mdash; 클릭하면 앱이 시작되고
        (아직 실행 중이 아니라면) 자동으로 브라우저에서 열립니다. 더 이상 터미널을
        열어 명령어를 입력할 필요가 없습니다. Linux에서는
        <code>python3 scripts/install_launcher.py</code>를 한 번 실행하여
        앱 메뉴에 &ldquo;RetroDB&rdquo;를 추가한 다음 고정하세요.</li>
      <li><strong>진짜 앱 아이콘.</strong> 이제 RetroDB는 네온 게임패드 아이콘을
        갖췄습니다 &mdash; 어두운 타일 위의 사이버펑크 시안과 마젠타 &mdash;
        브라우저 탭(파비콘), 작업 표시줄 실행기, 그리고 Windows 프로그램 자체에
        표시됩니다. 밋밋한 이모지 자리표시자를 대체합니다.</li>
      <li><strong>서버 종료 버튼.</strong> 설정 페이지의 서버 제어에 이제 다시 시작
        옆에 빨간색 <strong>서버 종료</strong> 버튼이 있습니다. 앱을 깔끔하게
        중지합니다(실행 중인 작업이 먼저 저장을 마치도록 함). 따라서 더 이상
        터미널로 전환하여 Ctrl+C를 누를 필요가 없습니다.</li>
      <li><strong>다운로드 빌드가 브라우저를 대신 열어 줍니다.</strong> 바로 실행할
        수 있는 Windows, Mac, Linux 다운로드는 이제 시작 직후 브라우저를 열어
        주므로, 추가 단계 없이 앱이 눈앞에 나타납니다.</li>
    </ul>
- version: 3.20.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: 새로운 11개 언어 추가 — RetroDB, 이제 21개 언어를 지원합니다
  - type: fix
    label: '게임 목록을 떠날 때 나던 무해한 콘솔 오류 수정'
  body: |
    <ul>
      <li><strong>11개의 새로운 언어 팩이 추가되었습니다.</strong> RetroDB의
        인터페이스, 릴리스 노트, 도움말 매뉴얼이 이제
        <strong>Afrikaans, isiZulu, isiXhosa, Dutch, Norwegian(Bokmål),
        Russian, Polish, Turkish, Ukrainian, Indonesian, Hebrew</strong>로
        번역되었습니다 &mdash; 기존의 German, Spanish, French, Italian,
        Japanese, Korean, Brazilian Portuguese, Simplified &amp; Traditional
        Chinese에 합류합니다. 설정 &rarr; 표시 환경설정 &rarr; 언어에서
        원하는 언어를 선택하세요. 선택한 언어로 앱이 다시 불러와집니다.</li>
      <li>각 언어는 앱 전체를 다룹니다: 모든 버튼, 라벨, 메시지, 릴리스
        노트 전체 이력, 그리고 도움말 가이드 전체가 대상입니다.</li>
      <li><strong>isiZulu &amp; isiXhosa</strong>도 포함되어 있습니다.
        기존 소프트웨어 용어가 아직 적은 언어이므로, 자연스러운 번역어가
        없는 경우 일반적인 기술 용어(ROM, scraper, box art)는 영어 그대로
        남겨두었습니다 &mdash; 원어민의 교정을 환영합니다.</li>
      <li><strong>Hebrew</strong>는 번역된 텍스트가 완성되어 있지만,
        오른쪽에서 왼쪽으로 읽는 레이아웃(인터페이스가 올바르게
        반전되는 것)의 다듬는 작업은 이후 업데이트에서 제공될 예정입니다.
        Arabic은 그 레이아웃 작업이 끝나는 대로 뒤따를 예정입니다.</li>
      <li><strong>버그 수정:</strong> 라이브러리나 시스템의 게임 목록을 떠날 때 브라우저 콘솔에 무해한 &ldquo;ReferenceError&rdquo;가 더 이상 기록되지 않습니다(이전 정리 작업의 흔적). 눈에 보이는 변화는 없으며 콘솔만 깔끔해집니다.</li>
    </ul>
- version: 3.19.1
  date: '2026-07-05'
  tags:
  - type: performance
    label: 더 빨라진 스크래핑 — 한 게임의 스크린샷을 이제 동시에 내려받습니다
  body: |
    <ul>
      <li><strong>스크린샷을 동시에 내려받습니다.</strong> 인기 프론트엔드인
        ES-DE(게임의 모든 미디어를 한꺼번에 가져오는 방식)와 같은 접근을 따라,
        이제 RetroDB는 모든 소스(TheGamesDB, IGDB, RAWG, ScreenScraper)에서
        게임의 스크린샷을 하나씩 순서대로가 아니라
        <strong>동시에</strong> 내려받습니다. 스크린샷이 여러 장인 게임은
        눈에 띄게 더 빨리 끝납니다.</li>
      <li>중복 스크린샷 검사는 그다음에 여전히 순서대로 실행되므로, 사진
        중복 제거의 정확도는 이전과 정확히 동일하게 유지됩니다 &mdash;
        빨라진 것은 내려받기뿐입니다. 한 소스에 과부하가 걸리지 않도록
        동시 내려받기는 최대 네 개로 제한됩니다.</li>
      <li>내부적인 속도 개선이며, 다음 재시작 후에 적용됩니다.</li>
    </ul>
- version: 3.19.0
  date: '2026-07-05'
  tags:
  - type: performance
    label: 더 빨라진 스크래핑 — 이제 여러 소스에 동시에 조회합니다
  body: |
    <ul>
      <li><strong>게임 하나당 스크래핑이 더 빨라집니다.</strong> RetroDB가
        게임을 조회할 때는 여러 데이터베이스(ES-DE, TheGamesDB, IGDB, RAWG,
        ScreenScraper)를 확인합니다. 이전에는 <em>한 번에 하나씩</em> 물어보고
        각 응답을 기다린 뒤에야 다음으로 넘어갔기 때문에 &mdash; 대기 시간이
        모든 소스를 합한 만큼이었습니다. 이제는 모두에게 <strong>한꺼번에</strong>
        물어보고 가장 느린 하나만 기다리므로, 모든 게임에서 눈에 띄게
        빨라집니다. 결과의 순서와 점수 산정 방식은 이전과 정확히 동일합니다.</li>
      <li><strong>아트워크를 내려받을 때 낭비되는 연결 과정이 줄었습니다.</strong>
        이미지 내려받기는 이제 사진마다 새 연결을 여는 대신 이미 열린 연결을
        재사용하므로, 스크린샷이 많은 게임에서 시간을 아껴 줍니다.</li>
      <li>이것들은 내부적인 속도 개선이며 &mdash; RetroDB 사용 방식은 전혀
        바뀌지 않고, 데이터베이스에 부담을 더 주지도 않습니다(요청은 같고,
        겹쳐서 처리할 뿐입니다). 다음 재시작 후에 적용됩니다.</li>
    </ul>
- version: 3.18.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: 9번째 등급 체계로 중국(중국 본토) 연령 등급을 추가했습니다
  body: |
    <ul>
      <li><strong>새로운 연령 등급 체계: 중국(CADPA).</strong> 이제 RetroDB는
        기존 여덟 개 기관(ESRB, PEGI, CERO, USK, ACB, FPB, GRAC, ClassInd)에
        더해, CADPA가 발행하는 중국의 공식 게임 연령 안내 제도
        (&ldquo;网络游戏适龄提示&rdquo;)를 지원합니다. <strong>8+</strong>,
        <strong>12+</strong>, <strong>16+</strong>의 세 단계로 나뉘며
        &mdash; 간단한 초록색 배지로 표시됩니다.</li>
      <li><strong>다른 등급들처럼 자동으로 채워집니다.</strong> 게임에 이미 다른
        나라의 등급이 있으면 RetroDB가 그에 맞는 중국 단계를 자동으로 계산합니다
        (반대의 경우도 마찬가지입니다). 게임의 편집 화면에서 직접 고르거나 바꿀
        수도 있고, 설정 &rarr; 라이브러리에서 기본 표시 체계로 선택할 수도
        있습니다. 참고로, 대부분의 서구 게임 데이터베이스는 중국 등급을 제공하지
        않으므로, 어디에도 등급이 없는 게임은 스크래핑 / AI Fill 과정에서 게임
        내용을 바탕으로 채워집니다.</li>
      <li>초록색 배지는 CADPA의 공식 로고가 아니라 RetroDB가 자체 제작한 간단한
        아트워크(다른 기관들과 같은 집안 스타일)이므로, 이미지 라이선스 관련
        제약이 전혀 없습니다.</li>
    </ul>
- version: 3.17.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: 디스크에 없는 미디어 파일에 대한 데이터베이스 항목을 정리합니다
  - type: security
    label: 미디어 폴더가 사라졌을 때 라이브러리 전체의 아트워크가 지워지는 것을 막습니다
  body: |
    <ul>
      <li><strong>새 정리 도구: &ldquo;누락된 미디어 참조&rdquo;</strong>
        (설정 &rarr; 시스템 &rarr; 유지 관리). 기존의 &ldquo;고아 미디어&rdquo;
        정리 기능을 거울처럼 뒤집은 도구입니다. 짝이 되는 게임이 없는 남은
        이미지 파일을 찾는 대신, 박스 아트, 3D 박스 아트, 스크린샷, 팬아트,
        동영상 또는 설명서가 디스크에 더 이상 존재하지 않는 파일을 가리키는
        게임을 찾아냅니다. 그런 게임을 검색한 뒤, 오래된 참조를 한 번의 클릭으로
        정리하면 스크래퍼가 아트워크를 다시 내려받을 수 있습니다. 게임 항목
        자체는 절대 건드리지 않습니다.</li>
      <li><strong>스크래핑 중 더 안전해진 자동 정리.</strong> RetroDB는 게임을
        다시 스크래핑할 때 디스크에서 사라진 미디어 파일에 대한 참조를 조용히
        정리합니다. 이전에는 미디어 폴더 전체가 한꺼번에 사라지면 &mdash;
        외장 드라이브 마운트 해제나 대량 삭제 등 &mdash; 이 정리 과정이 수천 개
        게임이 어떤 아트워크를 가지고 있었는지에 대한 기록을 지워 버려, 값비싼
        재스크래핑을 강요할 수 있었습니다. 이제 RetroDB는 그 신호를 알아챕니다.
        미디어 폴더가 아예 없거나 완전히 비어 있으면 참조를 지우지 않고 그대로
        유지하며 대신 경고를 기록합니다. 새 유지 관리 도구도 같은 보호 장치를
        적용하며, 보류한 폴더가 있으면 명확하게 표시해 줍니다.</li>
    </ul>
- version: 3.16.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: 대시보드에 새로운 "빠른 수정" 패널을 추가했습니다
  body: |
    <ul>
      <li><strong>대시보드의 새로운 &ldquo;빠른 수정&rdquo; 패널</strong>은
        여기저기 흩어져 있던 라이브러리 정리 작업을 한눈에 볼 수 있는 할 일
        목록으로 바꿔 줍니다. 박스 아트가 아직 없는 게임이 몇 개인지 보여 주고,
        중복 ROM을 찾거나 잘못된 ROM 경로(파일이 이동되었거나 삭제된 게임)를
        확인하는 원클릭 바로 가기를 제공합니다. 각 바로 가기는 문제를 해결하는
        페이지로 곧장 연결됩니다. 이 패널은 라이브러리에 게임이 생기면
        나타납니다.</li>
    </ul>
- version: 3.15.0
  date: '2026-07-03'
  tags:
  - type: accessibility
    label: 스크린 리더가 작업 진행 상황을 음성으로 안내합니다
  body: |
    <ul>
      <li><strong>오래 실행되는 작업이 이제 진행 상황을 스크린 리더로
        안내합니다.</strong> 대량 스크래핑, 도전 과제 동기화(RetroAchievements
        또는 PlayStation), 이미지 크기 조정이 실행되는 동안 스크린 리더
        사용자는 &lsquo;시작&rsquo;과 &lsquo;완료&rsquo; 사이에 아무 소리도 듣지
        못했습니다. 이제 RetroDB는 중간 진행 단계(예: &lsquo;40개 중
        12개&rsquo;)와 완료를 음성으로 안내하며, 화면에 별도의 팝업은 표시하지
        않습니다. 안내는 과하지 않도록 간격을 두고 이루어지며, 선택한 언어를
        따릅니다.</li>
    </ul>
- version: 3.14.0
  date: '2026-07-01'
  tags:
  - type: feature
    label: 새로운 언어 — 중국어(간체 및 번체) 지원 추가
  body: "<ul>\n  <li><strong>이제 RetroDB를 중국어로 사용할 수 있습니다.</strong>\n    <strong>설정 &rarr; 시스템 &rarr; 언어</strong>에서 두 가지를 선택할 수 있습니다:\n    <strong>中文 (简体)</strong>(간체, 중국 본토용)와\n    <strong>中文 (繁體)</strong>(번체, 홍콩 및 대만용). 메뉴, 버튼, 메시지,\n    앱 내 도움말 설명서까지 &mdash; 인터페이스 전체가 &mdash; 번역되었으며,\n    아직 번역되지 않은 부분은 자연스럽게 영어로 대체됩니다. 이로써 지원 언어는\n    열 가지로 늘어납니다(영어, 독일어, 스페인어, 프랑스어, 이탈리아어, 일본어,\n    브라질 포르투갈어, 한국어, 그리고 이번에 추가된 중국어 간체 &amp; 번체).</li>\n</ul>\n"
- version: 3.12.0
  date: '2026-06-30'
  tags:
  - type: feature
    label: 새로운 언어 — 한국어를 지원합니다
  body: |
    <ul>
      <li><strong>이제 RetroDB를 한국어로 사용할 수 있습니다.</strong> 설정 &rarr;
        시스템 &rarr; 언어에서 선택하세요. 메뉴, 버튼, 메시지, 앱 내 도움말
        설명서까지 인터페이스 전체가 번역되어, 지원 언어가 8개로 늘어났습니다(영어,
        독일어, 스페인어, 프랑스어, 이탈리아어, 일본어, 브라질 포르투갈어, 한국어).
        한국어 추가로 RetroDB가 표시하는 모든 연령 등급 기관(대한민국 GRAC 포함)을
        포괄합니다.</li>
    </ul>
- version: 3.11.0
  date: '2026-06-30'
  tags:
  - type: enhancement
    label: Patreon에서 RetroDB를 후원할 수 있습니다 — 새로운 후원 링크 추가
  body: |
    <ul>
      <li><strong>이제 Patreon에서 RetroDB를 후원하실 수 있습니다.</strong> 기존의
        &ldquo;GitHub에서 후원하기&rdquo; 버튼 옆,
        <strong>설정 &rarr; 시스템 &rarr; 개발 지원</strong>, 정보 패널, 그리고
        프로젝트의 README에 Patreon 링크가 추가되었습니다. RetroDB는 앞으로도 완전히
        무료이며 오픈 소스로 유지됩니다 &mdash; 후원은 전적으로 선택 사항이며, 단지
        1인 개발을 계속 이어가는 데 도움이 될 뿐입니다.</li>
    </ul>
- version: 3.10.0
  date: '2026-06-26'
  tags:
  - type: enhancement
    label: 변경 내역이 "더 보기" 버튼으로 더 빠르게 로딩됩니다
  body: |
    <ul>
      <li><strong>변경 내역 페이지가 훨씬 더 빠르게 열립니다.</strong> 열 때마다 전체
        릴리스 내역(수백 건)을 그리는 대신, 이제 RetroDB는 가장 최근 20건을 표시하고
        하단에 <strong>더 보기</strong> 버튼을 추가합니다. 클릭하면 다음 묶음이
        나타나고, 이런 식으로 계속됩니다 &mdash; 오래된 내역도 모두 그대로 남아 있으며,
        처음 표시를 느리게 만드는 대신 필요할 때 로딩될 뿐입니다.</li>
    </ul>
- version: 3.9.0
  date: '2026-06-17'
  tags:
  - type: feature
    label: 도움말 설명서와 최근 릴리스 노트가 6개 언어 전체로 번역되었습니다
  body: |
    <ul>
      <li><strong>앱 내 전체 도움말 설명서를 이제 6개 언어 모두로 이용하실 수
        있습니다</strong> &mdash; 독일어, 프랑스어, 스페인어, 이탈리아어, 일본어,
        브라질 포르투갈어 &mdash; 영어뿐만이 아닙니다. RetroDB는 설정에서 선택하신
        언어로 설명서를 표시하며, 아직 번역되지 않은 부분이 있으면 조용히 영어로
        대체합니다.</li>
      <li><strong>이 변경 내역도 이제 사용하시는 언어로 표시됩니다</strong> &mdash;
        가장 최근 릴리스가 대상이며, 앞으로의 새 릴리스도 여기서부터 번역됩니다.
        그 이전의 내역은 영어로 유지됩니다.</li>
      <li><strong>위시리스트 페이지와 마지막까지 남아 있던 영어 텍스트</strong>
        &mdash; 3.8.0에서 언어 팩이 처음 도입되었을 때 누락되었던 팝업 오류 및 상태
        메시지 묶음 &mdash; 이 이제 앱 전반에서 올바르게 번역됩니다.</li>
    </ul>
- version: 3.8.2
  date: '2026-06-17'
  tags:
  - type: security
    label: 보안 의존성 업데이트 + CI 수정
  body: |
    <ul>
      <li><strong>보안:</strong> 동봉된 <code>cryptography</code> 라이브러리(47 → 49)를
        업데이트하여 공개된 보안 권고(GHSA-537c-gmf6-5ccf)를 해소했습니다. 동작 변경은
        없으며 &mdash; 더 안전한 버전이 되었을 뿐입니다.</li>
      <li>자동 테스트 파이프라인을 수정했습니다: 테스트 전용 헬퍼
        (<code>beautifulsoup4</code>)가 누락되어 v3.7.0 이후 테스트 실행이 실패하고
        있었고, 새로운 패키징 빌드 스크립트가 알려진 오탐인 정적 분석 검사에
        걸렸습니다(이는 사용자 입력이 아니라 신뢰된 빌드 명령을 실행합니다) &mdash; 이제
        문서화하고 보정했습니다. 유지보수 작업일 뿐이며, 앱 자체에는 변경이 없습니다.</li>
    </ul>
- version: 3.8.1
  date: '2026-06-17'
  tags:
  - type: improvement
    label: 더 작은 다운로드 옵션, 후원 정리 및 번역 수정 (Pass 46.3 / 47.6)
  body: |
    <ul>
      <li><strong>훨씬 더 작은 다운로드를 준비 중입니다.</strong> 바로 실행 가능한
        "압축을 풀고 더블 클릭만 하면 되는" RetroDB 버전을, AMD 그래픽 카드가 없는
        분들을 위해 <strong>CPU 전용</strong> 형식(약 600&nbsp;MB)으로 빌드할 수 있게
        되었습니다 &mdash; 전체 버전의 약 6분의 1 크기입니다. 두 가지를 나란히
        제공하므로 사용하시는 컴퓨터에 맞는 쪽을 선택하실 수 있습니다.</li>
      <li><strong>설정의 "개발 지원" 패널도 이제 번역됩니다</strong> &mdash; 앱의 나머지
        부분과 마찬가지로 말이죠. 3.8.0에서 언어 팩이 도입되었을 때 실수로 영어로
        남겨져 있었습니다.</li>
      <li>후원 링크를 정리했습니다(README의 GitHub Sponsors 배지. 자금 지원 파일은
        설정이 완료되는 대로 Patreon 및 Buy&nbsp;Me&nbsp;A&nbsp;Coffee를 지원할 수
        있도록 준비되어 있습니다). 성가신 독촉 화면은 절대 없습니다.</li>
      <li>이면에서는, 릴리스 파이프라인이 이제 Windows, macOS, Linux용 바로 실행 가능한
        버전을 자동으로 빌드할 수 있습니다. 참고: 긴 앱 내 <em>도움말</em> 설명서는
        현재로서는 아직 영어 전용입니다 &mdash; 이는 향후 작업으로 기록되어 있습니다.</li>
    </ul>
- version: 3.8.0
  date: '2026-06-12'
  tags:
  - type: feature
    label: 전체 인터페이스 번역 + 6개 언어 지원 (Pass 43.2/43.3/43.5)
  body: |
    <ul>
      <li><strong>이제 RetroDB가 6개 언어를 더 지원합니다.</strong> 3.7.0의 기반 위에서
        전체 인터페이스를 번역 가능하게 만들고 <strong>독일어, 프랑스어, 스페인어,
        이탈리아어, 일본어, 브라질 포르투갈어</strong>로 기계 번역했습니다. 설정 &rarr;
        표시 환경설정 &rarr; 언어 에서 언어를 선택하세요. 저장된 환경설정을 먼저 따르고,
        그다음 브라우저 설정, 마지막으로 영어로 대체됩니다 &mdash; 존재하지 않는 언어에서
        멈추는 일은 결코 없습니다.</li>
      <li><strong>화면의 모든 것이 대상입니다</strong>: 페이지 텍스트와 버튼, 팝업
        메시지(작은 &ldquo;토스트&rdquo; 알림), 편집 및 설정 대화상자, 툴팁, 스크린
        리더 레이블. 게임의 장르, 시점, 플레이 모드(예: &ldquo;First-Person-Shooter&rdquo;)도
        이제 사용하시는 언어로 표시됩니다 &mdash; 한편 기반이 되는 데이터는 영어로
        유지되므로 라이브러리와 필터는 이전과 똑같이 정상 작동합니다.</li>
      <li>내장된 <strong>&ldquo;Pseudo&rdquo; 언어</strong>(언어 메뉴에 표시됨)는 번역가용
        품질 검사 도구로, 모든 레이블을 괄호로 감싸고 강세 기호를 붙여 번역이 누락된
        텍스트가 한눈에 드러나도록 합니다.</li>
      <li>기계 번역은 출발점일 뿐이며 곳에 따라 다소 어색하게 읽힐 수 있습니다 &mdash;
        시간을 들여 개선하기는 쉬우며, 번역이 없는 텍스트는 그냥 영어로 표시됩니다.</li>
    </ul>
