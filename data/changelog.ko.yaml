  body: |
    <ul>
      <li><strong>RetroDB 전용 게임 플레이어를 맞을 준비가 되었습니다.</strong> RetroArch를 기반으로 한 플레이어를 RetroDB용으로 만들고 있습니다. 플레이어가 나오면 RetroDB는 게임마다 고른 설정으로 그 플레이어에서 게임을 시작하고, 플레이 중에 바꾼 설정도 그대로 유지합니다. 저장 파일과 설정은 사용자의 RetroArch와 분리된 전용 폴더에 보관합니다. 콘솔마다 가장 알맞은 코어를 골라 처음 실행을 누를 때 내려받으며, 그동안 버튼에는 "코어를 내려받는 중…"이라고 표시됩니다. 작동하는 에뮬레이터가 없는 콘솔도 플레이할 수 있고, 사용자가 설정한 에뮬레이터를 대신하지는 않습니다. 게임마다 다른 코어, 화면 효과, 정수배 스케일링, 입력 지연 감소를 고를 수 있습니다. 관리자는 모든 코어를 한 번에 설치하거나 업데이트할 수 있고, 다운로드를 끌 수도 있습니다. 플레이어가 설치되기 전까지는 아무것도 바뀌지 않으며, 그때까지는 설정 &gt; 에뮬레이터에도 나타나지 않습니다.</li>
      <li><strong>박물관 탭이 다시 전환됩니다.</strong> 버전 3.30.0부터 콘솔의 박물관 페이지에서 사양, 상위 10개 게임, 컨트롤러를 클릭해도 아무 일도 일어나지 않고 "예기치 않은 오류" 메시지가 표시되었습니다. 이제 모든 탭이 열립니다.</li>
      <li><strong>폴더로 저장된 PlayStation 3 게임을 플레이할 수 있습니다.</strong> PS3 디스크 게임은 보통 이름이 ".PS3"로 끝나는 폴더입니다. RetroDB는 파일 하나를 기대했기 때문에 실행을 거부하고 실행 버튼도 보여 주지 않았습니다. 이제 RPCS3가 기대하는 대로 폴더를 에뮬레이터에 넘깁니다.</li>
      <li><strong>메타데이터 검색의 열이 가지런해지고 휴대폰 화면에도 맞습니다.</strong> 결과가 넘칠 만큼 많은 소스에는 스크롤 막대가 생겨 제목 폭이 좁아졌고, 그래서 같은 제목이 한 열에서는 줄바꿈되고 옆 열에서는 그렇지 않았습니다. 이제 모든 열이 같은 폭을 유지하고, 테마에 맞는 얇은 스크롤 막대가 붙습니다. 휴대폰이나 좁은 창에서는 검색 창이 숨겨진 사이드바 옆에 끼어 있었는데, 이제 화면을 가득 채웁니다.</li>
      <li><strong>Windows나 Mac에 새로 설치하면 RetroArch 코어 이름이 올바르게 설정됩니다.</strong> RetroDB가 어디서나 Linux 코어 파일 이름으로 RetroArch를 설정했기 때문에 Windows와 macOS에서는 코어를 찾지 못했습니다. 이제 새로 설치하면 각 컴퓨터에 맞는 이름을 씁니다. 기존 설치는 지금 이름을 그대로 유지하니, 매핑 표에서 바꾸세요.</li>
      <li><strong>스크린샷 뷰어에 양쪽 화살표가 모두 버튼 안에 표시됩니다.</strong> 사이드바가 왼쪽 화살표를 가려서 마우스로 이전 스크린샷으로 돌아갈 수 없었습니다. 오른쪽 화살표도 버튼 아래로 처져 있었습니다. 이제 둘 다 보이고 버튼 가운데에 놓입니다.</li>
      <li><strong>에뮬레이터 설정 페이지가 선택한 언어로 표시됩니다.</strong> 설정 &gt; 에뮬레이터의 대부분은 어떤 언어를 골라도 영어였습니다. 제목, 에뮬레이터 표, 스캔 결과, 에뮬레이터 편집 창이 그랬습니다. 이제 모두 번역됩니다.</li>
      <li><strong>플레이어 수 칸에 16보다 큰 수를 넣을 수 있습니다.</strong> 두 편집 창 모두 16에서 멈춰서 MAG의 256명을 입력할 수 없었습니다. 스크래퍼가 16보다 큰 값을 넣은 게임은 숫자를 줄이기 전까지 아예 저장할 수 없었습니다. 이제 상한이 없습니다.</li>
      <li><strong>AI 채우기가 PC 게임에 콘솔이 아닌 PC 저장 방식을 지정합니다.</strong> AI가 PlayStation 2판을 설명하는 바람에 Windows 게임에 "메모리 카드"가 지정될 수 있었습니다. 이제 AI에게 사용자의 게임이 나온 플랫폼의 판을 설명하라고 지시합니다. PC와 PlayStation 3, Xbox 360 이후의 콘솔은 내장 저장소에 저장합니다.</li>
      <li>이미 잘못된 저장 방식이 지정된 게임을 고치려면 다시 스크래핑하거나 AI 채우기를 실행하세요. 둘 다 AI에게 다시 묻고 예전 값을 바꿉니다.</li>
      <li><strong>PlayStation 연결 시 먼저 로그인하라고 안내합니다.</strong> 설정 &gt; 계정 &gt; PSN에서, PlayStation에 이미 로그인해 있지 않으면 Sony 계정 페이지에 "Invalid login"만 표시되었고, 단계 설명에도 그런 말이 없었습니다. 이제 1단계에 먼저 누를 "PlayStation에 로그인" 버튼이 있습니다.</li>
      <li><strong>라이브러리를 정렬하고, 스크래핑되지 않은 게임만 표시할 수 있습니다.</strong> 라이브러리와 각 시스템 페이지의 게임 수 옆에 정렬 기준 메뉴가 생겼습니다. 이름, 최신 또는 가장 오래된 출시일, 평론가 점수, 사용자 점수, 최근 추가됨 중에서 고릅니다. 날짜나 점수가 없는 게임은 맨 뒤로 갑니다. A–Z 막대는 이름으로 정렬할 때 작동하고, 그 밖에는 회색으로 표시됩니다. 새 미스크래핑 버튼은 아직 어떤 스크래퍼도 정보를 채우지 않은 게임만 보여 줍니다.</li>
      <li><strong>일치하는 항목이 없는 필터는 그렇다고 알려 줍니다.</strong> 예전에는 페이지가 비어 버렸습니다. 이제 일치하는 게임이 없다고 알리고, 필터를 지우는 버튼을 보여 줍니다.</li>
      <li><strong>라이브러리 필터 막대에서 모든 것이 제자리를 지킵니다.</strong> 예전에는 선택을 누르거나 필터링하거나 정렬하면 게임이 페이지 아래로 밀려났습니다. 이제 선택 도구는 창 아래쪽의 막대에 나타납니다. 지우기는 항상 있으며, 필터가 켜지기 전까지는 회색입니다. 적용 중인 필터는 게임 수 옆에 표시됩니다. "Show Bonus"는 이제 "보너스 디스크"이며, 켜져 있으면 강조 표시됩니다. 휴대폰에서는 필터 버튼들이 하나의 필터 버튼을 통해 페이지 위에 열립니다.</li>
      <li><strong>빈 라이브러리에 스캔 버튼이 있는 환영 화면이 표시됩니다.</strong> 예전에는 새로 설치하면 상태 점수가 0%에 멈춰 있고 라이브러리는 비어 있었습니다. 이제 두 페이지 모두 라이브러리가 비어 있다고 알리고 라이브러리 스캔 버튼을 보여 줍니다. 대시보드에는 ROM 폴더 설정으로 가는 링크도 있습니다. 관리자가 아닌 사용자에게는 관리자에게 요청하라고 안내합니다. 무작위 게임은 고를 게임이 생길 때까지 숨겨집니다.</li>
      <li><strong>라이브러리 스캔이 시스템 페이지와 설정에서 작동합니다.</strong> 그 두 라이브러리 스캔 버튼은 눌러도 아무 일도 일어나지 않았습니다. 대시보드의 버튼만 작동했습니다. 이제 대시보드의 라이브러리 스캔 버튼은 스캔이 허용된 유일한 사용자인 관리자에게만 표시됩니다.</li>
      <li><strong>설정 마법사가 현재 단계와 선택 단계를 보여 줍니다.</strong> "6단계 중 3단계"라고 표시하고, 각 단계에 번호를 붙이고, 지나온 단계에 체크 표시를 하며, ES-DE와 API 키를 선택 사항으로 표시합니다. 휴대폰에서는 번호와 현재 단계의 이름을 보여 줍니다.</li>
      <li><strong>라이브러리를 여러 장르, 시리즈, 배급사로 한 번에 필터링할 수 있습니다.</strong> 장르, 시리즈, 배급사, 개발사, 플레이 모드, 시점, 차원 필터에서 원하는 만큼 값을 체크하고 적용을 누르세요. 그중 하나라도 있는 게임이 표시됩니다. 창을 아님으로 바꾸면 체크한 값 중 하나라도 있는 게임을 숨깁니다. 값마다 태그가 따로 붙고, 그 ✕를 누르면 그 값만 지워집니다.</li>
    </ul>
