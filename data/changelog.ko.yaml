  body: |
    <ul>
      <li><strong>RetroDB가 스스로 업데이트합니다.</strong> 새 버전이 나오면 관리자는 대시보드와 설정 &gt; 시스템 &gt; 업데이트에서 새로운 기능과 함께 확인할 수 있습니다. "업데이트 다운로드"는 새 버전을 받아 공개된 파일과 정확히 같은지 확인합니다. "설치 후 다시 시작"은 데이터베이스를 백업하고, 새 버전을 설치한 뒤 다시 시작합니다. 새 버전이 시작되지 않으면 RetroDB가 스스로 이전 버전으로 돌아가고 그 이유를 알려 줍니다. 게임, 설정, 이미지, 로그는 건드리지 않습니다. RetroDB는 하루에 한 번 업데이트를 확인하며, 이 기능은 끌 수 있습니다. git에서 실행하거나 프로세스 관리자로 실행하는 사본은 업데이트 알림만 받고 업데이트되지는 않습니다.</li>
      <li><strong>RetroDB 안에서 RetroArch 받기.</strong> 설정 &gt; 에뮬레이터에 새 "RetroDB에서 플레이" 섹션이 있습니다. "RetroArch 받기"를 누르면 RetroDB가 libretro에서 공식 RetroArch를 다운로드하고, 다운로드한 파일이 예상한 파일과 정확히 같은지 확인한 뒤, RetroArch (RetroDB)로 설정합니다. 설정과 저장 파일은 따로 두어, 이미 사용 중인 RetroArch와 분리됩니다. 그런 다음 각 시스템을 처음 플레이할 때 가장 적합한 코어를 받습니다. Linux와 Windows에서 작동하며, macOS는 아직 테스트하지 않았습니다.</li>
      <li><strong>RetroDB에서 플레이하는 게임에서 다음 디스크가 작동합니다.</strong> 여러 디스크로 된 게임에서 이제 "다음 디스크" 버튼이 별도 설정 없이 RetroDB 전용 RetroArch에 전달됩니다. RetroArch는 그런 게임이 실행되는 동안에만, Windows와 macOS에서는 어떤 게임이든 실행되는 동안 RetroDB의 명령을 기다립니다.</li>
      <li><strong>휴대폰에서, 그리고 창 크기를 바꾼 뒤에도 게임 카드가 가지런히 정렬됩니다.</strong> 휴대폰에서 라이브러리와 콘솔 페이지는 카드 하나를 보여 준 뒤 긴 빈 공간이 이어졌습니다. 이제 카드가 위아래로 차례로 쌓입니다. 창을 좁히거나 넓히면 카드가 예전 열에 남지 않고 다시 배치됩니다.</li>
      <li><strong>스크래핑한 등급과 플레이어 수가 더 정확해졌습니다.</strong> IGDB의 CERO, USK, GRAC, ClassInd, ACB 연령 등급을 이제 올바르게 읽으므로, CERO Z나 USK 18 등급 게임은 그 등급을 받습니다. TheGamesDB, RAWG, IGDB, ES-DE는 모를 때 더 이상 "1인"으로 추측하지 않습니다. ES-DE 가져오기는 더 이상 사용자가 설정한 플레이어 수나 게임 모드를 덮어쓰지 않습니다. TheGamesDB는 조회에 실패한 뒤 퍼블리셔나 개발사 이름 대신 숫자를 저장하지 않습니다.</li>
      <li><strong>ScreenScraper가 주 출처일 때 세부 정보가 유지됩니다.</strong> 제목, 설명, 날짜, 개발사, 퍼블리셔, 플레이어 수가 검색 후 처음 몇 분 동안만이 아니라 모든 스크래핑에서 유지됩니다. 다운로드한 동영상과 설명서에는 알맞은 파일 이름이 붙습니다.</li>
      <li><strong>스크래핑 데이터 지우기가 파일 이름을 다시 제목으로 되돌립니다.</strong> 예전에는 세부 정보는 지웠지만 스크래핑한 제목은 남겨 두었습니다.</li>
      <li><strong>콘솔 하나의 RetroAchievements 새로 고침이 다시 작동합니다.</strong> 매번 오류로 실패했습니다.</li>
      <li><strong>다운로드한 앱에서 중복 스크린샷 찾기가 작동합니다.</strong> 그곳에서는 스크린샷을 하나도 찾지 못했고, 중복을 삭제해도 파일이 디스크에 남아 있었습니다.</li>
      <li><strong>ScreenScraper 비밀번호가 가려지고, 마지막 관리자는 관리자로 남습니다.</strong> 이제 설정에서 ScreenScraper 비밀번호가 다른 키처럼 가려져 표시됩니다. 유일한 관리자 계정은 더 이상 편집자로 바꾸거나 비활성화할 수 없습니다. 그러면 RetroDB를 관리할 수 있는 사람이 아무도 없게 되기 때문입니다.</li>
      <li><strong>중단된 작업은 실행할 권한이 있는 사람에게만 표시됩니다.</strong> 이제 대시보드의 중단된 작업 배너는 그 작업을 시작할 수 있는 사람에게만 작업을 보여 줍니다. 예를 들어 대량 스크래핑은 편집자와 관리자에게만 표시됩니다. 다른 계정은 더 이상 배너를 보거나 닫을 수 없습니다.</li>
      <li><strong>가져온 콘솔 로고, 설정의 특이한 이름, 보너스 디스크.</strong> 다운로드한 앱에서 이제 "로고 새로 고침"이 ES-DE에서 가져오기로 들여온 콘솔 로고를 찾아, 내장 로고보다 우선 사용합니다. &lt; 나 따옴표 같은 문자가 들어간 컨트롤러, 콘솔, 백업 이름 때문에 더 이상 설정 페이지가 깨지지 않습니다. 보너스 디스크 지정을 해제하면 완전히 분리되어, 더 이상 예전 게임의 보너스 디스크로 계산되지 않습니다.</li>
      <li><strong>트로피, 라이브러리 가져오기, 유지 관리 도구가 더 빨라졌습니다.</strong> 트로피 페이지, Steam·Xbox·PlayStation 라이브러리 가져오기, 수집가 트로피, "저장 공간 계산", 사용하지 않는 미디어 검사가 큰 라이브러리에서 훨씬 적은 작업만 합니다. 서버가 바쁠 때도 작업 진행 팝업이 계속 업데이트되며, HowLongToBeat와 대체 제목 작업은 실행 중에 더 이상 다른 변경을 막지 않습니다.</li>
      <li><strong>각 PS3 게임이 RPCS3에서 얼마나 잘 실행되는지 확인.</strong> 라이브러리, PlayStation 3 페이지, 게임 페이지의 PS3 게임에 RPCS3 호환성 상태(플레이 가능, 게임 내, 인트로, 로드 가능, 작동 안 함)가 마지막 테스트 날짜와 함께 표시됩니다. RetroDB는 이 정보를 컴퓨터에 있는 RPCS3에서 읽으므로, RPCS3에서 Manage &gt; Databases &gt; Download Compatibility Database를 한 번 선택하고, 최신 결과가 필요할 때마다 다시 선택하세요. 디스크에 ROM이 있는 게임만 표시되며, 가져온 게임은 표시되지 않습니다. 이제 RetroDB는 PSN 및 설치된 게임 폴더의 게임 ID와, [BLUS30443]처럼 이름에 게임 ID가 들어 있는 폴더와 파일의 게임 ID도 읽습니다.</li>
      <li><strong>게임 판매량.</strong> 스크래핑 중에 AI가 빈 항목을 채울 때와 AI 채우기를 누를 때, 이제 그 게임이 해당 콘솔에서 몇 장 팔렸는지도 AI에게 묻습니다. 퍼블리셔의 보고서, 플랫폼 베스트셀러 목록, 패미통, Wikipedia, VGChartz 같은 무료로 공개된 수치를 바탕으로 합니다. 게임 페이지에 그 숫자가 표시됩니다. 공개된 수치가 없는 게임은 추측하지 않고 비워 둡니다.</li>
      <li><strong>게임 페이지에서 프랜차이즈 / 시리즈 스위치가 작동합니다.</strong> 게임 페이지의 편집 창에서 독립 실행형으로 표시된 게임의 프랜차이즈 / 시리즈 스위치를 클릭해도 아무 일도 일어나지 않아, 시리즈에 넣을 수 없었습니다. 이제 스위치가 바뀌며, 플랫폼 출시 현황 스위치도 마찬가지입니다.</li>
      <li><strong>모든 업적 탭의 너비가 같습니다.</strong> RetroAchievements, RPCS3, PSN, Steam, Xbox가 각자 자기 카드에 맞춰 페이지 크기를 정해서, 탭을 옮길 때마다 페이지 너비가 바뀌었습니다. 이제 모두 같은 너비를 씁니다.</li>
      <li><strong>Windows와 macOS에서 RetroDB가 RPCS3 설정을 찾습니다.</strong> Windows에서 RPCS3는 설정을 rpcs3.exe 옆에 보관합니다. 이제 RetroDB가 그곳과 포터블 폴더를 살펴보므로, 게임별 설정과 호환성 목록을 찾습니다.</li>
      <li><strong>점수는 있지만 연령 등급이 없는 게임에서도 AI 채우기가 작동합니다.</strong> 그런 게임에서는 연령 등급을 정하는 도중에 AI 채우기가 오류로 실패할 수 있었습니다.</li>
      <li><strong>게임 카드 라벨이 사용자의 언어로 표시됩니다.</strong> 라이브러리 카드의 완료 상태와 점수 도움말이 항상 영어로 표시되었습니다.</li>
      <li><strong>모든 지역의 출시일.</strong> 스크래핑 중에 AI가 빈 항목을 채울 때와 AI 채우기를 누를 때, 이제 북미, 유럽, 일본 등 각 지역에서 게임이 출시된 날짜도 AI에게 묻습니다. 게임 페이지와 빠른 보기에 가장 이른 날짜부터, 날짜와 지역 이름을 사용자의 언어로 나열합니다. 게임 자체의 출시일은 바뀌지 않습니다.</li>
      <li><strong>게임 페이지의 이전 게임과 다음 게임.</strong> 게임 페이지 위쪽의 경로 옆에 이전 및 다음 링크와, 목록에서 그 게임의 위치가 표시됩니다. 이 링크는 사용자가 온 페이지를 따릅니다. 라이브러리에서 열었다면 라이브러리를, 콘솔 페이지에서 열었다면 그 콘솔을, 그곳에서 쓰던 것과 같은 순서, 필터, 검색으로 차례로 이동합니다.</li>
      <li><strong>업로드한 표지와 스크린샷을 스크래핑한 이미지처럼 처리합니다.</strong> 이제 편집 창에서 업로드한 표지, 3D 박스, 스크린샷은 스크래핑한 이미지와 같은 이미지 형식으로 저장되고, 같은 크기로 조정되며, 표지에는 라이브러리에서 쓰는 작은 사본도 만들어집니다. 게임에 이미 있는 것과 똑같아 보이는 스크린샷은 추가되지 않으며, 몇 개가 제외되었는지 알려 줍니다. 새 표지를 업로드하면 대체된 파일도 삭제됩니다.</li>
      <li><strong>RetroAchievements가 있는 모든 게임의 게임 페이지에 표시됩니다.</strong> GameCube의 Metroid Prime과 Metroid Prime 2처럼, 라이브러리에는 RA 배지가 있지만 페이지에는 RetroAchievements 카드가 없는 게임이 있었습니다. 이제 페이지가 배지와 같은 RetroAchievements 링크를 사용하며, 매번 RetroAchievements에 묻지 않으므로 더 빨리 열립니다.</li>
      <li><strong>시스템 페이지의 미스크래핑 수가 미스크래핑 필터와 일치합니다.</strong> 이 수에는 콘솔의 게임 목록에 표시되지 않는 보너스 디스크가 포함되어 있어서, 콘솔에 미스크래핑 2개라고 나오는데 미스크래핑 필터에는 아무것도 나오지 않을 수 있었습니다.</li>
      <li><strong>대량 스크래핑 중에 라이브러리와 시스템 페이지가 실시간으로 업데이트됩니다.</strong> 대량 스크래핑 창이 열려 있든, 닫혀 있든, 백그라운드에서 실행 중이든, 각 게임의 카드는 스크래핑되는 즉시 새로 고쳐집니다.</li>
      <li><strong>AI 채우기가 각 게임에 공식 이름을 붙입니다.</strong> 단일 게임 스크래핑, 대량 스크래핑, AI 채우기 버튼에서 AI가 빈 항목을 채울 때, ROM의 지역에서 출시된 게임의 공식 제목도 알려 주고 게임 이름이 그것으로 바뀝니다. 예전 이름은 대체 제목으로 남습니다. 직접 입력했거나 공식 이름에서 수락한 제목은 절대 바뀌지 않습니다.</li>
      <li><strong>공식 이름이 다시 이름을 제안합니다.</strong> OpenAI에서, 그리고 가끔 Gemini에서 AI의 답변을 읽을 수 없어서, 작업이 이름을 하나도 제안하지 못한 채 끝났습니다.</li>
      <li><strong>출처는 지원하는 시스템에서만 검색됩니다.</strong> RAWG에는 Intellivision 게임이 없으므로 더 이상 그 게임들을 RAWG에서 검색하지 않습니다. 예전에는 대신 다른 플랫폼의 게임을 찾았습니다. 이제 IGDB, TheGamesDB, RAWG는 항상 게임 자체의 시스템에서 검색합니다. 잘못된 RAWG 플랫폼 연결 몇 개도 바로잡았습니다(Atari ST, ColecoVision, PC Engine, DOS).</li>
      <li><strong>스크래핑 진행 링이 더 이상 뒤로 튀지 않습니다.</strong> 메타데이터 검색 창에서 두 번 이상 검색한 뒤 적용을 한 번 누르면 스크래핑이 여러 번 시작되어, 링이 그 사이를 오갔습니다.</li>
      <li><strong>확대한 3D 박스 아트 뒤에 사각형이 없습니다.</strong> 박스가 어두워진 배경 위에 바로 놓입니다.</li>
      <li><strong>메시지에 더 이상 HTML 코드가 표시되지 않습니다.</strong> ROM 도구의 일부 확인 창과 결과 창에 줄 바꿈 대신 &lt;br&gt; 같은 태그가 표시되었습니다. 설정의 로그 보기와 보너스 디스크의 상위 게임 선택도 다시 작동합니다.</li>
    </ul>
- version: 3.32.0
  date: '2026-10-23'
  tags:
  - type: feature
    label: 어느 페이지에서나 게임이나 콘솔을 검색할 수 있습니다
  - type: feature
    label: 휴대폰이나 태블릿에서 더 쉽게 이동할 수 있습니다
  - type: fix
    label: 설정 > 에뮬레이터가 휴대폰 화면에 맞습니다
  - type: fix
    label: 게임 이미지를 지워도 더 이상 남는 파일이 생기지 않습니다
  - type: feature
    label: 직접 입력한 제목이 스크래핑할 때 유지됩니다
  - type: feature
    label: 직접 확인하는 게임 공식 이름
  - type: fix
    label: 연도만 있는 게임을 편집할 수 있고, 연도도 유지됩니다
  body: |
    <ul>
      <li><strong>어느 페이지에서나 게임이나 콘솔을 검색할 수 있습니다.</strong> 이제 사이드바의 사용자 이름 아래에 검색 상자가 있습니다. 두 글자 이상 입력하면 일치하는 콘솔과, 일치하는 게임을 최대 8개까지 각 게임의 콘솔과 함께 보여 줍니다. 하나를 클릭하거나, 화살표 키로 고르고 Enter를 누르면 열립니다. "모든 결과 보기"를 누르면 그 검색어로 라이브러리가 열립니다. 페이지에 자체 검색 상자가 없을 때는 /를 눌러 검색 상자로 바로 이동할 수 있습니다.</li>
      <li><strong>휴대폰이나 태블릿에서 더 쉽게 이동할 수 있습니다.</strong> 좁은 화면에서는 위쪽 막대에 메뉴 버튼과 검색 버튼이 있습니다. 검색 버튼은 커서가 이미 검색 상자에 있는 상태로 메뉴를 엽니다. 아래쪽 막대에서는 대시보드, 라이브러리, 시스템, 업적으로 한 번에 이동합니다. 이제 메뉴가 불투명해서 뒤의 페이지가 비쳐 보이지 않습니다. 메뉴 바깥을 누르거나 Esc를 누르면 닫힙니다. 태블릿 크기의 창에서는 메뉴 버튼이 없어서 메뉴를 아예 열 수 없었는데, 이제 버튼이 있습니다. 스크롤해도 화면에 남는 탭 막대와 필터 막대는 위쪽 막대 뒤가 아니라 바로 아래에 멈춥니다.</li>
      <li><strong>설정 &gt; 에뮬레이터가 휴대폰 화면에 맞습니다.</strong> 표가 휴대폰보다 넓어서 편집 버튼과 설정 버튼이 화면 밖에 있었습니다. 이제 휴대폰에서는 각 행이 버튼이 들어 있는 카드로 표시됩니다.</li>
      <li><strong>게임 이미지를 지워도 더 이상 남는 파일이 생기지 않습니다.</strong> RetroDB가 백그라운드에서 이미지를 선명하게 다듬는 동안 게임 이미지를 지우면, 어떤 게임도 쓰지 않는 파일로 다시 저장할 수 있었습니다. 이제 먼저 확인하고 건너뜁니다. "이미지 개선 중" 수에서도 지운 게임이 바로 빠집니다.</li>
      <li><strong>직접 입력한 제목이 스크래핑할 때 유지됩니다.</strong> 예전에는 스크래핑하면, 전체 재스크랩이라도, 편집 창에서 입력한 제목이 스크래퍼의 이름으로 바뀌었습니다. 이제 바꾼 제목은 유지됩니다. 제목 아래의 새 "스크래핑할 때 이 제목 유지" 상자가 이를 보여 줍니다. 체크를 해제하면 스크래퍼가 다시 게임 이름을 바꿀 수 있습니다. 게임 페이지의 초기화로도 다시 바꿀 수 있게 됩니다.</li>
      <li><strong>직접 확인하는 게임 공식 이름.</strong> ROM 도구에 새 공식 이름 페이지가 생겼습니다. 시스템 하나 또는 전체에 대해 "AI에게 묻기"를 누르면, AI가 각 게임이 ROM의 지역에서 출시된 정식 공식 이름을 제안합니다. 그래서 일본판 Mega Man ROM은 Rockman이 됩니다. 예전 이름과 새 이름을 나란히 보고, 원하는 것을 체크해 수락합니다. 수락하기 전까지는 아무것도 바뀌지 않습니다. 예전 이름은 대체 제목으로 남고, 수락한 이름은 스크래핑할 때 유지됩니다. 거절한 이름은 다시 제안되지 않습니다. 설정 &gt; 스크래핑에서 AI 제공자를 설정해야 합니다.</li>
      <li><strong>연도만 있는 게임을 편집할 수 있고, 연도도 유지됩니다.</strong> 많은 게임은 1985처럼 연도만으로 날짜가 기록되어 있습니다. 게임 페이지의 편집 창은 이런 게임을 저장하지 않았습니다. 라이브러리의 편집 창에서는 저장하면 연도가 지워졌습니다. 이제 둘 다 연도, 연도와 월, 또는 전체 날짜를 받습니다.</li>
    </ul>
