  - type: fix
    label: Cada buscador agora pesquisa o console certo. Atari Lynx, CPS de arcade, Super Famicom e outros estavam sendo pesquisados na máquina errada, e muito mais sistemas agora são pesquisados, por todas as fontes e para conquistas
  - type: feature
