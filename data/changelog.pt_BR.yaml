  - type: fix
    label: Configurações > Emuladores cabe num celular
  - type: fix
    label: Limpar as imagens de um jogo não deixa mais arquivos soltos
  - type: feature
    label: Títulos que você digita são mantidos ao buscar metadados
  - type: feature
    label: Nomes oficiais para os seus jogos, conferidos por você
  - type: fix
    label: Jogos datados só pelo ano podem ser editados e mantêm o ano
  body: |
    <ul>
      <li><strong>Pesquise qualquer jogo ou console a partir de qualquer
        página.</strong> Uma caixa de pesquisa agora fica abaixo do seu nome
        na barra lateral. Digite duas ou mais letras para ver os consoles
        correspondentes e até oito jogos correspondentes, cada um com o seu
        console. Clique num deles, ou escolha-o com as setas e aperte Enter,
        para abri-lo. "Ver todos os resultados" abre a Biblioteca com essa
        pesquisa. Aperte / para ir até a caixa quando a página não tiver uma
        caixa de pesquisa própria.</li>
      <li><strong>Mais fácil de navegar num celular ou tablet.</strong> Numa
        tela estreita, uma barra no topo tem o botão do menu e um botão de
        pesquisa que abre o menu com o cursor já na caixa de pesquisa. Uma
        barra embaixo leva você ao Painel, à Biblioteca, a Sistemas e a
        Conquistas com um toque. O menu agora é sólido, então a página não
        aparece mais através dele. Toque fora dele ou aperte Esc para
        fechá-lo. Em janelas do tamanho de um tablet o botão do menu não
        aparecia, então o menu não podia ser aberto; agora ele está lá. As
        barras de abas e de filtros que ficam na tela enquanto você rola param
        logo abaixo da barra do topo, e não atrás dela.</li>
      <li><strong>Configurações &gt; Emuladores cabe num celular.</strong> As
        tabelas eram mais largas que um celular, então os botões Editar e
        Configurações ficavam fora da tela. Num celular cada linha agora é um
        cartão com os botões dentro.</li>
      <li><strong>Limpar as imagens de um jogo não deixa mais arquivos
        soltos.</strong> Se você limpava as imagens de um jogo enquanto o
        RetroDB ainda as deixava mais nítidas em segundo plano, ele podia
        gravá-las de volta como arquivos que nenhum jogo usa. Agora ele
        confere antes e as ignora. A contagem "Melhorando imagens" também tira
        o jogo limpo na hora.</li>
      <li><strong>Títulos que você digita são mantidos ao buscar
        metadados.</strong> Uma busca de metadados, mesmo uma Rebusca
        Completa, substituía o título que você tinha digitado na janela de
        edição pelo nome do scraper. Agora um título que você muda é mantido.
        Uma nova caixa "Manter este título ao buscar metadados" abaixo do
        título mostra isso; desmarque-a para deixar os scrapers renomearem o
        jogo de novo. Redefinir na página de um jogo também deixa.</li>
      <li><strong>Nomes oficiais para os seus jogos, conferidos por
        você.</strong> Ferramentas de ROM tem uma nova página Nomes Oficiais.
        Aperte "Perguntar à IA" para um sistema ou para todos, e a IA sugere o
        nome oficial completo de cada jogo como lançado na própria região da
        sua ROM, então uma ROM japonesa de Mega Man vira Rockman. Você vê cada
        nome antigo e novo lado a lado, marca os que quer e os aceita. Nada
        muda até você fazer isso. O nome antigo é mantido como título
        alternativo, e um nome aceito é mantido ao buscar metadados. Um nome
        rejeitado não é sugerido de novo. Precisa de um provedor de IA em
        Configurações &gt; Busca de metadados.</li>
      <li><strong>Jogos datados só pelo ano podem ser editados e mantêm o
        ano.</strong> Muitos jogos têm só o ano como data, como 1985. Na
        página de um jogo, a janela de edição se recusava a salvá-los. Na
        janela de edição da Biblioteca, salvar um apagava o ano. As duas agora
        aceitam um ano, um ano e mês, ou uma data completa.</li>
    </ul>
