    </ul>
- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: As consultas ao How Long to Beat voltaram a funcionar
  body: |
    <ul>
      <li><strong>Toda consulta ao How Long to Beat dizia que o jogo não foi
        encontrado.</strong> O site mudou a busca para um novo endereço, então
        as solicitações do RetroDB eram recusadas; a falha começou entre o fim de
        julho e o fim de setembro. O RetroDB agora usa o novo endereço e envia os
        filtros de plataforma e ano no novo formato do site, que o site
        tinha passado a ignorar. As consultas de um único jogo e a consulta em lote em Ferramentas
