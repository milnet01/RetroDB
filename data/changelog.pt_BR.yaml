        jogos do RetroAchievements, ela abre na aba RPCS3 em vez de
        mandar você de volta ao Painel.</li>
      <li><strong>Relatórios de ROM agora ficam em Ferramentas de ROM,</strong> como uma aba
        ao lado das outras ferramentas e um cartão na página Ferramentas de ROM.</li>
      <li><strong>Não há mais dois links da barra lateral com o mesmo ícone:</strong> o Painel
        agora é 🏠 e o Visualizador de Log 🧾. A barra lateral tem 16 links em vez de
        21.</li>
      <li>As abas de ferramentas na página de configurações de Ferramentas de ROM estavam sempre em
