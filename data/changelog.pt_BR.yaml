  - type: fix
    label: A Rebusca Completa não troca mais por um palpite uma classificação ou um controle definidos por você, e uma busca que falha no meio não grava mais por um caminho menos cuidadoso
  body: "<ul>\n  <li><strong>As respostas da AI dizem que são da AI.</strong> As classificações etárias da AI\n    permanecem, marcadas como uma estimativa baseada no conteúdo do jogo, com o ano em que cada\n    órgão de classificação começou. Notas e vendas da AI também são marcadas.</li>\n  <li><strong>O RetroAchievements mostra o jogo certo.</strong> As sequências não\n    carregam mais as Conquistas do primeiro jogo. Depois de atualizar, o\n    painel oferece uma vez uma atualização do RetroAchievements. Use-a para corrigir\n    vínculos antigos. O progresso salvo em um vínculo errado é removido, e a próxima\n    sincronização o preenche de novo.</li>\n  <li><strong>Os totais de tempo de jogo estão corretos.</strong> Tempos de menos de uma hora eram\n    contados como horas, então os totais no painel e nos troféus de colecionador\n    estavam altos demais. Alguns totais e troféus vão diminuir.</li>\n  <li><strong>O HowLongToBeat encontra o jogo certo.</strong> Uma sequência não\n    passa mais pelo jogo que você tem, e agora o sistema e o ano do jogo contam.\n    Uma correspondência de outro sistema, ou de anos depois, aguarda você\n    na página de revisão.</li>\n  <li><strong>Verifique o que já está salvo.</strong> Use Verificar Tempos de Jogo\n    Salvos nas Ferramentas de ROM para enviar correspondências salvas duvidosas à página de revisão.\n    Nada muda até você decidir.</li>\n  <li><strong>Os nomes de série são reais.</strong> A série de um jogo não vem mais\n    de pedaços do título. Depois de atualizar, os nomes de série que foram\n    adivinhados são apagados, inclusive alguns que estavam certos. A próxima busca\n    os preenche com fontes que informam uma série.</li>\n  <li><strong>Texto limpo.</strong> As descrições não mostram mais códigos da web nem\n    marcas de título. Uma empresa tem uma só grafia, um jogo tem uma só região, e\n    nomes de arquivo como dosbox.exe não são mais listados como outros títulos. Isso\n    acontece uma vez, sozinho, depois de você atualizar.</li>\n  <li><strong>A Rebusca Completa mantém suas escolhas.</strong> Uma classificação ou\n    um controle definidos por você permanecem, a menos que uma fonte realmente forneça um.</li>\n</ul>\n"
- version: 3.35.1
  date: '2026-11-02'
  tags:
  - type: fix
    label: Buscar Metadados não usa mais uma sequência no lugar do jogo que você tem. Street Fighter II não recebe mais detalhes de Street Fighter, nem Sonic the Hedgehog de Sonic 2, quando o jogo exato não é encontrado
  - type: fix
    label: Uma busca de metadados em lote agora só aceita um resultado se o título realmente corresponder. O console certo e uma data de lançamento não bastam mais, sozinhos, para ser aprovado
  - type: fix
    label: Mods, DLCs, pacotes e atualizações do IGDB não correspondem mais a um jogo, a menos que sua ROM tenha exatamente esse nome
  - type: fix
