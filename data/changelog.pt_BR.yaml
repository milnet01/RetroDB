  - type: fix
    label: O número de jogadores e os modos multijogador do IGDB agora vêm do console do próprio jogo
  - type: fix
    label: Quando as fontes correspondem igualmente bem, agora a ordem dos seus scrapers decide. O RAWG não ganha mais pontos extras por ter imagem ou nota do Metacritic, e novas instalações listam o RAWG por último
  - type: fix
    label: O RAWG não é mais consultado para jogos de Commodore 64 e DOS, pois ele os classifica como Amiga e PC, e o jogo de outra plataforma poderia corresponder
  - type: fix
    label: O resultado do ScreenScraper que você escolhe agora é sempre o jogo que você recebe, mesmo se deixar os resultados abertos por mais de 10 minutos
  - type: fix
    label: Acentos e pontuação não reduzem mais a correspondência do título, então Pokémon encontra Pokemon e R.B.I. encontra RBI
  - type: fix
    label: Uma data de lançamento agora mostra só o que a fonte sabe. Um jogo conhecido apenas pelo ano mostra esse ano, sem inventar 1º de janeiro ou 31 de dezembro
  - type: fix
    label: As datas do IGDB e do RAWG agora pertencem ao console do próprio jogo, e as do IGDB também à sua própria região. Assim, uma cópia dos EUA não mostra mais a data japonesa, nem uma versão adaptada o ano do original
  - type: feature
    label: A lista de Datas de Lançamento na página de um jogo agora é preenchida pelo IGDB e pelo ScreenScraper, não apenas pela IA
  - type: added
    label: 'Novo cartão em Ferramentas de ROM: Organizar Datas de Lançamento remove os dias inventados que buscas antigas gravaram, para que uma nova busca possa preencher a data real'
  - type: fix
    label: Gêneros, perspectivas e modos de jogo agora usam um só conjunto de nomes, seja qual for a fonte, para que os filtros encontrem todos os jogos. Um gênero não aparece mais como RPG e Role Playing Game ao mesmo tempo
  - type: added
    label: 'Novo cartão em Ferramentas de ROM: Organizar Gêneros, Perspectivas e Modos converte o que buscas antigas gravaram, move termos como FPV para o campo certo e corrige números de jogadores que contradizem os modos do jogo'
  - type: fix
    label: Jogos somente online do IGDB não são mais listados como multijogador local, e um jogo que exige dois jogadores não é mais listado como de um jogador
  body: "<ul>\n  <li><strong>A busca de metadados deixa de pegar o jogo errado.</strong> Uma sequência não\n    passa mais pelo jogo que você tem, então Street Fighter II não recebe nada\n    de Street Fighter, e uma busca em lote exige que o título corresponda, não\n    só o console. Mods, DLCs e pacotes do IGDB não correspondem a menos que sua\n    ROM tenha esse nome exato.</li>\n  <li><strong>O RAWG deixa de misturar versões de um jogo.</strong> Quando seu registro\n    abrange vários consoles, ele não fornece mais desenvolvedora, distribuidora, classificação\n    etária nem modos multijogador, e não adivinha mais o número de jogadores.\n    Ele não é mais consultado para jogos de Commodore 64 e DOS.</li>\n  <li><strong>A ordem dos seus scrapers decide entre resultados iguais.</strong>\n    O RAWG não ganha mais pontos extras por imagem ou nota do Metacritic, e novas\n    instalações o listam por último.</li>\n  <li><strong>Uma data de lançamento mostra só o que a fonte sabe.</strong> Um\n    jogo conhecido apenas pelo ano mostra esse ano. As datas do IGDB e do RAWG\n    pertencem ao console do próprio jogo, e a lista de Datas de Lançamento agora é preenchida\n    também pelo IGDB e pelo ScreenScraper.</li>\n  <li><strong>Um só conjunto de nomes para gêneros, perspectivas e modos.</strong>\n    Os filtros agora encontram todos os jogos, e jogos somente online não são mais listados\n    como multijogador local.</li>\n  <li><strong>Dois novos cartões em Ferramentas de ROM.</strong> Organizar Datas de Lançamento e Organizar\n    Gêneros, Perspectivas e Modos corrigem o que buscas antigas gravaram. Use\n    os dois e depois faça uma busca em lote com Preencher Faltantes.</li>\n  <li><strong>O número de jogadores vem do console do próprio jogo,</strong> e\n    o resultado do ScreenScraper que você escolhe é sempre o jogo que você recebe.</li>\n</ul>\n"
