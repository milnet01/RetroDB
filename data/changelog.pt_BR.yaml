    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: O RetroDB só inicia ou renomeia para tipos reais de arquivo de ROM
  body: |
    <ul>
      <li><strong>Um jogo podia ser iniciado com um arquivo que não é uma
        ROM.</strong> Renomear uma ROM aceitava qualquer nome, então
        <code>crash.bin</code> podia virar <code>crash.cfg</code> e ser
        entregue ao emulador. Agora, ao iniciar, o tipo do arquivo é conferido com a
        lista no <code>systeminfo.txt</code> da pasta daquele sistema, a mesma lista
        que a varredura da biblioteca usa, e a renomeação recusa um tipo que não está nessa
        lista. Se a pasta de um sistema não tiver lista, seus jogos não vão iniciar, e
        a mensagem diz qual arquivo está faltando.</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: Só um administrador pode mudar os argumentos de inicialização de um jogo
  - type: fix
    label: Argumentos de inicialização com várias palavras, ou com uma aspa solta, agora funcionam
  - type: fix
    label: O RetroDB não guarda mais na memória cada inicialização já terminada
  body: |
    <ul>
      <li><strong>Um editor podia adicionar argumentos de inicialização que rodavam outro
        código.</strong> Os <em>Argumentos de inicialização personalizados</em> de um jogo vão direto para o
        emulador, e com o RetroArch eles podiam carregar qualquer arquivo de programa do
        computador. Mudá-los agora exige a função de administrador, e o campo fica
        oculto para todos os outros.</li>
      <li><strong>Argumentos de inicialização com mais de uma palavra chegavam ao
        emulador como uma só.</strong> <code>--a --b</code> agora chega como dois
        argumentos, e um valor vazio não acrescenta nada. Uma aspa de fechamento faltando
        antes quebrava toda inicialização daquele jogo com um erro do servidor; agora
        mostra uma mensagem dizendo qual campo corrigir. O token
        <code>{disc_paths}</code> foi removido: ele estava sempre vazio.</li>
      <li><strong>Inicializações terminadas se acumulavam na memória até o RetroDB
        reiniciar.</strong> Uma inicialização que terminou há mais de uma hora agora é
        descartada.</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: Escolher um idioma nas Configurações voltou a funcionar
  body: |
