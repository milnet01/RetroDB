- version: 3.23.14
  date: '2026-10-10'
  tags:
  - type: security
    label: Duas bibliotecas incluídas foram atualizadas com correções de segurança publicadas
  body: |
    <ul>
      <li><strong>O urllib3 e o Werkzeug tinham problemas de segurança conhecidos.</strong>
        O RetroDB agora vem com o urllib3 2.8.0 e o Werkzeug 3.1.9, as versões que
        os corrigem. Uma instalação a partir do código-fonte as recebe executando
        <code>install.py</code> de novo, que instala a partir do
        <code>requirements.lock</code>.</li>
    </ul>
- version: 3.23.13
  date: '2026-09-26'
  tags:
  - type: fix
    label: Mídia guardada como caminho de pasta não é mais apontada como ausente
