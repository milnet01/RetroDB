- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Jogue direto das páginas da Biblioteca e de sistema
  body: |
    <ul>
      <li><strong>Um botão ▶ Jogar em cada cartão de jogo.</strong> Ele aparece no
        canto inferior esquerdo da arte da caixa na página da Biblioteca e em
        cada página de sistema. Aperte-o e o jogo inicia no emulador; você
        continua na lista em vez de abrir primeiro a página do jogo.</li>
      <li>O botão só aparece onde apertá-lo pode funcionar: sua conta tem
        permissão para iniciar jogos, e o emulador do jogo está ativado, instalado
        e, no caso do RetroArch, tem o seu núcleo. Jogos em sistemas sem nenhum
        emulador funcionando não mostram o botão.</li>
      <li>Se uma inicialização ainda falhar, por exemplo porque o arquivo de ROM
        foi movido, o motivo aparece em uma mensagem e a página fica como
        estava.</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
