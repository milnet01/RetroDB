  body: |
    <ul>
      <li><strong>O download normal para Windows não conseguia instalar.</strong>
        O instalador parava em "Core dependencies failed to install",
        porque sua lista fixa de pacotes deixava de fora um pacote de que só o
        Windows precisa. A lista agora cobre todas as plataformas. O download para
