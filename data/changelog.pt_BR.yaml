- version: 3.23.10
  date: '2026-09-26'
  tags:
  - type: fix
    label: As páginas de Ferramentas de ROM seguem suas configurações salvas, e as páginas de Logs e de Ferramentas de ROM voltaram a funcionar
  body: |
    <ul>
      <li><strong>A página de Logs e algumas páginas de Ferramentas de ROM estavam quebradas.</strong>
        Um script dessas páginas falhava ao carregar, então o visualizador de log e
        os auxiliares compartilhados de Ferramentas de ROM nunca iniciavam. Agora eles carregam
        direito.</li>
      <li><strong>As configurações de Ferramentas de ROM agora fazem efeito.</strong> O Localizador
        de Duplicatas e o Conversor de CHD abrem com as opções definidas na página de
        configurações de Ferramentas de ROM, e você ainda pode mudá-las para uma única execução.</li>
      <li><strong>Os interruptores do Conversor de CHD eram ignorados.</strong> Desligar
        "Excluir arquivos originais" na página não impedia a exclusão se
        a sua configuração salva mandava excluir. Os interruptores da página agora
        decidem.</li>
      <li><strong>A configuração Caminho Temporário é usada.</strong> Os arquivos preparados
        durante a criação de playlists M3U agora ficam dentro dele.</li>
    </ul>
- version: 3.23.9
  date: '2026-09-26'
  tags:
  - type: security
    label: Os arquivos de log dos buscadores não guardam mais senhas e tokens, e as tentativas de login voltaram a ter limite
  - type: fix
    label: Salvar as configurações não apaga mais suas configurações, e excluir um usuário funciona
  body: |
    <ul>
      <li><strong>Os arquivos de log guardavam segredos em texto puro.</strong> Os arquivos de log
        dos buscadores deveriam esconder tokens de login e chaves de API, mas a etapa
        que os escondia nunca rodava, então eles eram gravados por inteiro. Agora ficam escondidos.
        Arquivos de log antigos ainda os contêm; exclua os arquivos antigos em
        <code>logs/</code> se você compartilha a sua instalação.</li>
      <li><strong>Os limites de tentativas de login não eram aplicados.</strong> Os limites
        para logins repetidos e para ações pesadas (varreduras, buscas de metadados, importações) estavam
        configurados, mas nunca foram ligados. Agora funcionam, e uma solicitação bloqueada
        recebe uma mensagem clara de "muitas tentativas".</li>
      <li><strong>Um arquivo de configurações danificado podia ser apagado.</strong> Se
        <code>data/settings.json</code> não pudesse ser lido, o próximo salvamento
        o substituía pelos valores padrão. O RetroDB agora guarda o arquivo danificado como
        <code>settings.json.corrupt-&lt;time&gt;</code> antes de salvar. Se o
        arquivo voltar a ser lido sem problemas, o salvamento é recusado.</li>
      <li><strong>A linha de nomenclatura Motor perdia outras configurações.</strong> Adicionar uma
        etiqueta à linha Motor nas configurações de nomenclatura falhava, e ainda jogava
        fora as configurações de artigo e de região salvas junto. Agora ela salva
        direito.</li>
      <li><strong>Excluir um usuário falhava.</strong> Um usuário com etiquetas, listas,
        itens na lista de desejos ou dados da PSN não podia ser excluído. Excluir agora remove
        o usuário e tudo o que é dele.</li>
      <li><strong>Duas buscas de metadados podiam rodar ao mesmo tempo.</strong> Trocar ou
        mover na fila uma busca em lote em andamento iniciava duas buscas que
        compartilhavam uma mesma contagem de progresso. Agora só uma roda.</li>
      <li><strong>O progresso da busca em lote podia parecer um erro.</strong>
        Antes do primeiro sucesso, uma busca em lote informava seu status de um jeito que
        algumas telas entendiam como falha. Isso foi corrigido.</li>
      <li><strong>Entrar agora leva você de volta à página que você pediu.</strong>
        Antes, sempre ia para o painel.</li>
      <li><strong>As ações de arquivo do administrador ficam dentro das suas pastas.</strong> A
        ferramenta de redimensionar imagens e as ações de renomear ROMs agora recusam qualquer coisa
        fora da sua pasta de mídia ou da sua pasta de ROMs.</li>
      <li><strong>Arquivos antigos de login da PSN e do Xbox são movidos para a sua
        conta.</strong> Um <code>data/psn_tokens.json</code> ou
        <code>data/xbox_tokens.json</code> que tenha sobrado é carregado na sua conta e
        renomeado para terminar em <code>.migrated-015</code>. Esse arquivo ainda guarda
        o token, então exclua-o depois de confirmar que o login funciona.</li>
      <li><strong>Erros mais claros vindos do servidor.</strong> Uma solicitação inválida agora
        responde com uma mensagem de erro adequada em vez de "Ocorreu um erro
        interno".</li>
    </ul>
- version: 3.23.8
  date: '2026-09-25'
  tags:
  - type: fix
    label: A importação do CLZ voltou a funcionar, as capas das listas aparecem, e várias páginas não quebram mais com um apóstrofo
  - type: security
    label: Nomes buscados e caminhos de arquivo não conseguem mais escapar dos botões da página
  body: |
    <ul>
      <li><strong>A importação do CLZ não fazia nada.</strong> Enviar um PDF do CLZ o mandava
        para um endereço que o servidor não tem, então todo envio falhava com
        "Parse failed". Agora ele chega ao leitor de arquivos.</li>
      <li><strong>As capas na página de uma lista sumiam todas.</strong> A página da lista
        pedia cada capa no endereço errado, e a coluna Sistema ficava
        sempre vazia. Agora as duas aparecem. As imagens de capa na busca "adicionar um
        jogo" da página também foram corrigidas.</li>
      <li><strong>Botões quebravam com nomes que têm apóstrofo.</strong> Remover
        "Assassin's Creed" de uma lista, excluir uma captura de tela, ampliar uma capa
        ou remover uma etiqueta de gênero podia não fazer nada, sem aviso, quando o nome
        tinha um apóstrofo. A mesma falha permitia que um nome buscado feito sob medida rodasse
        código na página. Os nomes agora chegam a esses botões de um jeito que
        não pode ser confundido com código.</li>
      <li><strong>Endereços de imagens e de links são protegidos em todo lugar.</strong> Algumas
        páginas montavam endereços de imagens a partir de nomes de arquivo buscados sem protegê-los,
        e cinco páginas tinham a sua própria cópia, mais fraca, da função
        de proteção. Agora todas usam a compartilhada.</li>
      <li><strong>A página de Configurações podia abrir em branco.</strong> Se a aba que você
        usou por último tivesse sido renomeada por uma atualização, as Configurações abriam sem nenhum painel
        visível. Agora elas ignoram uma aba que não existe mais. Links como
        <code>/settings#account</code> voltam a abrir aquela aba.</li>
      <li><strong>Seu tema agora acompanha você em outros dispositivos.</strong> O
        tema que você escolhe é salvo na sua conta. Um navegador que nunca recebeu
        um tema usa o que você salvou em vez do padrão.</li>
      <li><strong>Os pop-ups de progresso das tarefas mostram o ícone certo.</strong> Tarefas pausadas,
        concluídas e na fila mostravam o mesmo ícone de "em andamento". Agora cada estado
        tem o seu, em cada tema.</li>
      <li><strong>A lista de atalhos de teclado agora pode ser traduzida.</strong> Os
        rótulos dela ficavam invisíveis para as ferramentas de tradução, então continuavam em
        inglês em todos os idiomas.</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: As classificações etárias muitas vezes estavam erradas, e jogos buscados podiam perder seus detalhes
  body: |
    <ul>
      <li><strong>As classificações etárias muitas vezes estavam erradas, e o erro se espalhava.</strong>
        Quando uma classificação vinha do TheGamesDB, o aplicativo procurava o código da classificação
        em qualquer lugar do texto em vez de lê-lo direito &mdash; então
        "T - Teen", "M - Mature 17+", "AO - Adults Only 18+" e
        "RP - Rating Pending" eram todos guardados com a classificação errada, e um jogo
        Mature podia ser registrado como adequado para todos. Pior, essa classificação errada
        era depois usada para preencher os outros oito sistemas de classificação, então uma leitura
        errada se espalhava por todos. As classificações agora são lidas a partir do código no
        início do texto.</li>
      <li><strong>As classificações convertidas saíam brandas demais.</strong> Ao preencher
        uma classificação que faltava a partir de uma que você já tinha, o aplicativo podia usar uma
        classificação que ele próprio tinha calculado momentos antes, em vez da que você
        realmente tinha no começo. Cada passo perdia um pouco de rigor. Agora ele sempre
        converte a partir das classificações que o jogo realmente tem.</li>
      <li><strong>A Rebusca Completa apagava a Região e o Tipo de Save escolhidos à mão.</strong>
        Nenhum dos dois vem de um buscador &mdash; o aplicativo os deduz
        &mdash; então uma Rebusca Completa trocava o seu "Japão" escolhido com cuidado pelo
        padrão "EUA". Seus valores agora são mantidos, a menos que uma fonte de fato
        forneça um novo.</li>
      <li><strong>Um buscador podia aceitar o jogo errado.</strong> Os resultados do ScreenScraper
        normalmente são conferidos com uma pontuação de correspondência antes de serem usados,
        mas uma busca que retornava exatamente um resultado pulava essa verificação por completo.
        Agora todo resultado recebe pontuação.</li>
      <li><strong>Um jogo podia perder todos os detalhes buscados por causa de um único campo
        faltando.</strong> Se o IGDB ou o ScreenScraper deixasse um único campo em branco de um jeito
        inesperado, a atualização inteira era descartada &mdash; editora,
        desenvolvedora, arte e tudo mais. Esses casos agora são tratados e o restante
        dos detalhes é mantido.</li>
      <li><strong>Uma imagem com falha podia ser registrada como sucesso.</strong> Se uma
        imagem baixada acabasse não sendo uma imagem utilizável, o aplicativo não excluía
        nada e ainda assim salvava o nome do arquivo, deixando uma referência quebrada. O
        arquivo agora é removido e o campo fica como estava.</li>
      <li><strong>Os modos de jogo agora usam termos consistentes.</strong> Buscadores
        diferentes escreviam "Single-player" e "Single-Player" e um simples
        "Multiplayer" que não era um dos rótulos do próprio aplicativo, então esses jogos
        não podiam ser traduzidos nem encontrados pelo filtro Modos. Todas as fontes agora
        escrevem os mesmos rótulos. Os jogos existentes mantêm os termos antigos até você
        buscar os metadados de novo ou rodar a ferramenta de normalização nas Configurações.</li>
      <li><strong>As consultas ao Xbox agora se comportam como as de qualquer outra fonte.</strong> Elas
        faziam as próprias requisições à web, então não tentavam de novo quando o Xbox Live
        pedia para irem mais devagar, e não tinham limite para a quantidade de dados que uma resposta podia
        trazer. Agora usam a mesma conexão compartilhada que os outros
        buscadores.</li>
      <li><strong>Código do ScreenScraper sem uso foi removido.</strong> Duas funções
        que nada no aplicativo chamava foram excluídas. Uma delas retornava um endereço
        web com a sua senha do ScreenScraper dentro, o que entregaria a
        senha a qualquer coisa que a usasse. O "System Media
        Endpoint" citado nas notas da versão 3.6.x era uma delas &mdash;
        nunca foi acessível de nenhum lugar do aplicativo.</li>
    </ul>
- version: 3.23.5
  date: '2026-09-02'
  tags:
  - type: fix
    label: O download empacotado não conseguia iniciar, e outras correções da compilação
  body: |
    <ul>
      <li><strong>O download Standalone não conseguia iniciar de jeito nenhum.</strong> A
        versão empacotada traz o seu próprio Python, mas o iniciador dentro dela era
        o feito para a instalação a partir do código-fonte &mdash; ele procurava
        arquivos Python que uma versão empacotada não contém, e parava na
        primeira linha. O pacote agora vem com o seu próprio iniciador, que simplesmente roda
        o aplicativo e abre o seu navegador assim que o servidor está no ar.</li>
      <li><strong>O atalho da área de trabalho no download para Linux não iniciava
        nada.</strong> Ele vinha com um texto provisório onde deveria estar o caminho para
        o aplicativo. Agora há um <code>install-launcher.sh</code>
        ao lado do iniciador &mdash; execute-o uma vez e o atalho é criado
        com o caminho real de onde você o descompactou.</li>
      <li><strong>Iniciar a partir do código-fonte instalava dependências sem
        verificação.</strong> Quando o Flask faltava, o script de inicialização baixava
        pacotes direto da internet sem conferir a soma de verificação, e passava por cima
        do gerenciador de pacotes do seu sistema no caminho. Agora ele passa a tarefa para o
        <code>install.py</code>, que usa o arquivo de bloqueio com somas de verificação.</li>
      <li><strong>O download do código-fonte trazia arquivos do mantenedor que não
        deveria.</strong> A lista do que deixar de fora era mantida à mão e
        tinha ficado desatualizada, então saídas de auditoria e pastas de compilação que sobraram
        estavam sendo empacotadas junto com o aplicativo. O download agora é montado a partir da lista
        dos arquivos que de fato estão no projeto, que não tem como ficar desatualizada.</li>
      <li><strong>Dois painéis das Configurações quebravam na versão empacotada.</strong> Os
        painéis de estatísticas da biblioteca e de status das APIs procuravam o programa principal por
        um nome que ele não tem dentro de uma versão empacotada, então os dois falhavam.</li>
      <li><strong>Alguns textos da tela nunca podiam ser traduzidos.</strong> Três
        partes mais novas do aplicativo &mdash; as configurações de emuladores, o botão de iniciar
        e a barra "jogando agora" &mdash; ficavam de fora da varredura de
        tradução, e a verificação feita para pegar isso olhava a mesma
        lista incompleta. A varredura agora cobre todos os arquivos automaticamente, e
        os textos delas foram adicionados às traduções.</li>
      <li><strong>Recompilar as traduções podia, sem aviso, não fazer nada.</strong>
        Adicionar texto a um script de uma página específica deixava a recompilação convencida de que
        não havia nada a fazer, então o texto novo nunca chegava ao arquivo de
        tradução.</li>
      <li><strong>Um ajuste para uma placa de vídeo era aplicado a todos.</strong>
        O script de inicialização do Linux forçava uma configuração feita para uma placa AMD específica
        em todas as máquinas, o que podia travar o ampliador de imagens em outro hardware
        AMD. Agora ela só é aplicada quando essa placa está de fato presente, e
        nunca substitui um valor que você mesmo definiu.</li>
      <li><strong>O script de lançamento podia publicar a versão errada.</strong>
        Uma tag que sobrou de uma tentativa anterior era reaproveitada sem aviso, então a
        compilação podia ser feita a partir de uma versão mais antiga enquanto informava
        sucesso.</li>
    </ul>
- version: 3.23.4
  date: '2026-09-02'
  tags:
  - type: fix
    label: Nove formas de a sua biblioteca perder dados, eliminadas
  body: |
    <ul>
      <li><strong>"Limpar dados buscados" limpava a sua biblioteca inteira.</strong> A
        caixa de confirmação contava só os jogos que realmente tinham passado pela busca de metadados,
        e depois a ação apagava todos os jogos mesmo assim &mdash; então podia
        prometer uma dúzia e limpar milhares. Com imagens ativadas, ela também
        excluía capas que você tinha enviado à mão e redefinia títulos que você tinha
        editado, em jogos que nunca passaram pela busca. Agora ela faz
        exatamente o que a caixa diz.</li>
      <li><strong>A arte 3D da caixa deixava para trás um link quebrado.</strong> Limpar com
        imagens excluía a capa 3D do disco, mas o banco de dados continuava apontando para
        ela, então o aplicativo procurava um arquivo que não existia mais.</li>
      <li><strong>O interruptor "Anexar" da Edição em Lote substituía em vez de acrescentar.</strong>
        Em Perspectiva e Dimensão ele fazia exatamente o contrário do seu rótulo,
        sobrescrevendo os valores existentes em todos os jogos selecionados de uma vez, sem
        como desfazer.</li>
      <li><strong>As versões standalone podiam apagar todas as referências de imagens em um
        clique.</strong> No download empacotado, o aplicativo procurava a sua mídia
        no lugar errado, concluía que todas as imagens estavam faltando, e
        "limpar referências de mídia ausente" então esvaziava as entradas de arte, captura de tela,
        vídeo e manual da biblioteca inteira. A verificação de segurança que
        existe justamente para pegar isso não conseguia ver o problema. Só a versão empacotada
        foi afetada.</li>
      <li><strong>A limpeza de arquivos órfãos podia excluir arte enquanto ela chegava.</strong>
        Uma capa baixada enquanto a limpeza rodava podia ser tratada como
        órfã e removida.</li>
      <li><strong>A criação de playlists movia os seus arquivos compactados sem perguntar.</strong>
        Criar playlists M3U em lote tirava do lugar os seus arquivos compactados originais mesmo
        quando você tinha deixado essa opção desligada &mdash; e, quando você pedia isso,
        informava uma falha numa movimentação que tinha dado certo.</li>
      <li><strong>O redimensionador de imagens estava inchando a sua pasta de mídia.</strong> Ele
        tratava as miniaturas pequenas que ele mesmo gera como imagens novas a ampliar,
        aumentando-as para o tamanho total e depois fazendo miniaturas delas. Cada
        execução adicionava mais arquivos, as páginas passavam, sem aviso, a servir imagens em tamanho total no lugar de
        miniaturas, e o ampliador com IA rodava em cerca de três vezes o número
        previsto de arquivos.</li>
      <li><strong>O preenchimento com IA sobrescrevia detalhes que você tinha corrigido.</strong> Em uma
        busca de metadados normal, ele podia substituir a sua própria editora, desenvolvedora, gênero, classificações
        etárias e mais. Agora ele só preenche campos vazios; o botão Preencher com AI que você mesmo aperta
        não mudou.</li>
      <li><strong>Buscas repetidas podiam excluir uma boa captura de tela.</strong> Jogos
        buscados no RAWG reaproveitavam os mesmos nomes de arquivo, então uma segunda busca
        sobrescrevia uma captura de tela guardada e depois a removia como duplicata, enquanto a
        biblioteca ainda a listava.</li>
    </ul>
- version: 3.23.3
  date: '2026-09-01'
  tags:
  - type: fix
    label: As funções da casa agora fazem exatamente o que dizem, e uma conta desativada fica de fato bloqueada
  body: |
    <ul>
      <li><strong>Desativar alguém agora encerra a sessão dessa pessoa.</strong> Desligar
        uma conta a escondia de todas as telas, mas quem já estava conectado
        nessa conta continuava usando normalmente por até uma semana. A desativação
        é a única forma de bloquear alguém sem excluí-lo, então agora ela
        vale já no próximo clique da pessoa.</li>
      <li><strong>Contas somente leitura não podem mais alterar dados de jogos.</strong>
        Três ações de "how long to beat" estavam abertas a todos que tinham entrado,
        incluindo quem só podia visualizar &mdash; então uma conta somente leitura podia sobrescrever um
        tempo de jogo, ou apagá-lo de todos os jogos da biblioteca. Agora elas exigem
        permissão de edição, como todas as outras ações que alteram um jogo.</li>
      <li><strong>O rastreador de troféus voltou a funcionar para todos.</strong>
        Atualizar os seus próprios troféus de colecionador exigia permissão de editor, que as
        funções Jogador e Visualizador não têm &mdash; e é a única coisa que
        grava esses troféus. Essas contas nunca conseguiam ganhar um, e o botão
        Atualizar só mostrava um erro. É o seu próprio progresso, então agora
        não exige nenhuma permissão especial.</li>
      <li><strong>A atualização do PlayStation de uma pessoa não pode mais ser interrompida
        por outra.</strong> Qualquer conta conectada podia pausar ou cancelar uma
        atualização que outra pessoa tinha iniciado, e podia ver em qual jogo essa pessoa
        estava. As duas coisas agora ficam restritas a quem a iniciou.</li>
      <li><strong>As importações do Steam usam a sua própria conta, não a de quem salvou a dela
        primeiro.</strong> A importação da biblioteca lia uma única cópia compartilhada das credenciais
        do Steam em vez das suas, então podia buscar a biblioteca de outra
        pessoa &mdash; enquanto os seus próprios dados salvos pareciam estar faltando.</li>
      <li><strong>Adivinhar a senha de um administrador voltou a ser difícil.</strong> O limite
        de tentativas de login com falha era compartilhado por todos na rede,
        então qualquer pessoa com conta própria podia zerá-lo entrando e continuar
        tentando sem parar. O limite agora é por conta.</li>
      <li><strong>Os erros do aplicativo agora chegam à página em vez de sumir.
        </strong> Quando uma ação era recusada, 115 delas respondiam em um formato que a
        página não conseguia ler, então parecia que a ação tinha funcionado. Agora elas
        informam a recusa direito, e você vê a mensagem real.</li>
    </ul>
- version: 3.23.2
  date: '2026-08-06'
  tags:
  - type: fix
    label: As páginas de configuração dos buscadores carregam mais rápido e nunca mostram uma chave de API desatualizada
  body: |
    <ul>
      <li><strong>As páginas de Configurações e de configuração dos buscadores param de reler o
        arquivo de configurações dos buscadores a cada solicitação.</strong> Quatro lugares
        abriam e reinterpretavam o arquivo do disco toda vez que uma página ou verificação rodava,
        embora já existisse um leitor compartilhado com cache. Agora todos o usam,
        então essas páginas fazem menos trabalho a cada visita.</li>
      <li><strong>Salvar continua valendo na hora.</strong> Um cache que
        esquece com base em um temporizador poderia mostrar os valores antigos por até meio
        minuto depois de salvar. Cada salvamento agora limpa o cache ao gravar,
        então o que você vê é o que você acabou de salvar.</li>
      <li><strong>Suas chaves de API reais não podem mais ser substituídas pelo próprio
        valor mascarado exibido.</strong> As páginas de configurações mostram as chaves salvas como
        <code>***1234</code> em vez do valor real. Como a página
        recebia a mesma cópia das configurações que os buscadores usam, esse mascaramento
        poderia sobrescrever as chaves verdadeiras na memória e deixar os buscadores
        fazendo login com asteriscos até o cache expirar.</li>
      <li><strong>As versões standalone agora procuram as configurações dos buscadores no lugar
        certo.</strong> Os buscadores calculavam a localização do arquivo de um jeito diferente
        das páginas que o salvam. Em uma instalação normal, os dois chegavam ao
        mesmo arquivo; em uma versão standalone (de clique duplo), não chegariam,
        então as chaves de API salvas poderiam ir parar num lugar onde os buscadores nunca
        procuravam.</li>
    </ul>
- version: 3.23.1
  date: '2026-08-06'
  tags:
  - type: fix
    label: A porta do servidor que você salva nas Configurações agora é a porta que ele usa
  body: |
    <ul>
      <li><strong>Salvar uma porta do servidor de fato muda o servidor de lugar.</strong>
        As Configurações aceitavam uma porta, a conferiam, a salvavam e diziam que era preciso reiniciar
        para aplicá-la &mdash; e depois o servidor iniciava na 5000 mesmo assim.
        Nada nunca lia o valor de volta. Agora ele faz parte da sequência de inicialização,
        então reiniciar realmente leva o RetroDB para a porta que você escolheu. O que estiver
        definido no ambiente continua tendo prioridade, então um iniciador ou contêiner que
        atribui uma porta não é afetado.</li>
      <li><strong>Duas configurações que nunca fizeram nada foram removidas
        em vez de consertadas.</strong> "Host do servidor" e "modo de depuração" eram
        guardados e faziam a mesma falsa promessa. Ligar o modo de depuração a partir de
        um formulário web exporia um console Python interativo no
        navegador, e o endereço de escuta controla quais máquinas conseguem acessar
        o RetroDB &mdash; nenhum dos dois deve ficar atrás de um formulário de configurações. Os dois continuam
        configuráveis pelo ambiente, onde já estavam. Se o seu
        arquivo de configurações ainda os contém, eles são descartados sem aviso ao carregar;
        não há nada a fazer.</li>
      <li><strong>Nada mais promete que reiniciar vai aplicar algo, a menos que reiniciar
        aplique.</strong> Esse era o defeito real &mdash; uma configuração sem efeito é
        desleixo, mas uma falsa promessa desperdiça uma tarde.</li>
    </ul>
- version: 3.23.0
  date: '2026-08-06'
  tags:
  - type: enhancement
    label: Inicie o RetroDB numa porta escolhida por outra ferramenta
  body: |
    <ul>
      <li><strong>O RetroDB agora lê uma configuração <code>PORT</code> do seu
        ambiente.</strong> Se você inicia o RetroDB a partir de outra ferramenta &mdash; um
        painel, um contêiner, um painel de servidor doméstico &mdash; essa ferramenta agora pode
        passar ao RetroDB a porta em que quer que ele rode, sem ninguém editar um arquivo.
        Defina <code>PORT</code> e o RetroDB usa essa porta; deixe como está e
        nada muda. O <code>RETRODB_PORT</code> que já existia continua
        funcionando exatamente como antes, e <code>PORT</code> tem prioridade se os dois estiverem definidos.</li>
      <li><strong>Um número de porta inválido agora é avisado em vez de adivinhado.</strong>
        Antes, uma porta ilegível produzia uma parede de texto de erro do Python, e
        uma porta fora da faixa utilizável só era descoberta quando o servidor
        não conseguia iniciar. O RetroDB agora para na hora com uma linha dizendo o
        valor que não pôde usar. Ele nunca vai iniciar sem aviso em uma porta diferente
        da que foi pedida &mdash; ser mudado de lugar sem aviso é pior do que
        ouvir um não.</li>
      <li><strong>O aviso de inicialização e a aba do navegador seguem a porta
        real.</strong> O endereço exibido quando o RetroDB inicia, e a página que ele
        abre para você, diziam 5000 não importando qual porta estivesse de fato
        em uso.</li>
    </ul>
- version: 3.22.1
  date: '2026-07-31'
  tags:
  - type: fix
    label: Evita que o arquivo de trabalho do banco de dados cresça sem limite
  body: |
    <ul>
      <li><strong>O journal do banco de dados voltou a ter limite.</strong> O SQLite mantém um arquivo de trabalho (o arquivo <code>-wal</code>) ao lado do banco da sua biblioteca. O RetroDB pretendia limitá-lo a 64&nbsp;MB, mas o limite só era aplicado às tarefas em segundo plano &mdash; carregamentos de página e edições comuns rodavam sem limite algum. Depois de uma gravação excepcionalmente grande, o arquivo ficava para sempre no seu tamanho máximo, às vezes maior que o próprio banco. Agora o limite vale em todo lugar, e o espaço é devolvido.</li>
    </ul>
- version: 3.22.0
  date: '2026-07-05'
  tags:
  - type: enhancement
    label: Busque metadados de um jogo direto do seu pop-up, sem o passo extra
  body: |
    <ul>
      <li><strong>Buscar metadados pelo pop-up do jogo.</strong> O pop-up rápido
        do jogo (aquele que aparece quando você clica em um jogo na sua
        Biblioteca) agora tem um botão <strong>Buscar Metadados</strong> ao lado
        de Preencher com AI e Editar. Clique nele e o RetroDB leva você direto
        para aquele jogo com a busca de metadados já aberta &mdash; sem mais abrir
        a página completa e procurar primeiro o botão Buscar Metadados.</li>
    </ul>
- version: 3.21.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Iniciar com um clique — abra o RetroDB por um ícone fixado, sem terminal
  - type: feature
    label: Um ícone de verdade — controle neon na aba do navegador e na barra de tarefas
  - type: feature
    label: Novo botão Desligar Servidor na página de Configurações
  body: |
    <ul>
      <li><strong>Inicie com um clique.</strong> O RetroDB agora tem um
        iniciador de verdade que você pode fixar na barra de tarefas &mdash;
        clique nele e o aplicativo inicia (se ainda não estiver em execução) e
        abre no seu navegador automaticamente. Sem mais abrir um terminal e
        digitar um comando. No Linux, execute
        <code>python3 scripts/install_launcher.py</code> uma vez para adicionar
        &ldquo;RetroDB&rdquo; ao seu menu de aplicativos e depois fixe-o.</li>
      <li><strong>Um ícone de verdade.</strong> O RetroDB agora exibe um ícone
        de controle neon &mdash; ciano e magenta estilo cyberpunk sobre um azulejo
        escuro &mdash; na aba do seu navegador (o favicon), no iniciador da barra
        de tarefas e no próprio programa do Windows. Ele substitui o simples
        emoji provisório.</li>
      <li><strong>Botão Desligar Servidor.</strong> Os Controles do Servidor na
        página de Configurações agora têm um botão vermelho <strong>Desligar
        Servidor</strong> ao lado de Reiniciar. Ele encerra o aplicativo de forma
        limpa (deixando que qualquer tarefa em andamento termine de salvar
        primeiro), então você não precisa mais alternar para o terminal e
        pressionar Ctrl+C.</li>
      <li><strong>As versões para download abrem o navegador para você.</strong>
        Os downloads prontos para uso do Windows, Mac e Linux agora abrem seu
        navegador um instante após iniciar, então o aplicativo fica à sua frente
        sem nenhum passo extra.</li>
    </ul>
- version: 3.20.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Onze novos idiomas — o RetroDB agora fala 21 idiomas
  - type: fix
    label: 'Corrigido um erro inofensivo no console ao sair da lista de jogos'
  body: |
    <ul>
      <li><strong>Onze novos pacotes de idiomas.</strong> A interface, as notas de
        lançamento e o manual de Ajuda do RetroDB agora estão traduzidos para
        <strong>Afrikaans, isiZulu, isiXhosa, Dutch, Norwegian (Bokm&aring;l),
        Russian, Polish, Turkish, Ukrainian, Indonesian e Hebrew</strong>
        &mdash; juntando-se ao alemão, espanhol, francês, italiano, japonês,
        coreano, português brasileiro e chinês simplificado &amp; tradicional já
        existentes. Escolha o seu em Configurações &rarr; Preferências de Exibição
        &rarr; Idioma; o app é recarregado no idioma escolhido.</li>
      <li>Cada idioma cobre o app inteiro: cada botão, rótulo e mensagem,
        todo o histórico de notas de lançamento, e o manual de Ajuda completo.</li>
      <li><strong>isiZulu &amp; isiXhosa</strong> também estão incluídos. Por serem
        idiomas com pouco vocabulário técnico já estabelecido, eles mantêm termos
        técnicos comuns (ROM, scraper, box art) em inglês quando não existe uma
        palavra natural &mdash; uma revisão por um falante nativo é bem-vinda antes
        de confiar neles.</li>
      <li><strong>Hebrew</strong> chega com o texto totalmente traduzido; um layout
        de página da direita para a esquerda mais refinado (para que a interface
        seja espelhada corretamente) vem em uma atualização futura. O Arabic virá
        assim que esse trabalho de layout estiver pronto.</li>
      <li><strong>Correção:</strong> sair da Biblioteca ou da lista de jogos de um sistema não registra mais um &ldquo;ReferenceError&rdquo; inofensivo no console do navegador (resto de uma limpeza anterior). Nenhum efeito visível &mdash; só um console mais limpo.</li>
    </ul>
- version: 3.19.1
  date: '2026-07-05'
  tags:
  - type: performance
    label: Coleta mais rápida — as capturas de tela de um jogo agora baixam ao mesmo tempo
  body: |
    <ul>
      <li><strong>As capturas de tela baixam em paralelo.</strong> Seguindo a mesma
        abordagem do popular frontend ES-DE (que busca toda a mídia de um
        jogo de uma só vez), o RetroDB agora baixa as capturas de tela de um
        jogo <strong>simultaneamente</strong> em vez de uma após a outra,
        para todas as fontes (TheGamesDB, IGDB, RAWG, ScreenScraper). Jogos com
        várias capturas de tela terminam visivelmente mais rápido.</li>
      <li>A verificação de capturas duplicadas ainda é feita depois, em ordem, então
        a remoção de imagens repetidas continua exatamente tão precisa quanto antes &mdash; só
        o download foi acelerado. Os downloads são limitados a quatro por vez para que
        uma única fonte nunca fique sobrecarregada.</li>
      <li>Melhoria de velocidade nos bastidores; passa a valer após a próxima reinicialização.</li>
    </ul>
- version: 3.19.0
  date: '2026-07-05'
  tags:
  - type: performance
    label: Coleta mais rápida — as fontes agora são consultadas ao mesmo tempo
  body: |
    <ul>
      <li><strong>A coleta é mais rápida por jogo.</strong> Quando o RetroDB busca um
        jogo, ele consulta vários bancos de dados (ES-DE, TheGamesDB, IGDB, RAWG,
        ScreenScraper). Antes ele os consultava <em>um de cada vez</em> e
        esperava a resposta de cada um antes de consultar o próximo &mdash; então a espera era
        a soma de todos eles. Agora ele consulta todos <strong>de uma vez</strong> e
        espera apenas pelo mais lento, o que representa uma aceleração perceptível em cada jogo.
        Os resultados continuam sendo ordenados e pontuados exatamente como antes.</li>
      <li><strong>Menos negociações desperdiçadas ao baixar imagens.</strong> Os downloads
        de imagens agora reutilizam uma conexão já aberta em vez de abrir uma nova
        para cada imagem, economizando tempo em jogos com muitas
        capturas de tela.</li>
      <li>São melhorias de velocidade nos bastidores &mdash; nada muda na
        forma como você usa o RetroDB, e não sobrecarrega mais os
        bancos de dados (as mesmas requisições, apenas sobrepostas). Passam a valer após a próxima reinicialização.</li>
    </ul>
- version: 3.18.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Adicionada a classificação etária da China (Continental) como 9º sistema de classificação
  body: |
    <ul>
      <li><strong>Novo sistema de classificação etária: China (CADPA).</strong> O RetroDB agora
        oferece suporte ao esquema oficial chinês de aviso de idade para jogos
        (&ldquo;网络游戏适龄提示&rdquo;, emitido pela CADPA) ao lado dos oito órgãos
        já existentes (ESRB, PEGI, CERO, USK, ACB, FPB, GRAC e ClassInd). Ele usa
        três faixas &mdash; <strong>8+</strong>, <strong>12+</strong> e
        <strong>16+</strong> &mdash; exibidas com um selo verde simples.</li>
      <li><strong>Ele se preenche sozinho, como os outros.</strong> Quando um jogo já
        tem uma classificação de qualquer outro país, o RetroDB calcula a faixa
        correspondente da China automaticamente (e vice-versa). Você também pode escolhê-la ou alterá-la manualmente
        na tela de Edição de um jogo, e defini-la como seu sistema de exibição preferido
        em Configurações &rarr; Biblioteca. Observação: a maioria dos bancos de dados de jogos ocidentais
        não publica uma classificação da China, então, para jogos sem classificação em lugar nenhum, ela
        é preenchida a partir do conteúdo do jogo durante a coleta / AI Fill.</li>
      <li>Os selos verdes são a arte simples do próprio RetroDB (seguindo o
        estilo da casa dos outros órgãos), não o logotipo oficial da CADPA, então não
        há nenhuma amarra de licenciamento de imagem.</li>
    </ul>
- version: 3.17.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Limpa as referências do banco de dados para arquivos de mídia que sumiram do disco
  - type: security
    label: Protege contra apagar todas as artes da sua biblioteca quando uma pasta de mídia desaparece
  body: |
    <ul>
      <li><strong>Nova ferramenta de manutenção: &ldquo;Referências de Mídia Ausentes&rdquo;</strong>
        (Configurações &rarr; Sistema &rarr; Manutenção). É a imagem espelhada da
        limpeza de &ldquo;Mídia Órfã&rdquo; já existente: em vez de encontrar
        arquivos de imagem sobrando sem jogo, ela encontra jogos cuja arte da caixa,
        caixa 3D, capturas de tela, fanart, vídeo ou manual apontam para arquivos que
        não estão mais no disco. Faça a varredura e limpe essas referências obsoletas
        com um clique, para que as fontes possam baixar a arte novamente. Os próprios
        registros dos seus jogos nunca são tocados.</li>
      <li><strong>Limpeza automática mais segura durante a coleta.</strong> Quando o
        RetroDB refaz a coleta de um jogo, ele limpa discretamente as referências a
        arquivos de mídia que sumiram do disco. Antes, se uma pasta de mídia inteira
        desaparecesse de uma vez &mdash; um disco externo desconectado, ou uma exclusão
        em massa &mdash; essa limpeza podia apagar o registro de qual arte milhares de
        jogos tinham, forçando coletas novas e custosas. O RetroDB agora reconhece esse
        sinal: se uma pasta de mídia está ausente ou completamente vazia, ele mantém as
        referências e registra um aviso em vez de apagá-las. A nova ferramenta de
        manutenção aplica a mesma proteção e sinaliza claramente qualquer pasta que ela
        tenha preservado.</li>
    </ul>
- version: 3.16.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Novo painel de "Correções Rápidas" no painel principal
  body: |
    <ul>
      <li><strong>Um novo painel de &ldquo;Correções Rápidas&rdquo; no Painel Principal</strong>
        transforma tarefas espalhadas da biblioteca em uma lista de afazeres à primeira
        vista. Ele mostra quantos jogos ainda estão sem arte da caixa e oferece atalhos
        de um clique para encontrar ROMs duplicadas e verificar caminhos de ROM quebrados
        (jogos cujos arquivos foram movidos ou excluídos). Cada atalho leva direto à
        página que resolve o problema. O painel aparece assim que você tem jogos na sua
        biblioteca.</li>
    </ul>
- version: 3.15.0
  date: '2026-07-03'
  tags:
  - type: accessibility
    label: Leitores de tela agora anunciam o progresso das tarefas em voz alta
  body: |
    <ul>
      <li><strong>Tarefas demoradas agora anunciam seu progresso para leitores
        de tela.</strong> Durante uma coleta em massa, uma sincronização de
        conquistas (RetroAchievements ou PlayStation) ou um redimensionamento de
        imagens, quem usa leitor de tela não ouvia nada entre
        &ldquo;iniciado&rdquo; e &ldquo;concluído&rdquo;. Agora o RetroDB anuncia
        marcos periódicos (por exemplo, &ldquo;12 de 40&rdquo;) e a conclusão,
        sem janelas extras na tela. Os anúncios têm um ritmo que informa sem
        cansar e seguem o idioma que você escolheu.</li>
    </ul>
- version: 3.14.0
  date: '2026-07-01'
  tags:
  - type: feature
    label: Novos idiomas — chinês (simplificado e tradicional) agora disponível
  body: "<ul>\n  <li><strong>O RetroDB agora está disponível em chinês.</strong> Há duas opções\n    em <strong>Configurações &rarr; Sistema &rarr; Idioma</strong>:\n    <strong>中文 (简体)</strong> (simplificado, para a China continental) e\n    <strong>中文 (繁體)</strong> (tradicional, para Hong Kong e Taiwan). Toda a\n    interface &mdash; menus, botões, mensagens e o manual de ajuda integrado\n    &mdash; está traduzida, e tudo o que ainda não foi traduzido recorre\n    discretamente ao inglês. Com isso, os idiomas suportados chegam a dez\n    (inglês, alemão, espanhol, francês, italiano, japonês, português brasileiro,\n    coreano e agora chinês simplificado &amp; tradicional).</li>\n</ul>\n"
- version: 3.12.0
  date: '2026-06-30'
  tags:
  - type: feature
    label: Novo idioma — o coreano (한국어) agora está disponível
  body: |
    <ul>
      <li><strong>O RetroDB agora está disponível em coreano (한국어).</strong>
        Selecione-o em Configurações &rarr; Sistema &rarr; Idioma. Toda a
        interface &mdash; menus, botões, mensagens e o manual de ajuda integrado
        &mdash; está traduzida, elevando para oito os idiomas suportados
        (inglês, alemão, espanhol, francês, italiano, japonês, português do
        Brasil e coreano). O coreano completa a cobertura de todos os órgãos de
        classificação etária exibidos pelo RetroDB, incluindo o GRAC da Coreia
        do Sul.</li>
    </ul>
- version: 3.11.0
  date: '2026-06-30'
  tags:
  - type: enhancement
    label: Apoie o RetroDB no Patreon — novo link de doação adicionado
  body: |
    <ul>
      <li><strong>Agora você pode apoiar o RetroDB no Patreon.</strong> Um link
        do Patreon fica ao lado do botão existente «Patrocinar no GitHub» em
        <strong>Configurações &rarr; Sistema &rarr; Apoiar o
        desenvolvimento</strong>, no painel Sobre e no README do projeto. O
        RetroDB continua totalmente gratuito e de código aberto &mdash; as
        doações são totalmente opcionais e simplesmente ajudam a manter o
        desenvolvimento solo.</li>
    </ul>
- version: 3.10.0
  date: '2026-06-26'
  tags:
  - type: enhancement
    label: O registro de alterações agora carrega mais rápido com um botão "Carregar mais"
  body: "<ul>\n  <li><strong>A página do registro de alterações agora abre muito mais rápido.</strong>\n    Em vez de desenhar todo o histórico de versões (centenas de entradas) toda vez que\n    você a abre, o RetroDB agora mostra as 20 entradas mais recentes e adiciona um botão\n    <strong>Carregar mais</strong> no final. Clique nele para revelar o próximo lote, e\n    assim por diante &mdash; o histórico mais antigo continua todo lá, ele apenas carrega\n    sob demanda em vez de deixar a primeira visualização lenta.</li>\n</ul>\n"
- version: 3.9.0
  date: '2026-06-17'
  tags:
  - type: feature
    label: Manual de ajuda e notas das versões recentes agora traduzidos para os 6 idiomas
  body: "<ul>\n  <li><strong>O manual de Ajuda completo dentro do aplicativo agora está disponível nos\
    \ seis\n    idiomas</strong> &mdash; alemão, francês, espanhol, italiano, japonês\n    e português\
    \ do Brasil &mdash; não apenas em inglês. O RetroDB mostra o\n    manual no idioma que você escolheu\
    \ nas Configurações e recorre discretamente\n    ao inglês caso algo ainda não esteja traduzido.</li>\n\
    \  <li><strong>Este Changelog agora também aparece no seu idioma</strong> nas\n    versões mais recentes,\
    \ e as novas versões serão traduzidas a partir de agora.\n    O histórico mais antigo permanece em\
    \ inglês.</li>\n  <li><strong>A página da Lista de Desejos e os últimos resquícios de texto em inglês</strong>\n\
    \    &mdash; um conjunto de mensagens pop-up de erro e de status que tinham passado batido\n    quando\
    \ os pacotes de idioma chegaram na 3.8.0 &mdash; agora são traduzidos\n    corretamente em todo o\
    \ aplicativo.</li>\n</ul>\n"
- version: 3.8.2
  date: '2026-06-17'
  tags:
  - type: security
    label: Atualização de dependência de segurança + correções de CI
  body: "<ul>\n  <li><strong>Segurança:</strong> atualizamos a biblioteca <code>cryptography</code>\n\
    \    embarcada (47 → 49) para resolver um aviso publicado (GHSA-537c-gmf6-5ccf).\n    Sem mudança\
    \ de comportamento — apenas uma versão mais segura.</li>\n  <li>Corrigimos a esteira de testes automatizados:\
    \ um auxiliar usado só nos testes\n    que estava faltando (<code>beautifulsoup4</code>) vinha falhando\
    \ a execução dos testes desde a v3.7.0,\n    e o novo script de empacotamento disparava uma verificação\
    \ de análise estática que é\n    um falso-positivo conhecido (ele executa comandos de build confiáveis,\
    \ não entrada do usuário)\n    — agora documentado e calibrado. Apenas manutenção; nada muda no\n\
    \    aplicativo em si.</li>\n</ul>\n"
- version: 3.8.1
  date: '2026-06-17'
  tags:
  - type: improvement
    label: Opção de download menor, organização das doações e correção de tradução (Pass 46.3 / 47.6)
  body: "<ul>\n  <li><strong>Um download muito menor está a caminho.</strong> A\n    versão pronta para\
    \ usar do tipo \"é só descompactar e clicar duas vezes\" do RetroDB agora pode ser\n    gerada em\
    \ uma variante <strong>somente CPU</strong> (~600&nbsp;MB) para quem\n    não tem uma placa de vídeo\
    \ AMD &mdash; cerca de um sexto do tamanho da versão\n    completa. As duas serão oferecidas lado\
    \ a lado para você escolher a que\n    combina com a sua máquina.</li>\n  <li><strong>O painel \"\
    Apoie o Desenvolvimento\" nas Configurações agora é traduzido</strong>\n    junto com o resto do aplicativo\
    \ &mdash; ele tinha sido deixado por acidente em\n    inglês quando os pacotes de idioma chegaram\
    \ na 3.8.0.</li>\n  <li>Organizamos os links de doação (selo do GitHub Sponsors no README; o\n   \
    \ arquivo de financiamento está pronto para o Patreon e o Buy&nbsp;Me&nbsp;A&nbsp;Coffee assim que\n\
    \    forem configurados). Sem telas insistentes pedindo dinheiro, nunca.</li>\n  <li>Nos bastidores:\
    \ a esteira de lançamento agora consegue gerar as versões\n    prontas para usar para Windows, macOS\
    \ e Linux automaticamente. Observação: o longo\n    manual de <em>Ajuda</em> dentro do aplicativo\
    \ ainda está somente em inglês por enquanto &mdash; isso está\n    registrado como trabalho futuro.</li>\n\
    </ul>\n"
- version: 3.8.0
  date: '2026-06-12'
  tags:
  - type: feature
    label: Tradução completa da interface + 6 idiomas (Pass 43.2/43.3/43.5)
  body: "<ul>\n  <li><strong>O RetroDB agora fala 6 idiomas a mais.</strong> Aproveitando a\n    base\
    \ feita na 3.7.0, toda a interface foi tornada traduzível e\n    traduzida por máquina para <strong>alemão,\
    \ francês, espanhol, italiano,\n    japonês e português do Brasil</strong>. Escolha o seu idioma em\n\
    \    Configurações &rarr; Preferências de Exibição &rarr; Idioma; ele segue a sua\n    preferência\
    \ salva, depois o seu navegador e, por fim, recorre ao inglês &mdash; nunca\n    fica travado em um\
    \ idioma que esteja faltando.</li>\n  <li><strong>Tudo o que aparece na tela está coberto</strong>:\
    \ textos e botões das páginas,\n    mensagens pop-up (as pequenas notificações &ldquo;toast&rdquo;),\
    \ os diálogos de\n    edição e de configurações, dicas e rótulos para leitores de tela. Gêneros de\
    \ jogo,\n    perspectivas e modos de jogo (por exemplo, &ldquo;First-Person-Shooter&rdquo;) agora\n\
    \    aparecem no seu idioma também &mdash; enquanto os dados subjacentes permanecem em\n    inglês,\
    \ para que a sua biblioteca e os filtros continuem funcionando exatamente como antes.</li>\n  <li>Um\
    \ idioma <strong>&ldquo;Pseudo&rdquo; embutido</strong> (visível no\n    menu de Idioma) é uma ferramenta\
    \ de QA para tradutores que coloca colchetes e acentos em cada\n    rótulo, deixando na hora óbvio\
    \ se algum texto foi esquecido.</li>\n  <li>As traduções por máquina são um ponto de partida e podem\
    \ soar um pouco duras em\n    alguns lugares &mdash; elas são fáceis de refinar com o tempo, e qualquer\
    \ texto sem\n    tradução simplesmente aparece em inglês.</li>\n</ul>\n"
