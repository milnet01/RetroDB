- version: 4.0.0
  date: '2026-11-09'
  tags:
  - type: enhancement
    label: Uma Sincronização ou Atualização do RetroAchievements que você pede enquanto outra está em andamento agora espera no servidor e começa sozinha quando a outra termina, mesmo que você feche a página ou tenha pedido de outro dispositivo. Todas as páginas mostram a mesma lista de espera com a posição de cada tarefa na fila, e o ✕ remove uma tarefa. Depois de uma reinicialização do servidor, as tarefas em espera são oferecidas de volta no Painel
    en: A RetroAchievements Sync or Refresh you ask for while another one runs now waits on the server and starts by itself when that one finishes, even if you close the page or asked from another device. Every page shows the same waiting list with each job's place in line, and ✕ takes a job out. After a server restart, waiting jobs are offered back on the Dashboard
  - type: fix
    label: O botão Atualizar RA na página de um console voltou a funcionar. Ele não informava qual console, então o servidor respondia "Não encontrado"
    en: The Refresh RA button on a console's page works again. It did not say which console, so the server answered "Not found"
  - type: fix
    label: A verificação de nomes de ROMs agora trata cada sistema do tipo mostrado na página Sistemas. Macintosh, ZX Spectrum Next, Coleco Adam e Thomson são verificados como computadores, e 3DS e PS Vita como portáteis, em vez de consoles. Um tipo que você definir na página Sistemas também passa a ser respeitado
    en: The ROM naming check now treats each system as the kind the Systems page shows. Macintosh, ZX Spectrum Next, Coleco Adam and Thomson are checked as computers, and 3DS and PS Vita as handhelds, instead of as consoles. A type you set on the Systems page is now followed too
  - type: performance
    label: O RetroDB usa bem menos memória enquanto está em espera. O ampliador de imagens com IA agora é carregado somente durante a ampliação, em um processo auxiliar que se encerra dois minutos depois da última imagem. Um servidor ocioso passou de cerca de 1,4 GB para menos de 100 MB. Se o driver de vídeo falhar durante uma ampliação, só o processo auxiliar para, nunca o servidor
    en: RetroDB uses far less memory while it waits. The AI image upscaler now loads only while it is upscaling, in a helper that closes two minutes after its last picture; an idle server dropped from about 1.4 GB to under 100 MB. If the graphics driver crashes during an upscale, only the helper stops, never the server
  - type: performance
    label: O Preencher com AI usando a busca na web do Claude custa menos. O Claude relê os resultados da busca após cada pesquisa; agora o RetroDB pede à Anthropic que os mantenha prontos, e uma nova leitura passa a custar um décimo do preço ou menos
    en: AI Fill with Claude web search costs less. Claude reads the search results again after each search; RetroDB now asks Anthropic to keep them ready, and a re-read then costs a tenth of the price or less
  - type: fix
    label: 'Zulu e xhosa estão mais fáceis de ler: 133 linhas que diziam a coisa errada foram corrigidas, como "Edition" exibido como "Chapter" e "must be text" exibido como "must be a letter". Cada correção foi confirmada por duas verificações separadas de IA'
    en: 'Zulu and Xhosa read better: 133 lines that said the wrong thing are corrected, such as "Edition" shown as "Chapter" and "must be text" shown as "must be a letter". Each correction was agreed by two separate AI checks'
  - type: fix
    label: Quando um jogo não inicia, a mensagem agora aparece no seu idioma e continua indicando o emulador, o core ou o arquivo com problema. Uma falha dentro do próprio computador agora mostra "Não foi possível iniciar" e o nome do programa, com os detalhes no registro do servidor, em vez de texto bruto do sistema. Quando o login no RetroAchievements é recusado, o motivo informado pelo próprio RetroAchievements aparece dentro de uma frase traduzida
    en: When a game will not start, the message is now in your language and still names the emulator, core or file at fault. A failure inside the computer itself now says "Could not start" and the program's name, with the details in the server log, instead of raw system text. A refused RetroAchievements sign-in shows RetroAchievements' own reason inside a translated sentence
  - type: fix
    label: Cancelar um trabalho de busca de metadados, sincronização ou imagens que já terminou agora limpa o pop-up de progresso travado. Iniciar um trabalho que já está em andamento mostra o motivo real, como "Já existe uma busca de metadados para SNES em andamento", em vez de "Erro de rede". Os erros de imagem de Controle no Museu agora dizem o que deu errado, e cancelar a sincronização do RetroAchievements de outro usuário avisa que ela é dele, em vez de fingir que cancelou
    en: Cancelling a scrape, sync or image job that has already finished now clears its stuck progress popup. Starting a job that is already running shows the real reason, such as "A scrape for SNES is already running", instead of "Network error". Controller image errors in the Museum now say what went wrong, and cancelling another user's RetroAchievements sync says it is theirs instead of pretending to cancel it
  - type: security
    label: O visualizador de logs agora também oculta senhas e chaves em arquivos de log mais antigos. Logs gravados antes de o RetroDB aprender a ocultar uma senha específica, como a do ScreenScraper, mostravam essa senha em texto simples ao serem vistos ou baixados
    en: The log viewer now hides passwords and keys in older log files too. Logs written before RetroDB learned to hide a particular password, such as ScreenScraper's, showed it in plain text when viewed or downloaded
  - type: security
    label: Redefinir todas as configurações para o padrão agora mantém sua pasta de ROMs e o fato de a configuração inicial estar concluída. Antes, a redefinição reabria as páginas da configuração inicial, que funcionam sem login, até um administrador executar a configuração novamente
    en: Resetting all settings to their defaults now keeps your ROM folder and the fact that setup is done. Before, a reset reopened the first-time setup pages, which work without signing in, until an admin ran setup again
  - type: feature
    label: Os jogos de arcade podem ganhar conquistas do RetroAchievements novamente. O RetroDB agora vincula um jogo de arcade somente quando o RetroAchievements conhece o nome exato do arquivo, como sf2 para Street Fighter II, então não adivinha mais pelos títulos nem vincula o jogo errado. Seus jogos de arcade são vinculados na próxima vez que os dados do RetroAchievements forem atualizados ou que eles tiverem os metadados buscados
    en: Arcade games can earn RetroAchievements again. RetroDB now links an arcade game only when RetroAchievements knows its exact file name, such as sf2 for Street Fighter II, so it no longer guesses from titles and links the wrong game. Your arcade games link the next time their RetroAchievements data is refreshed or they are scraped
  - type: fix
    label: A sincronização de troféus do PlayStation agora corrige vínculos de jogos feitos errado antes, como vários jogos vinculados a um jogo sem relação chamado "D". Um vínculo que você mesmo definiu nunca é alterado por uma sincronização. A próxima sincronização verifica todos os vínculos antigos de novo, então algumas correspondências aproximadas podem ficar sem vínculo; vincule-as de novo manualmente
    en: PlayStation trophy sync now corrects game links it made wrongly before, such as many games linked to an unrelated game called "D". A link you set yourself is never changed by a sync. The next sync checks all older links again, so a few near matches may come unlinked; link those again by hand
  - type: fix
    label: Mover uma busca de metadados em massa que está esperando para antes de uma em andamento não soma mais o último jogo da busca antiga às contagens da nova. Clicar em "Buscar tudo" na Lista de Desejos quando já há uma em andamento agora avisa isso, em vez de dizer que iniciou
    en: Moving a waiting bulk scrape ahead of a running one no longer adds the old scrape's last game to the new one's counts. Clicking "Scrape all" on the wishlist while one is already running now says so, instead of claiming it started
  - type: accessibility
    label: 'Com um leitor de tela, o botão "em execução" agora diz "1 jogo em execução" somente quando a contagem muda, em vez de ler um número solto a cada poucos segundos. Sua lista abre como uma janela com nome e com o cursor dentro, os botões Encerrar e Próximo disco dizem em qual jogo atuam, e após Encerrar o cursor volta para um lugar adequado. Cada cartão de jogo na Biblioteca agora abre pelo teclado a partir do título, e seus botões de filtro dizem o que filtram, como "Filtrar por Desenvolvedora: Konami"'
    en: 'With a screen reader, the "running" button now says "1 game running" only when the count changes, instead of reading a bare number every few seconds. Its list opens as a named window with the cursor inside, its Kill and Next disk buttons say which game they act on, and after Kill the cursor returns to a sensible place. Each game card in the library now opens with the keyboard from its title, and its filter buttons say what they filter, such as "Filter by Developer: Konami"'
  - type: feature
    label: Todos os membros agora podem adicionar sua própria chave Steam e Steam ID em Configurações → Meu Perfil, e importar sua própria biblioteca e conquistas da Steam. Até agora, só um administrador podia
    en: Every member can now add their own Steam key and Steam ID under Settings → My Profile, and import their own Steam library and achievements. Until now only an admin could
  - type: fix
    label: Salvar os detalhes de um jogo não define mais uma contagem de jogadores vazia como 1, e não marca mais as classificações etárias que o RetroDB descobriu como digitadas por você. O Preencher com AI mantém um jogo que você marcou como Exclusivo e mantém qualquer alteração que você fizer em um jogo enquanto ele espera a resposta da AI. O histórico de uma busca de metadados agora lista apenas os detalhes que ela realmente salvou
    en: Saving a game's details no longer sets an empty player count to 1, and no longer marks the age ratings RetroDB worked out for you as typed by you. AI Fill keeps a game you marked Exclusive, and keeps any change you make to a game while it is waiting for the AI's answer. A scrape's history now lists only the details it actually saved
  - type: fix
    label: A Revisão de Capturas de Tela não para mais no meio quando uma captura armazenada é grande demais para abrir; ela conta essa imagem como ilegível e continua. O índice da página de ajuda agora tem links para Emuladores e Jogar, e as notas para desenvolvedores sobre login, tarefas em segundo plano, busca de metadados, imagens, atualizações e respostas de erro agora dizem o que o programa realmente faz
    en: Screenshot Review no longer stops halfway when one stored screenshot is far too large to open; it counts that picture as unreadable and carries on. The help page's contents list now links to Emulators and Playing, and the developer notes on sign-in, background jobs, scraping, pictures, updates and error replies now say what the program really does
  - type: fix
    label: Um editor que inicia uma verificação das Ferramentas de ROM agora pode pausar, retomar ou cancelar essa verificação; as verificações de outras pessoas continuam sendo do administrador para interromper. Tags e listas recusam um nome ausente ou uma cor inválida com uma mensagem clara em vez de uma página de erro, e renomear um jogo da Lista de Desejos para o nome de outro que você já deseja é recusado, assim como adicioná-lo. Limpar Dados do RA agora também esquece se sua cópia dá conquistas. Um troféu que o RetroDB não oferece mais deixa de contar para seu ranking de colecionador. Os caminhos de ROM do Windows agora correspondem aos jogos do RetroAchievements pelo nome do arquivo
    en: An editor who starts a ROM Tools scan can now pause, resume or cancel it; other people's scans stay an admin's to stop. Tags and lists refuse a missing name or a bad colour with a clear message instead of an error page, and renaming a wishlist game onto another one you already wish for is refused, as adding it is. Clear RA Data now also forgets whether your copy earns achievements. A trophy RetroDB no longer offers stops counting toward your collector rank. Windows ROM paths now match RetroAchievements games by file name
  - type: fix
    label: Correções de manutenção. Um arquivo de vários discos que falha ao ser descompactado não deixa mais uma pasta pela metade que bloqueia todas as novas tentativas. Calcular Armazenamento agora conta todos os arquivos dentro de uma pasta de jogo de PS3. Limpar Dados Obtidos exclui imagens somente quando você pede. Uma verificação da biblioteca que encontra um jogo que outra verificação acabou de adicionar continua com o resto dos jogos daquele console
    en: Maintenance fixes. A multi-disc archive that fails to unpack no longer leaves a half-made folder behind that blocks every retry. Calculate Storage now counts every file inside a PS3 game folder. Clear Scraped Data deletes pictures only when you ask it to. A library scan that meets a game another scan has just added carries on with the rest of that console's games
  - type: fix
    label: Restaurar um backup ficou mais seguro. Ele agora é gravado no banco de dados da biblioteca do jeito que o próprio banco espera, então uma parte do RetroDB que o mantém aberto vê os dados restaurados em vez de correr o risco de danos. Excluir um jogo agora também exclui suas imagens de caixa e suas entradas de imagem em espera e de configurações de emulador, para que um jogo novo nunca as herde. Duas configurações salvas ao mesmo tempo não perdem mais uma delas
    en: Restoring a backup is safer. It is now written into the library database the way the database itself expects, so a part of RetroDB that has it open sees the restored data instead of risking damage. Deleting a game now also deletes its box pictures and its waiting picture and emulator-setting entries, so a new game can never inherit them. Two settings saved at the same moment no longer lose one of them
  - type: fix
    label: Correções de imagens. GIFs não passam mais pelo ampliador só para serem descartados. O modelo do ampliador é verificado com sua impressão digital publicada, e um download ruim é baixado de novo em vez de desativar a ampliação para sempre. Logotipos e imagens com partes transparentes mantêm a transparência quando ampliados. Converter para WebP agora inclui também contracapas e logotipos, e não recusa mais uma biblioteca grande por falta de espaço que não é necessário. Duas faces de um arquivo de caixa podem compartilhar uma imagem, e remover uma caixa com um registro danificado remove suas imagens
    en: Picture fixes. GIFs are no longer run through the upscaler only to be thrown away. The upscaler model is checked against its published fingerprint, and a bad download is fetched again instead of turning upscaling off for good. Logos and pictures with see-through parts keep their transparency when enlarged. Convert to WebP now takes back covers and logos too, and no longer refuses a large library for want of room it does not need. Two faces of a box file can share one picture, and removing a box with a damaged record removes its pictures
  - type: fix
    label: As importações do CLZ, Steam, Xbox e PlayStation não tratam mais todo título escrito só em japonês ou outro alfabeto não latino como o mesmo jogo, e não adicionam mais um jogo sem id. A prévia do CLZ não adiciona mais consoles antes de você confirmar a importação, e um visitante vendo uma biblioteca da Steam, Xbox ou PlayStation também não os adiciona mais. Um jogo da Steam removido da loja é perguntado uma vez só, não a cada sincronização
    en: Imports from CLZ, Steam, Xbox and PlayStation no longer treat every title written only in Japanese or another non-Latin script as the same game, and no longer add a game with no id. The CLZ preview no longer adds consoles before you confirm the import, and a viewer looking at a Steam, Xbox or PlayStation library no longer adds them either. A Steam game removed from the store is asked about once, not on every sync
  - type: fix
    label: As Análises agora agrupam muito mais consoles sob o fabricante em vez de "Outros", e a lista Buscados Recentemente do painel mostra um jogo que você buscou de novo, não só os jogos recém-adicionados
    en: Analytics now groups many more consoles under their maker instead of "Other", and the dashboard's Recently Scraped list shows a game you scraped again, not only newly added games
  - type: fix
    label: As imagens de Controle que você adiciona no Museu são mantidas quando a versão independente é atualizada. Quando um serviço online pausa ao atingir seu limite, o horário em que ele será consultado de novo é mostrado no seu fuso horário
    en: Controller pictures you add in the Museum are kept when the standalone version updates. When an online service pauses at its limit, the time it will be asked again is shown in your own time zone
  - type: fix
    label: Um disco bônus não pode mais ser vinculado a si mesmo nem a outro disco bônus, e o vínculo automático não vincula mais um disco a outro que ele marca como disco bônus na mesma execução
    en: A bonus disc can no longer be linked to itself or to another bonus disc, and Auto-link no longer links a disc to one it marks as a bonus disc in the same run
  - type: fix
    label: A Biblioteca e as páginas de console não contam mais os arquivos de BIOS de arcade como jogos, nem nos totais nem na barra de letras. Jogos semelhantes, e a lista que você obtém ao clicar em um gênero ou distribuidora na página de um jogo, não mostram mais as versões regionais, discos bônus ou arquivos de BIOS do próprio jogo
    en: The Library and console pages no longer count arcade BIOS files as games, in their totals or the letter bar. Similar games, and the list you get by clicking a genre or publisher on a game's page, no longer show the game's own regional versions, bonus discs or BIOS files
  - type: fix
    label: Selecionar tudo agora avisa quando uma lista muito grande é cortada, em vez de selecionar só uma parte em silêncio
    en: Select all now says so when a very large list is cut short, instead of quietly selecting only part of it
  - type: fix
    label: Os cartões da biblioteca agora são atualizados quando seu progresso de conquistas ou troféus muda, e quando um jogo passa a ser jogável ou deixa de ser
    en: Library cards now update when your achievement or trophy progress changes, and when a game becomes playable or stops being playable
  - type: fix
    label: A edição em massa não pode mais alterar os jogos errados quando recebe uma seleção inválida, e uma edição em massa que falha não marca mais os jogos como editados por você
    en: Bulk edit can no longer change the wrong games when it is sent a bad selection, and a bulk edit that fails no longer marks the games as edited by you
  - type: fix
    label: Uma correspondência do HowLongToBeat com apenas 1% de compatibilidade não é mais mostrada como 100%, e uma página que falha ao carregar mostra a página de erro em vez do texto bruto do erro
    en: A HowLongToBeat match that is only a 1% fit is no longer shown as a 100% match, and a page that fails to load shows the error page instead of the raw error text
  - type: security
    label: Alterar sua senha, ou um administrador redefini-la, agora encerra a sessão dessa conta em todos os outros dispositivos. Por isso, todos entrarão mais uma vez depois desta atualização. A página de configuração da primeira execução também recebe a mesma proteção contra outros sites que todas as outras páginas
    en: Changing your password, or an admin resetting it, now signs that account out on every other device. Because of this, everyone signs in once more after this update. The first-run setup page also gets the same protection against other websites as every other page
  - type: fix
    label: Uma imagem recusada como seu avatar não exclui mais o avatar que você tinha
    en: A picture that is refused as your avatar no longer deletes the avatar you had
  - type: fix
    label: As buscas de metadados são mais gentis com os serviços online. Um serviço que continua falhando é ignorado por um tempo ao preencher lacunas, como já era nas pesquisas, e as consultas de jogos do ScreenScraper agora também respeitam seus limites diários
    en: Scrapes are gentler on the online services. A service that keeps failing is skipped for a while when filling gaps, as it already was in searches, and ScreenScraper game lookups now respect its daily limits too
  - type: fix
    label: Uma busca de metadados não falha mais em um jogo de ano de lançamento desconhecido, como "TBA", e um jogo listado para regiões fora da sua lista, como "Brasil, Coreia", mantém sua região em vez de virar o seu padrão
    en: A scrape no longer fails on a game whose release year is unknown, such as "TBA", and a game listed for regions outside your list, such as "Brazil, Korea", keeps its region instead of becoming your default
  - type: fix
    label: As pastas do ES-DE escritas como ~/ agora funcionam, e um arquivo ES-DE muito grande não é mais copiado. As versões regionais sugeridas nunca juntam de novo dois jogos que você disse que não são versões um do outro
    en: ES-DE folders written as ~/ now work, and a very large ES-DE file is no longer copied. Suggested regional versions never put back together two games you said are not versions of each other
  - type: security
    label: O RetroDB recusa mais alguns endereços de rede privada ao buscar imagens na web e segue corretamente o redirecionamento de um endereço da web
    en: RetroDB refuses a few more private network addresses when fetching pictures from the web, and follows a web address's redirect correctly
  - type: fix
    label: As últimas telas que ainda estavam em inglês agora também seguem seu idioma, incluindo o assistente de configuração, Tags, Listas, Comparar Jogos, configurações das Ferramentas de ROM, a fila de busca de metadados em massa, a lista de tarefas interrompidas do painel, os rótulos dos cartões da biblioteca e muitas mensagens de erro
    en: The last screens still in English now follow your language too, including the setup wizard, Tags, Lists, Compare Games, ROM Tools settings, the bulk scrape queue, the dashboard's interrupted-jobs list, the library card labels and many error messages
  - type: security
    label: Um nome de sistema contendo código web não pode mais executá-lo na janela da fila de busca de metadados em massa
    en: A system name holding web code can no longer run it in the bulk scrape queue window
  - type: accessibility
    label: Em qualquer lugar da página, a posição do teclado agora é marcada com um anel grosso na cor do seu tema, em todo botão, caixa e link. Antes, muitos controles mostravam só uma linha fraca, igual a quando o mouse passava por cima deles
    en: Wherever you are on a page, the keyboard's place is now marked with a bold ring in your theme's colour, on every button, box and link. Before, many controls showed only a faint line, the same as when the mouse passed over them
  - type: accessibility
    label: Os links de Gênero, Série, Desenvolvedora e Distribuidora nos cartões da biblioteca agora funcionam pelo teclado. O botão "em execução" dos jogos em andamento também abre pelo teclado, e Esc ou um clique fora fecha sua lista
    en: The Genre, Series, Developer and Publisher links on library cards now work from the keyboard. The "running" button for games in play opens from the keyboard too, and Esc or a click elsewhere closes its list
  - type: accessibility
    label: Os leitores de tela agora dizem o nome de cada cor de tag e qual está escolhida, e leem as imagens de troféu como Platina, Ouro, Prata e Bronze em vez de letras soltas. Enquanto um jogo inicia, o Tab não vai mais para trás da tela de inicialização
    en: Screen readers now name each tag colour and say which one is chosen, and read trophy pictures as Platinum, Gold, Silver and Bronze instead of single letters. While a game starts, Tab no longer moves behind the starting screen
  - type: fix
    label: Se uma atualização parar antes de começar a trocar os arquivos, o RetroDB agora inicia de novo a versão que você tinha, em vez de continuar fechado
    en: If an update stops before it starts swapping files, RetroDB now starts the version you had again, instead of staying closed
  - type: fix
    label: Apertar Jogar duas vezes ao mesmo tempo não pode mais iniciar dois jogos no player integrado. A espera pelo download de um core agora desiste depois de um tempo, ou quando o RetroDB para de responder, em vez de esperar para sempre, e a pergunta "já em execução" usa a própria caixa de diálogo do RetroDB
    en: Pressing Play twice at once can no longer start two games on the built-in player. Waiting for a core download now gives up after a while, or when RetroDB stops answering, instead of waiting forever, and the "already running" question uses RetroDB's own dialog
  - type: fix
    label: As trapaças que você liga ou desliga durante o jogo são guardadas para o jogo certo, nunca tiradas de outro jogo cujo arquivo tenha o mesmo nome. Um problema com trapaças nunca impede um jogo de iniciar
    en: Cheats you switch on or off during play are kept for the right game, never taken from another game whose file has the same name. A cheat problem never stops a game starting
  - type: fix
    label: O RetroDB grava o arquivo de configurações de um emulador de forma mais segura. Um arquivo de configurações que é um link continua sendo um link, mantém suas permissões e mantém letras que não consegue ler, e um salvamento que falha não deixa nenhum arquivo solto
    en: RetroDB writes an emulator's settings file more safely. A settings file that is a link stays a link, keeps its permissions, and keeps letters it cannot read, and a failed save leaves no stray file behind
  - type: fix
    label: Uma busca de metadados em massa que você move para baixo na fila, troca com outra ou retoma enquanto outra roda não se perde mais quando o RetroDB reinicia; o painel a oferece, de onde ela parou. Uma busca trocada não continua mais rodando ao lado da nova, e dois cliques rápidos em Retomar iniciam o trabalho uma só vez
    en: A bulk scrape you move down the queue, swap with another or resume while one runs is no longer lost when RetroDB restarts; the dashboard offers it, from where it stopped. A swapped-out scrape no longer keeps running beside the new one, and two quick clicks on Resume start a job once
  - type: fix
    label: O erro de um jogo, como a queda da rede, não encerra mais toda uma execução do Preencher com AI nem uma execução de Corrigir Caixa e Regiões do Manual; esse jogo conta como falho e os demais continuam. Parar o RetroDB também interrompe os downloads de core de forma limpa
    en: One game's error, such as the network dropping, no longer ends a whole AI Fill run or a Fix Box and Manual Regions run; that game counts as failed and the rest go on. Stopping RetroDB now also stops core downloads cleanly
  - type: fix
    label: Itens da Lista de Desejos não ficam mais presos em "buscando metadados" para sempre após um erro ou reinício, e duas execuções de Buscar Metadados em Tudo para a mesma Lista de Desejos não rodam mais ao mesmo tempo
    en: Wishlist items no longer stay on "scraping" forever after an error or a restart, and two Scrape All runs for the same wishlist no longer run at once
  - type: fix
    label: Um script ou uma segunda cópia do RetroDB iniciando não marca mais as tarefas do servidor em execução como interrompidas, e duas cópias iniciando ao mesmo tempo não podem mais voltar o banco de dados a uma versão anterior
    en: A script or a second copy of RetroDB starting up no longer marks the running server's jobs as interrupted, and two copies starting at once can no longer set the database back a version
  - type: fix
    label: Iniciar uma sincronização da PlayStation não faz mais as barras de progresso de todos esperarem enquanto ela entra na conta da Sony. A renovação diária da PlayStation agora renova o login só perto do fim dos 10 dias, e não mais todo dia
    en: Starting a PlayStation sync no longer makes everyone's progress bars wait while it signs in to Sony. The daily PlayStation keep-alive now renews a sign-in only near the end of its 10 days, instead of every day
  - type: fix
    label: Uma busca de metadados não sobrescreve mais uma alteração que você faz enquanto ela roda, e não esvazia mais um gênero, modo ou visão para os quais não tem nome. Ela também não altera mais um número de jogadores salvo para combinar com os modos do jogo
    en: A scrape no longer writes over a change you make while it runs, and no longer empties a genre, mode or view it has no name for. It no longer changes a stored player count to match the game's modes
  - type: fix
    label: Preencher com AI não altera mais o que você mesmo digitou, como uma distribuidora ou um gênero que você corrigiu à mão; ele corrige apenas valores obtidos por busca. Também não informa mais um valor como alterado quando só foi escrito de outro jeito, como 4 jogadores como "1-4" ou os mesmos gêneros em outra ordem
    en: AI Fill no longer changes what you typed yourself, such as a publisher or genre you corrected by hand; it corrects only scraped values. It no longer reports a value as changed when it only wrote it differently, such as 4 players as "1-4" or the same genres in another order
  - type: fix
    label: Um controle que você digita para um jogo é mantido; o controle padrão do console agora substitui apenas valores obtidos por busca e por AI. Uma faixa etária convertida do palpite de AI de outro sistema de classificação agora também é marcada como palpite
    en: A controller you type for a game is kept; the console's default controller now replaces only scraped and AI values. An age rating converted from another board's AI guess is now marked as a guess too
  - type: fix
    label: Salvar a janela de edição de um jogo não esvazia mais os campos que a janela não mostra. Redefinir na página de um jogo agora limpa tudo o que diz limpar, incluindo a visão, a edição e outros nomes, exclui as imagens e os vídeos do jogo a menos que outro jogo os use, e atualiza os filtros da biblioteca na hora
    en: Saving a game's edit window no longer empties fields the window does not show. Reset on a game's page now clears everything it says it does, including the view, edition and other names, deletes the game's pictures and videos unless another game uses them, and updates the library filters straight away
  - type: fix
    label: Limpar Dados Obtidos agora também limpa a visão, 2D ou 3D, e a estrutura do jogo. Uma importação do CLZ de um jogo só com o ano mantém apenas o ano, não 1º de janeiro
    en: Clear Scraped Data now also clears the view, 2D or 3D, and game structure. A CLZ import of a game with only a year keeps just the year, not 1 January
  - type: security
    label: A sincronização da Steam não usa mais a chave da Steam das Configurações para todos os membros da casa. Um membro sem chave própria da Steam recebia a biblioteca e as conquistas do administrador na sua conta. A chave nas Configurações agora serve só aos administradores
    en: Steam sync no longer borrows the Steam key from Settings for every household member. A member with no Steam key of their own was getting the admin's Steam library and achievements under their account. The key in Settings now serves admins only
  - type: fix
    label: A busca do How Long to Beat para muitos jogos agora salva os tempos de que tem certeza. Antes, toda correspondência segura falhava e nada era salvo. Atualizar RetroAchievements agora também confere o arquivo de cada jogo com a lista do RetroAchievements, como uma busca de metadados faz, para que o jogo seja vinculado à versão exata que você tem
    en: How Long to Beat's lookup for many games now saves the times it is sure of. Before, every sure match failed and nothing was saved. RetroAchievements Refresh now also checks each game's file against RetroAchievements' list, as a scrape does, so a game is linked to the exact version you have
  - type: fix
    label: A mensagem de que uma tarefa em segundo plano terminou aparece de novo, e a caixa de progresso de uma tarefa percebe quando o servidor retoma a tarefa após um reinício. Antes, nenhuma das duas aparecia
    en: The message that a background job has finished shows again, and a job's progress box notices when the server picks the job up after a restart. Before, neither ever appeared
  - type: fix
    label: 'Troféus da PlayStation: um jogo que você vinculou à mão continua vinculado após uma sincronização completa, e a sincronização não vincula mais um jogo à sua sequência, como "Doom" a "Doom Eternal". Importar jogos da PlayStation agora vincula um jogo que já está na sua biblioteca, como as importações da Steam e do Xbox fazem, para que os troféus apareçam nele'
    en: 'PlayStation trophies: a game you linked by hand stays linked after a full sync, and a sync no longer links a game to its sequel, such as "Doom" to "Doom Eternal". Importing PlayStation games now links a game already in your library, as Steam and Xbox imports do, so its trophies show on it'
  - type: fix
    label: O Xbox não mostra mais seu gamertag como Desconhecido depois que o login se renova sozinho, e uma conexão lenta ou com falha não faz mais você sair do Xbox. Só a recusa do login pela Microsoft faz isso
    en: Xbox no longer shows your gamertag as Unknown after its sign-in renews itself, and a slow or failed connection no longer signs you out of Xbox. Only Microsoft refusing the sign-in does that
  - type: fix
    label: Duas pessoas agora podem ter uma tag com o mesmo nome; antes, a segunda falhava com um erro. Qualquer usuário conectado agora pode verificar de novo seus próprios troféus do RPCS3; antes, só um administrador podia, e todos os outros viam troféus antigos até o RetroDB reiniciar
    en: Two people can now each have a tag of the same name; before, the second one failed with an error. Any signed-in user can now rescan their own RPCS3 trophies; before, only an admin could, and everyone else saw old trophies until RetroDB restarted
  - type: security
    label: Seus logins continuam privados. Os backups do banco de dados não podem mais ser lidos por outras contas do computador, e um backup que falha não exclui mais o anterior. Excluir ou desativar um usuário também o desconecta do RetroAchievements no DuckStation e no PCSX2. Um login do RetroAchievements salvo no menu do próprio emulador não passa mais para o próximo jogador. Os registros e os erros de tarefas salvos ocultam os tokens do RetroAchievements, o erro da PlayStation de outro membro é mostrado só para ele, e os arquivos antigos de login da PlayStation e do Xbox em texto simples são removidos
    en: Your sign-ins stay private. Database backups can no longer be read by other accounts on the computer, and a failed backup no longer deletes the one before it. Deleting or switching off a user also signs them out of RetroAchievements in DuckStation and PCSX2. A RetroAchievements sign-in saved from the player's own menu no longer carries over to the next person who plays. Logs and saved job errors hide RetroAchievements tokens, another member's PlayStation error is shown only to them, and old plain-text PlayStation and Xbox sign-in files are removed
  - type: fix
    label: As verificações do próprio RetroDB não podem mais mexer na sua biblioteca enquanto rodam. Elas sempre usam uma cópia descartável do banco de dados, das imagens e das configurações, e se recusam a iniciar se algum deles apontar para os seus arquivos reais
    en: RetroDB's own checks can no longer touch your library while they run. They always use a throwaway copy of the database, pictures and settings, and refuse to start if any of them points at your real files
  - type: fix
    label: Limpar arquivos órfãos não exclui mais as imagens da sua Lista de Desejos. Abrir um jogo não o faz mais esquecer capturas de tela que não encontra. Antes, com a unidade de imagens desconectada, todo jogo aberto perdia toda a lista de capturas de tela; agora a lista é mantida, e uma imagem ausente apenas fica oculta
    en: Clean orphaned files no longer deletes your wishlist's pictures. Opening a game no longer makes it forget screenshots it cannot find. Before, with the picture drive unplugged, every game you opened lost its whole screenshot list; now the list is kept, and a missing picture is only hidden
  - type: fix
    label: Um download de vídeo ou manual que falha no meio não danifica mais a cópia que o jogo já tinha, e um download com falha não deixa mais um arquivo parcial oculto na pasta de mídia. O ampliador de imagens em segundo plano não salva mais uma imagem antiga sobre uma mais nova baixada nesse meio-tempo. Converter para WebP mantém todos os jogos que compartilham uma imagem apontando para ela, e nunca toca em arquivos fora das pastas de imagens
    en: A video or manual download that fails part-way no longer damages the copy the game already had, and a failed download no longer leaves a hidden half-file in the media folder. The background upscaler no longer saves an old picture over a newer one downloaded meanwhile. Convert to WebP keeps every game that shares a picture pointing at it, and never touches a file outside the picture folders
  - type: fix
    label: Excluir um jogo ou um item da Lista de Desejos agora também exclui suas imagens, vídeos e manuais, mas mantém os que outro jogo ou item da Lista de Desejos ainda usa. As imagens salvas podem ser lidas por outras contas do computador de novo, e Redimensionar Imagens conta uma imagem que não conseguiu salvar como falha, e não como concluída
    en: Deleting a game or a wishlist item now deletes its pictures, videos and manuals too, but keeps any another game or wishlist item still uses. Saved pictures can be read by other accounts on the computer again, and Resize Images counts a picture it could not save as failed, not as done
  - type: fix
    label: O Localizador de Duplicados não oferece mais um arquivo em uso para exclusão. Ao procurar por nome, não considera mais os arquivos .cue e .bin de um jogo como cópias um do outro. Nunca oferece o arquivo de faixa de um disco, que duas versões de um jogo podem compartilhar. Não exclui um disco que uma playlist lista. Um jogo cujo arquivo você exclui agora passa para a cópia que você mantém, e assim continua na biblioteca
    en: Duplicate Finder no longer offers a working file for deletion. Looking by name, it no longer calls a game's .cue and .bin copies of each other. It never offers a disc's track file, which two versions of a game can share. It will not delete a disc that a playlist lists. A game whose file you delete now moves to the copy you keep, so it stays in the library
  - type: fix
    label: Organizar Multidisco não sobrescreve mais uma playlist existente nem um arquivo que já está na pasta do jogo; ele para e diz qual. A playlist que ele cria lista o .cue de cada disco, não os arquivos de faixa. Os jogos cujos arquivos ele move agora os acompanham até a pasta, então Limpar ROMs ausentes não os remove mais
    en: Organize Multi-Disc no longer writes over an existing playlist or a file already in the game's folder; it stops and says which. The playlist it makes lists each disc's .cue, not its track files. Games whose files it moves now follow them into the folder, so Clean missing ROMs no longer removes them
  - type: fix
    label: Converter para CHD com "excluir originais" agora também exclui os arquivos de faixa do disco, mas mantém uma faixa que outro .cue ainda usa. O jogo e qualquer playlist que listava o disco antigo agora apontam para o novo .chd. Renomear o arquivo de um jogo agora atualiza a playlist que o lista, e um arquivo de faixa de que um .cue precisa não pode ser renomeado. Remover arquivos de um zip remove só os arquivos que você escolheu, mesmo quando um nome tem [ ou ]. Remover Capturas Duplicadas exclui só as cópias que a verificação encontrou, e sempre mantém uma
    en: Converting to CHD with "delete originals" now deletes the disc's track files too, but keeps a track another .cue still uses. The game and any playlist that listed the old disc now point at the new .chd. Renaming a game's file now updates the playlist that lists it, and a track file a .cue needs cannot be renamed. Removing files from a zip removes only the files you picked, even when a name holds [ or ]. Screenshot Dedup deletes only the copies its scan found, and always keeps one
  - type: fix
    label: O How Long to Beat na página de um jogo busca o que você digita. Antes, um título que ele não encontrava fazia a busca usar os outros nomes do jogo, e podia oferecer um jogo diferente, como um remake feito por fãs. Ele ainda tenta os outros nomes quando a caixa contém o nome do próprio jogo
    en: How Long to Beat on a game's page searches for what you type. Before, a title it could not find made it search the game's other names instead, and it could offer a different game, such as a fan remake. It still tries the other names when the box holds the game's own name
  - type: fix
    label: Os passos do How Long to Beat no manual de ajuda agora correspondem à tela. Diziam para escolher uma correspondência numa lista; a página mostra uma correspondência com Salvar e Cancelar. A ajuda da PlayStation não diz mais que o login dura cerca de dois meses, já que o RetroDB entra de novo sozinho. Os 20 manuais traduzidos têm as duas mudanças
    en: The help manual's How Long to Beat steps match the screen. They said to pick a match from a list; the page shows one match with Save and Cancel. The PlayStation help no longer says the sign-in lasts about two months, since RetroDB signs in again by itself. All 20 translated manuals carry both changes
  - type: fix
    label: Toda barra de letras agora começa com um botão Todos. Nas páginas Biblioteca, de console e Troféus PSN, escolher uma letra mostra só os jogos dessa letra, e antes não havia botão para trazer o resto de volta. Nas outras páginas de conquistas, Todos volta ao primeiro jogo
    en: Every letter bar now starts with an All button. On the Library, console and PSN Trophies pages, picking a letter shows only that letter's games, and before there was no button to bring the rest back. On the other achievement pages, All goes back to the first game
  - type: fix
    label: Um novo token de login da PlayStation colado nas Configurações agora é usado na hora. Antes, o RetroDB continuava usando o login antigo até ele expirar, e Salvar e Testar Conexão informava esse login antigo como funcionando. Um token que a Sony recusa não substitui mais um que funciona
    en: A new PlayStation sign-in token you paste in Settings is now used straight away. Before, RetroDB kept using the old sign-in until it ran out, and Save & Test Connection reported that old sign-in as working. A token Sony refuses no longer replaces one that works
  - type: enhancement
    label: 'O login da PlayStation nas Configurações ficou mais fácil de manter. O aviso não conta mais dias em que você nunca precisou agir, porque o RetroDB entra de novo sozinho; ele fica vermelho só quando a Sony recusa seu token salvo. O botão Colar aqui não faz mais o navegador pedir para ler sua área de transferência: ele coloca o cursor na caixa para você usar Ctrl+V. Os passos agora dizem para sair da PlayStation primeiro ao trocar um token que ainda funciona, e suas mensagens podem ser traduzidas'
    en: 'The PlayStation sign-in in Settings is easier to keep going. The banner no longer counts down days you never had to act on, because RetroDB signs in again by itself; it turns red only when Sony refuses your saved token. The Paste here button no longer makes the browser ask to read your clipboard: it puts the cursor in the box for Ctrl+V. The steps now say to sign out of PlayStation first when you replace a token that still works, and their messages can be translated'
  - type: enhancement
    label: Mensagens pop-up e caixas de pergunta, como "Configurações salvas" ou "Excluir esta lista?", agora podem ser traduzidas em todas as páginas. Antes, a maioria ficava em inglês, qualquer que fosse o idioma escolhido
    en: Pop-up messages and question boxes, such as "Settings saved" or "Delete this list?", can now be translated on every page. Before, most of them stayed in English whatever language you chose
  - type: enhancement
    label: As mensagens que dizem por que um login da PlayStation falhou, como "Seu NPSSO pode ter expirado", agora podem ser traduzidas
    en: The messages that say why a PlayStation sign-in failed, such as "Your NPSSO may have expired", can now be translated
  - type: fix
    label: O manual de ajuda em todos os idiomas agora corresponde ao em inglês. Ele ganha Busca em Qualquer Lugar, Manter um Título, Nomes MAME e o verso da caixa, e parágrafos antigos que tinham ficado desatualizados foram atualizados
    en: The help manual in every language now matches the English one. It gains Search Anywhere, Keeping a Title, MAME Names and the back of the box, and older paragraphs that had fallen behind are up to date
  - type: fix
    label: Em alemão, africâner e espanhol, o botão Voltar na capa de um jogo agora diz o verso da caixa, e não "voltar"
    en: In German, Afrikaans and Spanish, the Back button on a game's cover now says the back of the box, not "go back"
  - type: feature
    label: Pressionar Jogar agora preenche a tela com o logo do jogo sobre a imagem de fundo enquanto o jogo inicia, ou com o nome em letras grandes quando não há logo. Ele some sozinho quando a janela do jogo abre, ou quando você pressiona Esc ou clica
    en: Pressing Play now fills the screen with the game's logo on its background picture while the game starts, or its name in large letters when it has no logo. It goes away by itself when the game's window opens, or when you press Esc or click
  - type: feature
    label: 'A caixa 3D giratória agora tem o formato real de uma caixa de PS5: cantos e bordas arredondados, a borda elevada em volta da capa, a linha onde as duas metades se encontram e a abertura para o dedo no lado de abrir. Ela precisa de um arquivo de caixa de uma versão do Slipcase que grave o formato; importe a caixa de novo para obtê-lo. As outras caixas ficam como antes'
    en: 'The turnable 3D box now has the real shape of a PS5 case: rounded corners and edges, the raised lip round the cover, the line where the two halves meet, and the finger slot in the opening side. It needs a box file from a Slipcase version that writes the shape; import the box again to get it. Other boxes look as before'
  - type: enhancement
    label: Atualizar RetroAchievements saiu das Configurações para a página do RetroAchievements e agora se chama Encontrar Jogos com Conquistas. Cada botão ali agora tem uma linha dizendo o que faz, para ficar fácil distinguir Encontrar Jogos e Sincronizar Progresso. Sem jogos vinculados ainda, a página mostra a um administrador o botão Encontrar em vez de passar para a próxima aba
    en: Refresh RetroAchievements moved from Settings to the RetroAchievements page, and is now called Find Games with Achievements. Every button there now has a line saying what it does, so Find Games and Sync Progress are easy to tell apart. With no games linked yet, the page shows an admin the Find button instead of moving on to the next tab
  body: "<ul>\n  <li><strong>O manual de ajuda está atualizado em todos os idiomas.</strong>\n    As seções que só existiam no manual em inglês agora estão traduzidas.</li>\n</ul>\n"
  body_en: "<ul>\n  <li><strong>The help manual is up to date in every language.</strong>\n    Sections that were only in the English manual are now translated.</li>\n</ul>\n"
- version: 3.35.4
  date: '2026-11-03'
  tags:
  - type: fix
    label: Uma captura de tela que você exclui de um jogo agora continua excluída. Antes, a próxima busca de metadados podia copiá-la de volta do ES-DE ou baixá-la de novo de uma fonte online. Excluir uma cópia extra na ferramenta Capturas de Tela Duplicadas não conta, porque a imagem continua guardada uma vez
  - type: feature
    label: 'Os jogos agora têm logotipo: a busca de metadados o salva do ES-DE, ScreenScraper, TheGamesDB, IGDB e Steam, e a página do jogo o mostra acima do título, ou no lugar de uma caixa ausente. Você pode enviar ou excluir um logotipo na janela Editar. Faça uma busca de metadados em massa com Preencher Faltantes para preencher os logotipos de jogos que você já buscou antes'
  - type: fix
    label: O IGDB não usa mais o logotipo de um jogo como plano de fundo da página
  - type: feature
    label: 'Os jogos agora têm o verso da caixa: a busca de metadados o salva do ES-DE, ScreenScraper e TheGamesDB, e um botão Verso na capa da página do jogo o mostra. Clique no verso para ampliá-lo. Você pode enviar ou excluir um verso na janela Editar. Os versos são preenchidos sempre que um jogo é buscado; Preencher Faltantes não busca os metadados de um jogo de novo só por causa do verso'
  - type: fix
    label: Um jogo sem capa frontal no TheGamesDB não recebe mais o verso da caixa como capa
  - type: fix
    label: Se você desativar um buscador em Configurações enquanto uma busca de metadados em massa está em andamento, a contagem de jogos não encontrados agora fica correta a partir do próximo jogo. Antes, um jogo podia ser contado como interrompido
  - type: enhancement
    label: Em um sistema sem emulador configurado, o botão Jogar fica esmaecido. Aponte para ele para ver o motivo, ou clique nele para abrir uma caixa informando que não há emulador configurado. Antes, havia uma linha de texto ao lado do botão
  body: "<ul>\n  <li><strong>Jogos ganham logotipo.</strong> A busca de metadados salva o\n    logotipo de cada jogo, e a página do jogo o mostra acima do título, ou no lugar de uma\n    caixa ausente. Faça uma busca de metadados em massa com Preencher Faltantes para preencher os logotipos de\n    jogos que você já buscou antes.</li>\n  <li><strong>Jogos ganham o verso da caixa.</strong> Um botão Verso na\n    capa da página do jogo o mostra, e você pode clicar nele para ampliar. Os versos\n    são preenchidos sempre que um jogo é buscado.</li>\n  <li><strong>Uma captura de tela excluída continua excluída.</strong> A próxima busca de metadados\n    não a copia de volta nem a baixa de novo.</li>\n  <li><strong>Jogar explica por que não inicia.</strong> Em um sistema sem\n    emulador configurado, o botão Jogar fica esmaecido e informa o motivo.</li>\n</ul>\n"
- version: 3.35.3
  date: '2026-11-02'
  tags:
  - type: feature
    label: 'Nova ferramenta Nomes MAME em Ferramentas de ROM: os jogos do MAME recebem nome real, ano e fabricante da própria lista do MAME, e os arquivos mantêm os nomes curtos. Depois, uma busca de metadados encontra cada jogo, e você pode filtrar a lista do MAME por categoria, por exemplo para deixar de fora caça-níqueis. Os conjuntos de BIOS ficam ocultos da lista'
  - type: fix
    label: Os Relatórios de ROM não oferecem mais renomear arquivos do MAME, porque um arquivo renomeado deixa de funcionar no MAME
  - type: fix
    label: Configurações agora mostra o que a Microsoft exige antes de registrar um app Xbox. Não foi possível testar o login do Xbox por causa disso
  - type: enhancement
    label: O cartão separado Nomes Oficiais saiu do Preencher com AI em massa, porque a opção Nome oficial do preenchimento já faz esse trabalho
  - type: fix
    label: Quando a Sony recusa um login salvo da PlayStation, o painel e as Configurações agora avisam e pedem para vincular de novo. Antes, o log mostrava um erro sem sentido a cada início do servidor e nada avisava você
  - type: feature
    label: Importar da Steam agora preenche, em segundo plano, a descrição, os créditos, a nota do Metacritic, as classificações etárias, os modos de jogo, a caixa, o fundo e as capturas de tela de cada jogo a partir da página da loja. Use Buscar Metadados em um jogo para obter o gênero e a data de lançamento
  - type: feature
    label: Uma sincronização da Steam agora mantém seu tempo de jogo e quando você jogou pela última vez, e a página do jogo mostra esses dados
  - type: fix
    label: Buscar Biblioteca na página de importação da Steam agora funciona para um administrador com chave da Steam salva. Antes, enviava à Steam a versão oculta da chave, e a página dizia por engano para deixar seu perfil como Público
  - type: fix
    label: Um jogo da Steam ou Xbox que já está na sua biblioteca com o mesmo nome agora é vinculado a esse jogo ao importar, e suas conquistas são sincronizadas. Antes, ele era ignorado e nunca vinculado
  - type: fix
    label: Jogos importados da Steam, Xbox e PlayStation agora são ordenados corretamente desde o início, como Final Fantasy IX antes de Final Fantasy X, e os símbolos de marca registrada da Steam ficam fora dos nomes
  - type: feature
    label: Em sistemas onde o RetroAchievements usa um hash simples do arquivo, como Mega Drive e Game Boy, a página do jogo informa se sua cópia rende conquistas, e esse hash vincula o jogo certo. Execute RA Refresh para preencher isso
  - type: fix
    label: Uma busca de metadados agora consulta o ScreenScraper pelo seu arquivo exato antes de pesquisar por nome, assim ele acha o seu jogo e não outro com título parecido. Resultados que você marcar continuam valendo
  - type: enhancement
    label: A caixa de progresso de Redimensionar Imagens agora mostra o jogo e o sistema de cada imagem
  - type: feature
    label: Buscar Metadados agora traz telas de título do ScreenScraper e do TheGamesDB, mais nomes oficiais do IGDB e do TheGamesDB (como o título japonês de um jogo), e os outros consoles em que um jogo foi lançado, vindos do IGDB
  - type: feature
    label: Um jogo sem nota de usuário agora usa a classificação da sua coleção do ES-DE, se houver
  - type: feature
    label: A página do jogo mostra quantos jogadores cronometraram um resultado do HowLongToBeat e tem um link para a página dele. Resultados salvos antes mostram isso na próxima vez que você os buscar
  - type: feature
    label: A página do RetroAchievements mostra quantas pessoas jogam um jogo e que parcela delas ganhou cada conquista
  - type: fix
    label: O navegador de pastas das Ferramentas de ROM agora abre na sua pasta de ROMs quando não tem pasta inicial, em vez de falhar. Uma resposta corrompida do IGDB agora custa só aquele detalhe, não tudo o que o IGDB enviou sobre o jogo
  - type: fix
    label: O limite diário do ScreenScraper agora faz o RetroDB parar de consultar até mais tarde, e uma busca de metadados em massa avisa e segue com as outras fontes. Antes, um limite esgotado parecia "jogo não encontrado" e as chamadas continuavam a noite toda
  - type: fix
    label: Um jogo que nenhuma fonte conseguiu responder enquanto um serviço estava no limite não é mais marcado como pesquisado, então a próxima execução tenta de novo
  - type: fix
    label: Quando uma chave do TheGamesDB esgota o mês, o RetroDB passa para a sua outra chave e para de consultar quando as duas acabam
  - type: fix
    label: O limite mensal do RAWG agora também faz o RetroDB parar de consultar, e o IGDB é mantido dentro do limite de quatro requisições por segundo
  - type: fix
    label: A busca em massa do HowLongToBeat agora termina com uma mensagem quando o site diz que recebeu requisições demais, e todas as requisições ao site são espaçadas
  - type: fix
    label: Corrigir Regiões de Caixa e Manual não desiste mais após 25 jogos seguidos que o ScreenScraper não conhece. Ele só para quando o ScreenScraper informa que o limite foi atingido
  - type: fix
    label: Na página do jogo, cada classificação etária agora fica centralizada acima do rótulo de palpite da AI
  - type: fix
    label: A cota do TheGamesDB em Configurações agora usa a verificação que não gasta sua cota, e não mostra mais uma data de renovação inventada quando o serviço não informa nenhuma
  body: |
    <ul>
      <li><strong>Jogos de MAME ganham seus nomes reais.</strong> A nova ferramenta Nomes do MAME, em Ferramentas de ROM, pega nomes, anos e fabricantes da própria lista do MAME.
        Os arquivos mantêm os nomes curtos, porque o MAME precisa deles. Você pode
        filtrar a lista do MAME por categoria, e os conjuntos de BIOS ficam ocultos.</li>
      <li><strong>Importações da Steam trazem muito mais.</strong> Cada jogo preenche a sua
        descrição, créditos, nota do Metacritic, classificações etárias, modos de jogo e
        imagens a partir da página da loja. Uma sincronização mantém seu tempo de jogo e a data da
        última vez que você jogou. Um jogo que já está na sua biblioteca com o mesmo nome agora
        é vinculado a ele, e assim suas conquistas são sincronizadas.</li>
      <li><strong>As buscas de metadados encontram o seu jogo exato.</strong> Uma busca consulta o
        ScreenScraper sobre o seu arquivo exato antes de pesquisar pelo nome. As buscas
        também trazem telas de título, mais nomes oficiais e os outros consoles em que
        um jogo foi lançado.</li>
      <li><strong>RetroAchievements reconhece a sua cópia.</strong> Em sistemas que
        usam um hash de arquivo simples, como Mega Drive e Game Boy, a página do jogo
        informa se a sua cópia dá direito a conquistas. Execute Atualizar RA para preencher
        isso. A página do RetroAchievements também mostra quantas pessoas jogam um jogo
        e que parcela delas ganhou cada conquista.</li>
      <li><strong>Os limites online são respeitados.</strong> Quando o ScreenScraper,
        TheGamesDB ou RAWG atinge o limite, o RetroDB para de consultar até mais tarde
        e uma busca em massa segue com as outras fontes. Um jogo que nenhuma fonte
        conseguiu responder naquele momento é tentado de novo na próxima execução.</li>
      <li><strong>Um login recusado da PlayStation agora é avisado.</strong> O painel
        e as Configurações agora pedem que você vincule de novo quando a Sony recusa um
        login salvo.</li>
      <li><strong>Nomes Oficiais mudou de lugar.</strong> O cartão separado foi removido
        do Preenchimento em Massa com AI, pois a opção Nome oficial do preenchimento
        faz o mesmo trabalho.</li>
    </ul>
- version: 3.35.2
  date: '2026-11-02'
  tags:
  - type: fix
