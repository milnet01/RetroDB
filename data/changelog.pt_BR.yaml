    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: Os ícones de troféus e de plataformas voltaram ao download
  body: |
    <ul>
      <li><strong>O download estava sem os ícones de troféus e de plataformas do
        RetroDB.</strong> Todo cartão de jogo com RetroAchievements mostrava uma imagem
