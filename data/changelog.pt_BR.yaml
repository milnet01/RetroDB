  - type: fix
    label: Uma nota da AI na escala errada é recusada, então um jogo bem avaliado não recebe mais 7 de 100 em uma nova busca
  - type: fix
    label: A contagem de notas vinda da AI não é mais salva junto à nota de outro site, e a página do jogo não mostra mais uma que tenha sido salva assim
  - type: fix
    label: Uma faixa de vendas ou uma quantia em dinheiro vinda da AI não vira mais algumas cópias vendidas
  - type: fix
    label: As respostas da AI não guardam mais listas como código, as palavras N/A ou None como valores, nem o próprio console do jogo em outras plataformas
