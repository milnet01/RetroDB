    label: 'Um botão Procurar em cada caixa de caminho'
  body: |
    <ul>
      <li><strong>Trapaças para RetroArch (RetroDB), DuckStation e
        PCSX2.</strong> Configurações &gt; Emuladores tem uma nova seção
        Trapaças. Baixe ali os pacotes públicos e gratuitos de trapaças, ou
        importe pastas de trapaças que você já tem; o RetroDB copia os
        arquivos e nunca altera a sua pasta. A página do jogo passa a listar
        as trapaças dele, cada uma com um interruptor liga/desliga, e uma
        caixa de busca quando são muitas. No RetroArch (RetroDB), as
        trapaças que você ativa valem a partir da próxima vez que você
        pressionar Jogar, e as mudanças feitas no menu do RetroArch durante
        o jogo são mantidas. No DuckStation e no PCSX2, os interruptores são
        salvos nas próprias configurações do emulador para o jogo, então
        mudanças feitas dentro do emulador também aparecem na página. O
        RetroDB nunca sobrescreve um arquivo de trapaças que o emulador já
        tem. Uma trapaça ativada pausa o modo hardcore do
        RetroAchievements.</li>
      <li><strong>Importe uma caixa 3D do Slipcase para um jogo.</strong> A
        página do jogo tem um botão Importar caixa 3D abaixo da capa.
        Escolha o arquivo <code>.box.json</code> que o Slipcase salvou,
        junto com as imagens dele, e o RetroDB guarda a frente, a lombada,
        o verso e as outras faces da caixa para esse jogo. A sua imagem de
        capa 3D não é alterada. Um jogo que já tem faces pergunta antes de
        substituí-las, e Remover as apaga.</li>
      <li><strong>Gire a caixa 3D de um jogo nas suas mãos.</strong> Clique
        na capa de um jogo com uma caixa do Slipcase importada e a caixa
        aparece em 3D. Arraste-a, ou use as setas do teclado, para girá-la
        e ver a lombada, o verso, o topo e a base. Role ou pressione + e -
        para ampliar; clique duas vezes ou pressione Home para voltar ao
        início. Um jogo sem caixa importada continua ampliando a imagem da
        capa.</li>
      <li><strong>As Configurações têm link para a página
        Emuladores.</strong> A página Emuladores não tinha link em nenhum
        lugar das Configurações, então só dava para chegar nela digitando o
        endereço. Agora os administradores veem uma aba Emuladores depois
        de Sistema, e a página Emuladores mostra a mesma barra de abas,
        então as outras abas ficam a um clique.</li>
      <li><strong>O zoom da capa não fica mais escondido atrás dos
        menus.</strong> No celular, as barras de cima e de baixo ficavam
        sobre a capa ampliada e escondiam o botão de fechar, e no computador
        a barra lateral cobria o lado esquerdo dela. Agora o zoom abre acima
        de tudo.</li>
      <li><strong>Modelos Claude 5.5 para a IA.</strong> Configurações &gt; Busca de metadados lista os modelos Claude mais novos da Anthropic: Haiku 5.5, o novo padrão e o mais barato, Sonnet 5.5 e Opus 5.5, com os preços atuais. O RetroDB não envia mais uma configuração que o Sonnet 5.5 recusa.</li>
      <li><strong>Digite as vendas de um jogo.</strong> As duas telas de edição têm um campo "Cópias vendidas" abaixo de Desenvolvedora. O número digitado aparece na página do jogo, como um encontrado pela IA. Esvazie o campo para removê-lo.</li>
      <li><strong>Teste sua chave de IA nas Configurações.</strong> Configurações &gt; Busca de metadados tem um botão "Testar a chave de IA salva" abaixo do provedor de IA. Ele mostra se a chave funciona e, se não, por quê: chave recusada, sem crédito ou limite de uso. Antes, uma chave recusada parecia funcionar.</li>
      <li><strong>O Claude pode pesquisar números de vendas na web.</strong> Configurações &gt; Busca de metadados tem uma chave "Deixar o Claude pesquisar na web" abaixo do modelo Claude, desligada no início. Sem pesquisa, o Claude responde com o que já sabe e deixa "Cópias vendidas" em branco. Com a chave ligada, o Claude busca os números. A Anthropic cobra por cada pesquisa, então o Preencher com AI faz no máximo 5 pesquisas por jogo, até 5 centavos de dólar; desligue a chave antes de um scraping em massa grande.</li>
      <li><strong>Preencher com AI um sistema inteiro de uma vez.</strong> Ferramentas de ROM tem uma nova página Preenchimento em Lote com AI, que também abriga Nomes Oficiais. Escolha um sistema, ou Todos os Sistemas, ative os campos que quer preencher e clique em Preencher com IA: o RetroDB roda o Preencher com AI em cada jogo, igual ao botão Preencher com AI na página de um jogo, e salva as respostas direto no jogo. Uma barra de progresso e um aviso do Preencher com AI mostram até onde foi, e você pode sair da página enquanto ele roda. Ele mostra quantos jogos vai preencher e pergunta antes, porque seu provedor de IA cobra por cada jogo. Jogos que já passaram pelo Preencher com AI são pulados, a menos que você os inclua de volta, e a execução para sozinha se a IA parar de responder.</li>
      <li><strong>Os avisos de tarefas usam as cores do seu tema.</strong> As caixas que mostram uma tarefa em andamento, como Coleta em Lote e RA Sync, e as barras de progresso agora usam as cores do tema que você escolheu. Uma tarefa que não pode ser pausada não mostra mais o título na cor de pausa.</li>
      <li><strong>A página Emuladores se parece com as outras abas de Configurações.</strong> Configurações &gt; Emuladores agora é dividida em cartões, e uma barra abaixo das abas leva a cada um: RetroArch, Jogar no RetroDB, Cores, Trapaças, Pastas, Emuladores e Mapeamento. A barra fica no topo enquanto você rola e marca a seção em que você está.</li>
      <li><strong>Progresso do download ao lado do botão.</strong> Ao baixar o RetroArch, os cores do player ou um pacote de trapaças, uma nota ao lado do botão mostra em porcentagem quanto já foi baixado. Antes, uma linha aparecia abaixo dos botões e empurrava o resto da página para baixo.</li>
      <li><strong>Escolha o emulador de cada sistema em uma lista.</strong> Mapeamento por sistema em Configurações &gt; Emuladores agora mostra cada sistema uma vez, com uma lista dos emuladores vinculados a ele. O que você escolher é o que Jogar usa para os jogos desse sistema, a menos que um jogo defina o próprio. Um emulador que o RetroDB não consegue encontrar aparece marcado como "não encontrado". Antes, cada sistema tinha uma linha por emulador, com um pontinho para escolher o padrão. O RetroArch do próprio RetroDB agora está na lista de cada sistema listado que ele consegue executar, inclusive sistemas que ainda não têm jogos.</li>
      <li><strong>Um botão Procurar em cada caixa de caminho.</strong> Administradores agora podem escolher uma pasta ou um programa clicando pelas pastas do computador em vez de digitar o caminho: Configurações &gt; Emuladores, Biblioteca, Busca de metadados e Conta, e as configurações de Ferramentas de ROM. Caixas que esperam um programa também mostram arquivos. Pastas ocultas como <code>.config</code> aparecem por último.</li>
    </ul>
