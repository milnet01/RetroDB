  body: |
    <ul>
      <li><strong>Trucchi per RetroArch (RetroDB), DuckStation e
        PCSX2.</strong> Impostazioni &gt; Emulatori ha una nuova sezione
        Trucchi. Da lì scarica i pacchetti di trucchi pubblici e gratuiti,
        oppure importa le cartelle di trucchi che hai già; RetroDB copia i
        file e non modifica mai la tua cartella. La pagina di un gioco
        elenca poi i suoi trucchi, ognuno con un interruttore, e una
        casella di ricerca quando sono tanti. In RetroArch (RetroDB) i
        trucchi che attivi valgono dalla prossima volta che premi Gioca, e
        le modifiche che fai nel menu di RetroArch durante il gioco vengono
        mantenute. Per DuckStation e PCSX2 gli interruttori vengono salvati
        nelle impostazioni dell'emulatore per quel gioco, così anche le
        modifiche fatte dentro l'emulatore compaiono nella pagina. RetroDB
        non sovrascrive mai un file di trucchi che un emulatore ha già. Un
        trucco attivo sospende la modalità hardcore di
        RetroAchievements.</li>
      <li><strong>Importa una scatola 3D di Slipcase in un gioco.</strong>
        La pagina di un gioco ha un pulsante Importa scatola 3D sotto la
        copertina. Scegli il file <code>.box.json</code> salvato da
        Slipcase, insieme alle sue immagini, e RetroDB conserva per quel
        gioco il fronte, il dorso, il retro e le altre facce della scatola. Slipcase 1.4.0 o successivo salva questo file accanto a ogni immagine esportata.
        La tua immagine boxart 3D non cambia. Un gioco che ha già le facce
        chiede conferma prima di sostituirle, e Rimuovi le elimina.</li>
      <li><strong>Gira tra le mani la scatola 3D di un gioco.</strong> Fai
        clic sulla copertina di un gioco con una scatola Slipcase importata
        e la scatola appare in 3D. Trascinala, o usa i tasti freccia, per
        girarla e vedere il dorso, il retro, la parte superiore e quella
        inferiore. Scorri o premi + e - per lo zoom; fai doppio clic o
        premi Home per rimetterla com'era. Un gioco senza una scatola
        importata ingrandisce ancora la sua copertina.</li>
      <li><strong>Le Impostazioni hanno un collegamento alla pagina
        Emulatori.</strong> La pagina Emulatori non aveva alcun
        collegamento nelle Impostazioni, quindi potevi raggiungerla solo
        digitandone l'indirizzo. Ora gli amministratori vedono una scheda
        Emulatori dopo Sistema, e la pagina Emulatori mostra la stessa barra
        di schede, così le altre schede sono a un clic di distanza.</li>
      <li><strong>Lo zoom della copertina non è più nascosto dietro i
        menu.</strong> Su un telefono le barre in alto e in basso coprivano
        la copertina ingrandita e nascondevano il suo pulsante di chiusura,
        e su un computer la barra laterale ne copriva il lato sinistro. Ora
        lo zoom si apre sopra tutto.</li>
      <li><strong>Modelli Claude 5.5 per l'IA.</strong> Impostazioni &gt; Scansione elenca i modelli Claude più recenti di Anthropic: Haiku 5.5, il nuovo predefinito e il più economico, Sonnet 5.5 e Opus 5.5, con i prezzi attuali. RetroDB non invia più un'impostazione che Sonnet 5.5 rifiuta.</li>
      <li><strong>Inserisci le vendite di un gioco.</strong> Entrambe le schermate di modifica hanno un campo «Copie vendute» sotto Sviluppatore. Il numero che inserisci appare nella pagina del gioco, come uno trovato dall'IA. Svuota il campo per toglierlo.</li>
      <li><strong>Prova la chiave IA nelle Impostazioni.</strong> Impostazioni &gt; Scansione ha un pulsante «Prova la chiave IA salvata» sotto il fornitore di IA. Dice se la chiave funziona e, se no, perché: chiave rifiutata, nessun credito o limite di utilizzo. Prima, una chiave rifiutata sembrava funzionare.</li>
      <li><strong>Claude può cercare sul web i dati di vendita.</strong> Impostazioni &gt; Scansione ha un interruttore «Lascia che Claude cerchi sul web» sotto il modello Claude, spento all'inizio. Senza ricerca, Claude risponde con ciò che sa già e lascia vuote le copie vendute. Con l'interruttore acceso, Claude cerca i dati. Anthropic fa pagare ogni ricerca, quindi Riempimento AI fa al massimo 5 ricerche per gioco, fino a 5 centesimi di dollaro; spegni l'interruttore prima di una grande scansione in blocco.</li>
      <li><strong>Riempimento AI di un intero sistema in una volta.</strong> Strumenti ROM ha una nuova pagina Riempimento AI in blocco, che contiene anche Nomi ufficiali. Scegli un sistema, o Tutti i sistemi, attiva i campi che vuoi riempire e premi Riempi con l'IA: RetroDB esegue il Riempimento AI su ogni gioco, come il pulsante Riempimento AI nella pagina di un gioco, e salva le risposte direttamente nel gioco. Una barra di avanzamento e un riquadro di notifica del Riempimento AI mostrano a che punto è, e puoi lasciare la pagina mentre procede. Mostra quanti giochi riempirà e chiede prima, perché il tuo fornitore di IA addebita ogni gioco. I giochi già trattati dal Riempimento AI vengono saltati a meno che tu non li includa di nuovo, e il passaggio si ferma da solo se l'IA smette di rispondere.</li>
      <li><strong>I riquadri di notifica dei processi usano i colori del tuo tema.</strong> I riquadri che mostrano un processo in corso, come lo scraping in blocco e RA Sync, e le barre di avanzamento ora usano i colori del tema che hai scelto. Un processo che non può essere messo in pausa non mostra più il titolo nel colore della pausa.</li>
      <li><strong>La pagina Emulatori somiglia alle altre schede delle Impostazioni.</strong> Impostazioni &gt; Emulatori ora è divisa in riquadri, e una barra sotto le schede porta a ciascuno: RetroArch, Gioca in RetroDB, Core, Trucchi, Cartelle, Emulatori e Associazioni. La barra resta in alto mentre scorri e segnala la sezione in cui ti trovi.</li>
      <li><strong>Avanzamento del download accanto al pulsante.</strong> Quando scarichi RetroArch, i core del player o un pacchetto di trucchi, una nota accanto al pulsante mostra in percentuale a che punto è il download. Prima compariva una riga sotto i pulsanti che spingeva in basso il resto della pagina.</li>
      <li><strong>Scegli l'emulatore di ogni sistema da un elenco.</strong> Associazione per sistema in Impostazioni &gt; Emulatori ora mostra ogni sistema una sola volta, con l'elenco degli emulatori collegati. Quello che scegli è quello che Gioca usa per i giochi di quel sistema, a meno che un gioco non ne imposti uno proprio. Un emulatore che RetroDB non riesce a trovare è segnato come «non trovato». Prima ogni sistema aveva una riga per emulatore, con un piccolo punto per scegliere quello predefinito. Il RetroArch di RetroDB è ora nell'elenco di ogni sistema elencato che può eseguire, compresi i sistemi che non hanno ancora giochi.</li>
      <li><strong>Un pulsante Sfoglia su ogni casella di percorso.</strong> Gli amministratori ora possono scegliere una cartella o un programma navigando tra le cartelle del computer invece di digitarne il percorso: Impostazioni &gt; Emulatori, Libreria, Scansione e Account, e le impostazioni di Strumenti ROM. Le caselle che richiedono un programma mostrano anche i file. Le cartelle nascoste come <code>.config</code> sono elencate per ultime.</li>
      <li><strong>Lo stick sinistro funziona come D-Pad nel RetroArch di RetroDB.</strong> Nei giochi per sistemi senza stick, come NES o Mega Drive, ora puoi muoverti con lo stick sinistro oltre che con il D-Pad. Quando il core dell'emulatore di un gioco legge direttamente lo stick, come su Nintendo 64, lo stick resta un vero stick.</li>
      <li><strong>Accedi a RetroAchievements dalle Impostazioni.</strong> Impostazioni &gt; Account ora può farti accedere per il RetroArch di RetroDB, così gli obiettivi si sbloccano mentre giochi senza accedere dentro l'emulatore. La password viene inviata solo a RetroAchievements e non viene conservata. Ogni utente di RetroDB ha il proprio accesso e il proprio interruttore Modalità hardcore, che parte disattivato. DuckStation e PCSX2 accedono ancora dai propri menu.</li>
      <li><strong>Scopri quale emulatore userà Gioca.</strong> La pagina di un gioco ora mostra «Si avvia in:» e il nome dell'emulatore accanto al pulsante Gioca, oppure indica che nessun emulatore è configurato.</li>
      <li><strong>Il pannello Trucchi spiega perché un gioco non ne ha.</strong> Quando l'emulatore di un gioco non può usare i trucchi, il pannello ora ne indica il motivo invece di restare nascosto.</li>
      <li><strong>I percorsi lunghi delle cartelle entrano nel telefono.</strong> Un percorso lungo di una cartella nelle Impostazioni non fa più scorrere la pagina di lato.</li>
    </ul>
