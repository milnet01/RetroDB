  body: |
    <ul>
      <li><strong>Le versioni regionali di un gioco appaiono come un unico
        gioco.</strong> Collega le versioni che possiedi (per esempio le
        edizioni USA, europea e giapponese) e la Libreria mostra un&rsquo;unica
        scheda con un badge &#127760;. La scheda apre e avvia la versione della
        tua Regione predefinita. La pagina del gioco elenca tutte le versioni
        una accanto all&rsquo;altra e ti permette di passare dall&rsquo;una
        all&rsquo;altra. Strumenti ROM &gt; Versioni regionali propone gruppi che
        gli editor devono confermare; niente viene collegato senza di te. Non
        propone mai un seguito come versione del primo gioco. Le versioni
        collegate non vengono più segnalate come duplicati per nome. Esegui una
        volta Recupera titoli alternativi per dare alle proposte più materiale
        su cui lavorare.</li>
      <li><strong>L&rsquo;AI può riassumere le differenze tra le versioni
        regionali.</strong> In un gioco con versioni collegate, gli editor
        possono premere Riassumi le differenze con l'AI nella sezione Versioni
        regionali. L&rsquo;AI elenca le differenze note, come censura,
        difficoltà o contenuti rimossi. L&rsquo;elenco è indicato come scritto
        dall&rsquo;AI, compare nella pagina di ogni versione e si nasconde quando
        colleghi o scolleghi una versione, finché non viene riscritto. Serve un
        fornitore AI configurato in Impostazioni &gt; Scansione.</li>
      <li><strong>I giochi PlayStation partono con buone impostazioni.</strong>
        Per DuckStation, PCSX2 e RPCS3, quando premi Gioca RetroDB ora imposta
        la scala di risoluzione e il formato dell&rsquo;immagine di ogni gioco
        nel file di impostazioni per gioco dell&rsquo;emulatore stesso, e se il
        gioco parte a schermo intero. Cambiale per un intero sistema con il
        pulsante Impostazioni in Impostazioni &gt; Emulatori, o per un solo
        gioco nel nuovo riquadro Impostazioni emulatore della sua pagina.
        Un&rsquo;impostazione che cambi dentro l&rsquo;emulatore vince sempre.
        RetroDB legge il numero di serie di ogni disco per trovare il file
        giusto; i dischi CHD richiedono chdman installato.</li>
      <li><strong>Il Riempimento AI non può più essere manovrato dal testo
        scritto nei campi di un gioco.</strong> Quando il Riempimento AI
        controlla editore, sviluppatore, edizione o altre piattaforme già
        presenti in un gioco, ora ripulisce prima quel testo, come faceva già
        con il titolo.</li>
      <li><strong>Le scansioni degli Strumenti ROM restano dentro la tua
        cartella ROM.</strong> Convertitore CHD e Verifica CHD non seguono più
        un collegamento (symlink) che punta fuori da essa, e
        l&rsquo;estrazione di un archivio multidisco ignora qualsiasi
        collegamento contenuto nell&rsquo;archivio.</li>
      <li><strong>Le pagine si rifiutano di eseguire script infilati al loro
        interno.</strong> Il tuo browser ora blocca qualsiasi script che RetroDB
        non abbia scritto da sé, quindi un testo che nasconde del codice nel
        titolo di un gioco, in un&rsquo;etichetta o in una descrizione ottenuta
        dallo scraping non può eseguirlo. Pulsanti e menu funzionano come
        prima.</li>
      <li><strong>Uno screenshot danneggiato non blocca più il controllo dei
        duplicati di un gioco.</strong> Uno screenshot illeggibile viene messo
        da parte e il controllo continua.</li>
      <li><strong>I processi degli Strumenti ROM non restano più bloccati su
        "in esecuzione".</strong> Un file eliminato dopo una scansione di
        Verifica CHD viene contato come non valido, e qualsiasi errore imprevisto
        in Conversione CHD, Verifica CHD o Cerca duplicati chiude il processo
        come fallito, con l&rsquo;errore nel suo log.</li>
      <li><strong>Prima che la configurazione sia completata, le richieste di
        dati dell&rsquo;app ricevono una risposta chiara.</strong> Rispondono
        "Configurazione richiesta" invece di restituire la pagina di
        configurazione. Le pagine ti portano comunque alla procedura guidata di
        configurazione.</li>
      <li><strong>I seguiti non mostrano più gli obiettivi del primo
        gioco.</strong> L&rsquo;abbinamento con RetroAchievements ignorava il
        numero nel titolo, quindi Donkey Kong Country 2 e 3 venivano collegati a
        Donkey Kong Country. Ora i numeri (2, II, 3, III e così via) contano. Per
        correggere i giochi già collegati, esegui una volta l&rsquo;aggiornamento
        di RetroAchievements per tutti i sistemi.</li>
      <li><strong>Una sincronizzazione PlayStation non azzera più il conteggio
        dei trofei.</strong> Quando la risposta di PlayStation non includeva i
        totali dei trofei di un gioco, RetroDB salvava degli zeri al posto dei
        conteggi che aveva già. Ora li mantiene, anche nell&rsquo;aggiornamento
        dei trofei in blocco.</li>
      <li><strong>Aprire un set di trofei che non è più sul disco mostra un
        messaggio.</strong> La pagina Trofei andava in errore; ora dice che il
        set non è stato trovato e ti riporta all&rsquo;elenco.</li>
      <li><strong>Le tabelle degli Strumenti ROM danno il nome giusto alla
        colonna dei pulsanti in ogni lingua.</strong> L&rsquo;intestazione della
        colonna condivideva il testo con il genere Azione, quindi alcune lingue
        mostravano lì il nome del genere.</li>
      <li><strong>I giochi GameCube, 3DS e Super Famicom ricevono il loro
        emulatore in automatico.</strong> RetroDB cercava questi sistemi con nomi
        di cartella che le librerie non usano (gamecube, 3ds, superfamicom invece
        di gc, n3ds, sfc), quindi Dolphin e Citra non venivano mai collegati.
        Riavvia RetroDB una volta per applicare la correzione.</li>
      <li><strong>Il download senza Python (standalone) configura di nuovo gli
        emulatori.</strong> Gli mancava il file che li elenca.</li>
      <li><strong>Circa 170 pulsanti, etichette e messaggi in più sono
        tradotti</strong> in ogni lingua. Prima apparivano in inglese, e alcuni
        mostravano una traduzione sbagliata (alcune lingue dicevano "backup non
        riuscito" quando un gioco non si avviava).</li>
      <li><strong>Esc chiude solo la finestra in primo piano.</strong> Con una
        domanda aperta sopra un&rsquo;altra finestra, Esc le chiudeva entrambe;
        alcune finestre continuavano anche a funzionare dopo che Esc le aveva
        nascoste, e premere Esc nella pagina di un gioco poteva riprendere uno
        scraping in blocco che avevi messo in pausa. Ora ogni finestra si chiude
        con la propria azione Chiudi, mantiene il focus della tastiera al suo
        interno mentre è aperta e lo restituisce al pulsante che l&rsquo;ha
        aperta. Le finestre di avanzamento dei processi in corso restano aperte
        finché il processo non termina.</li>
      <li><strong>I grafici di Analisi sono nella tua lingua.</strong> I nomi di
        generi, prospettive, dimensioni e modalità, i titoli dei grafici, i nomi
        degli assi e le legende erano in inglese in ogni lingua.</li>
      <li><strong>I dati di RetroAchievements sono più al sicuro.</strong> Se
        l&rsquo;elenco dei giochi RetroAchievements di una console non si
        carica, l&rsquo;aggiornamento RA ora lascia collegati i giochi di quella
        console invece di scollegarli tutti. Cancella dati RA ora cancella solo
        i progressi di RetroAchievements; i progressi di Steam e Xbox
        restano.</li>
      <li><strong>Le password devono avere almeno 12 caratteri
        ovunque.</strong> La configurazione iniziale accettava una password di
        amministratore di qualsiasi lunghezza, e le pagine del cambio password
        obbligatorio e della configurazione dicevano che bastavano 4 caratteri.
        Ora tutte e tre ne chiedono 12, come il resto dell&rsquo;app.</li>
      <li><strong>I totali degli obiettivi sono giusti, e sono i
        tuoi.</strong> Sincronizzare un solo gioco da RetroAchievements ora
        salva quanti obiettivi ha, invece di 0. I totali degli obiettivi nella
        dashboard contano solo i tuoi giochi, e i Trofei del collezionista non
        contano più due volte ogni obiettivo di Steam o Xbox.</li>
      <li><strong>Le sincronizzazioni in background usano i tuoi
        account.</strong> Una sincronizzazione di sistema di RetroAchievements
        accede con il tuo account RetroAchievements, se ne hai impostato uno.
        L&rsquo;aggiornamento PlayStation in blocco riutilizza l&rsquo;accesso
        salvato invece di accedere da zero ogni volta.</li>
      <li><strong>Solo tu puoi fermare o riprendere la tua
        sincronizzazione.</strong> Un altro utente non può più annullare la tua
        sincronizzazione di RetroAchievements, Steam o Xbox, e riprendere un
        processo interrotto richiede gli stessi permessi necessari per avviarlo.
        Gli amministratori possono ancora fare entrambe le cose.</li>
      <li><strong>La tua cartella dei trofei RPCS3 viene controllata quando la
        salvi.</strong> Una cartella che non esiste, non è un percorso completo
        o è una cartella di sistema viene rifiutata, come già avveniva nelle
        impostazioni principali.</li>
      <li><strong>"Recupera tutte le immagini" del Museo funziona in
        background.</strong> La pagina non aspetta più minuti per ogni immagine
        dei controller. Mostra a che punto è il recupero, ha un pulsante Annulla
        e riprende a mostrare l&rsquo;avanzamento se lasci la pagina e ci
        torni.</li>
      <li><strong>Gli Strumenti ROM proteggono meglio i tuoi file.</strong> La
        pulizia non svuota più un archivio: uno schema come <code>*</code> non
        può essere salvato, e la pulizia si ferma se gli schemi rimuoverebbero
        tutti i file. Il Convertitore CHD conserva l&rsquo;originale quando
        "verifica" è disattivato, e lascia stare un CHD esistente quando "salta
        esistenti" è attivo. Cerca duplicati conserva sempre una copia di ogni
        gioco, anche se una richiesta le chiede tutte.</li>
      <li><strong>I processi degli Strumenti ROM fanno quello che dicono i
        pulsanti.</strong> Pausa ora mette in pausa Conversione CHD, Verifica
        CHD, Cerca duplicati e Deduplicazione screenshot, e un processo in pausa
        può essere annullato. Una scansione di Deduplicazione screenshot che
        incontra un errore ora termina come fallita invece di continuare per
        sempre.</li>
      <li><strong>Create M3U non appoggia più gli archivi in una cartella
        temporanea.</strong> Gli archivi spostati ora vanno nella cartella dati
        di RetroDB, che non viene svuotata al riavvio. Lo scanner degli archivi
        mostra dove sono finiti, e la conferma in blocco avvisa che verranno
        spostati. Il ripristino delle impostazioni degli Strumenti ROM ora
        ripristina tutte le opzioni.</li>
      <li><strong>Cambia disco da RetroDB.</strong> Mentre è in esecuzione un
        gioco RetroArch avviato da un elenco di dischi .m3u, l&rsquo;elenco
        &#9654; In riproduzione in cima a ogni pagina mostra il titolo del gioco
        e un pulsante Disco successivo, così un gioco che chiede il lato due
        continua con un clic, dal browser o da un telefono. RetroArch deve avere
        attivo Settings &gt; Network &gt; Network Commands (porta 55355); se è
        disattivato, il pulsante lo dice.</li>
      <li><strong>Lo script di avvio apre RetroDB quando è pronto.</strong>
        start.sh, start.command e start.bat aprivano il browser dopo 3 secondi
        fissi, spesso prima che il server potesse rispondere, quindi la pagina
        non si caricava. Ora RetroDB la apre appena il server è in ascolto. Se
        viene avviato da LocalWebServerManager, non apre nessuna pagina; usa il
        pulsante Open del gestore.</li>
      <li><strong>I video dei giochi possono arrivare a 500 MB.</strong> Il
        limite era 50 MB, troppo poco per la maggior parte dei trailer. Un
        caricamento troppo grande ora mostra un messaggio nella pagina del gioco
        invece di sostituire la pagina con del testo semplice. Un video
        rifiutato (troppo grande o del tipo sbagliato) ora lo dice invece di
        essere scartato senza una parola.</li>
      <li><strong>L&rsquo;avvio segue il percorso che hai impostato.</strong>
        Un Binary path override sulla riga di RetroArch in Impostazioni &gt;
        Emulatori ora vince sul percorso di RetroArch in cima alla stessa
        pagina; prima il percorso della riga veniva ignorato. Premere due volte
        Stop non chiede più due volte al gioco di chiudersi; su Linux RetroArch
        interpreta una seconda richiesta come "esci senza salvare", quindi il
        salvataggio nel gioco poteva andare perso. Un&rsquo;impostazione
        dell&rsquo;avvio rimasta da una modalità remota mai realizzata non
        impedisce più l&rsquo;avvio di tutti i giochi.</li>
      <li><strong>Le azioni non riuscite segnalano correttamente i loro
        errori.</strong> Quando un salvataggio, un&rsquo;importazione, una
        sincronizzazione o una scansione falliscono, RetroDB ora risponde con un
        vero stato di errore e mostra il motivo nel messaggio, invece di
        rispondere come se avesse funzionato. Salvare un codice di accesso PSN
        che non riesce a connettersi non mostra più dettagli interni
        dell&rsquo;errore. Accesso, gestione utenti, profilo, obiettivi,
        importazioni, Riempimento AI e ricerche su HowLongToBeat ora fanno lo
        stesso, e una lingua che non può essere salvata dice perché invece di
        "Errore di rete".</li>
      <li><strong>Ora funziona lo scraping dei giochi con nomi in stile
        No-Intro.</strong> Un titolo come "Legend of Zelda, The" o "Legend of
        Zelda, The - Ocarina of Time" ora corrisponde ai risultati "The Legend of
        Zelda" invece di essere scartato dal filtro di corrispondenza. Anche
        Report ROM smette di segnalare quei nomi come non corrispondenti.</li>
      <li><strong>I titoli presi dai nomi dei file perdono tutte le loro
        etichette.</strong> Ora vengono rimosse anche una regione combinata come
        "(USA, Europe)" e "(UK)". Sugli home computer come lo ZX Spectrum viene
        tolto tutto dall&rsquo;anno in poi, quindi "Chuckie Egg 2 (UK) (1985)
        (A'n'F Software) (tzx)" diventa "Chuckie Egg 2". Un nome di file che
        finisce con "..zip" non lascia più un punto di troppo. Le ricerche degli
        scraper, il ripristino dei dati di un gioco e le proposte di Versioni
        regionali usano questi nomi più puliti.</li>
      <li><strong>Un titolo sbagliato non si ripete più a ogni nuovo
        scraping.</strong> Lo scraping in blocco ora cerca con il nome del file
        ROM, non con il titolo salvato per il gioco. Un gioco che una volta era
        stato abbinato al gioco sbagliato trova quello giusto al nuovo
        scraping.</li>
      <li><strong>Gli scraper preferiscono la tua Regione predefinita.</strong>
        Quando due risultati sono alla pari, ora vince quello della tua Regione
        predefinita o World, non sempre quello USA. Due titoli che sono solo
        etichette di regione non contano più come corrispondenza perfetta.
        Versioni regionali non scambia più la X di "X-Men" per il numero di un
        seguito. La scelta della versione mostrata da una scheda ora legge solo
        il nome del file ROM, non le cartelle sopra di esso, e capisce vecchie
        etichette come "(U)" e "(E)".</li>
      <li><strong>Il log mostra dove va il tempo di scraping di ogni
        gioco.</strong> Dopo ogni gioco, RetroDB scrive nel log una riga con i
        secondi spesi a cercare, in ogni fonte, a scaricare, a elaborare le
        immagini, nell&rsquo;AI e a salvare. È il primo passo verso uno scraping
        più veloce.</li>
      <li><strong>Lo scraping finisce prima: le immagini piccole vengono rese
        più nitide dopo.</strong> Uno scraping ora salva il gioco con le immagini
        così come sono state scaricate. Le copertine e gli screenshot piccoli
        vengono poi ingranditi in background, un gioco alla volta. Gli
        screenshot duplicati vengono scartati prima di tutto questo lavoro. Se
        RetroDB si ferma a metà, riprende al successivo avvio.</li>
      <li><strong>Leggi il manuale di un gioco nella sua pagina.</strong> Il
        pulsante Manuale ora apre il PDF in una finestra sopra la pagina del
        gioco. Sfoglia le pagine con Precedente e Successiva, con i tasti
        freccia, Home e End, o con uno scorrimento del dito sul telefono; ogni
        pagina si gira come quella di un libro, o cambia semplicemente se il tuo
        sistema chiede meno animazioni. "Apri il PDF in una nuova scheda" c'è
        ancora, e Ctrl-clic su Manuale apre direttamente la scheda.</li>
      <li><strong>La barra laterale mostra quando le immagini sono ancora in
        fase di miglioramento.</strong> Mentre le immagini vengono rese più
        nitide in background, la barra laterale indica "Miglioramento immagini —
        Giochi rimanenti: N". Un gioco ancora in attesa lo dice nella sua
        pagina, e le sue immagini più nitide compaiono lì da sole quando sono
        pronte. L&rsquo;interruttore copertina 2D/3D non copre più quella
        riga.</li>
      <li><strong>Le fonti di riserva vengono interrogate tutte
        insieme.</strong> Quando la fonte principale lascia dei vuoti, RetroDB
        ora interroga le altre fonti contemporaneamente invece che una dopo
        l&rsquo;altra. Le loro risposte vengono comunque usate nell&rsquo;ordine
        delle tue Impostazioni, quindi per ogni campo vince la stessa
        fonte.</li>
      <li><strong>ES-DE legge il suo elenco dei giochi una volta sola.</strong>
        Ogni scraping, compresi quelli in blocco, leggeva il gamelist.xml di
        ES-DE di un sistema due volte per ogni gioco. Ora RetroDB lo legge una
        volta e lo rilegge solo quando il file cambia.</li>
      <li><strong>Applica in Cerca metadati non cerca più una seconda
        volta.</strong> Nella pagina di un gioco, i risultati che hai spuntato
        vengono presi direttamente dalla loro fonte invece di essere cercati di
        nuovo. Senza nulla di spuntato, solo la fonte che hai applicato e
        l&rsquo;AI riempiono i vuoti.</li>
      <li><strong>ScreenScraper trova i giochi con un sottotitolo.</strong> Non
        trovava nulla per un titolo come "Alone in the Dark: The New Nightmare"
        a meno che prima dei due punti ci fosse uno spazio. Ora RetroDB lo cerca
        in quel modo, e poi con la parte prima dei due punti se ancora non trova
        nulla.</li>
      <li><strong>I giochi senza nulla da avviare non offrono più
        Gioca.</strong> Un gioco aggiunto da un&rsquo;importazione CLZ, Steam,
        Xbox o PSN non ha un file ROM. La sua pagina ora non mostra il pulsante
        Gioca, né Impostazioni emulatore, né la sezione Avvia quando lo
        modifichi, come già le schede della Libreria.</li>
      <li><strong>I giochi RetroArch sono protetti da due impostazioni
        sbagliate.</strong> Ogni volta che avvia un gioco, RetroDB ora dà a
        RetroArch un piccolo file di impostazioni tutto suo, in aggiunta al tuo.
        Imposta la tastiera in base al tuo desktop (Wayland o X11), così la
        tastiera non è mai inattiva, e lascia andare l&rsquo;avanzamento veloce
        a piena velocità, che i giochi Commodore 64 usano per caricarsi in
        fretta. Tutte le altre impostazioni di RetroArch restano come
        sono.</li>
      <li><strong>Create M3U mantiene il gioco nella tua libreria.</strong>
        Trasformare un archivio multidisco in una playlist lasciava il gioco
        puntato all&rsquo;archivio, che nel frattempo era stato spostato. Ora il
        gioco punta alla nuova playlist e conserva i suoi dettagli e le sue
        immagini. Quando un archivio contiene più edizioni di un gioco, ognuna
        con i propri dischi, la playlist ora usa i dischi della prima edizione
        invece di tutti, e dice quali dischi ha lasciato fuori.</li>
      <li><strong>La Riscansione completa può mantenere i media che hai
        già.</strong> Spunta "Mantieni i media esistenti" accanto
        all&rsquo;interruttore Riscansione completa. I dettagli testuali vengono
        comunque aggiornati, ma immagini, video e manuali già sul disco restano
        come sono invece di essere scaricati di nuovo. Senza la spunta, una
        Riscansione completa non scarta più gli screenshot che aveva scaricato
        in precedenza.</li>
      <li><strong>I processi in background non perdono né saltano più
        lavoro.</strong> Un aggiornamento di RetroAchievements che incontrava un
        gioco problematico non butta più via i giochi che aveva già aggiornato.
        Una sincronizzazione o un aggiornamento ripresi non saltano più il gioco
        su cui si erano fermati. Una sincronizzazione di RetroAchievements o
        Steam ripresa da un&rsquo;istantanea molto vecchia ora si ferma con un
        messaggio invece di segnalare un successo senza aver sincronizzato
        nulla. La conversione WebP controlla un file WebP rimasto prima di
        fidarsene, e non parte se non riesce a leggere lo spazio libero sul
        disco.</li>
      <li><strong>Aggiornare un&rsquo;installazione molto vecchia non può più
        perdere dati in silenzio.</strong> Tre vecchi passaggi di aggiornamento
        del database potevano eliminare righe in rari casi. Ora copiano le
        righe, oppure si fermano con un errore chiaro invece di perderle.</li>
      <li><strong>I pulsanti della finestra Informazioni non sono più
        tagliati.</strong> La finestra è più larga e i suoi quattro pulsanti
        stanno su due righe, così ogni etichetta si vede per intero; sul
        telefono si impilano.</li>
      <li><strong>Il tuo tema ti segue in un nuovo browser.</strong> Accedere da
        un browser che non hai mai usato ora mostra il tema che hai salvato.
        Prima la pagina di accesso memorizzava per primo Cyberpunk, e restava
        quello.</li>
      <li><strong>La finestra della password di accesso non dice più "Admin
        Login".</strong> Ogni account accede con una password, quindi la
        finestra ora dice semplicemente Accedi. Lo dicono anche la pagina
        Account e la pagina Aiuto.</li>
      <li><strong>L&rsquo;Aiuto è aggiornato in ogni lingua.</strong> Le pagine
        di Aiuto tradotte ora descrivono le Versioni regionali, dicono che ogni
        account ha bisogno di una password e che il tuo tema viene salvato con
        il tuo account. L&rsquo;Aiuto in ogni lingua, inglese compreso, ora
        indica il vero minimo di 12 caratteri per la password.</li>
      <li><strong>Piccole correzioni:</strong> le fanart il cui nome di file
        contiene un apostrofo ora compaiono nelle pagine dei giochi e dei
        trofei; Impostazioni non mostra più un errore di script agli account non
        amministratori, e gli screen reader ora sentono quale scheda delle
        Impostazioni è selezionata; lasciare una pagina non riempie più la
        console del browser di errori di richieste annullate; il modello di
        upscaling viene scaricato prima da un indirizzo funzionante; e il
        programma di installazione non va più in crash su Windows quando il suo
        output viene salvato in un file.</li>
      <li><strong>Un ampio giro di correzioni di affidabilità.</strong> Salvare
        un gioco con il titolo vuoto non fa più perdere le altre modifiche.
        Riavvia ora lascia prima terminare in modo pulito i processi in corso.
        Create M3U si rifiuta di sovrascrivere una playlist o una cartella
        esistente. Svuotare l&rsquo;elenco dei file indesiderati negli Strumenti
        ROM ora significa "non eliminare nulla", e due schemi non colpiscono più
        nomi di ROM reali come "Release of the Dragon". Un solo file di trofei
        PS3 danneggiato non svuota più i trofei di tutti i giochi. Il
        Riempimento AI scrive una sola regione. Analisi conta ogni gioco una
        sola volta nel grafico delle valutazioni. Le importazioni CLZ usano i
        nomi di genere standard. Nelle finestre di modifica, i generi e le altre
        etichette si possono rimuovere in ogni lingua, e le scorciatoie da
        tastiera non dirottano più Ctrl+D o Ctrl+G. Gli spettatori vedono lo
        stato di completamento di un gioco ma non possono più cambiarlo, perché
        è condiviso da tutti.</li>
      <li><strong>Gli screen reader leggono l&rsquo;interruttore Platform Match
        Required con il suo nome visibile</strong> in Impostazioni →
        Scansione.</li>
      <li>Nelle altre lingue, Impostazioni ora traduce "Regione predefinita", e
        la scheda Scansione si legge come un nome invece che come "scansione in
        corso". Le pagine di aiuto usano le stesse parole.</li>
      <li><strong>Un gioco che non si chiude non viene più mostrato come
        chiuso.</strong> Se un emulatore sopravvive a Stop, RetroDB continua a
        mostrarlo in esecuzione. Un avvio di RetroArch rifiutato non scrive più
        prima il suo file di impostazioni, e un emulatore che fallisce subito
        mostra il suo messaggio di errore al primo controllo.</li>
      <li>Librerie aggiornate: Pillow 13 (gestione delle immagini), numpy 2.5.4
        e onnxruntime 1.31 (upscaling), più le ultime versioni degli strumenti di
        build e di rilascio.</li>
      <li>Dietro le quinte: il codice di avvio dei giochi è stato riordinato per
        essere più facile da seguire, è stato rimosso codice inutilizzato (un
        indirizzo API, una funzione di supporto PSN, uno script dei trofei che
        nessuna pagina caricava e un&rsquo;impostazione del tema per tutto il
        sito che nessuno leggeva), le risposte dell&rsquo;app al browser vengono
        costruite in un unico punto, diversi documenti di progettazione sono
        stati corretti per corrispondere al codice, la suite di test è stata
        riordinata, e un nuovo controllo individua un errore di sintassi
        JavaScript prima di un rilascio. Le voci più vecchie del changelog che
        descrivevano il codice rimosso ora lo dicono.</li>
    </ul>
- version: 3.29.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Gli altri nomi di un gioco mostrano la regione da cui provengono
  body: |
    <ul>
      <li><strong>Gli altri nomi di un gioco mostrano la regione da cui
        provengono.</strong> La scheda Conosciuto anche come nella pagina del
        gioco indica per ogni nome il paese o la regione, come Giappone per
        "Rockman", nella tua lingua. I nomi con una regione vengono per primi,
        raggruppati per regione. Passa il puntatore su un nome per vederne la
        fonte e un&rsquo;eventuale nota, come "Titolo provvisorio".</li>
      <li>I nomi da IGDB ora mantengono la loro regione. Prima ce
        l&rsquo;avevano solo i nomi di ScreenScraper.</li>
      <li>L&rsquo;etichetta "SS" di ScreenScraper non compare più come regione.
        È il nome che ScreenScraper stesso dà al gioco, non un luogo.</li>
      <li>Strumenti ROM → Recupera titoli alternativi ora controlla ogni gioco
        sottoposto a scraping, così i nomi che hai già ricevono la loro regione.
        Eseguilo una volta per etichettare la tua libreria esistente.</li>
    </ul>
- version: 3.28.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Indica a RetroDB la cartella dei tuoi emulatori e li configura lui
  - type: fix
    label: Correzioni alla pagina Impostazioni → Emulatori
  body: |
    <ul>
      <li><strong>Indica a RetroDB la cartella dei tuoi emulatori e li
        configura lui.</strong> Impostazioni → Emulatori ha un nuovo elenco
        Cartelle degli emulatori. Aggiungi la cartella in cui si trovano i tuoi
        emulatori e RetroDB trova ognuno di essi, come AppImage, script portatile
        o Flatpak installato, e lo collega ai sistemi che fa girare. Un sistema
        che ha già un emulatore funzionante lo mantiene.</li>
      <li><strong>Guarda quali sistemi sono pronti per giocare.</strong> La
        tabella Per-system mapping ora elenca gli emulatori di ogni sistema,
        dice se ognuno funziona e ti permette di scegliere quello predefinito di
        un sistema. Per DuckStation, PCSX2, RPCS3 e RetroArch dice anche se i
        file del BIOS sono al loro posto, e nomina quelli che mancano. RetroDB
        legge soltanto i file del BIOS; non ne copia né ne scarica mai
        uno.</li>
      <li>La ricerca degli emulatori ora trova tutti gli emulatori su un grande
        disco di emulatori. Prima poteva fermarsi in anticipo dentro la cartella
        delle impostazioni di un emulatore.</li>
      <li>I pulsanti Auto-detect e Salva di RetroArch funzionano di nuovo, e la
        finestra di modifica dell&rsquo;emulatore non compare più nella pagina
        finché non premi Modifica.</li>
    </ul>
- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: L'applicazione dei metadati mostra a che punto è
  body: |
    <ul>
      <li><strong>L'applicazione dei metadati mostra a che punto è.</strong>
        Quando scegli un risultato in Cerca metadati, un anello si riempie da
        0 a 100% con la percentuale al centro, e la riga sotto dice cosa sta
        succedendo: quale sito viene interrogato, quale immagine o video si
        sta scaricando, oppure che le immagini sono in elaborazione. Un
        download grande, come un video, fa avanzare l'anello man mano che
        arriva. Al 100% la pagina si ricarica con il risultato, come
        prima.</li>
      <li>L'anello può avanzare in modo irregolare. Ogni fonte decide quante
        immagini inviare solo quando risponde, quindi la prima fonte con molte
        immagini può riempire buona parte dell'anello e le successive
        meno.</li>
      <li>Se un'applicazione non riesce, l'anello si chiude e un messaggio lo
        segnala, senza ricaricare la pagina.</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Ogni pagina ora si adatta alla finestra in cui si trova
  - type: enhancement
    label: La pagina del gioco mostra gli altri nomi in una scheda a sé, e un pulsante Manuale
  body: |
    <ul>
      <li><strong>Ogni pagina ora si adatta alla finestra in cui si trova.</strong>
        Le pagine a schede (Sistemi, Museo, Etichette, Liste, Strumenti ROM,
        trofei e obiettivi) aggiungono una colonna ogni volta che c&rsquo;è spazio
        per un&rsquo;altra scheda intera, fino a quattro per riga. Tabelle,
        strumenti e pagine di dettaglio si allargano un po&rsquo;, ma si fermano
        dove allargarsi ancora servirebbe solo a distanziare le colonne.
        Impostazioni mantiene i suoi riquadri a una larghezza comoda da
        leggere.</li>
      <li><strong>Aiuto e il changelog mantengono righe di lunghezza
        comoda.</strong> In una finestra larga i collegamenti alle sezioni
        dell&rsquo;Aiuto si spostano in una colonna accanto al testo; in una
        stretta stanno su un&rsquo;unica riga che puoi scorrere col dito, invece
        di un blocco che copriva buona parte dello schermo del telefono.</li>
      <li><strong>La pagina del gioco:</strong> in una finestra larga gli
        screenshot scorrono lungo la parte alta, con sotto il video e una nuova
        scheda <strong>Conosciuto anche come</strong> affiancati, all&rsquo;altezza
        della copertina. Gli altri nomi erano un testo sbiadito sotto il titolo;
        ora stanno in una scheda facile da leggere. <strong>Manuale</strong> è
        un pulsante accanto a Gioca, e la Cronologia delle scansioni parte
        chiusa.</li>
      <li>Trofei PSN mostra da una a quattro colonne a seconda della finestra,
        invece di sempre tre.</li>
      <li>Diverse pagine non scorrono più di lato sul telefono: Trofei, Trofei
        del collezionista, la pagina di sistema di RetroAchievements, Aiuto,
        Impostazioni, Analisi, Importazioni giochi e le pagine di dettaglio di
        obiettivi e trofei. Lì le tabelle larghe ora scorrono al proprio
        interno.</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Le pagine Libreria, sistema e gioco ora si adattano alla finestra in cui si trovano
  body: |
    <ul>
      <li><strong>Le pagine usano una finestra larga quando serve, e solo
        allora.</strong> La Libreria e ogni pagina di sistema aggiungono una
        colonna di schede dei giochi ogni volta che c&rsquo;è spazio per
        un&rsquo;altra scheda intera, fino a quattro per riga. Un telefono ne
        mostra una, una finestra a metà schermo due o tre, una finestra larga
        quattro. Prima le pagine si fermavano a una larghezza fissa e lasciavano
        vuota gran parte di una finestra grande.</li>
      <li><strong>La pagina del gioco mette copertina e dettagli accanto a
        screenshot e video</strong> quando c&rsquo;è spazio per affiancarli, e
        altrimenti li impila. La descrizione mantiene righe di lunghezza
        comoda.</li>
      <li><strong>Il pulsante Gioca si è spostato nell&rsquo;angolo in alto a
        destra di ogni scheda,</strong> più piccolo e centrato. Ora controlla
        anche che il file ROM del gioco sia ancora lì e di un tipo accettato dal
        suo sistema, così appare solo dove premerlo avvierà davvero il gioco. Si
        nasconde mentre selezioni più giochi insieme.</li>
      <li>Il pulsante Torna su e i pop-up di avanzamento stanno subito accanto
        al contenuto della pagina, invece che ai bordi estremi della
        finestra.</li>
      <li>La pagina del gioco non scorre più di lato sul telefono.</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: La lingua di prova "Pseudo" è offerta solo agli amministratori
  body: |
    <ul>
      <li><strong>"Pseudo" non compare più nell&rsquo;elenco delle lingue per
        tutti.</strong> È uno strumento per sviluppatori che mostra ogni parola
        tra parentesi e con accenti, quindi ora è offerto solo agli
        amministratori. Chiunque altro l&rsquo;avesse scelto vede l&rsquo;app in
        inglese, con l&rsquo;inglese selezionato nelle Impostazioni.</li>
    </ul>
- version: 3.24.1
  date: '2026-10-17'
  tags:
  - type: fix
    label: Il download per Windows si installa di nuovo, e niente più valanga di errori dopo il ridimensionamento
  body: |
    <ul>
      <li><strong>Il normale download per Windows non si installava.</strong>
        L&rsquo;installazione si fermava su "Core dependencies failed to
        install", perché il suo elenco bloccato di pacchetti ometteva un
        pacchetto che serve solo a Windows. Ora l&rsquo;elenco copre ogni
        piattaforma. Il download per Windows senza Python non era
        interessato.</li>
      <li><strong>Messaggi di errore continuavano ad apparire nell&rsquo;angolo
        in alto a destra</strong> con il tema Cyberpunk dopo che la finestra del
        browser veniva allargata, per esempio massimizzandola. Lo sfondo animato
        ora si ridimensiona senza problemi.</li>
    </ul>
- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Avvia un gioco direttamente dalla Libreria e dalle pagine di sistema
  body: |
    <ul>
      <li><strong>Un pulsante ▶ Gioca su ogni scheda di gioco.</strong> Appare
        nell&rsquo;angolo in basso a sinistra della copertina nella pagina
        Libreria e in ogni pagina di sistema. Premilo e il gioco si avvia nel
        suo emulatore; resti sull&rsquo;elenco invece di aprire prima la pagina
        del gioco.</li>
      <li>Il pulsante appare solo dove premerlo può funzionare: il tuo account
        ha il permesso di avviare giochi, e l&rsquo;emulatore del gioco è
        attivato, installato e, per RetroArch, ha il suo core. I giochi di
        sistemi senza un emulatore funzionante non mostrano il pulsante.</li>
      <li>Se un avvio fallisce comunque, per esempio perché il file ROM è stato
        spostato, il motivo appare in un messaggio e la pagina resta
        com&rsquo;era.</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: Una barra laterale più corta, con un&rsquo;unica pagina Obiettivi per ogni piattaforma
  body: |
    <ul>
      <li><strong>Un solo collegamento "Obiettivi" ne sostituisce cinque.</strong>
        RetroAchievements, RPCS3, PSN, Steam e Xbox ora sono schede di
        un&rsquo;unica pagina, e il collegamento riapre l&rsquo;ultima scheda che
        hai usato. Se non hai giochi RetroAchievements, si apre sulla scheda
        RPCS3 invece di rimandarti alla Dashboard.</li>
      <li><strong>Report ROM ora si trova in Strumenti ROM,</strong> come scheda
        accanto agli altri strumenti e come riquadro nella pagina Strumenti
        ROM.</li>
      <li><strong>Nessun collegamento della barra laterale condivide
        un&rsquo;icona con un altro:</strong> Dashboard ora è 🏠 e Visualizzatore
        di log 🧾. La barra laterale ha 16 collegamenti invece di 21.</li>
      <li>Le schede degli strumenti nella pagina delle impostazioni di
        Strumenti ROM erano sempre in inglese; ora seguono la tua lingua.</li>
    </ul>
- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: Le ricerche su How Long To Beat funzionano di nuovo
  body: |
    <ul>
      <li><strong>Ogni ricerca su How Long To Beat diceva che il gioco non si
        trovava.</strong> Il sito ha spostato la sua ricerca a un nuovo
        indirizzo, quindi le richieste di RetroDB venivano rifiutate; il guasto
        è avvenuto tra fine luglio e fine settembre. RetroDB ora usa il nuovo
        indirizzo e invia i filtri per piattaforma e anno nel nuovo formato del
        sito, che il sito aveva iniziato a ignorare. Funzionano di nuovo sia le
        ricerche per un singolo gioco sia la ricerca in blocco in Strumenti
        ROM.</li>
    </ul>
- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: RetroDB ora dice chiaramente che non approva la pirateria
  - type: fix
    label: La finestra Informazioni si apre di nuovo a grandezza piena
  body: |
    <ul>
      <li><strong>Nell&rsquo;app ora c&rsquo;è un avviso contro la
        pirateria.</strong> Appare nella finestra Informazioni e sotto Percorso
        libreria ROM nelle Impostazioni, in ogni lingua. Dice che RetroDB non
        distribuisce né ospita file ROM, che dovresti usare solo giochi copiati
        da dischi e cartucce che possiedi, e che RetroDB non è affiliato ad
        alcun produttore di console, editore o database di giochi. Il testo
        corrisponde a quello del sito web e del trailer di RetroDB.</li>
      <li><strong>La finestra Informazioni era schiacciata dentro la barra
        laterale.</strong> Ora si apre al centro dello schermo alla sua
        grandezza normale, e su uno schermo piccolo scorre invece di nascondere
        il titolo e il pulsante di chiusura.</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: RetroDB avvia o rinomina solo veri tipi di file ROM
  body: |
    <ul>
      <li><strong>Un gioco poteva essere avviato con un file che non è una
        ROM.</strong> Rinominare una ROM accettava qualsiasi nome, quindi
        <code>crash.bin</code> poteva diventare <code>crash.cfg</code> e
        l&rsquo;emulatore lo riceveva. Ora l&rsquo;avvio controlla il tipo di
        file rispetto all&rsquo;elenco nel <code>systeminfo.txt</code> della
        cartella di quel sistema, lo stesso elenco usato dalla scansione della
        libreria, e la rinomina rifiuta un tipo che non è in quell&rsquo;elenco.
        Se la cartella di un sistema non ha l&rsquo;elenco, i suoi giochi non si
        avviano, e il messaggio indica il file mancante.</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: Solo un amministratore può cambiare gli argomenti di avvio di un gioco
  - type: fix
    label: Gli argomenti di avvio con più parole, o con una virgoletta in più, ora funzionano
  - type: fix
    label: RetroDB non tiene più in memoria ogni avvio terminato
  body: |
    <ul>
      <li><strong>Un editor poteva aggiungere argomenti di avvio che eseguivano
        altro codice.</strong> Gli <em>Argomenti di avvio personalizzati</em> di
        un gioco vanno direttamente all&rsquo;emulatore, e con RetroArch
        potevano caricare qualsiasi file di programma sul computer. Ora per
        cambiarli serve il ruolo di amministratore, e il campo è nascosto a
        tutti gli altri.</li>
      <li><strong>Gli argomenti di avvio con più di una parola arrivavano
        all&rsquo;emulatore come uno solo.</strong> <code>--a --b</code> ora
        arriva come due argomenti, e un valore vuoto non aggiunge nulla. Una
        virgoletta di chiusura mancante bloccava ogni avvio di quel gioco con un
        errore del server; ora mostra un messaggio che indica il campo da
        correggere. Il segnaposto <code>{disc_paths}</code> è stato rimosso: era
        sempre vuoto.</li>
      <li><strong>Gli avvii terminati si accumulavano in memoria finché RetroDB
        non veniva riavviato.</strong> Ora un avvio finito da più di
        un&rsquo;ora viene eliminato.</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: Scegliere una lingua nelle Impostazioni funziona di nuovo
  body: |
    <ul>
      <li><strong>Scegliere una lingua in Impostazioni &rarr; Libreria &rarr;
        Visualizzazione non faceva nulla.</strong> Mostrava invece un errore e la
        pagina restava nella lingua di prima. Il problema era comparso nella
        3.23.8. Ora scegliere una lingua la salva e ricarica la pagina in quella
        lingua.</li>
    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: Le icone dei trofei e delle piattaforme sono tornate nel download
  body: |
    <ul>
      <li><strong>Nel download mancavano le icone dei trofei e delle
        piattaforme di RetroDB.</strong> Ogni scheda di gioco con
        RetroAchievements mostrava un&rsquo;immagine rotta al posto del suo
        badge, e mancavano anche i livelli dei trofei e i loghi di PSN, Steam,
        Xbox e RPCS3. Ora sono inclusi in ogni download.</li>
    </ul>
- version: 3.23.14
  date: '2026-10-10'
  tags:
  - type: security
    label: Due librerie incluse aggiornate con correzioni di sicurezza pubblicate
  body: |
    <ul>
      <li><strong>urllib3 e Werkzeug avevano problemi di sicurezza
        noti.</strong> RetroDB ora include urllib3 2.8.0 e Werkzeug 3.1.9, le
        versioni che li correggono. Un&rsquo;installazione dal codice sorgente
        li riceve eseguendo di nuovo <code>install.py</code>, che installa da
        <code>requirements.lock</code>.</li>
    </ul>
- version: 3.23.13
  date: '2026-09-26'
  tags:
  - type: fix
    label: I media salvati come percorso di cartella non vengono più segnalati come mancanti
  body: |
    <ul>
      <li><strong>Nella versione standalone, "cancella i riferimenti ai media
        mancanti" poteva svuotare media che in realtà c&rsquo;erano.</strong>
        Succedeva quando il database salvava il media come percorso di cartella,
        per esempio <code>images/boxart/…</code>, invece che come semplice nome
        di file. RetroDB ora lo cerca nella cartella giusta.</li>
    </ul>
- version: 3.23.12
  date: '2026-09-26'
  tags:
  - type: fix
    label: La dashboard mostra una scansione in blocco in corso, più quattro piccole correzioni
  body: |
    <ul>
      <li><strong>La scheda di avanzamento della scansione nella dashboard non
        appariva mai.</strong> Ora si vede mentre è in corso una scansione in
        blocco, e indica quando è in pausa.</li>
      <li><strong>Niente più errori nella console del browser sulla pagina di
        accesso.</strong> Non controlla più le attività in background prima che
        qualcuno abbia effettuato l&rsquo;accesso.</li>
      <li><strong>La procedura di configurazione non dice più "Setup complete!"
        quando il salvataggio è fallito.</strong> Ora ti dice che non è stato
        possibile salvare le impostazioni.</li>
      <li><strong>Due scansioni in blocco avviate nello stesso secondo non
        condividono più un id</strong>, così le azioni della coda, come
        l&rsquo;annullamento, agiscono su quella giusta.</li>
    </ul>
