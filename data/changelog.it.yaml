- version: 4.0.0
  date: '2026-11-12'
  tags:
  - type: fix
    label: 'Impostazioni → Sistema ora segue la tua lingua: gli strumenti di manutenzione, le impostazioni dei log e la risoluzione dei problemi, con i relativi risultati e messaggi di errore. Restavano in inglese qualunque lingua fosse scelta. Anche i messaggi rimasti in inglese in altre pagine sono ora tradotti'
  - type: fix
    label: 'Nella pagina di una console in Obiettivi, la fila di pulsanti delle console non scivola più sotto le schede di sezione durante lo scorrimento; ora scorre via. In ogni pagina Obiettivi la barra delle lettere A–Z resta subito sotto le schede di sezione invece di nascondersi dietro'
  - type: fix
    label: 'Rimuovere un''immagine nella finestra «Modifica gioco» non elimina più il file quando un altro gioco usa la stessa immagine; l''altro gioco la mantiene'
  - type: fix
    label: 'I retro delle confezioni che uno scrape salva in piccolo ora vengono ingranditi in background, come già accade per i fronti'
  - type: fix
    label: 'Il salvataggio nella finestra «Modifica gioco» non attende più l''ingrandimento di copertine o screenshot piccoli caricati; ora avviene dopo, mostrato come «Miglioramento immagini». Un''immagine spuntata per la rimozione viene eliminata solo quando il salvataggio è riuscito, quindi un salvataggio fallito non la perde più'
  - type: fix
    label: 'Il conteggio "metadati mancanti" in cima alla Libreria e alle pagine delle console ora conta una sola volta un gioco con più versioni regionali, come fa il filtro "Non elaborato". Prima contava ogni versione'
  - type: enhancement
    label: 'Impostazioni → Dischi bonus ora elenca ogni disco segnato come disco bonus, con il gioco a cui appartiene. Il pulsante «Non è un disco bonus» (editor e amministratori) riporta un disco segnato per errore nei tuoi elenchi di giochi, e poi Auto-Link lo lascia stare'
  - type: fix
    label: 'I nomi di società come "Nintendo Co., Ltd." e "GameTek, Inc." ora restano interi. Venivano divisi alla virgola, così "Ltd." e "Inc." comparivano come nomi a sé nei filtri della Libreria, in Impostazioni → Normalizzazione dei dati e in Statistiche. Anche le pagine dei giochi li mostrano interi. Anche un nome con una virgola tra parentesi, come "Majesco (licensed from Konami, Disney)", resta intero'
  - type: enhancement
    label: 'Impostazioni → Normalizzazione dei dati ora può unire i diversi nomi di una stessa società. Sotto Editore e Sviluppatore, un nuovo elenco mostra i nomi simili, come "Eidos" ed "Eidos Interactive". Niente si unisce da solo, perché nomi simili possono essere società diverse: scegli il nome da tenere, spunta i nomi della stessa società e premi Merge. I nomi cambiano in ogni gioco, e gli scrape successivi usano il nome tenuto'
  - type: enhancement
    label: 'Impostazioni → Normalizzazione dei dati ha ora i pulsanti Franchise, Editore e Sviluppatore. Ognuno elenca i nomi scritti con maiuscole diverse, come "Doom" e "DOOM", con quanti giochi usano ciascuna grafia e la più usata già scelta. Scegline una e premi Applica per farne un solo nome. Un nome appena ottenuto che differisce solo per le maiuscole prende la grafia della tua libreria, e Riempimento AI chiede le maiuscole ufficiali'
  - type: fix
    label: 'I filtri della Libreria ora confrontano valori interi. Scegliere il genere "Azione" non mostra più anche i giochi "Azione-Avventura", quindi il risultato corrisponde al numero accanto. Gli elenchi di tag nella pagina di un gioco e Giochi simili funzionano allo stesso modo'
  - type: security
    label: 'Impostazioni → Il mio profilo non invia più alla pagina la chiave RetroAchievements, il token PSN o la chiave Steam che hai salvato. Ogni casella mostra solo gli ultimi quattro caratteri, come già facevano le chiavi della scheda Scansione. Salvare senza riscriverla mantiene la chiave salvata, e il pulsante PSN "Salva & testa connessione" prova il token salvato'
  - type: fix
    label: 'La pagina Visualizzatore di log non si apre più su "File di log non valido". Elencava log ausiliari che non avrebbe mostrato e ne apriva uno per primo; ora elenca solo i log che può aprire'
  - type: fix
    label: 'La scheda PSN di Importazioni giochi ora ti manda a Impostazioni → Il mio profilo per il token NPSSO, dove si trova la casella, invece che a Impostazioni → Chiavi API, e il suo stato di connessione si può tradurre'
  - type: fix
    label: 'Con l''accesso da viewer, le pagine non chiedono più al server informazioni riservate agli amministratori che non possono avere, così il log del server non si riempie più di richieste rifiutate'
  - type: security
    label: 'I nomi che arrivano da fuori RetroDB (dati dello scraping, nomi di file e cartelle, risposte dei servizi online) ora appaiono sempre come testo semplice: nella pagina del gioco, in Impostazioni, nei Report, negli strumenti ROM, nelle pagine dei trofei e altrove. Inoltre le pagine eseguono solo le azioni dei propri pulsanti, così un nome costruito ad arte non può far fare qualcosa a una pagina, e il link "torna a" di una notifica di avanzamento non può più portare a un altro sito'
  - type: enhancement
    label: 'Gli scraping in blocco in coda hanno un pulsante Riordina. Apre il Gestore della coda, dove uno scraping in attesa può partire prima, dopo o scambiarsi con quello in corso. Ogni notifica in coda mantiene anche il suo numero di posizione dopo una modifica'
  - type: fix
    label: 'L''avanzamento delle operazioni non si blocca più e non si ripete. Un controllo o una conversione CHD che va in crash ora termina con il motivo; Annulla restituisce i pulsanti alla pagina; un annullamento, una pausa o una rimozione rifiutati lo segnalano; "completato" non ricompare più un''ora dopo; e il pulsante Sync della pagina degli obiettivi torna quando la sincronizzazione finisce'
  - type: fix
    label: 'Salvare una corrispondenza HowLongToBeat nella pagina del gioco non cancella più il link HLTB e il numero di giocatori, e un salvataggio non riuscito si può ripetere. La Modifica rapida non mostra più ogni corrispondenza salvata come "100% di corrispondenza". Le etichette dei filtri della Libreria mostrano il nome del sistema invece del suo numero, e la ricerca durante la digitazione funziona nelle pagine elenco e in Confronta'
  - type: fix
    label: 'Ogni account può cambiare la propria password in Impostazioni → Il mio profilo, e un amministratore può reimpostare quella di chiunque. Le cartelle degli emulatori ora funzionano su Windows. La Dashboard non dice più a editor e visualizzatori che le loro API sono offline, e "Giochi senza copertina" apre la Libreria mostrando solo quei giochi. Un gestore di password ora può compilare il riquadro di accesso'
  - type: fix
    label: 'Strumenti ROM: Verifica CHD mette ogni badge Validi o Non validi sul file giusto; il visualizzatore di log mostra di nuovo i nomi dei moduli e segnala quando il suo elenco di file non si carica; Seleziona tutto in Importazioni giochi importa solo i giochi mostrati dal tuo filtro; e Reimposta in Impostazioni strumenti ROM ripristina la cartella ROM propria di questo computer'
  - type: fix
    label: 'Gli orari di sblocco di Steam appaiono come date; la barra A-Z funziona in Trofei locali; la modalità Seleziona di PSN continua a funzionare sui giochi che si caricano mentre scorri; i visualizzatori non vedono più pulsanti Sync o Rinomina che non possono usare; una rinomina in blocco salta un file rinominato dopo la scansione; e Analisi può copiare su una rete HTTP semplice ed esporta i numeri come numeri'
  - type: fix
    label: 'In una finestra di conferma, Invio su Annulla o × ora annulla invece di confermare. Una finestra aperta da OK non scompare più, e Tab continua a funzionare dopo la chiusura dell''elenco delle scorciatoie o di una finestra di avanzamento'
  - type: enhancement
    label: 'Molti controlli che funzionavano solo con il mouse ora funzionano con la tastiera (Tab, poi Invio o Spazio): i profili di accesso, i risultati di ricerca di Confronta, i tag con i pulsanti Modifica ed Elimina, le schede dei giochi degli obiettivi, le sessioni del registro, la scelta di tema e avatar, le immagini del Museo, la × che rimuove un genere o un filtro, le cartelle della configurazione, le caselle delle fonti di scraping e l''importazione CLZ. Gli interruttori mostrano ora l''anello della tastiera'
  - type: performance
    label: 'Lo strumento del Museo che rimuove lo sfondo non resta più in memoria. Ritagliava le foto dei controller dal loro sfondo con un modello di AI che, una volta usato, occupava oltre 2 GB, e fino a circa 9 GB durante una foto, finché RetroDB non veniva riavviato. Ora funziona in un programma di supporto che si avvia quando serve e si chiude due minuti dopo l''ultima foto, liberando tutta quella memoria'
    en: 'The Museum''s background remover no longer stays in memory. It cut controller photos out of their background with an AI model that took over 2 GB once used, and up to about 9 GB during a photo, until RetroDB restarted. It now runs in a helper that starts when needed and closes two minutes after its last photo, giving all of that memory back'
  - type: feature
    label: 'L''importazione Xbox non richiede più un account Microsoft Azure. Ora ognuno incolla la propria chiave OpenXBL gratuita (da xbl.io) in Impostazioni → Il mio profilo, e funziona da qualsiasi computer della tua rete. L''importazione inoltre esclude le app e i giochi solo per telefono, mette i giochi PC sotto Windows invece che sotto Xbox One, legge correttamente gli obiettivi Xbox 360 e non mostra alcuna data per un obiettivo bloccato. La chiave gratuita consente 150 richieste all''ora: una grande sincronizzazione degli obiettivi che raggiunge il limite si ferma, lo segnala e la volta successiva riparte dai giochi che non aveva ancora raggiunto'
    en: 'Xbox import no longer needs a Microsoft Azure account. Each person now pastes their own free OpenXBL key (from xbl.io) under Settings → My Profile, and it works from any computer on your network. The import also leaves out apps and phone-only games, files PC games under Windows instead of Xbox One, reads Xbox 360 achievements the right way, and shows no date for a locked achievement. The free key allows 150 requests an hour: a big achievement sync that reaches it stops, says so, and next time starts with the games it had not reached'
  - type: enhancement
    label: Una Sync o un Refresh di RetroAchievements che richiedi mentre un altro è in corso ora resta in attesa sul server e parte da solo quando quello finisce, anche se chiudi la pagina o lo hai richiesto da un altro dispositivo. Ogni pagina mostra la stessa lista d'attesa con la posizione di ogni attività, e ✕ toglie un'attività dalla coda. Dopo un riavvio del server, le attività in attesa vengono riproposte nella Dashboard
    en: A RetroAchievements Sync or Refresh you ask for while another one runs now waits on the server and starts by itself when that one finishes, even if you close the page or asked from another device. Every page shows the same waiting list with each job's place in line, and ✕ takes a job out. After a server restart, waiting jobs are offered back on the Dashboard
  - type: fix
    label: Il pulsante Refresh RA nella pagina di una console funziona di nuovo. Non indicava quale console, quindi il server rispondeva "Not found"
    en: The Refresh RA button on a console's page works again. It did not say which console, so the server answered "Not found"
  - type: fix
    label: Il controllo dei nomi delle ROM ora tratta ogni sistema come il tipo mostrato nella pagina Sistemi. Macintosh, ZX Spectrum Next, Coleco Adam e Thomson sono controllati come computer, e 3DS e PS Vita come portatili, invece che come console. Ora viene seguito anche il tipo che imposti nella pagina Sistemi
    en: The ROM naming check now treats each system as the kind the Systems page shows. Macintosh, ZX Spectrum Next, Coleco Adam and Thomson are checked as computers, and 3DS and PS Vita as handhelds, instead of as consoles. A type you set on the Systems page is now followed too
  - type: performance
    label: RetroDB usa molta meno memoria quando è inattivo. Lo scaler di immagini con IA ora si carica solo durante l'upscaling, in un processo di supporto che si chiude due minuti dopo l'ultima immagine; un server inattivo è passato da circa 1,4 GB a meno di 100 MB. Se il driver grafico va in crash durante un upscaling, si ferma solo il processo di supporto, mai il server
    en: RetroDB uses far less memory while it waits. The AI image upscaler now loads only while it is upscaling, in a helper that closes two minutes after its last picture; an idle server dropped from about 1.4 GB to under 100 MB. If the graphics driver crashes during an upscale, only the helper stops, never the server
  - type: performance
    label: Riempimento AI con la ricerca web di Claude costa meno. Claude rilegge i risultati dopo ogni ricerca; ora RetroDB chiede ad Anthropic di tenerli pronti, e una nuova lettura costa un decimo del prezzo o meno
    en: AI Fill with Claude web search costs less. Claude reads the search results again after each search; RetroDB now asks Anthropic to keep them ready, and a re-read then costs a tenth of the price or less
  - type: fix
    label: 'Zulu e Xhosa si leggono meglio: sono state corrette 133 righe che dicevano una cosa sbagliata, ad esempio "Edition" mostrato come "Chapter" e "must be text" mostrato come "must be a letter". Ogni correzione è stata confermata da due controlli IA separati'
    en: 'Zulu and Xhosa read better: 133 lines that said the wrong thing are corrected, such as "Edition" shown as "Chapter" and "must be text" shown as "must be a letter". Each correction was agreed by two separate AI checks'
  - type: fix
    label: Quando un gioco non si avvia, il messaggio ora è nella tua lingua e indica ancora l'emulatore, il core o il file che ha causato il problema. Un errore all'interno del computer ora mostra "Impossibile avviare" e il nome del programma, con i dettagli nel log del server, invece del testo grezzo di sistema. Un accesso a RetroAchievements rifiutato mostra il motivo fornito da RetroAchievements all'interno di una frase tradotta
    en: When a game will not start, the message is now in your language and still names the emulator, core or file at fault. A failure inside the computer itself now says "Could not start" and the program's name, with the details in the server log, instead of raw system text. A refused RetroAchievements sign-in shows RetroAchievements' own reason inside a translated sentence
  - type: fix
    label: Annullare un'operazione di scansione, sincronizzazione o immagini già terminata ora rimuove il popup di avanzamento rimasto bloccato. Avviare un'operazione già in corso mostra il vero motivo, ad esempio "Una scansione per SNES è già in corso", invece di "Errore di rete". Gli errori sulle immagini dei controller nel Museo ora dicono cosa è andato storto, e annullare la sincronizzazione RetroAchievements di un altro utente dice che è sua, invece di fingere di annullarla
    en: Cancelling a scrape, sync or image job that has already finished now clears its stuck progress popup. Starting a job that is already running shows the real reason, such as "A scrape for SNES is already running", instead of "Network error". Controller image errors in the Museum now say what went wrong, and cancelling another user's RetroAchievements sync says it is theirs instead of pretending to cancel it
  - type: security
    label: Il visualizzatore dei log ora nasconde password e chiavi anche nei file di log più vecchi. I log scritti prima che RetroDB imparasse a nascondere una certa password, come quella di ScreenScraper, la mostravano in chiaro quando venivano visti o scaricati
    en: The log viewer now hides passwords and keys in older log files too. Logs written before RetroDB learned to hide a particular password, such as ScreenScraper's, showed it in plain text when viewed or downloaded
  - type: security
    label: Ripristinare tutte le impostazioni ai valori predefiniti ora mantiene la cartella delle ROM e il fatto che la configurazione sia completata. Prima, un ripristino riapriva le pagine di configurazione iniziale, che funzionano senza accedere, finché un amministratore non eseguiva di nuovo la configurazione
    en: Resetting all settings to their defaults now keeps your ROM folder and the fact that setup is done. Before, a reset reopened the first-time setup pages, which work without signing in, until an admin ran setup again
  - type: feature
    label: I giochi arcade possono di nuovo ottenere RetroAchievements. RetroDB ora collega un gioco arcade solo se RetroAchievements conosce il nome esatto del file, ad esempio sf2 per Street Fighter II, quindi non indovina più dai titoli e non collega il gioco sbagliato. I tuoi giochi arcade si collegano al prossimo aggiornamento dei loro dati RetroAchievements o alla loro scansione
    en: Arcade games can earn RetroAchievements again. RetroDB now links an arcade game only when RetroAchievements knows its exact file name, such as sf2 for Street Fighter II, so it no longer guesses from titles and links the wrong game. Your arcade games link the next time their RetroAchievements data is refreshed or they are scraped
  - type: fix
    label: La sincronizzazione dei trofei PlayStation ora corregge i collegamenti ai giochi fatti in modo errato in precedenza, ad esempio molti giochi collegati a un gioco estraneo chiamato "D". Un collegamento impostato da te non viene mai modificato da una sincronizzazione. La prossima sincronizzazione ricontrolla tutti i vecchi collegamenti, quindi alcune corrispondenze approssimative potrebbero essere scollegate; ricollegale a mano
    en: PlayStation trophy sync now corrects game links it made wrongly before, such as many games linked to an unrelated game called "D". A link you set yourself is never changed by a sync. The next sync checks all older links again, so a few near matches may come unlinked; link those again by hand
  - type: fix
    label: Spostare una scansione multipla in attesa davanti a una in corso non aggiunge più l'ultimo gioco della vecchia scansione ai conteggi della nuova. Fare clic su "Scansiona tutto" nella Lista dei desideri mentre una scansione è già in corso ora lo segnala, invece di dire che è partita
    en: Moving a waiting bulk scrape ahead of a running one no longer adds the old scrape's last game to the new one's counts. Clicking "Scrape all" on the wishlist while one is already running now says so, instead of claiming it started
  - type: accessibility
    label: 'Con uno screen reader, il pulsante "in esecuzione" ora dice "1 gioco in esecuzione" solo quando il numero cambia, invece di leggere un numero isolato ogni pochi secondi. Il suo elenco si apre come finestra con nome e con il cursore all''interno, i pulsanti Termina e Disco successivo indicano su quale gioco agiscono, e dopo Termina il cursore torna in un punto sensato. Ogni scheda di gioco nella Libreria ora si apre con la tastiera dal titolo, e i suoi pulsanti filtro dicono cosa filtrano, ad esempio "Filtra per Sviluppatore: Konami"'
    en: 'With a screen reader, the "running" button now says "1 game running" only when the count changes, instead of reading a bare number every few seconds. Its list opens as a named window with the cursor inside, its Kill and Next disk buttons say which game they act on, and after Kill the cursor returns to a sensible place. Each game card in the library now opens with the keyboard from its title, and its filter buttons say what they filter, such as "Filter by Developer: Konami"'
  - type: feature
    label: Ogni membro ora può aggiungere la propria chiave Steam e il proprio Steam ID in Impostazioni → Il mio profilo, e importare la propria libreria Steam e i propri obiettivi. Finora poteva farlo solo un amministratore
    en: Every member can now add their own Steam key and Steam ID under Settings → My Profile, and import their own Steam library and achievements. Until now only an admin could
  - type: fix
    label: Salvare i dettagli di un gioco non imposta più a 1 un numero di giocatori vuoto e non segna più come inserite da te le classificazioni per età calcolate da RetroDB. Il Riempimento AI mantiene un gioco che hai segnato come Esclusivo e mantiene ogni modifica fatta a un gioco mentre attende la risposta dell'AI. La cronologia di una scansione ora elenca solo i dettagli che ha davvero salvato
    en: Saving a game's details no longer sets an empty player count to 1, and no longer marks the age ratings RetroDB worked out for you as typed by you. AI Fill keeps a game you marked Exclusive, and keeps any change you make to a game while it is waiting for the AI's answer. A scrape's history now lists only the details it actually saved
  - type: fix
    label: La Revisione screenshot non si ferma più a metà quando uno screenshot salvato è troppo grande per essere aperto; lo conta come illeggibile e prosegue. L'indice della pagina di aiuto ora rimanda a Emulatori e Giocare, e le note per sviluppatori su accesso, attività in background, scansione, immagini, aggiornamenti e risposte di errore ora descrivono ciò che il programma fa davvero
    en: Screenshot Review no longer stops halfway when one stored screenshot is far too large to open; it counts that picture as unreadable and carries on. The help page's contents list now links to Emulators and Playing, and the developer notes on sign-in, background jobs, scraping, pictures, updates and error replies now say what the program really does
  - type: fix
    label: Un editor che avvia una scansione di Strumenti ROM ora può metterla in pausa, riprenderla o annullarla; le scansioni degli altri restano di competenza dell'amministratore. Tag ed elenchi rifiutano un nome mancante o un colore non valido con un messaggio chiaro invece di una pagina di errore, e rinominare un gioco della Lista dei desideri con il nome di un altro che già desideri viene rifiutato, come l'aggiunta. Cancella dati RA ora dimentica anche se la tua copia ottiene obiettivi. Un trofeo che RetroDB non offre più smette di contare per il tuo grado di collezionista. I percorsi ROM di Windows ora corrispondono ai giochi RetroAchievements tramite il nome del file
    en: An editor who starts a ROM Tools scan can now pause, resume or cancel it; other people's scans stay an admin's to stop. Tags and lists refuse a missing name or a bad colour with a clear message instead of an error page, and renaming a wishlist game onto another one you already wish for is refused, as adding it is. Clear RA Data now also forgets whether your copy earns achievements. A trophy RetroDB no longer offers stops counting toward your collector rank. Windows ROM paths now match RetroAchievements games by file name
  - type: fix
    label: Correzioni di manutenzione. Un archivio multi-disco che non si decomprime non lascia più una cartella a metà che blocca ogni nuovo tentativo. Calcola spazio ora conta ogni file dentro la cartella di un gioco PS3. Cancella dati scansionati elimina le immagini solo se lo chiedi. Una scansione della libreria che incontra un gioco appena aggiunto da un'altra scansione prosegue con il resto dei giochi di quella console
    en: Maintenance fixes. A multi-disc archive that fails to unpack no longer leaves a half-made folder behind that blocks every retry. Calculate Storage now counts every file inside a PS3 game folder. Clear Scraped Data deletes pictures only when you ask it to. A library scan that meets a game another scan has just added carries on with the rest of that console's games
  - type: fix
    label: Ripristinare un backup è più sicuro. Ora viene scritto nel database della libreria nel modo che il database stesso si aspetta, così una parte di RetroDB che lo tiene aperto vede i dati ripristinati invece di rischiare danni. Eliminare un gioco ora elimina anche le immagini della scatola, l'immagine in attesa e le voci delle impostazioni dell'emulatore, così un nuovo gioco non può mai ereditarle. Due impostazioni salvate nello stesso momento non ne perdono più una
    en: Restoring a backup is safer. It is now written into the library database the way the database itself expects, so a part of RetroDB that has it open sees the restored data instead of risking damage. Deleting a game now also deletes its box pictures and its waiting picture and emulator-setting entries, so a new game can never inherit them. Two settings saved at the same moment no longer lose one of them
  - type: fix
    label: Correzioni alle immagini. Le GIF non vengono più passate al potenziatore per poi essere scartate. Il modello del potenziatore viene verificato con la sua impronta pubblicata, e un download errato viene riscaricato invece di disattivare il potenziamento per sempre. Loghi e immagini con parti trasparenti mantengono la trasparenza quando vengono ingranditi. Converti in WebP ora include anche retrocopertine e loghi e non rifiuta più una libreria grande per mancanza di spazio non necessario. Due facce di un file scatola possono condividere un'unica immagine, e rimuovere una scatola con un record danneggiato ne rimuove le immagini
    en: Picture fixes. GIFs are no longer run through the upscaler only to be thrown away. The upscaler model is checked against its published fingerprint, and a bad download is fetched again instead of turning upscaling off for good. Logos and pictures with see-through parts keep their transparency when enlarged. Convert to WebP now takes back covers and logos too, and no longer refuses a large library for want of room it does not need. Two faces of a box file can share one picture, and removing a box with a damaged record removes its pictures
  - type: fix
    label: Le importazioni da CLZ, Steam, Xbox e PlayStation non trattano più come lo stesso gioco ogni titolo scritto solo in giapponese o in un altro alfabeto non latino, e non aggiungono più un gioco senza id. L'anteprima CLZ non aggiunge più console prima che tu confermi l'importazione, e chi guarda una libreria Steam, Xbox o PlayStation non le aggiunge più. Per un gioco Steam rimosso dallo store viene chiesto una sola volta, non a ogni sincronizzazione
    en: Imports from CLZ, Steam, Xbox and PlayStation no longer treat every title written only in Japanese or another non-Latin script as the same game, and no longer add a game with no id. The CLZ preview no longer adds consoles before you confirm the import, and a viewer looking at a Steam, Xbox or PlayStation library no longer adds them either. A Steam game removed from the store is asked about once, not on every sync
  - type: fix
    label: Le statistiche ora raggruppano molte più console sotto il loro produttore invece di "Altro", e l'elenco Scansionati di recente nella dashboard mostra un gioco scansionato di nuovo, non solo i giochi appena aggiunti
    en: Analytics now groups many more consoles under their maker instead of "Other", and the dashboard's Recently Scraped list shows a game you scraped again, not only newly added games
  - type: fix
    label: Le immagini dei controller che aggiungi nel Museo vengono mantenute quando la versione standalone si aggiorna. Quando un servizio online si ferma al suo limite, l'ora in cui verrà interrogato di nuovo è mostrata nel tuo fuso orario
    en: Controller pictures you add in the Museum are kept when the standalone version updates. When an online service pauses at its limit, the time it will be asked again is shown in your own time zone
  - type: fix
    label: Un disco bonus non può più essere collegato a sé stesso o a un altro disco bonus, e il collegamento automatico non collega più un disco a uno che nella stessa esecuzione ha segnato come disco bonus
    en: A bonus disc can no longer be linked to itself or to another bonus disc, and Auto-link no longer links a disc to one it marks as a bonus disc in the same run
  - type: fix
    label: Le pagine della Libreria e delle console non contano più i file BIOS arcade come giochi, né nei totali né nella barra delle lettere. I giochi simili e l'elenco che si ottiene facendo clic su un genere o un editore nella pagina di un gioco non mostrano più le versioni regionali, i dischi bonus o i file BIOS dello stesso gioco
    en: The Library and console pages no longer count arcade BIOS files as games, in their totals or the letter bar. Similar games, and the list you get by clicking a genre or publisher on a game's page, no longer show the game's own regional versions, bonus discs or BIOS files
  - type: fix
    label: Seleziona tutto ora lo segnala quando un elenco molto grande viene troncato, invece di selezionarne silenziosamente solo una parte
    en: Select all now says so when a very large list is cut short, instead of quietly selecting only part of it
  - type: fix
    label: Le schede della Libreria ora si aggiornano quando cambiano i tuoi progressi negli obiettivi o nei trofei, e quando un gioco diventa giocabile o smette di esserlo
    en: Library cards now update when your achievement or trophy progress changes, and when a game becomes playable or stops being playable
  - type: fix
    label: La modifica multipla non può più cambiare i giochi sbagliati se riceve una selezione errata, e una modifica multipla che fallisce non segna più i giochi come modificati da te
    en: Bulk edit can no longer change the wrong games when it is sent a bad selection, and a bulk edit that fails no longer marks the games as edited by you
  - type: fix
    label: Una corrispondenza HowLongToBeat con solo l'1% di affinità non viene più mostrata come corrispondenza al 100%, e una pagina che non si carica mostra la pagina di errore invece del testo grezzo dell'errore
    en: A HowLongToBeat match that is only a 1% fit is no longer shown as a 100% match, and a page that fails to load shows the error page instead of the raw error text
  - type: security
    label: Cambiare la password, o il suo ripristino da parte di un amministratore, ora disconnette quell'account su tutti gli altri dispositivi. Per questo motivo, dopo questo aggiornamento tutti dovranno accedere ancora una volta. Anche la pagina di configurazione iniziale ora ha la stessa protezione dagli altri siti web di ogni altra pagina
    en: Changing your password, or an admin resetting it, now signs that account out on every other device. Because of this, everyone signs in once more after this update. The first-run setup page also gets the same protection against other websites as every other page
  - type: fix
    label: Un'immagine rifiutata come avatar non elimina più l'avatar che avevi
    en: A picture that is refused as your avatar no longer deletes the avatar you had
  - type: fix
    label: Le scansioni sono più delicate con i servizi online. Un servizio che continua a fallire viene saltato per un po' quando si colmano le lacune, come già avveniva nelle ricerche, e le ricerche di giochi su ScreenScraper ora rispettano anche i suoi limiti giornalieri
    en: Scrapes are gentler on the online services. A service that keeps failing is skipped for a while when filling gaps, as it already was in searches, and ScreenScraper game lookups now respect its daily limits too
  - type: fix
    label: Una scansione non fallisce più su un gioco con anno di uscita sconosciuto, come "TBA", e un gioco elencato per regioni fuori dalla tua lista, come "Brasile, Corea", mantiene la sua regione invece di diventare quella predefinita
    en: A scrape no longer fails on a game whose release year is unknown, such as "TBA", and a game listed for regions outside your list, such as "Brazil, Korea", keeps its region instead of becoming your default
  - type: fix
    label: Le cartelle ES-DE scritte con ~/ ora funzionano, e un file ES-DE molto grande non viene più copiato. Le versioni regionali suggerite non riuniscono mai due giochi che hai indicato come non versioni l'uno dell'altro
    en: ES-DE folders written as ~/ now work, and a very large ES-DE file is no longer copied. Suggested regional versions never put back together two games you said are not versions of each other
  - type: security
    label: RetroDB rifiuta qualche altro indirizzo di rete privata quando scarica immagini dal web e segue correttamente il reindirizzamento di un indirizzo web
    en: RetroDB refuses a few more private network addresses when fetching pictures from the web, and follows a web address's redirect correctly
  - type: fix
    label: Le ultime schermate ancora in inglese ora seguono anche la tua lingua, tra cui la configurazione guidata, Tag, Elenchi, Confronta giochi, le impostazioni di Strumenti ROM, la coda di scansione multipla, l'elenco delle attività interrotte della dashboard, le etichette delle schede della libreria e molti messaggi di errore
    en: The last screens still in English now follow your language too, including the setup wizard, Tags, Lists, Compare Games, ROM Tools settings, the bulk scrape queue, the dashboard's interrupted-jobs list, the library card labels and many error messages
  - type: security
    label: Il nome di un sistema contenente codice web non può più eseguirlo nella finestra della coda di scansione multipla
    en: A system name holding web code can no longer run it in the bulk scrape queue window
  - type: accessibility
    label: Ovunque ti trovi in una pagina, la posizione della tastiera ora è indicata da un anello spesso nel colore del tuo Tema, su ogni pulsante, campo e link. Prima molti controlli mostravano solo una linea sottile, uguale a quella del passaggio del mouse
    en: Wherever you are on a page, the keyboard's place is now marked with a bold ring in your theme's colour, on every button, box and link. Before, many controls showed only a faint line, the same as when the mouse passed over them
  - type: accessibility
    label: I link Genere, Serie, Sviluppatore ed Editore sulle schede della libreria ora funzionano da tastiera. Anche il pulsante "in esecuzione" per i giochi in corso si apre da tastiera, ed Esc o un clic altrove chiude il suo elenco
    en: The Genre, Series, Developer and Publisher links on library cards now work from the keyboard. The "running" button for games in play opens from the keyboard too, and Esc or a click elsewhere closes its list
  - type: accessibility
    label: Gli screen reader ora nominano ogni colore dei tag e dicono quale è selezionato, e leggono le immagini dei trofei come Platino, Oro, Argento e Bronzo invece di singole lettere. Mentre un gioco si avvia, Tab non passa più dietro la schermata di avvio
    en: Screen readers now name each tag colour and say which one is chosen, and read trophy pictures as Platinum, Gold, Silver and Bronze instead of single letters. While a game starts, Tab no longer moves behind the starting screen
  - type: fix
    label: Se un aggiornamento si ferma prima di iniziare a sostituire i file, RetroDB ora riavvia la versione che avevi, invece di restare chiuso
    en: If an update stops before it starts swapping files, RetroDB now starts the version you had again, instead of staying closed
  - type: fix
    label: Premere Gioca due volte di seguito non può più avviare due giochi nel lettore integrato. L'attesa del download di un core ora si interrompe dopo un po', o quando RetroDB smette di rispondere, invece di attendere all'infinito, e la domanda "già in esecuzione" usa la finestra di dialogo di RetroDB
    en: Pressing Play twice at once can no longer start two games on the built-in player. Waiting for a core download now gives up after a while, or when RetroDB stops answering, instead of waiting forever, and the "already running" question uses RetroDB's own dialog
  - type: fix
    label: I trucchi che attivi o disattivi durante il gioco vengono conservati per il gioco giusto, mai presi da un altro gioco il cui file ha lo stesso nome. Un problema con i trucchi non impedisce mai l'avvio di un gioco
    en: Cheats you switch on or off during play are kept for the right game, never taken from another game whose file has the same name. A cheat problem never stops a game starting
  - type: fix
    label: RetroDB scrive il file delle impostazioni di un emulatore in modo più sicuro. Un file di impostazioni che è un link resta un link, mantiene i suoi permessi e le lettere che non sa leggere, e un salvataggio fallito non lascia file inutili
    en: RetroDB writes an emulator's settings file more safely. A settings file that is a link stays a link, keeps its permissions, and keeps letters it cannot read, and a failed save leaves no stray file behind
  - type: fix
    label: Una scansione multipla che sposti in basso nella coda, scambi con un'altra o riprenda mentre un'altra è in corso non va più persa quando RetroDB si riavvia; la dashboard la propone da dove si era fermata. Una scansione sostituita non continua più accanto alla nuova, e due clic rapidi su Riprendi avviano l'attività una sola volta
    en: A bulk scrape you move down the queue, swap with another or resume while one runs is no longer lost when RetroDB restarts; the dashboard offers it, from where it stopped. A swapped-out scrape no longer keeps running beside the new one, and two quick clicks on Resume start a job once
  - type: fix
    label: L'errore di un singolo gioco, come la caduta della rete, non termina più un'intera esecuzione di Riempimento AI o di Correggi scatola e regioni dei manuali; quel gioco conta come fallito e gli altri proseguono. Fermare RetroDB ora interrompe anche i download dei core in modo pulito
    en: One game's error, such as the network dropping, no longer ends a whole AI Fill run or a Fix Box and Manual Regions run; that game counts as failed and the rest go on. Stopping RetroDB now also stops core downloads cleanly
  - type: fix
    label: Gli elementi della Lista dei desideri non restano più bloccati su "scansione" per sempre dopo un errore o un riavvio, e due esecuzioni di Scansiona tutto per la stessa Lista dei desideri non vengono più eseguite insieme
    en: Wishlist items no longer stay on "scraping" forever after an error or a restart, and two Scrape All runs for the same wishlist no longer run at once
  - type: fix
    label: Uno script o una seconda copia di RetroDB che si avvia non segna più come interrotti i processi del server in esecuzione, e due copie avviate insieme non possono più riportare il database a una versione precedente
    en: A script or a second copy of RetroDB starting up no longer marks the running server's jobs as interrupted, and two copies starting at once can no longer set the database back a version
  - type: fix
    label: Avviare una sincronizzazione PlayStation non fa più attendere le barre di avanzamento di tutti mentre accede a Sony. Il mantenimento giornaliero di PlayStation rinnova l'accesso solo verso la fine dei suoi 10 giorni, non ogni giorno
    en: Starting a PlayStation sync no longer makes everyone's progress bars wait while it signs in to Sony. The daily PlayStation keep-alive now renews a sign-in only near the end of its 10 days, instead of every day
  - type: fix
    label: Una scansione non sovrascrive più una modifica fatta mentre è in corso, e non svuota più un genere, una modalità o una vista di cui non conosce il nome. Non cambia più il numero di giocatori salvato per adattarlo alle modalità del gioco
    en: A scrape no longer writes over a change you make while it runs, and no longer empties a genre, mode or view it has no name for. It no longer changes a stored player count to match the game's modes
  - type: fix
    label: 'Riempimento AI non cambia più ciò che hai scritto tu, come un editore o un genere corretto a mano: corregge solo i valori scansionati. Non segnala più come cambiato un valore scritto solo in modo diverso, come 4 giocatori come "1-4" o gli stessi generi in un altro ordine'
    en: AI Fill no longer changes what you typed yourself, such as a publisher or genre you corrected by hand; it corrects only scraped values. It no longer reports a value as changed when it only wrote it differently, such as 4 players as "1-4" or the same genres in another order
  - type: fix
    label: Un controller che scrivi per un gioco viene mantenuto; il controller predefinito della console ora sostituisce solo i valori scansionati e AI. Anche una classificazione per età convertita da una stima AI di un altro ente è ora segnata come stima
    en: A controller you type for a game is kept; the console's default controller now replaces only scraped and AI values. An age rating converted from another board's AI guess is now marked as a guess too
  - type: fix
    label: Salvare la finestra di modifica di un gioco non svuota più i campi che la finestra non mostra. Reimposta nella pagina di un gioco ora cancella tutto ciò che dice, inclusi vista, edizione e altri nomi, elimina immagini e video del gioco se non li usa un altro gioco, e aggiorna subito i filtri della libreria
    en: Saving a game's edit window no longer empties fields the window does not show. Reset on a game's page now clears everything it says it does, including the view, edition and other names, deletes the game's pictures and videos unless another game uses them, and updates the library filters straight away
  - type: fix
    label: Cancella dati scansionati ora cancella anche la vista, 2D o 3D, e la struttura del gioco. Un'importazione CLZ di un gioco con solo l'anno mantiene solo l'anno, non il 1° gennaio
    en: Clear Scraped Data now also clears the view, 2D or 3D, and game structure. A CLZ import of a game with only a year keeps just the year, not 1 January
  - type: security
    label: La sincronizzazione Steam non usa più la chiave Steam delle Impostazioni per ogni membro della famiglia. Un membro senza una chiave Steam propria otteneva la libreria e gli obiettivi Steam dell'amministratore nel proprio account. La chiave nelle Impostazioni ora serve solo agli amministratori
    en: Steam sync no longer borrows the Steam key from Settings for every household member. A member with no Steam key of their own was getting the admin's Steam library and achievements under their account. The key in Settings now serves admins only
  - type: fix
    label: La ricerca di How Long to Beat per molti giochi ora salva i tempi di cui è sicura. Prima ogni corrispondenza sicura falliva e non veniva salvato nulla. Aggiorna RetroAchievements ora controlla anche il file di ogni gioco con l'elenco di RetroAchievements, come fa una scansione, così il gioco è collegato alla versione esatta che hai
    en: How Long to Beat's lookup for many games now saves the times it is sure of. Before, every sure match failed and nothing was saved. RetroAchievements Refresh now also checks each game's file against RetroAchievements' list, as a scrape does, so a game is linked to the exact version you have
  - type: fix
    label: Il messaggio che un processo in background è terminato appare di nuovo, e la casella di avanzamento di un processo si accorge quando il server lo riprende dopo un riavvio. Prima nessuno dei due appariva mai
    en: The message that a background job has finished shows again, and a job's progress box notices when the server picks the job up after a restart. Before, neither ever appeared
  - type: fix
    label: 'Trofei PlayStation: un gioco collegato a mano resta collegato dopo una sincronizzazione completa, e la sincronizzazione non collega più un gioco al suo seguito, come "Doom" a "Doom Eternal". Importare giochi PlayStation ora collega un gioco già presente nella libreria, come le importazioni Steam e Xbox, così i suoi trofei vi compaiono'
    en: 'PlayStation trophies: a game you linked by hand stays linked after a full sync, and a sync no longer links a game to its sequel, such as "Doom" to "Doom Eternal". Importing PlayStation games now links a game already in your library, as Steam and Xbox imports do, so its trophies show on it'
  - type: fix
    label: Xbox non mostra più il tuo gamertag come Sconosciuto dopo che l'accesso si rinnova da solo, e una connessione lenta o fallita non ti disconnette più da Xbox. Solo il rifiuto dell'accesso da parte di Microsoft lo fa
    en: Xbox no longer shows your gamertag as Unknown after its sign-in renews itself, and a slow or failed connection no longer signs you out of Xbox. Only Microsoft refusing the sign-in does that
  - type: fix
    label: Ora due persone possono avere ciascuna un tag con lo stesso nome; prima il secondo dava errore. Ogni utente connesso può ora riscansionare i propri trofei RPCS3; prima solo un amministratore poteva, e gli altri vedevano trofei vecchi fino al riavvio di RetroDB
    en: Two people can now each have a tag of the same name; before, the second one failed with an error. Any signed-in user can now rescan their own RPCS3 trophies; before, only an admin could, and everyone else saw old trophies until RetroDB restarted
  - type: security
    label: I tuoi accessi restano privati. I backup del database non possono più essere letti da altri account del computer, e un backup fallito non elimina più quello precedente. Eliminare o disattivare un utente lo disconnette anche da RetroAchievements in DuckStation e PCSX2. Un accesso a RetroAchievements salvato dal menu del giocatore non passa più alla persona che gioca dopo. I log e gli errori salvati dei processi nascondono i token RetroAchievements, l'errore PlayStation di un altro membro è mostrato solo a lui, e i vecchi file di accesso PlayStation e Xbox in testo semplice vengono rimossi
    en: Your sign-ins stay private. Database backups can no longer be read by other accounts on the computer, and a failed backup no longer deletes the one before it. Deleting or switching off a user also signs them out of RetroAchievements in DuckStation and PCSX2. A RetroAchievements sign-in saved from the player's own menu no longer carries over to the next person who plays. Logs and saved job errors hide RetroAchievements tokens, another member's PlayStation error is shown only to them, and old plain-text PlayStation and Xbox sign-in files are removed
  - type: fix
    label: I controlli interni di RetroDB non possono più toccare la tua libreria mentre sono in esecuzione. Usano sempre una copia usa e getta del database, delle immagini e delle impostazioni, e si rifiutano di partire se una di queste punta ai tuoi file reali
    en: RetroDB's own checks can no longer touch your library while they run. They always use a throwaway copy of the database, pictures and settings, and refuse to start if any of them points at your real files
  - type: fix
    label: Pulisci file orfani non elimina più le immagini della tua Lista dei desideri. Aprire un gioco non gli fa più dimenticare gli screenshot che non trova. Prima, con l'unità delle immagini scollegata, ogni gioco aperto perdeva tutto l'elenco degli screenshot; ora l'elenco resta e un'immagine mancante viene solo nascosta
    en: Clean orphaned files no longer deletes your wishlist's pictures. Opening a game no longer makes it forget screenshots it cannot find. Before, with the picture drive unplugged, every game you opened lost its whole screenshot list; now the list is kept, and a missing picture is only hidden
  - type: fix
    label: Un download di video o manuale che fallisce a metà non danneggia più la copia che il gioco aveva già, e un download fallito non lascia più un mezzo file nascosto nella cartella dei media. Il potenziatore in background non salva più un'immagine vecchia sopra una più nuova scaricata nel frattempo. Converti in WebP mantiene collegati tutti i giochi che condividono un'immagine, e non tocca mai file fuori dalle cartelle delle immagini
    en: A video or manual download that fails part-way no longer damages the copy the game already had, and a failed download no longer leaves a hidden half-file in the media folder. The background upscaler no longer saves an old picture over a newer one downloaded meanwhile. Convert to WebP keeps every game that shares a picture pointing at it, and never touches a file outside the picture folders
  - type: fix
    label: Eliminare un gioco o un elemento della Lista dei desideri ora elimina anche le sue immagini, i video e i manuali, ma conserva quelli ancora usati da un altro gioco o elemento. Le immagini salvate possono di nuovo essere lette da altri account del computer, e Ridimensiona immagini conta come fallita un'immagine che non ha potuto salvare, non come fatta
    en: Deleting a game or a wishlist item now deletes its pictures, videos and manuals too, but keeps any another game or wishlist item still uses. Saved pictures can be read by other accounts on the computer again, and Resize Images counts a picture it could not save as failed, not as done
  - type: fix
    label: Trova duplicati non propone più un file funzionante per l'eliminazione. Cercando per nome, non considera più copie l'una dell'altra i file .cue e .bin di un gioco. Non propone mai il file di tracce di un disco, che due versioni di un gioco possono condividere. Non elimina un disco elencato in una playlist. Un gioco di cui elimini il file passa ora alla copia che tieni, così resta nella libreria
    en: Duplicate Finder no longer offers a working file for deletion. Looking by name, it no longer calls a game's .cue and .bin copies of each other. It never offers a disc's track file, which two versions of a game can share. It will not delete a disc that a playlist lists. A game whose file you delete now moves to the copy you keep, so it stays in the library
  - type: fix
    label: Organizza multi-disco non sovrascrive più una playlist esistente né un file già presente nella cartella del gioco; si ferma e dice quale. La playlist che crea elenca il .cue di ogni disco, non i suoi file di tracce. I giochi i cui file vengono spostati ora li seguono nella cartella, così Pulisci ROM mancanti non li rimuove più
    en: Organize Multi-Disc no longer writes over an existing playlist or a file already in the game's folder; it stops and says which. The playlist it makes lists each disc's .cue, not its track files. Games whose files it moves now follow them into the folder, so Clean missing ROMs no longer removes them
  - type: fix
    label: Convertire in CHD con "elimina originali" ora elimina anche i file di tracce del disco, ma conserva una traccia usata ancora da un altro .cue. Il gioco e ogni playlist che elencava il vecchio disco ora puntano al nuovo .chd. Rinominare il file di un gioco ora aggiorna la playlist che lo elenca, e un file di traccia necessario a un .cue non può essere rinominato. Rimuovere file da uno zip rimuove solo i file scelti, anche quando un nome contiene [ o ]. Deduplica screenshot elimina solo le copie trovate dalla sua scansione, e ne mantiene sempre una
    en: Converting to CHD with "delete originals" now deletes the disc's track files too, but keeps a track another .cue still uses. The game and any playlist that listed the old disc now point at the new .chd. Renaming a game's file now updates the playlist that lists it, and a track file a .cue needs cannot be renamed. Removing files from a zip removes only the files you picked, even when a name holds [ or ]. Screenshot Dedup deletes only the copies its scan found, and always keeps one
  - type: fix
    label: How Long to Beat nella pagina di un gioco cerca ciò che scrivi. Prima, un titolo non trovato lo faceva cercare con gli altri nomi del gioco, e poteva proporre un gioco diverso, come un remake dei fan. Prova ancora gli altri nomi quando la casella contiene il nome del gioco stesso
    en: How Long to Beat on a game's page searches for what you type. Before, a title it could not find made it search the game's other names instead, and it could offer a different game, such as a fan remake. It still tries the other names when the box holds the game's own name
  - type: fix
    label: I passaggi di How Long to Beat nel manuale di aiuto corrispondono alla schermata. Dicevano di scegliere una corrispondenza da un elenco; la pagina ne mostra una con Salva e Annulla. L'aiuto PlayStation non dice più che l'accesso dura circa due mesi, perché RetroDB accede di nuovo da solo. Tutti i 20 manuali tradotti hanno entrambe le modifiche
    en: The help manual's How Long to Beat steps match the screen. They said to pick a match from a list; the page shows one match with Save and Cancel. The PlayStation help no longer says the sign-in lasts about two months, since RetroDB signs in again by itself. All 20 translated manuals carry both changes
  - type: fix
    label: Ogni barra delle lettere ora inizia con un pulsante Tutti. Nelle pagine Libreria, console e Trofei PSN, scegliere una lettera mostra solo i giochi di quella lettera, e prima non c'era un pulsante per riavere gli altri. Nelle altre pagine degli obiettivi, Tutti torna al primo gioco
    en: Every letter bar now starts with an All button. On the Library, console and PSN Trophies pages, picking a letter shows only that letter's games, and before there was no button to bring the rest back. On the other achievement pages, All goes back to the first game
  - type: fix
    label: Un nuovo token di accesso PlayStation incollato nelle Impostazioni ora viene usato subito. Prima RetroDB continuava a usare il vecchio accesso finché non scadeva, e Salva e prova connessione indicava quel vecchio accesso come funzionante. Un token rifiutato da Sony non sostituisce più uno che funziona
    en: A new PlayStation sign-in token you paste in Settings is now used straight away. Before, RetroDB kept using the old sign-in until it ran out, and Save & Test Connection reported that old sign-in as working. A token Sony refuses no longer replaces one that works
  - type: enhancement
    label: 'L''accesso PlayStation nelle Impostazioni è più facile da mantenere. Il banner non conta più alla rovescia giorni in cui non dovevi fare nulla, perché RetroDB accede di nuovo da solo; diventa rosso solo quando Sony rifiuta il token salvato. Il pulsante Incolla qui non fa più chiedere al browser di leggere gli appunti: mette il cursore nella casella per Ctrl+V. I passaggi ora dicono di uscire prima da PlayStation quando sostituisci un token che funziona ancora, e i loro messaggi possono essere tradotti'
    en: 'The PlayStation sign-in in Settings is easier to keep going. The banner no longer counts down days you never had to act on, because RetroDB signs in again by itself; it turns red only when Sony refuses your saved token. The Paste here button no longer makes the browser ask to read your clipboard: it puts the cursor in the box for Ctrl+V. The steps now say to sign out of PlayStation first when you replace a token that still works, and their messages can be translated'
  - type: enhancement
    label: I messaggi a comparsa e le caselle di domanda, come "Impostazioni salvate" o "Eliminare questa lista?", ora possono essere tradotti in ogni pagina. Prima la maggior parte restava in inglese qualunque lingua scegliessi
    en: Pop-up messages and question boxes, such as "Settings saved" or "Delete this list?", can now be translated on every page. Before, most of them stayed in English whatever language you chose
  - type: enhancement
    label: I messaggi che spiegano perché un accesso PlayStation è fallito, come "Il tuo NPSSO potrebbe essere scaduto", ora possono essere tradotti
    en: The messages that say why a PlayStation sign-in failed, such as "Your NPSSO may have expired", can now be translated
  - type: fix
    label: Il manuale di aiuto in ogni lingua ora corrisponde a quello inglese. Aggiunge Cerca ovunque, Mantenere un titolo, Nomi MAME e il retro della scatola, e i paragrafi più vecchi rimasti indietro sono aggiornati
    en: The help manual in every language now matches the English one. It gains Search Anywhere, Keeping a Title, MAME Names and the back of the box, and older paragraphs that had fallen behind are up to date
  - type: fix
    label: In tedesco, afrikaans e spagnolo, il pulsante Indietro sulla copertina di un gioco ora indica il retro della scatola, non "torna indietro"
    en: In German, Afrikaans and Spanish, the Back button on a game's cover now says the back of the box, not "go back"
  - type: feature
    label: Premendo Gioca ora lo schermo si riempie con il logo del gioco sulla sua immagine di sfondo mentre il gioco si avvia, o con il suo nome a grandi lettere se non ha un logo. Sparisce da solo quando si apre la finestra del gioco, o quando premi Esc o fai clic
    en: Pressing Play now fills the screen with the game's logo on its background picture while the game starts, or its name in large letters when it has no logo. It goes away by itself when the game's window opens, or when you press Esc or click
  - type: feature
    label: 'La scatola 3D girevole ora ha la vera forma di una custodia PS5: angoli e bordi arrotondati, il bordo rialzato attorno alla copertina, la linea dove si uniscono le due metà e la fessura per il dito sul lato di apertura. Serve un file di scatola da una versione di Slipcase che scriva la forma; importa di nuovo la scatola per ottenerla. Le altre scatole restano come prima'
    en: 'The turnable 3D box now has the real shape of a PS5 case: rounded corners and edges, the raised lip round the cover, the line where the two halves meet, and the finger slot in the opening side. It needs a box file from a Slipcase version that writes the shape; import the box again to get it. Other boxes look as before'
  - type: enhancement
    label: Aggiorna RetroAchievements è passato dalle Impostazioni alla pagina RetroAchievements e ora si chiama Trova giochi con obiettivi. Ogni pulsante lì ha ora una riga che dice cosa fa, così Trova giochi e Sincronizza progressi si distinguono facilmente. Senza giochi ancora collegati, la pagina mostra a un amministratore il pulsante Trova invece di passare alla scheda successiva
    en: Refresh RetroAchievements moved from Settings to the RetroAchievements page, and is now called Find Games with Achievements. Every button there now has a line saying what it does, so Find Games and Sync Progress are easy to tell apart. With no games linked yet, the page shows an admin the Find button instead of moving on to the next tab
  body: "<ul>\n  <li><strong>La 4.0 è l'ultima versione web di RetroDB.</strong> Le nuove versioni\n    saranno un'app desktop per Windows, Linux e macOS e un'app Android.\n    Apriranno la tua Libreria esistente. La versione 4.0 resta disponibile da\n    scaricare e riceverà solo correzioni di sicurezza e correzioni per i bug che causano perdita di dati.\n    In Impostazioni → Aggiornamenti troverai il link all'app desktop quando sarà disponibile.</li>\n  <li><strong>Il manuale di aiuto è aggiornato in tutte le lingue.</strong>\n    Le sezioni che prima erano solo nel manuale in inglese ora sono tradotte.</li>\n</ul>\n"
  body_en: "<ul>\n  <li><strong>4.0 is the last web version of RetroDB.</strong> New versions\n    will be a desktop app for Windows, Linux and macOS, and an Android app.\n    They will open your existing library. Version 4.0 stays available to\n    download, and gets only security fixes and fixes for bugs that lose data.\n    Settings → Updates links to the desktop app when it is out.</li>\n  <li><strong>The help manual is up to date in every language.</strong>\n    Sections that were only in the English manual are now translated.</li>\n</ul>\n"
- version: 3.35.4
  date: '2026-11-03'
  tags:
  - type: fix
    label: Uno screenshot eliminato da un gioco ora resta eliminato. Prima, la scansione successiva poteva copiarlo di nuovo da ES-DE o scaricarlo ancora da una fonte online. Eliminare una copia in più con lo strumento Screenshot duplicati non conta, perché l'immagine resta una volta sola
  - type: feature
    label: 'I giochi ora ricevono il loro logo: la scansione lo salva da ES-DE, ScreenScraper, TheGamesDB, IGDB e Steam, e la pagina del gioco lo mostra sopra il titolo, o al posto di una scatola mancante. Puoi caricare o eliminare un logo nella finestra Modifica. Esegui una scansione multipla con Riempi mancanti per aggiungere i loghi ai giochi già scansionati prima'
  - type: fix
    label: IGDB non assegna più il logo di un gioco come sfondo della pagina
  - type: feature
    label: 'I giochi ora ricevono il retro della scatola: la scansione lo salva da ES-DE, ScreenScraper e TheGamesDB, e un pulsante Retro sulla copertina nella pagina del gioco lo mostra. Clicca sul retro per ingrandirlo. Puoi caricare o eliminare un retro nella finestra Modifica. I retri vengono aggiunti ogni volta che un gioco viene scansionato; Riempi mancanti non scansiona di nuovo un gioco solo per il suo retro'
  - type: fix
    label: Un gioco senza copertina frontale su TheGamesDB non riceve più il retro della scatola come copertina
  - type: fix
    label: Se disattivi uno scraper in Impostazioni mentre è in corso una scansione multipla, il conteggio dei giochi non trovati ora è corretto dal gioco successivo. Prima, un gioco poteva essere contato come interrotto
  - type: enhancement
    label: In un sistema senza emulatore configurato, il pulsante Gioca è disattivato. Passa il puntatore per vederne il motivo, oppure cliccalo per aprire una finestra che dice che nessun emulatore è configurato. Prima, accanto al pulsante c'era una riga di testo
  body: "<ul>\n  <li><strong>I giochi ricevono il loro logo.</strong> La scansione salva il\n    logo di ogni gioco, e la pagina del gioco lo mostra sopra il titolo, o al posto di una\n    scatola mancante. Esegui una scansione multipla con Riempi mancanti per aggiungere i loghi ai\n    giochi già scansionati prima.</li>\n  <li><strong>I giochi ricevono il retro della scatola.</strong> Un pulsante Retro sulla\n    copertina nella pagina del gioco lo mostra, e puoi cliccarlo per ingrandirlo. I retri\n    vengono aggiunti ogni volta che un gioco viene scansionato.</li>\n  <li><strong>Uno screenshot eliminato resta eliminato.</strong> La scansione successiva\n    non lo copia più di nuovo e non lo scarica ancora.</li>\n  <li><strong>Gioca spiega perché non può partire.</strong> In un sistema senza\n    emulatore configurato, il pulsante Gioca è disattivato e ne spiega il motivo.</li>\n</ul>\n"
- version: 3.35.3
  date: '2026-11-02'
  tags:
  - type: feature
    label: 'Nuovo strumento Nomi MAME in Strumenti ROM: i giochi MAME ricevono nome reale, anno e produttore dall''elenco di MAME stesso, mentre i file mantengono il nome breve. Una scansione poi trova ogni gioco, e puoi filtrare l''elenco MAME per categoria, ad esempio escludendo le slot machine. I set BIOS sono nascosti dall''elenco'
  - type: fix
    label: I Report ROM non propongono più di rinominare i file MAME, perché un file rinominato smette di funzionare in MAME
  - type: fix
    label: Impostazioni ora indica cosa richiede Microsoft prima di poter registrare un'app Xbox. Per questo motivo non è stato possibile testare l'accesso a Xbox
  - type: enhancement
    label: La scheda separata Nomi ufficiali non c'è più in Riempimento AI di massa, perché l'interruttore Nome ufficiale del riempimento svolge già questo compito
  - type: fix
    label: Quando Sony rifiuta un accesso PlayStation salvato, la dashboard e Impostazioni ora lo segnalano e ti chiedono di collegare di nuovo l'account. Prima il log mostrava un errore senza senso a ogni avvio del server e nulla ti avvisava
  - type: feature
    label: L'importazione da Steam ora compila descrizione, crediti, punteggio Metacritic, classificazioni per età, modalità di gioco, copertina, sfondo e screenshot di ogni gioco dalla sua pagina dello store, in background. Scansiona un gioco per ottenere genere e data di uscita
  - type: feature
    label: Una sincronizzazione Steam ora conserva il tuo tempo di gioco e l'ultima volta che hai giocato, e la pagina del gioco li mostra
  - type: fix
    label: Recupera libreria nella pagina di importazione Steam ora funziona per un amministratore con una chiave Steam salvata. Prima inviava a Steam la forma nascosta della chiave, e la pagina diceva per errore di impostare il profilo su Pubblico
  - type: fix
    label: Un gioco Steam o Xbox già presente nella tua libreria con lo stesso nome ora viene collegato a quel gioco quando lo importi, così i suoi obiettivi si sincronizzano. Prima veniva saltato e mai collegato
  - type: fix
    label: I giochi importati da Steam, Xbox e PlayStation ora si ordinano subito correttamente, ad esempio Final Fantasy IX prima di Final Fantasy X, e i simboli di marchio di Steam vengono tolti dai nomi
  - type: feature
    label: Sui sistemi in cui RetroAchievements usa un semplice hash del file, come Mega Drive e Game Boy, la pagina del gioco indica se la tua copia dà Obiettivi, e quell'hash collega il gioco giusto. Esegui RA Refresh per compilarlo
  - type: fix
    label: Una scansione ora interroga ScreenScraper sul tuo file esatto prima di cercare per nome, così ottiene proprio il tuo gioco e non uno con titolo simile. I risultati che spunti tu hanno comunque la precedenza
  - type: enhancement
    label: Il riquadro di avanzamento di Ridimensiona immagini ora indica il gioco e il sistema a cui appartiene ogni immagine
  - type: feature
    label: La scansione ora recupera schermate del titolo da ScreenScraper e TheGamesDB, più nomi ufficiali da IGDB e TheGamesDB (come il titolo giapponese di un gioco), e le altre console su cui un gioco è uscito da IGDB
  - type: feature
    label: Un gioco senza punteggio utente ora prende la classificazione della tua raccolta ES-DE, se ne ha una
  - type: feature
    label: La pagina del gioco indica quanti giocatori hanno cronometrato un risultato di HowLongToBeat e rimanda alla sua pagina. I risultati salvati prima mostreranno questi dati alla prossima ricerca
  - type: feature
    label: La pagina di RetroAchievements mostra quante persone giocano a un gioco e quale percentuale ha ottenuto ogni obiettivo
  - type: fix
    label: Il browser cartelle di Strumenti ROM si apre sulla tua cartella ROM quando non ha una cartella da cui partire, invece di fallire. Una risposta illeggibile da IGDB ora fa perdere solo quel dettaglio, non tutto ciò che IGDB ha inviato per il gioco
  - type: fix
    label: Il limite giornaliero di ScreenScraper ora fa smettere a RetroDB di interrogarlo fino a più tardi, e una scansione di massa lo segnala e prosegue con le altre fonti. Prima un limite esaurito sembrava "gioco non trovato" e le chiamate continuavano tutta la notte
  - type: fix
    label: Un gioco per cui nessuna fonte ha potuto rispondere mentre un servizio era al limite non viene più segnato come scansionato, così la prossima esecuzione lo riprova
  - type: fix
    label: Quando una chiave TheGamesDB ha esaurito il mese, RetroDB passa all'altra chiave e smette di interrogare quando entrambe sono esaurite
  - type: fix
    label: Anche il limite mensile di RAWG ora fa smettere a RetroDB di interrogarlo, e IGDB viene mantenuto entro il limite di quattro richieste al secondo
  - type: fix
    label: La ricerca di massa di HowLongToBeat ora termina con un messaggio quando il sito dice di aver ricevuto troppe richieste, e ogni richiesta al sito è distanziata
  - type: fix
    label: Correggi regioni di copertina e manuale non si arrende più dopo 25 giochi di fila che ScreenScraper non conosce. Si ferma solo quando ScreenScraper dice che il limite è raggiunto
  - type: fix
    label: Nella pagina del gioco, ogni classificazione per età ora è centrata sopra la sua etichetta di stima AI
  - type: fix
    label: Il limite di TheGamesDB in Impostazioni ora usa il controllo che non consuma il tuo limite, e non mostra più una data di ripristino inventata quando il servizio non ne fornisce
  body: |
    <ul>
      <li><strong>I giochi MAME ottengono i loro nomi reali.</strong> Il nuovo strumento Nomi MAME
        in Strumenti ROM prende nomi, anni e produttori dall'elenco ufficiale di MAME.
        I file mantengono i nomi brevi, perché MAME ne ha bisogno. Puoi
        filtrare l'elenco MAME per categoria e i set BIOS sono nascosti.</li>
      <li><strong>Le importazioni da Steam portano molto di più.</strong> Ogni gioco compila
        descrizione, crediti, punteggio Metacritic, classificazioni per età, modalità di gioco
        e immagini dalla sua pagina dello store. Una sincronizzazione mantiene il tuo tempo di gioco e la data
        dell'ultima partita. Un gioco già presente nella tua libreria con lo stesso nome ora
        viene collegato, così i suoi obiettivi si sincronizzano.</li>
      <li><strong>Le scansioni trovano il gioco esatto.</strong> Una scansione interroga
        ScreenScraper sul tuo file esatto prima di cercare per nome. Le scansioni
        portano anche schermate dei titoli, più nomi ufficiali e le altre console
        su cui un gioco è uscito.</li>
      <li><strong>RetroAchievements riconosce la tua copia.</strong> Sui sistemi che
        usano un semplice hash del file, come Mega Drive e Game Boy, la pagina del gioco
        indica se la tua copia ottiene obiettivi. Esegui RA Refresh per compilare
        questa informazione. La pagina RetroAchievements mostra anche quante persone giocano a un gioco
        e quale percentuale di loro ha ottenuto ogni obiettivo.</li>
      <li><strong>I limiti online vengono rispettati.</strong> Quando ScreenScraper,
        TheGamesDB o RAWG raggiunge il suo limite, RetroDB smette di chiedere fino a più tardi
        e una scansione di massa continua con le altre fonti. Un gioco per cui nessuna fonte
        ha potuto rispondere in quel momento viene riprovato alla prossima esecuzione.</li>
      <li><strong>Un accesso PlayStation rifiutato viene segnalato.</strong> La dashboard
        e le Impostazioni ora ti chiedono di ricollegare l'account quando Sony rifiuta un accesso
        salvato.</li>
      <li><strong>Nomi ufficiali è stato spostato.</strong> La sua scheda separata non c'è più
        in Riempimento AI di massa, perché l'interruttore Nome ufficiale del riempimento
        svolge lo stesso compito.</li>
    </ul>
- version: 3.35.2
  date: '2026-11-02'
  tags:
  - type: fix
    label: Il tempo di gioco totale non conta più i minuti come ore, nella dashboard, nei trofei del collezionista e nel grafico delle analisi. Un gioco da 36 minuti veniva contato come 36 ore
  - type: fix
    label: HowLongToBeat non scambia più un seguito per il tuo gioco. Double Dragon II non riceve più i tempi di Double Dragon III
  - type: fix
    label: Una ricerca di massa su HowLongToBeat non salva più il tempo di un gioco di un altro sistema. Mario Golf per Game Boy Color non riceve più il tempo del Nintendo 64. Queste corrispondenze ora attendono nella pagina di revisione
  - type: fix
    label: Le ricerche su HowLongToBeat, di massa e singole, ora usano l'anno di uscita del gioco, quindi Doom del 1993 non riceve più i tempi di Doom del 2016
  - type: new
    label: Controlla tempi di gioco salvati in Strumenti ROM invia alla pagina di revisione le corrispondenze salvate che sembrano sbagliate, dove puoi tenere o cancellare ciascuna
  - type: fix
    label: Una ricerca di massa su HowLongToBeat con Solo mancanti ora riprova i giochi associati senza un tempo e lascia un secondo tra le richieste
  - type: fix
    label: Un punteggio di corrispondenza del 72% non appare più come 100% nella pagina del gioco
  - type: fix
    label: I giochi non mostrano più gli Obiettivi di RetroAchievements di un altro gioco. Resident Evil 4 per GameCube non mostra più il set di Resident Evil, e Ratchet Deadlocked non mostra più quello di Ratchet & Clank
  - type: fix
    label: Una Scansione ora rimuove il collegamento a RetroAchievements quando RetroAchievements non ha quel gioco. Se RetroAchievements non è raggiungibile, il collegamento resta
  - type: fix
    label: RetroAchievements ora trova più dei tuoi giochi, tramite il nome del file ROM, i titoli alternativi, gli accenti come in Ōkami e i titoli con due nomi
  - type: fix
    label: RetroAchievements non collega più un gioco a un set bonus, a un hack o a una demo, e X-Men non equivale più a G-Men
  - type: new
    label: La pagina del gioco mostra il nome che RetroAchievements dà al gioco collegato, così un collegamento sbagliato si nota subito
  - type: fix
    label: Aggiorna RA ora salva i punti di ogni gioco, così un gioco non mostra più 0 punti
  - type: new
    label: La pagina del gioco segna le classificazioni per età dell'AI come una stima basata sul contenuto del gioco e indica quando è nato ogni ente di classificazione. OutRun del 1987 non sembra più classificato ufficialmente da ESRB
  - type: new
    label: La pagina del gioco segna i punteggi delle recensioni e i dati di vendita che provengono dall'AI. Se modifichi tu una classificazione o un dato di vendita, il segno sparisce
  - type: fix
    label: Un punteggio dell'AI su una scala sbagliata viene rifiutato, così un gioco apprezzato non riceve più 7 su 100 da una nuova Scansione
  - type: fix
    label: Il numero di voti fornito dall'AI non viene più salvato accanto al punteggio di un altro sito, e la pagina del gioco non mostra più quelli salvati così
  - type: fix
    label: Un intervallo di vendite o una somma di denaro dall'AI non diventa più poche copie vendute
  - type: fix
    label: Le risposte dell'AI non salvano più elenchi come codice, le parole N/A o None come valori, né la Console del gioco stesso tra le altre piattaforme
  - type: fix
    label: Riempimento AI ora conserva nella cronologia del gioco il valore che sostituisce
  - type: fix
    label: I giochi su cartuccia non ricevono più un tipo di Salvataggio a batteria inventato, e le nuove risposte dell'AI non usano più Standard Edition come predefinito
  - type: fix
    label: La serie di un gioco non deriva più dal taglio del suo titolo, quindi Need For Speed non è più in una serie chiamata Need. I nomi delle serie di IGDB vengono letti di nuovo e le vecchie ipotesi vengono cancellate perché la prossima Scansione le riempia
  - type: fix
    label: Le descrizioni non mostrano più codici web al posto delle virgolette, né segni di titolo come
  - type: fix
    label: Un'azienda ora ha una sola grafia, quindi cliccando Sega si trovano tutti i giochi SEGA. Le Regioni hanno un solo valore e le piattaforme usano i nomi dell'elenco
  - type: fix
    label: I titoli dei giochi da RAWG non ricevono più un anno e i titoli alternativi non elencano più nomi di file come dosbox.exe
  - type: fix
    label: Riscansione completa non sostituisce più con una stima una classificazione o un Controller che hai impostato, e una Scansione che fallisce a metà non scrive più attraverso una via meno accurata
  body: "<ul>\n  <li><strong>Le risposte dell'AI dicono di esserlo.</strong> Le classificazioni per età dell'AI\n    restano, segnate come stima basata sul contenuto del gioco, con l'anno in cui ogni\n    ente di classificazione è nato. Anche punteggi e vendite dell'AI sono segnati.</li>\n  <li><strong>RetroAchievements mostra il gioco giusto.</strong> I seguiti non\n    portano più gli Obiettivi del primo gioco. Dopo l'aggiornamento, la\n    dashboard offre una volta un aggiornamento di RetroAchievements. Premilo per riparare\n    i vecchi collegamenti. I progressi salvati con un collegamento sbagliato vengono rimossi e la prossima\n    sincronizzazione li riempie di nuovo.</li>\n  <li><strong>I totali del tempo di gioco sono corretti.</strong> I tempi sotto l'ora\n    venivano contati come ore, quindi i totali nella dashboard e i trofei del\n    collezionista erano troppo alti. Alcuni totali e trofei diminuiranno.</li>\n  <li><strong>HowLongToBeat trova il gioco giusto.</strong> Un seguito non\n    passa più per il gioco che hai, e ora contano il sistema e l'anno del gioco.\n    Una corrispondenza su un altro sistema, o di anni dopo, ti aspetta nella pagina\n    di revisione.</li>\n  <li><strong>Controlla ciò che è già salvato.</strong> Premi Controlla tempi di gioco\n    salvati in Strumenti ROM per inviare alla pagina di revisione le corrispondenze dubbie.\n    Nulla cambia finché non decidi tu.</li>\n  <li><strong>I nomi delle serie sono reali.</strong> La serie di un gioco non deriva più\n    dal taglio del suo titolo. Dopo l'aggiornamento, i nomi di serie che erano\n    ipotesi vengono cancellati, anche alcuni che erano giusti. La prossima Scansione\n    li riempie da fonti che indicano una serie.</li>\n  <li><strong>Testo pulito.</strong> Le descrizioni non mostrano più codici web né\n    segni di titolo. Un'azienda ha una sola grafia, un gioco ha una sola Regione, e\n    nomi di file come dosbox.exe non sono più elencati come altri titoli. Questo\n    avviene una volta, da solo, dopo l'aggiornamento.</li>\n  <li><strong>Riscansione completa mantiene le tue scelte.</strong> Una classificazione o\n    un Controller che hai impostato resta, a meno che una fonte non ne fornisca davvero uno.</li>\n</ul>\n"
- version: 3.35.1
  date: '2026-11-02'
  tags:
  - type: fix
    label: La scansione non prende più un seguito al posto del gioco che hai. Street Fighter II non riceve più dettagli da Street Fighter, né Sonic the Hedgehog da Sonic 2, quando manca il gioco esatto
  - type: fix
    label: Una scansione di massa ora accetta una corrispondenza solo se il titolo corrisponde davvero. La console giusta e una data di uscita non bastano più da sole per essere accettate
  - type: fix
    label: Mod, DLC, bundle e aggiornamenti di IGDB non corrispondono più a un gioco, a meno che la tua ROM abbia esattamente quel nome
  - type: fix
    label: RAWG ha un solo record per tutte le versioni di un gioco, quindi quando riguarda più console non fornisce più sviluppatore, editore, classificazione per età o modalità multigiocatore. Non ipotizza più in alcun modo il numero di giocatori
  - type: fix
    label: Il numero di giocatori e le modalità multigiocatore di IGDB ora arrivano dalla console del gioco stesso
  - type: fix
    label: Quando le fonti corrispondono allo stesso modo, ora decide l'ordine dei tuoi scraper. RAWG non ottiene più punti extra per un'immagine o un voto Metacritic, e le nuove installazioni lo mettono per ultimo
  - type: fix
    label: RAWG non viene più cercato per i giochi Commodore 64 e DOS, perché li classifica come Amiga e PC, e quindi potrebbe corrispondere un gioco di un'altra piattaforma
  - type: fix
    label: Il risultato ScreenScraper che scegli è ora sempre il gioco che ottieni, anche dopo aver lasciato i risultati aperti per più di 10 minuti
  - type: fix
    label: Accenti e punteggiatura non abbassano più la corrispondenza del titolo, quindi Pokémon trova Pokemon e R.B.I. trova RBI
  - type: fix
    label: Una data di uscita ora mostra solo ciò che conosce la sua fonte. Un gioco noto solo per l'anno mostra quell'anno, non un 1° gennaio o un 31 dicembre inventato
  - type: fix
    label: Le date di IGDB e RAWG ora appartengono alla console del gioco stesso, e quelle di IGDB alla sua regione, quindi una copia USA non mostra più la data giapponese né un port l'anno dell'originale
  - type: feature
    label: L'elenco Date di uscita nella pagina di un gioco ora si compila da IGDB e ScreenScraper, non solo dall'IA
  - type: added
    label: 'Nuova scheda Strumenti ROM: Riordina date di uscita elimina i giorni inventati salvati dalle vecchie scansioni, così una scansione può inserire la data reale'
  - type: fix
    label: Generi, prospettive e modalità di gioco ora usano un solo set di nomi, qualunque fonte li abbia compilati, così i filtri trovano ogni gioco. Un genere non appare più sia come RPG sia come Role Playing Game
  - type: added
    label: 'Nuova scheda Strumenti ROM: Riordina generi, prospettive e modalità converte ciò che le vecchie scansioni hanno salvato, sposta parole come FPV nel campo giusto e corregge i numeri di giocatori in contrasto con le modalità di un gioco'
  - type: fix
    label: I giochi solo online di IGDB non sono più elencati come multigiocatore locale, e un gioco che richiede due giocatori non è più elencato come per giocatore singolo
  body: "<ul>\n  <li><strong>La scansione non prende più il gioco sbagliato.</strong> Un seguito non\n    viene più scambiato per il gioco che hai, quindi Street Fighter II non riceve nulla\n    da Street Fighter, e una scansione di massa richiede che il titolo corrisponda, non\n    solo la console. Mod, DLC e bundle di IGDB non corrispondono più a meno che la tua\n    ROM abbia quel nome esatto.</li>\n  <li><strong>RAWG smette di mescolare le versioni di un gioco.</strong> Quando il suo record\n    riguarda più console non fornisce più sviluppatore, editore, classificazione per età\n    o modalità multigiocatore, e non ipotizza più il numero di giocatori.\n    Non viene più cercato per i giochi Commodore 64 e DOS.</li>\n  <li><strong>L'ordine dei tuoi scraper decide tra corrispondenze uguali.</strong>\n    RAWG non ottiene più punti extra per un'immagine o un voto Metacritic, e le nuove\n    installazioni lo mettono per ultimo.</li>\n  <li><strong>Una data di uscita mostra solo ciò che la sua fonte conosce.</strong> Un\n    gioco noto solo per l'anno mostra quell'anno. Le date di IGDB e RAWG\n    appartengono alla console del gioco stesso, e l'elenco Date di uscita ora si compila\n    anche da IGDB e ScreenScraper.</li>\n  <li><strong>Un solo set di nomi per generi, prospettive e modalità.</strong>\n    I filtri ora trovano ogni gioco, e i giochi solo online non sono più elencati\n    come multigiocatore locale.</li>\n  <li><strong>Due nuove schede Strumenti ROM.</strong> Riordina date di uscita e Riordina\n    generi, prospettive e modalità correggono ciò che le vecchie scansioni hanno salvato. Premile,\n    poi avvia una scansione di massa con Compila mancanti.</li>\n  <li><strong>Il numero di giocatori arriva dalla console del gioco stesso,</strong> e\n    il risultato ScreenScraper che scegli è sempre il gioco che ottieni.</li>\n</ul>\n"
