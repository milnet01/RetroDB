  body: "<ul>\n  <li><strong>Ogni scraper cerca la console giusta.</strong> Atari\n    Lynx, arcade CPS, Super Famicom e altri venivano cercati sulla\n    macchina sbagliata, e ora molti più sistemi vengono cercati,\n    da ogni fonte e per gli obiettivi.</li>\n  <li><strong>La regione di un gioco viene prima dal nome del file.</strong>\n    Un tag come (USA) ora decide la regione, e l'IA non viene più\n    interpellata. Strumenti ROM ha un nuovo strumento, Correggi regioni dai\n    nomi file, per i giochi sbagliati dalle vecchie scansioni.</li>\n  <li><strong>ScreenScraper segue la regione del gioco.</strong> Copertina,\n    copertina 3D, manuale, titolo e data di uscita ora vengono dalla\n    regione del gioco, non dalla prima in ordine alfabetico. Strumenti ROM ha un\n    nuovo strumento, Correggi regioni di copertine e manuali, per le vecchie scansioni. I video\n    provano prima il file più piccolo.</li>\n  <li><strong>Le immagini RAWG non sono più copertine.</strong> Spesso sono\n    screenshot e impedivano di trovare una copertina vera. Ora sono usate come\n    fanart. Strumenti ROM ha un nuovo strumento, Rimuovi immagini RAWG dalle copertine,\n    per quelle salvate dalle vecchie scansioni. RetroDB cita anche RAWG con un\n    link nella barra laterale, come richiesto da RAWG.</li>\n  <li><strong>ES-DE mantiene il suo posto nell'ordine degli scraper.</strong> Quando\n    non era la fonte principale, le fonti successive e l'IA sostituivano i suoi\n    testi e le copertine, e i suoi screenshot venivano scartati. Ora restano.\n    Non copia più i contenuti che un gioco ha già e legge la voce\n    del file ROM del gioco stesso. I giochi PS3 in cartella ora trovano le loro\n    copertine ES-DE. L'importazione dei loghi dei sistemi non prende più un'immagine non correlata.\n    Una Riscansione completa non elimina più una copertina appena\n    scaricata da un'altra fonte.</li>\n  <li><strong>Revisione screenshot.</strong> Un nuovo strumento in Strumenti ROM elenca\n    gli screenshot di ZX Spectrum, Commodore 64 e Game Boy con i più\n    sospetti per primi e rimuove solo ciò che scegli. La scansione ora\n    rifiuta uno screenshot Game Boy il cui originale ha molte più sfumature\n    di quante la macchina possa mostrarne. Sui sistemi a 8 e 16 bit non\n    aggiunge più screenshot di IGDB o RAWG a un gioco uscito su più\n    sistemi.</li>\n  <li><strong>L'accesso a RetroAchievements arriva a DuckStation e PCSX2</strong>\n    quando premi Gioca.</li>\n  <li><strong>Nella pagina di un gioco:</strong> i tasti freccia sinistra e destra portano\n    al gioco precedente e successivo, la sezione Trucchi si comprime e\n    ricorda lo stato, i pannelli in basso si adattano alla finestra e l'emulatore è\n    indicato nella scheda Impostazioni Emulatore, non accanto a Gioca.</li>\n  <li><strong>Importa una copertina 3D</strong> ora si trova nella finestra Modifica, accanto\n    alle altre immagini.</li>\n  <li><strong>Una finestra che inizia con una casella di testo,</strong> come Scansiona,\n    ora mette il cursore in quella casella invece che sul pulsante di chiusura.</li>\n</ul>\n"
