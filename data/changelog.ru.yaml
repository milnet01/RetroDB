  - type: feature
    label: Новый инструмент в ROM Tools, Fix Box and Manual Regions, меняет обложки и инструкции, которые старые скрапы ScreenScraper взяли из неверного региона
  - type: fix
    label: Видео ScreenScraper теперь сначала берутся в меньшем размере, а в большем только при неудаче
  - type: fix
    label: Каждый скрапер теперь ищет для нужной консоли. Atari Lynx, аркадные CPS, Super Famicom и другие искались не на той машине, а многие другие системы теперь вообще ищутся всеми источниками и для достижений
  - type: feature
    label: На странице игры стрелки влево и вправо теперь переходят к предыдущей и следующей игре
  - type: feature
    label: Раздел Читы на странице игры теперь сворачивается и запоминает, был ли он открыт
  - type: fix
    label: Окно, которое начинается с текстового поля, например Скрапить, теперь ставит курсор в это поле, а не на кнопку закрытия
  - type: feature
    label: Новый инструмент Screenshot Review в ROM Tools показывает скриншоты ZX Spectrum, Commodore 64 и Game Boy, сначала самые подозрительные, и удаляет только выбранные вами
  - type: fix
    label: Скрапинг теперь отклоняет скриншот Game Boy, у оригинала которого намного больше оттенков, чем может показать эта консоль
  - type: fix
    label: Нижние панели игры теперь помещаются в окно и не выходят за правый край
  - type: feature
    label: Импорт 3D-обложки в окне Редактировать, рядом с другими картинками
  - type: feature
    label: Вход в RetroAchievements теперь передаётся в DuckStation и PCSX2 при нажатии Играть
  - type: fix
    label: На 8- и 16-битных системах скрапинг больше не добавляет скриншоты IGDB или RAWG играм, вышедшим на нескольких системах, так как они могли показывать версию другой системы
  - type: fix
    label: Эмулятор игры теперь указан на карточке настроек Эмулятор, а не рядом с кнопкой Играть
  body: "<ul>\n  <li><strong>Каждый скрапер ищет для нужной консоли.</strong> Atari\n    Lynx, аркадные CPS, Super Famicom и другие искались не на той\n    машине, а многие другие системы теперь вообще ищутся всеми\n    источниками и для достижений.</li>\n  <li><strong>Регион игры сначала определяется по имени её файла.</strong>\n    Метка вроде (USA) теперь определяет регион, а ИИ больше не\n    спрашивается. В ROM Tools есть новый инструмент, Fix Regions from\n    File Names, для игр, которые старые скрапы определили неверно.</li>\n  <li><strong>ScreenScraper учитывает регион игры.</strong> Обложка,\n    3D-обложка, инструкция, титульный экран и дата выхода теперь берутся\n    из собственного региона игры, а не из того, что первым идёт по\n    алфавиту. В ROM Tools есть новый инструмент, Fix Box and Manual\n    Regions, для старых скрапов. Видео теперь сначала берутся в меньшем\n    размере.</li>\n  <li><strong>Картинки RAWG больше не используются как обложки.</strong>\n    Часто это скриншоты, мешавшие найти настоящую обложку. Теперь они\n    используются как фан-арт. В ROM Tools есть новый инструмент, Clear\n    RAWG Pictures from Box Art, для картинок, сохранённых старыми\n    скрапами. RetroDB также указывает RAWG со ссылкой на боковой\n    панели, как того просит RAWG.</li>\n  <li><strong>ES-DE сохраняет своё место в вашем порядке скрапинга.</strong>\n    Когда он не был основным источником, более поздние источники и ИИ\n    заменяли его текст и обложки, а скриншоты отбрасывались. Теперь они\n    остаются. Он больше не копирует медиа, которые уже есть у игры, и\n    читает запись для собственного ROM-файла игры. Игры PS3 в папках\n    теперь находят свои обложки ES-DE. Импорт логотипов систем больше не\n    берёт посторонние картинки. Полный повторный скрапинг больше не\n    удаляет обложку, только что скачанную из другого источника.</li>\n  <li><strong>Screenshot Review.</strong> Новый инструмент в ROM Tools\n    показывает скриншоты ZX Spectrum, Commodore 64 и Game Boy, сначала\n    самые подозрительные, и удаляет только выбранные вами. Скрапинг\n    теперь отклоняет скриншот Game Boy, у оригинала которого намного\n    больше оттенков, чем может показать эта консоль. На 8- и 16-битных\n    системах он больше не добавляет скриншоты IGDB или RAWG играм,\n    вышедшим на нескольких системах.</li>\n  <li><strong>Вход в RetroAchievements передаётся в DuckStation и PCSX2</strong>\n    при нажатии Играть.</li>\n  <li><strong>На странице игры:</strong> стрелки влево и вправо переходят\n    к предыдущей и следующей игре, раздел Читы сворачивается и запоминает\n    это, нижние панели помещаются в окно, а эмулятор указан на карточке\n    настроек Эмулятор, а не рядом с кнопкой Играть.</li>\n  <li><strong>Импорт 3D-обложки</strong> теперь находится в окне\n    Редактировать, рядом с другими картинками.</li>\n  <li><strong>Окно, которое начинается с текстового поля,</strong>\n    например Скрапить, теперь ставит курсор в это поле, а не на кнопку\n    закрытия.</li>\n</ul>\n"
