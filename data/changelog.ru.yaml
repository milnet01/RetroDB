  body: |
    <ul>
      <li><strong>Поиск любой игры или консоли с любой страницы.</strong>
        Под вашим именем на боковой панели теперь есть поле поиска. Введите
        две или больше букв, чтобы увидеть подходящие консоли и до восьми
        подходящих игр, каждую с её консолью. Нажмите на результат или
        выберите его стрелками и нажмите Enter, чтобы открыть. «Показать все
        результаты» открывает «Библиотеку» с этим запросом. Нажмите /, чтобы
        перейти к полю, если на странице нет собственного поля поиска.</li>
      <li><strong>Удобнее перемещаться на телефоне или планшете.</strong> На
        узком экране панель сверху содержит кнопку меню и кнопку поиска,
        которая открывает меню с курсором уже в поле поиска. Панель снизу
        одним касанием ведёт на «Панель управления», в «Библиотеку»,
        «Системы» и «Достижения». Меню теперь непрозрачное, так что страница
        больше не просвечивает сквозь него. Коснитесь за его пределами или
        нажмите Escape, чтобы закрыть его. В окнах размером с планшет кнопки
        меню не было, и меню нельзя было открыть вовсе; теперь она есть.
        Панели вкладок и фильтров, которые остаются на экране при прокрутке,
        останавливаются прямо под верхней панелью, а не за ней.</li>
      <li><strong>«Настройки» &gt; «Эмуляторы» помещаются на экране
        телефона.</strong> Таблицы были шире телефона, так что кнопки
        «Редактировать» и «Настройки» оказывались за краем экрана. На
        телефоне каждая строка теперь — карточка с кнопками внутри.</li>
      <li><strong>Очистка изображений игры больше не оставляет лишних
        файлов.</strong> Если вы очищали изображения игры, пока RetroDB ещё
        повышал их резкость в фоне, он мог записать их обратно как файлы,
        которые не использует ни одна игра. Теперь он сначала проверяет это и
        пропускает их. Счётчик «Улучшение изображений» тоже сразу перестаёт
        учитывать очищенную игру.</li>
      <li><strong>Введённые вами названия сохраняются при скрапинге.</strong>
        Скрапинг, даже «Полный повторный скрапинг», раньше заменял название,
        введённое в окне редактирования, названием от скрапера. Теперь
        изменённое вами название сохраняется. Это показывает новый флажок
        «Сохранять это название при скрапинге» под названием; снимите его,
        чтобы скраперы снова могли переименовать игру. Кнопка «Сбросить» на
        странице игры тоже это разрешает.</li>
      <li><strong>Официальные названия ваших игр, проверенные
        вами.</strong> В «Инструментах ROM» появилась новая страница
        «Официальные названия». Нажмите «Спросить ИИ» для одной системы или
        для всех, и ИИ предложит полное официальное название каждой игры, под
        которым она вышла в регионе её ROM, так что японский ROM Mega Man
        становится Rockman. Вы видите старое и новое название рядом,
        отмечаете нужные и принимаете их. Ничего не меняется, пока вы этого
        не сделаете. Старое название сохраняется как альтернативное, а
        принятое название сохраняется при скрапинге. Отклонённое название
        больше не предлагается. Нужен поставщик ИИ в «Настройки» &gt;
        «Скрапинг».</li>
      <li><strong>Игры, у которых указан только год, можно редактировать, и
        год сохраняется.</strong> У многих игр указан только год, например
        1985. На странице игры окно редактирования отказывалось их сохранять.
        В окне редактирования «Библиотеки» сохранение стирало год. Теперь оба
        окна принимают год, год и месяц или полную дату.</li>
    </ul>
