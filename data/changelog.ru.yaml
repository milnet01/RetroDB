- version: 4.0.0
  date: '2026-11-10'
  tags:
  - type: fix
    label: 'Фильтры Библиотеки теперь сравнивают значения целиком. Жанр «Экшен» больше не показывает также игры «Экшен-приключение», поэтому результат совпадает с числом рядом. Списки тегов на странице игры и «Похожие игры» работают так же'
  - type: security
    label: 'Настройки → Мой профиль больше не отправляет на страницу сохранённый ключ RetroAchievements, токен PSN или ключ Steam. Каждое поле показывает только последние четыре символа, как уже делали ключи на вкладке «Скрапинг». Если сохранить, не вводя заново, сохранённый ключ останется, а кнопка PSN «Сохранить и проверить подключение» проверяет сохранённый токен'
  - type: fix
    label: '«Просмотр журнала» больше не открывается с сообщением «Недопустимый файл журнала». В списке были вспомогательные журналы, которые он не показывал, и один из них открывался первым; теперь в списке только журналы, которые можно открыть'
  - type: fix
    label: 'Вкладка PSN в «Импорт игр» теперь отправляет за токеном NPSSO в Настройки → Мой профиль, где находится это поле, а не в Настройки → API-ключи, и её статус подключения теперь можно перевести'
  - type: fix
    label: 'При входе как наблюдатель страницы больше не запрашивают у сервера данные только для администратора, которые им всё равно не выдадут, поэтому журнал сервера больше не заполняется отклонёнными запросами'
  - type: security
    label: 'Названия, пришедшие извне RetroDB (собранные данные, имена файлов и папок, ответы онлайн-сервисов), теперь всегда показываются как обычный текст: на странице игры, в Настройках, Отчётах, инструментах ROM, на страницах трофеев и в других местах. Страницы также выполняют только действия своих собственных кнопок, поэтому специально подобранное название не может заставить страницу что-то сделать, а ссылка «вернуться к» в уведомлении о прогрессе больше не может вести на другой сайт'
  - type: enhancement
    label: 'У массовых скрапингов в очереди появилась кнопка «Изменить порядок». Она открывает Менеджер очереди, где ожидающий скрапинг можно запустить раньше, позже или поменять местами с тем, что идёт сейчас. Каждое уведомление в очереди после изменения сохраняет свой номер места'
  - type: fix
    label: 'Прогресс задач больше не зависает и не повторяется. Проверка или конвертация CHD, завершившаяся сбоем, теперь заканчивается с указанием причины; «Отмена» возвращает странице её кнопки; об отказе в отмене, паузе или удалении теперь сообщается; «завершено» больше не всплывает снова через час; а кнопка синхронизации на странице достижений возвращается, когда синхронизация закончилась'
  - type: fix
    label: 'Сохранение совпадения HowLongToBeat на странице игры больше не стирает ссылку HLTB и число игроков, а неудачное сохранение можно повторить. Быстрое редактирование больше не показывает каждое сохранённое совпадение как «Совпадение 100%». Теги фильтров в Библиотеке показывают название системы вместо её номера, а поиск по мере ввода работает на страницах списков и в сравнении'
  - type: fix
    label: 'Каждая учётная запись может сменить свой пароль в Настройки → Мой профиль, а администратор может сбросить пароль любому. Папки эмуляторов теперь работают в Windows. Панель управления больше не сообщает редакторам и зрителям, что их API не в сети, а «Игры без обложки» открывает Библиотеку только с этими играми. Менеджер паролей теперь может заполнить поле входа'
  - type: fix
    label: 'Инструменты ROM: Проверка CHD ставит каждый значок «Корректно» или «Некорректно» на нужный файл; просмотр журнала снова показывает имена модулей и сообщает, если список файлов не загрузился; «Выбрать все» в Импорте игр импортирует только игры, которые показывает ваш фильтр; а «Сбросить» в Настройках ROM-инструментов восстанавливает собственную папку ROM этого компьютера'
  - type: fix
    label: 'Время разблокировки в Steam показывается как дата; полоса A-Z работает в Локальных трофеях; режим выбора PSN продолжает работать для игр, которые подгружаются при прокрутке; зрители больше не видят кнопок синхронизации и переименования, которыми не могут пользоваться; пакетное переименование пропускает файл, переименованный после сканирования; а Аналитика может копировать в обычной HTTP-сети и экспортирует числа как числа'
  - type: fix
    label: 'В окне подтверждения Enter на «Отмена» или × теперь отменяет, а не подтверждает. Окно, открытое кнопкой ОК, больше не исчезает, а Tab продолжает работать после закрытия списка сочетаний клавиш или окна прогресса'
  - type: enhancement
    label: 'Многие элементы, которые работали только мышью, теперь работают с клавиатуры (Tab, затем Enter или пробел): профили при входе, результаты поиска в сравнении, теги и их кнопки «Изменить» и «Удалить», карточки игр в достижениях, сеансы журнала, выбор темы и аватара, изображения Музея, ×, убирающий жанр или фильтр, папки при настройке, флажки источников сбора данных и импорт CLZ. Переключатели вкл./выкл. теперь показывают рамку клавиатуры'
  - type: performance
    label: 'Инструмент удаления фона в Музее больше не остаётся в памяти. Он вырезал фото контроллеров из фона с помощью модели AI, которая после первого использования занимала больше 2 GB, а во время обработки фото — до 9 GB, пока RetroDB не перезапускали. Теперь он работает во вспомогательной программе, которая запускается по необходимости и закрывается через две минуты после последнего фото, освобождая всю эту память'
    en: 'The Museum''s background remover no longer stays in memory. It cut controller photos out of their background with an AI model that took over 2 GB once used, and up to about 9 GB during a photo, until RetroDB restarted. It now runs in a helper that starts when needed and closes two minutes after its last photo, giving all of that memory back'
  - type: feature
    label: 'Для импорта из Xbox больше не нужна учётная запись Microsoft Azure. Теперь каждый вставляет свой бесплатный ключ OpenXBL (с xbl.io) в разделе «Настройки → Мой профиль», и импорт работает с любого компьютера в вашей сети. Импорт также пропускает приложения и игры только для телефона, относит игры для ПК к Windows, а не к Xbox One, правильно читает достижения Xbox 360 и не показывает дату у закрытого достижения. Бесплатный ключ даёт 150 запросов в час: большая синхронизация достижений, дойдя до лимита, останавливается, сообщает об этом и в следующий раз начинает с игр, до которых не дошла'
    en: 'Xbox import no longer needs a Microsoft Azure account. Each person now pastes their own free OpenXBL key (from xbl.io) under Settings → My Profile, and it works from any computer on your network. The import also leaves out apps and phone-only games, files PC games under Windows instead of Xbox One, reads Xbox 360 achievements the right way, and shows no date for a locked achievement. The free key allows 150 requests an hour: a big achievement sync that reaches it stops, says so, and next time starts with the games it had not reached'
  - type: enhancement
    label: Если вы запускаете Синхронизацию или Обновление RetroAchievements, пока идёт другая, новая теперь ждёт на сервере и стартует сама, когда предыдущая закончится. Это работает, даже если закрыть страницу или запустить задачу с другого устройства. На каждой странице виден один и тот же список ожидания с местом каждой задачи в очереди, а ✕ убирает задачу. После перезапуска сервера ожидающие задачи снова предлагаются на Панели
    en: A RetroAchievements Sync or Refresh you ask for while another one runs now waits on the server and starts by itself when that one finishes, even if you close the page or asked from another device. Every page shows the same waiting list with each job's place in line, and ✕ takes a job out. After a server restart, waiting jobs are offered back on the Dashboard
  - type: fix
    label: Кнопка «Обновить RA» на странице консоли снова работает. Она не указывала, какая это консоль, и сервер отвечал «Не найдено»
    en: The Refresh RA button on a console's page works again. It did not say which console, so the server answered "Not found"
  - type: fix
    label: Проверка названий ROM теперь считает каждую систему того типа, который указан на странице «Системы». Macintosh, ZX Spectrum Next, Coleco Adam и Thomson проверяются как компьютеры, а 3DS и PS Vita как портативные, а не как консоли. Тип, который вы задали на странице «Системы», теперь тоже учитывается
    en: The ROM naming check now treats each system as the kind the Systems page shows. Macintosh, ZX Spectrum Next, Coleco Adam and Thomson are checked as computers, and 3DS and PS Vita as handhelds, instead of as consoles. A type you set on the Systems page is now followed too
  - type: performance
    label: 'RetroDB теперь потребляет намного меньше памяти в простое. ИИ-апскейлер изображений загружается только во время работы, в отдельном вспомогательном процессе, который закрывается через две минуты после последней картинки: простаивающий сервер стал занимать меньше 100 МБ вместо примерно 1,4 ГБ. Если драйвер видеокарты даст сбой во время апскейла, остановится только этот процесс, но не сервер'
    en: RetroDB uses far less memory while it waits. The AI image upscaler now loads only while it is upscaling, in a helper that closes two minutes after its last picture; an idle server dropped from about 1.4 GB to under 100 MB. If the graphics driver crashes during an upscale, only the helper stops, never the server
  - type: performance
    label: Заполнение ИИ с веб-поиском Claude стоит дешевле. После каждого поиска Claude заново читает его результаты; теперь RetroDB просит Anthropic держать их наготове, и повторное чтение обходится в десять раз дешевле или ещё меньше
    en: AI Fill with Claude web search costs less. Claude reads the search results again after each search; RetroDB now asks Anthropic to keep them ready, and a re-read then costs a tenth of the price or less
  - type: fix
    label: 'Тексты на зулу и коса стали понятнее: исправлено 133 строки с неверным смыслом, например «Edition» было переведено как «Глава», а «должно быть текстом» — как «должно быть буквой». Каждое исправление подтверждено двумя отдельными проверками ИИ'
    en: 'Zulu and Xhosa read better: 133 lines that said the wrong thing are corrected, such as "Edition" shown as "Chapter" and "must be text" shown as "must be a letter". Each correction was agreed by two separate AI checks'
  - type: fix
    label: Если игра не запускается, сообщение теперь выводится на вашем языке и по-прежнему называет виноватый эмулятор, ядро или файл. Сбой внутри самого компьютера теперь показывает «Не удалось запустить» и название программы, а подробности записываются в журнал сервера, вместо необработанного системного текста. Если вход в RetroAchievements отклонён, причина от RetroAchievements показывается внутри переведённого предложения
    en: When a game will not start, the message is now in your language and still names the emulator, core or file at fault. A failure inside the computer itself now says "Could not start" and the program's name, with the details in the server log, instead of raw system text. A refused RetroAchievements sign-in shows RetroAchievements' own reason inside a translated sentence
  - type: fix
    label: Отмена скрапинга, синхронизации или задачи с изображениями, которая уже завершилась, теперь убирает зависшее окно прогресса. Если запустить уже работающую задачу, показывается настоящая причина, например «Скрапинг для SNES уже запущен», а не «Ошибка сети». Ошибки с изображениями контроллеров в Музее теперь объясняют, что пошло не так, а при отмене синхронизации RetroAchievements другого пользователя вы видите, что она чужая, а не делается вид, что она отменена
    en: Cancelling a scrape, sync or image job that has already finished now clears its stuck progress popup. Starting a job that is already running shows the real reason, such as "A scrape for SNES is already running", instead of "Network error". Controller image errors in the Museum now say what went wrong, and cancelling another user's RetroAchievements sync says it is theirs instead of pretending to cancel it
  - type: security
    label: Просмотр журналов теперь скрывает пароли и ключи и в старых файлах журнала. Журналы, записанные до того, как RetroDB научился скрывать некоторый пароль, например от ScreenScraper, показывали его открытым текстом при просмотре или скачивании
    en: The log viewer now hides passwords and keys in older log files too. Logs written before RetroDB learned to hide a particular password, such as ScreenScraper's, showed it in plain text when viewed or downloaded
  - type: security
    label: Сброс всех настроек к значениям по умолчанию теперь сохраняет папку с ROM и отметку о завершённой первоначальной настройке. Раньше после сброса снова открывались страницы первой настройки, которые работают без входа, пока администратор не запускал настройку заново
    en: Resetting all settings to their defaults now keeps your ROM folder and the fact that setup is done. Before, a reset reopened the first-time setup pages, which work without signing in, until an admin ran setup again
  - type: feature
    label: Аркадные игры снова могут получать RetroAchievements. RetroDB теперь связывает аркадную игру, только если RetroAchievements знает её точное имя файла, например sf2 для Street Fighter II, поэтому он больше не угадывает по названиям и не связывает не ту игру. Ваши аркадные игры будут связаны при следующем обновлении данных RetroAchievements или при их скрапинге
    en: Arcade games can earn RetroAchievements again. RetroDB now links an arcade game only when RetroAchievements knows its exact file name, such as sf2 for Street Fighter II, so it no longer guesses from titles and links the wrong game. Your arcade games link the next time their RetroAchievements data is refreshed or they are scraped
  - type: fix
    label: Синхронизация трофеев PlayStation теперь исправляет ошибочные связи с играми, созданные ранее, например когда много игр было связано с посторонней игрой «D». Связь, заданная вами вручную, при синхронизации никогда не меняется. Следующая синхронизация заново проверит все старые связи, поэтому некоторые неточные совпадения могут отвязаться; свяжите их снова вручную
    en: PlayStation trophy sync now corrects game links it made wrongly before, such as many games linked to an unrelated game called "D". A link you set yourself is never changed by a sync. The next sync checks all older links again, so a few near matches may come unlinked; link those again by hand
  - type: fix
    label: Перенос ожидающего массового скрапинга вперёд работающего больше не добавляет последнюю игру старого скрапинга к счётчикам нового. Нажатие «Скрапить все» в списке желаемого, когда скрапинг уже идёт, теперь сообщает об этом, а не заявляет, что он запущен
    en: Moving a waiting bulk scrape ahead of a running one no longer adds the old scrape's last game to the new one's counts. Clicking "Scrape all" on the wishlist while one is already running now says so, instead of claiming it started
  - type: accessibility
    label: 'При работе со скринридером кнопка «выполняется» теперь произносит «1 игра выполняется» только при изменении числа, а не зачитывает просто число каждые несколько секунд. Её список открывается как именованное окно с курсором внутри, кнопки «Завершить» и «Следующий диск» сообщают, к какой игре относятся, а после «Завершить» курсор возвращается в разумное место. Каждая карточка игры в библиотеке теперь открывается с клавиатуры через название, а её кнопки фильтра поясняют, что они фильтруют, например «Фильтр по полю Разработчик: Konami»'
    en: 'With a screen reader, the "running" button now says "1 game running" only when the count changes, instead of reading a bare number every few seconds. Its list opens as a named window with the cursor inside, its Kill and Next disk buttons say which game they act on, and after Kill the cursor returns to a sensible place. Each game card in the library now opens with the keyboard from its title, and its filter buttons say what they filter, such as "Filter by Developer: Konami"'
  - type: feature
    label: Теперь каждый участник может добавить свой ключ Steam и Steam ID в разделе Настройки → Мой профиль, а также импортировать свою библиотеку Steam и достижения. Раньше это мог только администратор
    en: Every member can now add their own Steam key and Steam ID under Settings → My Profile, and import their own Steam library and achievements. Until now only an admin could
  - type: fix
    label: Сохранение данных игры больше не заменяет пустое число игроков на 1 и не помечает возрастные рейтинги, определённые RetroDB, как введённые вами. Заполнение ИИ сохраняет игру, отмеченную вами как Эксклюзив, и любые ваши изменения игры, пока она ждёт ответа ИИ. История скрапинга теперь показывает только те данные, которые он действительно сохранил
    en: Saving a game's details no longer sets an empty player count to 1, and no longer marks the age ratings RetroDB worked out for you as typed by you. AI Fill keeps a game you marked Exclusive, and keeps any change you make to a game while it is waiting for the AI's answer. A scrape's history now lists only the details it actually saved
  - type: fix
    label: Просмотр скриншотов больше не останавливается на полпути, если один сохранённый скриншот слишком велик для открытия; он считает такую картинку нечитаемой и продолжает. Оглавление страницы справки теперь ссылается на Эмуляторы и раздел «Играть», а заметки разработчика о входе, фоновых задачах, скрапинге, изображениях, обновлениях и ответах с ошибками теперь описывают то, что программа делает на самом деле
    en: Screenshot Review no longer stops halfway when one stored screenshot is far too large to open; it counts that picture as unreadable and carries on. The help page's contents list now links to Emulators and Playing, and the developer notes on sign-in, background jobs, scraping, pictures, updates and error replies now say what the program really does
  - type: fix
    label: Редактор, запустивший сканирование в ROM Tools, теперь может приостановить, возобновить или отменить его; чужие сканирования по-прежнему останавливает только администратор. Теги и списки отклоняют отсутствующее имя или неверный цвет с понятным сообщением вместо страницы ошибки, а переименование игры в списке желаемого в название другой игры, которую вы уже желаете, отклоняется, как и её добавление. Очистка данных RA теперь также забывает, получает ли ваша копия достижения. Трофей, который RetroDB больше не предлагает, перестаёт учитываться в вашем рейтинге коллекционера. ROM-пути Windows теперь сопоставляются с играми RetroAchievements по имени файла
    en: An editor who starts a ROM Tools scan can now pause, resume or cancel it; other people's scans stay an admin's to stop. Tags and lists refuse a missing name or a bad colour with a clear message instead of an error page, and renaming a wishlist game onto another one you already wish for is refused, as adding it is. Clear RA Data now also forgets whether your copy earns achievements. A trophy RetroDB no longer offers stops counting toward your collector rank. Windows ROM paths now match RetroAchievements games by file name
  - type: fix
    label: Исправления обслуживания. Многодисковый архив, который не удалось распаковать, больше не оставляет недоделанную папку, блокирующую все повторные попытки. Подсчёт хранилища теперь учитывает все файлы внутри папки игры PS3. Очистка данных скрапинга удаляет изображения только по вашему запросу. Сканирование библиотеки, встретившее игру, только что добавленную другим сканированием, продолжает обработку остальных игр этой консоли
    en: Maintenance fixes. A multi-disc archive that fails to unpack no longer leaves a half-made folder behind that blocks every retry. Calculate Storage now counts every file inside a PS3 game folder. Clear Scraped Data deletes pictures only when you ask it to. A library scan that meets a game another scan has just added carries on with the rest of that console's games
  - type: fix
    label: Восстановление из резервной копии стало безопаснее. Теперь данные записываются в базу библиотеки так, как ожидает сама база, поэтому часть RetroDB, у которой она открыта, видит восстановленные данные, а не рискует повредить их. Удаление игры теперь также удаляет её изображения коробки, ожидающее изображение и записи настроек эмулятора, так что новая игра не сможет их унаследовать. Две настройки, сохранённые одновременно, больше не теряют одну из них
    en: Restoring a backup is safer. It is now written into the library database the way the database itself expects, so a part of RetroDB that has it open sees the restored data instead of risking damage. Deleting a game now also deletes its box pictures and its waiting picture and emulator-setting entries, so a new game can never inherit them. Two settings saved at the same moment no longer lose one of them
  - type: fix
    label: Исправления изображений. GIF больше не прогоняются через апскейлер зря. Модель апскейлера проверяется по опубликованному отпечатку, а неудачная загрузка скачивается заново, а не отключает апскейл навсегда. Логотипы и изображения с прозрачными областями сохраняют прозрачность при увеличении. Преобразование в WebP теперь охватывает и задние обложки с логотипами и больше не отказывается обрабатывать большую библиотеку из-за ненужного запаса места. Две стороны файла коробки могут использовать одно изображение, а удаление коробки с повреждённой записью удаляет и её изображения
    en: Picture fixes. GIFs are no longer run through the upscaler only to be thrown away. The upscaler model is checked against its published fingerprint, and a bad download is fetched again instead of turning upscaling off for good. Logos and pictures with see-through parts keep their transparency when enlarged. Convert to WebP now takes back covers and logos too, and no longer refuses a large library for want of room it does not need. Two faces of a box file can share one picture, and removing a box with a damaged record removes its pictures
  - type: fix
    label: Импорт из CLZ, Steam, Xbox и PlayStation больше не считает одной игрой все названия, написанные только по-японски или другой нелатинской письменностью, и не добавляет игру без идентификатора. Предпросмотр CLZ больше не добавляет консоли до подтверждения импорта, и зритель, смотрящий библиотеку Steam, Xbox или PlayStation, их тоже не добавляет. О игре Steam, удалённой из магазина, спрашивают один раз, а не при каждой синхронизации
    en: Imports from CLZ, Steam, Xbox and PlayStation no longer treat every title written only in Japanese or another non-Latin script as the same game, and no longer add a game with no id. The CLZ preview no longer adds consoles before you confirm the import, and a viewer looking at a Steam, Xbox or PlayStation library no longer adds them either. A Steam game removed from the store is asked about once, not on every sync
  - type: fix
    label: Аналитика теперь группирует гораздо больше консолей по производителю вместо «Другое», а список «Недавно скрапленные» на панели показывает игру, скрапленную повторно, а не только недавно добавленные игры
    en: Analytics now groups many more consoles under their maker instead of "Other", and the dashboard's Recently Scraped list shows a game you scraped again, not only newly added games
  - type: fix
    label: Изображения контроллеров, добавленные вами в Музее, сохраняются при обновлении автономной версии. Когда онлайн-сервис приостанавливается из-за лимита, время следующего обращения к нему показывается в вашем часовом поясе
    en: Controller pictures you add in the Museum are kept when the standalone version updates. When an online service pauses at its limit, the time it will be asked again is shown in your own time zone
  - type: fix
    label: Бонусный диск больше нельзя связать с самим собой или с другим бонусным диском, а автосвязывание больше не связывает диск с тем, который в том же запуске помечает как бонусный
    en: A bonus disc can no longer be linked to itself or to another bonus disc, and Auto-link no longer links a disc to one it marks as a bonus disc in the same run
  - type: fix
    label: Страницы библиотеки и консолей больше не считают аркадные BIOS-файлы играми ни в итогах, ни в буквенной панели. Похожие игры и список, открывающийся по клику на жанр или издателя на странице игры, больше не показывают региональные версии самой игры, бонусные диски и BIOS-файлы
    en: The Library and console pages no longer count arcade BIOS files as games, in their totals or the letter bar. Similar games, and the list you get by clicking a genre or publisher on a game's page, no longer show the game's own regional versions, bonus discs or BIOS files
  - type: fix
    label: Выбор всех теперь сообщает об этом, когда очень большой список обрезан, а не молча выбирает только его часть
    en: Select all now says so when a very large list is cut short, instead of quietly selecting only part of it
  - type: fix
    label: Карточки библиотеки теперь обновляются при изменении вашего прогресса по достижениям или трофеям, а также когда игра становится доступной для запуска или перестаёт быть таковой
    en: Library cards now update when your achievement or trophy progress changes, and when a game becomes playable or stops being playable
  - type: fix
    label: Массовое редактирование больше не может изменить не те игры при неверном выборе, а неудавшееся массовое редактирование больше не помечает игры как изменённые вами
    en: Bulk edit can no longer change the wrong games when it is sent a bad selection, and a bulk edit that fails no longer marks the games as edited by you
  - type: fix
    label: Совпадение HowLongToBeat всего на 1% больше не показывается как 100%, а страница, которая не загрузилась, показывает страницу ошибки, а не сырой текст ошибки
    en: A HowLongToBeat match that is only a 1% fit is no longer shown as a 100% match, and a page that fails to load shows the error page instead of the raw error text
  - type: security
    label: Смена пароля или его сброс администратором теперь завершает сеансы этой учётной записи на всех других устройствах. Поэтому после этого обновления всем придётся войти ещё раз. Страница первоначальной настройки также получает ту же защиту от других сайтов, что и все остальные страницы
    en: Changing your password, or an admin resetting it, now signs that account out on every other device. Because of this, everyone signs in once more after this update. The first-run setup page also gets the same protection against other websites as every other page
  - type: fix
    label: Изображение, отклонённое как аватар, больше не удаляет ваш прежний аватар
    en: A picture that is refused as your avatar no longer deletes the avatar you had
  - type: fix
    label: Скрапинг стал бережнее к онлайн-сервисам. Сервис, который постоянно даёт сбои, на время пропускается при заполнении пробелов, как это уже было при поиске, а запросы игр к ScreenScraper теперь тоже учитывают его суточные лимиты
    en: Scrapes are gentler on the online services. A service that keeps failing is skipped for a while when filling gaps, as it already was in searches, and ScreenScraper game lookups now respect its daily limits too
  - type: fix
    label: Скрапинг больше не завершается ошибкой на игре с неизвестным годом выпуска, например «TBA», а игра, указанная для регионов вне вашего списка, например «Бразилия, Корея», сохраняет свой регион, а не заменяется вашим по умолчанию
    en: A scrape no longer fails on a game whose release year is unknown, such as "TBA", and a game listed for regions outside your list, such as "Brazil, Korea", keeps its region instead of becoming your default
  - type: fix
    label: Папки ES-DE, записанные как ~/, теперь работают, а очень большой файл ES-DE больше не копируется. Предлагаемые региональные версии больше не объединяют две игры, которые вы отметили как не являющиеся версиями друг друга
    en: ES-DE folders written as ~/ now work, and a very large ES-DE file is no longer copied. Suggested regional versions never put back together two games you said are not versions of each other
  - type: security
    label: RetroDB отклоняет ещё несколько частных сетевых адресов при загрузке изображений из интернета и корректно следует перенаправлению веб-адреса
    en: RetroDB refuses a few more private network addresses when fetching pictures from the web, and follows a web address's redirect correctly
  - type: fix
    label: Последние экраны, всё ещё на английском, теперь тоже следуют вашему языку, включая мастер настройки, Теги, Списки, Сравнение игр, настройки ROM Tools, очередь массового скрапинга, список прерванных задач на панели, подписи карточек библиотеки и многие сообщения об ошибках
    en: The last screens still in English now follow your language too, including the setup wizard, Tags, Lists, Compare Games, ROM Tools settings, the bulk scrape queue, the dashboard's interrupted-jobs list, the library card labels and many error messages
  - type: security
    label: Название системы с веб-кодом больше не может выполнить его в окне очереди массового скрапинга
    en: A system name holding web code can no longer run it in the bulk scrape queue window
  - type: accessibility
    label: Где бы вы ни были на странице, положение клавиатуры теперь отмечено жирным кольцом цвета вашей темы на каждой кнопке, поле и ссылке. Раньше многие элементы показывали лишь тонкую линию, такую же, как при наведении мыши
    en: Wherever you are on a page, the keyboard's place is now marked with a bold ring in your theme's colour, on every button, box and link. Before, many controls showed only a faint line, the same as when the mouse passed over them
  - type: accessibility
    label: Ссылки Жанр, Серия, Разработчик и Издатель на карточках библиотеки теперь работают с клавиатуры. Кнопка «выполняется» для запущенных игр тоже открывается с клавиатуры, а Esc или щелчок в другом месте закрывает её список
    en: The Genre, Series, Developer and Publisher links on library cards now work from the keyboard. The "running" button for games in play opens from the keyboard too, and Esc or a click elsewhere closes its list
  - type: accessibility
    label: Скринридеры теперь называют каждый цвет тега и сообщают, какой выбран, а изображения трофеев читают как Платина, Золото, Серебро и Бронза, а не отдельными буквами. Пока игра запускается, Tab больше не уходит за экран запуска
    en: Screen readers now name each tag colour and say which one is chosen, and read trophy pictures as Platinum, Gold, Silver and Bronze instead of single letters. While a game starts, Tab no longer moves behind the starting screen
  - type: fix
    label: Если обновление останавливается до начала замены файлов, RetroDB теперь снова запускает прежнюю версию, а не остаётся закрытым
    en: If an update stops before it starts swapping files, RetroDB now starts the version you had again, instead of staying closed
  - type: fix
    label: Двойное нажатие «Играть» больше не может запустить две игры во встроенном плеере. Ожидание загрузки ядра теперь прекращается через некоторое время или когда RetroDB перестаёт отвечать, а не длится вечно, а вопрос «уже запущено» использует собственное диалоговое окно RetroDB
    en: Pressing Play twice at once can no longer start two games on the built-in player. Waiting for a core download now gives up after a while, or when RetroDB stops answering, instead of waiting forever, and the "already running" question uses RetroDB's own dialog
  - type: fix
    label: Читы, которые вы включаете или выключаете во время игры, сохраняются для нужной игры и никогда не берутся у другой игры с таким же именем файла. Проблема с читами никогда не мешает запуску игры
    en: Cheats you switch on or off during play are kept for the right game, never taken from another game whose file has the same name. A cheat problem never stops a game starting
  - type: fix
    label: RetroDB записывает файл настроек эмулятора безопаснее. Файл настроек, являющийся ссылкой, остаётся ссылкой, сохраняет права доступа и нечитаемые символы, а неудачное сохранение не оставляет лишних файлов
    en: RetroDB writes an emulator's settings file more safely. A settings file that is a link stays a link, keeps its permissions, and keeps letters it cannot read, and a failed save leaves no stray file behind
  - type: fix
    label: Массовый скрапинг, который вы сдвинули вниз очереди, поменяли с другим или возобновили, пока идёт другой, больше не теряется при перезапуске RetroDB; панель предлагает его с того места, где он остановился. Замещённый скрапинг больше не продолжает работать рядом с новым, а два быстрых нажатия «Возобновить» запускают задачу один раз
    en: A bulk scrape you move down the queue, swap with another or resume while one runs is no longer lost when RetroDB restarts; the dashboard offers it, from where it stopped. A swapped-out scrape no longer keeps running beside the new one, and two quick clicks on Resume start a job once
  - type: fix
    label: Ошибка одной игры, например обрыв сети, больше не завершает весь запуск Заполнения ИИ или исправления коробок и регионов инструкций; эта игра считается неудачной, а остальные продолжаются. Остановка RetroDB теперь также корректно останавливает загрузки ядер
    en: One game's error, such as the network dropping, no longer ends a whole AI Fill run or a Fix Box and Manual Regions run; that game counts as failed and the rest go on. Stopping RetroDB now also stops core downloads cleanly
  - type: fix
    label: Элементы списка желаемого больше не зависают на «скрапинге» после ошибки или перезапуска, а два запуска «Скрапить всё» для одного списка желаемого больше не идут одновременно
    en: Wishlist items no longer stay on "scraping" forever after an error or a restart, and two Scrape All runs for the same wishlist no longer run at once
  - type: fix
    label: Скрипт или вторая копия RetroDB при запуске больше не помечает задачи работающего сервера как прерванные, а две копии, запущенные одновременно, больше не могут откатить версию базы данных
    en: A script or a second copy of RetroDB starting up no longer marks the running server's jobs as interrupted, and two copies starting at once can no longer set the database back a version
  - type: fix
    label: Запуск синхронизации PlayStation больше не заставляет индикаторы выполнения у всех ждать, пока идёт вход в Sony. Ежедневное поддержание входа в PlayStation теперь обновляет вход только ближе к концу 10 дней, а не каждый день
    en: Starting a PlayStation sync no longer makes everyone's progress bars wait while it signs in to Sony. The daily PlayStation keep-alive now renews a sign-in only near the end of its 10 days, instead of every day
  - type: fix
    label: Скрапинг больше не перезаписывает изменение, внесённое вами во время его работы, и больше не очищает жанр, режим или вид, для которых у него нет названия. Сохранённое число игроков больше не меняется под режимы игры
    en: A scrape no longer writes over a change you make while it runs, and no longer empties a genre, mode or view it has no name for. It no longer changes a stored player count to match the game's modes
  - type: fix
    label: Заполнение ИИ больше не меняет то, что вы ввели сами, например издателя или жанр, исправленные вручную; оно исправляет только скрапленные значения. Оно больше не сообщает об изменении значения, если оно лишь записано иначе, например 4 игрока как «1-4» или те же жанры в другом порядке
    en: AI Fill no longer changes what you typed yourself, such as a publisher or genre you corrected by hand; it corrects only scraped values. It no longer reports a value as changed when it only wrote it differently, such as 4 players as "1-4" or the same genres in another order
  - type: fix
    label: Контроллер, который вы указали для игры, сохраняется; контроллер консоли по умолчанию теперь заменяет только скрапленные значения и значения от ИИ. Возрастной рейтинг, преобразованный из предположения ИИ другой системы, теперь тоже помечается как предположение
    en: A controller you type for a game is kept; the console's default controller now replaces only scraped and AI values. An age rating converted from another board's AI guess is now marked as a guess too
  - type: fix
    label: Сохранение окна редактирования игры больше не очищает поля, которых в окне нет. Сброс на странице игры теперь очищает всё, что обещает, включая вид, издание и другие названия, удаляет картинки и видео игры, если их не использует другая игра, и сразу обновляет фильтры библиотеки
    en: Saving a game's edit window no longer empties fields the window does not show. Reset on a game's page now clears everything it says it does, including the view, edition and other names, deletes the game's pictures and videos unless another game uses them, and updates the library filters straight away
  - type: fix
    label: Очистка скрапленных данных теперь также очищает вид, 2D или 3D, и структуру игры. Импорт игры из CLZ с одним годом сохраняет только год, а не 1 января
    en: Clear Scraped Data now also clears the view, 2D or 3D, and game structure. A CLZ import of a game with only a year keeps just the year, not 1 January
  - type: security
    label: Синхронизация Steam больше не берёт ключ Steam из настроек для всех членов семьи. Член семьи без собственного ключа Steam получал библиотеку и достижения Steam администратора в своей учётной записи. Ключ в настройках теперь работает только для администраторов
    en: Steam sync no longer borrows the Steam key from Settings for every household member. A member with no Steam key of their own was getting the admin's Steam library and achievements under their account. The key in Settings now serves admins only
  - type: fix
    label: Поиск How Long to Beat для многих игр теперь сохраняет время, в котором уверен. Раньше каждое надёжное совпадение завершалось ошибкой, и ничего не сохранялось. Обновление RetroAchievements теперь также сверяет файл каждой игры со списком RetroAchievements, как и скрапинг, поэтому игра привязывается к точной версии, которая у вас есть
    en: How Long to Beat's lookup for many games now saves the times it is sure of. Before, every sure match failed and nothing was saved. RetroAchievements Refresh now also checks each game's file against RetroAchievements' list, as a scrape does, so a game is linked to the exact version you have
  - type: fix
    label: Сообщение о завершении фоновой задачи снова показывается, а окно прогресса задачи замечает, когда сервер подхватывает задачу после перезапуска. Раньше ни то, ни другое не появлялось
    en: The message that a background job has finished shows again, and a job's progress box notices when the server picks the job up after a restart. Before, neither ever appeared
  - type: fix
    label: 'Трофеи PlayStation: игра, привязанная вручную, остаётся привязанной после полной синхронизации, а синхронизация больше не привязывает игру к её продолжению, например «Doom» к «Doom Eternal». Импорт игр PlayStation теперь привязывает игру, уже имеющуюся в библиотеке, как это делают импорты Steam и Xbox, поэтому её трофеи отображаются'
    en: 'PlayStation trophies: a game you linked by hand stays linked after a full sync, and a sync no longer links a game to its sequel, such as "Doom" to "Doom Eternal". Importing PlayStation games now links a game already in your library, as Steam and Xbox imports do, so its trophies show on it'
  - type: fix
    label: Xbox больше не показывает ваш gamertag как Unknown после автоматического обновления входа, а медленное или неудачное соединение больше не выводит вас из Xbox. Это происходит, только если Microsoft отклоняет вход
    en: Xbox no longer shows your gamertag as Unknown after its sign-in renews itself, and a slow or failed connection no longer signs you out of Xbox. Only Microsoft refusing the sign-in does that
  - type: fix
    label: Теперь у двух людей может быть тег с одинаковым названием; раньше второй вызывал ошибку. Любой вошедший пользователь теперь может пересканировать свои трофеи RPCS3; раньше это мог только администратор, а остальные видели старые трофеи до перезапуска RetroDB
    en: Two people can now each have a tag of the same name; before, the second one failed with an error. Any signed-in user can now rescan their own RPCS3 trophies; before, only an admin could, and everyone else saw old trophies until RetroDB restarted
  - type: security
    label: Ваши входы остаются приватными. Резервные копии базы данных больше не могут читать другие учётные записи на компьютере, а неудачное резервное копирование больше не удаляет предыдущую копию. Удаление или отключение пользователя также выводит его из RetroAchievements в DuckStation и PCSX2. Вход в RetroAchievements, сохранённый из собственного меню плеера, больше не переходит к следующему игроку. Журналы и сохранённые ошибки задач скрывают токены RetroAchievements, ошибка PlayStation другого члена семьи показывается только ему, а старые файлы входа PlayStation и Xbox в открытом виде удаляются
    en: Your sign-ins stay private. Database backups can no longer be read by other accounts on the computer, and a failed backup no longer deletes the one before it. Deleting or switching off a user also signs them out of RetroAchievements in DuckStation and PCSX2. A RetroAchievements sign-in saved from the player's own menu no longer carries over to the next person who plays. Logs and saved job errors hide RetroAchievements tokens, another member's PlayStation error is shown only to them, and old plain-text PlayStation and Xbox sign-in files are removed
  - type: fix
    label: Собственные проверки RetroDB больше не могут затронуть вашу библиотеку во время работы. Они всегда используют временную копию базы данных, картинок и настроек и отказываются запускаться, если что-либо из этого указывает на ваши настоящие файлы
    en: RetroDB's own checks can no longer touch your library while they run. They always use a throwaway copy of the database, pictures and settings, and refuse to start if any of them points at your real files
  - type: fix
    label: Очистка потерянных файлов больше не удаляет картинки списка желаемого. Открытие игры больше не заставляет её забывать скриншоты, которые она не может найти. Раньше при отключённом диске с картинками каждая открытая игра теряла весь список скриншотов; теперь список сохраняется, а отсутствующая картинка просто скрывается
    en: Clean orphaned files no longer deletes your wishlist's pictures. Opening a game no longer makes it forget screenshots it cannot find. Before, with the picture drive unplugged, every game you opened lost its whole screenshot list; now the list is kept, and a missing picture is only hidden
  - type: fix
    label: Загрузка видео или инструкции, прервавшаяся на середине, больше не портит копию, которая уже была у игры, а неудачная загрузка не оставляет скрытый недокачанный файл в папке медиа. Фоновое увеличение картинок больше не заменяет новую картинку, скачанную в это время, старой. Преобразование в WebP сохраняет ссылку на картинку у всех игр, которые её делят, и никогда не трогает файлы вне папок с картинками
    en: A video or manual download that fails part-way no longer damages the copy the game already had, and a failed download no longer leaves a hidden half-file in the media folder. The background upscaler no longer saves an old picture over a newer one downloaded meanwhile. Convert to WebP keeps every game that shares a picture pointing at it, and never touches a file outside the picture folders
  - type: fix
    label: Удаление игры или элемента списка желаемого теперь удаляет также его картинки, видео и инструкции, но сохраняет то, что ещё использует другая игра или элемент списка желаемого. Сохранённые картинки снова доступны для чтения другим учётным записям на компьютере, а изменение размера картинок считает картинку, которую не удалось сохранить, неудачной, а не готовой
    en: Deleting a game or a wishlist item now deletes its pictures, videos and manuals too, but keeps any another game or wishlist item still uses. Saved pictures can be read by other accounts on the computer again, and Resize Images counts a picture it could not save as failed, not as done
  - type: fix
    label: Поиск дубликатов больше не предлагает к удалению рабочий файл. При поиске по имени он больше не считает файлы .cue и .bin игры копиями друг друга. Он никогда не предлагает файл дорожки диска, который могут делить две версии игры. Он не удалит диск, указанный в плейлисте. Игра, файл которой вы удаляете, теперь переходит на сохраняемую копию, поэтому остаётся в библиотеке
    en: Duplicate Finder no longer offers a working file for deletion. Looking by name, it no longer calls a game's .cue and .bin copies of each other. It never offers a disc's track file, which two versions of a game can share. It will not delete a disc that a playlist lists. A game whose file you delete now moves to the copy you keep, so it stays in the library
  - type: fix
    label: Организация многодисковых игр больше не перезаписывает существующий плейлист или файл, уже лежащий в папке игры; она останавливается и сообщает, какой именно. Создаваемый плейлист перечисляет .cue каждого диска, а не файлы дорожек. Игры, файлы которых она перемещает, теперь следуют за ними в папку, поэтому очистка отсутствующих ROM больше не удаляет их
    en: Organize Multi-Disc no longer writes over an existing playlist or a file already in the game's folder; it stops and says which. The playlist it makes lists each disc's .cue, not its track files. Games whose files it moves now follow them into the folder, so Clean missing ROMs no longer removes them
  - type: fix
    label: Преобразование в CHD с параметром «удалить оригиналы» теперь удаляет и файлы дорожек диска, но сохраняет дорожку, которую ещё использует другой .cue. Игра и любой плейлист, где был старый диск, теперь указывают на новый .chd. Переименование файла игры теперь обновляет плейлист, в котором он указан, а файл дорожки, нужный .cue, переименовать нельзя. Удаление файлов из zip удаляет только выбранные файлы, даже если в имени есть [ или ]. Удаление дубликатов скриншотов удаляет только копии, найденные при сканировании, и всегда оставляет одну
    en: Converting to CHD with "delete originals" now deletes the disc's track files too, but keeps a track another .cue still uses. The game and any playlist that listed the old disc now point at the new .chd. Renaming a game's file now updates the playlist that lists it, and a track file a .cue needs cannot be renamed. Removing files from a zip removes only the files you picked, even when a name holds [ or ]. Screenshot Dedup deletes only the copies its scan found, and always keeps one
  - type: fix
    label: How Long to Beat на странице игры ищет то, что вы вводите. Раньше при ненайденном названии он искал по другим названиям игры и мог предложить другую игру, например фанатский ремейк. Другие названия он по-прежнему пробует, когда в поле стоит собственное название игры
    en: How Long to Beat on a game's page searches for what you type. Before, a title it could not find made it search the game's other names instead, and it could offer a different game, such as a fan remake. It still tries the other names when the box holds the game's own name
  - type: fix
    label: Шаги How Long to Beat в справочной инструкции соответствуют экрану. Раньше в них говорилось выбрать совпадение из списка; на странице показано одно совпадение с кнопками «Сохранить» и «Отмена». Справка по PlayStation больше не говорит, что вход действует около двух месяцев, так как RetroDB входит снова сама. Все 20 переведённых инструкций содержат оба изменения
    en: The help manual's How Long to Beat steps match the screen. They said to pick a match from a list; the page shows one match with Save and Cancel. The PlayStation help no longer says the sign-in lasts about two months, since RetroDB signs in again by itself. All 20 translated manuals carry both changes
  - type: fix
    label: Теперь каждая панель букв начинается с кнопки «Все». На страницах «Библиотека», консоли и «Трофеи PSN» выбор буквы показывает только игры на эту букву, а раньше не было кнопки, чтобы вернуть остальные. На других страницах достижений «Все» возвращает к первой игре
    en: Every letter bar now starts with an All button. On the Library, console and PSN Trophies pages, picking a letter shows only that letter's games, and before there was no button to bring the rest back. On the other achievement pages, All goes back to the first game
  - type: fix
    label: Новый токен входа PlayStation, вставленный в настройках, теперь используется сразу. Раньше RetroDB продолжала использовать старый вход, пока он не истечёт, а «Сохранить и проверить соединение» сообщало, что старый вход работает. Токен, отклонённый Sony, больше не заменяет рабочий
    en: A new PlayStation sign-in token you paste in Settings is now used straight away. Before, RetroDB kept using the old sign-in until it ran out, and Save & Test Connection reported that old sign-in as working. A token Sony refuses no longer replaces one that works
  - type: enhancement
    label: 'Вход PlayStation в настройках теперь проще поддерживать. Баннер больше не отсчитывает дни, в которые вам не нужно ничего делать, так как RetroDB входит снова сама; он краснеет, только когда Sony отклоняет сохранённый токен. Кнопка «Вставить сюда» больше не заставляет браузер запрашивать доступ к буферу обмена: она ставит курсор в поле для Ctrl+V. В шагах теперь сказано сначала выйти из PlayStation, когда вы заменяете ещё рабочий токен, а их сообщения можно переводить'
    en: 'The PlayStation sign-in in Settings is easier to keep going. The banner no longer counts down days you never had to act on, because RetroDB signs in again by itself; it turns red only when Sony refuses your saved token. The Paste here button no longer makes the browser ask to read your clipboard: it puts the cursor in the box for Ctrl+V. The steps now say to sign out of PlayStation first when you replace a token that still works, and their messages can be translated'
  - type: enhancement
    label: Всплывающие сообщения и окна с вопросами, например «Настройки сохранены» или «Удалить этот список?», теперь можно переводить на каждой странице. Раньше большинство из них оставались на английском независимо от выбранного языка
    en: Pop-up messages and question boxes, such as "Settings saved" or "Delete this list?", can now be translated on every page. Before, most of them stayed in English whatever language you chose
  - type: enhancement
    label: Сообщения о причине сбоя входа в PlayStation, например «Ваш NPSSO мог истечь», теперь можно переводить
    en: The messages that say why a PlayStation sign-in failed, such as "Your NPSSO may have expired", can now be translated
  - type: fix
    label: Справочная инструкция на каждом языке теперь соответствует английской. В неё добавлены «Поиск везде», «Сохранение названия», «Названия MAME» и обратная сторона коробки, а устаревшие абзацы обновлены
    en: The help manual in every language now matches the English one. It gains Search Anywhere, Keeping a Title, MAME Names and the back of the box, and older paragraphs that had fallen behind are up to date
  - type: fix
    label: В немецком, африкаans и испанском кнопка «Назад» на обложке игры теперь означает обратную сторону коробки, а не «вернуться назад»
    en: In German, Afrikaans and Spanish, the Back button on a game's cover now says the back of the box, not "go back"
  - type: feature
    label: Нажатие «Играть» теперь заполняет экран логотипом игры на фоне её картинки, пока игра запускается, или её названием крупными буквами, если логотипа нет. Оно исчезает само, когда открывается окно игры, или когда вы нажимаете Esc или щёлкаете мышью
    en: Pressing Play now fills the screen with the game's logo on its background picture while the game starts, or its name in large letters when it has no logo. It goes away by itself when the game's window opens, or when you press Esc or click
  - type: feature
    label: 'Вращаемая 3D-коробка теперь имеет настоящую форму кейса PS5: скруглённые углы и рёбра, приподнятый борт вокруг обложки, линию стыка двух половин и паз для пальца на открывающейся стороне. Для этого нужен файл коробки из версии Slipcase, которая записывает форму; импортируйте коробку заново. Остальные коробки выглядят как раньше'
    en: 'The turnable 3D box now has the real shape of a PS5 case: rounded corners and edges, the raised lip round the cover, the line where the two halves meet, and the finger slot in the opening side. It needs a box file from a Slipcase version that writes the shape; import the box again to get it. Other boxes look as before'
  - type: enhancement
    label: Обновление RetroAchievements перенесено из настроек на страницу RetroAchievements и теперь называется «Найти игры с достижениями». У каждой кнопки там теперь есть строка с пояснением, поэтому «Найти игры» и «Синхронизировать прогресс» легко отличить. Если игры ещё не привязаны, страница показывает администратору кнопку поиска, а не переходит на следующую вкладку
    en: Refresh RetroAchievements moved from Settings to the RetroAchievements page, and is now called Find Games with Achievements. Every button there now has a line saying what it does, so Find Games and Sync Progress are easy to tell apart. With no games linked yet, the page shows an admin the Find button instead of moving on to the next tab
  body: "<ul>\n  <li><strong>4.0 — последняя веб-версия RetroDB.</strong> Новые версии\n    будут настольным приложением для Windows, Linux и macOS, а также приложением для Android.\n    Они откроют вашу существующую библиотеку. Версия 4.0 останется доступной для\n    скачивания, и в ней будут только исправления безопасности и ошибок, из-за которых теряются данные.\n    Когда настольное приложение выйдет, ссылка на него появится в разделе Настройки → Обновления.</li>\n  <li><strong>Инструкция актуальна на всех языках.</strong>\n    Разделы, которые раньше были только в английской инструкции, теперь переведены.</li>\n</ul>\n"
  body_en: "<ul>\n  <li><strong>4.0 is the last web version of RetroDB.</strong> New versions\n    will be a desktop app for Windows, Linux and macOS, and an Android app.\n    They will open your existing library. Version 4.0 stays available to\n    download, and gets only security fixes and fixes for bugs that lose data.\n    Settings → Updates links to the desktop app when it is out.</li>\n  <li><strong>The help manual is up to date in every language.</strong>\n    Sections that were only in the English manual are now translated.</li>\n</ul>\n"
- version: 3.35.4
  date: '2026-11-03'
  tags:
  - type: fix
    label: Скриншот, который вы удалили из игры, теперь остаётся удалённым. Раньше при следующем скрапинге он мог вернуться из ES-DE или снова скачаться из онлайн-источника. Удаление лишней копии в инструменте «Дубликаты скриншотов» не в счёт, ведь картинка остаётся в одном экземпляре
  - type: feature
    label: 'У игр теперь есть логотип: при скрапинге он сохраняется из ES-DE, ScreenScraper, TheGamesDB, IGDB и Steam, а на странице игры показывается над названием или вместо отсутствующей коробки. Загрузить или удалить логотип можно в окне «Редактировать». Запустите массовый скрапинг с режимом «Заполнить пропущенное», чтобы добавить логотипы играм, которые вы скрапили раньше'
  - type: fix
    label: IGDB больше не подставляет логотип игры как фон страницы
  - type: feature
    label: 'У игр теперь есть задняя сторона коробки: при скрапинге она сохраняется из ES-DE, ScreenScraper и TheGamesDB, а кнопка «Обратная сторона» на обложке на странице игры показывает её. Нажмите на заднюю сторону, чтобы увеличить. Загрузить или удалить заднюю сторону можно в окне «Редактировать». Задние стороны заполняются при каждом скрапинге игры; режим «Заполнить пропущенное» не скрапит игру повторно только ради задней стороны'
  - type: fix
    label: Если у игры на TheGamesDB нет передней обложки, задняя сторона коробки больше не становится её обложкой
  - type: fix
    label: Если вы отключите скрапер в разделе «Настройки» во время массового скрапинга, счётчик ненайденных игр теперь верен начиная со следующей игры. Раньше игра могла считаться остановленной
  - type: enhancement
    label: В системе без настроенного эмулятора кнопка «Играть» серая. Наведите на неё курсор, чтобы узнать причину, или нажмите, чтобы увидеть окно о том, что эмулятор не настроен. Раньше рядом с кнопкой была строка текста
  body: "<ul>\n  <li><strong>У игр есть логотип.</strong> При скрапинге сохраняется логотип каждой игры, а на странице игры он показывается над названием или вместо отсутствующей коробки. Запустите массовый скрапинг с режимом «Заполнить пропущенное», чтобы добавить логотипы играм, которые вы скрапили раньше.</li>\n  <li><strong>У игр есть задняя сторона коробки.</strong> Кнопка «Обратная сторона» на обложке на странице игры показывает её, а по нажатию она увеличивается. Задние стороны заполняются при каждом скрапинге игры.</li>\n  <li><strong>Удалённый скриншот остаётся удалённым.</strong> Следующий скрапинг больше не возвращает его и не скачивает снова.</li>\n  <li><strong>«Играть» объясняет, почему не запускается.</strong> В системе без настроенного эмулятора кнопка «Играть» серая и показывает причину.</li>\n</ul>\n"
- version: 3.35.3
  date: '2026-11-02'
  tags:
  - type: feature
    label: 'Новый инструмент «Названия MAME» в ROM Tools: игры MAME получают настоящие названия, годы и разработчиков из собственного списка MAME, а файлы сохраняют короткие имена. Затем скрапинг находит каждую игру, а список MAME можно фильтровать по категориям, например исключить игровые автоматы. Наборы BIOS скрыты из списка'
  - type: fix
    label: ROM Reports больше не предлагает переименовывать файлы MAME, потому что переименованный файл перестаёт работать в MAME
  - type: fix
    label: Теперь в разделе «Настройки» сказано, что требует Microsoft перед регистрацией приложения Xbox. Из-за этого вход в Xbox не удалось проверить
  - type: enhancement
    label: Отдельная карточка «Официальные названия» убрана из массового режима «Заполнение ИИ», потому что переключатель «Официальное название» в заполнении уже делает то же самое
  - type: fix
    label: Если Sony отклоняет сохранённый вход в PlayStation, панель и «Настройки» теперь сообщают об этом и просят привязать аккаунт заново. Раньше при каждом запуске сервера в журнале появлялась бессмысленная ошибка, а вас никто не уведомлял
  - type: feature
    label: Импорт из Steam теперь в фоне заполняет описание, авторов, оценку Metacritic, возрастные рейтинги, режимы игры, обложку, фон и скриншоты каждой игры со страницы в магазине. Скрапьте игру, чтобы получить жанр и дату выхода
  - type: feature
    label: Синхронизация Steam теперь сохраняет ваше время в игре и дату последнего запуска, а страница игры их показывает
  - type: fix
    label: «Получить библиотеку» на странице импорта Steam теперь работает для администратора с сохранённым ключом Steam. Раньше Steam отправлялась скрытая форма ключа, а страница ошибочно просила сделать профиль публичным
  - type: fix
    label: Игра из Steam или Xbox, которая уже есть в вашей библиотеке под тем же названием, теперь при импорте привязывается к ней, и её достижения синхронизируются. Раньше она пропускалась и не привязывалась
  - type: fix
    label: Игры, импортированные из Steam, Xbox и PlayStation, теперь сразу сортируются правильно, например Final Fantasy IX идёт перед Final Fantasy X, а знаки торговой марки Steam убраны из названий
  - type: feature
    label: Для систем, где RetroAchievements использует обычный хеш файла, например Mega Drive и Game Boy, страница игры показывает, дают ли достижения ваша копия, а этот хеш связывает нужную игру. Запустите RA Refresh, чтобы заполнить это
  - type: fix
    label: Скрапинг теперь сначала спрашивает ScreenScraper о вашем точном файле и только потом ищет по названию, поэтому находит именно вашу игру, а не похожую. Результаты, которые вы отметили сами, по-прежнему в приоритете
  - type: enhancement
    label: В окне прогресса «Изменение размера изображений» теперь указаны игра и система, к которым относится каждая картинка
  - type: feature
    label: Скрапинг теперь загружает титульные экраны из ScreenScraper и TheGamesDB, больше официальных названий из IGDB и TheGamesDB (например японское название игры), а также другие консоли, на которых вышла игра, из IGDB
  - type: feature
    label: Игра без пользовательской оценки теперь берёт рейтинг из вашей коллекции ES-DE, если он там есть
  - type: feature
    label: Страница игры показывает, сколько игроков засекли время для результата HowLongToBeat, и ссылается на его страницу. У результатов, сохранённых раньше, это появится при следующем поиске
  - type: feature
    label: Страница RetroAchievements показывает, сколько людей играет в игру и какая доля из них получила каждое достижение
  - type: fix
    label: Обзор папок в ROM Tools теперь открывается в вашей папке с ROM, если нет папки для начала, а не выдаёт ошибку. Некорректный ответ IGDB теперь теряет только одну эту деталь, а не всё, что IGDB прислал по игре
  - type: fix
    label: Дневной лимит ScreenScraper теперь останавливает запросы RetroDB до более позднего времени, а массовый скрапинг сообщает об этом и продолжает с другими источниками. Раньше исчерпанный лимит выглядел как «игра не найдена», и запросы шли всю ночь
  - type: fix
    label: Игра, на которую ни один источник не смог ответить из-за достигнутого лимита сервиса, больше не помечается как скрапленная, поэтому при следующем запуске её попробуют снова
  - type: fix
    label: Когда ключ TheGamesDB исчерпал месячный лимит, RetroDB переходит на ваш другой ключ и прекращает запросы, когда исчерпаны оба
  - type: fix
    label: Месячный лимит RAWG теперь тоже останавливает запросы RetroDB, а IGDB удерживается в пределах четырёх запросов в секунду
  - type: fix
    label: Массовый поиск HowLongToBeat теперь завершается сообщением, если сайт сообщает о слишком большом числе запросов, а все запросы к сайту идут с паузами
  - type: fix
    label: «Исправление регионов коробок и инструкций» больше не останавливается после 25 игр подряд, которые ScreenScraper не знает. Оно останавливается, только когда ScreenScraper сообщает о достижении лимита
  - type: fix
    label: На странице игры каждый возрастной рейтинг теперь расположен по центру над своей подписью с оценкой ИИ
  - type: fix
    label: Лимит TheGamesDB в разделе «Настройки» теперь определяется проверкой, которая не расходует лимит, и больше не показывает выдуманную дату сброса, если сервис её не указывает
  body: |
    <ul>
      <li><strong>Игры MAME получают настоящие названия.</strong> Новый инструмент MAME Names в ROM Tools берёт названия, годы и разработчиков из собственного списка MAME. Файлы сохраняют короткие имена, потому что они нужны MAME. Список MAME можно фильтровать по категории, а наборы BIOS скрыты.</li>
      <li><strong>Импорт из Steam приносит гораздо больше.</strong> Для каждой игры описание, авторы, оценка Metacritic, возрастные рейтинги, режимы игры и изображения берутся со страницы в магазине. Синхронизация сохраняет время в игре и дату последнего запуска. Игра, которая уже есть в вашей Библиотеке под тем же названием, теперь связывается с ней, поэтому её достижения синхронизируются.</li>
      <li><strong>Скрапинг находит именно вашу игру.</strong> Перед поиском по названию скрапер спрашивает ScreenScraper о вашем точном файле. Скрапинг также приносит титульные экраны, больше официальных названий и другие консоли, на которых выходила игра.</li>
      <li><strong>RetroAchievements узнаёт вашу копию.</strong> Для систем, где используется обычный хеш файла, например Mega Drive и Game Boy, страница игры сообщает, даёт ли ваша копия достижения. Чтобы заполнить это, запустите RA Refresh. Страница RetroAchievements также показывает, сколько человек играет в игру и какая доля из них получила каждое достижение.</li>
      <li><strong>Онлайн-лимиты соблюдаются.</strong> Когда ScreenScraper, TheGamesDB или RAWG достигает лимита, RetroDB перестаёт обращаться к нему до поздней поры, а массовый скрапинг продолжает работу с другими источниками. Игра, по которой ни один источник тогда не смог ответить, будет проверена снова при следующем запуске.</li>
      <li><strong>Отказ во входе в PlayStation теперь заметен.</strong> Панель и Настройки теперь просят привязать аккаунт заново, когда Sony отклоняет сохранённый вход.</li>
      <li><strong>Official Names переехал.</strong> Его отдельной карточки больше нет в массовом Заполнении ИИ, потому что переключатель «Official name» в заполнении выполняет ту же задачу.</li>
    </ul>
- version: 3.35.2
  date: '2026-11-02'
  tags:
  - type: fix
    label: Общее время игры больше не считает минуты как часы на панели, в трофеях коллекционера и на графике аналитики. Игра на 36 минут считалась как 36 часов
  - type: fix
    label: HowLongToBeat больше не принимает продолжение за вашу игру. Double Dragon II больше не получает время Double Dragon III
  - type: fix
    label: Массовый поиск HowLongToBeat больше не сохраняет время игры с другой системы. Mario Golf на Game Boy Color больше не получает время с Nintendo 64. Такие совпадения теперь ждут на странице проверки
  - type: fix
    label: Массовый и одиночный поиск HowLongToBeat теперь учитывают год выхода игры, так что Doom 1993 года больше не получает время Doom 2016 года
  - type: new
    label: Проверка сохранённого времени игры в ROM Tools отправляет сохранённые подозрительные совпадения на страницу проверки, где вы оставляете или очищаете каждое
  - type: fix
    label: Массовый поиск HowLongToBeat с параметром «Только отсутствующие» теперь повторяет попытку для игр, найденных без времени, и делает секундную паузу между запросами
  - type: fix
    label: Оценка совпадения 72% больше не показывается как 100% на странице игры
  - type: fix
    label: Игры больше не показывают чужие RetroAchievements. Resident Evil 4 на GameCube больше не показывает набор Resident Evil, а Ratchet Deadlocked больше не показывает набор Ratchet & Clank
  - type: fix
    label: Скрапинг теперь удаляет связь с RetroAchievements, если такой игры в RetroAchievements нет. Если RetroAchievements недоступен, связь остаётся
  - type: fix
    label: 'RetroAchievements теперь находит больше ваших игр: по имени ROM-файла, альтернативным названиям, буквам с диакритикой, как в Ōkami, и названиям с двумя именами'
  - type: fix
    label: RetroAchievements больше не связывает игру с бонусным набором, хаком или демо, а X-Men больше не равно G-Men
  - type: new
    label: Страница игры показывает собственное название связанной игры из RetroAchievements, так что неверную связь легко заметить
  - type: fix
    label: Обновление RA теперь сохраняет очки каждой игры, так что игра больше не показывает 0 очков
  - type: new
    label: Страница игры помечает возрастные рейтинги от ИИ как предположение по содержанию игры и указывает, когда начала работать каждая рейтинговая организация. OutRun 1987 года больше не выглядит официально оценённой ESRB
  - type: new
    label: Страница игры помечает оценки обзоров и данные о продажах, полученные от ИИ. Если вы сами измените рейтинг или данные о продажах, пометка исчезнет
  - type: fix
    label: Оценка от ИИ по неверной шкале отклоняется, так что любимая игроками игра больше не получает 7 из 100 при новом скрапинге
  - type: fix
    label: Количество оценок от ИИ больше не сохраняется рядом с оценкой другого сайта, а страница игры больше не показывает такие данные, если они уже были сохранены
  - type: fix
    label: Диапазон продаж или денежная сумма от ИИ больше не превращается в несколько проданных копий
  - type: fix
    label: Ответы ИИ больше не сохраняют списки как код, слова N/A или None как значения, а также собственную консоль игры среди других платформ
  - type: fix
    label: Заполнение ИИ теперь сохраняет заменяемое значение в истории игры
  - type: fix
    label: Для картриджных игр больше не придумывается тип Battery Save, а новые ответы ИИ больше не ставят по умолчанию Standard Edition
  - type: fix
    label: Серия игры больше не определяется обрезкой названия, так что Need For Speed больше не входит в серию Need. Названия серий из IGDB снова читаются, а старые догадки очищены, чтобы следующий скрапинг заполнил их заново
  - type: fix
    label: В описаниях больше нет веб-кодов вместо кавычек и значков заголовков, таких как
  - type: fix
    label: У компании теперь одно написание, так что клик по Sega находит все игры SEGA. В регионах одно значение, а платформы используют названия из списка
  - type: fix
    label: Названия игр из RAWG больше не получают год, а альтернативные названия больше не включают имена файлов, например dosbox.exe
  - type: fix
    label: Полный повторный скрапинг больше не заменяет заданный вами рейтинг или контроллер догадкой, а скрапинг, который сбоит на полпути, больше не записывает данные менее аккуратным способом
  body: "<ul>\n  <li><strong>Ответы ИИ помечены как ИИ.</strong> Возрастные рейтинги от ИИ\n    сохраняются с пометкой, что это предположение по содержанию игры, и с годом начала работы\n    каждой рейтинговой организации. Оценки и продажи от ИИ тоже помечены.</li>\n  <li><strong>RetroAchievements показывает правильную игру.</strong> Продолжения\n    больше не получают достижения первой игры. После обновления\n    панель один раз предложит обновить RetroAchievements. Нажмите, чтобы исправить\n    старые связи. Прогресс, сохранённый по неверной связи, удаляется, а следующая\n    синхронизация заполнит его снова.</li>\n  <li><strong>Общее время игры теперь верное.</strong> Время меньше часа\n    считалось как часы, поэтому итоги на панели и трофеи коллекционера\n    были завышены. Некоторые итоги и трофеи уменьшатся.</li>\n  <li><strong>HowLongToBeat находит правильную игру.</strong> Продолжение больше\n    не выдаётся за вашу игру, а система и год игры теперь учитываются.\n    Совпадение с другой системой или с игрой, вышедшей годы спустя, ждёт вас\n    на странице проверки.</li>\n  <li><strong>Проверьте уже сохранённое.</strong> Нажмите «Проверить сохранённое\n    время игры» в ROM Tools, чтобы отправить сомнительные сохранённые совпадения на страницу проверки.\n    Ничего не изменится, пока вы не решите.</li>\n  <li><strong>Названия серий настоящие.</strong> Серия игры больше не определяется\n    обрезкой названия. После обновления угаданные названия серий очищаются,\n    включая некоторые верные. Следующий скрапинг\n    заполнит их из источников, которые указывают серию.</li>\n  <li><strong>Чистый текст.</strong> В описаниях больше нет веб-кодов и\n    значков заголовков. У компании одно написание, у игры один регион, а\n    имена файлов, например dosbox.exe, больше не указываются как другие названия. Это\n    произойдёт один раз, само, после обновления.</li>\n  <li><strong>Полный повторный скрапинг сохраняет ваш выбор.</strong> Заданный вами рейтинг или\n    контроллер остаётся, если только источник действительно не предоставит свой.</li>\n</ul>\n"
