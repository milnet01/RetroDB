  - type: fix
    label: Дата выхода теперь показывается ровно настолько подробно, насколько её знает источник. Если известен только год, показывается год, а не выдуманное 1 января или 31 декабря
  - type: fix
    label: Даты из IGDB и RAWG теперь относятся к консоли самой игры, а даты IGDB ещё и к её региону, так что версия для США больше не показывает японскую дату, а порт — год оригинала
  - type: feature
    label: Список «Даты выхода» на странице игры теперь заполняется из IGDB и ScreenScraper, а не только из ИИ
  - type: added
    label: 'Новая карточка в инструментах ROM: «Почистить даты выхода» убирает выдуманные дни, сохранённые прежними скрапами, чтобы скрап мог записать настоящую дату'
  - type: fix
    label: Жанры, ракурсы и режимы игры теперь используют единый набор названий, из какого бы источника они ни пришли, так что фильтры находят все игры. Один жанр больше не отображается и как RPG, и как Role Playing Game
  - type: added
    label: 'Новая карточка в инструментах ROM: «Почистить жанры, ракурсы и режимы» преобразует данные прежних скрапов, переносит такие слова, как FPV, в нужное поле и исправляет количество игроков, противоречащее режимам игры'
  - type: fix
    label: Игры только для онлайна из IGDB больше не помечаются как локальный мультиплеер, а игра для двух игроков больше не считается одиночной
  body: "<ul>\n  <li><strong>Скрап больше не берёт не ту игру.</strong> Сиквел\n    больше не выдаётся за вашу игру, так что Street Fighter II ничего не получает\n    от Street Fighter, а массовый скрап требует совпадения названия, а не\n    только консоли. Моды, DLC и наборы из IGDB больше не подходят, если ваш\n    ROM не называется точно так же.</li>\n  <li><strong>RAWG больше не смешивает версии игры.</strong> Если его запись\n    охватывает несколько консолей, он больше не даёт разработчика, издателя, возрастной\n    рейтинг и мультиплеерные режимы и не угадывает количество игроков.\n    Для игр Commodore 64 и DOS он больше не используется.</li>\n  <li><strong>Порядок скраперов решает, когда совпадения равны.</strong>\n    RAWG больше не получает лишние баллы за картинку или оценку Metacritic, а при новой\n    установке стоит последним.</li>\n  <li><strong>Дата выхода показывает только то, что знает источник.</strong> Если\n    известен только год игры, показывается он. Даты из IGDB и RAWG\n    относятся к консоли самой игры, а список «Даты выхода» теперь заполняется\n    и из IGDB, и из ScreenScraper.</li>\n  <li><strong>Единые названия жанров, ракурсов и режимов.</strong>\n    Фильтры теперь находят все игры, а игры только для онлайна больше не помечаются\n    как локальный мультиплеер.</li>\n  <li><strong>Две новые карточки в инструментах ROM.</strong> «Почистить даты выхода» и «Почистить\n    жанры, ракурсы и режимы» исправляют данные прежних скрапов. Нажмите\n    их, затем запустите массовый скрап с «Заполнить пропущенное».</li>\n  <li><strong>Количество игроков берётся для консоли самой игры,</strong> а\n    выбранный вами результат ScreenScraper всегда даёт именно ту игру.</li>\n</ul>\n"
