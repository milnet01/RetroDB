        и, в случае RetroArch, имеет нужное ядро. У игр систем без рабочего
        эмулятора кнопки нет.</li>
      <li>Если запуск всё же не удался, например потому что файл ROM
        перемещён, причина появится в сообщении, а страница останется как
        была.</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: Боковая панель короче, и одна страница «Достижения» для всех платформ
  body: |
    <ul>
