- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: Поиск в How Long To Beat снова работает
  body: |
    <ul>
      <li><strong>Любой поиск в How Long To Beat сообщал, что игра не
        найдена.</strong> Сайт перенёс поиск на новый адрес, поэтому запросы
        RetroDB отклонялись; сбой произошёл между концом июля и концом
        сентября. Теперь RetroDB использует новый адрес и отправляет фильтры
        по платформе и году в новом формате сайта: прежний формат сайт
        перестал учитывать. Снова работают и поиск для одной игры, и массовый поиск в
        «Инструментах ROM».</li>
    </ul>
- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: RetroDB теперь прямо говорит, что не одобряет пиратство
  - type: fix
    label: Окно «О программе» снова открывается в полный размер
  body: |
    <ul>
      <li><strong>В приложении появилось предупреждение против пиратства.</strong> Оно
        показано в окне «О программе» и под «Путём к библиотеке ROM» в
        «Настройках», на всех языках. В нём сказано, что RetroDB не
        распространяет и не размещает файлы ROM, что использовать стоит только
        игры, скопированные с принадлежащих вам дисков и картриджей, и что
        RetroDB не связан ни с одним производителем консолей, издателем или
        базой данных игр. Текст совпадает с сайтом и трейлером RetroDB.</li>
      <li><strong>Окно «О программе» было втиснуто в боковую панель.</strong>
        Теперь оно открывается посреди экрана в обычном размере, а на маленьком
        экране прокручивается, а не прячет свой заголовок и кнопку
        закрытия.</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: RetroDB запускает и переименовывает только настоящие типы файлов ROM
  body: |
    <ul>
      <li><strong>Игру можно было запустить с файлом, который не является
        ROM.</strong> Переименование ROM принимало любое имя, так что
        <code>crash.bin</code> мог стать <code>crash.cfg</code>, и его передавали
        эмулятору. Теперь при запуске тип файла сверяется со списком в
        <code>systeminfo.txt</code> папки этой системы &mdash; тем же списком,
        которым пользуется сканирование библиотеки, а переименование отказывает,
        если такого типа в списке нет. Если у папки системы нет списка, её игры
        не запустятся, а сообщение назовёт отсутствующий файл.</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: Только администратор может менять аргументы запуска игры
  - type: fix
    label: Аргументы запуска из нескольких слов или с лишней кавычкой теперь работают
  - type: fix
    label: RetroDB больше не хранит в памяти каждый завершённый запуск
  body: |
    <ul>
      <li><strong>Редактор мог добавить аргументы запуска, которые выполняли
        другой код.</strong> <em>Свои аргументы запуска</em> игры передаются
        прямо эмулятору, а с RetroArch через них можно было загрузить любой
        программный файл на компьютере. Теперь для их изменения нужна роль
        администратора, а остальным это поле не показывается.</li>
      <li><strong>Аргументы запуска из нескольких слов доходили до эмулятора
        как одно.</strong> <code>--a --b</code> теперь приходит как два
        аргумента, а пустое значение ничего не добавляет. Пропущенная
        закрывающая кавычка раньше ломала каждый запуск этой игры ошибкой
        сервера; теперь появляется сообщение с названием поля, которое нужно
        исправить. Метки <code>{disc_paths}</code> больше нет: она всегда была
        пустой.</li>
      <li><strong>Завершённые запуски копились в памяти до перезапуска
        RetroDB.</strong> Запуск, завершившийся больше часа назад, теперь
        удаляется.</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: Выбор языка в «Настройках» снова работает
  body: |
    <ul>
      <li><strong>Выбор языка в «Настройки» &rarr; «Библиотека» &rarr;
        «Отображение» ничего не делал.</strong> Вместо этого появлялась ошибка, и
        страница оставалась на прежнем языке. Это сломалось в 3.23.8. Теперь
        выбранный язык сохраняется, и страница перезагружается на нём.</li>
    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: Значки трофеев и платформ снова есть в загрузке
  body: |
    <ul>
      <li><strong>В загрузке не хватало значков трофеев и платформ
        RetroDB.</strong> На каждой карточке игры с RetroAchievements вместо
        значка была битая картинка, а также пропали уровни трофеев и логотипы
        PSN, Steam, Xbox и RPCS3. Теперь они входят в каждую загрузку.</li>
    </ul>
- version: 3.23.14
  date: '2026-10-10'
  tags:
  - type: security
    label: Две встроенные библиотеки обновлены ради опубликованных исправлений безопасности
  body: |
    <ul>
      <li><strong>В urllib3 и Werkzeug были известные проблемы безопасности.</strong>
        Теперь RetroDB поставляется с urllib3 2.8.0 и Werkzeug 3.1.9 &mdash;
        версиями, в которых они исправлены. Установка из исходников получит их,
        если снова запустить <code>install.py</code>, который устанавливает
        пакеты из <code>requirements.lock</code>.</li>
    </ul>
- version: 3.23.13
  date: '2026-09-26'
  tags:
  - type: fix
    label: Медиафайлы, сохранённые как путь с папкой, больше не считаются отсутствующими
  body: |
    <ul>
      <li><strong>В автономной сборке «очистка ссылок на отсутствующие
        медиафайлы» могла стереть медиафайлы, которые на самом деле были на
        месте.</strong> Это случалось, когда база данных хранила медиафайл как
        путь с папкой, например <code>images/boxart/…</code>, а не просто имя
        файла. Теперь RetroDB ищет его в нужной папке.</li>
    </ul>
- version: 3.23.12
  date: '2026-09-26'
  tags:
  - type: fix
    label: Панель управления показывает идущий массовый скрапинг, и четыре мелких исправления
  body: |
    <ul>
      <li><strong>Карточка прогресса скрапинга на панели управления никогда не появлялась.</strong>
        Теперь она видна, пока идёт массовый скрапинг, и сообщает, когда он
        приостановлен.</li>
      <li><strong>Больше никаких ошибок в консоли браузера на странице
        входа.</strong> Она перестала проверять фоновые задачи, пока никто не
        вошёл в систему.</li>
      <li><strong>Мастер настройки больше не пишет «Setup complete!», если
        сохранение не удалось.</strong> Теперь он сообщает, что настройки не
        удалось сохранить.</li>
      <li><strong>Два массовых скрапинга, запущенных в одну и ту же секунду,
        больше не получают общий идентификатор</strong>, поэтому действия с
        очередью, например отмена, применяются к нужному.</li>
    </ul>
- version: 3.23.11
  date: '2026-09-26'
  tags:
  - type: ui
    label: Кнопки пожертвований теперь говорят, что именно они поддерживают
  body: |
    <ul>
      <li><strong>Понятнее о пожертвованиях.</strong> Кнопки в шапке теперь
        называются «Поддержать» и «Поддержать на Patreon». В README сказано, что
        каждый выпуск бесплатен и что пожертвования идут на сам RetroDB, а не на
        эмуляторы и ядра, которые он умеет запускать.</li>
    </ul>
- version: 3.23.10
  date: '2026-09-26'
  tags:
  - type: fix
    label: Страницы «Инструментов ROM» учитывают сохранённые настройки, а страницы журналов и «Инструментов ROM» снова работают
  body: |
    <ul>
      <li><strong>Страница журналов и некоторые страницы «Инструментов ROM» были сломаны.</strong>
        Скрипт на этих страницах падал при загрузке, поэтому просмотр журнала и
        общие помощники «Инструментов ROM» так и не запускались. Теперь они
        загружаются как надо.</li>
      <li><strong>Настройки «Инструментов ROM» теперь действуют.</strong>
        «Поиск дубликатов» и «Конвертер CHD» открываются с параметрами со
        страницы настроек «Инструментов ROM», и их по-прежнему можно изменить
        для одного запуска.</li>
      <li><strong>Переключатели «Конвертера CHD» игнорировались.</strong>
        Выключение «Удалять исходные файлы» на странице не отменяло удаление,
        если в сохранённой настройке было указано удалять. Теперь решают
        переключатели на странице.</li>
      <li><strong>Настройка временного пути используется.</strong> Файлы,
        подготавливаемые при создании плейлистов M3U, теперь кладутся туда.</li>
    </ul>
- version: 3.23.9
  date: '2026-09-26'
  tags:
  - type: security
    label: Журналы скраперов больше не хранят пароли и токены, а число попыток входа снова ограничено
  - type: fix
    label: Сохранение настроек больше не стирает ваши настройки, и удаление пользователя работает
  body: |
    <ul>
      <li><strong>Файлы журналов хранили секреты открытым текстом.</strong> Журналы
        скраперов должны были скрывать токены входа и ключи API, но шаг
        скрытия никогда не выполнялся, поэтому они записывались целиком.
        Теперь они скрыты. В старых файлах журналов они всё ещё есть; удалите
        старые файлы в <code>logs/</code>, если делитесь своей установкой.</li>
      <li><strong>Ограничения на попытки входа не действовали.</strong> Ограничения
        на повторные входы и на тяжёлые действия (сканирование, скрапинг, импорт)
        были настроены, но так и не включены. Теперь они работают, а
        заблокированный запрос получает понятное сообщение «слишком много
        попыток».</li>
      <li><strong>Повреждённый файл настроек мог быть стёрт.</strong> Если
        <code>data/settings.json</code> не удавалось прочитать, следующее
        сохранение заменяло его значениями по умолчанию. Теперь перед
        сохранением RetroDB оставляет повреждённый файл как
        <code>settings.json.corrupt-&lt;time&gt;</code>. Если файл снова читается
        нормально, сохранение вместо этого отклоняется.</li>
      <li><strong>Строка «Движок» в настройках именования теряла другие настройки.</strong> Добавление
        тега в строку «Движок» не удавалось и вдобавок выбрасывало сохранённые
        вместе с ним настройки артиклей и регионов. Теперь она сохраняется
        правильно.</li>
      <li><strong>Удаление пользователя не работало.</strong> Пользователя с
        тегами, списками, списком желаний или данными PSN нельзя было удалить.
        Теперь удаление убирает пользователя и всё, что ему принадлежит.</li>
      <li><strong>Могли идти два скрапинга сразу.</strong> Перестановка или
        перемещение идущего массового скрапинга в очереди запускали два
        скрапинга с общим счётчиком прогресса. Теперь идёт только один.</li>
      <li><strong>Прогресс массового скрапинга мог выглядеть как ошибка.</strong>
        До первого успеха массовый скрапинг сообщал своё состояние так, что
        некоторые экраны принимали его за сбой. Это исправлено.</li>
      <li><strong>После входа вы теперь попадаете на страницу, которую запрашивали.</strong>
        Раньше всегда открывалась панель управления.</li>
      <li><strong>Действия администратора с файлами не выходят за пределы ваших папок.</strong> Инструмент
        изменения размера изображений и действия переименования ROM теперь
        отказываются работать с чем-либо вне вашей папки медиафайлов или папки
        ROM.</li>
      <li><strong>Старые файлы входа PSN и Xbox переносятся в вашу учётную
        запись.</strong> Оставшийся <code>data/psn_tokens.json</code> или
        <code>data/xbox_tokens.json</code> загружается в вашу учётную запись и
        переименовывается с окончанием <code>.migrated-015</code>. Этот файл всё
        ещё содержит токен, поэтому удалите его, как только убедитесь, что вход
        работает.</li>
      <li><strong>Понятнее ошибки от сервера.</strong> На неверный запрос теперь
        приходит нормальное сообщение об ошибке, а не «An internal error
        occurred».</li>
    </ul>
- version: 3.23.8
  date: '2026-09-25'
  tags:
  - type: fix
    label: Импорт CLZ снова работает, обложки в списках видны, и несколько страниц больше не ломаются на апострофе
  - type: security
    label: Полученные скрапингом названия и пути к файлам больше не могут вырваться за пределы кнопок страницы
  body: |
    <ul>
      <li><strong>Импорт CLZ ничего не делал.</strong> Загруженный PDF из CLZ
        отправлялся по адресу, которого у сервера нет, поэтому каждая загрузка
        заканчивалась ошибкой «Parse failed». Теперь он доходит до
        обработчика.</li>
      <li><strong>На странице списка не было ни одной обложки.</strong> Страница списка
        запрашивала каждую обложку по неверному адресу, а столбец «Система»
        всегда был пуст. Теперь видно и то и другое. Картинки обложек в поиске
        «добавить игру» на этой странице тоже исправлены.</li>
      <li><strong>Кнопки ломались на названиях с апострофом.</strong> Удаление
        «Assassin's Creed» из списка, удаление скриншота, увеличение обложки или
        удаление тега жанра могли молча ничего не делать, если в названии был
        апостроф. Та же ошибка позволяла специально составленному названию из
        скрапинга выполнить код на странице. Теперь названия передаются этим
        кнопкам так, что их невозможно принять за код.</li>
      <li><strong>Адреса изображений и ссылок экранируются везде.</strong> Несколько
        страниц собирали адреса картинок из имён файлов, полученных скрапингом,
        без экранирования, а на пяти страницах была своя, более слабая копия
        помощника для экранирования. Теперь все они используют общий.</li>
      <li><strong>Страница «Настройки» могла открыться пустой.</strong> Если вкладку,
        которой вы пользовались последней, переименовали при обновлении,
        «Настройки» открывались без видимой панели. Теперь вкладка, которой
        больше нет, игнорируется. Ссылки вроде
        <code>/settings#account</code> снова открывают нужную вкладку.</li>
      <li><strong>Ваша тема теперь следует за вами на другие устройства.</strong>
        Выбранная тема сохраняется в вашей учётной записи. Браузер, которому
        тему ещё ни разу не задавали, использует сохранённую, а не тему по
        умолчанию.</li>
      <li><strong>Всплывающие окна прогресса задач показывают правильный значок.</strong>
        Приостановленные, завершённые и ожидающие в очереди задачи показывали
        один и тот же значок «выполняется». Теперь у каждого состояния свой, для
        каждой темы.</li>
      <li><strong>Список сочетаний клавиш теперь можно перевести.</strong> Его
        подписи были не видны инструментам перевода, поэтому оставались на
        английском во всех языках.</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: Возрастные рейтинги часто были неверными, а игры после скрапинга могли терять сведения
  body: |
    <ul>
      <li><strong>Возрастные рейтинги часто были неверными, и ошибка распространялась.</strong>
        Когда рейтинг приходил из TheGamesDB, приложение искало код рейтинга
        где угодно в тексте, а не читало его как следует, &mdash; поэтому
        «T - Teen», «M - Mature 17+», «AO - Adults Only 18+» и
        «RP - Rating Pending» сохранялись как неверный рейтинг, а игра для
        взрослых могла попасть в подходящие для всех. Хуже того, этот неверный
        рейтинг затем использовался для заполнения восьми других систем
        рейтингов, так что одно неверное прочтение расходилось по всем. Теперь
        рейтинги читаются по коду в начале текста.</li>
      <li><strong>Пересчитанные рейтинги выходили слишком мягкими.</strong> Заполняя
        недостающий рейтинг по уже имеющемуся, приложение могло взять рейтинг,
        который само вычислило мгновением раньше, а не тот, с которого вы
        начинали. С каждым шагом строгость немного терялась. Теперь пересчёт
        всегда идёт от рейтингов, которые у игры есть на самом деле.</li>
      <li><strong>«Полный повторный скрапинг» стирал выбранные вручную «Регион» и «Тип сохранения».</strong>
        Ни то ни другое не приходит от скрапера &mdash; приложение вычисляет их
        само &mdash; поэтому «Полный повторный скрапинг» заменял ваше выбранное
        «Япония» на значение по умолчанию «США». Теперь ваши значения
        сохраняются, если только источник действительно не предоставит
        новое.</li>
      <li><strong>Скрапер мог принять не ту игру.</strong> Результаты ScreenScraper
        обычно проверяются по оценке совпадения перед использованием, но поиск,
        вернувший ровно один результат, эту проверку полностью пропускал.
        Теперь оценивается каждый результат.</li>
      <li><strong>Игра могла потерять все полученные скрапингом сведения из-за
        одного пустого поля.</strong> Если IGDB или ScreenScraper неожиданным
        образом оставляли пустым одно поле, всё обновление выбрасывалось
        &mdash; издатель, разработчик, изображения и всё остальное. Теперь такие
        случаи обрабатываются, а остальные сведения сохраняются.</li>
      <li><strong>Неудачное изображение могло записаться как успех.</strong> Если
        скачанная картинка оказывалась непригодной, приложение ничего не
        удаляло и всё равно сохраняло имя файла, оставляя битую ссылку. Теперь
        файл удаляется, а поле остаётся нетронутым.</li>
      <li><strong>Режимы игры теперь называются единообразно.</strong> Разные
        скраперы писали «Single-player» и «Single-Player», а также просто
        «Multiplayer», которого не было среди собственных подписей приложения,
        поэтому такие игры нельзя было перевести или найти фильтром «Режимы».
        Теперь все источники пишут одинаковые подписи. Существующие игры
        сохраняют старое написание, пока вы не повторите их скрапинг или не
        запустите инструмент нормализации в «Настройках».</li>
      <li><strong>Поиск по Xbox теперь работает так же, как остальные источники.</strong> Он
        выполнял собственные веб-запросы, поэтому не повторял попытку, когда
        Xbox Live просил притормозить, и не ограничивал объём данных в ответе.
        Теперь он использует то же общее соединение, что и другие
        скраперы.</li>
      <li><strong>Удалён неиспользуемый код ScreenScraper.</strong> Удалены две
        функции, которые в приложении нигде не вызывались. Одна из них
        возвращала веб-адрес, в котором оставался ваш пароль ScreenScraper, и
        передала бы этот пароль всему, что её использовало. «System Media
        Endpoint», упомянутый в примечаниях к выпускам 3.6.x, был одной из них
        &mdash; до него никогда нельзя было добраться ни из одной части
        приложения.</li>
    </ul>
- version: 3.23.5
  date: '2026-09-02'
  tags:
  - type: fix
    label: Готовая сборка не запускалась, и другие исправления сборки
  body: |
    <ul>
      <li><strong>Автономная загрузка вообще не запускалась.</strong> Готовая
        сборка несёт свой Python, но запускающий скрипт внутри неё был тем, что
        написан для установки из исходников, &mdash; он искал файлы Python,
        которых в готовой сборке нет, и останавливался на первой же строке.
        Теперь в сборке свой запускающий скрипт, который просто запускает
        приложение и открывает браузер, как только сервер готов.</li>
      <li><strong>Ярлык рабочего стола в загрузке для Linux ничего не
        запускал.</strong> В нём вместо пути к приложению стоял текст-заглушка.
        Теперь рядом с запускающим скриптом есть <code>install-launcher.sh</code>
        &mdash; запустите его один раз, и ярлык будет записан с настоящим путём
        туда, куда вы распаковали программу.</li>
      <li><strong>Запуск из исходников устанавливал непроверенные
        зависимости.</strong> Если Flask отсутствовал, скрипт запуска скачивал
        пакеты прямо из интернета без проверки контрольных сумм и по пути
        обходил системный менеджер пакетов. Теперь он передаёт работу
        <code>install.py</code>, который использует файл блокировки с
        контрольными суммами.</li>
      <li><strong>Загрузка исходников содержала служебные файлы разработчика, которых там
        быть не должно.</strong> Список того, что исключать, вёлся вручную и
        отстал, поэтому результаты проверок и оставшиеся папки сборки попадали
        в пакет вместе с приложением. Теперь загрузка собирается по списку
        файлов, реально входящих в проект, и он не может разойтись с
        действительностью.</li>
      <li><strong>Две панели «Настроек» ломались в готовой сборке.</strong> Панели
        статистики библиотеки и состояния API искали основную программу по
        имени, которого у неё внутри готовой сборки нет, поэтому обе
        выдавали ошибку.</li>
      <li><strong>Часть текста на экране невозможно было перевести.</strong> Три
        новые части приложения &mdash; настройки эмуляторов, кнопка запуска и
        полоса «сейчас играет» &mdash; пропускались при поиске строк для
        перевода, а проверка, которая должна была это заметить, смотрела на
        тот же неполный список. Теперь поиск автоматически охватывает все
        файлы, а их текст добавлен в переводы.</li>
      <li><strong>Пересборка переводов могла тихо ничего не делать.</strong>
        После добавления текста в скрипт отдельной страницы пересборка считала,
        что делать нечего, поэтому новый текст так и не попадал в файл
        перевода.</li>
      <li><strong>Обходное решение для видеокарты применялось ко всем.</strong>
        Скрипт запуска для Linux навязывал настройку, предназначенную для одной
        конкретной карты AMD, каждому компьютеру, из-за чего на другом
        оборудовании AMD мог зависать увеличитель изображений. Теперь она
        применяется, только если эта карта действительно есть, и никогда не
        перекрывает значение, заданное вами.</li>
      <li><strong>Скрипт выпуска мог опубликовать не ту версию.</strong>
        Оставшийся от прошлой попытки тег молча использовался повторно, так что
        сборка могла быть сделана из более старого снимка, сообщая при этом об
        успехе.</li>
    </ul>
- version: 3.23.4
  date: '2026-09-02'
  tags:
  - type: fix
    label: Закрыты девять путей, которыми ваша библиотека могла терять данные
  body: |
    <ul>
      <li><strong>«Очистка данных скрапинга» очищала всю библиотеку.</strong> Окно
        подтверждения считало только игры, у которых действительно был
        скрапинг, а затем действие стирало все игры подряд &mdash; так что оно
        могло пообещать дюжину и очистить тысячи. С включёнными изображениями
        оно также удаляло обложки, загруженные вами вручную, и сбрасывало
        названия, которые вы правили сами, у игр, у которых скрапинга не было
        вовсе. Теперь оно делает ровно то, что написано в окне.</li>
      <li><strong>3D-обложка оставляла битую ссылку.</strong> Очистка с
        изображениями удаляла 3D-обложку с диска, но база данных продолжала на
        неё указывать, так что приложение искало файл, которого уже нет.</li>
      <li><strong>Переключатель «Добавить» при массовом редактировании заменял, а не добавлял.</strong>
        Для «Перспективы» и «Измерения» он делал ровно противоположное своей
        подписи, перезаписывая существующие значения у всех выбранных игр
        сразу, без возможности отмены.</li>
      <li><strong>Автономные сборки могли одним щелчком стереть все ссылки на
        изображения.</strong> В готовой загрузке приложение искало ваши
        медиафайлы не в том месте, решало, что отсутствует каждое изображение,
        и «очистка ссылок на отсутствующие медиафайлы» затем опустошала записи
        обложек, скриншотов, видео и инструкций для всей библиотеки. Проверка
        безопасности, существующая ровно для таких случаев, этого не видела.
        Это затрагивало только готовую сборку.</li>
      <li><strong>Удаление файлов-сирот могло удалить изображения прямо при загрузке.</strong>
        Обложка, скачанная во время этой очистки, могла быть принята за
        файл-сироту и удалена.</li>
      <li><strong>Создание плейлистов перемещало ваши архивы без спроса.</strong>
        Пакетное создание плейлистов M3U убирало ваши исходные архивы, даже
        когда этот параметр был выключен, &mdash; а когда вы его включали,
        сообщало о сбое перемещения, которое на самом деле прошло.</li>
      <li><strong>Инструмент изменения размера изображений раздувал папку медиафайлов.</strong> Он
        принимал создаваемые им маленькие миниатюры за новые изображения для
        увеличения, раздувал их до полного размера, а потом делал из них
        миниатюры. Каждый запуск добавлял файлы, страницы незаметно отдавали
        полноразмерные изображения вместо миниатюр, а ИИ-увеличитель
        обрабатывал примерно втрое больше файлов, чем нужно.</li>
      <li><strong>Заполнение ИИ перезаписывало исправленные вами сведения.</strong>
        При обычном скрапинге оно могло заменить ваших издателя, разработчика,
        жанр, возрастные рейтинги и прочее. Теперь оно только заполняет пустые
        поля; кнопка «Заполнение ИИ», которую вы нажимаете сами, не
        изменилась.</li>
      <li><strong>Повторный скрапинг мог удалить хороший скриншот.</strong> Игры,
        получившие данные из RAWG, использовали одни и те же имена файлов,
        поэтому второй скрапинг перезаписывал сохранённый скриншот, а затем
        удалял его как дубликат, хотя библиотека всё ещё его указывала.</li>
    </ul>
- version: 3.23.3
  date: '2026-09-01'
  tags:
  - type: fix
    label: Роли в семье теперь делают ровно то, что заявлено, а отключённая учётная запись действительно заблокирована
  body: |
    <ul>
      <li><strong>Отключение учётной записи теперь завершает её сеанс.</strong> Отключённая
        учётная запись пропадала со всех экранов, но тот, кто уже вошёл в неё,
        продолжал спокойно работать до недели. Отключение &mdash; единственный
        способ закрыть кому-то доступ, не удаляя его, поэтому теперь оно
        срабатывает при первом же следующем щелчке.</li>
      <li><strong>Учётные записи только для чтения больше не могут менять данные игр.</strong>
        Три действия How Long to Beat были открыты всем, кто вошёл в систему,
        включая тех, кто может только смотреть, &mdash; так что учётная запись
        только для чтения могла перезаписать время прохождения или стереть его
        у всех игр библиотеки. Теперь для них нужны права на редактирование,
        как и для любого другого действия, меняющего игру.</li>
      <li><strong>Учёт трофеев снова работает у всех.</strong>
        Обновление собственных трофеев коллекционера требовало прав редактора,
        которых нет у ролей «Игрок» и «Зритель», &mdash; а только оно и записывает
        эти трофеи. Такие учётные записи не могли получить ни одного трофея, а
        кнопка «Обновить» лишь показывала ошибку. Это ваш собственный прогресс,
        поэтому теперь никаких особых прав не нужно.</li>
      <li><strong>Обновление PlayStation одного человека больше не может
        остановить кто-то другой.</strong> Любая учётная запись могла
        приостановить или отменить обновление, запущенное другим, и видеть, на
        какой игре он находится. Теперь и то и другое доступно только тому, кто
        его запустил.</li>
      <li><strong>Импорт Steam использует вашу собственную учётную запись, а не того, кто
        сохранил свою первым.</strong> Импорт библиотеки читал одну общую копию
        данных входа Steam вместо ваших, поэтому мог загрузить чужую
        библиотеку &mdash; в то время как ваши собственные сохранённые данные
        казались отсутствующими.</li>
      <li><strong>Подобрать пароль администратора снова трудно.</strong> Ограничение
        на неудачные попытки входа было общим для всех в сети, так что любой со
        своей учётной записью мог сбросить его, войдя в систему, и подбирать
        дальше без конца. Теперь ограничение действует для каждой учётной
        записи отдельно.</li>
      <li><strong>Ошибки приложения теперь доходят до страницы, а не пропадают.
        </strong> Когда действие отклонялось, 115 из них отвечали в виде,
        который страница не могла прочитать, так что казалось, будто действие
        выполнено. Теперь они правильно сообщают об отказе, и вы видите
        настоящее сообщение.</li>
    </ul>
- version: 3.23.2
  date: '2026-08-06'
  tags:
  - type: fix
    label: Страницы настроек скраперов загружаются быстрее и никогда не показывают устаревший ключ API
  body: |
    <ul>
      <li><strong>Страницы «Настройки» и настройки скраперов больше не перечитывают
        файл настроек скраперов при каждом запросе.</strong> Четыре места
        открывали и заново разбирали его с диска каждый раз, когда
        срабатывала страница или проверка, хотя общий кэширующий модуль чтения
        уже существовал. Теперь все они используют его, так что эти страницы
        делают меньше работы при каждом посещении.</li>
      <li><strong>Сохранение по-прежнему действует мгновенно.</strong> Кэш,
        который забывает по таймеру, мог бы показывать старые значения до
        полуминуты после сохранения. Теперь каждое сохранение очищает кэш в
        момент записи, так что вы видите ровно то, что только что
        сохранили.</li>
      <li><strong>Ваши настоящие ключи API больше не могут быть заменены их
        собственным замаскированным видом.</strong> Страницы настроек
        показывают сохранённые ключи как <code>***1234</code>, а не целиком.
        Поскольку странице передавалась та же копия настроек, что используют
        скраперы, маскировка могла перезаписать настоящие ключи в памяти, и
        скраперы входили бы со звёздочками, пока кэш не устареет.</li>
      <li><strong>Автономные сборки теперь ищут настройки скраперов в
        нужном месте.</strong> Скраперы определяли расположение файла иначе,
        чем страницы, которые его сохраняют. В обычной установке оба попадали
        в один и тот же файл; в автономной (запускаемой двойным щелчком) сборке
        это было бы не так, и сохранённые ключи API могли оказаться там, куда
        скраперы никогда не заглядывали.</li>
    </ul>
- version: 3.23.1
  date: '2026-08-06'
  tags:
  - type: fix
    label: Порт сервера, сохранённый в «Настройках», теперь действительно используется
  body: |
    <ul>
      <li><strong>Сохранение порта сервера действительно переносит сервер.</strong>
        «Настройки» принимали порт, проверяли его, сохраняли и сообщали, что
        для применения нужен перезапуск, &mdash; а затем сервер всё равно
        запускался на 5000. Это значение никто никогда не читал обратно. Теперь
        оно входит в цепочку запуска, так что перезапуск действительно переносит
        RetroDB на выбранный вами порт. Значение, заданное в окружении, по-прежнему
        важнее, так что запускающая программа или контейнер, назначающие порт,
        не затронуты.</li>
      <li><strong>Две настройки, которые никогда ничего не делали, удалены, а
        не исправлены.</strong> «Адрес сервера» и «режим отладки» сохранялись и
        давали то же ложное обещание. Включение режима отладки через
        веб-форму открыло бы в браузере интерактивную консоль Python, а адрес
        привязки определяет, какие компьютеры вообще могут достучаться до
        RetroDB, &mdash; ни то ни другое не должно быть в форме настроек. Обе
        по-прежнему настраиваются через окружение, где они и были. Если в вашем
        файле настроек они ещё есть, они тихо отбрасываются при загрузке;
        делать ничего не нужно.</li>
      <li><strong>Теперь ничто не обещает, что перезапуск что-то применит, если
        перезапуск этого не применяет.</strong> Именно это и было настоящей
        ошибкой &mdash; мёртвая настройка просто неаккуратна, а ложное обещание
        отнимает полдня.</li>
    </ul>
- version: 3.23.0
  date: '2026-08-06'
  tags:
  - type: enhancement
    label: Запускайте RetroDB на порту, который выбрала другая программа
  body: |
    <ul>
      <li><strong>RetroDB теперь читает настройку <code>PORT</code> из своего
        окружения.</strong> Если вы запускаете RetroDB из другой программы &mdash;
        панели управления, контейнера, панели домашнего сервера &mdash; эта
        программа теперь может передать RetroDB нужный ей порт, и никому не
        придётся править файл. Задайте <code>PORT</code>, и RetroDB займёт этот
        порт; не трогайте его &mdash; и ничего не изменится. Прежний
        <code>RETRODB_PORT</code> работает точно так же, как раньше, а если
        заданы оба, побеждает <code>PORT</code>.</li>
      <li><strong>Неверный номер порта теперь сообщает об этом, а не
        угадывает.</strong> Раньше нечитаемый порт выдавал стену текста ошибок
        Python, а порт вне допустимого диапазона обнаруживался только тогда,
        когда сервер не запускался. Теперь RetroDB сразу останавливается с одной
        строкой, называющей значение, которое он не смог использовать. Он
        никогда не запустится молча на другом порту, чем тот, о котором его
        просили, &mdash; быть тихо перемещённым хуже, чем получить отказ.</li>
      <li><strong>Стартовое сообщение и вкладка браузера следуют реальному
        порту.</strong> Адрес, выводимый при запуске RetroDB, и страница,
        которую он для вас открывает, раньше всегда указывали 5000, какой бы
        порт ни использовался на самом деле.</li>
    </ul>
- version: 3.22.1
  date: '2026-07-31'
  tags:
  - type: fix
    label: Рабочий файл базы данных больше не растёт без ограничений
  body: |
    <ul>
      <li><strong>У журнала базы данных снова есть предел.</strong> SQLite хранит рабочий файл (файл <code>-wal</code>) рядом с базой данных вашей библиотеки. RetroDB должен был ограничить его 64&nbsp;МБ, но ограничение применялось только к фоновым задачам &mdash; обычные загрузки страниц и правки работали вообще без предела. После одной необычно большой записи файл навсегда оставался максимального размера, порой больше самой базы. Теперь предел действует везде, и место возвращается.</li>
    </ul>
- version: 3.22.0
  date: '2026-07-05'
  tags:
  - type: enhancement
    label: Скрапьте игру прямо из её всплывающего окна, без лишнего шага
  body: |
    <ul>
      <li><strong>Скрапинг из всплывающего окна игры.</strong> Быстрое
        всплывающее окно игры (то, что появляется при щелчке по игре в вашей
        Библиотеке) теперь имеет кнопку <strong>Скрапить</strong> рядом с
        «Заполнение ИИ» и «Редактировать». Щёлкните по ней, и RetroDB перенесёт
        вас прямо к этой игре с уже открытым поиском метаданных &mdash; больше не
        нужно открывать полную страницу и сначала искать кнопку «Скрапить».</li>
    </ul>
- version: 3.21.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Запуск одним щелчком — запускайте RetroDB с закреплённого значка, без терминала
  - type: feature
    label: Настоящий значок приложения — неоновый геймпад на вкладке браузера и панели задач
  - type: feature
    label: Новая кнопка «Выключить сервер» на странице настроек
  body: |
    <ul>
      <li><strong>Запуск одним щелчком.</strong> Теперь у RetroDB есть
        полноценный ярлык запуска, который можно закрепить на панели задач
        &mdash; щёлкните по нему, и приложение запустится (если оно ещё не
        работает) и автоматически откроется в браузере. Больше не нужно
        открывать терминал и вводить команду. В Linux один раз выполните
        <code>python3 scripts/install_launcher.py</code>, чтобы добавить
        &ldquo;RetroDB&rdquo; в меню приложений, а затем закрепите его.</li>
      <li><strong>Настоящий значок приложения.</strong> Теперь RetroDB носит
        значок с неоновым геймпадом &mdash; киберпанк-циан и пурпурный на тёмной
        плитке &mdash; на вкладке браузера (фавикон), на ярлыке панели задач и на
        самой программе Windows. Он заменяет простую эмодзи-заглушку.</li>
      <li><strong>Кнопка «Выключить сервер».</strong> В разделе «Управление
        сервером» на странице настроек теперь есть красная кнопка
        <strong>Выключить сервер</strong> рядом с «Перезапустить». Она аккуратно
        останавливает приложение (позволяя запущенным задачам сначала завершить
        сохранение), поэтому больше не нужно переключаться на терминал и нажимать
        Ctrl+C.</li>
      <li><strong>Загружаемые сборки открывают браузер за вас.</strong> Готовые к
        запуску загрузки для Windows, Mac и Linux теперь открывают ваш браузер
        через мгновение после запуска, так что приложение оказывается перед вами
        без каких-либо лишних действий.</li>
    </ul>
- version: 3.20.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Одиннадцать новых языков — RetroDB теперь говорит на 21 языке
  - type: fix
    label: 'Исправлена безвредная ошибка в консоли при уходе из списка игр'
  body: |
    <ul>
      <li><strong>Одиннадцать новых языковых пакетов.</strong> Интерфейс
        RetroDB, заметки о выпусках и руководство пользователя теперь
        переведены на <strong>Afrikaans, isiZulu, isiXhosa, Dutch, Norwegian
        (Bokm&aring;l), Russian, Polish, Turkish, Ukrainian, Indonesian
        и Hebrew</strong> &mdash; в дополнение к уже имеющимся German, Spanish,
        French, Italian, Japanese, Korean, Brazilian Portuguese и Simplified
        &amp; Traditional Chinese. Выберите свой язык в разделе Настройки
        &rarr; Параметры отображения &rarr; Язык; приложение перезагрузится
        на выбранном языке.</li>
      <li>Каждый язык охватывает всё приложение целиком: каждую кнопку,
        подпись и сообщение, полную историю заметок о выпусках и полное
        руководство пользователя.</li>
      <li><strong>isiZulu &amp; isiXhosa</strong> тоже включены. Поскольку
        в этих языках пока мало сложившейся технической лексики, некоторые
        термины (ROM, scraper, box art) оставлены на английском там, где нет
        естественного слова &mdash; перед тем как полагаться на эти переводы,
        не помешает проверка носителем языка.</li>
      <li><strong>Hebrew</strong> поставляется с полностью переведённым
        текстом; доработанная раскладка страниц справа налево (чтобы интерфейс
        отражался правильно) появится в одном из следующих обновлений. Arabic
        последует, как только эта работа над раскладкой будет завершена.</li>
      <li><strong>Исправление:</strong> при уходе из Библиотеки или списка игр системы в консоли браузера больше не появляется безвредная &laquo;ReferenceError&raquo; (остаток прежней чистки кода). Видимых изменений нет &mdash; просто консоль стала чище.</li>
    </ul>
- version: 3.19.1
  date: '2026-07-05'
  tags:
  - type: performance
    label: Более быстрый скрапинг — скриншоты игры теперь загружаются одновременно
  body: |
    <ul>
      <li><strong>Скриншоты загружаются параллельно.</strong> По тому же принципу,
        что и в популярном фронтенде ES-DE (который загружает все медиафайлы игры
        сразу), RetroDB теперь загружает скриншоты игры <strong>одновременно</strong>,
        а не один за другим, для всех источников (TheGamesDB, IGDB, RAWG,
        ScreenScraper). Игры с несколькими скриншотами обрабатываются заметно
        быстрее.</li>
      <li>Проверка на дубликаты скриншотов по-прежнему выполняется после загрузки
        по порядку, поэтому точность удаления повторяющихся изображений осталась
        прежней &mdash; ускорилась только загрузка. Одновременно загружается не
        более четырёх файлов, чтобы не перегружать один источник.</li>
      <li>Улучшение скорости «под капотом»; вступает в силу после следующего
        перезапуска.</li>
    </ul>
- version: 3.19.0
  date: '2026-07-05'
  tags:
  - type: performance
    label: Более быстрый скрапинг — источники теперь опрашиваются одновременно
  body: |
    <ul>
      <li><strong>Скрапинг стал быстрее для каждой игры.</strong> Когда RetroDB
        ищет игру, он проверяет несколько баз данных (ES-DE, TheGamesDB, IGDB,
        RAWG, ScreenScraper). Раньше они опрашивались <em>по очереди</em>, и
        RetroDB ждал ответа от каждой, прежде чем перейти к следующей &mdash;
        поэтому время ожидания складывалось из ответов всех источников. Теперь
        все они опрашиваются <strong>одновременно</strong>, и ожидание
        определяется только самым медленным источником, что заметно ускоряет
        обработку каждой игры. Результаты по-прежнему сортируются и оцениваются
        точно так же, как раньше.</li>
      <li><strong>Меньше лишних соединений при загрузке изображений.</strong>
        Загрузка изображений теперь использует уже открытое соединение вместо
        того, чтобы открывать новое для каждой картинки, что экономит время на
        играх с большим количеством скриншотов.</li>
      <li>Это улучшения скорости «под капотом» &mdash; в способе использования
        RetroDB ничего не меняется, и нагрузка на базы данных не увеличивается
        (те же запросы, просто выполняются параллельно). Вступает в силу после
        следующего перезапуска.</li>
    </ul>
- version: 3.18.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Добавлена китайская возрастная классификация как 9-я система рейтингов
  body: |
    <ul>
      <li><strong>Новая система возрастной классификации: Китай (CADPA).</strong>
        RetroDB теперь поддерживает официальную китайскую систему возрастных
        рекомендаций для игр (&ldquo;网络游戏适龄提示&rdquo;, выпущенную CADPA)
        наряду с восемью существующими системами (ESRB, PEGI, CERO, USK, ACB,
        FPB, GRAC и ClassInd). Она использует три уровня &mdash; <strong>8+</strong>,
        <strong>12+</strong> и <strong>16+</strong> &mdash; отображаемых простым
        зелёным значком.</li>
      <li><strong>Заполняется автоматически, как и остальные.</strong> Если у
        игры уже есть рейтинг от любой другой страны, RetroDB автоматически
        определяет соответствующий китайский уровень (и наоборот). Вы также
        можете выбрать или изменить его вручную на экране редактирования игры и
        выбрать его в качестве предпочитаемой системы отображения в разделе
        Настройки &rarr; Библиотека. Обратите внимание: большинство западных баз
        данных игр не публикуют китайский рейтинг, поэтому для игр без рейтинга
        вообще он определяется по содержанию игры во время скрапинга / AI
        Fill.</li>
      <li>Зелёные значки &mdash; это собственная простая графика RetroDB
        (соответствующая фирменному стилю других систем), а не официальный логотип
        CADPA, поэтому никаких лицензионных ограничений на изображения нет.</li>
    </ul>
- version: 3.17.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Очистка записей в базе данных для медиафайлов, отсутствующих на диске
  - type: security
    label: Защита от удаления всех изображений библиотеки при исчезновении папки с медиафайлами
  body: |
    <ul>
      <li><strong>Новый инструмент обслуживания: &ldquo;Отсутствующие ссылки на
        медиафайлы&rdquo;</strong> (Настройки &rarr; Система &rarr; Обслуживание).
        Это зеркальное отражение существующей очистки &ldquo;Файлы-сироты&rdquo;:
        вместо поиска оставшихся файлов изображений без игры он находит игры,
        у которых обложка, 3D-обложка, скриншоты, фан-арт, видео или мануал
        указывают на файлы, которых больше нет на диске. Найдите их, а затем
        очистите устаревшие ссылки одним щелчком, чтобы скраперы могли заново
        загрузить изображения. Сами записи об играх при этом никогда не
        затрагиваются.</li>
      <li><strong>Более безопасная автоматическая очистка во время
        скрапинга.</strong> Когда RetroDB заново сканирует игру, он незаметно
        очищает ссылки на медиафайлы, исчезнувшие с диска. Раньше, если целая
        папка с медиафайлами исчезала разом &mdash; например, из-за
        отключённого внешнего диска или массового удаления &mdash; эта очистка
        могла стереть сведения о том, какие изображения были у тысяч игр, что
        приводило к дорогостоящим повторным сканированиям. Теперь RetroDB
        распознаёт этот сигнал: если папка с медиафайлами отсутствует или
        полностью пуста, ссылки сохраняются, а в журнал записывается
        предупреждение вместо их удаления. Новый инструмент обслуживания
        применяет ту же защиту и явно отмечает любую папку, которую он
        сохранил.</li>
    </ul>
- version: 3.16.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Новая панель «Быстрые исправления» на панели управления
  body: |
    <ul>
      <li><strong>Новая панель &ldquo;Быстрые исправления&rdquo; на панели
        управления</strong> превращает разрозненные задачи по обслуживанию
        библиотеки в наглядный список дел. Она показывает, у скольких игр всё
        ещё нет обложки, и предлагает быстрые ссылки для поиска дублирующихся
        ROM-файлов и проверки неработающих путей к ROM-файлам (игр, чьи файлы
        были перемещены или удалены). Каждая ссылка ведёт прямо на страницу,
        где это можно исправить. Панель появляется, как только в вашей
        библиотеке есть игры.</li>
    </ul>
- version: 3.15.0
  date: '2026-07-03'
  tags:
  - type: accessibility
    label: Программы чтения с экрана теперь озвучивают прогресс выполнения задач
  body: |
    <ul>
      <li><strong>Долгие задачи теперь озвучивают свой прогресс для программ
        чтения с экрана.</strong> Во время массового скрапинга, синхронизации
        достижений (RetroAchievements или PlayStation) или изменения размера
        изображений пользователи программ чтения с экрана раньше не слышали
        ничего между &ldquo;начато&rdquo; и &ldquo;завершено&rdquo;. Теперь
        RetroDB объявляет промежуточные этапы (например, &ldquo;Массовый
        скрапинг: 12 из 40&rdquo;) и озвучивает завершение &mdash; без
        дополнительных всплывающих окон на экране. Объявления делаются с
        паузами, чтобы информировать, не создавая лишнего шума, и звучат на
        выбранном вами языке.</li>
    </ul>
- version: 3.14.0
  date: '2026-07-01'
  tags:
  - type: feature
    label: Новые языки — теперь доступен китайский (упрощённый и традиционный)
  body: |
    <ul>
      <li><strong>RetroDB теперь доступен на китайском языке.</strong> Два
        варианта находятся в разделе <strong>Настройки &rarr; Система &rarr;
        Язык</strong>: <strong>中文 (简体)</strong> (упрощённый, для материкового
        Китая) и <strong>中文 (繁體)</strong> (традиционный, для Гонконга и
        Тайваня). Весь интерфейс &mdash; меню, кнопки, сообщения и встроенное
        руководство по использованию &mdash; переведён, а всё, что ещё не
        переведено, незаметно отображается на английском. Это доводит число
        поддерживаемых языков до десяти (английский, немецкий, испанский,
        французский, итальянский, японский, бразильский португальский,
        корейский, а теперь и упрощённый и традиционный китайский).</li>
    </ul>
- version: 3.12.0
  date: '2026-06-30'
  tags:
  - type: feature
    label: Новый язык — теперь доступен корейский (한국어)
  body: |
    <ul>
      <li><strong>RetroDB теперь доступен на корейском языке (한국어).</strong>
        Выберите его в разделе Настройки &rarr; Система &rarr; Язык. Весь
        интерфейс &mdash; меню, кнопки, сообщения и встроенное руководство по
        использованию &mdash; переведён, что доводит число поддерживаемых
        языков до восьми (английский, немецкий, испанский, французский,
        итальянский, японский, бразильский португальский и корейский).
        Корейский язык завершает покрытие всех систем возрастной классификации
        игр, отображаемых RetroDB, включая южнокорейскую GRAC.</li>
    </ul>
- version: 3.11.0
  date: '2026-06-30'
  tags:
  - type: enhancement
    label: Поддержите RetroDB на Patreon — добавлена новая ссылка для пожертвований
  body: |
    <ul>
      <li><strong>Теперь вы можете поддержать RetroDB на Patreon.</strong>
        Ссылка на Patreon расположена рядом с существующей кнопкой
        &ldquo;Sponsor on GitHub&rdquo; в разделе <strong>Настройки &rarr;
        Система &rarr; Поддержать разработку</strong>, в панели «О программе» и
        в файле README проекта. RetroDB остаётся полностью бесплатным и
        открытым проектом &mdash; пожертвования полностью добровольны и просто
        помогают продолжать разработку в одиночку.</li>
    </ul>
- version: 3.10.0
  date: '2026-06-26'
  tags:
  - type: enhancement
    label: Журнал изменений теперь загружается быстрее благодаря кнопке «Загрузить ещё»
  body: |
    <ul>
      <li><strong>Страница журнала изменений теперь открывается намного
        быстрее.</strong> Вместо того чтобы каждый раз отрисовывать всю историю
        выпусков (сотни записей), RetroDB теперь показывает 20 самых последних
        и добавляет внизу кнопку <strong>Загрузить ещё</strong>. Нажмите её,
        чтобы увидеть следующую партию, и так далее &mdash; более старая
        история никуда не делась, она просто загружается по запросу, а не
        замедляет первый показ страницы.</li>
    </ul>
- version: 3.9.0
  date: '2026-06-17'
  tags:
  - type: feature
    label: Руководство пользователя и недавние заметки о выпусках теперь переведены на все 6 языков
  body: |
    <ul>
      <li><strong>Полное встроенное руководство пользователя теперь доступно на
        всех шести языках</strong> &mdash; немецком, французском, испанском,
        итальянском, японском и бразильском португальском &mdash; а не только
        на английском. RetroDB показывает руководство на выбранном вами в
        Настройках языке и незаметно возвращается к английскому, если что-то
        ещё не переведено.</li>
      <li><strong>Этот журнал изменений теперь тоже отображается на вашем
        языке</strong> для самых недавних выпусков, и начиная с этого момента
        новые выпуски будут переводиться. Более старая история остаётся на
        английском.</li>
      <li><strong>Страница списка желаемого и последние оставшиеся фрагменты
        английского текста</strong> &mdash; набор всплывающих сообщений об
        ошибках и статусе, которые были упущены при появлении языковых пакетов
        в версии 3.8.0 &mdash; теперь корректно переводятся во всём
        приложении.</li>
    </ul>
- version: 3.8.2
  date: '2026-06-17'
  tags:
  - type: security
    label: Обновление зависимости безопасности + исправления CI
  body: |
    <ul>
      <li><strong>Безопасность:</strong> обновлена встроенная библиотека
        <code>cryptography</code> (47 → 49), чтобы устранить опубликованную
        уязвимость (GHSA-537c-gmf6-5ccf). Поведение не изменилось &mdash;
        просто более безопасная версия.</li>
      <li>Исправлен автоматизированный конвейер тестирования: отсутствующий
        вспомогательный пакет только для тестов (<code>beautifulsoup4</code>)
        приводил к сбою тестового запуска начиная с версии 3.7.0, а новый
        скрипт сборки пакетов вызывал срабатывание проверки статического
        анализа, которая является известным ложным срабатыванием (он выполняет
        доверенные команды сборки, а не пользовательский ввод) &mdash; теперь
        это задокументировано и откалибровано. Только обслуживание; в самом
        приложении ничего не меняется.</li>
    </ul>
- version: 3.8.1
  date: '2026-06-17'
  tags:
  - type: improvement
    label: Вариант меньшего размера для скачивания, наведение порядка в пожертвованиях и исправление
      перевода (Pass 46.3 / 47.6)
  body: |
    <ul>
      <li><strong>Скоро появится гораздо более лёгкий вариант загрузки.</strong>
        Готовую к запуску версию RetroDB «просто распаковать и запустить»
        теперь можно собрать в варианте <strong>только для процессора</strong>
        (~600&nbsp;МБ) для тех, у кого нет видеокарты AMD &mdash; это примерно
        в шесть раз меньше полной версии. Оба варианта будут предложены
        одновременно, чтобы вы могли выбрать подходящий для вашего
        компьютера.</li>
      <li><strong>Панель «Поддержать разработку» в Настройках теперь
        переводится</strong> вместе с остальным приложением &mdash; она была
        случайно оставлена на английском при появлении языковых пакетов в
        версии 3.8.0.</li>
      <li>Наведён порядок в ссылках для пожертвований (значок GitHub Sponsors в
        README; файл финансирования готов для Patreon и
        Buy&nbsp;Me&nbsp;A&nbsp;Coffee, как только они будут настроены). Никаких
        навязчивых окон, никогда.</li>
      <li>За кулисами: конвейер выпуска теперь может автоматически собирать
        готовые к запуску версии для Windows, macOS и Linux. Примечание:
        объёмное встроенное руководство <em>Помощь</em> пока доступно только на
        английском &mdash; это отмечено как задача на будущее.</li>
    </ul>
- version: 3.8.0
  date: '2026-06-12'
  tags:
  - type: feature
    label: Полный перевод интерфейса + 6 языков (Pass 43.2/43.3/43.5)
  body: |
    <ul>
      <li><strong>RetroDB теперь говорит ещё на 6 языках.</strong> Опираясь на
        основу, заложенную в версии 3.7.0, весь интерфейс стал переводимым и
        был машинно переведён на <strong>немецкий, французский, испанский,
        итальянский, японский и бразильский португальский</strong>. Выберите
        язык в разделе Настройки &rarr; Параметры отображения &rarr; Язык; он
        следует вашим сохранённым настройкам, затем настройкам браузера, а
        затем возвращается к английскому &mdash; он никогда не может застрять
        на отсутствующем языке.</li>
      <li><strong>Охвачено всё, что отображается на экране</strong>: текст
        страниц и кнопки, всплывающие сообщения (небольшие уведомления
        «тост»), диалоговые окна редактирования и настроек, подсказки и
        метки для программ чтения с экрана. Жанры игр, перспективы и режимы
        игры (например, &ldquo;First-Person-Shooter&rdquo;) теперь тоже
        отображаются на вашем языке &mdash; при этом исходные данные остаются
        на английском, поэтому ваша библиотека и фильтры продолжают работать
        точно так же, как раньше.</li>
      <li>Встроенный <strong>&ldquo;Псевдо&rdquo;-язык</strong> (виден в меню
        языка) &mdash; это инструмент контроля качества для переводчиков,
        который заключает в скобки и добавляет диакритику к каждой метке,
        сразу же делая заметным любой пропущенный текст.</li>
      <li>Машинные переводы &mdash; это лишь отправная точка и местами могут
        звучать немного неестественно &mdash; их легко улучшать со временем, а
        любой непереведённый текст просто отображается на английском.</li>
    </ul>
