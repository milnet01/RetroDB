  body: |
    <ul>
      <li><strong>RetroDB готов к собственному игровому плееру.</strong> Для
        RetroDB создаётся плеер на основе RetroArch. Когда он появится,
        RetroDB будет запускать в нём игры с настройками, подобранными для
        каждой игры, и сохранять настройки, которые вы меняете во время
        игры. Свои сохранения и настройки он будет хранить в собственной
        папке, отдельно от вашего RetroArch. Он выбирает лучшее ядро для
        каждой консоли и скачивает его при первом нажатии «Играть»; пока
        идёт загрузка, на кнопке написано «Загрузка ядра…». Он запускает
        игры для любой консоли, у которой нет рабочего эмулятора, и никогда
        не заменяет эмулятор, который вы настроили. Для каждой игры можно
        выбрать другое ядро, экранный эффект, целочисленное масштабирование
        и снижение задержки ввода. Администраторы могут установить или
        обновить все ядра сразу либо отключить загрузки. Пока плеер не
        установлен, ничего не меняется; до тех пор его нет в списке в
        «Настройки» &gt; «Эмуляторы».</li>
      <li><strong>Вкладки «Музея» снова переключаются.</strong> С версии
        3.30.0 на странице консоли в «Музее» нажатие на «Характеристики»,
        «Топ-10 игр» или «Контроллеры» ничего не делало и показывало
        сообщение «Непредвиденная ошибка». Теперь открывается каждая
        вкладка.</li>
      <li><strong>Игры для PlayStation 3, хранящиеся в папке, можно
        запустить.</strong> Дисковая игра для PS3 обычно представляет собой
        папку, имя которой заканчивается на «.PS3». RetroDB отказывался её
        запускать и не показывал кнопку «Играть», потому что ожидал один
        файл. Теперь он передаёт эмулятору папку, как того ожидает
        RPCS3.</li>
      <li><strong>Столбцы «Поиска метаданных» выровнены, и он помещается на
        экране телефона.</strong> У источника, у которого результатов было
        больше, чем помещалось, появлялась полоса прокрутки. Она сужала
        названия, поэтому одно и то же название переносилось в одном столбце
        и не переносилось в соседнем. Теперь у каждого столбца одинаковая
        ширина и тонкая полоса прокрутки в цветах темы. На телефоне или в
        узком окне окно поиска сжималось рядом со скрытой боковой панелью;
        теперь оно занимает весь экран.</li>
      <li><strong>Новая установка на Windows или Mac правильно называет ядра
        RetroArch.</strong> RetroDB везде настраивал RetroArch с именами
        файлов ядер для Linux, поэтому на Windows и macOS ни одно ядро не
        находилось. Новая установка теперь использует имена, принятые на
        каждом компьютере. Существующая установка сохраняет свои имена;
        измените их в таблице соответствий.</li>
      <li><strong>Просмотрщик скриншотов показывает обе стрелки, каждую
        внутри своей кнопки.</strong> Боковая панель закрывала левую
        стрелку, поэтому вернуться к предыдущему скриншоту мышью было
        нельзя. Правая стрелка к тому же находилась ниже своей кнопки.
        Теперь видны обе, по центру своих кнопок.</li>
      <li><strong>Страница настроек «Эмуляторы» показывается на вашем
        языке.</strong> Большая часть «Настройки» &gt; «Эмуляторы» была на
        английском, какой бы язык вы ни выбрали: заголовки, таблица
        эмуляторов, результаты сканирования и окно «Изменить эмулятор».
        Теперь всё это переведено.</li>
      <li><strong>Поле «Игроки» принимает больше 16.</strong> Оба окна
        редактирования останавливались на 16, поэтому нельзя было ввести 256
        игроков MAG. Игру, которой скрапер указал больше 16, вообще нельзя
        было сохранить, пока вы не уменьшали число. Теперь верхнего предела
        нет.</li>
      <li><strong>«Заполнение ИИ» даёт играм для ПК тип сохранения для ПК, а
        не для консоли.</strong> Игра для Windows могла получить «Карта
        памяти», потому что ИИ описывал её версию для PlayStation 2. Теперь
        ИИ просят описывать выпуск для платформы вашей игры. ПК, а также
        консоли начиная с PlayStation 3 и Xbox 360, сохраняют во
        «Внутреннюю память».</li>
      <li>Чтобы исправить игру, у которой уже неверный тип сохранения,
        выполните для неё скрапинг заново или запустите «Заполнение ИИ».
        Оба способа снова спрашивают ИИ и заменяют старое значение.</li>
      <li><strong>Подключение PlayStation сначала просит войти в
        аккаунт.</strong> В «Настройки» &gt; «Учётная запись» &gt; «PSN»
        страница аккаунта Sony показывала только «Invalid login», если вы
        ещё не вошли в PlayStation, а в инструкциях об этом не говорилось.
        Теперь на шаге 1 есть кнопка «Войти в PlayStation», которую нужно
        нажать первой.</li>
      <li><strong>Сортируйте «Библиотеку» и показывайте только необработанные
        игры.</strong> В «Библиотеке» и на странице каждой системы рядом со
        счётчиком игр есть меню «Сортировать по»: название, сначала новые
        или старые по дате выхода, оценка критиков, оценка игроков или
        недавно добавленные. Игры без даты или оценки идут последними.
        Панель A–Z работает при сортировке по названию, а в остальных
        случаях неактивна. Новая кнопка «Не обработано» показывает только те
        игры, которые ещё не заполнил ни один скрапер.</li>
      <li><strong>Фильтр без совпадений так и сообщает.</strong> Раньше
        страница становилась пустой. Теперь на ней написано, что подходящих
        игр нет, и есть кнопка для сброса фильтров.</li>
      <li><strong>Панель фильтров «Библиотеки» держит всё на своих
        местах.</strong> Раньше нажатие «Выбрать», фильтрация или сортировка
        сдвигали игры вниз по странице. Теперь инструменты выбора появляются
        на панели вдоль нижнего края окна. Кнопка «Очистить» есть всегда и
        неактивна, пока не включён фильтр. Активные фильтры показываются
        рядом со счётчиком игр. «Показать бонусы» теперь называется
        «Бонусные диски» и подсвечивается, когда включено. На телефоне
        кнопки фильтров открываются поверх страницы из одной кнопки
        «Фильтры».</li>
      <li><strong>Пустая библиотека показывает приветствие с кнопкой
        сканирования.</strong> Раньше новая установка показывала оценку
        состояния, застывшую на 0%, и пустую «Библиотеку». Теперь обе
        страницы сообщают, что библиотека пуста, и предлагают кнопку
        «Сканировать библиотеку». «Панель управления» также даёт ссылку на
        настройку папки ROM. Пользователям без прав администратора
        предлагается обратиться к администратору. «Случайная игра» скрыта,
        пока не из чего выбирать.</li>
      <li><strong>«Сканировать библиотеку» работает со страницы «Системы» и
        из «Настроек».</strong> Эти две кнопки «Сканировать библиотеку»
        ничего не делали при нажатии. Работала только кнопка на «Панели
        управления». Теперь сама кнопка «Сканировать библиотеку» на «Панели
        управления» видна только администраторам: только им разрешено
        сканировать.</li>
      <li><strong>Мастер настройки показывает, на каком вы шаге и какие шаги
        необязательны.</strong> Он пишет «Шаг 3 из 6», нумерует каждый шаг,
        отмечает галочкой пройденные и помечает ES-DE и «Ключи API» как
        необязательные. На телефоне он показывает номера и название
        текущего шага.</li>
      <li><strong>Фильтруйте «Библиотеку» сразу по нескольким жанрам, сериям
        или издателям.</strong> В фильтрах «Жанр», «Серия», «Издатель»,
        «Разработчик», «Режим игры», «Перспектива» и «Измерение» отметьте
        сколько угодно значений и нажмите «Применить»: игра показывается,
        если у неё есть любое из них. Переключите окно на «НЕТ», чтобы
        скрыть игры, у которых есть любое из отмеченных значений. Каждое
        значение получает свой тег, и его ✕ убирает только это
        значение.</li>
    </ul>
- version: 3.30.0
  date: '2026-10-21'
  tags:
  - type: feature
    label: Одна игра из нескольких регионов показывается одной карточкой
  - type: security
    label: «Заполнение ИИ» и «Инструменты ROM» теперь сложнее использовать во вред
  - type: security
    label: Страницы отказываются выполнять подброшенные в них скрипты
  - type: fix
    label: Скрапинг, задачи «Инструментов ROM», синхронизация трофеев и первоначальная настройка правильно обрабатывают ошибки
  - type: ui
    label: Кнопки окна «О программе» больше не обрезаются
  - type: accessibility
    label: Экранные дикторы читают переключатель Platform Match Required по его видимому названию
  - type: accessibility
    label: Все всплывающие окна одинаково обрабатывают Escape, фокус клавиатуры и экранные дикторы
  - type: performance
    label: Скрапинг завершается быстрее; маленькие изображения увеличиваются в фоне
  - type: feature
    label: Полный повторный скрапинг может сохранить уже имеющиеся медиафайлы
  - type: fix
    label: ScreenScraper находит игры, в названии которых есть подзаголовок
  - type: fix
    label: «Создать M3U» оставляет игру в вашей библиотеке
  - type: fix
    label: Ссылка «Достижения» открывает вашу последнюю систему, а не пустую страницу
  - type: fix
    label: Игры в RetroArch запускаются с рабочей клавиатурой и загружаются на полной скорости
  - type: fix
    label: Игры для C64, Amiga, DOS и других домашних компьютеров получают каждую нажатую клавишу
  - type: fix
    label: В играх для C64 правый стик контроллера нажимает клавиши курсора, а Start нажимает F1
  - type: ui
    label: Боковая панель показывает, что изображения ещё улучшаются в фоне, а более чёткие изображения игры появляются сами
  - type: feature
    label: Инструкции к играм открываются на странице игры и листаются как книга
  - type: docs
    label: В «Справке» перечислены клавиши RetroArch, а у игр для компьютеров с клавиатурой рядом с «Играть» есть напоминание о Scroll Lock
  - type: ui
    label: Импортированные игры без файла ROM больше не предлагают «Играть»
  - type: fix
    label: Удаление скриншота больше не сообщает об ошибке, когда оно удалось
  - type: fix
    label: Запускается тот путь к RetroArch, который задан в строке его эмулятора
  - type: fix
    label: Игра, которая не закрылась, больше не показывается закрытой
  - type: deps
    label: Pillow 13 и другие обновления библиотек
  body: |
    <ul>
      <li><strong>Региональные версии игры показываются как одна игра.</strong>
        Свяжите версии, которые у вас есть (скажем, американский, европейский
        и японский выпуски), и «Библиотека» покажет одну карточку со значком
        &#127760;. Карточка открывает и запускает версию из вашего региона
        по умолчанию. Страница игры перечисляет все версии рядом и позволяет
        переключаться между ними. «Инструменты ROM» &gt; «Региональные
        версии» предлагают группы, которые подтверждают редакторы; без вас
        ничего не связывается. Продолжение никогда не предлагается как
        версия первой игры. Связанные версии больше не считаются дубликатами
        по названию. Запустите один раз «Заполнение альтернативных
        названий», чтобы у предложений было больше данных.</li>
      <li><strong>ИИ может кратко описать, чем различаются региональные
        версии.</strong> В игре со связанными версиями редакторы могут нажать
        «Описать различия с помощью ИИ» в разделе «Региональные версии». ИИ
        перечисляет известные различия, например цензуру, сложность или
        вырезанный контент. Список помечен как написанный ИИ, показывается на
        странице каждой версии и скрывается, когда вы связываете или
        отвязываете версию, пока его не напишут заново. Нужен поставщик ИИ,
        настроенный в «Настройки» &gt; «Скрапинг».</li>
      <li><strong>Игры для PlayStation запускаются с хорошими
        настройками.</strong> Для DuckStation, PCSX2 и RPCS3 RetroDB теперь
        при нажатии «Играть» записывает масштаб разрешения и соотношение
        сторон каждой игры в собственный файл настроек эмулятора для этой
        игры, а также то, запускается ли она в полноэкранном режиме.
        Меняйте их для целой системы кнопкой «Настройки» в «Настройки» &gt;
        «Эмуляторы» или для одной игры на новой панели «Настройки
        эмулятора» на её странице. Настройка, изменённая внутри эмулятора,
        всегда важнее. RetroDB читает серийный номер каждого диска, чтобы
        найти нужный файл; для дисков CHD должен быть установлен
        chdman.</li>
      <li><strong>«Заполнением ИИ» больше нельзя управлять через текст,
        введённый в поля игры.</strong> Когда «Заполнение ИИ» проверяет уже
        указанные у игры издателя, разработчика, издание или другие
        платформы, оно теперь сначала очищает этот текст, так же как уже
        очищало название.</li>
      <li><strong>Проверки «Инструментов ROM» не выходят за пределы вашей
        папки ROM.</strong> «Конвертер CHD» и «Проверка CHD» больше не идут
        по ярлыку (символической ссылке), который ведёт за её пределы, а при
        распаковке многодискового архива любые ярлыки внутри архива
        игнорируются.</li>
      <li><strong>Страницы отказываются выполнять подброшенные в них
        скрипты.</strong> Ваш браузер теперь блокирует любой скрипт, который
        RetroDB не написал сам, поэтому текст, протаскивающий код в название
        игры, тег или полученное скрапингом описание, не может его запустить.
        Кнопки и меню работают как прежде.</li>
      <li><strong>Один испорченный скриншот больше не останавливает поиск
        дубликатов для игры.</strong> Нечитаемый скриншот откладывается, и
        проверка продолжается.</li>
      <li><strong>Задачи «Инструментов ROM» больше не застревают в состоянии
        «выполняется».</strong> Файл, удалённый после проверки «Проверкой
        CHD», считается недействительным, а любая непредвиденная ошибка в
        конвертации CHD, «Проверке CHD» или «Поиске дубликатов» завершает
        задачу как неудачную, с ошибкой в её журнале.</li>
      <li><strong>Пока настройка не завершена, запросы данных приложения
        получают ясный ответ.</strong> Они отвечают «Требуется настройка»
        вместо того, чтобы возвращать страницу настройки. Страницы
        по-прежнему ведут вас в мастер настройки.</li>
      <li><strong>Продолжения больше не показывают достижения первой
        игры.</strong> Сопоставление RetroAchievements не учитывало номер в
        названии, поэтому Donkey Kong Country 2 и 3 связывались с Donkey Kong
        Country. Теперь номера (2, II, 3, III и так далее) учитываются. Чтобы
        исправить уже связанные игры, один раз запустите обновление
        RetroAchievements для всех систем.</li>
      <li><strong>Синхронизация с PlayStation больше не стирает счётчики
        трофеев.</strong> Когда в ответе PlayStation не было общего числа
        трофеев игры, RetroDB записывал нули поверх уже имевшихся значений.
        Теперь он их сохраняет, в том числе при массовом обновлении
        трофеев.</li>
      <li><strong>Открытие набора трофеев, которого больше нет на диске,
        показывает сообщение.</strong> Раньше страница «Трофеи» падала с
        ошибкой; теперь она сообщает, что набор не найден, и возвращает вас
        к списку.</li>
      <li><strong>Таблицы «Инструментов ROM» правильно подписывают столбец
        кнопок на всех языках.</strong> Заголовок столбца совпадал по тексту
        с жанром игр «Экшен», поэтому на некоторых языках там показывалось
        название жанра.</li>
      <li><strong>Для игр GameCube, 3DS и Super Famicom эмулятор
        настраивается автоматически.</strong> RetroDB искал эти системы под
        именами папок, которые библиотеки не используют (gamecube, 3ds,
        superfamicom вместо gc, n3ds, sfc), поэтому Dolphin и Citra никогда
        к ним не привязывались. Перезапустите RetroDB один раз, чтобы это
        вступило в силу.</li>
      <li><strong>Загрузка без Python (автономная) снова настраивает
        эмуляторы.</strong> В ней не было файла со списком эмуляторов.</li>
      <li><strong>Переведено ещё около 170 кнопок, подписей и
        сообщений</strong> на всех языках. Раньше они показывались
        по-английски, а некоторые &mdash; с неверной догадкой (на некоторых
        языках при неудачном запуске игры было написано «резервное
        копирование не удалось»).</li>
      <li><strong>Escape закрывает только верхнее окно.</strong> Когда вопрос
        был открыт поверх другого окна, Escape закрывал оба; некоторые окна
        к тому же продолжали работать после того, как Escape их скрывал, а
        нажатие Escape на странице игры могло возобновить поставленный вами
        на паузу массовый скрапинг. Теперь каждое окно закрывается своим
        собственным действием «Закрыть», удерживает фокус клавиатуры внутри,
        пока открыто, и возвращает фокус кнопке, которая его открыла. Окна
        прогресса выполняющихся задач остаются открытыми до конца
        задачи.</li>
      <li><strong>Графики «Аналитики» &mdash; на вашем языке.</strong>
        Названия жанров, перспектив, измерений и режимов, заголовки
        графиков, названия осей и легенды были на английском на всех
        языках.</li>
      <li><strong>Данные RetroAchievements в большей безопасности.</strong>
        Если список игр RetroAchievements для консоли не загрузился, «RA
        Refresh» теперь оставляет игры этой консоли связанными, а не
        отвязывает их все. «Очистить данные RA» теперь очищает только
        прогресс RetroAchievements; прогресс Steam и Xbox остаётся.</li>
      <li><strong>Пароли везде должны быть не короче 12
        символов.</strong> Первоначальная настройка принимала пароль
        администратора любой длины, а страницы обязательной смены пароля и
        настройки говорили, что хватит 4 символов. Теперь все три требуют
        12, как и остальное приложение.</li>
      <li><strong>Итоги достижений верны и относятся к вам.</strong>
        Синхронизация одной игры с RetroAchievements теперь сохраняет, сколько
        в ней достижений, а не 0. Итоги достижений на панели управления
        учитывают только ваши игры, а «Трофеи коллекционера» больше не
        считают каждое достижение Steam или Xbox дважды.</li>
      <li><strong>Фоновые синхронизации используют ваши собственные
        учётные записи.</strong> Синхронизация системы с RetroAchievements
        входит под вашей учётной записью RetroAchievements, если вы её
        указали. Массовое обновление PlayStation использует ваш сохранённый
        вход, а не входит заново каждый раз.</li>
      <li><strong>Остановить или возобновить вашу синхронизацию можете
        только вы.</strong> Другой пользователь больше не может отменить
        вашу синхронизацию RetroAchievements, Steam или Xbox, а для
        возобновления прерванной задачи нужны те же права, что и для её
        запуска. Администраторы по-прежнему могут и то и другое.</li>
      <li><strong>Папка трофеев RPCS3 проверяется при сохранении.</strong>
        Папка, которой не существует, которая задана не полным путём или
        является системной, отклоняется &mdash; так же, как это уже было в
        основных настройках.</li>
      <li><strong>«Получить все изображения» в «Музее» работает в
        фоне.</strong> Страница больше не ждёт минутами каждое изображение
        контроллера. Она показывает, как далеко продвинулась загрузка, имеет
        кнопку «Отмена» и снова подхватывает прогресс, если вы ушли со
        страницы и вернулись.</li>
      <li><strong>«Инструменты ROM» лучше защищают ваши файлы.</strong>
        «Очистка» больше не опустошает архив: шаблон вроде <code>*</code>
        нельзя сохранить, а «Очистка» останавливается, если шаблоны удалили
        бы все файлы. «Конвертер CHD» сохраняет оригинал, когда «проверка»
        выключена, и не трогает существующий CHD, когда включено «пропускать
        существующие». «Поиск дубликатов» всегда оставляет одну копию каждой
        игры, даже если запрос просит удалить все.</li>
      <li><strong>Задачи «Инструментов ROM» делают то, что написано на
        кнопках.</strong> «Пауза» теперь приостанавливает конвертацию CHD,
        «Проверку CHD», «Поиск дубликатов» и «Удаление дублей скриншотов», а
        приостановленную задачу можно отменить. Проверка «Удаления дублей
        скриншотов», натолкнувшаяся на ошибку, теперь завершается как
        неудачная, а не работает бесконечно.</li>
      <li><strong>«Создать M3U» больше не складывает архивы во временную
        папку.</strong> Перемещённые архивы теперь попадают в собственную
        папку данных RetroDB, которая не очищается при перезапуске. Сканер
        архивов показывает, куда они ушли, а пакетное подтверждение
        предупреждает, что они будут перемещены. Сброс настроек
        «Инструментов ROM» теперь сбрасывает все параметры.</li>
      <li><strong>Меняйте диски из RetroDB.</strong> Пока запущена игра
        RetroArch, начатая из списка дисков .m3u, список &#9654; «Сейчас
        играете» вверху каждой страницы показывает название игры и кнопку
        «Следующий диск», так что игра, которая просит вторую сторону,
        продолжается одним щелчком &mdash; из браузера или с телефона. В
        RetroArch должна быть включена опция Settings &gt; Network &gt;
        Network Commands (порт 55355); если она выключена, кнопка об этом
        скажет.</li>
      <li><strong>Скрипт запуска открывает RetroDB, когда тот готов.</strong>
        start.sh, start.command и start.bat открывали браузер через
        фиксированные 3 секунды, часто ещё до того, как сервер мог ответить,
        и страница не загружалась. Теперь RetroDB открывает её, как только
        сервер начинает принимать подключения. При запуске из
        LocalWebServerManager страница не открывается вовсе; используйте
        кнопку «Открыть» в менеджере.</li>
      <li><strong>Видео игр могут весить до 500 МБ.</strong> Лимит был 50 МБ
        &mdash; слишком мало для большинства трейлеров. Слишком большая
        загрузка теперь показывает сообщение на странице игры, а не заменяет
        страницу простым текстом. Отклонённое видео (слишком большое или
        неподходящего типа) теперь сообщает об этом, а не пропадает
        молча.</li>
      <li><strong>Запуск идёт по заданному вами пути.</strong> Переопределение
        пути к исполняемому файлу в строке RetroArch в «Настройки» &gt;
        «Эмуляторы» теперь важнее пути к RetroArch вверху этой страницы;
        раньше путь из строки игнорировался. Двойное нажатие «Стоп» больше не
        просит игру выйти дважды; в Linux RetroArch понимает второй запрос как
        «выйти без сохранения», и ваше сохранение в игре могло пропасть.
        Настройка запуска, оставшаяся от так и не сделанного удалённого
        режима, больше не мешает запуску всех игр.</li>
      <li><strong>Неудачные действия правильно сообщают об ошибках.</strong>
        Когда не удаётся сохранение, импорт, синхронизация или проверка,
        RetroDB теперь отвечает настоящим статусом ошибки и показывает
        причину в сообщении, а не отвечает так, будто всё получилось.
        Сохранение кода входа PSN, с которым не удаётся подключиться, больше
        не показывает внутренние подробности ошибки. Вход, управление
        пользователями, ваш профиль, достижения, импорт, «Заполнение ИИ» и
        запросы к HowLongToBeat теперь ведут себя так же, а язык, который не
        удалось сохранить, объясняет причину вместо «Ошибка сети».</li>
      <li><strong>Игры с названиями в стиле No-Intro теперь находятся при
        скрапинге.</strong> Название вроде «Legend of Zelda, The» или «Legend
        of Zelda, The - Ocarina of Time» теперь совпадает с результатами «The
        Legend of Zelda», а не отбрасывается фильтром совпадений. «Отчёты по
        ROM» тоже перестают помечать такие названия как несовпадающие.</li>
      <li><strong>Названия, взятые из имён файлов, теряют все свои
        теги.</strong> Составной регион вроде «(USA, Europe)» и «(UK)» теперь
        удаляются. На домашних компьютерах, таких как ZX Spectrum, убирается
        всё начиная с года, так что «Chuckie Egg 2 (UK) (1985) (A'n'F
        Software) (tzx)» становится «Chuckie Egg 2». Имя файла,
        заканчивающееся на «..zip», больше не оставляет лишнюю точку. Поиск
        скраперов, сброс данных игры и предложения «Региональных версий»
        используют эти более чистые названия.</li>
      <li><strong>Неверное название больше не повторяется при повторном
        скрапинге.</strong> Массовый скрапинг теперь ищет по имени файла ROM,
        а не по сохранённому для игры названию. Игра, которая однажды
        совпала не с той игрой, при повторном скрапинге находит
        правильную.</li>
      <li><strong>Скраперы предпочитают ваш регион по умолчанию.</strong>
        Когда два результата равны, теперь побеждает результат из вашего
        региона по умолчанию или World, а не всегда американский. Два
        названия, состоящие только из тегов регионов, больше не считаются
        полным совпадением. «Региональные версии» больше не принимают X в
        «X-Men» за номер продолжения. Выбор версии, которую показывает
        карточка, теперь учитывает только имя файла ROM, а не папки над ним,
        и понимает старые теги вроде «(U)» и «(E)».</li>
      <li><strong>Журнал показывает, на что уходит время скрапинга каждой
        игры.</strong> После каждой игры RetroDB пишет одну строку с
        секундами, потраченными на поиск, в каждом источнике, на загрузку,
        обработку изображений, ИИ и сохранение. Это первый шаг к более
        быстрому скрапингу.</li>
      <li><strong>Скрапинг завершается быстрее: маленькие изображения
        улучшаются потом.</strong> Скрапинг теперь сохраняет игру с
        изображениями в том виде, в каком они загружены. Маленькие обложки и
        скриншоты затем увеличиваются в фоне, по одной игре за раз.
        Дубликаты скриншотов отбрасываются до всей этой работы. Если RetroDB
        остановится на полпути, он продолжит при следующем запуске.</li>
      <li><strong>Читайте инструкцию к игре на её странице.</strong> Кнопка
        «Инструкция» теперь открывает PDF в окне поверх страницы игры.
        Листайте кнопками «Назад» и «Далее», стрелками, Home и End или
        свайпом на телефоне; каждая страница переворачивается как в книге
        или просто сменяется, если ваша система просит меньше анимации.
        «Открыть PDF в новой вкладке» никуда не делась, а Ctrl+щелчок по
        «Инструкции» сразу открывает вкладку.</li>
      <li><strong>Боковая панель показывает, что изображения ещё
        улучшаются.</strong> Пока изображения становятся чётче в фоне, на
        боковой панели написано «Улучшение изображений — осталось игр: N».
        Игра, которая ещё ждёт, сообщает об этом на своей странице, и более
        чёткие изображения появляются там сами, когда готовы. Переключатель
        обложки 2D/3D больше не закрывает эту строку.</li>
      <li><strong>Запасные источники опрашиваются одновременно.</strong> Когда
        основной источник оставляет пробелы, RetroDB теперь опрашивает
        остальные источники все сразу, а не по очереди. Их ответы
        по-прежнему используются в порядке из ваших «Настроек», так что
        каждое поле получает данные от того же источника.</li>
      <li><strong>ES-DE читает свой список игр один раз.</strong> Каждый
        скрапинг, включая массовый, читал gamelist.xml системы ES-DE дважды
        для каждой игры. Теперь RetroDB читает его один раз и перечитывает
        только при изменении файла.</li>
      <li><strong>«Применить» в «Поиске метаданных» больше не ищет
        заново.</strong> На странице игры отмеченные вами результаты берутся
        прямо из их источника, а не ищутся второй раз. Если ничего не
        отмечено, пробелы заполняют только применённый вами источник и
        ИИ.</li>
      <li><strong>ScreenScraper находит игры с подзаголовком.</strong> Он
        ничего не находил для названия вроде «Alone in the Dark: The New
        Nightmare», если перед двоеточием не было пробела. Теперь RetroDB
        ищет именно так, а если всё равно ничего не найдено &mdash; по части
        до двоеточия.</li>
      <li><strong>Игры, в которые нечего запускать, больше не предлагают
        «Играть».</strong> У игры, добавленной импортом из CLZ, Steam, Xbox
        или PSN, нет файла ROM. Её страница теперь не показывает кнопку
        «Играть», «Настройки эмулятора» и раздел «Запуск» при
        редактировании &mdash; как и карточки «Библиотеки».</li>
      <li><strong>Игры в RetroArch защищены от двух плохих
        настроек.</strong> RetroDB теперь при каждом запуске игры даёт
        RetroArch небольшой собственный файл настроек поверх ваших. Он
        настраивает клавиатуру под ваш рабочий стол (Wayland или X11), чтобы
        клавиатура никогда не «умирала», и позволяет перемотке вперёд
        работать на полной скорости, которой игры Commodore 64 пользуются для
        быстрой загрузки. Все остальные ваши настройки RetroArch не
        затрагиваются.</li>
      <li><strong>«Создать M3U» оставляет игру в вашей библиотеке.</strong>
        Когда многодисковый архив превращался в плейлист, игра продолжала
        указывать на архив, который уже был перемещён. Теперь игра указывает
        на новый плейлист и сохраняет свои сведения и изображения. Когда в
        одном архиве несколько выпусков игры, каждый со своим набором дисков,
        плейлист теперь берёт диски первого выпуска, а не все, и сообщает,
        какие диски он пропустил.</li>
      <li><strong>Полный повторный скрапинг может сохранить уже имеющиеся
        медиафайлы.</strong> Отметьте «Сохранить имеющиеся медиафайлы» рядом
        с переключателем «Полный повторный скрапинг». Текстовые сведения
        по-прежнему обновляются, но арт, видео и инструкции, уже лежащие на
        диске, остаются как есть и не загружаются заново. Без этой отметки
        полный повторный скрапинг больше не выбрасывает скриншоты, которые
        были загружены раньше.</li>
      <li><strong>Фоновые задачи больше не теряют и не пропускают
        работу.</strong> Обновление RetroAchievements, споткнувшееся об одну
        плохую игру, больше не выбрасывает уже обновлённые игры.
        Возобновлённая синхронизация или обновление больше не пропускает
        игру, на которой остановились. Возобновлённая синхронизация
        RetroAchievements или Steam из очень старого снимка теперь
        останавливается с сообщением, а не сообщает об успехе, ничего не
        синхронизировав. Конвертация в WebP проверяет оставшийся файл WebP,
        прежде чем ему доверять, и не начинается, если не может узнать
        свободное место на диске.</li>
      <li><strong>Обновление очень старой установки больше не может молча
        потерять данные.</strong> Три старых шага обновления базы данных в
        редких случаях могли терять строки. Теперь они копируют строки или
        останавливаются с понятной ошибкой, а не теряют их.</li>
      <li><strong>Кнопки окна «О программе» больше не обрезаются.</strong>
        Окно стало шире, а его четыре кнопки стоят в два ряда, так что каждая
        подпись видна целиком; на телефоне они идут друг под другом.</li>
      <li><strong>Ваша тема следует за вами в новый браузер.</strong> Вход в
        браузере, которым вы раньше не пользовались, теперь показывает вашу
        сохранённую тему. Раньше страница входа первой записывала Cyberpunk,
        и она оставалась.</li>
      <li><strong>Окно ввода пароля больше не называется «Вход
        администратора».</strong> Каждая учётная запись входит по паролю,
        поэтому окно теперь называется просто «Вход». Страница «Учётная
        запись» и «Справка» говорят то же самое.</li>
      <li><strong>«Справка» актуальна на всех языках.</strong> Переведённые
        страницы «Справки» теперь описывают «Региональные версии», говорят,
        что каждой учётной записи нужен пароль и что ваша тема сохраняется в
        учётной записи. «Справка» на всех языках, включая английский, теперь
        указывает настоящий минимум пароля в 12 символов.</li>
      <li><strong>Мелкие исправления:</strong> фан-арт, в имени файла которого
        есть апостроф, теперь показывается на страницах игр и трофеев;
        «Настройки» больше не показывают ошибку скрипта для учётных записей
        без прав администратора, а экранные дикторы теперь сообщают, какая
        вкладка «Настроек» выбрана; уход со страницы больше не засыпает
        консоль браузера ошибками отменённых запросов; модель увеличения
        изображений сначала загружается с рабочего адреса; а установщик
        больше не падает в Windows, когда его вывод сохраняется в
        файл.</li>
      <li><strong>Большой набор исправлений надёжности.</strong> Сохранение
        игры с пустым названием больше не теряет остальные ваши правки.
        Перезапуск теперь сначала даёт выполняющимся задачам аккуратно
        остановиться. «Создать M3U» отказывается перезаписывать существующий
        плейлист или папку. Очистка списка ненужных файлов в «Инструментах
        ROM» теперь означает «ничего не удалять», а два шаблона больше не
        захватывают настоящие названия ROM вроде «Release of the Dragon».
        Один повреждённый файл трофеев PS3 больше не обнуляет трофеи всех
        игр. «Заполнение ИИ» записывает один регион. «Аналитика» считает
        каждую игру один раз в графике оценок. Импорт CLZ использует
        стандартные названия жанров. В окнах редактирования жанр и другие
        теги можно удалять на всех языках, а сочетания клавиш больше не
        перехватывают Ctrl+D и Ctrl+G. Зрители видят статус прохождения
        игры, но больше не могут его менять, поскольку он общий для
        всех.</li>
      <li><strong>Экранные дикторы читают переключатель Platform Match
        Required по его видимому названию</strong> в «Настройки» →
        «Скрапинг».</li>
      <li>На других языках «Настройки» теперь переводят «Регион по
        умолчанию», а вкладка «Скрапинг» читается как название, а не как
        «идёт скрапинг». Страницы справки используют те же слова.</li>
      <li><strong>Игра, которая не закрылась, больше не показывается
        закрытой.</strong> Если эмулятор пережил «Стоп», RetroDB продолжает
        показывать его запущенным. Отклонённый запуск RetroArch больше не
        записывает перед этим свой файл настроек, а эмулятор, который сразу
        падает, показывает сообщение об ошибке при первой же проверке.</li>
      <li>Обновлённые библиотеки: Pillow 13 (работа с изображениями), numpy
        2.5.4 и onnxruntime 1.31 (увеличение изображений), а также последние
        версии инструментов сборки и выпуска.</li>
      <li>За кулисами: код запуска игр приведён в порядок, чтобы его было
        легче понимать, неиспользуемый код удалён (адрес API, помощник для
        PSN, скрипт трофеев, который не загружала ни одна страница, и
        общесайтовая настройка темы, которую ничто не читало), ответы
        приложения браузеру собираются в одном месте, несколько проектных
        документов исправлены в соответствии с кодом, набор тестов приведён
        в порядок, а новая проверка ловит синтаксическую ошибку JavaScript до
        выпуска. Старые записи списка изменений, описывавшие удалённый код,
        теперь говорят об этом.</li>
    </ul>
- version: 3.29.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Другие названия игры показывают регион, откуда они взяты
  body: |
    <ul>
      <li><strong>Другие названия игры показывают регион, откуда они
        взяты.</strong> Карточка «Другие названия» на странице игры помечает
        каждое название его страной или регионом, например «Япония» для
        «Rockman», на вашем языке. Помеченные названия идут первыми,
        сгруппированные по регионам. Наведите указатель на название, чтобы
        увидеть его источник и примечание, например «Рабочее название».</li>
      <li>Названия из IGDB теперь сохраняют свой регион. Раньше регион был
        только у названий из ScreenScraper.</li>
      <li>Метка «SS» от ScreenScraper больше не показывается как регион. Это
        собственное название игры в ScreenScraper, а не место.</li>
      <li>«Инструменты ROM» → «Заполнение альтернативных названий» теперь
        проверяет каждую игру, прошедшую скрапинг, так что у уже имеющихся
        названий появляются регионы. Запустите его один раз, чтобы пометить
        вашу текущую библиотеку.</li>
    </ul>
- version: 3.28.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Укажите RetroDB папку с эмуляторами, и он их настроит
  - type: fix
    label: Исправления на странице «Настройки» → «Эмуляторы»
  body: |
    <ul>
      <li><strong>Укажите RetroDB папку с эмуляторами, и он их
        настроит.</strong> В «Настройки» → «Эмуляторы» появился новый список
        «Папки эмуляторов». Добавьте папку, где лежат ваши эмуляторы, и
        RetroDB найдёт в ней каждый &mdash; как AppImage, переносной скрипт
        или установленный Flatpak &mdash; и привяжет его к системам, которые
        он запускает. Система, у которой уже есть рабочий эмулятор,
        сохраняет его.</li>
      <li><strong>Смотрите, какие системы готовы к игре.</strong> Таблица
        сопоставления по системам теперь перечисляет эмуляторы каждой
        системы, сообщает, работает ли каждый из них, и позволяет выбрать
        эмулятор системы по умолчанию. Для DuckStation, PCSX2, RPCS3 и
        RetroArch она также сообщает, на месте ли файлы BIOS, и называет
        недостающие. RetroDB только читает файлы BIOS; он никогда их не
        копирует и не загружает.</li>
      <li>Сканирование эмуляторов теперь находит все эмуляторы на большом
        диске с эмуляторами. Раньше оно могло остановиться слишком рано
        внутри собственной папки настроек эмулятора.</li>
      <li>Кнопки «Автоопределение» и «Сохранить» у RetroArch снова работают,
        а окно «Редактировать эмулятор» больше не видно на странице, пока вы
        не нажмёте «Редактировать».</li>
    </ul>
- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Применение метаданных показывает, сколько уже сделано
  body: |
    <ul>
      <li><strong>Применение метаданных показывает, сколько уже
        сделано.</strong> Когда вы выбираете результат в окне «Поиск
        метаданных», кольцо заполняется от 0 до 100 % с процентом в центре, а
        строка под ним сообщает, что происходит: какой сайт сейчас
        опрашивается, какое изображение или видео загружается или что
        изображения обрабатываются. Большая загрузка, например видео, двигает
        кольцо по мере поступления данных. На 100 % страница, как и раньше,
        перезагружается с результатом.</li>
      <li>Кольцо может двигаться неравномерно. Каждый источник решает, сколько
        изображений отправить, только когда отвечает, поэтому первый источник
        с большим числом изображений может заполнить значительную часть
        кольца, а следующие — меньше.</li>
      <li>Если применение не удалось, кольцо закрывается и появляется
        сообщение об этом, без перезагрузки страницы.</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Каждая страница теперь подстраивается под размер окна
  - type: enhancement
    label: Другие названия игры теперь в отдельной карточке на её странице, а также кнопка «Инструкция»
  body: |
    <ul>
      <li><strong>Каждая страница теперь подстраивается под размер окна.</strong>
        Страницы с карточками («Системы», «Музей», «Теги», «Списки»,
        «Инструменты ROM», трофеи и достижения) добавляют столбец, как только
        помещается ещё одна целая карточка, &mdash; до четырёх в ряду. Таблицы,
        инструменты и страницы с подробностями становятся немного шире, но
        останавливаются там, где большая ширина лишь раздвинула бы их столбцы.
        В «Настройках» блоки сохраняют удобную для чтения ширину.</li>
      <li><strong>В «Справке» и списке изменений строки остаются удобной
        длины.</strong> В широком окне ссылки на разделы «Справки» переезжают в
        столбец рядом с текстом; в узком они стоят в один ряд, который можно
        пролистать пальцем, вместо блока, закрывавшего большую часть экрана
        телефона.</li>
      <li><strong>Страница игры:</strong> в широком окне скриншоты идут
        полосой сверху, а под ними рядом стоят видео и новая карточка
        <strong>«Также известна как»</strong> &mdash; на одном уровне с обложкой.
        Другие названия игры раньше были бледным текстом под заголовком; теперь
        они на карточке, которую легко читать. <strong>«Инструкция»</strong> &mdash;
        это кнопка рядом с «Играть», а «История скрапинга» сначала
        свёрнута.</li>
      <li>«Трофеи PSN» показывают от одного до четырёх столбцов в зависимости от
        окна, а не всегда три.</li>
      <li>Несколько страниц больше не прокручиваются вбок на телефоне:
        «Трофеи», «Трофеи коллекционера», страница системы RetroAchievements,
        «Справка», «Настройки», «Аналитика», «Импорт игр», а также страницы
        достижений и трофеев. Широкие таблицы там теперь прокручиваются внутри
        себя.</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Страницы библиотеки, систем и игр теперь подстраиваются под размер окна
  body: |
    <ul>
      <li><strong>Страницы используют широкое окно, когда это полезно, и только тогда.</strong>
        «Библиотека» и каждая страница системы добавляют столбец карточек игр,
        как только помещается ещё одна целая карточка, &mdash; до четырёх в ряду.
        На телефоне видна одна, в окне на пол-экрана &mdash; две или три, в
        широком окне &mdash; четыре. Раньше страницы останавливались на
        фиксированной ширине и оставляли большую часть большого окна
        пустой.</li>
      <li><strong>Страница игры ставит обложку и сведения рядом со
        скриншотами и видео,</strong> когда они помещаются бок о бок, а иначе
        располагает их друг под другом. Описание сохраняет удобную длину
        строки.</li>
      <li><strong>Кнопка «Играть» переехала в правый верхний угол каждой карточки,</strong>
        стала меньше и стоит по центру. Теперь она ещё и проверяет, что файл ROM
        игры на месте и его тип подходит для её системы, поэтому появляется
        только там, где нажатие действительно запустит игру. Она скрывается,
        пока вы выбираете игры для массовых действий.</li>
      <li>Кнопка «Наверх» и всплывающие окна прогресса теперь стоят рядом с
        содержимым страницы, а не у самых краёв окна.</li>
      <li>Страница игры больше не прокручивается вбок на телефоне.</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: Тестовый язык «Pseudo» теперь доступен только администраторам
  body: |
    <ul>
      <li><strong>«Pseudo» больше не виден в списке языков для
        всех.</strong> Это инструмент для разработчиков: он показывает каждое
