- version: 3.24.1
  date: '2026-10-17'
  tags:
  - type: fix
    label: Загрузка для Windows снова устанавливается, и после изменения размера окна нет потока ошибок
  body: |
    <ul>
      <li><strong>Обычную загрузку для Windows не удавалось установить.</strong>
        Установщик останавливался на сообщении «Core dependencies failed to
