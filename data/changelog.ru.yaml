- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Запускайте игру прямо со страниц библиотеки и систем
  body: |
    <ul>
      <li><strong>Кнопка ▶ «Играть» на каждой карточке игры.</strong> Она
        появляется в левом нижнем углу обложки на странице «Библиотека» и на
        каждой странице системы. Нажмите её, и игра запустится в своём
