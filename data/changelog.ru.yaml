  - type: fix
    label: Скриншоты и титульные экраны из ES-DE теперь добавляются в игру, когда ES-DE не является основным источником, если они не совпадают с уже имеющимися
  - type: fix
    label: ES-DE больше не копирует фан-арт, видео или инструкцию, которые уже есть у игры, а Полный повторный скрапинг больше не удаляет обложку, только что скачанную из другого источника
  - type: fix
    label: ES-DE теперь читает запись для собственного ROM-файла игры, поэтому другой релиз с тем же названием не подставит свои данные, а игры PS3 в папках теперь находят свои обложки ES-DE
  - type: fix
    label: Импорт логотипов систем из ES-DE больше не берёт посторонние картинки только потому, что в их названии есть буквы вроде "gb"
  - type: fix
    label: Метка в имени ROM-файла, например (USA), теперь определяет регион. ИИ больше не спрашивается, так как мог указать американскую копию как европейскую или японскую
  - type: feature
    label: Новый инструмент в ROM Tools, Fix Regions from File Names, исправляет игры, которые старые скрапы определили неверно
  - type: fix
    label: Фоновые картинки RAWG больше не сохраняются как обложки, так как часто это скриншоты, мешавшие найти настоящую обложку. Теперь они используются как фан-арт
  - type: feature
    label: Новый инструмент в ROM Tools, Clear RAWG Pictures from Box Art, удаляет картинки, сохранённые старыми скрапами, чтобы скрапинг мог найти настоящие обложки
  - type: feature
    label: RetroDB теперь указывает RAWG со ссылкой на боковой панели, как того просит RAWG
  - type: fix
