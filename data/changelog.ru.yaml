  body: |
    <ul>
      <li><strong>Читы для RetroArch (RetroDB), DuckStation и
        PCSX2.</strong> В разделе «Настройки &gt; Эмуляторы» появился новый
        блок «Читы». Скачайте там бесплатные общедоступные наборы читов или
        импортируйте уже имеющиеся папки с читами; RetroDB копирует файлы и
        никогда не изменяет вашу папку. Затем на странице игры появляется
        список её читов с переключателем вкл./выкл. у каждого, а если читов
        много — ещё и строка поиска. В RetroArch (RetroDB) включённые читы
        применяются при следующем нажатии «Играть», а изменения, сделанные
        в меню RetroArch во время игры, сохраняются. Для DuckStation и
        PCSX2 переключатели сохраняются в собственных настройках эмулятора
        для этой игры, поэтому изменения, сделанные в самом эмуляторе, тоже
        видны на странице. RetroDB никогда не перезаписывает файл читов,
        который уже есть у эмулятора. Включённый чит приостанавливает
        хардкорный режим RetroAchievements.</li>
      <li><strong>Импорт 3D-коробки Slipcase для игры.</strong> На странице
        игры под обложкой есть кнопка «Импорт 3D-коробки». Выберите файл
        <code>.box.json</code>, сохранённый Slipcase, вместе с его
        изображениями, и RetroDB сохранит для этой игры лицевую сторону,
        корешок, заднюю и остальные стороны коробки. Slipcase 1.4.0 или новее сохраняет этот файл рядом с каждым экспортированным изображением. Ваша 3D-обложка не
        меняется. Если у игры уже есть стороны, перед заменой появится
        вопрос, а кнопка «Удалить» их удаляет.</li>
      <li><strong>Вращайте 3D-коробку игры, как в руках.</strong> Нажмите
        на обложку игры с импортированной коробкой Slipcase, и коробка
        появится в 3D. Перетаскивайте её или используйте клавиши со
        стрелками, чтобы повернуть и увидеть корешок, заднюю сторону, верх
        и низ. Прокрутите колесо или нажмите + и -, чтобы изменить масштаб;
        дважды щёлкните или нажмите Home, чтобы вернуть как было. Игра без
        импортированной коробки по-прежнему увеличивает картинку
        обложки.</li>
      <li><strong>В «Настройках» есть ссылка на страницу
        «Эмуляторы».</strong> На страницу «Эмуляторы» нигде в «Настройках»
        не было ссылки, и попасть туда можно было, только введя её адрес.
        Теперь администраторы видят вкладку «Эмуляторы» после «Системы», а
        на странице «Эмуляторы» показана та же панель вкладок, так что
        остальные вкладки в одном щелчке.</li>
      <li><strong>Увеличенная обложка больше не прячется за меню.</strong>
        На телефоне верхняя и нижняя панели закрывали увеличенную обложку и
        её кнопку закрытия, а на компьютере боковая панель закрывала её
        левую часть. Теперь увеличение открывается поверх всего.</li>
      <li><strong>Модели Claude 5.5 для ИИ.</strong> Настройки &gt; Скрапинг показывает новейшие модели Claude от Anthropic: Haiku 5.5 — новую модель по умолчанию и самую дешёвую, Sonnet 5.5 и Opus 5.5, с текущими ценами. RetroDB больше не отправляет параметр, который Sonnet 5.5 отклоняет.</li>
      <li><strong>Продажи игры можно ввести вручную.</strong> В обоих окнах редактирования под полем «Разработчик» есть поле «Продано копий». Введённое число показывается на странице игры, как и найденное ИИ. Очистите поле, чтобы убрать его.</li>
      <li><strong>Проверка ключа ИИ в настройках.</strong> В разделе Настройки &gt; Скрапинг под поставщиком ИИ есть кнопка «Проверить сохранённый ключ ИИ». Она показывает, работает ли ключ, а если нет — почему: ключ отклонён, нет средств или достигнут лимит. Раньше отклонённый ключ выглядел рабочим.</li>
      <li><strong>Claude может искать в интернете данные о продажах.</strong> В разделе Настройки &gt; Скрапинг под моделью Claude есть переключатель «Разрешить Claude искать в интернете», сначала выключенный. Без поиска Claude отвечает по тому, что уже знает, и оставляет поле «Продано копий» пустым. Если переключатель включён, Claude находит цифры. Anthropic берёт плату за каждый поиск, поэтому Заполнение ИИ делает не больше 5 поисков на игру, до 5 центов США; выключите переключатель перед большим массовым скрапингом.</li>
      <li><strong>Заполнение ИИ для целой системы сразу.</strong> В разделе Инструменты ROM появилась страница Массовое заполнение ИИ, на которой также находятся Официальные названия. Выберите систему или «Все системы», включите нужные поля и нажмите «Заполнить с ИИ»: RetroDB запускает Заполнение ИИ для каждой игры, так же как кнопка Заполнение ИИ на странице игры, и сразу сохраняет ответы в игре. Индикатор выполнения и уведомление Заполнения ИИ показывают, как далеко продвинулось дело, а пока оно идёт, страницу можно покинуть. Перед запуском RetroDB показывает, сколько игр будет заполнено, и спрашивает подтверждение, потому что ваш поставщик ИИ берёт плату за каждую игру. Игры, которые уже прошли Заполнение ИИ, пропускаются, пока вы не включите их обратно, а запуск сам останавливается, если ИИ перестаёт отвечать.</li>
      <li><strong>Уведомления о задачах берут цвета вашей темы.</strong> Окна, показывающие выполняемую задачу, например Массовый скрапинг и RA Sync, и индикаторы выполнения теперь используют цвета выбранной темы. Задача, которую нельзя приостановить, больше не показывает заголовок цветом паузы.</li>
      <li><strong>Страница «Эмуляторы» выглядит как другие вкладки настроек.</strong> Настройки &gt; Эмуляторы теперь разбиты на карточки, а полоса под вкладками переходит к каждой из них: RetroArch, Игра в RetroDB, Ядра, Читы, Папки, Эмуляторы и Привязка. Полоса остаётся вверху при прокрутке и отмечает раздел, в котором вы находитесь.</li>
      <li><strong>Ход загрузки рядом с кнопкой.</strong> Когда вы загружаете RetroArch, ядра плеера или пакет читов, заметка рядом с кнопкой показывает в процентах, насколько продвинулась загрузка. Раньше под кнопками появлялась строка и сдвигала остальную часть страницы вниз.</li>
      <li><strong>Выбор эмулятора для каждой системы из списка.</strong> Привязка к системам в разделе Настройки &gt; Эмуляторы теперь показывает каждую систему один раз, со списком связанных с ней эмуляторов. Выбранный эмулятор кнопка «Играть» использует для игр этой системы, если у игры не задан свой. Эмулятор, который RetroDB не может найти, отмечен как «не найден». Раньше у каждой системы было по строке на эмулятор, с маленькой точкой для выбора эмулятора по умолчанию. Собственный RetroArch от RetroDB теперь есть в списке каждой указанной системы, которую он может запускать, включая системы, где пока нет игр.</li>
      <li><strong>Кнопка «Обзор» у каждого поля пути.</strong> Администраторы теперь могут выбрать папку или программу, переходя по папкам компьютера, вместо того чтобы вводить путь: Настройки &gt; Эмуляторы, Библиотека, Скрапинг и Учётная запись, а также настройки раздела «Инструменты ROM». Поля, где нужна программа, показывают и файлы. Скрытые папки, например <code>.config</code>, идут в конце списка.</li>
      <li><strong>Левый стик работает как D-Pad в RetroArch от RetroDB.</strong> В играх для систем без стика, таких как NES или Mega Drive, теперь можно двигаться и левым стиком, и D-Pad. Когда ядро эмулятора игры само считывает стик, как на Nintendo 64, стик остаётся настоящим стиком.</li>
      <li><strong>Вход в RetroAchievements из настроек.</strong> Настройки &gt; Учётная запись теперь позволяет войти для RetroArch от RetroDB, чтобы достижения открывались во время игры без входа внутри эмулятора. Пароль передаётся только RetroAchievements и не сохраняется. У каждого пользователя RetroDB свой вход и свой переключатель Хардкорного режима, который изначально выключен. DuckStation и PCSX2 по-прежнему входят через собственные меню.</li>
      <li><strong>Видно, какой эмулятор использует «Играть».</strong> На странице игры рядом с кнопкой «Играть» теперь указано «Запускается в:» и название эмулятора либо сообщается, что эмулятор не настроен.</li>
      <li><strong>Панель «Читы» объясняет, почему у игры нет читов.</strong> Если эмулятор игры не может использовать читы, панель теперь называет причину, а не остаётся скрытой.</li>
      <li><strong>Длинные пути к папкам помещаются на экране телефона.</strong> Длинный путь к папке в настройках больше не заставляет страницу прокручиваться вбок.</li>
    </ul>
