  body: |
    <ul>
      <li><strong>RetroDB готов к собственному игровому плееру.</strong> Для
        RetroDB создаётся плеер на основе RetroArch. Когда он появится,
        RetroDB будет запускать в нём игры с настройками, подобранными для
        каждой игры, и сохранять настройки, которые вы меняете во время
        игры. Свои сохранения и настройки он будет хранить в собственной
        папке, отдельно от вашего RetroArch. Он выбирает лучшее ядро для
        каждой консоли и скачивает его при первом нажатии «Играть»; пока
        идёт загрузка, на кнопке написано «Загрузка ядра…». Он запускает
        игры для любой консоли, у которой нет рабочего эмулятора, и никогда
        не заменяет эмулятор, который вы настроили. Для каждой игры можно
        выбрать другое ядро, экранный эффект, целочисленное масштабирование
        и снижение задержки ввода. Администраторы могут установить или
        обновить все ядра сразу либо отключить загрузки. Пока плеер не
        установлен, ничего не меняется; до тех пор его нет в списке в
        «Настройки» &gt; «Эмуляторы».</li>
      <li><strong>Вкладки «Музея» снова переключаются.</strong> С версии
        3.30.0 на странице консоли в «Музее» нажатие на «Характеристики»,
        «Топ-10 игр» или «Контроллеры» ничего не делало и показывало
        сообщение «Непредвиденная ошибка». Теперь открывается каждая
        вкладка.</li>
      <li><strong>Игры для PlayStation 3, хранящиеся в папке, можно
        запустить.</strong> Дисковая игра для PS3 обычно представляет собой
        папку, имя которой заканчивается на «.PS3». RetroDB отказывался её
        запускать и не показывал кнопку «Играть», потому что ожидал один
        файл. Теперь он передаёт эмулятору папку, как того ожидает
        RPCS3.</li>
      <li><strong>Столбцы «Поиска метаданных» выровнены, и он помещается на
        экране телефона.</strong> У источника, у которого результатов было
        больше, чем помещалось, появлялась полоса прокрутки. Она сужала
        названия, поэтому одно и то же название переносилось в одном столбце
        и не переносилось в соседнем. Теперь у каждого столбца одинаковая
        ширина и тонкая полоса прокрутки в цветах темы. На телефоне или в
        узком окне окно поиска сжималось рядом со скрытой боковой панелью;
        теперь оно занимает весь экран.</li>
      <li><strong>Новая установка на Windows или Mac правильно называет ядра
        RetroArch.</strong> RetroDB везде настраивал RetroArch с именами
        файлов ядер для Linux, поэтому на Windows и macOS ни одно ядро не
        находилось. Новая установка теперь использует имена, принятые на
        каждом компьютере. Существующая установка сохраняет свои имена;
        измените их в таблице соответствий.</li>
      <li><strong>Просмотрщик скриншотов показывает обе стрелки, каждую
        внутри своей кнопки.</strong> Боковая панель закрывала левую
        стрелку, поэтому вернуться к предыдущему скриншоту мышью было
        нельзя. Правая стрелка к тому же находилась ниже своей кнопки.
        Теперь видны обе, по центру своих кнопок.</li>
      <li><strong>Страница настроек «Эмуляторы» показывается на вашем
        языке.</strong> Большая часть «Настройки» &gt; «Эмуляторы» была на
        английском, какой бы язык вы ни выбрали: заголовки, таблица
        эмуляторов, результаты сканирования и окно «Изменить эмулятор».
        Теперь всё это переведено.</li>
      <li><strong>Поле «Игроки» принимает больше 16.</strong> Оба окна
        редактирования останавливались на 16, поэтому нельзя было ввести 256
        игроков MAG. Игру, которой скрапер указал больше 16, вообще нельзя
        было сохранить, пока вы не уменьшали число. Теперь верхнего предела
        нет.</li>
      <li><strong>«Заполнение ИИ» даёт играм для ПК тип сохранения для ПК, а
        не для консоли.</strong> Игра для Windows могла получить «Карта
        памяти», потому что ИИ описывал её версию для PlayStation 2. Теперь
        ИИ просят описывать выпуск для платформы вашей игры. ПК, а также
        консоли начиная с PlayStation 3 и Xbox 360, сохраняют во
        «Внутреннюю память».</li>
      <li>Чтобы исправить игру, у которой уже неверный тип сохранения,
        выполните для неё скрапинг заново или запустите «Заполнение ИИ».
        Оба способа снова спрашивают ИИ и заменяют старое значение.</li>
      <li><strong>Подключение PlayStation сначала просит войти в
        аккаунт.</strong> В «Настройки» &gt; «Учётная запись» &gt; «PSN»
        страница аккаунта Sony показывала только «Invalid login», если вы
        ещё не вошли в PlayStation, а в инструкциях об этом не говорилось.
        Теперь на шаге 1 есть кнопка «Войти в PlayStation», которую нужно
        нажать первой.</li>
      <li><strong>Сортируйте «Библиотеку» и показывайте только необработанные
        игры.</strong> В «Библиотеке» и на странице каждой системы рядом со
        счётчиком игр есть меню «Сортировать по»: название, сначала новые
        или старые по дате выхода, оценка критиков, оценка игроков или
        недавно добавленные. Игры без даты или оценки идут последними.
        Панель A–Z работает при сортировке по названию, а в остальных
        случаях неактивна. Новая кнопка «Не обработано» показывает только те
        игры, которые ещё не заполнил ни один скрапер.</li>
      <li><strong>Фильтр без совпадений так и сообщает.</strong> Раньше
        страница становилась пустой. Теперь на ней написано, что подходящих
        игр нет, и есть кнопка для сброса фильтров.</li>
      <li><strong>Панель фильтров «Библиотеки» держит всё на своих
        местах.</strong> Раньше нажатие «Выбрать», фильтрация или сортировка
        сдвигали игры вниз по странице. Теперь инструменты выбора появляются
        на панели вдоль нижнего края окна. Кнопка «Очистить» есть всегда и
        неактивна, пока не включён фильтр. Активные фильтры показываются
        рядом со счётчиком игр. «Показать бонусы» теперь называется
        «Бонусные диски» и подсвечивается, когда включено. На телефоне
        кнопки фильтров открываются поверх страницы из одной кнопки
        «Фильтры».</li>
      <li><strong>Пустая библиотека показывает приветствие с кнопкой
        сканирования.</strong> Раньше новая установка показывала оценку
        состояния, застывшую на 0%, и пустую «Библиотеку». Теперь обе
        страницы сообщают, что библиотека пуста, и предлагают кнопку
        «Сканировать библиотеку». «Панель управления» также даёт ссылку на
        настройку папки ROM. Пользователям без прав администратора
        предлагается обратиться к администратору. «Случайная игра» скрыта,
        пока не из чего выбирать.</li>
      <li><strong>«Сканировать библиотеку» работает со страницы «Системы» и
        из «Настроек».</strong> Эти две кнопки «Сканировать библиотеку»
        ничего не делали при нажатии. Работала только кнопка на «Панели
        управления». Теперь сама кнопка «Сканировать библиотеку» на «Панели
        управления» видна только администраторам: только им разрешено
        сканировать.</li>
      <li><strong>Мастер настройки показывает, на каком вы шаге и какие шаги
        необязательны.</strong> Он пишет «Шаг 3 из 6», нумерует каждый шаг,
        отмечает галочкой пройденные и помечает ES-DE и «Ключи API» как
        необязательные. На телефоне он показывает номера и название
        текущего шага.</li>
      <li><strong>Фильтруйте «Библиотеку» сразу по нескольким жанрам, сериям
        или издателям.</strong> В фильтрах «Жанр», «Серия», «Издатель»,
        «Разработчик», «Режим игры», «Перспектива» и «Измерение» отметьте
        сколько угодно значений и нажмите «Применить»: игра показывается,
        если у неё есть любое из них. Переключите окно на «НЕТ», чтобы
        скрыть игры, у которых есть любое из отмеченных значений. Каждое
        значение получает свой тег, и его ✕ убирает только это
        значение.</li>
    </ul>
