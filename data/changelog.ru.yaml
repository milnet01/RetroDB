  body: |
    <ul>
      <li><strong>RetroDB обновляется сам.</strong> Когда выходит новая
        версия, администраторы видят её на «Панели управления» и в «Настройки»
        &gt; «Система» &gt; «Обновления» вместе со списком изменений. «Скачать
        обновление» загружает её и проверяет, что это в точности
        опубликованный файл; «Установить и перезапустить» создаёт резервную
        копию базы данных, ставит новую версию на место и перезапускает
        RetroDB. Если новая версия не запускается, RetroDB сам возвращается к
        старой и сообщает причину. Ваши игры, настройки, изображения и журналы
        не затрагиваются. RetroDB проверяет обновления раз в день; это можно
        отключить. Копия, запущенная из git или менеджером процессов, получает
        уведомления об обновлениях, но не обновляется.</li>
      <li><strong>RetroArch можно получить прямо из RetroDB.</strong> В
        «Настройки» &gt; «Эмуляторы» появился новый раздел «Игра в RetroDB».
        Нажмите «Получить RetroArch», и RetroDB скачает официальный RetroArch
        с libretro, проверит, что загрузка в точности совпадает с ожидаемым
        файлом, и настроит его как RetroArch (RetroDB) с собственными
        настройками и сохранениями, отдельно от RetroArch, которым вы уже
        пользуетесь. Затем при первом запуске игры он скачивает лучшее ядро
        для каждой системы. Работает в Linux и Windows; macOS пока не
        проверялась.</li>
      <li><strong>«Следующий диск» работает в играх, запущенных в
        RetroDB.</strong> В многодисковой игре кнопка «Следующий диск» теперь
        доходит до собственного RetroArch в RetroDB без какой-либо настройки.
        RetroArch принимает команды RetroDB только пока запущена такая игра, а
        в Windows и macOS — пока запущена любая игра.</li>
      <li><strong>Карточки игр выстраиваются ровно на телефоне и после
        изменения размера окна.</strong> На телефоне страницы «Библиотеки» и
        консолей показывали одну карточку, а затем длинный пустой промежуток;
        теперь карточки идут одна под другой. Если сделать окно уже или шире,
        карточки перестраиваются, а не остаются в старых столбцах.</li>
      <li><strong>Оценки и число игроков при скрапинге точнее.</strong>
        Возрастные рейтинги из IGDB для CERO, USK, GRAC, ClassInd и ACB теперь
        читаются правильно, так что игра с рейтингом CERO Z или USK 18
        получает этот рейтинг. TheGamesDB, RAWG, IGDB и ES-DE больше не
        угадывают «1 игрок», когда не знают; импорт из ES-DE больше не
        перезаписывает заданные вами число игроков или режимы игры. TheGamesDB
        больше не сохраняет число вместо имени издателя или разработчика после
        неудачного поиска.</li>
      <li><strong>ScreenScraper сохраняет свои данные, когда он основной
        источник.</strong> Его название, описание, дата, разработчик, издатель
        и число игроков сохраняются при каждом скрапинге, а не только в первые
        несколько минут после поиска. Скачанные видео и руководства получают
        нормальное имя файла.</li>
      <li><strong>Очистка данных скрапинга возвращает имя файла в качестве
        названия.</strong> Раньше она стирала сведения, но оставляла название,
        полученное скрапингом.</li>
      <li><strong>Обновление RetroAchievements для одной консоли снова
        работает.</strong> Каждый раз оно завершалось ошибкой.</li>
      <li><strong>Поиск дубликатов скриншотов работает в скачанном
        приложении.</strong> Там он не находил ни одного скриншота, а удаление
        дубликата оставляло файл на диске.</li>
      <li><strong>Пароли ScreenScraper скрыты, а последний администратор
        остаётся администратором.</strong> «Настройки» теперь показывают ваши
        пароли ScreenScraper скрытыми, как и другие ключи. Единственную
        учётную запись администратора больше нельзя переключить на редактора
        или отключить — иначе никто не смог бы управлять RetroDB.</li>
      <li><strong>Прерванные задания предлагаются только тем, кому разрешено
        их запускать.</strong> Баннер прерванного задания на «Панели
        управления» теперь показывает задание только тому, кто может его
        запустить, например массовый скрапинг — только редакторам и
        администраторам. Другие учётные записи его больше не видят и не могут
        закрыть.</li>
      <li><strong>Импортированные логотипы консолей, необычные имена в
        «Настройках» и бонусные диски.</strong> В скачанном приложении
        обновление логотипов теперь находит логотипы консолей, добавленные
        импортом из ES-DE, и предпочитает их встроенным. Имя контроллера,
        консоли или резервной копии с символами вроде &lt; или кавычки больше
        не ломает страницу «Настройки». Снятие отметки бонусного диска
        полностью отсоединяет его, так что он больше не считается бонусным
        диском своей прежней игры.</li>
      <li><strong>Быстрее трофеи, импорт библиотек и инструменты
        обслуживания.</strong> Страница «Трофеи», импорт библиотек Steam, Xbox
        и PlayStation, трофеи коллекционера, подсчёт занятого места и поиск
        неиспользуемых медиафайлов выполняют гораздо меньше работы на большой
        библиотеке. Окна прогресса заданий продолжают обновляться, когда
        сервер занят, а задания HowLongToBeat и альтернативных названий больше
        не задерживают другие изменения во время работы.</li>
      <li><strong>Как каждая игра PS3 работает в RPCS3.</strong> Игры PS3 в
        «Библиотеке», на странице PlayStation 3 и на странице игры показывают
        статус совместимости RPCS3: «Играбельно», «В игре», «Заставка»,
        «Загружается» или «Не работает», с датой последней проверки. RetroDB
        берёт его из RPCS3 на вашем компьютере, поэтому в RPCS3 один раз
        выберите Manage &gt; Databases &gt; Download Compatibility Database и
        повторяйте это, когда захотите более свежих результатов. Показываются
        только игры с ROM на диске; импортированные игры — нет. RetroDB теперь
        также читает идентификатор игры из папок PSN и установленных игр, а
        также из папок и файлов, в имени которых он есть, например
        [BLUS30443].</li>
      <li><strong>Данные о продажах ваших игр.</strong> Когда ИИ заполняет
        пробелы при скрапинге и когда вы нажимаете «Заполнение ИИ», у него
        теперь также спрашивают, сколько копий игры продано на её консоли, по
        бесплатным опубликованным данным: отчётам издателя, спискам
        бестселлеров платформ, Famitsu, Википедии и VGChartz. Страница игры
        показывает это число. У игры без опубликованных данных поле остаётся
        пустым, а не заполняется догадкой.</li>
      <li><strong>Переключатель «Франшиза / серия» работает на странице
        игры.</strong> В окне редактирования на странице игры нажатие на
        переключатель «Франшиза / серия» у игры с отметкой «Отдельная игра»
        ничего не делало, так что её нельзя было включить в серию. Теперь он
        переключается, как и переключатель «Доступность на платформах».</li>
      <li><strong>Все вкладки «Достижений» одной ширины.</strong>
        RetroAchievements, RPCS3, PSN, Steam и Xbox подгоняли страницу под
        свои карточки, поэтому ширина страницы менялась при переходе между
        вкладками. Теперь у них одна общая ширина.</li>
      <li><strong>RetroDB находит настройки RPCS3 в Windows и macOS.</strong>
        В Windows RPCS3 хранит настройки рядом с rpcs3.exe, и RetroDB теперь
        ищет там и в портативной папке, так что настройки отдельных игр и
        список совместимости находятся.</li>
      <li><strong>«Заполнение ИИ» работает для игр с оценкой, но без
        возрастного рейтинга.</strong> Для такой игры «Заполнение ИИ» могло
        завершиться ошибкой при определении возрастного рейтинга.</li>
      <li><strong>Подписи на карточках игр на вашем языке.</strong> Статус
        прохождения и подсказки оценок на карточках «Библиотеки» всегда были
        на английском.</li>
      <li><strong>Даты выхода для каждого региона.</strong> Когда ИИ заполняет
        пробелы при скрапинге и когда вы нажимаете «Заполнение ИИ», у него
        теперь также спрашивают дату выхода игры в каждом регионе, например в
        Северной Америке, Европе и Японии. Страница игры и быстрый просмотр
        показывают их начиная с самой ранней, с датами и названиями регионов
        на вашем языке. Собственная дата выхода игры не меняется.</li>
      <li><strong>Предыдущая и следующая игра на странице игры.</strong> Рядом
        с путём вверху страницы игры есть ссылки «Назад» и «Далее» и позиция
        игры в списке. Они следуют за страницей, с которой вы пришли: если
        игра открыта из «Библиотеки», они листают «Библиотеку», а если со
        страницы консоли — эту консоль, в том же порядке и с теми же фильтрами
        и поиском, что были там.</li>
      <li><strong>Загруженные обложки и скриншоты обрабатываются так же, как
        полученные скрапингом.</strong> Обложка, 3D-коробка или скриншот,
        загруженные в окне редактирования, теперь сохраняются в том же формате
        изображения, что и полученные скрапингом, уменьшаются до того же
        размера, а для обложек создаются уменьшенные копии, которые использует
        «Библиотека». Скриншот, который выглядит так же, как уже имеющийся у
        игры, не добавляется, и вам сообщают, сколько пропущено. Загрузка
        новой обложки также удаляет файл, который она заменяет.</li>
      <li><strong>RetroAchievements показываются на странице каждой игры, у
        которой они есть.</strong> У некоторых игр был значок RA в
        «Библиотеке», но не было карточки RetroAchievements на их странице,
        например у Metroid Prime и Metroid Prime 2 на GameCube. Страница
        теперь использует ту же ссылку RetroAchievements, что и значок, и
        загружается быстрее, потому что больше не обращается к
        RetroAchievements каждый раз.</li>
      <li><strong>Число необработанных игр на странице «Системы» совпадает с
        фильтром «Не обработано».</strong> В счётчик входили бонусные диски,
        которые список игр консоли никогда не показывает, так что у консоли
        могло значиться 2 необработанные игры, хотя её фильтр «Не обработано»
        не показывал ни одной.</li>
      <li><strong>Страницы «Библиотеки» и систем обновляются на лету во время
        массового скрапинга.</strong> Карточка каждой игры обновляется сразу
        после её скрапинга, независимо от того, открыто окно массового
        скрапинга, закрыто или работает в фоне.</li>
      <li><strong>«Заполнение ИИ» даёт каждой игре её официальное
        название.</strong> Когда ИИ заполняет пробелы — при скрапинге одной
        игры, при массовом скрапинге и кнопкой «Заполнение ИИ», — он также
        называет официальное название игры, под которым она вышла в регионе её
        ROM, и игра переименовывается. Старое название сохраняется как
        альтернативное. Название, которое вы ввели сами или приняли в
        «Официальных названиях», никогда не переименовывается.</li>
      <li><strong>«Официальные названия» снова предлагают названия.</strong> С
        OpenAI, а иногда и с Gemini ответы ИИ не удавалось прочитать, поэтому
        поиск заканчивался без предложенных названий.</li>
      <li><strong>Источники опрашиваются только для систем, которые они
        охватывают.</strong> В RAWG нет игр для Intellivision, поэтому он
        больше не опрашивается для них; раньше он находил вместо них игры с
        других платформ. IGDB, TheGamesDB и RAWG теперь всегда ищут в
        собственной системе игры. Также исправлено несколько неверных привязок
        платформ RAWG (Atari ST, ColecoVision, PC Engine, DOS).</li>
      <li><strong>Кольцо прогресса скрапинга больше не откатывается
        назад.</strong> После нескольких поисков в окне «Поиск метаданных»
        одно нажатие «Применить» запускало скрапинг несколько раз, и кольцо
        прыгало между ними.</li>
      <li><strong>У увеличенной 3D-коробки нет квадрата позади.</strong>
        Коробка лежит прямо на затемнённом фоне.</li>
      <li><strong>Сообщения больше не показывают HTML-код.</strong> Некоторые
        окна подтверждений и результатов в «Инструментах ROM» показывали теги
        вроде &lt;br&gt; вместо переносов строк. «Просмотр журнала» и выбор
        родительской игры для бонусного диска в «Настройках» снова
        работают.</li>
    </ul>
