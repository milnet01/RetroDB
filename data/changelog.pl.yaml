  body: |
    <ul>
      <li><strong>Kody do RetroArch (RetroDB), DuckStation i
        PCSX2.</strong> W Ustawienia &gt; Emulatory jest nowa sekcja Kody.
        Pobierz tam darmowe, publiczne paczki kodów albo zaimportuj foldery
        z kodami, które już masz; RetroDB kopiuje pliki i nigdy nie zmienia
        Twojego folderu. Strona gry pokazuje wtedy jej kody, każdy z
        przełącznikiem wł./wył., a gdy jest ich dużo, także pole
        wyszukiwania. W RetroArch (RetroDB) włączone kody zadziałają, gdy
        następnym razem naciśniesz Graj, a zmiany wprowadzone w menu
        RetroArch w trakcie gry zostają zachowane. W DuckStation i PCSX2
        przełączniki są zapisywane we własnych ustawieniach emulatora dla
        danej gry, więc zmiany wprowadzone w samym emulatorze też widać na
        stronie. RetroDB nigdy nie nadpisuje pliku kodów, który emulator już
        ma. Włączony kod wstrzymuje tryb hardcore RetroAchievements.</li>
      <li><strong>Zaimportuj pudełko 3D ze Slipcase do gry.</strong> Strona
        gry ma pod okładką przycisk Importuj pudełko 3D. Wybierz plik
        <code>.box.json</code> zapisany przez Slipcase razem z jego obrazami,
        a RetroDB zachowa dla tej gry przód, grzbiet, tył i pozostałe ścianki
        pudełka. Slipcase 1.4.0 lub nowszy zapisuje ten plik obok każdego wyeksportowanego obrazu. Twoja okładka 3D się nie zmienia. Gdy gra ma już ścianki,
        RetroDB zapyta przed ich zastąpieniem, a Usuń je kasuje.</li>
      <li><strong>Obracaj pudełko 3D gry jak w dłoniach.</strong> Kliknij
        okładkę gry z zaimportowanym pudełkiem Slipcase, a pudełko pojawi się
        w 3D. Przeciągnij je lub użyj klawiszy strzałek, aby je obrócić i
        zobaczyć grzbiet, tył, górę i spód. Przewiń lub naciśnij + i -, aby
        powiększyć; kliknij dwukrotnie lub naciśnij Home, aby je przywrócić.
        Gra bez zaimportowanego pudełka nadal powiększa swoją okładkę.</li>
      <li><strong>Ustawienia prowadzą do strony Emulatory.</strong> Strona
        Emulatory nie miała linku nigdzie w Ustawieniach, więc można było na
        nią wejść tylko, wpisując jej adres. Administratorzy widzą teraz
        zakładkę Emulatory po zakładce System, a strona Emulatory pokazuje
        ten sam pasek zakładek, więc pozostałe zakładki są o jedno kliknięcie
        dalej.</li>
      <li><strong>Powiększenie okładki nie chowa się już za menu.</strong> Na
        telefonie górny i dolny pasek zasłaniały powiększoną okładkę i jej
        przycisk zamykania, a na komputerze pasek boczny zakrywał jej lewą
        stronę. Powiększenie otwiera się teraz ponad wszystkim.</li>
      <li><strong>Modele Claude 5.5 dla AI.</strong> Ustawienia &gt; Pobieranie danych pokazuje najnowsze modele Claude firmy Anthropic: Haiku 5.5, nowy domyślny i najtańszy, Sonnet 5.5 i Opus 5.5, z aktualnymi cenami. RetroDB nie wysyła już ustawienia, które Sonnet 5.5 odrzuca.</li>
      <li><strong>Wpisz sprzedaż gry.</strong> Oba ekrany edycji mają pole „Sprzedane egzemplarze” pod polem Deweloper. Wpisana liczba pojawia się na stronie gry, tak jak liczba znaleziona przez AI. Wyczyść pole, aby ją usunąć.</li>
      <li><strong>Przetestuj klucz AI w Ustawieniach.</strong> Ustawienia &gt; Pobieranie danych ma przycisk „Testuj zapisany klucz AI” pod dostawcą AI. Pokazuje, czy klucz działa, a jeśli nie, dlaczego: klucz odrzucony, brak środków lub limit użycia. Wcześniej odrzucony klucz wyglądał na działający.</li>
      <li><strong>Claude może szukać danych o sprzedaży w internecie.</strong> Ustawienia &gt; Pobieranie danych ma pod modelem Claude przełącznik „Pozwól Claude szukać w internecie”, na początku wyłączony. Bez wyszukiwania Claude odpowiada na podstawie tego, co już wie, i zostawia puste pole „Sprzedane egzemplarze”. Gdy przełącznik jest włączony, Claude sprawdza liczby. Anthropic pobiera opłatę za każde wyszukiwanie, więc Uzupełnianie AI wykonuje najwyżej 5 wyszukiwań na grę, do 5 centów amerykańskich; wyłącz przełącznik przed dużym masowym pobieraniem danych.</li>
      <li><strong>Uzupełnianie AI dla całego systemu naraz.</strong> Narzędzia ROM mają nową stronę Masowe uzupełnianie AI, na której są też Oficjalne nazwy. Wybierz system lub Wszystkie systemy, włącz pola, które chcesz uzupełnić, i naciśnij Uzupełnij przez AI: RetroDB uruchamia Uzupełnianie AI dla każdej gry, tak samo jak przycisk Uzupełnianie AI na stronie gry, i zapisuje odpowiedzi od razu w grze. Pasek postępu i powiadomienie Uzupełniania AI pokazują, jak daleko zaszło, a podczas działania możesz opuścić stronę. Pokazuje, ile gier uzupełni, i najpierw pyta, bo dostawca AI pobiera opłatę za każdą grę. Gry, które przeszły już Uzupełnianie AI, są pomijane, chyba że je z powrotem włączysz, a przebieg sam się zatrzymuje, gdy AI przestaje odpowiadać.</li>
      <li><strong>Powiadomienia o zadaniach przejmują kolory motywu.</strong> Okna pokazujące uruchomione zadanie, takie jak Masowe pobieranie i RA Sync, oraz paski postępu używają teraz kolorów wybranego motywu. Zadanie, którego nie można wstrzymać, nie pokazuje już tytułu w kolorze wstrzymania.</li>
      <li><strong>Strona Emulatory wygląda jak pozostałe karty Ustawień.</strong> Ustawienia &gt; Emulatory są teraz podzielone na panele, a pasek pod kartami przenosi do każdego z nich: RetroArch, Graj w RetroDB, Rdzenie, Kody, Foldery, Emulatory i Przypisanie. Pasek zostaje u góry podczas przewijania i zaznacza sekcję, w której jesteś.</li>
      <li><strong>Postęp pobierania obok przycisku.</strong> Gdy pobierasz RetroArch, rdzenie odtwarzacza lub pakiet kodów, notka obok przycisku pokazuje w procentach, jak daleko zaszło pobieranie. Wcześniej pod przyciskami pojawiał się wiersz, który spychał resztę strony w dół.</li>
      <li><strong>Wybór emulatora dla każdego systemu z listy.</strong> Przypisanie do systemów w Ustawienia &gt; Emulatory pokazuje teraz każdy system raz, z listą powiązanych z nim emulatorów. Wybrany emulator jest używany przez Graj dla gier tego systemu, chyba że gra ustawia własny. Emulator, którego RetroDB nie może znaleźć, jest oznaczony jako „nie znaleziono”. Wcześniej każdy system miał osobny wiersz dla każdego emulatora, z małą kropką do wyboru domyślnego. Własny RetroArch programu RetroDB jest teraz na liście każdego wymienionego systemu, który potrafi uruchomić, także systemów, które nie mają jeszcze gier.</li>
      <li><strong>Przycisk Przeglądaj przy każdym polu ścieżki.</strong> Administratorzy mogą teraz wybrać folder lub program, klikając przez foldery komputera, zamiast wpisywać ścieżkę: Ustawienia &gt; Emulatory, Biblioteka, Pobieranie danych i Konto oraz ustawienia Narzędzi ROM. Pola oczekujące programu pokazują także pliki. Ukryte foldery, takie jak <code>.config</code>, są na końcu listy.</li>
      <li><strong>Lewy drążek działa jak D-Pad w RetroArch z RetroDB.</strong> W grach na systemy bez drążka, takie jak NES czy Mega Drive, możesz teraz poruszać się lewym drążkiem tak samo jak D-Padem. Gdy rdzeń emulatora gry sam odczytuje drążek, jak na Nintendo 64, drążek pozostaje prawdziwym drążkiem.</li>
      <li><strong>Logowanie do RetroAchievements z Ustawień.</strong> Ustawienia &gt; Konto mogą teraz zalogować Cię do RetroArch z RetroDB, więc osiągnięcia odblokowują się podczas gry bez logowania w emulatorze. Hasło trafia tylko do RetroAchievements i nie jest przechowywane. Każdy użytkownik RetroDB ma własne logowanie i własny przełącznik Trybu hardcore, który na początku jest wyłączony. DuckStation i PCSX2 nadal logują się z własnych menu.</li>
      <li><strong>Zobacz, którego emulatora użyje Graj.</strong> Strona gry pokazuje teraz „Uruchamia się w:” i nazwę emulatora obok przycisku Graj albo informuje, że nie skonfigurowano emulatora.</li>
      <li><strong>Panel Kody mówi, dlaczego gra nie ma kodów.</strong> Gdy emulator gry nie obsługuje kodów, panel podaje teraz powód zamiast pozostawać ukryty.</li>
      <li><strong>Długie ścieżki folderów mieszczą się na telefonie.</strong> Długa ścieżka folderu w Ustawieniach nie powoduje już przewijania strony na boki.</li>
    </ul>
