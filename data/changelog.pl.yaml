  body: |
    <ul>
      <li><strong>Szukaj dowolnej gry lub konsoli z każdej strony.</strong>
        Pod Twoją nazwą na pasku bocznym jest teraz pole wyszukiwania. Wpisz
        co najmniej dwie litery, aby zobaczyć pasujące konsole i do ośmiu
        pasujących gier, każdą z jej konsolą. Kliknij jedną albo wybierz ją
        strzałkami i naciśnij Enter, aby ją otworzyć. „Zobacz wszystkie
        wyniki” otwiera Bibliotekę z tym wyszukiwaniem. Naciśnij /, aby
        przejść do pola, gdy strona nie ma własnego pola wyszukiwania.</li>
      <li><strong>Łatwiejsze poruszanie się na telefonie lub
        tablecie.</strong> Na wąskim ekranie pasek u góry zawiera przycisk
        menu i przycisk wyszukiwania, który otwiera menu z kursorem już w
        polu wyszukiwania. Pasek u dołu jednym dotknięciem przenosi do
        Panelu, Biblioteki, Systemów i Osiągnięć. Menu jest teraz
        nieprzezroczyste, więc strona nie prześwituje już przez nie. Dotknij
        poza nim lub naciśnij Escape, aby je zamknąć. W oknach wielkości
        tabletu brakowało przycisku menu, więc menu w ogóle nie dało się
        otworzyć; teraz przycisk jest. Paski kart i filtrów, które zostają na
        ekranie podczas przewijania, zatrzymują się tuż pod górnym paskiem, a
        nie za nim.</li>
      <li><strong>Ustawienia &gt; Emulatory mieszczą się na
        telefonie.</strong> Tabele były szersze niż telefon, więc przyciski
        Edytuj i Ustawienia były poza ekranem. Na telefonie każdy wiersz jest
        teraz kartą z przyciskami w środku.</li>
      <li><strong>Czyszczenie obrazów gry nie zostawia już zbędnych
        plików.</strong> Jeśli wyczyściłeś obrazy gry, gdy RetroDB wciąż je
        wyostrzał w tle, mógł zapisać je z powrotem jako pliki, których żadna
        gra nie używa. Teraz najpierw to sprawdza i je pomija. Licznik
        „Ulepszanie obrazów” od razu przestaje też liczyć wyczyszczoną
        grę.</li>
      <li><strong>Tytuły, które wpiszesz, są zachowywane podczas pobierania
        danych.</strong> Pobieranie danych, nawet Pełne ponowne pobranie,
        zastępowało tytuł wpisany w oknie edycji nazwą ze scrapera. Teraz
        zmieniony przez Ciebie tytuł zostaje. Pokazuje to nowe pole „Zachowaj
        ten tytuł przy pobieraniu danych” pod tytułem; odznacz je, aby
        scrapery znów mogły zmieniać nazwę gry. Resetuj na stronie gry też na
        to pozwala.</li>
      <li><strong>Oficjalne nazwy Twoich gier, sprawdzane przez
        Ciebie.</strong> Narzędzia ROM mają nową stronę Oficjalne nazwy.
        Naciśnij „Zapytaj AI” dla jednego systemu lub wszystkich, a AI
        zaproponuje pełną oficjalną nazwę każdej gry, pod którą wyszła w
        regionie jej ROM-u, więc japoński ROM Mega Man staje się Rockman.
        Widzisz starą i nową nazwę obok siebie, zaznaczasz te, które chcesz,
        i je akceptujesz. Nic się nie zmienia, dopóki tego nie zrobisz. Stara
        nazwa zostaje jako tytuł alternatywny, a zaakceptowana nazwa jest
        zachowywana podczas pobierania danych. Odrzucona nazwa nie jest
        proponowana ponownie. Wymaga to dostawcy AI w Ustawienia &gt;
        Pobieranie danych.</li>
      <li><strong>Gry z samym rokiem można edytować i zachowują swój
        rok.</strong> Wiele gier ma datę złożoną tylko z roku, np. 1985. Na
        stronie gry okno edycji odmawiało ich zapisania. W oknie edycji
        Biblioteki zapisanie takiej gry kasowało jej rok. Oba okna przyjmują
        teraz rok, rok i miesiąc albo pełną datę.</li>
    </ul>
