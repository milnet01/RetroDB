  tags:
  - type: fix
    label: ES-DE zachowuje teraz swoje miejsce w kolejności źródeł, gdy nie jest źródłem głównym. Jego opisy, firmy i okładki były zastępowane przez późniejsze źródła i AI
  - type: fix
