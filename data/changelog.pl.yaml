  body: |
    <ul>
      <li><strong>Regionalne wersje gry wyświetlają się jako jedna gra.</strong>
        Połącz posiadane wersje (na przykład wydanie amerykańskie, europejskie
        i japońskie), a Biblioteka pokaże jedną kartę z plakietką &#127760;.
        Karta otwiera i uruchamia wersję z Twojego domyślnego regionu. Strona
        gry wymienia wszystkie wersje obok siebie i pozwala się między nimi
        przełączać. Narzędzia ROM &gt; Wersje regionalne proponuje grupy do
        zatwierdzenia przez edytorów; nic nie zostaje połączone bez Ciebie.
        Nigdy nie proponuje kontynuacji jako wersji pierwszej gry. Połączone
        wersje nie są już zgłaszane jako duplikaty z powodu nazwy. Uruchom raz
        Uzupełnij tytuły alternatywne, aby propozycje miały więcej danych.</li>
      <li><strong>AI może podsumować, czym różnią się wersje regionalne.</strong>
        W grze z połączonymi wersjami edytorzy mogą nacisnąć Podsumuj różnice
        z AI w sekcji Wersje regionalne. AI wymienia znane różnice, takie jak
        cenzura, poziom trudności czy usunięta zawartość. Lista jest oznaczona
        jako napisana przez AI, widać ją na stronie każdej wersji i znika, gdy
        połączysz lub rozłączysz wersję, dopóki nie zostanie napisana ponownie.
        Wymaga dostawcy AI skonfigurowanego w Ustawienia &gt; Pobieranie
        danych.</li>
      <li><strong>Gry na PlayStation startują z dobrymi ustawieniami.</strong>
        Dla DuckStation, PCSX2 i RPCS3 RetroDB po naciśnięciu Graj ustawia
        teraz skalę rozdzielczości i proporcje obrazu każdej gry we własnym
        pliku ustawień emulatora dla danej gry, a także to, czy gra startuje
        na pełnym ekranie. Zmienisz je dla całego systemu przyciskiem
        Ustawienia w Ustawienia &gt; Emulatory, a dla jednej gry w nowym panelu
        Ustawienia emulatora na stronie gry. Ustawienie zmienione w samym
        emulatorze zawsze wygrywa. RetroDB odczytuje numer seryjny każdej
        płyty, aby znaleźć właściwy plik; płyty CHD wymagają zainstalowanego
        chdman.</li>
      <li><strong>Uzupełnianiem AI nie da się już sterować tekstem wpisanym w
        pola gry.</strong> Gdy Uzupełnianie AI sprawdza istniejącego wydawcę,
        producenta, edycję lub inne platformy gry, najpierw oczyszcza ten
        tekst, tak jak wcześniej oczyszczało tytuł.</li>
      <li><strong>Skanowania Narzędzi ROM nie wychodzą poza folder ROM.</strong>
        Konwerter CHD i Weryfikacja CHD nie podążają już za skrótem (symlink)
        wskazującym poza ten folder, a rozpakowanie archiwum z wieloma płytami
        pomija każdy skrót zapakowany w archiwum.</li>
      <li><strong>Strony odmawiają uruchamiania podrzuconych do nich
        skryptów.</strong> Przeglądarka blokuje teraz każdy skrypt, którego
        RetroDB nie napisał sam, więc tekst przemycający kod w tytule gry,
        tagu lub pobranym opisie nie może go uruchomić. Przyciski i menu
        działają jak wcześniej.</li>
      <li><strong>Jeden uszkodzony zrzut ekranu nie zatrzymuje już
        sprawdzania duplikatów gry.</strong> Nieczytelny zrzut ekranu zostaje
        odłożony na bok, a sprawdzanie trwa dalej.</li>
      <li><strong>Zadania Narzędzi ROM nie zawieszają się już na „w
        toku”.</strong> Plik usunięty po skanowaniu Weryfikacji CHD jest
        liczony jako nieprawidłowy, a każdy nieoczekiwany błąd w Konwersji
        CHD, Weryfikacji CHD lub Wyszukiwarce duplikatów kończy zadanie jako
        nieudane, z błędem w jego dzienniku.</li>
      <li><strong>Zanim konfiguracja zostanie ukończona, zapytania aplikacji
        o dane dostają jasną odpowiedź.</strong> Odpowiadają „Wymagana
        konfiguracja” zamiast zwracać stronę konfiguracji. Strony nadal
        przenoszą Cię do kreatora konfiguracji.</li>
      <li><strong>Kontynuacje nie pokazują już osiągnięć pierwszej
        gry.</strong> Dopasowywanie RetroAchievements pomijało numer w
        tytule, więc Donkey Kong Country 2 i 3 były połączone z Donkey Kong
        Country. Numery (2, II, 3, III i tak dalej) teraz się liczą. Aby
        poprawić już połączone gry, uruchom raz odświeżanie RetroAchievements
        dla wszystkich systemów.</li>
      <li><strong>Synchronizacja PlayStation nie kasuje już liczby
        trofeów.</strong> Gdy odpowiedź PlayStation pomijała sumy trofeów gry,
        RetroDB zapisywał zera w miejsce liczb, które już miał. Teraz je
        zachowuje, także przy zbiorczym odświeżaniu trofeów.</li>
      <li><strong>Otwarcie zestawu trofeów, którego nie ma już na dysku,
        pokazuje komunikat.</strong> Strona Trofea kończyła się wcześniej
        błędem; teraz mówi, że zestawu nie znaleziono, i wraca do listy.</li>
      <li><strong>Tabele Narzędzi ROM poprawnie nazywają kolumnę przycisków w
        każdym języku.</strong> Nagłówek kolumny miał ten sam tekst co gatunek
        gier Akcja, więc niektóre języki pokazywały tam nazwę gatunku.</li>
      <li><strong>Gry na GameCube, 3DS i Super Famicom dostają emulator
        skonfigurowany automatycznie.</strong> RetroDB szukał tych systemów
        pod nazwami folderów, których biblioteki nie używają (gamecube, 3ds,
        superfamicom zamiast gc, n3ds, sfc), więc Dolphin i Citra nigdy nie
        były do nich podłączone. Uruchom ponownie RetroDB raz, aby to
        wczytać.</li>
      <li><strong>Wersja do pobrania bez Pythona (standalone) znów konfiguruje
        emulatory.</strong> Brakowało w niej pliku z ich listą.</li>
      <li><strong>Około 170 kolejnych przycisków, etykiet i komunikatów jest
        przetłumaczonych</strong> w każdym języku. Wcześniej były po
        angielsku, a kilka pokazywało błędne tłumaczenie (niektóre języki
        mówiły „kopia zapasowa nie powiodła się”, gdy gra nie chciała się
        uruchomić).</li>
      <li><strong>Escape zamyka tylko okno na wierzchu.</strong> Gdy pytanie
        było otwarte nad innym oknem, Escape zamykał oba; niektóre okna
        działały też dalej po ukryciu klawiszem Escape, a naciśnięcie Escape
        na stronie gry mogło wznowić wstrzymane masowe pobieranie danych.
        Każde okno zamyka się teraz własną akcją Zamknij, utrzymuje fokus
        klawiatury w środku, dopóki jest otwarte, i oddaje fokus przyciskowi,
        który je otworzył. Okna postępu trwających zadań pozostają otwarte do
        końca zadania.</li>
      <li><strong>Wykresy Analityki są w Twoim języku.</strong> Nazwy
        gatunków, perspektyw, wymiarów i trybów, tytuły wykresów, nazwy osi i
        legendy były po angielsku w każdym języku.</li>
      <li><strong>Dane RetroAchievements są bezpieczniejsze.</strong> Jeśli
        lista gier RetroAchievements dla konsoli się nie wczyta, RA Refresh
        pozostawia teraz gry tej konsoli połączone, zamiast rozłączać je
        wszystkie. Wyczyść dane RA czyści teraz tylko postęp RetroAchievements;
        postęp Steam i Xbox zostaje.</li>
      <li><strong>Hasła muszą mieć wszędzie co najmniej 12 znaków.</strong>
        Pierwsza konfiguracja przyjmowała hasło administratora dowolnej
        długości, a strony wymuszonej zmiany hasła i konfiguracji mówiły, że
        wystarczą 4 znaki. Wszystkie trzy wymagają teraz 12, tak jak reszta
        aplikacji.</li>
      <li><strong>Sumy osiągnięć są poprawne i należą do Ciebie.</strong>
        Synchronizacja jednej gry z RetroAchievements zapisuje teraz, ile ma
        osiągnięć, zamiast 0. Sumy osiągnięć na pulpicie liczą tylko Twoje
        gry, a Trofea kolekcjonera nie liczą już każdego osiągnięcia Steam lub
        Xbox podwójnie.</li>
      <li><strong>Synchronizacje w tle używają Twoich własnych kont.</strong>
        Synchronizacja systemu RetroAchievements loguje się Twoim własnym
        kontem RetroAchievements, jeśli je ustawiłeś. Zbiorcze odświeżanie
        PlayStation używa ponownie zapisanego logowania, zamiast za każdym
        razem logować się od nowa.</li>
      <li><strong>Tylko Ty możesz zatrzymać lub wznowić swoją
        synchronizację.</strong> Inny użytkownik nie może już anulować Twojej
        synchronizacji RetroAchievements, Steam ani Xbox, a wznowienie
        przerwanego zadania wymaga tych samych uprawnień co jego
        uruchomienie. Administratorzy nadal mogą jedno i drugie.</li>
      <li><strong>Folder trofeów RPCS3 jest sprawdzany przy zapisie.</strong>
        Folder, który nie istnieje, nie jest pełną ścieżką lub jest folderem
        systemowym, zostaje odrzucony, tak jak już działo się to w głównych
        ustawieniach.</li>
      <li><strong>„Pobierz wszystkie obrazy” w Muzeum działa w tle.</strong>
        Strona nie czeka już minutami na każdy obraz kontrolera. Pokazuje, jak
        daleko zaszło pobieranie, ma przycisk Anuluj i wraca do postępu, jeśli
        opuścisz stronę i na nią wrócisz.</li>
      <li><strong>Narzędzia ROM lepiej chronią Twoje pliki.</strong>
        Czyszczenie nie opróżnia już archiwum: wzorca takiego jak
        <code>*</code> nie da się zapisać, a Czyszczenie zatrzymuje się, jeśli
        wzorce usunęłyby każdy plik. Konwerter CHD zachowuje oryginał, gdy
        „weryfikacja” jest wyłączona, i zostawia istniejący plik CHD w
        spokoju, gdy „pomiń istniejące” jest włączone. Wyszukiwarka duplikatów
        zawsze zachowuje jedną kopię każdej gry, nawet jeśli żądanie prosi o
        wszystkie.</li>
      <li><strong>Zadania Narzędzi ROM działają tak, jak mówią
        przyciski.</strong> Wstrzymaj wstrzymuje teraz Konwersję CHD,
        Weryfikację CHD, Wyszukiwarkę duplikatów i Deduplikację zrzutów
        ekranu, a wstrzymane zadanie można anulować. Skanowanie Deduplikacji
        zrzutów ekranu, które napotka błąd, kończy się teraz jako nieudane,
        zamiast działać bez końca.</li>
      <li><strong>Tworzenie M3U nie umieszcza już archiwów w folderze
        tymczasowym.</strong> Przeniesione archiwa trafiają teraz do własnego
        folderu danych RetroDB, który nie jest czyszczony przy ponownym
        uruchomieniu. Skaner archiwów pokazuje, gdzie trafiły, a potwierdzenie
        zbiorcze mówi, że zostaną przeniesione. Przywrócenie ustawień
        Narzędzi ROM przywraca teraz każdą opcję.</li>
      <li><strong>Zmieniaj płyty z poziomu RetroDB.</strong> Gdy działa gra
        RetroArch uruchomiona z listy płyt .m3u, lista &#9654; Teraz grasz u
        góry każdej strony pokazuje tytuł gry i przycisk Następny dysk, więc
        gra prosząca o drugą stronę płyty rusza dalej jednym kliknięciem, z
        przeglądarki lub telefonu. W RetroArch musi być włączone Settings &gt;
        Network &gt; Network Commands (port 55355); przycisk mówi o tym, jeśli
        jest wyłączone.</li>
      <li><strong>Skrypt startowy otwiera RetroDB, gdy jest gotowy.</strong>
        start.sh, start.command i start.bat otwierały przeglądarkę po stałych
        3 sekundach, często zanim serwer mógł odpowiedzieć, więc strona się
        nie wczytywała. RetroDB otwiera ją teraz, gdy tylko serwer nasłuchuje.
        Uruchomiony z LocalWebServerManager nie otwiera żadnej strony; użyj
        przycisku Open w menedżerze.</li>
      <li><strong>Filmy z gier mogą mieć do 500 MB.</strong> Limit wynosił
        50 MB, za mało dla większości zwiastunów. Zbyt duży przesyłany plik
        pokazuje teraz komunikat na stronie gry, zamiast zastępować stronę
        zwykłym tekstem. Odrzucony film (za duży lub złego typu) mówi o tym,
        zamiast znikać bez słowa.</li>
      <li><strong>Uruchamianie korzysta z ustawionej przez Ciebie
        ścieżki.</strong> Binary path override w wierszu RetroArch w
        Ustawienia &gt; Emulatory wygrywa teraz ze ścieżką RetroArch u góry tej
        strony; wcześniej ścieżka z wiersza była pomijana. Dwukrotne
        naciśnięcie Stop nie prosi już gry dwa razy o zamknięcie; w Linuksie
        RetroArch traktuje drugie żądanie jako „zakończ bez zapisywania”, więc
        Twój zapis gry mógł przepaść.
        Ustawienie uruchamiania pozostałe po nigdy nieukończonym trybie
        zdalnym nie blokuje już startu każdej gry.</li>
      <li><strong>Nieudane działania prawidłowo zgłaszają błędy.</strong> Gdy
        zapisywanie, importowanie, synchronizacja lub skanowanie się nie
        powiedzie, RetroDB odpowiada teraz prawdziwym kodem błędu i pokazuje
        przyczynę w komunikacie, zamiast odpowiadać tak, jakby się udało.
        Zapisanie kodu logowania PSN, który nie może się połączyć, nie pokazuje
        już wewnętrznych szczegółów błędu. Logowanie, zarządzanie
        użytkownikami, Twój profil, osiągnięcia, importy, Uzupełnianie AI i
        wyszukiwanie w HowLongToBeat działają teraz tak samo, a język, którego
        nie da się zapisać, mówi dlaczego, zamiast „Błąd sieci”.</li>
      <li><strong>Gry nazwane w stylu No-Intro są teraz rozpoznawane przy
        pobieraniu danych.</strong> Tytuł taki jak „Legend of Zelda, The” lub
        „Legend of Zelda, The - Ocarina of Time” pasuje teraz do wyników „The
        Legend of Zelda”, zamiast być odrzucany przez filtr dopasowania. Raporty
        ROM też przestają oznaczać takie nazwy jako niezgodne.</li>
      <li><strong>Tytuły wzięte z nazw plików tracą wszystkie tagi.</strong>
        Łączony region, taki jak „(USA, Europe)”, oraz „(UK)” są teraz
        usuwane. W komputerach domowych takich jak ZX Spectrum znika wszystko
        od roku dalej, więc „Chuckie Egg 2 (UK) (1985) (A'n'F Software) (tzx)”
        staje się „Chuckie Egg 2”. Nazwa pliku kończąca się na „..zip” nie
        zostawia już zbędnej kropki. Wyszukiwanie w źródłach danych,
        resetowanie danych gry i propozycje Wersji regionalnych korzystają z
        tych czystszych nazw.</li>
      <li><strong>Błędny tytuł nie powtarza się już przy ponownym pobraniu
        danych.</strong> Masowe pobieranie danych szuka teraz według nazwy z
        pliku ROM, a nie tytułu zapisanego dla gry. Gra, która kiedyś
        dopasowała się do złej gry, znajduje właściwą przy ponownym
        pobraniu.</li>
      <li><strong>Źródła danych preferują Twój domyślny region.</strong> Gdy
        dwa wyniki mają remis, wygrywa teraz ten z Twojego domyślnego regionu
        lub World, a nie zawsze ten z USA. Dwa tytuły, które są tylko tagami
        regionu, nie liczą się już jako idealne dopasowanie. Wersje regionalne
        nie mylą już X w „X-Men” z numerem kontynuacji. Wybór wersji
        pokazywanej na karcie odczytuje teraz tylko nazwę pliku ROM, a nie
        folderów nad nim, i rozumie stare tagi, takie jak „(U)” i „(E)”.</li>
      <li><strong>Dziennik pokazuje, na co idzie czas pobierania danych każdej
        gry.</strong> Po każdej grze RetroDB zapisuje jeden wiersz z liczbą
        sekund spędzonych na wyszukiwaniu, w każdym źródle, na pobieraniu, na
        przetwarzaniu obrazów, w AI i na zapisie. To pierwszy krok do
        szybszego pobierania danych.</li>
      <li><strong>Pobieranie danych kończy się szybciej: małe obrazy są
        wyostrzane później.</strong> Pobieranie danych zapisuje teraz grę z
        obrazami w takiej postaci, w jakiej zostały pobrane. Małe okładki i
        zrzuty ekranu są potem powiększane w tle, jedna gra naraz. Zduplikowane
        zrzuty ekranu są odrzucane przed całą tą pracą. Jeśli RetroDB zatrzyma
        się w połowie, dokończy przy następnym uruchomieniu.</li>
      <li><strong>Czytaj instrukcję gry na jej stronie.</strong> Przycisk
        Instrukcja otwiera teraz PDF w oknie nad stroną gry. Przewracaj strony
        przyciskami Poprzednia i Następna, strzałkami, klawiszami Home i End
        lub przesunięciem palcem na telefonie; każda strona przewraca się jak
        w książce albo po prostu się zmienia, jeśli system prosi o mniej
        ruchu. „Otwórz PDF w nowej karcie” nadal jest dostępne, a Ctrl+klik na
        Instrukcji od razu otwiera kartę.</li>
      <li><strong>Pasek boczny pokazuje, kiedy obrazy są jeszcze
        ulepszane.</strong> Gdy obrazy są wyostrzane w tle, pasek boczny
        pokazuje „Ulepszanie obrazów — Pozostałe gry: N”. Gra, która jeszcze
        czeka, mówi o tym na swojej stronie, a jej ostrzejsze obrazy pojawiają
        się tam same, gdy są gotowe. Przełącznik okładki 2D/3D nie zasłania już
        tego wiersza.</li>
      <li><strong>Zapasowe źródła są pytane jednocześnie.</strong> Gdy główne
        źródło zostawia luki, RetroDB pyta teraz pozostałe źródła wszystkie
        naraz, zamiast po kolei. Ich odpowiedzi są nadal używane w kolejności
        z Ustawień, więc w każdym polu wygrywa to samo źródło.</li>
      <li><strong>ES-DE czyta swoją listę gier raz.</strong> Każde pobieranie
        danych, także masowe, czytało plik gamelist.xml ES-DE dla systemu dwa
        razy przy każdej grze. RetroDB czyta go teraz raz i ponownie dopiero,
        gdy plik się zmieni.</li>
      <li><strong>Zastosuj w Szukaj metadanych nie szuka już
        ponownie.</strong> Na stronie gry zaznaczone wyniki są pobierane
        bezpośrednio z ich źródła, zamiast być wyszukiwane drugi raz. Gdy nic
        nie jest zaznaczone, luki wypełniają tylko zastosowane źródło i
        AI.</li>
      <li><strong>ScreenScraper znajduje gry z podtytułem.</strong> Nie
        znajdował niczego dla tytułu takiego jak „Alone in the Dark: The New
        Nightmare”, chyba że przed dwukropkiem była spacja. RetroDB szuka
        teraz w ten sposób, a potem według części przed dwukropkiem, jeśli
        nadal nic nie znajdzie.</li>
      <li><strong>Gry, w które nie ma czego uruchomić, nie oferują już
        przycisku Graj.</strong> Gra dodana z importu CLZ, Steam, Xbox lub PSN
        nie ma pliku ROM. Jej strona nie pokazuje teraz przycisku Graj, Ustawień
        emulatora ani sekcji Uruchom podczas edycji, tak samo jak karty w
        Bibliotece.</li>
      <li><strong>Gry RetroArch są chronione przed dwoma złymi
        ustawieniami.</strong> RetroDB daje teraz RetroArch mały własny plik
        ustawień przy każdym uruchomieniu gry, nałożony na Twój. Ustawia on
        klawiaturę zgodnie z Twoim pulpitem (Wayland lub X11), więc klawiatura
        nigdy nie jest martwa, i pozwala przewijaniu do przodu działać z pełną
        prędkością, z czego gry na Commodore 64 korzystają, by szybko się
        wczytać. Wszystkie inne ustawienia RetroArch pozostają nietknięte.</li>
      <li><strong>Tworzenie M3U zachowuje grę w bibliotece.</strong> Zamiana
        archiwum z wieloma płytami na playlistę zostawiała wcześniej grę
        wskazującą na archiwum, które zostało przeniesione. Gra wskazuje teraz
        na nową playlistę i zachowuje swoje dane i obrazy. Gdy jedno archiwum
        zawiera kilka wydań gry, każde z własnym zestawem płyt, playlista
        używa teraz płyt pierwszego wydania zamiast wszystkich i mówi, które
        płyty pominęła.</li>
      <li><strong>Pełne ponowne pobranie może zachować multimedia, które już
        masz.</strong> Zaznacz „Zachowaj istniejące multimedia” obok
        przełącznika Pełne ponowne pobranie. Dane tekstowe są nadal
        odświeżane, ale grafiki, filmy i instrukcje, które są już na dysku,
        zostają bez zmian, zamiast być pobierane ponownie. Bez zaznaczenia
        Pełne ponowne pobranie nie gubi już wcześniej pobranych zrzutów
        ekranu.</li>
      <li><strong>Zadania w tle nie gubią już ani nie pomijają pracy.</strong>
        Odświeżanie RetroAchievements, które natrafiło na jedną złą grę, nie
        wyrzuca już gier, które zdążyło zaktualizować. Wznowiona synchronizacja
        lub odświeżanie nie pomija już gry, na której się zatrzymało.
        Wznowiona synchronizacja RetroAchievements lub Steam z bardzo starej
        migawki zatrzymuje się teraz z komunikatem, zamiast zgłaszać sukces
        bez zsynchronizowania czegokolwiek. Konwersja do WebP sprawdza
        pozostawiony plik WebP, zanim mu zaufa, i nie wystartuje, jeśli nie
        może odczytać wolnego miejsca na dysku.</li>
      <li><strong>Aktualizacja bardzo starej instalacji nie może już po cichu
        stracić danych.</strong> Trzy stare kroki aktualizacji bazy danych
        mogły w rzadkich sytuacjach gubić wiersze. Teraz kopiują wiersze albo
        zatrzymują się z jasnym błędem, zamiast je tracić.</li>
      <li><strong>Przyciski okna O programie nie są już obcięte.</strong> Okno
        jest szersze, a jego cztery przyciski są w dwóch rzędach, więc każda
        etykieta jest widoczna w całości; na telefonie układają się jeden pod
        drugim.</li>
      <li><strong>Twój motyw podąża za Tobą do nowej przeglądarki.</strong>
        Zalogowanie się w przeglądarce, której wcześniej nie używałeś, pokazuje
        teraz zapisany motyw. Wcześniej strona logowania zapisywała najpierw
        Cyberpunk i tak zostawało.</li>
      <li><strong>Okno hasła przy logowaniu nie mówi już „Admin
        Login”.</strong> Każde konto loguje się hasłem, więc okno mówi teraz po
        prostu Zaloguj. Strona Konto i strona Pomoc mówią to samo.</li>
      <li><strong>Pomoc jest aktualna w każdym języku.</strong> Przetłumaczone
        strony Pomocy opisują teraz Wersje regionalne, mówią, że każde konto
        wymaga hasła, i że motyw jest zapisywany z kontem. Pomoc w każdym
        języku, także angielskim, podaje teraz prawdziwe minimum 12 znaków
        hasła.</li>
      <li><strong>Drobne poprawki:</strong> fanart z apostrofem w nazwie pliku
        wyświetla się teraz na stronach gier i trofeów; Ustawienia nie
        pokazują już błędu skryptu dla kont bez uprawnień administratora, a
        czytniki ekranu słyszą teraz, która karta Ustawień jest wybrana;
        opuszczenie strony nie zapełnia już konsoli przeglądarki błędami
        anulowanych żądań; model upscalera jest pobierany najpierw z
        działającego adresu; a instalator nie zawiesza się już w Windows, gdy
        jego wyjście jest zapisywane do pliku.</li>
      <li><strong>Szeroka runda poprawek niezawodności.</strong> Zapisanie gry
        z pustym tytułem nie gubi już innych zmian. Restart pozwala teraz
        najpierw spokojnie zakończyć trwające zadania. Tworzenie M3U odmawia
        nadpisania istniejącej playlisty lub folderu. Wyczyszczenie listy
        niechcianych plików w Narzędziach ROM oznacza teraz „nic nie usuwaj”,
        a dwa wzorce nie łapią już prawdziwych nazw ROM-ów, takich jak „Release
        of the Dragon”. Jeden uszkodzony plik trofeów PS3 nie czyści już
        trofeów wszystkich gier. Uzupełnianie AI zapisuje jeden region.
        Analityka liczy każdą grę raz na wykresie ocen. Importy CLZ używają
        standardowych nazw gatunków. W oknach edycji gatunek i inne tagi można
        usuwać w każdym języku, a skróty klawiszowe nie przejmują już Ctrl+D
        ani Ctrl+G. Widzowie widzą stan ukończenia gry, ale nie mogą go już
        zmieniać, bo jest wspólny dla wszystkich.</li>
      <li><strong>Czytniki ekranu odczytują przełącznik Platform Match Required
        pod jego widoczną nazwą</strong> w Ustawienia → Pobieranie danych.</li>
      <li>W innych językach Ustawienia tłumaczą teraz „Default Region”, a karta
        Pobieranie danych brzmi jak nazwa, a nie „trwa pobieranie danych”.
        Strony pomocy używają tych samych słów.</li>
      <li><strong>Gra, która nie chce się zamknąć, nie jest już pokazywana jako
        zamknięta.</strong> Jeśli emulator przetrwa Stop, RetroDB nadal
        pokazuje go jako działający. Odrzucone uruchomienie RetroArch nie
        zapisuje już najpierw swojego pliku ustawień, a emulator, który od
        razu zawodzi, pokazuje komunikat o błędzie przy pierwszym
        sprawdzeniu.</li>
      <li>Zaktualizowane biblioteki: Pillow 13 (obsługa obrazów), numpy 2.5.4 i
        onnxruntime 1.31 (powiększanie obrazów) oraz najnowsze wersje narzędzi
        do budowania i wydawania.</li>
      <li>Za kulisami: kod uruchamiania gier został uporządkowany, by łatwiej
        go było śledzić, usunięto nieużywany kod (adres API, funkcję pomocniczą
        PSN, skrypt trofeów, którego żadna strona nie wczytywała, i ustawienie
        motywu dla całej witryny, którego nic nie odczytywało), odpowiedzi
        aplikacji dla przeglądarki są budowane w jednym miejscu, kilka
        dokumentów projektowych poprawiono, by zgadzały się z kodem, zestaw
        testów uporządkowano, a nowe sprawdzenie wyłapuje błąd składni
        JavaScript przed wydaniem. Starsze wpisy dziennika zmian, które
        opisywały usunięty kod, teraz o tym mówią.</li>
    </ul>
- version: 3.29.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Inne nazwy gry pokazują region, z którego pochodzą
  body: |
    <ul>
      <li><strong>Inne nazwy gry pokazują region, z którego
        pochodzą.</strong> Karta Inne tytuły na stronie gry oznacza każdą nazwę
        jej krajem lub regionem, na przykład Japonia dla „Rockman”, w Twoim
        języku. Oznaczone nazwy są pierwsze, pogrupowane według regionu.
        Najedź na nazwę, aby zobaczyć jej źródło i ewentualną uwagę, taką jak
        „Tytuł roboczy”.</li>
      <li>Nazwy z IGDB zachowują teraz swój region. Wcześniej miały go tylko
        nazwy z ScreenScraper.</li>
      <li>Etykieta „SS” z ScreenScraper nie wyświetla się już jako region. To
        własna nazwa gry w ScreenScraper, a nie miejsce.</li>
      <li>Narzędzia ROM → Uzupełnij tytuły alternatywne sprawdza teraz każdą
        grę z pobranymi danymi, więc nazwy, które już masz, zyskują regiony.
        Uruchom je raz, aby oznaczyć swoją istniejącą bibliotekę.</li>
    </ul>
- version: 3.28.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Wskaż RetroDB folder z emulatorami, a sam je skonfiguruje
  - type: fix
    label: Poprawki strony Ustawienia → Emulatory
  body: |
    <ul>
      <li><strong>Wskaż RetroDB folder z emulatorami, a sam je
        skonfiguruje.</strong> Ustawienia → Emulatory mają nową listę Foldery
        emulatorów. Dodaj folder, w którym są Twoje emulatory, a RetroDB
        znajdzie w nim każdy z nich, jako AppImage, skrypt przenośny lub
        zainstalowany Flatpak, i połączy go z systemami, które obsługuje.
        System, który ma już działający emulator, zachowuje go.</li>
      <li><strong>Zobacz, które systemy są gotowe do gry.</strong> Tabela
        Per-system mapping wymienia teraz emulatory każdego systemu, mówi, czy
        każdy z nich działa, i pozwala wybrać domyślny dla systemu. Dla
        DuckStation, PCSX2, RPCS3 i RetroArch mówi też, czy pliki BIOS są na
        miejscu, i wymienia brakujące. RetroDB tylko odczytuje pliki BIOS;
        nigdy żadnego nie kopiuje ani nie pobiera.</li>
      <li>Skanowanie emulatorów znajduje teraz każdy emulator na dużym dysku z
        emulatorami. Wcześniej mogło zatrzymać się za wcześnie w folderze
        ustawień samego emulatora.</li>
      <li>Przyciski Auto-detect i Zapisz w RetroArch znów działają, a okno Edit
        emulator nie pokazuje się już na stronie, dopóki nie naciśniesz
        Edytuj.</li>
    </ul>
- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Stosowanie metadanych pokazuje postęp
  body: |
    <ul>
      <li><strong>Stosowanie metadanych pokazuje postęp.</strong> Gdy
        wybierzesz wynik w oknie Szukaj metadanych, pierścień wypełnia się od
        0 do 100%, z wartością procentową w środku, a wiersz pod nim mówi, co
        się dzieje: która witryna jest przeszukiwana, który obraz lub film
        jest pobierany albo że obrazy są przetwarzane. Duże pobieranie, na
        przykład filmu, przesuwa pierścień w miarę napływania danych. Przy
        100% strona przeładowuje się z wynikiem, tak jak wcześniej.</li>
      <li>Pierścień może przesuwać się nierówno. Każde źródło decyduje, ile
        obrazów wyśle, dopiero gdy odpowiada, więc pierwsze źródło z wieloma
        obrazami może wypełnić dużą część pierścienia, a kolejne mniej.</li>
      <li>Jeśli zastosowanie się nie powiedzie, pierścień się zamyka, a
        komunikat o tym informuje, bez przeładowania strony.</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Każda strona dopasowuje się teraz do okna, w którym jest otwarta
  - type: enhancement
    label: Strona gry pokazuje inne nazwy na osobnej karcie i ma przycisk Instrukcja
  body: |
    <ul>
      <li><strong>Każda strona dopasowuje się teraz do okna, w którym jest otwarta.</strong>
        Strony z kartami (Systemy, Muzeum, Tagi, Listy, Narzędzia ROM, trofea i
        osiągnięcia) dodają kolumnę, gdy tylko zmieści się kolejna cała karta,
        maksymalnie cztery w rzędzie. Tabele, narzędzia i strony szczegółów
        nieco się poszerzają, ale zatrzymują się tam, gdzie większa szerokość
        tylko rozsunęłaby ich kolumny. Ustawienia zachowują wygodną do czytania
        szerokość pól.</li>
      <li><strong>Pomoc i dziennik zmian zachowują wygodną długość
        wiersza.</strong> W szerokim oknie odnośniki do sekcji Pomocy przechodzą
        do kolumny obok tekstu; w wąskim układają się w jeden rząd, który można
        przewijać palcem, zamiast bloku zasłaniającego dużą część ekranu
        telefonu.</li>
      <li><strong>Strona gry:</strong> w szerokim oknie zrzuty ekranu biegną u
        góry, a pod nimi, na wysokości okładki, obok siebie stoją film i nowa
        karta <strong>Znana również jako</strong>. Inne nazwy były wcześniej
        bladym tekstem pod tytułem; teraz są na karcie, którą łatwo przeczytać.
        <strong>Instrukcja</strong> to przycisk obok przycisku Graj, a Historia
        pobierania danych jest na początku zwinięta.</li>
      <li>Trofea PSN pokazują od jednej do czterech kolumn, zależnie od okna,
        zamiast zawsze trzech.</li>
      <li>Kilka stron nie przewija się już na boki na telefonie: Trofea, Trofea
        kolekcjonera, strona systemu RetroAchievements, Pomoc, Ustawienia,
        Analityka, Importy gier oraz strony szczegółów osiągnięć i trofeów.
        Szerokie tabele przewijają się tam teraz w swoim własnym obszarze.</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Biblioteka, strony systemów i strony gier dopasowują się teraz do okna
  body: |
    <ul>
      <li><strong>Strony korzystają z szerokiego okna, gdy to pomaga &mdash; i tylko wtedy.</strong>
        Biblioteka i każda strona systemu dodają kolumnę kart gier, gdy tylko
        zmieści się kolejna cała karta, maksymalnie cztery w rzędzie. Telefon
        pokazuje jedną, okno na pół ekranu dwie lub trzy, szerokie okno cztery.
        Wcześniej strony kończyły się na stałej szerokości i zostawiały większą
        część dużego okna pustą.</li>
      <li><strong>Strona gry umieszcza okładkę i szczegóły obok zrzutów ekranu i
        filmu,</strong> gdy mieszczą się obok siebie, a w przeciwnym razie układa
        je jedno pod drugim. Opis zachowuje wygodną długość wiersza.</li>
      <li><strong>Przycisk Graj przeniósł się do prawego górnego rogu każdej karty,</strong>
        jest mniejszy i wyśrodkowany. Sprawdza teraz także, czy plik ROM gry
        nadal istnieje i czy jego typ jest akceptowany przez dany system, więc
        pojawia się tylko tam, gdzie jego naciśnięcie uruchomi grę. Znika na czas
        masowego zaznaczania gier.</li>
      <li>Przycisk powrotu na górę i okienka postępu znajdują się teraz tuż obok
        zawartości strony, a nie na samych krawędziach okna.</li>
      <li>Strona gry nie przewija się już na boki na telefonie.</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: Testowy język „Pseudo” jest dostępny tylko dla administratorów
  body: |
    <ul>
      <li><strong>„Pseudo” nie pojawia się już na liście języków dla
        wszystkich.</strong> To narzędzie dla programistów, które pokazuje każde
        słowo w nawiasach i z akcentami, dlatego jest teraz dostępne tylko dla
        administratorów. Każdy inny, kto go wcześniej wybrał, widzi aplikację po
        angielsku, z angielskim wybranym w Ustawieniach.</li>
    </ul>
- version: 3.24.1
  date: '2026-10-17'
  tags:
  - type: fix
    label: Wersja dla Windows znów się instaluje, a po zmianie rozmiaru okna nie ma już zalewu błędów
  body: |
    <ul>
      <li><strong>Zwykłej wersji dla Windows nie dało się zainstalować.</strong>
        Instalator zatrzymywał się na komunikacie „Core dependencies failed to
        install”, ponieważ jego zablokowana lista pakietów pomijała pakiet
        potrzebny tylko w systemie Windows. Lista obejmuje teraz wszystkie
        platformy. Wersja dla Windows bez Pythona nie była dotknięta problemem.</li>
      <li><strong>Komunikaty o błędach pojawiały się raz za razem w prawym górnym rogu</strong>
        w motywie Cyberpunk po poszerzeniu okna przeglądarki, na przykład po
        jego zmaksymalizowaniu. Animowane tło zmienia teraz rozmiar bez
        problemów.</li>
    </ul>
- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Uruchamiaj grę prosto z Biblioteki i ze stron systemów
  body: |
    <ul>
      <li><strong>Przycisk ▶ Graj na każdej karcie gry.</strong> Pojawia się w
        lewym dolnym rogu okładki w Bibliotece i na każdej stronie systemu.
        Naciśnij go, a gra uruchomi się w swoim emulatorze; zostajesz na liście,
        zamiast najpierw otwierać stronę gry.</li>
      <li>Przycisk pojawia się tylko tam, gdzie jego naciśnięcie może zadziałać:
        Twoje konto ma prawo uruchamiać gry, a emulator gry jest włączony,
        zainstalowany i, w przypadku RetroArch, ma swój rdzeń. Gry z systemów bez
        działającego emulatora nie mają przycisku.</li>
      <li>Jeśli uruchomienie mimo to się nie powiedzie, na przykład dlatego, że
        plik ROM został przeniesiony, przyczyna pojawi się w komunikacie, a strona
        pozostanie bez zmian.</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: Krótszy pasek boczny i jedna strona Osiągnięcia dla wszystkich platform
  body: |
    <ul>
      <li><strong>Jeden odnośnik „Osiągnięcia” zastępuje pięć.</strong>
        RetroAchievements, RPCS3, PSN, Steam i Xbox to teraz karty na jednej
        stronie, a odnośnik otwiera kartę, której używałeś ostatnio. Jeśli nie
        masz żadnych gier z RetroAchievements, otwiera się karta RPCS3, zamiast
        odsyłać Cię z powrotem do Panelu.</li>
      <li><strong>Raporty ROM znajdują się teraz w Narzędziach ROM,</strong> jako
        karta obok pozostałych narzędzi i kafelek na stronie Narzędzia ROM.</li>
      <li><strong>Żadne dwa odnośniki na pasku bocznym nie mają tej samej ikony:</strong>
        Panel ma teraz 🏠, a Przeglądarka dzienników 🧾. Pasek boczny ma 16
        odnośników zamiast 21.</li>
      <li>Karty narzędzi na stronie ustawień Narzędzi ROM były zawsze po
        angielsku; teraz są w Twoim języku.</li>
    </ul>
- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: Wyszukiwanie w How Long To Beat znów działa
  body: |
    <ul>
      <li><strong>Każde wyszukiwanie w How Long To Beat kończyło się informacją,
        że gry nie znaleziono.</strong> Serwis przeniósł swoją wyszukiwarkę pod
        nowy adres, więc zapytania RetroDB były odrzucane; awaria nastąpiła między
        końcem lipca a końcem września. RetroDB używa teraz nowego adresu i wysyła
        filtry platformy oraz roku w nowym formacie serwisu, który zaczął
        ignorować stary. Wyszukiwanie dla pojedynczej gry i masowe wyszukiwanie w
        Narzędziach ROM znów działają.</li>
    </ul>
- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: RetroDB mówi teraz wprost, że nie popiera piractwa
  - type: fix
    label: Okno O programie znów otwiera się w pełnym rozmiarze
  body: |
    <ul>
      <li><strong>W aplikacji jest teraz informacja przeciw piractwu.</strong>
        Pojawia się w oknie O programie oraz pod Ścieżką biblioteki ROM w
        Ustawieniach, w każdym języku. Mówi, że RetroDB nie rozpowszechnia ani nie
        przechowuje plików ROM, że należy używać wyłącznie gier skopiowanych z
        własnych płyt i kartridży oraz że RetroDB nie jest powiązany z żadnym
        producentem konsol, wydawcą ani bazą danych gier. Treść jest zgodna ze
        stroną internetową RetroDB i zwiastunem.</li>
      <li><strong>Okno O programie było wciśnięte w pasek boczny.</strong>
        Teraz otwiera się na środku ekranu w normalnym rozmiarze, a na małym
        ekranie przewija się, zamiast ukrywać tytuł i przycisk zamykania.</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: RetroDB uruchamia i zmienia nazwy tylko na prawdziwe typy plików ROM
  body: |
    <ul>
      <li><strong>Grę można było uruchomić z plikiem, który nie jest
        ROM-em.</strong> Zmiana nazwy ROM-u przyjmowała dowolną nazwę, więc
        <code>crash.bin</code> mógł stać się <code>crash.cfg</code> i trafić do
        emulatora. Uruchamianie sprawdza teraz typ pliku względem listy w pliku
        <code>systeminfo.txt</code> danego folderu systemu &mdash; tej samej, której
        używa skanowanie biblioteki &mdash; a zmiana nazwy odrzuca typ spoza tej
        listy. Jeśli folder systemu nie ma takiej listy, jego gry nie uruchomią
        się, a komunikat wskaże brakujący plik.</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: Tylko administrator może zmieniać argumenty uruchamiania gry
  - type: fix
    label: Argumenty uruchamiania złożone z kilku słów lub z zabłąkanym cudzysłowem działają teraz poprawnie
  - type: fix
    label: RetroDB nie trzyma już w pamięci każdego zakończonego uruchomienia
  body: |
    <ul>
      <li><strong>Edytor mógł dodać argumenty uruchamiania, które uruchamiały
        inny kod.</strong> <em>Niestandardowe argumenty uruchamiania</em> gry
        trafiają prosto do emulatora, a w przypadku RetroArch mogły wczytać
        dowolny plik programu z komputera. Ich zmiana wymaga teraz roli
        administratora, a pole jest ukryte przed wszystkimi innymi.</li>
      <li><strong>Argumenty uruchamiania złożone z więcej niż jednego słowa
        docierały do emulatora jako jeden.</strong> <code>--a --b</code> trafia
        teraz jako dwa argumenty, a pusta wartość niczego nie dodaje. Brakujący
        cudzysłów zamykający psuł wcześniej każde uruchomienie danej gry błędem
        serwera; teraz pojawia się komunikat wskazujący pole do poprawienia.
        Znacznik <code>{disc_paths}</code> został usunięty: zawsze był pusty.</li>
      <li><strong>Zakończone uruchomienia gromadziły się w pamięci aż do
        ponownego uruchomienia RetroDB.</strong> Uruchomienie zakończone ponad
        godzinę temu jest teraz usuwane.</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: Wybór języka w Ustawieniach znów działa
  body: |
    <ul>
      <li><strong>Wybranie języka w Ustawienia &rarr; Biblioteka &rarr;
        Wyświetlanie nic nie dawało.</strong> Zamiast tego pojawiał się błąd, a
        strona zostawała w poprzednim języku. Usterka pojawiła się w wersji
        3.23.8. Wybrany język jest teraz zapisywany, a strona przeładowuje się w
        tym języku.</li>
    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: Ikony trofeów i platform wróciły do pobieranej wersji
  body: |
    <ul>
      <li><strong>W pobieranej wersji brakowało ikon trofeów i platform
        RetroDB.</strong> Każda karta gry z RetroAchievements pokazywała uszkodzony
        obrazek w miejscu odznaki, a brakowało też poziomów trofeów oraz logo PSN,
        Steam, Xbox i RPCS3. Teraz są dołączone do każdej pobieranej wersji.</li>
    </ul>
- version: 3.23.14
  date: '2026-10-10'
  tags:
  - type: security
    label: Zaktualizowano dwie dołączone biblioteki w związku z opublikowanymi poprawkami bezpieczeństwa
  body: |
    <ul>
      <li><strong>urllib3 i Werkzeug miały znane problemy z bezpieczeństwem.</strong>
        RetroDB zawiera teraz urllib3 2.8.0 i Werkzeug 3.1.9, czyli wersje, które
        je naprawiają. Instalacja ze źródeł pobierze je po ponownym uruchomieniu
        <code>install.py</code>, który instaluje pakiety z
        <code>requirements.lock</code>.</li>
    </ul>
- version: 3.23.13
  date: '2026-09-26'
  tags:
  - type: fix
    label: Multimedia zapisane jako ścieżka folderu nie są już zgłaszane jako brakujące
  body: |
    <ul>
      <li><strong>W wersji samodzielnej opcja „wyczyść odwołania do brakujących
        multimediów” mogła usunąć multimedia, które naprawdę istniały.</strong>
        Działo się tak, gdy baza danych zapisywała multimedia jako ścieżkę folderu,
        na przykład <code>images/boxart/…</code>, a nie samą nazwę pliku. RetroDB
        szuka ich teraz we właściwym folderze.</li>
    </ul>
- version: 3.23.12
  date: '2026-09-26'
  tags:
  - type: fix
    label: Panel pokazuje trwające masowe pobieranie danych, plus cztery drobne poprawki
  body: |
    <ul>
      <li><strong>Karta postępu pobierania danych na Panelu nigdy się nie pojawiała.</strong>
        Teraz jest widoczna podczas masowego pobierania danych i informuje, gdy
        jest ono wstrzymane.</li>
      <li><strong>Koniec z błędami w konsoli przeglądarki na stronie
        logowania.</strong> Strona przestała sprawdzać zadania w tle, zanim
        ktokolwiek się zaloguje.</li>
      <li><strong>Kreator konfiguracji nie mówi już „Konfiguracja zakończona!”,
        gdy zapis się nie powiódł.</strong> Teraz informuje, że nie udało się
        zapisać ustawień.</li>
      <li><strong>Dwa masowe pobierania danych uruchomione w tej samej sekundzie
        nie mają już wspólnego identyfikatora</strong>, więc działania w kolejce,
        takie jak anulowanie, dotyczą właściwego z nich.</li>
    </ul>
- version: 3.23.11
  date: '2026-09-26'
  tags:
  - type: ui
    label: Przyciski darowizn mówią teraz, co wspierają
  body: |
    <ul>
      <li><strong>Jaśniejszy opis darowizn.</strong> Przyciski w nagłówku mają
        teraz napisy „Sponsoruj” i „Wesprzyj na Patreon”. README mówi, że każde
        wydanie jest darmowe, a darowizny finansują samo RetroDB, a nie emulatory
        i rdzenie, które potrafi uruchamiać.</li>
    </ul>
- version: 3.23.10
  date: '2026-09-26'
  tags:
  - type: fix
    label: Strony Narzędzi ROM stosują zapisane ustawienia, a strony dzienników i Narzędzi ROM znów działają
  body: |
    <ul>
      <li><strong>Strona dzienników i niektóre strony Narzędzi ROM nie działały.</strong>
        Skrypt na tych stronach zawodził podczas wczytywania, więc przeglądarka
        dzienników i wspólne funkcje pomocnicze Narzędzi ROM nigdy się nie
        uruchamiały. Teraz wczytują się poprawnie.</li>
      <li><strong>Ustawienia Narzędzi ROM wreszcie działają.</strong> Wyszukiwarka
        duplikatów i Konwerter CHD otwierają się z opcjami ustawionymi na stronie
        ustawień Narzędzi ROM, a nadal można je zmienić na jedno uruchomienie.</li>
      <li><strong>Przełączniki Konwertera CHD były ignorowane.</strong> Wyłączenie
        na stronie opcji „Usuń oryginalne pliki po powodzeniu” nie powstrzymywało usuwania, jeśli
        zapisane ustawienie nakazywało usuwać. Teraz decydują przełączniki na
        stronie.</li>
      <li><strong>Ustawienie Ścieżka tymczasowa jest używane.</strong> Pliki
        przygotowywane podczas tworzenia playlist M3U trafiają teraz do tego
        folderu.</li>
    </ul>
- version: 3.23.9
  date: '2026-09-26'
  tags:
  - type: security
    label: Pliki dzienników pobierania danych nie przechowują już haseł i tokenów, a liczba prób logowania znów jest ograniczona
  - type: fix
    label: Zapisywanie ustawień nie kasuje już Twoich ustawień, a usuwanie użytkownika działa
  body: |
    <ul>
      <li><strong>Pliki dzienników przechowywały sekrety jawnym tekstem.</strong>
        Dzienniki pobierania danych miały ukrywać tokeny logowania i klucze API,
        ale krok ukrywania nigdy się nie wykonywał, więc zapisywano je w całości.
        Teraz są ukrywane. Starsze pliki dzienników nadal je zawierają; usuń stare
        pliki z <code>logs/</code>, jeśli udostępniasz komuś swoją instalację.</li>
      <li><strong>Limity prób logowania nie były egzekwowane.</strong> Limity
        powtarzanych logowań i ciężkich operacji (skanowanie, pobieranie danych,
        importy) były skonfigurowane, ale nigdy nie zostały włączone. Teraz
        działają, a zablokowane żądanie dostaje jasny komunikat „zbyt wiele
        prób”.</li>
      <li><strong>Uszkodzony plik ustawień mógł zostać wyczyszczony.</strong> Jeśli
        nie dało się odczytać pliku <code>data/settings.json</code>, następny zapis
        zastępował go ustawieniami domyślnymi. RetroDB zachowuje teraz uszkodzony
        plik jako <code>settings.json.corrupt-&lt;time&gt;</code> przed zapisem.
        Jeśli plik znów daje się poprawnie odczytać, zapis jest zamiast tego
        odrzucany.</li>
      <li><strong>Wiersz nazewnictwa Silnik gubił inne ustawienia.</strong> Dodanie
        tagu do wiersza Silnik w ustawieniach nazewnictwa kończyło się błędem i
        przy okazji odrzucało zapisane razem z nim ustawienia przedimków i
        regionów. Teraz zapisuje się poprawnie.</li>
      <li><strong>Usuwanie użytkownika nie działało.</strong> Użytkownika z tagami,
        listami, pozycjami na liście życzeń lub danymi PSN nie dało się usunąć.
        Usunięcie kasuje teraz użytkownika i wszystko, co do niego należy.</li>
      <li><strong>Mogły działać dwa pobierania danych naraz.</strong> Zamiana lub
        przesunięcie trwającego masowego pobierania danych w kolejce uruchamiało
        dwa pobierania ze wspólnym licznikiem postępu. Teraz działa tylko
        jedno.</li>
      <li><strong>Postęp masowego pobierania danych mógł wyglądać jak błąd.</strong>
        Przed pierwszym sukcesem masowe pobieranie danych zgłaszało swój stan w
        sposób, który niektóre ekrany odczytywały jako niepowodzenie. To zostało
        naprawione.</li>
      <li><strong>Po zalogowaniu wracasz teraz na stronę, o którą prosiłeś.</strong>
        Wcześniej zawsze trafiałeś na Panel.</li>
      <li><strong>Operacje administratora na plikach nie wychodzą poza Twoje foldery.</strong>
        Narzędzie do zmiany rozmiaru obrazów i operacje zmiany nazw ROM-ów
        odrzucają teraz wszystko spoza folderu multimediów lub folderu ROM.</li>
      <li><strong>Stare pliki logowania PSN i Xbox są przenoszone na Twoje
        konto.</strong> Pozostawiony plik <code>data/psn_tokens.json</code> lub
        <code>data/xbox_tokens.json</code> zostaje wczytany do Twojego konta, a jego
        nazwa zmieniona tak, by kończyła się na <code>.migrated-015</code>. Ten plik
        nadal zawiera token, więc usuń go, gdy sprawdzisz, że logowanie
        działa.</li>
      <li><strong>Jaśniejsze komunikaty o błędach z serwera.</strong> Nieprawidłowe
        żądanie dostaje teraz właściwy komunikat o błędzie zamiast „Wystąpił błąd
        wewnętrzny”.</li>
    </ul>
- version: 3.23.8
  date: '2026-09-25'
  tags:
  - type: fix
    label: Import CLZ znów działa, okładki na listach są widoczne, a kilka stron przestało się psuć przez apostrof
  - type: security
    label: Pobrane nazwy i ścieżki plików nie mogą już wydostać się poza przyciski strony
  body: |
    <ul>
      <li><strong>Import CLZ nic nie robił.</strong> Przesłany plik PDF z CLZ trafiał
        pod adres, którego serwer nie ma, więc każde przesłanie kończyło się
        błędem „Parse failed”. Teraz dociera do parsera.</li>
      <li><strong>Na stronie listy brakowało wszystkich okładek.</strong> Strona
        listy prosiła o każdą okładkę pod złym adresem, a kolumna System była
        zawsze pusta. Teraz oba są widoczne. Naprawiono też okładki w
        wyszukiwarce „dodaj grę” na tej stronie.</li>
      <li><strong>Przyciski psuły się przy nazwach z apostrofem.</strong> Usunięcie
        „Assassin's Creed” z listy, usunięcie zrzutu ekranu, powiększenie okładki
        lub usunięcie tagu gatunku mogło po cichu nic nie zrobić, gdy nazwa
        zawierała apostrof. Ta sama usterka pozwalała specjalnie spreparowanej
        pobranej nazwie uruchomić kod na stronie. Nazwy trafiają teraz do tych
        przycisków w sposób, którego nie da się pomylić z kodem.</li>
      <li><strong>Adresy obrazów i odnośników są teraz wszędzie zabezpieczane.</strong>
        Kilka stron budowało adresy obrazków z pobranych nazw plików bez
        zabezpieczenia, a pięć stron miało własną, słabszą kopię funkcji
        zabezpieczającej. Teraz wszystkie używają wspólnej.</li>
      <li><strong>Strona Ustawienia mogła otwierać się pusta.</strong> Jeśli karta,
        której używałeś ostatnio, zmieniła nazwę po aktualizacji, Ustawienia
        otwierały się bez widocznego panelu. Teraz karta, która już nie istnieje,
        jest pomijana. Odnośniki takie jak <code>/settings#account</code> znów
        otwierają właściwą kartę.</li>
      <li><strong>Twój motyw podąża teraz za Tobą na inne urządzenia.</strong>
        Wybrany motyw zapisuje się na Twoim koncie. Przeglądarka, której nigdy nie
        ustawiono motywu, używa Twojego zapisanego zamiast domyślnego.</li>
      <li><strong>Okienka postępu zadań pokazują właściwą ikonę.</strong> Zadania
        wstrzymane, zakończone i oczekujące w kolejce pokazywały tę samą ikonę
        „w toku”. Teraz każdy stan ma własną, w każdym motywie.</li>
      <li><strong>Listę skrótów klawiszowych można teraz przetłumaczyć.</strong>
        Jej etykiety były niewidoczne dla narzędzi tłumaczeniowych, więc w każdym
        języku zostawały po angielsku.</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: Klasyfikacje wiekowe były często błędne, a gry z pobranymi danymi mogły tracić szczegóły
  body: |
    <ul>
      <li><strong>Klasyfikacje wiekowe były często błędne, a pomyłka się rozprzestrzeniała.</strong>
        Gdy klasyfikacja pochodziła z TheGamesDB, aplikacja szukała kodu
        klasyfikacji w dowolnym miejscu tekstu, zamiast odczytać go poprawnie
        &mdash; więc „T - Teen”, „M - Mature 17+”, „AO - Adults Only 18+” i
        „RP - Rating Pending” były zapisywane jako zła klasyfikacja, a gra dla
        dorosłych mogła zostać oznaczona jako odpowiednia dla wszystkich. Co gorsza,
        ta błędna klasyfikacja służyła potem do uzupełnienia ośmiu pozostałych
        systemów klasyfikacji, więc jeden zły odczyt rozchodził się na wszystkie.
        Klasyfikacje są teraz odczytywane z kodu na początku tekstu.</li>
      <li><strong>Przeliczone klasyfikacje wychodziły zbyt łagodne.</strong> Przy
        uzupełnianiu brakującej klasyfikacji na podstawie już posiadanej aplikacja
        mogła użyć klasyfikacji, którą sama wyliczyła chwilę wcześniej, a nie tej,
        od której faktycznie zaczęła. Każdy taki krok trochę łagodził ocenę. Teraz
        zawsze przelicza z klasyfikacji, które gra naprawdę ma.</li>
      <li><strong>Pełne ponowne pobranie kasowało ręcznie wybrany Region i Typ zapisu.</strong>
        Żadnej z tych wartości nie dostarcza scraper &mdash; aplikacja sama je
        ustala &mdash; więc Pełne ponowne pobranie zastępowało Twoje starannie
        wybrane „Japan” domyślnym „USA”. Twoje wartości są teraz zachowywane, chyba
        że źródło naprawdę dostarczy nową.</li>
      <li><strong>Scraper mógł zaakceptować niewłaściwą grę.</strong> Wyniki z
        ScreenScraper są zwykle sprawdzane pod kątem wyniku dopasowania przed
        użyciem, ale wyszukiwanie zwracające dokładnie jeden wynik całkowicie
        pomijało tę kontrolę. Teraz każdy wynik jest oceniany.</li>
      <li><strong>Gra mogła stracić wszystkie pobrane szczegóły przez jedno
        brakujące pole.</strong> Jeśli IGDB lub ScreenScraper zostawił jedno pole
        puste w nieoczekiwany sposób, cała aktualizacja była odrzucana &mdash;
        wydawca, producent, grafiki i wszystko inne. Te przypadki są teraz
        obsługiwane, a pozostałe szczegóły zostają zachowane.</li>
      <li><strong>Nieudany obraz mógł zostać zapisany jako sukces.</strong> Jeśli
        pobrany obrazek okazywał się bezużyteczny, aplikacja niczego nie usuwała i
        mimo to zapisywała nazwę pliku, zostawiając uszkodzone odwołanie. Teraz
        plik jest usuwany, a pole pozostaje nietknięte.</li>
      <li><strong>Tryby gry używają teraz spójnego nazewnictwa.</strong> Różne
        scrapery zapisywały „Single-player” i „Single-Player” oraz zwykłe
        „Multiplayer”, które nie było żadną z etykiet aplikacji, więc takich gier
        nie dało się przetłumaczyć ani znaleźć filtrem Tryby. Wszystkie źródła
        zapisują teraz te same etykiety. Istniejące gry zachowują stare nazewnictwo,
        dopóki nie pobierzesz ich danych ponownie lub nie uruchomisz narzędzia
        normalizacji w Ustawieniach.</li>
      <li><strong>Wyszukiwanie w Xbox działa teraz tak samo jak każde inne źródło.</strong>
        Wysyłało własne zapytania sieciowe, więc nie ponawiało prób, gdy Xbox Live
        prosił o zwolnienie tempa, i nie miało limitu ilości danych w odpowiedzi.
        Teraz używa tego samego wspólnego połączenia co inne scrapery.</li>
      <li><strong>Usunięto nieużywany kod ScreenScraper.</strong> Usunięto dwie
        funkcje, których nic w aplikacji nie wywoływało. Jedna z nich zwracała adres
        internetowy z Twoim hasłem do ScreenScraper w środku, co przekazałoby hasło
        wszystkiemu, co by jej użyło. „System Media Endpoint” wymieniony w opisie
        wydań 3.6.x był jedną z nich &mdash; nigdy nie był dostępny z żadnego
        miejsca aplikacji.</li>
    </ul>
- version: 3.23.5
  date: '2026-09-02'
  tags:
  - type: fix
    label: Pobrana wersja spakowana nie mogła się uruchomić, oraz inne poprawki kompilacji
  body: |
    <ul>
      <li><strong>Wersja samodzielna w ogóle się nie uruchamiała.</strong> Spakowana
        wersja ma własnego Pythona, ale program uruchamiający w środku był tym
        napisanym dla instalacji ze źródeł &mdash; szukał plików Pythona, których
        spakowana wersja nie zawiera, i zatrzymywał się na pierwszym wierszu.
        Pakiet ma teraz własny program uruchamiający, który po prostu uruchamia
        aplikację i otwiera przeglądarkę, gdy serwer już działa.</li>
      <li><strong>Skrót na pulpicie w wersji dla Linuksa niczego nie
        uruchamiał.</strong> Zawierał tekst zastępczy w miejscu ścieżki do
        aplikacji. Obok programu uruchamiającego jest teraz plik
        <code>install-launcher.sh</code> &mdash; uruchom go raz, a skrót zostanie
        zapisany z prawdziwą ścieżką do miejsca, w którym rozpakowałeś aplikację.</li>
      <li><strong>Uruchamianie ze źródeł instalowało niezweryfikowane
        zależności.</strong> Gdy brakowało Flaska, skrypt startowy pobierał pakiety
        prosto z internetu bez sprawdzania sum kontrolnych, po drodze omijając
        systemowego menedżera pakietów. Teraz przekazuje to zadanie do
        <code>install.py</code>, który korzysta z pliku blokady z sumami
        kontrolnymi.</li>
      <li><strong>Pobierane źródła zawierały pliki opiekuna, których nie
        powinny.</strong> Lista tego, co pominąć, była prowadzona ręcznie i nie
        nadążała, więc wyniki audytów i pozostałe foldery kompilacji trafiały do
        paczki z aplikacją. Pobierana wersja jest teraz budowana z listy plików
        faktycznie obecnych w projekcie, która nie może się rozjechać.</li>
      <li><strong>Dwa panele Ustawień nie działały w wersji spakowanej.</strong>
        Panele statystyk biblioteki i stanu API szukały głównego programu pod
        nazwą, której nie ma w wersji spakowanej, więc oba zawodziły.</li>
      <li><strong>Części tekstu na ekranie nie dało się przetłumaczyć.</strong>
        Trzy nowsze części aplikacji &mdash; ustawienia emulatorów, przycisk
        uruchamiania i pasek „teraz grasz” &mdash; były pomijane przez skanowanie
        tłumaczeń, a kontrola, która miała to wychwycić, patrzyła na tę samą
        niepełną listę. Skanowanie obejmuje teraz automatycznie każdy plik, a ich
        tekst został dodany do tłumaczeń.</li>
      <li><strong>Przebudowa tłumaczeń mogła po cichu nic nie robić.</strong>
        Dodanie tekstu do skryptu konkretnej strony sprawiało, że przebudowa uznawała,
        że nie ma nic do zrobienia, więc nowy tekst nigdy nie trafiał do pliku
        tłumaczeń.</li>
      <li><strong>Obejście dla karty graficznej było stosowane u wszystkich.</strong>
        Skrypt startowy dla Linuksa wymuszał ustawienie przeznaczone dla jednej
        konkretnej karty AMD na każdym komputerze, co mogło zawieszać narzędzie do
        powiększania obrazów na innym sprzęcie AMD. Teraz jest stosowane tylko
        wtedy, gdy ta karta faktycznie jest obecna, i nigdy nie nadpisuje wartości
        ustawionej przez Ciebie.</li>
      <li><strong>Skrypt wydania mógł opublikować złą wersję.</strong> Pozostały
        znacznik z wcześniejszej próby był po cichu używany ponownie, więc wersja
        mogła zostać zbudowana ze starszego stanu, a mimo to zgłaszać
        sukces.</li>
    </ul>
- version: 3.23.4
  date: '2026-09-02'
  tags:
  - type: fix
    label: Zamknięto dziewięć sposobów, w jakie biblioteka mogła tracić dane
  body: |
    <ul>
      <li><strong>„Wyczyść pobrane dane” czyściło całą bibliotekę.</strong> Okno
        potwierdzenia liczyło tylko gry, dla których faktycznie pobrano dane, a
        potem operacja i tak czyściła każdą grę &mdash; mogła więc obiecać kilkanaście,
        a wyczyścić tysiące. Przy włączonych obrazach usuwała też okładki wgrane
        ręcznie i przywracała tytuły, które sam poprawiłeś, nawet w grach, dla
        których nigdy nie pobierano danych. Teraz robi dokładnie to, co mówi
        okno.</li>
      <li><strong>Okładka 3D zostawiała uszkodzone odwołanie.</strong> Czyszczenie
        z obrazami usuwało okładkę 3D z dysku, ale baza danych nadal na nią
        wskazywała, więc aplikacja szukała pliku, którego już nie było.</li>
      <li><strong>Przełącznik „Dołącz” w masowej edycji zastępował zamiast dodawać.</strong>
        W przypadku Perspektywy i Wymiaru robił dokładnie odwrotnie, niż mówi
        jego etykieta, nadpisując istniejące wartości we wszystkich zaznaczonych
        grach naraz, bez możliwości cofnięcia.</li>
      <li><strong>Wersje samodzielne mogły jednym kliknięciem wyczyścić każde
        odwołanie do obrazu.</strong> W spakowanej wersji aplikacja szukała
        multimediów w złym miejscu, uznawała, że brakuje każdego obrazu, a
        „wyczyść odwołania do brakujących multimediów” opróżniało wtedy wpisy
        grafik, zrzutów ekranu, filmów i instrukcji w całej bibliotece.
        Zabezpieczenie, które istnieje właśnie po to, by to wychwycić, nie mogło
        tego zauważyć. Dotyczyło to tylko wersji spakowanej.</li>
      <li><strong>Usuwanie osieroconych plików mogło kasować grafiki w trakcie ich pobierania.</strong>
        Okładka pobrana podczas działania tego czyszczenia mogła zostać uznana za
        osieroconą i usunięta.</li>
      <li><strong>Tworzenie playlist przenosiło archiwa bez pytania.</strong>
        Masowe tworzenie playlist M3U przenosiło oryginalne pliki archiwów nawet
        przy wyłączonej tej opcji &mdash; a gdy o to poprosiłeś, zgłaszało
        niepowodzenie przeniesienia, które się udało.</li>
      <li><strong>Narzędzie do zmiany rozmiaru obrazów rozdmuchiwało folder multimediów.</strong>
        Traktowało tworzone przez siebie małe miniatury jako nowe obrazy do
        powiększenia, rozciągało je do pełnego rozmiaru, a potem robiło z nich
        miniatury. Każde uruchomienie dodawało kolejne pliki, strony po cichu
        wysyłały obrazy w pełnym rozmiarze zamiast miniatur, a powiększanie AI
        działało na mniej więcej trzy razy większej liczbie plików niż
        zamierzono.</li>
      <li><strong>Uzupełnianie AI nadpisywało poprawione przez Ciebie szczegóły.</strong>
        Przy zwykłym pobieraniu danych mogło zastąpić Twojego wydawcę, producenta,
        gatunek, klasyfikacje wiekowe i nie tylko. Teraz uzupełnia tylko puste pola;
        przycisk Uzupełnianie AI, który naciskasz sam, działa bez zmian.</li>
      <li><strong>Powtórne pobieranie danych mogło usunąć dobry zrzut ekranu.</strong>
        Gry z danymi z RAWG używały tych samych nazw plików, więc drugie pobranie
        nadpisywało zapisany zrzut ekranu, a potem usuwało go jako duplikat, choć
        biblioteka nadal go wymieniała.</li>
    </ul>
- version: 3.23.3
  date: '2026-09-01'
  tags:
  - type: fix
    label: Role domowników robią teraz dokładnie to, co mówią, a dezaktywowane konto naprawdę traci dostęp
  body: |
    <ul>
      <li><strong>Dezaktywacja kogoś kończy teraz jego sesję.</strong> Wyłączenie
        konta ukrywało je na każdym ekranie, ale każdy, kto był już na nim
        zalogowany, mógł normalnie pracować nawet przez tydzień. Dezaktywacja to
        jedyny sposób, by odciąć komuś dostęp bez usuwania go, więc teraz działa
        już przy jego następnym kliknięciu.</li>
      <li><strong>Konta tylko do odczytu nie mogą już zmieniać danych gier.</strong>
        Trzy operacje „how long to beat” były dostępne dla każdej zalogowanej
        osoby, także tych, które mogą tylko przeglądać — więc konto tylko do
        odczytu mogło nadpisać czas gry albo usunąć go ze wszystkich gier w
        bibliotece. Teraz wymagają uprawnień do edycji, jak każda inna operacja
        zmieniająca grę.</li>
      <li><strong>Śledzenie trofeów znów działa dla wszystkich.</strong>
        Odświeżanie własnych trofeów kolekcjonera wymagało uprawnień edytora,
        których nie mają role Gracz i Widz — a tylko ta operacja zapisuje te
        trofea. Takie konta nigdy nie mogły żadnego zdobyć, a przycisk Odśwież
        pokazywał tylko błąd. To Twój własny postęp, więc teraz nie wymaga żadnych
        specjalnych uprawnień.</li>
      <li><strong>Odświeżania PlayStation jednej osoby nie może już zatrzymać nikt
        inny.</strong> Każde zalogowane konto mogło wstrzymać lub anulować
        odświeżanie rozpoczęte przez kogoś innego i widzieć, na której grze ta
        osoba jest. Obie rzeczy są teraz dostępne tylko dla osoby, która je
        rozpoczęła.</li>
      <li><strong>Import ze Steam używa Twojego konta, a nie tego, kto pierwszy
        zapisał swoje.</strong> Import biblioteki odczytywał jedną wspólną kopię
        danych logowania do Steam zamiast Twoich, więc mógł pobrać czyjąś
        bibliotekę — podczas gdy Twoje zapisane dane wydawały się brakować.</li>
      <li><strong>Odgadnięcie hasła administratora znów jest trudne.</strong> Limit
        nieudanych prób logowania był wspólny dla wszystkich w sieci, więc każdy z
        własnym kontem mógł go wyzerować, logując się, i zgadywać bez końca. Limit
        jest teraz osobny dla każdego konta.</li>
      <li><strong>Błędy z aplikacji docierają teraz do strony, zamiast znikać.
        </strong> Gdy operacja była odrzucana, 115 z nich odpowiadało w formie,
        której strona nie potrafiła odczytać, więc wyglądało na to, że operacja się
        udała. Teraz poprawnie zgłaszają odmowę i widzisz prawdziwy komunikat.</li>
    </ul>
- version: 3.23.2
  date: '2026-08-06'
  tags:
  - type: fix
    label: Strony ustawień scraperów wczytują się szybciej i nigdy nie pokazują nieaktualnego klucza API
  body: |
    <ul>
      <li><strong>Strony Ustawienia i Konfiguracja scraperów nie odczytują już
        pliku ustawień scraperów przy każdym żądaniu.</strong> Cztery miejsca
        otwierały go i analizowały od nowa z dysku za każdym razem, gdy działała
        strona lub kontrola, choć istniał już wspólny czytnik z pamięcią podręczną.
        Teraz wszystkie z niego korzystają, więc te strony wykonują mniej pracy
        przy każdej wizycie.</li>
      <li><strong>Zapis nadal działa natychmiast.</strong> Pamięć podręczna, która
        zapomina po czasie, mogłaby pokazywać stare wartości nawet przez pół minuty
        po zapisie. Każdy zapis czyści teraz pamięć podręczną w trakcie zapisywania,
        więc widzisz dokładnie to, co właśnie zapisałeś.</li>
      <li><strong>Twoje prawdziwe klucze API nie mogą już zostać zastąpione ich
        własną zamaskowaną wersją.</strong> Strony ustawień pokazują zapisane klucze
        jako <code>***1234</code>, a nie prawdziwą wartość. Ponieważ strona dostawała
        tę samą kopię ustawień, której używają scrapery, maskowanie mogło nadpisać
        prawdziwe klucze w pamięci, przez co scrapery logowały się gwiazdkami, aż
        pamięć podręczna wygasła.</li>
      <li><strong>Wersje samodzielne szukają teraz ustawień scraperów we właściwym
        miejscu.</strong> Scrapery ustalały położenie pliku inaczej niż strony,
        które go zapisują. W zwykłej instalacji obie trafiały do tego samego pliku;
        w wersji samodzielnej (uruchamianej dwuklikiem) już nie, więc zapisane
        klucze API mogły trafić tam, gdzie scrapery nigdy nie zaglądały.</li>
    </ul>
- version: 3.23.1
  date: '2026-08-06'
  tags:
  - type: fix
    label: Port serwera zapisany w Ustawieniach jest teraz portem, którego serwer używa
  body: |
    <ul>
      <li><strong>Zapisanie portu serwera naprawdę przenosi serwer.</strong>
        Ustawienia przyjmowały port, sprawdzały go, zapisywały i informowały, że do
        jego zastosowania potrzebny jest restart &mdash; a potem serwer i tak
        startował na porcie 5000. Nic nigdy nie odczytywało tej wartości. Teraz jest
        częścią procesu uruchamiania, więc restart naprawdę przenosi RetroDB na
        wybrany port. Wartość ustawiona w środowisku nadal ma pierwszeństwo, więc
        program uruchamiający lub kontener przydzielający port nie jest
        dotknięty zmianą.</li>
      <li><strong>Dwa ustawienia, które nigdy nic nie robiły, zostały usunięte
        zamiast naprawione.</strong> „Host serwera” i „tryb debugowania” były
        zapisywane i składały tę samą fałszywą obietnicę. Włączenie trybu
        debugowania z formularza na stronie udostępniłoby w przeglądarce
        interaktywną konsolę Pythona, a adres nasłuchiwania decyduje o tym, które
        komputery w ogóle mogą połączyć się z RetroDB &mdash; żadne z nich nie
        powinno być w formularzu ustawień. Oba nadal można skonfigurować w
        środowisku, gdzie i tak już były. Jeśli Twój plik ustawień wciąż je
        zawiera, zostaną po cichu pominięte przy wczytywaniu; nie musisz nic
        robić.</li>
      <li><strong>Nic już nie obiecuje, że restart coś zastosuje, jeśli restart
        tego nie zastosuje.</strong> To była prawdziwa usterka &mdash; martwe
        ustawienie to bałagan, ale fałszywa obietnica marnuje całe popołudnie.</li>
    </ul>
- version: 3.23.0
  date: '2026-08-06'
  tags:
  - type: enhancement
    label: Uruchamiaj RetroDB na porcie wybranym przez inny program
  body: |
    <ul>
      <li><strong>RetroDB odczytuje teraz ustawienie <code>PORT</code> ze swojego
        środowiska.</strong> Jeśli uruchamiasz RetroDB z innego narzędzia &mdash;
        panelu, kontenera, panelu serwera domowego &mdash; to narzędzie może teraz
        przekazać RetroDB port, na którym ma działać, bez edytowania jakiegokolwiek
        pliku. Ustaw <code>PORT</code>, a RetroDB będzie na nim nasłuchiwać; zostaw
        go w spokoju, a nic się nie zmieni. Dotychczasowe <code>RETRODB_PORT</code>
        nadal działa dokładnie jak wcześniej, a <code>PORT</code> ma pierwszeństwo,
        jeśli ustawione są oba.</li>
      <li><strong>Nieprawidłowy numer portu jest teraz zgłaszany zamiast
        zgadywany.</strong> Wcześniej nieczytelny port powodował ścianę tekstu
        błędów Pythona, a port spoza dozwolonego zakresu wychodził na jaw dopiero,
        gdy serwer nie chciał się uruchomić. RetroDB zatrzymuje się teraz od razu
        z jednym wierszem podającym wartość, której nie mógł użyć. Nigdy nie
        uruchomi się po cichu na innym porcie niż ten, o który go poproszono
        &mdash; ciche przeniesienie jest gorsze niż odmowa.</li>
      <li><strong>Komunikat startowy i karta przeglądarki pokazują prawdziwy
        port.</strong> Adres wypisywany przy starcie RetroDB oraz strona, którą
        otwiera, zawsze podawały 5000, niezależnie od faktycznie używanego
        portu.</li>
    </ul>
- version: 3.22.1
  date: '2026-07-31'
  tags:
  - type: fix
    label: Plik roboczy bazy danych nie rośnie już bez ograniczeń
  body: |
    <ul>
      <li><strong>Dziennik bazy danych znów ma limit.</strong> SQLite trzyma plik roboczy (plik <code>-wal</code>) obok bazy danych Twojej biblioteki. RetroDB miał ograniczyć go do 64&nbsp;MB, ale limit obejmował wyłącznie zadania w tle &mdash; zwykłe ładowanie stron i edycje działały zupełnie bez limitu. Po jednym nietypowo dużym zapisie plik zostawał na zawsze przy swoim największym rozmiarze, czasem większym niż sama baza. Teraz limit działa wszędzie, więc miejsce wraca.</li>
    </ul>
- version: 3.22.0
  date: '2026-07-05'
  tags:
  - type: enhancement
    label: Pobieraj dane gry prosto z jej okienka, bez dodatkowego kroku
  body: |
    <ul>
      <li><strong>Pobieranie danych z okienka gry.</strong> Szybkie okienko gry
        (to, które pojawia się po kliknięciu gry w Bibliotece) ma teraz przycisk
        <strong>Pobierz dane</strong> obok Uzupełniania AI i Edytuj. Kliknij go, a
        RetroDB przeniesie Cię prosto do tej gry z już otwartym wyszukiwaniem
        metadanych &mdash; koniec z otwieraniem pełnej strony i szukaniem
        najpierw przycisku Pobierz dane.</li>
    </ul>
- version: 3.21.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Uruchamianie jednym kliknięciem — uruchom RetroDB z przypiętej ikony, bez terminala
  - type: feature
    label: Prawdziwa ikona aplikacji — neonowy gamepad w karcie przeglądarki i na pasku zadań
  - type: feature
    label: Nowy przycisk Wyłącz serwer na stronie Ustawienia
  body: |
    <ul>
      <li><strong>Uruchamiaj jednym kliknięciem.</strong> RetroDB ma teraz
        prawdziwy program uruchamiający, który możesz przypiąć do paska zadań
        &mdash; kliknij go, a aplikacja się uruchomi (jeśli jeszcze nie działa) i
        automatycznie otworzy w przeglądarce. Koniec z otwieraniem terminala i
        wpisywaniem poleceń. W systemie Linux uruchom raz
        <code>python3 scripts/install_launcher.py</code>, aby dodać
        &ldquo;RetroDB&rdquo; do menu aplikacji, a następnie przypnij ją.</li>
      <li><strong>Prawdziwa ikona aplikacji.</strong> RetroDB nosi teraz
        neonową ikonę gamepada &mdash; cyberpunkowy cyjan i magenta na ciemnym
        kaflu &mdash; w karcie przeglądarki (favikona), na programie
        uruchamiającym na pasku zadań oraz na samym programie Windows. Zastępuje
        zwykły emotikon zastępczy.</li>
      <li><strong>Przycisk Wyłącz serwer.</strong> Sterowanie serwerem na stronie
        Ustawienia ma teraz czerwony przycisk <strong>Wyłącz serwer</strong> obok
        Uruchom ponownie. Zatrzymuje on aplikację w sposób czysty (pozwalając
        najpierw dokończyć zapisywanie uruchomionym zadaniom), więc nie musisz
        już przełączać się na terminal i naciskać Ctrl+C.</li>
      <li><strong>Pobrane wersje otwierają przeglądarkę za Ciebie.</strong>
        Gotowe do uruchomienia pobrania dla systemów Windows, Mac i Linux teraz
        otwierają przeglądarkę chwilę po uruchomieniu, więc aplikacja jest przed
        Tobą bez żadnego dodatkowego kroku.</li>
    </ul>
- version: 3.20.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Jedenaście nowych języków — RetroDB mówi teraz w 21 językach
  - type: fix
    label: 'Naprawiono nieszkodliwy błąd konsoli przy opuszczaniu listy gier'
  body: |
    <ul>
      <li><strong>Jedenaście nowych pakietów językowych.</strong> Interfejs
        RetroDB, informacje o wydaniach i podręcznik pomocy zostały
        przetłumaczone na <strong>Afrikaans, isiZulu, isiXhosa, Dutch,
        Norwegian (Bokm&aring;l), Russian, Polish, Turkish, Ukrainian,
        Indonesian i Hebrew</strong> &mdash; dołączając do istniejących już
        German, Spanish, French, Italian, Japanese, Korean, Brazilian
        Portuguese oraz Simplified &amp; Traditional Chinese. Wybierz swój
        język w Ustawienia &rarr; Preferencje wyświetlania &rarr; Język;
        aplikacja uruchomi się ponownie w wybranym języku.</li>
      <li>Każdy język obejmuje całą aplikację: każdy przycisk, etykietę i
        komunikat, pełną historię informacji o wydaniach oraz kompletny
        podręcznik pomocy.</li>
      <li><strong>isiZulu &amp; isiXhosa</strong> również zostały
        uwzględnione. Ponieważ te języki mają niewiele ugruntowanego
        słownictwa technicznego, niektóre terminy (ROM, scraper, box art)
        pozostają po angielsku tam, gdzie nie ma naturalnego odpowiednika
        &mdash; przed poleganiem na tych tłumaczeniach warto je zweryfikować
        z native speakerem.</li>
      <li><strong>Hebrew</strong> ma w pełni przetłumaczony tekst;
        dopracowany układ strony od prawej do lewej (tak, aby interfejs
        poprawnie się odbijał) pojawi się w kolejnej aktualizacji. Arabic
        dołączy, gdy tylko ta praca nad układem zostanie ukończona.</li>
      <li><strong>Poprawka:</strong> opuszczenie Biblioteki lub listy gier systemu nie zapisuje już w konsoli przeglądarki nieszkodliwego &bdquo;ReferenceError&rdquo; (pozostałość po wcześniejszych porządkach). Brak widocznego efektu &mdash; po prostu czystsza konsola.</li>
    </ul>
- version: 3.19.1
  date: '2026-07-05'
  tags:
  - type: performance
    label: Szybsze pobieranie danych — zrzuty ekranu gry pobierają się teraz jednocześnie
  body: |
    <ul>
      <li><strong>Zrzuty ekranu pobierają się równolegle.</strong> Podążając za
        podejściem popularnego frontendu ES-DE (który pobiera wszystkie materiały
        gry naraz), RetroDB pobiera teraz zrzuty ekranu gry
        <strong>równocześnie</strong> zamiast jeden po drugim, dla każdego źródła
        (TheGamesDB, IGDB, RAWG, ScreenScraper). Gry z wieloma zrzutami ekranu
        kończą pobieranie zauważalnie szybciej.</li>
      <li>Sprawdzanie duplikatów zrzutów ekranu nadal odbywa się później po
        kolei, więc usuwanie duplikatów obrazów pozostaje dokładnie tak samo
        precyzyjne jak wcześniej &mdash; przyspieszono tylko samo pobieranie.
        Pobieranie jest ograniczone do czterech naraz, aby nigdy nie przeciążyć
        jednego źródła.</li>
      <li>Usprawnienie szybkości działające &bdquo;pod maską&rdquo;; zacznie
        działać po następnym restarcie.</li>
    </ul>
- version: 3.19.0
  date: '2026-07-05'
  tags:
  - type: performance
    label: Szybsze pobieranie danych — źródła są teraz odpytywane jednocześnie
  body: |
    <ul>
      <li><strong>Pobieranie danych o grze jest teraz szybsze.</strong> Gdy
        RetroDB wyszukuje grę, sprawdza kilka baz danych (ES-DE, TheGamesDB,
        IGDB, RAWG, ScreenScraper). Wcześniej odpytywał je <em>jedna po
        drugiej</em> i czekał na odpowiedź każdej, zanim zapytał kolejną
        &mdash; więc czas oczekiwania był sumą wszystkich. Teraz odpytuje je
        wszystkie <strong>naraz</strong> i czeka tylko na najwolniejszą, co daje
        zauważalne przyspieszenie przy każdej grze. Wyniki są nadal
        porządkowane i oceniane dokładnie tak samo jak wcześniej.</li>
      <li><strong>Mniej marnowanych połączeń przy pobieraniu grafik.</strong>
        Pobieranie obrazów wykorzystuje teraz już otwarte połączenie zamiast
        otwierać nowe dla każdego pojedynczego obrazka, co skraca czas przy
        grach z wieloma zrzutami ekranu.</li>
      <li>To usprawnienia szybkości działające &bdquo;pod maską&rdquo;
        &mdash; sposób korzystania z RetroDB się nie zmienia, a bazy danych
        nie są obciążane mocniej (te same zapytania, po prostu wykonywane
        równolegle). Zaczną działać po następnym restarcie.</li>
    </ul>
- version: 3.18.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Dodano chińskie (Chiny) oceny wiekowe jako 9. system klasyfikacji
  body: |
    <ul>
      <li><strong>Nowy system ocen wiekowych: Chiny (CADPA).</strong> RetroDB
        obsługuje teraz oficjalny chiński system przypomnień o wieku dla gier
        (&ldquo;网络游戏适龄提示&rdquo;, wydawany przez CADPA) obok istniejących
        ośmiu systemów (ESRB, PEGI, CERO, USK, ACB, FPB, GRAC i ClassInd). Używa
        trzech poziomów &mdash; <strong>8+</strong>, <strong>12+</strong> i
        <strong>16+</strong> &mdash; wyświetlanych w postaci prostej zielonej
        plakietki.</li>
      <li><strong>Wypełnia się sam, tak jak pozostałe.</strong> Gdy gra ma już
        ocenę z innego kraju, RetroDB automatycznie wylicza odpowiadający jej
        poziom chiński (i odwrotnie). Możesz też wybrać lub zmienić go ręcznie
        w ekranie edycji gry oraz ustawić jako preferowany system wyświetlania
        w Ustawienia &rarr; Biblioteka. Uwaga: większość zachodnich baz danych
        o grach nie publikuje chińskiej oceny, więc dla gier bez żadnej oceny
        jest ona uzupełniana na podstawie zawartości gry podczas pobierania
        danych / AI Fill.</li>
      <li>Zielone plakietki to własna, prosta grafika RetroDB (zgodna ze
        stylem pozostałych systemów), a nie oficjalne logo CADPA, więc nie
        wiążą się z tym żadne ograniczenia licencyjne dotyczące obrazów.</li>
    </ul>
- version: 3.17.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Czyszczenie wpisów w bazie danych dla plików multimedialnych brakujących na dysku
  - type: security
    label: Zabezpieczenie przed wyczyszczeniem całej grafiki biblioteki, gdy zniknie folder z multimediami
  body: |
    <ul>
      <li><strong>Nowe narzędzie konserwacyjne: &ldquo;Brakujące odwołania do
        multimediów&rdquo;</strong> (Ustawienia &rarr; System &rarr;
        Konserwacja). Jest lustrzanym odbiciem istniejącego czyszczenia
        &ldquo;Osierocone multimedia&rdquo;: zamiast wyszukiwać pozostałe
        pliki obrazów bez gry, znajduje gry, których okładka, okładka 3D,
        zrzuty ekranu, fanart, wideo lub instrukcja wskazują na pliki,
        których już nie ma na dysku. Wyszukaj je, a następnie wyczyść te
        nieaktualne odwołania jednym kliknięciem, aby scrapery mogły
        ponownie pobrać grafikę. Same wpisy gier nigdy nie są naruszane.</li>
      <li><strong>Bezpieczniejsze automatyczne czyszczenie podczas
        pobierania danych.</strong> Gdy RetroDB ponownie pobiera dane gry,
        po cichu czyści odwołania do plików multimedialnych, które zniknęły
        z dysku. Wcześniej, jeśli cały folder z multimediami znikał naraz
        &mdash; odmontowany dysk zewnętrzny lub masowe usunięcie &mdash; to
        czyszczenie mogło skasować zapis o tym, jaką grafikę miały tysiące
        gier, wymuszając kosztowne ponowne pobieranie danych. RetroDB
        rozpoznaje teraz ten sygnał: jeśli folder z multimediami jest
        brakujący lub całkowicie pusty, zachowuje odwołania i zapisuje
        ostrzeżenie zamiast je kasować. Nowe narzędzie konserwacyjne
        stosuje to samo zabezpieczenie i wyraźnie oznacza każdy folder,
        który zostawiło nietknięty.</li>
    </ul>
- version: 3.16.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Nowy panel „Szybkie poprawki” na pulpicie
  body: |
    <ul>
      <li><strong>Nowy panel &ldquo;Szybkie poprawki&rdquo; na pulpicie</strong>
        zamienia rozproszone zadania biblioteki w listę rzeczy do zrobienia
        na pierwszy rzut oka. Pokazuje, ile gier wciąż nie ma okładki, i
        daje skróty jednym kliknięciem do wyszukiwania duplikatów ROM-ów
        oraz sprawdzania uszkodzonych ścieżek ROM-ów (gier, których pliki
        zostały przeniesione lub usunięte). Każdy skrót prowadzi
        bezpośrednio do strony, która to naprawia. Panel pojawia się, gdy
        w bibliotece znajdują się już jakieś gry.</li>
    </ul>
- version: 3.15.0
  date: '2026-07-03'
  tags:
  - type: accessibility
    label: Czytniki ekranu odczytują teraz na głos postęp zadań
  body: |
    <ul>
      <li><strong>Długo trwające zadania odczytują teraz swój postęp
        czytnikom ekranu.</strong> Podczas masowego pobierania danych,
        synchronizacji osiągnięć (RetroAchievements lub PlayStation) czy
        zmiany rozmiaru obrazów, użytkownicy czytników ekranu wcześniej nie
        słyszeli niczego między &ldquo;rozpoczęto&rdquo; a
        &ldquo;zakończono&rdquo;. RetroDB ogłasza teraz okresowe kamienie
        milowe (na przykład &ldquo;Masowe pobieranie danych: 12 z
        40&rdquo;) oraz zakończenie głosowe &mdash; bez dodatkowych okienek
        na ekranie. Ogłoszenia są rozłożone w czasie tak, aby informować
        bez nadmiernej gadatliwości, i podążają za wybranym przez Ciebie
        językiem.</li>
    </ul>
- version: 3.14.0
  date: '2026-07-01'
  tags:
  - type: feature
    label: Nowe języki — dostępny chiński (uproszczony i tradycyjny)
  body: |
    <ul>
      <li><strong>RetroDB jest teraz dostępny w języku chińskim.</strong> Pod
        <strong>Ustawienia &rarr; System &rarr; Język</strong> dostępne są
        dwa warianty: <strong>中文 (简体)</strong> (uproszczony, dla Chin
        kontynentalnych) oraz <strong>中文 (繁體)</strong> (tradycyjny, dla
        Hongkongu i Tajwanu). Cały interfejs &mdash; menu, przyciski,
        komunikaty oraz wbudowany podręcznik pomocy &mdash; jest
        przetłumaczony, a wszystko, co nie zostało jeszcze przetłumaczone,
        po cichu wraca do angielskiego. Liczba obsługiwanych języków
        wzrasta tym samym do dziesięciu (angielski, niemiecki, hiszpański,
        francuski, włoski, japoński, portugalski brazylijski, koreański, a
        teraz chiński uproszczony i tradycyjny).</li>
    </ul>
- version: 3.12.0
  date: '2026-06-30'
  tags:
  - type: feature
    label: Nowy język — dostępny koreański (한국어)
  body: |
    <ul>
      <li><strong>RetroDB jest teraz dostępny w języku koreańskim
        (한국어).</strong> Wybierz go w Ustawienia &rarr; System &rarr;
        Język. Cały interfejs &mdash; menu, przyciski, komunikaty oraz
        wbudowany podręcznik pomocy &mdash; jest przetłumaczony, co
        zwiększa liczbę obsługiwanych języków do ośmiu (angielski,
        niemiecki, hiszpański, francuski, włoski, japoński, portugalski
        brazylijski i koreański). Koreański uzupełnia obsługę wszystkich
        systemów ocen wiekowych gier wyświetlanych przez RetroDB, w tym
        południowokoreańskiego GRAC.</li>
    </ul>
- version: 3.11.0
  date: '2026-06-30'
  tags:
  - type: enhancement
    label: Wsparcie dla RetroDB na Patreon — dodano nowy link do darowizn
  body: |
    <ul>
      <li><strong>Możesz teraz wspierać RetroDB na Patreon.</strong> Link do
        Patreon znajduje się obok istniejącego przycisku &ldquo;Sponsoruj na
        GitHub&rdquo; w <strong>Ustawienia &rarr; System &rarr; Wsparcie
        rozwoju</strong>, w panelu O programie oraz w pliku README projektu.
        RetroDB pozostaje całkowicie darmowy i open source &mdash; darowizny
        są całkowicie opcjonalne i po prostu pomagają utrzymać rozwój przez
        jedną osobę.</li>
    </ul>
- version: 3.10.0
  date: '2026-06-26'
  tags:
  - type: enhancement
    label: Dziennik zmian ładuje się teraz szybciej dzięki przyciskowi „Wczytaj więcej”
  body: |
    <ul>
      <li><strong>Strona dziennika zmian otwiera się teraz znacznie
        szybciej.</strong> Zamiast rysować całą historię wydań (setki
        wpisów) za każdym razem, gdy ją otwierasz, RetroDB pokazuje teraz
        20 najnowszych wpisów i dodaje na dole przycisk <strong>Wczytaj
        więcej</strong>. Kliknij go, aby odsłonić kolejną partię, i tak
        dalej &mdash; starsza historia wciąż tam jest, po prostu ładuje się
        na żądanie zamiast spowalniać pierwsze wyświetlenie.</li>
    </ul>
- version: 3.9.0
  date: '2026-06-17'
  tags:
  - type: feature
    label: Podręcznik pomocy i ostatnie notatki wydania przetłumaczone na wszystkie 6 języków
  body: |
    <ul>
      <li><strong>Pełny wbudowany podręcznik pomocy jest teraz dostępny we
        wszystkich sześciu językach</strong> &mdash; niemieckim,
        francuskim, hiszpańskim, włoskim, japońskim i portugalskim
        brazylijskim &mdash; nie tylko po angielsku. RetroDB pokazuje
        podręcznik w języku wybranym w Ustawieniach i po cichu wraca do
        angielskiego, jeśli coś nie zostało jeszcze przetłumaczone.</li>
      <li><strong>Ten dziennik zmian pojawia się teraz również w Twoim
        języku</strong> dla najnowszych wydań, a nowe wydania będą
        tłumaczone od teraz. Starsza historia pozostaje po angielsku.</li>
      <li><strong>Strona Listy życzeń oraz ostatnie niedobitki
        angielskiego tekstu</strong> &mdash; partia wyskakujących
        komunikatów o błędach i stanie, które zostały pominięte, gdy
        pakiety językowe pojawiły się po raz pierwszy w wersji 3.8.0
        &mdash; tłumaczą się teraz poprawnie w całej aplikacji.</li>
    </ul>
- version: 3.8.2
  date: '2026-06-17'
  tags:
  - type: security
    label: Aktualizacja zależności bezpieczeństwa + poprawki CI
  body: |
    <ul>
      <li><strong>Bezpieczeństwo:</strong> zaktualizowano dołączoną
        bibliotekę <code>cryptography</code> (47 → 49), aby usunąć
        opublikowaną lukę bezpieczeństwa (GHSA-537c-gmf6-5ccf). Brak zmian
        w działaniu &mdash; po prostu bezpieczniejsza wersja.</li>
      <li>Naprawiono zautomatyzowany potok testów: brakujący pomocnik
        używany tylko w testach (<code>beautifulsoup4</code>) powodował
        niepowodzenie testów od wersji v3.7.0, a nowy skrypt budowania
        pakietu wywoływał kontrolę analizy statycznej, która jest znanym
        fałszywym alarmem (uruchamia zaufane polecenia budowania, a nie
        dane wejściowe użytkownika) &mdash; teraz jest to udokumentowane i
        skalibrowane. Tylko konserwacja; w samej aplikacji nic się nie
        zmienia.</li>
    </ul>
- version: 3.8.1
  date: '2026-06-17'
  tags:
  - type: improvement
    label: Mniejsza opcja pobierania, porządki w darowiznach i poprawka tłumaczenia (Pass
      46.3 / 47.6)
  body: |
    <ul>
      <li><strong>Nadchodzi znacznie mniejsze pobieranie.</strong> Gotowa do
        uruchomienia wersja RetroDB typu „rozpakuj i kliknij dwukrotnie”
        może być teraz budowana w wariancie <strong>tylko CPU</strong>
        (~600&nbsp;MB) dla osób, które nie mają karty graficznej AMD
        &mdash; to około jedna szósta rozmiaru pełnej wersji. Obie wersje
        będą oferowane obok siebie, abyś mógł wybrać tę, która pasuje do
        Twojego komputera.</li>
      <li><strong>Panel „Wsparcie rozwoju” w Ustawieniach tłumaczy się
        teraz</strong> wraz z resztą aplikacji &mdash; przez przypadek
        pozostał po angielsku, gdy pakiety językowe pojawiły się w wersji
        3.8.0.</li>
      <li>Uporządkowano linki do darowizn (plakietka GitHub Sponsors w
        README; plik finansowania jest gotowy na Patreon i
        Buy&nbsp;Me&nbsp;A&nbsp;Coffee, gdy tylko zostaną skonfigurowane).
        Żadnych natrętnych okienek, nigdy.</li>
      <li>W tle: potok wydań może teraz automatycznie budować gotowe do
        uruchomienia wersje dla Windows, macOS i Linux. Uwaga: obszerny
        wbudowany podręcznik <em>Pomocy</em> jest na razie dostępny tylko
        po angielsku &mdash; jest to odnotowane jako przyszłe zadanie.</li>
    </ul>
- version: 3.8.0
  date: '2026-06-12'
  tags:
  - type: feature
    label: Pełne tłumaczenie interfejsu + 6 języków (Pass 43.2/43.3/43.5)
  body: |
    <ul>
      <li><strong>RetroDB mówi teraz w 6 kolejnych językach.</strong>
        Bazując na fundamentach z wersji 3.7.0, cały interfejs stał się
        tłumaczalny i został przetłumaczony maszynowo na <strong>niemiecki,
        francuski, hiszpański, włoski, japoński i portugalski
        brazylijski</strong>. Wybierz swój język w Ustawienia &rarr;
        Preferencje wyświetlania &rarr; Język; podąża on za zapisaną
        preferencją, następnie za przeglądarką, a na końcu wraca do
        angielskiego &mdash; nigdy nie może utknąć na brakującym
        języku.</li>
      <li><strong>Wszystko na ekranie jest objęte tłumaczeniem</strong>:
        tekst stron i przyciski, wyskakujące komunikaty (małe powiadomienia
        typu „toast”), okna dialogowe edycji i ustawień, podpowiedzi oraz
        etykiety dla czytników ekranu. Gatunki gier, perspektywy i tryby
        rozgrywki (np. &ldquo;First-Person-Shooter&rdquo;) wyświetlają się
        teraz również w Twoim języku &mdash; podczas gdy dane źródłowe
        pozostają po angielsku, dzięki czemu Twoja biblioteka i filtry
        działają dokładnie tak samo jak wcześniej.</li>
      <li>Wbudowany <strong>język &ldquo;Pseudo&rdquo;</strong> (widoczny w
        menu Język) to narzędzie kontroli jakości dla tłumaczy, które
        ujmuje w nawiasy i akcentuje każdą etykietę, dzięki czemu od razu
        widać, czy jakiś tekst został pominięty.</li>
      <li>Tłumaczenia maszynowe są punktem wyjścia i miejscami mogą brzmieć
        nieco sztywno &mdash; łatwo je z czasem dopracować, a każdy tekst
        bez tłumaczenia po prostu wyświetla się po angielsku.</li>
    </ul>
