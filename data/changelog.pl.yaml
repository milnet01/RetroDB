  - type: fix
    label: Data wydania pokazuje się teraz tylko z dokładnością znaną źródłu. Gra znana tylko z roku pokazuje sam rok, a nie zmyślony 1 stycznia czy 31 grudnia
  - type: fix
    label: Daty z IGDB i RAWG należą teraz do własnej konsoli gry, a daty z IGDB także do jej własnego regionu, więc kopia z USA nie pokazuje już daty japońskiej, a port roku oryginału
  - type: feature
    label: Lista Dat wydania na stronie gry wypełnia się teraz z IGDB i ScreenScraper, nie tylko z AI
  - type: added
    label: 'Nowa karta Narzędzi ROM: Uporządkuj daty wydania usuwa zmyślone dni zapisane przez starsze pobrania, aby pobranie danych mogło wpisać prawdziwą datę'
  - type: fix
    label: Gatunki, perspektywy i tryby gry używają teraz jednego zestawu nazw niezależnie od źródła, więc filtry znajdują każdą grę. Jeden gatunek nie wyświetla się już jako RPG i Role Playing Game
  - type: added
    label: 'Nowa karta Narzędzi ROM: Uporządkuj gatunki, perspektywy i tryby konwertuje dane zapisane przez starsze pobrania, przenosi słowa takie jak FPV do właściwego pola i poprawia liczby graczy sprzeczne z trybami gry'
  - type: fix
    label: Gry tylko online z IGDB nie są już wymieniane jako gry wieloosobowe lokalnie, a gra wymagająca dwóch graczy nie jest już wymieniana jako jednoosobowa
  body: "<ul>\n  <li><strong>Pobieranie danych przestaje brać złą grę.</strong> Kontynuacja nie uchodzi już za posiadaną grę, więc Street Fighter II nic nie dostaje ze Street Fighter, a zbiorcze pobieranie wymaga zgodnego tytułu, nie tylko konsoli. Mody, DLC i pakiety z IGDB nie pasują, chyba że twój ROM ma dokładnie taką nazwę.</li>\n  <li><strong>RAWG przestaje mieszać wersje gry.</strong> Gdy jego rekord obejmuje kilka konsol, nie podaje już dewelopera, wydawcy, kategorii wiekowej ani trybów wieloosobowych i nie zgaduje liczby graczy. Nie jest już przeszukiwany pod kątem gier na Commodore 64 i DOS.</li>\n  <li><strong>Kolejność twoich scraperów rozstrzyga równe dopasowania.</strong> RAWG nie dostaje już dodatkowych punktów za obraz ani wynik Metacritic, a nowe instalacje umieszczają go na końcu.</li>\n  <li><strong>Data wydania pokazuje tylko to, co zna źródło.</strong> Gra znana tylko z roku pokazuje ten rok. Daty z IGDB i RAWG należą do własnej konsoli gry, a lista Dat wydania wypełnia się teraz także z IGDB i ScreenScraper.</li>\n  <li><strong>Jeden zestaw nazw gatunków, perspektyw i trybów.</strong> Filtry znajdują teraz każdą grę, a gry tylko online nie są już wymieniane jako wieloosobowe lokalnie.</li>\n  <li><strong>Dwie nowe karty Narzędzi ROM.</strong> Uporządkuj daty wydania oraz Uporządkuj gatunki, perspektywy i tryby poprawiają dane zapisane przez starsze pobrania. Naciśnij je, a potem uruchom zbiorcze pobieranie danych z opcją Uzupełnij brakujące.</li>\n  <li><strong>Liczby graczy pochodzą z własnej konsoli gry,</strong> a wybrany wynik ze ScreenScraper to zawsze ta gra, którą dostajesz.</li>\n</ul>\n"
