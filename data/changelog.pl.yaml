    label: RAWG ma jeden rekord dla wszystkich wersji gry, więc gdy obejmuje kilka konsol, nie podaje już dewelopera, wydawcy, kategorii wiekowej ani trybów wieloosobowych. Nie zgaduje też w ogóle liczby graczy
  - type: fix
    label: Liczby graczy i tryby wieloosobowe z IGDB pochodzą teraz z własnej konsoli danej gry
