  - type: fix
    label: ES-DE nie kopiuje już fanartu, wideo ani instrukcji, które gra już ma, a Pełne ponowne pobranie nie usuwa już okładki pobranej przed chwilą z innego źródła
  - type: fix
    label: ES-DE odczytuje teraz wpis dla właściwego pliku ROM gry, więc inna wersja o tej samej nazwie nie może podać swoich danych, a gry PS3 w folderach znajdują swoje okładki z ES-DE
