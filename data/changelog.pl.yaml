- version: 4.0.0
  date: '2026-11-10'
  tags:
  - type: security
    label: 'Ustawienia → Mój profil nie wysyła już do strony zapisanego klucza RetroAchievements, tokenu PSN ani klucza Steam. Każde pole pokazuje tylko ostatnie cztery znaki, jak już robiły klucze na karcie Pobieranie danych. Zapisanie bez ponownego wpisywania zachowuje zapisany klucz, a przycisk PSN „Zapisz i przetestuj połączenie” testuje zapisany token'
  - type: fix
    label: 'Przeglądarka dzienników nie otwiera się już na „Nieprawidłowy plik dziennika”. Wymieniała dzienniki pomocnicze, których nie chciała pokazać, i jeden z nich otwierała jako pierwszy; teraz wymienia tylko dzienniki, które może otworzyć'
  - type: fix
    label: 'Karta PSN w Importach gier kieruje teraz po token NPSSO do Ustawienia → Mój profil, gdzie jest to pole, zamiast do Ustawienia → Klucze API, a jej stan połączenia można przetłumaczyć'
  - type: fix
    label: 'Po zalogowaniu jako widz strony nie proszą już serwera o informacje tylko dla administratora, których i tak nie mogą dostać, więc dziennik serwera nie zapełnia się już odrzuconymi żądaniami'
  - type: security
    label: 'Nazwy pochodzące spoza RetroDB (pobrane dane, nazwy plików i folderów, odpowiedzi usług online) są teraz zawsze pokazywane jako zwykły tekst: na stronie gry, w Ustawieniach, Raportach, narzędziach ROM, na stronach trofeów i w innych miejscach. Strony wykonują też tylko akcje własnych przycisków, więc spreparowana nazwa nie może zmusić strony do żadnego działania, a link „wróć do” w powiadomieniu o postępie nie może już prowadzić do innej witryny'
  - type: enhancement
    label: 'Zbiorcze pobierania danych w kolejce mają przycisk Zmień kolejność. Otwiera on Menedżer kolejki, w którym oczekujące pobieranie może ruszyć wcześniej, później albo zamienić się z tym, które trwa teraz. Każde powiadomienie w kolejce zachowuje też swój numer miejsca po zmianie'
  - type: fix
    label: 'Postęp zadań już się nie zawiesza ani nie powtarza. Sprawdzanie lub konwersja CHD, które ulegną awarii, kończą się teraz z podaniem przyczyny; Anuluj przywraca stronie jej przyciski; odrzucone anulowanie, wstrzymanie lub usunięcie jest zgłaszane; „ukończono” nie wyskakuje ponownie godzinę później; a przycisk Synchronizuj na stronie osiągnięć wraca po zakończeniu synchronizacji'
  - type: fix
    label: 'Zapisanie dopasowania HowLongToBeat na stronie gry nie usuwa już linku HLTB ani liczby graczy, a nieudany zapis można ponowić. Szybka edycja nie pokazuje już każdego zapisanego dopasowania jako „100% dopasowania”. Tagi filtrów w Bibliotece pokazują nazwę systemu zamiast jego numeru, a wyszukiwanie w trakcie pisania działa na stronach list i w Porównaj'
  - type: fix
    label: 'Każde konto może zmienić własne hasło w Ustawienia → Mój profil, a administrator może zresetować hasło każdego. Foldery emulatorów działają teraz w Windows. Panel nie mówi już edytorom i widzom, że ich API są offline, a „Gry bez okładki” otwiera Bibliotekę z samymi tymi grami. Menedżer haseł może teraz wypełnić pole logowania'
  - type: fix
    label: 'Narzędzia ROM: Weryfikacja CHD umieszcza każdą plakietkę Prawidłowe lub Nieprawidłowe przy właściwym pliku; przeglądarka dzienników znów pokazuje nazwy modułów i informuje, gdy jej lista plików się nie wczyta; Zaznacz wszystko w Importach gier importuje tylko gry widoczne w Twoim filtrze; a Resetuj w Ustawieniach narzędzi ROM przywraca własny folder ROM tego komputera'
  - type: fix
    label: 'Czasy odblokowania w Steam są pokazywane jako daty; pasek A-Z działa w Lokalnych trofeach; tryb wyboru PSN działa dalej przy grach wczytywanych podczas przewijania; widzowie nie widzą już przycisków Synchronizuj ani Zmień nazwę, których nie mogą użyć; wsadowa zmiana nazw pomija plik, którego nazwę zmieniono od skanowania; a Analityka potrafi kopiować w zwykłej sieci HTTP i eksportuje liczby jako liczby'
  - type: fix
    label: 'W oknie potwierdzenia Enter na Anuluj lub × teraz anuluje zamiast potwierdzać. Okno otwarte przez OK już nie znika, a Tab działa dalej po zamknięciu listy skrótów lub okna postępu'
  - type: enhancement
    label: 'Wiele elementów, które działały tylko myszą, działa teraz z klawiatury (Tab, potem Enter lub Spacja): profile logowania, wyniki wyszukiwania w Porównaj, tagi z przyciskami Edytuj i Usuń, karty gier w osiągnięciach, sesje dziennika, wybór motywu i awatara, zdjęcia w Muzeum, ×, który usuwa gatunek lub filtr, foldery w konfiguracji, pola wyboru źródeł scrapowania i import CLZ. Przełączniki wł./wył. pokazują teraz pierścień klawiatury'
  - type: performance
    label: 'Narzędzie do usuwania tła w Muzeum nie zostaje już w pamięci. Wycinało ono zdjęcia kontrolerów z tła za pomocą modelu AI, który po pierwszym użyciu zajmował ponad 2 GB, a podczas obróbki zdjęcia nawet około 9 GB, aż do ponownego uruchomienia RetroDB. Teraz działa w programie pomocniczym, który uruchamia się w razie potrzeby i zamyka dwie minuty po ostatnim zdjęciu, oddając całą tę pamięć'
    en: 'The Museum''s background remover no longer stays in memory. It cut controller photos out of their background with an AI model that took over 2 GB once used, and up to about 9 GB during a photo, until RetroDB restarted. It now runs in a helper that starts when needed and closes two minutes after its last photo, giving all of that memory back'
  - type: feature
    label: 'Import z Xbox nie wymaga już konta Microsoft Azure. Każdy wkleja teraz własny darmowy klucz OpenXBL (z xbl.io) w Ustawienia → Mój profil, a import działa z każdego komputera w Twojej sieci. Import pomija też aplikacje i gry tylko na telefon, umieszcza gry na PC w systemie Windows zamiast Xbox One, poprawnie odczytuje osiągnięcia z Xbox 360 i nie pokazuje daty przy zablokowanym osiągnięciu. Darmowy klucz pozwala na 150 zapytań na godzinę: duża synchronizacja osiągnięć, która dojdzie do limitu, zatrzymuje się, informuje o tym, a następnym razem zaczyna od gier, do których jeszcze nie dotarła'
    en: 'Xbox import no longer needs a Microsoft Azure account. Each person now pastes their own free OpenXBL key (from xbl.io) under Settings → My Profile, and it works from any computer on your network. The import also leaves out apps and phone-only games, files PC games under Windows instead of Xbox One, reads Xbox 360 achievements the right way, and shows no date for a locked achievement. The free key allows 150 requests an hour: a big achievement sync that reaches it stops, says so, and next time starts with the games it had not reached'
  - type: enhancement
    label: Synchronizacja lub odświeżenie RetroAchievements, o które poprosisz, gdy działa już inne, czeka teraz na serwerze i uruchamia się samo, gdy poprzednie się zakończy, nawet jeśli zamkniesz stronę lub poprosisz o nie z innego urządzenia. Każda strona pokazuje tę samą listę oczekujących z miejscem każdego zadania w kolejce, a ✕ usuwa zadanie z listy. Po restarcie serwera oczekujące zadania są proponowane ponownie na Pulpicie
    en: A RetroAchievements Sync or Refresh you ask for while another one runs now waits on the server and starts by itself when that one finishes, even if you close the page or asked from another device. Every page shows the same waiting list with each job's place in line, and ✕ takes a job out. After a server restart, waiting jobs are offered back on the Dashboard
  - type: fix
    label: Przycisk Odśwież RA na stronie konsoli znów działa. Nie podawał, o którą konsolę chodzi, więc serwer odpowiadał „Nie znaleziono”
    en: The Refresh RA button on a console's page works again. It did not say which console, so the server answered "Not found"
  - type: fix
    label: Sprawdzanie nazw ROM-ów traktuje teraz każdy system tak, jak pokazuje go strona Systemy. Macintosh, ZX Spectrum Next, Coleco Adam i Thomson są sprawdzane jako komputery, a 3DS i PS Vita jako przenośne, a nie jako konsole. Typ ustawiony na stronie Systemy też jest teraz uwzględniany
    en: The ROM naming check now treats each system as the kind the Systems page shows. Macintosh, ZX Spectrum Next, Coleco Adam and Thomson are checked as computers, and 3DS and PS Vita as handhelds, instead of as consoles. A type you set on the Systems page is now followed too
  - type: performance
    label: RetroDB zużywa teraz znacznie mniej pamięci podczas bezczynności. Skaler obrazów AI ładuje się tylko na czas skalowania, w osobnym procesie pomocniczym, który zamyka się dwie minuty po ostatnim obrazie. Bezczynny serwer zużywał wcześniej około 1,4 GB, a teraz poniżej 100 MB. Jeśli sterownik grafiki ulegnie awarii podczas skalowania, zatrzyma się tylko proces pomocniczy, a nigdy serwer
    en: RetroDB uses far less memory while it waits. The AI image upscaler now loads only while it is upscaling, in a helper that closes two minutes after its last picture; an idle server dropped from about 1.4 GB to under 100 MB. If the graphics driver crashes during an upscale, only the helper stops, never the server
  - type: performance
    label: Uzupełnianie AI z wyszukiwaniem w sieci przez Claude kosztuje mniej. Claude po każdym wyszukiwaniu ponownie czyta jego wyniki; RetroDB prosi teraz Anthropic o przechowywanie ich w pogotowiu, dzięki czemu ponowne odczytanie kosztuje dziesiątą część ceny lub mniej
    en: AI Fill with Claude web search costs less. Claude reads the search results again after each search; RetroDB now asks Anthropic to keep them ready, and a re-read then costs a tenth of the price or less
  - type: fix
    label: 'Zulu i xhosa czytają się lepiej: poprawiono 133 linie, które mówiły coś innego, np. „Edition” pokazane jako „Chapter” oraz „must be text” pokazane jako „must be a letter”. Każdą poprawkę uzgodniły dwie osobne kontrole AI'
    en: 'Zulu and Xhosa read better: 133 lines that said the wrong thing are corrected, such as "Edition" shown as "Chapter" and "must be text" shown as "must be a letter". Each correction was agreed by two separate AI checks'
  - type: fix
    label: Gdy gra się nie uruchamia, komunikat jest teraz w Twoim języku i nadal wskazuje emulator, rdzeń lub plik, który zawiódł. Awaria wewnątrz samego komputera pokazuje teraz „Nie udało się uruchomić” i nazwę programu, a szczegóły trafiają do dziennika serwera, zamiast surowego tekstu systemowego. Odrzucone logowanie do RetroAchievements pokazuje własny powód podany przez RetroAchievements w przetłumaczonym zdaniu
    en: When a game will not start, the message is now in your language and still names the emulator, core or file at fault. A failure inside the computer itself now says "Could not start" and the program's name, with the details in the server log, instead of raw system text. A refused RetroAchievements sign-in shows RetroAchievements' own reason inside a translated sentence
  - type: fix
    label: Anulowanie zadania pobierania danych, synchronizacji lub obrazów, które już się zakończyło, usuwa teraz zawieszone okienko postępu. Uruchomienie zadania, które już trwa, pokazuje prawdziwy powód, np. "A scrape for SNES is already running", zamiast "Błąd sieci". Błędy obrazów kontrolerów w Muzeum mówią teraz, co poszło nie tak, a anulowanie synchronizacji RetroAchievements innego użytkownika informuje, że należy ona do niego, zamiast udawać anulowanie
    en: Cancelling a scrape, sync or image job that has already finished now clears its stuck progress popup. Starting a job that is already running shows the real reason, such as "A scrape for SNES is already running", instead of "Network error". Controller image errors in the Museum now say what went wrong, and cancelling another user's RetroAchievements sync says it is theirs instead of pretending to cancel it
  - type: security
    label: Przeglądarka logów ukrywa teraz hasła i klucze także w starszych plikach logów. Logi zapisane, zanim RetroDB nauczył się ukrywać dane hasło, np. do ScreenScraper, pokazywały je jawnym tekstem przy podglądzie lub pobraniu
    en: The log viewer now hides passwords and keys in older log files too. Logs written before RetroDB learned to hide a particular password, such as ScreenScraper's, showed it in plain text when viewed or downloaded
  - type: security
    label: Przywrócenie wszystkich ustawień domyślnych zachowuje teraz folder ROM-ów i informację, że konfiguracja została ukończona. Wcześniej reset otwierał ponownie strony pierwszej konfiguracji, które działają bez logowania, dopóki administrator nie uruchomił konfiguracji ponownie
    en: Resetting all settings to their defaults now keeps your ROM folder and the fact that setup is done. Before, a reset reopened the first-time setup pages, which work without signing in, until an admin ran setup again
  - type: feature
    label: Gry arcade znów mogą zdobywać osiągnięcia RetroAchievements. RetroDB łączy teraz grę arcade tylko wtedy, gdy RetroAchievements zna dokładną nazwę jej pliku, np. sf2 dla Street Fighter II, więc nie zgaduje już po tytułach i nie łączy z niewłaściwą grą. Twoje gry arcade zostaną połączone przy następnym odświeżeniu danych RetroAchievements lub po pobraniu ich danych
    en: Arcade games can earn RetroAchievements again. RetroDB now links an arcade game only when RetroAchievements knows its exact file name, such as sf2 for Street Fighter II, so it no longer guesses from titles and links the wrong game. Your arcade games link the next time their RetroAchievements data is refreshed or they are scraped
  - type: fix
    label: Synchronizacja trofeów PlayStation poprawia teraz błędne powiązania gier, które wcześniej utworzyła, np. wiele gier powiązanych z niepowiązaną grą o nazwie "D". Powiązanie ustawione przez Ciebie nigdy nie jest zmieniane przez synchronizację. Następna synchronizacja ponownie sprawdzi wszystkie starsze powiązania, więc kilka niedokładnych dopasowań może zostać rozłączonych; połącz je ponownie ręcznie
    en: PlayStation trophy sync now corrects game links it made wrongly before, such as many games linked to an unrelated game called "D". A link you set yourself is never changed by a sync. The next sync checks all older links again, so a few near matches may come unlinked; link those again by hand
  - type: fix
    label: Przesunięcie oczekującego zbiorczego pobierania danych przed trwające nie dodaje już ostatniej gry starego zadania do liczników nowego. Kliknięcie "Pobierz dane dla wszystkich" na liście życzeń, gdy już jedno trwa, informuje o tym zamiast twierdzić, że się rozpoczęło
    en: Moving a waiting bulk scrape ahead of a running one no longer adds the old scrape's last game to the new one's counts. Clicking "Scrape all" on the wishlist while one is already running now says so, instead of claiming it started
  - type: accessibility
    label: 'Z czytnikiem ekranu przycisk "uruchomione" mówi teraz "1 gra uruchomiona" tylko przy zmianie liczby, zamiast co kilka sekund czytać samą liczbę. Jego lista otwiera się jako nazwane okno z kursorem w środku, przyciski Zakończ i Następny dysk podają, której gry dotyczą, a po Zakończ kursor wraca w rozsądne miejsce. Każda karta gry w bibliotece otwiera się teraz z klawiatury od tytułu, a jej przyciski filtrów mówią, co filtrują, np. "Filtruj wg: Deweloper: Konami"'
    en: 'With a screen reader, the "running" button now says "1 game running" only when the count changes, instead of reading a bare number every few seconds. Its list opens as a named window with the cursor inside, its Kill and Next disk buttons say which game they act on, and after Kill the cursor returns to a sensible place. Each game card in the library now opens with the keyboard from its title, and its filter buttons say what they filter, such as "Filter by Developer: Konami"'
  - type: feature
    label: Każdy członek może teraz dodać własny klucz Steam i Steam ID w Ustawienia → Mój profil oraz importować własną bibliotekę Steam i osiągnięcia. Dotąd mógł to robić tylko administrator
    en: Every member can now add their own Steam key and Steam ID under Settings → My Profile, and import their own Steam library and achievements. Until now only an admin could
  - type: fix
    label: Zapisanie szczegółów gry nie ustawia już pustej liczby graczy na 1 ani nie oznacza ocen wiekowych ustalonych przez RetroDB jako wpisanych przez Ciebie. Uzupełnianie AI zachowuje grę oznaczoną jako Exclusive oraz każdą zmianę, którą wprowadzisz w grze, gdy czeka na odpowiedź AI. Historia pobierania danych wyświetla teraz tylko szczegóły, które faktycznie zapisano
    en: Saving a game's details no longer sets an empty player count to 1, and no longer marks the age ratings RetroDB worked out for you as typed by you. AI Fill keeps a game you marked Exclusive, and keeps any change you make to a game while it is waiting for the AI's answer. A scrape's history now lists only the details it actually saved
  - type: fix
    label: Przegląd zrzutów ekranu nie zatrzymuje się już w połowie, gdy jeden zapisany zrzut jest zbyt duży do otwarcia; liczy go jako nieczytelny i idzie dalej. Spis treści strony pomocy zawiera teraz linki do Emulatory i Granie, a notatki dla deweloperów o logowaniu, zadaniach w tle, pobieraniu danych, obrazach, aktualizacjach i odpowiedziach błędów opisują teraz, co program naprawdę robi
    en: Screenshot Review no longer stops halfway when one stored screenshot is far too large to open; it counts that picture as unreadable and carries on. The help page's contents list now links to Emulators and Playing, and the developer notes on sign-in, background jobs, scraping, pictures, updates and error replies now say what the program really does
  - type: fix
    label: Redaktor, który uruchomi skanowanie w Narzędziach ROM, może je teraz wstrzymać, wznowić lub anulować; skanowania innych osób nadal może zatrzymać tylko administrator. Tagi i listy odrzucają brak nazwy lub zły kolor z czytelnym komunikatem zamiast strony błędu, a zmiana nazwy gry z listy życzeń na grę, którą już chcesz, jest odrzucana, tak jak jej dodanie. Wyczyść dane RA zapomina teraz także, czy Twoja kopia zdobywa osiągnięcia. Trofeum, którego RetroDB już nie oferuje, przestaje liczyć się do rangi kolekcjonera. Ścieżki ROM z Windows dopasowują teraz gry RetroAchievements po nazwie pliku
    en: An editor who starts a ROM Tools scan can now pause, resume or cancel it; other people's scans stay an admin's to stop. Tags and lists refuse a missing name or a bad colour with a clear message instead of an error page, and renaming a wishlist game onto another one you already wish for is refused, as adding it is. Clear RA Data now also forgets whether your copy earns achievements. A trophy RetroDB no longer offers stops counting toward your collector rank. Windows ROM paths now match RetroAchievements games by file name
  - type: fix
    label: Poprawki konserwacyjne. Archiwum wielopłytowe, którego rozpakowanie się nie powiodło, nie zostawia już niedokończonego folderu blokującego każdą kolejną próbę. Oblicz miejsce teraz liczy każdy plik w folderze gry PS3. Wyczyść pobrane dane usuwa obrazy tylko na Twoje życzenie. Skanowanie biblioteki, które trafi na grę właśnie dodaną przez inne skanowanie, kontynuuje pozostałe gry tej konsoli
    en: Maintenance fixes. A multi-disc archive that fails to unpack no longer leaves a half-made folder behind that blocks every retry. Calculate Storage now counts every file inside a PS3 game folder. Clear Scraped Data deletes pictures only when you ask it to. A library scan that meets a game another scan has just added carries on with the rest of that console's games
  - type: fix
    label: Przywracanie kopii zapasowej jest bezpieczniejsze. Jest teraz zapisywana do bazy biblioteki tak, jak oczekuje tego sama baza, więc część RetroDB, która ją ma otwartą, widzi przywrócone dane zamiast ryzykować uszkodzenie. Usunięcie gry usuwa teraz także jej obrazy pudełka oraz oczekujące wpisy obrazów i ustawień emulatora, więc nowa gra nigdy ich nie odziedziczy. Dwa ustawienia zapisane w tej samej chwili nie gubią już jednego z nich
    en: Restoring a backup is safer. It is now written into the library database the way the database itself expects, so a part of RetroDB that has it open sees the restored data instead of risking damage. Deleting a game now also deletes its box pictures and its waiting picture and emulator-setting entries, so a new game can never inherit them. Two settings saved at the same moment no longer lose one of them
  - type: fix
    label: Poprawki obrazów. GIF-y nie są już przepuszczane przez skaler tylko po to, by je odrzucić. Model skalera jest sprawdzany względem opublikowanego odcisku, a nieudane pobranie jest ponawiane zamiast na stałe wyłączać skalowanie. Logo i obrazy z przezroczystymi częściami zachowują przezroczystość po powiększeniu. Konwersja do WebP obejmuje teraz także tylne okładki i logo oraz nie odmawia już dużej biblioteki z powodu miejsca, którego nie potrzebuje. Dwie strony pliku pudełka mogą dzielić jeden obraz, a usunięcie pudełka z uszkodzonym rekordem usuwa jego obrazy
    en: Picture fixes. GIFs are no longer run through the upscaler only to be thrown away. The upscaler model is checked against its published fingerprint, and a bad download is fetched again instead of turning upscaling off for good. Logos and pictures with see-through parts keep their transparency when enlarged. Convert to WebP now takes back covers and logos too, and no longer refuses a large library for want of room it does not need. Two faces of a box file can share one picture, and removing a box with a damaged record removes its pictures
  - type: fix
    label: Importy z CLZ, Steam, Xbox i PlayStation nie traktują już każdego tytułu zapisanego tylko po japońsku lub innym nielacińskim pismem jako tej samej gry i nie dodają gry bez id. Podgląd CLZ nie dodaje konsol przed potwierdzeniem importu, a widz oglądający bibliotekę Steam, Xbox lub PlayStation też ich nie dodaje. O grę Steam usuniętą ze sklepu pytamy raz, a nie przy każdej synchronizacji
    en: Imports from CLZ, Steam, Xbox and PlayStation no longer treat every title written only in Japanese or another non-Latin script as the same game, and no longer add a game with no id. The CLZ preview no longer adds consoles before you confirm the import, and a viewer looking at a Steam, Xbox or PlayStation library no longer adds them either. A Steam game removed from the store is asked about once, not on every sync
  - type: fix
    label: Analityka grupuje teraz znacznie więcej konsol pod ich producentem zamiast pod "Inne", a lista Ostatnio pobrane na pulpicie pokazuje grę pobraną ponownie, nie tylko nowo dodane gry
    en: Analytics now groups many more consoles under their maker instead of "Other", and the dashboard's Recently Scraped list shows a game you scraped again, not only newly added games
  - type: fix
    label: Obrazy kontrolerów dodane w Muzeum są zachowywane przy aktualizacji wersji samodzielnej. Gdy usługa online wstrzymuje się przy limicie, czas ponownego zapytania jest pokazywany w Twojej strefie czasowej
    en: Controller pictures you add in the Museum are kept when the standalone version updates. When an online service pauses at its limit, the time it will be asked again is shown in your own time zone
  - type: fix
    label: Płyta bonusowa nie może już być powiązana sama ze sobą ani z inną płytą bonusową, a automatyczne łączenie nie łączy płyty z taką, którą w tym samym przebiegu oznaczyło jako bonusową
    en: A bonus disc can no longer be linked to itself or to another bonus disc, and Auto-link no longer links a disc to one it marks as a bonus disc in the same run
  - type: fix
    label: Strony Biblioteki i konsol nie liczą już plików BIOS z gier arcade jako gier, ani w sumach, ani na pasku liter. Podobne gry oraz lista po kliknięciu gatunku lub wydawcy na stronie gry nie pokazują już regionalnych wersji tej gry, płyt bonusowych ani plików BIOS
    en: The Library and console pages no longer count arcade BIOS files as games, in their totals or the letter bar. Similar games, and the list you get by clicking a genre or publisher on a game's page, no longer show the game's own regional versions, bonus discs or BIOS files
  - type: fix
    label: Zaznacz wszystko informuje teraz, gdy bardzo długa lista została ucięta, zamiast po cichu zaznaczać tylko jej część
    en: Select all now says so when a very large list is cut short, instead of quietly selecting only part of it
  - type: fix
    label: Karty biblioteki aktualizują się teraz, gdy zmieni się postęp osiągnięć lub trofeów oraz gdy gra staje się grywalna lub przestaje nią być
    en: Library cards now update when your achievement or trophy progress changes, and when a game becomes playable or stops being playable
  - type: fix
    label: Edycja zbiorcza nie może już zmienić niewłaściwych gier po otrzymaniu błędnego zaznaczenia, a nieudana edycja zbiorcza nie oznacza gier jako edytowanych przez Ciebie
    en: Bulk edit can no longer change the wrong games when it is sent a bad selection, and a bulk edit that fails no longer marks the games as edited by you
  - type: fix
    label: Dopasowanie HowLongToBeat na poziomie zaledwie 1% nie jest już pokazywane jako 100%, a strona, która się nie wczyta, pokazuje stronę błędu zamiast surowego tekstu błędu
    en: A HowLongToBeat match that is only a 1% fit is no longer shown as a 100% match, and a page that fails to load shows the error page instead of the raw error text
  - type: security
    label: Zmiana hasła lub jego reset przez administratora wylogowuje teraz to konto na wszystkich innych urządzeniach. Z tego powodu po tej aktualizacji wszyscy zalogują się jeszcze raz. Strona pierwszej konfiguracji ma też taką samą ochronę przed innymi witrynami jak każda inna strona
    en: Changing your password, or an admin resetting it, now signs that account out on every other device. Because of this, everyone signs in once more after this update. The first-run setup page also gets the same protection against other websites as every other page
  - type: fix
    label: Obraz odrzucony jako awatar nie usuwa już Twojego dotychczasowego awatara
    en: A picture that is refused as your avatar no longer deletes the avatar you had
  - type: fix
    label: Pobieranie danych mniej obciąża usługi online. Usługa, która ciągle zawodzi, jest pomijana przez pewien czas przy uzupełnianiu braków, tak jak już było w wyszukiwaniach, a wyszukiwania gier w ScreenScraper respektują teraz także jego dzienne limity
    en: Scrapes are gentler on the online services. A service that keeps failing is skipped for a while when filling gaps, as it already was in searches, and ScreenScraper game lookups now respect its daily limits too
  - type: fix
    label: Pobieranie danych nie kończy się już błędem dla gry z nieznanym rokiem wydania, np. "TBA", a gra wydana w regionach spoza Twojej listy, np. "Brazil, Korea", zachowuje swój region zamiast zmieniać się na domyślny
    en: A scrape no longer fails on a game whose release year is unknown, such as "TBA", and a game listed for regions outside your list, such as "Brazil, Korea", keeps its region instead of becoming your default
  - type: fix
    label: Foldery ES-DE zapisane jako ~/ działają teraz, a bardzo duży plik ES-DE nie jest już kopiowany. Sugerowane wersje regionalne nigdy nie łączą ponownie dwóch gier, o których powiedziano, że nie są swoimi wersjami
    en: ES-DE folders written as ~/ now work, and a very large ES-DE file is no longer copied. Suggested regional versions never put back together two games you said are not versions of each other
  - type: security
    label: RetroDB odrzuca jeszcze kilka prywatnych adresów sieciowych przy pobieraniu obrazów z internetu i poprawnie podąża za przekierowaniem adresu WWW
    en: RetroDB refuses a few more private network addresses when fetching pictures from the web, and follows a web address's redirect correctly
  - type: fix
    label: Ostatnie ekrany, które były jeszcze po angielsku, też korzystają teraz z Twojego języka, w tym kreator konfiguracji, Tagi, Listy, Porównanie gier, ustawienia Narzędzi ROM, kolejka zbiorczego pobierania danych, lista przerwanych zadań na pulpicie, etykiety kart biblioteki i wiele komunikatów błędów
    en: The last screens still in English now follow your language too, including the setup wizard, Tags, Lists, Compare Games, ROM Tools settings, the bulk scrape queue, the dashboard's interrupted-jobs list, the library card labels and many error messages
  - type: security
    label: Nazwa systemu zawierająca kod WWW nie może już go uruchomić w oknie kolejki zbiorczego pobierania danych
    en: A system name holding web code can no longer run it in the bulk scrape queue window
  - type: accessibility
    label: Gdziekolwiek jesteś na stronie, miejsce klawiatury jest teraz oznaczone grubą obwódką w kolorze Twojego motywu, na każdym przycisku, polu i linku. Wcześniej wiele kontrolek pokazywało tylko słabą linię, taką samą jak po najechaniu myszą
    en: Wherever you are on a page, the keyboard's place is now marked with a bold ring in your theme's colour, on every button, box and link. Before, many controls showed only a faint line, the same as when the mouse passed over them
  - type: accessibility
    label: Linki Gatunek, Seria, Deweloper i Wydawca na kartach biblioteki działają teraz z klawiatury. Przycisk "uruchomione" dla trwających gier też otwiera się z klawiatury, a Esc lub kliknięcie gdzie indziej zamyka jego listę
    en: The Genre, Series, Developer and Publisher links on library cards now work from the keyboard. The "running" button for games in play opens from the keyboard too, and Esc or a click elsewhere closes its list
  - type: accessibility
    label: Czytniki ekranu nazywają teraz każdy kolor tagu i mówią, który jest wybrany, a obrazy trofeów czytają jako Platynowe, Złote, Srebrne i Brązowe zamiast pojedynczych liter. Podczas uruchamiania gry Tab nie wchodzi już za ekran startowy
    en: Screen readers now name each tag colour and say which one is chosen, and read trophy pictures as Platinum, Gold, Silver and Bronze instead of single letters. While a game starts, Tab no longer moves behind the starting screen
  - type: fix
    label: Jeśli aktualizacja zatrzyma się przed rozpoczęciem podmiany plików, RetroDB uruchamia teraz poprzednią wersję zamiast pozostać zamkniętym
    en: If an update stops before it starts swapping files, RetroDB now starts the version you had again, instead of staying closed
  - type: fix
    label: Dwukrotne naciśnięcie Graj naraz nie może już uruchomić dwóch gier we wbudowanym odtwarzaczu. Oczekiwanie na pobranie rdzenia kończy się teraz po pewnym czasie lub gdy RetroDB przestaje odpowiadać, zamiast czekać w nieskończoność, a pytanie "już uruchomione" używa własnego okna dialogowego RetroDB
    en: Pressing Play twice at once can no longer start two games on the built-in player. Waiting for a core download now gives up after a while, or when RetroDB stops answering, instead of waiting forever, and the "already running" question uses RetroDB's own dialog
  - type: fix
    label: Kody włączane lub wyłączane w trakcie gry są zachowywane dla właściwej gry, nigdy nie są brane z innej gry, której plik ma taką samą nazwę. Problem z kodem nigdy nie powstrzymuje uruchomienia gry
    en: Cheats you switch on or off during play are kept for the right game, never taken from another game whose file has the same name. A cheat problem never stops a game starting
  - type: fix
    label: RetroDB zapisuje plik ustawień emulatora bezpieczniej. Plik ustawień będący linkiem pozostaje linkiem, zachowuje uprawnienia i litery, których nie potrafi odczytać, a nieudany zapis nie zostawia zbędnego pliku
    en: RetroDB writes an emulator's settings file more safely. A settings file that is a link stays a link, keeps its permissions, and keeps letters it cannot read, and a failed save leaves no stray file behind
  - type: fix
    label: Zbiorcze pobieranie danych przesunięte w kolejce, zamienione z innym lub wznowione, gdy trwa inne, nie ginie już przy restarcie RetroDB; pulpit je oferuje, od miejsca zatrzymania. Zamienione zadanie nie działa już obok nowego, a dwa szybkie kliknięcia Wznów uruchamiają zadanie raz
    en: A bulk scrape you move down the queue, swap with another or resume while one runs is no longer lost when RetroDB restarts; the dashboard offers it, from where it stopped. A swapped-out scrape no longer keeps running beside the new one, and two quick clicks on Resume start a job once
  - type: fix
    label: Błąd jednej gry, np. zerwanie sieci, nie kończy już całego przebiegu Uzupełniania AI ani przebiegu Napraw pudełko i regiony instrukcji; ta gra liczy się jako nieudana, a reszta jest przetwarzana dalej. Zatrzymanie RetroDB czysto zatrzymuje też pobieranie rdzeni
    en: One game's error, such as the network dropping, no longer ends a whole AI Fill run or a Fix Box and Manual Regions run; that game counts as failed and the rest go on. Stopping RetroDB now also stops core downloads cleanly
  - type: fix
    label: Pozycje Listy życzeń nie zostają już na zawsze w stanie „pobierania danych” po błędzie lub restarcie, a dwa uruchomienia Pobierz dane dla wszystkich dla tej samej Listy życzeń nie działają już naraz
    en: Wishlist items no longer stay on "scraping" forever after an error or a restart, and two Scrape All runs for the same wishlist no longer run at once
  - type: fix
    label: Skrypt lub druga kopia RetroDB uruchamiana obok nie oznacza już zadań działającego serwera jako przerwanych, a dwie kopie startujące jednocześnie nie mogą już cofnąć bazy danych o wersję
    en: A script or a second copy of RetroDB starting up no longer marks the running server's jobs as interrupted, and two copies starting at once can no longer set the database back a version
  - type: fix
    label: Rozpoczęcie synchronizacji PlayStation nie wstrzymuje już pasków postępu wszystkich, gdy trwa logowanie do Sony. Codzienne podtrzymywanie PlayStation odnawia logowanie dopiero pod koniec 10 dni, a nie co dzień
    en: Starting a PlayStation sync no longer makes everyone's progress bars wait while it signs in to Sony. The daily PlayStation keep-alive now renews a sign-in only near the end of its 10 days, instead of every day
  - type: fix
    label: Pobieranie danych nie nadpisuje już zmiany wprowadzonej w trakcie jego działania i nie czyści gatunku, trybu ani widoku, dla których nie zna nazwy. Nie zmienia już zapisanej liczby graczy, aby pasowała do trybów gry
    en: A scrape no longer writes over a change you make while it runs, and no longer empties a genre, mode or view it has no name for. It no longer changes a stored player count to match the game's modes
  - type: fix
    label: Uzupełnianie AI nie zmienia już tego, co wpisałeś sam, np. ręcznie poprawionego wydawcy lub gatunku; poprawia tylko wartości pobrane automatycznie. Nie zgłasza już zmiany wartości, gdy tylko inaczej ją zapisało, np. 4 graczy jako „1-4” albo te same gatunki w innej kolejności
    en: AI Fill no longer changes what you typed yourself, such as a publisher or genre you corrected by hand; it corrects only scraped values. It no longer reports a value as changed when it only wrote it differently, such as 4 players as "1-4" or the same genres in another order
  - type: fix
    label: Kontroler wpisany dla gry zostaje zachowany; domyślny kontroler konsoli zastępuje teraz tylko wartości pobrane i od AI. Ograniczenie wiekowe przeliczone z domysłu AI innej organizacji jest teraz też oznaczone jako domysł
    en: A controller you type for a game is kept; the console's default controller now replaces only scraped and AI values. An age rating converted from another board's AI guess is now marked as a guess too
  - type: fix
    label: Zapisanie okna edycji gry nie czyści już pól, których to okno nie pokazuje. Reset na stronie gry czyści teraz wszystko, co obiecuje, w tym widok, wydanie i inne nazwy, usuwa obrazy i wideo gry, chyba że używa ich inna gra, i od razu aktualizuje filtry Biblioteki
    en: Saving a game's edit window no longer empties fields the window does not show. Reset on a game's page now clears everything it says it does, including the view, edition and other names, deletes the game's pictures and videos unless another game uses them, and updates the library filters straight away
  - type: fix
    label: Wyczyść pobrane dane czyści teraz także widok, 2D lub 3D, oraz strukturę gry. Import CLZ gry z samym rokiem zachowuje tylko rok, a nie 1 stycznia
    en: Clear Scraped Data now also clears the view, 2D or 3D, and game structure. A CLZ import of a game with only a year keeps just the year, not 1 January
  - type: security
    label: Synchronizacja Steam nie pożycza już klucza Steam z Ustawień dla każdego członka domu. Członek bez własnego klucza Steam dostawał Bibliotekę i Osiągnięcia Steam administratora na swoim koncie. Klucz w Ustawieniach służy teraz tylko administratorom
    en: Steam sync no longer borrows the Steam key from Settings for every household member. A member with no Steam key of their own was getting the admin's Steam library and achievements under their account. The key in Settings now serves admins only
  - type: fix
    label: Wyszukiwanie How Long to Beat dla wielu gier zapisuje teraz czasy, których jest pewne. Wcześniej każde pewne dopasowanie kończyło się błędem i nic nie zapisywano. Odświeżanie RetroAchievements sprawdza teraz także plik każdej gry na liście RetroAchievements, tak jak przy pobieraniu danych, więc gra jest powiązana z dokładnie tą wersją, którą masz
    en: How Long to Beat's lookup for many games now saves the times it is sure of. Before, every sure match failed and nothing was saved. RetroAchievements Refresh now also checks each game's file against RetroAchievements' list, as a scrape does, so a game is linked to the exact version you have
  - type: fix
    label: Komunikat o zakończeniu zadania w tle znów się pokazuje, a okienko postępu zadania zauważa, że serwer przejął zadanie po restarcie. Wcześniej nic z tego się nie pojawiało
    en: The message that a background job has finished shows again, and a job's progress box notices when the server picks the job up after a restart. Before, neither ever appeared
  - type: fix
    label: 'Trofea PlayStation: gra powiązana ręcznie pozostaje powiązana po pełnej synchronizacji, a synchronizacja nie łączy już gry z jej kontynuacją, np. „Doom” z „Doom Eternal”. Importowanie gier PlayStation łączy teraz grę już obecną w Bibliotece, tak jak import ze Steam i Xbox, więc jej trofea są przy niej widoczne'
    en: 'PlayStation trophies: a game you linked by hand stays linked after a full sync, and a sync no longer links a game to its sequel, such as "Doom" to "Doom Eternal". Importing PlayStation games now links a game already in your library, as Steam and Xbox imports do, so its trophies show on it'
  - type: fix
    label: Xbox nie pokazuje już Twojego gamertagu jako Nieznany po samoczynnym odnowieniu logowania, a wolne lub nieudane połączenie nie wylogowuje Cię już z Xbox. Robi to tylko odmowa logowania przez Microsoft
    en: Xbox no longer shows your gamertag as Unknown after its sign-in renews itself, and a slow or failed connection no longer signs you out of Xbox. Only Microsoft refusing the sign-in does that
  - type: fix
    label: Dwie osoby mogą teraz mieć tag o tej samej nazwie; wcześniej drugi kończył się błędem. Każdy zalogowany użytkownik może teraz ponownie przeskanować własne trofea RPCS3; wcześniej mógł tylko administrator, a reszta widziała stare trofea do restartu RetroDB
    en: Two people can now each have a tag of the same name; before, the second one failed with an error. Any signed-in user can now rescan their own RPCS3 trophies; before, only an admin could, and everyone else saw old trophies until RetroDB restarted
  - type: security
    label: Twoje dane logowania pozostają prywatne. Kopie zapasowe bazy danych nie mogą być już odczytane przez inne konta na komputerze, a nieudana kopia zapasowa nie usuwa poprzedniej. Usunięcie lub wyłączenie użytkownika wylogowuje go też z RetroAchievements w DuckStation i PCSX2. Logowanie do RetroAchievements zapisane z menu odtwarzacza nie przechodzi już na kolejną osobę, która gra. Logi i zapisane błędy zadań ukrywają tokeny RetroAchievements, błąd PlayStation innego członka widzi tylko on, a stare pliki logowania PlayStation i Xbox w postaci zwykłego tekstu są usuwane
    en: Your sign-ins stay private. Database backups can no longer be read by other accounts on the computer, and a failed backup no longer deletes the one before it. Deleting or switching off a user also signs them out of RetroAchievements in DuckStation and PCSX2. A RetroAchievements sign-in saved from the player's own menu no longer carries over to the next person who plays. Logs and saved job errors hide RetroAchievements tokens, another member's PlayStation error is shown only to them, and old plain-text PlayStation and Xbox sign-in files are removed
  - type: fix
    label: Własne testy RetroDB nie mogą już dotknąć Twojej Biblioteki podczas działania. Zawsze używają tymczasowej kopii bazy danych, obrazów i ustawień i odmawiają startu, jeśli którykolwiek element wskazuje na Twoje prawdziwe pliki
    en: RetroDB's own checks can no longer touch your library while they run. They always use a throwaway copy of the database, pictures and settings, and refuse to start if any of them points at your real files
  - type: fix
    label: Czyszczenie osieroconych plików nie usuwa już obrazów Listy życzeń. Otwarcie gry nie sprawia już, że zapomina ona zrzuty ekranu, których nie może znaleźć. Wcześniej, przy odłączonym dysku z obrazami, każda otwarta gra traciła całą listę Zrzutów ekranu; teraz lista zostaje, a brakujący obraz jest tylko ukryty
    en: Clean orphaned files no longer deletes your wishlist's pictures. Opening a game no longer makes it forget screenshots it cannot find. Before, with the picture drive unplugged, every game you opened lost its whole screenshot list; now the list is kept, and a missing picture is only hidden
  - type: fix
    label: Pobieranie wideo lub Instrukcji przerwane w połowie nie uszkadza już kopii, którą gra już miała, a nieudane pobieranie nie zostawia ukrytego niedokończonego pliku w folderze mediów. Działający w tle skaler obrazów nie zapisuje już starego obrazu nad nowszym pobranym w międzyczasie. Konwersja do WebP zachowuje wskazanie obrazu dla każdej gry, która go współdzieli, i nigdy nie rusza plików spoza folderów obrazów
    en: A video or manual download that fails part-way no longer damages the copy the game already had, and a failed download no longer leaves a hidden half-file in the media folder. The background upscaler no longer saves an old picture over a newer one downloaded meanwhile. Convert to WebP keeps every game that shares a picture pointing at it, and never touches a file outside the picture folders
  - type: fix
    label: Usunięcie gry lub pozycji Listy życzeń usuwa teraz także jej obrazy, wideo i Instrukcje, ale zachowuje te, których nadal używa inna gra lub pozycja Listy życzeń. Zapisane obrazy znów mogą być odczytywane przez inne konta na komputerze, a Zmiana rozmiaru obrazów liczy obraz, którego nie udało się zapisać, jako nieudany, a nie jako gotowy
    en: Deleting a game or a wishlist item now deletes its pictures, videos and manuals too, but keeps any another game or wishlist item still uses. Saved pictures can be read by other accounts on the computer again, and Resize Images counts a picture it could not save as failed, not as done
  - type: fix
    label: Wyszukiwanie duplikatów nie proponuje już do usunięcia działającego pliku. Przy szukaniu po nazwie nie uznaje już plików .cue i .bin gry za swoje kopie. Nigdy nie proponuje pliku ścieżki płyty, który mogą współdzielić dwie wersje gry. Nie usunie płyty wymienionej na liście odtwarzania. Gra, której plik usuniesz, przechodzi teraz do zachowanej kopii, więc zostaje w Bibliotece
    en: Duplicate Finder no longer offers a working file for deletion. Looking by name, it no longer calls a game's .cue and .bin copies of each other. It never offers a disc's track file, which two versions of a game can share. It will not delete a disc that a playlist lists. A game whose file you delete now moves to the copy you keep, so it stays in the library
  - type: fix
    label: Porządkowanie wielopłytowych nie nadpisuje już istniejącej listy odtwarzania ani pliku, który już jest w folderze gry; zatrzymuje się i podaje, który to plik. Tworzona lista zawiera plik .cue każdej płyty, a nie jej pliki ścieżek. Gry, których pliki przenosi, podążają teraz za nimi do folderu, więc Czyszczenie brakujących ROM-ów już ich nie usuwa
    en: Organize Multi-Disc no longer writes over an existing playlist or a file already in the game's folder; it stops and says which. The playlist it makes lists each disc's .cue, not its track files. Games whose files it moves now follow them into the folder, so Clean missing ROMs no longer removes them
  - type: fix
    label: Konwersja do CHD z opcją „usuń oryginały” usuwa teraz także pliki ścieżek płyty, ale zachowuje ścieżkę, której nadal używa inny plik .cue. Gra i każda lista odtwarzania z wpisaną starą płytą wskazują teraz nowy plik .chd. Zmiana nazwy pliku gry aktualizuje teraz listę odtwarzania, która go zawiera, a pliku ścieżki potrzebnego dla .cue nie można przemianować. Usuwanie plików z archiwum zip usuwa tylko wybrane pliki, nawet gdy nazwa zawiera [ lub ]. Deduplikacja zrzutów ekranu usuwa tylko kopie znalezione podczas skanowania i zawsze zostawia jedną
    en: Converting to CHD with "delete originals" now deletes the disc's track files too, but keeps a track another .cue still uses. The game and any playlist that listed the old disc now point at the new .chd. Renaming a game's file now updates the playlist that lists it, and a track file a .cue needs cannot be renamed. Removing files from a zip removes only the files you picked, even when a name holds [ or ]. Screenshot Dedup deletes only the copies its scan found, and always keeps one
  - type: fix
    label: How Long to Beat na stronie gry wyszukuje to, co wpiszesz. Wcześniej tytuł, którego nie mógł znaleźć, powodował wyszukiwanie innych nazw gry i mógł zaproponować inną grę, np. remake stworzony przez fanów. Nadal próbuje innych nazw, gdy w polu jest własna nazwa gry
    en: How Long to Beat on a game's page searches for what you type. Before, a title it could not find made it search the game's other names instead, and it could offer a different game, such as a fan remake. It still tries the other names when the box holds the game's own name
  - type: fix
    label: Kroki How Long to Beat w Instrukcji pomocy zgadzają się z ekranem. Mówiły o wyborze dopasowania z listy; strona pokazuje jedno dopasowanie z przyciskami Zapisz i Anuluj. Pomoc PlayStation nie mówi już, że logowanie trwa około dwóch miesięcy, bo RetroDB loguje się ponownie sam. Wszystkie 20 przetłumaczonych instrukcji zawiera obie zmiany
    en: The help manual's How Long to Beat steps match the screen. They said to pick a match from a list; the page shows one match with Save and Cancel. The PlayStation help no longer says the sign-in lasts about two months, since RetroDB signs in again by itself. All 20 translated manuals carry both changes
  - type: fix
    label: Każdy pasek liter zaczyna się teraz przyciskiem Wszystkie. Na stronach Biblioteki, konsoli i Trofeów PSN wybranie litery pokazuje tylko gry na tę literę, a wcześniej nie było przycisku, który przywracał resztę. Na pozostałych stronach Osiągnięć Wszystkie wraca do pierwszej gry
    en: Every letter bar now starts with an All button. On the Library, console and PSN Trophies pages, picking a letter shows only that letter's games, and before there was no button to bring the rest back. On the other achievement pages, All goes back to the first game
  - type: fix
    label: Nowy token logowania PlayStation wklejony w Ustawieniach jest teraz używany od razu. Wcześniej RetroDB używał starego logowania, aż wygasło, a Zapisz i sprawdź połączenie podawało to stare logowanie jako działające. Token odrzucony przez Sony nie zastępuje już tokenu, który działa
    en: A new PlayStation sign-in token you paste in Settings is now used straight away. Before, RetroDB kept using the old sign-in until it ran out, and Save & Test Connection reported that old sign-in as working. A token Sony refuses no longer replaces one that works
  - type: enhancement
    label: 'Logowanie PlayStation w Ustawieniach łatwiej utrzymać. Baner nie odlicza już dni, w których nie musiałeś nic robić, bo RetroDB loguje się ponownie sam; robi się czerwony tylko wtedy, gdy Sony odrzuci zapisany token. Przycisk Wklej tutaj nie powoduje już, że przeglądarka prosi o dostęp do schowka: ustawia kursor w polu, abyś użył Ctrl+V. Kroki mówią teraz, by najpierw się wylogować z PlayStation, gdy zastępujesz token, który nadal działa, a ich komunikaty można tłumaczyć'
    en: 'The PlayStation sign-in in Settings is easier to keep going. The banner no longer counts down days you never had to act on, because RetroDB signs in again by itself; it turns red only when Sony refuses your saved token. The Paste here button no longer makes the browser ask to read your clipboard: it puts the cursor in the box for Ctrl+V. The steps now say to sign out of PlayStation first when you replace a token that still works, and their messages can be translated'
  - type: enhancement
    label: Wyskakujące komunikaty i okna z pytaniami, takie jak „Zapisano ustawienia” lub „Usunąć tę listę?”, można teraz tłumaczyć na każdej stronie. Wcześniej większość z nich zostawała po angielsku niezależnie od wybranego języka
    en: Pop-up messages and question boxes, such as "Settings saved" or "Delete this list?", can now be translated on every page. Before, most of them stayed in English whatever language you chose
  - type: enhancement
    label: Komunikaty wyjaśniające, dlaczego logowanie do PlayStation się nie udało, np. „Twój NPSSO mógł wygasnąć”, można teraz tłumaczyć
    en: The messages that say why a PlayStation sign-in failed, such as "Your NPSSO may have expired", can now be translated
  - type: fix
    label: Instrukcja pomocy w każdym języku odpowiada teraz angielskiej. Zyskuje Wyszukiwanie wszędzie, Zachowanie tytułu, Nazwy MAME i tył pudełka, a starsze akapity, które się zdezaktualizowały, są odświeżone
    en: The help manual in every language now matches the English one. It gains Search Anywhere, Keeping a Title, MAME Names and the back of the box, and older paragraphs that had fallen behind are up to date
  - type: fix
    label: W niemieckim, afrikaans i hiszpańskim przycisk Wstecz na okładce gry oznacza teraz tył pudełka, a nie „wróć”
    en: In German, Afrikaans and Spanish, the Back button on a game's cover now says the back of the box, not "go back"
  - type: feature
    label: Naciśnięcie Graj wypełnia teraz ekran logo gry na tle jej obrazu podczas uruchamiania gry, a gdy gra nie ma logo, jej nazwą dużymi literami. Znika samo, gdy otworzy się okno gry, albo po naciśnięciu Esc lub kliknięciu
    en: Pressing Play now fills the screen with the game's logo on its background picture while the game starts, or its name in large letters when it has no logo. It goes away by itself when the game's window opens, or when you press Esc or click
  - type: feature
    label: 'Obracane pudełko 3D ma teraz prawdziwy kształt etui PS5: zaokrąglone rogi i krawędzie, wypukły brzeg wokół okładki, linię łączenia obu połówek i wycięcie na palec po otwieranej stronie. Wymaga pliku pudełka z wersji Slipcase, która zapisuje kształt; zaimportuj pudełko ponownie, aby go uzyskać. Inne pudełka wyglądają jak dawniej'
    en: 'The turnable 3D box now has the real shape of a PS5 case: rounded corners and edges, the raised lip round the cover, the line where the two halves meet, and the finger slot in the opening side. It needs a box file from a Slipcase version that writes the shape; import the box again to get it. Other boxes look as before'
  - type: enhancement
    label: Odśwież RetroAchievements przeniesiono z Ustawień na stronę RetroAchievements i nazwano Znajdź gry z osiągnięciami. Każdy przycisk ma tam teraz wiersz opisujący jego działanie, więc łatwo odróżnić Znajdź gry od Synchronizuj postęp. Gdy nie powiązano jeszcze żadnych gier, strona pokazuje administratorowi przycisk Znajdź zamiast przechodzić do następnej karty
    en: Refresh RetroAchievements moved from Settings to the RetroAchievements page, and is now called Find Games with Achievements. Every button there now has a line saying what it does, so Find Games and Sync Progress are easy to tell apart. With no games linked yet, the page shows an admin the Find button instead of moving on to the next tab
  body: "<ul>\n  <li><strong>4.0 to ostatnia wersja internetowa RetroDB.</strong> Nowe wersje\n    będą aplikacją na komputery z systemem Windows, Linux i macOS oraz aplikacją na Androida.\n    Otworzą twoją dotychczasową bibliotekę. Wersję 4.0 nadal można\n    pobrać, ale będzie dostawać tylko poprawki bezpieczeństwa i poprawki błędów powodujących utratę danych.\n    Gdy aplikacja na komputery będzie gotowa, link do niej znajdziesz w Ustawienia → Aktualizacje.</li>\n  <li><strong>Instrukcja pomocy jest aktualna we wszystkich językach.</strong>\n    Sekcje, które były tylko w angielskiej instrukcji, zostały przetłumaczone.</li>\n</ul>\n"
  body_en: "<ul>\n  <li><strong>4.0 is the last web version of RetroDB.</strong> New versions\n    will be a desktop app for Windows, Linux and macOS, and an Android app.\n    They will open your existing library. Version 4.0 stays available to\n    download, and gets only security fixes and fixes for bugs that lose data.\n    Settings → Updates links to the desktop app when it is out.</li>\n  <li><strong>The help manual is up to date in every language.</strong>\n    Sections that were only in the English manual are now translated.</li>\n</ul>\n"
- version: 3.35.4
  date: '2026-11-03'
  tags:
  - type: fix
    label: Zrzut ekranu usunięty z gry teraz zostaje usunięty. Wcześniej kolejne pobieranie danych mogło skopiować go z powrotem z ES-DE albo pobrać ponownie ze źródła online. Usunięcie zbędnej kopii w narzędziu Duplikaty zrzutów ekranu się nie liczy, bo obraz i tak zostaje raz
  - type: feature
    label: 'Gry mają teraz swoje logo: Pobierz dane zapisuje je z ES-DE, ScreenScraper, TheGamesDB, IGDB i Steam, a strona gry pokazuje je nad tytułem albo zamiast brakującego pudełka. Logo możesz wgrać lub usunąć w oknie Edytuj. Uruchom zbiorcze pobieranie danych z opcją Uzupełnij braki, aby uzupełnić logo w grach, dla których dane pobrano wcześniej'
  - type: fix
    label: IGDB nie ustawia już logo gry jako tła strony
  - type: feature
    label: 'Gry mają teraz tył pudełka: Pobierz dane zapisuje go z ES-DE, ScreenScraper i TheGamesDB, a przycisk Tył na okładce na stronie gry go pokazuje. Kliknij tył, aby go powiększyć. Tył możesz wgrać lub usunąć w oknie Edytuj. Tyły uzupełniają się za każdym razem, gdy pobierasz dane gry; Uzupełnij braki nie pobiera danych gry ponownie tylko dla tyłu'
  - type: fix
    label: Gra bez okładki z przodu w TheGamesDB nie dostaje już tyłu pudełka jako okładki
  - type: fix
    label: Jeśli wyłączysz scraper w Ustawieniach w trakcie zbiorczego pobierania danych, liczba nieznalezionych gier jest teraz poprawna od następnej gry. Wcześniej gra mogła zostać policzona jako zatrzymana
  - type: enhancement
    label: W systemie bez skonfigurowanego emulatora przycisk Graj jest wyszarzony. Najedź na niego, aby zobaczyć powód, albo kliknij, aby zobaczyć okno z informacją, że emulator nie jest skonfigurowany. Wcześniej obok przycisku był wiersz tekstu
  body: "<ul>\n  <li><strong>Gry mają logo.</strong> Pobierz dane zapisuje logo każdej gry,\n    a strona gry pokazuje je nad tytułem albo zamiast brakującego pudełka.\n    Uruchom zbiorcze pobieranie danych z opcją Uzupełnij braki, aby uzupełnić\n    logo w grach, dla których dane pobrano wcześniej.</li>\n  <li><strong>Gry mają tył pudełka.</strong> Pokazuje go przycisk Tył na\n    okładce na stronie gry, a kliknięcie powiększa obraz. Tyły uzupełniają się\n    za każdym razem, gdy pobierasz dane gry.</li>\n  <li><strong>Usunięty zrzut ekranu zostaje usunięty.</strong> Kolejne\n    pobieranie danych nie kopiuje go już z powrotem ani nie pobiera ponownie.</li>\n  <li><strong>Graj mówi, dlaczego nie może ruszyć.</strong> W systemie bez\n    skonfigurowanego emulatora przycisk Graj jest wyszarzony i podaje powód.</li>\n</ul>\n"
- version: 3.35.3
  date: '2026-11-02'
  tags:
  - type: feature
    label: 'Nowe narzędzie Nazwy MAME w Narzędziach ROM: gry MAME dostają prawdziwe nazwy, lata i producentów z własnej listy MAME, a pliki zachowują krótkie nazwy. Potem funkcja Pobierz dane znajduje każdą grę, a listę MAME można filtrować według kategorii, np. pomijając automaty do gier hazardowych. Zestawy BIOS są ukryte na liście'
  - type: fix
    label: Raporty ROM nie proponują już zmiany nazw plików MAME, bo po zmianie nazwy plik przestaje działać w MAME
  - type: fix
    label: Ustawienia podają teraz, czego wymaga Microsoft, zanim będzie można zarejestrować aplikację Xbox. Z tego powodu nie dało się przetestować logowania do Xbox
  - type: enhancement
    label: Osobna karta Oficjalne nazwy zniknęła z Zbiorczego uzupełniania AI, bo przełącznik Oficjalna nazwa w tym narzędziu już to robi
  - type: fix
    label: Gdy Sony odrzuci zapisane logowanie do PlayStation, pulpit i Ustawienia teraz o tym informują i proszą o ponowne połączenie. Wcześniej dziennik przy każdym starcie serwera pokazywał bezsensowny błąd, a nic Ci o tym nie mówiło
  - type: feature
    label: Importowanie ze Steam uzupełnia teraz w tle opis każdej gry, twórców, wynik Metacritic, kategorie wiekowe, tryby gry, okładkę, tło i zrzuty ekranu z jej strony w sklepie. Użyj funkcji Pobierz dane, aby poznać gatunek i datę premiery gry
  - type: feature
    label: Synchronizacja ze Steam zachowuje teraz Twój czas gry i datę ostatniej gry, a strona gry je pokazuje
  - type: fix
    label: Pobieranie biblioteki na stronie importu ze Steam działa teraz dla administratora z zapisanym kluczem Steam. Wcześniej wysyłało do Steam ukrytą postać klucza, a strona błędnie radziła ustawić profil jako publiczny
  - type: fix
    label: Gra ze Steam lub Xbox, która jest już w Twojej bibliotece pod tą samą nazwą, jest teraz podczas importu łączona z tą grą, więc jej osiągnięcia się synchronizują. Wcześniej była pomijana i nigdy nie łączona
  - type: fix
    label: Gry zaimportowane ze Steam, Xbox i PlayStation od razu sortują się prawidłowo, np. Final Fantasy IX przed Final Fantasy X, a znaki towarowe ze Steam są usuwane z ich nazw
  - type: feature
    label: W systemach, w których RetroAchievements używa zwykłego skrótu pliku, np. Mega Drive i Game Boy, strona gry pokazuje, czy Twoja kopia zdobywa osiągnięcia, a ten skrót łączy właściwą grę. Uruchom RA Refresh, aby to uzupełnić
  - type: fix
    label: Funkcja Pobierz dane pyta teraz ScreenScraper o dokładnie Twój plik, zanim zacznie szukać po nazwie, dzięki czemu trafia na Twoją grę, a nie na grę o podobnym tytule. Wyniki zaznaczone przez Ciebie nadal mają pierwszeństwo
  - type: enhancement
    label: Okno postępu zmiany rozmiaru obrazów podaje teraz grę i system, do których należy każdy obraz
  - type: feature
    label: Pobieranie danych sprowadza teraz ekrany tytułowe ze ScreenScraper i TheGamesDB, więcej oficjalnych nazw z IGDB i TheGamesDB (np. japoński tytuł gry) oraz inne konsole, na które wyszła gra, z IGDB
  - type: feature
    label: Gra bez oceny użytkowników przejmuje teraz ocenę z Twojej kolekcji ES-DE, jeśli ją ma
  - type: feature
    label: Strona gry podaje, ilu graczy zmierzyło czas w wyniku HowLongToBeat, i łączy ze stroną wyniku. Wyniki zapisane wcześniej pokażą te dane przy następnym wyszukaniu
  - type: feature
    label: Strona RetroAchievements pokazuje, ilu osób gra w daną grę i jaki odsetek z nich zdobył każde osiągnięcie
  - type: fix
    label: Przeglądarka folderów w Narzędziach ROM otwiera się teraz w folderze ROM, gdy nie ma folderu początkowego, zamiast zgłaszać błąd. Nieczytelna odpowiedź z IGDB kosztuje teraz tylko ten jeden szczegół, a nie wszystko, co IGDB przysłało o grze
  - type: fix
    label: Dzienny limit ScreenScraper powoduje teraz, że RetroDB przestaje pytać do później, a zbiorcze pobieranie danych informuje o tym i działa dalej z innymi źródłami. Wcześniej wyczerpany limit wyglądał jak „nie znaleziono gry”, a zapytania trwały całą noc
  - type: fix
    label: Gra, dla której żadne źródło nie mogło odpowiedzieć, bo usługa osiągnęła limit, nie jest już oznaczana jako pobrana, więc następne uruchomienie spróbuje ponownie
  - type: fix
    label: Gdy klucz TheGamesDB wykorzysta swój miesięczny limit, RetroDB przechodzi na drugi klucz i przestaje pytać, gdy oba się wyczerpią
  - type: fix
    label: Miesięczny limit RAWG też powoduje, że RetroDB przestaje pytać, a IGDB mieści się w limicie czterech zapytań na sekundę
  - type: fix
    label: Zbiorcze wyszukiwanie HowLongToBeat kończy się teraz komunikatem, gdy strona zgłasza zbyt wiele zapytań, a wszystkie zapytania do strony są rozłożone w czasie
  - type: fix
    label: Naprawa regionów okładek i instrukcji nie poddaje się już po 25 grach z rzędu nieznanych ScreenScraper. Zatrzymuje się tylko wtedy, gdy ScreenScraper zgłosi osiągnięcie limitu
  - type: fix
    label: Na stronie gry każda kategoria wiekowa jest teraz wyśrodkowana nad etykietą z przypuszczeniem AI
  - type: fix
    label: Limit TheGamesDB w Ustawieniach używa teraz sprawdzenia, które nie zużywa limitu, i nie pokazuje już zmyślonej daty odnowienia, gdy usługa jej nie podaje
  body: |
    <ul>
      <li><strong>Gry z MAME dostają prawdziwe nazwy.</strong> Nowe narzędzie MAME Names w ROM Tools bierze nazwy, lata i twórców z własnej listy MAME. Pliki zachowują krótkie nazwy, bo MAME ich potrzebuje. Listę MAME można filtrować według kategorii, a zestawy BIOS są ukryte.</li>
      <li><strong>Importy ze Steam przynoszą znacznie więcej.</strong> Każda gra uzupełnia opis, twórców, wynik Metacritic, oceny wiekowe, tryby gry i obrazy ze swojej strony w sklepie. Synchronizacja zachowuje czas gry i datę ostatniego uruchomienia. Gra, która jest już w Twojej bibliotece pod tą samą nazwą, zostanie teraz z nią powiązana, więc jej osiągnięcia się zsynchronizują.</li>
      <li><strong>Pobieranie danych znajduje dokładnie Twoją grę.</strong> Przed szukaniem po nazwie program pyta ScreenScraper o Twój dokładny plik. Pobieranie danych przynosi też ekrany tytułowe, więcej oficjalnych nazw oraz inne konsole, na które wyszła dana gra.</li>
      <li><strong>RetroAchievements rozpoznaje Twoją kopię.</strong> W systemach używających zwykłego skrótu pliku, takich jak Mega Drive i Game Boy, strona gry pokazuje, czy Twoja kopia daje osiągnięcia. Uruchom RA Refresh, aby to uzupełnić. Strona RetroAchievements pokazuje też, ile osób gra w daną grę i jaki odsetek z nich zdobył każde osiągnięcie.</li>
      <li><strong>Limity online są respektowane.</strong> Gdy ScreenScraper, TheGamesDB lub RAWG osiągnie limit, RetroDB przestaje pytać do później, a zbiorcze pobieranie danych działa dalej z innymi źródłami. Gra, na którą żadne źródło nie mogło wtedy odpowiedzieć, zostanie sprawdzona ponownie przy następnym uruchomieniu.</li>
      <li><strong>Odrzucone logowanie do PlayStation jest zgłaszane.</strong> Pulpit i Ustawienia proszą teraz o ponowne połączenie, gdy Sony odrzuci zapisane logowanie.</li>
      <li><strong>Official Names zostało przeniesione.</strong> Jego osobna karta zniknęła z Bulk AI Fill, ponieważ przełącznik Official name w tym narzędziu robi to samo.</li>
    </ul>
- version: 3.35.2
  date: '2026-11-02'
  tags:
  - type: fix
    label: Łączny czas gry nie liczy już minut jako godzin na pulpicie, w trofeach kolekcjonera i na wykresie analitycznym. Gra trwająca 36 minut była liczona jako 36 godzin
  - type: fix
    label: HowLongToBeat nie bierze już kontynuacji za Twoją grę. Double Dragon II nie dostaje już czasów z Double Dragon III
  - type: fix
    label: Zbiorcze wyszukiwanie w HowLongToBeat nie zapisuje już czasu gry z innego systemu. Mario Golf na Game Boy Color nie dostaje już czasu z Nintendo 64. Takie dopasowania czekają teraz na stronie przeglądu
  - type: fix
    label: Zbiorcze i pojedyncze wyszukiwanie w HowLongToBeat uwzględnia teraz rok wydania gry, więc Doom z 1993 roku nie dostaje już czasów z Dooma z 2016
  - type: new
    label: Opcja Sprawdź zapisane czasy gry w Narzędziach ROM wysyła zapisane dopasowania, które wyglądają źle, na stronę przeglądu, gdzie każde zachowasz lub wyczyścisz
  - type: fix
    label: Zbiorcze wyszukiwanie w HowLongToBeat z opcją Tylko brakujące ponawia próbę dla gier dopasowanych bez czasu i robi sekundę przerwy między zapytaniami
  - type: fix
    label: Wynik dopasowania 72% nie jest już pokazywany jako 100% na stronie gry
  - type: fix
    label: Gry nie pokazują już Osiągnięć RetroAchievements innej gry. Resident Evil 4 na GameCube nie pokazuje już zestawu z Resident Evil, a Ratchet Deadlocked zestawu z Ratchet & Clank
  - type: fix
    label: Opcja Pobierz dane usuwa teraz powiązanie z RetroAchievements, gdy RetroAchievements nie ma takiej gry. Jeśli RetroAchievements jest nieosiągalne, powiązanie zostaje
  - type: fix
    label: RetroAchievements znajduje teraz więcej Twoich gier dzięki nazwie pliku ROM, alternatywnym tytułom, znakom diakrytycznym jak w Ōkami oraz tytułom o dwóch nazwach
  - type: fix
    label: RetroAchievements nie łączy już gry z zestawem bonusowym, hackiem ani demem, a X-Men nie jest już równe G-Men
  - type: new
    label: Strona gry pokazuje nazwę powiązanej gry nadaną przez RetroAchievements, więc błędne powiązanie łatwo zauważyć
  - type: fix
    label: Odświeżanie RA zapisuje teraz punkty każdej gry, więc gra nie pokazuje już 0 punktów
  - type: new
    label: Strona gry oznacza klasyfikacje wiekowe od AI jako przypuszczenie oparte na zawartości gry i podaje, kiedy każda organizacja klasyfikacyjna zaczęła działać. OutRun z 1987 roku nie wygląda już na oficjalnie ocenione przez ESRB
  - type: new
    label: Strona gry oznacza oceny recenzentów i dane o sprzedaży pochodzące od AI. Zmiana oceny lub danych o sprzedaży przez Ciebie usuwa oznaczenie
  - type: fix
    label: Ocena od AI w złej skali jest odrzucana, więc lubiana gra nie dostaje już 7 na 100 po nowym pobraniu danych
  - type: fix
    label: Liczba ocen od AI nie jest już zapisywana obok wyniku z innej strony, a strona gry nie pokazuje już takiej, która została zapisana
  - type: fix
    label: Przedział sprzedaży lub kwota pieniędzy od AI nie zamienia się już w kilka sprzedanych egzemplarzy
  - type: fix
    label: Odpowiedzi AI nie zapisują już list jako kodu, słów N/A ani None jako wartości, ani własnej konsoli gry wśród innych platform
  - type: fix
    label: Uzupełnianie AI zachowuje teraz zastępowaną wartość w historii gry
  - type: fix
    label: Gry z kartridżami nie dostają już zmyślonego typu Battery Save, a nowe odpowiedzi AI nie przyjmują domyślnie Standard Edition
  - type: fix
    label: Seria gry nie jest już wyciągana z pocięcia jej tytułu, więc Need For Speed nie należy już do serii o nazwie Need. Nazwy serii z IGDB są znów odczytywane, a stare domysły są czyszczone, by kolejne pobranie danych je uzupełniło
  - type: fix
    label: Opisy nie pokazują już kodów internetowych zamiast cudzysłowów ani znaczników nagłówków, takich jak
  - type: fix
    label: Jedna firma ma teraz jeden zapis, więc kliknięcie Sega znajduje każdą grę SEGA. Regiony mają jedną wartość, a platformy używają nazw z listy
  - type: fix
    label: Tytuły gier z RAWG nie dostają już roku, a alternatywne tytuły nie wymieniają nazw plików, takich jak dosbox.exe
  - type: fix
    label: Pełne ponowne pobranie nie zastępuje już ustawionej przez Ciebie oceny ani kontrolera domysłem, a pobranie danych, które zawiedzie w połowie, nie zapisuje już przez mniej staranną ścieżkę
  body: "<ul>\n  <li><strong>Odpowiedzi AI mówią, że pochodzą od AI.</strong> Klasyfikacje wiekowe od AI\n    zostają, oznaczone jako przypuszczenie oparte na zawartości gry, z rokiem, w którym\n    każda organizacja klasyfikacyjna zaczęła działać. Oceny i sprzedaż od AI są również oznaczone.</li>\n  <li><strong>RetroAchievements pokazuje właściwą grę.</strong> Kontynuacje nie\n    mają już Osiągnięć pierwszej gry. Po aktualizacji\n    pulpit raz zaproponuje odświeżenie RetroAchievements. Naciśnij je, aby naprawić\n    stare powiązania. Postęp zapisany przy błędnym powiązaniu zostanie usunięty, a następna\n    synchronizacja uzupełni go ponownie.</li>\n  <li><strong>Łączne czasy gry są prawdziwe.</strong> Czasy poniżej godziny\n    były liczone jako godziny, więc sumy na pulpicie i trofea kolekcjonera\n    były za wysokie. Niektóre sumy i trofea się zmniejszą.</li>\n  <li><strong>HowLongToBeat znajduje właściwą grę.</strong> Kontynuacja nie\n    uchodzi już za Twoją grę, a system i rok gry są teraz brane pod uwagę.\n    Dopasowanie z innego systemu lub sprzed lat czeka na Ciebie\n    na stronie przeglądu.</li>\n  <li><strong>Sprawdź, co już zapisano.</strong> Naciśnij Sprawdź zapisane czasy gry\n    w Narzędziach ROM, aby wysłać wątpliwe zapisane dopasowania na stronę przeglądu.\n    Nic się nie zmieni, dopóki nie zdecydujesz.</li>\n  <li><strong>Nazwy serii są prawdziwe.</strong> Seria gry nie jest już wyciągana\n    z pocięcia jej tytułu. Po aktualizacji domyślnie ustalone nazwy serii zostaną wyczyszczone, także niektóre trafne. Kolejne pobranie danych\n    uzupełni je ze źródeł, które podają serię.</li>\n  <li><strong>Czysty tekst.</strong> Opisy nie pokazują już kodów internetowych ani\n    znaczników nagłówków. Jedna firma ma jeden zapis, gra ma jeden region, a\n    nazwy plików, takie jak dosbox.exe, nie są już wymieniane jako inne tytuły. To\n    dzieje się raz, samoczynnie, po aktualizacji.</li>\n  <li><strong>Pełne ponowne pobranie zachowuje Twoje wybory.</strong> Ustawiona przez Ciebie ocena lub\n    kontroler zostaje, chyba że źródło naprawdę je podaje.</li>\n</ul>\n"
