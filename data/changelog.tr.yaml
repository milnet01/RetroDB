    label: 'Claude satış rakamlarını web''de arayabilir'
  body: |
    <ul>
      <li><strong>RetroArch (RetroDB), DuckStation ve PCSX2 için
        hileler.</strong> Ayarlar &gt; Emülatörler sayfasında yeni bir
        Hileler bölümü var. Ücretsiz herkese açık hile paketlerini oradan
        indirin veya zaten sahip olduğunuz hile klasörlerini içe aktarın;
        RetroDB dosyaları kopyalar ve klasörünüzü asla değiştirmez. Ardından
        oyunun sayfası, her biri açma/kapama anahtarlı hilelerini listeler;
        hile çoksa bir arama kutusu da gösterir. RetroArch (RetroDB) içinde
        açtığınız hileler Oyna'ya bir sonraki basışınızda uygulanır ve
        oynarken RetroArch menüsünde yaptığınız değişiklikler korunur.
        DuckStation ve PCSX2 için anahtarlar emülatörün o oyuna ait kendi
        ayarlarına kaydedilir; böylece emülatörün içinde yapılan
        değişiklikler de sayfada görünür. RetroDB bir emülatörde zaten
        bulunan hile dosyasının üzerine asla yazmaz. Açık bir hile
        RetroAchievements hardcore modunu duraklatır.</li>
      <li><strong>Bir oyuna Slipcase 3D kutusu içe aktarın.</strong> Oyun
        sayfasında kapağın altında bir 3D kutu içe aktar düğmesi var.
        Slipcase'in kaydettiği <code>.box.json</code> dosyasını resimleriyle
        birlikte seçin; RetroDB kutunun ön, sırt, arka ve diğer yüzlerini o
        oyun için saklar. 3D kutu kapağı resminiz değişmez. Zaten yüzleri
        olan bir oyun, onları değiştirmeden önce sorar; Kaldır onları
        siler.</li>
      <li><strong>Bir oyunun 3D kutusunu elinizde çevirin.</strong>
        İçe aktarılmış bir Slipcase kutusu olan oyunun kapağına tıklayın,
        kutu 3D olarak görünür. Sırtını, arkasını, üstünü ve altını görmek
        için onu sürükleyin veya ok tuşlarıyla çevirin. Yakınlaştırmak için
        kaydırın veya + ve - tuşlarına basın; geri almak için çift tıklayın
        veya Home tuşuna basın. İçe aktarılmış kutusu olmayan bir oyun yine
        kapak resmine yakınlaşır.</li>
      <li><strong>Ayarlar, Emülatörler sayfasına bağlantı veriyor.</strong>
        Emülatörler sayfasına Ayarlar'ın hiçbir yerinde bağlantı yoktu; ona
        yalnızca adresini yazarak ulaşabiliyordunuz. Yöneticiler artık
        Sistem'den sonra bir Emülatörler sekmesi görür ve Emülatörler
        sayfası aynı sekme çubuğunu gösterir; böylece diğer sekmeler bir
        tık uzaklıkta.</li>
      <li><strong>Kapak yakınlaştırması artık menülerin arkasında
        kalmıyor.</strong> Telefonda üst ve alt çubuklar yakınlaştırılmış
        kapağın üzerine biniyor ve kapatma düğmesini gizliyordu;
        bilgisayarda ise kenar çubuğu sol tarafını örtüyordu. Yakınlaştırma
        artık her şeyin üstünde açılıyor.</li>
      <li><strong>Yapay zekâ için Claude 5.5 modelleri.</strong> Ayarlar &gt; Kazıma, Anthropic'in en yeni Claude modellerini listeler: yeni varsayılan ve en ucuzu olan Haiku 5.5, Sonnet 5.5 ve Opus 5.5, güncel fiyatlarıyla. RetroDB artık Sonnet 5.5'in reddettiği bir ayarı göndermiyor.</li>
      <li><strong>Bir oyunun satış rakamını girin.</strong> İki düzenleme ekranında da Geliştirici altında bir "Satılan kopya" kutusu var. Girdiğiniz rakam, yapay zekânın bulduğu gibi oyun sayfasında görünür. Kaldırmak için kutuyu boşaltın.</li>
      <li><strong>Yapay zekâ anahtarınızı Ayarlar'da test edin.</strong> Ayarlar &gt; Kazıma bölümünde yapay zekâ sağlayıcısının altında bir "Kayıtlı yapay zekâ anahtarını test et" düğmesi var. Anahtarın çalışıp çalışmadığını, çalışmıyorsa nedenini gösterir: reddedilen anahtar, kredi yok ya da kullanım sınırı. Önceden reddedilen bir anahtar çalışıyor gibi görünürdü.</li>
      <li><strong>Claude satış rakamlarını web'de arayabilir.</strong> Ayarlar &gt; Kazıma bölümünde Claude modelinin altında, başta kapalı olan bir "Claude web'de arama yapsın" anahtarı var. Arama olmadan Claude zaten bildikleriyle yanıt verir ve "Satılan kopya" alanını boş bırakır. Anahtar açıkken Claude rakamları arar. Anthropic her arama için ücret alır, bu yüzden Yapay Zeka Doldur oyun başına en fazla 5 arama yapar, en fazla 5 ABD senti; büyük bir toplu kazımadan önce anahtarı kapatın.</li>
    </ul>
