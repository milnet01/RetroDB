  body: |
    <ul>
      <li><strong>Bağımsız sürümde "eksik medya başvurularını temizle", gerçekte
        orada olan medyayı silebiliyordu.</strong> Bu, veritabanı medyayı yalın
        bir dosya adı yerine <code>images/boxart/…</code> gibi bir klasör yolu
