  body: |
    <ul>
      <li><strong>RetroArch (RetroDB), DuckStation ve PCSX2 için
        hileler.</strong> Ayarlar &gt; Emülatörler sayfasında yeni bir
        Hileler bölümü var. Ücretsiz herkese açık hile paketlerini oradan
        indirin veya zaten sahip olduğunuz hile klasörlerini içe aktarın;
        RetroDB dosyaları kopyalar ve klasörünüzü asla değiştirmez. Ardından
        oyunun sayfası, her biri açma/kapama anahtarlı hilelerini listeler;
        hile çoksa bir arama kutusu da gösterir. RetroArch (RetroDB) içinde
        açtığınız hileler Oyna'ya bir sonraki basışınızda uygulanır ve
        oynarken RetroArch menüsünde yaptığınız değişiklikler korunur.
        DuckStation ve PCSX2 için anahtarlar emülatörün o oyuna ait kendi
        ayarlarına kaydedilir; böylece emülatörün içinde yapılan
        değişiklikler de sayfada görünür. RetroDB bir emülatörde zaten
        bulunan hile dosyasının üzerine asla yazmaz. Açık bir hile
        RetroAchievements hardcore modunu duraklatır.</li>
      <li><strong>Bir oyuna Slipcase 3D kutusu içe aktarın.</strong> Oyun
        sayfasında kapağın altında bir 3D kutu içe aktar düğmesi var.
        Slipcase'in kaydettiği <code>.box.json</code> dosyasını resimleriyle
        birlikte seçin; RetroDB kutunun ön, sırt, arka ve diğer yüzlerini o
        oyun için saklar. Slipcase 1.4.0 veya daha yenisi bu dosyayı dışa aktarılan her resmin yanına kaydeder. 3D kutu kapağı resminiz değişmez. Zaten yüzleri
        olan bir oyun, onları değiştirmeden önce sorar; Kaldır onları
        siler.</li>
      <li><strong>Bir oyunun 3D kutusunu elinizde çevirin.</strong>
        İçe aktarılmış bir Slipcase kutusu olan oyunun kapağına tıklayın,
        kutu 3D olarak görünür. Sırtını, arkasını, üstünü ve altını görmek
        için onu sürükleyin veya ok tuşlarıyla çevirin. Yakınlaştırmak için
        kaydırın veya + ve - tuşlarına basın; geri almak için çift tıklayın
        veya Home tuşuna basın. İçe aktarılmış kutusu olmayan bir oyun yine
        kapak resmine yakınlaşır.</li>
      <li><strong>Ayarlar, Emülatörler sayfasına bağlantı veriyor.</strong>
        Emülatörler sayfasına Ayarlar'ın hiçbir yerinde bağlantı yoktu; ona
        yalnızca adresini yazarak ulaşabiliyordunuz. Yöneticiler artık
        Sistem'den sonra bir Emülatörler sekmesi görür ve Emülatörler
        sayfası aynı sekme çubuğunu gösterir; böylece diğer sekmeler bir
        tık uzaklıkta.</li>
      <li><strong>Kapak yakınlaştırması artık menülerin arkasında
        kalmıyor.</strong> Telefonda üst ve alt çubuklar yakınlaştırılmış
        kapağın üzerine biniyor ve kapatma düğmesini gizliyordu;
        bilgisayarda ise kenar çubuğu sol tarafını örtüyordu. Yakınlaştırma
        artık her şeyin üstünde açılıyor.</li>
      <li><strong>Yapay zekâ için Claude 5.5 modelleri.</strong> Ayarlar &gt; Kazıma, Anthropic'in en yeni Claude modellerini listeler: yeni varsayılan ve en ucuzu olan Haiku 5.5, Sonnet 5.5 ve Opus 5.5, güncel fiyatlarıyla. RetroDB artık Sonnet 5.5'in reddettiği bir ayarı göndermiyor.</li>
      <li><strong>Bir oyunun satış rakamını girin.</strong> İki düzenleme ekranında da Geliştirici altında bir "Satılan kopya" kutusu var. Girdiğiniz rakam, yapay zekânın bulduğu gibi oyun sayfasında görünür. Kaldırmak için kutuyu boşaltın.</li>
      <li><strong>Yapay zekâ anahtarınızı Ayarlar'da test edin.</strong> Ayarlar &gt; Kazıma bölümünde yapay zekâ sağlayıcısının altında bir "Kayıtlı yapay zekâ anahtarını test et" düğmesi var. Anahtarın çalışıp çalışmadığını, çalışmıyorsa nedenini gösterir: reddedilen anahtar, kredi yok ya da kullanım sınırı. Önceden reddedilen bir anahtar çalışıyor gibi görünürdü.</li>
      <li><strong>Claude satış rakamlarını web'de arayabilir.</strong> Ayarlar &gt; Kazıma bölümünde Claude modelinin altında, başta kapalı olan bir "Claude web'de arama yapsın" anahtarı var. Arama olmadan Claude zaten bildikleriyle yanıt verir ve "Satılan kopya" alanını boş bırakır. Anahtar açıkken Claude rakamları arar. Anthropic her arama için ücret alır, bu yüzden Yapay Zeka Doldur oyun başına en fazla 5 arama yapar, en fazla 5 ABD senti; büyük bir toplu kazımadan önce anahtarı kapatın.</li>
      <li><strong>Bütün bir sistemi tek seferde Yapay Zeka Doldur ile doldurun.</strong> ROM Araçları'nda, Resmi Adlar'ı da barındıran yeni bir Toplu Yapay Zeka Doldur sayfası var. Bir sistem ya da Tüm sistemler'i seçin, doldurulmasını istediğiniz alanları açın ve Yapay zekâ ile doldur'a basın: RetroDB her oyunda Yapay Zeka Doldur'u, bir oyunun sayfasındaki Yapay Zeka Doldur düğmesiyle aynı şekilde çalıştırır ve yanıtları doğrudan oyuna kaydeder. Bir ilerleme çubuğu ve bir Yapay Zeka Doldur bildirimi ne kadar ilerlediğini gösterir; çalışırken sayfadan ayrılabilirsiniz. Kaç oyunu dolduracağını gösterir ve önce sorar, çünkü yapay zekâ sağlayıcınız her oyun için ücret alır. Yapay Zeka Doldur'un zaten işlediği oyunlar, siz geri açmadıkça atlanır ve yapay zekâ yanıt vermeyi bırakırsa çalışma kendiliğinden durur.</li>
      <li><strong>İş bildirimleri temanızın renklerini alır.</strong> Çalışan bir işi gösteren kutular, örneğin Toplu Veri Çekme ve RA Sync, ile ilerleme çubukları artık seçtiğiniz temanın renklerini kullanır. Duraklatılamayan bir iş artık başlığını duraklatma renginde göstermez.</li>
      <li><strong>Emülatörler sayfası diğer Ayarlar sekmelerine benziyor.</strong> Ayarlar &gt; Emülatörler artık kartlara bölündü ve sekmelerin altındaki bir çubuk her birine atlıyor: RetroArch, RetroDB'de oyna, Çekirdekler, Hileler, Klasörler, Emülatörler ve Eşleme. Çubuk kaydırırken üstte kalır ve bulunduğunuz bölümü işaretler.</li>
      <li><strong>Düğmenin yanında indirme ilerlemesi.</strong> RetroArch'ı, oynatıcının çekirdeklerini veya bir hile paketini indirdiğinizde, düğmenin yanındaki bir not ne kadar ilerlediğini yüzde olarak gösterir. Önceden düğmelerin altında bir satır belirir ve sayfanın geri kalanını aşağı iterdi.</li>
      <li><strong>Her sistemin emülatörünü bir listeden seçin.</strong> Ayarlar &gt; Emülatörler'deki Sistem başına eşleme artık her sistemi bir kez, ona bağlı emülatörlerin listesiyle birlikte gösteriyor. Seçtiğiniz emülatör, bir oyun kendi emülatörünü belirlemedikçe Oyna'nın o sistemin oyunları için kullandığı emülatördür. RetroDB'nin bulamadığı bir emülatör "bulunamadı" olarak işaretlenir. Önceden her sistemin emülatör başına bir satırı vardı ve varsayılanı seçmek için küçük bir nokta kullanılıyordu. RetroDB'nin kendi RetroArch'ı artık çalıştırabildiği her listelenmiş sistemin listesinde, henüz oyunu olmayan sistemler dahil.</li>
      <li><strong>Her yol kutusunda bir Gözat düğmesi.</strong> Yöneticiler artık yolu yazmak yerine bilgisayarın klasörlerinde tıklayarak bir klasör veya program seçebilir: Ayarlar &gt; Emülatörler, Kütüphane, Kazıma ve Hesap ile ROM Araçları ayarları. Program isteyen kutular dosyaları da gösterir. <code>.config</code> gibi gizli klasörler en sonda listelenir.</li>
      <li><strong>Sol çubuk, RetroDB'nin RetroArch'ında D-Pad olarak çalışır.</strong> NES veya Mega Drive gibi çubuğu olmayan sistemlerin oyunlarında artık D-Pad'in yanı sıra sol çubukla da hareket edebilirsiniz. Bir oyunun emülatör çekirdeği çubuğu kendisi okuduğunda, Nintendo 64'te olduğu gibi, çubuk gerçek bir çubuk olarak kalır.</li>
      <li><strong>Ayarlar'dan RetroAchievements'a giriş yapın.</strong> Ayarlar &gt; Hesap artık sizi RetroDB'nin RetroArch'ı için giriş yaptırabilir; böylece emülatörün içinde giriş yapmadan, siz oynarken başarımlar açılır. Şifreniz yalnızca RetroAchievements'a gider ve saklanmaz. Her RetroDB kullanıcısının kendi girişi ve başlangıçta kapalı olan kendi Hardcore mod anahtarı vardır. DuckStation ve PCSX2 hâlâ kendi menülerinden giriş yapar.</li>
      <li><strong>Oyna düğmesinin hangi emülatörü kullanacağını görün.</strong> Bir oyunun sayfası artık Oyna düğmesinin yanında "Şurada açılır:" ve emülatörün adını gösteriyor ya da hiçbir emülatörün ayarlanmadığını söylüyor.</li>
      <li><strong>Hileler paneli bir oyunda neden hile olmadığını söylüyor.</strong> Bir oyunun emülatörü hile kullanamıyorsa panel artık gizli kalmak yerine nedenini belirtiyor.</li>
      <li><strong>Uzun klasör yolları telefona sığıyor.</strong> Ayarlar'daki uzun bir klasör yolu artık sayfanın yana kaymasına neden olmuyor.</li>
    </ul>
