  body: |
    <ul>
      <li><strong>Her sayfadan herhangi bir oyunu veya konsolu
        arayın.</strong> Kenar çubuğunda adınızın altında artık bir arama
        kutusu var. Eşleşen konsolları ve her biri kendi konsoluyla birlikte
        en fazla sekiz eşleşen oyunu görmek için iki veya daha fazla harf
        yazın. Açmak için birine tıklayın ya da ok tuşlarıyla seçip Enter'a
        basın. "Tüm sonuçları gör", Kütüphane'yi bu aramayla açar. Sayfanın
        kendi arama kutusu yoksa kutuya atlamak için / tuşuna basın.</li>
      <li><strong>Telefonda veya tablette gezinmek daha kolay.</strong> Dar
        bir ekranda üstteki çubukta menü düğmesi ve menüyü imleç zaten arama
        kutusundayken açan bir arama düğmesi bulunur. Alttaki çubuk sizi tek
        dokunuşla Kontrol Paneli, Kütüphane, Sistemler ve Başarımlar'a
        götürür. Menü artık opak, bu yüzden sayfa artık arkasından
        görünmüyor. Kapatmak için dışına dokunun veya Escape'e basın. Tablet
        boyutundaki pencerelerde menü düğmesi yoktu, bu yüzden menü hiç
        açılamıyordu; artık orada. Kaydırırken ekranda kalan sekme ve filtre
        çubukları üst çubuğun arkasında değil, hemen altında duruyor.</li>
      <li><strong>Ayarlar &gt; Emülatörler telefona sığıyor.</strong>
        Tabloları telefondan genişti, bu yüzden Düzenle ve Ayarlar düğmeleri
        ekranın dışında kalıyordu. Telefonda her satır artık düğmeleri içinde
        olan bir kart.</li>
      <li><strong>Bir oyunun görüntülerini temizlemek artık sahipsiz dosya
        bırakmıyor.</strong> RetroDB bir oyunun görüntülerini arka planda
        hâlâ keskinleştirirken onları temizlerseniz, bunları hiçbir oyunun
        kullanmadığı dosyalar olarak geri yazabiliyordu. Artık önce kontrol
        ediyor ve onları atlıyor. "Görüntüler iyileştiriliyor" sayacı da
        temizlenen oyunu hemen düşüyor.</li>
      <li><strong>Yazdığınız başlıklar kazıma sırasında korunuyor.</strong>
        Bir kazıma, Tam Yeniden Kazıma bile olsa, düzenleme penceresinde
        yazdığınız başlığı kazıyıcının verdiği adla değiştiriyordu. Artık
        değiştirdiğiniz bir başlık korunuyor. Başlığın altındaki yeni
        "Kazırken bu başlığı koru" kutusu bunu gösterir; kazıyıcıların oyunu
        yeniden adlandırmasına izin vermek için işaretini kaldırın. Oyunun
        sayfasındaki Sıfırla da buna izin verir.</li>
      <li><strong>Oyunlarınız için sizin kontrol ettiğiniz resmi
        adlar.</strong> ROM Araçları'nda yeni bir Resmi Adlar sayfası var.
        Bir sistem veya tümü için "Yapay Zekaya Sor"a basın; yapay zeka her
        oyunun, ROM'unun kendi bölgesinde yayımlandığı haliyle tam resmi
        adını önerir, böylece Japon bir Mega Man ROM'u Rockman olur. Her eski
        ve yeni adı yan yana görür, istediklerinizi işaretler ve kabul
        edersiniz. Siz bunu yapana kadar hiçbir şey değişmez. Eski ad
        alternatif başlık olarak saklanır ve kabul edilen bir ad kazıma
        sırasında korunur. Reddedilen bir ad yeniden önerilmez. Bunun için
        Ayarlar &gt; Kazıma'da bir yapay zeka sağlayıcısı gerekir.</li>
      <li><strong>Yalnızca yılı olan oyunlar düzenlenebiliyor ve yıllarını
        koruyor.</strong> Birçok oyunun tarihi yalnızca yıldır, örneğin 1985.
        Bir oyunun sayfasında düzenleme penceresi bunları kaydetmeyi
        reddediyordu. Kütüphane'nin düzenleme penceresinde böyle bir oyunu
        kaydetmek yılını siliyordu. İkisi de artık bir yılı, bir yıl ve ayı
        ya da tam bir tarihi kabul ediyor.</li>
    </ul>
