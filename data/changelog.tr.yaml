  tags:
  - type: fix
    label: CLZ içe aktarma yeniden çalışıyor, liste kapakları görünüyor ve birkaç sayfa artık kesme işaretinde bozulmuyor
  - type: security
    label: Kazınan adlar ve dosya yolları artık sayfa düğmelerinin dışına taşamıyor
  body: |
    <ul>
      <li><strong>CLZ içe aktarma hiçbir şey yapmıyordu.</strong> Bir CLZ PDF
        dosyası yüklemek onu sunucuda olmayan bir adrese gönderiyordu, bu yüzden
        her yükleme "Parse failed" hatasıyla başarısız oluyordu. Artık
        ayrıştırıcıya ulaşıyor.</li>
      <li><strong>Bir liste sayfasındaki kapakların hepsi eksikti.</strong> Liste
        sayfası her kapağı yanlış adresten istiyordu ve Sistem sütunu her zaman
        boştu. Artık ikisi de görünüyor. Sayfanın "oyun ekle" aramasındaki kapak
        resimleri de düzeltildi.</li>
      <li><strong>Düğmeler kesme işaretli adlarda bozuluyordu.</strong> Bir
        listeden "Assassin's Creed" oyununu kaldırmak, bir ekran görüntüsünü
        silmek, bir kapağı yakınlaştırmak ya da bir tür etiketini kaldırmak, ad
        kesme işareti içerdiğinde sessizce hiçbir şey yapmayabiliyordu. Aynı
        hata, özel olarak hazırlanmış bir kazınan adın sayfada kod
        çalıştırmasına izin veriyordu. Adlar artık bu düğmelere kod olarak
        yanlış okunamayacak bir şekilde ulaşıyor.</li>
      <li><strong>Görüntü ve bağlantı adresleri artık her yerde kaçışlanıyor.</strong>
        Birkaç sayfa, resim adreslerini kazınan dosya adlarından kaçışlamadan
        oluşturuyordu ve beş sayfa kaçışlama yardımcısının kendi zayıf bir
        kopyasını taşıyordu. Artık hepsi ortak olanı kullanıyor.</li>
      <li><strong>Ayarlar sayfası boş açılabiliyordu.</strong> En son
        kullandığınız sekmenin adı bir güncellemeyle değiştiyse, Ayarlar hiçbir
        panel görünmeden açılıyordu. Artık var olmayan bir sekmeyi yok sayıyor.
        <code>/settings#account</code> gibi bağlantılar o sekmeyi yeniden
        açıyor.</li>
      <li><strong>Temanız artık sizi diğer cihazlara da izliyor.</strong>
        Seçtiğiniz tema hesabınıza kaydediliyor. Hiç tema belirtilmemiş bir
        tarayıcı, varsayılan yerine kayıtlı temanızı kullanıyor.</li>
      <li><strong>İş ilerleme açılır pencereleri doğru simgeyi gösteriyor.</strong>
        Duraklatılmış, bitmiş ve sıradaki işler aynı "çalışıyor" simgesini
        gösteriyordu. Artık her durumun, her temada kendi simgesi var.</li>
      <li><strong>Klavye kısayolu listesi artık çevrilebiliyor.</strong>
        Etiketleri çeviri araçlarına görünmüyordu, bu yüzden her dilde
        İngilizce kalıyordu.</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: Yaş derecelendirmeleri sık sık yanlıştı ve kazınan oyunlar ayrıntılarını kaybedebiliyordu
  body: |
    <ul>
      <li><strong>Yaş derecelendirmeleri sık sık yanlıştı ve hata yayılıyordu.</strong>
        Bir derecelendirme TheGamesDB&rsquo;den geldiğinde uygulama onu düzgün
        okumak yerine derecelendirme kodunu metnin herhangi bir yerinde
        arıyordu &mdash; bu yüzden "T - Teen", "M - Mature 17+", "AO - Adults
        Only 18+" ve "RP - Rating Pending" hep yanlış derecelendirme olarak
        kaydediliyordu ve Mature bir oyun herkese uygun olarak kaydedilebiliyordu.
        Daha kötüsü, bu yanlış derecelendirme daha sonra diğer sekiz
        derecelendirme sistemini doldurmak için kullanılıyordu; böylece tek bir
        hatalı okuma hepsine yayılıyordu. Derecelendirmeler artık metnin
        başındaki koddan okunuyor.</li>
      <li><strong>Dönüştürülen derecelendirmeler fazla hoşgörülü çıkıyordu.</strong>
        Eksik bir derecelendirmeyi zaten sahip olduğunuz birinden doldururken
        uygulama, gerçekte başladığınız derecelendirme yerine biraz önce kendi
        hesapladığı bir derecelendirmeyi kullanabiliyordu. Her adım biraz
        katılık kaybettiriyordu. Artık her zaman oyunun gerçekten sahip olduğu
        derecelendirmelerden dönüştürüyor.</li>
      <li><strong>Tam Yeniden Kazıma elle seçilmiş Bölge ve Kayıt Türü&rsquo;nü siliyordu.</strong>
        Bunların hiçbiri bir kazıyıcıdan gelmez &mdash; uygulama bunları kendisi
        çıkarır &mdash; bu yüzden Tam Yeniden Kazıma, özenle seçtiğiniz "Japan"
        değerini varsayılan "USA" ile değiştiriyordu. Bir kaynak gerçekten yeni
        bir değer sağlamadıkça değerleriniz artık korunuyor.</li>
      <li><strong>Bir kazıyıcı yanlış oyunu kabul edebiliyordu.</strong>
        ScreenScraper sonuçları normalde kullanılmadan önce bir eşleşme puanına
        göre denetlenir, ancak tam olarak tek bir sonuç döndüren bir arama bu
        denetimi tamamen atlıyordu. Artık her sonuç puanlanıyor.</li>
      <li><strong>Bir oyun, tek bir eksik alan yüzünden kazınan tüm ayrıntılarını
        kaybedebiliyordu.</strong> IGDB ya da ScreenScraper tek bir alanı
        beklenmedik bir şekilde boş bırakırsa, güncellemenin tamamı atılıyordu
        &mdash; yayıncı, geliştirici, görseller, hepsi. Bu durumlar artık ele
        alınıyor ve ayrıntıların geri kalanı korunuyor.</li>
      <li><strong>Başarısız bir görüntü başarılı olarak kaydedilebiliyordu.</strong>
        İndirilen bir resmin kullanılabilir bir görüntü olmadığı ortaya çıkarsa,
        uygulama hiçbir şey silmiyor ve yine de dosya adını kaydediyordu; bu da
        bozuk bir başvuru bırakıyordu. Artık dosya kaldırılıyor ve alana
        dokunulmuyor.</li>
      <li><strong>Oyun modları artık tutarlı ifadeler kullanıyor.</strong> Farklı
        kazıyıcılar "Single-player" ve "Single-Player" ile uygulamanın kendi
        etiketlerinden biri olmayan yalın bir "Multiplayer" yazıyordu; bu yüzden
        bu oyunlar çevrilemiyor ya da Modlar filtresiyle eşleştirilemiyordu.
        Artık tüm kaynaklar aynı etiketleri yazıyor. Mevcut oyunlar, siz onları
        yeniden kazıyana ya da Ayarlar&rsquo;daki normalleştirme aracını
        çalıştırana kadar eski ifadelerini koruyor.</li>
      <li><strong>Xbox aramaları artık diğer tüm kaynaklar gibi davranıyor.</strong>
        Kendi web isteklerini yapıyorlardı; bu yüzden Xbox Live onlardan
        yavaşlamalarını istediğinde yeniden deneme yoktu ve bir yanıtın ne kadar
        veri çekebileceğine dair bir sınır yoktu. Artık diğer kazıyıcılarla aynı
        ortak bağlantıyı kullanıyorlar.</li>
      <li><strong>Kullanılmayan ScreenScraper kodu kaldırıldı.</strong>
        Uygulamada hiçbir şeyin çağırmadığı iki işlev silindi. Bunlardan biri,
        içinde ScreenScraper parolanızın hâlâ bulunduğu bir web adresi
        döndürüyordu; bu da onu kullanan her şeye parolayı vermiş olurdu. 3.6.x
        sürüm notlarında listelenen "System Media Endpoint" bunlardan biriydi
        &mdash; uygulamanın hiçbir yerinden erişilebilir değildi.</li>
    </ul>
- version: 3.23.5
  date: '2026-09-02'
  tags:
  - type: fix
    label: Paketlenmiş indirme başlayamıyordu, ayrıca diğer derleme düzeltmeleri
  body: |
    <ul>
      <li><strong>Bağımsız indirme hiç başlayamıyordu.</strong> Paketlenmiş
        sürüm kendi Python&rsquo;unu taşır, ancak içindeki başlatıcı kaynaktan
        kurulum için yazılmış olandı &mdash; paketlenmiş bir sürümün içermediği
        Python dosyalarını arıyor ve ilk satırda duruyordu. Paket artık kendi
        başlatıcısıyla geliyor; bu başlatıcı uygulamayı çalıştırıyor ve sunucu
        hazır olunca tarayıcınızı açıyor.</li>
      <li><strong>Linux indirmesindeki masaüstü kısayolu hiçbir şey
        başlatmıyordu.</strong> Uygulamanın yolunun olması gereken yerde yer
        tutucu bir metinle geliyordu. Artık başlatıcının yanında bir
        <code>install-launcher.sh</code> var &mdash; onu bir kez çalıştırın,
        kısayol, paketi açtığınız yerin gerçek yoluyla yazılsın.</li>
      <li><strong>Kaynaktan başlatmak doğrulanmamış bağımlılıklar
        kuruyordu.</strong> Flask eksik olduğunda başlatma betiği paketleri
        hiçbir sağlama toplamı denetimi olmadan doğrudan internetten indiriyor
        ve bu sırada sisteminizin paket yöneticisini zorla aşıyordu. Artık işi
        sağlama toplamlı kilit dosyasını kullanan <code>install.py</code>
        dosyasına bırakıyor.</li>
      <li><strong>Kaynak indirmesi, içermemesi gereken bakımcı dosyalarını
        taşıyordu.</strong> Dışarıda bırakılacakların listesi elle tutuluyordu ve
        geride kalmıştı; bu yüzden denetim çıktıları ve artık derleme klasörleri
        uygulamayla birlikte paketleniyordu. İndirme artık projede gerçekten
        bulunan dosyaların listesinden oluşturuluyor; bu liste kayamaz.</li>
      <li><strong>Paketlenmiş sürümde iki Ayarlar paneli bozuluyordu.</strong>
        Kütüphane istatistikleri ve API durumu panelleri ana programı,
        paketlenmiş bir sürümde sahip olmadığı bir adla arıyordu; bu yüzden ikisi
        de başarısız oluyordu.</li>
      <li><strong>Ekrandaki bazı metinler hiçbir zaman çevrilemiyordu.</strong>
        Uygulamanın daha yeni üç bölümü &mdash; emülatör ayarları, başlatma
        düğmesi ve "şu anda oynanıyor" çubuğu &mdash; çeviri taramasında
        atlanıyordu ve bunu yakalaması gereken denetim de aynı eksik listeye
        bakıyordu. Tarama artık her dosyayı otomatik olarak kapsıyor ve
        bunların metinleri çevirilere eklendi.</li>
      <li><strong>Çevirileri yeniden oluşturmak sessizce hiçbir şey
        yapmayabiliyordu.</strong> Sayfaya özel bir betiğe metin eklemek,
        yeniden oluşturma işlemini yapacak bir şey olmadığına inandırıyordu; bu
        yüzden yeni metin hiçbir zaman çeviri dosyasına ulaşmıyordu.</li>
      <li><strong>Bir ekran kartı geçici çözümü herkese uygulanıyordu.</strong>
        Linux başlatma betiği, belirli bir AMD kartı için olan bir ayarı her
        makineye zorluyordu; bu da diğer AMD donanımlarında görüntü büyütücüyü
        kilitleyebiliyordu. Artık yalnızca o kart gerçekten takılıyken
        uygulanıyor ve kendiniz belirlediğiniz bir değeri hiçbir zaman
        geçersiz kılmıyor.</li>
      <li><strong>Sürüm betiği yanlış sürümü yayımlayabiliyordu.</strong>
        Önceki bir denemeden kalan bir etiket sessizce yeniden kullanılıyordu;
        böylece derleme daha eski bir anlık görüntüden yapılıp yine de başarılı
        olduğu bildirilebiliyordu.</li>
    </ul>
- version: 3.23.4
  date: '2026-09-02'
  tags:
  - type: fix
    label: Kütüphanenizin veri kaybedebileceği dokuz yol kapatıldı
  body: |
    <ul>
      <li><strong>"Kazınan verileri temizle" tüm kütüphanenizi temizliyordu.</strong>
        Onay kutusu yalnızca gerçekten kazınmış oyunları sayıyordu, ardından
        işlem ne olursa olsun her oyunu siliyordu &mdash; yani bir düzine oyun
        söz verip binlercesini temizleyebiliyordu. Görüntüler açıkken, hiç
        kazınmamış oyunlarda bile elle yüklediğiniz kapak görsellerini siliyor
        ve kendiniz düzenlediğiniz başlıkları sıfırlıyordu. Artık tam olarak
        kutuda yazanı yapıyor.</li>
      <li><strong>3D kutu görseli geride bozuk bir bağlantı bırakıyordu.</strong>
        Görüntülerle birlikte temizlemek 3D kapağı diskten siliyor ama
        veritabanını ona işaret eder halde bırakıyordu; bu yüzden uygulama artık
        olmayan bir dosyayı arıyordu.</li>
      <li><strong>Toplu düzenlemenin "Ekle" anahtarı eklemek yerine değiştiriyordu.</strong>
        Bakış Açısı ve Boyut için etiketinin tam tersini yapıyor, seçilen her
        oyundaki mevcut değerlerin üzerine bir anda, geri alınamaz şekilde
        yazıyordu.</li>
      <li><strong>Bağımsız sürümler tek tıklamayla tüm görüntü başvurularını
        silebiliyordu.</strong> Paketlenmiş indirmede uygulama medyanızı yanlış
        yerde arıyor, her görüntünün eksik olduğuna karar veriyor ve "eksik medya
        başvurularını temizle" ardından tüm kütüphanenin görsel, ekran görüntüsü,
        video ve kılavuz kayıtlarını boşaltıyordu. Tam olarak bunu yakalamak için
        var olan güvenlik denetimi bunu göremiyordu. Yalnızca paketlenmiş sürüm
        etkilendi.</li>
      <li><strong>Sahipsiz dosya taraması görselleri gelir gelmez silebiliyordu.</strong>
        Tarama sürerken indirilen bir kapak, sahipsiz sayılıp
        kaldırılabiliyordu.</li>
      <li><strong>Oynatma listesi oluşturma arşivlerinizi sormadan taşıyordu.</strong>
        Toplu M3U oynatma listesi oluşturmak, o seçeneği kapalı bıraktığınızda
        bile orijinal arşiv dosyalarınızı taşıyordu &mdash; istediğinizde ise
        başarılı olmuş bir taşıma için hata bildiriyordu.</li>
      <li><strong>Görüntü yeniden boyutlandırıcı medya klasörünüzü şişiriyordu.</strong>
        Oluşturduğu küçük önizlemeleri büyütülecek yeni görüntüler olarak
        görüyor, onları tam boyuta çıkarıyor, sonra bunların önizlemelerini
        oluşturuyordu. Her çalıştırma daha fazla dosya ekliyor, sayfalar
        önizlemeler yerine sessizce tam boyutlu görüntüler sunuyor ve yapay zeka
        büyütücü amaçlanan dosya sayısının kabaca üç katı üzerinde
        çalışıyordu.</li>
      <li><strong>Yapay zeka ile doldurma düzelttiğiniz ayrıntıların üzerine
        yazıyordu.</strong> Normal bir kazımada kendi yayıncı, geliştirici, tür,
        yaş derecelendirmesi ve daha fazla bilginizi değiştirebiliyordu. Artık
        yalnızca boşlukları dolduruyor; kendiniz bastığınız Yapay Zeka Doldur
        düğmesi değişmedi.</li>
      <li><strong>Tekrarlanan kazımalar iyi bir ekran görüntüsünü silebiliyordu.</strong>
        RAWG&rsquo;den kazınan oyunlar aynı dosya adlarını yeniden kullanıyordu;
        bu yüzden ikinci bir kazıma kayıtlı bir ekran görüntüsünün üzerine yazıyor,
        ardından kütüphane onu hâlâ listelerken kopya olarak kaldırıyordu.</li>
    </ul>
- version: 3.23.3
  date: '2026-09-01'
  tags:
  - type: fix
    label: Ev halkı rolleri artık tam olarak söylediklerini yapıyor ve devre dışı bırakılan bir hesap gerçekten kilitleniyor
  body: |
    <ul>
      <li><strong>Birini devre dışı bırakmak artık oturumunu sonlandırıyor.</strong>
        Bir hesabı kapatmak onu her ekrandan gizliyordu, ancak o hesapta zaten
        oturum açmış olan biri bir haftaya kadar normal şekilde çalışmayı
        sürdürüyordu. Devre dışı bırakma, birini silmeden kilitlemenin tek
        yoludur; bu yüzden artık o kişinin bir sonraki tıklamasında geçerli
        oluyor.</li>
      <li><strong>Salt okunur hesaplar artık oyun verilerini değiştiremiyor.</strong>
        Üç "how long to beat" işlemi, yalnızca görüntüleme yetkisi olanlar dahil
        oturum açmış herkese açıktı — bu yüzden salt okunur bir hesap bir oynama
        süresinin üzerine yazabiliyor ya da onu kütüphanedeki her oyundan
        silebiliyordu. Artık bir oyunu değiştiren diğer her işlem gibi düzenleme
        yetkisi gerektiriyorlar.</li>
      <li><strong>Kupa takipçisi yeniden herkes için çalışıyor.</strong>
        Kendi koleksiyoncu kupalarınızı yenilemek, Oyuncu ve İzleyici rollerinde
        olmayan düzenleyici yetkisi gerektiriyordu — ve bu kupaları yazan tek şey
        oydu. Bu hesaplar hiçbir zaman kupa kazanamıyordu ve Yenile düğmesi
        yalnızca bir hata gösteriyordu. Bu sizin kendi ilerlemeniz olduğu için
        artık hiçbir özel yetki gerektirmiyor.</li>
      <li><strong>Bir kişinin PlayStation yenilemesini artık başkası
        durduramıyor.</strong> Oturum açmış herhangi bir hesap, başka birinin
        başlattığı bir yenilemeyi duraklatabiliyor ya da iptal edebiliyor ve o
        kişinin hangi oyunda olduğunu görebiliyordu. İkisi de artık yalnızca
        yenilemeyi başlatan kişiyle sınırlı.</li>
      <li><strong>Steam içe aktarmaları, bilgilerini ilk kaydeden kişinin değil,
        sizin hesabınızı kullanıyor.</strong> Kütüphane içe aktarması sizinki
        yerine Steam kimlik bilgilerinin tek bir ortak kopyasını okuyordu; bu
        yüzden başka birinin kütüphanesini getirebiliyordu — bu sırada sizin
        kayıtlı bilgileriniz eksik görünüyordu.</li>
      <li><strong>Bir yönetici parolasını tahmin etmek yeniden zor.</strong>
        Başarısız oturum açma denemeleri sınırı ağdaki herkes arasında
        paylaşılıyordu; bu yüzden kendi hesabı olan herkes oturum açarak sınırı
        sıfırlayıp sonsuza dek tahmin etmeyi sürdürebiliyordu. Sınır artık hesap
        başına.</li>
      <li><strong>Uygulamadan gelen hatalar artık kaybolmak yerine sayfaya ulaşıyor.
        </strong> Bir işlem reddedildiğinde, bunların 115&rsquo;i sayfanın
        okuyamadığı bir biçimde yanıt veriyordu; bu yüzden işlem çalışmış gibi
        görünüyordu. Artık reddi düzgün bildiriyorlar ve gerçek iletiyi
        görüyorsunuz.</li>
    </ul>
- version: 3.23.2
  date: '2026-08-06'
  tags:
  - type: fix
    label: Kazıyıcı ayar sayfaları daha hızlı yükleniyor ve hiçbir zaman eski bir API anahtarı göstermiyor
  body: |
    <ul>
      <li><strong>Ayarlar ve Kazıyıcı Yapılandırması sayfaları artık her istekte
        kazıyıcı ayarları dosyasını yeniden okumuyor.</strong> Ortak bir
        önbellekli okuyucu zaten var olduğu halde, dört yer bir sayfa ya da
        denetim her çalıştığında dosyayı diskten açıp yeniden ayrıştırıyordu.
        Artık hepsi onu kullanıyor; böylece bu sayfalar her ziyarette daha az iş
        yapıyor.</li>
      <li><strong>Kaydetmek yine anında etkili oluyor.</strong> Bir zamanlayıcıyla
        unutan bir önbellek, kaydettikten sonra yarım dakikaya kadar size eski
        değerleri gösterebilirdi. Artık her kayıt, yazarken önbelleği temizliyor;
        böylece gördüğünüz, az önce kaydettiğinizdir.</li>
      <li><strong>Gerçek API anahtarlarınızın yerini artık kendi maskelenmiş
        görüntü değerleri alamıyor.</strong> Ayarlar sayfaları kayıtlı anahtarları
        gerçek halleri yerine <code>***1234</code> olarak gösterir. Sayfaya,
        kazıyıcıların kullandığı ayarların aynı kopyası verildiği için bu
        maskeleme bellekteki gerçek anahtarların üzerine yazabilir ve önbellek
        süresi dolana kadar kazıyıcıların yıldız işaretleriyle oturum açmasına
        yol açabilirdi.</li>
      <li><strong>Bağımsız sürümler artık kazıyıcı ayarlarını doğru yerde
        arıyor.</strong> Kazıyıcılar dosyanın konumunu, onu kaydeden
        sayfalardan farklı bir şekilde belirliyordu. Normal bir kurulumda ikisi
        de aynı dosyaya varıyordu; bağımsız (çift tıklamalı) bir sürümde ise
        varmazdı; bu yüzden kayıtlı API anahtarları kazıyıcıların hiç bakmadığı
        bir yere gidebilirdi.</li>
    </ul>
- version: 3.23.1
  date: '2026-08-06'
  tags:
  - type: fix
    label: Ayarlar&rsquo;da kaydettiğiniz sunucu bağlantı noktası artık kullanılan bağlantı noktası
  body: |
    <ul>
      <li><strong>Bir sunucu bağlantı noktasını kaydetmek sunucuyu gerçekten taşıyor.</strong>
        Ayarlar bir bağlantı noktasını kabul ediyor, denetliyor, kaydediyor ve
        uygulamak için yeniden başlatma gerektiğini söylüyordu &mdash; ardından
        sunucu yine de 5000 üzerinde başlıyordu. Hiçbir şey değeri geri
        okumuyordu. Artık başlatma zincirinin bir parçası; böylece yeniden
        başlatma RetroDB&rsquo;yi gerçekten seçtiğiniz bağlantı noktasına
        taşıyor. Ortamda ayarlanan her şey yine önceliklidir; bu yüzden bir
        bağlantı noktası atayan başlatıcı ya da kapsayıcı etkilenmez.</li>
      <li><strong>Hiçbir zaman bir işe yaramayan iki ayar onarılmak yerine
        kaldırıldı.</strong> "Sunucu ana bilgisayarı" ve "hata ayıklama modu"
        saklanıyor ve aynı yanlış sözü veriyordu. Hata ayıklama modunu bir web
        formundan açmak, tarayıcıda etkileşimli bir Python konsolunu açığa
        çıkarırdı; bağlanma adresi ise RetroDB&rsquo;ye hangi makinelerin
        erişebileceğini belirler &mdash; ikisi de bir ayarlar formunun arkasında
        olmamalı. İkisi de zaten bulundukları ortamdan yapılandırılabilir
        kalıyor. Ayarlar dosyanız bunları hâlâ içeriyorsa yükleme sırasında
        sessizce atılıyorlar; yapmanız gereken bir şey yok.</li>
      <li><strong>Artık hiçbir şey, yeniden başlatma onu uygulamadıkça yeniden
        başlatmanın onu uygulayacağını iddia etmiyor.</strong> Asıl kusur buydu
        &mdash; ölü bir ayar dağınıklıktır, ama yanlış bir söz bir öğleden sonrayı
        boşa harcatır.</li>
    </ul>
- version: 3.23.0
  date: '2026-08-06'
  tags:
  - type: enhancement
    label: RetroDB&rsquo;yi başka birinin seçtiği bir bağlantı noktasında başlatın
  body: |
    <ul>
      <li><strong>RetroDB artık ortamından bir <code>PORT</code> ayarı
        okuyor.</strong> RetroDB&rsquo;yi başka bir araçtan başlatıyorsanız
        &mdash; bir pano, bir kapsayıcı, bir ev sunucusu paneli &mdash; o araç
        artık kimse bir dosyayı düzenlemeden RetroDB&rsquo;ye istediği bağlantı
        noktasını verebilir. <code>PORT</code> ayarlayın, RetroDB oraya
        bağlansın; dokunmazsanız hiçbir şey değişmez. Mevcut
        <code>RETRODB_PORT</code> tam olarak eskisi gibi çalışmaya devam ediyor
        ve ikisi de ayarlanmışsa <code>PORT</code> öncelikli oluyor.</li>
      <li><strong>Hatalı bir bağlantı noktası numarası artık tahmin etmek yerine
        bunu söylüyor.</strong> Önceden okunamayan bir bağlantı noktası bir duvar
        dolusu Python hata metni üretiyordu ve kullanılabilir aralığın dışındaki
        bir bağlantı noktası ancak sunucu başlayamadığında fark ediliyordu.
        RetroDB artık kullanamadığı değeri adlandıran tek bir satırla hemen
        duruyor. Kendisinden istenenden farklı bir bağlantı noktasında hiçbir
        zaman sessizce başlamaz &mdash; sessizce başka yere taşınmak, hayır
        cevabı almaktan daha kötüdür.</li>
      <li><strong>Başlangıç başlığı ve tarayıcı sekmesi gerçek bağlantı
        noktasını izliyor.</strong> RetroDB başlarken yazdırılan adres ve sizin
        için açtığı sayfa, gerçekte hangi bağlantı noktası kullanılırsa
        kullanılsın eskiden hep 5000 diyordu.</li>
    </ul>
- version: 3.22.1
  date: '2026-07-31'
  tags:
  - type: fix
    label: Veritabanının geçici dosyası artık sınırsız büyümüyor
  body: |
    <ul>
      <li><strong>Veritabanı günlüğü yeniden sınırlandı.</strong> SQLite, kitaplık veritabanınızın yanında bir geçici dosya (<code>-wal</code> dosyası) tutar. RetroDB bunu 64&nbsp;MB ile sınırlamayı amaçlıyordu, ancak sınır yalnızca arka plan işlerine uygulanıyordu &mdash; olağan sayfa yüklemeleri ve düzenlemeler hiçbir sınır olmadan çalışıyordu. Alışılmadık büyüklükte tek bir yazma işleminden sonra dosya sonsuza dek en büyük boyutunda kalıyor, bazen veritabanının kendisinden bile büyük oluyordu. Artık sınır her yerde geçerli, böylece alan geri veriliyor.</li>
    </ul>
- version: 3.22.0
  date: '2026-07-05'
  tags:
  - type: enhancement
    label: Bir oyunu doğrudan açılır penceresinden kazıyın, fazladan adım olmadan
  body: |
    <ul>
      <li><strong>Oyun açılır penceresinden kazıma.</strong> Hızlı oyun açılır
        penceresi (Kitaplığınızda bir oyuna tıkladığınızda görünen pencere) artık
        Yapay Zeka Doldur ve Düzenle&rsquo;nin yanında bir <strong>Kazı</strong>
        düğmesine sahip. Ona tıklayın, RetroDB sizi meta veri araması zaten açık
        olarak doğrudan o oyuna götürür &mdash; artık tam sayfayı açıp önce Kazı
        düğmesini aramak yok.</li>
    </ul>
- version: 3.21.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Tek tıklamayla başlatma — RetroDB&rsquo;yi sabitlenmiş bir simgeden başlatın, terminal yok
  - type: feature
    label: Gerçek bir uygulama simgesi — tarayıcı sekmenizde ve görev çubuğunuzda neon oyun kolu
  - type: feature
    label: Ayarlar sayfasında yeni Sunucuyu Kapat düğmesi
  body: |
    <ul>
      <li><strong>Tek tıklamayla başlatın.</strong> RetroDB artık görev
        çubuğunuza sabitleyebileceğiniz düzgün bir başlatıcıya sahip &mdash; ona
        tıklayın, uygulama başlar (zaten çalışmıyorsa) ve otomatik olarak
        tarayıcınızda açılır. Artık terminal açıp komut yazmaya son.
        Linux&rsquo;ta, uygulama menünüze &ldquo;RetroDB&rdquo; eklemek için bir
        kez <code>python3 scripts/install_launcher.py</code> çalıştırın, sonra
        sabitleyin.</li>
      <li><strong>Gerçek bir uygulama simgesi.</strong> RetroDB artık bir neon
        oyun kolu simgesi taşıyor &mdash; koyu bir kutucuk üzerinde cyberpunk
        camgöbeği ve macenta &mdash; tarayıcı sekmenizde (favicon), görev çubuğu
        başlatıcısında ve Windows programının kendisinde. Sade emoji yer
        tutucusunun yerini alıyor.</li>
      <li><strong>Sunucuyu Kapat düğmesi.</strong> Ayarlar sayfasının Sunucu
        Kontrolleri bölümünde artık Yeniden Başlat&rsquo;ın yanında kırmızı bir
        <strong>Sunucuyu Kapat</strong> düğmesi var. Uygulamayı temiz bir şekilde
        durdurur (çalışan işlerin önce kaydetmeyi bitirmesine izin vererek),
        böylece artık terminale geçip Ctrl+C tuşlarına basmanıza gerek yok.</li>
      <li><strong>İndirilebilir sürümler tarayıcıyı sizin için açar.</strong>
        Kullanıma hazır Windows, Mac ve Linux indirmeleri artık başladıktan kısa
        bir süre sonra tarayıcınızı açar, böylece uygulama fazladan bir adım
        olmadan karşınızda olur.</li>
    </ul>
- version: 3.20.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: On bir yeni dil — RetroDB artık 21 dil konuşuyor
  body: |
    <ul>
      <li><strong>On bir yeni dil paketi.</strong> RetroDB&rsquo;nin arayüzü,
        sürüm notları ve yardım kılavuzu artık <strong>Afrikaans, isiZulu,
        isiXhosa, Dutch, Norwegian (Bokm&aring;l), Russian, Polish, Turkish,
        Ukrainian, Indonesian ve Hebrew</strong> dillerine çevrildi &mdash;
        mevcut German, Spanish, French, Italian, Japanese, Korean, Brazilian
        Portuguese ve Simplified &amp; Traditional Chinese dillerine ek
        olarak. Dilinizi Ayarlar &rarr; Görüntüleme Tercihleri &rarr; Dil
        altından seçin; uygulama seçtiğiniz dilde yeniden yüklenir.</li>
      <li>Her dil, uygulamanın tamamını kapsar: her düğme, etiket ve mesaj,
        sürüm notlarının tüm geçmişi ve yardım kılavuzunun tamamı.</li>
      <li><strong>isiZulu &amp; isiXhosa</strong> da dahil edildi. Mevcut
        yazılım terminolojisi az olan bu dillerde, doğal bir karşılığı
        olmayan yaygın teknik terimler (ROM, scraper, box art) İngilizce
        bırakıldı &mdash; bunlara güvenmeden önce anadili konuşan biri
        tarafından gözden geçirilmesi faydalı olacaktır.</li>
      <li><strong>Hebrew</strong> tamamen çevrilmiş metinle sunuluyor;
        arayüzün doğru şekilde yansıması için gerekli sağdan sola sayfa
        düzeni iyileştirmesi ilerideki bir güncellemede gelecek. Arabic, bu
        düzen çalışması tamamlandığında onu takip edecek.</li>
    </ul>
- version: 3.19.1
  date: '2026-07-05'
  tags:
  - type: performance
    label: Daha hızlı tarama — bir oyunun ekran görüntüleri artık aynı anda indiriliyor
  body: |
    <ul>
      <li><strong>Ekran görüntüleri paralel olarak indiriliyor.</strong> Popüler
        ES-DE ön yüzünün kullandığı yaklaşımın aynısını izleyerek (bir oyunun tüm
        medyasını tek seferde çeken), RetroDB artık bir oyunun ekran görüntülerini
        <strong>eş zamanlı olarak</strong> indiriyor; bunu her kaynak için
        (TheGamesDB, IGDB, RAWG, ScreenScraper) art arda değil aynı anda yapıyor.
        Birden fazla ekran görüntüsü olan oyunlar belirgin şekilde daha hızlı
        tamamlanıyor.</li>
      <li>Yinelenen ekran görüntüsü denetimi hâlâ sonradan sırayla çalışıyor, bu
        yüzden resim yinelenme temizliği eskisi kadar doğru kalıyor &mdash; yalnızca
        indirme hızlandırıldı. İndirmeler, tek bir kaynağın aşırı yüklenmemesi için
        aynı anda dörtle sınırlandırılmış durumda.</li>
      <li>Arka planda yapılan bir hız iyileştirmesi; bir sonraki yeniden
        başlatmadan sonra etkin olur.</li>
    </ul>
- version: 3.19.0
  date: '2026-07-05'
  tags:
  - type: performance
    label: Daha hızlı tarama — kaynaklar artık aynı anda sorgulanıyor
  body: |
    <ul>
      <li><strong>Tarama, oyun başına daha hızlı.</strong> RetroDB bir oyunu
        aradığında birkaç veritabanını kontrol eder (ES-DE, TheGamesDB, IGDB, RAWG,
        ScreenScraper). Daha önce bunları <em>tek tek</em> sorguluyor ve bir
        sonrakine geçmeden önce her birinin yanıtını bekliyordu &mdash; bu yüzden
        bekleme süresi hepsinin toplamı kadardı. Artık hepsini <strong>aynı
        anda</strong> sorguluyor ve yalnızca en yavaş olanı bekliyor; bu da her
        oyunda belirgin bir hız artışı sağlıyor. Sonuçlar hâlâ tıpkı öncekiyle aynı
        şekilde sıralanıp puanlanıyor.</li>
      <li><strong>Görsel indirirken daha az boşa el sıkışma.</strong> Görsel
        indirmeleri artık her resim için yeni bir bağlantı açmak yerine zaten açık
        olan bir bağlantıyı yeniden kullanıyor; bu da çok sayıda ekran görüntüsü
        olan oyunlarda zaman kazandırıyor.</li>
      <li>Bunlar arka planda yapılan hız iyileştirmeleri &mdash; RetroDB&rsquo;yi
        kullanma şeklinizde hiçbir şey değişmiyor ve veritabanlarını daha fazla
        zorlamıyor (aynı istekler, sadece çakışık şekilde yapılıyor). Bir sonraki
        yeniden başlatmadan sonra etkin olur.</li>
    </ul>
- version: 3.18.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Çin yaş sınıflandırması 9. derecelendirme sistemi olarak eklendi
  body: |
    <ul>
      <li><strong>Yeni yaş sınıflandırma sistemi: Çin (CADPA).</strong> RetroDB
        artık mevcut sekiz kurulun (ESRB, PEGI, CERO, USK, ACB, FPB, GRAC ve
        ClassInd) yanı sıra Çin&rsquo;in resmi oyun yaş uyarı sistemini de
        (&ldquo;网络游戏适龄提示&rdquo;, CADPA tarafından yayımlanır) destekliyor. Üç
        seviye kullanır &mdash; <strong>8+</strong>, <strong>12+</strong> ve
        <strong>16+</strong> &mdash; basit bir yeşil rozetle gösterilir.</li>
      <li><strong>Diğerleri gibi kendiliğinden doldurulur.</strong> Bir oyunun
        başka bir ülkeden zaten bir derecelendirmesi varsa RetroDB, eşleşen Çin
        seviyesini otomatik olarak hesaplar (ve tam tersi de geçerlidir). Bunu bir
        oyunun Düzenle ekranında elle de seçebilir veya değiştirebilir, Ayarlar
        &rarr; Kütüphane altında tercih ettiğiniz görüntüleme sistemi olarak da
        seçebilirsiniz. Not: çoğu Batılı oyun veritabanı bir Çin derecelendirmesi
        yayımlamaz, bu yüzden hiçbir yerde derecelendirmesi olmayan oyunlarda bu
        değer tarama / AI Doldurma sırasında oyunun içeriğinden çıkarılır.</li>
      <li>Yeşil rozetler CADPA&rsquo;nın resmi logosu değil, RetroDB&rsquo;ye özgü
        basit bir tasarımdır (diğer kurulların ev stiline uygun), bu yüzden
        herhangi bir görsel lisans kısıtlaması söz konusu değildir.</li>
    </ul>
- version: 3.17.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Diskte bulunmayan medya dosyaları için veritabanı kayıtlarını temizle
  - type: security
    label: Bir medya klasörü kaybolduğunda tüm kütüphanenizin görsellerinin silinmesine karşı koruma
  body: |
    <ul>
      <li><strong>Yeni bakım aracı: &ldquo;Eksik Medya Referansları&rdquo;</strong>
        (Ayarlar &rarr; Sistem &rarr; Bakım). Mevcut &ldquo;Sahipsiz Medya&rdquo;
        temizliğinin tam tersidir: sahibi olmayan artık kalıntı görsel dosyalarını
        bulmak yerine, kutu resmi, 3D kutu resmi, ekran görüntüleri, arka plan
        görseli (fanart), video veya kılavuzu artık diskte bulunmayan dosyalara
        işaret eden oyunları bulur. Bunları tarayın, ardından tarayıcıların
        görselleri yeniden indirebilmesi için bu eski referansları tek tıkla
        temizleyin. Oyun kayıtlarınızın kendisine asla dokunulmaz.</li>
      <li><strong>Tarama sırasında daha güvenli otomatik temizlik.</strong> RetroDB
        bir oyunu yeniden taradığında, diskten kaybolmuş medya dosyalarına yapılan
        referansları sessizce temizler. Daha önce, tüm bir medya klasörü birden
        kaybolduğunda &mdash; bağlantısı kesilen bir harici disk veya toplu bir
        silme işlemi &mdash; bu temizlik, binlerce oyunun hangi görsellere sahip
        olduğu kaydını silebiliyor ve maliyetli yeniden taramalara yol açabiliyordu.
        RetroDB artık bu belirtiyi tanıyor: bir medya klasörü eksik veya tamamen
        boşsa, referansları koruyor ve silmek yerine bir uyarı kaydediyor. Yeni
        bakım aracı da aynı korumayı uygular ve alıkoyduğu her klasörü açıkça
        işaretler.</li>
    </ul>
- version: 3.16.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Kontrol panelinde yeni "Hızlı Düzeltmeler" paneli
  body: |
    <ul>
      <li><strong>Kontrol Panelindeki yeni &ldquo;Hızlı Düzeltmeler&rdquo;
        paneli</strong> dağınık kütüphane işlerini tek bakışta görülen bir
        yapılacaklar listesine dönüştürür. Hâlâ kaç oyunun kutu resmi eksik
        olduğunu gösterir ve yinelenen ROM&rsquo;ları bulmak ile bozuk ROM
        yollarını (dosyaları taşınmış veya silinmiş oyunlar) denetlemek için tek
        tıkla kısayollar sunar. Her kısayol, sorunu düzeltecek sayfaya doğrudan
        bağlanır. Panel, kütüphanenizde oyun olduğunda görünür.</li>
    </ul>
- version: 3.15.0
  date: '2026-07-03'
  tags:
  - type: accessibility
    label: Ekran okuyucular artık iş ilerlemesini sesli olarak duyuruyor
  body: |
    <ul>
      <li><strong>Uzun süren işler artık ilerlemelerini ekran okuyuculara sesli
        olarak bildiriyor.</strong> Toplu bir tarama, bir başarı senkronizasyonu
        (RetroAchievements veya PlayStation) ya da bir görsel yeniden
        boyutlandırma çalışırken, ekran okuyucu kullanıcıları
        &ldquo;başladı&rdquo; ile &ldquo;bitti&rdquo; arasında hiçbir şey
        duymuyordu. RetroDB artık düzenli aralıklarla kilometre taşlarını
        (örneğin &ldquo;Toplu Tarama: 40&rsquo;ta 12&rdquo;) ve sözlü bir
        tamamlanma bildirimini duyuruyor &mdash; ekranda ekstra bir açılır pencere
        olmadan. Duyurular, gevezelik etmeden bilgi verecek şekilde zamanlanmıştır
        ve seçtiğiniz dili takip eder.</li>
    </ul>
- version: 3.14.0
  date: '2026-07-01'
  tags:
  - type: feature
    label: Yeni diller — Çince (Basitleştirilmiş ve Geleneksel) artık kullanılabilir
  body: |
    <ul>
      <li><strong>RetroDB artık Çince olarak da kullanılabilir.</strong>
        <strong>Ayarlar &rarr; Sistem &rarr; Dil</strong> altında iki seçenek
        bulunuyor: <strong>中文 (简体)</strong> (Basitleştirilmiş, anakara Çin
        için) ve <strong>中文 (繁體)</strong> (Geleneksel, Hong Kong ve Tayvan
        için). Tüm arayüz &mdash; menüler, düğmeler, mesajlar ve uygulama içi
        Yardım kılavuzu &mdash; çevrilmiştir ve henüz çevrilmemiş her şey sessizce
        İngilizce&rsquo;ye geri döner. Bu, desteklenen dil sayısını ona çıkarır
        (İngilizce, Almanca, İspanyolca, Fransızca, İtalyanca, Japonca, Brezilya
        Portekizcesi, Korece ve şimdi Basitleştirilmiş &amp; Geleneksel
        Çince).</li>
    </ul>
- version: 3.12.0
  date: '2026-06-30'
  tags:
  - type: feature
    label: Yeni dil — Korece (한국어) artık kullanılabilir
  body: |
    <ul>
      <li><strong>RetroDB artık Korece (한국어) olarak da kullanılabilir.</strong>
        Ayarlar &rarr; Sistem &rarr; Dil altından seçin. Tüm arayüz &mdash;
        menüler, düğmeler, mesajlar ve uygulama içi Yardım kılavuzu &mdash;
        çevrilmiştir; bu da desteklenen dil sayısını sekize çıkarır (İngilizce,
        Almanca, İspanyolca, Fransızca, İtalyanca, Japonca, Brezilya Portekizcesi
        ve Korece). Korece, RetroDB&rsquo;nin gösterdiği her oyun yaş
        sınıflandırma kurulunun kapsamını tamamlar; Güney Kore&rsquo;nin GRAC&rsquo;ı
        da dahil.</li>
    </ul>
- version: 3.11.0
  date: '2026-06-30'
  tags:
  - type: enhancement
    label: RetroDB'yi Patreon'da destekleyin — yeni bağış bağlantısı eklendi
  body: |
    <ul>
      <li><strong>Artık RetroDB&rsquo;yi Patreon üzerinden
        destekleyebilirsiniz.</strong> <strong>Ayarlar &rarr; Sistem &rarr;
        Geliştirmeyi Destekle</strong> içinde, Hakkında panelinde ve projenin
        README dosyasında mevcut &ldquo;GitHub&rsquo;da Sponsor Ol&rdquo;
        düğmesinin yanına bir Patreon bağlantısı eklendi. RetroDB tamamen
        ücretsiz ve açık kaynaklı kalmaya devam ediyor &mdash; bağışlar tamamen
        isteğe bağlıdır ve yalnızca tek başına sürdürülen geliştirmeyi devam
        ettirmeye yardımcı olur.</li>
    </ul>
- version: 3.10.0
  date: '2026-06-26'
  tags:
  - type: enhancement
    label: Sürüm notları artık "Daha Fazla Yükle" düğmesiyle daha hızlı yükleniyor
  body: |
    <ul>
      <li><strong>Sürüm Notları sayfası artık çok daha hızlı açılıyor.</strong>
        Her açılışta tüm sürüm geçmişini (yüzlerce girdi) çizmek yerine, RetroDB
        şimdi en son 20 girdiyi gösteriyor ve altına bir <strong>Daha Fazla
        Yükle</strong> düğmesi ekliyor. Bir sonraki grubu görmek için tıklayın,
        böyle devam eder &mdash; daha eski geçmiş hâlâ orada, sadece ilk görünümü
        yavaşlatmak yerine talep üzerine yükleniyor.</li>
    </ul>
- version: 3.9.0
  date: '2026-06-17'
  tags:
  - type: feature
    label: Yardım kılavuzu ve son sürüm notları artık 6 dilin tümüne çevrildi
  body: |
    <ul>
      <li><strong>Uygulama içi tam Yardım kılavuzu artık altı dilin tümünde
        kullanılabilir</strong> &mdash; Almanca, Fransızca, İspanyolca, İtalyanca,
        Japonca ve Brezilya Portekizcesi &mdash; sadece İngilizce değil. RetroDB,
        kılavuzu Ayarlar&rsquo;da seçtiğiniz hangi dildeyse o dilde gösterir ve
        henüz çevrilmemiş bir şey varsa sessizce İngilizce&rsquo;ye geri döner.</li>
      <li><strong>Bu Sürüm Notları da artık dilinizde görünüyor</strong> en son
        sürümler için, ve bundan sonraki yeni sürümler de buradan itibaren
        çevrilecek. Daha eski geçmiş İngilizce olarak kalıyor.</li>
      <li><strong>İstek Listesi sayfası ve İngilizce metnin son
        kalıntıları</strong> &mdash; dil paketleri ilk olarak 3.8.0&rsquo;da
        geldiğinde gözden kaçan bir grup açılır hata ve durum mesajı &mdash; artık
        uygulama genelinde düzgün şekilde çevriliyor.</li>
    </ul>
- version: 3.8.2
  date: '2026-06-17'
  tags:
  - type: security
    label: Güvenlik bağımlılık güncellemesi + CI düzeltmeleri
  body: |
    <ul>
      <li><strong>Güvenlik:</strong> yayımlanan bir güvenlik bildirimini
        (GHSA-537c-gmf6-5ccf) gidermek için birlikte paketlenen
        <code>cryptography</code> kütüphanesi güncellendi (47 → 49). Davranış
        değişikliği yok — sadece daha güvenli bir sürüm.</li>
      <li>Otomatik test hattı düzeltildi: eksik bir yalnızca-test yardımcı
        paketi (<code>beautifulsoup4</code>) v3.7.0&rsquo;dan beri test
        çalıştırmasını başarısız kılıyordu ve yeni paketleme derleme betiği
        bilinen bir yanlış pozitif olan bir statik analiz denetimini tetikliyordu
        (güvenilir derleme komutlarını çalıştırır, kullanıcı girdisini değil)
        &mdash; artık belgelenmiş ve kalibre edilmiş durumda. Yalnızca bakım;
        uygulamanın kendisinde hiçbir şey değişmiyor.</li>
    </ul>
- version: 3.8.1
  date: '2026-06-17'
  tags:
  - type: improvement
    label: Daha küçük indirme seçeneği, bağış düzenlemesi ve çeviri düzeltmesi (Pass
      46.3 / 47.6)
  body: |
    <ul>
      <li><strong>Çok daha küçük bir indirme seçeneği geliyor.</strong> RetroDB&rsquo;nin
        hazır çalışır "sadece aç ve çift tıkla" sürümü artık AMD ekran kartı
        olmayan kişiler için <strong>yalnızca CPU</strong> çeşidinde
        (~600&nbsp;MB) derlenebiliyor &mdash; tam sürümün yaklaşık altıda biri
        boyutunda. Her ikisi de yan yana sunulacak, böylece makinenize uygun
        olanı seçebilirsiniz.</li>
      <li><strong>Ayarlar&rsquo;daki "Geliştirmeyi Destekle" paneli artık
        uygulamanın geri kalanıyla birlikte çevriliyor</strong> &mdash; dil
        paketleri 3.8.0&rsquo;da geldiğinde yanlışlıkla İngilizce olarak
        kalmıştı.</li>
      <li>Bağış bağlantıları düzenlendi (README&rsquo;deki GitHub Sponsors
        rozeti; finansman dosyası, Patreon ve Buy&nbsp;Me&nbsp;A&nbsp;Coffee
        kurulduğunda kullanılmaya hazır). Asla can sıkıcı açılır pencere yok.</li>
      <li>Perde arkasında: yayın hattı artık Windows, macOS ve Linux için hazır
        çalışır sürümleri otomatik olarak derleyebiliyor. Not: uzun uygulama içi
        <em>Yardım</em> kılavuzu şimdilik hâlâ yalnızca İngilizce &mdash; bu,
        gelecekteki bir iş olarak kaydedildi.</li>
    </ul>
- version: 3.8.0
  date: '2026-06-12'
  tags:
  - type: feature
    label: Tam arayüz çevirisi + 6 dil (Pass 43.2/43.3/43.5)
  body: |
    <ul>
      <li><strong>RetroDB artık 6 dil daha konuşuyor.</strong> 3.7.0&rsquo;daki
        temel çalışmaların üzerine inşa edilerek, tüm arayüz çevrilebilir hale
        getirildi ve <strong>Almanca, Fransızca, İspanyolca, İtalyanca, Japonca
        ve Brezilya Portekizcesi</strong>ne makine çevirisiyle çevrildi. Dilinizi
        Ayarlar &rarr; Görüntüleme Tercihleri &rarr; Dil altından seçin; önce
        kaydedilmiş tercihinizi, sonra tarayıcınızı takip eder, ardından
        İngilizce&rsquo;ye geri döner &mdash; hiçbir zaman eksik bir dilde takılı
        kalamaz.</li>
      <li><strong>Ekrandaki her şey kapsanıyor</strong>: sayfa metni ve düğmeler,
        açılır mesajlar (küçük "toast" bildirimleri), düzenleme ve ayarlar
        iletişim kutuları, ipuçları ve ekran okuyucu etiketleri. Oyun türleri,
        bakış açıları ve oynanış modları (örn.
        &ldquo;First-Person-Shooter&rdquo;) artık dilinizde de gösteriliyor
        &mdash; altta yatan veriler ise kütüphanenizin ve filtrelerinizin eskisi
        gibi çalışmaya devam etmesi için İngilizce kalıyor.</li>
      <li>Yerleşik bir <strong>&ldquo;Pseudo&rdquo; dili</strong> (Dil menüsünde
        görünür), her etiketi parantez içine alıp aksanlarla süsleyen bir
        çevirmen kalite kontrol aracıdır ve gözden kaçan herhangi bir metni anında
        belli eder.</li>
      <li>Makine çevirileri bir başlangıç noktasıdır ve bazı yerlerde biraz
        resmi/katı okunabilir &mdash; zaman içinde kolayca iyileştirilebilirler ve
        çevirisi olmayan herhangi bir metin basitçe İngilizce olarak
        gösterilir.</li>
    </ul>
