- version: 4.0.0
  date: '2026-11-25'
  tags:
  - type: enhancement
    label: "Oluşturulan 3B PS3 kutularının içi artık gerçek kutuya, gerçek bir kutunun fotoğraflarına göre uyuyor. Açıldığında disk, üstün iki yanında birer parmak oyuğu olan yükseltilmiş bir halkanın içinde, üçgen bir düğmesi ve diski tutan üç yaylı kulakçığı olan yuvarlak bir göbeğe oturuyor. Her yarının açılan kenarında, parmak oyuğunun üstünde ve altında iki mandal var ve alçak bir duvar üstteki şeffaf şeridi ayırıyor. Kitapçık tarafında PS5 kutusundakiyle aynı iki klips var. Kutunun plastiği artık şeffaf ve kapağın iç yüzünün taraması yoksa, kapağın kendi resmi tepsinin arkasından soluk görünüyor"
    en: "Built 3D PS3 boxes now match the inside of the real case, read from photos of one. Opened, the disc sits in a raised ring with a finger dip either side of the top, on a round hub with a triangular button and three sprung flaps that hold the disc. Two catches sit on the opening edge of each half, above and below the finger slot, and a low wall closes off the clear strip at the top. The booklet side has the same two clips as the PS5 case. The case's plastic is now see-through, and where there is no scan of the inside of the cover, the cover's own picture shows faintly through the tray"
  - type: enhancement
    label: "Evdeki her kişinin artık her oyun için kendi tamamlanma durumu var. Bir oyunu Tamamlandı yapmak artık başkasının kitaplığını değiştirmiyor ve oturum açan herkes kendi durumunu ayarlayabiliyor, görüntüleyiciler dahil. Bir oyunu Oyna düğmesiyle 10 dakika veya daha uzun oynarsanız ve yerleşik oynatıcı oyunu kaydettiyse ya da bir RetroAchievement kazandıysanız, Başlanmadı durumunuz kendiliğinden Devam Ediyor olur. İkisi de olmadan uzun bir oturumdan sonra oyun sayfası size bir kez, tek tıklamayla sorar. Oyun sayfası ayrıca oyunu RetroDB'den ne kadar süredir oynadığınızı da gösterir. Bu güncellemeden önce ayarlanan durumlar artık ilk yönetici hesabına ait"
    en: "Each person in the house now has their own completion status for every game. Setting a game to Completed no longer changes anyone else's library, and everyone signed in can set their own, viewers included. When you play a game with the Play button for 10 minutes or more, and the built-in player saved the game or you earned a RetroAchievement, your Not Started moves to In Progress by itself. After a long session with neither, the game page asks you once, with one click. The game page also shows how long you have played the game from RetroDB. Statuses set before this update now belong to the first admin account"
  - type: fix
    label: "Tarama artık bir oyunu, kaynak aksanlarını nasıl yazarsa yazsın buluyor. Bir arama hiçbir şey bulamazsa aksanlar olmadan yeniden sorulur, böylece Ghost of Yōtei, Ghost of Yotei yazan bir kaynağı da bulur. Aksanları koruyan MobyGames'e de yeniden sorulur, böylece Ghost of Yotei orada Ghost of Yōtei'yi bulur"
    en: "Scraping now finds a game however a source spells its accents. When a search finds nothing, it is asked again without the accents, so Ghost of Yōtei also finds a source that writes Ghost of Yotei. MobyGames, which keeps the accents, is asked again too, so Ghost of Yotei finds Ghost of Yōtei there"
  - type: fix
    label: "Telefonda, oyunun adı tek ve uzun bir kelime olduğunda oyun veya başarım sayfası artık yana kaymıyor. Ad orada biraz daha küçük ve yine sığmazsa ikinci satıra geçiyor"
    en: "On a phone, a game or achievements page no longer scrolls sideways when the game's title is one long word. The title is a little smaller there, and breaks onto a second line if it still does not fit"
  - type: fix
    label: "Metin artık daha çok yerde daha kolay okunuyor. Bir etiketin adı artık etiketin renginde hangisi daha iyi okunuyorsa koyu ya da beyaz görünüyor; bir başarımın Hardcore etiketi kırmızısının üstünde koyu yazılı; ve Günlük Görüntüleyici'deki satır numaraları artık soluk değil. Ekran Görüntüsü Kopya Temizleyici'de silinecek bir ekran görüntüsü artık yalnızca soluk görünmek yerine kırmızı bir çerçeve ve Sil rozeti taşıyor. Ayarlar formlarındaki etiketler artık diğer tüm sayfalardakiyle aynı görünüyor"
    en: "Text is easier to read in more places. A tag's name now shows in dark or white, whichever reads better on the tag's colour; an achievement's Hardcore label has dark text on its red; and line numbers in the Log Viewer are no longer faded. In Screenshot Dedup, a screenshot that will be deleted now has a red border and a Delete badge, instead of only looking faded. Labels in Settings forms now look the same as on every other page"
  - type: enhancement
    label: "Oluşturulan PS5 3B kutuları artık cetvelle çekilmiş fotoğraflardan ölçülen gerçek kutunun içiyle aynı. Açıldığında disk, dört parmak çukuru olan yükseltilmiş bir halkanın içinde, on yarıklı ve beş yaylı dilli yuvarlak bir göbeğin üzerinde durur. Kitapçık tarafında açılan kenarın her köşesine yakın bir klips ve üstünde ve altında bir ray vardır; her yarının içini alçak bir duvar çevreler. Kutu da gerçeği gibi 14 mm kalınlığında. Daha önce yapılan kutuları güncellemek için 3B Kutuları Oluştur'u yeniden çalıştırın"
    en: "Built 3D PS5 boxes now match the inside of the real case, measured from photos with a ruler. Opened, the disc sits in a raised ring with four finger dips, on a round hub with ten slits and five sprung tongues. The booklet side has a clip near each corner of its opening edge and a rail along its top and bottom, and a low wall runs round the inside of each half. The case is also 14 mm thick, as the real one is. Run Build 3D Boxes again to update boxes built before"
  - type: fix
    label: "RetroDB durdurulduğunda, çalışan bir 3D Kutuları Oluştur işi artık diğer işlerle birlikte duruyor. Önce üzerinde çalıştığı kutuyu bitiriyor, bu yüzden hiçbir kutu yarım kalmıyor"
    en: "When RetroDB is stopped, a running Build 3D Boxes job now stops with the other jobs. It finishes the box it is on first, so no box is left half built"
  - type: fix
    label: "Telefonda Kütüphane'deki A-Z çubuğunda bir harfe dokunmak, RetroDB'nin önce o oyunları yüklemesi gerektiğinde bile, o harfin ilk oyununu artık ekranın en üstüne getiriyor. Önceden oyun ekranın altında, alt çubuğun arkasında kalıyordu"
    en: "On a phone, tapping a letter in the Library's A-Z bar now brings that letter's first game to the top of the screen, even when RetroDB has to load those games first. Before, the game was left at the bottom of the screen, behind the bottom bar"
  - type: fix
    label: "Her açılır listedeki küçük ok artık hep mavi-yeşil olmak yerine renk temanızın rengini alıyor"
    en: "The small arrow on each drop-down list now takes your colour theme's colour, instead of always being blue-green"
  - type: fix
    label: "Açık bir 3D kutudaki disk ya da kartuş artık beyaz bir karenin üzerinde durmuyor. RetroDB artık indirilen her disk ve kartuş resmini düz beyaz, gri ya da siyah arka planından kesip diske göre kırpıyor. Daha önce indirilen resimleri düzeltmek için 3D Kutuları Oluştur'u bir kez çalıştırın"
    en: "The disc or cartridge in an open 3D box no longer sits on a white square. RetroDB now cuts each downloaded disc and cartridge picture out of its plain white, grey or black background and trims it to the disc. Run Build 3D Boxes once to clean up pictures downloaded before"
  - type: enhancement
    label: "Oluşturulan GameCube 3D kutuları artık gerçek kutuya benziyor: 134'e 190'a 15 mm, açılan kenarda parmak oluğu ve kare kilit deliğiyle. Açıldığında kutu altıgen disk yuvasını, hafıza kartı yuvasını, kabartma Nintendo GameCube logosunu ve diskin nasıl tutulacağını gösteren iki resmi gösterir; iki diskli bir oyun ilk diskini ikincinin üstündeki menteşeli bir kapakta tutar. Daha önce oluşturulan kutuları güncellemek için 3D Kutuları Oluştur'u yeniden çalıştırın"
    en: "Built 3D GameCube boxes now match the real case: 134 by 190 by 15 mm, with the finger groove and the square latch hole on the opening edge. Opened, the case shows the six-sided disc tray, the memory card holder, the moulded Nintendo GameCube logo and the two disc-handling pictures, and a two-disc game holds its first disc on a hinged flap over the second. Run Build 3D Boxes again to update boxes built before"
  - type: enhancement
    label: "Oluşturulan 3D kutular artık gerçek kutu tiplerinin daha fazlasında geliyor. Bir oyunun Sürümü artık kutusunu seçiyor: Greatest Hits PS3 oyunu kırmızı kutuyu, PlayStation Hits PS4 oyunu kırmızıyı, Avrupa Platinum oyunu gümüş rengi olanı alıyor. Üç veya daha fazla diskli bir Avrupa PlayStation oyunu kalın çok diskli kutuyu, New Super Luigi U yeşil Wii U kutusunu alıyor ve Japon Game Gear kutuları asma dilini kaybediyor. Düzenle penceresinde, logosu ön yüze kabartılmış erken bir Xbox One kutusu gibi başka herhangi bir kutuyu elle seçmek için yeni bir 3D kutu tipi listesi var"
    en: "Built 3D boxes come in more of the real cases. A game's Edition now picks its case: a Greatest Hits PS3 game gets the red case, a PlayStation Hits PS4 game the red one, and a European Platinum game the silver one. A European PlayStation game on three or more discs gets the thick multi-disc case, New Super Luigi U its green Wii U case, and Japanese Game Gear boxes lose the hanging tab. The Edit window has a new 3D box case list for picking any other case by hand, such as an early Xbox One case with the logo moulded into the front"
  - type: fix
    label: "PlayStation Network eşitlemeleri artık Sony'ye en fazla 3 saniyede bir soruyor; bu, PSN kitaplığının kendisinin önerdiği hızdır ve PSN hesabının işaretlenme ihtimalini azaltır. Büyük kitaplıkların eşitlenmesi biraz daha uzun sürer"
    en: "PlayStation Network syncs now ask Sony at most once every 3 seconds, the pace the PSN library itself recommends, so your PSN account is less likely to be flagged. Large libraries take a little longer to sync"
  - type: fix
    label: "ROM Araçları'ndaki Resim Boyutlandırıcı artık resimlerin WebP'ye dönüştürülmesinin bitmesini bekliyor; böylece ikisi aynı kutu resimlerini aynı anda değiştirip geride başıboş bir kopya bırakmıyor. Steam ve Xbox başarım eşitlemeleri artık hizmetin hiçbir şeyi olmadığı bir oyundan sonra da, diğer her oyundan sonra olduğu gibi duraklıyor"
    en: "The Image Resizer in ROM Tools now waits for a conversion of pictures to WebP to finish, so the two no longer change the same box pictures at once and leave a stray copy behind. Steam and Xbox achievement syncs now pause after a game the service had nothing for, as they do after every other game"
  - type: fix
    label: "Hangi renk temasını seçerseniz seçin mavi-yeşil kalan düğmeler, sekmeler, paneller ve rozetler artık seçilen temanın rengini alıyor. Analitik sayfasındaki grafikler de öyle. İstek Listesi'nde her öncelik rozeti renkli arka planına ve kenarlığına yeniden kavuştu"
    en: "Buttons, tabs, panels and badges that stayed blue-green whatever colour theme you chose now take the chosen theme's colour. So do the charts on the Analytics page. On the Wishlist, each priority badge has its coloured background and border back"
  - type: fix
    label: "Telefonda Kütüphane, Sistemler ve günlük sayfalarındaki filtre çubukları artık ekranda kalıp onun üçte ikisine kadarını kapatmak yerine sayfayla birlikte kayıp gidiyor. ROM Araçları ve Ayarlar gibi sekme satırları, yana kaydırılan tek bir satır olarak üstte kalıyor ve geçerli sekme görünür oluyor"
    en: "On a phone, the filter bars on the Library, Systems and log pages now scroll away with the page, instead of staying on screen and covering up to two thirds of it. Tab rows, such as those in ROM Tools and Settings, stay at the top as one row you swipe sideways, with the current tab in view"
  - type: enhancement
    label: "Oluşturulan 3B kutular artık gerçek kutulara daha çok benziyor. Mega Drive (Genesis) ve Master System kutuları, cetvelle ölçülen gerçek bir kutuya uyması için biraz küçüldü ve Japon Mega Drive kutularında artık askı dili yok. Taranan kapağı uzun olan eski bir ABD PlayStation oyunu uzun kutuyu, Ekim 1985 ile Eylül 1987 arasında çıkan bir ABD NES oyunu da askı dilli kutuyu alıyor. Daha önce yapılan kutuları güncellemek için 3B Kutuları Oluştur'u yeniden çalıştırın"
    en: "Built 3D boxes look more like the real cases. Mega Drive (Genesis) and Master System cases are a little smaller, to match a real case measured with a ruler, and Japanese Mega Drive cases no longer have a hanging tab. An early US PlayStation game whose scanned cover is tall gets the tall long box, and a US NES game released from October 1985 to September 1987 gets the box with a hanging tab. Run Build 3D Boxes again to update boxes built before"
  - type: enhancement
    label: "Oluşturulan 3B kutu artık oyun sayfasındaki oyunun 3B kutu resmiyle eşleşiyor. Sırt taraması yoksa basılı sırtını o resimden alıyor, taranan kapak başka bir ülkenin baskısıysa ön yüzünü de. MobyGames taramaları artık, MobyGames'te varsa, o resmin gösterdiği baskıdan geliyor ve Avrupa'daki bir Saturn oyunu CD kutusu yerine uzun Saturn kutusunu alıyor. Daha önce yapılan kutuları güncellemek için 3B Kutuları Oluştur'u yeniden çalıştırın"
    en: "A built 3D box now matches the game's 3D box picture on the game page. With no spine scan it takes its printed spine from that picture, and its front too when the scanned cover is another country's release. MobyGames' scans now come from the release that picture shows, where MobyGames has it, and a European Saturn game gets the tall Saturn case instead of a CD case. Run Build 3D Boxes again to update boxes built before"
  - type: security
    label: "Bir resim ya da video bağlantısı RetroDB'yi başka bir adrese yönlendirdiğinde, RetroDB artık yalnızca az önce denetlediği adrese gidiyor; böylece bir web sitesi onu ev ağınızdaki bir cihaza yönlendiremez"
    en: "When a picture or video link sends RetroDB on to another address, RetroDB now goes only to the address it has just checked, so a web site cannot steer it to a device on your home network"
  - type: security
    label: "ROM Araçları'ndaki Çoklu Disk Düzenleyici artık başka bir klasörü gösteren konsol ya da oyun adını reddediyor; diskleri yalnızca o konsolun kendi klasöründe taşıyor"
    en: "The Multi-Disc Organizer in ROM Tools now refuses a console or game name that points to another folder, so it only ever moves discs inside that console's own folder"
  - type: fix
    label: "Bilgisayarınız hareketi azaltacak şekilde ayarlıysa, RetroDB sayfayı sizin için kaydırırken (Başa dön veya bir bölüme atlama gibi) artık kaymıyor; doğrudan oraya gidiyor"
    en: "If your computer is set to reduce motion, RetroDB no longer glides when it scrolls the page for you, such as Back to top or jumping to a section: it moves there at once"
  - type: fix
    label: "Sistemler sayfasındaki iki filtre kutusu artık sabit bir koyu mavi yerine temanızın rengini alıyor"
    en: "On the Systems page, the two filter boxes now take their colour from your theme instead of a fixed dark blue"
  - type: fix
    label: "Telefonda Sistemler sayfası artık her konsol kartının altında büyük bir boşluk bırakmıyor, pencere daraltıldıktan sonra da. Ayarlar'daki tek kelimelik uzun bir başlık artık ekrandan taşmak yerine bir sonraki satıra geçiyor"
    en: "On a phone, the Systems page no longer leaves a large empty space under each console card, even after the window is made narrower. A long one-word heading in Settings now breaks onto the next line instead of running off the screen"
  - type: fix
    label: "MobyGames artık noktalı bir adla listelediği oyunu da buluyor, örneğin MUSHA için M.U.S.H.A.: tam ad bir şey bulamazsa harf harf yeniden arar"
    en: "MobyGames now finds a game it lists under a name written with dots, such as M.U.S.H.A. for MUSHA: when the whole name finds nothing, it asks again letter by letter"
  - type: fix
    label: "Soluk gri metin her temada daha kolay okunuyor: ipuçları, yer tutucular ve küçük etiketler daha parlak. Okunması zor rozetler de daha net: oyun kartlarındaki PEGI rozeti, konsol rozetleri, Yeniden Adlandır düğmesi, RetroAchievements sayısı ve Cathedral temasının kırmızısı"
    en: "Faint grey text is easier to read in every theme: hints, placeholders and small labels are brighter. Badges that were hard to read are clearer too: the PEGI badge on game cards, the console badges, the Rename button, the RetroAchievements count and the Cathedral theme's red"
  - type: fix
    label: "MobyGames artık, planlandığı gibi, kaynak sırası MobyGames eklenmeden önce kaydedilmiş olsa bile yapay zekâdan önce sorgulanıyor; böylece yapay zekâ artık MobyGames'in bildiklerini doldurmuyor. MobyGames, RetroDB'nin isteklerini de daha seyrek reddediyor: RetroDB artık istekler arasında biraz daha uzun bekliyor ve API anahtarlarınızı kaydetmek bir isteğin sırayı atlamasına artık yol açmıyor"
    en: "MobyGames is now asked before the AI, as planned, even where the order of sources was saved before MobyGames was added, so the AI no longer fills in what MobyGames knows. MobyGames also refuses RetroDB's requests less often: RetroDB now waits a little longer between them, and saving your API keys no longer lets a request jump the queue"
  - type: fix
    label: "Yapay Zeka Doldur artık yapay zekâya MobyGames'in sağladığı hiçbir şeyi göstermiyor ve bu bilgileri MobyGames'in verdiği gibi bırakıyor, çünkü MobyGames'in şartları verilerinin bir yapay zekâya aktarılmasını yasaklıyor. “Data by MobyGames.com” notu artık MobyGames'in istediği gibi her dilde aynı görünüyor"
    en: "AI Fill no longer shows the AI anything MobyGames supplied, and leaves those details as MobyGames gave them, because MobyGames' terms forbid passing its data to an AI. The \"Data by MobyGames.com\" credit now reads the same in every language, as MobyGames asks"
  - type: fix
    label: "Telefonda Ayarlar > Kazıma içindeki kaynak listesi yeniden okunabiliyor: her ad ve açıklama tam genişliği kullanıyor, durumu ve açma/kapama düğmesi alt satırda duruyor. Önceden metin satır başına tek kelimeye sıkışıyor ve düğme kesiliyordu"
    en: "On a phone, the list of sources in Settings > Scraping is readable again: each name and description uses the full width, with its status and on/off switch on the line below. Before, the text was squeezed to one word a line and the switch was cut off"
  - type: fix
    label: "RetroDB'nin daha fazla yeri artık yalnızca klavyeyle çalışıyor. Raporlardaki sütunlar Enter ile sıralanıyor ve ekran görüntüsü Sil düğmesi Tab ona ulaşınca görünüyor. Bir etiketi veya kütüphane filtresini kaldırmak, Değişiklik günlüğü sayfasında Load More'a basmak ya da bir tarama sırasında istek listesini yenilemek artık sizi sayfanın başına göndermek yerine olduğunuz yerde tutuyor"
    en: "More of RetroDB now works with the keyboard alone. Report columns sort with Enter, and the screenshot Delete button appears when Tab reaches it. Removing a tag or a library filter, pressing Load More on the Changelog, or a wishlist refresh during a scrape now keeps your place instead of sending you back to the top of the page"
  - type: fix
    label: "Ekran okuyucuyla artık daha fazla düğme ve kutu ne olduğunu söylüyor. Onay kutuları oyunlarının veya dosyalarının adını söylüyor, arama ve filtre kutularının da adı var. Yalnızca simge gösteren düğmeler (×, ✎, 🗑️) ne yaptığını söylüyor, Analytics grafiklerinin de adı var. Günlükler, Raporlar ve PSN Trophies sayfalarındaki filtre düğmeleri açık olup olmadığını söylüyor, giriş ve kurulum hataları da sesli okunuyor"
    en: "With a screen reader, more buttons and boxes now say what they are. Tick boxes name their game or file, and search and filter boxes have names. Buttons showing only a symbol (×, ✎, 🗑️) say what they do, and Analytics charts are named. The filter buttons on Logs, Reports and PSN Trophies say whether they are on, and sign-in and setup errors are read out"
  - type: feature
    label: "Açık 3B kutu artık daha fazla oyunda gerçek diski veya kartuşu gösteriyor: MobyGames'te resmi yoksa RetroDB, ScreenScraper'ınkini ya da ES-DE'nin zaten indirdiğini kullanır. Eklemek için oyunu yeniden tarayın"
    en: "The open 3D box now shows the real disc or cartridge for more games: when MobyGames has no picture of it, RetroDB uses ScreenScraper's, or the one ES-DE has already downloaded. Scrape a game again to add it"
  - type: enhancement
    label: "Değişiklik günlüğü sayfası artık daha kolay okunuyor: her sürüm, her değişiklik türü için küçük bir rozet gösteriyor ve değişikliklerin kendisi Yeni özellikler, İyileştirmeler, Düzeltmeler ve Güvenlik altında gruplanmış normal metin olarak yer alıyor. Sayfa ayrıca daha geniş"
    en: "The Changelog page is easier to read: each version shows one small badge for each kind of change, and the changes themselves are ordinary text grouped under New features, Improvements, Fixes and Security. The page is also wider"
  - type: feature
    label: "Mega Drive, Genesis veya Master System oyununun 3B kutusunda artık gerçek kutudaki gibi üstte yuvalı mağaza askı tırnağı, yükseltilmiş bir kenar ve kutunun açıldığı yerde daha derin bir basamak var. Game Gear kutuları da tırnağı alır. Daha önce yapılan kutuların kenarını güncellemek için 3B Kutuları Oluştur'u yeniden çalıştırın"
    en: "The 3D box of a Mega Drive, Genesis or Master System game now has the shop's hanging tab at the top, with its slot, and a raised lip and a deeper step where the case opens, as on the real case. Game Gear boxes get the tab too. Run Build 3D Boxes again to update the lip on boxes built before"
  - type: fix
    label: "Ayarlar > Sistem'deki Dosya Boyutlarını Hesapla artık ne bulduğunu düğmenin altında kalan bir kutuda söylüyor ve dosyası olmayan içe aktarılmış oyunları artık diskte aramıyor"
    en: "Calculate File Sizes in Settings > System now says what it found, in a box that stays under the button, and no longer looks on disk for imported games, which have no file"
  - type: fix
    label: "MobyGames artık adı biraz farklı yazılmış bir oyunu buluyor; örneğin 'Castlevania: Bloodlines' için 'Castlevania Bloodlines' yazmak yeterli, ve adın tamamı hiçbir şey bulamazsa adın ana kelimesini deniyor. Kontrol Paneli'ni veya Ayarlar'ı açtıktan hemen sonra yapılan arama artık boş dönmüyor, ve oradaki MobyGames durumu MobyGames yavaş olduğunda artık Bağlantı hatası demiyor"
    en: "MobyGames now finds a game whose name is written a little differently, such as 'Castlevania Bloodlines' for 'Castlevania: Bloodlines', and tries the name's main word when the whole name finds nothing. A search just after opening the Dashboard or Settings no longer comes back empty, and the MobyGames status there no longer says Connection error when MobyGames is slow"
  - type: feature
    label: "Her kullanıcı artık Başarımlar sayfasındaki Clear My Progress ('İlerlememi Temizle') ile bir konsol için kendi RetroAchievements ilerlemesini temizleyebilir. Diğer kullanıcılar kendi ilerlemelerini korur; herkesin verisini temizlemek yine yöneticide kalır"
    en: "Every user can now clear their own RetroAchievements progress for one console, with Clear My Progress on its Achievements page. Other users keep theirs; clearing everyone's data stays with the admin"
  - type: fix
    label: "Bir oyun sayfasındaki Benzer Oyunlar satırı, sunucu hızlı yanıt verdiğinde artık görünmemezlik etmiyor"
    en: "The Similar Games row on a game page no longer fails to show when the server answers quickly"
  - type: fix
    label: "Meta Veri Ara penceresi artık açtığın her kaynağa sığacak şekilde genişliyor ve daha küçük bir ekranda kaynakları sıkıştırmak yerine eşit satırlara bölüyor"
    en: "The Search Metadata window now widens to fit every source you have switched on, and on a smaller screen splits the sources into even rows instead of squeezing them"
  - type: feature
    label: "MobyGames, kendi MobyGames API anahtarınızı kaydettiğinizde yapay zekadan hemen önce, en son sorulan yeni bir kazıma kaynağıdır. Boş ayrıntıları, kutunun ön ve arka yüzünü ve ekran görüntülerini doldurur; 3D kutu için gerçek kutunun, sırtın, diskin ve kılavuzun her taramasını saklar. MobyGames saatte birkaç yüz isteğe izin verir; saatlik hak bittiğinde atlanan bir oyun, sıfırlamadan sonra kendiliğinden yeniden sorulur. MobyGames bilgileri olan bir oyun sayfası, MobyGames.com üzerindeki o oyuna bağlantı verir"
    en: "MobyGames is a new scrape source, asked last before the AI once you save your own MobyGames API key. It fills empty details, the box front and back and screenshots, and keeps every scan of the real box, spine, disc and manual for the 3D box. MobyGames allows a few hundred requests an hour; a game skipped when the hour runs out is asked about again by itself after the reset"
  - type: feature
    label: "Kapağı olan taranmış oyunlar artık kendiliğinden, konsollarına ve bölgelerine uygun gerçek kutuda dönebilen bir 3B kutu alıyor; kutu taramalarından yapılır, sırt taranmadıysa sırtı basılır. ROM Araçları'ndaki 3B Kutuları Oluştur, daha önce taranmış oyunlar için bunu yapar. Slipcase'den içe aktarılan bir kutu asla değiştirilmez"
    en: "Scraped games with a cover now get a turning 3D box by themselves, on the real case for their console and region, made from the box scans, with a printed spine when none was scanned. Build 3D Boxes in ROM Tools does this for games scraped before. A box imported from Slipcase is never changed"
  - type: feature
    label: "3B kutu artık açılıyor. Kapağı menteşesi üzerinde açılır ve gerçek kutudaki gibi içindekileri gösterir: göbeğindeki disk ya da kartuş, tutucularının altındaki kılavuz ve kapağın içi, oyunun kutu taramalarından. Her tarama ayrıca tek başına da görüntülenebilir. DVD kutuları, istiridye kutular ve el konsolu kutuları artık yuvarlak kenarlarını ve açıldıkları yerdeki eki de gösteriyor; daha önce oluşturulan kutuları güncellemek için 3B Kutuları Oluştur'u yeniden çalıştırın"
    en: "The 3D box now opens. Its lid swings open on the hinge and shows what is inside, as in the real case: the disc on its hub or the cartridge, the manual under its clips and the inside cover, from the game's box scans. Each scan can also be viewed on its own. Keep cases, clamshells and handheld cases also show their rounded edges and the seam where they open; run Build 3D Boxes again to update boxes built before"
  - type: fix
    label: "Oyun sayfasındaki Temizle artık Slipcase'ten içe aktarılan bir kutunun resimlerini silmiyor"
    en: "Clear on the game page no longer deletes the pictures of a box imported from Slipcase"
  - type: fix
    label: "Ayarlar > Emülatörler artık 3DS emülatörü Azahar'ı buluyor: Windows programını, Linux AppImage'ını ve Flatpak'ını"
    en: "Settings > Emulators now finds Azahar, the 3DS emulator: its Windows program, its Linux AppImage and its Flatpak"
  - type: fix
    label: "Başlar başlamaz kapanan bir oyunun ardından artık her zaman toparlanıyor; örneğin RetroDB'nin o başlatmaya verdiği RetroAchievements oturum açma bilgisi geri alınıyor"
    en: "A game that closes the moment it starts is now always tidied up after, such as taking back the RetroAchievements sign-in RetroDB gave that launch"
  - type: fix
    label: "Bir sistem için seçtiğiniz varsayılan emülatör, RetroDB açılışta kendi emülatör önerilerini eklediğinde artık o sistemin tek varsayılanı olarak kalıyor"
    en: "A default emulator you picked for a system now stays its only default when RetroDB adds its own emulator suggestions at start-up"
  - type: fix
    label: "Oynatıcının gölgelendiricilerini güncelleme başarısız olursa, mevcut gölgelendiricileriniz korunur. Kurulu çekirdek listesi artık kaydetmenin ortasında kaybolamaz ve indirilemeyen bir çekirdek listesi bir saat yerine beş dakika sonra yeniden denenir"
    en: "If updating the player's shaders fails, the shaders you had are kept. The list of installed cores can no longer be lost part-way through saving, and a core list that fails to download is tried again after five minutes instead of an hour"
  - type: fix
    label: "Debian, Ubuntu ve Fedora gibi kendi Python'unu koruyan Linux sistemlerinde kurulum programı artık RetroDB için ayrı bir Python klasörü oluşturuyor. Önceden bileşenleri sistem Python'una zorla kuruyordu ve bu, sistem araçlarını bozabiliyordu"
    en: "On Linux systems that protect their own Python, such as Debian, Ubuntu and Fedora, the installer now gives RetroDB its own Python folder instead of forcing its parts into the system's Python, which could break system tools"
  - type: security
    label: "Kurulum programının oluşturduğu, parola ve anahtar içeren ayar dosyalarını artık yalnızca kendi hesabınız okuyabilir; aynı bilgisayarı kullanan başka kişiler okuyamaz"
    en: "The settings files the installer creates, which hold passwords and keys, can now be read only by your own account, not by other people who use the same computer"
  - type: fix
    label: "Kurulumdan sonra kurulum programı artık RetroDB'yi, RetroDB hazır olduğunda gerçekten kullandığı bağlantı noktasında açıyor. Önceden sabit bir beklemeden sonra hep 5000 numaralı bağlantı noktasını açıyordu ve bu bir hata sayfası gösterebiliyordu"
    en: "After installing, the installer now opens RetroDB on the port it really uses, once RetroDB is ready. Before, it always opened port 5000 after a fixed wait, which could show an error page"
  - type: enhancement
    label: "Windows ve macOS'ta RetroDB artık Ayarlar > Emülatörler bölümünde emülatörlerinizi ve RetroArch'ı sizin için bulabiliyor; siz kendi klasörlerinizi belirtmedikçe o sistemin olağan klasörlerine bakıyor"
    en: "On Windows and macOS, RetroDB can now find your emulators and RetroArch for you in Settings > Emulators, looking in the usual folders for that system unless you list your own"
  - type: fix
    label: "Windows ve macOS'ta RetroDB artık DuckStation ve PCSX2'nin ayar klasörlerini buluyor; böylece oyuna özel ayarlar ve BIOS denetimi orada çalışıyor. Linux'ta XDG_CONFIG_HOME ayarlı olduğunda da DuckStation klasörü bulunuyor"
    en: "On Windows and macOS, RetroDB now finds DuckStation's and PCSX2's settings folders, so per-game settings and the BIOS check work there. On Linux, DuckStation's folder is also found when XDG_CONFIG_HOME is set"
  - type: fix
    label: "Bir diski CHD'ye dönüştürmek, .cue veya .gdi sayfası oyunun kendi klasörünün dışını gösterdiğinde artık oradaki bir dosyayı silemez"
    en: "Converting a disc to CHD can no longer delete a file outside the game's own folder when its .cue or .gdi sheet points there"
  - type: fix
    label: "Bir disk yeniden adlandırıldığında veya dönüştürüldüğünde çok diskli çalma listesi (.m3u) güvenle güncellenir: okunamayan bir çalma listesi boşaltılmak yerine olduğu gibi bırakılır ve eski sistemlerden gelen aksanlı harfler içeren disk adları harflerini korur"
    en: "When a disc is renamed or converted, its multi-disc playlist (.m3u) is updated safely: a playlist that cannot be read is left alone instead of being emptied, and disc names with accented letters from older systems keep their letters"
  - type: fix
    label: "Bir sistem için seçilen yeni varsayılan emülatör kaydedilemezse, sistem varsayılan emülatörsüz kalmak yerine eski varsayılanı korur"
    en: "Choosing a new default emulator for a system that then fails to save keeps the old default, instead of leaving the system with no default emulator"
  - type: fix
    label: "Bir yapay zekâ büyütmesi sırasında ekran kartı yanıt vermeyi keserse, RetroDB artık onu yaklaşık iki dakika içinde bırakıyor ve büyütmeye işlemciyle devam ediyor. Önceden kart, RetroDB yeniden başlatılana kadar meşgul kalıyordu"
    en: "If the graphics card stops responding during an AI upscale, RetroDB now lets go of it within about two minutes and carries on upscaling with the processor. Before, the card stayed busy until RetroDB was restarted"
  - type: fix
    label: "Yavaş bir internet bağlantısında, yapay zekâ büyütme ve arka plan kaldırma modellerinin ilk indirmesi artık durmuş gibi kesilmiyor. Büyütme indirmesi başarısız olursa RetroDB, yapay zekâ büyütmesini yeniden başlatmaya kadar kapalı bırakmak yerine 15 dakika sonra yeniden deniyor"
    en: "On a slow internet connection, the first download of the AI upscaling and background-removal models is no longer cut off as if it had stopped. If the upscaling download fails, RetroDB tries again 15 minutes later instead of leaving AI upscaling off until a restart"
  - type: fix
    label: "Hasarlı bir Müze fotoğrafı artık arka plan kaldırmanın sonraki tüm fotoğraflar için ekran kartını kullanmayı bırakmasına yol açmıyor"
    en: "A damaged Museum photo no longer makes background removal stop using the graphics card for every photo after it"
  - type: security
    label: "RetroDB artık bir güncellemeyi kurmadan önce, RetroDB'nin kendi sürüm sürecinden gelen gerçek bir imza taşıdığını denetliyor. Birinin değiştirdiği ya da başkasıyla değiştirdiği bir indirme, sağlama toplamı dosyası da değiştirilmiş olsa bile reddedilir"
    en: "Before an update installs, RetroDB now checks that it carries a genuine signature from RetroDB's own release process. A download someone has changed or swapped is refused, even if its checksum file was swapped too"
  - type: fix
    label: "Bir güncelleme başarısız olur ve RetroDB sahip olduğunuz sürüme dönerse, kapanırken kaydettiğiniz hiçbir şey kaybolmaz. Geri yüklenen kütüphane kopyası artık RetroDB tamamen durduktan sonra alınır ve yalnızca yeni sürüm başladıysa geri yüklenir. Güncellemenin kurduğu program kütüphaneleri de eski sürümlerine döndürülür"
    en: "If an update fails and RetroDB goes back to the version you had, nothing you saved while it was closing down is lost. The copy of your library it restores is now taken after RetroDB has fully stopped, and is only restored if the new version started. Program libraries the update installed are put back to the old versions too"
  - type: fix
    label: "Açılır pencereler artık telefonda üst ve alt çubukları, bilgisayarda da kenar çubuğunu kapatıyor. Önceden çubuklar, Kütüphane'nin filtre listeleri, kupa taramaları ve Raporlar ile Ayarlar pencereleri gibi pencerelerin üstünde parlak kalıyor ve hâlâ basılabiliyordu"
    en: "Pop-up windows now cover the phone's top and bottom bars, and the sidebar on a computer. Before, the bars stayed bright on top of windows such as the Library's filter lists, the trophy scans and the Reports and Settings windows, and could still be pressed"
  - type: fix
    label: "Kütüphanede ve bir sistemin sayfasında, liste iki veya daha fazla sütun gösterdiğinde oyun kartları artık alttaki kartın üstüne taşmıyor. Yerleştirildikten sonra uzayan bir kart, örneğin derecelendirme simgeleri ikinci satıra geçtiğinde, önceden bir sonraki kartın üst kısmını kapatıyordu"
    en: "Game cards in the Library and on a system's page no longer run over the card below them when the list shows two or more columns. A card that grew after it was placed, such as one whose rating icons wrapped onto a second row, used to cover the top of the next card"
  - type: fix
    label: Bir pencere açıkken gösterilen "Bu oyun zaten istek listenizde" gibi bir mesaj artık pencerenin üstünde görünüyor. Önceden koyu arka planın arkasında kalıyordu, bu yüzden İstek Listesine Ekle gibi bir düğmeye basmak hiçbir şey yapmıyormuş gibi görünüyordu
    en: A message shown while a window is open, such as "This game is already on your wishlist", now shows on top of the window. Before, it hid behind the dark backdrop, so pressing a button like Add to Wishlist seemed to do nothing
  - type: fix
    label: Kenar çubuğundaki ROM Araçları bağlantısı artık tüm ROM Araçları sayfalarında yanıyor. Bölge Sürümleri, Toplu Yapay Zeka Doldur, MAME Adları, Kutu Düzeltme ve Kılavuz Bölgeleri ile HLTB Bekleyen İnceleme sayfalarında bağlantı sönük kalıyordu
    en: The ROM Tools link in the sidebar now lights up on every ROM Tools page. Regional Versions, Bulk AI Fill, MAME Names, Fix Box and Manual Regions and HLTB Pending Review left it dark
  - type: fix
    label: Kutu ve Kılavuz Bölgelerini Düzelt ile HLTB Bekleyen İncelemeler artık diğer araçlar gibi üstte ROM Araçları sekmeleri sırasını gösteriyor; böylece bir araçtan diğerine geçebilirsiniz. Kutu ve Kılavuz Bölgelerini Düzelt'in her araç sayfasında kendi sekmesi var
    en: Fix Box and Manual Regions and HLTB Pending Review now show the row of ROM Tools tabs at the top, like the other tools, so you can go from one tool to the next. Fix Box and Manual Regions has a tab of its own on every tool page
  - type: fix
    label: Dilinizden bağımsız olarak İngilizce görünen düğmeler ve mesajlar artık RetroDB'nin sunduğu tüm dillerde kendi dilinizde görünüyor. Bazılarının çevirisi yoktu, bazılarının çevirisi ise yanlıştı; örneğin Almanca'da Yedekleme Oluştur "yedeği geri yükle" olarak görünüyordu
    en: Buttons and messages that showed in English whatever your language now show in it, in every language RetroDB offers. Some had no translation, and some showed a wrong one, such as Create Backup reading as "restore backup" in German
  - type: enhancement
    label: Yöneticiler ve editörler, Ayarlar > Hesap > Okuyabildiğim diller bölümünde okudukları dilleri işaretleyebilir. Bir oyunun kendi bölgesine ait kutu resmi veya adı yoksa, RetroDB kazıma yapan birinin okuyabileceği bir dilde olanı seçer. Hiçbir şey işaretlemeyen kişi, ekran dilini okuyor sayılır
    en: Admins and editors can tick the languages they read, under Settings > Account > Languages I can read. When a game has no box picture or name from its own region, RetroDB picks one in a language someone who scrapes can read. Anyone who ticks none counts as reading their screen language
  - type: fix
    label: Avrupa kopyası, ScreenScraper'da genel bir Avrupa kaydı yok diye artık Almanca, Fransızca, İspanyolca veya İtalyanca kutu resmi ya da ad almaz. Kazıma yapan biri o dili okumuyorsa, İngiltere kaydını ya da Dünya veya ABD gibi bölge listenizdeki bir kaydı alır. Kutu ve Kılavuz Bölgelerini Düzelt, kimsenin okumadığı bir dile çevirdiği kutulara ve kılavuzlara yeniden bakar
    en: A Europe copy no longer gets a German, French, Spanish or Italian box picture or name just because ScreenScraper has no general Europe one. It gets the UK one, or one from your region list such as World or USA, unless someone who scrapes reads that language. Fix Box and Manual Regions looks again at the boxes and manuals it swapped into a language nobody reads
  - type: enhancement
    label: Kutu ve Kılavuz Bölgelerini Düzelt'in kendi sayfası vardır ve ROM Araçları kartından açılır. Neler değişti listesi, düzeltmenin kutusunu, 3B kutusunu veya kılavuzunu değiştirdiği her oyunu konsola göre gruplayarak gösterir. Kutunun şimdiki halini ve her yeni dosyanın geldiği bölgeyi görüp kontrol edebilirsiniz. Bu güncellemeden önce düzeltilen oyunlar da listelenir
    en: Fix Box and Manual Regions has its own page, opened from its ROM Tools card. Its What changed list shows every game the fix swapped a box, 3D box or manual for, grouped by console, with the box as it is now and the region each new file came from, so you can check them. Games already fixed before this update are listed too
  - type: enhancement
    label: Kutu ve Kılavuz Bölgelerini Düzelt, sayfasındaki düğmelerle duraklatılabilir, sürdürülebilir ve durdurulabilir. Önceden durdurmanın tek yolu kartına yeniden basmaktı ve ekranda bunu söyleyen bir şey yoktu
    en: Fix Box and Manual Regions can be paused, resumed and stopped with buttons on its page. Before, the only way to stop it was to press its card again, which nothing on screen said
  - type: enhancement
    label: Kutu ve Kılavuz Bölgelerini Düzelt çalışırken düğmelerinin yanında bir ilerleme çubuğu gösterir. Neler değişti listesi hangi konsolları kapattığınızı hatırlar; sayfayı bu tarayıcıda bir sonraki açışınızda kapalı kalırlar
    en: Fix Box and Manual Regions shows a progress bar beside its buttons while it runs. Its What changed list remembers which consoles you closed, so they stay closed the next time you open the page in this browser
  - type: enhancement
    label: Kutu ve Kılavuz Bölgelerini Düzelt çalışırken değiştirdiği her oyun, konsolunun altında hemen Neler değişti listesine eklenir. Önceden görmek için sayfayı yenilemeniz gerekiyordu
    en: While Fix Box and Manual Regions runs, each game it swaps joins its What changed list straight away, under its console. Before, you had to reload the page to see them
  - type: fix
    label: Henüz başlamamış bir ilerleme çubuğu artık sol ucunda tek başına bir "%" göstermez
    en: A progress bar that has not started yet no longer shows a lone "%" at its left end
  - type: fix
    label: Sistemler sayfasındaki Wii U, PlayStation Vita, Xbox ve Xbox One logoları artık diğerleri gibi alanlarını dolduruyor. PlayStation Vita logosu ve Xbox One'daki ONE artık beyaz, böylece her temada okunabiliyor
    en: The Wii U, PlayStation Vita, Xbox and Xbox One logos on the Systems page fill their space like the others. The PlayStation Vita logo and the ONE in Xbox One are now white, so they can be read on every theme
  - type: enhancement
    label: Xbox içe aktarmasının eklediği Xbox Series X|S'in artık kendi logosu var ve ℹ️ düğmesinin açtığı pencerede konsolların resmi görünür. Ayrıca tam adı Microsoft Xbox Series X|S ve teknik özellikleri de eklendi
    en: Xbox Series X|S, which the Xbox import adds, has its own logo, and the window its ℹ️ button opens shows a picture of the consoles. It also has its full name, Microsoft Xbox Series X|S, and its specifications
  - type: fix
    label: Steam, Xbox, PSN veya CLZ içe aktarmasının eklediği bir sistem artık RetroDB biliyorsa logosunu, türünü ve tam adını alır. Önceden bu yolla eklenen sistemler RetroDB güncellenince bunları alır
    en: A system the Steam, Xbox, PSN or CLZ import adds now gets its logo, its type and its full name where RetroDB knows one. Systems added that way before get them when RetroDB updates
  - type: enhancement
    label: Kutu ve Kılavuz Bölgelerini Düzelt, her oyunu ScreenScraper'a yalnızca bir kez sorar. Önceden her çalıştırma ilk oyundan başlıyor ve daha önce kontrol ettiği oyunlar dahil hepsini soruyordu. İlk çalıştırmasından sonra kazınan oyunların kutuları zaten doğrudur, bu yüzden bunları sormadan atlar
    en: Fix Box and Manual Regions asks ScreenScraper about each game only once. Before, every run started again at the first game and asked about every one, even games it had already checked. Games scraped after its first run already have the right boxes, so it skips them without asking
  - type: fix
    label: Tarayan veya dönüştüren ROM aracı sayfaları (Ekran Görüntüsü Tekilleştirme, Ekran Görüntüsü İnceleme, Kopya Bulucu, CHD Dönüştürücü ve CHD Doğrulama) sayfadan çıkıp geri döndüğünüzde son çalıştırmayı korur. Çalışan bir tarama ilerlemesini göstermeye devam eder, biten tarama ise bittikten sonra 30 dakika boyunca sonuçlarını yeniden gösterir. Önceden sayfa boş geliyordu
    en: The ROM tool pages that scan or convert (Screenshot Dedup, Screenshot Review, Duplicate Finder, CHD Converter and CHD Verify) keep their last run when you leave the page and come back. A running scan carries on showing its progress, and a finished one shows its results again, for 30 minutes after it ends. Before, the page came back empty
  - type: fix
    label: Çevrilmiş yardım sayfaları her düğmeyi, sekmeyi ve sayfayı uygulamanın o dilde gösterdiği adla anar ve mesajlarını uygulamadaki gibi alıntılar. Toplu Yapay Zeka Doldur bölümü artık uygulamada olmayan bir karttan söz etmiyor. Arka Plan düğmesi İtalyanca, Korece ve Çincede artık doğru görünüyor ve bazı Zuluca etiketler artık başında yanlışlıkla "N:" ile başlamıyor
    en: Translated help pages call every button, tab and page by the name the app shows in that language, and quote its messages as the app shows them. The Bulk AI Fill section no longer names a card the app does not have. The Background button now reads correctly in Italian, Korean and Chinese, and some Zulu labels no longer start with a stray "N:"
  - type: feature
    label: 'RetroAchievements destekli arcade oyunları artık başarım kazanır. RetroAchievements''ın desteklediği FinalBurn Neo çekirdeğiyle RetroArch (RetroDB) içinde başlarlar; desteklemeyen MAME yerine. Diğer tüm arcade oyunları MAME''de kalır. Ayarlar → Emülatörler → Hileler altındaki yeni FinalBurn Neo arcade hile paketi, bu oyunların hilelerini sayfalarında listeler. FinalBurn Neo her oyun başlarken hileleri kapatır; bu yüzden oynarken RetroArch menüsünden açarsınız: F1, sonra Çekirdek Seçenekleri, sonra Hile'
    en: 'Arcade games with RetroAchievements now earn them. They start in RetroArch (RetroDB) with the FinalBurn Neo core, which RetroAchievements supports, instead of MAME, which it does not; every other arcade game stays in MAME. A new FinalBurn Neo arcade cheats pack under Settings → Emulators → Cheats lists each such game''s cheats on its page. FinalBurn Neo turns cheats off each time a game starts, so you switch them on in RetroArch''s menu while you play: F1, then Core Options, then Cheat'
  - type: performance
    label: Ayarlar yöneticiler için daha hızlı açılıyor. Açılırken artık her sistemin logosunu ve donanım resmini kontrol etmiyor; bu tablo Özelleştirme sekmesini açtığınızda dolar. Açılır açılmaz basılan Kaydet artık bu kontrollerin arkasında beklemez
    en: 'Settings opens faster for admins. It no longer checks every system''s logo and hardware picture as it opens: that table fills when you open the Customization tab. A Save pressed straight after opening no longer waits behind those checks'
  - type: enhancement
    label: 'Ayarlar daha derli toplu. Kendi seçimleriniz Ayarlar → Hesap altında bir arada: Tema ve Dil (hareketli arka planla birlikte) ve artık herkese özel olan mesajların ekranda kalma süresi. Kütüphane → Yollar dört klasörün hepsini tek Kaydet düğmesi altında tutar. Sistem → Sunucu bağlantı noktasını ve veritabanının yerini gösterir. Geliştirmeyi Destekle, Yardım sayfasının sonuna taşındı'
    en: 'Settings is tidier. Your own choices sit together under Settings → Account: Theme and Language (with the moving background), and how long messages stay on screen, which is now each person''s own. Library → Paths holds all four folders under one Save. System → Server shows the port and where the database is. Support Development moved to the end of the Help page'
  - type: enhancement
    label: 'Kontrolcülerin kendi sayfası var. Ayarlar → Özelleştirme → Kontrolcüleri Aç oraya götürür: her sistemin varsayılan kontrolcülerini belirleyin, kendinizinkini ekleyin ve kontrolcü kütüphanesini düzenleyin'
    en: 'Controllers have their own page. Settings → Customization → Open Controllers goes there: set each system''s default controllers, add your own and edit the controller library'
  - type: enhancement
    label: 'Toplu Kazıma Eşleşme Filtresi, puan sayısı ve tablosu yerine üç basit seçenek sunar: Sıkı, Normal ve Gevşek. Normal eski varsayılandır. Daha önce kendi yaptığınız bir ayar, başka bir seçenek seçene kadar Özel olarak görünür'
    en: 'Bulk Scrape Match Filtering offers three plain choices instead of a score number and its table: Strict, Normal and Loose. Normal is the old default. A setting you made yourself before shows as Custom until you pick another'
  - type: enhancement
    label: Profilim'de üç yerine tek bir Profilimi Kaydet düğmesi var. Yeni bir PlayStation belirtecini veya Xbox anahtarını kaydederken kontrol eder ve Sony yenisini reddederse çalışan PlayStation belirtecinizi korur. Parola Değiştir artık en az 12 karakter gerektiğini söylüyor ve yeni parolayı iki kez istiyor
    en: My Profile has one Save My Profile button instead of three. It checks a new PlayStation token or Xbox key as it saves, and keeps your working PlayStation token if Sony refuses the new one. Change Password now says it needs at least 12 characters and asks for the new password twice
  - type: fix
    label: Ayarlar'da daha sade ifadeler. Profilim, RetroAchievements anahtarının ve parolayla girişin ne işe yaradığını söyler. API Anahtarları, kişinin kendi RetroAchievements veya Steam anahtarının önce kullanıldığını belirtir. TheGamesDB'nin anahtarları Ana anahtar ve Yedek anahtar olarak adlandırıldı. Emülatörü düzenle penceresi Program konumu ve Komut satırı seçenekleri der. Kazınan Verileri Temizle, kutuyu işaretlemezseniz resim ve video dosyalarının diskte kaldığını söyler. Yapay zeka model listeleri artık güncelliğini yitiren fiyatları göstermiyor
    en: Plainer words in Settings. My Profile says what the RetroAchievements key and the password sign-in each do. API Keys says a person's own RetroAchievements or Steam key is used first. TheGamesDB's keys are named Main key and Backup key. The Edit emulator window says Program location and Command-line options. Clear Scraped Data says the picture and video files stay on disk unless you tick the box. The AI model lists no longer show prices, which went out of date
  - type: fix
    label: 'Ayarlar, iki kez bulunan veya hiçbir işe yaramayan öğelerden arındırıldı: Kütüphane İstatistikleri kartı (Panoda var), Ayarlar''daki Kupa Tara kopyası (PS3 kupaları sayfasında var), ayrı Sistem Logolarını İçe Aktar düğmesi (Sistem Logolarını Yenile artık önce ES-DE logolarını kopyalıyor) ve hiçbir yerde kullanılmayan altı kayıtlı ayar. 0 saniyelik mesaj süresi sessizce kaydedilmek yerine reddedilir ve yeni bir ROM klasörünü kaydetmek artık RetroDB''nin yeniden başlaması gerektiğini söylemez'
    en: 'Settings drops what was there twice or did nothing: the Library Statistics card (the Dashboard has it), the Settings copy of Scan Trophies (the PS3 trophies page has it), the separate Import System Logos button (Refresh System Logos now copies ES-DE''s logos first) and six stored settings nothing used. A message time of 0 seconds is refused instead of quietly saved, and saving a new ROM folder no longer says RetroDB must restart'
  - type: performance
    label: RetroDB bilgisayarınızı çok daha az yoruyor. Cyberpunk temasının hareketli sisi, herhangi bir RetroDB sayfası açık olduğu sürece bir işlemci çekirdeğini tamamen meşgul ediyordu; artık sisi grafik kartı çiziyor ve işlemci neredeyse hiç yorulmuyor. Ayrıca yarı sayıda kare çiziyor; sis yavaş aktığı için görüntü aynı görünür
    en: RetroDB is far lighter on your computer. The Cyberpunk theme's moving mist kept one processor core fully busy for as long as any RetroDB page was open; the graphics card now draws it, and the processor barely notices. It also draws half as many frames, which looks the same because the mist drifts slowly
  - type: feature
    label: 'Hareketli arka planlar (sis, yağmur, yıldızlar, toz) RetroDB''yi kullanmadığınızda artık duraklar: penceresi önde değilken, sekmesi gizliyken veya bir dakika boyunca fare ya da klavye kullanılmadığında. Geri döndüğünüz anda yeniden başlarlar. Ayarlar → Hesap → Tema ve Dil altındaki yeni Hareketli arka plan anahtarı onları o bilgisayarda hareketsiz tutar'
    en: 'Moving backgrounds (mist, rain, stars, dust) now pause when you are not using RetroDB: when its window is not in front, its tab is hidden, or a minute passes without the mouse or keyboard. They start again the moment you come back. A new Moving background switch under Settings → Account → Theme and Language keeps them still on that computer'
  - type: performance
    label: Sayfa başlıkları parıltısını korur ama artık sürekli atmaz; konsol ve oyun listelerindeki titreyen "glitch" başlıklar yalnızca fare üzerindeyken titrer
    en: Page titles keep their glow but no longer pulse all the time, and the flickering "glitch" titles on the console and game lists flicker only while the mouse is over them
  - type: feature
    label: 'MAME''deki arcade oyunları için hileler. mamecheat.co.uk adresinden "MAME XML Cheats Collection" dosyasını tarayıcınızda indirin ve Ayarlar → Emülatörler → Hileler altında içe aktarın. Her arcade oyununun sayfası hilelerini açma/kapama anahtarlarıyla listeler ve MAME açtıklarınızla başlar. Değer alan bir hile oynarken MAME içinde ayarlanır: Tab''a, sonra Eklenti Seçenekleri''ne, sonra Hile''ye basın'
    en: 'Cheats for arcade games in MAME. Download the "MAME XML Cheats Collection" from mamecheat.co.uk in your browser and import it under Settings → Emulators → Cheats. Each arcade game''s page then lists its cheats with on/off switches, and MAME starts with the ones you switched on. A cheat that takes a value is set in MAME while you play: press Tab, then Plugin Options, then Cheat'
  - type: fix
    label: Bir oyunun sayfasındaki Önceki ve Sonraki, o oyunu kazıdıktan sonra artık filtrelenmiş listenizde kalır. Kazınmamış filtresi açıkken oyunu kazımak onu listeden çıkarıyor, böylece Sonraki bir sonraki kazınmamış oyuna gitmek yerine tüm konsolda geziyordu
    en: Previous and Next on a game's page now stay in your filtered list after you scrape that game. With the Unscraped filter on, scraping a game took it out of the list, so Next stepped through the whole console instead of going to the next unscraped game
  - type: fix
    label: 'RetroDB''nin daha fazla bölümü artık dilinizi izliyor: Ayarlar''ın Bonus Diskler, Yedekleme ve ROM Adlandırma bölümleri, Profilim başlığı, kazıma arama penceresi ve "izin yok" mesajları. Hangi dili seçerseniz seçin İngilizce kalıyorlardı'
    en: 'More of RetroDB now follows your language: the Bonus Discs, Backup and ROM Naming parts of Settings, the My Profile heading, the scrape search window and the "no permission" messages. They stayed in English whatever language you chose'
  - type: fix
    label: Kullanıcı Ekle artık yeni kişinin ilk parolasını (12 karakter veya daha uzun) istiyor ve kişi ilk girişinde kendi parolasını seçiyor. Önceden her yeni hesap sessizce aynı "changeme" parolasını alıyordu ve sahibi giriş yapana kadar herkes kullanabiliyordu
    en: Add User now asks for the new person's first password (12 characters or more), and they choose their own the first time they sign in. Before, every new account quietly got the same password, "changeme", which anyone could use until its owner signed in
  - type: fix
    label: Ayarlar, her kişiye yalnızca rolünün değiştirebildiklerini gösterir. İzleyiciler ve oyuncular Hesap sekmesini görür; editörler ayrıca Bonus Diskler ve Kontrolcüleri görür. Önceden Kaydet düğmesi reddedilen, bazıları yanlış değer gösteren yönetici ayarlarını görüyorlardı
    en: Settings shows each person only what their role can change. Viewers and players see the Account tab; editors also see Bonus Discs and Controllers. They used to see admin settings whose Save button was then refused, some showing wrong values
  - type: fix
    label: Ayarlar → Sistem artık Takılan RA Senkronunu Temizle düğmesini içermiyor. Temizlenmediği halde temizlendiğini söylüyordu; RetroAchievements senkronunu ilerleme bildirimindeki düğmelerle durdurun
    en: Settings → System no longer has the Clear Stuck RA Sync button. It said it had cleared the sync even when it had not; stop a RetroAchievements sync with the buttons on its progress notice
  - type: fix
    label: 'Küçük Ayarlar düzeltmeleri: Kazıyıcı listesindeki Varsayılana Sıfırla, korumak için Kazıyıcı Ayarlarını Kaydet''e basmanızı söyler; yeni kurulum ScreenScraper''ı gerçekte olduğu gibi açık gösterir; Steam ID yardımı 17 haneli sayıyı ister; Emülatörler sayfası artık olmayan bir Ekle düğmesinden söz etmez; Kurulum Sihirbazı API anahtarlarınızı yazarken gizler'
    en: 'Small Settings fixes: Reset to Default on the scraper list says to press Save Scraper Settings to keep it; a new install shows ScreenScraper switched on, as it really is; the Steam ID help asks for the 17-digit number; the Emulators page no longer mentions an Add button it does not have; the Setup Wizard hides your API keys as you type them'
  - type: enhancement
    label: Yardım kılavuzunda artık bir arama kutusu var. Bir sözcük yazın, kılavuzun yalnızca o sözcüğü içeren bölümleri sözcük işaretli olarak görünsün. Aksanları yok sayar ve her dilde çalışır
    en: The help manual now has a search box. Type a word to see only the parts of the manual that mention it, with the word marked. It ignores accents and works in every language
  - type: fix
    label: 'Yardım kılavuzunun Sorun Giderme bölümü artık her özelliği kapsıyor: oyun ekleme, kazıma, Yapay Zeka Doldur, resimler, oynama, hileler, başarımlar, hesaplar, yedeklemeler ve güncellemeler. Eski önerilerin bir kısmı artık olmayan düğmeleri gösteriyordu. Ayrıca HowLongToBeat aramalarının çevrimdışı çalıştığını veya kazıyıcı hızının ayarlanabildiğini artık söylemiyor'
    en: 'The help manual''s Troubleshooting section now covers each feature: adding games, scraping, AI Fill, pictures, playing, cheats, achievements, accounts, backups and updates. Some of its old advice pointed at buttons that no longer exist. It also no longer says HowLongToBeat lookups work offline or that scraper speed can be set'
  - type: fix
    label: Ayarlar → Sistem artık Toplu Kazıma sorun giderme kutusunu içermiyor. Eski toplu kazımadan kalan verileri okuyordu ve gerçek bir kazımayı durduramıyordu; toplu kazımayı penceresindeki İptal ile durdurun
    en: Settings → System no longer has the Bulk Scrape troubleshooting box. It read leftovers of the old bulk scrape and could not stop a real one; stop a bulk scrape with Cancel in its window
  - type: fix
    label: Yükleyici artık RetroDB'nin kütüphanelerinin gerektirdiği Python 3.12 veya daha yenisini istiyor. Eski sürümleri geçiriyordu ve kurulum yarıda başarısız oluyordu. README'de kurulum ve başlatma sorunları için yeni bir Sorun Giderme bölümü var
    en: The installer now asks for Python 3.12 or newer, which RetroDB's libraries need. It let older versions through, and the install then failed partway. The README has a new Troubleshooting section for install and start-up problems
  - type: fix
    label: Oyun İçe Aktarmaları'nın PSN sekmesi artık NPSSO belirtecinin Ayarlar → Profilim altına girdiğini söylüyor. Önceden böyle bir kutusu olmayan bir API Anahtarları sayfasını gösteriyordu
    en: Game Imports' PSN tab now says the NPSSO token goes under Settings → My Profile. It named an API Keys page that has no such box
  - type: fix
    label: Yardım kılavuzu artık Çin yaş derecelendirmesini (CADPA) diğerleriyle birlikte listeliyor, ana sayfadaki Oynamaya Devam Et bölümünü gerçek adıyla anıyor ve resimler kaydedilmediğinde daha güvenli öneriler veriyor
    en: The help manual now lists the Chinese age rating (CADPA) with the others, calls the home page's Continue Playing section by its real name, and gives safer advice when pictures will not save
  - type: fix
    label: 'Ayarlar → Kazıma artık dilinizi izliyor: kazıyıcı listesi, API anahtarları, ES-DE yolları, eşleşme filtresi ve yapay zeka ayarları, durum ve sonuç mesajlarıyla birlikte. Hangi dili seçerseniz seçin İngilizce kalıyordu'
    en: 'Settings → Scraping now follows your language: the scraper list, API keys, ES-DE paths, match filtering and AI settings, with their status and result messages. It stayed in English whatever language you chose'
  - type: enhancement
    label: Yapay zeka hizmeti bir kazımayı reddettiğinde (yanlış API anahtarı, kalmayan kredi veya ödeme, ya da çok fazla istek), RetroDB artık satış rakamları ve çıkış tarihleri gibi alanları sessizce boş bırakmak yerine hangisi olduğunu ve neyi kontrol etmeniz gerektiğini söyler. Ardından bir süre o yapay zekaya sormayı bırakır; böylece her oyun için değil, yalnızca bir kez bilgilendirilirsiniz
    en: When the AI service refuses a scrape (a wrong API key, no credit or billing left, or too many requests), RetroDB now says which, and what to check, instead of quietly leaving fields such as sales figures and release dates empty. It then stops asking that AI for a while, so you are told once, not once per game
  - type: enhancement
    label: '3B kutu artık parmak yuvasını Slipcase''in yaptığı gibi gösteriyor: uçları köşeli ve kutuda öyleyse yan yüzün ortasının üstünde veya altında. Görmek için kutuyu yeniden içe aktarın'
    en: 'The 3D box now shows the finger slot as Slipcase made it: with square ends, and above or below the middle of the side, where the case has it so. Import the box again to see it'
  - type: fix
    label: 'Ayarlar → Sistem artık dilinize uyuyor: bakım araçları, günlük ayarları ve sorun giderme bölümleri, sonuçları ve hata iletileriyle birlikte. Hangi dili seçerseniz seçin İngilizce kalıyorlardı. Diğer sayfalarda kalan İngilizce iletiler de çevrildi'
    en: 'Settings → System now follows your language: the maintenance tools, logging settings and troubleshooting sections, with their results and error messages. They stayed in English whatever language you chose. Leftover English messages on other pages are translated too'
  - type: fix
    label: Bir Başarımlar konsol sayfasında konsol düğmeleri satırı artık kaydırırken bölme sekmelerinin altına kaymıyor; kaydırınca görünümden çıkıyor. Tüm Başarımlar sayfalarında A–Z harf çubuğu artık sekmelerin arkasına saklanmak yerine hemen altında duruyor
    en: On an Achievements console page, the row of console buttons no longer slides under the section tabs as you scroll; it now scrolls away. On every Achievements page the A–Z letter bar now stays just below the section tabs instead of hiding behind them
  - type: fix
    label: Oyun Düzenle penceresinde bir resmi kaldırmak, aynı resmi başka bir oyun kullanıyorsa artık dosyayı silmiyor; diğer oyun resmini korur
    en: Removing a picture in the Edit Game window no longer deletes the file when another game uses the same picture; the other game keeps it
  - type: fix
    label: Kazıma sırasında küçük kaydedilen kutu arkası resimleri, ön kapaklarda olduğu gibi artık arka planda büyütülüyor
    en: Back-of-box pictures that a scrape saves small are now enlarged in the background, as front covers already are
  - type: fix
    label: Oyun Düzenle penceresinde Kaydet artık yüklenen küçük kutu resimleri veya ekran görüntüleri büyütülürken beklemiyor; bu iş sonradan yapılıyor ve "Görseller iyileştiriliyor" olarak gösteriliyor. Kaldırılmak üzere işaretlenen resim ancak kayıt başarılı olunca siliniyor; böylece başarısız bir kayıt resmi kaybettirmiyor
    en: Saving in the Edit Game window no longer waits while small uploaded box art or screenshots are enlarged; that now happens afterwards, shown as "Improving images". A picture ticked for removal is deleted only once the save has worked, so a failed save no longer loses it
  - type: fix
    label: Kütüphane ve konsol sayfalarının üstündeki "eksik üst veri" sayısı, birden fazla bölgesel sürümü olan oyunu artık Kazınmamış filtresi gibi bir kez sayıyor. Eskiden her sürümü ayrı sayıyordu
    en: The "missing metadata" count at the top of the Library and console pages now counts a game with several regional versions once, as the Unscraped filter does. It counted each version
  - type: enhancement
    label: Ayarlar → Bonus Diskler artık bonus disk olarak işaretlenen her diski ait olduğu oyunla birlikte listeliyor. "Bonus disk değil" düğmesi (editörler ve yöneticiler) yanlış işaretlenmiş diski oyun listelerinize geri koyar ve Otomatik Bağlama onu bir daha değiştirmez
    en: Settings → Bonus Discs now lists every disc marked as a bonus disc, with the game it belongs to. Its "Not a bonus disc" button (editors and admins) puts a wrongly marked disc back in your game lists, and Auto-Link then leaves it alone
  - type: fix
    label: '"Nintendo Co., Ltd." ve "GameTek, Inc." gibi şirket adları artık bütün kalıyor. Virgülden bölündükleri için "Ltd." ve "Inc." Kütüphane filtrelerinde, Ayarlar → Veri Normalleştirme''de ve İstatistikler''de ayrı ad gibi görünüyordu. Oyun sayfaları da adları bütün gösteriyor. Parantez içinde virgül olan ad, örneğin "Majesco (licensed from Konami, Disney)", da bütün kalıyor'
    en: Company names such as "Nintendo Co., Ltd." and "GameTek, Inc." now stay whole. They were split at the comma, so "Ltd." and "Inc." showed as names of their own in the Library filters, Settings → Data Normalization and Stats. Game pages show them whole too. A name with a comma inside brackets, such as "Majesco (licensed from Konami, Disney)", stays whole as well
  - type: enhancement
    label: 'Ayarlar → Veri Normalleştirme artık bir şirketin farklı adlarını birleştirebiliyor. Yayıncı ve Geliştirici altında "Bir şirket olabilecek adlar" bölümü "Eidos" ve "Eidos Interactive" gibi benzerleri listeler. Benzer adlar farklı şirketler olabileceği için sizin yerinize hiçbir şey birleştirilmez: tutulacak adı seçin, aynı şirket olan adları işaretleyin ve Birleştir''e basın. Adlar tüm oyunlarda değişir ve sonraki kazımalar tutulan adı kullanır'
    en: 'Settings → Data Normalization can now merge one company''s different names. Under Publisher and Developer, "Names that may be one company" lists look-alikes such as "Eidos" and "Eidos Interactive". Nothing is merged for you, because look-alikes can be different companies: pick the name to keep, tick the names that are the same company and press Merge. The names change on every game, and later scrapes use the kept name'
  - type: enhancement
    label: Ayarlar → Veri Normalleştirme artık Seri, Yayıncı ve Geliştirici düğmelerine sahip. Her biri farklı büyük harflerle yazılmış adları, örneğin "Doom" ve "DOOM", her yazımı kaç oyunun kullandığıyla listeler ve en çok kullanılanı seçili gelir. Birini seçip Uygula'ya basarak tek ad yapın. Yeni kazınan ve yalnızca büyük harfi farklı olan ad kütüphanenizdeki yazımı alır, Yapay Zeka Doldur ise resmi büyük harfleri ister
    en: Settings → Data Normalization now has Franchise, Publisher and Developer buttons. Each lists the names spelled with different capitals, such as "Doom" and "DOOM", with how many games use each spelling and the most-used one picked. Choose one and press Apply to make them one name. A newly scraped name that differs only in capitals takes your library's spelling, and AI Fill asks for official capitals
  - type: fix
    label: Kütüphane filtreleri artık tam değerle eşleşiyor. "Action" türünü seçmek artık "Action-Adventure" oyunlarını da göstermiyor; böylece sonuç yanındaki sayıyla uyuşuyor. Oyun sayfasındaki etiket listeleri ve Benzer Oyunlar da aynı şekilde eşleşiyor
    en: The Library's filters now match whole values. Choosing the genre "Action" no longer also shows "Action-Adventure" games, so the result matches the count beside it. A game page's tag lists and Similar Games match the same way
  - type: security
    label: Ayarlar → Profilim artık kayıtlı RetroAchievements anahtarınızı, PSN belirtecinizi veya Steam anahtarınızı sayfaya göndermiyor. Her kutu, Kazıma sekmesindeki anahtarlarda olduğu gibi yalnızca son dört karakteri gösterir. Yeniden yazmadan kaydetmek kayıtlı anahtarı korur
    en: Settings → My Profile no longer sends your saved RetroAchievements key, PSN token or Steam key to the page. Each box shows only its last four characters, as the Scraping tab's keys already did. Saving without retyping keeps the saved key
  - type: fix
    label: Günlük Görüntüleyici artık "Geçersiz günlük dosyası" ile açılmıyor. Göstermeyeceği yardımcı günlükleri listeliyor ve ilk olarak birini açıyordu; artık yalnızca açabildiği günlükleri listeliyor
    en: The Log Viewer no longer opens on "Invalid log file". It listed helper logs it would not show, and opened one of them first; it now lists only logs it can open
  - type: fix
    label: Oyun İçe Aktarma'daki PSN sekmesi artık NPSSO belirteci için sizi kutunun bulunduğu Ayarlar → Profilim'e yönlendiriyor, Ayarlar → API Anahtarları'na değil; bağlantı durumu da çevrilebiliyor
    en: Game Imports' PSN tab now sends you to Settings → My Profile for the NPSSO token, where the box is, instead of Settings → API Keys, and its connection status can be translated
  - type: fix
    label: İzleyici olarak giriş yapıldığında sayfalar artık sunucudan alamayacakları yönetici bilgilerini istemiyor; böylece sunucu günlüğü reddedilen isteklerle dolmuyor
    en: Signed in as a viewer, pages no longer ask the server for admin-only information they cannot have, so the server log no longer fills with refused requests
  - type: security
    label: RetroDB dışından gelen adlar (kazınan veriler, dosya ve klasör adları, çevrimiçi hizmet yanıtları) artık oyun sayfasında, Ayarlar'da, Raporlar'da, ROM araçlarında, kupa sayfalarında ve başka yerlerde her zaman düz metin olarak görünüyor. Sayfalar ayrıca yalnızca kendi düğmelerinin eylemlerini çalıştırıyor; böylece hazırlanmış bir ad sayfaya bir şey yaptıramaz ve ilerleme bildirimindeki "geri dön" bağlantısı artık başka bir web sitesine gidemez
    en: Names that come from outside RetroDB (scraped data, file and folder names, replies from online services) now always show as plain text, on the game page, Settings, Reports, the ROM tools, the trophy pages and more. Pages also run only their own buttons' actions, so a crafted name cannot make a page do something, and a progress toast's "return to" link can no longer lead to another website
  - type: enhancement
    label: Sıradaki toplu kazımalara Yeniden Sırala düğmesi eklendi. Bu düğme, bekleyen bir kazımanın daha erken ya da daha geç çalışabildiği veya şu an çalışanla yer değiştirebildiği Sıra Yöneticisi'ni açar. Her sıradaki bildirim de değişiklikten sonra sıra numarasını koruyor
    en: Queued bulk scrapes get a Reorder button. It opens the Queue Manager, where a waiting scrape can run sooner, later, or swap with the one running now. Each queued toast also keeps its place number after a change
  - type: fix
    label: İş ilerlemesi artık takılıp kalmıyor veya kendini tekrarlamıyor. Çöken bir CHD denetimi ya da dönüştürme artık nedeniyle sona eriyor; İptal sayfaya düğmelerini geri veriyor; reddedilen iptal, duraklatma veya kaldırma bunu söylüyor; "tamamlandı" bildirimi bir saat sonra yeniden çıkmıyor; başarımlar sayfasının Eşitle düğmesi eşitleme bitince geri geliyor
    en: Job progress no longer gets stuck or repeats itself. A CHD check or conversion that crashes now ends with its reason; Cancel gives the page its buttons back; a refused cancel, pause or remove says so; "completed" no longer pops up again an hour later; and the achievements page's Sync button comes back when its sync ends
  - type: fix
    label: Oyun sayfasında bir HowLongToBeat eşleşmesini kaydetmek artık HLTB bağlantısını ve oyuncu sayısını silmiyor, başarısız kayıt yeniden denenebiliyor. Hızlı Düzenleme artık her kayıtlı eşleşmeyi "%100 eşleşme" göstermiyor. Kütüphane filtre etiketleri sistemin numarası yerine adını gösteriyor ve yazarken arama liste sayfalarında ve Karşılaştır'da çalışıyor
    en: Saving a HowLongToBeat match on the game page no longer wipes its HLTB link and player count, and a failed save can be retried. Quick Edit no longer shows every saved match as "100% match". Library filter tags show a system's name instead of its number, and search-as-you-type works on list pages and Compare
  - type: fix
    label: Her hesap kendi parolasını Ayarlar → Profilim'de değiştirebilir, yönetici de herkesinkini sıfırlayabilir. Emülatör klasörleri artık Windows'ta çalışıyor. Ana sayfa artık editörlere ve izleyicilere API'lerinin çevrimdışı olduğunu söylemiyor ve "Kutu resmi eksik oyunlar" Kütüphane'yi yalnızca bu oyunları gösterecek şekilde açıyor. Parola yöneticisi artık giriş kutusunu doldurabiliyor
    en: Every account can change its own password in Settings → My Profile, and an admin can reset anyone's. Emulator folders now work on Windows. The dashboard no longer tells editors and viewers that their APIs are offline, and "Games missing box art" opens the Library showing just those games. A password manager can now fill the sign-in box
  - type: fix
    label: 'ROM araçları: CHD Doğrula her Geçerli veya Geçersiz rozetini doğru dosyaya koyuyor; günlük görüntüleyici modül adlarını yeniden gösteriyor ve dosya listesi alınamazsa bunu söylüyor; Oyun İçe Aktarma''daki tümünü seç yalnızca filtrenizin gösterdiği oyunları içe aktarıyor; ROM Araçları Ayarları''ndaki Sıfırla bu bilgisayarın kendi ROM klasörünü geri yüklüyor'
    en: 'ROM tools: CHD Verify puts each Valid or Invalid badge on the right file; the log viewer shows module names again and says when its file list fails; Game Imports'' select-all imports only the games your filter shows; and ROM Tools Settings'' Reset restores this computer''s own ROM folder'
  - type: fix
    label: Steam kilit açma zamanları tarih olarak görünüyor; A-Z çubuğu Yerel Kupalar'da çalışıyor; PSN Seçim modu kaydırdıkça yüklenen oyunlarda çalışmaya devam ediyor; izleyiciler artık kullanamayacakları Eşitle veya Yeniden Adlandır düğmelerini görmüyor; toplu yeniden adlandırma taramadan sonra adı değişmiş dosyayı atlıyor; Analitik düz HTTP ağında kopyalayabiliyor ve sayıları sayı olarak dışa aktarıyor
    en: Steam unlock times show as dates; the A-Z bar works on Local Trophies; PSN Select mode keeps working on games that load as you scroll; viewers no longer see Sync or Rename buttons they cannot use; a batch rename skips a file renamed since the scan; and Analytics can copy on a plain-HTTP network and exports numbers as numbers
  - type: fix
    label: Onay penceresinde İptal veya × üzerindeyken Enter artık onaylamak yerine iptal ediyor. Tamam ile açılan pencere artık kaybolmuyor ve kısayol listesi ya da ilerleme penceresi kapandıktan sonra Tab çalışmaya devam ediyor
    en: In a confirm window, Enter on Cancel or × now cancels instead of confirming. A window opened by OK no longer vanishes, and Tab keeps working after the shortcuts list or a progress window closes
  - type: enhancement
    label: 'Yalnızca fareyle çalışan birçok denetim artık klavyeyle de çalışıyor (Tab, ardından Enter veya Boşluk): giriş profilleri, Karşılaştır arama sonuçları, etiketler ve Düzenle ile Sil düğmeleri, başarım oyun kartları, günlük oturumları, tema ve avatar seçenekleri, Müze resimleri, türü veya filtreyi kaldıran ×, kurulum klasörleri, kazıma kaynağı onay kutuları ve CLZ içe aktarma. Aç/kapat anahtarları artık klavye halkasını gösteriyor'
    en: 'Many controls that worked only with a mouse now work from the keyboard (Tab, then Enter or Space): the sign-in profiles, Compare search results, tags and their Edit and Delete buttons, achievement game cards, log sessions, theme and avatar choices, Museum pictures, the × that removes a genre or filter, setup folders, scrape-source tick boxes and the CLZ import. On/off switches now show the keyboard ring'
  - type: performance
    label: Müze'nin arka plan kaldırıcısı artık bellekte kalmıyor. Kontrolcü fotoğraflarını bir AI modeliyle arka planından kesip çıkarıyordu ve bu model bir kez kullanıldıktan sonra RetroDB yeniden başlatılana kadar 2 GB'tan fazla, bir fotoğraf işlenirken de yaklaşık 9 GB'a kadar bellek tutuyordu. Artık gerektiğinde başlayan ve son fotoğrafından iki dakika sonra kapanan yardımcı bir programda çalışıyor ve o belleğin tamamını geri veriyor
    en: The Museum's background remover no longer stays in memory. It cut controller photos out of their background with an AI model that took over 2 GB once used, and up to about 9 GB during a photo, until RetroDB restarted. It now runs in a helper that starts when needed and closes two minutes after its last photo, giving all of that memory back
  - type: feature
    label: 'Xbox içe aktarma artık Microsoft Azure hesabı gerektirmiyor. Artık herkes kendi ücretsiz OpenXBL anahtarını (xbl.io''dan) Ayarlar → Profilim bölümüne yapıştırıyor ve bu, ağınızdaki her bilgisayardan çalışıyor. İçe aktarma ayrıca uygulamaları ve yalnızca telefona özel oyunları dışarıda bırakıyor, PC oyunlarını Xbox One yerine Windows altına koyuyor, Xbox 360 başarımlarını doğru okuyor ve kilitli bir başarım için tarih göstermiyor. Ücretsiz anahtar saatte 150 isteğe izin verir: bu sınıra ulaşan büyük bir başarım senkronizasyonu durur, bunu bildirir ve bir sonraki sefer henüz ulaşamadığı oyunlardan başlar'
    en: 'Xbox import no longer needs a Microsoft Azure account. Each person now pastes their own free OpenXBL key (from xbl.io) under Settings → My Profile, and it works from any computer on your network. The import also leaves out apps and phone-only games, files PC games under Windows instead of Xbox One, reads Xbox 360 achievements the right way, and shows no date for a locked achievement. The free key allows 150 requests an hour: a big achievement sync that reaches it stops, says so, and next time starts with the games it had not reached'
  - type: enhancement
    label: Başka bir RetroAchievements Eşitleme veya Yenileme işlemi çalışırken istediğiniz yeni bir işlem artık sunucuda bekler ve öncekisi bitince kendiliğinden başlar; sayfayı kapatsanız ya da başka bir cihazdan istemiş olsanız da. Her sayfada aynı bekleme listesi, her işin sıradaki yeriyle birlikte görünür ve ✕ ile bir iş listeden çıkarılır. Sunucu yeniden başlatıldıktan sonra bekleyen işler Panel'de yeniden önerilir
    en: A RetroAchievements Sync or Refresh you ask for while another one runs now waits on the server and starts by itself when that one finishes, even if you close the page or asked from another device. Every page shows the same waiting list with each job's place in line, and ✕ takes a job out. After a server restart, waiting jobs are offered back on the Dashboard
  - type: fix
    label: Bir konsolun sayfasındaki RA'yı Yenile düğmesi yeniden çalışıyor. Hangi konsol olduğunu belirtmiyordu, bu yüzden sunucu "Bulunamadı" yanıtı veriyordu
    en: The Refresh RA button on a console's page works again. It did not say which console, so the server answered "Not found"
  - type: fix
    label: ROM adlandırma denetimi artık her sistemi Sistemler sayfasında gösterilen türde ele alıyor. Macintosh, ZX Spectrum Next, Coleco Adam ve Thomson konsol yerine bilgisayar, 3DS ve PS Vita ise el konsolu olarak denetleniyor. Sistemler sayfasında belirlediğiniz tür de artık dikkate alınıyor
    en: The ROM naming check now treats each system as the kind the Systems page shows. Macintosh, ZX Spectrum Next, Coleco Adam and Thomson are checked as computers, and 3DS and PS Vita as handhelds, instead of as consoles. A type you set on the Systems page is now followed too
  - type: performance
    label: RetroDB artık beklerken çok daha az bellek kullanıyor. Yapay zekâ görsel büyütücü artık yalnızca büyütme sırasında yükleniyor; son görüntüden iki dakika sonra kapanan bir yardımcı süreçte çalışıyor. Boştaki bir sunucunun bellek kullanımı yaklaşık 1,4 GB'tan 100 MB'ın altına düştü. Büyütme sırasında grafik sürücüsü çökerse yalnızca yardımcı süreç durur, sunucu asla durmaz
    en: RetroDB uses far less memory while it waits. The AI image upscaler now loads only while it is upscaling, in a helper that closes two minutes after its last picture; an idle server dropped from about 1.4 GB to under 100 MB. If the graphics driver crashes during an upscale, only the helper stops, never the server
  - type: performance
    label: Claude web aramasıyla Yapay Zeka Doldur artık daha ucuz. Claude her aramadan sonra arama sonuçlarını yeniden okur; RetroDB artık Anthropic'ten bunları hazır tutmasını istiyor ve yeniden okuma fiyatın onda biri kadarına ya da daha azına mal oluyor
    en: AI Fill with Claude web search costs less. Claude reads the search results again after each search; RetroDB now asks Anthropic to keep them ready, and a re-read then costs a tenth of the price or less
  - type: fix
    label: 'Zulu ve Xhosa daha okunaklı: "Edition" ifadesinin "Chapter" olarak, "must be text" ifadesinin ise "must be a letter" olarak görüldüğü, yanlış anlam taşıyan 133 satır düzeltildi. Her düzeltme, iki ayrı yapay zekâ denetiminde onaylandı'
    en: 'Zulu and Xhosa read better: 133 lines that said the wrong thing are corrected, such as "Edition" shown as "Chapter" and "must be text" shown as "must be a letter". Each correction was agreed by two separate AI checks'
  - type: fix
    label: Bir oyun başlamadığında mesaj artık sizin dilinizde görünür ve hatalı olan emülatörü, çekirdeği veya dosyayı yine belirtir. Bilgisayarın kendi içinde oluşan bir hata, ham sistem metni yerine artık "Başlatılamadı" ifadesini ve programın adını gösterir; ayrıntılar sunucu günlüğünde yer alır. Reddedilen bir RetroAchievements girişinde, çevrilmiş bir cümlenin içinde RetroAchievements'ın kendi verdiği neden gösterilir
    en: When a game will not start, the message is now in your language and still names the emulator, core or file at fault. A failure inside the computer itself now says "Could not start" and the program's name, with the details in the server log, instead of raw system text. A refused RetroAchievements sign-in shows RetroAchievements' own reason inside a translated sentence
  - type: fix
    label: Tamamlanmış bir kazıma, senkronizasyon veya görsel işini iptal etmek artık takılı kalan ilerleme penceresini temizliyor. Zaten çalışan bir işi başlatmak, "Ağ hatası" yerine "SNES için bir kazıma zaten çalışıyor" gibi gerçek nedeni gösteriyor. Müze'deki Kontrolcü görsel hataları artık neyin ters gittiğini söylüyor ve başka bir kullanıcının RetroAchievements senkronizasyonunu iptal etmeye çalışmak, iptal etmiş gibi davranmak yerine bunun ona ait olduğunu belirtiyor
    en: Cancelling a scrape, sync or image job that has already finished now clears its stuck progress popup. Starting a job that is already running shows the real reason, such as "A scrape for SNES is already running", instead of "Network error". Controller image errors in the Museum now say what went wrong, and cancelling another user's RetroAchievements sync says it is theirs instead of pretending to cancel it
  - type: security
    label: Günlük görüntüleyici artık eski günlük dosyalarındaki parolaları ve anahtarları da gizliyor. RetroDB belirli bir parolayı, örneğin ScreenScraper parolasını gizlemeyi öğrenmeden önce yazılan günlükler, görüntülendiğinde veya indirildiğinde parolayı düz metin olarak gösteriyordu
    en: The log viewer now hides passwords and keys in older log files too. Logs written before RetroDB learned to hide a particular password, such as ScreenScraper's, showed it in plain text when viewed or downloaded
  - type: security
    label: Tüm ayarları varsayılana sıfırlamak artık ROM klasörünüzü ve kurulumun tamamlandığı bilgisini koruyor. Önceden sıfırlama, bir yönetici kurulumu yeniden çalıştırana kadar oturum açmadan çalışan ilk kurulum sayfalarını yeniden açıyordu
    en: Resetting all settings to their defaults now keeps your ROM folder and the fact that setup is done. Before, a reset reopened the first-time setup pages, which work without signing in, until an admin ran setup again
  - type: feature
    label: Arcade oyunları yine RetroAchievements başarımı kazanabiliyor. RetroDB artık bir arcade oyununu yalnızca RetroAchievements tam dosya adını biliyorsa bağlıyor, örneğin Street Fighter II için sf2. Böylece başlıklardan tahmin yürütüp yanlış oyunu bağlamıyor. Arcade oyunlarınız, RetroAchievements verileri yenilendiğinde veya kazındıklarında bir sonraki seferde bağlanır
    en: Arcade games can earn RetroAchievements again. RetroDB now links an arcade game only when RetroAchievements knows its exact file name, such as sf2 for Street Fighter II, so it no longer guesses from titles and links the wrong game. Your arcade games link the next time their RetroAchievements data is refreshed or they are scraped
  - type: fix
    label: PlayStation kupa senkronizasyonu artık daha önce yanlış yaptığı oyun bağlantılarını düzeltiyor, örneğin ilgisiz "D" adlı bir oyuna bağlanmış çok sayıda oyun gibi. Sizin elle yaptığınız bağlantı senkronizasyonla asla değişmez. Sonraki senkronizasyon tüm eski bağlantıları yeniden kontrol eder, bu yüzden birkaç yakın eşleşmenin bağlantısı kalkabilir; bunları elle yeniden bağlayın
    en: PlayStation trophy sync now corrects game links it made wrongly before, such as many games linked to an unrelated game called "D". A link you set yourself is never changed by a sync. The next sync checks all older links again, so a few near matches may come unlinked; link those again by hand
  - type: fix
    label: Bekleyen bir toplu kazımayı çalışan birinin önüne almak artık eski kazımanın son oyununu yeni kazımanın sayılarına eklemiyor. İstek Listesi'nde başka bir kazıma çalışırken "Tümünü kazı" düğmesine basmak, başladığını söylemek yerine bunu belirtiyor
    en: Moving a waiting bulk scrape ahead of a running one no longer adds the old scrape's last game to the new one's counts. Clicking "Scrape all" on the wishlist while one is already running now says so, instead of claiming it started
  - type: accessibility
    label: 'Ekran okuyucuyla, "çalışıyor" düğmesi artık her birkaç saniyede çıplak bir sayı okumak yerine yalnızca sayı değiştiğinde "1 oyun çalışıyor" diyor. Listesi, imleç içinde olacak şekilde adlandırılmış bir pencere olarak açılıyor, Sonlandır ve Sonraki disk düğmeleri hangi oyun için olduklarını söylüyor ve Sonlandır''dan sonra imleç mantıklı bir yere dönüyor. Kütüphanedeki her oyun kartı artık başlığından klavyeyle açılıyor ve filtre düğmeleri neyi filtrelediğini söylüyor, örneğin "Geliştiriciye göre filtrele: Konami"'
    en: 'With a screen reader, the "running" button now says "1 game running" only when the count changes, instead of reading a bare number every few seconds. Its list opens as a named window with the cursor inside, its Kill and Next disk buttons say which game they act on, and after Kill the cursor returns to a sensible place. Each game card in the library now opens with the keyboard from its title, and its filter buttons say what they filter, such as "Filter by Developer: Konami"'
  - type: feature
    label: Her üye artık Ayarlar → Profilim altında kendi Steam anahtarını ve Steam kimliğini ekleyebiliyor, kendi Steam kütüphanesini ve başarımlarını içe aktarabiliyor. Şimdiye kadar bunu yalnızca yönetici yapabiliyordu
    en: Every member can now add their own Steam key and Steam ID under Settings → My Profile, and import their own Steam library and achievements. Until now only an admin could
  - type: fix
    label: Bir oyunun ayrıntılarını kaydetmek artık boş oyuncu sayısını 1 yapmıyor ve RetroDB'nin sizin için bulduğu yaş derecelendirmelerini sizin yazdığınız olarak işaretlemiyor. Yapay Zeka Doldur, Özel olarak işaretlediğiniz oyunu koruyor ve yapay zekanın yanıtı beklenirken oyunda yaptığınız değişiklikleri de koruyor. Bir kazımanın geçmişi artık yalnızca gerçekten kaydettiği ayrıntıları listeliyor
    en: Saving a game's details no longer sets an empty player count to 1, and no longer marks the age ratings RetroDB worked out for you as typed by you. AI Fill keeps a game you marked Exclusive, and keeps any change you make to a game while it is waiting for the AI's answer. A scrape's history now lists only the details it actually saved
  - type: fix
    label: Ekran Görüntüsü İncelemesi, saklanan bir ekran görüntüsü açılamayacak kadar büyükse artık yarıda durmuyor; o resmi okunamaz sayıp devam ediyor. Yardım sayfasının içindekiler listesi artık Emülatörler ve Oynama bölümlerine bağlanıyor ve oturum açma, arka plan işleri, kazıma, resimler, güncellemeler ve hata yanıtları hakkındaki geliştirici notları artık programın gerçekte yaptığını anlatıyor
    en: Screenshot Review no longer stops halfway when one stored screenshot is far too large to open; it counts that picture as unreadable and carries on. The help page's contents list now links to Emulators and Playing, and the developer notes on sign-in, background jobs, scraping, pictures, updates and error replies now say what the program really does
  - type: fix
    label: ROM Araçları taramasını başlatan bir editör artık onu duraklatabilir, sürdürebilir veya iptal edebilir; başkalarının taramalarını durdurmak yine yöneticiye ait. Etiketler ve listeler, eksik adı veya hatalı rengi hata sayfası yerine açık bir iletiyle reddediyor ve bir istek listesi oyununu zaten istediğiniz başka bir oyunun adına çevirmek, eklemek gibi reddediliyor. RA Verilerini Temizle artık kopyanızın başarım kazanıp kazanmadığını da unutuyor. RetroDB'nin artık sunmadığı bir kupa koleksiyoncu sıranıza sayılmayı bırakıyor. Windows ROM yolları artık RetroAchievements oyunlarıyla dosya adına göre eşleşiyor
    en: An editor who starts a ROM Tools scan can now pause, resume or cancel it; other people's scans stay an admin's to stop. Tags and lists refuse a missing name or a bad colour with a clear message instead of an error page, and renaming a wishlist game onto another one you already wish for is refused, as adding it is. Clear RA Data now also forgets whether your copy earns achievements. A trophy RetroDB no longer offers stops counting toward your collector rank. Windows ROM paths now match RetroAchievements games by file name
  - type: fix
    label: Bakım düzeltmeleri. Açılamayan çok diskli bir arşiv artık her yeniden denemeyi engelleyen yarım bir klasör bırakmıyor. Depolamayı Hesapla artık PS3 oyun klasörünün içindeki her dosyayı sayıyor. Kazınan Verileri Temizle resimleri yalnızca siz isterseniz siliyor. Başka bir taramanın az önce eklediği bir oyunla karşılaşan kütüphane taraması, o konsolun kalan oyunlarıyla devam ediyor
    en: Maintenance fixes. A multi-disc archive that fails to unpack no longer leaves a half-made folder behind that blocks every retry. Calculate Storage now counts every file inside a PS3 game folder. Clear Scraped Data deletes pictures only when you ask it to. A library scan that meets a game another scan has just added carries on with the rest of that console's games
  - type: fix
    label: Yedek geri yükleme artık daha güvenli. Kütüphane veritabanına, veritabanının kendisinin beklediği şekilde yazılıyor; böylece onu açık tutan RetroDB bölümü hasar riski yerine geri yüklenen verileri görüyor. Bir oyunu silmek artık kutu resimlerini ile bekleyen resim ve emülatör ayarı kayıtlarını da siliyor, böylece yeni bir oyun bunları asla devralamıyor. Aynı anda kaydedilen iki ayar artık birbirini kaybettirmiyor
    en: Restoring a backup is safer. It is now written into the library database the way the database itself expects, so a part of RetroDB that has it open sees the restored data instead of risking damage. Deleting a game now also deletes its box pictures and its waiting picture and emulator-setting entries, so a new game can never inherit them. Two settings saved at the same moment no longer lose one of them
  - type: fix
    label: Resim düzeltmeleri. GIF'ler artık sadece atılmak için büyütücüden geçirilmiyor. Büyütücü modeli yayımlanmış parmak iziyle doğrulanıyor ve hatalı bir indirme, büyütmeyi kalıcı olarak kapatmak yerine yeniden alınıyor. Logolar ve saydam bölümleri olan resimler büyütüldüğünde saydamlığını koruyor. WebP'ye Dönüştür artık arka kapakları ve logoları da alıyor ve büyük bir kütüphaneyi gereksiz yer isteği yüzünden reddetmiyor. Bir kutu dosyasının iki yüzü aynı resmi paylaşabiliyor ve bozuk kaydı olan bir kutuyu kaldırmak resimlerini de kaldırıyor
    en: Picture fixes. GIFs are no longer run through the upscaler only to be thrown away. The upscaler model is checked against its published fingerprint, and a bad download is fetched again instead of turning upscaling off for good. Logos and pictures with see-through parts keep their transparency when enlarged. Convert to WebP now takes back covers and logos too, and no longer refuses a large library for want of room it does not need. Two faces of a box file can share one picture, and removing a box with a damaged record removes its pictures
  - type: fix
    label: CLZ, Steam, Xbox ve PlayStation içe aktarmaları artık yalnızca Japonca veya başka Latin dışı yazıyla yazılmış her başlığı aynı oyun saymıyor ve kimliği olmayan oyun eklemiyor. CLZ önizlemesi artık içe aktarmayı onaylamadan konsol eklemiyor ve bir Steam, Xbox veya PlayStation kütüphanesine bakan izleyici de artık eklemiyor. Mağazadan kaldırılan bir Steam oyunu her senkronizasyonda değil, bir kez soruluyor
    en: Imports from CLZ, Steam, Xbox and PlayStation no longer treat every title written only in Japanese or another non-Latin script as the same game, and no longer add a game with no id. The CLZ preview no longer adds consoles before you confirm the import, and a viewer looking at a Steam, Xbox or PlayStation library no longer adds them either. A Steam game removed from the store is asked about once, not on every sync
  - type: fix
    label: Analiz artık çok daha fazla konsolu "Diğer" yerine üreticisi altında grupluyor ve panodaki Son Kazınanlar listesi yalnızca yeni eklenen oyunları değil, yeniden kazıdığınız oyunu da gösteriyor
    en: Analytics now groups many more consoles under their maker instead of "Other", and the dashboard's Recently Scraped list shows a game you scraped again, not only newly added games
  - type: fix
    label: Müze'ye eklediğiniz Kontrolcü resimleri, bağımsız sürüm güncellendiğinde korunuyor. Çevrimiçi bir hizmet sınırında durakladığında, tekrar sorulacağı zaman kendi saat diliminizde gösteriliyor
    en: Controller pictures you add in the Museum are kept when the standalone version updates. When an online service pauses at its limit, the time it will be asked again is shown in your own time zone
  - type: fix
    label: Bir bonus disk artık kendisine veya başka bir bonus diske bağlanamıyor ve Otomatik bağlama aynı çalıştırmada bir diski bonus disk olarak işaretlediği diske bağlamıyor
    en: A bonus disc can no longer be linked to itself or to another bonus disc, and Auto-link no longer links a disc to one it marks as a bonus disc in the same run
  - type: fix
    label: Kütüphane ve konsol sayfaları artık arcade BIOS dosyalarını toplamlarda veya harf çubuğunda oyun olarak saymıyor. Benzer oyunlar ve bir oyunun sayfasında tür veya yayıncıya tıklayınca gelen liste artık oyunun kendi bölgesel sürümlerini, bonus disklerini veya BIOS dosyalarını göstermiyor
    en: The Library and console pages no longer count arcade BIOS files as games, in their totals or the letter bar. Similar games, and the list you get by clicking a genre or publisher on a game's page, no longer show the game's own regional versions, bonus discs or BIOS files
  - type: fix
    label: Tümünü seç, çok büyük bir liste kısaltıldığında artık sessizce yalnızca bir kısmını seçmek yerine bunu söylüyor
    en: Select all now says so when a very large list is cut short, instead of quietly selecting only part of it
  - type: fix
    label: Kütüphane kartları artık başarım veya kupa ilerlemeniz değiştiğinde ve bir oyun oynanabilir hale geldiğinde ya da oynanabilir olmaktan çıktığında güncelleniyor
    en: Library cards now update when your achievement or trophy progress changes, and when a game becomes playable or stops being playable
  - type: fix
    label: Toplu düzenleme artık hatalı bir seçim gönderildiğinde yanlış oyunları değiştiremiyor ve başarısız olan bir toplu düzenleme oyunları sizin düzenlediğiniz olarak işaretlemiyor
    en: Bulk edit can no longer change the wrong games when it is sent a bad selection, and a bulk edit that fails no longer marks the games as edited by you
  - type: fix
    label: Yalnızca %1 uyan bir HowLongToBeat eşleşmesi artık %100 eşleşme olarak gösterilmiyor ve yüklenemeyen bir sayfa ham hata metni yerine hata sayfasını gösteriyor
    en: A HowLongToBeat match that is only a 1% fit is no longer shown as a 100% match, and a page that fails to load shows the error page instead of the raw error text
  - type: security
    label: Parolanızı değiştirmek veya bir yöneticinin sıfırlaması artık o hesabın diğer tüm cihazlardaki oturumunu kapatıyor. Bu yüzden bu güncellemeden sonra herkes bir kez daha oturum açacak. İlk çalıştırma kurulum sayfası da diğer her sayfa gibi diğer web sitelerine karşı aynı korumayı alıyor
    en: Changing your password, or an admin resetting it, now signs that account out on every other device. Because of this, everyone signs in once more after this update. The first-run setup page also gets the same protection against other websites as every other page
  - type: fix
    label: Avatar olarak reddedilen bir resim artık mevcut avatarınızı silmiyor
    en: A picture that is refused as your avatar no longer deletes the avatar you had
  - type: fix
    label: Kazımalar çevrimiçi hizmetlere karşı daha nazik. Sürekli başarısız olan bir hizmet, aramalarda olduğu gibi boşlukları doldururken de bir süre atlanıyor ve ScreenScraper oyun aramaları artık günlük sınırlarına da uyuyor
    en: Scrapes are gentler on the online services. A service that keeps failing is skipped for a while when filling gaps, as it already was in searches, and ScreenScraper game lookups now respect its daily limits too
  - type: fix
    label: Bir kazıma artık çıkış yılı bilinmeyen, örneğin "TBA" olan bir oyunda başarısız olmuyor ve listenizin dışındaki bölgelerde yayımlanan, örneğin "Brezilya, Kore" gibi bir oyun, varsayılanınıza dönüşmek yerine bölgesini koruyor
    en: A scrape no longer fails on a game whose release year is unknown, such as "TBA", and a game listed for regions outside your list, such as "Brazil, Korea", keeps its region instead of becoming your default
  - type: fix
    label: ~/ ile yazılan ES-DE klasörleri artık çalışıyor ve çok büyük bir ES-DE dosyası artık kopyalanmıyor. Önerilen bölgesel sürümler, birbirinin sürümü olmadığını söylediğiniz iki oyunu asla yeniden birleştirmiyor
    en: ES-DE folders written as ~/ now work, and a very large ES-DE file is no longer copied. Suggested regional versions never put back together two games you said are not versions of each other
  - type: security
    label: RetroDB, web'den resim alırken birkaç özel ağ adresini daha reddediyor ve bir web adresinin yönlendirmesini doğru takip ediyor
    en: RetroDB refuses a few more private network addresses when fetching pictures from the web, and follows a web address's redirect correctly
  - type: fix
    label: 'Hâlâ İngilizce kalan son ekranlar da artık dilinize uyuyor: kurulum sihirbazı, Etiketler, Listeler, Oyunları Karşılaştır, ROM Araçları ayarları, toplu kazıma kuyruğu, panodaki yarım kalan işler listesi, kütüphane kartı etiketleri ve birçok hata iletisi dahil'
    en: The last screens still in English now follow your language too, including the setup wizard, Tags, Lists, Compare Games, ROM Tools settings, the bulk scrape queue, the dashboard's interrupted-jobs list, the library card labels and many error messages
  - type: security
    label: Web kodu içeren bir sistem adı artık toplu kazıma kuyruğu penceresinde bu kodu çalıştıramıyor
    en: A system name holding web code can no longer run it in the bulk scrape queue window
  - type: accessibility
    label: Sayfanın neresinde olursanız olun, klavyenin bulunduğu yer artık her düğmede, kutuda ve bağlantıda temanızın renginde kalın bir halkayla işaretleniyor. Önceden birçok denetim, fare üzerinden geçtiğindekiyle aynı, yalnızca soluk bir çizgi gösteriyordu
    en: Wherever you are on a page, the keyboard's place is now marked with a bold ring in your theme's colour, on every button, box and link. Before, many controls showed only a faint line, the same as when the mouse passed over them
  - type: accessibility
    label: Kütüphane kartlarındaki Tür, Seri, Geliştirici ve Yayıncı bağlantıları artık klavyeyle çalışıyor. Oynanan oyunlar için "çalışıyor" düğmesi de klavyeyle açılıyor ve Esc veya başka bir yere tıklamak listesini kapatıyor
    en: The Genre, Series, Developer and Publisher links on library cards now work from the keyboard. The "running" button for games in play opens from the keyboard too, and Esc or a click elsewhere closes its list
  - type: accessibility
    label: Ekran okuyucular artık her etiket rengini adlandırıyor ve hangisinin seçili olduğunu söylüyor, kupa resimlerini de tek harf yerine Platin, Altın, Gümüş ve Bronz olarak okuyor. Bir oyun başlarken Tab artık başlangıç ekranının arkasına geçmiyor
    en: Screen readers now name each tag colour and say which one is chosen, and read trophy pictures as Platinum, Gold, Silver and Bronze instead of single letters. While a game starts, Tab no longer moves behind the starting screen
  - type: fix
    label: Bir güncelleme dosyaları değiştirmeye başlamadan durursa, RetroDB artık kapalı kalmak yerine önceki sürümünüzü yeniden başlatıyor
    en: If an update stops before it starts swapping files, RetroDB now starts the version you had again, instead of staying closed
  - type: fix
    label: Oyna'ya aynı anda iki kez basmak artık yerleşik oynatıcıda iki oyun başlatamıyor. Çekirdek indirmesini beklemek artık bir süre sonra veya RetroDB yanıt vermeyi bıraktığında sonsuza dek beklemek yerine vazgeçiyor ve "zaten çalışıyor" sorusu RetroDB'nin kendi iletişim kutusunu kullanıyor
    en: Pressing Play twice at once can no longer start two games on the built-in player. Waiting for a core download now gives up after a while, or when RetroDB stops answering, instead of waiting forever, and the "already running" question uses RetroDB's own dialog
  - type: fix
    label: Oynarken açıp kapattığınız Hileler artık doğru oyun için saklanıyor, aynı dosya adına sahip başka bir oyundan asla alınmıyor. Bir hile sorunu hiçbir zaman bir oyunun başlamasını engellemiyor
    en: Cheats you switch on or off during play are kept for the right game, never taken from another game whose file has the same name. A cheat problem never stops a game starting
  - type: fix
    label: RetroDB bir emülatörün ayar dosyasını daha güvenli yazıyor. Bağlantı olan bir ayar dosyası bağlantı olarak kalıyor, izinlerini koruyor ve okuyamadığı harfleri de koruyor; başarısız bir kayıt ise ortada gereksiz dosya bırakmıyor
    en: RetroDB writes an emulator's settings file more safely. A settings file that is a link stays a link, keeps its permissions, and keeps letters it cannot read, and a failed save leaves no stray file behind
  - type: fix
    label: Kuyrukta aşağı taşıdığınız, bir başkasıyla değiştirdiğiniz veya biri çalışırken sürdürdüğünüz toplu kazıma artık RetroDB yeniden başlarken kaybolmuyor; pano onu kaldığı yerden sunuyor. Değiştirilip çıkarılan bir kazıma artık yenisinin yanında çalışmaya devam etmiyor ve Sürdür'e iki hızlı tıklama işi bir kez başlatıyor
    en: A bulk scrape you move down the queue, swap with another or resume while one runs is no longer lost when RetroDB restarts; the dashboard offers it, from where it stopped. A swapped-out scrape no longer keeps running beside the new one, and two quick clicks on Resume start a job once
  - type: fix
    label: Tek bir oyunun hatası, örneğin ağın kopması, artık tüm Yapay Zeka Doldur çalıştırmasını veya Kutuyu ve Kılavuz Bölgelerini Düzelt çalıştırmasını bitirmiyor; o oyun başarısız sayılıyor ve gerisi devam ediyor. RetroDB'yi durdurmak artık çekirdek indirmelerini de temiz biçimde durduruyor
    en: One game's error, such as the network dropping, no longer ends a whole AI Fill run or a Fix Box and Manual Regions run; that game counts as failed and the rest go on. Stopping RetroDB now also stops core downloads cleanly
  - type: fix
    label: İstek Listesi öğeleri artık bir hata ya da yeniden başlatmadan sonra sonsuza kadar "kazınıyor" durumunda kalmıyor; aynı İstek Listesi için iki Tümünü Kazı çalıştırması da artık aynı anda çalışmıyor
    en: Wishlist items no longer stay on "scraping" forever after an error or a restart, and two Scrape All runs for the same wishlist no longer run at once
  - type: fix
    label: Bir betik ya da RetroDB'nin ikinci bir kopyası başlarken artık çalışan sunucunun işlerini yarıda kesilmiş olarak işaretlemiyor; aynı anda başlayan iki kopya da veritabanını artık bir sürüm geriye alamıyor
    en: A script or a second copy of RetroDB starting up no longer marks the running server's jobs as interrupted, and two copies starting at once can no longer set the database back a version
  - type: fix
    label: Bir PlayStation eşitlemesi başlatmak, Sony'ye giriş yaparken artık herkesin ilerleme çubuklarını bekletmiyor. Günlük PlayStation oturum canlı tutma işlemi artık girişi her gün değil, yalnızca 10 günlük sürenin sonuna yaklaşınca yeniliyor
    en: Starting a PlayStation sync no longer makes everyone's progress bars wait while it signs in to Sony. The daily PlayStation keep-alive now renews a sign-in only near the end of its 10 days, instead of every day
  - type: fix
    label: Bir kazıma, çalışırken yaptığınız değişikliğin üzerine artık yazmıyor ve adını bilmediği bir türü, modu ya da görünümü artık boşaltmıyor. Kayıtlı oyuncu sayısını da oyunun modlarına uydurmak için artık değiştirmiyor
    en: A scrape no longer writes over a change you make while it runs, and no longer empties a genre, mode or view it has no name for. It no longer changes a stored player count to match the game's modes
  - type: fix
    label: Yapay Zeka Doldur artık elle yazdığınız bilgileri, örneğin elle düzelttiğiniz bir yayıncıyı ya da türü değiştirmiyor; yalnızca kazınmış değerleri düzeltiyor. Bir değeri yalnızca farklı yazdığında, örneğin 4 oyuncuyu "1-4" olarak ya da aynı türleri başka sırada yazdığında, artık değişmiş diye bildirmiyor
    en: AI Fill no longer changes what you typed yourself, such as a publisher or genre you corrected by hand; it corrects only scraped values. It no longer reports a value as changed when it only wrote it differently, such as 4 players as "1-4" or the same genres in another order
  - type: fix
    label: Bir oyun için yazdığınız kontrolkücü korunuyor; konsolun varsayılan kontrolkücüsü artık yalnızca kazınmış ve yapay zeka değerlerinin yerini alıyor. Başka bir kurumun yapay zeka tahmininden dönüştürülen yaş derecelendirmesi de artık tahmin olarak işaretleniyor
    en: A controller you type for a game is kept; the console's default controller now replaces only scraped and AI values. An age rating converted from another board's AI guess is now marked as a guess too
  - type: fix
    label: Bir oyunun düzenleme penceresini kaydetmek artık pencerenin göstermediği alanları boşaltmıyor. Bir oyunun sayfasındaki Sıfırla artık söylediği her şeyi temizliyor; buna görünüm, sürüm ve diğer adlar da dahil. Başka bir oyun kullanmıyorsa oyunun resimlerini ve videolarını siliyor, kütüphane süzgeçlerini de hemen güncelliyor
    en: Saving a game's edit window no longer empties fields the window does not show. Reset on a game's page now clears everything it says it does, including the view, edition and other names, deletes the game's pictures and videos unless another game uses them, and updates the library filters straight away
  - type: fix
    label: Kazınmış Verileri Temizle artık görünümü, 2D ya da 3D bilgisini ve oyun yapısını da temizliyor. Yalnızca yılı olan bir oyunun CLZ içe aktarımı artık 1 Ocak yerine sadece yılı koruyor
    en: Clear Scraped Data now also clears the view, 2D or 3D, and game structure. A CLZ import of a game with only a year keeps just the year, not 1 January
  - type: security
    label: Steam eşitlemesi artık Ayarlar'daki Steam anahtarını hanedeki her üye için kullanmıyor. Kendi Steam anahtarı olmayan bir üye, hesabında yöneticinin Steam kütüphanesini ve başarımlarını görüyordu. Ayarlar'daki anahtar artık yalnızca yöneticilere hizmet ediyor
    en: Steam sync no longer borrows the Steam key from Settings for every household member. A member with no Steam key of their own was getting the admin's Steam library and achievements under their account. The key in Settings now serves admins only
  - type: fix
    label: How Long to Beat'in çok sayıda oyun için yaptığı arama artık emin olduğu süreleri kaydediyor. Önceden her kesin eşleşme başarısız oluyor ve hiçbir şey kaydedilmiyordu. RetroAchievements Yenile artık kazıma gibi her oyunun dosyasını da RetroAchievements listesiyle karşılaştırıyor; böylece oyun, elinizdeki sürümle birebir eşleşiyor
    en: How Long to Beat's lookup for many games now saves the times it is sure of. Before, every sure match failed and nothing was saved. RetroAchievements Refresh now also checks each game's file against RetroAchievements' list, as a scrape does, so a game is linked to the exact version you have
  - type: fix
    label: Bir arka plan işinin bittiğini bildiren mesaj yeniden görünüyor; işin ilerleme kutusu da sunucu işi yeniden başlatmadan sonra devraldığında bunu fark ediyor. Önceden ikisi de hiç görünmüyordu
    en: The message that a background job has finished shows again, and a job's progress box notices when the server picks the job up after a restart. Before, neither ever appeared
  - type: fix
    label: 'PlayStation kupaları: elle bağladığınız bir oyun tam eşitlemeden sonra bağlı kalıyor; eşitleme de artık bir oyunu devam oyunuyla, örneğin "Doom"u "Doom Eternal" ile bağlamıyor. PlayStation oyunlarını içe aktarmak artık Steam ve Xbox içe aktarmaları gibi kütüphanenizde olan bir oyunu bağlıyor; böylece kupalar o oyunda görünüyor'
    en: 'PlayStation trophies: a game you linked by hand stays linked after a full sync, and a sync no longer links a game to its sequel, such as "Doom" to "Doom Eternal". Importing PlayStation games now links a game already in your library, as Steam and Xbox imports do, so its trophies show on it'
  - type: fix
    label: Xbox artık girişi kendini yeniledikten sonra oyuncu etiketinizi Bilinmiyor olarak göstermiyor; yavaş ya da başarısız bir bağlantı da sizi artık Xbox'tan çıkarmıyor. Bunu yalnızca Microsoft girişi reddedince yapıyor
    en: Xbox no longer shows your gamertag as Unknown after its sign-in renews itself, and a slow or failed connection no longer signs you out of Xbox. Only Microsoft refusing the sign-in does that
  - type: fix
    label: İki kişi artık aynı adlı bir etikete sahip olabiliyor; önceden ikincisi hata veriyordu. Oturum açmış her kullanıcı artık kendi RPCS3 kupalarını yeniden tarayabiliyor; önceden yalnızca yönetici yapabiliyordu ve diğer herkes RetroDB yeniden başlayana kadar eski kupaları görüyordu
    en: Two people can now each have a tag of the same name; before, the second one failed with an error. Any signed-in user can now rescan their own RPCS3 trophies; before, only an admin could, and everyone else saw old trophies until RetroDB restarted
  - type: security
    label: Girişleriniz gizli kalıyor. Veritabanı yedeklemeleri artık bilgisayardaki diğer hesaplarca okunamıyor ve başarısız bir yedekleme artık bir öncekini silmiyor. Bir kullanıcıyı silmek ya da kapatmak, onu DuckStation ve PCSX2'deki RetroAchievements oturumundan da çıkarıyor. Oyuncunun kendi menüsünden kaydedilen bir RetroAchievements girişi artık sonraki oyuncuya geçmiyor. Günlükler ve kayıtlı iş hataları RetroAchievements jetonlarını gizliyor, başka bir üyenin PlayStation hatası yalnızca ona gösteriliyor ve eski düz metin PlayStation ve Xbox giriş dosyaları kaldırılıyor
    en: Your sign-ins stay private. Database backups can no longer be read by other accounts on the computer, and a failed backup no longer deletes the one before it. Deleting or switching off a user also signs them out of RetroAchievements in DuckStation and PCSX2. A RetroAchievements sign-in saved from the player's own menu no longer carries over to the next person who plays. Logs and saved job errors hide RetroAchievements tokens, another member's PlayStation error is shown only to them, and old plain-text PlayStation and Xbox sign-in files are removed
  - type: fix
    label: RetroDB'nin kendi denetimleri artık çalışırken kütüphanenize dokunamıyor. Her zaman veritabanının, resimlerin ve ayarların geçici bir kopyasını kullanıyorlar; bunlardan biri gerçek dosyalarınızı gösteriyorsa başlamayı reddediyorlar
    en: RetroDB's own checks can no longer touch your library while they run. They always use a throwaway copy of the database, pictures and settings, and refuse to start if any of them points at your real files
  - type: fix
    label: Yetim dosyaları temizle artık İstek Listenizin resimlerini silmiyor. Bir oyunu açmak, bulamadığı ekran görüntülerini artık unutturmuyor. Önceden resim sürücüsü takılı değilken açtığınız her oyun tüm ekran görüntüsü listesini kaybediyordu; artık liste korunuyor ve eksik bir resim yalnızca gizleniyor
    en: Clean orphaned files no longer deletes your wishlist's pictures. Opening a game no longer makes it forget screenshots it cannot find. Before, with the picture drive unplugged, every game you opened lost its whole screenshot list; now the list is kept, and a missing picture is only hidden
  - type: fix
    label: Yarıda başarısız olan bir video ya da kılavuz indirmesi artık oyunun zaten sahip olduğu kopyaya zarar vermiyor ve başarısız bir indirme medya klasöründe gizli yarım bir dosya bırakmıyor. Arka plandaki büyütücü artık eski bir resmi, bu arada indirilen yeni resmin üzerine kaydetmiyor. WebP'ye Dönüştür, bir resmi paylaşan her oyunun ona bağlı kalmasını sağlıyor ve resim klasörleri dışındaki hiçbir dosyaya dokunmuyor
    en: A video or manual download that fails part-way no longer damages the copy the game already had, and a failed download no longer leaves a hidden half-file in the media folder. The background upscaler no longer saves an old picture over a newer one downloaded meanwhile. Convert to WebP keeps every game that shares a picture pointing at it, and never touches a file outside the picture folders
  - type: fix
    label: Bir oyunu ya da İstek Listesi öğesini silmek artık resimlerini, videolarını ve kılavuzlarını da siliyor; ancak başka bir oyunun ya da İstek Listesi öğesinin hâlâ kullandıklarını koruyor. Kaydedilen resimler yeniden bilgisayardaki diğer hesaplarca okunabiliyor ve Resimleri Yeniden Boyutlandır, kaydedemediği bir resmi tamamlandı değil başarısız sayıyor
    en: Deleting a game or a wishlist item now deletes its pictures, videos and manuals too, but keeps any another game or wishlist item still uses. Saved pictures can be read by other accounts on the computer again, and Resize Images counts a picture it could not save as failed, not as done
  - type: fix
    label: Yinelenen Bulucu artık çalışan bir dosyayı silmek üzere önermiyor. Ada göre ararken bir oyunun .cue ve .bin kopyalarını artık birbirinin kopyası saymıyor. Bir oyunun iki sürümünün paylaşabildiği disk iz dosyasını hiç önermiyor. Bir çalma listesinde yer alan diski silmiyor. Dosyasını sildiğiniz oyun artık tuttuğunuz kopyaya geçiyor; böylece kütüphanede kalıyor
    en: Duplicate Finder no longer offers a working file for deletion. Looking by name, it no longer calls a game's .cue and .bin copies of each other. It never offers a disc's track file, which two versions of a game can share. It will not delete a disc that a playlist lists. A game whose file you delete now moves to the copy you keep, so it stays in the library
  - type: fix
    label: Çok Diskli Düzenle artık var olan bir çalma listesinin ya da oyunun klasöründeki bir dosyanın üzerine yazmıyor; durup hangisi olduğunu söylüyor. Oluşturduğu çalma listesi her diskin iz dosyalarını değil .cue dosyasını listeliyor. Dosyaları taşınan oyunlar artık klasöre onları takip ediyor; böylece Eksik ROM'ları temizle onları artık kaldırmıyor
    en: Organize Multi-Disc no longer writes over an existing playlist or a file already in the game's folder; it stops and says which. The playlist it makes lists each disc's .cue, not its track files. Games whose files it moves now follow them into the folder, so Clean missing ROMs no longer removes them
  - type: fix
    label: '"Orijinalleri sil" ile CHD''ye dönüştürmek artık diskin iz dosyalarını da siliyor, ancak başka bir .cue''nun hâlâ kullandığı izi koruyor. Oyun ve eski diski listeleyen çalma listeleri artık yeni .chd dosyasını gösteriyor. Bir oyunun dosyasını yeniden adlandırmak artık onu listeleyen çalma listesini güncelliyor ve bir .cue''nun ihtiyaç duyduğu iz dosyası yeniden adlandırılamıyor. Bir zip''ten dosya kaldırmak, adı [ ya da ] içerse bile yalnızca seçtiğiniz dosyaları kaldırıyor. Ekran Görüntüsü Yinelenenleri yalnızca taramasının bulduğu kopyaları siliyor ve her zaman birini tutuyor'
    en: Converting to CHD with "delete originals" now deletes the disc's track files too, but keeps a track another .cue still uses. The game and any playlist that listed the old disc now point at the new .chd. Renaming a game's file now updates the playlist that lists it, and a track file a .cue needs cannot be renamed. Removing files from a zip removes only the files you picked, even when a name holds [ or ]. Screenshot Dedup deletes only the copies its scan found, and always keeps one
  - type: fix
    label: Bir oyunun sayfasındaki How Long to Beat, yazdığınızı arıyor. Önceden bulamadığı bir başlık yerine oyunun diğer adlarını arıyordu ve hayran yapımı bir yeniden yapım gibi farklı bir oyun önerebiliyordu. Kutuda oyunun kendi adı varsa diğer adları yine deniyor
    en: How Long to Beat on a game's page searches for what you type. Before, a title it could not find made it search the game's other names instead, and it could offer a different game, such as a fan remake. It still tries the other names when the box holds the game's own name
  - type: fix
    label: Yardım kılavuzundaki How Long to Beat adımları artık ekranla uyuşuyor. Bir listeden eşleşme seçmenizi söylüyorlardı; sayfa ise Kaydet ve İptal ile tek bir eşleşme gösteriyor. PlayStation yardımı artık girişin yaklaşık iki ay sürdüğünü söylemiyor, çünkü RetroDB kendi kendine yeniden giriş yapıyor. Çevrilmiş 20 kılavuzun hepsi her iki değişikliği de içeriyor
    en: The help manual's How Long to Beat steps match the screen. They said to pick a match from a list; the page shows one match with Save and Cancel. The PlayStation help no longer says the sign-in lasts about two months, since RetroDB signs in again by itself. All 20 translated manuals carry both changes
  - type: fix
    label: Her harf çubuğu artık Tümü düğmesiyle başlıyor. Kütüphane, konsol ve PSN Kupaları sayfalarında bir harf seçmek yalnızca o harfin oyunlarını gösteriyordu ve geri kalanını getirecek bir düğme yoktu. Diğer başarım sayfalarında Tümü ilk oyuna dönüyor
    en: Every letter bar now starts with an All button. On the Library, console and PSN Trophies pages, picking a letter shows only that letter's games, and before there was no button to bring the rest back. On the other achievement pages, All goes back to the first game
  - type: fix
    label: Ayarlar'a yapıştırdığınız yeni PlayStation giriş jetonu artık hemen kullanılıyor. Önceden RetroDB eski giriş bitene kadar onu kullanmaya devam ediyordu ve Kaydet ve Bağlantıyı Sına eski girişi çalışıyor diye bildiriyordu. Sony'nin reddettiği bir jeton artık çalışan bir jetonun yerini almıyor
    en: A new PlayStation sign-in token you paste in Settings is now used straight away. Before, RetroDB kept using the old sign-in until it ran out, and Save & Test Connection reported that old sign-in as working. A token Sony refuses no longer replaces one that works
  - type: enhancement
    label: 'Ayarlar''daki PlayStation girişini sürdürmek daha kolay. Pano artık işlem yapmanız gerekmeyen günleri geriye saymıyor, çünkü RetroDB kendi kendine yeniden giriş yapıyor; yalnızca Sony kayıtlı jetonunuzu reddedince kırmızıya dönüyor. Buraya yapıştır düğmesi artık tarayıcının panonuzu okumak için izin istemesine yol açmıyor: imleci Ctrl+V için kutuya koyuyor. Adımlar artık hâlâ çalışan bir jetonu değiştirirken önce PlayStation''dan çıkış yapmanızı söylüyor ve mesajları çevrilebiliyor'
    en: 'The PlayStation sign-in in Settings is easier to keep going. The banner no longer counts down days you never had to act on, because RetroDB signs in again by itself; it turns red only when Sony refuses your saved token. The Paste here button no longer makes the browser ask to read your clipboard: it puts the cursor in the box for Ctrl+V. The steps now say to sign out of PlayStation first when you replace a token that still works, and their messages can be translated'
  - type: enhancement
    label: '"Ayarlar kaydedildi" ya da "Bu liste silinsin mi?" gibi açılır mesajlar ve soru kutuları artık her sayfada çevrilebiliyor. Önceden çoğu, seçtiğiniz dil ne olursa olsun İngilizce kalıyordu'
    en: Pop-up messages and question boxes, such as "Settings saved" or "Delete this list?", can now be translated on every page. Before, most of them stayed in English whatever language you chose
  - type: enhancement
    label: '"NPSSO''nuzun süresi dolmuş olabilir" gibi bir PlayStation girişinin neden başarısız olduğunu söyleyen mesajlar artık çevrilebiliyor'
    en: The messages that say why a PlayStation sign-in failed, such as "Your NPSSO may have expired", can now be translated
  - type: fix
    label: Her dildeki yardım kılavuzu artık İngilizce olanla uyuşuyor. Her Yerde Ara, Bir Başlığı Koruma, MAME Adları ve kutunun arkası bölümlerini kazandı; geride kalmış eski paragraflar da güncellendi
    en: The help manual in every language now matches the English one. It gains Search Anywhere, Keeping a Title, MAME Names and the back of the box, and older paragraphs that had fallen behind are up to date
  - type: fix
    label: Almanca, Afrikaanca ve İspanyolcada, oyunun kapağındaki Geri düğmesi artık "geri git" değil, kutunun arkasını söylüyor
    en: In German, Afrikaans and Spanish, the Back button on a game's cover now says the back of the box, not "go back"
  - type: feature
    label: Oyna'ya basmak artık oyun başlarken ekranı, oyunun logosunu arka plan resminin üzerinde göstererek dolduruyor; logosu yoksa adını büyük harflerle gösteriyor. Oyunun penceresi açılınca ya da Esc'ye bastığınızda veya tıkladığınızda kendiliğinden kayboluyor
    en: Pressing Play now fills the screen with the game's logo on its background picture while the game starts, or its name in large letters when it has no logo. It goes away by itself when the game's window opens, or when you press Esc or click
  - type: feature
    label: 'Döndürülebilir 3D kutu artık gerçek bir PS5 kutusunun şekline sahip: yuvarlak köşeler ve kenarlar, kapağı çevreleyen yükseltilmiş çıkıntı, iki yarının buluştuğu çizgi ve açılan tarafta parmak girişi. Şekli yazan bir Slipcase sürümünden bir kutu dosyası gerekiyor; almak için kutuyu yeniden içe aktarın. Diğer kutular eskisi gibi görünüyor'
    en: 'The turnable 3D box now has the real shape of a PS5 case: rounded corners and edges, the raised lip round the cover, the line where the two halves meet, and the finger slot in the opening side. It needs a box file from a Slipcase version that writes the shape; import the box again to get it. Other boxes look as before'
  - type: enhancement
    label: RetroAchievements Yenile, Ayarlar'dan RetroAchievements sayfasına taşındı ve artık Başarımlı Oyunları Bul olarak adlandırılıyor. Oradaki her düğmenin artık ne yaptığını anlatan bir satırı var; böylece Oyunları Bul ile İlerlemeyi Eşitle kolayca ayırt ediliyor. Henüz bağlı oyun yokken sayfa, yöneticiye sonraki sekmeye geçmek yerine Bul düğmesini gösteriyor
    en: Refresh RetroAchievements moved from Settings to the RetroAchievements page, and is now called Find Games with Achievements. Every button there now has a line saying what it does, so Find Games and Sync Progress are easy to tell apart. With no games linked yet, the page shows an admin the Find button instead of moving on to the next tab
  body: "<ul>\n  <li><strong>4.0, RetroDB'nin son büyük web sürümüdür.</strong> Yeni sürümler Windows, Linux ve macOS için bir masaüstü uygulaması ve bir Android uygulaması olacak ve mevcut Kütüphanenizi açacak. Web sürümü indirilebilir kalır, hata düzeltmeleri almaya devam eder ve ara sıra yeni bir özellik de gelir. Masaüstü uygulaması çıktığında Ayarlar → Güncellemeler bölümünde bağlantısı yer alacak.</li>\n  <li><strong>Yardım kılavuzu her dilde güncel.</strong>\n    Yalnızca İngilizce kılavuzda bulunan bölümler artık çevrildi.</li>\n</ul>\n"
  body_en: "<ul>\n  <li><strong>4.0 is the last big web version of RetroDB.</strong> New versions\n    will be a desktop app for Windows, Linux and macOS, and an Android app,\n    and will open your existing library. The web version stays available\n    and still gets bug fixes, and now and then a new feature.\n    Settings → Updates links to the desktop app when it is out.</li>\n  <li><strong>The help manual is up to date in every language.</strong>\n    Sections that were only in the English manual are now translated.</li>\n</ul>\n"
- version: 3.35.4
  date: '2026-11-03'
  tags:
  - type: fix
    label: Bir oyundan sildiğiniz ekran görüntüsü artık silinmiş kalır. Daha önce bir sonraki kazıma onu ES-DE'den geri kopyalayabiliyor ya da çevrimiçi bir kaynaktan yeniden indirebiliyordu. Yinelenen Ekran Görüntüleri aracında fazladan bir kopyayı silmek bu kapsamda değildir, çünkü resmi bir kez saklarsınız
  - type: feature
    label: 'Oyunlar artık logo alıyor: kazıma logoyu ES-DE, ScreenScraper, TheGamesDB, IGDB ve Steam''den kaydeder, oyun sayfası da onu başlığın üstünde ya da eksik kutunun yerinde gösterir. Logoyu Düzenle penceresinden yükleyebilir veya silebilirsiniz. Daha önce kazıdığınız oyunların logolarını doldurmak için Eksikleri Doldur ile toplu kazıma yapın'
  - type: fix
    label: IGDB artık bir oyunun logosunu sayfa arka planı olarak vermiyor
  - type: feature
    label: 'Oyunlar artık kutularının arka yüzünü alıyor: kazıma onu ES-DE, ScreenScraper ve TheGamesDB''den kaydeder, oyun sayfasındaki kapağın üzerindeki Arka düğmesi de onu gösterir. Büyütmek için arka yüze tıklayın. Arka yüzü Düzenle penceresinden yükleyebilir veya silebilirsiniz. Arka yüzler oyun her kazındığında doldurulur; Eksikleri Doldur bir oyunu yalnızca arka yüzü için yeniden kazımaz'
  - type: fix
    label: TheGamesDB'de ön kapağı olmayan bir oyun artık kutunun arka yüzünü kapak olarak almıyor
  - type: fix
    label: Toplu kazıma çalışırken Ayarlar'dan bir kazıyıcıyı kapatırsanız, bulunamayan oyunların sayısı artık bir sonraki oyundan itibaren doğru olur. Daha önce bir oyun bunun yerine durdurulmuş olarak sayılabiliyordu
  - type: enhancement
    label: Emülatörü ayarlanmamış bir sistemde Oyna düğmesi gri olur. Nedenini görmek için üzerine gelin ya da emülatör ayarlanmadığını söyleyen bir kutu için tıklayın. Daha önce düğmenin yanında bir satır metin vardı
  body: "<ul>\n  <li><strong>Oyunlar logo alıyor.</strong> Kazıma her oyunun\n    logosunu kaydeder, oyun sayfası da onu başlığın üstünde ya da\n    eksik kutunun yerinde gösterir. Daha önce kazıdığınız oyunların logolarını\n    doldurmak için Eksikleri Doldur ile toplu kazıma yapın.</li>\n  <li><strong>Oyunlar kutularının arka yüzünü alıyor.</strong> Oyun\n    sayfasındaki kapağın üzerindeki Arka düğmesi onu gösterir, büyütmek için\n    tıklayabilirsiniz. Arka yüzler oyun her kazındığında doldurulur.</li>\n  <li><strong>Silinen ekran görüntüsü silinmiş kalır.</strong> Sonraki kazıma\n    onu artık geri kopyalamaz ya da yeniden indirmez.</li>\n  <li><strong>Oyna, neden başlamadığını söyler.</strong> Emülatörü\n    ayarlanmamış bir sistemde Oyna düğmesi gri olur ve nedenini belirtir.</li>\n</ul>\n"
- version: 3.35.3
  date: '2026-11-02'
  tags:
  - type: feature
    label: 'ROM Araçları''nda yeni MAME Adları aracı: MAME oyunları gerçek adlarını, yıllarını ve yapımcılarını MAME''nin kendi listesinden alır, dosyalar ise kısa adlarını korur. Ardından bir kazıma her oyunu bulur ve MAME listesini kategoriye göre süzebilirsiniz, örneğin slot makinelerini dışarıda bırakabilirsiniz. BIOS setleri listede gizlenir'
  - type: fix
    label: ROM Raporları artık MAME dosyalarını yeniden adlandırmayı önermiyor, çünkü adı değişen dosya MAME'de çalışmaz
  - type: fix
    label: Ayarlar artık bir Xbox uygulaması kaydedilmeden önce Microsoft'un ne istediğini söylüyor. Bu yüzden Xbox girişi test edilemedi
  - type: enhancement
    label: Ayrı Resmî Adlar kartı Toplu Yapay Zeka Doldur'dan kaldırıldı, çünkü doldurmadaki Resmî ad anahtarı bu işi zaten yapıyor
  - type: fix
    label: Sony kayıtlı bir PlayStation girişini reddettiğinde, panel ve Ayarlar bunu belirtip yeniden bağlamanızı ister. Önceden günlükte her sunucu başlangıcında anlamsız bir hata görünüyordu ve size hiçbir şey söylenmiyordu
  - type: feature
    label: Steam'den içe aktarma artık her oyunun açıklamasını, emek verenleri, Metacritic puanını, yaş derecelendirmelerini, oyun modlarını, kutusunu, arka planını ve ekran görüntülerini mağaza sayfasından arka planda dolduruyor. Türü ve çıkış tarihi için oyunu kazıyın
  - type: feature
    label: Steam eşitlemesi artık oynama sürenizi ve son oynama zamanınızı koruyor, oyun sayfası da bunları gösteriyor
  - type: fix
    label: Steam içe aktarma sayfasındaki Kütüphaneyi Getir, kayıtlı Steam anahtarı olan yönetici için artık çalışıyor. Önceden Steam'e anahtarın gizli biçimini gönderiyordu ve sayfa yanlışlıkla profilinizi Herkese Açık yapmanızı söylüyordu
  - type: fix
    label: Kütüphanenizde aynı adla zaten bulunan bir Steam veya Xbox oyunu, içe aktarırken artık o oyuna bağlanıyor ve başarımları eşitleniyor. Önceden atlanıyordu ve hiç bağlanmıyordu
  - type: fix
    label: Steam, Xbox ve PlayStation'dan içe aktarılan oyunlar artık hemen doğru sıralanıyor, örneğin Final Fantasy IX, Final Fantasy X'ten önce gelir. Steam'in ticari marka işaretleri de adlardan çıkarıldı
  - type: feature
    label: RetroAchievements'ın düz dosya özeti kullandığı Mega Drive ve Game Boy gibi sistemlerde, oyun sayfası kopyanızın başarım kazandırıp kazandırmadığını söylüyor ve bu özet doğru oyuna bağlanıyor. Bunu doldurmak için RA Yenile'yi çalıştırın
  - type: fix
    label: Kazıma artık adla aramadan önce ScreenScraper'a tam dosyanızı soruyor, böylece benzer adlı bir oyun yerine sizin oyununuzu buluyor. Kendi işaretlediğiniz sonuçlar yine önceliklidir
  - type: enhancement
    label: Görsel Boyutlandırma ilerleme kutusu artık her resmin ait olduğu oyunu ve sistemi gösteriyor
  - type: feature
    label: Kazıma artık ScreenScraper ve TheGamesDB'den başlık ekranlarını, IGDB ve TheGamesDB'den daha fazla resmî adı (örneğin oyunun Japonca adı) ve IGDB'den oyunun çıktığı diğer konsolları getiriyor
  - type: feature
    label: Kullanıcı puanı olmayan bir oyun artık, varsa ES-DE koleksiyonunuzdaki derecelendirmeyi alıyor
  - type: feature
    label: Oyun sayfası, bir HowLongToBeat sonucunu kaç oyuncunun süreye vurduğunu söylüyor ve sayfasına bağlantı veriyor. Bundan önce kaydedilen sonuçlarda bunlar, bir sonraki aramanızda görünür
  - type: feature
    label: RetroAchievements sayfası bir oyunu kaç kişinin oynadığını ve her başarımı bunların yüzde kaçının kazandığını gösteriyor
  - type: fix
    label: ROM Araçları klasör gezgini, başlanacak klasörü yoksa hata vermek yerine ROM klasörünüzde açılıyor. IGDB'den gelen bozuk bir yanıt artık yalnızca o tek ayrıntıya mal oluyor, IGDB'nin oyun için gönderdiği her şeye değil
  - type: fix
    label: ScreenScraper'ın günlük sınırı artık RetroDB'nin daha sonraya kadar sormasını durduruyor, toplu kazıma da bunu söyleyip diğer kaynaklarıyla devam ediyor. Önceden dolmuş bir sınır "oyun bulunamadı" gibi görünüyordu ve çağrılar bütün gece sürüyordu
  - type: fix
    label: Bir servis sınırdayken hiçbir kaynağın yanıtlayamadığı oyun artık kazınmış olarak işaretlenmiyor, böylece sonraki çalıştırma yeniden dener
  - type: fix
    label: Bir TheGamesDB anahtarı ayını doldurduğunda RetroDB diğer anahtarınıza geçiyor, ikisi de bitince sormayı bırakıyor
  - type: fix
    label: RAWG'ın aylık sınırı da artık RetroDB'nin sormasını durduruyor ve IGDB saniyede dört istek sınırında tutuluyor
  - type: fix
    label: HowLongToBeat toplu araması, site çok fazla istek aldığını söylediğinde artık bir iletiyle sona eriyor ve siteye giden her istek aralıklandırılıyor
  - type: fix
    label: Kutu ve Kılavuz Bölgelerini Düzelt artık ScreenScraper'ın tanımadığı art arda 25 oyundan sonra bırakmıyor. Yalnızca ScreenScraper sınırına ulaşıldığını söylediğinde duruyor
  - type: fix
    label: Oyun sayfasında her yaş derecelendirmesi artık Yapay Zeka tahmini etiketinin üzerinde ortalanmış duruyor
  - type: fix
    label: Ayarlar'daki TheGamesDB hakkı artık hakkınızı harcamayan denetimi kullanıyor ve servis vermediğinde uydurma bir sıfırlama tarihi göstermiyor
  body: |
    <ul>
      <li><strong>MAME oyunları gerçek adlarına kavuşuyor.</strong> ROM Araçları'ndaki yeni MAME Adları
        aracı adları, yılları ve yapımcıları MAME'in kendi listesinden alır.
        Dosyalar kısa adlarını korur, çünkü MAME'in buna ihtiyacı vardır. MAME listesini
        kategoriye göre süzebilirsiniz, BIOS setleri ise gizlenir.</li>
      <li><strong>Steam'den içe aktarma çok daha fazlasını getiriyor.</strong> Her oyun; açıklamasını,
        emekçilerini, Metacritic puanını, yaş derecelendirmelerini, oyun modlarını ve
        görsellerini mağaza sayfasından doldurur. Eşitleme, oynama sürenizi ve en son ne zaman
        oynadığınızı korur. Kütüphanenizde aynı adla zaten bulunan bir oyun artık
        ona bağlanır, böylece başarımları eşitlenir.</li>
      <li><strong>Kazıma işlemi tam oyununuzu buluyor.</strong> Kazıma, ada göre aramadan önce
        ScreenScraper'a tam dosyanızı sorar. Kazıma ayrıca başlık ekranlarını, daha fazla
        resmi adı ve bir oyunun çıktığı diğer konsolları da getirir.</li>
      <li><strong>RetroAchievements kopyanızı tanıyor.</strong> Mega Drive ve Game Boy gibi
        düz dosya karması kullanan sistemlerde oyun sayfası,
        kopyanızın başarım kazandırıp kazandırmadığını söyler. Bunu doldurmak için RA Yenile'yi çalıştırın.
        RetroAchievements sayfası ayrıca bir oyunu kaç kişinin oynadığını
        ve her başarımı bunların yüzde kaçının kazandığını gösterir.</li>
      <li><strong>Çevrimiçi sınırlara uyuluyor.</strong> ScreenScraper,
        TheGamesDB veya RAWG sınırına ulaştığında RetroDB daha sonrasına kadar sormayı bırakır
        ve toplu kazıma diğer kaynaklarıyla devam eder. O sırada hiçbir kaynağın
        yanıt veremediği oyun, bir sonraki çalıştırmada yeniden denenir.</li>
      <li><strong>Reddedilen PlayStation girişi artık belirtiliyor.</strong> Sony kayıtlı bir girişi
        reddettiğinde panel ve Ayarlar artık yeniden bağlamanızı ister.</li>
      <li><strong>Resmi Adlar taşındı.</strong> Ayrı kartı Toplu Yapay Zeka Doldur'dan kalktı,
        çünkü doldurmadaki Resmi ad anahtarı aynı işi yapar.</li>
    </ul>
