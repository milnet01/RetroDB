  body: |
    <ul>
      <li><strong>RetroDB se actualiza solo.</strong> Cuando sale una versión
        nueva, los administradores la ven en el Panel y en Ajustes &gt;
        Sistema &gt; Actualizaciones, con sus novedades. Descargar
        actualización la obtiene y comprueba que es exactamente el archivo
        publicado; Instalar y reiniciar hace una copia de seguridad de tu
        base de datos, coloca la versión nueva y reinicia. Si la versión nueva
        no arranca, RetroDB vuelve por sí solo a la anterior y explica por
        qué. Tus juegos, ajustes, imágenes y registros no se tocan. RetroDB
        busca actualizaciones una vez al día; puedes desactivarlo. Una copia
        ejecutada desde git, o por un gestor de procesos, recibe el aviso de
        las actualizaciones pero no se actualiza.</li>
      <li><strong>Obtén RetroArch desde dentro de RetroDB.</strong> Ajustes
        &gt; Emuladores tiene una nueva sección Jugar en RetroDB. Pulsa Obtener
        RetroArch y RetroDB descarga el RetroArch oficial de libretro,
        comprueba que la descarga es exactamente el archivo esperado y lo
        prepara como RetroArch (RetroDB), con sus propios ajustes y partidas
        guardadas, separado de cualquier RetroArch que ya uses. Después
        obtiene el mejor núcleo para cada sistema la primera vez que juegas.
        Funciona en Linux y Windows; macOS aún no se ha probado.</li>
      <li><strong>Siguiente disco funciona en los juegos que se juegan en
        RetroDB.</strong> En un juego de varios discos, el botón Siguiente
        disco llega ahora al propio RetroArch de RetroDB sin configurar nada.
        RetroArch escucha las órdenes de RetroDB solo mientras se ejecuta un
        juego así, y en Windows y macOS mientras se ejecuta cualquier
        juego.</li>
      <li><strong>Las tarjetas de juego se alinean en un móvil y al cambiar el
        tamaño de la ventana.</strong> En un móvil, la Biblioteca y las
        páginas de consola mostraban una tarjeta y luego un largo hueco vacío;
        ahora las tarjetas se apilan una debajo de otra. Al estrechar o
        ensanchar la ventana, las tarjetas se reorganizan en lugar de quedarse
        en las columnas antiguas.</li>
      <li><strong>Las clasificaciones y el número de jugadores scrapeados son
        más precisos.</strong> Las clasificaciones por edades de IGDB para
        CERO, USK, GRAC, ClassInd y ACB ahora se leen correctamente, así que un
        juego calificado CERO Z o USK 18 recibe esa clasificación. TheGamesDB,
        RAWG, IGDB y ES-DE ya no suponen «1 jugador» cuando no lo saben; una
        importación de ES-DE ya no sobrescribe el número de jugadores ni los
        modos de juego que hayas puesto. TheGamesDB ya no guarda un número en
        lugar del nombre de una distribuidora o desarrolladora tras una
        búsqueda fallida.</li>
      <li><strong>ScreenScraper conserva sus datos cuando es la fuente
        principal.</strong> Su título, descripción, fecha, desarrolladora,
        distribuidora y jugadores se conservan en cada scrapeo, no solo los
        primeros minutos después de una búsqueda. Los vídeos y manuales
        descargados reciben un nombre de archivo adecuado.</li>
      <li><strong>Borrar datos scrapeados vuelve a poner el nombre del archivo
        como título.</strong> Borraba los datos pero dejaba el título
        scrapeado.</li>
      <li><strong>La actualización de RetroAchievements de una consola vuelve
        a funcionar.</strong> Fallaba con un error cada vez.</li>
      <li><strong>El buscador de capturas duplicadas funciona en la
        aplicación descargada.</strong> Allí no encontraba ninguna captura, y
        borrar un duplicado dejaba el archivo en el disco.</li>
      <li><strong>Las contraseñas de ScreenScraper se ocultan, y el último
        administrador sigue siéndolo.</strong> Ajustes muestra ahora tus
        contraseñas de ScreenScraper ocultas, como tus otras claves. La única
        cuenta de administrador ya no se puede pasar a editor ni desactivar,
        con lo que nadie habría podido gestionar RetroDB.</li>
      <li><strong>Las tareas interrumpidas solo se ofrecen a quien puede
        ejecutarlas.</strong> El aviso de tarea interrumpida del Panel ahora
        muestra una tarea solo a quien puede iniciarla, por ejemplo un
        scrapeo masivo solo a editores y administradores. Las demás cuentas
        ya no lo ven y ya no pueden descartarlo.</li>
      <li><strong>Logotipos de consola importados, nombres raros en Ajustes y
        discos extra.</strong> En la aplicación descargada, Actualizar
        logotipos ahora encuentra los logotipos de consola traídos con
        Importar desde ES-DE y los prefiere a los incluidos. Un nombre de
        mando, consola o copia de seguridad con caracteres como &lt; o unas
        comillas ya no rompe la página de Ajustes. Desmarcar un disco extra lo
        separa del todo, así que ya no cuenta como disco extra de su antiguo
        juego.</li>
      <li><strong>Trofeos, importaciones de biblioteca y herramientas de
        mantenimiento más rápidos.</strong> La página Trofeos, las
        importaciones de biblioteca de Steam, Xbox y PlayStation, los trofeos
        de coleccionista, Calcular almacenamiento y el análisis de multimedia
        sin usar trabajan mucho menos en una biblioteca grande. Las ventanas
        de progreso de las tareas siguen actualizándose cuando el servidor
        está ocupado, y las tareas de HowLongToBeat y de títulos alternativos
        ya no frenan otros cambios mientras se ejecutan.</li>
      <li><strong>Mira lo bien que funciona cada juego de PS3 en
        RPCS3.</strong> Los juegos de PS3 de la Biblioteca, de la página de
        PlayStation 3 y de la página del juego muestran el estado de
        compatibilidad de RPCS3: Jugable, En el juego, Intro, Cargable o Nada,
        con la fecha de la última prueba. RetroDB lo lee del RPCS3 de tu
        equipo, así que en RPCS3 elige Manage &gt; Databases &gt; Download
        Compatibility Database una vez, y otra vez cuando quieras resultados
        más recientes. Solo se muestran los juegos con una ROM en el disco;
        los importados no. RetroDB ahora también lee el ID del juego de las
        carpetas de PSN y de juegos instalados, y de carpetas y archivos cuyo
        nombre lo lleva, como [BLUS30443].</li>
      <li><strong>Cifras de ventas de tus juegos.</strong> Cuando la IA
        rellena huecos durante un scrapeo, y cuando pulsas Rellenar con AI,
        ahora también se le pregunta cuántas copias vendió el juego en su
        consola, según cifras publicadas y gratuitas como los informes de la
        distribuidora, las listas de más vendidos de las plataformas, Famitsu,
        Wikipedia y VGChartz. La página del juego muestra el número. Un juego
        sin cifra publicada se queda en blanco en lugar de recibir una
        estimación.</li>
      <li><strong>El interruptor Franquicia / Serie funciona en la página del
        juego.</strong> En la ventana de edición de la página del juego, hacer
        clic en el interruptor Franquicia / Serie de un juego marcado como
        Independiente no hacía nada, así que no se podía poner en una serie.
        Ahora cambia, y también el interruptor Disponibilidad en
        plataformas.</li>
      <li><strong>Todas las pestañas de Logros tienen el mismo
        ancho.</strong> RetroAchievements, RPCS3, PSN, Steam y Xbox ajustaban
        la página a sus propias tarjetas, así que la página cambiaba de ancho
        al pasar de una pestaña a otra. Ahora comparten un mismo ancho.</li>
      <li><strong>RetroDB encuentra los ajustes de RPCS3 en Windows y
        macOS.</strong> En Windows, RPCS3 guarda sus ajustes junto a
        rpcs3.exe, y RetroDB ahora busca ahí y en una carpeta portátil, así
        que se encuentran los ajustes por juego y la lista de
        compatibilidad.</li>
      <li><strong>Rellenar con AI funciona con juegos que tienen puntuación
        pero no clasificación por edades.</strong> Rellenar con AI podía fallar
        con un error en un juego así al calcular su clasificación por
        edades.</li>
      <li><strong>Las etiquetas de las tarjetas de juego siguen tu
        idioma.</strong> El estado de finalización y las descripciones
        emergentes de puntuación de las tarjetas de la Biblioteca estaban
        siempre en inglés.</li>
      <li><strong>Fechas de lanzamiento de cada región.</strong> Cuando la IA
        rellena huecos durante un scrapeo, y cuando pulsas Rellenar con AI,
        ahora también se le pregunta la fecha en que el juego salió en cada
        región, como Norteamérica, Europa y Japón. La página del juego y la
        vista rápida las muestran, de la más antigua a la más reciente, con
        fechas y nombres de región en tu idioma. La fecha de lanzamiento
        propia del juego no cambia.</li>
      <li><strong>Juego anterior y siguiente en la página del juego.</strong>
        Junto a la ruta de la parte superior de la página de un juego hay
        enlaces Anterior y Siguiente y la posición del juego en la lista.
        Siguen la página de la que vienes: abierta desde la Biblioteca,
        recorren la Biblioteca, y desde una página de consola, esa consola,
        en el mismo orden y con los mismos filtros y la misma búsqueda que
        tenías allí.</li>
      <li><strong>Las carátulas y capturas subidas se procesan como las
        scrapeadas.</strong> Una carátula, caja 3D o captura que subes en la
        ventana de edición ahora se guarda en el mismo formato de imagen que
        las imágenes scrapeadas, con el mismo tamaño, y las carátulas reciben
        las copias más pequeñas que usa la Biblioteca. Una captura que se ve
        igual que otra que el juego ya tiene no se añade, y se te dice cuántas
        se omitieron. Subir una carátula nueva también elimina el archivo al
        que sustituye.</li>
      <li><strong>RetroAchievements aparece en la página de cada juego que lo
        tiene.</strong> Algunos juegos tenían la insignia RA en la Biblioteca
        pero ninguna tarjeta de RetroAchievements en su página, como Metroid
        Prime y Metroid Prime 2 en GameCube. La página usa ahora el mismo
        enlace de RetroAchievements que la insignia, y carga más rápido porque
        ya no consulta RetroAchievements cada vez.</li>
      <li><strong>El recuento de juegos sin procesar de la página Sistemas
        coincide con el filtro Sin procesar.</strong> El recuento incluía los
        discos extra, que la lista de juegos de la consola nunca muestra, así
        que una consola podía indicar 2 sin procesar mientras su filtro Sin
        procesar no mostraba ninguno.</li>
      <li><strong>Las páginas de la Biblioteca y de los sistemas se actualizan
        en directo durante el Scrapeo masivo.</strong> La tarjeta de cada
        juego se actualiza en cuanto se scrapea, tanto si la ventana de
        Scrapeo masivo está abierta como si está cerrada o en segundo
        plano.</li>
      <li><strong>Rellenar con AI da a cada juego su nombre oficial.</strong>
        Cuando la IA rellena huecos, en el scrapeo de un solo juego, en el
        Scrapeo masivo y con el botón Rellenar con AI, también indica el
        título oficial del juego tal como salió en la región de su ROM, y el
        juego pasa a llamarse así. El nombre antiguo se guarda como título
        alternativo. Un título que hayas escrito tú o aceptado en Nombres
        oficiales nunca se cambia.</li>
      <li><strong>Nombres oficiales vuelve a sugerir nombres.</strong> Con
        OpenAI, y a veces con Gemini, no se podían leer las respuestas de la
        IA, así que una búsqueda terminaba sin ningún nombre sugerido.</li>
      <li><strong>Las fuentes solo se consultan para los sistemas que
        cubren.</strong> RAWG no tiene juegos de Intellivision, así que ya no
        se consulta para ellos; antes encontraba en su lugar juegos de otras
        plataformas. IGDB, TheGamesDB y RAWG ahora buscan siempre en el
        sistema propio del juego. También se corrigieron varios enlaces de
        plataforma de RAWG erróneos (Atari ST, ColecoVision, PC Engine,
        DOS).</li>
      <li><strong>El anillo de progreso del scrapeo ya no salta hacia
        atrás.</strong> Tras más de una búsqueda en la ventana Buscar
        metadatos, un solo Aplicar iniciaba el scrapeo varias veces, y el
        anillo saltaba entre ellos.</li>
      <li><strong>La carátula 3D ampliada ya no tiene un cuadrado
        detrás.</strong> La caja descansa directamente sobre el fondo
        oscurecido.</li>
      <li><strong>Los mensajes ya no muestran código HTML.</strong> Algunas
        ventanas de confirmación y de resultados de Herramientas ROM mostraban
        etiquetas como &lt;br&gt; en lugar de saltos de línea. El visor de
        registros y el selector de juego principal de los discos extra en
        Ajustes vuelven a funcionar.</li>
    </ul>
- version: 3.32.0
  date: '2026-10-23'
  tags:
  - type: feature
    label: Busca cualquier juego o consola desde cualquier página
  - type: feature
    label: Más fácil moverse en un móvil o una tableta
  - type: fix
    label: Ajustes > Emuladores cabe en un móvil
  - type: fix
    label: Borrar las imágenes de un juego ya no deja archivos sueltos
  - type: feature
    label: Los títulos que escribes se conservan al scrapear
  - type: feature
    label: Nombres oficiales para tus juegos, revisados por ti
  - type: fix
    label: Los juegos fechados solo por año se pueden editar y conservan su año
  body: |
    <ul>
      <li><strong>Busca cualquier juego o consola desde cualquier
        página.</strong> Ahora hay un cuadro de búsqueda bajo tu nombre en la
        barra lateral. Escribe dos o más letras para ver las consolas que
        coinciden y hasta ocho juegos que coinciden, cada uno con su consola.
        Haz clic en uno, o elígelo con las flechas y pulsa Intro, para
        abrirlo. «Ver todos los resultados» abre la Biblioteca con esa
        búsqueda. Pulsa / para ir al cuadro cuando una página no tiene su
        propio cuadro de búsqueda.</li>
      <li><strong>Más fácil moverse en un móvil o una tableta.</strong> En una
        pantalla estrecha, una barra arriba contiene el botón del menú y un
        botón de búsqueda que abre el menú con el cursor ya en el cuadro de
        búsqueda. Una barra abajo te lleva al Panel, la Biblioteca, Sistemas y
        Logros con un toque. El menú ahora es opaco, así que la página ya no
        se ve a través de él. Toca fuera de él o pulsa Escape para cerrarlo.
        En ventanas del tamaño de una tableta faltaba el botón del menú, así
        que el menú no se podía abrir de ninguna forma; ahora está. Las barras
        de pestañas y filtros que siguen en pantalla al desplazarte se
        detienen justo debajo de la barra superior, no detrás de ella.</li>
      <li><strong>Ajustes &gt; Emuladores cabe en un móvil.</strong> Sus
        tablas eran más anchas que un móvil, así que los botones Editar y
        Ajustes quedaban fuera de la pantalla. En un móvil, cada fila es ahora
        una tarjeta con sus botones dentro.</li>
      <li><strong>Borrar las imágenes de un juego ya no deja archivos
        sueltos.</strong> Si borrabas las imágenes de un juego mientras
        RetroDB aún les daba nitidez en segundo plano, podía volver a
        escribirlas como archivos que ningún juego usa. Ahora lo comprueba
        antes y las omite. El contador «Mejorando imágenes» también quita al
        momento el juego borrado.</li>
      <li><strong>Los títulos que escribes se conservan al scrapear.</strong>
        Un scrapeo, incluso un Re-scrapeo completo, sustituía el título que
        habías escrito en la ventana de edición por el nombre del scraper.
        Ahora se conserva un título que cambies. Lo indica una nueva casilla
        «Conservar este título al scrapear» bajo el título; desmárcala para
        que los scrapers puedan volver a renombrar el juego. Restablecer en la
        página de un juego también se lo permite.</li>
      <li><strong>Nombres oficiales para tus juegos, revisados por
        ti.</strong> Herramientas ROM tiene una nueva página Nombres
        oficiales. Pulsa «Preguntar a la IA» para un sistema o para todos, y
        la IA sugiere el nombre oficial completo de cada juego tal como salió
        en la región de su ROM, así que una ROM japonesa de Mega Man pasa a
        ser Rockman. Ves cada nombre antiguo y nuevo uno al lado del otro,
        marcas los que quieres y los aceptas. Nada cambia hasta que lo haces.
        El nombre antiguo se guarda como título alternativo, y un nombre
        aceptado se conserva al scrapear. Un nombre rechazado no se vuelve a
        sugerir. Necesita un proveedor de IA en Ajustes &gt; Scrapeo.</li>
      <li><strong>Los juegos fechados solo por año se pueden editar y
        conservan su año.</strong> Muchos juegos están fechados solo por su
        año, como 1985. En la página de un juego, la ventana de edición se
        negaba a guardarlos. En la ventana de edición de la Biblioteca,
        guardar uno borraba su año. Ahora ambas aceptan un año, un año y un
        mes, o una fecha completa.</li>
    </ul>
- version: 3.31.0
  date: '2026-10-23'
  tags:
  - type: feature
    label: RetroDB está listo para su propio reproductor de juegos
  - type: fix
    label: Las pestañas del Museo vuelven a cambiar
  - type: fix
    label: Los juegos de PlayStation 3 guardados como carpeta se pueden jugar
  - type: fix
    label: Las columnas de Buscar metadatos se alinean, y la ventana cabe en un móvil
  - type: fix
    label: Una instalación nueva en Windows o Mac nombra bien los núcleos de RetroArch
  - type: fix
    label: Rellenar con AI da a los juegos de PC un tipo de guardado de PC, no de consola
  - type: fix
    label: La casilla Jugadores admite más de 16
  - type: fix
    label: La página de ajustes Emuladores se muestra en tu idioma
  - type: ui
    label: El visor de capturas muestra las dos flechas, cada una dentro de su botón
  - type: fix
    label: Al conectar PlayStation se te pide que inicies sesión primero
  - type: feature
    label: Ordena la Biblioteca y muestra solo los juegos sin procesar
  - type: ui
    label: Un filtro sin resultados lo indica
  - type: ui
    label: La barra de filtros de la Biblioteca mantiene todo en su sitio
  - type: ui
    label: Una biblioteca vacía muestra una bienvenida con un botón para escanear
  - type: fix
    label: Escanear biblioteca funciona desde la página Sistemas y desde Ajustes
  - type: ui
    label: El asistente de configuración muestra en qué paso estás y cuáles son opcionales
  - type: feature
    label: Filtra la Biblioteca por varios géneros, series o distribuidoras a la vez
  body: |
    <ul>
      <li><strong>RetroDB está listo para su propio reproductor de
        juegos.</strong> Se está creando para RetroDB un reproductor basado en
        RetroArch. Cuando llegue, RetroDB iniciará los juegos en él con ajustes
        elegidos para cada juego, y conservará los ajustes que cambies mientras
        juegas. Guardará sus partidas y ajustes en su propia carpeta, aparte de
        tu propio RetroArch. Elige el mejor núcleo para cada consola y lo
        descarga la primera vez que pulsas Jugar; mientras tanto, el botón
        dice «Descargando el núcleo…». Juega cualquier consola que no tenga un
        emulador que funcione, y nunca sustituye uno que hayas configurado. En
        cada juego puedes elegir otro núcleo, el efecto de pantalla, el
        escalado entero y la reducción del retardo de entrada. Los
        administradores pueden instalar o actualizar todos los núcleos a la
        vez, o desactivar las descargas. Nada cambia hasta que se instale el
        reproductor; hasta entonces no aparece en Ajustes &gt;
        Emuladores.</li>
      <li><strong>Las pestañas del Museo vuelven a cambiar.</strong> En la
        página del Museo de una consola, hacer clic en Especificaciones, 10
        mejores juegos o Mandos no hacía nada y mostraba el mensaje «Error
        inesperado», desde la versión 3.30.0. Ahora se abre cada
        pestaña.</li>
      <li><strong>Los juegos de PlayStation 3 guardados como carpeta se pueden
        jugar.</strong> Un juego de disco de PS3 suele ser una carpeta que
        termina en «.PS3». RetroDB se negaba a iniciarlo y no mostraba el
        botón Jugar, porque esperaba un único archivo. Ahora pasa la carpeta
        al emulador, como espera RPCS3.</li>
      <li><strong>Las columnas de Buscar metadatos se alinean, y la ventana
        cabe en un móvil.</strong> Una fuente con más resultados de los que
        cabían recibía una barra de desplazamiento, que estrechaba sus
        títulos, así que el mismo título saltaba de línea en una columna y no
        en la siguiente. Ahora cada columna conserva el mismo espacio, con una
        barra de desplazamiento fina acorde al tema. En un móvil o una ventana
        estrecha, la ventana de búsqueda quedaba apretada junto a una barra
        lateral oculta; ahora ocupa toda la pantalla.</li>
      <li><strong>Una instalación nueva en Windows o Mac nombra bien los
        núcleos de RetroArch.</strong> RetroDB configuraba RetroArch con los
        nombres de archivo de núcleo de Linux en todas partes, así que en
        Windows y macOS no se encontraba ningún núcleo. Una instalación nueva
        usa ahora los nombres propios de cada ordenador. Una instalación
        existente conserva los nombres que tiene; cámbialos en la tabla de
        asignaciones.</li>
      <li><strong>El visor de capturas muestra las dos flechas, cada una
        dentro de su botón.</strong> La barra lateral tapaba la flecha
        izquierda, así que no podías volver a una captura anterior con el
        ratón. La flecha derecha además quedaba debajo de su botón. Ahora se
        ven las dos, centradas en sus botones.</li>
      <li><strong>La página de ajustes Emuladores se muestra en tu
        idioma.</strong> Casi todo Ajustes &gt; Emuladores estaba en inglés
        fuera cual fuera el idioma elegido: sus títulos, la tabla de
        emuladores, los resultados del escaneo y la ventana Editar emulador.
        Ahora todo está traducido.</li>
      <li><strong>La casilla Jugadores admite más de 16.</strong> Las dos
        ventanas de edición se detenían en 16, así que no podías introducir
        los 256 jugadores de MAG. Un juego al que un scraper había dado más de
        16 no se podía guardar en absoluto hasta que bajaras el número. Ya no
        hay límite superior.</li>
      <li><strong>Rellenar con AI da a los juegos de PC un tipo de guardado de
        PC, no de consola.</strong> Un juego de Windows podía recibir «Tarjeta
        de memoria» porque la AI describía su versión de PlayStation 2. Ahora
        se le indica a la AI que describa el lanzamiento en la plataforma de
        tu juego. Los PC, y las consolas a partir de PlayStation 3 y Xbox 360,
        guardan en el Almacenamiento interno.</li>
      <li>Para corregir un juego que ya tiene un tipo de guardado incorrecto,
        vuelve a scrapearlo o ejecuta Rellenar con AI. Ambos vuelven a
        preguntar a la AI y sustituyen el valor anterior.</li>
      <li><strong>Al conectar PlayStation se te pide que inicies sesión
        primero.</strong> En Ajustes &gt; Cuenta &gt; PSN, la página de la
        cuenta de Sony solo mostraba «Invalid login» si no habías iniciado
        sesión ya en PlayStation, y los pasos no lo decían. El paso 1 tiene
        ahora un botón «Iniciar sesión en PlayStation» que hay que pulsar
        primero.</li>
      <li><strong>Ordena la Biblioteca y muestra solo los juegos sin
        procesar.</strong> La Biblioteca y cada página de sistema tienen un
        menú Ordenar por junto al número de juegos: nombre, lanzamiento más
        reciente o más antiguo, puntuación de la crítica, puntuación de
        usuarios o añadidos recientemente. Los juegos sin fecha ni puntuación
        van al final. La barra A–Z funciona al ordenar por nombre y aparece
        atenuada en los demás casos. Un nuevo botón «Sin procesar» muestra
        solo los juegos que ningún scraper ha rellenado todavía.</li>
      <li><strong>Un filtro sin resultados lo indica.</strong> Antes la página
        se quedaba en blanco. Ahora dice que ningún juego coincide, con un
        botón para borrar los filtros.</li>
      <li><strong>La barra de filtros de la Biblioteca mantiene todo en su
        sitio.</strong> Pulsar Seleccionar, filtrar u ordenar empujaba antes
        los juegos hacia abajo. Las herramientas de selección aparecen ahora
        en una barra en la parte inferior de la ventana. Borrar está siempre
        ahí, atenuado hasta que haya un filtro activo. Los filtros activos se
        muestran junto al número de juegos. «Mostrar extras» ahora es «Discos
        extra», resaltado cuando está activo. En un móvil, los botones de
        filtro se abren desde un único botón Filtros sobre la página.</li>
      <li><strong>Una biblioteca vacía muestra una bienvenida con un botón
        para escanear.</strong> Antes, una instalación nueva mostraba una
        puntuación de salud atascada en 0% y una Biblioteca en blanco. Ahora
        ambas páginas dicen que la biblioteca está vacía y ofrecen un botón
        Escanear biblioteca. El Panel también enlaza al ajuste de la carpeta
        de ROM. A los usuarios que no son administradores se les indica que
        pregunten a un administrador. Juego aleatorio está oculto hasta que
        haya juegos entre los que elegir.</li>
      <li><strong>Escanear biblioteca funciona desde la página Sistemas y
        desde Ajustes.</strong> Esos dos botones Escanear biblioteca no hacían
        nada al pulsarlos. Solo funcionaba el del Panel. El botón Escanear
        biblioteca del propio Panel ahora solo lo ven los administradores, que
        son los únicos usuarios con permiso para escanear.</li>
      <li><strong>El asistente de configuración muestra en qué paso estás y
        cuáles son opcionales.</strong> Dice «Paso 3 de 6», numera cada paso,
        marca los que ya has pasado e indica que ES-DE y Claves API son
        opcionales. En un móvil muestra los números y el nombre del paso
        actual.</li>
      <li><strong>Filtra la Biblioteca por varios géneros, series o
        distribuidoras a la vez.</strong> En los filtros Género, Serie,
        Distribuidora, Desarrolladora, Modos de juego, Perspectiva y
        Dimensión, marca tantos valores como quieras y pulsa Aplicar: un juego
        se muestra si tiene cualquiera de ellos. Cambia la ventana a NO ES
        para ocultar los juegos que tengan cualquiera de los valores marcados.
        Cada valor tiene su propia etiqueta, y su ✕ quita solo ese
        valor.</li>
    </ul>
