- version: 4.0.0
  date: '2026-11-11'
  tags:
  - type: enhancement
    label: 'Ajustes → Discos extra ahora muestra cada disco marcado como disco extra, con el juego al que pertenece. Su botón «No es un disco extra» (editores y administradores) devuelve un disco mal marcado a tus listas de juegos, y después Auto-Link lo deja en paz'
  - type: fix
    label: 'Los nombres de empresas como «Nintendo Co., Ltd.» y «GameTek, Inc.» ahora se mantienen completos. Se dividían en la coma, así que «Ltd.» e «Inc.» aparecían como nombres propios en los filtros de la Biblioteca, en Ajustes → Normalización de datos y en Estadísticas. Las páginas de los juegos también los muestran completos. Un nombre con una coma entre paréntesis, como «Majesco (licensed from Konami, Disney)», también se mantiene completo'
  - type: enhancement
    label: 'Ajustes → Normalización de datos ya puede unir los distintos nombres de una empresa. En Distribuidora y Desarrolladora, una lista nueva muestra nombres parecidos, como «Eidos» y «Eidos Interactive». Nada se une solo, porque nombres parecidos pueden ser empresas distintas: elige el nombre que se queda, marca los nombres de la misma empresa y pulsa Merge. Los nombres cambian en todos los juegos y los scrapeos posteriores usan el nombre elegido'
  - type: enhancement
    label: 'Ajustes → Normalización de datos tiene ahora los botones Franquicia, Distribuidora y Desarrolladora. Cada uno lista los nombres escritos con mayúsculas distintas, como "Doom" y "DOOM", con cuántos juegos usan cada forma y la más usada ya elegida. Elige una y pulsa Aplicar para que queden como un solo nombre. Un nombre recién obtenido que solo cambia en las mayúsculas toma la forma de tu biblioteca, y Rellenar con AI pide las mayúsculas oficiales'
  - type: fix
    label: 'Los filtros de la Biblioteca ahora coinciden con valores completos. Elegir el género «Acción» ya no muestra también juegos de «Acción-Aventura», así que el resultado coincide con el número que aparece al lado. Las listas de etiquetas de la página de un juego y Juegos similares funcionan igual'
  - type: security
    label: 'Ajustes → Mi perfil ya no envía a la página tu clave de RetroAchievements, tu token de PSN ni tu clave de Steam guardados. Cada campo muestra solo sus últimos cuatro caracteres, como ya hacían las claves de la pestaña Scrapeo. Guardar sin volver a escribirla conserva la clave guardada, y el botón "Guardar & Probar conexión" de PSN prueba el token guardado'
  - type: fix
    label: 'La página Visor de registros ya no se abre con "Archivo de registro no válido". Mostraba registros auxiliares que no iba a abrir y abría uno de ellos primero; ahora solo muestra los registros que puede abrir'
  - type: fix
    label: 'La pestaña PSN de Importaciones de juegos ahora te envía a Ajustes → Mi perfil para el token NPSSO, donde está el campo, en lugar de a Ajustes → Claves de API, y su estado de conexión se puede traducir'
  - type: fix
    label: 'Con una sesión de espectador, las páginas ya no piden al servidor información solo para administradores que no pueden obtener, así que el registro del servidor ya no se llena de peticiones rechazadas'
  - type: security
    label: 'Los nombres que vienen de fuera de RetroDB (datos de scraping, nombres de archivos y carpetas, respuestas de servicios en línea) ahora se muestran siempre como texto simple: en la página del juego, Ajustes, Informes, las herramientas ROM, las páginas de trofeos y más. Además, las páginas solo ejecutan las acciones de sus propios botones, así que un nombre manipulado no puede hacer que una página haga algo, y el enlace "volver a" de un aviso de progreso ya no puede llevar a otro sitio web'
  - type: enhancement
    label: 'Los scrapeos masivos en cola tienen un botón Reordenar. Abre el Gestor de cola, donde un scrapeo en espera puede ejecutarse antes, después o intercambiarse con el que está en marcha. Cada aviso en cola también conserva su número de posición tras un cambio'
  - type: fix
    label: 'El progreso de las tareas ya no se queda atascado ni se repite. Una comprobación o conversión de CHD que falla ahora termina indicando el motivo; Cancelar devuelve a la página sus botones; una cancelación, pausa o eliminación rechazada lo indica; "completado" ya no vuelve a aparecer una hora después; y el botón Sincronizar de la página de logros vuelve cuando termina su sincronización'
  - type: fix
    label: 'Guardar una coincidencia de HowLongToBeat en la página del juego ya no borra su enlace de HLTB ni el número de jugadores, y un guardado fallido se puede reintentar. La Edición rápida ya no muestra cada coincidencia guardada como "100% de coincidencia". Las etiquetas de filtro de la Biblioteca muestran el nombre del sistema en lugar de su número, y la búsqueda mientras escribes funciona en las páginas de listas y en Comparar'
  - type: fix
    label: 'Cada cuenta puede cambiar su propia contraseña en Ajustes → Mi perfil, y un administrador puede restablecer la de cualquiera. Las carpetas de emuladores ahora funcionan en Windows. El Panel ya no dice a editores y espectadores que sus API están sin conexión, y "Juegos sin carátula" abre la Biblioteca mostrando solo esos juegos. Un gestor de contraseñas ya puede rellenar el cuadro de inicio de sesión'
  - type: fix
    label: 'Herramientas ROM: Verificar CHD pone cada insignia Válido o No válido en el archivo correcto; el visor de registros vuelve a mostrar los nombres de módulo e indica cuándo falla su lista de archivos; Seleccionar todo en Importaciones de juegos importa solo los juegos que muestra tu filtro; y Restablecer en Ajustes de herramientas de ROM restaura la carpeta de ROM propia de este equipo'
  - type: fix
    label: 'Las horas de desbloqueo de Steam se muestran como fechas; la barra A-Z funciona en Trofeos locales; el modo Seleccionar de PSN sigue funcionando en los juegos que se cargan al desplazarte; los espectadores ya no ven botones de Sincronizar o Renombrar que no pueden usar; un renombrado por lotes omite un archivo renombrado desde el escaneo; y Análisis puede copiar en una red HTTP simple y exporta los números como números'
  - type: fix
    label: 'En una ventana de confirmación, Intro sobre Cancelar o × ahora cancela en lugar de confirmar. Una ventana abierta con Aceptar ya no desaparece, y Tab sigue funcionando después de cerrar la lista de atajos o una ventana de progreso'
  - type: enhancement
    label: 'Muchos controles que solo funcionaban con el ratón ahora funcionan con el teclado (Tab y luego Intro o Espacio): los perfiles de inicio de sesión, los resultados de búsqueda de Comparar, las etiquetas y sus botones Editar y Eliminar, las tarjetas de juegos de logros, las sesiones de registro, la elección de tema y avatar, las imágenes del Museo, la × que quita un género o filtro, las carpetas de la configuración, las casillas de fuentes de scraping y la importación de CLZ. Los interruptores muestran ahora el anillo del teclado'
  - type: performance
    label: 'El quitafondos del Museo ya no se queda en memoria. Recortaba las fotos de mandos de su fondo con un modelo de AI que, una vez usado, ocupaba más de 2 GB, y hasta unos 9 GB durante una foto, hasta que RetroDB se reiniciaba. Ahora funciona en un programa auxiliar que se abre cuando hace falta y se cierra dos minutos después de su última foto, liberando toda esa memoria'
    en: 'The Museum''s background remover no longer stays in memory. It cut controller photos out of their background with an AI model that took over 2 GB once used, and up to about 9 GB during a photo, until RetroDB restarted. It now runs in a helper that starts when needed and closes two minutes after its last photo, giving all of that memory back'
  - type: feature
    label: 'La importación de Xbox ya no necesita una cuenta de Microsoft Azure. Ahora cada persona pega su propia clave gratuita de OpenXBL (de xbl.io) en Ajustes → Mi perfil, y funciona desde cualquier ordenador de tu red. Además, la importación deja fuera las aplicaciones y los juegos solo para móvil, coloca los juegos de PC en Windows en lugar de Xbox One, lee bien los logros de Xbox 360 y no muestra fecha en un logro bloqueado. La clave gratuita permite 150 solicitudes por hora: una sincronización grande de logros que llega a ese límite se detiene, lo avisa y la próxima vez empieza por los juegos a los que no había llegado'
    en: 'Xbox import no longer needs a Microsoft Azure account. Each person now pastes their own free OpenXBL key (from xbl.io) under Settings → My Profile, and it works from any computer on your network. The import also leaves out apps and phone-only games, files PC games under Windows instead of Xbox One, reads Xbox 360 achievements the right way, and shows no date for a locked achievement. The free key allows 150 requests an hour: a big achievement sync that reaches it stops, says so, and next time starts with the games it had not reached'
  - type: enhancement
    label: Una Sincronización o Actualización de RetroAchievements que pidas mientras otra está en curso queda ahora en espera en el servidor y se inicia sola cuando la anterior termina, aunque cierres la página o la hayas pedido desde otro dispositivo. Todas las páginas muestran la misma lista de espera con el lugar de cada tarea en la cola, y con ✕ se quita una tarea. Tras reiniciar el servidor, las tareas en espera se vuelven a ofrecer en el Panel
    en: A RetroAchievements Sync or Refresh you ask for while another one runs now waits on the server and starts by itself when that one finishes, even if you close the page or asked from another device. Every page shows the same waiting list with each job's place in line, and ✕ takes a job out. After a server restart, waiting jobs are offered back on the Dashboard
  - type: fix
    label: El botón Actualizar RA de la página de una consola vuelve a funcionar. No indicaba de qué consola se trataba, así que el servidor respondía "No encontrado"
    en: The Refresh RA button on a console's page works again. It did not say which console, so the server answered "Not found"
  - type: fix
    label: La comprobación de nombres de ROM ahora trata cada sistema según el tipo que muestra la página de Sistemas. Macintosh, ZX Spectrum Next, Coleco Adam y Thomson se comprueban como ordenadores, y 3DS y PS Vita como portátiles, en lugar de como consolas. También se respeta el tipo que definas en la página de Sistemas
    en: The ROM naming check now treats each system as the kind the Systems page shows. Macintosh, ZX Spectrum Next, Coleco Adam and Thomson are checked as computers, and 3DS and PS Vita as handhelds, instead of as consoles. A type you set on the Systems page is now followed too
  - type: performance
    label: RetroDB usa mucha menos memoria mientras espera. El escalador de imágenes con IA ahora solo se carga mientras escala, en un proceso auxiliar que se cierra dos minutos después de su última imagen; un servidor inactivo pasó de unos 1,4 GB a menos de 100 MB. Si el controlador gráfico falla durante un escalado, solo se detiene el proceso auxiliar, nunca el servidor
    en: RetroDB uses far less memory while it waits. The AI image upscaler now loads only while it is upscaling, in a helper that closes two minutes after its last picture; an idle server dropped from about 1.4 GB to under 100 MB. If the graphics driver crashes during an upscale, only the helper stops, never the server
  - type: performance
    label: Rellenar con AI usando la búsqueda web de Claude cuesta menos. Claude vuelve a leer los resultados de la búsqueda después de cada búsqueda; ahora RetroDB le pide a Anthropic que los mantenga listos, y volver a leerlos cuesta una décima parte del precio o menos
    en: AI Fill with Claude web search costs less. Claude reads the search results again after each search; RetroDB now asks Anthropic to keep them ready, and a re-read then costs a tenth of the price or less
  - type: fix
    label: 'El zulú y el xhosa se leen mejor: se han corregido 133 líneas que decían algo incorrecto, como "Edition" que aparecía como "Chapter" y "must be text" que aparecía como "must be a letter". Cada corrección fue acordada por dos revisiones de IA independientes'
    en: 'Zulu and Xhosa read better: 133 lines that said the wrong thing are corrected, such as "Edition" shown as "Chapter" and "must be text" shown as "must be a letter". Each correction was agreed by two separate AI checks'
  - type: fix
    label: Cuando un juego no se inicia, el mensaje ahora aparece en tu idioma y sigue indicando el emulador, el núcleo o el archivo que falla. Un fallo dentro del propio ordenador ahora muestra "No se pudo iniciar" y el nombre del programa, con los detalles en el registro del servidor, en lugar de texto crudo del sistema. Si se rechaza un inicio de sesión en RetroAchievements, se muestra el motivo de RetroAchievements dentro de una frase traducida
    en: When a game will not start, the message is now in your language and still names the emulator, core or file at fault. A failure inside the computer itself now says "Could not start" and the program's name, with the details in the server log, instead of raw system text. A refused RetroAchievements sign-in shows RetroAchievements' own reason inside a translated sentence
  - type: fix
    label: Cancelar un trabajo de scrapeo, sincronización o imágenes que ya ha terminado ahora elimina su ventana de progreso atascada. Iniciar un trabajo que ya está en marcha muestra el motivo real, como "Ya hay un scrapeo de SNES en marcha", en lugar de "Error de red". Los errores de imágenes de mandos en el Museo ahora dicen qué ha fallado, y cancelar la sincronización de RetroAchievements de otro usuario indica que es de esa persona en lugar de fingir que se cancela
    en: Cancelling a scrape, sync or image job that has already finished now clears its stuck progress popup. Starting a job that is already running shows the real reason, such as "A scrape for SNES is already running", instead of "Network error". Controller image errors in the Museum now say what went wrong, and cancelling another user's RetroAchievements sync says it is theirs instead of pretending to cancel it
  - type: security
    label: El visor de registros ahora oculta contraseñas y claves también en los archivos de registro antiguos. Los registros escritos antes de que RetroDB aprendiera a ocultar una contraseña concreta, como la de ScreenScraper, la mostraban en texto plano al verlos o descargarlos
    en: The log viewer now hides passwords and keys in older log files too. Logs written before RetroDB learned to hide a particular password, such as ScreenScraper's, showed it in plain text when viewed or downloaded
  - type: security
    label: Restablecer todos los ajustes a sus valores por defecto ahora conserva tu carpeta de ROM y el hecho de que la configuración inicial ya está hecha. Antes, un restablecimiento volvía a abrir las páginas de configuración inicial, que funcionan sin iniciar sesión, hasta que un administrador volvía a ejecutarla
    en: Resetting all settings to their defaults now keeps your ROM folder and the fact that setup is done. Before, a reset reopened the first-time setup pages, which work without signing in, until an admin ran setup again
  - type: feature
    label: Los juegos arcade pueden volver a conseguir logros de RetroAchievements. RetroDB ahora vincula un juego arcade solo cuando RetroAchievements conoce el nombre exacto de su archivo, como sf2 para Street Fighter II, así que ya no adivina por el título ni vincula el juego equivocado. Tus juegos arcade se vincularán la próxima vez que se actualicen sus datos de RetroAchievements o se scrapeen
    en: Arcade games can earn RetroAchievements again. RetroDB now links an arcade game only when RetroAchievements knows its exact file name, such as sf2 for Street Fighter II, so it no longer guesses from titles and links the wrong game. Your arcade games link the next time their RetroAchievements data is refreshed or they are scraped
  - type: fix
    label: La sincronización de trofeos de PlayStation ahora corrige los vínculos de juegos que hizo mal antes, como muchos juegos vinculados a un juego sin relación llamado "D". Un vínculo que hayas puesto tú nunca lo cambia una sincronización. La próxima sincronización revisa de nuevo todos los vínculos antiguos, así que algunas coincidencias dudosas pueden quedar sin vincular; vuelve a vincularlas a mano
    en: PlayStation trophy sync now corrects game links it made wrongly before, such as many games linked to an unrelated game called "D". A link you set yourself is never changed by a sync. The next sync checks all older links again, so a few near matches may come unlinked; link those again by hand
  - type: fix
    label: Mover un scrapeo masivo en espera por delante de uno en marcha ya no suma el último juego del scrapeo anterior a los recuentos del nuevo. Pulsar "Scrapear todo" en la lista de deseos mientras ya hay uno en marcha ahora lo indica, en lugar de afirmar que se ha iniciado
    en: Moving a waiting bulk scrape ahead of a running one no longer adds the old scrape's last game to the new one's counts. Clicking "Scrape all" on the wishlist while one is already running now says so, instead of claiming it started
  - type: accessibility
    label: 'Con un lector de pantalla, el botón "en ejecución" ahora dice "1 juego en ejecución" solo cuando cambia el recuento, en lugar de leer un número suelto cada pocos segundos. Su lista se abre como una ventana con nombre y con el cursor dentro, sus botones Terminar y Siguiente disco indican sobre qué juego actúan, y tras Terminar el cursor vuelve a un lugar adecuado. Cada tarjeta de juego de la biblioteca ahora se abre con el teclado desde su título, y sus botones de filtro dicen qué filtran, como "Filtrar por Desarrolladora: Konami"'
    en: 'With a screen reader, the "running" button now says "1 game running" only when the count changes, instead of reading a bare number every few seconds. Its list opens as a named window with the cursor inside, its Kill and Next disk buttons say which game they act on, and after Kill the cursor returns to a sensible place. Each game card in the library now opens with the keyboard from its title, and its filter buttons say what they filter, such as "Filter by Developer: Konami"'
  - type: feature
    label: Ahora cada miembro puede añadir su propia clave de Steam y su Steam ID en Ajustes → Mi perfil, e importar su propia biblioteca de Steam y sus logros. Hasta ahora solo podía un administrador
    en: Every member can now add their own Steam key and Steam ID under Settings → My Profile, and import their own Steam library and achievements. Until now only an admin could
  - type: fix
    label: Guardar los detalles de un juego ya no pone en 1 un número de jugadores vacío, y ya no marca como escritas por ti las clasificaciones por edad que RetroDB ha calculado. Rellenar con AI respeta un juego que marcaste como Exclusivo y conserva cualquier cambio que hagas en un juego mientras espera la respuesta de la AI. El historial de un scrapeo ahora solo lista los detalles que realmente guardó
    en: Saving a game's details no longer sets an empty player count to 1, and no longer marks the age ratings RetroDB worked out for you as typed by you. AI Fill keeps a game you marked Exclusive, and keeps any change you make to a game while it is waiting for the AI's answer. A scrape's history now lists only the details it actually saved
  - type: fix
    label: La revisión de capturas de pantalla ya no se detiene a medias cuando una captura guardada es demasiado grande para abrirla; cuenta esa imagen como ilegible y continúa. El índice de la página de ayuda ahora enlaza con Emuladores y Jugar, y las notas para desarrolladores sobre inicio de sesión, trabajos en segundo plano, scrapeo, imágenes, actualizaciones y respuestas de error ahora dicen lo que el programa hace realmente
    en: Screenshot Review no longer stops halfway when one stored screenshot is far too large to open; it counts that picture as unreadable and carries on. The help page's contents list now links to Emulators and Playing, and the developer notes on sign-in, background jobs, scraping, pictures, updates and error replies now say what the program really does
  - type: fix
    label: Un editor que inicia un análisis de Herramientas de ROM ahora puede pausarlo, reanudarlo o cancelarlo; los análisis de otras personas siguen siendo cosa de un administrador. Las etiquetas y listas rechazan un nombre vacío o un color no válido con un mensaje claro en lugar de una página de error, y renombrar un juego de la lista de deseos con el nombre de otro que ya deseas se rechaza, igual que al añadirlo. Borrar datos de RA ahora también olvida si tu copia consigue logros. Un trofeo que RetroDB ya no ofrece deja de contar para tu rango de coleccionista. Las rutas de ROM de Windows ahora coinciden con los juegos de RetroAchievements por nombre de archivo
    en: An editor who starts a ROM Tools scan can now pause, resume or cancel it; other people's scans stay an admin's to stop. Tags and lists refuse a missing name or a bad colour with a clear message instead of an error page, and renaming a wishlist game onto another one you already wish for is refused, as adding it is. Clear RA Data now also forgets whether your copy earns achievements. A trophy RetroDB no longer offers stops counting toward your collector rank. Windows ROM paths now match RetroAchievements games by file name
  - type: fix
    label: Correcciones de mantenimiento. Un archivo de varios discos que falla al descomprimirse ya no deja una carpeta a medio crear que bloquea todos los reintentos. Calcular almacenamiento ahora cuenta todos los archivos dentro de la carpeta de un juego de PS3. Borrar datos scrapeados elimina las imágenes solo cuando lo pides. Un análisis de la biblioteca que encuentra un juego que otro análisis acaba de añadir continúa con el resto de los juegos de esa consola
    en: Maintenance fixes. A multi-disc archive that fails to unpack no longer leaves a half-made folder behind that blocks every retry. Calculate Storage now counts every file inside a PS3 game folder. Clear Scraped Data deletes pictures only when you ask it to. A library scan that meets a game another scan has just added carries on with the rest of that console's games
  - type: fix
    label: Restaurar una copia de seguridad es más seguro. Ahora se escribe en la base de datos de la biblioteca de la forma que la propia base de datos espera, de modo que una parte de RetroDB que la tenga abierta ve los datos restaurados en lugar de arriesgarse a un daño. Eliminar un juego ahora también elimina las imágenes de su caja y sus entradas pendientes de imágenes y de ajustes del emulador, para que un juego nuevo nunca las herede. Dos ajustes guardados a la vez ya no pierden uno de ellos
    en: Restoring a backup is safer. It is now written into the library database the way the database itself expects, so a part of RetroDB that has it open sees the restored data instead of risking damage. Deleting a game now also deletes its box pictures and its waiting picture and emulator-setting entries, so a new game can never inherit them. Two settings saved at the same moment no longer lose one of them
  - type: fix
    label: Correcciones de imágenes. Los GIF ya no pasan por el escalador para después descartarse. El modelo del escalador se comprueba con su huella publicada, y una descarga defectuosa se vuelve a obtener en lugar de desactivar el escalado para siempre. Los logotipos y las imágenes con partes transparentes mantienen su transparencia al ampliarse. Convertir a WebP ahora incluye también contraportadas y logotipos, y ya no rechaza una biblioteca grande por falta de espacio que no necesita. Dos caras de un archivo de caja pueden compartir una imagen, y eliminar una caja con un registro dañado elimina sus imágenes
    en: Picture fixes. GIFs are no longer run through the upscaler only to be thrown away. The upscaler model is checked against its published fingerprint, and a bad download is fetched again instead of turning upscaling off for good. Logos and pictures with see-through parts keep their transparency when enlarged. Convert to WebP now takes back covers and logos too, and no longer refuses a large library for want of room it does not need. Two faces of a box file can share one picture, and removing a box with a damaged record removes its pictures
  - type: fix
    label: Las importaciones de CLZ, Steam, Xbox y PlayStation ya no tratan como el mismo juego todos los títulos escritos solo en japonés u otro alfabeto no latino, y ya no añaden un juego sin id. La vista previa de CLZ ya no añade consolas antes de confirmar la importación, y un espectador que mira una biblioteca de Steam, Xbox o PlayStation tampoco las añade. De un juego de Steam retirado de la tienda se pregunta una sola vez, no en cada sincronización
    en: Imports from CLZ, Steam, Xbox and PlayStation no longer treat every title written only in Japanese or another non-Latin script as the same game, and no longer add a game with no id. The CLZ preview no longer adds consoles before you confirm the import, and a viewer looking at a Steam, Xbox or PlayStation library no longer adds them either. A Steam game removed from the store is asked about once, not on every sync
  - type: fix
    label: Las estadísticas ahora agrupan muchas más consolas bajo su fabricante en lugar de "Otros", y la lista Scrapeados recientemente del panel muestra un juego que scrapeaste de nuevo, no solo los juegos recién añadidos
    en: Analytics now groups many more consoles under their maker instead of "Other", and the dashboard's Recently Scraped list shows a game you scraped again, not only newly added games
  - type: fix
    label: Las imágenes de mandos que añades en el Museo se conservan cuando se actualiza la versión independiente. Cuando un servicio en línea se pausa al llegar a su límite, la hora a la que se volverá a consultar se muestra en tu propia zona horaria
    en: Controller pictures you add in the Museum are kept when the standalone version updates. When an online service pauses at its limit, the time it will be asked again is shown in your own time zone
  - type: fix
    label: Un disco extra ya no puede vincularse a sí mismo ni a otro disco extra, y el vínculo automático ya no vincula un disco con otro que marca como disco extra en la misma ejecución
    en: A bonus disc can no longer be linked to itself or to another bonus disc, and Auto-link no longer links a disc to one it marks as a bonus disc in the same run
  - type: fix
    label: Las páginas de la biblioteca y de consolas ya no cuentan los archivos BIOS arcade como juegos, ni en sus totales ni en la barra de letras. Los juegos similares y la lista que obtienes al pulsar un género o una distribuidora en la página de un juego ya no muestran las versiones regionales, los discos extra ni los archivos BIOS del propio juego
    en: The Library and console pages no longer count arcade BIOS files as games, in their totals or the letter bar. Similar games, and the list you get by clicking a genre or publisher on a game's page, no longer show the game's own regional versions, bonus discs or BIOS files
  - type: fix
    label: Seleccionar todo ahora lo indica cuando una lista muy grande se recorta, en lugar de seleccionar solo una parte sin avisar
    en: Select all now says so when a very large list is cut short, instead of quietly selecting only part of it
  - type: fix
    label: Las tarjetas de la biblioteca ahora se actualizan cuando cambia tu progreso de logros o trofeos, y cuando un juego pasa a ser jugable o deja de serlo
    en: Library cards now update when your achievement or trophy progress changes, and when a game becomes playable or stops being playable
  - type: fix
    label: La edición masiva ya no puede cambiar los juegos equivocados si recibe una selección incorrecta, y una edición masiva que falla ya no marca los juegos como editados por ti
    en: Bulk edit can no longer change the wrong games when it is sent a bad selection, and a bulk edit that fails no longer marks the games as edited by you
  - type: fix
    label: Una coincidencia de HowLongToBeat que solo encaja un 1 % ya no se muestra como una coincidencia del 100 %, y una página que no carga muestra la página de error en lugar del texto de error sin formato
    en: A HowLongToBeat match that is only a 1% fit is no longer shown as a 100% match, and a page that fails to load shows the error page instead of the raw error text
  - type: security
    label: Cambiar tu contraseña, o que un administrador la restablezca, ahora cierra la sesión de esa cuenta en todos los demás dispositivos. Por ello, todos tendrán que iniciar sesión una vez más tras esta actualización. La página de configuración inicial también recibe la misma protección frente a otros sitios web que el resto de páginas
    en: Changing your password, or an admin resetting it, now signs that account out on every other device. Because of this, everyone signs in once more after this update. The first-run setup page also gets the same protection against other websites as every other page
  - type: fix
    label: Una imagen rechazada como avatar ya no elimina el avatar que tenías
    en: A picture that is refused as your avatar no longer deletes the avatar you had
  - type: fix
    label: Los scrapeos son más suaves con los servicios en línea. Un servicio que sigue fallando se omite durante un tiempo al rellenar huecos, como ya ocurría en las búsquedas, y las consultas de juegos a ScreenScraper ahora también respetan sus límites diarios
    en: Scrapes are gentler on the online services. A service that keeps failing is skipped for a while when filling gaps, as it already was in searches, and ScreenScraper game lookups now respect its daily limits too
  - type: fix
    label: Un scrapeo ya no falla con un juego cuyo año de lanzamiento es desconocido, como "TBA", y un juego listado para regiones fuera de tu lista, como "Brasil, Corea", conserva su región en lugar de pasar a la tuya por defecto
    en: A scrape no longer fails on a game whose release year is unknown, such as "TBA", and a game listed for regions outside your list, such as "Brazil, Korea", keeps its region instead of becoming your default
  - type: fix
    label: Las carpetas de ES-DE escritas como ~/ ahora funcionan, y un archivo de ES-DE muy grande ya no se copia. Las versiones regionales sugeridas nunca vuelven a juntar dos juegos que dijiste que no son versiones el uno del otro
    en: ES-DE folders written as ~/ now work, and a very large ES-DE file is no longer copied. Suggested regional versions never put back together two games you said are not versions of each other
  - type: security
    label: RetroDB rechaza algunas direcciones de red privada más al obtener imágenes de la web, y sigue correctamente la redirección de una dirección web
    en: RetroDB refuses a few more private network addresses when fetching pictures from the web, and follows a web address's redirect correctly
  - type: fix
    label: Las últimas pantallas que seguían en inglés ahora también siguen tu idioma, incluidos el asistente de configuración, Etiquetas, Listas, Comparar juegos, los ajustes de Herramientas de ROM, la cola de scrapeo masivo, la lista de trabajos interrumpidos del panel, las etiquetas de las tarjetas de la biblioteca y muchos mensajes de error
    en: The last screens still in English now follow your language too, including the setup wizard, Tags, Lists, Compare Games, ROM Tools settings, the bulk scrape queue, the dashboard's interrupted-jobs list, the library card labels and many error messages
  - type: security
    label: Un nombre de sistema que contenga código web ya no puede ejecutarlo en la ventana de la cola de scrapeo masivo
    en: A system name holding web code can no longer run it in the bulk scrape queue window
  - type: accessibility
    label: Estés donde estés en una página, la posición del teclado ahora se marca con un anillo grueso del color de tu tema, en cada botón, cuadro y enlace. Antes, muchos controles mostraban solo una línea tenue, igual que cuando pasaba el ratón por encima
    en: Wherever you are on a page, the keyboard's place is now marked with a bold ring in your theme's colour, on every button, box and link. Before, many controls showed only a faint line, the same as when the mouse passed over them
  - type: accessibility
    label: Los enlaces de Género, Serie, Desarrolladora y Distribuidora de las tarjetas de la biblioteca ahora funcionan con el teclado. El botón "en ejecución" de los juegos en curso también se abre con el teclado, y Esc o un clic fuera cierran su lista
    en: The Genre, Series, Developer and Publisher links on library cards now work from the keyboard. The "running" button for games in play opens from the keyboard too, and Esc or a click elsewhere closes its list
  - type: accessibility
    label: Los lectores de pantalla ahora nombran cada color de etiqueta y dicen cuál está elegido, y leen las imágenes de trofeos como Platino, Oro, Plata y Bronce en lugar de letras sueltas. Mientras se inicia un juego, Tab ya no pasa detrás de la pantalla de inicio
    en: Screen readers now name each tag colour and say which one is chosen, and read trophy pictures as Platinum, Gold, Silver and Bronze instead of single letters. While a game starts, Tab no longer moves behind the starting screen
  - type: fix
    label: Si una actualización se detiene antes de empezar a intercambiar archivos, RetroDB ahora vuelve a iniciar la versión que tenías, en lugar de quedarse cerrado
    en: If an update stops before it starts swapping files, RetroDB now starts the version you had again, instead of staying closed
  - type: fix
    label: Pulsar Jugar dos veces a la vez ya no puede iniciar dos juegos en el reproductor integrado. La espera de una descarga de núcleo ahora se rinde pasado un tiempo, o cuando RetroDB deja de responder, en lugar de esperar para siempre, y la pregunta de "ya en ejecución" usa el propio diálogo de RetroDB
    en: Pressing Play twice at once can no longer start two games on the built-in player. Waiting for a core download now gives up after a while, or when RetroDB stops answering, instead of waiting forever, and the "already running" question uses RetroDB's own dialog
  - type: fix
    label: Los trucos que activas o desactivas durante el juego se guardan para el juego correcto, y nunca se toman de otro juego cuyo archivo tenga el mismo nombre. Un problema con los trucos nunca impide que un juego se inicie
    en: Cheats you switch on or off during play are kept for the right game, never taken from another game whose file has the same name. A cheat problem never stops a game starting
  - type: fix
    label: RetroDB escribe con más seguridad el archivo de ajustes de un emulador. Un archivo de ajustes que es un enlace sigue siendo un enlace, conserva sus permisos y las letras que no puede leer, y un guardado fallido no deja ningún archivo suelto
    en: RetroDB writes an emulator's settings file more safely. A settings file that is a link stays a link, keeps its permissions, and keeps letters it cannot read, and a failed save leaves no stray file behind
  - type: fix
    label: Un scrapeo masivo que mueves hacia abajo en la cola, intercambias con otro o reanudas mientras hay uno en marcha ya no se pierde al reiniciar RetroDB; el panel lo ofrece, desde donde se detuvo. Un scrapeo sustituido ya no sigue ejecutándose junto al nuevo, y dos clics rápidos en Reanudar inician el trabajo una sola vez
    en: A bulk scrape you move down the queue, swap with another or resume while one runs is no longer lost when RetroDB restarts; the dashboard offers it, from where it stopped. A swapped-out scrape no longer keeps running beside the new one, and two quick clicks on Resume start a job once
  - type: fix
    label: El error de un juego, como la caída de la red, ya no termina toda una ejecución de Rellenar con AI ni de Arreglar caja y regiones del manual; ese juego cuenta como fallido y el resto continúa. Detener RetroDB ahora también detiene limpiamente las descargas de núcleos
    en: One game's error, such as the network dropping, no longer ends a whole AI Fill run or a Fix Box and Manual Regions run; that game counts as failed and the rest go on. Stopping RetroDB now also stops core downloads cleanly
  - type: fix
    label: Los elementos de la Lista de deseos ya no se quedan en "scrapeando" para siempre tras un error o un reinicio, y dos ejecuciones de Scrapear todo para la misma Lista de deseos ya no se ejecutan a la vez
    en: Wishlist items no longer stay on "scraping" forever after an error or a restart, and two Scrape All runs for the same wishlist no longer run at once
  - type: fix
    label: Un script o una segunda copia de RetroDB al arrancar ya no marca como interrumpidas las tareas del servidor en marcha, y dos copias que arrancan a la vez ya no pueden hacer retroceder la versión de la base de datos
    en: A script or a second copy of RetroDB starting up no longer marks the running server's jobs as interrupted, and two copies starting at once can no longer set the database back a version
  - type: fix
    label: Iniciar una sincronización de PlayStation ya no hace que las barras de progreso de todos esperen mientras se inicia sesión en Sony. El mantenimiento diario de PlayStation ahora renueva el inicio de sesión solo cerca del final de sus 10 días, en lugar de cada día
    en: Starting a PlayStation sync no longer makes everyone's progress bars wait while it signs in to Sony. The daily PlayStation keep-alive now renews a sign-in only near the end of its 10 days, instead of every day
  - type: fix
    label: Un scrapeo ya no sobrescribe un cambio que haces mientras se ejecuta, y ya no vacía un género, modo o vista cuyo nombre no conoce. Ya no cambia un número de jugadores guardado para que coincida con los modos del juego
    en: A scrape no longer writes over a change you make while it runs, and no longer empties a genre, mode or view it has no name for. It no longer changes a stored player count to match the game's modes
  - type: fix
    label: Rellenar con AI ya no cambia lo que escribiste tú mismo, como una distribuidora o un género que corregiste a mano; solo corrige valores scrapeados. Ya no indica que un valor cambió cuando solo se escribió de otra forma, como 4 jugadores como "1-4" o los mismos géneros en otro orden
    en: AI Fill no longer changes what you typed yourself, such as a publisher or genre you corrected by hand; it corrects only scraped values. It no longer reports a value as changed when it only wrote it differently, such as 4 players as "1-4" or the same genres in another order
  - type: fix
    label: Se conserva el mando que escribes para un juego; el mando predeterminado de la consola ahora solo sustituye los valores scrapeados y de AI. Una clasificación por edades convertida de la suposición de AI de otro sistema ahora también se marca como suposición
    en: A controller you type for a game is kept; the console's default controller now replaces only scraped and AI values. An age rating converted from another board's AI guess is now marked as a guess too
  - type: fix
    label: Guardar la ventana de edición de un juego ya no vacía los campos que la ventana no muestra. Restablecer en la página de un juego ahora borra todo lo que dice, incluidos la vista, la edición y otros nombres, elimina las imágenes y los vídeos del juego salvo que otro juego los use, y actualiza los filtros de la biblioteca al instante
    en: Saving a game's edit window no longer empties fields the window does not show. Reset on a game's page now clears everything it says it does, including the view, edition and other names, deletes the game's pictures and videos unless another game uses them, and updates the library filters straight away
  - type: fix
    label: Borrar datos scrapeados ahora también borra la vista, 2D o 3D, y la estructura del juego. Una importación de CLZ de un juego con solo el año conserva únicamente el año, no el 1 de enero
    en: Clear Scraped Data now also clears the view, 2D or 3D, and game structure. A CLZ import of a game with only a year keeps just the year, not 1 January
  - type: security
    label: La sincronización de Steam ya no toma la clave de Steam de Ajustes para todos los miembros del hogar. Un miembro sin clave de Steam propia recibía la biblioteca y los logros de Steam del administrador en su cuenta. La clave de Ajustes ahora sirve solo a los administradores
    en: Steam sync no longer borrows the Steam key from Settings for every household member. A member with no Steam key of their own was getting the admin's Steam library and achievements under their account. The key in Settings now serves admins only
  - type: fix
    label: La búsqueda de How Long to Beat para muchos juegos ahora guarda los tiempos de los que está seguro. Antes, todas las coincidencias seguras fallaban y no se guardaba nada. Actualizar RetroAchievements ahora también comprueba el archivo de cada juego con la lista de RetroAchievements, como hace un scrapeo, de modo que cada juego se vincula a la versión exacta que tienes
    en: How Long to Beat's lookup for many games now saves the times it is sure of. Before, every sure match failed and nothing was saved. RetroAchievements Refresh now also checks each game's file against RetroAchievements' list, as a scrape does, so a game is linked to the exact version you have
  - type: fix
    label: El mensaje de que una tarea en segundo plano ha terminado vuelve a mostrarse, y el cuadro de progreso de una tarea nota cuándo el servidor la retoma tras un reinicio. Antes, ninguno aparecía nunca
    en: The message that a background job has finished shows again, and a job's progress box notices when the server picks the job up after a restart. Before, neither ever appeared
  - type: fix
    label: 'Trofeos de PlayStation: un juego que vinculaste a mano sigue vinculado tras una sincronización completa, y la sincronización ya no vincula un juego con su secuela, como "Doom" con "Doom Eternal". Importar juegos de PlayStation ahora vincula un juego que ya está en tu biblioteca, como hacen las importaciones de Steam y Xbox, así que sus trofeos aparecen en él'
    en: 'PlayStation trophies: a game you linked by hand stays linked after a full sync, and a sync no longer links a game to its sequel, such as "Doom" to "Doom Eternal". Importing PlayStation games now links a game already in your library, as Steam and Xbox imports do, so its trophies show on it'
  - type: fix
    label: Xbox ya no muestra tu gamertag como Desconocido después de que se renueve su inicio de sesión, y una conexión lenta o fallida ya no cierra tu sesión de Xbox. Solo lo hace si Microsoft rechaza el inicio de sesión
    en: Xbox no longer shows your gamertag as Unknown after its sign-in renews itself, and a slow or failed connection no longer signs you out of Xbox. Only Microsoft refusing the sign-in does that
  - type: fix
    label: Ahora dos personas pueden tener cada una una etiqueta con el mismo nombre; antes, la segunda fallaba con un error. Cualquier usuario con sesión iniciada puede volver a escanear sus propios trofeos de RPCS3; antes solo podía un administrador, y los demás veían trofeos antiguos hasta que se reiniciaba RetroDB
    en: Two people can now each have a tag of the same name; before, the second one failed with an error. Any signed-in user can now rescan their own RPCS3 trophies; before, only an admin could, and everyone else saw old trophies until RetroDB restarted
  - type: security
    label: Tus inicios de sesión siguen siendo privados. Las copias de seguridad de la base de datos ya no pueden ser leídas por otras cuentas del equipo, y una copia de seguridad fallida ya no elimina la anterior. Eliminar o desactivar a un usuario también cierra su sesión de RetroAchievements en DuckStation y PCSX2. Un inicio de sesión de RetroAchievements guardado desde el menú del propio reproductor ya no pasa a la siguiente persona que juega. Los registros y los errores de tareas guardados ocultan los tokens de RetroAchievements, el error de PlayStation de otro miembro solo se muestra a él, y se eliminan los antiguos archivos de inicio de sesión de PlayStation y Xbox en texto plano
    en: Your sign-ins stay private. Database backups can no longer be read by other accounts on the computer, and a failed backup no longer deletes the one before it. Deleting or switching off a user also signs them out of RetroAchievements in DuckStation and PCSX2. A RetroAchievements sign-in saved from the player's own menu no longer carries over to the next person who plays. Logs and saved job errors hide RetroAchievements tokens, another member's PlayStation error is shown only to them, and old plain-text PlayStation and Xbox sign-in files are removed
  - type: fix
    label: Las comprobaciones propias de RetroDB ya no pueden tocar tu biblioteca mientras se ejecutan. Siempre usan una copia desechable de la base de datos, las imágenes y los ajustes, y se niegan a arrancar si alguno apunta a tus archivos reales
    en: RetroDB's own checks can no longer touch your library while they run. They always use a throwaway copy of the database, pictures and settings, and refuse to start if any of them points at your real files
  - type: fix
    label: Limpiar archivos huérfanos ya no elimina las imágenes de tu Lista de deseos. Abrir un juego ya no le hace olvidar las capturas de pantalla que no encuentra. Antes, con la unidad de imágenes desconectada, cada juego que abrías perdía toda su lista de capturas de pantalla; ahora la lista se conserva y una imagen que falta solo se oculta
    en: Clean orphaned files no longer deletes your wishlist's pictures. Opening a game no longer makes it forget screenshots it cannot find. Before, with the picture drive unplugged, every game you opened lost its whole screenshot list; now the list is kept, and a missing picture is only hidden
  - type: fix
    label: Una descarga de vídeo o manual que falla a medias ya no daña la copia que el juego ya tenía, y una descarga fallida ya no deja un medio archivo oculto en la carpeta de medios. El escalador en segundo plano ya no guarda una imagen antigua sobre una más nueva descargada mientras tanto. Convertir a WebP mantiene apuntando a la imagen a todos los juegos que la comparten, y nunca toca un archivo fuera de las carpetas de imágenes
    en: A video or manual download that fails part-way no longer damages the copy the game already had, and a failed download no longer leaves a hidden half-file in the media folder. The background upscaler no longer saves an old picture over a newer one downloaded meanwhile. Convert to WebP keeps every game that shares a picture pointing at it, and never touches a file outside the picture folders
  - type: fix
    label: Eliminar un juego o un elemento de la Lista de deseos ahora elimina también sus imágenes, vídeos y manuales, pero conserva los que otro juego o elemento de la Lista de deseos siga usando. Otras cuentas del equipo vuelven a poder leer las imágenes guardadas, y Cambiar tamaño de imágenes cuenta como fallida una imagen que no pudo guardar, no como hecha
    en: Deleting a game or a wishlist item now deletes its pictures, videos and manuals too, but keeps any another game or wishlist item still uses. Saved pictures can be read by other accounts on the computer again, and Resize Images counts a picture it could not save as failed, not as done
  - type: fix
    label: Buscar duplicados ya no ofrece para eliminar un archivo que funciona. Al buscar por nombre, ya no considera copias entre sí los archivos .cue y .bin de un juego. Nunca ofrece el archivo de pista de un disco, que dos versiones de un juego pueden compartir. No eliminará un disco que figure en una lista de reproducción. Un juego cuyo archivo eliminas ahora pasa a la copia que conservas, así que sigue en la biblioteca
    en: Duplicate Finder no longer offers a working file for deletion. Looking by name, it no longer calls a game's .cue and .bin copies of each other. It never offers a disc's track file, which two versions of a game can share. It will not delete a disc that a playlist lists. A game whose file you delete now moves to the copy you keep, so it stays in the library
  - type: fix
    label: Organizar multidisco ya no sobrescribe una lista de reproducción existente ni un archivo que ya esté en la carpeta del juego; se detiene e indica cuál. La lista de reproducción que crea incluye el .cue de cada disco, no sus archivos de pista. Los juegos cuyos archivos mueve ahora los siguen a la carpeta, así que Limpiar ROMs que faltan ya no los elimina
    en: Organize Multi-Disc no longer writes over an existing playlist or a file already in the game's folder; it stops and says which. The playlist it makes lists each disc's .cue, not its track files. Games whose files it moves now follow them into the folder, so Clean missing ROMs no longer removes them
  - type: fix
    label: Convertir a CHD con "eliminar originales" ahora elimina también los archivos de pista del disco, pero conserva una pista que otro .cue siga usando. El juego y cualquier lista de reproducción que incluía el disco antiguo ahora apuntan al nuevo .chd. Renombrar el archivo de un juego ahora actualiza la lista de reproducción que lo incluye, y un archivo de pista que necesita un .cue no se puede renombrar. Quitar archivos de un zip quita solo los archivos que elegiste, incluso cuando un nombre contiene [ o ]. Eliminar capturas duplicadas elimina solo las copias que encontró su análisis, y siempre conserva una
    en: Converting to CHD with "delete originals" now deletes the disc's track files too, but keeps a track another .cue still uses. The game and any playlist that listed the old disc now point at the new .chd. Renaming a game's file now updates the playlist that lists it, and a track file a .cue needs cannot be renamed. Removing files from a zip removes only the files you picked, even when a name holds [ or ]. Screenshot Dedup deletes only the copies its scan found, and always keeps one
  - type: fix
    label: How Long to Beat en la página de un juego busca lo que escribes. Antes, un título que no encontraba hacía que buscara los otros nombres del juego, y podía ofrecer un juego distinto, como un remake de fans. Sigue probando los otros nombres cuando el cuadro contiene el propio nombre del juego
    en: How Long to Beat on a game's page searches for what you type. Before, a title it could not find made it search the game's other names instead, and it could offer a different game, such as a fan remake. It still tries the other names when the box holds the game's own name
  - type: fix
    label: Los pasos de How Long to Beat en el manual de ayuda coinciden con la pantalla. Decían que había que elegir una coincidencia de una lista; la página muestra una coincidencia con Guardar y Cancelar. La ayuda de PlayStation ya no dice que el inicio de sesión dura unos dos meses, ya que RetroDB inicia sesión de nuevo por sí solo. Los 20 manuales traducidos incluyen ambos cambios
    en: The help manual's How Long to Beat steps match the screen. They said to pick a match from a list; the page shows one match with Save and Cancel. The PlayStation help no longer says the sign-in lasts about two months, since RetroDB signs in again by itself. All 20 translated manuals carry both changes
  - type: fix
    label: Ahora todas las barras de letras empiezan con un botón Todos. En las páginas de Biblioteca, de consola y de Trofeos de PSN, al elegir una letra solo se muestran los juegos de esa letra, y antes no había ningún botón para recuperar el resto. En las demás páginas de logros, Todos vuelve al primer juego
    en: Every letter bar now starts with an All button. On the Library, console and PSN Trophies pages, picking a letter shows only that letter's games, and before there was no button to bring the rest back. On the other achievement pages, All goes back to the first game
  - type: fix
    label: Un nuevo token de inicio de sesión de PlayStation que pegas en Ajustes ahora se usa de inmediato. Antes, RetroDB seguía usando el inicio de sesión antiguo hasta que caducaba, y Guardar y probar conexión indicaba que ese inicio de sesión antiguo funcionaba. Un token que Sony rechaza ya no sustituye a uno que funciona
    en: A new PlayStation sign-in token you paste in Settings is now used straight away. Before, RetroDB kept using the old sign-in until it ran out, and Save & Test Connection reported that old sign-in as working. A token Sony refuses no longer replaces one that works
  - type: enhancement
    label: 'El inicio de sesión de PlayStation en Ajustes es más fácil de mantener. El aviso ya no cuenta días en los que nunca tuviste que actuar, porque RetroDB inicia sesión de nuevo por sí solo; solo se pone rojo cuando Sony rechaza tu token guardado. El botón Pegar aquí ya no hace que el navegador pida leer tu portapapeles: coloca el cursor en el cuadro para Ctrl+V. Los pasos ahora indican que primero cierres sesión en PlayStation cuando sustituyes un token que aún funciona, y sus mensajes se pueden traducir'
    en: 'The PlayStation sign-in in Settings is easier to keep going. The banner no longer counts down days you never had to act on, because RetroDB signs in again by itself; it turns red only when Sony refuses your saved token. The Paste here button no longer makes the browser ask to read your clipboard: it puts the cursor in the box for Ctrl+V. The steps now say to sign out of PlayStation first when you replace a token that still works, and their messages can be translated'
  - type: enhancement
    label: Los mensajes emergentes y los cuadros de pregunta, como "Ajustes guardados" o "¿Eliminar esta lista?", ahora se pueden traducir en todas las páginas. Antes, la mayoría seguían en inglés fuera cual fuera el idioma elegido
    en: Pop-up messages and question boxes, such as "Settings saved" or "Delete this list?", can now be translated on every page. Before, most of them stayed in English whatever language you chose
  - type: enhancement
    label: Los mensajes que explican por qué falló un inicio de sesión de PlayStation, como "Es posible que tu NPSSO haya caducado", ahora se pueden traducir
    en: The messages that say why a PlayStation sign-in failed, such as "Your NPSSO may have expired", can now be translated
  - type: fix
    label: El manual de ayuda en todos los idiomas ahora coincide con el inglés. Incorpora Buscar en todas partes, Conservar un título, Nombres de MAME y la parte trasera de la caja, y los párrafos antiguos que se habían quedado atrás están actualizados
    en: The help manual in every language now matches the English one. It gains Search Anywhere, Keeping a Title, MAME Names and the back of the box, and older paragraphs that had fallen behind are up to date
  - type: fix
    label: En alemán, afrikáans y español, el botón Atrás de la portada de un juego ahora indica la parte trasera de la caja, no "volver atrás"
    en: In German, Afrikaans and Spanish, the Back button on a game's cover now says the back of the box, not "go back"
  - type: feature
    label: Al pulsar Jugar, ahora se llena la pantalla con el logo del juego sobre su imagen de fondo mientras el juego arranca, o con su nombre en letras grandes si no tiene logo. Desaparece solo cuando se abre la ventana del juego, o cuando pulsas Esc o haces clic
    en: Pressing Play now fills the screen with the game's logo on its background picture while the game starts, or its name in large letters when it has no logo. It goes away by itself when the game's window opens, or when you press Esc or click
  - type: feature
    label: 'La caja 3D giratoria ahora tiene la forma real de una caja de PS5: esquinas y bordes redondeados, el borde elevado alrededor de la portada, la línea donde se unen las dos mitades y la ranura para el dedo en el lado de apertura. Necesita un archivo de caja de una versión de Slipcase que escriba la forma; importa la caja de nuevo para obtenerla. Las demás cajas se ven como antes'
    en: 'The turnable 3D box now has the real shape of a PS5 case: rounded corners and edges, the raised lip round the cover, the line where the two halves meet, and the finger slot in the opening side. It needs a box file from a Slipcase version that writes the shape; import the box again to get it. Other boxes look as before'
  - type: enhancement
    label: Actualizar RetroAchievements pasó de Ajustes a la página de RetroAchievements, y ahora se llama Buscar juegos con logros. Cada botón de esa página ahora tiene una línea que explica qué hace, así que es fácil distinguir Buscar juegos de Sincronizar progreso. Si aún no hay juegos vinculados, la página muestra a un administrador el botón Buscar en lugar de pasar a la siguiente pestaña
    en: Refresh RetroAchievements moved from Settings to the RetroAchievements page, and is now called Find Games with Achievements. Every button there now has a line saying what it does, so Find Games and Sync Progress are easy to tell apart. With no games linked yet, the page shows an admin the Find button instead of moving on to the next tab
  body: "<ul>\n  <li><strong>La 4.0 es la última versión web de RetroDB.</strong> Las nuevas versiones\n    serán una aplicación de escritorio para Windows, Linux y macOS, y una aplicación para Android.\n    Abrirán tu Biblioteca actual. La versión 4.0 seguirá disponible para\n    descargar y solo recibirá correcciones de seguridad y de errores que hagan perder datos.\n    En Ajustes → Actualizaciones habrá un enlace a la aplicación de escritorio cuando salga.</li>\n  <li><strong>El manual de ayuda está al día en todos los idiomas.</strong>\n    Las secciones que solo estaban en el manual en inglés ya están traducidas.</li>\n</ul>\n"
  body_en: "<ul>\n  <li><strong>4.0 is the last web version of RetroDB.</strong> New versions\n    will be a desktop app for Windows, Linux and macOS, and an Android app.\n    They will open your existing library. Version 4.0 stays available to\n    download, and gets only security fixes and fixes for bugs that lose data.\n    Settings → Updates links to the desktop app when it is out.</li>\n  <li><strong>The help manual is up to date in every language.</strong>\n    Sections that were only in the English manual are now translated.</li>\n</ul>\n"
- version: 3.35.4
  date: '2026-11-03'
  tags:
  - type: fix
    label: Una captura de pantalla que eliminas de un juego ahora se queda eliminada. Antes, el siguiente scrapeo podía volver a copiarla desde ES-DE o descargarla otra vez desde una fuente en línea. Eliminar una copia sobrante en la herramienta de capturas de pantalla duplicadas no cuenta, porque la imagen se conserva una vez
  - type: feature
    label: 'Los juegos ahora tienen su logotipo: el scrapeo lo guarda desde ES-DE, ScreenScraper, TheGamesDB, IGDB y Steam, y la página del juego lo muestra sobre el título, o en lugar de una caja que falta. Puedes subir o eliminar un logotipo en la ventana Editar. Haz un scrapeo masivo con Rellenar faltantes para añadir logotipos a juegos que scrapeaste antes'
  - type: fix
    label: IGDB ya no da a un juego su logotipo como fondo de la página
  - type: feature
    label: 'Los juegos ahora tienen la parte trasera de su caja: el scrapeo la guarda desde ES-DE, ScreenScraper y TheGamesDB, y un botón Reverso en la portada de la página del juego la muestra. Haz clic en el reverso para ampliarlo. Puedes subir o eliminar un reverso en la ventana Editar. Los reversos se rellenan cada vez que se scrapea un juego; Rellenar faltantes no vuelve a scrapear un juego solo por su reverso'
  - type: fix
    label: Un juego sin portada frontal en TheGamesDB ya no recibe la parte trasera de la caja como portada
  - type: fix
    label: Si desactivas un scraper en Ajustes mientras se ejecuta un scrapeo masivo, el recuento de juegos no encontrados ahora es correcto desde el siguiente juego. Antes, un juego podía contarse como detenido
  - type: enhancement
    label: En un sistema sin emulador configurado, el botón Jugar aparece en gris. Pasa el cursor sobre él para ver el motivo, o haz clic para ver un cuadro que indica que no hay ningún emulador configurado. Antes, había una línea de texto junto al botón
  body: "<ul>\n  <li><strong>Los juegos tienen su logotipo.</strong> El scrapeo guarda el\n    logotipo de cada juego, y la página del juego lo muestra sobre el título, o en lugar de una\n    caja que falta. Haz un scrapeo masivo con Rellenar faltantes para añadir logotipos a\n    juegos que scrapeaste antes.</li>\n  <li><strong>Los juegos tienen la parte trasera de su caja.</strong> Un botón Reverso en\n    la portada de la página del juego la muestra, y puedes hacer clic para ampliarla. Los reversos\n    se rellenan cada vez que se scrapea un juego.</li>\n  <li><strong>Una captura de pantalla eliminada se queda eliminada.</strong> El siguiente scrapeo\n    ya no la copia de nuevo ni la descarga otra vez.</li>\n  <li><strong>Jugar indica por qué no puede iniciarse.</strong> En un sistema sin\n    emulador configurado, el botón Jugar aparece en gris e indica el motivo.</li>\n</ul>\n"
- version: 3.35.3
  date: '2026-11-02'
  tags:
  - type: feature
    label: 'Nueva herramienta Nombres MAME en Herramientas ROM: los juegos de MAME reciben sus nombres reales, años y fabricantes de la propia lista de MAME, y los archivos conservan sus nombres cortos. Después, un scrapeo encuentra cada juego, y puedes filtrar la lista de MAME por categoría, por ejemplo para excluir las tragaperras. Los sets de BIOS se ocultan de la lista'
  - type: fix
    label: Informes ROM ya no ofrece renombrar archivos de MAME, porque un archivo renombrado deja de funcionar en MAME
  - type: fix
    label: Ajustes ahora indica qué pide Microsoft antes de poder registrar una app de Xbox. Por esto no se pudo probar el inicio de sesión de Xbox
  - type: enhancement
    label: La tarjeta aparte de Nombres oficiales ya no está en Relleno masivo con AI, porque el interruptor de Nombre oficial del relleno ya hace esa tarea
  - type: fix
    label: Cuando Sony rechaza un inicio de sesión guardado de PlayStation, el panel y Ajustes ahora lo indican y te piden volver a vincular. Antes, el registro mostraba un error sin sentido en cada inicio del servidor y nada te avisaba
  - type: feature
    label: Importar desde Steam ahora rellena en segundo plano la descripción, los créditos, la puntuación de Metacritic, las clasificaciones por edad, los modos de juego, la caja, el fondo y las capturas de pantalla de cada juego desde su página de la tienda. Scrapea un juego para obtener su género y fecha de lanzamiento
  - type: feature
    label: Una sincronización de Steam ahora conserva tu tiempo de juego y cuándo jugaste por última vez, y la página del juego los muestra
  - type: fix
    label: Obtener biblioteca en la página de importación de Steam ahora funciona para un administrador con una clave de Steam guardada. Antes enviaba a Steam la versión oculta de la clave, y la página decía por error que pusieras tu perfil como Público
  - type: fix
    label: Un juego de Steam o Xbox que ya está en tu biblioteca con el mismo nombre ahora se vincula a ese juego al importarlo, así que sus logros se sincronizan. Antes se omitía y nunca se vinculaba
  - type: fix
    label: Los juegos importados de Steam, Xbox y PlayStation ahora se ordenan bien desde el principio, por ejemplo Final Fantasy IX antes de Final Fantasy X, y los signos de marca registrada de Steam se quitan de sus nombres
  - type: feature
    label: En los sistemas donde RetroAchievements usa un hash de archivo simple, como Mega Drive y Game Boy, la página del juego indica si tu copia da logros, y ese hash vincula el juego correcto. Ejecuta RA Refresh para rellenarlo
  - type: fix
    label: Un scrapeo ahora consulta a ScreenScraper por tu archivo exacto antes de buscar por nombre, así obtiene tu juego y no otro con un título parecido. Los resultados que marcas tú mismo siguen teniendo prioridad
  - type: enhancement
    label: El cuadro de progreso de Cambiar tamaño de imagen ahora indica el juego y el sistema de cada imagen
  - type: feature
    label: Scrapear ahora trae pantallas de título de ScreenScraper y TheGamesDB, más nombres oficiales de IGDB y TheGamesDB (como el título japonés de un juego), y las otras consolas en las que salió un juego desde IGDB
  - type: feature
    label: Un juego sin puntuación de usuarios ahora toma la clasificación de tu colección de ES-DE, si la tiene
  - type: feature
    label: La página del juego indica cuántos jugadores cronometraron un resultado de HowLongToBeat y enlaza a su página. Los resultados guardados antes mostrarán esto la próxima vez que los busques
  - type: feature
    label: La página de RetroAchievements muestra cuánta gente juega un juego y qué porcentaje de ellos consiguió cada logro
  - type: fix
    label: El explorador de carpetas de Herramientas ROM se abre en tu carpeta de ROM cuando no tiene carpeta de inicio, en lugar de fallar. Una respuesta ilegible de IGDB ahora cuesta solo ese dato, no todo lo que IGDB envió del juego
  - type: fix
    label: El límite diario de ScreenScraper ahora hace que RetroDB deje de consultar hasta más tarde, y un scrapeo masivo lo indica y continúa con sus otras fuentes. Antes, un límite agotado parecía «juego no encontrado» y las llamadas seguían toda la noche
  - type: fix
    label: Un juego al que ninguna fuente pudo responder mientras un servicio estaba en su límite ya no se marca como scrapeado, así que la próxima ejecución lo intenta de nuevo
  - type: fix
    label: Cuando una clave de TheGamesDB ha agotado su mes, RetroDB pasa a tu otra clave, y deja de consultar cuando ambas están agotadas
  - type: fix
    label: El límite mensual de RAWG ahora también hace que RetroDB deje de consultar, y IGDB se mantiene dentro de su límite de cuatro solicitudes por segundo
  - type: fix
    label: La búsqueda masiva de HowLongToBeat ahora termina con un mensaje cuando el sitio dice que ha recibido demasiadas solicitudes, y todas las solicitudes al sitio se espacian
  - type: fix
    label: Corregir regiones de caja y manual ya no se rinde tras 25 juegos seguidos que ScreenScraper no conoce. Solo se detiene cuando ScreenScraper dice que se alcanzó su límite
  - type: fix
    label: En la página del juego, cada clasificación por edad ahora queda centrada sobre su etiqueta de estimación de AI
  - type: fix
    label: El cupo de TheGamesDB en Ajustes ahora usa la comprobación que no gasta tu cupo, y ya no muestra una fecha de reinicio inventada cuando el servicio no da ninguna
  body: |
    <ul>
      <li><strong>Los juegos de MAME tienen sus nombres reales.</strong> La nueva herramienta MAME Names de ROM Tools toma nombres, años y creadores de la propia lista de MAME.
        Los archivos conservan sus nombres cortos, porque MAME los necesita. Puedes
        filtrar la lista de MAME por categoría, y los sets de BIOS se ocultan.</li>
      <li><strong>Las importaciones de Steam traen mucho más.</strong> Cada juego completa su
        descripción, créditos, puntuación de Metacritic, clasificaciones por edad, modos de juego e
        imágenes desde su página de la tienda. Una sincronización conserva tu tiempo de juego y la fecha en que
        jugaste por última vez. Un juego que ya está en tu biblioteca con el mismo nombre ahora
        se vincula con él, así que sus logros se sincronizan.</li>
      <li><strong>Los scrapes encuentran tu juego exacto.</strong> Un scrape consulta a
        ScreenScraper sobre tu archivo exacto antes de buscar por nombre. Los scrapes
        también traen pantallas de título, más nombres oficiales y las otras consolas
        en las que salió un juego.</li>
      <li><strong>RetroAchievements reconoce tu copia.</strong> En sistemas que
        usan un hash de archivo simple, como Mega Drive y Game Boy, la página del juego
        indica si tu copia da logros. Ejecuta RA Refresh para completar
        estos datos. La página de RetroAchievements también muestra cuántas personas juegan un juego
        y qué porcentaje de ellas consiguió cada logro.</li>
      <li><strong>Se respetan los límites en línea.</strong> Cuando ScreenScraper,
        TheGamesDB o RAWG alcanzan su límite, RetroDB deja de consultarlos hasta más tarde
        y un scrapeo masivo continúa con sus otras fuentes. Un juego para el que ninguna fuente
        pudo responder en ese momento se intenta de nuevo en la siguiente ejecución.</li>
      <li><strong>Un inicio de sesión rechazado de PlayStation se avisa.</strong> El panel
        y Ajustes ahora te piden volver a vincular cuando Sony rechaza un
        inicio de sesión guardado.</li>
      <li><strong>Official Names se ha movido.</strong> Su tarjeta separada ya no está
        en Bulk AI Fill, porque el interruptor Official name del relleno
        hace lo mismo.</li>
    </ul>
- version: 3.35.2
  date: '2026-11-02'
  tags:
  - type: fix
    label: El tiempo total de juego ya no cuenta los minutos como horas, ni en el panel, ni en los trofeos de coleccionista, ni en el gráfico de analíticas. Un juego de 36 minutos se contaba como 36 horas
  - type: fix
    label: HowLongToBeat ya no confunde una secuela con tu juego. Double Dragon II ya no recibe los tiempos de Double Dragon III
  - type: fix
    label: Una búsqueda masiva en HowLongToBeat ya no guarda el tiempo de un juego de otro sistema. Mario Golf de Game Boy Color ya no recibe el tiempo de Nintendo 64. Estas coincidencias ahora esperan en la página de revisión
  - type: fix
    label: Las búsquedas de HowLongToBeat, masivas o individuales, ahora usan el año de lanzamiento del juego, así que Doom de 1993 ya no recibe los tiempos de Doom de 2016
  - type: new
    label: Comprobar tiempos de juego guardados, en Herramientas ROM, envía a la página de revisión las coincidencias guardadas que parecen erróneas, donde conservas o borras cada una
  - type: fix
    label: Una búsqueda masiva en HowLongToBeat con Solo los que faltan ahora reintenta los juegos con coincidencia sin tiempo y deja un segundo entre peticiones
  - type: fix
    label: Una puntuación de coincidencia del 72% ya no aparece como 100% en la página del juego
  - type: fix
    label: Los juegos ya no muestran los RetroAchievements de otro juego. Resident Evil 4 de GameCube ya no muestra el conjunto de Resident Evil, y Ratchet Deadlocked ya no muestra el de Ratchet & Clank
  - type: fix
    label: Un scrapeo ahora elimina el enlace a RetroAchievements cuando allí no existe ese juego. Si no se puede conectar con RetroAchievements, el enlace se mantiene
  - type: fix
    label: RetroAchievements ahora encuentra más de tus juegos, a través del nombre del archivo ROM, títulos alternativos, acentos como en Ōkami y títulos con dos nombres
  - type: fix
    label: RetroAchievements ya no enlaza un juego con un conjunto extra, un hack o una demo, y X-Men ya no equivale a G-Men
  - type: new
    label: La página del juego muestra el nombre que RetroAchievements da al juego enlazado, para detectar fácilmente un enlace erróneo
  - type: fix
    label: Actualizar RA ahora guarda los puntos de cada juego, así que un juego ya no muestra 0 puntos
  - type: new
    label: La página del juego marca las clasificaciones por edad de la AI como una suposición basada en el contenido del juego, e indica cuándo empezó cada junta de clasificación. OutRun de 1987 ya no parece clasificado oficialmente por ESRB
  - type: new
    label: La página del juego marca las puntuaciones de reseñas y las cifras de ventas que vienen de la AI. Si cambias tú una clasificación o cifra de ventas, la marca desaparece
  - type: fix
    label: Se rechaza una puntuación de la AI en una escala incorrecta, así que un juego bien valorado ya no recibe 7 sobre 100 en un nuevo scrapeo
  - type: fix
    label: El número de votos de la AI ya no se guarda junto a la puntuación de otro sitio, y la página del juego ya no muestra uno guardado así
  - type: fix
    label: Un rango de ventas o una suma de dinero de la AI ya no se convierte en unas pocas copias vendidas
  - type: fix
    label: Las respuestas de la AI ya no guardan listas como código, ni las palabras N/A o None como valores, ni la propia consola del juego en otras plataformas
  - type: fix
    label: Rellenar con AI ahora conserva en el historial del juego el valor que reemplaza
  - type: fix
    label: Los juegos de cartucho ya no reciben un tipo de Guardado con batería inventado, y las nuevas respuestas de la AI ya no usan por defecto Edición estándar
  - type: fix
    label: La serie de un juego ya no sale de recortar su título, así que Need For Speed ya no está en una serie llamada Need. Los nombres de serie de IGDB se leen de nuevo y las suposiciones antiguas se borran para que el próximo scrapeo las rellene
  - type: fix
    label: Las descripciones ya no muestran códigos web en lugar de comillas, ni marcas de encabezado como
  - type: fix
    label: Cada empresa ahora tiene una sola grafía, así que al hacer clic en Sega aparecen todos los juegos de SEGA. Las regiones tienen un solo valor y las plataformas usan los nombres de la lista
  - type: fix
    label: Los títulos de juegos de RAWG ya no ganan un año, y los títulos alternativos ya no incluyen nombres de archivo como dosbox.exe
  - type: fix
    label: Re-scrapeo completo ya no reemplaza por una suposición una clasificación o un mando que hayas definido, y un scrapeo que falla a medias ya no escribe por una vía menos cuidadosa
  body: "<ul>\n  <li><strong>Las respuestas de la AI indican que son de la AI.</strong> Las clasificaciones por edad de la AI\n    se mantienen, marcadas como una suposición basada en el contenido del juego, con el año en que empezó cada\n    junta de clasificación. Las puntuaciones y ventas de la AI también están marcadas.</li>\n  <li><strong>RetroAchievements muestra el juego correcto.</strong> Las secuelas ya no\n    llevan los logros del primer juego. Tras actualizar, el\n    panel ofrece una vez una actualización de RetroAchievements. Púlsala para reparar\n    los enlaces antiguos. El progreso guardado con un enlace erróneo se elimina y la próxima\n    sincronización lo rellena de nuevo.</li>\n  <li><strong>Los totales de tiempo de juego son correctos.</strong> Los tiempos de menos de una hora se\n    contaban como horas, así que los totales del panel y los trofeos de coleccionista\n    eran demasiado altos. Algunos totales y trofeos bajarán.</li>\n  <li><strong>HowLongToBeat encuentra el juego correcto.</strong> Una secuela ya\n    no se hace pasar por tu juego, y ahora cuentan el sistema y el año del juego.\n    Una coincidencia de otro sistema, o de años después, te espera\n    en la página de revisión.</li>\n  <li><strong>Revisa lo ya guardado.</strong> Pulsa Comprobar tiempos de juego guardados\n    en Herramientas ROM para enviar a la página de revisión las coincidencias guardadas dudosas.\n    No cambia nada hasta que decidas.</li>\n  <li><strong>Los nombres de serie son reales.</strong> La serie de un juego ya no sale\n    de recortar su título. Tras actualizar, se borran los nombres de serie que eran\n    suposiciones, incluidos algunos correctos. El próximo scrapeo\n    los rellena con fuentes que nombran una serie.</li>\n  <li><strong>Texto limpio.</strong> Las descripciones ya no muestran códigos web ni\n    marcas de encabezado. Cada empresa tiene una grafía, cada juego una región, y\n    los nombres de archivo como dosbox.exe ya no aparecen como otros títulos. Esto\n    ocurre una vez, por sí solo, tras actualizar.</li>\n  <li><strong>Re-scrapeo completo respeta tus decisiones.</strong> Una clasificación o\n    un mando que hayas definido se mantiene salvo que una fuente aporte uno de verdad.</li>\n</ul>\n"
- version: 3.35.1
  date: '2026-11-02'
  tags:
  - type: fix
    label: Scrapear ya no toma una secuela por el juego que tienes. Street Fighter II ya no recibe datos de Street Fighter, ni Sonic the Hedgehog de Sonic 2, cuando falta el juego exacto
  - type: fix
    label: Un scrapeo masivo ahora solo acepta una coincidencia si el título coincide de verdad. La consola correcta y una fecha de lanzamiento ya no bastan por sí solas para aprobarla
  - type: fix
    label: Los mods, DLC, paquetes y actualizaciones de IGDB ya no coinciden con un juego, salvo que tu ROM tenga exactamente ese nombre
  - type: fix
    label: RAWG guarda un único registro para todas las versiones de un juego, así que cuando abarca varias consolas ya no aporta desarrolladora, distribuidora, clasificación por edades ni modos multijugador. Tampoco intenta adivinar el número de jugadores
  - type: fix
    label: El número de jugadores y los modos multijugador de IGDB ahora provienen de la consola propia del juego
  - type: fix
    label: Cuando varias fuentes coinciden igual de bien, ahora decide el orden de tus scrapers. RAWG ya no puntúa extra por tener imagen o puntuación de Metacritic, y las instalaciones nuevas ponen RAWG al final
  - type: fix
    label: Ya no se busca en RAWG para juegos de Commodore 64 y DOS, porque los archiva como Amiga y PC, y podría coincidir un juego de otra plataforma
  - type: fix
    label: El resultado de ScreenScraper que eliges ahora es siempre el juego que obtienes, incluso si dejas los resultados abiertos más de 10 minutos
  - type: fix
    label: Los acentos y la puntuación ya no reducen la coincidencia de un título, así que Pokémon encuentra Pokemon y R.B.I. encuentra RBI
  - type: fix
    label: Una fecha de lanzamiento ahora muestra solo lo que su fuente conoce. Un juego del que solo se sabe el año muestra ese año, no un 1 de enero o 31 de diciembre inventado
  - type: fix
    label: Las fechas de IGDB y RAWG ahora pertenecen a la consola propia del juego, y las de IGDB a su propia región, así que una copia de EE. UU. ya no muestra la fecha japonesa ni un port el año del original
  - type: feature
    label: La lista de fechas de lanzamiento de la página de un juego ahora se rellena con IGDB y ScreenScraper, no solo con la IA
  - type: added
    label: 'Nueva tarjeta en Herramientas de ROM: Ordenar fechas de lanzamiento elimina los días inventados que guardaron scrapeos anteriores, para que un scrapeo pueda rellenar la fecha real'
  - type: fix
    label: Los géneros, perspectivas y modos de juego ahora usan un único conjunto de nombres sea cual sea la fuente, así que los filtros encuentran todos los juegos. Un género ya no aparece como RPG y Role Playing Game a la vez
  - type: added
    label: 'Nueva tarjeta en Herramientas de ROM: Ordenar géneros, perspectivas y modos convierte lo que guardaron scrapeos anteriores, mueve palabras como FPV al campo correcto y corrige los números de jugadores que contradicen los modos de un juego'
  - type: fix
    label: Los juegos solo en línea de IGDB ya no se listan como multijugador local, y un juego que requiere dos jugadores ya no se lista como de un jugador
  body: "<ul>\n  <li><strong>Scrapear deja de tomar el juego equivocado.</strong> Una secuela ya no\n    pasa por el juego que tienes, así que Street Fighter II no recibe nada\n    de Street Fighter, y un scrapeo masivo exige que coincida el título, no\n    solo la consola. Los mods, DLC y paquetes de IGDB ya no coinciden salvo que tu\n    ROM tenga ese nombre exacto.</li>\n  <li><strong>RAWG deja de mezclar versiones de un juego.</strong> Cuando su registro\n    abarca varias consolas ya no aporta desarrolladora, distribuidora, clasificación por\n    edades ni modos multijugador, y ya no adivina el número de jugadores.\n    Ya no se busca en él para juegos de Commodore 64 y DOS.</li>\n  <li><strong>El orden de tus scrapers decide entre coincidencias iguales.</strong>\n    RAWG ya no puntúa extra por una imagen o una puntuación de Metacritic, y las instalaciones\n    nuevas lo ponen al final.</li>\n  <li><strong>Una fecha de lanzamiento muestra solo lo que su fuente conoce.</strong> Un\n    juego del que solo se sabe el año muestra ese año. Las fechas de IGDB y RAWG\n    pertenecen a la consola propia del juego, y la lista de fechas de lanzamiento ahora se rellena\n    también con IGDB y ScreenScraper.</li>\n  <li><strong>Un único conjunto de nombres para géneros, perspectivas y modos.</strong>\n    Los filtros ahora encuentran todos los juegos, y los juegos solo en línea ya no se listan\n    como multijugador local.</li>\n  <li><strong>Dos tarjetas nuevas en Herramientas de ROM.</strong> Ordenar fechas de lanzamiento y Ordenar\n    géneros, perspectivas y modos corrigen lo que guardaron scrapeos anteriores. Púlsalas y luego\n    ejecuta un scrapeo masivo con Rellenar faltantes.</li>\n  <li><strong>El número de jugadores proviene de la consola propia del juego,</strong> y\n    el resultado de ScreenScraper que eliges es siempre el juego que obtienes.</li>\n</ul>\n"
- version: 3.35.0
  date: '2026-11-01'
  tags:
  - type: fix
    label: ES-DE ahora mantiene su lugar en el orden de scrapeo cuando no es la fuente principal. Sus descripciones, compañías y carátulas eran reemplazadas por fuentes posteriores y por la IA
  - type: fix
    label: Las capturas de pantalla y pantallas de título de ES-DE ahora se añaden a un juego cuando ES-DE no es la fuente principal, salvo que se parezcan a una que ya tenga
  - type: fix
    label: ES-DE ya no copia una imagen de fanart, un vídeo o un manual que el juego ya tiene, y un Re-scrapeo completo ya no elimina una carátula que otra fuente acaba de descargar
  - type: fix
    label: ES-DE ahora lee la entrada del archivo ROM propio del juego, así que otra versión con el mismo nombre no puede aportar sus datos, y los juegos de PS3 en carpeta ya encuentran sus carátulas de ES-DE
  - type: fix
    label: Al importar logos de sistemas desde ES-DE ya no se toma una imagen sin relación porque su nombre contenga letras como "gb"
  - type: fix
    label: Una etiqueta en el nombre de archivo de una ROM, como (USA), ahora decide su región. Ya no se consulta a la IA, que podía clasificar una copia de USA como Europa o Japón
  - type: feature
    label: Nueva herramienta en Herramientas de ROM, Corregir regiones según nombres de archivo, que corrige los juegos que scrapeos anteriores hicieron mal de esta forma
  - type: fix
    label: Las imágenes de fondo de RAWG ya no se guardan como carátula, pues a menudo son capturas de pantalla y bloqueaban una carátula real. Ahora se usan como fanart
  - type: feature
    label: Nueva herramienta en Herramientas de ROM, Quitar imágenes de RAWG de las carátulas, que elimina las que guardaron scrapeos anteriores para que un scrapeo pueda encontrar carátulas reales
  - type: feature
    label: RetroDB ahora da crédito a RAWG con un enlace en la barra lateral, como pide RAWG
  - type: fix
    label: ScreenScraper ahora da a cada juego la carátula, la carátula 3D, el manual, el título y la fecha de lanzamiento de su propia región, en lugar de la primera región por orden alfabético
  - type: feature
    label: Nueva herramienta en Herramientas de ROM, Corregir regiones de carátulas y manuales, que cambia las carátulas y manuales que scrapeos anteriores de ScreenScraper tomaron de la región equivocada
  - type: fix
    label: Los vídeos de ScreenScraper ahora usan primero el archivo más pequeño, y el más grande solo si este falla
  - type: fix
    label: Cada scraper ahora busca en la consola correcta. Atari Lynx, arcade CPS, Super Famicom y otros se buscaban en la máquina equivocada, y ahora se buscan muchos más sistemas, en todas las fuentes y para logros
  - type: feature
    label: En la página de un juego, las teclas de flecha izquierda y derecha ahora van al juego anterior y al siguiente
  - type: feature
    label: La sección de Trucos en la página de un juego ahora se pliega y recuerda si la dejaste abierta
  - type: fix
    label: Al abrir una ventana que empieza en un cuadro de texto, como Scrapear, el cursor ahora se pone en ese cuadro en lugar de en el botón de cerrar
  - type: feature
    label: Nueva herramienta Revisión de capturas en Herramientas de ROM que muestra las capturas de pantalla de ZX Spectrum, Commodore 64 y Game Boy con las más sospechosas primero, y elimina solo lo que elijas
  - type: fix
    label: Scrapear ahora rechaza una captura de pantalla de Game Boy cuyo original tiene muchos más tonos de los que la máquina podría mostrar
  - type: fix
    label: Los paneles inferiores de un juego ahora caben en la ventana en lugar de salirse por el borde derecho
