  body: |
    <ul>
      <li><strong>Las versiones regionales de un juego se muestran como un
        solo juego.</strong> Enlaza las versiones que tienes (por ejemplo, las
        ediciones de EE. UU., Europa y Japón) y la Biblioteca muestra una sola
        tarjeta con una insignia &#127760;. La tarjeta abre e inicia la
        versión de tu Región predeterminada. La página del juego enumera todas
        las versiones una al lado de otra y te deja cambiar entre ellas.
        Herramientas ROM &gt; Versiones regionales sugiere grupos para que los
        editores los confirmen; no se enlaza nada sin ti. Nunca sugiere una
        secuela como versión de su primer juego. Las versiones enlazadas ya no
        se señalan como duplicados por su nombre. Ejecuta Completar títulos
        alternativos una vez para que las sugerencias tengan más datos con los
        que trabajar.</li>
      <li><strong>La IA puede resumir en qué se diferencian las versiones
        regionales.</strong> En un juego con versiones enlazadas, los editores
        pueden pulsar Resumir diferencias con IA en la sección Versiones
        regionales. La IA enumera las diferencias conocidas, como la censura,
        la dificultad o el contenido eliminado. La lista se marca como escrita
        por IA, aparece en la página de cada versión y se oculta cuando
        enlazas o desenlazas una versión hasta que se vuelve a escribir.
        Necesita un proveedor de IA configurado en Ajustes &gt; Scrapeo.</li>
      <li><strong>Los juegos de PlayStation empiezan con buenos
        ajustes.</strong> Para DuckStation, PCSX2 y RPCS3, RetroDB ahora fija
        la escala de resolución y la relación de aspecto de cada juego en el
        propio archivo de ajustes por juego del emulador cuando pulsas Jugar,
        y también si arranca a pantalla completa. Cámbialos para todo un
        sistema con el botón Settings en Ajustes &gt; Emulators, o para un
        solo juego en el nuevo panel Ajustes del emulador de su página. Un
        ajuste que cambies dentro del emulador siempre manda. RetroDB lee el
        número de serie de cada disco para encontrar el archivo correcto; los
        discos CHD necesitan tener chdman instalado.</li>
      <li><strong>Ya no se puede dirigir Rellenar con AI con texto escrito en
        los campos de un juego.</strong> Cuando Rellenar con AI revisa el
        editor, el desarrollador, la edición u otras plataformas que ya tiene
        un juego, ahora limpia antes ese texto, igual que ya hacía con el
        título.</li>
      <li><strong>Los análisis de Herramientas ROM se quedan dentro de tu
        carpeta de ROMs.</strong> Conversor CHD y Verificar CHD ya no siguen
        un acceso directo (enlace simbólico) que apunte fuera de ella, y al
        descomprimir un archivo de varios discos se ignora cualquier acceso
        directo guardado dentro del archivo.</li>
      <li><strong>Las páginas se niegan a ejecutar scripts colados en
        ellas.</strong> Tu navegador bloquea ahora cualquier script que
        RetroDB no haya escrito, así que un texto que cuele código en el
        título de un juego, una etiqueta o una descripción scrapeada no puede
        ejecutarlo. Los botones y los menús funcionan como antes.</li>
      <li><strong>Una captura de pantalla dañada ya no detiene la búsqueda de
        duplicados de un juego.</strong> Una captura ilegible se aparta y la
        comprobación sigue adelante.</li>
      <li><strong>Los trabajos de Herramientas ROM ya no se quedan atascados
        en «en curso».</strong> Un archivo borrado después de un análisis de
        Verificar CHD cuenta como no válido, y cualquier error inesperado en
        Conversor CHD, Verificar CHD o Buscador de duplicados termina el
        trabajo como fallido, con el error en su registro.</li>
      <li><strong>Antes de terminar la configuración, las peticiones de
        datos de la aplicación reciben una respuesta clara.</strong> Responden
        «Configuración necesaria» en lugar de devolver la página de
        configuración. Las páginas siguen llevándote al asistente de
        configuración.</li>
      <li><strong>Las secuelas ya no muestran los logros del primer
        juego.</strong> La búsqueda de coincidencias de RetroAchievements
        ignoraba el número del título, así que Donkey Kong Country 2 y 3
        quedaban enlazados a Donkey Kong Country. Ahora los números (2, II, 3,
        III, etc.) cuentan. Para corregir los juegos ya enlazados, ejecuta una
        vez Actualizar RetroAchievements para todos los sistemas.</li>
      <li><strong>Una sincronización de PlayStation ya no borra tus recuentos
        de trofeos.</strong> Cuando la respuesta de PlayStation omitía los
        totales de trofeos de un juego, RetroDB guardaba ceros sobre los
        recuentos que ya tenía. Ahora los conserva, también en la
        actualización masiva de trofeos.</li>
      <li><strong>Abrir un conjunto de trofeos que ya no está en el disco
        muestra un mensaje.</strong> La página Trofeos fallaba con un error;
        ahora dice que no se encontró el conjunto y te devuelve a la
        lista.</li>
      <li><strong>Las tablas de Herramientas ROM rotulan bien la columna de
        botones en todos los idiomas.</strong> El encabezado de la columna
        compartía texto con el género de juego Acción, así que algunos
        idiomas mostraban allí el nombre del género.</li>
      <li><strong>Los juegos de GameCube, 3DS y Super Famicom configuran su
        emulador automáticamente.</strong> RetroDB buscaba estos sistemas con
        nombres de carpeta que las bibliotecas no usan (gamecube, 3ds,
        superfamicom en lugar de gc, n3ds, sfc), así que Dolphin y Citra
        nunca se conectaban a ellos. Reinicia RetroDB una vez para que lo
        tenga en cuenta.</li>
      <li><strong>La descarga sin Python (independiente) vuelve a configurar
        los emuladores.</strong> Le faltaba el archivo que los
        enumera.</li>
      <li><strong>Unos 170 botones, etiquetas y mensajes más están
        traducidos</strong> en todos los idiomas. Antes aparecían en inglés, y
        unos pocos mostraban una traducción equivocada (algunos idiomas decían
        «la copia de seguridad falló» cuando un juego no se iniciaba).</li>
      <li><strong>Escape cierra solo la ventana de arriba.</strong> Con una
        pregunta abierta sobre otra ventana, Escape cerraba las dos; algunas
        ventanas además seguían funcionando después de que Escape las
        ocultara, y pulsar Escape en la página de un juego podía reanudar un
        scrapeo masivo que habías pausado. Ahora cada ventana se cierra con su
        propia acción de Cerrar, mantiene el foco del teclado dentro mientras
        está abierta y devuelve el foco al botón que la abrió. Las ventanas de
        progreso de los trabajos en curso siguen abiertas hasta que el trabajo
        termina.</li>
      <li><strong>Los gráficos de Análisis están en tu idioma.</strong> Los
        nombres de géneros, perspectivas, dimensiones y modos, los títulos de
        los gráficos, los nombres de los ejes y las leyendas estaban en inglés
        en todos los idiomas.</li>
      <li><strong>Los datos de RetroAchievements están más seguros.</strong>
        Si la lista de juegos de RetroAchievements de una consola no se carga,
        RA Refresh deja ahora enlazados los juegos de esa consola en lugar de
        desenlazarlos todos. Borrar datos de RA borra ahora solo el progreso de
        RetroAchievements; el progreso de Steam y Xbox se mantiene.</li>
      <li><strong>Las contraseñas deben tener al menos 12 caracteres en todas
        partes.</strong> La configuración inicial aceptaba una contraseña de
        administrador de cualquier longitud, y las páginas de cambio
        obligatorio de contraseña y de configuración decían que bastaban 4
        caracteres. Las tres piden ahora 12, igual que el resto de la
        aplicación.</li>
      <li><strong>Los totales de logros son correctos, y son tuyos.</strong>
        Sincronizar un juego desde RetroAchievements guarda ahora cuántos
        logros tiene, en lugar de 0. Los totales de logros del Panel cuentan
        solo tus juegos, y los Trofeos de coleccionista ya no cuentan dos veces
        cada logro de Steam o Xbox.</li>
      <li><strong>Las sincronizaciones en segundo plano usan tus propias
        cuentas.</strong> Una sincronización de sistema de RetroAchievements
        inicia sesión con tu propia cuenta de RetroAchievements cuando has
        configurado una. La actualización masiva de PlayStation reutiliza tu
        sesión guardada en lugar de iniciar sesión desde cero cada vez.</li>
      <li><strong>Solo tú puedes detener o reanudar tu propia
        sincronización.</strong> Otro usuario ya no puede cancelar tu
        sincronización de RetroAchievements, Steam o Xbox, y reanudar un
        trabajo interrumpido requiere los mismos permisos que iniciarlo. Los
        administradores pueden seguir haciendo ambas cosas.</li>
      <li><strong>Tu carpeta de trofeos de RPCS3 se comprueba al
        guardarla.</strong> Una carpeta que no existe, que no es una ruta
        completa o que es una carpeta del sistema se rechaza, como ya ocurría
        en los ajustes principales.</li>
      <li><strong>«Obtener todas las imágenes» del Museo se ejecuta en segundo
        plano.</strong> La página ya no espera minutos a que lleguen todas las
        imágenes de mandos. Muestra cuánto ha avanzado la descarga, tiene un
        botón Cancelar y retoma el progreso si sales de la página y
        vuelves.</li>
      <li><strong>Herramientas ROM protegen mejor tus archivos.</strong>
        Clean ya no vacía un archivo comprimido: no se puede guardar un patrón
        como <code>*</code>, y Clean se detiene si los patrones fueran a
        eliminar todos los archivos. Conversor CHD conserva el original cuando
        «verify» está desactivado, y deja en paz un CHD existente cuando «skip
        existing» está activado. Buscador de duplicados siempre conserva una
        copia de cada juego, aunque una petición las pida todas.</li>
      <li><strong>Los trabajos de Herramientas ROM hacen lo que dicen los
        botones.</strong> Pausar pausa ahora Conversor CHD, Verificar CHD,
        Buscador de duplicados y Deduplicar capturas, y un trabajo en pausa se
        puede cancelar. Un análisis de Deduplicar capturas que encuentra un
        error termina ahora como fallido en lugar de seguir para
        siempre.</li>
      <li><strong>Create M3U ya no deja los archivos comprimidos en una carpeta
        temporal.</strong> Los archivos movidos van ahora a la carpeta de datos
        de RetroDB, que no se vacía al reiniciar. El analizador de archivos
        muestra adónde fueron, y la confirmación por lotes avisa de que se
        moverán. Restablecer los ajustes de Herramientas ROM restablece ahora
        todas las opciones.</li>
      <li><strong>Cambia de disco desde RetroDB.</strong> Mientras se ejecuta
        un juego de RetroArch iniciado desde una lista de discos .m3u, la lista
        &#9654; Reproduciendo ahora de la parte superior de cada página muestra
        el título del juego y un botón Siguiente disco, así que un juego que
        pide la cara dos sigue con un clic, desde el navegador o desde un
        móvil. RetroArch debe tener activado Settings &gt; Network &gt; Network
        Commands (puerto 55355); el botón lo avisa si está desactivado.</li>
      <li><strong>El script de inicio abre RetroDB cuando está
        listo.</strong> start.sh, start.command y start.bat abrían el navegador
        tras 3 segundos fijos, a menudo antes de que el servidor pudiera
        responder, así que la página no cargaba. RetroDB la abre ahora en
        cuanto el servidor está escuchando. Si se inicia desde
        LocalWebServerManager, no abre ninguna página; usa el botón Open del
        gestor.</li>
      <li><strong>Los vídeos de juegos pueden ocupar hasta 500 MB.</strong> El
        límite era de 50 MB, demasiado poco para la mayoría de los tráileres.
        Una subida demasiado grande muestra ahora un mensaje en la página del
        juego en lugar de sustituir la página por texto plano. Un vídeo
        rechazado (demasiado grande o de un tipo de archivo incorrecto) ahora
        lo indica en lugar de descartarse sin decir nada.</li>
      <li><strong>El inicio sigue la ruta que has indicado.</strong> Un Binary
        path override en la fila de RetroArch de Ajustes &gt; Emulators manda
        ahora sobre la ruta de RetroArch de la parte superior de esa página;
        antes, la ruta de la fila se ignoraba. Pulsar Stop dos veces ya no
        pide dos veces al juego que se cierre; en Linux, RetroArch entiende una
        segunda petición como «salir sin guardar», así que podías perder la
        partida guardada del juego.
        Un ajuste del lanzador que quedaba de un modo remoto nunca terminado ya
        no impide que se inicie ningún juego.</li>
      <li><strong>Las acciones fallidas informan bien de sus errores.</strong>
        Cuando falla guardar, importar, sincronizar o analizar, RetroDB
        responde ahora con un estado de error real y muestra el motivo en su
        mensaje, en lugar de responder como si hubiera funcionado. Guardar un
        código de inicio de sesión de PSN que no puede conectarse ya no
        muestra detalles internos del error. Iniciar sesión, gestionar
        usuarios, tu perfil, los logros, las importaciones, Rellenar con AI y
        las búsquedas en HowLongToBeat hacen ahora lo mismo, y un idioma que no
        se puede guardar explica por qué en lugar de decir «Error de
        red».</li>
      <li><strong>Los juegos con nombres al estilo No-Intro ahora se
        scrapean.</strong> Un título como «Legend of Zelda, The» o «Legend of
        Zelda, The - Ocarina of Time» coincide ahora con los resultados de
        «The Legend of Zelda» en lugar de ser rechazado por el filtro de
        coincidencias. Informes de ROMs también deja de marcar esos nombres
        como discrepancias.</li>
      <li><strong>Los títulos sacados de nombres de archivo pierden todas sus
        etiquetas.</strong> Ahora se eliminan las regiones combinadas como «(USA,
        Europe)» y «(UK)». En ordenadores domésticos como el ZX Spectrum, se
        quita todo desde el año en adelante, así que «Chuckie Egg 2 (UK)
        (1985) (A'n'F Software) (tzx)» pasa a ser «Chuckie Egg 2». Un nombre de
        archivo que termina en «..zip» ya no deja un punto suelto. Las
        búsquedas de los scrapers, el restablecimiento de los datos de un
        juego y las sugerencias de Versiones regionales usan estos nombres más
        limpios.</li>
      <li><strong>Un título equivocado ya no se repite al volver a
        scrapear.</strong> El scrapeo masivo busca ahora con el nombre del
        archivo ROM, no con el título guardado para el juego. Un juego que una
        vez coincidió con el juego equivocado encuentra el correcto al
        scrapearlo de nuevo.</li>
      <li><strong>Los scrapers prefieren tu Región predeterminada.</strong>
        Cuando dos resultados empatan, gana ahora el de tu Región
        predeterminada o el de World, no siempre el de EE. UU. Dos títulos que
        solo son etiquetas de región ya no cuentan como coincidencia perfecta.
        Versiones regionales ya no confunde la X de «X-Men» con un número de
        secuela. Elegir qué versión muestra una tarjeta lee ahora solo el
        nombre del archivo ROM, no las carpetas que lo contienen, y entiende
        etiquetas antiguas como «(U)» y «(E)».</li>
      <li><strong>El registro muestra en qué se va el tiempo de scrapeo de
        cada juego.</strong> Después de cada juego, RetroDB registra una línea
        con los segundos dedicados a buscar, a cada fuente, a descargar, a
        procesar imágenes, a la IA y a guardar. Es el primer paso hacia
        scrapeos más rápidos.</li>
      <li><strong>Los scrapeos terminan antes: las imágenes pequeñas se
        mejoran después.</strong> Un scrapeo guarda ahora el juego con sus
        imágenes tal como se descargaron. Después, las carátulas y capturas de
        pantalla pequeñas se amplían en segundo plano, un juego cada vez. Las
        capturas duplicadas se descartan antes de todo ese trabajo. Si RetroDB
        se detiene a medias, continúa la próxima vez que se inicia.</li>
      <li><strong>Lee el manual de un juego en su página.</strong> El botón
        Manual abre ahora el PDF en una ventana sobre la página del juego. Pasa
        las páginas con Anterior y Siguiente, las teclas de flecha, Inicio y
        Fin, o deslizando el dedo en un móvil; cada página se pasa como la de
        un libro, o simplemente cambia si tu sistema pide menos movimiento.
        «Abrir PDF en una pestaña nueva» sigue ahí, y Ctrl+clic en Manual abre
        la pestaña directamente.</li>
      <li><strong>La barra lateral indica cuándo se siguen mejorando
        imágenes.</strong> Mientras las imágenes se mejoran en segundo plano,
        la barra lateral muestra «Mejorando imágenes — Juegos restantes: N».
        Un juego que aún está en espera lo indica en su página, y sus imágenes
        más nítidas aparecen allí solas cuando están listas. El interruptor de
        portada 2D/3D ya no tapa esa línea.</li>
      <li><strong>Las fuentes de respaldo se consultan a la vez.</strong>
        Cuando la fuente principal deja huecos, RetroDB consulta ahora todas
        las demás fuentes a la vez en lugar de una tras otra. Sus respuestas se
        siguen usando en el orden de tus Ajustes, así que la misma fuente gana
        en cada campo.</li>
      <li><strong>ES-DE lee su lista de juegos una sola vez.</strong> Cada
        scrapeo, incluidos los masivos, leía el gamelist.xml de ES-DE de un
        sistema dos veces por cada juego. RetroDB lo lee ahora una vez y solo
        vuelve a leerlo cuando el archivo cambia.</li>
      <li><strong>Aplicar en Buscar metadatos ya no vuelve a buscar.</strong>
        En la página de un juego, los resultados que marcaste se obtienen
        directamente de su fuente en lugar de buscarse por segunda vez. Si no
        marcas nada, solo la fuente que aplicaste y la IA rellenan los
        huecos.</li>
      <li><strong>ScreenScraper encuentra los juegos con subtítulo.</strong>
        No encontraba nada para un título como «Alone in the Dark: The New
        Nightmare» a menos que los dos puntos llevaran un espacio delante.
        RetroDB lo busca ahora así y, si sigue sin encontrar nada, por la parte
        anterior a los dos puntos.</li>
      <li><strong>Los juegos sin nada que jugar ya no ofrecen Jugar.</strong>
        Un juego añadido desde una importación de CLZ, Steam, Xbox o PSN no
        tiene archivo ROM. Su página ya no muestra el botón Jugar, ni Ajustes
        del emulador, ni la sección Iniciar al editarlo, igual que las tarjetas
        de la Biblioteca.</li>
      <li><strong>Los juegos de RetroArch están protegidos frente a dos malos
        ajustes.</strong> RetroDB da ahora a RetroArch un pequeño archivo de
        ajustes propio cada vez que inicia un juego, por encima del tuyo. Ajusta
        el teclado a tu escritorio (Wayland o X11), para que el teclado nunca
        deje de responder, y permite que el avance rápido vaya a toda
        velocidad, algo que los juegos de Commodore 64 usan para cargar
        rápido. El resto de tus ajustes de RetroArch no se toca.</li>
      <li><strong>Create M3U mantiene el juego en tu biblioteca.</strong>
        Convertir un archivo comprimido de varios discos en una lista de
        reproducción dejaba el juego apuntando al archivo, que se había movido
        a otro sitio. Ahora el juego apunta a la nueva lista de reproducción y
        conserva sus detalles e imágenes. Cuando un archivo contiene varias
        ediciones de un juego, cada una con su propio juego de discos, la lista
        usa ahora los discos de la primera edición en lugar de todos, e indica
        qué discos ha dejado fuera.</li>
      <li><strong>El Re-scrapeo completo puede conservar los medios que ya
        tienes.</strong> Marca «Conservar los medios existentes» junto al
        interruptor de Re-scrapeo completo. Los datos de texto se siguen
        actualizando, pero las imágenes, los vídeos y los manuales que ya están
        en el disco se quedan como están en lugar de descargarse de nuevo. Sin
        esa marca, un Re-scrapeo completo ya no pierde las capturas de pantalla
        que había descargado antes.</li>
      <li><strong>Los trabajos en segundo plano ya no pierden ni se saltan
        trabajo.</strong> Una actualización de RetroAchievements que se topaba
        con un juego problemático ya no descarta los juegos que ya había
        actualizado. Una sincronización o actualización reanudada ya no se
        salta el juego en el que estaba cuando se detuvo. Una sincronización
        de RetroAchievements o Steam reanudada desde una instantánea muy
        antigua se detiene ahora con un mensaje en lugar de informar de éxito
        sin haber sincronizado nada. La conversión a WebP comprueba un archivo
        WebP sobrante antes de fiarse de él, y no empieza si no puede leer el
        espacio libre en disco.</li>
      <li><strong>Actualizar una instalación muy antigua ya no puede perder
        datos sin avisar.</strong> Tres pasos antiguos de actualización de la
        base de datos podían perder filas en casos raros. Ahora copian las
        filas, o se detienen con un error claro en lugar de perderlas.</li>
      <li><strong>Los botones de la ventana Acerca de ya no aparecen
        cortados.</strong> La ventana es más ancha y sus cuatro botones están
        en dos filas, así que cada texto se ve entero; en un móvil se
        apilan.</li>
      <li><strong>Tu tema te sigue a un navegador nuevo.</strong> Al iniciar
        sesión en un navegador que no habías usado antes, ahora se muestra tu
        tema guardado. Antes, la página de inicio de sesión guardaba primero
        Cyberpunk y se quedaba.</li>
      <li><strong>El cuadro de contraseña del inicio de sesión ya no dice
        «Inicio de sesión de administrador».</strong> Todas las cuentas inician
        sesión con contraseña, así que el cuadro dice ahora simplemente Iniciar
        sesión. La página Cuenta y la página de Ayuda también lo dicen.</li>
      <li><strong>La Ayuda está al día en todos los idiomas.</strong> Las
        páginas de Ayuda traducidas describen ahora Versiones regionales, dicen
        que todas las cuentas necesitan contraseña y que tu tema se guarda con
        tu cuenta. La Ayuda en todos los idiomas, incluido el inglés, indica
        ahora el mínimo real de 12 caracteres para la contraseña.</li>
      <li><strong>Pequeñas correcciones:</strong> el fanart cuyo nombre de
        archivo lleva un apóstrofo se muestra ahora en las páginas de juegos y
        de trofeos; Ajustes ya no muestra un error de script en las cuentas
        que no son de administrador, y los lectores de pantalla oyen ahora qué
        pestaña de Ajustes está seleccionada; salir de una página ya no llena
        la consola del navegador de errores de peticiones canceladas; el modelo
        del ampliador de imágenes se descarga primero desde una dirección que
        funciona; y el instalador ya no falla en Windows cuando su salida se
        guarda en un archivo.</li>
      <li><strong>Una amplia ronda de correcciones de fiabilidad.</strong>
        Guardar un juego con el título en blanco ya no pierde tus otros
        cambios. Reiniciar deja ahora que los trabajos en curso se detengan
        primero de forma limpia. Create M3U se niega a sobrescribir una lista
        de reproducción o una carpeta existente. Vaciar la lista de archivos no
        deseados en Herramientas ROM significa ahora «no borrar nada», y dos
        patrones ya no atrapan nombres reales de ROM como «Release of the
        Dragon». Un archivo de trofeos de PS3 dañado ya no deja en blanco los
        trofeos de todos los juegos. Rellenar con AI escribe una sola región.
        Análisis cuenta cada juego una sola vez en el gráfico de valoraciones.
        Las importaciones de CLZ usan los nombres de género estándar. En las
        ventanas de edición, los géneros y otras etiquetas se pueden quitar en
        todos los idiomas, y los atajos de teclado ya no secuestran Ctrl+D ni
        Ctrl+G. Los espectadores ven el estado de compleción de un juego pero
        ya no pueden cambiarlo, porque es compartido por todos.</li>
      <li><strong>Los lectores de pantalla leen el interruptor Platform Match
        Required por su nombre visible</strong> en Ajustes → Scrapeo.</li>
      <li>En otros idiomas, Ajustes traduce ahora «Región predeterminada», y la
        pestaña Scrapeo se lee como un nombre y no como «scrapeo en curso».
        Las páginas de ayuda usan las mismas palabras.</li>
      <li><strong>Un juego que no se cierra ya no aparece como
        cerrado.</strong> Si un emulador sobrevive a Stop, RetroDB lo sigue
        mostrando como en ejecución. Un inicio de RetroArch que se rechaza ya
        no escribe antes su archivo de ajustes, y un emulador que falla de
        inmediato muestra su mensaje de error en la primera comprobación.</li>
      <li>Bibliotecas actualizadas: Pillow 13 (tratamiento de imágenes), numpy
        2.5.4 y onnxruntime 1.31 (ampliación de imágenes), además de las
        últimas versiones de las herramientas de compilación y
        publicación.</li>
      <li>Entre bastidores: el código de inicio de juegos se ha ordenado para
        que sea más fácil de seguir, se ha quitado código sin uso (una
        dirección de la API, una función auxiliar de PSN, un script de trofeos
        que ninguna página cargaba y un ajuste de tema para todo el sitio que
        nada leía), las respuestas de la aplicación al navegador se construyen
        en un solo sitio, se han corregido varios documentos de diseño para que
        coincidan con el código, se ha ordenado el conjunto de pruebas, y una
        nueva comprobación detecta un error de sintaxis de JavaScript antes de
        una publicación. Las entradas antiguas del registro de cambios que
        describían el código eliminado ahora lo indican.</li>
    </ul>
- version: 3.29.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Los otros nombres de un juego muestran la región de la que proceden
  body: |
    <ul>
      <li><strong>Los otros nombres de un juego muestran la región de la que
        proceden.</strong> La tarjeta También conocido como de la página del
        juego etiqueta cada nombre con su país o región, como Japón para
        «Rockman», en tu propio idioma. Los nombres etiquetados van primero,
        agrupados por región. Pasa el ratón sobre un nombre para ver su origen
        y cualquier nota, como «Título provisional».</li>
      <li>Los nombres de IGDB conservan ahora su región. Antes, solo los
        nombres de ScreenScraper la tenían.</li>
      <li>La etiqueta «SS» de ScreenScraper ya no aparece como región. Es el
        nombre propio de ScreenScraper para el juego, no un lugar.</li>
      <li>Herramientas ROM → Completar títulos alternativos revisa ahora todos
        los juegos scrapeados, así que los nombres que ya tienes ganan su
        región. Ejecútalo una vez para etiquetar tu biblioteca actual.</li>
    </ul>
- version: 3.28.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Indica a RetroDB tu carpeta de emuladores y él los configura
  - type: fix
    label: Correcciones en la página Ajustes → Emulators
  body: |
    <ul>
      <li><strong>Indica a RetroDB tu carpeta de emuladores y él los
        configura.</strong> Ajustes → Emulators tiene una nueva lista Carpetas
        de emuladores. Añade la carpeta donde están tus emuladores y RetroDB
        encuentra cada uno en ella, ya sea un AppImage, un script portátil o un
        Flatpak instalado, y lo enlaza con los sistemas que ejecuta. Un sistema
        que ya tiene un emulador que funciona lo conserva.</li>
      <li><strong>Mira qué sistemas están listos para jugar.</strong> La tabla
        Per-system mapping enumera ahora los emuladores de cada sistema, indica
        si cada uno funciona y te deja elegir el predeterminado de un sistema.
        Para DuckStation, PCSX2, RPCS3 y RetroArch también indica si los
        archivos de BIOS están en su sitio, y nombra los que faltan. RetroDB
        solo lee los archivos de BIOS; nunca copia ni descarga ninguno.</li>
      <li>El análisis de emuladores encuentra ahora todos los emuladores de una
        unidad de emuladores grande. Antes, podía detenerse pronto dentro de la
        propia carpeta de ajustes de un emulador.</li>
      <li>Los botones Auto-detect y Save de RetroArch vuelven a funcionar, y la
        ventana Edit emulator ya no aparece en la página hasta que pulsas
        Edit.</li>
    </ul>
- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Al aplicar metadatos se ve cuánto ha avanzado
  body: |
    <ul>
      <li><strong>Al aplicar metadatos se ve cuánto ha avanzado.</strong>
        Cuando eliges un resultado en Buscar metadatos, un anillo se llena del
        0 al 100 % con el porcentaje en el centro, y la línea de debajo indica
        qué está pasando: qué sitio se está consultando, qué imagen o vídeo se
        está descargando, o que se están procesando las imágenes. Una descarga
        grande, como un vídeo, mueve el anillo a medida que llega. Al 100 %,
        la página se recarga con el resultado, como antes.</li>
      <li>El anillo puede avanzar de forma irregular. Cada fuente decide
        cuántas imágenes envía solo cuando responde, así que la primera fuente
        con muchas imágenes puede llenar buena parte del anillo y las
        siguientes, menos.</li>
      <li>Si falla una aplicación, el anillo se cierra y un mensaje lo indica,
        sin recargar la página.</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Cada página se ajusta ahora a la ventana en la que está
  - type: enhancement
    label: La página del juego muestra los otros nombres en su propia tarjeta, y un botón Manual
  body: |
    <ul>
      <li><strong>Cada página se ajusta ahora a la ventana en la que está.</strong> Las páginas de tarjetas
        (Sistemas, Museo, Etiquetas, Listas, Herramientas ROM, trofeos y logros)
        añaden una columna cada vez que cabe otra tarjeta entera, hasta cuatro por fila.
        Las tablas, las herramientas y las páginas de detalle se ensanchan un poco, pero se detienen donde
        hacerlas más anchas solo separaría sus columnas. Ajustes mantiene sus recuadros con un
        ancho fácil de leer.</li>
      <li><strong>La Ayuda y el registro de cambios mantienen una longitud de línea
        cómoda.</strong> En una ventana ancha, los enlaces a las secciones de la Ayuda pasan a una
        columna junto al texto; en una estrecha quedan en una sola fila que puedes
        deslizar, en lugar de un bloque que tapaba buena parte de la pantalla
        del móvil.</li>
      <li><strong>La página del juego:</strong> en una ventana ancha, las capturas de pantalla ocupan
        la parte superior, y debajo, el vídeo y una nueva tarjeta <strong>También conocido
        como</strong> quedan uno al lado del otro, a la altura de la portada. Los otros
        nombres eran un texto tenue bajo el título; ahora están en una tarjeta
        fácil de leer. <strong>Manual</strong> es un botón junto a Jugar, y el
        Historial de scrapeo empieza plegado.</li>
      <li>Trofeos de PSN muestra de una a cuatro columnas según la ventana, en lugar de
        siempre tres.</li>
      <li>Varias páginas ya no se desplazan de lado en el móvil: Trofeos,
        Trofeos de coleccionista, la página de sistema de RetroAchievements, Ayuda, Ajustes,
        Análisis, Importaciones de juegos y las páginas de detalle de logros y trofeos.
        Allí, las tablas anchas ahora se desplazan dentro de sí mismas.</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Las páginas de la Biblioteca, de sistema y de juego se ajustan ahora a la ventana en la que están
  body: |
    <ul>
      <li><strong>Las páginas aprovechan una ventana ancha cuando eso ayuda, y solo entonces.</strong>
        La Biblioteca y cada página de sistema añaden una columna de tarjetas de juego
        cada vez que cabe otra tarjeta entera, hasta cuatro por fila. Un móvil muestra
        una; una ventana de media pantalla, dos o tres; una ventana ancha, cuatro. Antes las páginas
        se detenían en un ancho fijo y dejaban vacía la mayor parte de una ventana grande.</li>
      <li><strong>La página del juego coloca la portada y los detalles junto a las
        capturas de pantalla y el vídeo</strong> cuando caben uno al lado del otro, y si no, los
        apila. La descripción mantiene una longitud de línea cómoda.</li>
      <li><strong>El botón Jugar se ha movido a la esquina superior derecha de cada tarjeta,</strong>
        más pequeño y centrado. Ahora también comprueba que el archivo ROM del juego sigue
        ahí y que es de un tipo que su sistema acepta, así que solo aparece donde
        pulsarlo iniciará el juego. Se oculta mientras seleccionas juegos de forma
        masiva.</li>
      <li>El botón de volver arriba y las ventanas emergentes de progreso quedan justo al lado del
        contenido de la página, en lugar de en los bordes de la ventana.</li>
      <li>La página del juego ya no se desplaza de lado en el móvil.</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: El idioma de prueba «Pseudo» solo se ofrece a los administradores
  body: |
    <ul>
      <li><strong>«Pseudo» ya no aparece en la lista de idiomas para
        todo el mundo.</strong> Es una herramienta para desarrolladores que muestra cada palabra entre
        corchetes y con acentos, así que ahora solo se ofrece a los administradores. Cualquier otra persona
        que lo hubiera elegido ve la aplicación en inglés, con el inglés seleccionado en
        Ajustes.</li>
    </ul>
- version: 3.24.1
  date: '2026-10-17'
  tags:
  - type: fix
    label: La descarga para Windows vuelve a instalarse, y se acabó la avalancha de errores al cambiar el tamaño
  body: |
    <ul>
      <li><strong>La descarga normal para Windows no se podía instalar.</strong>
        El instalador se detenía en "Core dependencies failed to install",
        porque su lista fija de paquetes omitía un paquete que solo
        Windows necesita. La lista cubre ahora todas las plataformas. La descarga para Windows
        sin Python no se vio afectada.</li>
      <li><strong>Seguían apareciendo mensajes de error en la esquina superior derecha</strong>
        con el tema Cyberpunk después de ensanchar la ventana del navegador, por
        ejemplo al maximizarla. El fondo animado ahora cambia de tamaño
        sin problemas.</li>
    </ul>
- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Juega a un juego directamente desde las páginas de la Biblioteca y de sistema
  body: |
    <ul>
      <li><strong>Un botón ▶ Jugar en cada tarjeta de juego.</strong> Aparece en
        la esquina inferior izquierda de la carátula en la página de la Biblioteca y en
        cada página de sistema. Púlsalo y el juego se inicia en su emulador; te
        quedas en la lista en lugar de abrir primero la página del juego.</li>
      <li>El botón solo aparece donde pulsarlo puede funcionar: tu cuenta tiene
        permiso para iniciar juegos, y el emulador del juego está activado, instalado
        y, en el caso de RetroArch, tiene su núcleo. Los juegos de sistemas sin un emulador
        que funcione no muestran el botón.</li>
      <li>Si aun así el inicio falla, por ejemplo porque el archivo ROM se ha
        movido, el motivo aparece en un mensaje y la página se queda como
        estaba.</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: Una barra lateral más corta, con una sola página de Logros para todas las plataformas
  body: |
    <ul>
      <li><strong>Un solo enlace «Logros» sustituye a cinco.</strong>
        RetroAchievements, RPCS3, PSN, Steam y Xbox son ahora pestañas de una
        página, y el enlace vuelve a abrir la última pestaña que usaste. Si no tienes
        juegos de RetroAchievements, se abre en la pestaña RPCS3 en lugar de
        devolverte al Panel.</li>
      <li><strong>Informes de ROMs está ahora en Herramientas ROM,</strong> como una pestaña
        junto a las demás herramientas y una tarjeta en la página de Herramientas ROM.</li>
      <li><strong>Ya no hay dos enlaces de la barra lateral con el mismo icono:</strong> Panel es
        ahora 🏠 y Visor de registros 🧾. La barra lateral tiene 16 enlaces en lugar de
        21.</li>
      <li>Las pestañas de herramientas de la página de ajustes de Herramientas ROM estaban siempre en
        inglés; ahora siguen tu idioma.</li>
    </ul>
- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: Las búsquedas en How Long To Beat vuelven a funcionar
  body: |
    <ul>
      <li><strong>Todas las búsquedas en How Long To Beat decían que no se encontraba
        el juego.</strong> El sitio trasladó su búsqueda a una dirección nueva, así que
        las peticiones de RetroDB se rechazaban; el fallo empezó entre finales de
        julio y finales de septiembre. RetroDB usa ahora la dirección nueva y envía los
        filtros de plataforma y año en el nuevo formato del sitio, que el sitio
        había empezado a ignorar. Las búsquedas de un solo juego y la búsqueda masiva de Herramientas
        ROM vuelven a funcionar.</li>
    </ul>
- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: RetroDB dice ahora claramente que no apoya la piratería
  - type: fix
    label: La ventana Acerca de vuelve a abrirse a tamaño completo
  body: |
    <ul>
      <li><strong>La aplicación incluye ahora un aviso contra la piratería.</strong>
        Aparece en la ventana Acerca de y bajo la Ruta de la biblioteca de ROM en
        Ajustes, en todos los idiomas. Dice que RetroDB no distribuye ni
        aloja archivos ROM, que solo debes usar juegos copiados de discos y
        cartuchos que tengas, y que RetroDB no está afiliado a ningún
        fabricante de consolas, editora ni base de datos de juegos. El texto coincide con el
        sitio web y el tráiler de RetroDB.</li>
      <li><strong>La ventana Acerca de se mostraba apretada dentro de la barra lateral.</strong>
        Ahora se abre en el centro de la pantalla a su tamaño normal, y
        se desplaza en una pantalla pequeña en lugar de ocultar su título y su botón
        de cerrar.</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: RetroDB solo inicia o renombra con tipos de archivo ROM reales
  body: |
    <ul>
      <li><strong>Se podía iniciar un juego con un archivo que no es una
        ROM.</strong> Al renombrar una ROM se aceptaba cualquier nombre, así que
        <code>crash.bin</code> podía convertirse en <code>crash.cfg</code> y
        se le pasaba al emulador. Ahora, al iniciar se comprueba el tipo de archivo con la
        lista del <code>systeminfo.txt</code> de la carpeta de ese sistema, la misma lista
        que usa el análisis de la biblioteca, y al renombrar se rechaza un tipo que esa lista no
        incluye. Si la carpeta de un sistema no tiene lista, sus juegos no se iniciarán, y
        el mensaje indica qué archivo falta.</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: Solo un administrador puede cambiar los argumentos de inicio de un juego
  - type: fix
    label: Los argumentos de inicio con varias palabras, o con una comilla suelta, ya funcionan
  - type: fix
    label: RetroDB ya no guarda en memoria cada inicio terminado
  body: |
    <ul>
      <li><strong>Un editor podía añadir argumentos de inicio que ejecutaban otro
        código.</strong> Los <em>Argumentos de inicio personalizados</em> de un juego van directamente al
        emulador, y con RetroArch podían cargar cualquier archivo de programa del
        ordenador. Cambiarlos requiere ahora el rol de administrador, y el campo está
        oculto para todos los demás.</li>
      <li><strong>Los argumentos de inicio con más de una palabra llegaban al
        emulador como uno solo.</strong> <code>--a --b</code> llega ahora como dos
        argumentos, y un valor vacío no añade nada. Si faltaba una comilla de cierre,
        todos los inicios de ese juego fallaban con un error del servidor; ahora
        aparece un mensaje que indica el campo que hay que corregir. El token
        <code>{disc_paths}</code> se ha eliminado: siempre estaba vacío.</li>
      <li><strong>Los inicios terminados se acumulaban en memoria hasta que RetroDB
        se reiniciaba.</strong> Ahora se borra cualquier inicio que terminó hace más de una
        hora.</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: Elegir un idioma en Ajustes vuelve a funcionar
  body: |
    <ul>
      <li><strong>Elegir un idioma en Ajustes &rarr; Biblioteca &rarr;
        Visualización no hacía nada.</strong> Mostraba un error y la página
        seguía en su idioma anterior. Esto dejó de funcionar en la 3.23.8. Ahora, al elegir un idioma,
        se guarda y la página se recarga en ese idioma.</li>
    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: Los iconos de trofeos y de plataformas vuelven a estar en la descarga
  body: |
    <ul>
      <li><strong>A la descarga le faltaban los iconos de trofeos y de plataformas
        de RetroDB.</strong> Cada tarjeta de juego con RetroAchievements mostraba una imagen
        rota donde debía ir su insignia, y también faltaban los niveles de trofeos y los logotipos de PSN, Steam,
        Xbox y RPCS3. Ahora se incluyen en todas las
        descargas.</li>
    </ul>
- version: 3.23.14
  date: '2026-10-10'
  tags:
  - type: security
    label: Dos bibliotecas incluidas se actualizan con correcciones de seguridad publicadas
  body: |
    <ul>
      <li><strong>urllib3 y Werkzeug tenían problemas de seguridad conocidos.</strong>
        RetroDB incluye ahora urllib3 2.8.0 y Werkzeug 3.1.9, las versiones que
        los corrigen. Una instalación desde el código fuente los obtiene ejecutando
        <code>install.py</code> de nuevo, que instala desde
        <code>requirements.lock</code>.</li>
    </ul>
- version: 3.23.13
  date: '2026-09-26'
  tags:
  - type: fix
    label: Los archivos multimedia guardados como ruta de carpeta ya no se dan por desaparecidos
  body: |
    <ul>
      <li><strong>En la versión independiente, «borrar referencias a archivos multimedia
        que faltan» podía vaciar archivos multimedia que sí estaban.</strong> Ocurría cuando la base de datos
        guardaba el archivo como una ruta de carpeta, por ejemplo
        <code>images/boxart/…</code>, en lugar de solo el nombre del archivo. RetroDB
        ahora lo busca en la carpeta correcta.</li>
    </ul>
- version: 3.23.12
  date: '2026-09-26'
  tags:
  - type: fix
    label: El Panel muestra un scrapeo masivo en curso, y cuatro pequeñas correcciones
  body: |
    <ul>
      <li><strong>La tarjeta de progreso del scrapeo en el Panel nunca aparecía.</strong>
        Ahora se muestra mientras se ejecuta un scrapeo masivo, e indica cuándo está
        en pausa.</li>
      <li><strong>Se acabaron los errores en la consola del navegador en la página de inicio
        de sesión.</strong> Ya no comprueba las tareas en segundo plano antes de que nadie haya
        iniciado sesión.</li>
      <li><strong>El asistente de configuración ya no dice «¡Configuración completada!» cuando
        no se pudo guardar.</strong> Ahora te avisa de que no se pudieron guardar los
        ajustes.</li>
      <li><strong>Dos scrapeos masivos iniciados en el mismo segundo ya no comparten
        un id</strong>, así que las acciones de la cola, como cancelar, actúan sobre el
        correcto.</li>
    </ul>
- version: 3.23.11
  date: '2026-09-26'
  tags:
  - type: ui
    label: Los botones de donación dicen ahora qué apoyan
  body: |
    <ul>
      <li><strong>Textos de donación más claros.</strong> Los botones de la cabecera ahora
        dicen «Patrocinar» y «Apoyar en Patreon». El README indica que cada
        versión es gratuita y que las donaciones financian el propio RetroDB, no los
        emuladores y núcleos que puede iniciar.</li>
    </ul>
- version: 3.23.10
  date: '2026-09-26'
  tags:
  - type: fix
    label: Las páginas de Herramientas ROM siguen tus ajustes guardados, y las páginas de registros y de Herramientas ROM vuelven a funcionar
  body: |
    <ul>
      <li><strong>La página de registros y algunas páginas de Herramientas ROM no funcionaban.</strong>
        Un script de esas páginas fallaba al cargarse, así que el visor de registros y
        las utilidades compartidas de Herramientas ROM nunca arrancaban. Ahora se cargan
        correctamente.</li>
      <li><strong>Los ajustes de Herramientas ROM ahora sirven para algo.</strong> El Buscador de duplicados
        y el Conversor CHD se abren con sus opciones tomadas de la página de ajustes de
        Herramientas ROM, y puedes seguir cambiándolas para una sola ejecución.</li>
      <li><strong>Los interruptores del Conversor CHD se ignoraban.</strong> Desactivar
        «Eliminar archivos originales» en la página no impedía el borrado si
        tu ajuste guardado decía que se borrara. Ahora deciden los interruptores de la
        página.</li>
      <li><strong>El ajuste Ruta temporal se usa.</strong> Los archivos preparados
        al crear listas de reproducción M3U van ahora dentro de ella.</li>
    </ul>
- version: 3.23.9
  date: '2026-09-26'
  tags:
  - type: security
    label: Los archivos de registro de los scrapers ya no guardan contraseñas ni tokens, y los intentos de inicio de sesión vuelven a estar limitados
  - type: fix
    label: Guardar los ajustes ya no borra tus ajustes, y eliminar un usuario funciona
  body: |
    <ul>
      <li><strong>Los archivos de registro guardaban secretos en texto plano.</strong> Los archivos de registro
        de los scrapers debían ocultar los tokens de inicio de sesión y las claves de API, pero el paso
        de ocultarlos nunca se ejecutaba, así que se escribían completos. Ahora se ocultan.
        Los archivos de registro antiguos todavía los contienen; elimina los archivos antiguos de
        <code>logs/</code> si compartes tu instalación.</li>
      <li><strong>Los límites de intentos de inicio de sesión no se aplicaban.</strong> Los límites
        para inicios de sesión repetidos y para acciones pesadas (análisis, scrapeos, importaciones) estaban
        configurados pero nunca se activaron. Ahora funcionan, y una petición bloqueada
        recibe un mensaje claro de «demasiados intentos».</li>
      <li><strong>Un archivo de ajustes dañado podía borrarse.</strong> Si
        <code>data/settings.json</code> no se podía leer, el siguiente guardado
        lo sustituía por los valores predeterminados. RetroDB ahora conserva el archivo dañado como
        <code>settings.json.corrupt-&lt;time&gt;</code> antes de guardar. Si el
        archivo vuelve a leerse bien, en su lugar se rechaza el guardado.</li>
      <li><strong>La fila Motor de la nomenclatura perdía otros ajustes.</strong> Añadir una
        etiqueta a la fila Motor en los ajustes de nomenclatura fallaba, y además descartaba
        los ajustes de artículo y región guardados con ella. Ahora se guarda
        correctamente.</li>
      <li><strong>Eliminar un usuario fallaba.</strong> No se podía eliminar un usuario con etiquetas, listas,
        elementos en la lista de deseos o datos de PSN. Ahora, al eliminarlo se borran
        el usuario y todo lo que le pertenece.</li>
      <li><strong>Podían ejecutarse dos scrapeos a la vez.</strong> Intercambiar o
        mover en la cola un scrapeo masivo en curso iniciaba dos scrapeos que
        compartían un mismo contador de progreso. Ahora solo se ejecuta uno.</li>
      <li><strong>El progreso de un scrapeo masivo podía parecer un error.</strong>
        Antes de su primer acierto, un scrapeo masivo informaba de su estado de una forma que
        algunas pantallas interpretaban como un fallo. Ya está corregido.</li>
      <li><strong>Al iniciar sesión ahora vuelves a la página que habías pedido.</strong>
        Antes siempre iba al Panel.</li>
      <li><strong>Las acciones de archivos de administrador se quedan dentro de tus carpetas.</strong> La
        herramienta de redimensionar imágenes y las acciones de renombrar ROMs rechazan ahora todo lo
        que esté fuera de tu carpeta de multimedia o de ROMs.</li>
      <li><strong>Los antiguos archivos de inicio de sesión de PSN y Xbox se trasladan a tu
        cuenta.</strong> Un <code>data/psn_tokens.json</code> o
        <code>data/xbox_tokens.json</code> que haya quedado se carga en tu cuenta y
        se renombra para que termine en <code>.migrated-015</code>. Ese archivo todavía contiene
        el token, así que elimínalo cuando hayas comprobado que el inicio de sesión funciona.</li>
      <li><strong>Errores más claros del servidor.</strong> Una petición incorrecta ahora
        responde con un mensaje de error adecuado en lugar de «An internal error
        occurred».</li>
    </ul>
- version: 3.23.8
  date: '2026-09-25'
  tags:
  - type: fix
    label: La importación de CLZ vuelve a funcionar, las portadas de las listas se ven, y varias páginas ya no fallan con un apóstrofo
  - type: security
    label: Los nombres scrapeados y las rutas de archivo ya no pueden escaparse de los botones de la página
  body: |
    <ul>
      <li><strong>La importación de CLZ no hacía nada.</strong> Subir un PDF de CLZ lo enviaba
        a una dirección que el servidor no tiene, así que cada subida fallaba con
        «Parse failed». Ahora llega al analizador.</li>
      <li><strong>En la página de una lista faltaban todas las portadas.</strong> La página de la lista
        pedía cada portada en la dirección equivocada, y la columna Sistema estaba
        siempre vacía. Ahora se ven las dos. También se han corregido las imágenes de portada de la búsqueda
        «añadir un juego» de la página.</li>
      <li><strong>Los botones fallaban con nombres que tenían un apóstrofo.</strong> Quitar
        «Assassin's Creed» de una lista, eliminar una captura de pantalla, ampliar una portada
        o quitar una etiqueta de género podía no hacer nada sin avisar cuando el nombre
        contenía un apóstrofo. El mismo fallo permitía que un nombre scrapeado manipulado ejecutara
        código en la página. Ahora los nombres llegan a esos botones de una forma que
        no puede confundirse con código.</li>
      <li><strong>Las direcciones de imágenes y enlaces se escapan en todas partes.</strong> Algunas
        páginas construían direcciones de imágenes a partir de nombres de archivo scrapeados sin escaparlos,
        y cinco páginas llevaban su propia copia, más débil, de la función
        de escape. Ahora todas usan la compartida.</li>
      <li><strong>La página de Ajustes podía abrirse en blanco.</strong> Si una actualización había
        renombrado la última pestaña que usaste, Ajustes se abría sin ningún panel
        visible. Ahora ignora una pestaña que ya no existe. Los enlaces como
        <code>/settings#account</code> vuelven a abrir esa pestaña.</li>
      <li><strong>Tu tema te sigue ahora a otros dispositivos.</strong> El
        tema que eliges se guarda en tu cuenta. Un navegador al que nunca se le ha
        indicado un tema usa el que tienes guardado en lugar del predeterminado.</li>
      <li><strong>Las ventanas emergentes de progreso de las tareas muestran el icono correcto.</strong> Las tareas en pausa,
        terminadas y en cola mostraban el mismo icono de «en curso». Ahora cada estado
        tiene el suyo, según el tema.</li>
      <li><strong>La lista de atajos de teclado ya se puede traducir.</strong> Sus
        etiquetas eran invisibles para las herramientas de traducción, así que se quedaban en
        inglés en todos los idiomas.</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: Las clasificaciones por edad solían ser incorrectas, y los juegos scrapeados podían perder sus detalles
  body: |
    <ul>
      <li><strong>Las clasificaciones por edad eran a menudo incorrectas, y el error se propagaba.</strong>
        Cuando una clasificación venía de TheGamesDB, la aplicación buscaba el código de clasificación
        en cualquier parte del texto en lugar de leerlo correctamente &mdash; así que
        "T - Teen", "M - Mature 17+", "AO - Adults Only 18+" y
        "RP - Rating Pending" se guardaban todas con la clasificación equivocada, y un juego
        para adultos podía quedar registrado como apto para todos. Peor aún, esa clasificación errónea
        se usaba luego para rellenar los otros ocho sistemas de clasificación, así que una sola lectura
        equivocada se extendía a todos. Ahora las clasificaciones se leen a partir del código al
        principio del texto.</li>
      <li><strong>Las clasificaciones convertidas salían demasiado permisivas.</strong> Al rellenar
        una clasificación que faltaba a partir de otra que ya tenías, la aplicación podía usar una
        clasificación que acababa de calcular momentos antes en lugar de la que
        tenías realmente al principio. Cada paso perdía un poco de severidad. Ahora siempre
        convierte a partir de las clasificaciones que el juego tiene de verdad.</li>
      <li><strong>El Re-scrapeo completo borraba la Región y el Tipo de guardado elegidos a mano.</strong>
        Ninguno de los dos viene de un scraper &mdash; la aplicación los deduce
        &mdash; así que un Re-scrapeo completo sustituía tu «Japón» elegido por el
        «USA» predeterminado. Ahora tus valores se conservan, a menos que una fuente
        aporte de verdad uno nuevo.</li>
      <li><strong>Un scraper podía aceptar el juego equivocado.</strong> Los resultados de ScreenScraper
        normalmente se comprueban con una puntuación de coincidencia antes de usarse,
        pero una búsqueda que devolvía exactamente un resultado se saltaba esa comprobación por completo.
        Ahora se puntúan todos los resultados.</li>
      <li><strong>Un juego podía perder todos sus detalles scrapeados por un solo campo
        que faltaba.</strong> Si IGDB o ScreenScraper dejaban un único campo en blanco de una forma
        inesperada, se descartaba toda la actualización &mdash; editora,
        desarrollador, ilustraciones y todo lo demás. Ahora esos casos se gestionan y el resto de
        los detalles se conserva.</li>
      <li><strong>Una imagen fallida podía registrarse como un éxito.</strong> Si una
        imagen descargada resultaba no ser utilizable, la aplicación no borraba
        nada y aun así guardaba el nombre del archivo, dejando una referencia rota. Ahora el
        archivo se elimina y el campo no se toca.</li>
      <li><strong>Los modos de juego usan ahora términos coherentes.</strong> Distintos
        scrapers escribían "Single-player" y "Single-Player" y un simple
        "Multiplayer" que no era una de las etiquetas propias de la aplicación, así que esos juegos
        no se podían traducir ni encontrar con el filtro Modos. Ahora todas las fuentes
        escriben las mismas etiquetas. Los juegos existentes conservan su texto antiguo hasta que
        vuelvas a scrapearlos o ejecutes la herramienta de normalización en Ajustes.</li>
      <li><strong>Las búsquedas de Xbox se comportan ahora como las de cualquier otra fuente.</strong>
        Hacían sus propias peticiones web, así que no reintentaban cuando Xbox Live
        les pedía que fueran más despacio, ni tenían límite en la cantidad de datos que podía
        traer una respuesta. Ahora usan la misma conexión compartida que los demás
        scrapers.</li>
      <li><strong>Se ha eliminado código de ScreenScraper sin usar.</strong> Se han borrado dos funciones
        a las que nada en la aplicación llamaba. Una de ellas devolvía una dirección
        web con tu contraseña de ScreenScraper dentro, lo que habría
        entregado la contraseña a cualquier cosa que la usara. El "System Media
        Endpoint" que figuraba en las notas de las versiones 3.6.x era una de ellas &mdash;
        nunca fue accesible desde ninguna parte de la aplicación.</li>
    </ul>
- version: 3.23.5
  date: '2026-09-02'
  tags:
  - type: fix
    label: La descarga empaquetada no podía arrancar, y otras correcciones de compilación
  body: |
    <ul>
      <li><strong>La descarga independiente no podía arrancar en absoluto.</strong> La
        versión empaquetada lleva su propio Python, pero el lanzador que incluía era
        el escrito para la instalación desde el código fuente &mdash; buscaba
        archivos de Python que una versión empaquetada no contiene, y se detenía en la
        primera línea. El paquete incluye ahora su propio lanzador, que simplemente ejecuta
        la aplicación y abre tu navegador cuando el servidor está listo.</li>
      <li><strong>El acceso directo de escritorio de la descarga para Linux no abría
        nada.</strong> Venía con un texto de relleno donde debía ir la ruta a
        la aplicación. Ahora hay un <code>install-launcher.sh</code>
        junto al lanzador &mdash; ejecútalo una vez y el acceso directo se escribe
        con la ruta real al lugar donde lo descomprimiste.</li>
      <li><strong>Arrancar desde el código fuente instalaba dependencias sin
        verificar.</strong> Cuando faltaba Flask, el script de inicio descargaba
        paquetes directamente de internet sin comprobar sus sumas de verificación, y se saltaba
        de paso el gestor de paquetes de tu sistema. Ahora cede el control a
        <code>install.py</code>, que usa el archivo de bloqueo con sumas de verificación.</li>
      <li><strong>La descarga del código fuente llevaba archivos de mantenimiento que no
        debía.</strong> La lista de lo que había que excluir se mantenía a mano y
        se había quedado atrás, así que los resultados de auditorías y carpetas de compilación sobrantes
        se empaquetaban con la aplicación. La descarga se construye ahora a partir de la lista
        de archivos que hay realmente en el proyecto, que no puede desfasarse.</li>
      <li><strong>Dos paneles de Ajustes fallaban en la versión empaquetada.</strong> Los
        paneles de estadísticas de la biblioteca y de estado de las API buscaban el programa principal por
        un nombre que no tiene dentro de una versión empaquetada, así que ambos fallaban.</li>
      <li><strong>Algunos textos en pantalla nunca se podían traducir.</strong> Tres
        partes más recientes de la aplicación &mdash; los ajustes de emuladores, el botón de inicio
        y la barra de «Reproduciendo ahora» &mdash; quedaban fuera del análisis
        de traducción, y la comprobación pensada para detectarlo miraba la misma
        lista incompleta. El análisis cubre ahora todos los archivos automáticamente, y
        sus textos se han añadido a las traducciones.</li>
      <li><strong>Regenerar las traducciones podía no hacer nada sin avisar.</strong>
        Al añadir texto a un script propio de una página, la regeneración creía que no
        había nada que hacer, así que el texto nuevo nunca llegaba al archivo
        de traducción.</li>
      <li><strong>Un apaño para una tarjeta gráfica se aplicaba a todo el mundo.</strong>
        El script de inicio para Linux imponía un ajuste pensado para una tarjeta AMD concreta
        en todos los equipos, lo que podía bloquear el escalador de imágenes en otro hardware
        AMD. Ahora solo se aplica cuando esa tarjeta está realmente presente, y
        nunca sustituye un valor que hayas establecido tú.</li>
      <li><strong>El script de publicación podía publicar la versión equivocada.</strong>
        Una etiqueta sobrante de un intento anterior se reutilizaba sin avisar, así que la
        compilación podía hacerse a partir de una instantánea más antigua mientras informaba de que
        todo había ido bien.</li>
    </ul>
- version: 3.23.4
  date: '2026-09-02'
  tags:
  - type: fix
    label: Nueve formas en que tu biblioteca podía perder datos, corregidas
  body: |
    <ul>
      <li><strong>«Borrar datos scrapeados» borraba toda tu biblioteca.</strong> El
        cuadro de confirmación contaba solo los juegos que se habían scrapeado de verdad,
        y luego la acción vaciaba todos los juegos igualmente &mdash; así que podía
        prometer una docena y borrar miles. Con las imágenes activadas también
        eliminaba portadas que habías subido a mano y restablecía títulos que habías
        editado tú, en juegos que nunca se habían scrapeado. Ahora hace
        exactamente lo que dice el cuadro.</li>
      <li><strong>La carátula 3D dejaba un enlace roto.</strong> Al borrar con
        imágenes se eliminaba la portada 3D del disco, pero la base de datos seguía apuntando a
        ella, así que la aplicación buscaba un archivo que ya no existía.</li>
      <li><strong>El interruptor «Añadir» de la Edición masiva sustituía en lugar de añadir.</strong>
        Para Perspectiva y Dimensión hacía justo lo contrario de lo que indicaba su etiqueta,
        sobrescribiendo los valores existentes de todos los juegos seleccionados a la vez, sin
        forma de deshacerlo.</li>
      <li><strong>Las versiones independientes podían borrar todas las referencias a imágenes con un
        clic.</strong> En la descarga empaquetada, la aplicación buscaba tus archivos multimedia
        en el lugar equivocado, decidía que faltaban todas las imágenes, y
        «borrar referencias a archivos multimedia que faltan» vaciaba entonces las entradas de ilustraciones, capturas de pantalla,
        vídeo y manual de toda la biblioteca. La comprobación de seguridad que
        existe precisamente para detectar esto no podía verlo. Solo se vio afectada la versión
        empaquetada.</li>
      <li><strong>La limpieza de archivos huérfanos podía eliminar ilustraciones mientras llegaban.</strong>
        Una portada descargada mientras se ejecutaba la limpieza podía tratarse como un
        archivo huérfano y eliminarse.</li>
      <li><strong>Al crear listas de reproducción se movían tus archivos comprimidos sin preguntar.</strong>
        Crear listas de reproducción M3U por lotes movía tus archivos comprimidos originales aunque
        hubieras dejado esa opción desactivada &mdash; y cuando sí lo pedías,
        informaba de un fallo en un traslado que había funcionado.</li>
      <li><strong>El redimensionador de imágenes inflaba tu carpeta de multimedia.</strong>
        Trataba las miniaturas pequeñas que genera como imágenes nuevas que ampliar,
        agrandándolas a tamaño completo y creando luego miniaturas de esas. Cada
        ejecución añadía más archivos, las páginas servían sin avisar imágenes a tamaño completo en lugar de
        miniaturas, y el escalador con IA trabajaba sobre aproximadamente el triple del número
        de archivos previsto.</li>
      <li><strong>El relleno con IA sobrescribía detalles que habías corregido.</strong> En un
        scrapeo normal podía sustituir tu propia editora, desarrollador, género, clasificaciones
        por edad y más. Ahora solo rellena huecos; el botón Rellenar con AI que pulsas
        tú no cambia.</li>
      <li><strong>Los scrapeos repetidos podían eliminar una captura de pantalla buena.</strong> Los juegos
        scrapeados desde RAWG reutilizaban los mismos nombres de archivo, así que un segundo scrapeo
        sobrescribía una captura guardada y luego la eliminaba como duplicada mientras la
        biblioteca todavía la mostraba.</li>
    </ul>
- version: 3.23.3
  date: '2026-09-01'
  tags:
  - type: fix
    label: Los roles del hogar hacen ahora exactamente lo que dicen, y una cuenta desactivada queda realmente bloqueada
  body: |
    <ul>
      <li><strong>Desactivar a alguien ahora cierra su sesión.</strong> Desactivar
        una cuenta la ocultaba de todas las pantallas, pero quien ya hubiera iniciado sesión
        con esa cuenta seguía trabajando con normalidad hasta una semana. Desactivar
        es la única forma de bloquear a alguien sin llegar a eliminarlo, así que ahora
        surte efecto en su siguiente clic.</li>
      <li><strong>Las cuentas de solo lectura ya no pueden cambiar los datos de los juegos.</strong>
        Tres acciones de «how long to beat» estaban abiertas a cualquier persona con sesión iniciada,
        incluidas las de solo lectura — así que una cuenta de solo lectura podía sobrescribir un
        tiempo de juego, o borrarlo de todos los juegos de la biblioteca. Ahora requieren
        permisos de edición, como cualquier otra acción que cambia un juego.</li>
      <li><strong>El registro de trofeos vuelve a funcionar para todos.</strong>
        Actualizar tus propios trofeos de coleccionista requería permisos de editor, que los
        roles Jugador y Espectador no tienen — y es lo único que
        escribe esos trofeos. Esas cuentas nunca podían ganar uno, y el
        botón Actualizar solo mostraba un error. Es tu propio progreso, así que
        ahora no requiere ningún permiso especial.</li>
      <li><strong>La actualización de PlayStation de una persona ya no la puede detener
        nadie más.</strong> Cualquier cuenta con sesión iniciada podía pausar o cancelar una
        actualización que había iniciado otra persona, y podía ver en qué juego
        estaba esa persona. Ahora ambas cosas se limitan a quien la inició.</li>
      <li><strong>Las importaciones de Steam usan tu propia cuenta, no la de quien guardó la suya
        primero.</strong> La importación de la biblioteca leía una única copia compartida de las
        credenciales de Steam en lugar de las tuyas, así que podía traer la
        biblioteca de otra persona — mientras tus propios datos guardados parecían faltar.</li>
      <li><strong>Adivinar una contraseña de administrador vuelve a ser difícil.</strong> El límite
        de intentos fallidos de inicio de sesión era compartido por todos en la red,
        así que cualquiera con su propia cuenta podía reiniciarlo iniciando sesión y seguir
        intentándolo indefinidamente. Ahora el límite es por cuenta.</li>
      <li><strong>Los errores de la aplicación llegan ahora a la página en lugar de desaparecer.
        </strong> Cuando se rechazaba una acción, 115 de ellas respondían de una forma que la
        página no podía leer, así que parecía que la acción había funcionado. Ahora
        informan del rechazo correctamente, y ves el mensaje real.</li>
    </ul>
- version: 3.23.2
  date: '2026-08-06'
  tags:
  - type: fix
    label: Las páginas de ajustes de los scrapers cargan más rápido y nunca muestran una clave de API desfasada
  body: |
    <ul>
      <li><strong>Las páginas de Ajustes y de configuración de scrapers dejan de volver a leer el
        archivo de ajustes de los scrapers en cada petición.</strong> Cuatro sitios lo
        abrían y lo volvían a analizar desde el disco cada vez que se ejecutaba una página o una comprobación,
        aunque ya existía un lector compartido con caché. Ahora todos lo usan,
        así que esas páginas trabajan menos en cada visita.</li>
      <li><strong>Guardar sigue surtiendo efecto al instante.</strong> Una caché que
        olvida por temporizador podría haberte mostrado los valores antiguos hasta medio
        minuto después de guardar. Ahora cada guardado vacía la caché al escribir,
        así que lo que ves es lo que acabas de guardar.</li>
      <li><strong>Tus claves de API reales ya no pueden ser sustituidas por su propio
        valor enmascarado.</strong> Las páginas de ajustes muestran las claves guardadas como
        <code>***1234</code> en lugar de la clave real. Como la página
        recibía la misma copia de los ajustes que usan los scrapers, ese enmascaramiento
        podría haber sobrescrito las claves auténticas en memoria y dejado a los scrapers
        iniciando sesión con asteriscos hasta que caducara la caché.</li>
      <li><strong>Las versiones independientes buscan ahora los ajustes de los scrapers en el lugar
        correcto.</strong> Los scrapers deducían la ubicación del archivo de forma distinta
        a las páginas que lo guardan. En una instalación normal ambos coincidían en el
        mismo archivo; en una versión independiente (de doble clic) no habría sido así,
        de modo que las claves de API guardadas podían acabar en un sitio donde los scrapers nunca
        miraban.</li>
    </ul>
- version: 3.23.1
  date: '2026-08-06'
  tags:
  - type: fix
    label: El puerto del servidor que guardas en Ajustes es ahora el puerto que usa
  body: |
    <ul>
      <li><strong>Guardar un puerto del servidor ahora sí traslada el servidor.</strong>
        Ajustes aceptaba un puerto, lo comprobaba, lo guardaba y te decía que hacía falta reiniciar
        para aplicarlo &mdash; y luego el servidor arrancaba en el 5000 de todos modos.
        Nada volvía a leer ese valor. Ahora forma parte de la cadena de arranque,
        así que un reinicio sí traslada RetroDB al puerto que elegiste. Lo que esté
        definido en el entorno sigue teniendo prioridad, así que un lanzador o contenedor que
        asigne un puerto no se ve afectado.</li>
      <li><strong>Dos ajustes que nunca hacían nada se han eliminado
        en lugar de repararse.</strong> «Host del servidor» y «modo de depuración» se
        guardaban y hacían la misma falsa promesa. Activar el modo de depuración desde
        un formulario web habría expuesto una consola interactiva de Python en el
        navegador, y la dirección de enlace controla qué equipos pueden acceder a
        RetroDB &mdash; ninguno de los dos debe estar tras un formulario de ajustes. Ambos siguen
        siendo configurables desde el entorno, donde ya estaban. Si tu
        archivo de ajustes todavía los contiene, se descartan sin avisar al cargar;
        no tienes que hacer nada.</li>
      <li><strong>Ya nada dice que un reinicio lo aplicará a menos que un reinicio
        lo aplique.</strong> Ese era el verdadero defecto &mdash; un ajuste muerto es
        un desorden, pero una falsa promesa te hace perder una tarde.</li>
    </ul>
- version: 3.23.0
  date: '2026-08-06'
  tags:
  - type: enhancement
    label: Inicia RetroDB en el puerto que elija otra herramienta
  body: |
    <ul>
      <li><strong>RetroDB lee ahora un ajuste <code>PORT</code> de su
        entorno.</strong> Si inicias RetroDB desde otra herramienta &mdash; un
        panel, un contenedor, un panel de servidor doméstico &mdash; esa herramienta puede ahora
        indicarle a RetroDB el puerto que quiere que use, sin que nadie edite un archivo.
        Define <code>PORT</code> y RetroDB se enlaza a ese puerto; déjalo sin definir y
        no cambia nada en absoluto. El <code>RETRODB_PORT</code> existente sigue
        funcionando exactamente igual que antes, y <code>PORT</code> tiene prioridad si están definidos los dos.</li>
      <li><strong>Un número de puerto incorrecto ahora lo dice en lugar de adivinar.</strong>
        Antes, un puerto ilegible producía un muro de texto de error de Python, y
        un puerto fuera del rango utilizable solo se descubría cuando el servidor
        no conseguía arrancar. Ahora RetroDB se detiene de inmediato con una línea que indica el
        valor que no pudo usar. Nunca arrancará sin avisar en un puerto distinto
        del que se le pidió &mdash; que te cambien de sitio sin avisar es peor que
        recibir un no.</li>
      <li><strong>El mensaje de inicio y la pestaña del navegador siguen el puerto
        real.</strong> La dirección que se muestra cuando RetroDB arranca, y la página que
        te abre, decían siempre 5000 fuera cual fuera el puerto que se estaba usando
        de verdad.</li>
    </ul>
- version: 3.22.1
  date: '2026-07-31'
  tags:
  - type: fix
    label: Evita que el archivo temporal de la base de datos crezca sin límite
  body: |
    <ul>
      <li><strong>El diario de la base de datos vuelve a tener límite.</strong> SQLite mantiene un archivo temporal (el archivo <code>-wal</code>) junto a la base de datos de tu biblioteca. RetroDB pretendía limitarlo a 64&nbsp;MB, pero el límite solo se aplicaba a las tareas en segundo plano &mdash; las cargas de página y las ediciones normales no tenían ningún límite. Tras una escritura inusualmente grande, el archivo se quedaba para siempre en su tamaño máximo, a veces mayor que la propia base de datos. Ahora está limitado en todas partes, así que el espacio se devuelve.</li>
    </ul>
- version: 3.22.0
  date: '2026-07-05'
  tags:
  - type: enhancement
    label: Scrapea un juego directamente desde su ventana emergente, sin el paso extra
  body: |
    <ul>
      <li><strong>Scrapea desde la ventana emergente del juego.</strong> La ventana
        emergente rápida del juego (la que aparece cuando haces clic en un juego de
        tu Biblioteca) ahora tiene un botón <strong>Scrapear</strong> junto a
        Rellenar con AI y Editar. Haz clic en él y RetroDB te lleva directo a ese
        juego con la búsqueda de metadatos ya abierta &mdash; se acabó abrir la
        página completa y buscar antes el botón Scrapear.</li>
    </ul>
- version: 3.21.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Inicio con un clic — abre RetroDB desde un icono anclado, sin terminal
  - type: feature
    label: Un icono de aplicación de verdad — un mando neón en la pestaña del navegador y la barra de tareas
  - type: feature
    label: Nuevo botón Apagar servidor en la página de Ajustes
  body: |
    <ul>
      <li><strong>Ábrelo con un clic.</strong> RetroDB ahora tiene un lanzador
        propio que puedes anclar a tu barra de tareas &mdash; haz clic en él y la
        aplicación se inicia (si no está ya en marcha) y se abre automáticamente
        en tu navegador. Se acabó abrir un terminal y escribir un comando. En
        Linux, ejecuta una vez <code>python3 scripts/install_launcher.py</code>
        para añadir &ldquo;RetroDB&rdquo; a tu menú de aplicaciones y luego
        ánclalo.</li>
      <li><strong>Un icono de aplicación de verdad.</strong> RetroDB ahora luce un
        icono de mando neón &mdash; cian y magenta cyberpunk sobre un mosaico
        oscuro &mdash; en la pestaña de tu navegador (el favicon), en el lanzador
        de la barra de tareas y en el propio programa de Windows. Sustituye al
        sencillo emoji provisional.</li>
      <li><strong>Botón Apagar servidor.</strong> Los Controles del servidor de la
        página de Ajustes ahora incluyen un botón rojo
        <strong>Apagar servidor</strong> junto a Reiniciar. Detiene la aplicación
        de forma limpia (dejando que las tareas en curso terminen de guardar
        primero), así que ya no necesitas cambiar al terminal y pulsar
        Ctrl+C.</li>
      <li><strong>Las versiones descargables abren el navegador por ti.</strong>
        Las descargas listas para usar de Windows, Mac y Linux ahora abren tu
        navegador un momento después de iniciarse, para que la aplicación esté
        ante ti sin ningún paso adicional.</li>
    </ul>
- version: 3.20.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Once nuevos idiomas — RetroDB ahora habla 21 idiomas
  - type: fix
    label: 'Corregido un error inofensivo de consola al salir de la lista de juegos'
  body: |
    <ul>
      <li><strong>Once nuevos paquetes de idioma.</strong> La interfaz de
        RetroDB, las notas de la versión y el manual de ayuda ahora están
        traducidos al Afrikaans, isiZulu, isiXhosa, Dutch, Norwegian
        (Bokm&aring;l), Russian, Polish, Turkish, Ukrainian, Indonesian y
        Hebrew &mdash; sumándose al German, Spanish, French, Italian,
        Japanese, Korean, Portuguese de Brasil, y al Chinese Simplificado y
        Tradicional ya existentes. Elige el tuyo en Ajustes &rarr;
        Preferencias de visualización &rarr; Idioma; la aplicación se recarga
        en el idioma elegido.</li>
      <li>Cada idioma cubre toda la aplicación: cada botón, etiqueta y
        mensaje, todo el historial de notas de la versión, y la guía de ayuda
        completa.</li>
      <li><strong>isiZulu &amp; isiXhosa</strong> también están incluidos. Al
        ser idiomas con poco vocabulario informático existente, mantienen los
        términos técnicos habituales (ROM, scraper, box art) en inglés cuando
        no existe una palabra natural &mdash; se agradece la revisión de un
        hablante nativo antes de confiar plenamente en ellos.</li>
      <li><strong>Hebrew</strong> se lanza con el texto totalmente traducido;
        un diseño de página de derecha a izquierda pulido (para que la
        interfaz se refleje correctamente) llegará en una actualización
        posterior. Arabic le seguirá en cuanto se complete ese trabajo de
        diseño.</li>
      <li><strong>Corrección:</strong> al salir de la Biblioteca o de la lista de juegos de un sistema ya no aparece un &laquo;ReferenceError&raquo; inofensivo en la consola del navegador (un resto de una limpieza anterior). Sin efecto visible &mdash; solo una consola más limpia.</li>
    </ul>
- version: 3.19.1
  date: '2026-07-05'
  tags:
  - type: performance
    label: Rastreo más rápido — las capturas de un juego ahora se descargan a la vez
  body: |
    <ul>
      <li><strong>Las capturas de pantalla se descargan en paralelo.</strong>
        Siguiendo el mismo enfoque que el popular frontend ES-DE (que obtiene todo
        el material gráfico de un juego a la vez), RetroDB ahora descarga las
        capturas de un juego <strong>de forma simultánea</strong> en lugar de una
        tras otra, para todas las fuentes (TheGamesDB, IGDB, RAWG, ScreenScraper).
        Los juegos con varias capturas terminan notablemente antes.</li>
      <li>La comprobación de capturas duplicadas se sigue ejecutando después y en
        orden, así que la eliminación de imágenes repetidas mantiene exactamente la
        misma precisión que antes &mdash; solo se ha acelerado la descarga. Las
        descargas están limitadas a cuatro a la vez para que ninguna fuente se
        sobrecargue.</li>
      <li>Mejora de velocidad interna; surte efecto tras el próximo reinicio.</li>
    </ul>
- version: 3.19.0
  date: '2026-07-05'
  tags:
  - type: performance
    label: Rastreo más rápido — ahora las fuentes se consultan a la vez
  body: |
    <ul>
      <li><strong>El rastreo es más rápido por juego.</strong> Cuando RetroDB busca
        un juego, consulta varias bases de datos (ES-DE, TheGamesDB, IGDB, RAWG,
        ScreenScraper). Antes las consultaba <em>de una en una</em> y esperaba la
        respuesta de cada una antes de preguntar a la siguiente &mdash; así que la
        espera era la suma de todas ellas. Ahora las consulta todas <strong>a la
        vez</strong> y solo espera a la más lenta, lo que supone una aceleración
        notable en cada juego. Los resultados se siguen ordenando y puntuando
        exactamente igual que antes.</li>
      <li><strong>Menos saludos desperdiciados al descargar arte.</strong> Las
        descargas de imágenes ahora reutilizan una conexión ya abierta en lugar de
        abrir una nueva para cada imagen, ahorrando tiempo en los juegos con muchas
        capturas.</li>
      <li>Se trata de mejoras de velocidad internas &mdash; no cambia nada en cómo
        usas RetroDB, y no exige más a las bases de datos (las mismas peticiones,
        solo solapadas). Surten efecto tras el próximo reinicio.</li>
    </ul>
- version: 3.18.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Añadidas las clasificaciones por edad de China (China) como noveno sistema de clasificación
  body: |
    <ul>
      <li><strong>Nuevo sistema de clasificación por edad: China (CADPA).</strong>
        RetroDB ahora admite el esquema oficial de aviso de edad para videojuegos de
        China (&ldquo;网络游戏适龄提示&rdquo;, emitido por CADPA) junto a los ocho
        organismos existentes (ESRB, PEGI, CERO, USK, ACB, FPB, GRAC y ClassInd).
        Utiliza tres niveles &mdash; <strong>8+</strong>, <strong>12+</strong> y
        <strong>16+</strong> &mdash; mostrados con un sencillo distintivo verde.</li>
      <li><strong>Se rellena solo, como los demás.</strong> Cuando un juego ya tiene
        una clasificación de cualquier otro país, RetroDB calcula automáticamente el
        nivel equivalente de China (y viceversa). También puedes elegirlo o
        cambiarlo a mano en la pantalla de Edición de un juego, y seleccionarlo como
        tu sistema de visualización preferido en Ajustes &rarr; Biblioteca. Nota: la
        mayoría de las bases de datos de juegos occidentales no publican una
        clasificación de China, así que en los juegos sin ninguna clasificación se
        rellena a partir del contenido del juego durante el rastreo / AI Fill.</li>
      <li>Los distintivos verdes son obra gráfica propia y sencilla de RetroDB (a
        juego con el estilo de los demás organismos), no el logotipo oficial de
        CADPA, por lo que no hay ninguna atadura de licencia de imágenes.</li>
    </ul>
- version: 3.17.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Borra las referencias de la base de datos a archivos de material gráfico que faltan en el disco
  - type: security
    label: Protege contra el borrado de todo el material gráfico de tu biblioteca cuando desaparece una carpeta de medios
  body: |
    <ul>
      <li><strong>Nueva herramienta de mantenimiento: &ldquo;Referencias de medios faltantes&rdquo;</strong>
        (Ajustes &rarr; Sistema &rarr; Mantenimiento). Es la imagen especular de la
        limpieza existente de &ldquo;Medios huérfanos&rdquo;: en lugar de buscar
        archivos de imagen sobrantes sin ningún juego, busca juegos cuya carátula,
        carátula 3D, capturas de pantalla, fanart, vídeo o manual apuntan a archivos
        que ya no están en el disco. Búscalos y luego borra esas referencias obsoletas
        con un solo clic para que los rastreadores puedan volver a descargar el
        material gráfico. Las entradas de tus juegos en sí nunca se tocan.</li>
      <li><strong>Limpieza automática más segura durante el rastreo.</strong> Cuando
        RetroDB vuelve a rastrear un juego, borra silenciosamente las referencias a
        archivos de medios que han desaparecido del disco. Antes, si toda una carpeta
        de medios desaparecía de golpe &mdash; una unidad externa desmontada o un
        borrado masivo &mdash;, esa limpieza podía borrar el registro del material
        gráfico que tenían miles de juegos, obligando a costosos re-rastreos. Ahora
        RetroDB reconoce esa señal: si una carpeta de medios falta o está
        completamente vacía, conserva las referencias y registra una advertencia en
        lugar de borrarlas. La nueva herramienta de mantenimiento aplica la misma
        protección y señala claramente cualquier carpeta que haya retenido.</li>
    </ul>
- version: 3.16.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Nuevo panel de "Soluciones rápidas" en el panel de control
  body: |
    <ul>
      <li><strong>Un nuevo panel de &ldquo;Soluciones rápidas&rdquo; en el Panel de control</strong>
        convierte las tareas dispersas de la biblioteca en una lista de tareas
        pendientes de un vistazo. Muestra cuántos juegos siguen sin carátula y ofrece
        atajos de un solo clic para encontrar ROMs duplicadas y comprobar rutas de ROM
        rotas (juegos cuyos archivos se han movido o borrado). Cada atajo enlaza
        directamente con la página que lo soluciona. El panel aparece en cuanto tienes
        juegos en tu biblioteca.</li>
    </ul>
- version: 3.15.0
  date: '2026-07-03'
  tags:
  - type: accessibility
    label: Los lectores de pantalla ahora anuncian el progreso de las tareas
  body: |
    <ul>
      <li><strong>Las tareas de larga duración ahora anuncian su progreso a los
        lectores de pantalla.</strong> Durante un rastreo masivo, una
        sincronización de logros (RetroAchievements o PlayStation) o un cambio
        de tamaño de imágenes, los usuarios de lectores de pantalla no oían nada
        entre &laquo;iniciado&raquo; y &laquo;terminado&raquo;. RetroDB ahora
        anuncia hitos periódicos (por ejemplo, &laquo;12 de 40&raquo;) y la
        finalización, sin ventanas emergentes adicionales. Los anuncios están
        espaciados para informar sin resultar molestos y respetan el idioma que
        hayas elegido.</li>
    </ul>
- version: 3.14.0
  date: '2026-07-01'
  tags:
  - type: feature
    label: Nuevos idiomas — chino (simplificado y tradicional) ya disponible
  body: "<ul>\n  <li><strong>RetroDB ya está disponible en chino.</strong> Hay dos opciones\n    en <strong>Configuración &rarr; Sistema &rarr; Idioma</strong>:\n    <strong>中文 (简体)</strong> (simplificado, para China continental) y\n    <strong>中文 (繁體)</strong> (tradicional, para Hong Kong y Taiwán). Toda\n    la interfaz &mdash; menús, botones, mensajes y el manual de ayuda integrado\n    &mdash; está traducida, y todo lo que aún no lo está recurre discretamente\n    al inglés. Con esto, los idiomas admitidos llegan a diez (inglés, alemán,\n    español, francés, italiano, japonés, portugués brasileño, coreano y ahora\n    chino simplificado &amp; tradicional).</li>\n</ul>\n"
- version: 3.12.0
  date: '2026-06-30'
  tags:
  - type: feature
    label: Nuevo idioma — el coreano (한국어) ya está disponible
  body: |
    <ul>
      <li><strong>RetroDB ya está disponible en coreano (한국어).</strong>
        Selecciónalo en Ajustes &rarr; Sistema &rarr; Idioma. Toda la interfaz
        &mdash; menús, botones, mensajes y el manual de ayuda integrado &mdash;
        está traducida, lo que eleva a ocho los idiomas admitidos (inglés,
        alemán, español, francés, italiano, japonés, portugués de Brasil y
        coreano). El coreano completa la cobertura de todos los organismos de
        clasificación por edades que muestra RetroDB, incluido el GRAC de Corea
        del Sur.</li>
    </ul>
- version: 3.11.0
  date: '2026-06-30'
  tags:
  - type: enhancement
    label: Apoya RetroDB en Patreon — nuevo enlace de donación añadido
  body: |
    <ul>
      <li><strong>Ahora puedes apoyar RetroDB en Patreon.</strong> Hay un
        enlace de Patreon junto al botón existente «Patrocinar en GitHub» en
        <strong>Ajustes &rarr; Sistema &rarr; Apoyar el desarrollo</strong>, en
        el panel Acerca de y en el README del proyecto. RetroDB sigue siendo
        completamente gratuito y de código abierto: las donaciones son
        totalmente opcionales y simplemente ayudan a mantener el desarrollo en
        solitario.</li>
    </ul>
- version: 3.10.0
  date: '2026-06-26'
  tags:
  - type: enhancement
    label: El registro de cambios ahora carga más rápido con un botón «Cargar más»
  body: "<ul>\n  <li><strong>La página del registro de cambios ahora se abre mucho más rápido.</strong>\n    En lugar de dibujar todo el historial de versiones (cientos de entradas) cada vez\n    que la abres, RetroDB ahora muestra las 20 entradas más recientes y añade un botón\n    <strong>Cargar más</strong> al final. Haz clic en él para mostrar el siguiente\n    lote, y así sucesivamente &mdash; el historial más antiguo sigue estando todo ahí,\n    solo se carga cuando hace falta en vez de ralentizar la primera vista.</li>\n</ul>\n"
- version: 3.9.0
  date: '2026-06-17'
  tags:
  - type: feature
    label: El manual de ayuda y las notas de versiones recientes ahora están traducidos a los 6 idiomas
  body: "<ul>\n  <li><strong>El manual de Ayuda completo dentro de la aplicación ya está disponible en\
    \ los seis\n    idiomas</strong> &mdash; alemán, francés, español, italiano, japonés\n    y portugués\
    \ de Brasil &mdash; no solo en inglés. RetroDB muestra el\n    manual en el idioma que hayas elegido\
    \ en Ajustes y recurre discretamente\n    al inglés si algo aún no está traducido.</li>\n  <li><strong>Este\
    \ Registro de cambios ahora también aparece en tu idioma</strong> para las\n    versiones más recientes,\
    \ y las nuevas versiones se traducirán de aquí en adelante.\n    El historial más antiguo se mantiene\
    \ en inglés.</li>\n  <li><strong>La página de Lista de deseos y los últimos restos de texto en inglés</strong>\n\
    \    &mdash; un conjunto de mensajes emergentes de error y de estado que se habían pasado por alto\n\
    \    cuando llegaron los paquetes de idioma en la 3.8.0 &mdash; ahora se traducen\n    correctamente\
    \ en toda la aplicación.</li>\n</ul>\n"
- version: 3.8.2
  date: '2026-06-17'
  tags:
  - type: security
    label: Actualización de dependencia de seguridad + correcciones de CI
  body: "<ul>\n  <li><strong>Seguridad:</strong> se actualizó la biblioteca <code>cryptography</code>\n\
    \    incluida (47 → 49) para resolver un aviso publicado (GHSA-537c-gmf6-5ccf).\n    Sin cambios de\
    \ comportamiento, solo una versión\n    más segura.</li>\n  <li>Se corrigió la canalización automatizada\
    \ de pruebas: faltaba un componente auxiliar de solo pruebas\n    (<code>beautifulsoup4</code>) que\
    \ hacía fallar la ejecución de pruebas desde la v3.7.0,\n    y el nuevo script de compilación del\
    \ empaquetado activaba una comprobación de análisis estático que es\n    un falso positivo conocido\
    \ (ejecuta comandos de compilación de confianza, no entradas del usuario)\n    &mdash; ahora está\
    \ documentado y calibrado. Solo mantenimiento; nada cambia en la\n    aplicación en sí.</li>\n</ul>\n"
- version: 3.8.1
  date: '2026-06-17'
  tags:
  - type: improvement
    label: Opción de descarga más pequeña, organización de las donaciones y corrección de traducción (Pass
      46.3 / 47.6)
  body: "<ul>\n  <li><strong>Pronto llegará una descarga mucho más pequeña.</strong> La\n    versión lista\
    \ para usar de RetroDB, de \"solo descomprimir y hacer doble clic\", ahora se puede\n    compilar\
    \ en una variante <strong>solo CPU</strong> (~600&nbsp;MB) para quienes\n    no tienen una tarjeta\
    \ gráfica AMD &mdash; aproximadamente una sexta parte del tamaño de la versión\n    completa. Ambas\
    \ se ofrecerán una al lado de la otra para que puedas elegir la que\n    se adapte a tu equipo.</li>\n\
    \  <li><strong>El panel \"Apoyar el desarrollo\" en Ajustes ahora se traduce</strong>\n    junto con\
    \ el resto de la aplicación &mdash; se había quedado accidentalmente en\n    inglés cuando llegaron\
    \ los paquetes de idioma en la 3.8.0.</li>\n  <li>Se ordenaron los enlaces de donación (la insignia\
    \ de GitHub Sponsors en el README; el\n    archivo de financiación está listo para Patreon y Buy&nbsp;Me&nbsp;A&nbsp;Coffee\
    \ una vez\n    que se configuren). Sin pantallas insistentes, nunca.</li>\n  <li>Entre bastidores:\
    \ la canalización de versiones ahora puede compilar las versiones listas para usar\n    para Windows,\
    \ macOS y Linux de forma automática. Nota: el extenso\n    manual de <em>Ayuda</em> dentro de la aplicación\
    \ sigue siendo solo en inglés por ahora &mdash; eso está\n    registrado como trabajo futuro.</li>\n\
    </ul>\n"
- version: 3.8.0
  date: '2026-06-12'
  tags:
  - type: feature
    label: Traducción completa de la interfaz + 6 idiomas (Pass 43.2/43.3/43.5)
  body: "<ul>\n  <li><strong>RetroDB ahora habla 6 idiomas más.</strong> Sobre la base\n    sentada en\
    \ la 3.7.0, toda la interfaz se ha hecho traducible y\n    traducida automáticamente al <strong>alemán,\
    \ francés, español, italiano,\n    japonés y portugués de Brasil</strong>. Elige tu idioma en\n  \
    \  Ajustes &rarr; Preferencias de visualización &rarr; Idioma; sigue tu\n    preferencia guardada,\
    \ luego tu navegador y, por último, recurre al inglés &mdash; nunca\n    puede quedarse atascado en\
    \ un idioma faltante.</li>\n  <li><strong>Todo lo que aparece en pantalla está cubierto</strong>:\
    \ el texto de las páginas y los botones,\n    los mensajes emergentes (las pequeñas notificaciones\
    \ &ldquo;toast&rdquo;), los diálogos de edición\n    y de ajustes, las descripciones emergentes y\
    \ las etiquetas para lectores de pantalla. Los géneros de los juegos,\n    las perspectivas y los\
    \ modos de juego (p. ej. &ldquo;First-Person-Shooter&rdquo;) ahora\n    se muestran también en tu\
    \ idioma &mdash; mientras que los datos subyacentes se mantienen en\n    inglés para que tu biblioteca\
    \ y tus filtros sigan funcionando exactamente como antes.</li>\n  <li>Un idioma <strong>&ldquo;Pseudo&rdquo;\
    \ integrado</strong> (visible en el\n    menú de Idioma) es una herramienta de control de calidad\
    \ para traductores que rodea y acentúa cada\n    etiqueta, lo que deja inmediatamente claro si se\
    \ pasó por alto algún texto.</li>\n  <li>Las traducciones automáticas son un punto de partida y pueden\
    \ resultar un poco rígidas en\n    algunos lugares &mdash; son fáciles de pulir con el tiempo, y cualquier\
    \ texto sin\n    traducción simplemente se muestra en inglés.</li>\n</ul>\n"
