  body: |
    <ul>
      <li><strong>Trucos para RetroArch (RetroDB), DuckStation y
        PCSX2.</strong> Ajustes &gt; Emuladores tiene una nueva sección
        Trucos. Descarga allí los paquetes de trucos públicos y gratuitos,
        o importa carpetas de trucos que ya tengas; RetroDB copia los
        archivos y nunca cambia tu carpeta. La página de un juego muestra
        entonces sus trucos, cada uno con un interruptor de
        activar/desactivar, y un cuadro de búsqueda cuando hay muchos.
        En RetroArch (RetroDB) los trucos que actives se aplican la
        próxima vez que pulses Jugar, y los cambios que hagas en el menú
        de RetroArch durante la partida se conservan. En DuckStation y
        PCSX2 los interruptores se guardan en los propios ajustes del
        emulador para ese juego, así que los cambios hechos dentro del
        emulador también se ven en la página. RetroDB nunca sobrescribe
        un archivo de trucos que el emulador ya tenga. Un truco activado
        pausa el modo hardcore de RetroAchievements.</li>
      <li><strong>Importa una caja 3D de Slipcase a un juego.</strong> La
        página de un juego tiene un botón Importar caja 3D bajo la
        carátula. Elige el archivo <code>.box.json</code> que guardó
        Slipcase, junto con sus imágenes, y RetroDB guarda para ese juego
        el frontal, el lomo, la trasera y las demás caras de la caja. Slipcase 1.4.0 o posterior guarda este archivo junto a cada imagen exportada. Tu
        imagen de carátula 3D no cambia. Un juego que ya tiene caras
        pregunta antes de reemplazarlas, y Eliminar las borra.</li>
      <li><strong>Gira en tus manos la caja 3D de un juego.</strong> Haz
        clic en la carátula de un juego con una caja de Slipcase importada
        y la caja aparece en 3D. Arrástrala, o usa las flechas del
        teclado, para girarla y ver el lomo, la trasera, la parte de
        arriba y la de abajo. Desplaza la rueda o pulsa + y - para hacer
        zoom; haz doble clic o pulsa Inicio para devolverla a su sitio. Un
        juego sin caja importada sigue ampliando su imagen de
        carátula.</li>
      <li><strong>Ajustes enlaza con la página de Emuladores.</strong> La
        página de Emuladores no tenía ningún enlace en Ajustes, así que
        solo se podía llegar escribiendo su dirección. Los administradores
        ven ahora una pestaña Emuladores después de Sistema, y la página
        de Emuladores muestra la misma barra de pestañas, así que las
        demás pestañas quedan a un clic.</li>
      <li><strong>El zoom de la carátula ya no queda oculto tras los
        menús.</strong> En un móvil, las barras superior e inferior
        tapaban la carátula ampliada y ocultaban su botón de cerrar, y en
        un ordenador la barra lateral cubría su lado izquierdo. El zoom
        se abre ahora por encima de todo.</li>
      <li><strong>Modelos Claude 5.5 para la IA.</strong> Ajustes &gt; Scrapeo muestra los modelos Claude más recientes de Anthropic: Haiku 5.5, el nuevo predeterminado y el más barato, Sonnet 5.5 y Opus 5.5, con sus precios actuales. RetroDB ya no envía un ajuste que Sonnet 5.5 rechaza.</li>
      <li><strong>Escribe las ventas de un juego.</strong> Las dos pantallas de edición tienen un campo «Copias vendidas» bajo Desarrolladora. La cifra que escribas aparece en la página del juego, igual que una que haya encontrado la IA. Vacía el campo para quitarla.</li>
      <li><strong>Prueba tu clave de IA en Ajustes.</strong> Ajustes &gt; Scrapeo tiene un botón «Probar la clave de IA guardada» bajo el proveedor de IA. Indica si la clave funciona y, si no, por qué: una clave rechazada, sin crédito o un límite de uso. Antes, una clave rechazada parecía funcionar.</li>
      <li><strong>Claude puede buscar cifras de ventas en la web.</strong> Ajustes &gt; Scrapeo tiene un interruptor «Dejar que Claude busque en la web» bajo el modelo de Claude, desactivado al principio. Sin búsqueda, Claude responde con lo que ya sabe y deja en blanco las copias vendidas. Con él activado, Claude consulta las cifras. Anthropic cobra cada búsqueda, así que Rellenar con AI hace como máximo 5 búsquedas por juego, hasta 5 centavos de dólar; desactiva el interruptor antes de un scrapeo masivo grande.</li>
      <li><strong>Rellenar con AI un sistema entero de una vez.</strong> Herramientas ROM tiene una nueva página de Rellenado masivo con AI, que también contiene Nombres oficiales. Elige un sistema, o Todos los sistemas, activa los campos que quieres rellenar y pulsa Rellenar con IA: RetroDB ejecuta Rellenar con AI en cada juego, igual que el botón Rellenar con AI de la página de un juego, y guarda las respuestas directamente en el juego. Una barra de progreso y un cuadro de aviso de Rellenar con AI muestran cuánto lleva, y puedes salir de la página mientras se ejecuta. Muestra cuántos juegos va a rellenar y pregunta antes, porque tu proveedor de IA cobra por cada juego. Los juegos que ya han pasado por Rellenar con AI se omiten salvo que los vuelvas a incluir, y la pasada se detiene sola si la IA deja de responder.</li>
      <li><strong>Los cuadros de aviso de tareas toman los colores de tu tema.</strong> Los cuadros que muestran una tarea en curso, como el scraping masivo y RA Sync, y las barras de progreso usan ahora los colores del tema que elegiste. Una tarea que no se puede pausar ya no muestra su título con el color de pausa.</li>
      <li><strong>La página de Emuladores se parece a las demás pestañas de Ajustes.</strong> Ajustes &gt; Emuladores ahora está dividido en tarjetas, y una barra bajo las pestañas salta a cada una: RetroArch, Jugar en RetroDB, Núcleos, Trucos, Carpetas, Emuladores y Asignación. La barra se queda arriba al desplazarte y marca la sección en la que estás.</li>
      <li><strong>Progreso de la descarga junto al botón.</strong> Al descargar RetroArch, los núcleos del reproductor o un paquete de trucos, una nota junto al botón muestra en porcentaje cuánto ha avanzado. Antes aparecía una línea bajo los botones que empujaba el resto de la página hacia abajo.</li>
      <li><strong>Elige el emulador de cada sistema en una lista.</strong> Asignación por sistema en Ajustes &gt; Emuladores ahora muestra cada sistema una sola vez, con una lista de los emuladores vinculados a él. El que elijas es el que usa Jugar para los juegos de ese sistema, salvo que un juego defina el suyo. Un emulador que RetroDB no encuentra aparece marcado como «no encontrado». Antes, cada sistema tenía una fila por emulador, con un pequeño punto para elegir el predeterminado. El RetroArch propio de RetroDB ahora aparece en la lista de cada sistema listado que puede ejecutar, incluidos los sistemas que aún no tienen juegos.</li>
      <li><strong>Un botón Examinar en cada cuadro de ruta.</strong> Los administradores ahora pueden elegir una carpeta o un programa navegando por las carpetas del equipo en lugar de escribir su ruta: Ajustes &gt; Emuladores, Biblioteca, Scrapeo y Cuenta, y los ajustes de Herramientas ROM. Los cuadros que esperan un programa también muestran archivos. Las carpetas ocultas como <code>.config</code> aparecen al final.</li>
      <li><strong>El stick izquierdo funciona como cruceta en el RetroArch de RetroDB.</strong> En juegos de sistemas sin stick, como NES o Mega Drive, ahora puedes moverte con el stick izquierdo además de con la cruceta. Cuando el núcleo del emulador de un juego lee el stick por sí mismo, como en Nintendo 64, el stick sigue siendo un stick de verdad.</li>
      <li><strong>Inicia sesión en RetroAchievements desde Ajustes.</strong> Ajustes &gt; Cuenta ahora puede iniciar tu sesión para el RetroArch de RetroDB, de modo que los logros se desbloquean mientras juegas sin iniciar sesión dentro del emulador. Tu contraseña solo se envía a RetroAchievements y no se guarda. Cada usuario de RetroDB tiene su propia sesión y su propio interruptor de Modo hardcore, que empieza desactivado. DuckStation y PCSX2 siguen iniciando sesión desde sus propios menús.</li>
      <li><strong>Ver qué emulador usará Jugar.</strong> La página de un juego ahora muestra «Se abre en:» y el nombre del emulador junto al botón Jugar, o indica que no hay ningún emulador configurado.</li>
      <li><strong>El panel de Trucos explica por qué un juego no tiene trucos.</strong> Cuando el emulador de un juego no puede usar trucos, el panel ahora da el motivo en lugar de permanecer oculto.</li>
      <li><strong>Las rutas de carpeta largas caben en el móvil.</strong> Una ruta de carpeta larga en Ajustes ya no hace que la página se desplace hacia los lados.</li>
    </ul>
