- version: 3.20.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Once nuevos idiomas — RetroDB ahora habla 21 idiomas
  body: |
    <ul>
      <li><strong>Once nuevos paquetes de idioma.</strong> La interfaz de
        RetroDB, las notas de la versión y el manual de ayuda ahora están
        traducidos al Afrikaans, isiZulu, isiXhosa, Dutch, Norwegian
        (Bokm&aring;l), Russian, Polish, Turkish, Ukrainian, Indonesian y
        Hebrew &mdash; sumándose al German, Spanish, French, Italian,
        Japanese, Korean, Portuguese de Brasil, y al Chinese Simplificado y
        Tradicional ya existentes. Elige el tuyo en Ajustes &rarr;
        Preferencias de visualización &rarr; Idioma; la aplicación se recarga
        en el idioma elegido.</li>
      <li>Cada idioma cubre toda la aplicación: cada botón, etiqueta y
        mensaje, todo el historial de notas de la versión, y la guía de ayuda
        completa.</li>
      <li><strong>isiZulu &amp; isiXhosa</strong> también están incluidos. Al
        ser idiomas con poco vocabulario informático existente, mantienen los
        términos técnicos habituales (ROM, scraper, box art) en inglés cuando
        no existe una palabra natural &mdash; se agradece la revisión de un
        hablante nativo antes de confiar plenamente en ellos.</li>
      <li><strong>Hebrew</strong> se lanza con el texto totalmente traducido;
        un diseño de página de derecha a izquierda pulido (para que la
        interfaz se refleje correctamente) llegará en una actualización
        posterior. Arabic le seguirá en cuanto se complete ese trabajo de
        diseño.</li>
    </ul>
- version: 3.19.1
  date: '2026-07-05'
  tags:
  - type: performance
    label: Rastreo más rápido — las capturas de un juego ahora se descargan a la vez
  body: |
    <ul>
      <li><strong>Las capturas de pantalla se descargan en paralelo.</strong>
        Siguiendo el mismo enfoque que el popular frontend ES-DE (que obtiene todo
        el material gráfico de un juego a la vez), RetroDB ahora descarga las
        capturas de un juego <strong>de forma simultánea</strong> en lugar de una
        tras otra, para todas las fuentes (TheGamesDB, IGDB, RAWG, ScreenScraper).
        Los juegos con varias capturas terminan notablemente antes.</li>
      <li>La comprobación de capturas duplicadas se sigue ejecutando después y en
        orden, así que la eliminación de imágenes repetidas mantiene exactamente la
        misma precisión que antes &mdash; solo se ha acelerado la descarga. Las
        descargas están limitadas a cuatro a la vez para que ninguna fuente se
        sobrecargue.</li>
      <li>Mejora de velocidad interna; surte efecto tras el próximo reinicio.</li>
    </ul>
- version: 3.19.0
  date: '2026-07-05'
  tags:
  - type: performance
    label: Rastreo más rápido — ahora las fuentes se consultan a la vez
  body: |
    <ul>
      <li><strong>El rastreo es más rápido por juego.</strong> Cuando RetroDB busca
        un juego, consulta varias bases de datos (ES-DE, TheGamesDB, IGDB, RAWG,
        ScreenScraper). Antes las consultaba <em>de una en una</em> y esperaba la
        respuesta de cada una antes de preguntar a la siguiente &mdash; así que la
        espera era la suma de todas ellas. Ahora las consulta todas <strong>a la
        vez</strong> y solo espera a la más lenta, lo que supone una aceleración
        notable en cada juego. Los resultados se siguen ordenando y puntuando
        exactamente igual que antes.</li>
      <li><strong>Menos saludos desperdiciados al descargar arte.</strong> Las
        descargas de imágenes ahora reutilizan una conexión ya abierta en lugar de
        abrir una nueva para cada imagen, ahorrando tiempo en los juegos con muchas
        capturas.</li>
      <li>Se trata de mejoras de velocidad internas &mdash; no cambia nada en cómo
        usas RetroDB, y no exige más a las bases de datos (las mismas peticiones,
        solo solapadas). Surten efecto tras el próximo reinicio.</li>
    </ul>
- version: 3.18.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Añadidas las clasificaciones por edad de China (China) como noveno sistema de clasificación
  body: |
    <ul>
      <li><strong>Nuevo sistema de clasificación por edad: China (CADPA).</strong>
        RetroDB ahora admite el esquema oficial de aviso de edad para videojuegos de
        China (&ldquo;网络游戏适龄提示&rdquo;, emitido por CADPA) junto a los ocho
        organismos existentes (ESRB, PEGI, CERO, USK, ACB, FPB, GRAC y ClassInd).
        Utiliza tres niveles &mdash; <strong>8+</strong>, <strong>12+</strong> y
        <strong>16+</strong> &mdash; mostrados con un sencillo distintivo verde.</li>
      <li><strong>Se rellena solo, como los demás.</strong> Cuando un juego ya tiene
        una clasificación de cualquier otro país, RetroDB calcula automáticamente el
        nivel equivalente de China (y viceversa). También puedes elegirlo o
        cambiarlo a mano en la pantalla de Edición de un juego, y seleccionarlo como
        tu sistema de visualización preferido en Ajustes &rarr; Biblioteca. Nota: la
        mayoría de las bases de datos de juegos occidentales no publican una
        clasificación de China, así que en los juegos sin ninguna clasificación se
        rellena a partir del contenido del juego durante el rastreo / AI Fill.</li>
      <li>Los distintivos verdes son obra gráfica propia y sencilla de RetroDB (a
        juego con el estilo de los demás organismos), no el logotipo oficial de
        CADPA, por lo que no hay ninguna atadura de licencia de imágenes.</li>
    </ul>
- version: 3.17.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Borra las referencias de la base de datos a archivos de material gráfico que faltan en el disco
  - type: security
    label: Protege contra el borrado de todo el material gráfico de tu biblioteca cuando desaparece una carpeta de medios
  body: |
    <ul>
      <li><strong>Nueva herramienta de mantenimiento: &ldquo;Referencias de medios faltantes&rdquo;</strong>
        (Ajustes &rarr; Sistema &rarr; Mantenimiento). Es la imagen especular de la
        limpieza existente de &ldquo;Medios huérfanos&rdquo;: en lugar de buscar
        archivos de imagen sobrantes sin ningún juego, busca juegos cuya carátula,
        carátula 3D, capturas de pantalla, fanart, vídeo o manual apuntan a archivos
        que ya no están en el disco. Búscalos y luego borra esas referencias obsoletas
        con un solo clic para que los rastreadores puedan volver a descargar el
        material gráfico. Las entradas de tus juegos en sí nunca se tocan.</li>
      <li><strong>Limpieza automática más segura durante el rastreo.</strong> Cuando
        RetroDB vuelve a rastrear un juego, borra silenciosamente las referencias a
        archivos de medios que han desaparecido del disco. Antes, si toda una carpeta
        de medios desaparecía de golpe &mdash; una unidad externa desmontada o un
        borrado masivo &mdash;, esa limpieza podía borrar el registro del material
        gráfico que tenían miles de juegos, obligando a costosos re-rastreos. Ahora
        RetroDB reconoce esa señal: si una carpeta de medios falta o está
        completamente vacía, conserva las referencias y registra una advertencia en
        lugar de borrarlas. La nueva herramienta de mantenimiento aplica la misma
        protección y señala claramente cualquier carpeta que haya retenido.</li>
    </ul>
- version: 3.16.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Nuevo panel de "Soluciones rápidas" en el panel de control
  body: |
    <ul>
      <li><strong>Un nuevo panel de &ldquo;Soluciones rápidas&rdquo; en el Panel de control</strong>
        convierte las tareas dispersas de la biblioteca en una lista de tareas
        pendientes de un vistazo. Muestra cuántos juegos siguen sin carátula y ofrece
        atajos de un solo clic para encontrar ROMs duplicadas y comprobar rutas de ROM
        rotas (juegos cuyos archivos se han movido o borrado). Cada atajo enlaza
        directamente con la página que lo soluciona. El panel aparece en cuanto tienes
        juegos en tu biblioteca.</li>
    </ul>
- version: 3.15.0
  date: '2026-07-03'
  tags:
  - type: accessibility
    label: Los lectores de pantalla ahora anuncian el progreso de las tareas
  body: |
    <ul>
      <li><strong>Las tareas de larga duración ahora anuncian su progreso a los
        lectores de pantalla.</strong> Durante un rastreo masivo, una
        sincronización de logros (RetroAchievements o PlayStation) o un cambio
        de tamaño de imágenes, los usuarios de lectores de pantalla no oían nada
        entre &laquo;iniciado&raquo; y &laquo;terminado&raquo;. RetroDB ahora
        anuncia hitos periódicos (por ejemplo, &laquo;12 de 40&raquo;) y la
        finalización, sin ventanas emergentes adicionales. Los anuncios están
        espaciados para informar sin resultar molestos y respetan el idioma que
        hayas elegido.</li>
    </ul>
- version: 3.14.0
  date: '2026-07-01'
  tags:
  - type: feature
    label: Nuevos idiomas — chino (simplificado y tradicional) ya disponible
  body: "<ul>\n  <li><strong>RetroDB ya está disponible en chino.</strong> Hay dos opciones\n    en <strong>Configuración &rarr; Sistema &rarr; Idioma</strong>:\n    <strong>中文 (简体)</strong> (simplificado, para China continental) y\n    <strong>中文 (繁體)</strong> (tradicional, para Hong Kong y Taiwán). Toda\n    la interfaz &mdash; menús, botones, mensajes y el manual de ayuda integrado\n    &mdash; está traducida, y todo lo que aún no lo está recurre discretamente\n    al inglés. Con esto, los idiomas admitidos llegan a diez (inglés, alemán,\n    español, francés, italiano, japonés, portugués brasileño, coreano y ahora\n    chino simplificado &amp; tradicional).</li>\n</ul>\n"
- version: 3.12.0
  date: '2026-06-30'
  tags:
  - type: feature
    label: Nuevo idioma — el coreano (한국어) ya está disponible
  body: |
    <ul>
      <li><strong>RetroDB ya está disponible en coreano (한국어).</strong>
        Selecciónalo en Ajustes &rarr; Sistema &rarr; Idioma. Toda la interfaz
        &mdash; menús, botones, mensajes y el manual de ayuda integrado &mdash;
        está traducida, lo que eleva a ocho los idiomas admitidos (inglés,
        alemán, español, francés, italiano, japonés, portugués de Brasil y
        coreano). El coreano completa la cobertura de todos los organismos de
        clasificación por edades que muestra RetroDB, incluido el GRAC de Corea
        del Sur.</li>
    </ul>
- version: 3.11.0
  date: '2026-06-30'
  tags:
  - type: enhancement
    label: Apoya RetroDB en Patreon — nuevo enlace de donación añadido
  body: |
    <ul>
      <li><strong>Ahora puedes apoyar RetroDB en Patreon.</strong> Hay un
        enlace de Patreon junto al botón existente «Patrocinar en GitHub» en
        <strong>Ajustes &rarr; Sistema &rarr; Apoyar el desarrollo</strong>, en
        el panel Acerca de y en el README del proyecto. RetroDB sigue siendo
        completamente gratuito y de código abierto: las donaciones son
        totalmente opcionales y simplemente ayudan a mantener el desarrollo en
        solitario.</li>
    </ul>
- version: 3.10.0
  date: '2026-06-26'
  tags:
  - type: enhancement
    label: El registro de cambios ahora carga más rápido con un botón «Cargar más»
  body: "<ul>\n  <li><strong>La página del registro de cambios ahora se abre mucho más rápido.</strong>\n    En lugar de dibujar todo el historial de versiones (cientos de entradas) cada vez\n    que la abres, RetroDB ahora muestra las 20 entradas más recientes y añade un botón\n    <strong>Cargar más</strong> al final. Haz clic en él para mostrar el siguiente\n    lote, y así sucesivamente &mdash; el historial más antiguo sigue estando todo ahí,\n    solo se carga cuando hace falta en vez de ralentizar la primera vista.</li>\n</ul>\n"
- version: 3.9.0
  date: '2026-06-17'
  tags:
  - type: feature
    label: El manual de ayuda y las notas de versiones recientes ahora están traducidos a los 6 idiomas
  body: "<ul>\n  <li><strong>El manual de Ayuda completo dentro de la aplicación ya está disponible en\
    \ los seis\n    idiomas</strong> &mdash; alemán, francés, español, italiano, japonés\n    y portugués\
    \ de Brasil &mdash; no solo en inglés. RetroDB muestra el\n    manual en el idioma que hayas elegido\
    \ en Ajustes y recurre discretamente\n    al inglés si algo aún no está traducido.</li>\n  <li><strong>Este\
    \ Registro de cambios ahora también aparece en tu idioma</strong> para las\n    versiones más recientes,\
    \ y las nuevas versiones se traducirán de aquí en adelante.\n    El historial más antiguo se mantiene\
    \ en inglés.</li>\n  <li><strong>La página de Lista de deseos y los últimos restos de texto en inglés</strong>\n\
    \    &mdash; un conjunto de mensajes emergentes de error y de estado que se habían pasado por alto\n\
    \    cuando llegaron los paquetes de idioma en la 3.8.0 &mdash; ahora se traducen\n    correctamente\
    \ en toda la aplicación.</li>\n</ul>\n"
- version: 3.8.2
  date: '2026-06-17'
  tags:
  - type: security
    label: Actualización de dependencia de seguridad + correcciones de CI
  body: "<ul>\n  <li><strong>Seguridad:</strong> se actualizó la biblioteca <code>cryptography</code>\n\
    \    incluida (47 → 49) para resolver un aviso publicado (GHSA-537c-gmf6-5ccf).\n    Sin cambios de\
    \ comportamiento, solo una versión\n    más segura.</li>\n  <li>Se corrigió la canalización automatizada\
    \ de pruebas: faltaba un componente auxiliar de solo pruebas\n    (<code>beautifulsoup4</code>) que\
    \ hacía fallar la ejecución de pruebas desde la v3.7.0,\n    y el nuevo script de compilación del\
    \ empaquetado activaba una comprobación de análisis estático que es\n    un falso positivo conocido\
    \ (ejecuta comandos de compilación de confianza, no entradas del usuario)\n    &mdash; ahora está\
    \ documentado y calibrado. Solo mantenimiento; nada cambia en la\n    aplicación en sí.</li>\n</ul>\n"
- version: 3.8.1
  date: '2026-06-17'
  tags:
  - type: improvement
    label: Opción de descarga más pequeña, organización de las donaciones y corrección de traducción (Pass
      46.3 / 47.6)
  body: "<ul>\n  <li><strong>Pronto llegará una descarga mucho más pequeña.</strong> La\n    versión lista\
    \ para usar de RetroDB, de \"solo descomprimir y hacer doble clic\", ahora se puede\n    compilar\
    \ en una variante <strong>solo CPU</strong> (~600&nbsp;MB) para quienes\n    no tienen una tarjeta\
    \ gráfica AMD &mdash; aproximadamente una sexta parte del tamaño de la versión\n    completa. Ambas\
    \ se ofrecerán una al lado de la otra para que puedas elegir la que\n    se adapte a tu equipo.</li>\n\
    \  <li><strong>El panel \"Apoyar el desarrollo\" en Ajustes ahora se traduce</strong>\n    junto con\
    \ el resto de la aplicación &mdash; se había quedado accidentalmente en\n    inglés cuando llegaron\
    \ los paquetes de idioma en la 3.8.0.</li>\n  <li>Se ordenaron los enlaces de donación (la insignia\
    \ de GitHub Sponsors en el README; el\n    archivo de financiación está listo para Patreon y Buy&nbsp;Me&nbsp;A&nbsp;Coffee\
    \ una vez\n    que se configuren). Sin pantallas insistentes, nunca.</li>\n  <li>Entre bastidores:\
    \ la canalización de versiones ahora puede compilar las versiones listas para usar\n    para Windows,\
    \ macOS y Linux de forma automática. Nota: el extenso\n    manual de <em>Ayuda</em> dentro de la aplicación\
    \ sigue siendo solo en inglés por ahora &mdash; eso está\n    registrado como trabajo futuro.</li>\n\
    </ul>\n"
- version: 3.8.0
  date: '2026-06-12'
  tags:
  - type: feature
    label: Traducción completa de la interfaz + 6 idiomas (Pass 43.2/43.3/43.5)
  body: "<ul>\n  <li><strong>RetroDB ahora habla 6 idiomas más.</strong> Sobre la base\n    sentada en\
    \ la 3.7.0, toda la interfaz se ha hecho traducible y\n    traducida automáticamente al <strong>alemán,\
    \ francés, español, italiano,\n    japonés y portugués de Brasil</strong>. Elige tu idioma en\n  \
    \  Ajustes &rarr; Preferencias de visualización &rarr; Idioma; sigue tu\n    preferencia guardada,\
    \ luego tu navegador y, por último, recurre al inglés &mdash; nunca\n    puede quedarse atascado en\
    \ un idioma faltante.</li>\n  <li><strong>Todo lo que aparece en pantalla está cubierto</strong>:\
    \ el texto de las páginas y los botones,\n    los mensajes emergentes (las pequeñas notificaciones\
    \ &ldquo;toast&rdquo;), los diálogos de edición\n    y de ajustes, las descripciones emergentes y\
    \ las etiquetas para lectores de pantalla. Los géneros de los juegos,\n    las perspectivas y los\
    \ modos de juego (p. ej. &ldquo;First-Person-Shooter&rdquo;) ahora\n    se muestran también en tu\
    \ idioma &mdash; mientras que los datos subyacentes se mantienen en\n    inglés para que tu biblioteca\
    \ y tus filtros sigan funcionando exactamente como antes.</li>\n  <li>Un idioma <strong>&ldquo;Pseudo&rdquo;\
    \ integrado</strong> (visible en el\n    menú de Idioma) es una herramienta de control de calidad\
    \ para traductores que rodea y acentúa cada\n    etiqueta, lo que deja inmediatamente claro si se\
    \ pasó por alto algún texto.</li>\n  <li>Las traducciones automáticas son un punto de partida y pueden\
    \ resultar un poco rígidas en\n    algunos lugares &mdash; son fáciles de pulir con el tiempo, y cualquier\
    \ texto sin\n    traducción simplemente se muestra en inglés.</li>\n</ul>\n"
