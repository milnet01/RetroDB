  - type: fix
    label: 'Imidlalo enonyaka kuphela inokuhlelwa, kwaye igcina unyaka wayo'
  body: |
    <ul>
      <li><strong>Khangela nawuphi na umdlalo okanye ikhonsoli kulo naliphi
        na iphepha.</strong> Ibhokisi lokukhangela ngoku liphantsi kwegama
        lakho kwibha esecaleni. Chwetheza oonobumba ababini nangaphezulu ukuze
        ubone iikhonsoli ezihambelanayo nemidlalo ehambelanayo ukuya kuthi ga
        kwesibhozo, nganye nekhonsoli yayo. Cofa omnye, okanye uwukhethe
        ngamaqhosha amatolo uze ucofe u-Enter, ukuze uwuvule. "Bona zonke
        iziphumo" luvula iThala ngolo khangelo. Cofa u-/ ukuze utsibele
        ebhokisini xa iphepha lingenalo elalo ibhokisi lokukhangela.</li>
      <li><strong>Kulula ukuhamba kwifowuni okanye kwithebhulethi.</strong>
        Kwiskrini esimxinwa, ibha engaphezulu iphethe iqhosha lemenyu
        neqhosha lokukhangela elivula imenyu ikhesa sele ikwibhokisi
        lokukhangela. Ibha engezantsi ikusa kwi-Dashboard, kwiThala,
        kwi-Iisistim nakwi-Iimpumelelo ngokuchukumisa kanye. Imenyu ngoku
        iqinile, ngoko iphepha alisabonakali ngemva kwayo. Chukumisa
        ngaphandle kwayo okanye ucofe u-Escape ukuze uyivale. Kwiifestile
        ezilingana nethebhulethi iqhosha lemenyu lalingekho, ngoko imenyu
        yayingavuleki kwaphela; ngoku likhona. Iibha zeethebhu nezihluzi
        ezihlala kwiskrini xa uskrola zima ngezantsi nje kwebha engaphezulu,
        hayi ngemva kwayo.</li>
      <li><strong>Iisethingi &gt; Ii-emulator ziyalingana nefowuni.</strong>
        Iitheyibhile zayo zazibanzi kunefowuni, ngoko amaqhosha athi Hlela
        nathi Iisethingi ayengaphandle kwesikrini. Kwifowuni umqolo ngamnye
        ngoku likhadi elinamaqhosha alo ngaphakathi.</li>
      <li><strong>Ukususa imifanekiso yomdlalo akusashiyi iifayile
        ezingasetyenziswayo.</strong> Ukuba ubususa imifanekiso yomdlalo
        ngelixa i-RetroDB isayilola ngasemva, yayinokuyibhala kwakhona
        njengeefayile ezingasetyenziswa nguwo nawuphi na umdlalo. Ngoku
        ijonga kuqala ize iyitsibe. Inani elithi "Kuphuculwa imifanekiso"
        nalo likhupha umdlalo osusiweyo kwangoko.</li>
      <li><strong>Izihloko ozichwethezayo ziyagcinwa xa ukhupha.</strong>
        Ukukhupha, kwanokuthi Ukukhupha Kwakhona Okupheleleyo, bekutshintsha
        isihloko obusichwethezile kwifestile yokuhlela ngegama elivela
        kwi-scraper. Ngoku isihloko osiguqulayo siyagcinwa. Ibhokisi elitsha
        elithi "Gcina esi sihloko xa ukhupha" phantsi kwesihloko libonisa
        oku; susa uphawu kulo ukuze uvumele ii-scraper ziphinde zithiye
        umdlalo ngokutsha. U-Setha Kwakhona kwiphepha lomdlalo naye
        uyazivumela.</li>
      <li><strong>Amagama asemthethweni emidlalo yakho, ahlolwe
        nguwe.</strong> Izixhobo zeROM zinephepha elitsha elithi Amagama
        Asemthethweni. Cofa u-"Buza i-AI" kwisistim enye okanye kuzo zonke,
        kwaye i-AI icebisa igama elipheleleyo elisemthethweni lomdlalo
        ngamnye njengoko wakhutshwa kummandla weROM yawo, ngoko iROM
        yaseJapan ye-Mega Man iba yi-Rockman. Ubona igama ngalinye elidala
        nelitsha ecaleni komnye, uphawule lawo uwafunayo uze uwamkele. Akukho
        nto itshintshayo ude ukwenze. Igama elidala ligcinwa njengesihloko
        esongezelelweyo, kwaye igama elamkelweyo liyagcinwa xa ukhupha. Igama
        elaliweyo alicetyiswa kwakhona. Kufuneka umboneleli we-AI
        kwi-Iisethingi &gt; Ukukhupha.</li>
      <li><strong>Imidlalo enonyaka kuphela inokuhlelwa, kwaye igcina unyaka
        wayo.</strong> Imidlalo emininzi inonyaka kuphela njengomhla wayo,
        njengo-1985. Kwiphepha lomdlalo, ifestile yokuhlela yala ukuyigcina.
        Kwifestile yokuhlela yeThala, ukugcina omnye bekucima unyaka wawo.
        Zombini ngoku zamkela unyaka, unyaka nenyanga, okanye umhla
        opheleleyo.</li>
    </ul>
