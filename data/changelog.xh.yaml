  body: |
    <ul>
      <li><strong>I-RetroDB ilungele isidlali sayo semidlalo.</strong>
        Isidlali esisekelwe kwi-RetroArch siyakhiwa kwi-RetroDB. Xa sifika,
        i-RetroDB iza kuqalisa imidlalo kuso ineesethingi ezikhethelwe
        umdlalo ngamnye, kwaye igcine naziphi na iisethingi ozitshintshayo
        ngelixa udlala. Siza kugcina izigcino zaso neesethingi kwifolda yaso,
        ngokwahlukileyo kwi-RetroArch yakho. Sikhetha eyona core ilungileyo
        kwikhonsoli nganye kwaye siyikhuphele okokuqala xa ucofa u-Dlala;
        ngelo xesha iqhosha lithi "Kukhutshelwa i-core…". Sidlala nayiphi na
        ikhonsoli engenayo i-emulator esebenzayo, kwaye asize sitshintshe
        leyo uyisetileyo. Kumdlalo ngamnye ungakhetha enye i-core, isiphumo
        sesikrini, ukulinganisa ngamanani apheleleyo nokunciphisa
        ukulibaziseka kwegalelo. Abalawuli banokufaka okanye bahlaziye zonke
        ii-core ngaxeshanye, okanye bacime ukukhuphela. Akukho nto itshintshayo
        de isidlali sifakwe; ukuza kuthi ga ngoko asidweliswa phantsi
        kwe-Iisethingi &gt; Ii-emulator.</li>
      <li><strong>Iithebhu zeMyuziyam ziyatshintsha kwakhona.</strong>
        Kwiphepha leMyuziyam lekhonsoli, ukucofa u-Iispecs, Imidlalo
        Ephambili engu-10 okanye Iikhontrola akwenzanga nto kwaye kwabonisa
        umyalezo othi "Impazamo engalindelekanga", ukususela kwinguqulelo
        3.30.0. Yonke ithebhu ngoku iyavuleka.</li>
      <li><strong>Imidlalo ye-PlayStation 3 egcinwe njengefolda
        iyadlalwa.</strong> Umdlalo wediski we-PS3 uhlala uyifolda ephela
        ngo-".PS3". I-RetroDB yala ukuwuqalisa kwaye ayibonisanga qhosha
        lika-Dlala, kuba yayilindele ifayile enye. Ngoku inika i-emulator
        ifolda, njengoko i-RPCS3 ilindele.</li>
      <li><strong>Iikholamu zika-Khangela Imetadata ziyalingana, kwaye ingena
        kwifowuni.</strong> Umthombo oneziphumo ezingaphezu kwezo zingenayo
        wafumana ibha yokuskrola, eyacutha izihloko zawo, ngoko isihloko
        esifanayo sasisonga kwikholamu enye kodwa kungenjalo kwelandelayo.
        Ngoku ikholamu nganye igcina indawo efanayo, nebha yokuskrola
        ebhityileyo enemibala yethimu. Kwifowuni okanye kwifestile emxinwa,
        ifestile yokukhangela yayicinezelwe ecaleni kwebha esecaleni
        efihliweyo; ngoku igcwalisa isikrini.</li>
      <li><strong>Ufakelo olutsha lwe-Windows okanye lwe-Mac lunika ii-core
        ze-RetroArch amagama achanekileyo.</strong> I-RetroDB yaseta
        i-RetroArch ngamagama eefayile ze-core ze-Linux kuyo yonke indawo,
        ngoko kwi-Windows nakwi-macOS akukho core yafumaneka. Ufakelo olutsha
        ngoku lusebenzisa amagama ekhompyutha nganye. Ufakelo olukhoyo
        lugcina amagama elinawo; watshintshe kwitheyibhile yokudibanisa.</li>
      <li><strong>Isiboniso see-screenshot sibonisa iintolo zombini, nganye
        ngaphakathi kweqhosha layo.</strong> Ibha esecaleni yayigquma utolo
        lwasekhohlo, ngoko ubungenakubuyela kwi-screenshot yangaphambili
        ngemawusi. Utolo lwasekunene nalo lwaluhleli ngezantsi kweqhosha
        lalo. Zombini ngoku ziyabonakala, embindini wamaqhosha azo.</li>
      <li><strong>Iphepha leesethingi zee-emulator libonakala ngolwimi
        lwakho.</strong> Uninzi lwe-Iisethingi &gt; Ii-emulator lwalungesiNgesi
        nokuba ukhethe luphi ulwimi: izihloko zalo, itheyibhile
        yee-emulator, iziphumo zokuskena nefestile ethi Hlela i-emulator.
        Yonke ngoku iguqulelwe.</li>
      <li><strong>Ibhokisi ethi Abadlali yamkela inani elingaphezu
        kwe-16.</strong> Zombini iifestile zokuhlela zazima ku-16, ngoko
        ubungenakufaka abadlali abangama-256 be-MAG. Umdlalo onikwe
        ngaphezu kwe-16 sisikhuphi wawungenakugcinwa kwaphela de unciphise
        inani. Ngoku akukho mda uphezulu.</li>
      <li><strong>Ukuzalisa nge-AI kunika imidlalo ye-PC uhlobo lokugcina
        lwe-PC, hayi olwekhonsoli.</strong> Umdlalo we-Windows wawunokufumana
        "Ikhadi Lememori" kuba i-AI yayichaza inguqulelo yawo ye-PlayStation
        2. I-AI ngoku ixelelwa ukuba ichaze ukukhutshwa kwiqonga lomdlalo
        wakho. Ii-PC, kunye neekhonsoli ukusuka kwi-PlayStation 3 ne-Xbox 360
        ukuya phambili, zigcina kuGcino Lwangaphakathi.</li>
      <li>Ukulungisa umdlalo osele unohlobo lokugcina olungalunganga,
        wukhuphe kwakhona okanye uqhube Ukuzalisa nge-AI. Zombini zibuza
        i-AI kwakhona kwaye zitshintshe ixabiso elidala.</li>
      <li><strong>Ukudibanisa i-PlayStation kukuxelela ukuba ungene
        kuqala.</strong> Phantsi kwe-Iisethingi &gt; I-akhawunti &gt; PSN,
        iphepha le-akhawunti ye-Sony lalibonisa kuphela "Invalid login"
        ngaphandle kokuba ubusele ungenile kwi-PlayStation, kwaye amanyathelo
        ayengakutsho oko. Inyathelo 1 ngoku lineqhosha elithi "Ngena
        kwi-PlayStation" ekufuneka ulicofe kuqala.</li>
      <li><strong>Hlela iThala, kwaye ubonise kuphela imidlalo
        engakhutshwanga.</strong> IThala nephepha lesistim nganye zinemenyu
        ethi Hlela nge ecaleni kwenani lemidlalo: igama, ukukhutshwa okutsha
        okanye okudala, amanqaku abagxeki, amanqaku abasebenzisi, okanye
        okongezwe kutsha nje. Imidlalo engenamhla okanye amanqaku iba
        ngowokugqibela. Ibha ye-A–Z isebenza xa uhlela ngegama kwaye
        ifiphalisiwe ngenye indlela. Iqhosha elitsha elithi Engakhutshwanga
        libonisa kuphela imidlalo ekungekho sikhuphi siyizalisileyo.</li>
      <li><strong>Isihluzi esingafumani nto siyakuxelela oko.</strong>
        Iphepha belihlala lingenanto. Ngoku lithi akukho midlalo ifanayo,
        neqhosha lokusula izihluzi.</li>
      <li><strong>Ibha yezihluzi yeThala igcina yonke into endaweni
        yayo.</strong> Ukucofa u-Khetha, ukuhluza okanye ukuhlela
        bekutyhalela imidlalo ezantsi kwiphepha. Izixhobo zokukhetha ngoku
        zivela kwibha ezantsi kwefestile. U-Sula uhlala ekhona, efiphele de
        isihluzi sivulwe. Izihluzi ezisebenzayo zibonakala ecaleni kwenani
        lemidlalo. "Bonisa iBhonasi" ngoku ngu-"Iidiski Zebhonasi", oyakhanya
        xa evuliwe. Kwifowuni, amaqhosha ezihluzi avuleka kwiqhosha elinye
        elithi Izihluzi ngaphezu kwephepha.</li>
      <li><strong>Ithala elingenanto libonisa ulwamkelo neqhosha
        lokuskena.</strong> Ufakelo olutsha lwalubonisa amanqaku empilo
        abambeke ku-0% neThala elingenanto. Ngoku omabini amaphepha athi
        ithala alinanto kwaye anika iqhosha elithi Skena Ithala. I-Dashboard
        ikwadibanisa nesethingi yefolda ye-ROM. Abasebenzisi abangengabo
        abalawuli baxelelwa ukuba babuze umlawuli. Umdlalo Ongahleliwanga
        ufihliwe de kubekho imidlalo yokukhetha kuyo.</li>
      <li><strong>Skena Ithala iyasebenza kwiphepha leeSistim
        nakwi-Iisethingi.</strong> Loo maqhosha mabini athi Skena Ithala
        akwenzanga nto xa ecofwa. Kwasebenza elase-Dashboard kuphela.
        Iqhosha le-Dashboard elithi Skena Ithala ngoku libonakala kuphela
        kubalawuli, abangabo kuphela abasebenzisi abavunyelweyo ukuskena.</li>
      <li><strong>I-wizard yokuseta ibonisa inyathelo okulo, kunye nalawo
        anganyanzelekanga.</strong> Ithi "Inyathelo 3 kwesi-6", inika
        inyathelo ngalinye inombolo, iphawula lawo uwagqithileyo, kwaye
        iphawula i-ES-DE nezitshixo ze-API njengezinganyanzelekanga.
        Kwifowuni ibonisa iinombolo negama lenyathelo langoku.</li>
      <li><strong>Hluza iThala ngeentlobo, uthotho okanye abapapashi abaninzi
        ngaxeshanye.</strong> Kwizihluzi ezithi Uhlobo, Uthotho, Umpapashi,
        Umphuhlisi, Iimowudi Zokudlala, i-Perspective ne-Dimension, phawula
        amaxabiso amaninzi ngokuthanda kwakho uze ucofe u-Faka: umdlalo
        uyabonakala ukuba unalo naliphi na kuwo. Tshintshela ifestile ku-AYIYIYO
        ukuze ufihle imidlalo enalo naliphi na kumaxabiso aphawuliweyo.
        Ixabiso ngalinye lifumana ithegi yalo, kwaye i-✕ yayo isusa elo xabiso
        kuphela.</li>
    </ul>
