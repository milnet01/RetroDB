  body: |
    <ul>
      <li><strong>IRetroDB iyazihlaziya.</strong> Xa kukho inguqulelo
        entsha, abalawuli bayayibona kwi-Dashboard nakwi-Iisethingi &gt;
        Isistim &gt; Uhlaziyo, kunye noko kutsha. U-Khuphela uhlaziyo
        uyayilanda aze ajonge ukuba yifayile kanye epapashiweyo; u-Faka uze
        uqalise kwakhona wenza ikopi yogcino ye-database yakho, abeke
        inguqulelo entsha endaweni yayo aze aqalise kwakhona. Ukuba
        inguqulelo entsha ayiqali, iRetroDB ibuyela kwendala ngokwayo kwaye
        ixela isizathu. Imidlalo yakho, iisethingi, imifanekiso nee-log
        azichukunyiswa. IRetroDB ijonga uhlaziyo kanye ngosuku; ungakucima
        oko. Ikopi eqhutywa ukusuka kwi-git, okanye ngumlawuli weenkqubo,
        iyaxelelwa ngohlaziyo kodwa ayihlaziywa.</li>
      <li><strong>Fumana i-RetroArch ngaphakathi kweRetroDB.</strong>
        Iisethingi &gt; Ii-emulator inecandelo elitsha elithi Dlala
        kwiRetroDB. Cofa u-Fumana i-RetroArch kwaye iRetroDB ikhuphela
        i-RetroArch esemthethweni kwi-libretro, ijonge ukuba into
        ekhutshelweyo yifayile kanye ebilindelwe, kwaye iyiseta
        njenge-RetroArch (RetroDB), ineesethingi zayo nogcino lwayo,
        zahlukile kuyo nayiphi na i-RetroArch osele uyisebenzisa. Emva koko
        ilanda eyona core ilungileyo yesistim nganye okokuqala xa udlala.
        Iyasebenza kwiLinux nakwiWindows; imacOS ayikavavanywa.</li>
      <li><strong>Idiski elandelayo iyasebenza kwimidlalo edlalwa
        kwiRetroDB.</strong> Kumdlalo oneediski ezininzi iqhosha elithi
        Idiski elandelayo ngoku lifikelela kwi-RetroArch yeRetroDB ngokwayo
        ngaphandle kokuseta nto. I-RetroArch imamela imiyalelo yeRetroDB
        kuphela ngelixa umdlalo onjalo uqhuba, kwaye kwiWindows nakwimacOS
        ngelixa nawuphi na umdlalo uqhuba.</li>
      <li><strong>Amakhadi emidlalo ayalungelelana kwifowuni nasemva
        kokutshintsha ubungakanani befestile.</strong> Kwifowuni amaphepha
        eThala nawekhonsoli ayebonisa ikhadi elinye aze emve isithuba eside
        esingenanto; ngoku amakhadi ayabekwa elinye phantsi kwelinye.
        Ukwenza ifestile ibe mxinwa okanye ibe banzi kulungelelanisa
        amakhadi kwakhona endaweni yokuwashiya kwiikholam ezindala.</li>
      <li><strong>Amanqaku nenani labadlali ezikhutshiweyo zichaneke
        ngakumbi.</strong> Izilinganiso zeminyaka ezivela kwi-IGDB zeCERO,
        USK, GRAC, ClassInd ne-ACB ngoku zifundwa ngokuchanekileyo, ngoko
        umdlalo olinganiswe ngeCERO Z okanye i-USK 18 ufumana eso
        silinganiso. ITheGamesDB, iRAWG, i-IGDB ne-ES-DE azisaqikeleli
        "umdlali o-1" xa zingazi; ukungenisa kwe-ES-DE akusabhali ngaphezulu
        kwenani labadlali okanye iimowudi zomdlalo ozisetileyo. ITheGamesDB
        ayisagcini nani endaweni yegama lomshicileli okanye lomphuhlisi emva
        kokukhangela okungaphumelelanga.</li>
      <li><strong>IScreenScraper igcina iinkcukacha zayo xa ingowona mthombo
        uphambili.</strong> Isihloko sayo, inkcazo, umhla, umphuhlisi,
        umshicileli nabadlali bayagcinwa kuko konke ukukhupha, hayi nje
        kwimizuzu embalwa yokuqala emva kokukhangela. Iividiyo nemiqulu
        ekhutshelweyo ifumana igama lefayile elifanelekileyo.</li>
      <li><strong>Ukusula idatha ekhutshiweyo kubuyisela igama lefayile
        njengesihloko.</strong> Kwakusula iinkcukacha kodwa kushiye isihloko
        esikhutshiweyo.</li>
      <li><strong>Ukuhlaziya iRetroAchievements kwikhonsoli enye kuyasebenza
        kwakhona.</strong> Kwakusilela ngempazamo qho.</li>
      <li><strong>Isifumanisi see-screenshot eziphindiweyo siyasebenza
        kwi-app ekhutshelweyo.</strong> Sasingafumani ii-screenshot apho,
        kwaye ukucima impinda kwakushiya ifayile kwidiski.</li>
      <li><strong>Iiphasiwedi zeScreenScraper zifihliwe, kwaye umlawuli
        wokugqibela uhlala engumlawuli.</strong> Iisethingi ngoku zibonisa
        iiphasiwedi zakho zeScreenScraper zifihliwe, njengezinye izitshixo
        zakho. I-akhawunti ekuphela komlawuli ayisenakutshintshelwa kumhleli
        okanye icinywe, nto leyo ebinokushiya kungekho mntu unokulawula
        iRetroDB.</li>
      <li><strong>Imisebenzi ephazanyisiweyo inikwa kuphela abantu
        abavunyelweyo ukuyiqhuba.</strong> Ibhena yemisebenzi
        ephazanyisiweyo kwi-Dashboard ngoku ibonisa umsebenzi kuphela kumntu
        ovunyelweyo ukuwuqalisa, umzekelo ukukhutshwa okuninzi kuphela
        kubahleli nabalawuli. Ezinye ii-akhawunti azisayiboni kwaye
        azisakwazi ukuyivala.</li>
      <li><strong>Ii-logo zeekhonsoli ezingenisiweyo, amagama angaqhelekanga
        kwiIisethingi neediski zebhonasi.</strong> Kwi-app ekhutshelweyo,
        ukuhlaziya ii-logo ngoku kufumana ii-logo zeekhonsoli ezingeniswe
        ngokungenisa ukusuka kwi-ES-DE, kwaye kuzikhetha ngaphezu
        kwezakhelwe ngaphakathi. Igama lekhontrola, lekhonsoli okanye lekopi
        yogcino elinoonobumba abafana no-&lt; okanye isicatshulwa alisaphuli
        iphepha leeSethingi. Ukususa uphawu kwidiski yebhonasi kuyayikhulula
        ngokupheleleyo, ngoko ayisabalwa njengediski yebhonasi yomdlalo wayo
        omdala.</li>
      <li><strong>Iindebe, ukungeniswa kwethala nezixhobo zolondolozo
        ezikhawulezayo.</strong> Iphepha leeNdebe, ukungeniswa kwethala
        leSteam, leXbox nelePlayStation, iindebe zomqokeleli, ukubala indawo
        yokugcina nokuskena imidiya engasetyenziswayo konke kwenza umsebenzi
        omncinci kakhulu kwithala elikhulu. Iifestile ezibonisa inkqubela
        yomsebenzi ziqhubeka zihlaziyeka xa iseva ixakekile, kwaye
        imisebenzi yeHowLongToBeat neyezihloko ezongezelelweyo
        ayisabambezeli olunye utshintsho ngelixa iqhuba.</li>
      <li><strong>Bona ukuba umdlalo ngamnye wePS3 uhamba kakuhle
        kangakanani kwi-RPCS3.</strong> Imidlalo yePS3 kwiThala, kwiphepha
        lePlayStation 3 nakwiphepha lomdlalo ibonisa isimo sokuhambelana
        se-RPCS3: Uyadlaleka, Emdlalweni, Intshayelelo, Uyalayisheka okanye
        Akukho nto, kunye nomhla ekugqityelwe ukuvavanywa ngawo. IRetroDB
        isifunda kwi-RPCS3 esekhompyutheni yakho, ngoko kwi-RPCS3 khetha
        Manage &gt; Databases &gt; Download Compatibility Database kanye,
        naxa ufuna iziphumo ezitsha. Kubonakaliswa kuphela imidlalo eneROM
        kwidiski; imidlalo engenisiweyo ayiboniswa. IRetroDB ngoku ikwafunda
        i-ID yomdlalo yePSN neefolda zemidlalo efakiweyo, kunye neefolda
        neefayile ezinegama eliyiphetheyo, njenge-[BLUS30443].</li>
      <li><strong>Amanani okuthengisa emidlalo yakho.</strong> Xa i-AI
        izalisa izithuba ngexesha lokukhupha, naxa ucofa u-Ukuzalisa nge-AI,
        ngoku ikwabuzwa ukuba zingaphi iikopi zomdlalo ezithengisiweyo
        kwikhonsoli yawo, ngokwamanani apapashiweyo asimahla afana neengxelo
        zomshicileli, uluhlu lwezona zithengiswa kakhulu kwiplatfom,
        iFamitsu, iWikipedia neVGChartz. Iphepha lomdlalo libonisa inani.
        Umdlalo ongenalo inani elipapashiweyo uhlala ungenanto endaweni
        yokufumana uqikelelo.</li>
      <li><strong>Iswitshi ye-Franchise / Uthotho iyasebenza kwiphepha
        lomdlalo.</strong> Kwifestile yokuhlela yephepha lomdlalo, ukucofa
        iswitshi ye-Franchise / Uthotho yomdlalo ophawulwe njengo-Ezimeleyo
        kwakungenzi nto, ngoko wawungenakufakwa kuthotho. Ngoku
        iyatshintsha, kwaye neswitshi yoKufumaneka Kweplatfom
        iyatshintsha.</li>
      <li><strong>Yonke ithebhu yeeMpumelelo inobubanzi obufanayo.</strong>
        IRetroAchievements, iRPCS3, iPSN, iSteam ne-Xbox nganye
        yayilinganisa iphepha ngokwamakhadi ayo, ngoko iphepha lalitshintsha
        ububanzi njengoko uhamba phakathi kweethebhu. Ngoku zabelana
        ngobubanzi obunye.</li>
      <li><strong>IRetroDB ifumana iisethingi zeRPCS3 kwiWindows
        nakwimacOS.</strong> KwiWindows iRPCS3 igcina iisethingi zayo
        ecaleni kwe-rpcs3.exe, kwaye iRetroDB ngoku ijonga apho nakwifolda
        ephathekayo, ngoko iisethingi zomdlalo ngamnye noluhlu lokuhambelana
        ziyafumaneka.</li>
      <li><strong>Ukuzalisa nge-AI kuyasebenza kwimidlalo enamanqaku kodwa
        engenaso isilinganiso seminyaka.</strong> Ukuzalisa nge-AI
        kwakunokusilela ngempazamo kumdlalo onjalo ngelixa kufumana
        isilinganiso seminyaka sawo.</li>
      <li><strong>Iilebhile zamakhadi emidlalo zilandela ulwimi
        lwakho.</strong> Isimo sokugqiba neengcebiso zamanqaku kumakhadi
        eThala zazihlala zisesiNgesini.</li>
      <li><strong>Imihla yokukhutshwa kummandla ngamnye.</strong> Xa i-AI
        izalisa izithuba ngexesha lokukhupha, naxa ucofa u-Ukuzalisa nge-AI,
        ngoku ikwabuzwa umhla umdlalo owaphuma ngawo kummandla ngamnye,
        njengoMntla Melika, iYurophu neJapan. Iphepha lomdlalo nombono
        okhawulezayo ziyayidwelisa, eyokuqala kuqala, ineentsuku namagama
        emimandla ngolwimi lwakho. Umhla wokukhutshwa womdlalo ngokwawo
        awutshintshi.</li>
      <li><strong>Umdlalo wangaphambili nolandelayo kwiphepha
        lomdlalo.</strong> Ecaleni kwendlela ephezulu kwiphepha lomdlalo
        kukho amakhonkco athi Ngaphambili nathi Okulandelayo kunye nendawo
        umdlalo okuyo kuluhlu. Alandela iphepha ovela kulo: xa livulwe
        kwiThala ahamba kwiThala, kwaye ukusuka kwiphepha lekhonsoli ahamba
        kuloo khonsoli, ngolungelelwano olufanayo nangezihluzi nokukhangela
        okufanayo obunako apho.</li>
      <li><strong>Izikhuselo nee-screenshot ezilayishiweyo ziphathwa
        njengezikhutshiweyo.</strong> Isikhuselo, ibhokisi ye-3D okanye
        i-screenshot oyilayisha kwifestile yokuhlela ngoku igcinwa
        ngefomathi yomfanekiso efanayo neyemifanekiso ekhutshiweyo,
        itshintshwe ubungakanani bube bufanayo, kwaye izikhuselo zifumana
        iikopi ezincinci ezisetyenziswa liThala. I-screenshot ekhangeleka
        ifana nenye umdlalo osele unayo ayongezwa, kwaye uyaxelelwa ukuba
        zingaphi ezishiyiweyo. Ukulayisha isikhuselo esitsha kukwasusa
        ifayile esithatha indawo yayo.</li>
      <li><strong>IRetroAchievements iyabonakala kwiphepha lomdlalo kuwo
        wonke umdlalo onayo.</strong> Eminye imidlalo yayinebheji ye-RA
        kwiThala kodwa ingenalo ikhadi leRetroAchievements kwiphepha layo,
        njengeMetroid Prime neMetroid Prime 2 kwiGameCube. Iphepha ngoku
        lisebenzisa ikhonkco leRetroAchievements elifanayo nebheji, kwaye
        lilayisha ngokukhawuleza kuba alisabuzi iRetroAchievements qho.</li>
      <li><strong>Inani elingakhutshwanga kwiphepha leeSistim liyahambelana
        nesihluzi esithi Engakhutshwanga.</strong> Inani lalibandakanya
        iidiski zebhonasi, ezingaze ziboniswe kuluhlu lwemidlalo yekhonsoli,
        ngoko ikhonsoli yayinokuthi zi-2 ezingakhutshwanga ngelixa isihluzi
        sayo esithi Engakhutshwanga singabonisi nanye.</li>
      <li><strong>Amaphepha eThala nesistim ahlaziyeka ngoko nangoko
        ngexesha loKukhutshwa Okuninzi.</strong> Ikhadi lomdlalo ngamnye
        liyahlaziyeka ngokukhawuleza xa likhutshiwe, nokuba ifestile
        yoKukhutshwa Okuninzi ivuliwe, ivaliwe okanye iqhuba ngasemva.</li>
      <li><strong>Ukuzalisa nge-AI kunika umdlalo ngamnye igama lawo
        elisemthethweni.</strong> Xa i-AI izalisa izithuba, ekukhupheni
        umdlalo omnye, kuKukhutshwa Okuninzi nangeqhosha elithi Ukuzalisa
        nge-AI, ikwabiza isihloko esisemthethweni somdlalo njengoko
        wakhutshwa kummandla weROM yawo, kwaye umdlalo uthiywa ngaso. Igama
        elidala ligcinwa njengesihloko esongezelelweyo. Isihloko
        ozichwethezele sona okanye owasamkela kuMagama Asemthethweni asoze
        sitshintshwe.</li>
      <li><strong>Amagama Asemthethweni acebisa amagama kwakhona.</strong>
        Nge-OpenAI, kwaye ngamanye amaxesha ngeGemini, iimpendulo ze-AI
        zazingafundeki, ngoko ukuqhuba kwakuphela kungekho magama
        acetyisiweyo.</li>
      <li><strong>Imithombo ikhangelwa kuphela kwiisistim
        eziqukayo.</strong> IRAWG ayinayo imidlalo yeIntellivision, ngoko
        ayisakhangelwa kuyo; ngaphambili yayifumana imidlalo yezinye
        iiplatfom endaweni yoko. I-IGDB, iTheGamesDB neRAWG ngoku zihlala
        zikhangela kwisistim yomdlalo ngokwawo. Amakhonkco aliqela eeplatfom
        zeRAWG ebengachanekanga alungisiwe nawo (Atari ST, ColecoVision, PC
        Engine, DOS).</li>
      <li><strong>Isangqa senkqubela yokukhupha asisatsibeli emva.</strong>
        Emva kokukhangela okungaphezulu kwesinye kwifestile ethi Khangela
        Imetadata, ukucofa u-Faka kanye kwakuqalisa ukukhupha amaxesha
        aliqela, kwaye isangqa sasitsiba phakathi kwawo.</li>
      <li><strong>Ubugcisa bebhokisi ye-3D esondezwayo abunaso isikwere
        ngemva kwabo.</strong> Ibhokisi ihlala ngqo kwimvelaphi
        efiphalisiweyo.</li>
      <li><strong>Imiyalezo ayisabonisi khowudi ye-HTML.</strong> Ezinye
        iifestile zokuqinisekisa nezeziphumo kwiZixhobo zeROM zazibonisa
        iithegi ezifana no-&lt;br&gt; endaweni yokwaphula imigca. Umboni
        we-Log nesikhethi somdlalo ongumzali wediski yebhonasi kwiIisethingi
        ziyasebenza kwakhona.</li>
    </ul>
- version: 3.32.0
  date: '2026-10-23'
