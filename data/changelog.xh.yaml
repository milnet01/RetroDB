    label: 'Iincwadana zemiyalelo zemidlalo zivuleka kwiphepha lomdlalo kwaye amaphepha ajikwa njengencwadi'
  - type: docs
    label: 'Uncedo ludwelisa izitshixo ze-RetroArch, kwaye imidlalo yeekhompyutha ezinebhodi yezitshixo ibonisa isikhumbuzo se-Scroll Lock ecaleni kwe-Dlala'
  - type: ui
    label: 'Imidlalo engenisiweyo engenayo ifayile ye-ROM ayisaniki u-Dlala'
  - type: fix
    label: 'Ukucima i-screenshot akusaxeli ukusilela emva kokuba kuphumelele'
  - type: fix
    label: 'Indlela ye-RetroArch esetwe kumqolo we-emulator yayo yiyo eqalisayo'
  - type: fix
    label: 'Umdlalo ongavaliyo awusaboniswa njengovaliweyo'
  - type: deps
    label: 'I-Pillow 13 nezinye izihlaziyo zeelayibrari'
  body: |
    <ul>
      <li><strong>Iinguqulelo zemimandla zomdlalo zibonakala njengomdlalo
        omnye.</strong> Dibanisa iinguqulelo onazo (umzekelo, ezakhutshwa
        e-USA, eYurophu naseJapan) kwaye iThala libonisa ikhadi elinye
        elinebheji ethi &#127760;. Ikhadi livula kwaye lidlala inguqulelo
        yoMmandla Ozenzekelayo wakho. Iphepha lomdlalo libonisa zonke
        iinguqulelo ecaleni komnye kwaye likuvumela ukuba utshintshe phakathi
        kwazo. Izixhobo zeROM &gt; Iinguqulelo Zemimandla zicebisa amaqela
        ukuze abahleli bawaqinisekise; akukho nto idityaniswayo ngaphandle
        kwakho. Ayize icebise umdlalo olandelayo njengenguqulelo yomdlalo
        wokuqala. Iinguqulelo ezidityanisiweyo azisaxelwa njengeziphindaphindiweyo
        ngegama. Qhuba Zalisa Izihloko Ezongezelelweyo kanye ukuze iingcebiso
        zibe nenkcukacha ezininzi zokusebenza ngazo.</li>
      <li><strong>I-AI ingashwankathela indlela iinguqulelo zemimandla
        ezahluke ngayo.</strong> Kumdlalo oneenguqulelo ezidityanisiweyo,
        abahleli banokucofa u-Shwankathela umahluko nge-AI kwicandelo
        leeNguqulelo Zemimandla. I-AI idwelisa umahluko owaziwayo
        onjengokuhlolwa (censorship), ubunzima okanye umxholo osusiweyo.
        Uluhlu luphawulwa njengolubhalwe yi-AI, luvela kwiphepha lenguqulelo
        nganye, kwaye luyafihlwa xa udibanisa okanye uqhawula inguqulelo de
        lubhalwe kwakhona. Kufuneka umboneleli we-AI osetwe kwi-Iisethingi
        &gt; Ukukhupha.</li>
      <li><strong>Imidlalo yePlayStation iqala neesethingi ezilungileyo.</strong>
        Kwi-DuckStation, i-PCSX2 ne-RPCS3, i-RetroDB ngoku isetha isikali
        sesisombululo (resolution) nomlinganiselo womfanekiso womdlalo ngamnye
        kwifayile yeesethingi ze-emulator yomdlalo ngamnye xa ucofa u-Dlala,
        kunye nokuba iqala kwisikrini esipheleleyo na. Zitshintshe kwisistim
        yonke ngeqhosha leesethingi kwi-Iisethingi &gt; Ii-emulator, okanye
        kumdlalo omnye kwiphaneli entsha ethi Iisethingi ze-emulator kwiphepha
        lawo. Isethingi oyitshintsha ngaphakathi kwi-emulator ihlala iphumelela.
        I-RetroDB ifunda inombolo yesiriyeli yediski nganye ukuze ifumane
        ifayile echanekileyo; iidiski ze-CHD zifuna ukuba i-chdman ifakwe.</li>
      <li><strong>Ukuzalisa nge-AI akusakwazi ukulawulwa ngumbhalo ochwethezwe
        kumacandelo omdlalo.</strong> Xa Ukuzalisa nge-AI kujonga umpapashi,
        umphuhlisi, uhlelo okanye amanye amaqonga omdlalo asele ekhona, ngoku
        kucoca loo mbhalo kuqala, ngendlela ebesele kucoca ngayo isihloko.</li>
      <li><strong>Ukuskena kweZixhobo zeROM kuhlala ngaphakathi kwifolda yakho
        yeROM.</strong> UMguquli weCHD no-Qinisekisa iCHD abasalandeli
        isinqumleli (symlink) esalathisa ngaphandle kwayo, kwaye ukukhupha
        i-archive yeediski ezininzi akuhoyi naso nasiphi na isinqumleli
        esipakishwe ngaphakathi kwi-archive.</li>
      <li><strong>Amaphepha ayala ukuqhuba izikripthi ezifakwe kuwo
        ngobuqhetseba.</strong> I-browser yakho ngoku ivimba nasiphi na
        isikripthi i-RetroDB engasibhalanga yona, ngoko umbhalo ofaka ikhowudi
        ngokufihlakeleyo kwisihloko somdlalo, kwithegi okanye kwinkcazelo
        ekhutshiweyo awunakuyiqhuba. Amaqhosha neemenyu zisebenza
        njengangaphambili.</li>
      <li><strong>I-screenshot enye eyaphukileyo ayisamisi ukujongwa
        kweziphindaphindiweyo zomdlalo.</strong> I-screenshot engafundekiyo
        ibekwa ecaleni kwaye ukujonga kuyaqhubeka.</li>
      <li><strong>Imisebenzi yeZixhobo zeROM ayisabambeki ku-"iyasebenza".</strong>
        Ifayile ecinywe emva kokuskena kuka-Qinisekisa iCHD ibalwa
        njengengasebenziyo, kwaye nayiphi na impazamo engalindelekanga
        kuMguquli weCHD, ku-Qinisekisa iCHD okanye kuMfumani
        Weziphindaphindiweyo iphelisa umsebenzi njengosilelayo, impazamo
        ikwi-log yawo.</li>
      <li><strong>Phambi kokuba ukusetwa kugqitywe, izicelo zedatha ze-app
        zifumana impendulo ecacileyo.</strong> Ziphendula ngo-"Kufuneka
        ukusetwa" endaweni yokubuyisela iphepha lokuseta. Amaphepha asakusa
        kwi-wizard yokuseta.</li>
      <li><strong>Imidlalo elandelayo (sequels) ayisabonisi iimpumelelo
        zomdlalo wokuqala.</strong> Ukufanisa kwe-RetroAchievements
        bekungayihoyi inombolo esesihlokweni, ngoko i-Donkey Kong Country 2
        no-3 zazidityaniswe ne-Donkey Kong Country. Iinombolo (2, II, 3, III
        njalo njalo) ngoku ziyabalwa. Ukulungisa imidlalo esele
        idityanisiwe, qhuba uHlaziyo lwe-RetroAchievements lwazo zonke
        iisistim kanye.</li>
      <li><strong>Ukulungelelanisa kwePlayStation akusacimi amanani akho
        eendebe.</strong> Xa impendulo yePlayStation ishiya ngaphandle
        izimbuku zeendebe zomdlalo, i-RetroDB yayigcina oonothi phezu
        kwamanani ebesele inawo. Ngoku iyawagcina, nakuhlaziyo lweendebe
        ngobuninzi.</li>
      <li><strong>Ukuvula iseti yeendebe engasekho kwidiski kubonisa
        umyalezo.</strong> Iphepha leeNdebe beliqhele ukusilela ngempazamo;
        ngoku lithi iseti ayifumanekanga kwaye likubuyisela kuluhlu.</li>
      <li><strong>Iitheyibhile zeZixhobo zeROM zibiza ikholamu yamaqhosha
        ngokuchanekileyo kuzo zonke iilwimi.</strong> Isihloko sekholamu
        sasabelana ngamagama nohlobo lomdlalo lwe-Action, ngoko ezinye iilwimi
        zazibonisa igama lohlobo apho.</li>
      <li><strong>Imidlalo ye-GameCube, i-3DS ne-Super Famicom ifumana
        i-emulator yayo isetwe ngokuzenzekelayo.</strong> I-RetroDB
        yayikhangela ezi sistim phantsi kwamagama eefolda angasetyenziswayo
        ziilayibrari (gamecube, 3ds, superfamicom endaweni ye-gc, n3ds, sfc),
        ngoko i-Dolphin ne-Citra zazingaze zidityaniswe nazo. Qalisa kwakhona
        i-RetroDB kanye ukuze ikufumane oku.</li>
      <li><strong>I-download engafuni Python (standalone) iseta ii-emulator
        kwakhona.</strong> Yayingenayo ifayile ezidwelisayo.</li>
      <li><strong>Malunga nama-170 amanye amaqhosha, iilebheli nemiyalezo
        zitolikiwe</strong> kuzo zonke iilwimi. Zazibonakala ngesiNgesi
        ngaphambili, kwaye ezimbalwa zazibonisa uqikelelo olungalunganga
        (ezinye iilwimi zazithi "ugcino lusilele" xa umdlalo usilele
        ukuqala).</li>
      <li><strong>I-Escape ivala kuphela ifestile ephezulu.</strong> Xa
        umbuzo uvulekile phezu kwenye ifestile, i-Escape yayivala zombini;
        ezinye iifestile zaziqhubeka zisebenza emva kokuba i-Escape izifihlile,
        kwaye ukucofa i-Escape kwiphepha lomdlalo kwakunokuqhubeka
        nokukhupha ngobuninzi obukumisile. Yonke ifestile ngoku ivalwa
        ngesenzo sayo sokuvala, igcina ugxininiso lwebhodi yezitshixo
        ngaphakathi xa ivulekile, kwaye ibuyisela ugxininiso kwiqhosha
        elivulileyo. Iifestile zenkqubela zemisebenzi esebenzayo zihlala
        zivulekile de umsebenzi uphele.</li>
      <li><strong>Iitshati zoHlalutyo zisolwimi lwakho.</strong> Amagama
        eendidi, ii-perspective, ii-dimension neemowudi, izihloko zeetshati,
        amagama ee-axis nezitshixo zeetshati (legends) zazisesiNgesini kuzo
        zonke iilwimi.</li>
      <li><strong>Idatha ye-RetroAchievements ikhuseleke ngakumbi.</strong>
        Ukuba uluhlu lwemidlalo ye-RetroAchievements lwekhonsoli luyasilela
        ukulayisha, uHlaziyo lwe-RA ngoku lushiya imidlalo yaloo khonsoli
        idityanisiwe endaweni yokuyiqhawula yonke. U-Sula Idatha yeRA ngoku
        usula kuphela inkqubela ye-RetroAchievements; inkqubela ye-Steam
        ne-Xbox iyahlala.</li>
      <li><strong>Amagama ayimfihlo kufuneka abe noonobumba abali-12 ubuncinci
        kuyo yonke indawo.</strong> Ukusetwa kokuqala kwakwamkela igama
        eliyimfihlo lomlawuli lobude nobuphi na, kwaye amaphepha okunyanzelwa
        ukutshintsha igama eliyimfihlo nokuseta ayesithi oonobumba aba-4
        banele. Omathathu ngoku acela ali-12, njengayo yonke enye i-app.</li>
      <li><strong>Izimbuku zeempumelelo zichanekile, kwaye zezakho.</strong>
        Ukulungelelanisa umdlalo omnye ukusuka kwi-RetroAchievements ngoku
        kugcina ukuba mingaphi iimpumelelo onazo, endaweni ka-0. Izimbuku
        zeempumelelo kwi-dashboard zibala kuphela imidlalo yakho, kwaye
        Iindebe Zomqokeleli azisabali impumelelo nganye ye-Steam okanye
        ye-Xbox kabini.</li>
      <li><strong>Ukulungelelanisa ngasemva kusebenzisa ii-akhawunti zakho.</strong>
        Ukulungelelanisa isistim ye-RetroAchievements kungena nge-akhawunti
        yakho ye-RetroAchievements xa uyisetile. Uhlaziyo ngobuninzi
        lwePlayStation lusebenzisa kwakhona ukungena kwakho okugciniweyo
        endaweni yokungena kwakhona qho.</li>
      <li><strong>Nguwe kuphela onokumisa okanye uqhubeke nokulungelelanisa
        kwakho.</strong> Omnye umsebenzisi akasakwazi ukurhoxisa
        ukulungelelanisa kwakho kwe-RetroAchievements, i-Steam okanye i-Xbox,
        kwaye ukuqhubeka nomsebenzi ophazamisekileyo kufuna amalungelo
        afanayo nokuwuqalisa. Abalawuli basenokwenza zombini.</li>
      <li><strong>Ifolda yakho yeendebe ze-RPCS3 iyajongwa xa uyigcina.</strong>
        Ifolda engekhoyo, engeyiyo indlela epheleleyo, okanye eyifolda
        yesistim iyaliwa, njengoko bekusele kunjalo kwiisethingi eziphambili.</li>
      <li><strong>"Landa Yonke Imifanekiso" kwiMyuziyam iqhuba
        ngasemva.</strong> Iphepha alisalindi imizuzu yonke imifanekiso
        yezilawuli. Libonisa ukuba ukulanda sekufike phi, linalo iqhosha
        lokuRhoxisa, kwaye liphinda libonise inkqubela ukuba uyalishiya
        iphepha uze ubuye.</li>
      <li><strong>Izixhobo zeROM zikhusela iifayile zakho ngcono.</strong>
        Ukucoca akusayiphalazi i-archive: ipateni efana no-<code>*</code>
        ayinakugcinwa, kwaye Ukucoca kuyema ukuba iipateni bezinokususa yonke
        ifayile. UMguquli weCHD ugcina eyoqobo xa u-"verify" ecinyiwe, kwaye
        ushiya i-CHD esele ikhona xa u-"skip existing" evuliwe.
        UMfumani Weziphindaphindiweyo uhlala egcina ikopi enye yomdlalo
        ngamnye, nokuba isicelo sicela zonke.</li>
      <li><strong>Imisebenzi yeZixhobo zeROM iziphatha njengoko amaqhosha
        esitsho.</strong> U-Misa ngoku umisa uMguquli weCHD, u-Qinisekisa
        iCHD, uMfumani Weziphindaphindiweyo noKususwa Kweziphindaphindiweyo
        Zee-Screenshot, kwaye umsebenzi omisiweyo unokurhoxiswa. Ukuskena
        kokuSususwa Kweziphindaphindiweyo Zee-Screenshot okudibana nempazamo
        ngoku kuphela njengokusilelayo endaweni yokuqhubeka ngonaphakade.</li>
      <li><strong>I-Create M3U ayisazibeki ii-archive kwifolda
        yethutyana.</strong> Ii-archive ezifudusiweyo ngoku ziya kwifolda
        yedatha ye-RetroDB uqobo, engacocwayo xa kuqaliswa kwakhona. Isiskeni
        se-archive sibonisa apho ziye khona, kwaye ukuqinisekisa iqela kuthi
        ziza kufuduswa. Ukusetha kwakhona iisethingi zeZixhobo zeROM ngoku
        kuseta kwakhona lonke ukhetho.</li>
      <li><strong>Tshintsha iidiski ukusuka kwi-RetroDB.</strong> Ngelixa
        umdlalo we-RetroArch oqaliswe kuluhlu lweediski lwe-.m3u usebenza,
        uluhlu oluthi &#9654; Idlala ngoku phezulu kwiphepha ngalinye lubonisa
        isihloko somdlalo neqhosha elithi Idiski elandelayo, ngoko umdlalo
        ocela icala lesibini uqhubeka ngokucofa kanye, ukusuka kwi-browser
        okanye kwifowuni. I-RetroArch kufuneka ibe ne-Settings &gt;
        Network &gt; Network Commands evuliwe (izibuko 55355); iqhosha
        liyakuxela ukuba icinyiwe.</li>
      <li><strong>Iskripthi sokuqalisa sivula i-RetroDB xa ilungile.</strong>
        I-start.sh, i-start.command ne-start.bat zazivula i-browser emva
        kwemizuzwana emi-3 emiselweyo, rhoqo phambi kokuba iseva iphendule,
        ngoko iphepha lalisilela ukulayisha. I-RetroDB ngoku ilivula xa
        iseva ilindile. Xa iqaliswe nge-LocalWebServerManager, ayivuli phepha
        konke konke; sebenzisa iqhosha elithi Open lomphathi.</li>
      <li><strong>Iividiyo zemidlalo zingafikelela kwi-500 MB.</strong> Umda
        wawuyi-50 MB, mncinci kakhulu kwiitrailer ezininzi zemidlalo.
        Ukulayisha okukhulu kakhulu ngoku kubonisa umyalezo kwiphepha lomdlalo
        endaweni yokutshintsha iphepha ngombhalo ongenanto. Ividiyo eyaliweyo
        (enkulu kakhulu okanye eluhlobo olungalunganga lwefayile) ngoku
        iyakuxela oko endaweni yokulahlwa ngaphandle kwelizwi.</li>
      <li><strong>Ukuqalisa kulandela indlela oyisetileyo.</strong> Indlela
        ye-Binary path override kumqolo we-RetroArch kwi-Iisethingi &gt;
        Ii-emulator ngoku iphumelela ngaphezu kwendlela ye-RetroArch phezulu
        kwelo phepha; ngaphambili, indlela yomqolo yayingahoywa. Ukucofa
        u-Misa kabini akusacelanga umdlalo ukuba uphume kabini; kwi-Linux,
        i-RetroArch ithatha isicelo sesibini njengo-"phuma ngaphandle
        kokugcina", ngoko ugcino lwakho lwangaphakathi emdlalweni
        lwalunokulahleka.
        Isethingi yesiqalisi eseleyo kwimowudi ekude engazange yakhiwe
        ayisayimisi yonke imidlalo ukuba iqale.</li>
      <li><strong>Izenzo ezisilelayo zixela iimpazamo zazo kakuhle.</strong>
        Xa ukugcina, ukungenisa, ukulungelelanisa okanye ukuskena kusilela,
        i-RetroDB ngoku iphendula ngewonga lempazamo lokwenyani kwaye ibonisa
        isizathu kumyalezo wayo, endaweni yokuphendula ngokungathi
        kuphumelele. Ukugcina ikhowudi yokungena ye-PSN engakwaziyo ukuqhagamshela
        akusabonisi iinkcukacha zempazamo zangaphakathi. Ukungena, ukulawula
        abasebenzisi, iprofayile yakho, iimpumelelo, ukungenisa, Ukuzalisa
        nge-AI nokukhangela kwe-HowLongToBeat ngoku kwenza okufanayo, kwaye
        ulwimi olungakwaziyo ukugcinwa luyakuxela isizathu endaweni
        ka-"Impazamo yenethiwekhi".</li>
      <li><strong>Imidlalo ethiywe ngendlela ye-No-Intro ngoku iyakhutshwa.</strong>
        Isihloko esinjengo-"Legend of Zelda, The" okanye "Legend of Zelda,
        The - Ocarina of Time" ngoku sifana neziphumo ze-"The Legend of
        Zelda" endaweni yokwaliwa sisihluzo sokufanisa. Iingxelo zeROM
        nazo aziphawuli loo magama njengangafaniyo.</li>
      <li><strong>Izihloko ezithathwe kumagama eefayile zilahla zonke iithegi
        zazo.</strong> Ummandla odibeneyo onjengo-"(USA, Europe)" no-"(UK)"
        ngoku ziyasuswa. Kwiikhompyutha zasekhaya ezifana ne-ZX Spectrum,
        yonke into ukusuka kunyaka ukuya phambili iyasuswa, ngoko
        "Chuckie Egg 2 (UK) (1985) (A'n'F Software) (tzx)" iba
        "Chuckie Egg 2". Igama lefayile eliphela ngo-"..zip" alisashiyi
        ichaphaza elingafunekiyo. Ukukhangela kwe-scraper, ukuseta kwakhona
        idatha yomdlalo neengcebiso zeeNguqulelo Zemimandla zisebenzisa la
        magama acocekileyo.</li>
      <li><strong>Isihloko esingalunganga asisaziphindi ekukhupheni
        kwakhona.</strong> Ukukhupha ngobuninzi ngoku kukhangela ngegama
        elivela kwifayile ye-ROM, hayi isihloko esigcinwe kumdlalo. Umdlalo
        owakhe wafaniswa nomdlalo ongalunganga ufumana ochanekileyo xa
        ukhutshwa kwakhona.</li>
      <li><strong>Ii-scraper zikhetha uMmandla Ozenzekelayo wakho.</strong>
        Xa iziphumo ezimbini zilingana, eso sivela kuMmandla Ozenzekelayo
        wakho okanye kwi-World ngoku siyaphumelela, hayi eso se-USA
        ngalo lonke ixesha. Izihloko ezimbini eziziithegi zemimandla kuphela
        azisabalwa njengezifana ngokugqibeleleyo. Iinguqulelo Zemimandla
        azisayiphazamisi i-X ku-"X-Men" njengenombolo yomdlalo olandelayo.
        Ukukhetha ukuba yeyiphi inguqulelo eboniswa likhadi ngoku kufunda
        igama lefayile ye-ROM kuphela, hayi iifolda ezingaphezulu kwayo, kwaye
        kuyaziqonda iithegi ezindala ezinjengo-"(U)" no-"(E)".</li>
      <li><strong>I-log ibonisa apho ixesha lokukhupha umdlalo ngamnye liya
        khona.</strong> Emva komdlalo ngamnye, i-RetroDB ibhala umgca omnye
        kwi-log onemizuzwana echithwe ekukhangeleni, kumthombo ngamnye,
        ekukhupheleni, ekuqhubeni imifanekiso, kwi-AI nasekugcineni. Linyathelo
        lokuqala lokukhupha ngokukhawuleza.</li>
      <li><strong>Ukukhupha kugqiba ngokukhawuleza: imifanekiso emincinci
        icaciswa emva koko.</strong> Ukukhupha ngoku kugcina umdlalo
        nemifanekiso yawo njengoko ikhutshelwe. Ubugcisa bebhokisi obuncinci
        nee-screenshot ke ziyandiswa ngasemva, umdlalo omnye ngexesha.
        Ii-screenshot eziphindaphindiweyo ziyalahlwa phambi kwawo nawuphi na
        loo msebenzi. Ukuba i-RetroDB iyayeka phakathi, iyaqhubeka xa iqala
        kwakhona.</li>
      <li><strong>Funda incwadana yomyalelo yomdlalo kwiphepha lawo.</strong>
        Iqhosha elithi Incwadana Yomyalelo ngoku livula i-PDF kwifestile
        ephezu kwephepha lomdlalo. Jika amaphepha ngo-Ngaphambili
        no-Okulandelayo, izitshixo zeentolo, i-Home ne-End, okanye ngokutshayela
        kwifowuni; iphepha ngalinye lijika njengelencwadi, okanye litshintshe
        nje ukuba isistim yakho icela intshukumo encinci. "Vula i-PDF
        kwithebhu entsha" isekhona, kwaye u-Ctrl-click ku-Incwadana Yomyalelo
        uvula ithebhu ngqo.</li>
      <li><strong>Ibha esecaleni ibonisa xa imifanekiso isaphuculwa.</strong>
        Ngelixa imifanekiso icaciswa ngasemva, ibha esecaleni ithi
        "Kuphuculwa imifanekiso — Imidlalo eseleyo: N". Umdlalo osalindile
        uyakuxela oko kwiphepha lawo, kwaye imifanekiso yawo ecace ngakumbi
        ivela apho ngokwayo xa ilungile. Iswitshi yekhava ye-2D/3D ayisawugqumi
        loo mgca.</li>
      <li><strong>Imithombo exhasayo ibuzwa ngaxeshanye.</strong> Xa umthombo
        oyintloko ushiya izikhewu, i-RetroDB ngoku ibuza eminye imithombo
        yonke ngaxeshanye endaweni yomnye emva komnye. Iimpendulo zayo
        zisasetyenziswa ngokolandelelwano lwakho lwe-Iisethingi, ngoko
        umthombo omnye uphumelela kwicandelo ngalinye.</li>
      <li><strong>I-ES-DE ifunda uluhlu lwayo lwemidlalo kanye.</strong>
        Ukukhupha ngakunye, kuquka ukukhupha ngobuninzi, kwakudla ngokufunda
        i-gamelist.xml ye-ES-DE yesistim kabini kumdlalo ngamnye. I-RetroDB
        ngoku iyifunda kanye kwaye iyifunde kwakhona kuphela xa ifayile
        itshintsha.</li>
      <li><strong>Ukufaka kwe-Khangela Imetadata akusakhangeli
        kwakhona.</strong> Kwiphepha lomdlalo, iziphumo ozikhethileyo
        zilandwa ngqo kumthombo wazo endaweni yokukhangelwa okwesibini.
        Ukuba akukho nto ikhethiweyo, kuphela umthombo owufakileyo ne-AI
        ezizalisa izikhewu.</li>
      <li><strong>I-ScreenScraper ifumana imidlalo enesihlokwana.</strong>
        Yayingafumani nto kwisihloko esifana no-"Alone in the Dark: The New
        Nightmare" ngaphandle kokuba ikholon ibe nesithuba phambi kwayo.
        I-RetroDB ngoku ikhangela ngolo hlobo, emva koko ngenxalenye
        engaphambi kwekholon ukuba ayikafumani nto.</li>
      <li><strong>Imidlalo engenanto yokudlalwa ayisaniki u-Dlala.</strong>
        Umdlalo ongeniswe kwi-CLZ, i-Steam, i-Xbox okanye i-PSN awunayo
        ifayile ye-ROM. Iphepha lawo ngoku alibonisi qhosha elithi Dlala,
        akukho Iisethingi ze-emulator kwaye akukho candelo lokuQalisa xa
        uwuhlela, kufana namakhadi eThala.</li>
      <li><strong>Imidlalo ye-RetroArch ikhuselwe kwiisethingi ezimbini
        ezimbi.</strong> I-RetroDB ngoku inika i-RetroArch ifayile encinci
        yeesethingi eyeyayo qho xa iqalisa umdlalo, ngaphezu kweyakho.
        Iseta ibhodi yezitshixo ukuba ifane ne-desktop yakho (Wayland okanye
        X11), ngoko ibhodi yezitshixo ayize ifile, kwaye ivumela
        ukukhawulezisa (fast-forward) ukuba kusebenze ngesantya esipheleleyo,
        imidlalo ye-Commodore 64 ekusebenzisayo ukulayisha ngokukhawuleza.
        Zonke ezinye iisethingi zakho ze-RetroArch azichukunyiswa.</li>
      <li><strong>I-Create M3U igcina umdlalo kwithala lakho.</strong>
        Ukuguqula i-archive yeediski ezininzi ibe luluhlu lokudlala kwakudla
        ngokushiya umdlalo walathe kwi-archive, ebisele ifudusiwe. Umdlalo
        ngoku walatha kuluhlu olutsha lokudlala kwaye ugcina iinkcukacha
        nemifanekiso yawo. Xa i-archive enye iqulethe iinguqulelo ezininzi
        zomdlalo, nganye ineseti yayo yeediski, uluhlu lokudlala ngoku
        lusebenzisa iidiski zenguqulelo yokuqala endaweni yazo zonke, kwaye
        luxela ukuba zeziphi iidiski oluzishiye ngaphandle.</li>
      <li><strong>Ukukhupha Kwakhona Okupheleleyo kungayigcina imidiya osele
        unayo.</strong> Khetha u-"Gcina imidiya ekhoyo" ecaleni kweswitshi
        yoKukhupha Kwakhona Okupheleleyo. Iinkcukacha zombhalo zisahlaziywa,
        kodwa ubugcisa, iividiyo neencwadana zemiyalelo esele zikwidiski
        zihlala zinjalo endaweni yokukhutshelwa kwakhona. Ngaphandle kokukhetha,
        Ukukhupha Kwakhona Okupheleleyo akusazilahli ii-screenshot ebesele
        kuzikhuphele ngaphambili.</li>
      <li><strong>Imisebenzi engasemva ayisalahli okanye itsibe
        umsebenzi.</strong> Uhlaziyo lwe-RetroAchievements oludibene nomdlalo
        omnye ombi alusayilahli imidlalo ebesele luyihlaziyile.
        Ukulungelelanisa okanye uhlaziyo oluqhubekayo alusawutsibi umdlalo
        ebelukuwo xa lume. Ukulungelelanisa kwe-RetroAchievements okanye
        kwe-Steam okuqhubeka ukusuka kwi-snapshot endala kakhulu ngoku kuyema
        nomyalezo endaweni yokuxela impumelelo kungalungelelaniswanga nto.
        Uguqulo lwe-WebP lujonga ifayile ye-WebP eseleyo phambi kokuyithemba,
        kwaye aluzukuqala ukuba alukwazi ukufunda isithuba esikhululekileyo
        kwidiski.</li>
      <li><strong>Ukuphucula ufakelo oludala kakhulu akusenakulahla idatha
        cwaka.</strong> Amanyathelo amathathu amadala okuphucula isiseko
        sedatha ayenokulahla imiqolo kwiimeko ezinqabileyo. Ngoku ayayikopa
        imiqolo, okanye ayema ngempazamo ecacileyo endaweni yokuyilahla.</li>
      <li><strong>Amaqhosha efestile ethi Malunga akasasikwa.</strong>
        Ifestile ibanzi ngakumbi kwaye amaqhosha ayo amane ahlala kwimiqolo
        emibini, ngoko yonke ilebheli ibonakala ngokupheleleyo; kwifowuni
        ayabekwa phezu komnye.</li>
      <li><strong>Ithim yakho ikulandela kwi-browser entsha.</strong> Ukungena
        kwi-browser ongazange uyisebenzise ngaphambili ngoku kubonisa ithim
        yakho egciniweyo. Ngaphambili, iphepha lokungena laligcina i-Cyberpunk
        kuqala kwaye yahlala injalo.</li>
      <li><strong>Ibhokisi yegama eliyimfihlo yokungena ayisathi "Admin
        Login".</strong> Yonke i-akhawunti ingena ngegama eliyimfihlo, ngoko
        ibhokisi yencoko ngoku ithi nje Ngena. Iphepha le-akhawunti nephepha
        loNcedo nawo atsho.</li>
      <li><strong>Uncedo luhlaziyiwe kuzo zonke iilwimi.</strong> Amaphepha
        oNcedo atolikiweyo ngoku achaza Iinguqulelo Zemimandla, athi yonke
        i-akhawunti ifuna igama eliyimfihlo, kwaye athi ithim yakho igcinwa
        ne-akhawunti yakho. Uncedo kuzo zonke iilwimi, kuquka isiNgesi, ngoku
        lunika ubuncinci bokwenyani begama eliyimfihlo boonobumba abali-12.</li>
      <li><strong>Ulungiso oluncinci:</strong> i-fanart enegama lefayile
        elinesimaphambili (apostrophe) ngoku iyabonakala kumaphepha emidlalo
        nawendebe; Iisethingi azisabonisi mpazamo yeskripthi kwii-akhawunti
        ezingezizo ezabalawuli, kwaye izifundi zesikrini ngoku ziyeva ukuba
        yeyiphi ithebhu ye-Iisethingi ekhethiweyo; ukushiya iphepha
        akusayizalisi i-console ye-browser ngeempazamo zezicelo ezirhoxisiweyo;
        imodeli yokwandisa imifanekiso ikhutshelwa kwidilesi esebenzayo kuqala;
        kwaye isifaki asisawi kwi-Windows xa iziphumo zaso zigcinwa kwifayile.</li>
      <li><strong>Umjikelo obanzi wolungiso lokuthembeka.</strong> Ukugcina
        umdlalo onesihloko esingenanto akusazilahli ezinye iinguqu zakho.
        Ukuqalisa kwakhona ngoku kuvumela imisebenzi esebenzayo ukuba ime
        kakuhle kuqala. I-Create M3U iyala ukubhala ngaphezulu kuluhlu
        lokudlala okanye kwifolda esele ikhona. Ukusula uluhlu lweefayile
        ezingafunekiyo kwiZixhobo zeROM ngoku kuthetha "musa ukucima nto",
        kwaye iipateni ezimbini azisawabambi amagama okwenyani eeROM afana
        no-"Release of the Dragon". Ifayile enye eyonakeleyo yeendebe ze-PS3
        ayisazicimi iindebe zayo yonke imidlalo. Ukuzalisa nge-AI kubhala
        ummandla omnye. Uhlalutyo lubala umdlalo ngamnye kanye kwitshati
        yokulinganisa. Ukungenisa kwe-CLZ kusebenzisa amagama aqhelekileyo
        eendidi. Kwiibhokisi zencoko zokuhlela, uhlobo nezinye iithegi
        zingasuswa kuzo zonke iilwimi, kwaye izinqumleli zebhodi yezitshixo
        azisathathi u-Ctrl+D okanye u-Ctrl+G. Ababoni babona imeko yokugqitywa
        komdlalo kodwa abasakwazi ukuyitshintsha, kuba yabelwana ngayo
        ngumntu wonke.</li>
      <li><strong>Izifundi zesikrini zifunda iswitshi ethi Platform Match
        Required ngegama layo elibonakalayo</strong> kwi-Iisethingi →
        Ukukhupha.</li>
      <li>Kwezinye iilwimi, Iisethingi ngoku zitolika "Default Region",
        kwaye ithebhu yoKukhupha ifundeka njengegama endaweni
        ka-"ukukhupha kuyaqhubeka". Amaphepha oncedo asebenzisa amagama
        afanayo.</li>
      <li><strong>Umdlalo ongavaliyo awusaboniswa njengovaliweyo.</strong>
        Ukuba i-emulator iyasinda ku-Misa, i-RetroDB iqhubeka iyibonisa
        njengesebenzayo. Ukuqalisa kwe-RetroArch okwaliweyo akusabhali
        ifayile yayo yeesethingi kuqala, kwaye i-emulator esilela kwangoko
        ibonisa umyalezo wayo wempazamo kujongo lokuqala.</li>
      <li>Iilayibrari ezihlaziyiweyo: i-Pillow 13 (ukuphathwa kwemifanekiso),
        i-numpy 2.5.4 ne-onnxruntime 1.31 (ukwandisa imifanekiso), kunye
        neenguqulelo zamva nje zezixhobo zokwakha nokukhupha.</li>
      <li>Ngasemva: ikhowudi yokuqalisa imidlalo icocwe ukuze kube lula
        ukuyilandela, ikhowudi engasetyenziswayo isusiwe (idilesi ye-API,
        isincedisi se-PSN, iskripthi seendebe esingazange silayishwe
        liphepha, nesethingi yethim yesayithi yonke engazange ifundwe nto),
        iimpendulo ze-app kwi-browser zakhiwa kwindawo enye, amaxwebhu
        aliqela oyilo alungisiwe ukuze afane nekhowudi, iqela lovavanyo
        licociwe, kwaye ujongo olutsha lubamba impazamo ye-syntax ye-JavaScript
        phambi kokukhutshwa. Amangeno amadala e-changelog ebechaza ikhowudi
        esusiweyo ngoku ayatsho.</li>
    </ul>
- version: 3.29.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 'Amanye amagama omdlalo abonisa ummandla avela kuwo'
  body: |
    <ul>
      <li><strong>Amanye amagama omdlalo abonisa ummandla avela
        kuwo.</strong> Ikhadi elithi Ikwaziwa ngokuba kwiphepha lomdlalo
        liphawula igama ngalinye ngelizwe okanye ummandla walo, njengeJapan
        ku-"Rockman", ngolwimi lwakho. Amagama aphawuliweyo aza kuqala,
        ahlelwe ngommandla. Beka isalathisi phezu kwegama ukuze ubone umthombo
        walo nalo naliphi na inqaku, elifana no-"Working title".</li>
      <li>Amagama avela kwi-IGDB ngoku agcina ummandla wawo. Ngaphambili,
        ngamagama e-ScreenScraper kuphela ayenawo.</li>
      <li>Ilebheli ethi "SS" ye-ScreenScraper ayisaboniswa njengommandla.
        Ligama le-ScreenScraper lomdlalo, hayi indawo.</li>
      <li>Izixhobo zeROM → Zalisa Izihloko Ezongezelelweyo ngoku zijonga
        yonke imidlalo ekhutshiweyo, ngoko amagama osele unawo afumana
        imimandla yawo. Yiqhube kanye ukuze uphawule ithala lakho elikhoyo.</li>
    </ul>
- version: 3.28.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 'Bonisa i-RetroDB ifolda yakho yee-emulator kwaye iyazimisela'
  - type: fix
    label: 'Ulungiso lwephepha le-Iisethingi → Ii-emulator'
  body: |
    <ul>
      <li><strong>Bonisa i-RetroDB ifolda yakho yee-emulator kwaye
        iyazimisela.</strong> Iisethingi → Ii-emulator zinoluhlu olutsha
        oluthi Iifolda zee-emulator. Yongeza ifolda ehlala kuyo ii-emulator
        zakho kwaye i-RetroDB ifumana nganye kuyo, njenge-AppImage, iskripthi
        esiphathekayo okanye i-Flatpak efakiweyo, kwaye iyidibanise
        neesistim eziqhutywa yiyo. Isistim esele ine-emulator esebenzayo
        iyayigcina.</li>
      <li><strong>Bona ukuba zeziphi iisistim ezilungele ukudlalwa.</strong>
        Itheyibhile yokudibanisa isistim nganye ngoku idwelisa zonke
        ii-emulator zesistim nganye, ixela ukuba nganye iyasebenza na, kwaye
        ikuvumela ukhethe i-emulator ezenzekelayo yesistim. Kwi-DuckStation,
        i-PCSX2, i-RPCS3 ne-RetroArch ikwaxela ukuba iifayile ze-BIOS
        zikhona na, kwaye ibiza nezo zingekhoyo. I-RetroDB ifunda kuphela
        iifayile ze-BIOS; ayize iyikope okanye iyikhuphele.</li>
      <li>Ukuskena kwee-emulator ngoku kufumana yonke i-emulator kwidrayivu
        enkulu yee-emulator. Ngaphambili, kwakunokuyeka kwangoko ngaphakathi
        kwifolda yeesethingi ye-emulator uqobo.</li>
      <li>Amaqhosha e-RetroArch athi Auto-detect noGcina ayasebenza kwakhona,
        kwaye ifestile yokuhlela i-emulator ayisabonakali kwiphepha de ucofe
        u-Hlela.</li>
    </ul>
- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 'Ukufaka imetadata kubonisa ukuba sele kufike phi'
  body: |
    <ul>
      <li><strong>Ukufaka imetadata kubonisa ukuba sele kufike phi.</strong>
        Xa ukhetha isiphumo kwi-Khangela Imetadata, iringi iyazaliswa ukusuka
        ku-0 ukuya ku-100% ngepesenti embindini wayo, kwaye umgca ongezantsi
        uxela okwenzekayo: yeyiphi isayithi ekhangelwayo, yeyiphi imifanekiso
        okanye ividiyo ekhutshelwayo, okanye ukuba imifanekiso iyaqhutyelwa.
        Ukukhuphela okukhulu, njengevidiyo, kuhambisa iringi njengoko kufika.
        Ku-100% iphepha liyalayisha kwakhona nesiphumo,
        njengangaphambili.</li>
      <li>Iringi inokuhamba ngokungalinganiyo. Umthombo ngamnye uthatha
        isigqibo sokuba mingaphi imifanekiso eyithumelayo kuphela xa
        uphendula, ngoko umthombo wokuqala onemifanekiso emininzi unokuzalisa
        inxalenye enkulu yeringi, kwaye ilandelayo incinci.</li>
      <li>Ukuba ukufaka akuphumelelanga, iringi iyavalwa kwaye umyalezo
        uyakuxela oko, ngaphandle kokulayisha kwakhona iphepha.</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 'Onke amaphepha ngoku alingana nefestile akuyo'
  - type: enhancement
    label: 'Iphepha lomdlalo libonisa amanye amagama kwikhadi lawo, kunye neqhosha elithi Incwadana Yomyalelo'
  body: |
    <ul>
      <li><strong>Onke amaphepha ngoku alingana nefestile akuyo.</strong> Amaphepha
        anamakhadi (Iisistim, iMyuziyam, Iithegi, Uluhlu, Izixhobo zeROM, iindebe
        neempumelelo) ongeza ikholamu nanini na xa elinye ikhadi elipheleleyo
        lingena, ukuya kutsho kwamane emqolo. Iitheyibhile, izixhobo namaphepha
        eenkcukacha ayanaba kancinci, kodwa ayayeka apho ukwanda ngakumbi
        bekuya kusasaza iikholamu zawo kuphela. Iisethingi zigcina iibhokisi
        zazo zinobubanzi obufundekayo.</li>
      <li><strong>Uncedo ne-changelog zigcina imigca enobude
        obuthuthuzelayo.</strong> Kwifestile ebanzi, amakhonkco amacandelo
        oNcedo asiwa kwikholamu esecaleni kombhalo; kwifestile emxinwa ahlala
        kumqolo omnye onokuwutyibilizisa, endaweni yebhloko eyayigubungela
        inxalenye enkulu yesikrini sefowuni.</li>
      <li><strong>Iphepha lomdlalo:</strong> kwifestile ebanzi, imifanekiso
        yesikrini ihamba ngaphezulu, ize ividiyo nekhadi elitsha elithi
        <strong>Ikwaziwa ngokuba</strong> zibe ecaleni komnye ngezantsi,
        zilingana nekhava. Amanye amagama ayengumbhalo ofiphele phantsi
        kwesihloko; ngoku akwikhadi elifundeka lula. <strong>Incwadana
        Yomyalelo</strong> ngoku liqhosha ecaleni kwe-Dlala, kwaye i-Imbali
        Yokukhupha iqala isongiwe.</li>
      <li>Iindebe zePSN zibonisa ikholamu enye ukuya kwezine ngokwefestile
        endaweni yezintathu ngalo lonke ixesha.</li>
      <li>Amaphepha aliqela akasatyibiliki ecaleni kwifowuni: Iindebe, Iindebe
        Zomqokeleli, iphepha lesistim ye-RetroAchievements, Uncedo, Iisethingi,
        Uhlalutyo, Ukungeniswa Kwemidlalo kunye namaphepha eenkcukacha
        zeempumelelo neendebe. Iitheyibhile ezibanzi ngoku zityibilika
        ngaphakathi kuzo apho.</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 'Ithala, amaphepha esistim nephepha lomdlalo ngoku alingana nefestile akuyo'
  body: |
    <ul>
      <li><strong>Amaphepha asebenzisa ifestile ebanzi xa iluncedo, kwaye
        kuphela ngelo xesha.</strong> Ithala nalo lonke iphepha lesistim
        zongeza ikholamu yamakhadi emidlalo nanini na xa elinye ikhadi
        elipheleleyo lingena, ukuya kutsho kwamane emqolo. Ifowuni ibonisa
        elinye, ifestile yesiqingatha sesikrini amabini okanye amathathu,
        ifestile ebanzi amane. Ngaphambili amaphepha ayeyeka kububanzi
        obumiselweyo, ashiye inxalenye enkulu yefestile enkulu ingenanto.</li>
      <li><strong>Iphepha lomdlalo libeka ikhava neenkcukacha zalo ecaleni
        kwemifanekiso yesikrini nevidiyo</strong> xa zombini zingena ecaleni
        komnye, kungenjalo zibekwa phezu komnye. Inkcazelo igcina imigca
        enobude obuthuthuzelayo.</li>
      <li><strong>Iqhosha elithi Dlala lifudukele kwikona ephezulu ngasekunene
        kwikhadi ngalinye,</strong> lincinci kwaye liphakathi. Ngoku likwajonga
        ukuba ifayile ye-ROM yomdlalo isekhona kwaye iluhlobo olwamkelwa
        yisistim yawo, ngoko libonakala kuphela apho ukulicofa kuya kuqalisa
        umdlalo. Liyafihlwa ngelixa ukhetha imidlalo ngobuninzi.</li>
      <li>Iqhosha lokubuyela phezulu neephopu-ap zenkqubela ngoku zihlala
        ecaleni komxholo wephepha endaweni yokuba kwimiphetho ekude
        yefestile.</li>
      <li>Iphepha lomdlalo alisatyibiliki ecaleni kwifowuni.</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: 'Ulwimi lovavanyo oluthi "Pseudo" lunikezelwa kubalawuli (admin) kuphela'
  body: |
    <ul>
      <li><strong>"Pseudo" alusabonakali kuluhlu lweelwimi kumntu
        wonke.</strong> Sisixhobo somphuhlisi esibonisa onke amagama
        ezibiyeleni nangoonobumba abaneempawu, ngoko ngoku lunikezelwa
        kubalawuli kuphela. Nabani na omnye obelukhethile ubona i-app
        ngesiNgesi, nesiNgesi sikhethiwe kwi-Iisethingi.</li>
    </ul>
- version: 3.24.1
  date: '2026-10-17'
  tags:
  - type: fix
    label: 'I-download ye-Windows iyafakeka kwakhona, kwaye akusekho zimpazamo zininzi emva kokutshintsha ubungakanani'
  body: |
    <ul>
      <li><strong>I-download eqhelekileyo ye-Windows ibingakwazi
        ukufakwa.</strong> Isifaki sasima ku-"Core dependencies failed to
        install", kuba uluhlu lwaso lweepakeji olutshixiweyo lwalushiya
        ngaphandle ipakeji efunwa yi-Windows yodwa. Uluhlu ngoku lugubungela
        onke amaqonga. I-download ye-Windows engafuni Python ayichaphazelekanga.</li>
      <li><strong>Imiyalezo yeempazamo yaqhubeka ivela kwikona ephezulu
        ngasekunene</strong> kwithim ye-Cyberpunk emva kokuba ifestile ye-browser
        yenziwe banzi, umzekelo ngokuyandisa ngokupheleleyo. Umva oshukumayo
        ngoku utshintsha ubungakanani ngokucocekileyo.</li>
    </ul>
- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 'Dlala umdlalo ngqo ukusuka kwiThala nakumaphepha esistim'
  body: |
    <ul>
      <li><strong>Iqhosha elithi ▶ Dlala kwikhadi ngalinye lomdlalo.</strong>
        Livela kwikona esezantsi ngasekhohlo yomfanekiso webhokisi kwiphepha
        leThala nakuwo onke amaphepha esistim. Licofe kwaye umdlalo uqala
        kwi-emulator yawo; uhlala kuluhlu endaweni yokuvula iphepha lomdlalo
        kuqala.</li>
      <li>Iqhosha libonakala kuphela apho ukulicofa kunokusebenza: i-akhawunti
        yakho ivumelekile ukuqalisa imidlalo, kwaye i-emulator yomdlalo
        ivuliwe, ifakiwe kwaye, kwi-RetroArch, ine-core yayo. Imidlalo
        ekwiisistim ezingenayo i-emulator esebenzayo ayibonisi qhosha.</li>
      <li>Ukuba ukuqalisa kusasilela, umzekelo kuba ifayile ye-ROM
        ifudusiwe, isizathu sivela kumyalezo kwaye iphepha lihlala
        linjalo.</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: 'Ibha esecaleni emfutshane, enephepha elinye leempumelelo lawo onke amaqonga'
  body: |
    <ul>
      <li><strong>Ikhonkco elinye elithi "Iimpumelelo" lithatha indawo
        yamahlanu.</strong> I-RetroAchievements, i-RPCS3, i-PSN, i-Steam ne-Xbox
        ngoku ziithebhu kwiphepha elinye, kwaye ikhonkco livula kwakhona
        ithebhu oyisebenzise ekugqibeleni. Ukuba awunayo imidlalo
        ye-RetroAchievements, livula kwithebhu ye-RPCS3 endaweni yokukubuyisela
        kwi-Dashboard.</li>
      <li><strong>Iingxelo zeROM ngoku zikwiZixhobo zeROM,</strong> njengethebhu
        ecaleni kwezinye izixhobo nekhadi kwiphepha leZixhobo zeROM.</li>
      <li><strong>Akukho makhonkco mabini kwibha esecaleni abelana nge-icon
        enye:</strong> i-Dashboard ngoku ngu-🏠 kwaye uMboni we-Log ngu-🧾.
        Ibha esecaleni inamakhonkco ali-16 endaweni yama-21.</li>
      <li>Iithebhu zezixhobo kwiphepha leesethingi zeZixhobo zeROM zazihlala
        zisesiNgesini; ngoku zilandela ulwimi lwakho.</li>
    </ul>
- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: 'Ukhangelo lwe-How Long To Beat luyasebenza kwakhona'
  body: |
    <ul>
      <li><strong>Lonke ukhangelo lwe-How Long To Beat lwalusithi umdlalo
        awufumaneki.</strong> Isayithi yafudusela ukhangelo lwayo kwidilesi
        entsha, ngoko izicelo ze-RetroDB zaliwa; oku kwaqhekeka phakathi
        kwasekupheleni kukaJulayi nasekupheleni kukaSeptemba. I-RetroDB ngoku
        isebenzisa idilesi entsha, kwaye ithumela izihluzi zeqonga nezonyaka
        ngefomathi entsha yesayithi, ebeyiqalile ukungazihoyi. Ukhangelo
        lomdlalo omnye nokhangelo ngobuninzi kwiZixhobo zeROM zombini
        ziyasebenza kwakhona.</li>
    </ul>
- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: 'I-RetroDB ngoku ithi ngokucacileyo ayixhasi ubuqhetseba (piracy)'
  - type: fix
    label: 'Ibhokisi ethi Malunga ivuleka ngobukhulu obupheleleyo kwakhona'
  body: |
    <ul>
      <li><strong>Isaziso esichasene nobuqhetseba ngoku sikwi-app.</strong>
        Sivela kwibhokisi ethi Malunga naphantsi kwe-Indlela Yethala leROM
        kwi-Iisethingi, ngazo zonke iilwimi. Sithi i-RetroDB ayisasazi
        kwaye ayigcini iifayile ze-ROM, ukuba kufuneka usebenzise kuphela
        imidlalo ekhutshelwe kwiidiski nakwiikhatriji ozinikazayo, kwaye
        i-RetroDB ayinxulumananga nawuphi na umenzi wekhonsoli, umpapashi
        okanye idatabheyisi yemidlalo. Amagama afana nalawo akwiwebhusayithi
        ye-RetroDB nakwi-trailer.</li>
      <li><strong>Ibhokisi ethi Malunga yayixinanisiwe kwibha esecaleni.</strong>
        Ngoku ivuleka embindini wesikrini ngobukhulu bayo obuqhelekileyo,
        kwaye ityibilika kwisikrini esincinci endaweni yokufihla isihloko
        sayo neqhosha lokuvala.</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: 'I-RetroDB iqalisa okanye ithiya ngokutsha kuphela kwiintlobo zeefayile ze-ROM zokwenene'
  body: |
    <ul>
      <li><strong>Umdlalo ubunokuqaliswa ngefayile engeyo-ROM.</strong>
        Ukuthiya ngokutsha i-ROM kwakwamkela naliphi na igama, ngoko
        <code>crash.bin</code> yayinokuba yi-<code>crash.cfg</code> kwaye
        i-emulator yayinikwa yona. Ukuqalisa ngoku kujonga uhlobo lwefayile
        ngokuchasene noluhlu olukwi-<code>systeminfo.txt</code> yesiqulathi
        saloo sistim, uluhlu olufanayo olusetyenziswa ekuskeneni ithala, kwaye
        ukuthiya ngokutsha kuyalwala uhlobo olungekho kolo luhlu. Ukuba
        isiqulathi sesistim asinalo uluhlu, imidlalo yaso ayiyi kuqaliswa,
        kwaye umyalezo uyayibiza ngegama ifayile engekhoyo.</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: 'Ngumlawuli (admin) kuphela onokutshintsha ii-args zokuqalisa zomdlalo'
  - type: fix
    label: 'Ii-args zokuqalisa ezinamagama aliqela, okanye uphawu lokucaphula olulahlekileyo, ngoku ziyasebenza'
  - type: fix
    label: 'I-RetroDB ayisagcini konke ukuqaliswa okugqityiweyo kwimemori'
  body: |
    <ul>
      <li><strong>Umhleli wayenokongeza ii-args zokuqalisa eziqhuba enye
        ikhowudi.</strong> I-<em>Ii-args zokuqalisa ezenziwe ngokwezicelo</em>
        zomdlalo ziya ngqo kwi-emulator, kwaye nge-RetroArch zazinokulayisha
        nayiphi na ifayile yenkqubo ekhompyutheni. Ukuzitshintsha ngoku
        kufuna indima yomlawuli (admin), kwaye intsimi ifihliwe kubo bonke
        abanye.</li>
      <li><strong>Ii-args zokuqalisa ezinegama elingaphezu kwelinye zazifika
        kwi-emulator njengenye.</strong> <code>--a --b</code> ngoku ifika
        njengee-args ezimbini, kwaye ixabiso elingenanto alongezi nto. Uphawu
        lokucaphula lokuvala olungekhoyo lwaluqhekeza konke ukuqaliswa kwaloo
        mdlalo ngempazamo yeseva; ngoku lubonisa umyalezo obiza ngegama
        intsimi ekufuneka ilungiswe. Ithokheni ethi
        <code>{disc_paths}</code> isusiwe: yayihlala ingenanto.</li>
      <li><strong>Ukuqaliswa okugqityiweyo kwakuqokelelana kwimemori de
        i-RetroDB iqaliswe kwakhona.</strong> Ukuqaliswa okuphele ngaphezu
        kweyure edlulileyo ngoku kuyasuswa.</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: 'Ukukhetha ulwimi kwi-Iisethingi kuyasebenza kwakhona'
  body: |
    <ul>
      <li><strong>Ukukhetha ulwimi phantsi kwe-Iisethingi &rarr; Ithala &rarr;
        Umboniso kwakungenzi nto.</strong> Kwakubonisa impazamo endaweni
        yoko, kwaye iphepha lahlala ngolwimi lwalo oludala. Oku kwaqhekeka
        ku-3.23.8. Ukukhetha ulwimi ngoku kuyalugcina kwaye kulayishe kwakhona
        iphepha ngolo lwimi.</li>
    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: 'Ii-icon zeendebe nezamaqonga zibuyile kwi-download'
  body: |
    <ul>
      <li><strong>I-download yayingenazo ii-icon zeendebe nezamaqonga
        ze-RetroDB.</strong> Lonke ikhadi lomdlalo eline-RetroAchievements
        labonisa umfanekiso owaphukileyo apho ibheji yalo ifanele ibe khona,
        kwaye amanqanaba eendebe kunye neelogo ze-PSN, Steam, Xbox ne-RPCS3
        nazo zazingekho. Ngoku ziza nazo zonke ii-download.</li>
    </ul>
- version: 3.23.14
  date: '2026-10-10'
  tags:
  - type: security
    label: 'Iilayibrari ezimbini eziza nayo zihlaziyiwe ngenxa yolungiso lokhuseleko olupapashiweyo'
  body: |
    <ul>
      <li><strong>I-urllib3 ne-Werkzeug zazineengxaki zokhuseleko
        ezaziwayo.</strong> I-RetroDB ngoku iza ne-urllib3 2.8.0 ne-Werkzeug
        3.1.9, iinguqulelo ezizilungisayo. Ufakelo lwekhowudi yomthombo
        luzifumana ngokuqhuba i-<code>install.py</code> kwakhona, efaka
        ukusuka ku-<code>requirements.lock</code>.</li>
    </ul>
- version: 3.23.13
  date: '2026-09-26'
  tags:
  - type: fix
    label: 'Imidiya egcinwe njengendlela yesiqulathi ayisaxelwa ukuba ayikho'
  body: |
    <ul>
      <li><strong>Kwi-build ezimeleyo (standalone), "clear missing media
        references" yayinokucima imidiya ebikhona ngokwenene.</strong> Oku
        kwenzeka xa idatabheyisi igcina imidiya njengendlela yesiqulathi
        efana ne-<code>images/boxart/…</code> endaweni yegama lefayile
        kuphela. I-RetroDB ngoku iyikhangela kwisiqulathi esichanekileyo.</li>
    </ul>
- version: 3.23.12
  date: '2026-09-26'
  tags:
  - type: fix
    label: 'I-Dashboard ibonisa ukukhupha ngobuninzi okuqhubekayo, kunye nolungiso oluncinci olune'
  body: |
    <ul>
      <li><strong>Ikhadi lenkqubela yokukhupha kwi-Dashboard alizange livele.</strong>
        Ngoku liyabonakala ngelixa kuqhuba ukukhupha ngobuninzi, kwaye lithi
        xa kunqunyanyisiwe.</li>
      <li><strong>Akusekho zimpazamo kwi-console ye-browser kwiphepha
        lokungena.</strong> Liyekile ukujonga imisebenzi yangasemva phambi
        kokuba nabani na angene.</li>
      <li><strong>Umncedi wokuseta akasathi "Setup complete!" xa ukugcina
        kusilele.</strong> Ngoku ukuxelela ukuba iisethingi azikwazanga
        ukugcinwa.</li>
      <li><strong>Ukukhupha ngobuninzi okubini okuqaliswe kwisekhondi enye
        akusabelani nge-id enye</strong>, ngoko izenzo zomgca ezifana
        nokurhoxisa zisebenza kokuchanekileyo.</li>
    </ul>
- version: 3.23.11
  date: '2026-09-26'
  tags:
  - type: ui
    label: 'Amaqhosha eminikelo ngoku athi axhasa ntoni'
  body: |
    <ul>
      <li><strong>Amagama eminikelo acacileyo.</strong> Amaqhosha aphezulu
        ngoku athi "Sponsor RetroDB" kunye no-"Support RetroDB". I-README
        ithi yonke inguqulelo ekhutshwayo isimahla, kwaye iminikelo ixhasa
        i-RetroDB ngokwayo, hayi ii-emulator nee-core enokuziqalisa.</li>
    </ul>
- version: 3.23.10
  date: '2026-09-26'
  tags:
  - type: fix
    label: 'Amaphepha eZixhobo zeROM alandela iisethingi zakho ezigciniweyo, kwaye amaphepha e-Logs neZixhobo zeROM ayasebenza kwakhona'
  body: |
    <ul>
      <li><strong>Iphepha le-Logs namanye amaphepha eZixhobo zeROM
        ayephukile.</strong> Iskripthi kula maphepha sasisilela xa silayisha,
        ngoko umboni we-log nezixhobo-ncedisi ekwabelwana ngazo zeZixhobo
        zeROM azizange ziqale. Ngoku ziyalayisha kakuhle.</li>
      <li><strong>Iisethingi zeZixhobo zeROM ngoku zenza into.</strong>
        UMfumani Weziphindaphindiweyo noMguquli weCHD bavuleka nezinketho
        zabo zisetwe ukusuka kwiphepha leesethingi zeZixhobo zeROM, kwaye
        usenokuzitshintsha kumsebenzi omnye.</li>
      <li><strong>Ii-switch zoMguquli weCHD zazingahoywa.</strong> Ukucima
        u-"Cima iifayile zoqobo" kwiphepha akuzange kumise ukucima ukuba
        isethingi yakho egciniweyo ithi makucinywe. Ii-switch ezikwiphepha
        ngoku zezona zigqibayo.</li>
      <li><strong>Isethingi ethi Temporary Path iyasetyenziswa.</strong>
        Iifayile ezilungiselelwa ngexesha lokwakha uluhlu lokudlala lwe-M3U
        ngoku ziya ngaphakathi kuyo.</li>
    </ul>
- version: 3.23.9
  date: '2026-09-26'
  tags:
  - type: security
    label: 'Iifayile ze-log ze-scraper azisagcini amagama ayimfihlo neethokheni, kwaye iinzame zokungena zinomda kwakhona'
  - type: fix
    label: 'Ukugcina iisethingi akusazicimi iisethingi zakho, kwaye ukucima umsebenzisi kuyasebenza'
  body: |
    <ul>
      <li><strong>Iifayile ze-log zazigcina iimfihlo ngombhalo ocacileyo.</strong>
        Iifayile ze-log ze-scraper zazimele zifihle iithokheni zokungena
        nezitshixo ze-API, kodwa inyathelo lokufihla alizange liqhube, ngoko
        zabhalwa zipheleleyo. Ngoku ziyafihlwa. Iifayile ze-log ezindala
        zisenazo; cima iifayile ezindala kwi-<code>logs/</code> ukuba
        wabelana ngofakelo lwakho.</li>
      <li><strong>Imida yeenzame zokungena yayingasebenzi.</strong> Imida
        yokungena okuphindaphindiweyo neyezenzo ezinzima (ukuskena, ukukhupha,
        ukungenisa) yayisetiwe kodwa ingazange ivulwe. Ngoku iyasebenza,
        kwaye isicelo esivaliweyo sifumana umyalezo ocacileyo othi "iinzame
        ezininzi kakhulu".</li>
      <li><strong>Ifayile yeesethingi eyonakeleyo yayinokucinywa.</strong>
        Ukuba i-<code>data/settings.json</code> yayingafundeki, ukugcina
        okulandelayo kwayithatha indawo ngezimiselo ezisisiseko. I-RetroDB
        ngoku igcina ifayile eyonakeleyo njenge-<code>settings.json.corrupt-&lt;time&gt;</code>
        phambi kokugcina. Ukuba ifayile iphinda ifundeka kakuhle, ukugcina
        kuyaliwa endaweni yoko.</li>
      <li><strong>Umqolo wokuthiya we-Injini wawulahla ezinye
        iisethingi.</strong> Ukongeza ithegi kumqolo we-Injini kwiisethingi
        zokuthiya kwakusilela, kwaye kwakulahla neesethingi zesihlomelo
        (article) nezommandla ezigcinwe kunye nawo. Ngoku uyagcina
        kakuhle.</li>
      <li><strong>Ukucima umsebenzisi kwakusilela.</strong> Umsebenzisi
        oneethegi, uluhlu, izinto zoLuhlu Lweminqweno okanye idatha ye-PSN
        wayengenakucinywa. Ukucima ngoku kususa umsebenzisi nayo yonke into
        ayinikazayo.</li>
      <li><strong>Ukukhupha okubini kwakunokuqhuba ngaxeshanye.</strong>
        Ukutshintshanisa okanye ukufudusa ukukhupha ngobuninzi okuqhubekayo
        kumgca kwaqalisa ukukhupha okubini okwabelana ngobalo olunye
        lwenkqubela. Ngoku kuqhuba okukodwa.</li>
      <li><strong>Inkqubela yokukhupha ngobuninzi yayinokubonakala ngathi
        yimpazamo.</strong> Phambi kwempumelelo yako yokuqala, ukukhupha
        ngobuninzi kwakuxela imeko yako ngendlela ezinye izikrini ezayifunda
        njengokusilela. Oko kulungisiwe.</li>
      <li><strong>Ukungena ngoku kukubuyisela kwiphepha obulicelile.</strong>
        Kwakusoloko kuya kwi-Dashboard.</li>
      <li><strong>Izenzo zeefayile zomlawuli zihlala ngaphakathi kwiziqulathi
        zakho.</strong> Isixhobo sokutshintsha ubungakanani bemifanekiso
        nezenzo zokuthiya ngokutsha ii-ROM ngoku ziyala nantoni na engaphandle
        kwesiqulathi sakho semidiya okanye sesiqulathi se-ROM.</li>
      <li><strong>Iifayile ezindala zokungena ze-PSN ne-Xbox zifuduselwa
        kwi-akhawunti yakho.</strong> I-<code>data/psn_tokens.json</code>
        okanye i-<code>data/xbox_tokens.json</code> eseleyo ilayishwa
        kwi-akhawunti yakho kwaye ithiywa ngokutsha ukuze iphele
        ngo-<code>.migrated-015</code>. Loo fayile isenayo ithokheni, ngoko
        yicime wakuba uqinisekisile ukuba ukungena kuyasebenza.</li>
      <li><strong>Iimpazamo ezicacileyo ezivela kwiseva.</strong> Isicelo
        esingalunganga ngoku siphendulwa ngomyalezo wempazamo ofanelekileyo
        endaweni ka-"An internal error occurred".</li>
    </ul>
- version: 3.23.8
  date: '2026-09-25'
  tags:
  - type: fix
    label: 'Ukungenisa kwe-CLZ kuyasebenza kwakhona, iikhava zoluhlu ziyabonakala, kwaye amaphepha aliqela akasaphuki ngenxa ye-apostrophe'
  - type: security
    label: 'Amagama akhutshiweyo neendlela zeefayile azisakwazi ukuphuma emaqhosheni ephepha'
  body: |
    <ul>
      <li><strong>Ukungenisa kwe-CLZ kwakungenzi nto.</strong> Ukulayisha
        i-PDF ye-CLZ kwayithumela kwidilesi engekhoyo kwiseva, ngoko konke
        ukulayisha kwasilela ngo-"Parse failed". Ngoku ifika kwisihlalutyi.</li>
      <li><strong>Zonke iikhava kwiphepha loluhlu zazingekho.</strong> Iphepha
        loluhlu lalicela ikhava nganye kwidilesi engalunganga, kwaye ikholamu
        yeSistim yayihlala ingenanto. Zombini ngoku ziyabonakala. Imifanekiso
        yeekhava kukhangelo lwephepha oluthi "yongeza umdlalo" nayo
        ilungisiwe.</li>
      <li><strong>Amaqhosha aphuka kumagama ane-apostrophe.</strong> Ukususa
        u-"Assassin's Creed" kuluhlu, ukucima umfanekiso wesikrini, ukusondeza
        ikhava okanye ukususa ithegi yohlobo kwakunokungenzi nto ngokuthe
        cwaka xa igama line-apostrophe. Kwayona loo mpazamo yavumela igama
        elikhutshiweyo elenziwe ngobuqhophololo ukuba liqhube ikhowudi
        kwiphepha. Amagama ngoku ahamba ukuya kula maqhosha ngendlela
        engenakufundwa ngempazamo njengekhowudi.</li>
      <li><strong>Iidilesi zemifanekiso nezamakhonkco zikhuselwe (escaped)
        kuyo yonke indawo.</strong> Amaphepha ambalwa ayakha iidilesi
        zemifanekiso ukusuka kumagama eefayile akhutshiweyo ngaphandle
        kokuzikhusela, kwaye amaphepha amahlanu ayephethe ikopi yawo
        ebuthathaka yesixhobo-ncedisi sokukhusela. Ngoku onke asebenzisa
        leyo kwabelwana ngayo.</li>
      <li><strong>Iphepha le-Iisethingi lalinokuvuleka lingenanto.</strong>
        Ukuba ithebhu obuyisebenzise ekugqibeleni yathiywa ngokutsha
        luhlaziyo, i-Iisethingi yavuleka kungabonakali phaneli. Ngoku
        ayihoyi ithebhu engasekhoyo. Amakhonkco afana
        ne-<code>/settings#account</code> avula loo thebhu kwakhona.</li>
      <li><strong>Ithim yakho ngoku ikulandela kwezinye izixhobo.</strong>
        Ithim oyikhethayo igcinwa kwi-akhawunti yakho. I-browser engazange
        ixelelwe ithim isebenzisa leyo uyigcinileyo endaweni yesiseko.</li>
      <li><strong>Iiphopu-ap zenkqubela yemisebenzi zibonisa i-icon
        echanekileyo.</strong> Imisebenzi enqunyanyisiweyo, egqityiweyo
        neselundini yayibonisa i-icon efanayo ethi "iyaqhuba". Imeko nganye
        ngoku ineyayo, kwithim nganye.</li>
      <li><strong>Uluhlu lwezinqumlo zekhibhodi ngoku lunokuguqulelwa.</strong>
        Iilebheli zalo zazingabonakali kwizixhobo zoguqulelo, ngoko zahlala
        zisesiNgesini kuzo zonke iilwimi.</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: 'Ukulinganiswa ngokweminyaka kwakuhlala kungalunganga, kwaye imidlalo ekhutshiweyo yayinokulahla iinkcukacha zayo'
  body: |
    <ul>
      <li><strong>Ukulinganiswa ngokweminyaka kwakuhlala kungalunganga, kwaye
        impazamo yayisasazeka.</strong> Xa ulinganiso luvela kwi-TheGamesDB,
        i-app yayikhangela ikhowudi yolinganiso naphi na ngaphakathi kombhalo
        endaweni yokuyifunda kakuhle &mdash; ngoko "T - Teen", "M - Mature
        17+", "AO - Adults Only 18+" kunye no-"RP - Rating Pending" zonke
        zagcinwa njengolinganiso olungalunganga, kwaye umdlalo we-Mature
        wawunokufakwa njengofanelekile kuwo wonke umntu. Okubi ngakumbi, olo
        linganiso lungalunganga lwalusetyenziswa ukuzalisa ezinye iinkqubo
        zolinganiso ezisibhozo, ngoko ukufunda okunye okungalunganga
        kwasasazeka kuzo zonke. Ulinganiso ngoku lufundwa kwikhowudi
        esekuqaleni kombhalo.</li>
      <li><strong>Ulinganiso oluguqulweyo lwaluphuma luthambile
        kakhulu.</strong> Xa kuzaliswa ulinganiso olungekhoyo ukusuka kolo
        ubusele unalo, i-app yayinokusebenzisa ulinganiso eyayisandula
        ukulubala kwimizuzwana ngaphambili endaweni yolo ubuqale ngalo
        ngokwenene. Inyathelo ngalinye lalinciphisa ubungqongqo kancinci.
        Ngoku ihlala iguqula ukusuka kulinganiso umdlalo onalo ngokwenene.</li>
      <li><strong>Ukukhupha Kwakhona Okupheleleyo kwacima uMmandla noHlobo
        Lokugcina olukhethwe ngesandla.</strong> Akukho nanye kwezo evela
        kwi-scraper &mdash; i-app iyazibala &mdash; ngoko Ukukhupha Kwakhona
        Okupheleleyo kwakuthatha indawo ka-"Japan" wakho okhethiweyo
        ngesiseko u-"USA". Amaxabiso akho ngoku ayagcinwa ngaphandle kokuba
        umthombo unikezela elitsha ngokwenene.</li>
      <li><strong>I-scraper yayinokwamkela umdlalo ongalunganga.</strong>
        Iziphumo ze-ScreenScraper zidla ngokujongwa ngokuchasene namanqaku
        okufana phambi kokusetyenziswa, kodwa ukhangelo olubuyisa isiphumo
        esinye kuphela lwalutsiba olo hlolo ngokupheleleyo. Ngoku sonke
        isiphumo siyafumana amanqaku.</li>
      <li><strong>Umdlalo wawunokulahla zonke iinkcukacha zawo ezikhutshiweyo
        ngenxa yentsimi enye engekhoyo.</strong> Ukuba i-IGDB okanye
        i-ScreenScraper ishiye intsimi enye ingenanto ngendlela
        engalindelekanga, lonke uhlaziyo lwalulahlwa &mdash; umpapashi,
        umphuhlisi, imifanekiso nayo yonke into. Ezo meko ngoku ziyaphathwa
        kwaye ezinye iinkcukacha ziyagcinwa.</li>
      <li><strong>Umfanekiso osileleyo wawunokubhalwa njengempumelelo.</strong>
        Ukuba umfanekiso okhutshelweyo ufumaniseke ungengowo umfanekiso
        osebenzisekayo, i-app ayizange icime nto kwaye yaligcina igama
        lefayile, ishiya isalathiso esophukileyo. Ifayile ngoku iyasuswa
        kwaye intsimi ishiywa injalo.</li>
      <li><strong>Iimowudi zemidlalo ngoku zisebenzisa amagama
        afanayo.</strong> Ii-scraper ezahlukeneyo zabhala "Single-player"
        kunye no-"Single-Player" kunye no-"Multiplayer" nje ongeyiyo enye
        yeelebheli ze-app ngokwayo, ngoko loo midlalo yayingenakuguqulelwa
        okanye ifaniswe sisihluzi se-Iimowudi. Yonke imithombo ngoku ibhala
        iilebheli ezifanayo. Imidlalo esele ikhoyo igcina amagama ayo amadala
        de uyikhuphe kwakhona okanye uqhube isixhobo sokulungelelanisa
        kwi-Iisethingi.</li>
      <li><strong>Ukhangelo lwe-Xbox ngoku luziphatha njengayo yonke eminye
        imithombo.</strong> Lwalusenza izicelo zalo zewebhu, ngoko
        lwalungaphindi luzame xa i-Xbox Live ilucela ukuba lucothise, kwaye
        kwakungekho mda wobungakanani bedatha impendulo enokuyitsala. Ngoku
        lusebenzisa uqhagamshelo olufanayo ekwabelwana ngalo nezinye
        ii-scraper.</li>
      <li><strong>Ikhowudi ye-ScreenScraper engasetyenziswayo isusiwe.</strong>
        Imisebenzi emibini engazange ibizwe nayinto kwi-app icinyiwe. Omnye
        wayo wawubuyisa idilesi yewebhu enegama lakho eliyimfihlo
        le-ScreenScraper lisekuyo, nto leyo eyayiya kunika igama eliyimfihlo
        nantoni na eyayisebenzisayo. I-"System Media Endpoint" edweliswe
        kumanqaku okhupho e-3.6.x yayingomnye wale &mdash; yayingazange
        ifikeleleke naphi na kwi-app.</li>
    </ul>
- version: 3.23.5
  date: '2026-09-02'
  tags:
  - type: fix
    label: 'I-download epakishiweyo yayingakwazi ukuqala, kunye nolunye ulungiso lokwakha'
  body: |
    <ul>
      <li><strong>I-download ye-Standalone yayingakwazi ukuqala konke
        konke.</strong> I-build epakishiweyo iphethe i-Python yayo, kodwa
        i-launcher engaphakathi kuyo yayiyileyo ibhalelwe ufakelo lwekhowudi
        yomthombo &mdash; yayikhangela iifayile ze-Python ezingekhoyo kwi-build
        epakishiweyo, yaza yema kumgca wokuqala. I-bundle ngoku iza
        ne-launcher yayo, eqhuba nje i-app ize ivule i-browser yakho xa iseva
        sele iqalile.</li>
      <li><strong>Isinqumlo se-desktop kwi-download ye-Linux sasingaqalisi
        nto.</strong> Sasiza nombhalo wendawo-mbambeli apho indlela eya
        kwi-app ifanele ibe khona. Ngoku kukho i-<code>install-launcher.sh</code>
        ecaleni kwe-launcher &mdash; yiqhube kanye kwaye isinqumlo sibhalwa
        nendlela yokwenene eya naphi na apho uyivulele khona.</li>
      <li><strong>Ukuqala ukusuka kwikhowudi yomthombo kwafaka izinto
        ezixhomekeke kuzo ezingaqinisekiswanga.</strong> Xa i-Flask ingekho,
        iskripthi sokuqalisa sasilanda iipakeji ngqo kwi-intanethi ngaphandle
        kokujonga i-checksum, kwaye sasidlula ngenkani umphathi weepakeji
        wesistim yakho endleleni. Ngoku sinikezela ku-<code>install.py</code>,
        esebenzisa ifayile yokutshixa ene-checksum.</li>
      <li><strong>I-download yekhowudi yomthombo yayiphethe iifayile zomgcini
        ebingafanelanga ukuziphatha.</strong> Uluhlu lwento ekufuneka
        ishiywe ngaphandle lwalugcinwa ngesandla kwaye lwalusele lusalela
        ngasemva, ngoko iziphumo zophicotho neefolda ze-build ezaseleyo
        zazipakishwa kunye ne-app. I-download ngoku yakhiwa ukusuka kuluhlu
        lweefayile ezikhoyo ngokwenene kwiprojekthi, olungenakutenxa.</li>
      <li><strong>Iiphaneli ezimbini ze-Iisethingi zaphuka kwi-build
        epakishiweyo.</strong> Iiphaneli zamanani ethala nezemeko ye-API
        zazikhangela inkqubo engundoqo ngegama engenalo ngaphakathi kwi-build
        epakishiweyo, ngoko zombini zasilela.</li>
      <li><strong>Omnye umbhalo wesikrini wawungenakuze uguqulelwe.</strong>
        Iindawo ezintathu ezintsha ze-app &mdash; iisethingi ze-emulator,
        iqhosha lokuqalisa nebha ethi "idlala ngoku" &mdash; zatsitywa
        kuskeno loguqulelo, kwaye uhlolo olwalumele lukubambe oko lwalujonga
        kuluhlu olufanayo olungaphelelanga. Uskeno ngoku lugubungela yonke
        ifayile ngokuzenzekelayo, kwaye umbhalo wazo wongezwe
        kwiinguqulelo.</li>
      <li><strong>Ukwakha kwakhona iinguqulelo kwakunokungenzi nto ngokuthe
        cwaka.</strong> Ukongeza umbhalo kwiskripthi sephepha elithile
        kwashiya ukwakha kwakhona kuqinisekile ukuba akukho nto ekufuneka
        yenziwe, ngoko umbhalo omtsha awuzange ufike kwifayile
        yoguqulelo.</li>
      <li><strong>Isisombululo sexeshana sekhadi lemizobo sasetyenziswa kuwo
        wonke umntu.</strong> Iskripthi sokuqalisa se-Linux sanyanzela
        isethingi eyenzelwe ikhadi elinye elithile le-AMD kuyo yonke
        imatshini, nto leyo eyayinokubambisa isikhulisi-mfanekiso kwezinye
        izixhobo ze-AMD. Ngoku isebenza kuphela xa elo khadi likhona
        ngokwenene, kwaye ayisoze ibhale ngaphezulu ixabiso olisete wena
        ngokwakho.</li>
      <li><strong>Iskripthi sokukhupha inguqulelo sasinokupapasha inguqulelo
        engalunganga.</strong> Ithegi eseleyo yenzame yangaphambili yaphinda
        yasetyenziswa ngokuthe cwaka, ngoko i-build yayinokwenziwa ukusuka
        kwimeko endala ngelixa ixela impumelelo.</li>
    </ul>
- version: 3.23.4
  date: '2026-09-02'
  tags:
  - type: fix
    label: 'Iindlela ezilithoba ithala lakho elalinokulahla ngazo idatha, zivaliwe'
  body: |
    <ul>
      <li><strong>"Clear scraped data" yacima ithala lakho lonke.</strong>
        Ibhokisi yokuqinisekisa yayibala kuphela imidlalo eyayikhutshiwe
        ngokwenene, emva koko isenzo sacima yonke imidlalo nokuba kunjalo
        &mdash; ngoko sasinokuthembisa ishumi elinambini size sicime amawaka.
        Xa imifanekiso ivuliwe sasicima nemifanekiso yeekhava oyilayishe
        ngesandla size sibuyisele izihloko obuzihlele ngokwakho, kwimidlalo
        ebingazange ikhutshwe konke konke. Ngoku senza kanye oko ibhokisi
        ikuthethayo.</li>
      <li><strong>Umfanekiso webhokisi we-3D washiya ikhonkco
        elophukileyo.</strong> Ukucima kunye nemifanekiso kwacima ikhava ye-3D
        kwidiski kodwa kwagcina idatabheyisi isalathe kuyo, ngoko i-app
        yayikhangela ifayile engasekhoyo.</li>
      <li><strong>I-switch ethi "Yongeza" ku-Uhlelo Oluninzi yayithatha indawo
        endaweni yokongeza.</strong> Kwi-Perspective nakwi-Dimension yayisenza
        okuchasene ngqo nelebheli yayo, ibhala ngaphezulu amaxabiso akhoyo
        kuyo yonke imidlalo ekhethiweyo ngaxeshanye, kungekho kubuyisela.</li>
      <li><strong>Ii-build ezimeleyo zazinokucima zonke izalathiso zemifanekiso
        ngocofo olunye.</strong> Kwi-download epakishiweyo i-app yayikhangela
        imidiya yakho kwindawo engalunganga, yagqiba kwelokuba wonke umfanekiso
        awukho, kwaye "clear missing media references" emva koko yasusa
        imifanekiso, imifanekiso yesikrini, ividiyo neencwadana zomyalelo
        kulo lonke ithala. Uhlolo lokhuseleko olukhoyo ukuze lubambe kanye
        oku aluzange lukwazi ukukubona. Kwachaphazeleka kuphela i-build
        epakishiweyo.</li>
      <li><strong>Ukutshayela iifayile ezinkedama kwakunokucima imifanekiso
        njengoko ifika.</strong> Ikhava ekhutshelwe ngelixa ukutshayela
        kuqhuba yayinokuthathwa njengefayile enkedama isuswe.</li>
      <li><strong>Ukwenza uluhlu lokudlala kwafudusa oovimba bakho ngaphandle
        kokubuza.</strong> Ukwenza uluhlu lokudlala lwe-M3U ngeqela kwafudusa
        iifayile zakho zoovimba zoqobo nokuba ubushiye olo khetho lucinyiwe
        &mdash; kwaye xa ubulucelile, kwaxela ukusilela kokufudusa
        okwakusebenzile.</li>
      <li><strong>Isixhobo sokutshintsha ubungakanani bemifanekiso sasidumbisa
        isiqulathi sakho semidiya.</strong> Sasiphatha ii-thumbnail ezincinci
        esizenzayo njengemifanekiso emitsha ekufuneka yandiswe, sizikhulisele
        kubungakanani obupheleleyo size senze ii-thumbnail zazo. Umsebenzi
        ngamnye wongeza iifayile ezininzi, amaphepha ngokuthe cwaka anika
        imifanekiso yobungakanani obupheleleyo endaweni yee-thumbnail, kwaye
        isikhulisi se-AI sasebenza kwiifayile eziphindwe kathathu malunga
        nenani ebelijoliswe kulo.</li>
      <li><strong>Ukuzalisa nge-AI kwabhala ngaphezulu iinkcukacha
        obuzilungisile.</strong> Ekukhupheni okuqhelekileyo kwakunokuthatha
        indawo yompapashi, umphuhlisi, uhlobo, ukulinganiswa ngokweminyaka
        nokunye obukufake ngokwakho. Ngoku kuzalisa izithuba
        ezingenanto kuphela; iqhosha elithi Ukuzalisa nge-AI olicofa ngokwakho
        alitshintshanga.</li>
      <li><strong>Ukukhupha okuphindaphindiweyo kwakunokucima umfanekiso
        wesikrini olungileyo.</strong> Imidlalo ekhutshwe kwi-RAWG yaphinda
        yasebenzisa amagama eefayile afanayo, ngoko ukukhupha kwesibini
        kwabhala ngaphezulu umfanekiso wesikrini ogciniweyo, emva koko kwawususa
        njengophindiweyo ngelixa ithala lisawudwelisa.</li>
    </ul>
- version: 3.23.3
  date: '2026-09-01'
  tags:
  - type: fix
    label: 'Iindima zekhaya ngoku zenza kanye oko zikuthethayo, kwaye i-akhawunti eyekisiweyo ivalelwe ngaphandle ngokwenene'
  body: |
    <ul>
      <li><strong>Ukwekisa umntu ngoku kuphelisa iseshoni yakhe.</strong>
        Ukucima i-akhawunti kwakuyifihla kuzo zonke izikrini, kodwa nabani na
        owayesele engene kuloo akhawunti waqhubeka esebenza ngokuqhelekileyo
        ukuya kutsho kwiveki. Ukwekisa kuphela kwendlela yokuvalela umntu
        ngaphandle ngaphandle kokumcima, ngoko ngoku kusebenza kanye
        ekucofeni kwakhe okulandelayo.</li>
      <li><strong>Ii-akhawunti zokufunda kuphela azisakwazi ukutshintsha
        idatha yomdlalo.</strong> Izenzo ezintathu ze-"how long to beat"
        zazivulelekile kuye wonke umntu ongenileyo, kubandakanya abo bajonga
        kuphela &mdash; ngoko i-akhawunti yokufunda kuphela yayinokubhala
        ngaphezulu ixesha lokudlala, okanye ilicime kuyo yonke imidlalo
        esethaleni. Ngoku zifuna amalungelo okuhlela, njengazo zonke ezinye
        izenzo ezitshintsha umdlalo.</li>
      <li><strong>Umkhondo weendebe uyasebenza kuwo wonke umntu kwakhona.</strong>
        Ukuhlaziya iindebe zakho zomqokeleli kwakufuna amalungelo omhleli,
        angenawo iindima ze-Player ne-Viewer &mdash; kwaye yiyo kuphela into
        ebhala ezo ndebe. Ezo akhawunti zazingasoze zifumane nenye, kwaye
        iqhosha elithi Hlaziya lalibonisa nje impazamo. Yinkqubela yakho,
        ngoko ngoku ayifuni malungelo akhethekileyo konke konke.</li>
      <li><strong>Uhlaziyo lwe-PlayStation lomntu omnye alusenakumiswa
        ngomnye umntu.</strong> Nayiphi na i-akhawunti engenileyo yayinokunqumamisa
        okanye irhoxise uhlaziyo oluqaliswe ngomnye umntu, kwaye yayinokubona
        ukuba loo mntu ukuwuphi umdlalo. Zombini ngoku zivumeleke kuphela
        kulowo waluqalayo.</li>
      <li><strong>Ukungeniswa kwe-Steam kusebenzisa i-akhawunti yakho, hayi
        eyalowo wagcina eyakhe kuqala.</strong> Ukungeniswa kwethala kwakufunda
        ikopi enye ekwabelwana ngayo yeenkcukacha zokungena ze-Steam endaweni
        yezakho, ngoko kwakunokulanda ithala lomnye umntu &mdash; ngelixa
        iinkcukacha zakho ezigciniweyo zibonakala ngathi azikho.</li>
      <li><strong>Ukuqikelela igama eliyimfihlo lomlawuli kunzima kwakhona.</strong>
        Umda weenzame zokungena ezisileleyo wawabelwana ngabo bonke
        abakwinethiwekhi, ngoko nabani na one-akhawunti yakhe wayenokuwucima
        ngokungena aze aqhubeke eqikelela ngonaphakade. Umda ngoku ngowe-akhawunti
        nganye.</li>
      <li><strong>Iimpazamo ezivela kwi-app ngoku zifika kwiphepha endaweni
        yokunyamalala.</strong> Xa isenzo saliwa, ezili-115 zazo zaphendula
        ngendlela iphepha elingakwaziyo ukuyifunda, ngoko kwakubonakala ngathi
        isenzo sisebenzile. Ngoku zixela ukwala ngokufanelekileyo, kwaye ubona
        umyalezo wokwenene.</li>
    </ul>
- version: 3.23.2
  date: '2026-08-06'
  tags:
  - type: fix
    label: 'Amaphepha eesethingi ze-scraper alayisha ngokukhawuleza kwaye akaze abonise isitshixo se-API esidala'
  body: |
    <ul>
      <li><strong>Amaphepha e-Iisethingi ne-Scraper Config ayeka ukuphinda
        afunde ifayile yeesethingi ze-scraper kwisicelo ngasinye.</strong>
        Iindawo ezine zazivula zize ziphinde ziyihlalutye ukusuka kwidiski
        qho xa iphepha okanye uhlolo luqhuba, nangona isifundi ekwabelwana
        ngaso esigcinwe kwi-cache sasele sikhona. Ngoku zonke ziyasisebenzisa,
        ngoko loo maphepha enza umsebenzi omncinci kutyelelo ngalunye.</li>
      <li><strong>Ukugcina kusasebenza ngoko nangoko.</strong> I-cache elibala
        ngexesha ibinokukubonisa amaxabiso amadala ukuya kutsho kwisiqingatha
        somzuzu emva kokugcina. Konke ukugcina ngoku kucoca i-cache njengoko
        kubhala, ngoko oko ukubonayo koko usandula ukukugcina.</li>
      <li><strong>Izitshixo zakho zokwenene ze-API azisakwazi ukuthathelwa
        indawo lixabiso lazo elifihliweyo.</strong> Amaphepha eesethingi
        abonisa izitshixo ezigciniweyo njenge-<code>***1234</code> endaweni
        yento yokwenene. Ngenxa yokuba iphepha lalinikwa ikopi efanayo
        yeesethingi ezisetyenziswa zii-scraper, oko kufihla kwakunokubhala
        ngaphezulu izitshixo zokwenene kwimemori kwaye kushiye ii-scraper
        zingena ngeenkwenkwezi de i-cache iphelelwe lixesha.</li>
      <li><strong>Ii-build ezimeleyo ngoku zikhangela iisethingi ze-scraper
        kwindawo echanekileyo.</strong> Ii-scraper zazifumana indawo yefayile
        ngendlela eyahlukileyo kumaphepha ayigcinayo. Kufakelo oluqhelekileyo
        zombini zazifika kwifayile enye; kwi-build ezimeleyo (ecofwa kabini)
        bezingayi kufika, ngoko izitshixo ze-API ezigciniweyo bezinokuya
        kwindawo ii-scraper ezingazange zikhangele kuyo.</li>
    </ul>
- version: 3.23.1
  date: '2026-08-06'
  tags:
  - type: fix
    label: 'I-port yeseva oyigcina kwi-Iisethingi ngoku yiyo esetyenziswayo'
  body: |
    <ul>
      <li><strong>Ukugcina i-port yeseva ngokwenene kufudusa iseva.</strong>
        I-Iisethingi yamkela i-port, yayijonga, yayigcina, yakuxelela ukuba
        kufuneka uqalise kwakhona ukuze isebenze &mdash; emva koko iseva yaqala
        ku-5000 nangona kunjalo. Akukho nto yakha yalifunda elo xabiso. Ngoku
        liyinxalenye yochungechunge lokuqalisa, ngoko ukuqalisa kwakhona
        ngokwenene kufudusela i-RetroDB kwi-port oyikhethileyo. Nantoni na
        esetwe kwi-environment isaphumelela, ngoko i-launcher okanye
        i-container enika i-port ayichaphazeleki.</li>
      <li><strong>Iisethingi ezimbini ezingazange zenze nto zisusiwe endaweni
        yokulungiswa.</strong> "Server host" kunye no-"debug mode" zazigcinwa
        kwaye zixela isithembiso esifanayo sobuxoki. Ukuvula i-debug mode
        ukusuka kwifomu yewebhu bekuya kuveza i-console ye-Python esebenzisanayo
        kwi-browser, kwaye idilesi yokubopha ilawula ukuba yeyiphi imatshini
        enokufikelela kwi-RetroDB konke konke &mdash; akukho nanye efanele ibe
        semva kwefomu yeesethingi. Zombini zihlala zisetwa ukusuka
        kwi-environment, apho zazisele zihlala khona. Ukuba ifayile yakho
        yeesethingi isenazo, zilahlwa ngokuthe cwaka xa ilayisha; akukho nto
        ekufuneka uyenzile.</li>
      <li><strong>Akukho nto ngoku ithi ukuqalisa kwakhona kuya kuyisebenzisa
        ngaphandle kokuba ukuqalisa kwakhona kuyayisebenzisa ngokwenene.</strong>
        Leyo yayiyeyona mpazamo yokwenene &mdash; isethingi efileyo ayicocekanga,
        kodwa isithembiso sobuxoki sichitha imva kwemini yonke.</li>
    </ul>
- version: 3.23.0
  date: '2026-08-06'
  tags:
  - type: enhancement
    label: 'Qalisa i-RetroDB kwi-port ekhethwe ngomnye umntu'
  body: |
    <ul>
      <li><strong>I-RetroDB ngoku ifunda isethingi ye-<code>PORT</code>
        kwi-environment yayo.</strong> Ukuba uqalisa i-RetroDB ukusuka
        kwesinye isixhobo &mdash; i-dashboard, i-container, iphaneli yeseva
        yasekhaya &mdash; eso sixhobo ngoku sinokunika i-RetroDB i-port
        esifuna ukuba ibe kuyo, ngaphandle kokuba nabani na ahlele ifayile.
        Seta i-<code>PORT</code> kwaye i-RetroDB ibophelela apho; yiyeke kwaye
        akukho nto itshintshayo konke konke. I-<code>RETRODB_PORT</code> esele
        ikhona isasebenza kanye njengangaphambili, kwaye i-<code>PORT</code>
        iyaphumelela ukuba zombini zisetiwe.</li>
      <li><strong>Inombolo ye-port engalunganga ngoku iyakuxela oko endaweni
        yokuqikelela.</strong> Ngaphambili i-port engafundekiyo yayivelisa
        udonga lombhalo weempazamo ze-Python, kwaye i-port engaphandle koluhlu
        olusebenzisekayo yayifunyaniswa kuphela xa iseva isilela ukuqala.
        I-RetroDB ngoku iyema kwangoko ngomgca omnye obiza ixabiso
        engakwazanga ukulisebenzisa. Ayisoze iqale ngokuthe cwaka kwi-port
        eyahlukileyo kuleyo icelwe yona &mdash; ukufuduswa ngokuthe cwaka
        kubi ngakumbi kunokuxelelwa ukuba hayi.</li>
      <li><strong>Ibhena yokuqalisa nethebhu ye-browser zilandela i-port
        yokwenene.</strong> Idilesi eprintwa xa i-RetroDB iqala, nephepha
        ekuvulelayo lona, zombini zazihlala zithi 5000 nokuba yeyiphi i-port
        eyayisetyenziswa ngokwenene.</li>
    </ul>
- version: 3.22.1
  date: '2026-07-31'
  tags:
  - type: fix
    label: Ikhusela ifayile yokusebenza yedatabheyisi ekukhuleni ngaphandle komda
  body: |
    <ul>
      <li><strong>Ijenali yedatabheyisi inomda kwakhona.</strong> I-SQLite igcina ifayile yokusebenza (ifayile ye-<code>-wal</code>) ecaleni kwedatabheyisi yethala lakho. I-RetroDB yayifuna ukuyinciphisa ibe yi-64&nbsp;MB, kodwa lo mda wawusebenza kuphela kwimisebenzi yangasemva &mdash; ukulayishwa kwamaphepha nokuhlela okuqhelekileyo kwakusebenza kungenamda konke konke. Emva kokubhala okukhulu ngokungaqhelekanga, ifayile yayihlala kubungakanani bayo obukhulu ngonaphakade, ngamanye amaxesha inkulu kunedatabheyisi ngokwayo. Ngoku umda usebenza yonke indawo, ngoko isithuba siyabuyiswa.</li>
    </ul>
- version: 3.22.0
  date: '2026-07-05'
  tags:
  - type: enhancement
    label: Khupha umdlalo ngokuthe ngqo kwiphopu-ap yawo, ngaphandle konyawo olongezelelweyo
  body: |
    <ul>
      <li><strong>Khupha ukusuka kwiphopu-ap yomdlalo.</strong> Iphopu-ap
        ekhawulezayo yomdlalo (leyo ivela xa ucofa umdlalo kwiThala lakho) ngoku
        ine-qhosha elithi <strong>Khupha</strong> ecaleni kwe-Ukuzalisa&nbsp;nge-AI
        ne-Hlela. Yicofe kwaye i-RetroDB ikusa ngqo kulo mdlalo kunye nokhangelo
        lwe-metadata seluvuliwe &mdash; akusekho kuvula iphepha elipheleleyo uze
        ukhangele iqhosha elithi Khupha kuqala.</li>
    </ul>
- version: 3.21.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Qalisa ngocofo olunye — qalisa i-RetroDB kwi-icon epiniweyo, ngaphandle kwe-terminal
  - type: feature
    label: I-app icon yokwenene — i-neon gamepad kwithebhu ye-browser yakho nakwi-taskbar
  - type: feature
    label: Iqhosha elitsha le-Shut Down Server kwiphepha le-Settings
  body: |
    <ul>
      <li><strong>Qalisa ngocofo olunye.</strong> I-RetroDB ngoku ine-launcher
        efanelekileyo onokuyipina kwi-taskbar yakho &mdash; yicofe kwaye i-app
        iyaqalisa (ukuba ayikaqali) ize ivuleke kwi-browser yakho ngokuzenzekelayo.
        Akusafuneki ukuvula i-terminal uze uchwetheze umyalelo. Kwi-Linux,
        sebenzisa <code>python3 scripts/install_launcher.py</code> kanye ukuze
        ufake &ldquo;RetroDB&rdquo; kwimenyu yakho ye-app, uze uyipine.</li>
      <li><strong>I-app icon yokwenene.</strong> I-RetroDB ngoku inxibe i-icon
        ye-neon gamepad &mdash; i-cyberpunk cyan ne-magenta kwithayile emnyama
        &mdash; kwithebhu ye-browser yakho (i-favicon), kwi-launcher ye-taskbar,
        nakwinkqubo ye-Windows ngokwayo. Ithatha indawo ye-emoji placeholder
        elula.</li>
      <li><strong>Iqhosha le-Shut Down Server.</strong> I-Server Controls
        yephepha le-Settings ngoku ine-qhosha elibomvu elithi <strong>Shut Down
        Server</strong> ecaleni kwe-Restart. Imisa i-app ngokucocekileyo (ivumela
        nayiphi na imisebenzi esebenzayo igqibe ukugcina kuqala), ngoko
        akusafuneki utshintshele kwi-terminal uze ucinezele u-Ctrl+C.</li>
      <li><strong>Ii-build ezinokukhutshelwa zikuvulela i-browser.</strong>
        Ii-download ze-Windows, ze-Mac neze-Linux ezikulungele-ukusebenza ngoku
        zivula i-browser yakho emva komzuzwana wokuqalisa, ngoko i-app iphambi
        kwakho ngaphandle kwenyathelo elongezelelweyo.</li>
    </ul>
- version: 3.20.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Iilwimi ezintsha ezilishumi elinanye — RetroDB ngoku ithetha iilwimi ezingama-21
  - type: fix
    label: 'Kulungiswe impazamo engenabungozi yekhonsoli xa ushiya uluhlu lwemidlalo'
  body: |
    <ul>
      <li><strong>Iiphakheji zolwimi ezintsha ezilishumi elinanye.</strong>
        I-interface ye-RetroDB, ii-release notes, kunye ne-help manual ngoku
        ziguqulelwe kwi-<strong>Afrikaans, isiZulu, isiXhosa, Dutch, Norwegian
        (Bokm&aring;l), Russian, Polish, Turkish, Ukrainian, Indonesian, kunye
        ne-Hebrew</strong> &mdash; zidibana ne-German, Spanish, French, Italian,
        Japanese, Korean, Brazilian Portuguese, kunye ne-Simplified &amp;
        Traditional Chinese esele ikhona. Khetha eyakho phantsi kwe-Settings
        &rarr; Display Preferences &rarr; Language; i-app iyaphinda ilayishe
        ngolwimi olukhethileyo.</li>
      <li>Ulwimi ngalunye lubandakanya lonke usetyenziso: yonke iqhosha,
        ileyibhile nomyalezo, wonke umlando wee-release notes, kunye
        nesikhokelo esipheleleyo soncedo.</li>
      <li><strong>isiZulu &amp; isiXhosa</strong> nazo zibandakanyiwe.
        Njengeelwimi ezinesigama esincinci se-software esikhoyo, zigcina
        amagama e-tech aqhelekileyo (ROM, scraper, box art) ngesiNgesi apho
        kungekho gama lifanelekileyo &mdash; uhlolo-magama lomntu othetha
        ulwimi lwenkobe lwamkelekile ngaphambi kokuba uxhomekeke kuzo.</li>
      <li><strong>Hebrew</strong> iza nombhalo oguqulelwe ngokupheleleyo; ubume
        bephepha obucwengekileyo bokusuka-ekunene-ukuya-ekhohlo (ukuze
        i-interface ibonakalise ngokuchanekileyo) buza kufika kuhlaziyo
        oluzayo. Arabic iza kulandela emva kokuba loo msebenzi wobume
        ufikile.</li>
      <li><strong>Ukulungiswa kwempazamo:</strong> ukushiya iThala leeNcwadi okanye uluhlu lwemidlalo lwesixokelelwano akusabhali &ldquo;ReferenceError&rdquo; engenabungozi kwikhonsoli yesikhangeli (intsalela yococeko lwangaphambili). Akukho ziphumo zibonakalayo &mdash; nje ikhonsoli ecocekileyo.</li>
    </ul>
- version: 3.19.1
  date: '2026-07-05'
  tags:
  - type: performance
    label: Uku-scrape okukhawulezayo — ii-screenshot zomdlalo ngoku zikhutshwa ngaxeshanye
  body: |
    <ul>
      <li><strong>Ii-screenshot zikhutshwa ngaxeshanye.</strong> Ilandela indlela
        efanayo neyefrontend edumileyo i-ES-DE (elanda yonke i-media yomdlalo
        ngaxeshanye), i-RetroDB ngoku ikhuphela ii-screenshot zomdlalo
        <strong>ngaxeshanye</strong> endaweni yenye emva kwenye, kuyo yonke
        imithombo (TheGamesDB, IGDB, RAWG, ScreenScraper). Imidlalo eneescreenshot
        ezininzi igqiba ngokukhawuleza ngokuphawulekayo.</li>
      <li>Ukuhlolwa kwe-screenshot ephindaphindiweyo kusaqhubeka emva koko
        ngokulandelelana, ngoko ukususwa kwemifanekiso ephindaphindiweyo kuhlala
        kuchanekile njengangaphambili &mdash; kuphela ukukhutshwa okwenziwe
        kukhawuleza. Ukukhuphela kunqunyelwe kwezine ngexesha ukuze umthombo omnye
        ungaze uxinaniswe ngokugqithisileyo.</li>
      <li>Uphuculo lwesantya olusebenza ngasese; luqala ukusebenza emva
        kokuqalisa okulandelayo.</li>
    </ul>
- version: 3.19.0
  date: '2026-07-05'
  tags:
  - type: performance
    label: Uku-scrape okukhawulezayo — imithombo ngoku ibuzwa ngaxeshanye
  body: |
    <ul>
      <li><strong>Uku-scrape kukhawuleza kumdlalo ngamnye.</strong> Xa i-RetroDB
        ikhangela umdlalo, ihlola iidatabase eziliqela (ES-DE, TheGamesDB, IGDB,
        RAWG, ScreenScraper). Ngaphambili yayizibuza <em>enye nganye</em> ize
        ilinde ukuba nganye iphendule phambi kokubuza elandelayo &mdash; ngoko
        ukulinda kwakusisamba sazo zonke. Ngoku izibuza zonke
        <strong>ngaxeshanye</strong> ize ilinde eyona icothayo kuphela, oko
        kukukhawuleza okuphawulekayo kumdlalo ngamnye. Iziphumo zisahleleka
        kwaye zinikwa amanqaku ngokufanayo njengangaphambili.</li>
      <li><strong>Zimbalwa iihandshake ezingamampunge xa kukhutshwa ubugcisa
        bemifanekiso.</strong> Ukukhutshwa kwemifanekiso ngoku kusebenzisa kwakhona
        uqhagamshelo oluvele luvuliwe endaweni yokuvula olutsha kumfanekiso ngamnye,
        oku kunciphisa ixesha kwimidlalo eneescreenshot ezininzi.</li>
      <li>Olu luphuculo lwesantya olusebenza ngasese &mdash; akukho nto itshintshayo
        kwindlela osebenzisa ngayo i-RetroDB, kwaye ayizixineli ngakumbi
        iidatabase (izicelo ezifanayo, kuphela zenziwa ngaxeshanye). Ziqala
        ukusebenza emva kokuqalisa okulandelayo.</li>
    </ul>
- version: 3.18.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Kongezwe amanqanaba obudala aseTshayina (China) njengenkqubo yesi-9 yamanqanaba
  body: |
    <ul>
      <li><strong>Inkqubo entsha yamanqanaba obudala: China (CADPA).</strong>
        I-RetroDB ngoku ixhasa isikimu esisemthethweni saseTshayina sokukhumbuza
        ngobudala bemidlalo (&ldquo;网络游戏适龄提示&rdquo;, esikhutshwe yi-CADPA)
        kunye namabhodi asibhozo akhoyo (ESRB, PEGI, CERO, USK, ACB, FPB, GRAC
        kunye ne-ClassInd). Isebenzisa amanqanaba amathathu &mdash;
        <strong>8+</strong>, <strong>12+</strong> kunye <strong>ne-16+</strong>
        &mdash; aboniswa ngebheji eluhlaza elula.</li>
      <li><strong>Izizalisa ngokwayo, njengamanye.</strong> Xa umdlalo sele
        unenqanaba elivela kwelinye ilizwe, i-RetroDB iyalibala ngokuzenzekelayo
        inqanaba laseTshayina elihambelanayo (nangokuchaseneyo). Ungakwazi
        kukhetha okanye ukulitshintsha ngesandla kwiscreen sokuHlela somdlalo,
        uze ulikhethe njengenkqubo oyithandayo yokubonisa phantsi kwe-Settings
        &rarr; Library. Qaphela: uninzi lweedatabase zemidlalo zaseNtshona
        aluyipapashi inqanaba laseTshayina, ngoko kwimidlalo engenanqanaba
        naphi na lizaliswa lisuka kwiziqulatho zomdlalo ngexesha loku-scrape /
        i-AI Fill.</li>
      <li>Iibheji eziluhlaza bubugcisa obulula obungobe-RetroDB (obuhambelana
        nesimbo sendlu samanye amabhodi), hayi ilogo esemthethweni ye-CADPA,
        ngoko akukho miqathango yelayisenisi yomfanekiso ehambelanayo.</li>
    </ul>
- version: 3.17.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Cima amangeniso edatabase kwiifayile ze-media ezingekhoyo kwidiski
  - type: security
    label: Khusela ekususweni kwabo bonke ubugcisa belayibrari yakho xa ifolda ye-media ilahleka
  body: |
    <ul>
      <li><strong>Isixhobo esitsha sokugcina: &ldquo;Missing Media References&rdquo;</strong>
        (Settings &rarr; System &rarr; Maintenance). Sisithombe esibuyiselweyo
        sococeko olukhoyo &ldquo;Orphaned Media&rdquo;: endaweni yokufumana
        iifayile zemifanekiso eziseleyo ezingenamdlalo, sifumana imidlalo
        onobugcisa bebhokisi, ubugcisa bebhokisi obu-3D, iiscreenshot, i-fanart,
        ividiyo okanye incwadi yesikhokelo ekhomba kwiifayile ezingasekho
        kwidiski. Zikhangele, uze ucime la mangeniso amdala ngokucofa kanye ukuze
        i-scraper zikwazi ukukhuphela kwakhona ubugcisa. Amangeniso omdlalo wakho
        ngokwawo azange achukunyiswe.</li>
      <li><strong>Ucoceko oluzenzekelayo olukhuselekileyo ngexesha loku-scrape.</strong>
        Xa i-RetroDB iphinda i-scrape umdlalo icima ngokuzolileyo amangeniso
        eefayile ze-media ezinyamalele kwidiski. Ngaphambili, ukuba ifolda
        yonke ye-media inyamalala ngaxeshanye &mdash; idiski yangaphandle
        enganyanzeliswanga, okanye ukususwa okuninzi &mdash; olo coceko lwalunokucima
        irekhodi yobugcisa ababunayo abadlali abaziinkulungwane, oko kunyanzelisa
        uku-scrape okubiza kakhulu. I-RetroDB ngoku iyalibona elo phawu: ukuba
        ifolda ye-media ilahlekile okanye ize kwaphela, igcina amangeniso ize
        ibhale isilumkiso endaweni yokuwacima. Isixhobo esitsha sokugcina
        sisebenzisa isikhuseli esifanayo kwaye siphawula ngokucacileyo nayiphi na
        ifolda esiyibambileyo.</li>
    </ul>
- version: 3.16.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Iphaneli entsha ethi "Quick Fixes" kwi-dashboard
  body: |
    <ul>
      <li><strong>Iphaneli entsha ethi &ldquo;Quick Fixes&rdquo; kwi-Dashboard</strong>
        iguqula imisebenzi esasazekileyo yelayibrari ibe luluhlu lwezinto
        ekufuneka zenziwe olubonakala ngokukhawuleza. Ibonisa ukuba mingaphi
        imidlalo esasilela ubugcisa bebhokisi, ize inikeze iindlela ezimfutshane
        zokucofa kanye zokufumana ii-ROM eziphindaphindiweyo kunye nokuhlola
        iindlela ze-ROM ezophukileyo (imidlalo eefayile zayo zisukileyo okanye
        zisusiwe). Indlela emfutshane nganye idibanisa ngqo kwiphepha eliyilungisayo.
        Iphaneli ivela xa unemidlalo kwilayibrari yakho.</li>
    </ul>
- version: 3.15.0
  date: '2026-07-03'
  tags:
  - type: accessibility
    label: Iiscreen reader ngoku zibhengeza inkqubela yomsebenzi ngokuvakalayo
  body: |
    <ul>
      <li><strong>Imisebenzi ehamba ixesha elide ngoku ithetha inkqubela yayo
        kwiiscreen reader.</strong> Xa i-scrape eninzi, ukuvumelanisa impumelelo
        (RetroAchievements okanye PlayStation), okanye ukutshintsha ubungakanani
        bomfanekiso kusebenza, abasebenzisi bee-screen reader babengeva nto
        phakathi &ldquo;kokuqalisiweyo&rdquo; kunye &ldquo;nokugqityiweyo&rdquo;.
        I-RetroDB ngoku ibhengeza iimpawu zamaxesha rhoqo (umzekelo &ldquo;Bulk
        Scrape: 12 kwezingama-40&rdquo;) kunye nokugqitywa okuthethwayo &mdash;
        ngaphandle kweepop-up ezongezelelweyo kwiscreen. Izibhengezo zikhawulekiswe
        ukuze zazise ngaphandle kokubhuda, kwaye zilandela ulwimi olukhethileyo.</li>
    </ul>
- version: 3.14.0
  date: '2026-07-01'
  tags:
  - type: feature
    label: Iilwimi ezintsha — isiTshayina (esiLula & seSithethe) ngoku siyafumaneka
  body: |
    <ul>
      <li><strong>I-RetroDB ngoku iyafumaneka ngesiTshayina.</strong> Kukho
        ukhetho olubini phantsi <strong>kwe-Settings &rarr; System &rarr;
        Language</strong>: <strong>中文 (简体)</strong> (esiLula, seTshayina
        elikhulu) kunye <strong>ne-中文 (繁體)</strong> (seSithethe, seHong Kong
        neTaiwan). Wonke umda &mdash; iimenyu, amaqhosha, imiyalezo, kunye
        nencwadi yesikhokelo yoNcedo esekwisicelo &mdash; iguqulelwe, kwaye nantoni
        na engekaguqulelwa ibuyela ngokuzolileyo kwisiNgesi. Oku kuzisa iilwimi
        ezixhaswayo kwishumi (isiNgesi, isiJamani, isiSpanish, isiFrench,
        isiTaliyane, isiJapan, isiPhuthukezi saseBrazil, isiKorean, kwaye ngoku
        isiTshayina esiLula &amp; seSithethe).</li>
    </ul>
- version: 3.12.0
  date: '2026-06-30'
  tags:
  - type: feature
    label: Ulwimi olutsha — isiKorean (한국어) ngoku siyafumaneka
  body: |
    <ul>
      <li><strong>I-RetroDB ngoku iyafumaneka ngesiKorean (한국어).</strong>
        Sikhethe phantsi kwe-Settings &rarr; System &rarr; Language. Wonke umda
        &mdash; iimenyu, amaqhosha, imiyalezo, kunye nencwadi yesikhokelo yoNcedo
        esekwisicelo &mdash; iguqulelwe, izisa iilwimi ezixhaswayo kwisibhozo
        (isiNgesi, isiJamani, isiSpanish, isiFrench, isiTaliyane, isiJapan,
        isiPhuthukezi saseBrazil, kunye nesiKorean). IsiKorean sigcwalisa
        ugubungelo lwalo lonke ibhodi lamanqanaba obudala bemidlalo eboniswa
        yi-RetroDB, kuquka i-GRAC yaseMzantsi Korea.</li>
    </ul>
- version: 3.11.0
  date: '2026-06-30'
  tags:
  - type: enhancement
    label: Xhasa i-RetroDB kwi-Patreon — ikhonkco elitsha lomnikelo longeziwe
  body: |
    <ul>
      <li><strong>Ngoku unokuxhasa i-RetroDB kwi-Patreon.</strong> Ikhonkco
        le-Patreon likufuphi neqhosha elikhoyo elithi &ldquo;Sponsor on
        GitHub&rdquo; kwi-<strong>Settings &rarr; System &rarr; Support
        Development</strong>, kwiphaneli ethi About, nakwifayile ye-README
        yeprojekthi. I-RetroDB ihlala isimahla ngokupheleleyo kwaye ivulekile
        &mdash; iminikelo ayinyanzelekanga konke konke kwaye nje incede ukugcina
        uphuhliso lomntu omnye luqhubeka.</li>
    </ul>
- version: 3.10.0
  date: '2026-06-26'
  tags:
  - type: enhancement
    label: I-Changelog ngoku ilayisha ngokukhawuleza ngeqhosha elithi "Load More"
  body: |
    <ul>
      <li><strong>Iphepha le-Changelog ngoku livuleka ngokukhawuleza kakhulu.</strong>
        Endaweni yokuzoba yonke imbali yeenguqulelo (amakhulu amangeniso) ngalo
        lonke ixesha ulivula, i-RetroDB ngoku ibonisa ezingama-20 zamva nje ize
        yongeze iqhosha elithi <strong>Load More</strong> ezantsi. Licofe ukuze
        utyhile iqela elilandelayo, njalo njalo &mdash; imbali endala isekhona
        yonke, ilayisha nje xa kufuneka endaweni yokucothisa umbono wokuqala.</li>
    </ul>
- version: 3.9.0
  date: '2026-06-17'
  tags:
  - type: feature
    label: Incwadi yesikhokelo yoNcedo & amanqaku eenguqulelo zamva ngoku aguqulelwe kuzo zonke iilwimi ezi-6
  body: |
    <ul>
      <li><strong>Incwadi yesikhokelo yoNcedo epheleleyo esekwisicelo ngoku
        iyafumaneka kuzo zonke iilwimi ezintandathu</strong> &mdash; isiJamani,
        isiFrench, isiSpanish, isiTaliyane, isiJapan kunye nesiPhuthukezi saseBrazil
        &mdash; hayi nje isiNgesi kuphela. I-RetroDB ibonisa incwadi yesikhokelo
        ngolwimi olukhethileyo kwi-Settings, ize ibuyele ngokuzolileyo kwisiNgesi
        ukuba into ithile ayikaguqulelwa.</li>
      <li><strong>Le Changelog ngoku ivela nangolwimi lwakho</strong> kwiinguqulelo
        zamva nje, kwaye iinguqulelo ezintsha ziya kuguqulelwa ukusuka apha ukuya
        phambili. Imbali endala ihlala ngesiNgesi.</li>
      <li><strong>Iphepha leWishlist kunye nabaseleyo bokugqibela beembalasane
        zesiNgesi</strong> &mdash; iqela lemiyalezo yeempazamo neyesimo eyeepop-up
        eyayiphoswe xa iipakethe zeelwimi zafika okokuqala kwi-3.8.0 &mdash; ngoku
        ziguqulelwa ngokufanelekileyo kulo lonke isicelo.</li>
    </ul>
- version: 3.8.2
  date: '2026-06-17'
  tags:
  - type: security
    label: Uhlaziyo lokuxhomekeka kokhuseleko + izilungiso ze-CI
  body: |
    <ul>
      <li><strong>Ukhuseleko:</strong> lihlaziywe ilayibrari ebhandlelweyo
        i-<code>cryptography</code> (47 → 49) ukususa isilumkiso esipapashiweyo
        (GHSA-537c-gmf6-5ccf). Akukho tshintsho kwindlela esebenza ngayo &mdash;
        nje inguqulelo ekhuselekileyo ngakumbi.</li>
      <li>Kulungiswe i-pipeline yovavanyo eyenziwa ngokuzenzekelayo: isixhobo
        soncedo esisetyenziswa kuphela kuvavanyo esasilahlekile
        (<code>beautifulsoup4</code>) sasisilela ukusebenza kovavanyo ukususela
        kwi-v3.7.0, kwaye iskripthi esitsha sokwakha iipakethi sikhubaze
        ukuhlolwa kohlalutyo olungenanto oluyipositi engeyonyani eyaziwayo (iqhuba
        imiyalelo yokwakha ethenjwayo, hayi igalelo lomsebenzisi) &mdash; ngoku
        libhalwe kwaye lalungelaniswa. Kugcino kuphela; akukho nto itshintshayo
        kwisicelo ngokwaso.</li>
    </ul>
- version: 3.8.1
  date: '2026-06-17'
  tags:
  - type: improvement
    label: Ukhetho lokukhuphela oluncinci, ukucocwa kweminikelo & isilungiso soguqulelo (Pass 46.3 / 47.6)
  body: |
    <ul>
      <li><strong>Ukukhuphela okuncinci kakhulu kuyeza.</strong> Inguqulelo elungele
        ukusebenza ethi &ldquo;vula i-zip uze ucofe kabini&rdquo; ye-RetroDB ngoku
        inokwakhiwa ngendlela ye-<strong>CPU-kuphela</strong> (~600&nbsp;MB) yabantu
        abangenayo ikhadi legrafiksi ye-AMD &mdash; malunga nesinye kwesithandathu
        sobukhulu benguqulelo epheleleyo. Zombini ziya kunikezelwa ecaleni ukuze
        ukhethe leyo ifanele umatshini wakho.</li>
      <li><strong>Iphaneli ethi &ldquo;Support Development&rdquo; kwi-Settings ngoku
        iyaguqulelwa</strong> kunye nazo zonke ezinye izinto zesicelo &mdash;
        yayishiywe ngengozi ngesiNgesi xa iipakethe zeelwimi zafika kwi-3.8.0.</li>
      <li>Kucocwe amakhonkco eminikelo (ibheji ye-GitHub Sponsors kwi-README;
        ifayile yenkxaso ilungele i-Patreon ne-Buy&nbsp;Me&nbsp;A&nbsp;Coffee
        xa ezo zisetyenzisiwe). Akukho ma-screen okukhalaza, naphakade.</li>
      <li>Ngasese: i-pipeline yokukhupha ngoku inokwakha iinguqulelo ezilungele
        ukusebenza zeWindows, macOS neLinux ngokuzenzekelayo. Qaphela: incwadi
        ende <em>yoNcedo</em> esekwisicelo isengesiNgesi kuphela okwangoku &mdash;
        oko kubhalwe njengomsebenzi ozayo.</li>
    </ul>
- version: 3.8.0
  date: '2026-06-12'
  tags:
  - type: feature
    label: Uguqulelo olupheleleyo lomda + iilwimi ezi-6 (Pass 43.2/43.3/43.5)
  body: |
    <ul>
      <li><strong>I-RetroDB ngoku ithetha ezinye iilwimi ezi-6.</strong> Isakhela
        phezu kwesiseko se-3.7.0, wonke umda wenziwe wakwazi ukuguqulelwa waze
        waguqulelwa ngokuzenzekelayo <strong>kwisiJamani, isiFrench, isiSpanish,
        isiTaliyane, isiJapan kunye nesiPhuthukezi saseBrazil</strong>. Khetha
        ulwimi lwakho kwi-Settings &rarr; Display Preferences &rarr; Language;
        lulandela ukhetho lwakho olugciniweyo, emva koko ibhrawuza yakho, uze
        ubuyele kwisiNgesi &mdash; alunakuze luxinge kulwimi olulahlekileyo.</li>
      <li><strong>Yonke into ebonakala kwiscreen igutyungelwe</strong>: umbhalo
        wamaphepha namaqhosha, imiyalezo yeepop-up (izaziso ezincinci ze-&ldquo;toast&rdquo;),
        iibhokisi zencoko zokuHlela nezee-Settings, iithiphu zolwazi kunye
        neelebhile zee-screen reader. Iindidi zemidlalo, iimbono kunye neendlela
        zokudlala (umz. &ldquo;First-Person-Shooter&rdquo;) ngoku ziboniswa
        nangolwimi lwakho &mdash; ngelixa idatha esisiseko ihlala ngesiNgesi, ukuze
        ilayibrari yakho neefilta zisebenze kanye njengangaphambili.</li>
      <li>Ulwimi olwakhelwe ngaphakathi <strong>lwe-&ldquo;Pseudo&rdquo;</strong>
        (olubonakala kwimenyu yeeLanguage) sisixhobo solawulo lomgangatho
        lwabaguquleli olubiyela lize luqaqambise ilebhile nganye, lwenza kucace
        ngoko nangoko nawuphi na umbhalo obungaphoswanga.</li>
      <li>Uguqulelo oluzenzekelayo luyindawo yokuqala kwaye lunokuvakala luqinile
        kancinci kwezinye iindawo &mdash; kulula ukuluphucula ekuhambeni kwexesha,
        kwaye nawuphi na umbhalo ongenaguqulelo ubonakala nje ngesiNgesi.</li>
    </ul>
