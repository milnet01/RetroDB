            <ul>
                <li><strong>23.1 &mdash; fixed <code>AttributeError</code> in fallback &amp; secondary scraper match scoring</strong>. After the Pass 6 split, <code>scraper/hybrid_scraper.py</code> still called <code>scraper_manager._calculate_title_match_score</code> at two sites (<code>_pick_best_fallback</code>, <code>_pick_best_secondary</code>), but the function had moved to module-level <code>calculate_title_match_score</code> in <code>scraper/match_scorer.py</code>. The <code>AttributeError</code> was swallowed by the outer <code>except Exception as fallback_error</code> and the fallback / secondary path silently returned no data with only a generic warning in logs. Live in production. Fix: top-level <code>from scraper.match_scorer import calculate_title_match_score</code>, swap both call sites, drop the now-unused lazy <code>scraper_manager</code> imports inside those two helpers.</li>
                <li><strong>23.9 &mdash; regression test for fallback title scoring</strong>. New <code>tests/test_hybrid_scraper.py</code> exercises <code>_pick_best_fallback</code> and <code>_pick_best_secondary</code> against the real <code>calculate_title_match_score</code> (no mocking) so the 23.1 regression cannot re-land. 6 tests: best-name selection from a flat list, ScreenScraper <code>noms</code>-shape extraction, min-score rejection, secondary best match, pre-computed <code>title_score</code> passthrough, sub-threshold rejection.</li>
                <li><strong>23.2 &mdash; aligned RAWG <code>apply_rawg_to_metadata</code> with TGDB / IGDB / ScreenScraper fill-only semantics</strong>. Every non-title field used the pattern <code>(not metadata[X] or not fill_only)</code>, which on a primary-source scrape (<code>fill_only=False</code>) overwrote curated or cross-source data for description, release_date, developer, publisher, genre, ESRB, players, modes, critic_score, user_score. Now matches the other three per-source applies: only <code>title</code> overwrites on primary; everything else is fill-only regardless of the flag. Updated <code>tests/test_metadata_merger.py::TestApplyRawg::test_fill_only_false_overwrites_only_title</code> to pin the corrected behaviour.</li>
                <li><strong>23.3 &mdash; collapsed duplicate rating cross-map in <code>hybrid_scraper.py</code></strong>. The 23-line inline RP-as-empty tier-mapping loop in <code>_save_metadata</code> reimplemented <code>services.game_metadata_service.cross_map_ratings</code>. Two sources of truth meant any tweak to <code>_RP_VALUES</code> or tier semantics had to be synced manually. Replaced with a 9-line wrapper that builds a bare-key dict from the metadata's db-column slots, calls <code>cross_map_ratings()</code>, writes back any newly-filled slots, and appends a <code>(cross-map&rarr;<i>System</i>)</code> filled-fields tag. Dropped the now-unused <code>map_rating</code> import.</li>
                <li><strong>23.4 &mdash; fixed <code>api_similar_games</code> set-iteration ordering bug</strong>. <code>routes/games_search.py:149</code> built <code>NOT IN ({placeholders})</code> from <code>seen_ids</code> (a <code>set</code>) and bound <code>list(seen_ids)</code> separately. CPython set iteration order is not guaranteed to be stable across two iterations of the same set, so the placeholder count and bind values could disagree &mdash; silently filtering out the wrong rows or none at all. Materialise the list once: <code>seen_ids_list = list(seen_ids)</code>, use it for both the placeholder count and the bind tuple.</li>
                <li><strong>23.5 &mdash; fixed <code>source=rom</code> filter precedence</strong>. <code>services/game_query.py:235</code> built <code>(A AND B AND C AND D OR g.rom_path IS NULL)</code>. SQL precedence (<code>AND</code> binds tighter than <code>OR</code>) gives the correct result by accident, but the expression is ambiguous to anyone reviewing it. Added explicit inner parens: <code>((A AND B AND C AND D) OR g.rom_path IS NULL)</code> with a comment.</li>
                <li><strong>23.6 &mdash; fixed manuals path divergence in <code>services/media_cleanup.py</code></strong>. <code>_MEDIA_LAYOUT</code> at line 28 placed manuals under <code>IMAGE_PATH/manuals</code> (matches every scraper output: <code>scrape_esde.py</code>, <code>metadata_merger.py</code>, <code>hybrid_scraper.py</code>), but <code>find_orphaned_media</code> at line 115 scanned <code>STATIC_PATH/manuals</code> &mdash; a path that never exists. Manuals were silently bypassed by the orphan sweep. Pointed both at <code>IMAGE_PATH/manuals</code>.</li>
                <li><strong>23.7 &mdash; preserved GIF animation in <code>_save_image</code></strong>. <code>services/image_utils.py</code> called <code>img.save(path, 'GIF')</code> without <code>save_all=True</code> &mdash; flattened animated GIFs to first frame on every standardize / variant-generation pass. Branched <code>.gif</code> to a no-op early return: the original animated file on disk is left untouched (the upstream resize step was already incompatible with multi-frame GIFs anyway).</li>
                <li><strong>23.8 &mdash; synced <code>config.example.py</code> with <code>config.py</code></strong>. The example file was missing 15 IGDB platform mappings (<code>atarist</code>, <code>atari800</code>, <code>zxspectrum</code>, <code>amstradcpc</code>, <code>msx</code>, <code>msx2</code>, <code>bbcmicro</code>, <code>apple2</code>, <code>x68000</code>, <code>pc88</code>, <code>pc98</code>, <code>fmtowns</code>, <code>sg-1000</code>, <code>neogeocd</code>, <code>supergrafx</code>) plus 95 <code>SYSTEM_SPECS</code> entries (Famicom, FDS, SFC, N64DD, virtualboy, pokemini, satellaview, sufami, gameandwatch, vita, megadrivejp, sega32xjp, sega32xna, saturnjp, sg-1000, sc-3000, model2/3, naomi/2, stv, atarixe, atarijaguarcd, ngp/c, pcengine, pcenginecd, supergrafx, tg16, tg-cd, pcfx, vectrex, channelf, odyssey2, videopac, wonderswan/color, ngage, palm, gx4000, supervision, gamate, gamecom, supracan, crvision, scv, plus more recent additions). Fresh installs silently dropped scraped metadata back to per-name fuzzy lookup for those platforms. Same class of bug that broke CI in the v2.88.0 ship. Re-synced by copying <code>config.py</code> over the example and re-inserting the 3-line SETUP comment block.</li>
