- version: 2.5.0
  date: 2026/02/10
  tags:
  - type: feature
    label: Performance
  body: |
    <h3>System Games: API-Driven Rendering</h3>
    <h4>Scalability Upgrade</h4>
    <ul>
        <li>System game pages (<code>/system/&lt;id&gt;</code>) now use the same API-driven infinite scroll as the Library page, loading 100 games at a time instead of rendering all games server-side.</li>
        <li>Dramatically faster initial page load for systems with large libraries (hundreds or thousands of games).</li>
        <li>Unified <code>AllGamesController</code> now powers both the Library and per-system pages with configurable options (<code>systemId</code>, <code>showSystemBadge</code>, <code>pageKey</code>).</li>
    </ul>
    <h4>System-Scoped Filters</h4>
    <ul>
        <li>Filter dropdowns (genre, series, publisher, developer, rating) now show only values relevant to the current system instead of all values across the entire library.</li>
        <li>System filter is locked on system pages &mdash; cannot be accidentally removed or cleared.</li>
    </ul>
    <h4>Consistent Card Layout</h4>
    <ul>
        <li>System page cards use the title-row layout (no system badge, since all cards belong to the same system).</li>
        <li>Library page cards continue showing the system badge row.</li>
    </ul>
    <h4>Alphabet Navigation</h4>
    <ul>
        <li>Alphabet nav now correctly disables letters that have no games, computed server-side per system (or globally for Library).</li>
        <li>Clicking a disabled letter is a no-op.</li>
    </ul>
    <h4>Technical Details</h4>
    <ul>
        <li>Route <code>routes/systems.py</code> now sends only counts, filter options, and available letters (no full game list).</li>
        <li><code>_get_filter_options()</code> accepts optional <code>system_id</code> parameter for scoped queries.</li>
        <li>Removed old client-side <code>GameListPage</code> dependency from system pages.</li>
        <li>State persistence uses per-system keys (<code>retrodb_system_&lt;id&gt;</code>).</li>
    </ul>

- version: 2.4.3
