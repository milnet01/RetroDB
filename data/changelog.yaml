- version: 2.64.0
  date: 2026-03-09
  tags:
  - type: fix
    label: Fix
  body: |
    <ul>
        <li><strong>Memory Leak Fixes</strong> &mdash; Comprehensive fixes for browser memory leaks that caused freezing during long-running bulk scrape sessions:
            <ul>
                <li><strong>Theme canvas gradient cache</strong> &mdash; Capped at 60 entries with LRU eviction; previously grew unbounded as fallback blob particles generated random neon colors on each reset, accumulating thousands of canvas bitmaps over hours.</li>
                <li><strong>Toast controller duplicate listeners</strong> &mdash; Added init guards to prevent <code>visibilitychange</code>, <code>resize</code>, and <code>load</code> event listeners from accumulating on re-initialization.</li>
                <li><strong>Polling fetch abort</strong> &mdash; Added <code>AbortController</code> to poll requests so stale in-flight fetches are cancelled before new ones start, preventing request pileup during slow responses.</li>
                <li><strong>AllGamesController cleanup</strong> &mdash; <code>destroy()</code> now removes scroll, keydown, and click event listeners; clears search/scroll debounce timers and selection Set.</li>
                <li><strong>BackToTopController cleanup</strong> &mdash; Stored throttled scroll handler reference and added <code>destroy()</code> method for proper listener removal.</li>
                <li><strong>Video modal cleanup</strong> &mdash; Game detail modal <code>close()</code> now fully aborts in-flight video downloads instead of just pausing.</li>
                <li><strong>Theme manager listeners</strong> &mdash; <code>visibilitychange</code> and <code>beforeunload</code> listeners now guarded against duplicate registration.</li>
            </ul>
        </li>
        <li><strong>Gemini Response Parsing</strong> &mdash; Made Gemini API response parsing more resilient using <code>.get()</code> chains instead of direct key access. Now handles edge cases where <code>parts</code> is missing (safety blocks, empty responses) with informative log messages including <code>finishReason</code> and <code>blockReason</code>.</li>
    </ul>

