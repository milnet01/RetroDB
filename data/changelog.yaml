- version: 1.23.2
  date: 2026/02/06
  tags:
  - type: patch
    label: Bug Fix
  - type: minor
    label: Enhancement
  body: |
    <h3>Bulk Scrape: Scoring &amp; Matching Improvements</h3>
    <ul>
        <li><strong>Fixed</strong>: Best-match selection now sorts by score only. Previously, scraper priority was absolute &mdash; a poor 30-point match from the #1 scraper always beat a perfect 470-point match from another. The priority boost (now 10 pts/position, max 50) is baked into the score, so it breaks ties without overriding clearly better matches.</li>
        <li><strong>Minimum score threshold</strong>: Results scoring below 80 are rejected during bulk scrape, preventing wildly wrong game matches from being applied. Games with no reliable match are skipped instead of assigned wrong metadata.</li>
        <li><strong>Title noise stripping</strong>: Region tags <code>(USA)</code>, disc indicators <code>(Disc 1)</code>, edition tags <code>(Greatest Hits)</code>, revision markers <code>(Rev 1)</code>, and bracketed content <code>[NTSC]</code> are now stripped before scoring. This prevents CLZ import titles with metadata noise from tanking match scores.</li>
        <li><strong>Word-order bonus</strong>: Titles with words in the correct sequential order now score up to 40 points higher via longest-common-subsequence analysis. &ldquo;Final Fantasy VII&rdquo; and &ldquo;VII Fantasy Final&rdquo; no longer score identically.</li>
    </ul>

    <h3>IGDB Boxart Deprioritization</h3>
    <ul>
        <li><strong>Platform-specific boxart preferred</strong>: IGDB provides generic (non-platform-specific) covers. When IGDB wins as the primary scraper, its boxart is now replaced during gap-fill by platform-specific boxart from TheGamesDB, ScreenScraper, or RAWG. The old IGDB file is deleted from disk.</li>
    </ul>

