    label: Cleanup & Distribution
  body: |
    <h3>Project Cleanup &amp; Distribution Builder</h3>
    <h4>Directory Cleanup</h4>
    <ul>
        <li>Removed Python cache files, log files, and legacy empty database file.</li>
        <li>Removed 12 leftover <code>.bak</code> backup image files from system logos.</li>
        <li>Deleted unused <code>hltb_dataset.csv</code> (HLTB scraper handles data directly).</li>
        <li>Added <code>*.bak</code> pattern to <code>.gitignore</code>.</li>
    </ul>
    <h4>Distribution Builder</h4>
    <ul>
        <li>Rewrote <code>build_dist.py</code> to create platform-specific ZIPs (Linux, macOS, Windows) with version numbers in filenames.</li>
        <li>Each platform ZIP includes only its relevant start script (<code>start.sh</code>, <code>start.command</code>, or <code>start.bat</code>).</li>
