        <li><strong>Root Cause</strong>: <code>triggerNextRASyncFromQueue()</code> only checked <code>result.success</code> but server returns <code>{success: true, queued: true}</code> when RA Refresh is blocking. Now also checks <code>!result.queued</code> before creating active toast.</li>
