        <li><strong>Archive Scanner - Custom Patterns</strong>: Fixed the clean archive feature not loading custom unwanted patterns from ROM Tools settings. Now properly uses your configured patterns instead of hardcoded defaults.</li>
    </ul>
    <h3>✨ Enhancements</h3>
    <ul>
        <li><strong>M3U Creation - ES-DE Compatible</strong>: Completely rewrote the M3U playlist creation for proper ES-DE integration:
            <ul>
                <li>Extracts multi-file archives to a subfolder named after the archive</li>
                <li>Creates <code>noload.txt</code> in the folder to prevent ES-DE from scanning it</li>
                <li>Generates M3U file with relative paths pointing to the extracted files</li>
            </ul>
        </li>
        <li><strong>Batch M3U Creation</strong>: Added dedicated batch endpoint for processing multiple multi-file archives efficiently. Shows detailed success/failure counts and removes successfully processed archives from the scan results.</li>
    </ul>
