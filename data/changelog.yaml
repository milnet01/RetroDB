- version: 2.23.8
  date: 2026-02-14
  tags:
  - type: patch
    label: Bug Fixes
  body: |
    <h3>Bug Fixes &amp; Security Hardening</h3>
    <ul>
        <li><strong>Fixed</strong> &mdash; <code>/api/games/find</code> endpoint was completely broken &mdash; it referenced a non-existent <code>system_name</code> column on the games table instead of joining with the systems table, causing a 500 error on every call (used by lists, compare, and other features).</li>
        <li><strong>Fixed</strong> &mdash; Updating a list or wishlist item with NULL <code>description</code>, <code>icon</code>, or <code>notes</code> fields in the database would crash with <code>AttributeError</code> when calling <code>.strip()</code> on <code>None</code>.</li>
        <li><strong>Fixed</strong> &mdash; Mismatch batch rename modal permanently mutated the shared Start button&rsquo;s <code>onclick</code> handler. If the user cancelled the mismatch batch modal then used the naming-tab batch rename, it would call the wrong rename endpoint.</li>
        <li><strong>Fixed</strong> &mdash; PSN trophy sync had a TOCTOU race condition &mdash; two simultaneous sync requests could both start background threads. Added <code>threading.Lock</code> to protect the sync state check-and-set.</li>
        <li><strong>Security</strong> &mdash; Multi-disc organize endpoint now validates individual filenames with <code>safe_filename()</code> before moving files, preventing path traversal via crafted filenames in the JSON request body.</li>
        <li><strong>Security</strong> &mdash; Rename-to-scraped endpoint now validates the generated filename with <code>safe_filename()</code> to catch metadata containing path separators (e.g. publisher &ldquo;Sega/Sammy&rdquo;).</li>
        <li><strong>Security</strong> &mdash; <code>/api/games/find</code> now escapes LIKE wildcards (<code>%</code>, <code>_</code>) in search queries.</li>
        <li><strong>Security</strong> &mdash; HLTB release year and rating badges in the game detail/edit modal are now passed through <code>escapeHtml()</code> for consistent XSS prevention.</li>
        <li><strong>Cleanup</strong> &mdash; Simplified avatar access logic in auth routes (replaced complex <code>hasattr/get/keys</code> conditionals with <code>dict(row).get()</code>).</li>
        <li><strong>Cleanup</strong> &mdash; Moved <code>import time</code> from function body to module level in games routes; added defensive null check on password change query.</li>
    </ul>

- version: 2.23.7
  date: 2026-02-14
  tags:
  - type: patch
    label: Cleanup
  body: |
    <h3>Code Audit &amp; Cleanup</h3>
    <ul>
        <li><strong>Fixed</strong> &mdash; ROM scan crash when a system folder exists in the filesystem but has no matching database entry (maintenance.py <code>fetchone()</code> without null check).</li>
        <li><strong>Security</strong> &mdash; PSN sync error state no longer exposes raw exception text to the client; a generic message is shown instead, with the real error logged server-side.</li>
        <li><strong>JS</strong> &mdash; API helper (<code>utils.js</code>) now checks <code>response.ok</code> before parsing JSON, preventing silent failures on HTTP error responses.</li>
        <li><strong>JS</strong> &mdash; Removed debug <code>console.log</code> statements from production code (theme.js hardware detection, keyboard shortcut init).</li>
        <li><strong>JS</strong> &mdash; Removed unused <code>VirtualScroll</code> helper from <code>page-lifecycle.js</code> (defined but never instantiated).</li>
        <li><strong>CSS</strong> &mdash; Added composite semi-transparent color variables (<code>--cyan-bg</code>, <code>--green-bg</code>, <code>--red-bg</code>, <code>--orange-bg</code>, <code>--purple-bg</code>, <code>--magenta-bg</code>) to <code>variables.css</code> for commonly repeated rgba patterns across the CSS codebase.</li>
    </ul>

- version: 2.23.6
  date: 2026-02-14
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <h3>Bulk Scrape Ignores Deleted Games</h3>
    <ul>
        <li><strong>Fixed</strong> &mdash; Deleting a game during a bulk scrape would not prevent the scraper from attempting to process it. The bulk scrape job pre-fetches all game data at the start for performance, so stale cached entries for deleted games were still used. Now verifies each game still exists in the database before scraping, cleanly skipping any that were removed mid-job.</li>
    </ul>

