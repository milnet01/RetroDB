    label: Bug Fix
  body: |
    <h3>Hybrid Scraper — Fallback Scrapers Now Match the Correct Game</h3>
    <ul>
        <li><strong>Fix</strong> &mdash; When selecting a game from search results (e.g. &ldquo;Rambo: First Blood Part II&rdquo;), fallback scrapers now use the selected game&rsquo;s title for matching instead of the bare ROM filename. Previously, a ROM named <code>Rambo (USA).zip</code> would cause fallback scrapers to match &ldquo;Rambo III&rdquo; (shorter title scored higher) instead of the correct game.</li>
        <li><strong>Fix</strong> &mdash; Secondary source selection now scores all candidates from each scraper by title similarity (including Roman numeral normalization) and picks the best match, instead of blindly using the first result.</li>
        <li><strong>Fix</strong> &mdash; Fixed &ldquo;Failed to apply metadata&rdquo; crash caused by a Python scoping issue where an inline <code>import os</code> inside a conditional branch shadowed the module-level import, causing an <code>UnboundLocalError</code> during region detection after fallback scraping completed.</li>
        <li><strong>Fix</strong> &mdash; Name Mismatch rename suggestions no longer duplicate parenthetical tags already present in the scraped title. For example, &ldquo;Armageddon (Ocean)&rdquo; with a <code>Title + (Year) + (Publisher)</code> convention now correctly suggests <code>Armageddon (1983) (Ocean).zip</code> instead of <code>Armageddon (Ocean) (1983) (Ocean).zip</code>. Files where the suggested name already matches the current filename are also filtered out.</li>
    </ul>

- version: 2.21.1
