  body: |
    <ul>
        <li><strong>Pass 41.1.A (HIGH) &mdash; <code>login_required</code> allow-list bypass removed</strong>. The decorator at <code>services/auth.py:204</code> short-circuited for <code>request.endpoint in ['auth.login', 'auth.api_login', 'static', 'help_page', 'changelog']</code>. Any future endpoint named <code>help_page</code> / <code>changelog</code> / <code>static</code> would have inherited a silent public bypass, regardless of intent. None of the current public routes apply <code>@login_required</code> in the first place, so the allow-list was dead weight + footgun. Dropped; public pages must simply not apply the decorator.</li>
        <li><strong>Pass 41.1.B (HIGH) &mdash; <code>api_change_password</code> rate bucket re-keyed</strong>. The endpoint shared the IP-only login bucket via <code>rate_limit_login(client_ip)</code> &mdash; meaning 5 failed change-password attempts from user A throttled <code>/api/login</code> for every other user on the same LAN. Now buckets on <code>f"{ip}:cpw:{user_id}"</code>: isolated from <code>/api/login</code> AND per-user (user A's failures don't block user B). MAX_ATTEMPTS budget unchanged.</li>
