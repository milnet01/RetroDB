    label: Enhancement
  - type: minor
    label: Performance
  body: |
    <h3>Database Optimization</h3>
    <ul>
        <li><strong>PRAGMA optimizations</strong>: Every database connection now enables WAL journal mode, NORMAL synchronous mode, 64 MB page cache, foreign key enforcement, and in-memory temp storage for faster reads and writes.</li>
        <li><strong>10 new indexes</strong>: Added indexes on <code>completion_status</code>, <code>has_retroachievements</code>, <code>genre</code>, <code>developer</code>, <code>publisher</code>, <code>franchise</code>, <code>release_date</code>, <code>critic_score</code>, plus composite indexes on <code>(system_id, scraped)</code> and <code>(system_id, is_bonus_disc)</code>. Filter dropdowns, analytics queries, and dashboard counts no longer require full table scans.</li>
        <li><strong>Startup PRAGMA optimize</strong>: Runs <code>PRAGMA optimize</code> on every startup to keep query planner statistics up to date automatically.</li>
        <li><strong>Database Optimization button</strong>: New button in Settings &rarr; Database Maintenance runs VACUUM (reclaims unused space) and ANALYZE (updates planner statistics), reporting database size before/after and duration.</li>
    </ul>

