- version: 2.79.0
  date: 2026-04-21
  tags:
  - type: enhancement
    label: New feature
  body: |
    <ul>
        <li><strong>Wishlist metadata scraping</strong> &mdash; Wishlist entries now carry full scraped metadata (boxart, description, release date, developer, publisher, genre, modes, player count, rating, critic score, franchise) instead of just a bare title. The <code>wishlist</code> table has been extended with the relevant columns plus <code>source</code>, <code>source_id</code>, <code>scrape_status</code>, <code>scraped_at</code>; migration is idempotent.</li>
        <li><strong>System dropdown with free-text fallback</strong> &mdash; The Add-to-Wishlist modal now shows a searchable list of all systems known to RetroDB (via <code>/api/systems</code>) so picks are typo-free and scraper-matchable via the new <code>wishlist.system_id</code> column. Users can still type a system RetroDB doesn't know about yet (e.g. &ldquo;Sony PlayStation 6&rdquo;) &mdash; it'll be saved as free text and the scraper searches proceed without a platform filter.</li>
        <li><strong>Three ways to trigger a scrape</strong> &mdash;
            <ul>
                <li><em>On add</em>: a &ldquo;Scrape metadata now&rdquo; checkbox (default on) fires a background scrape immediately after the item is saved, so the Add dialog closes instantly and the new card fills in within a few seconds.</li>
                <li><em>Per item</em>: a magnifier button on each row triggers a re-scrape (useful after an item's release or when RetroDB's scraper settings change).</li>
                <li><em>Bulk</em>: a page-level &ldquo;Scrape All (N)&rdquo; button processes every <code>unscraped</code> / <code>failed</code> / <code>no_match</code> item in the background.</li>
            </ul>
        </li>
        <li><strong>services/wishlist_scraper.py (new)</strong> &mdash; Thin orchestrator that calls <code>scraper_manager.search_games</code>, picks the best match from enabled scrapers, applies the primary source via the existing per-source <code>apply_tgdb_to_metadata</code> / <code>apply_igdb_to_metadata</code> / <code>apply_rawg_to_metadata</code> mergers, then iterates remaining supported scrapers to gap-fill. Image filenames are namespaced with a <code>w{id}</code> prefix so they never collide with owned-game boxart. ES-DE and ScreenScraper are deliberately excluded &mdash; they rely on local ROM context which wishlist entries don't have. Runs in a background thread so the HTTP response isn't blocked on network I/O.</li>
        <li><strong>Wishlist UI refresh</strong> &mdash; Cards now show a boxart thumbnail, a scrape-status badge (Unscraped / Scraping / Scraped / Failed / No Match), and a chip row with release / dev / pub / genre / rating / critic score. The page polls every 3 s while anything is mid-scrape and then auto-stops. For unreleased / upcoming games, fields the scraper didn't find (release date, critic score, rating) simply stay empty &mdash; the entry still has a title, system, and notes.</li>
        <li><strong>New API routes</strong> &mdash; <code>POST /api/wishlist/&lt;id&gt;/scrape</code> (single item re-scrape), <code>POST /api/wishlist/scrape-all</code> (bulk unscraped). The existing <code>POST /api/wishlist</code> now accepts an optional <code>scrape: true</code> flag for the add-and-scrape flow, plus a <code>system_id</code> field for dropdown picks.</li>
        <li><strong>DB indexes</strong> &mdash; Added <code>idx_wishlist_scrape_status</code> and <code>idx_wishlist_system_id</code>.</li>
    </ul>

- version: 2.78.1
  date: 2026-04-21
  tags:
  - type: bugfix
    label: Bug fix
  body: |
    <ul>
        <li><strong>Fixed: trophy loader crashed on every page with <code>module 'defusedxml.ElementTree' has no attribute 'Element'</code></strong> &mdash; <code>scraper/trophy_parser.py</code> was type-annotating two methods as <code>elem: ET.Element</code> against <code>defusedxml.ElementTree</code>, but <code>defusedxml</code> only re-exports parser functions (<code>fromstring</code>, <code>parse</code>, &hellip;), never the <code>Element</code> node class. The annotation was evaluated at class-definition time, so <em>importing</em> the module raised <code>AttributeError</code>, which the trophy scan / PS3 game list route caught and logged once per request. <code>Element</code> is now imported from stdlib <code>xml.etree.ElementTree</code> (safe: <code>Element</code> is just a data container, no parsing happens through it); actual XML parsing still goes through <code>defusedxml</code> for XXE protection.</li>
        <li><strong>Waitress: bumped thread pool 4 &rarr; 16, silenced the noisy queue-depth warnings</strong> &mdash; A single <code>/games</code> or <code>/dashboard</code> load fan-outs 20+ parallel XHRs (card data, fanart, per-row lookups), most of which queued behind each other on the old 4-thread pool and each queued request logged a <code>waitress.queue - WARNING - Task queue depth is N</code>. Every page navigation was dropping 30&ndash;50 of these into the terminal. Thread count raised to 16 (still tiny, comfortable headroom for a local single-user / small-household workload); <code>waitress.queue</code> logger level raised to <code>ERROR</code> so normal queueing at depth 1&ndash;2 is silent but genuine back-pressure would still surface.</li>
    </ul>

- version: 2.78.0
  date: 2026-04-21
  tags:
  - type: enhancement
    label: Performance
  body: |
    <ul>
        <li><strong>/analytics now cached</strong> &mdash; The analytics page runs ~20 aggregate queries and splits several comma-separated columns in Python (genre, franchise, developer, publisher, modes, perspective, dimension, save_type, region). On a multi-thousand-game library this was a hundreds-of-milliseconds hit on every refresh. The whole context is now built once and held in a 5-minute in-memory cache, invalidated explicitly on game edit, bulk edit, delete, and bulk-scrape completion &mdash; so repeat loads are near-free without ever going stale.</li>
        <li><strong>Bulk-scrape now invalidates filter dropdowns</strong> &mdash; <code>invalidate_filter_cache()</code> had been defined since v2.77.9 but never called, so after a bulk scrape finished writing new genres/franchises/developers the <code>/games</code> dropdown held the pre-scrape values for up to 60 s. The bulk-scrape completion path now flushes both the filter cache and the new analytics cache. Same wiring added to <code>/api/game/&lt;id&gt;/edit</code>, <code>/api/games/bulk-edit</code>, and <code>/api/delete-game/&lt;id&gt;</code>.</li>
        <li><strong>DB indexes</strong> &mdash; Added <code>idx_games_file_size</code> (speeds up the largest-games list and per-system storage aggregates), <code>idx_games_user_score</code> (review-score analytics), and <code>idx_games_players</code> (player-count grouping). Applied idempotently on next app start.</li>
        <li><strong>build_css.py / build_js.py now short-circuit</strong> &mdash; The mandatory post-edit "rebuild CSS/JS" steps in CLAUDE.md used to always re-read every source file and re-concatenate/re-minify, even when nothing touched them. Both scripts now compare source mtimes against output mtime and skip the rebuild when the bundle is already fresh; a <code>--force</code> flag bypasses the check.</li>
        <li><strong>/analytics route simplification</strong> &mdash; The route function is down from ~105 lines of 20 sequential helper calls + a 70-entry <code>render_template</code> kwarg list to 5 lines, thanks to the new <code>build_analytics_context()</code> in <code>services/analytics.py</code>. No change to the rendered page.</li>
    </ul>

