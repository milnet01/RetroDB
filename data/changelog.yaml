        <li><strong>TGDB Scraper: Bulk Platform Discovery</strong> &mdash; New <code>fetch_games_by_platform()</code> and <code>fetch_all_games_by_platform()</code> functions enable fetching all games for a platform in bulk with full pagination, useful for system-wide game discovery.</li>
