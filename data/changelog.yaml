- version: 1.16.0
  date: 2026/01/19
  tags:
  - type: major
    label: Major
  body: |
    <h3>✨ Multi-User Support</h3>
    <ul>
        <li><strong>User Authentication System</strong>:
            <ul>
                <li>Three user roles: Admin (full access), Editor (edit/scrape), Viewer (read-only)</li>
                <li>Simple click-to-login for non-admin users (local network friendly)</li>
                <li>Admin accounts require password authentication</li>
                <li>Dashboard and Analytics pages are public (no login required)</li>
            </ul>
        </li>
        <li><strong>Per-User Settings</strong>:
            <ul>
                <li>Each user can configure their own RPCS3 Trophy path</li>
                <li>Each user can configure their own RetroAchievements username and API key</li>
                <li>Trophies and Achievements pages show per-user data based on their configured credentials</li>
                <li>Global RA credentials still used for checking which games have achievements</li>
            </ul>
        </li>
        <li><strong>User Management (Admin)</strong>:
            <ul>
                <li>Create, edit, and delete users from Settings page</li>
                <li>Change roles and reset passwords</li>
                <li>View user status including last login and configured paths</li>
            </ul>
        </li>
        <li><strong>Role-Based Access Control</strong>:
            <ul>
                <li>API Keys section: Admin only</li>
                <li>Maintenance section: Admin only</li>
                <li>Server Controls: Admin only</li>
                <li>Delete ROM files: Admin only</li>
                <li>Edit game metadata: Editor and Admin</li>
                <li>Delete game metadata: Editor and Admin</li>
                <li>Scrape games: Editor and Admin</li>
            </ul>
        </li>
    </ul>
    <h3>🔧 Technical Changes</h3>
    <ul>
        <li>New database tables: users, user_settings</li>
        <li>Session-based authentication with Flask</li>
        <li>New login page at /login with user selection</li>
        <li>User indicator in sidebar showing logged-in user</li>
        <li>Added get_user_game_progress_custom() for per-user RA credentials</li>
        <li>Decorators: @login_required, @admin_required, @editor_required</li>
    </ul>
    <h3>⚠️ Important Notes</h3>
    <ul>
        <li>Default admin account created automatically (username: admin, password: admin)</li>
        <li><strong>Please change the admin password after first login!</strong></li>
        <li>Existing installations will have an admin account auto-created on first run</li>
    </ul>
