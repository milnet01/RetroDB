- version: 2.48.0
  date: 2026-02-28
  tags:
  - type: enhancement
    label: Enhancement
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Site-Wide Standards Compliance Audit</strong> &mdash; Comprehensive audit and remediation across the entire codebase to enforce design standards.</li>
        <li><strong>Security: XSS Hardening</strong> &mdash; Wrapped all 28 unescaped <code>innerHTML</code> injection points with <code>escapeHtml()</code> across settings, base template, setup wizard, CHD tools, archive scanner, and achievements pages.</li>
        <li><strong>Security: Error Disclosure</strong> &mdash; Replaced 17 instances of <code>str(e)</code> in API error responses with generic messages in collections, maintenance, and collector trophies routes. Actual exceptions are logged server-side only.</li>
        <li><strong>Security: Auth Decorators</strong> &mdash; Added missing auth decorators to 4 RA refresh routes in achievements.py. Upgraded RA refresh, cancel, and clear operations from <code>@login_required</code> to <code>@admin_required</code> in both achievements.py and ra_sync.py.</li>
        <li><strong>CSS: Variable Compliance</strong> &mdash; Replaced 30+ hardcoded hex colors with CSS variables across game-list, pages, trophies, game-modals, and game-cards CSS. Added new CSS variables for trophy display colors, rating system colors, and completion status.</li>
        <li><strong>CSS: Transition Variables</strong> &mdash; Replaced 32 hardcoded transition timing values with <code>--transition-fast</code> / <code>--transition-normal</code> / <code>--transition-slow</code> variables across 8 CSS files.</li>
        <li><strong>CSS: Deduplicated Inline Styles</strong> &mdash; Extracted ~260 lines of duplicated inline CSS from Steam/Xbox achievement templates into external <code>achievements.css</code>.</li>
        <li><strong>Number Formatting</strong> &mdash; Fixed 39 instances of unformatted numbers and ratios across 8 templates (PSN trophies, game imports, archive scanner, duplicate finder, CHD converter, multi-disc organizer, Steam/Xbox achievements). All now use <code>formatNumber()</code> with proper <code>X / Y</code> ratio spacing.</li>
        <li><strong>Toggle Switches</strong> &mdash; Converted 6 bare checkboxes to standard toggle switches in ROM tools settings and setup wizard.</li>
        <li><strong>API Response Format</strong> &mdash; Added missing <code>success</code> field to 12 API endpoints in games.py for consistent response format.</li>
    </ul>

- version: 2.47.1
  date: 2026-02-28
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Bulk Scrape Progress Counter Off-by-One</strong> &mdash; Fixed the game counter above the progress bar (in both the modal and the background toast) showing the number of the game that just finished instead of the game currently being processed. For example, after skipping game 1, the counter now correctly shows &ldquo;2 / 707&rdquo; for the next game instead of staying at &ldquo;1 / 707&rdquo;.</li>
        <li><strong>PSN Refresh Toast Layout</strong> &mdash; The NPWR ID code in the PSN Refresh toast now displays on its own line below the game title instead of being appended inline with a dash separator.</li>
    </ul>

- version: 2.47.0
  date: 2026-02-27
  tags:
  - type: feature
    label: New Feature
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>PSN Token Caching</strong> &mdash; PSN OAuth tokens (access + refresh) are now cached to <code>data/psn_tokens.json</code>. After entering your NPSSO once, authentication persists for ~2 months via the refresh token without needing to re-enter the NPSSO cookie. Tokens are automatically refreshed, validated on use, and cleared when expired.</li>
        <li><strong>PSN Bulk Refresh Stuck at 0%</strong> &mdash; Fixed PSN bulk trophy refresh hanging indefinitely with no progress. Root cause: <code>psnawp</code> 3.x has inverted rate limiter logic (<code>if try_acquire(): raise TooManyRequests</code>) which blocked ALL API requests when the previous <code>pyrate_limiter</code> patch made <code>try_acquire</code> return <code>True</code> (success). Patch now returns <code>False</code> to bypass the broken check entirely; RetroDB&rsquo;s own 2.5s delay between games provides sufficient rate limiting.</li>
    </ul>

- version: 2.46.5
  date: 2026-02-27
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>PSN API Rate Limiter Fix</strong> &mdash; Fixed <code>NotImplementedError: timeout not implemented for sync try_acquire yet</code> caused by <code>pyrate_limiter</code> 4.x incompatibility with <code>psnawp</code> 3.0.2 on Python 3.14. The rate limiter&rsquo;s <code>try_acquire</code> method is monkey-patched at import time to strip the unsupported <code>timeout</code> parameter, restoring PSN trophy sync and refresh functionality.</li>
    </ul>

- version: 2.46.4
  date: 2026-02-27
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Proper Resume for All Background Jobs</strong> &mdash; All background jobs now properly resume from where they left off after a server restart instead of restarting from scratch. Affected jobs: RA Sync, RA Refresh, Steam Achievement Sync, Xbox Achievement Sync. Each now persists game IDs at job start, skips already-processed items via None placeholders on resume, and restores progress counts (success/failed/skipped).</li>
        <li><strong>Steam &amp; Xbox Sync Dashboard Recovery</strong> &mdash; Steam and Xbox achievement sync jobs are now registered in the dashboard recovery handler, so interrupted syncs appear in the recovery banner and can be resumed.</li>
    </ul>

- version: 2.46.3
  date: 2026-02-27
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>PSN Refresh Proper Resume</strong> &mdash; PSN trophy refresh now properly resumes from where it left off after a server restart, skipping already-synced games. Previously it restarted from scratch. Uses the same placeholder pattern as Bulk Scrape: progress counts (success/failed/skipped) and the current index are restored from persisted state.</li>
    </ul>

- version: 2.46.2
  date: 2026-02-27
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>PSN Refresh Logging</strong> &mdash; Added detailed progress logging during the PSN trophy title fetch phase. The fetch now logs every 25 titles found and updates the status with a live count. Error tracebacks are now logged on individual game sync failures. Increased the trophy list fetch timeout from 2 minutes to 5 minutes to accommodate large PSN libraries.</li>
        <li><strong>Toast Notification for Fast Failures</strong> &mdash; Fixed a bug where background jobs that completed (or failed) before a toast was ever displayed would silently disappear with no feedback. Now shows an error/success notification even if the toast was never rendered.</li>
    </ul>

- version: 2.46.1
  date: 2026-02-27
  tags:
  - type: fix
    label: UI Tweak
  body: |
    <ul>
        <li><strong>Dashboard Heading Clarity</strong> &mdash; Changed "Your Systems" heading to "Top Systems by Game Count" to make it clear that the section shows systems ranked by number of games.</li>
    </ul>

- version: 2.46.0
  date: 2026-02-27
  tags:
  - type: feature
    label: New Feature
  body: |
    <ul>
        <li><strong>Steam Achievements Page</strong> &mdash; New dedicated page for viewing Steam achievement progress. Landing page shows all synced Steam games with progress bars, plus per-game detail pages with individual unlocked/locked achievements and icons.</li>
        <li><strong>Xbox Achievements Page</strong> &mdash; Same pattern as Steam with gamerscore display. Per-achievement gamerscore badges (gold for earned, grey for locked). Landing page shows overall gamerscore totals.</li>
        <li><strong>Individual Achievement Sync</strong> &mdash; Steam and Xbox sync jobs now save individual achievement data (name, description, icons, unlock status) to new database tables, not just summary counts.</li>
        <li><strong>Consolidated Game Imports</strong> &mdash; Merged CLZ Import, Steam Import, and Xbox Import into a single tabbed "Game Imports" page under Tools. Added PSN Import tab (placeholder for future implementation). Old URLs redirect to the new page.</li>
        <li><strong>Sidebar Updates</strong> &mdash; Added Steam Achievements and Xbox Achievements entries under Trophies &amp; Achievements. Replaced separate CLZ Import and Steam &amp; Xbox links with unified Game Imports.</li>
    </ul>

- version: 2.45.0
  date: 2026-02-27
  tags:
  - type: feature
    label: Enhancement
  body: |
    <ul>
        <li><strong>Engine System Type</strong> &mdash; Added new "Engine" system type category for game engines, frameworks, and fantasy consoles (ScummVM, PICO-8, Doom, AGS, M.U.G.E.N., etc.). Engine systems now appear with a distinct gold tag across all pages (Systems, Dashboard, Library, Museum, Settings).</li>
        <li><strong>Complete System Type Classification</strong> &mdash; All 191 systems now have a type assigned. Previously 61 systems were unclassified. Fixed PC-FX from Computer to Console.</li>
        <li><strong>Windows System Merge</strong> &mdash; Merged Windows 3.x and Windows 9x into a single "Microsoft Windows" system. All games consolidated under one entry.</li>
        <li><strong>SYSTEM_TYPE_MAP Expansion</strong> &mdash; Added 60+ new folder mappings to ensure auto-detection covers all known systems including regional variants (megadrivejp, saturnjp, sega32xjp, etc.).</li>
    </ul>

- version: 2.44.5
  date: 2026-02-26
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Bulk Scrape Proper Resume</strong> &mdash; Server-restart resume now continues from exactly where it left off instead of re-iterating every game. The full <code>game_ids</code> list and <code>return_url</code> are persisted at job start, and <code>resume_from_params</code> restores progress counts and skips already-processed games via placeholders (matching the existing queue demotion/promotion pattern). Eliminates double-counting, preserves prior progress info, and avoids unnecessary cooldown-based skipping.</li>
    </ul>

- version: 2.44.4
  date: 2026-02-26
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Bulk Scrape Resume Double-Count</strong> &mdash; Fixed processed count exceeding total (e.g. 815 / 759) after a server-restart resume. Previously, <code>resume_from_params</code> restored prior success/failed counts, but the cooldown mechanism also re-skipped those same games, double-counting them. Removed the count restoration since cooldown naturally accounts for all previously-processed games.</li>
    </ul>

- version: 2.44.3
  date: 2026-02-26
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Bulk Scrape Progress Counter</strong> &mdash; Fixed the toast and modal progress display showing the loop index instead of the actual processed count (success + failed + skipped). After a server-restart resume, restored success/failed counts caused the displayed counter and percentage to disagree (e.g. showing 342 / 759 at 86%). Now correctly shows processed / total so the numbers match the percentage.</li>
    </ul>

- version: 2.44.2
  date: 2026-02-26
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Dashboard System Type Badge Colors</strong> &mdash; System type badges on the dashboard now use color-coded variants matching the systems page: cyan for Console, green for Handheld, purple for Computer, and orange for Arcade (previously all badges were purple).</li>
    </ul>

- version: 2.44.1
  date: 2026-02-26
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>ROM Reports Rename Fix</strong> &mdash; Fixed suggested filenames containing filesystem-unsafe characters (e.g. <code>/</code>) from tag values like region, publisher, developer, or genre. Characters such as <code>/</code>, <code>\</code>, <code>:</code>, and <code>|</code> in tag values are now sanitized using the same rules as titles, preventing broken rename operations (e.g. <code>USA/Europe</code> &rarr; <code>USA-Europe</code>).</li>
    </ul>

- version: 2.44.0
  date: 2026-02-26
  tags:
  - type: feature
    label: New Feature
  body: |
    <ul>
        <li><strong>Steam & Xbox Import</strong> &mdash; New import page (Tools &rarr; Steam &amp; Xbox) to import game libraries from Steam and Xbox into RetroDB. Steam games are assigned to the Microsoft Windows system; Xbox games are split by platform (Xbox, 360, One, Series X) based on the API response. Duplicate detection checks both platform IDs and normalized title matching against existing games (including CLZ imports).</li>
        <li><strong>Steam Achievement Sync</strong> &mdash; Sync achievement progress for all imported Steam games via background job. Shows earned/total counts and completion percentages.</li>
        <li><strong>Xbox Achievement Sync</strong> &mdash; Sync Xbox achievement progress (gamerscore) for all imported Xbox games. Requires Azure AD app registration with Xbox Live API permissions and OAuth2 authentication flow.</li>
        <li><strong>API Key Settings</strong> &mdash; Added Steam Web API Key, Steam ID, Xbox Client ID, and Xbox Client Secret fields to the Settings &rarr; API Keys section.</li>
    </ul>

- version: 2.43.2
  date: 2026-02-26
  tags:
  - type: feature
    label: Enhancement
  body: |
    <ul>
        <li><strong>AI Provider Rate Limits</strong> &mdash; The &ldquo;Check Rate Limits&rdquo; button on the Settings page now includes the active AI provider (Gemini, OpenAI, or Claude). Shows requests remaining, token limits, and reset times where available from the provider&rsquo;s API response headers.</li>
    </ul>

- version: 2.43.1
  date: 2026-02-26
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>RAWG Platform Fallback</strong> &mdash; RAWG now falls back to searching without the platform filter when platform-filtered results return empty. This fixes RAWG showing &ldquo;No results&rdquo; for retro systems like C64 where RAWG has poor platform coverage.</li>
        <li><strong>DB Lock Fix</strong> &mdash; Background jobs (RA Refresh, RA Sync, PSN Refresh) now commit pending writes before persisting progress, eliminating SQLite write lock contention that caused &ldquo;DB locked&rdquo; warnings.</li>
        <li><strong>Game Detail Page Fix</strong> &mdash; Fixed &ldquo;cannot access local variable &lsquo;json&rsquo;&rdquo; error on the game detail page caused by a redundant local import shadowing the module-level import.</li>
        <li><strong>RAWG Source Map</strong> &mdash; Added RAWG and ScreenScraper to the hybrid scraper source map so they can be properly selected via the new metadata checkboxes.</li>
        <li><strong>PSN Bulk Refresh Timeout</strong> &mdash; Added a 2-minute timeout to the PSN trophy list pre-fetch, which could hang indefinitely if Sony&rsquo;s API was slow or unresponsive. The toast now shows &ldquo;Authenticating with PSN&hellip;&rdquo; and &ldquo;Fetching PSN trophy list&hellip;&rdquo; status messages during startup. Added PSNAWP to requirements.txt for future installs.</li>
    </ul>

- version: 2.43.0
  date: 2026-02-26
  tags:
  - type: feature
    label: New Feature
  body: |
    <ul>
        <li><strong>Search Metadata Selection Checkboxes</strong> &mdash; When searching metadata, each result now has a radio-style checkbox. Select the correct match per scraper column before clicking Apply to control exactly which secondary sources are used for gap-filling, preventing the hybrid scraper from auto-picking the wrong game (e.g. &ldquo;Strike Force Cobra&rdquo; instead of &ldquo;Cobra&rdquo;). When no checkboxes are ticked, existing auto-match behavior is preserved.</li>
        <li><strong>RAWG Fuzzy Search Fallback</strong> &mdash; When RAWG&rsquo;s precise search returns zero results, the scraper now automatically retries with a fuzzy search. This fixes cases where games like &ldquo;Cobra&rdquo; on C64 returned no RAWG results.</li>
    </ul>

- version: 2.42.0
  date: 2026-02-24
  tags:
  - type: feature
    label: New Feature
  body: |
    <ul>
        <li><strong>Dashboard Job Recovery Banner</strong> &mdash; Background jobs (bulk scrape, RA refresh, RA sync, PSN refresh) that are interrupted by a server restart now appear as a recovery banner on the dashboard instead of silently auto-resuming. Each interrupted or queued job shows a human-readable description with Resume and Dismiss buttons, giving you full control over what gets restarted.</li>
        <li><strong>Bulk Scrape Queue Persistence</strong> &mdash; Queued bulk scrape jobs are now persisted to the database and survive server restarts. Previously, queued jobs were stored in memory only and lost on restart. Queued jobs appear alongside interrupted jobs in the dashboard recovery banner.</li>
    </ul>

- version: 2.41.4
  date: 2026-02-24
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Dashboard Crash Fix</strong> &mdash; Fixed &ldquo;dict object has no attribute system_id&rdquo; error on the dashboard. Two queries (recent games, recently scraped) were missing the <code>system_id</code> column needed by the template&rsquo;s system links.</li>
    </ul>

- version: 2.41.3
  date: 2026-02-24
  tags:
  - type: enhancement
    label: Enhancement
  body: |
    <ul>
        <li><strong>Duplicate Bulk Scrape User Feedback</strong> &mdash; When a bulk scrape is rejected because the same system and mode is already running or queued, a clear warning notification explains why and suggests selecting a different scrape mode. Previously, the raw internal mode name was shown in a generic error modal.</li>
    </ul>

- version: 2.41.2
  date: 2026-02-24
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Smarter Duplicate Bulk Scrape Detection</strong> &mdash; Duplicate queue prevention now checks both system <em>and</em> scrape mode. You can now queue a &ldquo;full re-scrape&rdquo; for the same system that already has a &ldquo;fill missing&rdquo; running or queued, but identical system+mode combinations are still rejected.</li>
    </ul>

- version: 2.41.1
  date: 2026-02-24
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Duplicate Bulk Scrape Queue Prevention</strong> &mdash; The bulk scrape job manager now rejects requests to queue a scrape for a system that is already running or already queued. Previously, it was possible for a phantom duplicate queue entry to appear for the same system, showing a confusing second queued toast alongside the active scrape.</li>
        <li><strong>Dashboard System Links</strong> &mdash; Clicking a system name in the &ldquo;Recently Added&rdquo; and &ldquo;Recently Scraped&rdquo; dashboard sections now navigates to the system&rsquo;s game list instead of the individual game detail page. The &ldquo;Recently Viewed&rdquo; section already had this behavior.</li>
    </ul>

- version: 2.41.0
  date: 2026-02-24
  tags:
  - type: feature
    label: New Feature
  body: |
    <ul>
        <li><strong>Configurable Bulk Scrape Match Filtering</strong> &mdash; The minimum match score threshold for bulk scraping is now user-configurable from Settings &rarr; Scraping. Two modes are available: <strong>Simple</strong> (default) sets a single numeric score threshold with a reference guide explaining what each score range means, and <strong>Advanced</strong> lets you define criteria-based rules &mdash; minimum title quality level (exact, close, partial, any) plus an optional platform match requirement. The default threshold has been raised from 80 to 200, which requires at least a close title match with platform confirmation, significantly reducing false-positive scrape matches.</li>
    </ul>

- version: 2.40.0
  date: 2026-02-24
  tags:
  - type: enhancement
    label: Enhancement
  body: |
    <ul>
        <li><strong>Real-ESRGAN Backend Switched to ONNX Runtime</strong> &mdash; Replaced the PyTorch/basicsr upscaling backend with ONNX Runtime. This fixes installation failures on Python 3.14 (where <code>basicsr</code> cannot build), removes the ~2 GB PyTorch dependency chain, and provides the same Real-ESRGAN x4plus upscaling quality. The ONNX model (~67 MB) is auto-downloaded from Hugging Face on first use. GPU acceleration is still supported via the CUDA execution provider when <code>onnxruntime-gpu</code> is installed.</li>
    </ul>

- version: 2.39.3
  date: 2026-02-24
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Bulk Scrape Stats Carry Over on Auto-Resume</strong> &mdash; When a bulk scrape job is auto-resumed after a server restart, the success and failed counts from the previous session are now restored from persisted progress data. Previously, counters reset to zero on resume, making it look like no work had been done. Skipped count is not restored since the 24-hour cooldown mechanism naturally re-skips already-processed games.</li>
    </ul>

- version: 2.39.2
  date: 2026-02-24
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Auto-Resumed Jobs Invisible in Debug Mode</strong> &mdash; Fixed background jobs (bulk scrape, RA sync/refresh, PSN refresh) auto-resumed after a server restart running in the wrong process when Flask debug mode is active. Flask&rsquo;s reloader spawns two processes; the auto-resume was executing in the reloader (parent) process while HTTP requests are handled by the worker (child) process. The job singletons in the worker had <code>running=False</code>, so the status API reported no active job and the toast never appeared. The scraping was actually happening, but silently in the background with no UI feedback. Auto-resume is now guarded to only run in the worker process.</li>
        <li><strong>Reduced DB Lock Contention</strong> &mdash; The above fix also eliminates a source of &ldquo;database is locked&rdquo; errors that occurred because the scraper thread in the reloader process competed for SQLite locks with the worker process serving HTTP requests.</li>
    </ul>

- version: 2.39.1
  date: 2026-02-23
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Database Locking During Bulk Scrape</strong> &mdash; Fixed &ldquo;database is locked&rdquo; errors that caused scrape results to be silently dropped. All scraper modules (ES-DE, IGDB, TheGamesDB, hybrid scraper, ROM scanner) now use a centralized connection helper with WAL journal mode and a 30-second busy timeout, matching the background job infrastructure. Previously each scraper created raw connections with only a 10-second timeout and no WAL pragma.</li>
        <li><strong>Bulk Scrape Toast Not Appearing</strong> &mdash; Fixed the persistent progress toast not showing when navigating away from the page that started a bulk scrape. The <code>bulkScrapeJustStarted</code> localStorage flag is now consumed on page load to immediately switch to active (2-second) polling. Also fixed a gap where polling could stop entirely after 5 minutes idle and never restart when a job began, and added diagnostic logging for silent poll failures.</li>
    </ul>

- version: 2.39.0
  date: 2026-02-23
  tags:
  - type: feature
    label: New Feature
  body: |
    <ul>
        <li><strong>Volumetric Noise Smoke Effect</strong> &mdash; Replaced the particle-based tendril/wisp smoke system with a noise-based volumetric renderer. Uses simplex noise with fractal Brownian motion rendered to a downscaled offscreen buffer (1/6 to 1/10 resolution depending on hardware tier), then upscaled with bilinear interpolation for smooth, organic-looking billowing clouds. Features upward-scrolling turbulence, a vertical density gradient (dense at bottom, dissipating upward), and neon color region tinting on high/medium tiers. State persistence is simplified to just the time coordinate. The fallback blob system for very low-end hardware is unchanged.</li>
    </ul>

- version: 2.38.1
  date: 2026-02-23
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Analytics Nav Scroll Spy</strong> &mdash; Fixed <code>StickyScroll is not defined</code> error on the analytics page. The nav scroll spy IIFE was executing before the bundle loaded; wrapped it in <code>DOMContentLoaded</code> with a safety guard for <code>StickyScroll</code>.</li>
    </ul>

- version: 2.38.0
  date: 2026-02-23
  tags:
  - type: feature
    label: New Feature
  body: |
    <ul>
        <li><strong>Cyberpunk Smoke Effect Upgrade</strong> &mdash; Replaced the soft mist blobs on high/medium/low hardware tiers with a proper smoke particle system. Rising smoke tendrils emerge from emitter points along the bottom edge, curling upward with layered sine-wave turbulence and expanding as they rise. Drifting smoke wisps float across the screen as stretched, slowly rotating ellipses for ambient atmosphere (high and medium tiers). The previous mist blob system is preserved as the fallback for very low-end hardware. State persistence, resize handling, and cleanup all updated for the new particle format.</li>
    </ul>

- version: 2.37.1
  date: 2026-02-23
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Dashboard Bulk Scrape Polling</strong> &mdash; Fixed 404 error on the dashboard caused by polling a non-existent <code>/api/bulk-scrape-status</code> endpoint. Now correctly calls <code>/api/bulk-scrape-job/status</code>.</li>
        <li><strong>Dashboard Nav Scroll Spy</strong> &mdash; Fixed <code>StickyScroll is not defined</code> error on the dashboard. The nav scroll spy IIFE was executing before the bundle loaded; wrapped it in <code>DOMContentLoaded</code> with a safety guard for <code>StickyScroll</code>.</li>
    </ul>

- version: 2.37.0
  date: 2026-02-23
  tags:
  - type: feature
    label: New Feature
  body: |
    <ul>
        <li><strong>Graphical Installer</strong> &mdash; New GUI setup wizard (<code>install_gui.py</code>) with dark cyberpunk theme, step-by-step progress indicators, live log output, and a &ldquo;Launch RetroDB&rdquo; button on completion. Run <code>./setup.sh</code> to start &mdash; it auto-detects your Linux distro, installs Python/pip/tkinter if missing, then launches the graphical installer. Falls back to the CLI installer if GUI can&rsquo;t be set up.</li>
        <li><strong>Improved CLI Installer</strong> &mdash; Rewrote <code>install.py</code> for a better first-run experience. Now auto-detects Linux distro family (Fedora/Nobara, Debian/Ubuntu, Arch) and gives distro-specific guidance when pip is missing. Added JS bundle building, optional Pillow installation, colored output, per-module verification, and additional directory creation (trophies, avatars, hardware, videos).</li>
    </ul>

- version: 2.36.8
  date: 2026-02-23
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Auto-Resume Job Snowball Fix</strong> &mdash; Fixed a critical bug where interrupted background jobs accumulated stale &ldquo;running&rdquo; rows in the job queue on each server restart. The old logic created a new row on resume but never cleared the original, causing exponential job launches (e.g., 8 concurrent jobs after a few restarts). Now all interrupted rows are marked as failed <em>before</em> any resume attempt, only the most recent job per type is resumed, and staggered 5-second delays between launches prevent hammering the DB and APIs simultaneously.</li>
    </ul>

- version: 2.36.7
  date: 2026-02-23
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>SQLite Write Lock Contention Fix</strong> &mdash; Dramatically reduced database lock contention when 3+ background jobs run simultaneously (Bulk Scrape + RA Refresh + PSN Refresh). PSN Refresh now performs all network I/O (API calls, image downloads) <em>before</em> acquiring the write lock, reducing lock hold time from 10&ndash;60+ seconds per game to under 1 second. RA Sync batch commit size reduced from 10 to 3 games for shorter lock windows. All three jobs now rollback uncommitted changes on failure to prevent cascading lock errors. Job progress persistence retries increased for better tolerance under load.</li>
    </ul>

- version: 2.36.6
  date: 2026-02-23
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Queued Bulk Scrape Cancel Fix</strong> &mdash; Fixed a bug where cancelling a queued bulk scrape toast had no effect &mdash; the toast would reappear on every page navigation. The cancel button was calling the wrong API endpoint (<code>/api/bulk-scrape-job/queue/.../cancel</code> instead of <code>/api/bulk-scrape-job/cancel-queued/...</code>), causing a silent 404. The next poll would re-create the toast from the still-present server queue.</li>
    </ul>

- version: 2.36.5
  date: 2026-02-23
  tags:
  - type: feature
    label: New Feature
  body: |
    <ul>
        <li><strong>Auto-Resume Background Jobs</strong> &mdash; Background jobs (Bulk Scrape, RA Refresh, RA Sync, PSN Refresh) now automatically resume after a server restart instead of being marked as failed. On startup, interrupted jobs are detected and restarted in a background thread with a short delay. Each job re-derives its work list from the database and uses existing skip mechanisms (24-hour cooldown, sync timestamps) to avoid reprocessing already-completed items. Jobs that cannot be resumed (e.g., missing API credentials) are gracefully marked as failed.</li>
    </ul>

- version: 2.36.4
  date: 2026-02-23
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>DB Lock Retry on Commit</strong> &mdash; Added retry-with-backoff to all <code>conn.commit()</code> calls in background job loops. The v2.36.1 fix used persistent connections to reduce lock frequency, but commits could still fail under heavy concurrent writes. All 5 bulk jobs (Bulk Scrape, RA Refresh, RA Sync, PSN Refresh, PSN Sync) now retry up to 5 times with exponential backoff when a commit is blocked by another writer.</li>
    </ul>

- version: 2.36.3
  date: 2026-02-23
  tags:
  - type: enhancement
    label: Enhancement
  body: |
    <ul>
        <li><strong>Bulk Scrape 24-Hour Cooldown</strong> &mdash; Games processed during a bulk scrape (success, skipped, or no results) are now timestamped. If you stop a bulk scrape and restart it within 24 hours, previously processed games are automatically skipped, avoiding redundant API calls and wasted time. The cooldown is ignored in Full Re-scrape mode. Single-game scrapes from the game detail page are unaffected.</li>
    </ul>

- version: 2.36.2
  date: 2026-02-23
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>ROM Tools Path Fix</strong> &mdash; Fixed all ROM Tools (Duplicate Finder, Archive Scanner, CHD Converter, CHD Verify, Multi-Disc Organizer) failing with "Invalid scan path" when the ROM path is configured via the Settings page. The tools were reading the empty default from <code>config.py</code> instead of the user-configured path from <code>settings.json</code>.</li>
    </ul>

- version: 2.36.1
  date: 2026-02-23
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>SQLite Lock Contention Fix</strong> &mdash; Fixed "database is locked" errors when running multiple background jobs simultaneously. All 5 bulk operations (Bulk Scrape, RA Refresh, RA Sync, PSN Refresh, PSN Sync) now reuse a single persistent DB connection with batch commits instead of opening/closing connections for every game update. Also increased busy_timeout from 5s to 30s for background threads, added missing performance PRAGMAs, wrapped job persistence functions with retry-on-locked logic, and added try/finally guards to ensure connections are always closed.</li>
    </ul>

- version: 2.36.0
  date: 2026-02-23
  tags:
  - type: feature
    label: New Feature
  body: |
    <ul>
        <li><strong>Universal Log Viewer</strong> &mdash; The log viewer now supports all 5 log categories (Scraping, ROM Tools, Reports, Image Resize, System) instead of only scraping logs. Category tabs with file count badges let you quickly filter between log types. The viewer auto-selects the best view mode: grouped sessions for scraping logs, flat view for everything else. Download and delete buttons are available directly from the toolbar. The page has moved from <code>/scrape-logs</code> to <code>/logs</code> (old URL redirects automatically).</li>
    </ul>

- version: 2.35.2
  date: 2026-02-22
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>rembg GPU Fallback</strong> &mdash; Fixed background removal failing silently when the ROCm/CUDA GPU provider is detected but lacks compatible kernels for the installed GPU. The system now automatically retries with CPU when the GPU provider fails at runtime, instead of skipping background removal entirely.</li>
    </ul>

- version: 2.35.1
  date: 2026-02-22
  tags:
  - type: enhancement
    label: Enhancement
  body: |
    <ul>
        <li><strong>Museum Controller Image Tooltip</strong> &mdash; Hovering over a controller image on the museum system page now shows the image filename as a tooltip, making it easy to identify which file is being used.</li>
    </ul>

- version: 2.35.0
  date: 2026-02-22
  tags:
  - type: feature
    label: New Feature
  - type: enhancement
    label: Enhancement
  body: |
    <ul>
        <li><strong>GPU-Accelerated Image Processing</strong> &mdash; Real-ESRGAN upscaling and rembg background removal now automatically detect and use the best available hardware. NVIDIA GPUs (CUDA), AMD GPUs (ROCm), and Apple Silicon (MPS) are detected at startup with a CPU fallback. Half precision (FP16) is automatically enabled for CUDA GPUs. The detected device is logged on first use so you can verify your GPU is being utilized.</li>
        <li><strong>Museum Controller Upload Feedback</strong> &mdash; Uploading a controller image (or removing its background) now shows a translucent overlay with a spinner and status message ("Uploading &amp; removing background&hellip;" / "Uploading&hellip;" / "Removing background&hellip;") over the controller card, so you know the operation is in progress. Previously there was no visible feedback when a controller already had an image, leaving the UI seemingly frozen for 60+ seconds during background removal.</li>
    </ul>

- version: 2.34.6
  date: 2026-02-20
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Real-ESRGAN Torchvision Fix</strong> &mdash; Fixed Real-ESRGAN upscaling being disabled on newer torchvision versions (0.25+). The compatibility shim for the removed <code>torchvision.transforms.functional_tensor</code> module now registers in <code>sys.modules</code> so that <code>from ... import</code> statements in basicsr resolve correctly.</li>
        <li><strong>Real-ESRGAN Model Path Fix</strong> &mdash; Fixed Real-ESRGAN failing to initialize because <code>model_path</code> was set to <code>None</code>. Now resolves the model weights from the local cache (<code>~/.cache/realesrgan/</code>) first, falling back to the official GitHub download URL.</li>
    </ul>

- version: 2.34.5
  date: 2026-02-20
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Image Resize Toast Stuck</strong> &mdash; Fixed the Image Resize toast notification getting permanently stuck after completion. The completion deduplication key used a <code>job_id</code> that the Image Resize job never provided, causing it to default to &ldquo;unknown&rdquo; and block all future completions via stale localStorage. Now falls back to <code>start_time</code> for a unique key per run.</li>
        <li><strong>Toast Final State Update</strong> &mdash; All job toasts (Image Resize, Bulk Scrape, RA Sync, etc.) now perform a final content update when the job completes, showing accurate final counts, 100% progress, and a &ldquo;Complete&rdquo; title with green border before auto-dismissing. Previously, if a job finished between poll cycles, the toast would freeze showing stale mid-run data.</li>
    </ul>

- version: 2.34.4
  date: 2026-02-20
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Stale Media File Recovery</strong> &mdash; During scraping, media fields (boxart, boxart 3D, fanart, screenshots, video, manual) are now validated against the actual files on disk. If a file was deleted but the database still referenced it, the stale reference is cleared so scrapers can re-download fresh media instead of preserving a broken link.</li>
        <li><strong>Broken Screenshots Cleanup</strong> &mdash; Individual screenshot filenames are now checked for existence on disk. Missing screenshots are automatically filtered out of the comma-separated list, preventing broken image links on the game detail page.</li>
        <li><strong>Players Normalization</strong> &mdash; Player count values like &ldquo;1-2&rdquo; or &ldquo;1-4 Players&rdquo; from scrapers and AI are now normalized to the max number (e.g., &ldquo;1-4&rdquo; &rarr; 4). The column stores a single integer for consistent display and sorting.</li>
        <li><strong>Players in More Details</strong> &mdash; Player count is now displayed in the More Details section on the game detail page, alongside modes and campaign.</li>
        <li><strong>AI Validates Publisher &amp; Developer</strong> &mdash; Publisher and developer fields are now included in the AI validation set. When AI is used as a fallback during scraping (or via AI Fill), it verifies and corrects publisher/developer values from other scrapers, not just fills them when empty.</li>
        <li><strong>PEGI Rating Fix</strong> &mdash; Fixed PEGI rating not being filled. The ESRB&rarr;PEGI auto-map was returning bare numbers (&ldquo;12&rdquo;) while the rest of the system (templates, edit modal, scrapers) expected &ldquo;PEGI 12&rdquo; format. All sources now use the consistent &ldquo;PEGI X&rdquo; format. Existing bare values are migrated automatically. PEGI and ESRB ratings are also now included in the AI validation set.</li>
        <li><strong>ScreenScraper Missing System Aliases</strong> &mdash; Added missing ES-DE folder name aliases to the ScreenScraper system ID map. GameCube (&ldquo;gc&rdquo;), Super Famicom (&ldquo;sfc&rdquo;), N64DD, Satellaview, Game &amp; Watch, regional Sega variants, MSX Turbo R, Atari Jaguar CD, and more now map correctly to their ScreenScraper system IDs, fixing search failures for these systems.</li>
    </ul>

- version: 2.34.3
  date: 2026-02-20
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Media Never Replaced During Scraping</strong> &mdash; Boxart (2D &amp; 3D), fanart, screenshots, videos, and manuals are no longer replaced by subsequent scrapers during normal scraping. Existing media is always preserved; to get new images, clear them from the edit modal first and then re-scrape. Full Re-scrape mode still overwrites everything as expected.</li>
        <li><strong>Full Re-scrape Boxart Fix</strong> &mdash; Fixed Full Re-scrape deleting existing boxart files from disk before finding replacements. Old files are now only removed after a new image is successfully imported, preventing games from losing their boxart.</li>
        <li><strong>RAWG Screenshot Fix</strong> &mdash; RAWG&rsquo;s <code>background_image</code> (often a promotional screenshot, not actual boxart) can no longer overwrite existing boxart. RAWG screenshots are now always appended regardless of scraper priority.</li>
        <li><strong>Removed IGDB Boxart Replacement</strong> &mdash; The automatic replacement of IGDB covers by TGDB, RAWG, and ScreenScraper has been removed. Once a game has boxart from any source, it is preserved until manually cleared.</li>
        <li><strong>Image Resize Logging</strong> &mdash; Image standardization now has its own dedicated log category (<code>image_resize</code>) with log files at <code>logs/image_resize_*.log</code>. Previously, errors from <code>image_utils</code> only went to console output and were never captured. Added per-type progress logging, full tracebacks on failures, try/except on all API routes, and a new Settings toggle section for image resize log levels.</li>
    </ul>

- version: 2.34.2
