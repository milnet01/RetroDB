        <li><strong>Performance: Thread-Safe Filter Cache</strong> &mdash; Game filter options cache now uses <code>threading.Lock</code> to prevent race conditions under concurrent requests. Cache eviction now happens before insertion to stay within bounds.</li>
        <li><strong>Dead Code Cleanup</strong> &mdash; Removed ~25 unused imports across 14 files: <code>app.py</code>, <code>routes/achievements.py</code>, <code>routes/platform_import.py</code>, <code>routes/steam_achievements.py</code>, <code>routes/xbox_achievements.py</code>, <code>scraper/rom_tools.py</code>, <code>scraper/scrape_metadata_igdb.py</code>, <code>scraper/scrape_xbox.py</code>, <code>scraper/trophy_parser.py</code>, <code>scraper/scan_roms.py</code>, <code>scraper/scrape_esde.py</code>, <code>scraper/scrape_metadata_thegamesdb.py</code>, <code>services/jobs/platform_sync.py</code>, <code>log_manager.py</code>.</li>
