        <li><strong>Tests</strong>. New <code>tests/test_pass41_security.py::TestPass41_1A/B/C</code> &mdash; 10 cases. Source-level pins (allow-list literals removed; <code>rate_limit_login(client_ip)</code> gone from <code>api_change_password</code>; <code>count_stale_password_hashes</code> wired into <code>app.py</code> with a paired <code>logger.warning</code>) plus functional smokes (change-password bucket isolated from login bucket; per-user isolation; stale-hash counter handles legacy / below-floor / at-floor / above-floor / malformed cases). 513 passed (was 503).</li>
        <li><strong>Roadmap status</strong> &mdash; Pass 41.1 closed. Pass 41 has 13 sub-passes remaining (41.2 &hellip; 41.14).</li>
