- version: 2.77.7
  date: 2026-04-20
  tags:
  - type: security
    label: Security
  - type: enhancement
    label: Enhancement
  body: |
    <ul>
        <li><strong>Log Secret Redaction</strong> &mdash; Added <code>services/log_redactor.py</code> with a <code>SecretRedactor</code> logging filter that masks JWTs, OAuth access/refresh tokens, API keys, Authorization headers, and long hex digests before they hit <code>logs/*.log</code> files. Wired into every category log handler in <code>log_manager.py</code>. Previously, <code>logs/scraping_*.log</code> accumulated ~200 real tokens over a 45-day retention window. Existing logs on disk are not retroactively cleaned &mdash; delete old <code>logs/scraping_*.log</code> if concerned.</li>
        <li><strong>SQL Allowlist Helper</strong> &mdash; Added <code>services.database.safe_column(name, allowed)</code> helper for validating request-derived column/order-by names before f-string interpolation. New code should use this in place of inline <code>if field not in allowlist</code> checks.</li>
        <li><strong>Pinned Dependency Lockfile</strong> &mdash; Added <code>requirements.lock</code> (generated via <code>pip-compile requirements.txt -o requirements.lock --strip-extras</code>) so reproducible installs are possible. <code>requirements.txt</code> still holds user-facing version ranges; <code>requirements.lock</code> records exact transitive pins.</li>
        <li><strong>Audit Tooling</strong> &mdash; Added <code>pyproject.toml</code> with a <code>[tool.ruff]</code> config tuned for this codebase (bug-class rules only, cosmetic findings ignored). Added <code>[tool.pytest.ini_options]</code>. Running <code>ruff check .</code> now returns 0 findings when the tree is clean.</li>
        <li><strong>Test Suite Scaffolding</strong> &mdash; Added <code>tests/</code> with 30 pytest cases covering <code>services/game_utils.py</code> (article placement, platform name map regression for the F601 duplicate-key bug, filename sanitization) and the new <code>SecretRedactor</code> filter. Run with <code>python3 -m pytest</code>.</li>
        <li><strong>GitHub Actions CI</strong> &mdash; Added <code>.github/workflows/ci.yml</code>: runs ruff, semgrep (security-audit + python + flask), an import smoke test, and the pytest suite on every push/PR to <code>main</code>.</li>
        <li><strong>GitHub Actions Release</strong> &mdash; Added <code>.github/workflows/release.yml</code>: on <code>v*.*.*</code> tag push, builds Linux/macOS/Windows ZIPs via <code>build_dist.py</code>, extracts the matching changelog entry, and creates a draft GitHub Release with the three ZIPs attached. Manual step still required: publish the draft + copy the notes into the Patreon post.</li>
    </ul>

- version: 2.77.6
  date: 2026-04-20
  tags:
  - type: security
    label: Security
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Debug Mode Default Flipped to Off</strong> &mdash; <code>RETRODB_DEBUG</code> now defaults to <code>false</code> instead of <code>true</code>. Previously, distributed builds shipped with the Werkzeug interactive debugger enabled. Combined with the default <code>SERVER_HOST=0.0.0.0</code>, this meant users running RetroDB on a home server exposed a LAN-reachable <code>/console</code> arbitrary-Python-execution endpoint. Developers working on the codebase should set <code>RETRODB_DEBUG=true</code> in their environment.</li>
        <li><strong>Xbox Achievement Sync Crash Fix</strong> &mdash; The single-game Xbox achievement sync endpoint (<code>POST /api/xbox-achievements/sync/&lt;id&gt;</code>) was crashing with <code>NameError: sqlite3 is not defined</code> because the required imports had been removed. Added the missing <code>import sqlite3</code> and <code>import config</code> so the endpoint works again.</li>
        <li><strong>Xbox OAuth Redirect Hardened</strong> &mdash; The OAuth error callback previously concatenated the error value into the redirect URL without encoding. Replaced string concatenation with a proper <code>url_for(..., xbox_error=error)</code> call so Flask handles URL encoding.</li>
        <li><strong>XXE Hardening (ES-DE + RPCS3 Parsing)</strong> &mdash; Swapped <code>xml.etree.ElementTree</code> for <code>defusedxml.ElementTree</code> in the ES-DE <code>gamelist.xml</code> scraper and the RPCS3 trophy parser. Prevents billion-laughs / XML-bomb denial-of-service attacks if a user ever imports a gamelist or trophy file from an untrusted source. Added <code>defusedxml&gt;=0.7.0</code> to <code>requirements.txt</code>.</li>
        <li><strong>Duplicate Dict Keys Removed</strong> &mdash; Removed repeated <code>'sega cd'</code>/<code>'segacd'</code> entries from <code>PLATFORM_NAME_MAP</code> in <code>services/game_utils.py</code> and a repeated <code>'gamegear'</code> entry in <code>scraper/scrape_esde.py</code>. No behaviour change (values matched), but tightens the maps so future divergence can't silently discard entries.</li>
    </ul>

