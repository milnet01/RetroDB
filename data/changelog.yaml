- version: 1.18.35
  date: 2026/01/30
  tags:
  - type: minor
    label: Minor
  body: |
    <h3>🔧 Toast Architecture Refactor</h3>
    <ul>
        <li><strong>Poll Only Updates, Never Creates/Destroys</strong>: Polling now only updates existing toasts with new data (progress, stats). It never creates or removes toasts.</li>
        <li><strong>Explicit Toast Lifecycle</strong>: Toasts are created by explicit user actions (start sync, queue item) and removed only by completion handlers or cancel actions.</li>
        <li><strong>Completion Handles Queue Progression</strong>: When an active operation completes, the completion handler is responsible for checking the queue and starting the next item, including creating its active toast.</li>
        <li><strong>Initial State Restoration</strong>: On page load, <code>checkAndRestoreActiveToasts()</code> queries server status and creates toasts for any running operations.</li>
        <li><strong>Direct Toast Creation</strong>: Both bulk scrape and RA sync now create their active toasts immediately when started, not waiting for the first poll.</li>
    </ul>
    <h3>🔧 RA Refresh Toast Fix</h3>
    <ul>
        <li><strong>Unified Toast System</strong>: RA Refresh now uses the UnifiedToastController instead of its own separate toast system. This fixes the unstyled toast appearing in the bottom-right corner.</li>
        <li><strong>Removed Old Toast Code</strong>: Deleted 170+ lines of legacy RA Refresh toast code from main.js (<code>showRARefreshToast</code>, <code>updateRARefreshToast</code>, <code>pollRARefreshStatus</code>, <code>checkRARefreshOnLoad</code>).</li>
        <li><strong>Enhanced Display</strong>: RA Refresh toast now shows <code>[System] Game Title</code> format and displays "🏆 X found" stat for games with RetroAchievements.</li>
    </ul>
    <p>This eliminates all race conditions and consolidates all operation toasts into a single unified system.</p>
