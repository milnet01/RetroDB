- version: 2.4.2
  date: 2026/02/10
  tags:
  - type: fix
    label: Performance & Cleanup
  body: |
    <h3>Performance Optimizations &amp; Cleanup</h3>
    <h4>Python / SQL Performance</h4>
    <ul>
        <li><strong>Filter options query</strong>: Reduced from 5 separate queries to a single query for genre, franchise, developer, publisher, and modes filter dropdowns.</li>
        <li><strong>Bonus disc counting</strong>: Replaced per-row correlated subquery with a single LEFT JOIN + GROUP BY, eliminating 100+ queries per page load on large libraries.</li>
        <li><strong>Game list pagination</strong>: Replaced <code>SELECT *</code> (35+ columns) with explicit column list, reducing data transfer by ~60%.</li>
        <li><strong>Dashboard queries</strong>: Specified only needed columns for recent games and recently viewed queries instead of fetching all columns.</li>
        <li><strong>Analytics decade grouping</strong>: Moved decade aggregation from Python loops to SQL <code>GROUP BY</code>, avoiding loading entire game table into memory.</li>
        <li><strong>RA sync clear</strong>: Added <code>WHERE</code> clause to UPDATE so only rows with RA data are touched instead of all games.</li>
    </ul>
    <h4>JavaScript Cleanup</h4>
    <ul>
        <li><strong>Passive event listeners</strong>: Added <code>{ passive: true }</code> to 8 scroll/resize listeners across main, game-list, all-games-controller, toast-controller, theme, and page-lifecycle.</li>
        <li><strong>Dead code removal</strong>: Removed unused <code>debounceTimers</code> property from global RetroDB object.</li>
    </ul>
    <h4>CSS &amp; Template Cleanup</h4>
    <ul>
        <li><strong>btn-danger-outline</strong>: Moved from inline style in game_detail.html to external <code>buttons.css</code>.</li>
        <li><strong>Lazy loading</strong>: Added <code>loading="lazy"</code> to boxart and badge images across dashboard, trophies, and achievement templates.</li>
        <li><strong>Dead file removal</strong>: Deleted unused <code>main-new.css</code> draft file.</li>
    </ul>

- version: 2.4.1
  date: 2026/02/10
  tags:
  - type: fix
    label: Security & Standards
  body: |
    <h3>Security Audit &amp; Standards Compliance</h3>
    <p>Full site-wide audit against design standards with focus on security, CSS, and JavaScript compliance.</p>
    <h4>Security Fixes</h4>
    <ul>
        <li><strong>Missing auth decorators</strong>: Added <code>@login_required</code> to 22 unprotected routes across achievements and trophies blueprints. Added <code>@admin_required</code> to destructive endpoints (<code>/api/scan</code>, <code>/api/clean-missing-roms</code>, <code>/api/scan-trophies</code>, etc.).</li>
        <li><strong>Error message sanitization</strong>: Removed raw <code>str(e)</code> from 11 client-facing error responses across games, trophies, scraper, and tools routes. Exceptions are now logged server-side with generic messages returned to users.</li>
        <li><strong>XSS innerHTML escaping</strong>: Applied <code>escapeHtml()</code> to 6 locations in game-modals, game-list, settings-page, filters, and all-games-controller where dynamic values were inserted into innerHTML without escaping.</li>
        <li><strong>SQL LIKE injection</strong>: Escaped <code>%</code>, <code>_</code>, and <code>\</code> in user input for LIKE clauses across game filters, PSN search, and bonus disc matching. Added <code>ESCAPE '\'</code> clauses.</li>
    </ul>
    <h4>JavaScript Standards</h4>
    <ul>
        <li><strong>Debounce timing</strong>: Standardized search debounce to 300ms (game-list, scrape-logs) and resize debounce to 250ms (main.js).</li>
        <li><strong>Number formatting</strong>: Added <code>formatNumber()</code> to ROM tools progress counter and achievement count badge in game modals.</li>
    </ul>
    <h4>Template Standards</h4>
    <ul>
        <li><strong>Number formatting</strong>: Applied <code>|format_number</code> filter to system counts in achievements, achievements_system, and systems templates.</li>
    </ul>
    <h4>CSS Standards</h4>
    <ul>
        <li><strong>External CSS</strong>: Replaced hardcoded hex colors with CSS variables in buttons.css, tags.css, and toasts.css (14 replacements).</li>
        <li><strong>Template inline styles</strong>: Replaced hardcoded hex colors with CSS variables across dashboard, game_detail, systems, settings, reports, archive_scanner, achievements, trophies, and other templates.</li>
    </ul>

