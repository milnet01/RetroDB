- version: 2.2.0
  date: 2026/02/09
  tags:
  - type: feature
    label: Security
  body: |
    <h3>Security Hardening</h3>
    <ul>
        <li><strong>Authentication on all routes</strong>: Every API endpoint and page now requires authentication via <code>@login_required</code>, <code>@editor_required</code>, or <code>@admin_required</code> decorators. Previously 66% of routes (81 of 122) had no auth.</li>
        <li><strong>Path traversal prevention</strong>: All file operations that accept user-supplied paths or filenames now validate against directory traversal attacks using <code>safe_filename()</code> and <code>safe_path()</code> from the new <code>services/security.py</code> module.</li>
        <li><strong>Security headers</strong>: All responses now include <code>X-Content-Type-Options</code>, <code>X-Frame-Options</code>, <code>X-XSS-Protection</code>, and <code>Referrer-Policy</code> headers.</li>
        <li><strong>Session cookie hardening</strong>: Cookies are now <code>HttpOnly</code> and <code>SameSite=Lax</code> for CSRF protection.</li>
        <li><strong>XSS fixes</strong>: All JavaScript <code>innerHTML</code> insertions that include server data now use <code>escapeHtml()</code> or <code>encodeURIComponent()</code>.</li>
        <li><strong>Login rate limiting</strong>: Failed login attempts are now rate-limited (max 5 failures per IP in 5 minutes).</li>
        <li><strong>Password policy</strong>: Minimum password length increased from 4 to 8 characters.</li>
        <li><strong>Error message sanitization</strong>: Internal error details are no longer exposed to clients. All exception messages are logged server-side and replaced with generic error responses.</li>
        <li><strong>Security documentation</strong>: Added Security &amp; Disclaimer section to Help page, new Section 19 (Security) in design standards, and security best practices guidance.</li>
    </ul>

