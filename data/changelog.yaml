- version: 2.16.0
  date: 2026-02-12
  tags:
  - type: feature
    label: New Feature
  - type: enhancement
    label: Performance
  - type: fix
    label: Code Quality
  body: |
    <h3>Performance, Code Quality &amp; Maintainability</h3>
    <p>Comprehensive optimization pass covering performance, security, code quality, and maintainability across the entire codebase.</p>
    <h4>Performance</h4>
    <ul>
        <li><strong>CSS minification</strong> — <code>build_css.py</code> now produces truly minified output (whitespace/comment removal) instead of simple concatenation</li>
        <li><strong>JS bundling</strong> — New <code>build_js.py</code> bundles 9 deferred JS files into a single <code>app.bundle.js</code> with IIFE isolation and conservative minification</li>
        <li><strong>Font loading optimization</strong> — Added <code>font-display: swap</code> to all <code>@font-face</code> declarations to eliminate render-blocking</li>
        <li><strong>Composite database indexes</strong> — Added multi-column indexes for common query patterns (system_id + title, system_id + ra_game_id, etc.)</li>
        <li><strong>Filter option caching</strong> — Server-side caching of genre, publisher, developer, franchise filter options with 60s TTL</li>
        <li><strong>Batch DB writes</strong> — Bulk scrape pre-fetches all game data in one query; RA sync reuses a single connection and commits every 10 games</li>
        <li><strong>Fixed busy-wait loop</strong> — PSN refresh job replaced CPU-spinning <code>while True: pass</code> with <code>threading.Event.wait()</code></li>
        <li><strong>Thread-safe caching</strong> — Settings and scraper cache now use <code>threading.Lock</code> for safe concurrent access</li>
        <li><strong>Normalization caching</strong> — Genre/mode normalization results cached with TTL to avoid repeated dictionary lookups</li>
    </ul>
    <h4>Security</h4>
    <ul>
        <li><strong>CSRF protection</strong> — Added token-based CSRF validation for all state-changing POST/PUT/DELETE requests</li>
        <li><strong>SQL column validation</strong> — Dynamic column names in queries are now validated against an allowlist</li>
        <li><strong>Session size cap</strong> — Search result history capped to prevent unbounded session growth</li>
        <li><strong>Centralized credentials</strong> — API keys and credentials loaded from a single helper function</li>
        <li><strong>Environment variable support</strong> — Database path, host, port, debug mode, and secret key configurable via <code>RETRODB_*</code> env vars</li>
    </ul>
    <h4>Code Quality</h4>
    <ul>
        <li><strong>Specific exception handling</strong> — Replaced ~37 bare <code>except Exception</code> blocks across 10 files with specific types (<code>sqlite3.OperationalError</code>, <code>requests.RequestException</code>, <code>ValueError</code>, etc.)</li>
        <li><strong>BaseScraper helpers</strong> — New <code>scraper/base_scraper.py</code> with shared <code>http_get</code>, <code>http_post</code>, <code>download_image</code>, <code>rate_limit</code>, <code>safe_json</code> functions; IGDB, TGDB, and RAWG scrapers refactored to use them</li>
        <li><strong>JS namespace consolidation</strong> — All bundled JS files export to <code>window.RetroDB</code> namespace with backward-compatible <code>window.*</code> globals</li>
        <li><strong>Dead code removal</strong> — Removed ~1,780 lines of unused JS (duplicate filter/bulk-select/alphabet-nav controllers superseded by <code>all-games-controller.js</code>)</li>
        <li><strong>Consolidated duplicate Python code</strong> — Extracted shared utility functions used across multiple route files</li>
    </ul>
    <h4>Maintainability</h4>
    <ul>
        <li><strong>Split <code>services/jobs.py</code></strong> (1,900+ lines) into a <code>services/jobs/</code> package with separate modules: <code>base.py</code>, <code>bulk_scrape.py</code>, <code>ra_sync.py</code>, <code>ra_refresh.py</code>, <code>psn_refresh.py</code></li>
        <li><strong>Split <code>scraper/hybrid_scraper.py</code></strong> — Extracted metadata merging logic into <code>scraper/metadata_merger.py</code> (~900 lines)</li>
        <li><strong>Job persistence</strong> — Background jobs now persist progress to a <code>job_queue</code> DB table; stale jobs marked as failed on app restart (crash recovery)</li>
        <li><strong>Accessibility</strong> — Added ARIA roles, labels, and semantic attributes to all modals, tabs, navigation, search bars, and filter controls across 6 templates</li>
    </ul>

