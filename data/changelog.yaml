        <li><strong>TGDB Search Result Ordering</strong> &mdash; Fixed search results for games with edition variants (e.g. &ldquo;Halo 2 [Platinum Collection]&rdquo;, &ldquo;Halo 2 [Platinum Hits]&rdquo;) incorrectly ranking above the plain base title (&ldquo;Halo 2&rdquo;). Titles that match exactly without needing noise stripping now receive a scoring bonus, ensuring the clean base game appears first.</li>
        <li><strong>TGDB Rate Limit Check Fix</strong> &mdash; Fixed TheGamesDB rate limit checking showing &ldquo;HTTP 429&rdquo; or &ldquo;Monthly allowance exceeded&rdquo; instead of actual remaining allowance. The check now parses the allowance data (<code>remaining_monthly_allowance</code>, <code>extra_allowance</code>, <code>allowance_refresh_timer</code>) from the response body regardless of HTTP status code, as TGDB includes this data in every response. Also handles HTTP 429 responses during online connectivity checks.</li>
    </ul>

