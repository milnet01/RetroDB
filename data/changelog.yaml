    <ul>
        <li><strong>Roadmap Pass 18 &mdash; image pipeline modernization</strong> &mdash; Three-item sweep. 244 tests pass (was 226); 18 new tests added.
            <ul>
                <li><strong>18.1 &mdash; WebP on ingest</strong>. New <code>RETRODB_IMAGE_FORMAT</code> config (default <code>webp</code>, fallback <code>jpeg</code>) routed through a new <code>services.image_utils.preferred_image_extension(image_type, original_ext)</code> helper. Every scraper filename construction now goes through this helper: <code>scraper/scrape_igdb.py</code> (boxart, screenshots, fanart), <code>scraper/scrape_thegamesdb.py</code> (download_image wrapper), <code>scraper/metadata_merger.py</code> (IGDB boxart/screenshots/fanart + RAWG boxart/fanart/screenshots + ScreenScraper boxart/boxart_3d/screenshots/fanart). Download path (<code>base_scraper.download_image</code> + every inline site) now ends with <code>finalize_downloaded_image(path, image_type)</code> which (a) re-encodes bytes if the on-disk format doesn't match the filename extension (JPEG payload written to a <code>.webp</code> path is re-saved as WebP), (b) runs the existing Real-ESRGAN / Lanczos standardization, (c) generates responsive variants (see 18.3). GIFs are always preserved &mdash; re-encoding a GIF to single-frame WebP would silently drop animation. Videos and manuals are unaffected (non-convertible types). WebP is 25-35% smaller than JPEG at equivalent quality and supported by ~97% of browsers in 2026; AVIF was considered and rejected (10-100&times; encoder cost, not worth it on a single-user machine).</li>
                <li><strong>18.2 &mdash; native lazy-loading + async decode</strong>. Added <code>loading=&quot;lazy&quot; decoding=&quot;async&quot;</code> to every <code>&lt;img&gt;</code> inside a card / list render path: <code>static/js/all-games-controller.js</code> (card boxart), <code>static/js/game-modals.js</code> (screenshot carousel), <code>templates/dashboard.html</code> (4 grid sections), <code>templates/achievements_system.html</code>, <code>templates/steam_achievements.html</code>, <code>templates/xbox_achievements.html</code>, <code>templates/local_trophies.html</code>, <code>templates/list_detail.html</code>, <code>templates/wishlist.html</code>, <code>templates/achievement_game.html</code>, <code>templates/steam_achievement_game.html</code>, <code>templates/psn_trophies.html</code>, <code>templates/game_detail.html</code> (screenshot row + filter modal thumbs). Above-the-fold hero boxart on the detail page kept eager but annotated with <code>decoding=&quot;async&quot; fetchpriority=&quot;high&quot;</code> so the LCP image decodes in parallel without holding up the main thread. Before: on a 500-card library page the browser fetched every image eagerly until the (non-existent) scroll observer kicked in. Now: native viewport-based lazy loading &mdash; baseline-supported since 2022.</li>
                <li><strong>18.3 &mdash; responsive srcset for boxart</strong>. New <code>services.image_utils._make_responsive_variants(path, image_type)</code> writes <code>-sm</code> (160w) and <code>-md</code> (320w) Lanczos-downscaled siblings next to every new boxart / boxart_3d image. Called from <code>finalize_downloaded_image</code> on the scrape path, and from <code>services/jobs/image_resize.py</code> so the bulk standardization job backfills variants for existing libraries. New <code>services.image_utils.boxart_srcset(filename)</code> helper returns a <code>srcset=&quot;...-sm 160w, ...-md 320w, ... Nw&quot;</code> string with per-candidate filesystem existence check so missing variants never 404 the browser. Registered as a Jinja global via <code>services/template_filters.py</code> and wired into the <code>game_detail.html</code> hero <code>&lt;img&gt;</code> with <code>sizes=&quot;(max-width: 768px) 160px, 320px&quot;</code>. Typical page payload savings on mobile: boxart drops from full-resolution (often 800x1120 &asymp; 120 KB WebP) to 160w variant (&asymp; 8 KB) &mdash; a 94% per-image cut. Grid-card integration deferred (per-card srcset emission needs batched fs-existence checks to avoid 500 stat calls per page load); flagged as a Pass 18 follow-up.</li>
                <li><strong>New tests</strong> (18) &mdash; <code>tests/test_image_pipeline.py</code>: <code>preferred_image_extension</code> across webp/jpeg modes + gif passthrough + video/manual passthrough + dot-less input (7); <code>_ensure_format_matches_extension</code> re-encodes JPEG bytes in a <code>.webp</code> path + matching-format is no-op + unknown extension skipped (3); <code>_make_responsive_variants</code> writes <code>-sm</code> / <code>-md</code> at correct widths + skips upscaling tiny sources + skips non-boxart types (3); <code>boxart_srcset</code> emits all candidates + returns empty for missing/None/empty + skips missing variant siblings (4); full <code>finalize_downloaded_image</code> pipeline end-to-end (1).</li>
                <li><strong>Validation</strong> &mdash; full suite green (244 passed, 0 failed); <code>app.py</code> smoke-imports; <code>pre-commit</code> clean; <code>python3 build_js.py</code> rebuilt <code>games.bundle.js</code> for the <code>game-modals.js</code> lazy-attr change.</li>
            </ul>
        </li>
    </ul>

- version: 2.87.0
  date: 2026-04-23
  tags:
  - type: feature
    label: Security
  body: |
    <ul>
        <li><strong>Roadmap Pass 16 &mdash; HTTP security headers expansion</strong> &mdash; Four-item sweep. 226 tests pass (was 211); 15 new tests added.
            <ul>
                <li><strong>16.1 &mdash; removed deprecated <code>X-XSS-Protection</code></strong>. The XSS Auditor was removed from Chromium/Edge and retained only in Safari, where modern OWASP (2024-2026) guidance is to omit the header. Deleted the <code>response.headers['X-XSS-Protection'] = '1; mode=block'</code> line from <code>app.py::set_security_headers</code>. Keeps the other three baseline headers (<code>X-Content-Type-Options</code>, <code>X-Frame-Options</code>, <code>Referrer-Policy</code>) unchanged.</li>
                <li><strong>16.3 &mdash; added <code>Permissions-Policy</code></strong>. Opts out of 11 browser APIs RetroDB never uses: <code>browsing-topics</code>, <code>camera</code>, <code>microphone</code>, <code>geolocation</code>, <code>payment</code>, <code>usb</code>, <code>interest-cohort</code>, <code>accelerometer</code>, <code>gyroscope</code>, <code>magnetometer</code>, <code>midi</code>. Defence-in-depth against compromised dependencies that try to reach for sensors or the Topics API. Sent on every response.</li>
                <li><strong>16.4 &mdash; added <code>Strict-Transport-Security</code> (env-gated)</strong>. Only emitted when <code>SESSION_COOKIE_SECURE</code> is on (i.e. <code>RETRODB_SECURE_COOKIES=true</code>, meaning the operator has flagged TLS is in front). Value: <code>max-age=31536000; includeSubDomains</code>. On plain-HTTP localhost the header is ignored by browsers anyway, but sending it unconditionally would be misleading to anyone reading the response.</li>
                <li><strong>16.2 &mdash; added <code>Content-Security-Policy</code> in Report-Only mode</strong>. Per-request nonce via <code>secrets.token_urlsafe(16)</code> attached to <code>g.csp_nonce</code> in the existing <code>assign_request_id</code> <code>before_request</code> hook (no second hook). Surfaced to templates as <code>{{ csp_nonce }}</code> via the <code>inject_config</code> context processor. Policy sent as <code>Content-Security-Policy-Report-Only</code>: <code>default-src 'self'</code>, <code>script-src 'self' 'nonce-...' https://cdn.jsdelivr.net</code> (Chart.js), <code>style-src 'self' 'unsafe-inline' https://fonts.googleapis.com</code>, <code>img-src 'self' data: blob:</code>, <code>font-src 'self' https://fonts.gstatic.com</code>, <code>connect-src 'self'</code>, <code>object-src 'none'</code>, <code>frame-ancestors 'self'</code>, <code>base-uri 'self'</code>, <code>form-action 'self'</code>. Intentionally ships report-only while ~765 inline <code>on*</code> handlers and ~38 inline <code>&lt;script&gt;</code> blocks still exist across templates &mdash; violations surface in the browser console so devs / operators can spot regressions, and a follow-up template-migration pass will flip to enforcing once handlers have been refactored to delegated listeners.</li>
                <li><strong>New tests</strong> (15) &mdash; <code>tests/test_security_headers.py</code>: baseline headers still sent (3); <code>X-XSS-Protection</code> absent (1); <code>Permissions-Policy</code> disables 7 sensor / tracking APIs (2); HSTS absent on plain HTTP + present when <code>SESSION_COOKIE_SECURE=True</code> (2); CSP Report-Only present + enforcing header absent + nonce embedded + nonce differs per request + 9 core directives present + <code>object-src 'none'</code> (6); <code>{{ csp_nonce }}</code> Jinja global renders (1).</li>
                <li><strong>Validation</strong> &mdash; full suite green (226 passed, 0 failed); <code>app.py</code> smoke-imports; <code>pre-commit</code> clean.</li>
