- version: 2.10.2
  date: 2026-02-11
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <h3>Memory Leak Fixes</h3>
    <ul>
        <li><strong>Canvas Gradient Caching:</strong> Replaced per-frame <code>createRadialGradient()</code> calls in the Cyberpunk smoke/mist effect with pre-rendered offscreen gradient canvases. Previously, ~1,500 CanvasGradient objects were allocated per second (2.7 million over 30 minutes), causing the page to become unresponsive. Now uses cached <code>drawImage()</code> with <code>globalAlpha</code> for zero per-frame gradient allocations.</li>
        <li><strong>Particle Object Pooling:</strong> Smoke and fallback blob particles are now reset in-place when recycled instead of allocating new objects, eliminating ~25-40 object allocations per second.</li>
        <li><strong>Ocean Effect String Optimization:</strong> Replaced per-iteration <code>rgba()</code> template string creation in the Ocean moon reflection effect with fixed <code>rgb()</code> colors and <code>globalAlpha</code>, eliminating ~100 string allocations per frame.</li>
        <li><strong>Hardware Benchmark Cleanup:</strong> Test canvases created during hardware tier detection are now properly released (dimensions zeroed, WebGL context explicitly lost) instead of being left in memory.</li>
        <li><strong>Toast Polling Idle Timeout:</strong> Background status polling now automatically stops after 5 minutes of consecutive idle responses (no active operations), preventing indefinite network and memory overhead on long-idle pages. Polling resumes on tab focus or operation start.</li>
        <li><strong>MutationObserver Auto-Disconnect:</strong> The autocomplete-prevention MutationObserver that watched the entire document body now disconnects after 5 seconds, preventing permanent DOM observation overhead.</li>
    </ul>

- version: 2.10.1
  date: 2026-02-11
  tags:
  - type: enhancement
    label: Enhancement
  body: |
    <h3>Performance Improvements</h3>
    <ul>
        <li><strong>Request-Scoped DB Connections:</strong> Database connections are now reused within a single HTTP request instead of opening/closing per query, eliminating redundant PRAGMA calls on multi-query pages.</li>
        <li><strong>Consolidated System Stats Query:</strong> System pages now fetch game count, missing count, and bonus count in a single SQL query instead of three separate queries.</li>
        <li><strong>Composite Index:</strong> Added a composite index on (system_id, is_bonus_disc, scraped) to accelerate system page stats and filtered game queries.</li>
        <li><strong>Deferred Script Loading:</strong> All JavaScript files (except theme.js) now load with the <code>defer</code> attribute, allowing the browser to parse DOM while downloading scripts.</li>
        <li><strong>Debounced Resize Handlers:</strong> Window resize handlers for toast positioning and canvas effects are now debounced to prevent layout thrashing during window drag.</li>
        <li><strong>Event Delegation:</strong> Game card click, hover, and fanart handlers now use event delegation on the grid container instead of per-card inline handlers, reducing DOM overhead with large game lists.</li>
        <li><strong>AbortController for Dropdowns:</strong> Modal dropdown fetches (game edit and bulk edit) are now cancelled when the modal is closed or reopened, preventing stale responses from processing.</li>
        <li><strong>Scroll Observer Cleanup:</strong> The infinite scroll IntersectionObserver and in-flight fetch requests are now properly disconnected/aborted on page unload to improve bfcache compatibility.</li>
    </ul>

