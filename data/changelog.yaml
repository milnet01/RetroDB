  body: |
    <ul>
        <li><strong>Bulk Scrape Thread Safety Hardening</strong> &mdash; The scrape worker thread now snapshots immutable job parameters (game IDs, scrape mode) at thread start, preventing data corruption if <code>self</code> is modified before the thread begins executing. Combined with the v2.72.5 queue fix, this eliminates the race condition where &ldquo;Resume All&rdquo; with multiple interrupted jobs could cause one job&rsquo;s DB record to be saved with another job&rsquo;s data.</li>
    </ul>

- version: 2.72.6
  date: 2026-03-11
  tags:
  - type: enhancement
    label: Enhancement
  body: |
    <ul>
        <li><strong>Version Banner in Log Files</strong> &mdash; Log files now include the RetroDB version at the top of each file and on each server restart. Same-day restarts are clearly separated with a banner line, making it easy to tell which version produced which log entries.</li>
    </ul>

- version: 2.72.5
  date: 2026-03-11
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Resume All Bulk Scrapes Fix</strong> &mdash; Fixed &ldquo;Resume All&rdquo; on the dashboard only resuming one of multiple interrupted bulk scrape jobs. When two interrupted jobs both had partial progress, the parallel resume requests would race: the second call overwrote the first job&rsquo;s state via <code>reset()</code> without checking if a job was already running. Now the partial-resume path correctly queues additional interrupted jobs (with their progress preserved) when another job is already active.</li>
    </ul>

- version: 2.72.4
  date: 2026-03-11
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Real-ESRGAN GPU Inference Thread Pinning (AMD ROCm)</strong> &mdash; Fixed GPU upscaling still falling back to CPU after warm-up. Root cause: MIOpen&rsquo;s compiled kernel invokers are stored in a per-handle in-memory cache, and ORT creates a separate MIOpen handle per thread (<code>thread_local</code>). The warm-up populated the main thread&rsquo;s handle, but Flask worker threads got new handles with empty invoker caches. Fix: all GPU <code>session.run()</code> calls are now funnelled through a single dedicated daemon thread via a queue, ensuring the same MIOpen handle (with its warm invoker cache) is always reused.</li>
    </ul>

- version: 2.72.3
  date: 2026-03-11
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Real-ESRGAN GPU Thread Safety (AMD ROCm)</strong> &mdash; Fixed MIOpen &ldquo;No invoker was registered for convolution forward&rdquo; error that caused GPU upscaling to silently fall back to CPU. Root cause: MIOpen handles are not thread-safe &mdash; the algorithm benchmarking phase was running on a Flask worker thread instead of the main thread. GPU warm-up inference now runs eagerly at server startup on the main thread, with thread-safe upscaler initialization via locking. Switched <code>MIOPEN_FIND_MODE</code> from 1 (NORMAL) to 3 (HYBRID) for efficient cache reuse.</li>
    </ul>

- version: 2.72.2
  date: 2026-03-11
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Real-ESRGAN GPU Upscaling Fixed (AMD ROCm)</strong> &mdash; GPU-accelerated image upscaling now works on AMD RDNA2 GPUs (RX 6600/6650/6700 etc.). Fixed MIOpen &ldquo;No invoker was registered for convolution forward&rdquo; error by moving ROCm environment setup (<code>HSA_OVERRIDE_GFX_VERSION</code>, <code>MIOPEN_FIND_MODE</code>) to server startup in <code>app.py</code> &mdash; before any ROCm shared libraries are loaded. Stale gfx1032 MIOpen cache is auto-cleaned on each start. GPU is ~8x faster than CPU fallback (~56ms vs ~466ms per tile).</li>
    </ul>

- version: 2.72.1
  date: 2026-03-11
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>ScreenScraper Search Reliability</strong> &mdash; Fixed multiple issues causing ScreenScraper to return no results for games it actually has:
            <ul>
                <li>Title sanitization was too aggressive &mdash; removing <code>&amp;</code> from titles (breaking &ldquo;Ratchet &amp; Clank&rdquo; etc.) and converting dashes to colons. Now only strips region tags and brackets, preserving the actual game title.</li>
                <li>Single-result API quirk &mdash; SS sometimes returns a single game as a dict instead of a list, which was silently ignored. Now properly detected and handled.</li>
                <li>Added diagnostic logging for filtered results so future search misses can be debugged (logs the raw id value and keys of any rejected result).</li>
                <li>5xx server errors are now retried with backoff (SS is prone to 500/503 errors under load). Previously only rate-limit responses (429/430) were retried.</li>
            </ul>
        </li>
    </ul>

- version: 2.72.0
  date: 2026-03-11
  tags:
  - type: feature
    label: New Feature
  body: |
    <ul>
        <li><strong>Screenshot Deduplication Tool</strong> &mdash; New ROM Tools utility that scans all games for duplicate screenshots. Supports exact file hash (MD5) matching for identical files and visual similarity matching using perceptual hashing for screenshots that look the same but differ in compression or resolution. Shows thumbnail previews grouped by game so you can visually compare and select which to keep. Deleting removes files from disk and updates the database automatically.</li>
    </ul>

- version: 2.71.6
