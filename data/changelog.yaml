                <li>IGDB search now retries without the version_parent filter when no strong title match is found, so remasters/remakes are discoverable</li>
                <li>Secondary source selection now enforces a minimum title score threshold &mdash; poor matches (e.g. &ldquo;Alan Wake II&rdquo; for &ldquo;Alan Wake Remastered&rdquo;) are rejected and a fresh search is performed instead</li>
                <li>Fallback scraper matches also enforce a minimum title score, preventing wrong-game data from being merged</li>
