    label: Cleanup
  body: |
    <ul>
        <li><strong>SQLite Performance</strong> &mdash; Added <code>mmap_size</code> (256 MB), <code>journal_size_limit</code> (64 MB), and <code>PRAGMA optimize</code> on connection teardown across web, scraper, and background job connections for improved read performance and WAL hygiene.</li>
        <li><strong>HTTP Connection Pooling</strong> &mdash; Scrapers now use a shared <code>requests.Session</code> for TCP connection reuse, and respect <code>Retry-After</code> headers on 429 rate limit responses.</li>
        <li><strong>Circuit Breakers</strong> &mdash; Each scraper API source (TGDB, IGDB, RAWG, ScreenScraper, AI) now has a circuit breaker that skips the source for 2 minutes after 5 consecutive failures, preventing bulk scrapes from hammering dead APIs.</li>
        <li><strong>Flask-Limiter</strong> &mdash; Added per-route rate limiting for expensive endpoints (AI Fill: 10/min, Bulk Scrape start: 5/min, Login: 10/min) using in-memory storage.</li>
        <li><strong>Path Traversal Hardening</strong> &mdash; <code>delete_game_images()</code> now validates all media paths with <code>safe_path()</code> before deletion, preventing potential directory traversal via crafted DB values.</li>
        <li><strong>Global Error Handlers</strong> &mdash; Added <code>@app.errorhandler(404)</code> and <code>@app.errorhandler(500)</code> for consistent JSON/HTML error responses.</li>
        <li><strong>PDF Upload Validation</strong> &mdash; CLZ PDF import now enforces a 50 MB size limit and validates PDF magic bytes before processing.</li>
        <li><strong>Batched System Updates</strong> &mdash; System name and logo refresh operations now use batch <code>execute_many()</code> instead of per-row updates (~277 queries &rarr; 1).</li>
        <li><strong>Connection Safety</strong> &mdash; ROM inline scan now uses <code>get_db_with_context()</code> to prevent connection leaks on exceptions.</li>
        <li><strong>Dead Code Cleanup</strong> &mdash; Removed 6 duplicate RA route functions from <code>achievements.py</code> (superseded by <code>ra_sync.py</code>), deleted 3 unused template files, removed ~20 unused imports, and added <code>museum.js</code> to the JS build exclusion list.</li>
        <li><strong>Dependency Bounds</strong> &mdash; <code>requirements.txt</code> now uses upper-bounded version ranges to prevent breaking upgrades.</li>
    </ul>

