  body: |
    <h3>Name Mismatch — Slash vs Hyphen False Positive</h3>
    <ul>
        <li><strong>Fix</strong> &mdash; ROMs with slashes in the scraped title (e.g. &ldquo;World Class Fussball/Soccer&rdquo;) no longer show as perpetual name mismatches. The filename sanitizer converts <code>/</code> to <code>-</code>, but the comparison normalizer was not treating them as equivalent, causing the same file to be flagged again after every rename.</li>
    </ul>

