- version: 1.11.5
  date: 2026/01/16
  tags:
  - type: feature
    label: Refactoring
  body: |
    <h3>🔧 Code Refactoring & Optimization</h3>
    <ul>
        <li><strong>Modularized Bulk Scrape System</strong> - Split bulk scrape code into reusable components:
            <ul>
                <li>Created <code>static/js/bulk-scrape.js</code> - Shared JavaScript controller module</li>
                <li>Created <code>templates/_bulk_scrape_modal.html</code> - Reusable modal partial template</li>
                <li>Reduced code duplication between games.html and all_games.html by ~450 lines</li>
            </ul>
        </li>
        <li><strong>Backend Performance Improvements</strong>:
            <ul>
                <li>Moved scraper settings loading outside the per-game loop (load once, not per-game)</li>
                <li>Changed COMPUTER_SYSTEMS set to frozenset for immutability</li>
                <li>Defined SOURCE_NAME_MAP and priority functions once before loop</li>
                <li>Added proper try/finally for database connection cleanup</li>
            </ul>
        </li>
    </ul>

    <h3>🐛 Bug Fixes</h3>
    <ul>
        <li><strong>Database Connection Leak</strong> - Fixed potential connection leak by ensuring database connections are always closed in a finally block.</li>
        <li><strong>Removed Dead Code</strong> - Cleaned up old localStorage-based bulk scrape code that was no longer used after the backend-driven architecture change.</li>
    </ul>

    <h3>📂 New Files</h3>
    <ul>
        <li><code>static/js/bulk-scrape.js</code> - BulkScrapeController module with polling, UI updates, and API calls</li>
        <li><code>templates/_bulk_scrape_modal.html</code> - Partial template for bulk scrape modal (DRY principle)</li>
    </ul>
- version: 1.11.4
  date: 2026/01/16
  tags:
  - type: feature
    label: Architecture
  body: |
    <h3>🔧 Architecture Improvements</h3>
    <ul>
        <li><strong>Backend-Driven Bulk Scrape</strong> - The bulk scrape system now runs entirely on the backend in a background thread:
            <ul>
                <li>Scraping continues regardless of which page you're on</li>
                <li>Toast notification accurately shows real-time progress</li>
                <li>Pause/Resume and Cancel work instantly from anywhere</li>
                <li>Clicking the toast navigates back and shows the current state</li>
            </ul>
        </li>
        <li><strong>Removed Frontend Dependency</strong> - Previously, bulk scraping relied on JavaScript loops that stopped when navigating away. Now the backend handles everything, and the frontend just polls for status updates.</li>
    </ul>

    <h3>🐛 Bug Fixes</h3>
    <ul>
        <li><strong>Fixed Skipped Games Issue</strong> - Games no longer show as "Skipped" when returning to the bulk scrape modal after navigating away.</li>
        <li><strong>Removed Duplicate Code</strong> - Cleaned up duplicate bulk scrape functions in all_games.html that were causing conflicts.</li>
    </ul>
