    </ul>

- version: 2.71.5
  date: 2026-03-11
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>HLTB Best Match Selection</strong> &mdash; Fixed HLTB lookup returning the wrong game when a sequel is more popular than the original (e.g. searching &ldquo;Art of Fighting&rdquo; returned &ldquo;Art of Fighting 2&rdquo;). Results are now ranked by title similarity instead of blindly picking the most popular result.</li>
    </ul>

- version: 2.71.4
  date: 2026-03-11
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>ROCm GPU Architecture Fix</strong> &mdash; Fixed Real-ESRGAN GPU upscaling crashing with <code>miopenStatusInternalError</code> on AMD RDNA2 GPUs (e.g. RX 6600/6650/6700 series, gfx1032). ROCm&rsquo;s pre-compiled kernels only target gfx1030; the upscaler now sets <code>HSA_OVERRIDE_GFX_VERSION=10.3.0</code> to use compatible kernels on related GPU architectures.</li>
    </ul>

- version: 2.71.3
  date: 2026-03-11
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>MIOpen GPU Cache Fix</strong> &mdash; Fixed Real-ESRGAN GPU upscaling failing with &ldquo;attempt to write a readonly database&rdquo; errors on AMD ROCm. The MIOpen kernel cache directory (<code>~/.config/miopen/</code>) is often created by root during ROCm installation with wrong ownership. RetroDB now redirects MIOpen&rsquo;s cache to a writable path (<code>~/.cache/realesrgan/miopen/</code>) before initializing the GPU session, preventing the error entirely.</li>
        <li><strong>GPU Inference Circuit Breaker</strong> &mdash; If GPU inference fails at runtime (e.g. driver issues), the upscaler now automatically rebuilds the session with CPU-only providers and logs a single warning instead of spamming the same error for every image.</li>
    </ul>

- version: 2.71.2
  date: 2026-03-11
  tags:
  - type: fix
    label: Bug Fix
  - type: enhancement
    label: Enhancement
  body: |
    <ul>
        <li><strong>Bulk Scrape Stall Prevention</strong> &mdash; Fixed Real-ESRGAN image upscaling blocking bulk scrape for minutes per game when running on CPU with 64&times;64 tile models. Added a tile count limit (100 tiles) that automatically falls back to fast Lanczos resizing for larger images, keeping scraping responsive.</li>
        <li><strong>Image Handle Leak Fix</strong> &mdash; Fixed PIL Image objects not being closed after perceptual hashing in duplicate screenshot detection, preventing file descriptor exhaustion during long bulk scrape runs.</li>
        <li><strong>ScreenScraper Cache Cap</strong> &mdash; Added a 500-entry size limit with automatic eviction to prevent unbounded memory growth during bulk scrape of thousands of games.</li>
        <li><strong>ES-DE XML Parser Resilience</strong> &mdash; gamelist.xml files with unescaped &amp; characters (e.g. &ldquo;Tom &amp; Jerry&rdquo;) are now auto-sanitized before parsing, fixing parse failures across 11 systems.</li>
        <li><strong>AMD ROCm GPU Support</strong> &mdash; Real-ESRGAN now detects and uses AMD ROCm GPU acceleration when available (requires <code>onnxruntime-rocm</code> package and ROCm runtime). Also supports NVIDIA CUDA. GPU mode raises the tile limit to 1024 (vs 100 on CPU), enabling high-quality upscaling for larger images. Includes safe fallback: pre-checks <code>/dev/kfd</code> access to avoid crashes when GPU permissions are missing.</li>
        <li><strong>Bulk Scrape Memory Cleanup</strong> &mdash; Pre-fetched game data is now released after each bulk scrape job completes, reducing memory usage between queued jobs.</li>
    </ul>

- version: 2.71.1
  date: 2026-03-10
  tags:
  - type: fix
    label: Bug Fix
  body: |
    <ul>
        <li><strong>Real-ESRGAN Fixed-Input Model Support</strong> &mdash; Fixed ONNX inference errors (&ldquo;Got invalid dimensions&rdquo;) caused by sending arbitrarily-sized tiles to models with fixed input shapes (e.g. 64&times;64). The upscaler now auto-detects the model&rsquo;s expected input dimensions, pads images to tile-aligned boundaries, and ensures every tile matches the exact required size.</li>
    </ul>

