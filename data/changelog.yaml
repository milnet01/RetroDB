        <li><strong>Region Dropdown</strong> &mdash; Region field is now a configurable dropdown (default: USA, Europe, Japan, World) instead of free text. The default region (configurable in Settings &rarr; ROM Naming) is used as a fallback when scraping. Multi-value regions from scrapers are reduced to a single value.</li>
        <li><strong>Genre Schema Alignment</strong> &mdash; Normalized genre values to match the canonical AI schema: FPS &rarr; First-Person-Shooter, Shoot &lsquo;em Up &rarr; Shoot-em-up, Beat &lsquo;em Up &rarr; Beat-em-up, Hack and Slash &rarr; Hack-n-Slash, Light Gun &rarr; Light-Gun, Tower Defense &rarr; Tower-Defence, Battle Royale &rarr; Battle-Royale, Board Game/Card Game &rarr; Board-Card, and more. Existing database values are migrated automatically.</li>
        <li><strong>AI Validation in Scrape Flow</strong> &mdash; When AI is used as a fallback during scraping, validated fields (genre, modes, players, game structure, perspective, dimension, etc.) now correctly override existing values with AI corrections. Previously, <code>fill_only=True</code> silently discarded all AI corrections to populated fields.</li>
        <li><strong>Controller Default Override</strong> &mdash; When a system has curated default controllers in the database, they now always take priority over scraped or AI-suggested values, preventing brand-prefixed names like &ldquo;Xbox Controller S&rdquo; from overriding the correct system default.</li>
    </ul>

