- version: 3.5.13
  date: 2026-04-25
  tags:
  - type: security
    label: Pass 41.9 — game-route per-user views; sort_title heuristic; recently-viewed dropped
  body: |
    <ul>
        <li><strong>Pass 41.9.A (HIGH) &mdash; <code>track_progress</code> permission unlocks self-tracking for Player/Viewer-style roles</strong>. <code>api_track_view</code> and <code>api_update_completion</code> were <code>@editor_required</code>, blocking Player and Viewer roles from marking their own gameplay progress &mdash; a per-user concern, not an editorial one. Both now use <code>@login_required</code> + <code>@permission_required('track_progress')</code>; Player and Editor roles have the permission, Viewer doesn't (matches the role matrix introduced in Pass 44).</li>
        <li><strong>Pass 41.9.B (HIGH) &mdash; per-user <code>user_game_views</code> closes cross-user viewing-history leak</strong>. The shared <code>games.last_viewed</code> column was updated unconditionally by <code>api_track_view</code>; on a multi-user install whichever user navigated to a game last set the column for everyone. New migration 010 creates <code>user_game_views(user_id, game_id, last_viewed)</code> with composite PK + index. <code>api_track_view</code> upserts via <code>INSERT … ON CONFLICT DO UPDATE</code>. The dashboard's recently-viewed and continue-playing panels now JOIN the table with <code>WHERE v.user_id = ?</code>. The vestigial <code>games.last_viewed</code> column survives for legacy rollback safety but is no longer written.</li>
        <li><strong>Pass 41.9.B follow-up &mdash; <code>/api/recently-viewed</code> deleted</strong>. Zero callers (the dashboard reads <code>user_game_views</code> via inline <code>query()</code>, never the endpoint). Removing it shrinks the per-user scoping surface area to one site (app.py).</li>
        <li><strong>Pass 41.9.C (MEDIUM) &mdash; <code>generate_sort_title</code> single-letter Roman heuristic tightened</strong>. The previous pattern <code>(?&lt;![-\w])X(?![-\w])</code> converted any standalone <code>I</code> / <code>V</code> / <code>X</code>, including pronouns: <code>"I am Setsuna"</code> &rarr; <code>"01 am Setsuna"</code>. Tightened post-context: convert only when followed by end-of-title (<code>$</code>), a subtitle separator (<code>:</code>, <code>(</code>, <code>[</code>), or whitespace+digit. <code>"Final Fantasy I"</code> &rarr; <code>"Final Fantasy 01"</code> still converts (sequel marker); <code>"I am Setsuna"</code> stays put. Multi-letter Romans (II/IV/IX) are unaffected (handled by the longer-first sort).</li>
        <li><strong>Schema/migration impact</strong>. Migration 010 (<code>010_user_game_views.py</code>) is idempotent &mdash; safe re-run. The companion <code>games.last_viewed</code> column is intentionally NOT dropped in this pass; rollback to a pre-41.9 build still works. <strong>Merge note</strong>: the <code>feat/multi-emulator-launch</code> branch (PR #3) carries its own migration 010 (<code>010_emulators.py</code>); on merge, the feat branch's migration must be renumbered to 011 (mechanical rebase).</li>
        <li><strong>Tests</strong>. <code>TestPass41_9A/B/C</code> &mdash; 11 cases. 9A: source-level pin on <code>@permission_required('track_progress')</code> + absence of <code>@editor_required</code> on both endpoints. 9B: migration 010 registered in <code>MIGRATIONS</code>; <code>INSERT INTO user_game_views</code> upsert in track-view; dashboard JOIN keys on <code>v.user_id</code>; <code>/api/recently-viewed</code> route + handler removed. 9C: functional smokes &mdash; pronoun "I" preserved, EOS sequel "I" converted, subtitle "I:" converted, compound names unchanged, multi-letter Romans unaffected. Updated <code>test_routes_smoke.py</code> + <code>test_input_hardening.py</code> to reflect the endpoint removal.</li>
        <li><strong>Roadmap status</strong> &mdash; Pass 41.9 closed. Pass 41 has 1 sub-pass remaining: 41.6 (jobs cross-process singleton + persist-under-lock + PSN cancel) &mdash; the L-sized job-class refactor.</li>
        <li><strong>Version bump 3.5.12 &rarr; 3.5.13</strong>: patch (cross-user leak closure + role flexibility + sort-title correctness).</li>
    </ul>

- version: 3.5.12
  date: 2026-04-25
  tags:
  - type: a11y
    label: Pass 41.13 — sidebar aria-current + gem-toggle implicit association
  body: |
    <ul>
        <li><strong>Pass 41.13.A (HIGH) &mdash; <code>aria-current="page"</code> on sidebar nav</strong>. WCAG 2.4.3 requires <code>aria-current="page"</code> on the link representing the user's current page so assistive tech (screen readers, voice navigation) can announce location. <code>templates/base.html:79-189</code> emitted the visual <code>active</code> class but no <code>aria-current</code>. New Jinja macro <code>nav_active(cond)</code> emits both atomically: <code>class="nav-item active" aria-current="page"</code> when the condition is true; just <code>class="nav-item"</code> otherwise. All 17 sidebar nav links converted to the macro form &mdash; no per-link condition duplication.</li>
        <li><strong>Pass 41.13.B (MEDIUM) &mdash; gem-modal exclusive toggle implicit association</strong>. <code>templates/base.html:1177</code> wrapped the exclusive-toggle checkbox in <code>&lt;label class="toggle-switch" for="gemOtherPlatforms"&gt;</code>. The wrapping <code>&lt;label&gt;</code> implicitly associates with the <code>&lt;input&gt;</code> it contains (the checkbox), but the explicit <code>for="gemOtherPlatforms"</code> pointed at the SIBLING text input. Clicking the toggle focused the wrong control &mdash; functional bug, not just a11y. Dropped the explicit <code>for=</code>; implicit association via wrapping is correct.</li>
        <li><strong>Deferred</strong> &mdash; converting six <code>&lt;div onclick=&gt;</code> / <code>&lt;h2 onclick=&gt;</code> primary actions to <code>&lt;button&gt;</code> (WCAG 2.1.1 keyboard) and replacing <code>&lt;label&gt;</code>-as-group-heading shapes with <code>&lt;fieldset&gt;&lt;legend&gt;</code> across 8+ template files. Each requires browser verification (visual + keyboard interaction); tracked as a follow-up sub-pass since the surface area spans <code>base.html</code>, <code>rom_tools_hub.html</code>, <code>game_detail.html</code>, <code>duplicate_finder.html</code>, <code>screenshot_dedup.html</code>, <code>game_imports.html</code>, plus the label-as-heading set (<code>wishlist/lists/tags/logs/chd_converter/rom_tools_settings/duplicate_finder/_modals/rename_modal</code>).</li>
        <li><strong>Tests</strong>. <code>TestPass41_13A/B</code> &mdash; 3 cases. 13A: pin <code>nav_active</code> macro definition with <code>aria-current="page"</code> output; pin that no sidebar nav link still uses the legacy <code>class="nav-item {% if ... %}active{% endif %}"</code> shape (Jinja-comment-stripped grep). 13B: pin that the wrapping toggle label around <code>gemExclusiveToggle</code> no longer has <code>for="gemOtherPlatforms"</code>.</li>
        <li><strong>Roadmap status</strong> &mdash; Pass 41.13 partial (A + B closed; div-as-button + label-as-heading deferred to a follow-up sub-pass with browser verification). Pass 41 has 3 sub-passes remaining (41.6 + 41.9 + 41.13c carry-over, plus 41.5b).</li>
        <li><strong>Version bump 3.5.11 &rarr; 3.5.12</strong>: patch (a11y compliance: WCAG 2.4.3 sidebar location indicator + functional bug fix on gem-modal toggle).</li>
    </ul>

- version: 3.5.11
  date: 2026-04-25
  tags:
  - type: security
    label: Pass 41.12 — frontend fetch timeout + navigateTo open-redirect guard
  body: |
    <ul>
        <li><strong>Pass 41.12.A (HIGH) &mdash; default 30 s fetch timeout via AbortController</strong>. <code>static/js/utils.js::API.get/post/postForm</code> previously called <code>fetch()</code> with no timeout. A hung server (or a request that fell into a captive portal) blocked the pending Promise indefinitely; the spinner spun forever and the user had no recovery path short of a hard reload. New <code>_withTimeout(opts)</code> helper wraps every API call in a 30 s <code>AbortController</code>; callers that want to control cancellation can pass their own <code>signal</code> in <code>options</code> and the helper steps aside. <code>finally</code> blocks call <code>cleanup()</code> to clear the timeout on success/failure.</li>
        <li><strong>Pass 41.12.B (HIGH) &mdash; <code>navigateTo</code> open-redirect guard</strong>. <code>static/js/toast-controller.js::UnifiedToastController.navigateTo</code> previously assigned <code>window.location.href = returnUrl</code> directly. <code>returnUrl</code> flows from <code>localStorage.getItem('bulkScrapeReturnUrl')</code> and similar keys; localStorage is writable from any same-origin script, so an XSS payload (or a malicious browser extension) could land an absolute attacker URL there and the next toast click would fire it. New <code>_isSafeReturnUrl(url)</code> helper accepts only (a) <code>/</code>-rooted paths that don't start with <code>//</code> (protocol-relative), or (b) absolute URLs whose parsed origin matches <code>window.location.origin</code> with http(s) scheme. Rejected URLs log a <code>console.warn</code> and the navigation is skipped.</li>
        <li><strong>Deferred</strong> &mdash; replacing inline <code>onclick=</code> handlers with delegated <code>addEventListener</code> + <code>data-*</code> attributes (the third sub-item in roadmap 41.12). 51+ raw <code>setInterval/setTimeout/addEventListener</code> sites were called out as a separate "PageLifecycle adopt-or-remove" decision, tracked under Pass 42.7. The current pass is scoped to the bug-class fixes that are currently exploitable; the inline-handler rewrite is its own UX-affecting effort (it also blocks Pass 41.3's CSP nonce zombie cleanup).</li>
        <li><strong>JS bundle rebuilt</strong>. <code>build_js.py</code> regenerated <code>core.bundle.js</code> with the updated <code>utils.js</code> + <code>toast-controller.js</code>; <code>asset_manifest.json</code> SHA-256 prefix advanced.</li>
        <li><strong>Tests</strong>. <code>TestPass41_12A/B</code> &mdash; 5 cases. 12A: source-level pin on <code>AbortController</code> + <code>_API_DEFAULT_TIMEOUT_MS</code> + caller-signal opt-out. 12B: pin on <code>_isSafeReturnUrl</code> helper definition with origin-parity check, <code>navigateTo</code> consults the guard, and the protocol-relative-URL rejection (<code>startsWith('//')</code>).</li>
        <li><strong>Roadmap status</strong> &mdash; Pass 41.12 closed (A + B); inline-onclick rewrite carried over to Pass 42.7. Pass 41 has 3 sub-passes remaining (41.6 + 41.9 + 41.13, plus 41.5b carry-over).</li>
        <li><strong>Version bump 3.5.10 &rarr; 3.5.11</strong>: patch (frontend resilience + open-redirect closure).</li>
    </ul>

- version: 3.5.10
  date: 2026-04-25
  tags:
  - type: security
    label: Pass 41.10 — tools.py authz uplift, scan rate-limits, full-UUID task IDs
  body: |
    <ul>
        <li><strong>Pass 41.10.A (HIGH) &mdash; task cancel/pause/resume require admin</strong>. <code>routes/tools.py</code> task control endpoints (<code>/api/rom-tools/task/&lt;id&gt;/{cancel,pause,resume}</code>) were <code>@login_required</code>, letting any logged-in user (Player / Viewer) interrupt an admin's running scan or convert task by knowing the task_id. Raised to <code>@admin_required</code>.</li>
        <li><strong>Pass 41.10.B (HIGH) &mdash; CHD convert + verify require admin</strong>. <code>chd-converter/convert</code> and <code>chd-verify/verify</code> were <code>@login_required</code>, letting non-admins trigger long-running disc conversions and (with <code>chd_delete_originals=true</code>) source-file deletions across the ROM tree. Pass 40.2 hardened the file paths via <code>safe_path</code>; Pass 41.10.B closes the remaining authorization gap by requiring admin.</li>
        <li><strong>Pass 41.10.C (HIGH) &mdash; task IDs use full UUID-4</strong>. <code>task_id = str(uuid.uuid4())[:8]</code> at four sites gave 32 bits of entropy &mdash; ~4.3B values, brute-forceable across long-running scans in a multi-user deployment. Dropped the slice; full 36-char UUID strings now.</li>
        <li><strong>Pass 41.10.D (MEDIUM) &mdash; heavy <code>*_scan</code> endpoints raised to editor + 5/min rate-limit</strong>. The five filesystem-walk scans (archive_scanner, chd_converter, chd_verify, duplicate_finder, screenshot_dedup) walk the entire ROM tree; previously <code>@login_required</code> meant a Player misclick could trigger the cost. Raised to <code>@editor_required</code> (Player still sees the page, just can't kick off scans), and registered <code>5 per minute</code> Flask-Limiter caps in <code>app.py</code> so even an authorized editor can't loop them.</li>
        <li><strong>Tests</strong>. <code>TestPass41_10A/B/C/D</code> &mdash; 13 cases. Source-level pin on <code>@admin_required</code> for cancel/pause/resume and convert/verify; pin that <code>uuid.uuid4())[:8]</code> is gone (comment-stripped grep) and full-UUID generation remains; pin that each <code>*_scan</code> route has <code>@editor_required</code> and a matching <code>_rate_limit('tools.api_..._scan', "5 per minute")</code> registration in app.py.</li>
        <li><strong>Roadmap status</strong> &mdash; Pass 41.10 closed. Pass 41 has 4 sub-passes remaining (41.6 + 41.9 + 41.12 + 41.13, plus 41.5b carry-over).</li>
        <li><strong>Version bump 3.5.9 &rarr; 3.5.10</strong>: patch (authz tightening + UUID-entropy hardening + DoS rate-limits).</li>
    </ul>

- version: 3.5.9
  date: 2026-04-25
  tags:
  - type: hardening
    label: Pass 41.14 — PIL bomb caught; ESRGAN SSRF gate; rglob symlink escape
  body: |
    <ul>
        <li><strong>Pass 41.14.A (MEDIUM) &mdash; <code>compute_dhash</code> catches DecompressionBombError</strong>. <code>scraper/image_dedup.py::compute_dhash</code> previously caught <code>(OSError, ValueError)</code>. PIL's <code>Image.DecompressionBombError</code> is a sibling exception class (not a subclass of either), so a single bomb-image in a scraped screenshot batch propagated out and aborted the dedup loop for the whole game. Catch widened to include the bomb error; <code>compute_dhash</code> returns <code>None</code> instead and the dedup loop continues with the rest of the batch.</li>
        <li><strong>Pass 41.14.B (MEDIUM) &mdash; ESRGAN model download gated by SSRF</strong>. <code>services/image_utils._download_model</code> previously called <code>urllib.request.urlopen</code> directly. <code>_MODEL_URLS</code> is a hardcoded HuggingFace allowlist today (no live SSRF primitive), but if the URL becomes settings-editable in a future pass (the way <code>ROM_PATH</code> did in Pass 32.1) the helper would be a wide-open fetcher. Each URL now passes through <code>services.ssrf.validate_outbound_url(require_https=True)</code> before <code>urlopen</code>; rejected URLs are skipped with a <code>logger.warning</code>.</li>
        <li><strong>Pass 41.14.C (MEDIUM) &mdash; <code>rglob()</code> symlink-escape guard</strong>. <code>Path.rglob()</code> follows symlinks on Python 3.12 (default behavior changed in 3.13). A symlink to <code>/</code> placed inside <code>ROM_PATH</code> would let rom_tools' archive/CHD/duplicate scanners enumerate the entire filesystem. New <code>scraper/rom_tools._safe_under_root(path, root_resolved)</code> helper verifies <code>path.resolve().is_relative_to(root_resolved)</code> and returns False on any <code>OSError</code>/<code>ValueError</code>. Applied to four recursive walks: <code>_find_archives_filtered</code>, <code>_find_archives</code>, <code>CHDConverter.find_convertible_files</code>, <code>DuplicateFinder._find_rom_files</code>.</li>
        <li><strong>Tests</strong>. <code>TestPass41_14A/B/C</code> &mdash; 6 cases. 14A: source-level pin on <code>DecompressionBombError</code> in the except clause + functional smoke (monkeypatched <code>Image.open</code> raises bomb error, <code>compute_dhash</code> returns None). 14B: source-level pin on <code>validate_outbound_url(try_url, require_https=True)</code> literal call shape. 14C: source-level pin on the helper definition + at-least-5 use sites; functional smoke creates a real symlink in <code>tmp_path</code> escaping root and verifies the helper rejects it (and accepts a legitimate file inside root).</li>
        <li><strong>Roadmap status</strong> &mdash; Pass 41.14 closed. Pass 41 has 5 sub-passes remaining (41.6 + 41.9 + 41.10 + 41.12 + 41.13, plus 41.5b carry-over).</li>
        <li><strong>Version bump 3.5.8 &rarr; 3.5.9</strong>: patch (defense-in-depth bounds + SSRF gate + symlink hygiene).</li>
    </ul>

- version: 3.5.8
  date: 2026-04-25
  tags:
  - type: hardening
    label: Pass 41.11 — museum silent decode logged; GET handler made idempotent
  body: |
    <ul>
        <li><strong>Pass 41.11.A (MEDIUM) &mdash; museum top_games JSON decode failure logged</strong>. <code>routes/museum.py::_get_top_games</code> previously caught <code>(json.JSONDecodeError, TypeError): pass</code>, leaving the admin with an empty top-games block on the museum page and no breadcrumb when the cached LLM JSON was corrupt. Now logs at <code>logger.warning</code> with the exception and the system_id so the next museum generation can be prompted.</li>
        <li><strong>Pass 41.11.B (MEDIUM) &mdash; museum_system GET handler no longer mutates DB</strong>. <code>routes/museum.py:347-351</code> ran <code>UPDATE controllers SET image = NULL WHERE id = ?</code> from inside the <code>museum_system</code> view function whenever it noticed a stale image filename. This violated RFC 7231 GET-idempotency &mdash; one user's page load rewrote globally-shared rows, and made caching/replay reasoning fragile. The view now clears stale refs in the in-memory render dict only (so the page still displays correctly without a broken-image icon); persistent cleanup runs from the new <code>POST /api/museum/cleanup-controller-images</code> endpoint, gated to <code>@editor_required</code>, which scans every controller row and clears refs whose backing files are missing. Returns <code>{cleared, scanned}</code>.</li>
        <li><strong>Tests</strong>. <code>TestPass41_11A/B</code> &mdash; 4 cases. 11A: regex-extract <code>_get_top_games</code> body; pin a <code>logger.warning</code> call inside it. 11B: source-level extraction of the <code>museum_system</code> body (sliced to the next <code># =============</code> separator, comment-stripped) pinned to NOT contain <code>UPDATE controllers</code>; pin that the cleanup route definition appears with <code>methods=['POST']</code> and <code>@editor_required</code>.</li>
        <li><strong>Roadmap status</strong> &mdash; Pass 41.11 closed. Pass 41 has 6 sub-passes remaining (41.6 + 41.9 + 41.10 + 41.12 + 41.13 + 41.14, plus 41.5b carry-over).</li>
        <li><strong>Version bump 3.5.7 &rarr; 3.5.8</strong>: patch (observability + idempotency hygiene).</li>
    </ul>

- version: 3.5.7
  date: 2026-04-25
  tags:
  - type: hardening
    label: Pass 41.8 — flask.g shadow renames + achievement aggregation contract docs
  body: |
    <ul>
        <li><strong>Pass 41.8.A (HIGH) &mdash; <code>flask.g</code> shadow eliminated</strong>. <code>routes/trophies.py</code> module imports <code>g</code> from Flask (request-context globals); seven loops/comprehensions used <code>g</code> as a local variable name, shadowing the import. Today the affected sites either run in background threads (no request context) or don't actually access flask.g, so the shadow is a typing/IDE hazard rather than a live bug &mdash; but a future refactor moving any of these bodies into a request handler would silently mask the global. Renamed: <code>_run_psn_full_sync</code> background loops use <code>ps_game</code> (mirroring the existing <code>existing_groups</code> comprehension); the trophy_groups comprehension uses <code>tg</code>; the per-request game-search loop uses <code>game</code>.</li>
        <li><strong>Pass 41.8.B (MEDIUM) &mdash; achievement aggregation null-user_id contract documented</strong>. The <code>LEFT JOIN game_achievement_progress gap ON g.id = gap.game_id AND gap.user_id = ?</code> shape silently drops rows where <code>gap.user_id IS NULL</code>. Migration 009 back-fills every pre-migration row to admin_id and the column is <code>NOT NULL</code>, so this is impossible under the standard init path &mdash; but a backup-restore that pre-dates migration 009 could surface the silent-drop. Added a comment block at the query naming the invariant + the diagnostic query (<code>SELECT COUNT(*) FROM game_achievement_progress WHERE user_id IS NULL</code>) so an operator hitting "too empty" aggregations knows what to check.</li>
        <li><strong>Tests</strong>. <code>TestPass41_8A/B</code> &mdash; 2 cases. 8A: comment-stripped grep that <code>routes/trophies.py</code> contains no <code>for g in &hellip;</code> patterns at all. 8B: pin that the Pass 41.8 marker, the &ldquo;migration 009&rdquo; reference, and the <code>user_id IS NULL</code> diagnostic query are all present in <code>routes/achievements.py</code>.</li>
        <li><strong>Roadmap status</strong> &mdash; Pass 41.8 closed. Pass 41 has 7 sub-passes remaining (41.6 + 41.9 &hellip; 41.14, plus 41.5b carry-over).</li>
        <li><strong>Version bump 3.5.6 &rarr; 3.5.7</strong>: patch (latent-bug hygiene + observability hint).</li>
    </ul>

- version: 3.5.6
  date: 2026-04-25
  tags:
  - type: hardening
    label: Pass 41.7 — TROPUSR explicit bounds; Xbox redirect kwarg; RA 401 logging
  body: |
    <ul>
        <li><strong>Pass 41.7.A (MEDIUM) &mdash; TROPUSR.DAT explicit bounds</strong>. <code>scraper/trophy_parser.py::TROPUSRParser</code> parsed attacker-controlled <code>tables_count</code>, <code>entries_count</code>, and <code>offset</code> values from PS3 trophy save files. The inner <code>break</code> guards (<code>if header_offset + 32 &gt; len(data): break</code>, <code>if entry_offset + entry_size &gt; len(data): break</code>) saved exploitability today, but bounds correctness relied on a reviewer proving early-exit rather than explicit min/return. Now prepends <code>tables_count = min(tables_count, max(0, (len(data) - 0x30) // 32))</code> and <code>if offset &gt;= len(data): return</code> in <code>_parse_table6</code>, making the safety obvious to static analysis.</li>
        <li><strong>Pass 41.7.B (MEDIUM) &mdash; Xbox callback redirect uses kwarg form</strong>. <code>routes/platform_import.py:484</code> built the redirect target via <code>url_for('game_imports.game_imports_page', tab='xbox') + '&amp;xbox_connected=1'</code>. This worked only because <code>url_for</code> happened to emit a query string today (<code>?tab=xbox</code>); a future template-route refactor that drops the query arg would have produced <code>/game-imports&amp;xbox_connected=1</code> &mdash; a broken path. Converted to <code>url_for(..., tab='xbox', xbox_connected=1)</code> kwarg form so URL construction is unambiguous.</li>
        <li><strong>Pass 41.7.C (MEDIUM) &mdash; RetroAchievements 401 logged explicitly</strong>. The 5 RA HTTP callers in <code>scraper/retroachievements.py</code> (<code>GetGameList</code>, <code>GetGame</code>, two <code>GetGameInfoAndUserProgress</code> variants, <code>GetUserSummary</code>) caught a 401 response in the generic <code>if response is not None and response.status_code == 200</code> miss-branch and silently returned None &mdash; the user saw &ldquo;no RA entry found&rdquo; with no indication that the API key was invalid. Each caller now emits a <code>logger.error</code> on 401 with the user-actionable hint (&ldquo;Re-enter the api_key in Settings &rarr; Scrapers&rdquo;).</li>
        <li><strong>Tests</strong>. <code>TestPass41_7A/B/C</code> &mdash; 4 cases. Source-level pin on <code>tables_count = min(tables_count</code> idiom + the <code>Pass 41.7.A</code> marker for the offset bound; pin that the historical <code>+ '&amp;xbox_connected=1'</code> concat is gone (comment-stripped grep, since the explanatory comment quotes the historical shape); pin on the <code>Pass 41.7.C</code> marker + a logger.error mention of <code>401</code> + <code>API key</code>.</li>
        <li><strong>Roadmap status</strong> &mdash; Pass 41.7 closed. Pass 41 has 8 sub-passes remaining (41.6 + 41.8 &hellip; 41.14, plus 41.5b carry-over).</li>
        <li><strong>Version bump 3.5.5 &rarr; 3.5.6</strong>: patch (defense-in-depth bounds + observability + URL-construction hygiene).</li>
    </ul>

- version: 3.5.5
  date: 2026-04-25
  tags:
  - type: security
    label: Pass 41.5 — Steam/SS credential redaction; IGDB 401 token refresh
  body: |
    <ul>
        <li><strong>Pass 41.5.A (HIGH) &mdash; redactor catches Steam <code>?key=</code> + ScreenScraper <code>?sspassword=</code></strong>. <code>services/log_redactor.py</code>'s URL-querystring allowlist covered <code>apikey/api_key/token/auth/pwd/password/devpassword/ssid</code> but missed Steam's <code>key=API_KEY_VALUE</code> and ScreenScraper's <code>sspassword=...</code>. Any <code>requests.HTTPError</code> stringified to logs (or any URL printed via <code>logger.info('%s', resp.url)</code>) leaked the Steam Web API key and the ScreenScraper user password. Both now redacted &mdash; the leading <code>[?&amp;]</code> boundary keeps <code>key</code> from over-matching <code>cache_key=</code> / <code>lookup_key=</code> patterns.</li>
        <li><strong>Pass 41.5.B (HIGH) &mdash; IGDB 401 invalidates token cache + retries once</strong>. <code>scraper/scrape_igdb.py::igdb_request</code> previously called <code>r.raise_for_status()</code> on a 401, which propagated the error up the stack. The cached Twitch OAuth token in <code>_igdb_token_cache</code> stayed put, so every subsequent IGDB call in the same scrape pass replayed the dead token and silently returned empty results. Fix: detect <code>r.status_code == 401</code>, clear the cache (<code>'token' = None</code>, <code>'expires_at' = 0</code>), call <code>igdb_auth()</code> for a fresh token, and retry the request once with the new <code>Authorization: Bearer</code> header. Non-401 responses bubble through <code>raise_for_status</code> unchanged.</li>
        <li><strong>Deferred</strong> &mdash; routing the 7 raw <code>requests.get/post</code> calls in <code>scraper/scrape_steam.py</code> and 3 in <code>scraper/hltb_lookup.py</code> through <code>base_scraper.http_get</code> / <code>http_post</code> for retry/backoff/size-cap. That's a mechanical 10-callsite refactor that warrants its own dedicated pass with case-by-case audit (response-shape contracts differ from <code>http_get</code>'s "return None on total failure" semantics). Tracked as carry-over in roadmap.</li>
        <li><strong>Tests</strong>. <code>TestPass41_5A/B</code> &mdash; 5 cases. 5A: <code>redact()</code> redacts Steam <code>?key=</code> + ScreenScraper <code>?sspassword=</code>; <code>cache_key=</code> NOT redacted (false-positive guard). 5B: monkeypatched <code>http_post</code> stub returning 401 then 200 verifies <code>igdb_auth()</code> is called between, the second request uses the fresh token, and the cache is updated; a 500-only path verifies <code>igdb_auth</code> is NOT called for non-401 errors.</li>
        <li><strong>Roadmap status</strong> &mdash; Pass 41.5 closed (sub-items A and B); H1/H4 (Steam/HLTB through base_scraper) carried over. Pass 41 has 9 sub-passes remaining (41.6 &hellip; 41.14).</li>
        <li><strong>Version bump 3.5.4 &rarr; 3.5.5</strong>: patch (log redaction expansion + IGDB resilience).</li>
    </ul>

