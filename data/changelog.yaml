    <h3>Bulk Scrape: Sequel/Subtitle Matching Fix</h3>
    <ul>
        <li><strong>Fixed</strong>: Games with subtitles (e.g. &ldquo;Castlevania: Lords of Shadow 2&rdquo;) no longer get metadata from the wrong game. Fallback scraper searches now fetch multiple results and use title scoring to pick the best match, instead of blindly taking the first API result.</li>
        <li><strong>Fixed</strong>: ScreenScraper search no longer truncates everything after a colon. &ldquo;Castlevania: Lords of Shadow 2&rdquo; was being searched as just &ldquo;Castlevania&rdquo;. Colons are now preserved with proper spacing for the ScreenScraper API.</li>
        <li><strong>Secondary sources passthrough</strong>: When the initial search already found correct matches on other scrapers, those IDs are now passed to the gap-filling stage. This avoids redundant re-searches that could pick the wrong game.</li>
