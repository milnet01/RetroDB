- version: 2.6.0
  date: 2026/02/10
  tags:
  - type: feature
    label: Visual Effect
  body: |
    <h3>CyberPunk Canvas Smoke/Mist Background</h3>
    <h4>New Animated Background</h4>
    <ul>
        <li>The CyberPunk theme (default) now has a subtle canvas-based smoke/mist particle effect, matching the Matrix and Ocean themes&rsquo; animated backgrounds.</li>
        <li>Smoke particles drift upward with organic sine-wave turbulence in cyan, magenta, and purple &mdash; the cyberpunk color palette.</li>
        <li>Particles fade in and out on staggered lifecycles to prevent synchronized pulsing.</li>
    </ul>
    <h4>Hardware-Adaptive Quality</h4>
    <ul>
        <li>Automatic hardware detection benchmarks CPU cores, device memory, canvas rendering speed, and GPU renderer to assign a quality tier (High / Medium / Low / Fallback).</li>
        <li>High-end systems get 25 particles with full turbulence; low-end systems get 8 smaller, simpler particles.</li>
        <li>Ultra-low-end hardware falls back to 6 lightweight gradient blobs with random neon colors &mdash; only ~6 circles per frame.</li>
        <li>Hardware tier is cached after first detection &mdash; no re-benchmarking when switching themes.</li>
    </ul>
    <h4>Accessibility &amp; Settings</h4>
    <ul>
        <li>Respects the existing <code>enable_mist_effect</code> setting &mdash; disable in Settings to turn off the smoke canvas entirely.</li>
        <li>Respects <code>prefers-reduced-motion</code> OS preference &mdash; no canvas effect created when reduced motion is enabled.</li>
        <li>Tab visibility pause/resume handled automatically (existing ThemeManager behavior).</li>
    </ul>
    <h4>Dead Code Cleanup</h4>
    <ul>
        <li>Removed ~170 lines of disabled CSS smoke overlay styles (layers, wisps, blend modes).</li>
        <li>Removed ~185 lines of unused CSS smoke keyframe animations.</li>
        <li>Removed inline smoke initialization JS and beforeunload cleanup from base template.</li>
    </ul>

