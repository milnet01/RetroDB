    label: Public Release
  body: |
    <h3>RetroDB 2.0 - Public Release</h3>
    <p>RetroDB is now open-source and ready for public distribution! This major release includes:</p>
    <ul>
        <li><strong>Security Cleanup</strong>: All personal credentials removed. Auto-generated secret keys. Force password change on first admin login.</li>
        <li><strong>Cross-Platform Support</strong>: Full Linux, Windows, and macOS compatibility. Platform-specific launchers (start.sh, start.bat, start.command).</li>
        <li><strong>Production Server</strong>: Waitress WSGI server replaces Flask dev server for production use. Flask dev server still available with DEBUG_MODE.</li>
        <li><strong>Setup Wizard</strong>: Web-based first-run wizard for admin account creation, library path configuration, ES-DE integration, and API key setup.</li>
        <li><strong>Installer Script</strong>: Cross-platform <code>install.py</code> handles dependency installation, config file creation, and directory setup.</li>
        <li><strong>Help Page Overhaul</strong>: New sections for installation, platform notes, API key setup guides, multi-user access, and updating instructions.</li>
        <li><strong>Legal Documentation</strong>: MIT license, trademark disclaimers, third-party API terms references.</li>
        <li><strong>Build System</strong>: <code>build_dist.py</code> creates clean distributable ZIP files excluding personal data.</li>
        <li><strong>ROM Tools</strong>: Platform-specific tool installation instructions. Graceful degradation when tools are missing.</li>
    </ul>

