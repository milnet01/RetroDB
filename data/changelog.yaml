    <ul>
        <li><strong>Achievement Badge Branding</strong> &mdash; Achievement/trophy progress badges on game list cards now use source-specific gradient colours matching each platform's brand identity: RetroAchievements (blue-to-gold), Steam (navy-to-steel-blue), Xbox (green-to-lime), PSN (deep-blue-to-platinum), RPCS3 (teal-to-steel). Border gradients, muted background gradients, and progress bar fills all match.</li>
        <li><strong>Age Rating Badge Cleanup</strong> &mdash; Removed background colour from age rating badges on game list cards, enlarged rating images to match other badge heights, and admin accounts now see all applicable ratings (not just preferred).</li>
    </ul>

- version: 2.60.0
  date: 2026-03-09
  tags:
  - type: feature
    label: Feature
  body: |
    <ul>
        <li><strong>Content-Based Rating Inference</strong> &mdash; When scrapers and AI fill cannot provide age ratings, the system now dynamically infers ratings from game metadata (genre, description, game structure, franchise, and system era). Inferred ratings populate all 8 regional rating systems via the maturity tier cross-mapping. Conservative approach &mdash; errs toward higher ratings. Retro systems (pre-ESRB era) are capped at Teen unless strong content signals are detected.</li>
    </ul>

- version: 2.59.0
