    <ul>
        <li><strong>Roadmap Pass 11 &mdash; security hardening</strong> &mdash; Seven-item sweep driven by the 2026 OWASP refresh + audit triage. All passing CI with 134 tests (was 124).
            <ul>
                <li><strong>11.1 &mdash; PBKDF2-SHA256 bumped 100,000 &rarr; 600,000 iterations</strong> (the current OWASP 2026 floor, up from 310,000 in 2023). Stored hash format changes from <code>&lt;salt&gt;:&lt;hash&gt;</code> to <code>pbkdf2:&lt;iterations&gt;:&lt;salt&gt;:&lt;hash&gt;</code> so future iteration bumps don't require another schema change. Legacy hashes stay verifiable so existing users are never locked out; they transparently upgrade to the current format on next successful login via the new <code>needs_rehash()</code> helper + a rehash branch in <code>routes/auth.py::api_login</code>. Non-admin users (no password) aren't affected &mdash; only admins re-hash. Added <code>tests/test_auth_hashing.py</code> with 8 tests covering the current+legacy format roundtrip, rehash-flagging, and malformed-input defense.</li>
                <li><strong>11.2 &mdash; <code>SESSION_COOKIE_SECURE</code> env-gated via <code>RETRODB_SECURE_COOKIES</code></strong>. Default off so a localhost HTTP deploy keeps working; operators fronting with a TLS reverse proxy set <code>RETRODB_SECURE_COOKIES=true</code> to drop the cookie on any plain-HTTP request. Closes the §22 design-standards gap that previously listed the flag as required without wiring it.</li>
                <li><strong>11.3 &mdash; upload content-type validation via PIL magic bytes</strong>. <code>services/game_media_service.py::save_upload</code> and <code>save_screenshots</code> now call <code>PIL.Image.open(...).verify()</code> on every image upload after the extension check, so a renamed <code>.exe</code> (or any non-image blob) gets rejected before it hits disk. Same guard added to <code>routes/auth.py::api_upload_avatar</code>. Per-image size ceiling of 10&nbsp;MB (<code>MAX_IMAGE_SIZE</code>) enforced per file, nested under the global 16&nbsp;MB <code>MAX_CONTENT_LENGTH</code>.</li>
                <li><strong>11.4 &mdash; rate limits extended to heavy admin endpoints</strong>. New limits: <code>maintenance.api_restart</code> (2/min), <code>maintenance.api_scan</code> (3/min), <code>maintenance.api_database_optimize</code> (3/min), <code>maintenance.api_image_resize_start</code> (3/min), <code>settings.api_backup</code> (3/min). <strong>Latent bug fixed as a side effect</strong>: the pre-existing AI Fill + bulk-scrape rate limits pointed at stale endpoint names (<code>games.api_game_ai_fill</code> &rarr; actually <code>games_ai.api_game_ai_fill</code>; <code>bulk_scrape.api_bulk_scrape_start</code> &rarr; actually <code>bulk_scrape.api_bulk_scrape_job_start</code>). The <code>view_functions.get(..., lambda: None)</code> fallback silently decorated a no-op lambda instead, so those two limiters never fired. Names corrected so the limits now actually apply.</li>
                <li><strong>11.5 &mdash; anchor comment on the <code>except Exception: pass</code> in <code>inject_config</code></strong>. Now reads <code># non-fatal &mdash; missing/invalid scraper_settings.json just hides the AI Fill button in the UI</code>, matching the anchor-comment convention global rule #1 enforces for workarounds.</li>
                <li><strong>11.6 &mdash; custom CSRF implementation rationale documented in <code>docs/RETRODB_DESIGN_STANDARDS.md</code> &sect;22</strong>. Explains the HMAC + session-token + header/form-check design and why RetroDB doesn't pull in Flask-WTF / <code>CSRFProtect</code> (localhost single-user deploy, <code>SameSite=Lax</code> cookie is already the primary defence, zero extra deps). Future contributors considering a switch now have the design intent in writing.</li>
                <li><strong>11.7 &mdash; <code>SecretRedactor</code> installed universally at root-logger level</strong>. New <code>log_manager.install_global_redactor()</code> attaches the filter to the root logger plus every handler attached by <code>logging.basicConfig()</code>; called in <code>app.py</code> immediately after <code>basicConfig</code>, before any module-level logger fires. The per-category <code>CategoryFileHandler</code> already installed its own redactor, so this adds a second, universal layer covering console/stdout paths that the category handlers never see. Idempotent &mdash; repeat calls don't stack. Two new tests in <code>test_log_redactor.py</code> assert idempotence + coverage of a basicConfig-style <code>StreamHandler</code>.</li>
                <li><strong>Validation</strong> &mdash; 134 tests pass (was 124); 10 new tests added. Smoke-import of <code>app</code> clean; all rate-limit endpoint targets resolve; <code>RETRODB_SECURE_COOKIES=true</code> toggles the Flask cookie flag correctly; root-logger redactor confirmed installed at boot via runtime introspection.</li>
            </ul>
        </li>
    </ul>

