    label: CLZ 匯入恢復正常、列表封面會顯示，多個頁面不再因撇號而出錯
  - type: security
    label: 抓取來的名稱與檔案路徑再也無法突破頁面按鈕
  body: |
    <ul>
      <li><strong>CLZ 匯入沒有任何作用。</strong>上傳 CLZ PDF 時，檔案被送到
        伺服器上不存在的位址，因此每次上傳都以「Parse failed」失敗。現在它會
        送達解析器。</li>
      <li><strong>列表頁面上的封面全都不見了。</strong>列表頁面向錯誤的位址
        請求每張封面，系統欄也一直是空白的。兩者現在都會顯示。頁面中「新增
        遊戲」搜尋裡的封面圖片也一併修正了。</li>
      <li><strong>名稱含有撇號時按鈕會出錯。</strong>當名稱含有撇號時，從列表
        中移除「Assassin's Creed」、刪除螢幕截圖、放大封面或移除類型標籤，
        都可能悄悄地沒有任何作用。同一個缺陷還讓精心設計的抓取名稱可以在頁面中
        執行程式碼。現在名稱會以不可能被誤讀為程式碼的方式傳給這些按鈕。</li>
      <li><strong>圖片與連結位址現在處處都會跳脫處理。</strong>少數頁面直接用
        抓取來的檔名組成圖片位址而沒有跳脫處理，還有五個頁面各自帶著一份較弱
        的跳脫輔助函式副本。現在它們全都使用共用的那一份。</li>
      <li><strong>設定頁面可能開啟後一片空白。</strong>如果你上次使用的分頁在
        更新中被改了名稱，設定頁面開啟時就看不到任何面板。現在它會忽略已不存在
        的分頁。像 <code>/settings#account</code> 這樣的連結又能開啟該分頁
        了。</li>
      <li><strong>你的主題現在會跟著你到其他裝置。</strong>你選擇的主題會儲存
        到你的帳戶。從未設定過主題的瀏覽器會使用你儲存的主題，而不是預設
        主題。</li>
      <li><strong>工作進度彈出視窗會顯示正確的圖示。</strong>已暫停、已完成與
        排隊中的工作原本都顯示相同的「執行中」圖示。現在每種狀態都有自己的
        圖示，並依主題而異。</li>
      <li><strong>鍵盤快速鍵清單現在可以翻譯了。</strong>它的標籤對翻譯工具
        來說是看不見的，因此在每種語言中都維持英文。</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: 年齡分級經常出錯，抓取的遊戲還可能遺失詳細資料
  body: |
    <ul>
      <li><strong>年齡分級經常出錯，而且錯誤還會擴散。</strong>當分級來自
        TheGamesDB 時，應用程式會在文字中的任何位置尋找分級代碼，而不是正確地
        讀取 &mdash; 因此「T - Teen」、「M - Mature 17+」、「AO - Adults Only
        18+」與「RP - Rating Pending」全都被存成錯誤的分級，一款 Mature 遊戲
        甚至可能被歸為適合所有人。更糟的是，這個錯誤的分級接著還被用來填入
        其他八種分級制度，於是一次讀錯就擴散到全部。現在分級會從文字開頭的
        代碼讀取。</li>
      <li><strong>換算出來的分級太過寬鬆。</strong>從你已有的分級填入缺少的
        分級時，應用程式可能會使用它剛剛才推算出來的分級，而不是你原本實際
        擁有的那一個。每換算一次就流失一點嚴格度。現在它一律從遊戲真正擁有的
        分級進行換算。</li>
      <li><strong>完整重新抓取會抹掉手動挑選的地區與存檔類型。</strong>這兩者
        都不是來自抓取器 &mdash; 是由應用程式推算出來的 &mdash; 因此完整重新
        抓取會把你整理好的「Japan」換成預設的「USA」。現在除非來源確實提供了
        新值，否則會保留你的值。</li>
      <li><strong>抓取器可能接受錯誤的遊戲。</strong>ScreenScraper 的結果
        通常會先以匹配分數檢查後才使用，但搜尋只回傳一個結果時，就完全跳過了
        這項檢查。現在每個結果都會評分。</li>
      <li><strong>遊戲可能因為一個缺少的欄位而遺失所有抓取的詳細資料。</strong>
        如果 IGDB 或 ScreenScraper 以意料之外的方式留下一個空白欄位，整次更新
        就會被丟棄 &mdash; 發行商、開發商、美術圖等全部都是。現在這些情況都會
        處理，其餘的詳細資料也會保留。</li>
      <li><strong>失敗的圖片可能被記錄為成功。</strong>如果下載的圖片其實不是
        可用的圖片，應用程式什麼也不刪，卻仍然儲存檔名，留下一個損壞的參照。
        現在會移除該檔案，欄位則保持不動。</li>
      <li><strong>遊戲模式現在使用一致的用語。</strong>不同的抓取器分別寫入
        「Single-player」與「Single-Player」，還有一個不屬於應用程式自身標籤的
        「Multiplayer」，因此這些遊戲無法被翻譯，也無法被模式篩選器比對到。
        現在所有來源都寫入相同的標籤。現有的遊戲會保留舊的用語，直到你重新
        抓取它們，或執行設定中的正規化工具。</li>
      <li><strong>Xbox 查詢現在和其他來源的行為一致。</strong>它們原本自行
        發送網路請求，因此在 Xbox Live 要求放慢時不會重試，對一次回覆能拉進
        多少資料也沒有限制。現在它們和其他抓取器使用相同的共用連線。</li>
      <li><strong>移除了未使用的 ScreenScraper 程式碼。</strong>兩個應用程式
        中沒有任何地方呼叫的函式已被刪除。其中一個回傳的網址仍含有你的
        ScreenScraper 密碼，若有任何東西使用它，密碼就會被交出去。3.6.x 版本
        說明中列出的「System Media Endpoint」就是其中之一 &mdash; 應用程式中
        從來沒有任何地方能用到它。</li>
    </ul>
- version: 3.23.5
  date: '2026-09-02'
  tags:
  - type: fix
    label: 打包的下載版無法啟動，以及其他建置修正
  body: |
    <ul>
      <li><strong>獨立下載版完全無法啟動。</strong>打包版自帶 Python，但裡面的
        啟動器卻是為原始碼安裝而寫的那一個 &mdash; 它去尋找打包版中並不存在的
        Python 檔案，在第一行就停住了。現在套件附帶自己的啟動器，它只會執行
        應用程式，並在伺服器啟動後開啟你的瀏覽器。</li>
      <li><strong>Linux 下載版中的桌面捷徑什麼也啟動不了。</strong>它在應該
        填入應用程式路徑的地方附帶的是預留文字。現在啟動器旁邊有一個
        <code>install-launcher.sh</code> &mdash; 執行一次，捷徑就會寫入你解壓縮
        位置的實際路徑。</li>
      <li><strong>從原始碼啟動時會安裝未經驗證的相依套件。</strong>當缺少
        Flask 時，啟動腳本會直接從網路抓取套件而不檢查總和檢查碼，途中還會
        強行繞過你的系統套件管理員。現在它會交給 <code>install.py</code>
        處理，後者使用含有總和檢查碼的鎖定檔。</li>
      <li><strong>原始碼下載版附帶了不該有的維護者檔案。</strong>要排除的檔案
        清單是手動維護的，已經跟不上，因此稽核輸出與殘留的建置資料夾都被一起
        打包進應用程式。現在下載版是依照專案中實際存在的檔案清單建置的，不會
        再有落差。</li>
      <li><strong>打包版中有兩個設定面板無法使用。</strong>遊戲庫統計與 API
        狀態面板用一個在打包版中並不存在的名稱去尋找主程式，因此兩者都
        失敗了。</li>
      <li><strong>部分畫面文字永遠無法翻譯。</strong>應用程式中三個較新的部分
        &mdash; 模擬器設定、啟動按鈕與「正在遊玩」列 &mdash; 被翻譯掃描略過，
        而本應抓出這個問題的檢查看的也是同一份不完整的清單。現在掃描會自動
        涵蓋每個檔案，它們的文字也已加入翻譯。</li>
      <li><strong>重建翻譯可能悄悄地什麼也沒做。</strong>在特定頁面的腳本中
        加入文字後，重建程序會認定沒有事情要做，因此新文字從未進入翻譯
        檔案。</li>
      <li><strong>一項顯示卡的變通設定被套用到每個人身上。</strong>Linux 啟動
        腳本把一項專為某款 AMD 顯示卡設計的設定強加到每台電腦上，這可能讓
        其他 AMD 硬體上的圖片放大工具當住。現在只有在確實裝有那款顯示卡時才會
        套用，而且絕不會覆蓋你自己設定的值。</li>
      <li><strong>發布腳本可能發布錯誤的版本。</strong>先前嘗試時殘留的標記會
        被悄悄重複使用，因此可能用較舊的快照建置，同時卻回報成功。</li>
    </ul>
- version: 3.23.4
  date: '2026-09-02'
  tags:
  - type: fix
    label: 堵住了九種可能讓遊戲庫遺失資料的情況
  body: |
    <ul>
      <li><strong>「清除抓取的資料」清空了你的整個遊戲庫。</strong>確認方塊只
        計算實際抓取過的遊戲，接著這個操作卻不分青紅皂白地清除每一款遊戲
        &mdash; 因此它可能承諾清除十來款，結果清掉了好幾千款。若勾選了圖片，
        它還會刪除你手動上傳的封面，並重設你自行編輯過的標題，連從未抓取過的
        遊戲也不例外。現在它只會做確認方塊上說的事。</li>
      <li><strong>3D 封面留下了損壞的連結。</strong>連同圖片一起清除時，會從
        磁碟刪除 3D 封面，資料庫卻仍指向它，於是應用程式會去尋找一個已經不在的
        檔案。</li>
      <li><strong>批次編輯的「追加」開關是取代而不是加入。</strong>對於視角與
        維度，它做的事與標籤恰恰相反，一次就覆寫了所有選取遊戲上的既有值，
        而且無法復原。</li>
      <li><strong>獨立版可能一鍵清空所有圖片參照。</strong>在打包的下載版中，
        應用程式到錯誤的位置尋找你的媒體，認定每一張圖片都遺失了，接著「清除
        遺失的媒體參照」就清空了整個遊戲庫的美術圖、螢幕截圖、影片與說明書
        項目。專門用來抓出這種情況的安全檢查卻看不到它。只有打包版受到
        影響。</li>
      <li><strong>孤立檔案清理可能在美術圖剛到時就把它刪掉。</strong>清理執行
        期間下載的封面可能被當成孤立檔案而移除。</li>
      <li><strong>建立播放清單時未經詢問就移動了你的壓縮檔。</strong>批次建立
        M3U 播放清單時，即使你沒有開啟該選項，也會把你的原始壓縮檔移走
        &mdash; 而當你確實要求移動時，又會把成功的移動回報為失敗。</li>
      <li><strong>圖片尺寸調整工具讓你的媒體資料夾不斷膨脹。</strong>它把自己
        產生的小縮圖當成需要放大的新圖片，將它們放大到原尺寸，再為它們產生
        縮圖。每執行一次就多出更多檔案，頁面悄悄地以原尺寸圖片取代縮圖，AI
        放大工具處理的檔案數量也約為預期的三倍。</li>
      <li><strong>AI 填入覆寫了你已修正的詳細資料。</strong>在一般抓取中，它
        可能會取代你自己的發行商、開發商、類型、年齡分級等資料。現在它只會
        填補空白；你自己按下的 AI 填充按鈕則維持不變。</li>
      <li><strong>重複抓取可能刪掉一張好好的螢幕截圖。</strong>從 RAWG 抓取的
        遊戲會重複使用相同的檔名，因此第二次抓取會覆寫已儲存的螢幕截圖，接著
        又把它當作重複項移除，而遊戲庫仍然列著它。</li>
    </ul>
- version: 3.23.3
  date: '2026-09-01'
  tags:
  - type: fix
    label: 家庭成員角色現在完全名副其實，停用的帳戶也真的會被鎖在門外
  body: |
    <ul>
      <li><strong>停用某人的帳戶現在會結束其工作階段。</strong>關閉帳戶會讓它
        從每個畫面上消失，但任何已經以該帳戶登入的人，仍可正常使用長達一週。
        除了刪除之外，停用是唯一能把人鎖在門外的方法，因此現在它會在對方下一次
        點按時就生效。</li>
      <li><strong>唯讀帳戶不再能變更遊戲資料。</strong>三個通關時長相關操作對
        每個已登入的人開放，包括僅能檢視的帳戶 &mdash; 因此唯讀帳戶可以覆寫
        遊玩時間，或把它從遊戲庫的每一款遊戲中清除。現在它們和其他會變更遊戲
        的操作一樣，需要編輯權限。</li>
      <li><strong>獎盃追蹤器再次對所有人開放。</strong>重新整理你自己的收藏家
        獎盃需要編輯者權限，而玩家與檢視者角色並沒有這個權限 &mdash; 偏偏這是
        唯一會寫入這些獎盃的功能。這些帳戶永遠無法獲得任何一座，重新整理按鈕
        也只會顯示錯誤。這是你自己的進度，因此現在完全不需要特殊權限。</li>
      <li><strong>一個人的 PlayStation 重新整理不再能被其他人停止。</strong>
        任何已登入的帳戶都能暫停或取消別人啟動的重新整理，還能看到對方正處理
        到哪一款遊戲。現在這兩者都只限啟動者本人。</li>
      <li><strong>Steam 匯入會使用你自己的帳戶，而不是最先儲存帳戶的那個人。
        </strong>遊戲庫匯入讀取的是一份共用的 Steam 憑證，而不是你的，因此它
        可能抓到別人的遊戲庫 &mdash; 而你自己儲存的資料卻看似遺失了。</li>
      <li><strong>猜測管理員密碼再次變得困難。</strong>登入失敗次數的限制是
        網路上所有人共用的，因此任何擁有自己帳戶的人，只要登入一次就能將它
        清除，然後無限地繼續猜測。現在限制是依帳戶計算的。</li>
      <li><strong>應用程式的錯誤現在會傳到頁面上，而不是消失無蹤。
        </strong>當某個操作被拒絕時，其中有 115 個操作回覆的格式是頁面無法讀取
        的，看起來就像操作成功了。現在它們會正確回報拒絕，你也會看到真正的
        訊息。</li>
    </ul>
- version: 3.23.2
  date: '2026-08-06'
  tags:
  - type: fix
    label: 抓取器設定頁面載入更快，且不再顯示過時的 API 金鑰
  body: |
    <ul>
      <li><strong>設定與抓取器設定頁面不再在每次請求時重新讀取抓取器設定檔。
        </strong>有四個地方在每次頁面或檢查執行時，都會從磁碟開啟並重新解析它，
        儘管早已有一個共用的快取讀取器。現在它們全都使用它，因此這些頁面每次
        造訪所做的工作更少。</li>
      <li><strong>儲存仍會立即生效。</strong>依計時器遺忘的快取，可能會在儲存
        後長達半分鐘內仍顯示舊值。現在每次儲存都會在寫入時清除快取，所以你看到
        的就是你剛儲存的內容。</li>
      <li><strong>你真正的 API 金鑰再也不會被它自己的遮罩顯示值取代。</strong>
        設定頁面會將已儲存的金鑰顯示為 <code>***1234</code>，而不是真正的金鑰。
        由於頁面拿到的是與抓取器使用的同一份設定副本，這個遮罩可能會覆寫記憶體
        中真正的金鑰，讓抓取器在快取過期前都以星號登入。</li>
      <li><strong>獨立版現在會到正確的位置尋找抓取器設定。</strong>抓取器推算
        該檔案位置的方式，與負責儲存它的頁面不同。在一般安裝中兩者會落在同一個
        檔案；但在獨立（按兩下即可執行的）版本中則不會，因此儲存的 API 金鑰
        可能被存到抓取器從來不會去找的地方。</li>
    </ul>
- version: 3.23.1
  date: '2026-08-06'
  tags:
  - type: fix
    label: 你在設定中儲存的伺服器連接埠，現在就是它實際使用的連接埠
  body: |
    <ul>
      <li><strong>儲存伺服器連接埠真的會讓伺服器改用它。</strong>設定會接受
        連接埠、檢查它、儲存它，並告訴你需要重新啟動才能套用 &mdash; 然後伺服器
        照樣在 5000 啟動。從來沒有任何東西把這個值讀回來。現在它已成為啟動流程
        的一部分，所以重新啟動確實會把 RetroDB 移到你選擇的連接埠。環境中設定的
        值仍然優先，因此指定連接埠的啟動器或容器不受影響。</li>
      <li><strong>兩個從未發揮作用的設定已被移除，而非修復。</strong>「伺服器
        主機」與「除錯模式」被儲存起來，也做出同樣的不實承諾。從網頁表單開啟
        除錯模式會在瀏覽器中暴露一個互動式 Python 主控台，而綁定位址決定了哪些
        電腦能夠連上 RetroDB &mdash; 兩者都不該放在設定表單後面。它們仍可從
        環境中設定，那裡本來就是它們的位置。如果你的設定檔仍含有它們，載入時
        會被悄悄捨棄；你不需要做任何事。</li>
      <li><strong>現在只有重新啟動真的會套用的設定，才會聲稱重新啟動後會套用。
        </strong>那才是真正的缺陷 &mdash; 無效的設定只是不整齊，但不實的承諾會
        浪費你一整個下午。</li>
    </ul>
- version: 3.23.0
  date: '2026-08-06'
  tags:
  - type: enhancement
    label: 以他人指定的連接埠啟動 RetroDB
  body: |
    <ul>
      <li><strong>RetroDB 現在會從環境中讀取 <code>PORT</code> 設定。</strong>
        如果你從其他工具啟動 RetroDB &mdash; 儀表板、容器、家用伺服器面板
        &mdash; 那個工具現在可以直接把它想要的連接埠交給 RetroDB，不必有人去
        編輯任何檔案。設定 <code>PORT</code>，RetroDB 就會綁定到那裡；不去動它，
        就什麼也不會改變。既有的 <code>RETRODB_PORT</code> 仍然和以前完全一樣
        運作，若兩者都有設定，則以 <code>PORT</code> 為準。</li>
      <li><strong>錯誤的連接埠號碼現在會直接說明，而不是瞎猜。</strong>以前
        無法讀取的連接埠會產生一大堆 Python 錯誤文字，而超出可用範圍的連接埠要到
        伺服器啟動失敗時才會被發現。RetroDB 現在會立即停止，並以一行文字指出它
        無法使用的值。它絕不會悄悄地在與要求不同的連接埠上啟動 &mdash; 被悄悄
        移走比被直接拒絕更糟。</li>
      <li><strong>啟動橫幅與瀏覽器分頁會跟隨實際的連接埠。</strong>RetroDB
        啟動時印出的位址，以及它為你開啟的頁面，以前不論實際使用哪個連接埠，
        都一律顯示 5000。</li>
    </ul>
- version: 3.22.1
  date: '2026-07-31'
  tags:
  - type: fix
    label: 資料庫的暫存檔不再無限膨脹
  body: |
    <ul>
      <li><strong>資料庫日誌重新設有上限。</strong>SQLite 會在你的遊戲庫資料庫旁保留一個暫存檔（<code>-wal</code> 檔）。RetroDB 原本要將它限制在 64&nbsp;MB，但這個上限只對背景工作生效 &mdash; 一般的頁面載入與編輯完全沒有上限。一次異常龐大的寫入之後，該檔案就會永遠停在最大體積，有時甚至比資料庫本身還大。現在上限處處生效，空間便會歸還。</li>
    </ul>
- version: 3.22.0
  date: '2026-07-05'
  tags:
  - type: enhancement
    label: 直接從遊戲彈出視窗抓取，無需額外跳轉
  body: |
    <ul>
      <li><strong>從遊戲彈出視窗抓取。</strong>快捷遊戲彈出視窗（在遊戲庫中按一下遊戲時
        出現的那個）現在在 AI&nbsp;填充和編輯旁邊新增了一個<strong>抓取</strong>按鈕。
        按一下它，RetroDB 便會直接帶你進入該遊戲，並已開啟中繼資料搜尋 &mdash; 再也
        不用先開啟完整頁面去尋找抓取按鈕了。</li>
    </ul>
- version: 3.21.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: 一鍵啟動 — 從釘選的圖示啟動 RetroDB，無需終端機
  - type: feature
    label: 真正的應用程式圖示 — 瀏覽器分頁與工作列中的霓虹遊戲手把
  - type: feature
    label: 設定頁面新增「關閉伺服器」按鈕
  body: |
    <ul>
      <li><strong>一鍵啟動。</strong>RetroDB 現在有了一個可以釘選到工作列的正式
        啟動器 &mdash; 按一下它，應用程式便會啟動（如果尚未執行），並自動在瀏覽器中
        開啟。再也不用開啟終端機輸入指令了。在 Linux 上，執行一次
        <code>python3 scripts/install_launcher.py</code> 即可將
        &ldquo;RetroDB&rdquo; 加入應用程式選單，然後釘選它。</li>
      <li><strong>真正的應用程式圖示。</strong>RetroDB 現在擁有了一個霓虹遊戲手把
        圖示 &mdash; 深色方塊上的賽博龐克青色與洋紅色 &mdash; 顯示在瀏覽器分頁
        （網站圖示）、工作列啟動器以及 Windows 程式本身上。它取代了原先樸素的
        表情符號佔位圖。</li>
      <li><strong>關閉伺服器按鈕。</strong>設定頁面的伺服器控制中，現在在重新啟動
        旁邊新增了一個紅色的<strong>關閉伺服器</strong>按鈕。它會乾淨地停止應用
        程式（先讓正在執行的工作完成儲存），因此你再也不用切換到終端機按 Ctrl+C
        了。</li>
      <li><strong>可下載版本會為你開啟瀏覽器。</strong>開箱即用的 Windows、Mac
        和 Linux 下載版現在會在啟動片刻後自動彈出瀏覽器，讓應用程式無需任何額外
        步驟便呈現在你眼前。</li>
    </ul>
- version: 3.20.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: 新增 11 種語言 — RetroDB 現已支援 21 種語言
  - type: fix
    label: '修正離開遊戲清單時出現的無害主控台錯誤'
  body: |
    <ul>
      <li><strong>新增 11 個語言包。</strong>RetroDB 的介面、發行說明
        和說明手冊現已翻譯為
        <strong>Afrikaans、isiZulu、isiXhosa、Dutch、Norwegian（Bokmål）、
        Russian、Polish、Turkish、Ukrainian、Indonesian 與 Hebrew</strong>
        &mdash; 加入現有的 German、Spanish、French、Italian、Japanese、
        Korean、Brazilian Portuguese，以及 Simplified &amp; Traditional
        Chinese。可在設定 &rarr; 顯示偏好設定 &rarr; 語言 中選擇你的
        語言；應用程式會以你所選的語言重新載入。</li>
      <li>每種語言都涵蓋整個應用程式：每一個按鈕、標籤與訊息、完整的
        發行說明歷史，以及完整的說明指南。</li>
      <li><strong>isiZulu 與 isiXhosa</strong> 也包含在內。由於這兩種
        語言現有的軟體詞彙還不多，在沒有自然對應詞的地方，常見技術
        術語（ROM、scraper、box art）會保留英文原文 &mdash; 歡迎母語
        人士校對。</li>
      <li><strong>Hebrew</strong> 已提供完整翻譯文字；精細的由右至左
        排版（讓介面正確鏡像顯示）將於後續更新中提供。待該排版工作
        完成後，Arabic 也會隨之推出。</li>
      <li><strong>錯誤修正：</strong>離開遊戲庫或某個系統的遊戲清單時，瀏覽器主控台不再記錄一則無害的「ReferenceError」（先前清理留下的殘留）。沒有可見影響 &mdash; 只是主控台更乾淨了。</li>
    </ul>
- version: 3.19.1
  date: '2026-07-05'
  tags:
  - type: performance
    label: 抓取更快 — 遊戲的螢幕截圖現在會同時下載
  body: |
    <ul>
      <li><strong>螢幕截圖並行下載。</strong>採用與熱門前端 ES-DE
        相同的做法（一次擷取遊戲的所有媒體），RetroDB 現在會
        <strong>同時</strong>下載遊戲的螢幕截圖，而非一張接著一張，
        且適用於每個來源（TheGamesDB、IGDB、RAWG、ScreenScraper）。擁有
        多張螢幕截圖的遊戲會明顯更快完成。</li>
      <li>重複螢幕截圖的檢查仍會在之後依序執行，因此圖片去重的
        準確度與以往完全相同 &mdash; 加速的只是下載部分。下載一次
        最多四張，因此單一來源絕不會過載。</li>
      <li>幕後速度改進；於下次重新啟動後生效。</li>
    </ul>
- version: 3.19.0
  date: '2026-07-05'
  tags:
  - type: performance
    label: 抓取更快 — 現在會同時查詢多個來源
  body: |
    <ul>
      <li><strong>每個遊戲的抓取更快。</strong>當 RetroDB 查詢某個
        遊戲時，會檢查數個資料庫（ES-DE、TheGamesDB、IGDB、RAWG、
        ScreenScraper）。以往它會<em>逐一</em>詢問，並等待每個回覆
        後才詢問下一個 &mdash; 因此等待時間是全部加總。現在它會
        <strong>一次</strong>詢問全部，只等待最慢的一個，這在每個
        遊戲上都是明顯的加速。結果的排序與評分仍與以往完全相同。</li>
      <li><strong>下載美術圖時減少浪費的握手。</strong>圖片下載現在
        會重複使用已開啟的連線，而非為每一張圖片都開啟新的連線，
        替擁有大量螢幕截圖的遊戲省下時間。</li>
      <li>這些都是幕後的速度改進 &mdash; 你使用 RetroDB 的方式毫無
        改變，也不會對資料庫造成更大的負擔（相同的請求，只是重疊
        進行）。於下次重新啟動後生效。</li>
    </ul>
- version: 3.18.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: 新增中國（China）年齡分級，成為第 9 個分級系統
  body: |
    <ul>
      <li><strong>新增年齡分級系統：中國（CADPA）。</strong>RetroDB 現在
        支援中國官方的遊戲適齡提示制度
        （&ldquo;網路遊戲適齡提示&rdquo;，由 CADPA 發布），與既有的
        八個分級機構（ESRB、PEGI、CERO、USK、ACB、FPB、GRAC 與
        ClassInd）並列。它採用三個級別 &mdash; <strong>8+</strong>、
        <strong>12+</strong> 與 <strong>16+</strong> &mdash; 以簡單的
        綠色徽章顯示。</li>
      <li><strong>它會像其他系統一樣自動填入。</strong>當某個遊戲已經
        有來自其他國家的分級時，RetroDB 會自動推算出對應的中國級別
        （反之亦然）。你也可以在遊戲的編輯畫面中手動選擇或變更，並在
        設定 &rarr; 遊戲庫 中選它做為你偏好的顯示系統。請注意：多數
        西方遊戲資料庫都不提供中國分級，因此對於任何地方都沒有分級的
        遊戲，會在抓取／AI Fill 期間依遊戲內容填入。</li>
      <li>這些綠色徽章是 RetroDB 自製的簡單圖案（與其他分級機構的
        風格一致），而非 CADPA 的官方標誌，因此沒有任何圖片授權的
        牽絆。</li>
    </ul>
- version: 3.17.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: 清除資料庫中指向磁碟上已遺失媒體檔案的紀錄
  - type: security
    label: 防止某個媒體資料夾消失時整個遊戲庫的美術圖被誤刪
  body: |
    <ul>
      <li><strong>新的維護工具：&ldquo;遺失的媒體參照&rdquo;</strong>
        （設定 &rarr; 系統 &rarr; 維護）。它是既有的&ldquo;孤立媒體&rdquo;
        清理功能的鏡像版本：後者是尋找沒有對應遊戲的殘留圖片檔案，
        而它則是尋找那些盒裝美術、3D 盒裝美術、螢幕截圖、同人美術、
        影片或說明書指向磁碟上已不存在檔案的遊戲。掃描出它們後，
        只需一鍵即可清除這些失效的參照，讓抓取程式能重新下載美術圖。
        你的遊戲紀錄本身絕不會被更動。</li>
      <li><strong>抓取期間更安全的自動清理。</strong>當 RetroDB 重新抓取
        某個遊戲時，會悄悄清除指向磁碟上已消失媒體檔案的參照。以往，
        若整個媒體資料夾一次全部消失 &mdash; 例如卸載了外接硬碟，或是
        大量刪除 &mdash; 這項清理可能會抹除數千個遊戲擁有哪些美術圖的
        紀錄，迫使你付出昂貴的代價重新抓取。RetroDB 現在能辨識這個訊號：
        若某個媒體資料夾遺失或完全空白，它會保留那些參照並記錄一則警告，
        而非將它們清除。這個新的維護工具也套用相同的防護，並會清楚標示
        任何它保留下來的資料夾。</li>
    </ul>
- version: 3.16.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: 儀表板新增&ldquo;快速修正&rdquo;面板
  body: |
    <ul>
      <li><strong>儀表板上新增的&ldquo;快速修正&rdquo;面板</strong>
        將零散的遊戲庫雜務整理成一目了然的待辦清單。它會顯示還有多少
        遊戲缺少盒裝美術，並提供一鍵捷徑來找出重複的 ROM，以及檢查
        失效的 ROM 路徑（檔案已被移動或刪除的遊戲）。每個捷徑都直接
        連往能修正該問題的頁面。當你的遊戲庫中有遊戲後，此面板便會
        出現。</li>
    </ul>
- version: 3.15.0
  date: '2026-07-03'
  tags:
  - type: accessibility
    label: 螢幕閱讀器現在會朗讀任務進度
  body: |
    <ul>
      <li><strong>耗時較長的任務現在會向螢幕閱讀器朗讀進度。</strong>在批次抓取、
        成就同步（RetroAchievements 或 PlayStation）或圖片縮放執行期間，螢幕閱讀器
        使用者以前在&ldquo;開始&rdquo;和&ldquo;完成&rdquo;之間聽不到任何提示。現在
        RetroDB 會定期朗讀進度節點（例如&ldquo;40個中的12個&rdquo;）以及完成狀態，
        並且不會在畫面上增加額外的彈出視窗。播報經過節流處理，做到有資訊而不囉嗦，
        並會遵循您所選擇的語言。</li>
    </ul>
- version: 3.14.0
  date: '2026-07-01'
  tags:
  - type: feature
    label: 新增語言 — 現已支援中文（簡體與繁體）
  body: "<ul>\n  <li><strong>RetroDB 現已支援中文。</strong>在\n    <strong>設定 &rarr; 系統 &rarr; 語言</strong> 下有兩個選擇:\n    <strong>中文 (简体)</strong>（簡體，面向中國大陸）與\n    <strong>中文 (繁體)</strong>（繁體，面向香港與台灣）。整個介面\n    &mdash; 選單、按鈕、訊息以及應用程式內說明手冊 &mdash; 皆已翻譯,\n    尚未翻譯的內容會悄然回退為英文。至此,支援的語言達到十種(英文、德文、\n    西班牙文、法文、義大利文、日文、巴西葡萄牙文、韓文,以及現在的簡體中文\n    &amp; 繁體中文)。</li>\n</ul>\n"
- version: 3.13.0
  date: 2026-06-30
  tags:
  - type: enhancement
    label: PlayStation Network 登入不再那麼麻煩
  body: "<ul>\n  <li><strong>你的 PlayStation 登入現在會自動續期。</strong>\n    以往你大約每隔幾個月就得重新貼上 NPSSO 權杖（PlayStation\n    的登入代碼）。RetroDB 現在會在背景於工作階段到期<em>之前</em>\n    悄悄重新整理，因此在正常使用下你應該幾乎 &mdash; 甚至完全 &mdash; 不必再輸入\n    新的。它只會重新整理仍然有效的工作階段；已經過期的則不予理會（不做無謂的探測）。</li>\n  <li><strong>到期前的提醒。</strong>如果你的 PlayStation\n    工作階段距離到期只剩兩週以內（或已經過期），儀表板\n    現在會顯示一則可關閉的小提醒，並附上一鍵重新連結的連結\n    &mdash; 讓你可以在方便時處理，而不是透過一次失敗的同步才發現。</li>\n  <li><strong>一鍵擷取權杖。</strong>PlayStation 設定\n    精靈現在提供一個選用的書籤小工具：只要把它拖曳到瀏覽器的\n    書籤列一次，之後在 Sony 的權杖頁面按一下即可複製你的\n    NPSSO &mdash; 不必再全選並複製。手動貼上仍然\n    完全照舊運作。</li>\n  <li>整理了應用程式內的 PlayStation 說明，使其與權杖實際的\n    儲存方式一致（安全地存放於 RetroDB 的資料庫中，依使用者區分），並修正了備份\n    檢查清單。</li>\n</ul>\n"
- version: 3.12.1
  date: 2026-06-30
  tags:
  - type: fix
    label: 全新安裝現在會建立完整的資料庫；可靠性修正
  body: "<ul>\n  <li><strong>全新安裝現在開箱即用。</strong>\n    全新安裝在建立遊戲資料庫時，會缺少應用程式預期的幾個\n    欄位與資料表（評分、RetroAchievements\n    資料、手把資訊），因此在乾淨的環境下開啟遊戲庫可能會顯示錯誤。\n    新增的資料庫升級步驟會補齊所有\n    缺少的部分。既有的遊戲庫不受影響 &mdash; 該步驟只會\n    確認這些部分已經存在。</li>\n  <li><strong>成就與獎盃同步不再遺失某個遊戲的\n    進度。</strong>如果某個遊戲在同步中途失敗（RetroAchievements、\n    Steam、Xbox），復原步驟可能會悄悄捨棄前一個\n    遊戲剛儲存好的進度，即使它已被計為完成。\n    現在每個遊戲都會各自儲存，因此一個小狀況不會回捲\n    到相鄰的遊戲。PSN 獎盃同步在首次\n    執行時也不再出錯。</li>\n  <li><strong>&ldquo;清除抓取資料&rdquo;\n    更安全。</strong>在同時\n    刪除圖片時，應用程式現在會先清除資料庫參照，再\n    移除檔案，因此中斷的清理不會留下\n    指向已經消失圖片的遊戲庫。</li>\n  <li><strong>表單與匯入現在能妥善處理空白或格式錯誤的請求</strong>（變更密碼、編輯使用者、Steam/Xbox/PSN 匯入、\n    ROM 重新命名、刪除螢幕截圖）&mdash; 它們現在會回傳簡潔的訊息\n    而非內部錯誤。</li>\n  <li><strong>含有引號的遊戲名稱不再導致頁面損壞。</strong>\n    數個把系統或 ROM 名稱嵌入頁面的畫面現在會\n    正確跳脫，因此撇號或不尋常的字元不會\n    使頁面無法載入。</li>\n  <li>幕後強化：更安全的設定檔寫入（兩次儲存重疊時\n    不會產生損毀的檔案）、更穩健的遊戲中繼資料抓取（一筆\n    壞資料不再中斷整個來源）、可運作的 DNS 重新繫結\n    防護（用於對外的圖片擷取），以及現在會在\n    用完即棄的資料庫上執行的測試套件，因此絕不會動到你真正的遊戲庫。</li>\n</ul>\n"
- version: 3.12.0
  date: 2026-06-30
  tags:
  - type: feature
    label: 新語言 — 現已支援韓文（한국어）
  body: "<ul>\n  <li><strong>RetroDB 現已支援韓文（한국어）。</strong>可在\n    設定 &rarr; 系統 &rarr; 語言 中選擇。整個介面\n    &mdash; 選單、按鈕、訊息，以及應用程式內的說明手冊 &mdash; 皆已\n    翻譯，使支援的語言達到八種（英文、德文、\n    西班牙文、法文、義大利文、日文、巴西葡萄牙文與韓文）。\n    韓文使 RetroDB 顯示的所有遊戲分級機構的涵蓋更加完整，\n    包括南韓的 GRAC。</li>\n</ul>\n"
- version: 3.11.0
  date: 2026-06-30
  tags:
  - type: enhancement
    label: 在 Patreon 上支持 RetroDB — 新增贊助連結
  body: "<ul>\n  <li><strong>你現在可以在 Patreon 上支持 RetroDB。</strong>Patreon\n    連結就位於 <strong>設定 &rarr; 系統 &rarr; 支持開發</strong> 中\n    既有的 &ldquo;在 GitHub 上贊助&rdquo; 按鈕旁邊，也出現在\n    關於面板以及專案的 README 中。RetroDB 維持完全\n    免費且開放原始碼 &mdash; 捐款完全屬於自願，只是\n    有助於維持獨立開發。</li>\n</ul>\n"
- version: 3.10.0
  date: 2026-06-26
  tags:
  - type: enhancement
    label: 變更記錄現在載入更快，並附有「載入更多」按鈕
  body: "<ul>\n  <li><strong>變更記錄頁面現在開啟速度快了許多。</strong>RetroDB 不再於\n    每次開啟時繪製整份發行歷史（數百筆項目），\n    而是先顯示最近的 20 筆，並在底部加上一個\n    <strong>載入更多</strong> 按鈕。按一下即可顯示\n    下一批，依此類推 &mdash; 較舊的歷史全都還在，只是\n    改為按需載入，而不會拖慢初次檢視。</li>\n</ul>\n"
- version: 3.9.0
  date: 2026-06-17
  tags:
  - type: feature
    label: 說明手冊與近期發行說明現已翻譯成全部 6 種語言
  body: "<ul>\n  <li><strong>完整的應用程式內說明手冊現已支援全部六種\n    語言</strong> &mdash; 德文、法文、西班牙文、義大利文、日文\n    與巴西葡萄牙文 &mdash; 而不只是英文。RetroDB 會依你在設定中\n    選擇的語言顯示手冊，若某些內容尚未翻譯，則會悄悄\n    退回英文。</li>\n  <li><strong>這份變更記錄現在也會以你的語言顯示</strong>，涵蓋\n    最近的發行版本，往後的新發行版本也都會從此翻譯。\n    較舊的歷史則維持英文。</li>\n  <li><strong>願望清單頁面以及最後殘留的英文字句</strong>\n    &mdash; 一批在 3.8.0 語言包首次推出時遺漏的彈出式錯誤\n    與狀態訊息 &mdash; 現在都能在整個應用程式中\n    正確翻譯。</li>\n</ul>\n"
- version: 3.8.2
  date: 2026-06-17
  tags:
  - type: security
    label: 安全性相依套件更新 + CI 修正
  body: "<ul>\n  <li><strong>安全性：</strong>更新了隨附的 <code>cryptography</code>\n    函式庫（47 → 49）以解決一則已公布的安全通報（GHSA-537c-gmf6-5ccf）。\n    行為沒有變化 — 只是換成更安全的版本。</li>\n  <li>修正了自動化測試流程：一個僅供測試使用的輔助套件\n    （<code>beautifulsoup4</code>）自 v3.7.0 起一直導致測試失敗，\n    而新的封裝建置指令碼觸發了一項靜態分析檢查，那是已知的\n    誤報（它執行的是受信任的建置指令，而非使用者輸入）\n    — 現已記錄並校準。純屬維護；應用程式本身\n    毫無變動。</li>\n</ul>\n"
- version: 3.8.1
  date: 2026-06-17
  tags:
  - type: improvement
    label: 更小的下載選項、贊助整理與翻譯修正（Pass 46.3 / 47.6）
  body: "<ul>\n  <li><strong>即將推出容量小很多的下載版本。</strong>RetroDB\n    那個「解壓即用、雙擊即可執行」的版本現在可以\n    建置成 <strong>純 CPU</strong> 版本（約 600&nbsp;MB），供\n    沒有 AMD 顯示卡的人使用 &mdash; 大約只有完整版\n    的六分之一大小。兩者將並列提供，讓你可以挑選最\n    適合自己機器的那一個。</li>\n  <li><strong>設定中的「支持開發」面板現在會翻譯</strong>\n    ，與應用程式其餘部分一致 &mdash; 它在 3.8.0 語言包推出時\n    被意外遺留為英文。</li>\n  <li>整理了贊助連結（README 中的 GitHub Sponsors 徽章；\n    funding 檔案已為 Patreon 與 Buy&nbsp;Me&nbsp;A&nbsp;Coffee 做好準備，待\n    這些設定好即可啟用）。永遠不會有煩人的催促畫面。</li>\n  <li>幕後：發行流程現在可以自動為 Windows、macOS 與 Linux\n    建置那個解壓即用的版本。注意：那份冗長的\n    應用程式內 <em>說明</em> 手冊目前仍僅有英文 &mdash; 這已\n    列為未來工作。</li>\n</ul>\n"
- version: 3.8.0
  date: 2026-06-12
  tags:
  - type: feature
    label: 完整介面翻譯 + 6 種語言（Pass 43.2/43.3/43.5）
  body: "<ul>\n  <li><strong>RetroDB 現在多支援 6 種語言。</strong>在 3.7.0 的\n    基礎上，整個介面已可翻譯，並機器翻譯成\n    <strong>德文、法文、西班牙文、義大利文、\n    日文與巴西葡萄牙文</strong>。可在\n    設定 &rarr; 顯示偏好設定 &rarr; 語言 中選擇你的語言；它會依你儲存的\n    偏好、接著瀏覽器、最後退回英文 &mdash; 絕不會\n    卡在某個缺失的語言上。</li>\n  <li><strong>畫面上的一切都已涵蓋</strong>：頁面文字與按鈕、\n    彈出訊息（那些小小的 &ldquo;快顯&rdquo; 通知）、編輯\n    與設定對話框、工具提示，以及螢幕閱讀器標籤。遊戲類型、\n    視角與遊玩模式（例如 &ldquo;First-Person-Shooter&rdquo;）現在也會\n    以你的語言顯示 &mdash; 而底層的資料仍維持\n    英文，讓你的遊戲庫與篩選能完全照舊運作。</li>\n  <li>內建的\n    <strong>&ldquo;虛擬&rdquo;語言</strong>（可在\n    語言選單中看到）是一項供譯者使用的品保工具，它會為每個標籤\n    加上方括號與重音符號，讓遺漏的文字一目了然。</li>\n  <li>機器翻譯只是起點，某些地方讀起來可能\n    有點生硬 &mdash; 它們日後很容易再精修，而任何尚未\n    翻譯的文字就直接顯示英文。</li>\n</ul>\n"
