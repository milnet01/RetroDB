  body: |
    <ul>
      <li><strong>在任何頁面搜尋任何遊戲或主機。</strong>側邊欄中你的名稱下方現在有一個搜尋框。輸入兩個或更多字母，即可看到符合的主機和最多八款符合的遊戲，每款遊戲都附有其主機。點選其中一個，或用方向鍵選取後按 Enter，即可開啟。「查看所有結果」會以該搜尋開啟遊戲庫。當頁面沒有自己的搜尋框時，按 / 可直接跳到這個搜尋框。</li>
      <li><strong>在手機或平板上更容易瀏覽。</strong>在窄螢幕上，頂端的一列放著選單按鈕和一個搜尋按鈕；搜尋按鈕會開啟選單，並把游標放在搜尋框中。底部的一列讓你一鍵前往儀表板、遊戲庫、系統與成就。選單現在是不透明的，頁面不會再從底下透出來。點選選單外部或按 Esc 即可關閉。在平板大小的視窗上，選單按鈕原本不見了，所以根本無法開啟選單；現在它回來了。捲動時停留在螢幕上的分頁列與篩選列，現在停在頂端列的正下方，而不是在它後面。</li>
      <li><strong>設定 &gt; 模擬器 符合手機畫面。</strong>其中的表格比手機螢幕寬，所以「編輯」和「設定」按鈕落在螢幕之外。現在在手機上，每一列都是一張卡片，按鈕就在卡片裡。</li>
      <li><strong>清除遊戲的圖片後不再留下多餘檔案。</strong>如果你在 RetroDB 仍在背景銳利化某款遊戲的圖片時清除了這些圖片，它可能會把圖片寫回成沒有任何遊戲使用的檔案。現在它會先檢查並略過它們。「正在優化圖片」的計數也會立即移除已清除的遊戲。</li>
      <li><strong>你輸入的標題在抓取時會保留。</strong>以前抓取（即使是完整重新抓取）會用抓取器提供的名稱取代你在編輯視窗中輸入的標題。現在你變更過的標題會被保留。標題下方新的「抓取時保留此標題」核取方塊會顯示這一點；取消勾選即可讓抓取器重新為遊戲改名。遊戲頁面上的「重置」也會允許抓取器改名。</li>
      <li><strong>為你的遊戲提供官方名稱，由你確認。</strong>「ROM 工具」中有一個新的「官方名稱」頁面。為一個系統或所有系統按下「詢問 AI」，AI 就會建議每款遊戲在其 ROM 所屬地區發行時的完整官方名稱，所以日版 Mega Man ROM 會變成 Rockman。你可以並排查看每個舊名稱與新名稱，勾選想要的並接受。在你接受之前什麼都不會改變。舊名稱會保留為別名標題，已接受的名稱在抓取時會被保留。被拒絕的名稱不會再被建議。需要先在 設定 &gt; 抓取 中設定一個 AI 提供者。</li>
      <li><strong>只有年份的遊戲可以編輯，並保留其年份。</strong>許多遊戲只標有年份，例如 1985。在遊戲頁面上，編輯視窗拒絕儲存這類遊戲。在遊戲庫的編輯視窗中，儲存後會抹除它的年份。現在兩者都接受年份、年份加月份或完整日期。</li>
    </ul>
