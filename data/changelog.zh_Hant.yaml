- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: RetroDB 現在明確表示不支持盜版
  - type: fix
    label: 關於對話框再次以完整大小開啟
  body: |
    <ul>
      <li><strong>應用程式中現在有一則反盜版聲明。</strong>它出現在關於對話框
        中，以及設定裡的 ROM 庫路徑下方，並提供所有語言版本。聲明指出
