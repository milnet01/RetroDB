- version: 4.0.0
  date: '2026-11-10'
  tags:
  - type: fix
    label: '在確認視窗中，焦點在「取消」或 × 上時按 Enter 現在會取消，而不是確認。由「確定」開啟的視窗不再消失，關閉快捷鍵清單或進度視窗後 Tab 仍能正常使用'
  - type: enhancement
    label: '許多原本只能用滑鼠操作的控制項，現在也能用鍵盤操作（按 Tab，再按 Enter 或空白鍵）：登入頁的個人檔案、比較頁的搜尋結果、標籤及其編輯和刪除按鈕、成就中的遊戲卡片、記錄工作階段、主題和頭像選擇、博物館圖片、移除類型或篩選條件的 ×、設定精靈中的資料夾、擷取來源核取方塊以及 CLZ 匯入。開關現在也會顯示鍵盤焦點環'
  - type: performance
    label: '博物館的背景移除功能不再一直佔用記憶體。它用 AI 模型把手把照片從背景中去背，這個模型一旦用過就佔用超過 2 GB 記憶體，處理照片時最多約 9 GB，直到 RetroDB 重新啟動才釋放。現在它在一個輔助程式中執行，需要時才啟動，處理完最後一張照片兩分鐘後關閉，把這些記憶體全部釋放'
    en: 'The Museum''s background remover no longer stays in memory. It cut controller photos out of their background with an AI model that took over 2 GB once used, and up to about 9 GB during a photo, until RetroDB restarted. It now runs in a helper that starts when needed and closes two minutes after its last photo, giving all of that memory back'
  - type: feature
    label: 'Xbox 匯入不再需要 Microsoft Azure 帳戶。現在每個人在「設定 → 我的資料」中貼上自己的免費 OpenXBL 金鑰（來自 xbl.io），而且在你網路中的任何電腦上都能使用。匯入還會排除應用程式和僅限手機的遊戲，把 PC 遊戲歸入 Windows 而不是 Xbox One，正確讀取 Xbox 360 成就，並且不再為未解鎖的成就顯示日期。免費金鑰每小時允許 150 次請求：大量成就同步達到上限時會停止並提示，下次會從尚未處理到的遊戲開始'
    en: 'Xbox import no longer needs a Microsoft Azure account. Each person now pastes their own free OpenXBL key (from xbl.io) under Settings → My Profile, and it works from any computer on your network. The import also leaves out apps and phone-only games, files PC games under Windows instead of Xbox One, reads Xbox 360 achievements the right way, and shows no date for a locked achievement. The free key allows 150 requests an hour: a big achievement sync that reaches it stops, says so, and next time starts with the games it had not reached'
  - type: enhancement
    label: 如果在另一項 RetroAchievements 同步或重新整理仍在執行時又要求一次，新的工作現在會在伺服器上排隊，等前一項完成後自動開始，即使你關閉頁面或是從其他裝置發出要求也一樣。每個頁面都會顯示相同的等候清單與各工作的排隊順位，按 ✕ 即可移除工作。伺服器重新啟動後，等候中的工作會在儀表板上重新提供給你
    en: A RetroAchievements Sync or Refresh you ask for while another one runs now waits on the server and starts by itself when that one finishes, even if you close the page or asked from another device. Every page shows the same waiting list with each job's place in line, and ✕ takes a job out. After a server restart, waiting jobs are offered back on the Dashboard
  - type: fix
    label: 主機頁面上的「重新整理 RA」按鈕恢復正常了。之前它沒有指明是哪一台主機，所以伺服器回應「找不到」
    en: The Refresh RA button on a console's page works again. It did not say which console, so the server answered "Not found"
  - type: fix
    label: ROM 命名檢查現在會依照「系統」頁面顯示的類型來看待每個系統。Macintosh、ZX Spectrum Next、Coleco Adam 和 Thomson 會被當作電腦檢查，3DS 和 PS Vita 則當作掌上型主機檢查，不再視為一般主機。你在「系統」頁面自行設定的類型現在也會被採用
    en: The ROM naming check now treats each system as the kind the Systems page shows. Macintosh, ZX Spectrum Next, Coleco Adam and Thomson are checked as computers, and 3DS and PS Vita as handhelds, instead of as consoles. A type you set on the Systems page is now followed too
  - type: performance
    label: RetroDB 在待機時佔用的記憶體大幅減少。AI 圖片放大功能現在只會在放大圖片時才載入，並透過一個輔助程式執行，該程式會在處理完最後一張圖片兩分鐘後自動關閉；閒置中的伺服器記憶體用量已從約 1.4 GB 降到 100 MB 以下。如果圖形驅動程式在放大過程中當機，只會讓輔助程式停止，伺服器不會受到影響
    en: RetroDB uses far less memory while it waits. The AI image upscaler now loads only while it is upscaling, in a helper that closes two minutes after its last picture; an idle server dropped from about 1.4 GB to under 100 MB. If the graphics driver crashes during an upscale, only the helper stops, never the server
  - type: performance
    label: 使用 Claude 網頁搜尋的 AI 填充費用更低。Claude 每次搜尋後都會重新讀取搜尋結果;RetroDB 現在會請 Anthropic 先將結果保留備用,之後再次讀取的費用只需十分之一甚至更低
    en: AI Fill with Claude web search costs less. Claude reads the search results again after each search; RetroDB now asks Anthropic to keep them ready, and a re-read then costs a tenth of the price or less
  - type: fix
    label: 祖魯語和科薩語的翻譯讀起來更順了：133 行意思錯誤的文字已修正，例如「Edition」被顯示成「Chapter」，「must be text」被顯示成「must be a letter」。每項修正都經過兩次獨立的 AI 檢查確認
    en: 'Zulu and Xhosa read better: 133 lines that said the wrong thing are corrected, such as "Edition" shown as "Chapter" and "must be text" shown as "must be a letter". Each correction was agreed by two separate AI checks'
  - type: fix
    label: 當遊戲無法啟動時，訊息現在會以你的語言顯示，並且仍會指出出問題的模擬器、核心或檔案。如果是電腦本身發生故障，現在會顯示「無法啟動」和程式名稱，詳細資訊則記錄在伺服器日誌中，而不再顯示原始的系統文字。RetroAchievements 拒絕登入時，會在已翻譯的句子中顯示 RetroAchievements 給出的原因
    en: When a game will not start, the message is now in your language and still names the emulator, core or file at fault. A failure inside the computer itself now says "Could not start" and the program's name, with the details in the server log, instead of raw system text. A refused RetroAchievements sign-in shows RetroAchievements' own reason inside a translated sentence
  - type: fix
    label: 取消已完成的抓取、同步或圖片工作時，現在會清除卡住的進度彈窗。啟動已在執行的工作時，會顯示真正的原因，例如「SNES 的抓取已在執行中」，而不是「網路錯誤」。博物館中的手把圖片錯誤現在會說明出了什麼問題，而取消其他使用者的 RetroAchievements 同步時，會告知該同步屬於對方，而不是假裝已取消
    en: Cancelling a scrape, sync or image job that has already finished now clears its stuck progress popup. Starting a job that is already running shows the real reason, such as "A scrape for SNES is already running", instead of "Network error". Controller image errors in the Museum now say what went wrong, and cancelling another user's RetroAchievements sync says it is theirs instead of pretending to cancel it
  - type: security
    label: 日誌檢視器現在也會隱藏較舊日誌檔中的密碼和金鑰。在 RetroDB 學會隱藏某個密碼（例如 ScreenScraper 的密碼）之前寫入的日誌，在檢視或下載時會以明文顯示
    en: The log viewer now hides passwords and keys in older log files too. Logs written before RetroDB learned to hide a particular password, such as ScreenScraper's, showed it in plain text when viewed or downloaded
  - type: security
    label: 將所有設定重設為預設值後，現在會保留您的 ROM 資料夾以及已完成初始設定的狀態。以前重設後會重新開啟首次設定頁面，而這些頁面不需登入即可使用，直到管理員再次執行設定為止
    en: Resetting all settings to their defaults now keeps your ROM folder and the fact that setup is done. Before, a reset reopened the first-time setup pages, which work without signing in, until an admin ran setup again
  - type: feature
    label: 街機遊戲又可以獲得 RetroAchievements 成就了。RetroDB 現在只會在 RetroAchievements 知道確切檔名時才連結街機遊戲，例如《快打旋風 II》的 sf2，因此不再依標題猜測而連到錯誤的遊戲。您的街機遊戲會在下次重新整理其 RetroAchievements 資料或抓取時連結
    en: Arcade games can earn RetroAchievements again. RetroDB now links an arcade game only when RetroAchievements knows its exact file name, such as sf2 for Street Fighter II, so it no longer guesses from titles and links the wrong game. Your arcade games link the next time their RetroAchievements data is refreshed or they are scraped
  - type: fix
    label: PlayStation 獎盃同步現在會修正先前錯誤建立的遊戲連結，例如許多遊戲被連到一款名為「D」的無關遊戲。您自己設定的連結絕不會被同步更改。下次同步會重新檢查所有舊連結，因此少數相近的配對可能會被取消連結；請手動重新連結
    en: PlayStation trophy sync now corrects game links it made wrongly before, such as many games linked to an unrelated game called "D". A link you set yourself is never changed by a sync. The next sync checks all older links again, so a few near matches may come unlinked; link those again by hand
  - type: fix
    label: 將等待中的批次抓取移到執行中的抓取之前，不會再把舊抓取的最後一個遊戲計入新抓取的數量。在願望單上按「全部抓取」時，若已有抓取在執行，現在會告知這點，而不是宣稱已啟動
    en: Moving a waiting bulk scrape ahead of a running one no longer adds the old scrape's last game to the new one's counts. Clicking "Scrape all" on the wishlist while one is already running now says so, instead of claiming it started
  - type: accessibility
    label: 使用螢幕閱讀器時，「執行中」按鈕現在只會在數量改變時說「1 個遊戲執行中」，而不是每隔幾秒念出一個單獨的數字。其清單會以具名視窗開啟並將游標置於其中，「終止」和「下一張光碟」按鈕會說明對哪個遊戲操作，終止後游標也會回到合理的位置。遊戲庫中的每張遊戲卡片現在可用鍵盤從標題開啟，其篩選按鈕也會說明篩選的內容，例如「依開發商篩選：Konami」
    en: 'With a screen reader, the "running" button now says "1 game running" only when the count changes, instead of reading a bare number every few seconds. Its list opens as a named window with the cursor inside, its Kill and Next disk buttons say which game they act on, and after Kill the cursor returns to a sensible place. Each game card in the library now opens with the keyboard from its title, and its filter buttons say what they filter, such as "Filter by Developer: Konami"'
  - type: feature
    label: 現在每位成員都可以在「設定 → 我的個人資料」下新增自己的 Steam 金鑰和 Steam ID，並匯入自己的 Steam 遊戲庫和成就。以前只有管理員可以
    en: Every member can now add their own Steam key and Steam ID under Settings → My Profile, and import their own Steam library and achievements. Until now only an admin could
  - type: fix
    label: 儲存遊戲詳細資料時，不會再把空白的玩家人數設為 1，也不會再把 RetroDB 為您推算出的年齡分級標記為您手動輸入。AI 填充會保留您標記為獨佔的遊戲，也會保留您在等待 AI 回應期間對遊戲所做的任何更改。抓取記錄現在只會列出它實際儲存的詳細資料
    en: Saving a game's details no longer sets an empty player count to 1, and no longer marks the age ratings RetroDB worked out for you as typed by you. AI Fill keeps a game you marked Exclusive, and keeps any change you make to a game while it is waiting for the AI's answer. A scrape's history now lists only the details it actually saved
  - type: fix
    label: 當某張已儲存的截圖大到無法開啟時，截圖審核不再中途停止；它會將該圖片視為無法讀取並繼續處理。說明頁的目錄現在連結到「模擬器」和「遊玩」，關於登入、背景工作、抓取、圖片、更新和錯誤回應的開發者說明，現在也如實描述程式的實際行為
    en: Screenshot Review no longer stops halfway when one stored screenshot is far too large to open; it counts that picture as unreadable and carries on. The help page's contents list now links to Emulators and Playing, and the developer notes on sign-in, background jobs, scraping, pictures, updates and error replies now say what the program really does
  - type: fix
    label: 開始 ROM 工具掃描的編輯者現在可以暫停、繼續或取消該掃描；其他人的掃描仍只有管理員能停止。標籤和清單在名稱缺漏或顏色無效時，會以清楚的訊息拒絕，而不是顯示錯誤頁面；將願望單中的遊戲改名成您已在願望單中的另一個遊戲時也會被拒絕，與新增時相同。清除 RA 資料現在也會忘記您的副本是否能獲得成就。RetroDB 不再提供的獎盃，不會再計入您的收藏家排名。Windows 的 ROM 路徑現在會依檔名比對 RetroAchievements 遊戲
    en: An editor who starts a ROM Tools scan can now pause, resume or cancel it; other people's scans stay an admin's to stop. Tags and lists refuse a missing name or a bad colour with a clear message instead of an error page, and renaming a wishlist game onto another one you already wish for is refused, as adding it is. Clear RA Data now also forgets whether your copy earns achievements. A trophy RetroDB no longer offers stops counting toward your collector rank. Windows ROM paths now match RetroAchievements games by file name
  - type: fix
    label: 維護修正。解壓縮失敗的多光碟壓縮檔，不會再留下半成品資料夾而阻礙每次重試。計算儲存空間現在會計入 PS3 遊戲資料夾內的所有檔案。清除抓取資料只會在您要求時才刪除圖片。遊戲庫掃描遇到另一個掃描剛新增的遊戲時，會繼續處理該主機的其餘遊戲
    en: Maintenance fixes. A multi-disc archive that fails to unpack no longer leaves a half-made folder behind that blocks every retry. Calculate Storage now counts every file inside a PS3 game folder. Clear Scraped Data deletes pictures only when you ask it to. A library scan that meets a game another scan has just added carries on with the rest of that console's games
  - type: fix
    label: 還原備份更安全了。現在會以資料庫本身期望的方式寫入遊戲庫資料庫，因此開啟著該資料庫的 RetroDB 部分會看到還原後的資料，而不會有損壞的風險。刪除遊戲現在也會刪除其盒裝圖片，以及其等待中的圖片和模擬器設定項目，因此新遊戲絕不會繼承它們。同時儲存的兩項設定也不會再遺失其中一項
    en: Restoring a backup is safer. It is now written into the library database the way the database itself expects, so a part of RetroDB that has it open sees the restored data instead of risking damage. Deleting a game now also deletes its box pictures and its waiting picture and emulator-setting entries, so a new game can never inherit them. Two settings saved at the same moment no longer lose one of them
  - type: fix
    label: 圖片修正。GIF 不會再被送去放大後又被丟棄。放大模型會對照其公布的指紋進行檢查，下載損壞時會重新下載，而不是永久關閉放大功能。標誌和含透明部分的圖片在放大後會保留透明度。轉換為 WebP 現在也會處理封底和標誌，也不再因為不必要的空間需求而拒絕處理大型遊戲庫。盒裝檔案的兩個面可以共用同一張圖片，移除記錄已損壞的盒裝時也會一併移除其圖片
    en: Picture fixes. GIFs are no longer run through the upscaler only to be thrown away. The upscaler model is checked against its published fingerprint, and a bad download is fetched again instead of turning upscaling off for good. Logos and pictures with see-through parts keep their transparency when enlarged. Convert to WebP now takes back covers and logos too, and no longer refuses a large library for want of room it does not need. Two faces of a box file can share one picture, and removing a box with a damaged record removes its pictures
  - type: fix
    label: 從 CLZ、Steam、Xbox 和 PlayStation 匯入時，不會再把所有僅以日文或其他非拉丁文字書寫的標題視為同一個遊戲，也不會再新增沒有 ID 的遊戲。CLZ 預覽在您確認匯入前不會再新增主機，而檢視 Steam、Xbox 或 PlayStation 遊戲庫的檢視者也不會再新增它們。從商店下架的 Steam 遊戲只會詢問一次，而不是每次同步都問
    en: Imports from CLZ, Steam, Xbox and PlayStation no longer treat every title written only in Japanese or another non-Latin script as the same game, and no longer add a game with no id. The CLZ preview no longer adds consoles before you confirm the import, and a viewer looking at a Steam, Xbox or PlayStation library no longer adds them either. A Steam game removed from the store is asked about once, not on every sync
  - type: fix
    label: 分析現在會將更多主機歸入其製造商，而不是「其他」，儀表板的「最近抓取」清單也會顯示您重新抓取的遊戲，而不只是新加入的遊戲
    en: Analytics now groups many more consoles under their maker instead of "Other", and the dashboard's Recently Scraped list shows a game you scraped again, not only newly added games
  - type: fix
    label: 您在博物館新增的手把圖片，在獨立版更新時會被保留。當線上服務因達到上限而暫停時，再次詢問的時間會以您自己的時區顯示
    en: Controller pictures you add in the Museum are kept when the standalone version updates. When an online service pauses at its limit, the time it will be asked again is shown in your own time zone
  - type: fix
    label: 額外光碟不能再連結到自己或另一張額外光碟，自動連結也不會在同一次執行中將光碟連結到它標記為額外光碟的光碟
    en: A bonus disc can no longer be linked to itself or to another bonus disc, and Auto-link no longer links a disc to one it marks as a bonus disc in the same run
  - type: fix
    label: 遊戲庫和主機頁面不再把街機 BIOS 檔案算作遊戲，無論是在總數還是字母列中。相似遊戲，以及在遊戲頁面點擊類型或發行商後得到的清單，不再顯示該遊戲自己的地區版本、額外光碟或 BIOS 檔案
    en: The Library and console pages no longer count arcade BIOS files as games, in their totals or the letter bar. Similar games, and the list you get by clicking a genre or publisher on a game's page, no longer show the game's own regional versions, bonus discs or BIOS files
  - type: fix
    label: 當非常大的清單被截斷時，全選現在會告知這點，而不是悄悄地只選取一部分
    en: Select all now says so when a very large list is cut short, instead of quietly selecting only part of it
  - type: fix
    label: 遊戲庫卡片現在會在您的成就或獎盃進度改變時，以及遊戲變為可遊玩或不可遊玩時更新
    en: Library cards now update when your achievement or trophy progress changes, and when a game becomes playable or stops being playable
  - type: fix
    label: 批次編輯在收到錯誤的選取內容時，不會再更改錯誤的遊戲；批次編輯失敗時，也不會再將遊戲標記為由您編輯
    en: Bulk edit can no longer change the wrong games when it is sent a bad selection, and a bulk edit that fails no longer marks the games as edited by you
  - type: fix
    label: 僅有 1% 吻合的 HowLongToBeat 配對不會再顯示為 100% 吻合，而載入失敗的頁面會顯示錯誤頁面，而不是原始錯誤文字
    en: A HowLongToBeat match that is only a 1% fit is no longer shown as a 100% match, and a page that fails to load shows the error page instead of the raw error text
  - type: security
    label: 更改密碼，或由管理員重設密碼後，現在會將該帳戶在其他所有裝置上登出。因此，此次更新後每個人都需要再登入一次。首次執行的設定頁面也獲得與其他所有頁面相同的跨網站防護
    en: Changing your password, or an admin resetting it, now signs that account out on every other device. Because of this, everyone signs in once more after this update. The first-run setup page also gets the same protection against other websites as every other page
  - type: fix
    label: 被拒絕作為頭像的圖片，不會再刪除您原有的頭像
    en: A picture that is refused as your avatar no longer deletes the avatar you had
  - type: fix
    label: 抓取對線上服務更溫和了。持續失敗的服務在填補缺漏時會被跳過一段時間，就像搜尋時原本的做法一樣，而 ScreenScraper 的遊戲查詢現在也會遵守其每日限制
    en: Scrapes are gentler on the online services. A service that keeps failing is skipped for a while when filling gaps, as it already was in searches, and ScreenScraper game lookups now respect its daily limits too
  - type: fix
    label: 抓取不會再因為發行年份未知（例如「TBA」）的遊戲而失敗，而在您的清單之外的地區發行的遊戲，例如「巴西、韓國」，會保留其地區，而不是變成您的預設值
    en: A scrape no longer fails on a game whose release year is unknown, such as "TBA", and a game listed for regions outside your list, such as "Brazil, Korea", keeps its region instead of becoming your default
  - type: fix
    label: 以 ~/ 書寫的 ES-DE 資料夾現在可以使用，非常大的 ES-DE 檔案也不會再被複製。建議的地區版本絕不會把您指定互不為版本的兩個遊戲重新湊在一起
    en: ES-DE folders written as ~/ now work, and a very large ES-DE file is no longer copied. Suggested regional versions never put back together two games you said are not versions of each other
  - type: security
    label: 從網路擷取圖片時，RetroDB 現在會拒絕更多私人網路位址，並正確跟隨網址的重新導向
    en: RetroDB refuses a few more private network addresses when fetching pictures from the web, and follows a web address's redirect correctly
  - type: fix
    label: 最後仍是英文的畫面現在也會跟隨您的語言，包括設定精靈、標籤、清單、比較遊戲、ROM 工具設定、批次抓取佇列、儀表板的中斷工作清單、遊戲庫卡片標籤，以及許多錯誤訊息
    en: The last screens still in English now follow your language too, including the setup wizard, Tags, Lists, Compare Games, ROM Tools settings, the bulk scrape queue, the dashboard's interrupted-jobs list, the library card labels and many error messages
  - type: security
    label: 含有網頁程式碼的系統名稱，不會再在批次抓取佇列視窗中被執行
    en: A system name holding web code can no longer run it in the bulk scrape queue window
  - type: accessibility
    label: 無論您在頁面的哪個位置，鍵盤所在的位置現在都會以您主題色彩的粗環標示，包括每個按鈕、方塊和連結。以前許多控制項只顯示一條淡淡的線，與滑鼠移過時相同
    en: Wherever you are on a page, the keyboard's place is now marked with a bold ring in your theme's colour, on every button, box and link. Before, many controls showed only a faint line, the same as when the mouse passed over them
  - type: accessibility
    label: 遊戲庫卡片上的類型、系列、開發商和發行商連結現在可用鍵盤操作。遊玩中遊戲的「執行中」按鈕也可用鍵盤開啟，按 Esc 或點擊其他地方即可關閉其清單
    en: The Genre, Series, Developer and Publisher links on library cards now work from the keyboard. The "running" button for games in play opens from the keyboard too, and Esc or a click elsewhere closes its list
  - type: accessibility
    label: 螢幕閱讀器現在會念出每個標籤顏色的名稱並說明選了哪一個，並將獎盃圖片讀作白金、金、銀和銅，而不是單一字母。遊戲啟動期間，Tab 不會再移到啟動畫面後方
    en: Screen readers now name each tag colour and say which one is chosen, and read trophy pictures as Platinum, Gold, Silver and Bronze instead of single letters. While a game starts, Tab no longer moves behind the starting screen
  - type: fix
    label: 如果更新在開始替換檔案之前停止，RetroDB 現在會重新啟動您原本的版本，而不是保持關閉
    en: If an update stops before it starts swapping files, RetroDB now starts the version you had again, instead of staying closed
  - type: fix
    label: 同時按兩次遊玩，不會再在內建播放器上啟動兩個遊戲。等待核心下載現在會在一段時間後放棄，或在 RetroDB 不再回應時放棄，而不是永遠等下去，而「已在執行中」的詢問也改用 RetroDB 自己的對話框
    en: Pressing Play twice at once can no longer start two games on the built-in player. Waiting for a core download now gives up after a while, or when RetroDB stops answering, instead of waiting forever, and the "already running" question uses RetroDB's own dialog
  - type: fix
    label: 您在遊玩期間開啟或關閉的金手指，會保存給正確的遊戲，絕不會取自檔名相同的另一個遊戲。金手指的問題絕不會阻止遊戲啟動
    en: Cheats you switch on or off during play are kept for the right game, never taken from another game whose file has the same name. A cheat problem never stops a game starting
  - type: fix
    label: RetroDB 寫入模擬器設定檔時更安全了。作為連結的設定檔會保持為連結、保留其權限，並保留它無法讀取的字元，而儲存失敗時也不會留下多餘的檔案
    en: RetroDB writes an emulator's settings file more safely. A settings file that is a link stays a link, keeps its permissions, and keeps letters it cannot read, and a failed save leaves no stray file behind
  - type: fix
    label: 在另一個執行時，您下移、與其他交換或繼續的批次抓取，不會再於 RetroDB 重新啟動時遺失；儀表板會從它停止的地方提供它。被換下的抓取不會再與新的抓取並行執行，而快速點擊兩次繼續也只會啟動一次工作
    en: A bulk scrape you move down the queue, swap with another or resume while one runs is no longer lost when RetroDB restarts; the dashboard offers it, from where it stopped. A swapped-out scrape no longer keeps running beside the new one, and two quick clicks on Resume start a job once
  - type: fix
    label: 單一遊戲的錯誤（例如網路中斷）不會再結束整個 AI 填充或修復盒裝與說明書地區的執行；該遊戲會計為失敗，其餘繼續進行。停止 RetroDB 現在也會乾淨地停止核心下載
    en: One game's error, such as the network dropping, no longer ends a whole AI Fill run or a Fix Box and Manual Regions run; that game counts as failed and the rest go on. Stopping RetroDB now also stops core downloads cleanly
  - type: fix
    label: 願望單項目不再因為錯誤或重新啟動而永遠停在「抓取中」，同一個願望單也不會再同時執行兩次「全部抓取」
    en: Wishlist items no longer stay on "scraping" forever after an error or a restart, and two Scrape All runs for the same wishlist no longer run at once
  - type: fix
    label: 腳本或第二個 RetroDB 啟動時，不再把正在執行的伺服器工作標示為已中斷；兩個副本同時啟動時，也不會再讓資料庫退回舊版本
    en: A script or a second copy of RetroDB starting up no longer marks the running server's jobs as interrupted, and two copies starting at once can no longer set the database back a version
  - type: fix
    label: 開始 PlayStation 同步時，不再因為要登入 Sony 而讓所有人的進度條停住等待。每日的 PlayStation 保持連線現在只會在 10 天期限將盡時才更新登入，而不是每天更新
    en: Starting a PlayStation sync no longer makes everyone's progress bars wait while it signs in to Sony. The daily PlayStation keep-alive now renews a sign-in only near the end of its 10 days, instead of every day
  - type: fix
    label: 抓取不再覆蓋您在抓取期間所做的修改，也不會再清空它不認得名稱的類型、模式或視角。它也不再為了配合遊戲模式而更改已儲存的玩家人數
    en: A scrape no longer writes over a change you make while it runs, and no longer empties a genre, mode or view it has no name for. It no longer changes a stored player count to match the game's modes
  - type: fix
    label: AI 填充不再更改您親手輸入的內容，例如您手動修正的發行商或類型；它只會修正抓取到的值。當數值只是寫法不同時，例如 4 位玩家寫成「1-4」，或相同類型的順序不同，也不再回報為已更改
    en: AI Fill no longer changes what you typed yourself, such as a publisher or genre you corrected by hand; it corrects only scraped values. It no longer reports a value as changed when it only wrote it differently, such as 4 players as "1-4" or the same genres in another order
  - type: fix
    label: 您為遊戲輸入的手把會被保留；主機的預設手把現在只會取代抓取和 AI 的值。由其他分級制度的 AI 推測轉換而來的年齡分級，現在也會標示為推測
    en: A controller you type for a game is kept; the console's default controller now replaces only scraped and AI values. An age rating converted from another board's AI guess is now marked as a guess too
  - type: fix
    label: 儲存遊戲的編輯視窗時，不再清空視窗中未顯示的欄位。遊戲頁面上的重設現在會清除它所說的全部內容，包括視角、版本和其他名稱；除非其他遊戲也在使用，否則會刪除該遊戲的圖片和影片，並立即更新遊戲庫篩選
    en: Saving a game's edit window no longer empties fields the window does not show. Reset on a game's page now clears everything it says it does, including the view, edition and other names, deletes the game's pictures and videos unless another game uses them, and updates the library filters straight away
  - type: fix
    label: 清除抓取資料現在也會清除視角、2D 或 3D，以及遊戲結構。匯入只有年份的 CLZ 遊戲時，只會保留年份，而不是 1 月 1 日
    en: Clear Scraped Data now also clears the view, 2D or 3D, and game structure. A CLZ import of a game with only a year keeps just the year, not 1 January
  - type: security
    label: Steam 同步不再讓每位家庭成員共用設定中的 Steam 金鑰。以前沒有自己 Steam 金鑰的成員，會在自己的帳戶下看到管理員的 Steam 遊戲庫和成就。設定中的金鑰現在只供管理員使用
    en: Steam sync no longer borrows the Steam key from Settings for every household member. A member with no Steam key of their own was getting the admin's Steam library and achievements under their account. The key in Settings now serves admins only
  - type: fix
    label: How Long to Beat 對大量遊戲的查詢，現在會儲存它確定的時間。以前每個確定的比對都會失敗，什麼也沒儲存。RetroAchievements 重新整理現在也會像抓取一樣，把每個遊戲的檔案與 RetroAchievements 的清單核對，讓遊戲連結到您擁有的確切版本
    en: How Long to Beat's lookup for many games now saves the times it is sure of. Before, every sure match failed and nothing was saved. RetroAchievements Refresh now also checks each game's file against RetroAchievements' list, as a scrape does, so a game is linked to the exact version you have
  - type: fix
    label: 背景工作完成的訊息又會顯示了，而且伺服器在重新啟動後接手工作時，工作的進度方塊也會察覺。以前兩者都不會出現
    en: The message that a background job has finished shows again, and a job's progress box notices when the server picks the job up after a restart. Before, neither ever appeared
  - type: fix
    label: PlayStation 獎盃：手動連結的遊戲在完整同步後仍會保持連結，同步也不再把遊戲連結到它的續作，例如把「Doom」連到「Doom Eternal」。匯入 PlayStation 遊戲現在會連結遊戲庫中已有的遊戲，就像 Steam 和 Xbox 匯入一樣，因此獎盃會顯示在該遊戲上
    en: 'PlayStation trophies: a game you linked by hand stays linked after a full sync, and a sync no longer links a game to its sequel, such as "Doom" to "Doom Eternal". Importing PlayStation games now links a game already in your library, as Steam and Xbox imports do, so its trophies show on it'
  - type: fix
    label: Xbox 在登入自動更新後，不再把您的玩家代號顯示為未知；連線緩慢或失敗也不再讓您登出 Xbox。只有 Microsoft 拒絕登入時才會登出
    en: Xbox no longer shows your gamertag as Unknown after its sign-in renews itself, and a slow or failed connection no longer signs you out of Xbox. Only Microsoft refusing the sign-in does that
  - type: fix
    label: 現在兩個人可以各自擁有同名的標籤；以前第二個會因錯誤而失敗。任何已登入的使用者現在都可以重新掃描自己的 RPCS3 獎盃；以前只有管理員可以，其他人要等到 RetroDB 重新啟動才會看到新的獎盃
    en: Two people can now each have a tag of the same name; before, the second one failed with an error. Any signed-in user can now rescan their own RPCS3 trophies; before, only an admin could, and everyone else saw old trophies until RetroDB restarted
  - type: security
    label: 您的登入資料保持私密。資料庫備份不再能被電腦上的其他帳戶讀取，備份失敗也不再刪除前一份備份。刪除或停用使用者時，也會讓他們在 DuckStation 和 PCSX2 中登出 RetroAchievements。從玩家自己的選單儲存的 RetroAchievements 登入，不會再延續到下一位玩家。記錄和已儲存的工作錯誤會隱藏 RetroAchievements 權杖，其他成員的 PlayStation 錯誤只會顯示給他們本人，舊的明文 PlayStation 和 Xbox 登入檔案也會被移除
    en: Your sign-ins stay private. Database backups can no longer be read by other accounts on the computer, and a failed backup no longer deletes the one before it. Deleting or switching off a user also signs them out of RetroAchievements in DuckStation and PCSX2. A RetroAchievements sign-in saved from the player's own menu no longer carries over to the next person who plays. Logs and saved job errors hide RetroAchievements tokens, another member's PlayStation error is shown only to them, and old plain-text PlayStation and Xbox sign-in files are removed
  - type: fix
    label: RetroDB 自己的檢查在執行時不再能碰到您的遊戲庫。它們一律使用資料庫、圖片和設定的臨時副本，若其中任何一項指向您的真實檔案，就會拒絕啟動
    en: RetroDB's own checks can no longer touch your library while they run. They always use a throwaway copy of the database, pictures and settings, and refuse to start if any of them points at your real files
  - type: fix
    label: 清除孤立檔案不再刪除您願望單的圖片。開啟遊戲不再讓它忘記找不到的螢幕截圖。以前在圖片磁碟機未接上時，每個開啟過的遊戲都會失去整個螢幕截圖清單；現在清單會保留，找不到的圖片只會被隱藏
    en: Clean orphaned files no longer deletes your wishlist's pictures. Opening a game no longer makes it forget screenshots it cannot find. Before, with the picture drive unplugged, every game you opened lost its whole screenshot list; now the list is kept, and a missing picture is only hidden
  - type: fix
    label: 影片或說明書下載中途失敗時，不再損壞遊戲原有的副本，下載失敗也不再在媒體資料夾留下隱藏的半成品檔案。背景放大工具不再用舊圖片覆蓋期間下載的新圖片。轉換為 WebP 會讓所有共用同一張圖片的遊戲繼續指向它，也不會碰圖片資料夾以外的檔案
    en: A video or manual download that fails part-way no longer damages the copy the game already had, and a failed download no longer leaves a hidden half-file in the media folder. The background upscaler no longer saves an old picture over a newer one downloaded meanwhile. Convert to WebP keeps every game that shares a picture pointing at it, and never touches a file outside the picture folders
  - type: fix
    label: 刪除遊戲或願望單項目時，現在也會刪除它的圖片、影片和說明書，但會保留其他遊戲或願望單項目仍在使用的檔案。已儲存的圖片又可以被電腦上的其他帳戶讀取，調整圖片大小也會把無法儲存的圖片算作失敗，而不是完成
    en: Deleting a game or a wishlist item now deletes its pictures, videos and manuals too, but keeps any another game or wishlist item still uses. Saved pictures can be read by other accounts on the computer again, and Resize Images counts a picture it could not save as failed, not as done
  - type: fix
    label: 重複項目搜尋不再把可用的檔案列為刪除建議。依名稱搜尋時，不再把同一遊戲的 .cue 和 .bin 視為彼此的副本。它絕不會建議刪除光碟的軌道檔案，因為兩個版本的遊戲可能共用它。它也不會刪除播放清單列出的光碟。當您刪除某個遊戲的檔案時，該遊戲會改指向您保留的副本，因此仍留在遊戲庫中
    en: Duplicate Finder no longer offers a working file for deletion. Looking by name, it no longer calls a game's .cue and .bin copies of each other. It never offers a disc's track file, which two versions of a game can share. It will not delete a disc that a playlist lists. A game whose file you delete now moves to the copy you keep, so it stays in the library
  - type: fix
    label: 整理多光碟不再覆蓋現有的播放清單或遊戲資料夾中已有的檔案；它會停止並告訴您是哪一個。它建立的播放清單列出每張光碟的 .cue，而不是軌道檔案。檔案被移動的遊戲現在會跟著檔案進入資料夾，因此清除遺失的 ROM 不會再移除它們
    en: Organize Multi-Disc no longer writes over an existing playlist or a file already in the game's folder; it stops and says which. The playlist it makes lists each disc's .cue, not its track files. Games whose files it moves now follow them into the folder, so Clean missing ROMs no longer removes them
  - type: fix
    label: 使用「刪除原始檔」轉換為 CHD 時，現在也會刪除光碟的軌道檔案，但會保留另一個 .cue 仍在使用的軌道。遊戲和列出舊光碟的播放清單現在會指向新的 .chd。重新命名遊戲檔案時，現在會更新列出它的播放清單，而 .cue 需要的軌道檔案則無法重新命名。從 zip 移除檔案時，只會移除您選取的檔案，即使名稱含有 [ 或 ] 也一樣。螢幕截圖去重只會刪除掃描找到的重複副本，並且一定會保留一份
    en: Converting to CHD with "delete originals" now deletes the disc's track files too, but keeps a track another .cue still uses. The game and any playlist that listed the old disc now point at the new .chd. Renaming a game's file now updates the playlist that lists it, and a track file a .cue needs cannot be renamed. Removing files from a zip removes only the files you picked, even when a name holds [ or ]. Screenshot Dedup deletes only the copies its scan found, and always keeps one
  - type: fix
    label: 遊戲頁面上的 How Long to Beat 會搜尋您輸入的內容。以前找不到標題時，它會改搜尋遊戲的其他名稱，還可能提供不同的遊戲，例如粉絲重製版。當輸入框裡是遊戲本身的名稱時，它仍會嘗試其他名稱
    en: How Long to Beat on a game's page searches for what you type. Before, a title it could not find made it search the game's other names instead, and it could offer a different game, such as a fan remake. It still tries the other names when the box holds the game's own name
  - type: fix
    label: 說明書中 How Long to Beat 的步驟現在與畫面一致。以前寫的是從清單中選擇一個比對；實際頁面只顯示一個比對，並附有儲存和取消。PlayStation 說明不再說登入約可持續兩個月，因為 RetroDB 會自動重新登入。全部 20 種翻譯版說明書都已加入這兩項修改
    en: The help manual's How Long to Beat steps match the screen. They said to pick a match from a list; the page shows one match with Save and Cancel. The PlayStation help no longer says the sign-in lasts about two months, since RetroDB signs in again by itself. All 20 translated manuals carry both changes
  - type: fix
    label: 每個字母列現在都以「全部」按鈕開頭。在遊戲庫、主機和 PSN 獎盃頁面中，選擇字母只會顯示該字母的遊戲，以前沒有按鈕可以讓其餘遊戲回來。在其他成就頁面中，「全部」會回到第一個遊戲
    en: Every letter bar now starts with an All button. On the Library, console and PSN Trophies pages, picking a letter shows only that letter's games, and before there was no button to bring the rest back. On the other achievement pages, All goes back to the first game
  - type: fix
    label: 您在設定中貼上的新 PlayStation 登入權杖現在會立即生效。以前 RetroDB 會繼續使用舊的登入直到過期，而儲存並測試連線還會把舊登入回報為可用。Sony 拒絕的權杖也不再取代仍可用的權杖
    en: A new PlayStation sign-in token you paste in Settings is now used straight away. Before, RetroDB kept using the old sign-in until it ran out, and Save & Test Connection reported that old sign-in as working. A token Sony refuses no longer replaces one that works
  - type: enhancement
    label: 設定中的 PlayStation 登入現在更容易維持。橫幅不再倒數您根本不必處理的天數，因為 RetroDB 會自動重新登入；只有在 Sony 拒絕您儲存的權杖時才會變紅。「貼上」按鈕不再讓瀏覽器要求讀取剪貼簿：它會把游標放進輸入框，供您按 Ctrl+V。步驟現在也說明，替換仍可用的權杖時要先登出 PlayStation，而且這些訊息可以翻譯
    en: 'The PlayStation sign-in in Settings is easier to keep going. The banner no longer counts down days you never had to act on, because RetroDB signs in again by itself; it turns red only when Sony refuses your saved token. The Paste here button no longer makes the browser ask to read your clipboard: it puts the cursor in the box for Ctrl+V. The steps now say to sign out of PlayStation first when you replace a token that still works, and their messages can be translated'
  - type: enhancement
    label: 彈出訊息和提問方塊，例如「設定已儲存」或「刪除此清單？」，現在在每個頁面都可以翻譯。以前不論您選哪種語言，大部分都仍是英文
    en: Pop-up messages and question boxes, such as "Settings saved" or "Delete this list?", can now be translated on every page. Before, most of them stayed in English whatever language you chose
  - type: enhancement
    label: 說明 PlayStation 登入失敗原因的訊息，例如「您的 NPSSO 可能已過期」，現在可以翻譯了
    en: The messages that say why a PlayStation sign-in failed, such as "Your NPSSO may have expired", can now be translated
  - type: fix
    label: 各種語言的說明書現在都與英文版一致。新增了隨處搜尋、保留標題、MAME 名稱和盒子背面，落後的舊段落也已更新
    en: The help manual in every language now matches the English one. It gains Search Anywhere, Keeping a Title, MAME Names and the back of the box, and older paragraphs that had fallen behind are up to date
  - type: fix
    label: 在德文、南非荷蘭文和西班牙文中，遊戲封面上的返回按鈕現在表示盒子背面，而不是「返回」
    en: In German, Afrikaans and Spanish, the Back button on a game's cover now says the back of the box, not "go back"
  - type: feature
    label: 按下遊遊玩後，在遊戲啟動期間，畫面會以遊戲背景圖片上的遊戲標誌填滿；若沒有標誌，則以大字顯示遊戲名稱。遊戲視窗開啟時會自動消失，按 Esc 或點擊也會關閉
    en: Pressing Play now fills the screen with the game's logo on its background picture while the game starts, or its name in large letters when it has no logo. It goes away by itself when the game's window opens, or when you press Esc or click
  - type: feature
    label: 可旋轉的 3D 盒子現在擁有 PS5 盒子的真實形狀：圓角和圓邊、封面周圍凸起的邊緣、兩半相接的線條，以及開口側的手指槽。這需要使用會寫入形狀的 Slipcase 版本所產生的盒子檔案；請重新匯入盒子以取得。其他盒子外觀不變
    en: 'The turnable 3D box now has the real shape of a PS5 case: rounded corners and edges, the raised lip round the cover, the line where the two halves meet, and the finger slot in the opening side. It needs a box file from a Slipcase version that writes the shape; import the box again to get it. Other boxes look as before'
  - type: enhancement
    label: 重新整理 RetroAchievements 已從設定移到 RetroAchievements 頁面，並改名為「尋找有成就的遊戲」。那裡的每個按鈕現在都有一行說明它的作用，因此很容易分辨尋找遊戲和同步進度。尚未連結任何遊戲時，頁面會向管理員顯示尋找按鈕，而不是跳到下一個分頁
    en: Refresh RetroAchievements moved from Settings to the RetroAchievements page, and is now called Find Games with Achievements. Every button there now has a line saying what it does, so Find Games and Sync Progress are easy to tell apart. With no games linked yet, the page shows an admin the Find button instead of moving on to the next tab
  body: "<ul>\n  <li><strong>4.0 是 RetroDB 的最後一個網頁版本。</strong>之後的新版本\n    將改為 Windows、Linux 和 macOS 的桌面應用程式,以及 Android 應用程式。\n    它們可以開啟你現有的遊戲庫。4.0 版仍可繼續\n    下載,但只會提供安全性修正,以及會導致資料遺失的錯誤修正。\n    桌面應用程式推出後,設定 → 更新 會提供連結。</li>\n  <li><strong>各語言的說明書都已更新至最新內容。</strong>\n    原本只有英文說明書才有的章節,現在都已翻譯。</li>\n</ul>\n"
  body_en: "<ul>\n  <li><strong>4.0 is the last web version of RetroDB.</strong> New versions\n    will be a desktop app for Windows, Linux and macOS, and an Android app.\n    They will open your existing library. Version 4.0 stays available to\n    download, and gets only security fixes and fixes for bugs that lose data.\n    Settings → Updates links to the desktop app when it is out.</li>\n  <li><strong>The help manual is up to date in every language.</strong>\n    Sections that were only in the English manual are now translated.</li>\n</ul>\n"
- version: 3.35.4
  date: '2026-11-03'
  tags:
  - type: fix
    label: 從遊戲中刪除的螢幕截圖,現在會一直保持刪除狀態。以前,下次抓取時可能會從 ES-DE 把它複製回來,或從網路來源再次下載。在「重複螢幕截圖」工具中刪除多餘的副本不算在內,因為圖片仍會保留一份
  - type: feature
    label: 遊戲現在有標誌了:抓取時會從 ES-DE、ScreenScraper、TheGamesDB、IGDB 和 Steam 儲存標誌,遊戲頁面會把它顯示在標題上方,或代替缺少的包裝盒圖。你可以在「編輯」視窗中上傳或刪除標誌。用「補齊缺漏」進行批次抓取,即可為之前抓取過的遊戲補上標誌
  - type: fix
    label: IGDB 不再把遊戲的標誌當作頁面背景
  - type: feature
    label: 遊戲現在有包裝盒背面了:抓取時會從 ES-DE、ScreenScraper 和 TheGamesDB 儲存背面圖,遊戲頁面封面上的「背面」按鈕可以顯示它。點一下背面圖即可放大。你可以在「編輯」視窗中上傳或刪除背面圖。每次抓取遊戲時都會補上背面圖;「補齊缺漏」不會只為了背面圖而重新抓取遊戲
  - type: fix
    label: 在 TheGamesDB 上沒有正面封面的遊戲,不再把包裝盒背面當作封面
  - type: fix
    label: 如果在批次抓取進行中於「設定」關閉某個抓取來源,從下一個遊戲開始,找不到的遊戲數量現在會正確計算。以前,遊戲可能會被算成已停止
  - type: enhancement
    label: 在沒有設定模擬器的系統上,「遊玩」按鈕會呈灰色。將游標移到按鈕上可查看原因,或點一下會彈出視窗,說明尚未設定模擬器。以前按鈕旁邊會有一行文字
  body: "<ul>\n  <li><strong>遊戲有標誌了。</strong>抓取時會儲存每個遊戲的\n    標誌,遊戲頁面會把它顯示在標題上方,或代替缺少的\n    包裝盒圖。用「補齊缺漏」進行批次抓取,即可為\n    之前抓取過的遊戲補上標誌。</li>\n  <li><strong>遊戲有包裝盒背面了。</strong>遊戲頁面封面上的「背面」按鈕\n    可以顯示它,點一下即可放大。每次抓取遊戲時\n    都會補上背面圖。</li>\n  <li><strong>刪除的螢幕截圖會保持刪除。</strong>下次抓取\n    不會再把它複製回來或重新下載。</li>\n  <li><strong>「遊玩」會說明無法啟動的原因。</strong>在沒有設定模擬器的系統上,\n    「遊玩」按鈕會呈灰色並說明原因。</li>\n</ul>\n"
- version: 3.35.3
  date: '2026-11-02'
  tags:
  - type: feature
    label: ROM 工具新增「MAME 名稱」工具：MAME 遊戲會從 MAME 自己的清單取得真正的名稱、年份和製作商，檔案則保留原本的簡短名稱。之後抓取就能找到每款遊戲，你也可以依類別篩選 MAME 清單，例如排除投幣式賭博機。BIOS 組合不會顯示在清單中
  - type: fix
    label: ROM 報告不再建議重新命名 MAME 檔案，因為檔案改名後就無法在 MAME 中使用
  - type: fix
    label: 設定現在會說明在註冊 Xbox 應用程式之前，Microsoft 有哪些要求。由於這個原因，Xbox 登入無法測試
  - type: enhancement
    label: 大量 AI 填充中已移除獨立的「正式名稱」卡片，因為填充中的「正式名稱」開關已經有相同功能
  - type: fix
    label: 當 Sony 拒絕已儲存的 PlayStation 登入時，儀表板和設定現在會提示你，並請你重新連結。以前每次伺服器啟動時，記錄只會顯示毫無意義的錯誤，也沒有任何提示
  - type: feature
    label: 從 Steam 匯入現在會在背景從商店頁面填入每款遊戲的簡介、製作人員、Metacritic 分數、年齡分級、遊戲模式、封面、背景和螢幕截圖。若要取得類型和發行日期，請抓取該遊戲
  - type: feature
    label: Steam 同步現在會保留你的遊玩時間和上次遊玩時間，遊戲頁面也會顯示
  - type: fix
    label: Steam 匯入頁面的「取得遊戲庫」現在可供已儲存 Steam 金鑰的管理員使用。以前它會把金鑰的隱藏形式傳給 Steam，頁面還錯誤地要求你把個人資料設為公開
  - type: fix
    label: 遊戲庫中已有同名的 Steam 或 Xbox 遊戲，匯入時現在會連結到該遊戲，成就也會同步。以前它會被略過，而且不會連結
  - type: fix
    label: 從 Steam、Xbox 和 PlayStation 匯入的遊戲現在會立即正確排序，例如 Final Fantasy IX 排在 Final Fantasy X 之前，名稱中 Steam 的商標符號也會移除
  - type: feature
    label: 在 RetroAchievements 使用純檔案雜湊的系統上，例如 Mega Drive 和 Game Boy，遊戲頁面會顯示你的檔案能否獲得成就，而且該雜湊會連結到正確的遊戲。請執行 RA 重新整理來填入這項資料
  - type: fix
    label: 抓取現在會先用你的確切檔案向 ScreenScraper 查詢，再依名稱搜尋，因此會找到你的遊戲，而不是標題相近的其他遊戲。你自己勾選的結果仍然優先
  - type: enhancement
    label: 圖片縮放的進度框現在會標示每張圖片所屬的遊戲和系統
  - type: feature
    label: 抓取現在會從 ScreenScraper 和 TheGamesDB 取得標題畫面，從 IGDB 和 TheGamesDB 取得更多正式名稱（例如遊戲的日文標題），並從 IGDB 取得遊戲曾發行的其他主機
  - type: feature
    label: 沒有使用者評分的遊戲，現在會採用你 ES-DE 收藏中的分級（如果有的話）
  - type: feature
    label: 遊戲頁面會顯示有多少玩家為 HowLongToBeat 的結果計時，並連結到其頁面。在此之前儲存的結果，下次查詢時就會顯示這些資料
  - type: feature
    label: RetroAchievements 頁面會顯示有多少人在玩某款遊戲，以及每個成就的獲得比例
  - type: fix
    label: ROM 工具的資料夾瀏覽器在沒有起始資料夾時，現在會開啟你的 ROM 資料夾，而不是失敗。IGDB 傳回的資料若有錯亂，現在只會損失那一項細節，而不是該遊戲從 IGDB 取得的全部資料
  - type: fix
    label: ScreenScraper 的每日上限現在會讓 RetroDB 暫停查詢直到稍後，大量抓取也會提示這件事，並繼續使用其他來源。以前用完上限時看起來像是「找不到遊戲」，而且整夜持續發出請求
  - type: fix
    label: 服務達到上限時，若沒有任何來源能回應某款遊戲，該遊戲不再被標記為已抓取，所以下次執行會再試一次
  - type: fix
    label: 當 TheGamesDB 金鑰用完當月額度時，RetroDB 會改用你的另一組金鑰，兩組都用完後就停止查詢
  - type: fix
    label: RAWG 的每月上限現在也會讓 RetroDB 停止查詢，而且 IGDB 會維持在每秒四次請求的限制內
  - type: fix
    label: HowLongToBeat 的大量查詢現在會在網站表示請求過多時以訊息結束，而且對該網站的每次請求都會間隔開來
  - type: fix
    label: 修正封面和說明書地區功能，不再因為連續 25 款遊戲 ScreenScraper 都不認識就放棄。只有在 ScreenScraper 表示已達上限時才會停止
  - type: fix
    label: 在遊戲頁面上，每個年齡分級現在會置中顯示在其 AI 推測標籤上方
  - type: fix
    label: 設定中的 TheGamesDB 額度現在使用不會消耗額度的檢查方式，而且在服務沒有提供重設日期時，不再顯示編造的重設日期
  body: |
    <ul>
      <li><strong>MAME 遊戲有了真正的名稱。</strong>ROM 工具中新增的 MAME 名稱工具,會從 MAME 自己的清單取得名稱、年份和製造商。檔案會保留簡短的檔名,因為 MAME 需要它們。你可以依類別篩選 MAME 清單,BIOS 組會被隱藏。</li>
      <li><strong>Steam 匯入帶來更多內容。</strong>每個遊戲都會從商店頁面填入說明、製作名單、Metacritic 評分、年齡分級、遊戲模式和圖片。同步時會保留你的遊玩時間和上次遊玩的時間。遊戲庫中已有同名遊戲時,現在會連結到該遊戲,因此它的成就也會同步。</li>
      <li><strong>抓取能找到你的確切遊戲。</strong>抓取時會先向 ScreenScraper 查詢你的確切檔案,再依名稱搜尋。抓取也會帶來標題畫面、更多官方名稱,以及遊戲發行過的其他主機。</li>
      <li><strong>RetroAchievements 認得你的版本。</strong>在使用一般檔案雜湊的系統上,例如 Mega Drive 和 Game Boy,遊戲頁面會顯示你的版本能否獲得成就。執行 RA 重新整理即可填入這項資訊。RetroAchievements 頁面也會顯示有多少人遊玩某款遊戲,以及其中有多少比例的人獲得了各項成就。</li>
      <li><strong>遵守線上限制。</strong>當 ScreenScraper、TheGamesDB 或 RAWG 達到上限時,RetroDB 會暫停詢問,稍後再試,批次抓取則會繼續使用其他來源。當時沒有任何來源能回應的遊戲,會在下次執行時再試一次。</li>
      <li><strong>PlayStation 登入被拒時會提示。</strong>當 Sony 拒絕已儲存的登入時,儀表板和設定現在會要求你重新連結。</li>
      <li><strong>官方名稱已移動。</strong>它獨立的卡片已從批次 AI 填充中移除,因為填充中的官方名稱開關功能相同。</li>
    </ul>
- version: 3.35.2
  date: '2026-11-02'
  tags:
  - type: fix
    label: 總遊玩時間不再把分鐘當成小時計算,儀表板、收藏家獎盃和分析圖表都已修正。以前 36 分鐘的遊戲會被算成 36 小時
  - type: fix
    label: HowLongToBeat 不再把續作誤認成你的遊戲。《Double Dragon II》不會再拿到《Double Dragon III》的時間
  - type: fix
    label: 批次 HowLongToBeat 查詢不再儲存其他系統上同名遊戲的時間。Game Boy Color 版《Mario Golf》不會再拿到 Nintendo 64 版的時間。這類比對結果現在會留在審核頁面等你確認
  - type: fix
    label: 批次與單一 HowLongToBeat 查詢現在都會參考遊戲的發行年份,所以 1993 年的《Doom》不會再拿到 2016 年《Doom》的時間
  - type: new
    label: ROM 工具中的「檢查已儲存遊玩時間」會把看起來有問題的已儲存比對結果送到審核頁面,由你決定保留或清除
  - type: fix
    label: 使用「僅限缺少項目」的批次 HowLongToBeat 查詢,現在會重試已比對但沒有時間的遊戲,且每次請求之間會間隔一秒
  - type: fix
    label: 比對分數 72% 不再於遊戲頁面顯示成 100%
  - type: fix
    label: 遊戲不再顯示其他遊戲的 RetroAchievements。GameCube 版《Resident Evil 4》不會再顯示《Resident Evil》的成就組,《Ratchet Deadlocked》也不會再顯示《Ratchet & Clank》的成就組
  - type: fix
    label: 當 RetroAchievements 沒有對應的遊戲時,抓取現在會移除該 RetroAchievements 連結。如果無法連上 RetroAchievements,連結則會保留
  - type: fix
    label: RetroAchievements 現在能找到更多你的遊戲,可透過 ROM 檔名、別名、帶有重音的字元(如 Ōkami)以及有兩個名稱的標題來比對
  - type: fix
    label: RetroAchievements 不再把遊戲連到額外成就組、改版或試玩版,X-Men 也不再被當成 G-Men
  - type: new
    label: 遊戲頁面會顯示 RetroAchievements 為所連結遊戲使用的名稱,方便你發現連結錯誤
  - type: fix
    label: RA 重新整理現在會儲存每款遊戲的點數,所以遊戲不會再顯示 0 點
  - type: new
    label: 遊戲頁面會把 AI 提供的年齡分級標示為根據遊戲內容的推測,並說明各分級機構的起始年份。1987 年的《OutRun》不會再看起來像是 ESRB 官方分級
  - type: new
    label: 遊戲頁面會標示來自 AI 的評論分數和銷量數字。自行修改分級或銷量後,標記就會消失
  - type: fix
    label: AI 提供的評分若使用錯誤的評分範圍會被拒絕,所以廣受好評的遊戲不會再因為新的抓取而得到 100 分中的 7 分
  - type: fix
    label: AI 提供的評分數量不再與其他網站的分數存在一起,遊戲頁面也不會再顯示已存入的這類數量
  - type: fix
    label: AI 提供的銷量範圍或金額不再被當成只有幾份的銷量
  - type: fix
    label: AI 回答不再把清單存成程式碼,不再把 N/A 或 None 當成值,也不會把遊戲本身的主機放進其他平台
  - type: fix
    label: AI 填充現在會把被取代的值保留在遊戲的歷史記錄中
  - type: fix
    label: 卡匣遊戲不再被亂加「電池儲存」類型,新的 AI 回答也不再預設為標準版
  - type: fix
    label: 遊戲的系列不再靠切割標題得出,所以《Need For Speed》不會再被歸在名為 Need 的系列。IGDB 的系列名稱會重新讀取,舊的猜測值會清除,等下次抓取時重新填入
  - type: fix
    label: 說明文字不再顯示代替引號的網頁代碼,或像這樣的標題符號
  - type: fix
    label: 同一間公司現在只有一種拼法,所以點選 Sega 就能找到所有 SEGA 遊戲。地區只保留一個值,平台則使用清單中的名稱
  - type: fix
    label: 來自 RAWG 的遊戲標題不再被加上年份,別名也不再列出 dosbox.exe 之類的檔名
  - type: fix
    label: 完整重新抓取不再用猜測值取代你設定的分級或手把,抓取中途失敗時也不再以較不嚴謹的方式寫入資料
  body: "<ul>\n  <li><strong>AI 回答會標明是 AI。</strong>AI 提供的年齡分級會保留,\n    並標示為根據遊戲內容的推測,同時顯示各分級機構的起始年份。AI 提供的分數和銷量也會加上標記。</li>\n  <li><strong>RetroAchievements 會顯示正確的遊戲。</strong>續作不再\n    帶有第一款遊戲的成就。更新後,\n    儀表板會提供一次 RetroAchievements 重新整理。按下後可修復\n    舊的連結。存在錯誤連結下的進度會被移除,下次\n    同步時會重新填入。</li>\n  <li><strong>遊玩時間總計更正確。</strong>不到一小時的時間以前\n    被當成小時計算,導致儀表板和收藏家獎盃上的總計偏高。部分總計和獎盃會因此下降。</li>\n  <li><strong>HowLongToBeat 會找到正確的遊戲。</strong>續作不再\n    被當成你擁有的遊戲,而且現在會考慮遊戲的系統和年份。\n    其他系統或相差多年的比對結果,會留在\n    審核頁面等你處理。</li>\n  <li><strong>檢查已儲存的內容。</strong>在 ROM 工具中按下「檢查已儲存遊玩\n    時間」,可把有疑問的已儲存比對結果送到審核頁面。\n    在你決定之前不會有任何變更。</li>\n  <li><strong>系列名稱更可靠。</strong>遊戲的系列不再來自\n    切割標題。更新後,猜測出來的系列名稱會被清除,其中也包括一些正確的。下次抓取時\n    會從有提供系列名稱的來源重新填入。</li>\n  <li><strong>文字更乾淨。</strong>說明文字不再顯示網頁代碼或\n    標題符號。同一間公司只有一種拼法,一款遊戲只有一個地區,\n    dosbox.exe 之類的檔名也不再被列為其他標題。這會\n    在更新後自動執行一次。</li>\n  <li><strong>完整重新抓取會保留你的選擇。</strong>你設定的分級或\n    手把會保留,除非來源確實提供了資料。</li>\n</ul>\n"
- version: 3.35.1
  date: '2026-11-02'
  tags:
  - type: fix
    label: 抓取資料時,不會再拿續作來當成你擁有的遊戲。找不到完全相同的遊戲時,《Street Fighter II》不會再取得《Street Fighter》的資料,《Sonic the Hedgehog》也不會取得《Sonic 2》的資料
  - type: fix
    label: 批次抓取現在只有在標題真正相符時才會接受比對結果。主機正確加上發行日期,不能再單靠這兩項就通過
  - type: fix
    label: IGDB 的模組、DLC、合集和更新檔不會再比對成遊戲,除非你的 ROM 名稱與它完全相同
  - type: fix
    label: RAWG 會把一款遊戲的所有版本合併成一筆資料,所以當它涵蓋多個主機時,不再提供開發商、發行商、年齡分級或多人模式,也完全不再猜測玩家人數
  - type: fix
    label: IGDB 的玩家人數和多人模式現在取自該遊戲自己的主機
  - type: fix
    label: 當各來源的相符程度相同時,現在由你設定的抓取來源順序決定。RAWG 不再因為有圖片或 Metacritic 分數而額外加分,新安裝會將 RAWG 排在最後
  - type: fix
    label: Commodore 64 和 DOS 遊戲不再搜尋 RAWG,因為它把這些遊戲歸在 Amiga 和 PC 下,可能會比對到其他平台的遊戲
  - type: fix
    label: 你選擇的 ScreenScraper 結果現在一定就是你得到的遊戲,即使結果頁面開著超過 10 分鐘也一樣
  - type: fix
    label: 重音符號和標點不再降低標題的相符程度,所以 Pokémon 可以找到 Pokemon,R.B.I. 可以找到 RBI
  - type: fix
    label: 發行日期現在只會顯示來源所知道的精確度。只知道年份的遊戲只會顯示年份,不會再編出 1 月 1 日或 12 月 31 日
  - type: fix
    label: IGDB 和 RAWG 的日期現在屬於遊戲自己的主機,IGDB 的日期也屬於自己的地區,所以美版不會再顯示日本的日期,移植版也不會再顯示原作的年份
  - type: feature
    label: 遊戲頁面上的發行日期清單現在會由 IGDB 和 ScreenScraper 填入,不再只靠 AI
  - type: added
    label: 新的 ROM 工具卡片:整理發行日期,會清除舊版抓取所存的編造日期,讓之後的抓取可以填入真正的日期
  - type: fix
    label: 無論由哪個來源填入,類型、視角和遊戲模式現在都使用同一套名稱,篩選就能找到所有遊戲。同一個類型不會再同時顯示為 RPG 和 Role Playing Game
  - type: added
    label: 新的 ROM 工具卡片:整理類型、視角和模式,會轉換舊版抓取所存的內容,把 FPV 這類詞移到正確的欄位,並修正與遊戲模式相矛盾的玩家人數
  - type: fix
    label: IGDB 的純線上遊戲不會再被列為本機多人遊戲,需要兩名玩家的遊戲也不會再被列為單人遊戲
  body: "<ul>\n  <li><strong>抓取不再拿錯遊戲。</strong>續作不再被當成你擁有的遊戲,所以《Street Fighter II》不會再從《Street Fighter》取得任何資料,批次抓取也要求標題相符,而不是只看主機。IGDB 的模組、DLC 和合集不會再比對成功,除非你的 ROM 名稱與它完全相同。</li>\n  <li><strong>RAWG 不再混用遊戲的不同版本。</strong>當它的資料涵蓋多個主機時,不再提供開發商、發行商、年齡分級或多人模式,也不再猜測玩家人數。Commodore 64 和 DOS 遊戲也不再搜尋 RAWG。</li>\n  <li><strong>相符程度相同時,由你的抓取來源順序決定。</strong>RAWG 不再因為有圖片或 Metacritic 分數而額外加分,新安裝會將它排在最後。</li>\n  <li><strong>發行日期只顯示來源所知道的內容。</strong>只知道年份的遊戲只會顯示年份。IGDB 和 RAWG 的日期屬於遊戲自己的主機,發行日期清單現在也會由 IGDB 和 ScreenScraper 填入。</li>\n  <li><strong>類型、視角和模式使用同一套名稱。</strong>篩選現在能找到所有遊戲,純線上遊戲也不會再被列為本機多人遊戲。</li>\n  <li><strong>兩張新的 ROM 工具卡片。</strong>整理發行日期,以及整理類型、視角和模式,可修正舊版抓取所存的內容。按下它們後,再用「填補缺漏」執行批次抓取。</li>\n  <li><strong>玩家人數取自遊戲自己的主機,</strong>你選擇的 ScreenScraper 結果也一定就是你得到的遊戲。</li>\n</ul>\n"
- version: 3.35.0
  date: '2026-11-01'
  tags:
  - type: fix
    label: 當 ES-DE 不是主要來源時,現在會保留它在抓取順序中的位置。之前它的描述、公司和封面會被後面的來源和 AI 取代
  - type: fix
    label: 當 ES-DE 不是主要來源時,現在會把 ES-DE 的螢幕截圖和標題畫面加入遊戲,除非與遊戲已有的看起來相同
  - type: fix
    label: ES-DE 不再複製遊戲已有的同人圖、影片或說明書,完整重新抓取也不再刪除其他來源剛下載的包裝盒圖
  - type: fix
    label: ES-DE 現在會讀取遊戲自己 ROM 檔案對應的條目,因此同名的其他版本不會再提供資料,PS3 資料夾遊戲也能找到 ES-DE 封面
  - type: fix
    label: 從 ES-DE 匯入系統標誌時,不再因為名稱含有「gb」等字母而取到無關的圖片
  - type: fix
    label: ROM 檔名中的標籤,例如 (USA),現在會直接決定地區,不再詢問 AI,因為 AI 可能把美國版列為歐洲或日本
  - type: feature
    label: ROM 工具新增「從檔名修正地區」工具,可修正舊版抓取弄錯的遊戲
  - type: fix
    label: RAWG 背景圖不再儲存為包裝盒圖,因為它們常常是螢幕截圖,會擋住真正的封面。現在改作同人圖使用
  - type: feature
    label: ROM 工具新增「清除包裝盒圖中的 RAWG 圖片」工具,可移除舊版抓取儲存的圖片,讓抓取能找到真正的封面
  - type: feature
    label: 依照 RAWG 的要求,RetroDB 現在在側邊欄以連結標示 RAWG
  - type: fix
    label: ScreenScraper 現在會為每個遊戲提供其所屬地區的包裝盒圖、3D 盒圖、說明書、標題和發行日期,而不是依字母順序最先出現的地區
  - type: feature
    label: ROM 工具新增「修正包裝盒與說明書地區」工具,可更換舊版 ScreenScraper 抓取時取自錯誤地區的包裝盒圖和說明書
  - type: fix
    label: ScreenScraper 影片現在優先使用較小的檔案,失敗時才用較大的
  - type: fix
    label: 每個抓取來源現在都會搜尋正確的主機。Atari Lynx、街機 CPS、Super Famicom 等之前搜錯了機種,而且現在所有來源和成就都能搜尋更多系統
  - type: feature
    label: 在遊戲頁面按左右方向鍵,現在可切換到上一個和下一個遊戲
  - type: feature
    label: 遊戲頁面的金手指區塊現在可以收合,並會記住你是否展開
  - type: fix
    label: 開啟以文字框為起點的視窗(例如抓取)時,游標現在會在文字框內,而不是在關閉按鈕上
  - type: feature
    label: ROM 工具新增「螢幕截圖審查」工具,會列出 ZX Spectrum、Commodore 64 和 Game Boy 的螢幕截圖,最可疑的排在最前面,只會移除你選擇的項目
  - type: fix
    label: 抓取時現在會拒絕原圖色階遠超 Game Boy 所能顯示的 Game Boy 螢幕截圖
  - type: fix
    label: 遊戲下方的面板現在會配合視窗大小,不會再超出右邊緣
  - type: feature
    label: 可在編輯視窗中匯入 3D 盒圖,就在其他圖片旁邊
  - type: feature
    label: 按下遊玩時,RetroAchievements 登入現在會傳到 DuckStation 和 PCSX2
  - type: fix
    label: 在 8 位元和 16 位元系統上,抓取不再為在多個系統發行的遊戲加入 IGDB 或 RAWG 螢幕截圖,因為它們可能是其他系統的版本
  - type: fix
    label: 遊戲的模擬器現在顯示在其模擬器設定卡片上,而不是在遊玩旁邊
  body: "<ul>\n  <li><strong>每個抓取來源都搜尋正確的主機。</strong>Atari\n    Lynx、街機 CPS、Super Famicom 等之前搜錯了機種,而且現在所有來源和成就都能搜尋更多系統。</li>\n  <li><strong>遊戲地區優先依據自己的檔名。</strong>\n    (USA) 之類的標籤現在會直接決定地區,不再詢問 AI。ROM 工具新增「從檔名修正地區」工具,可修正舊版抓取弄錯的遊戲。</li>\n  <li><strong>ScreenScraper 依照遊戲的地區。</strong>包裝盒圖、3D\n    盒圖、說明書、標題和發行日期現在取自遊戲自己的地區,而不是依字母順序最先出現的地區。ROM 工具新增「修正包裝盒與說明書地區」工具,可處理舊版抓取。影片現在會先嘗試較小的檔案。</li>\n  <li><strong>RAWG 圖片不再作為包裝盒圖。</strong>它們常常是螢幕截圖,會擋住真正的封面。現在改作同人圖使用。ROM 工具新增「清除包裝盒圖中的 RAWG 圖片」工具,可處理舊版抓取儲存的圖片。依照 RAWG 的要求,RetroDB 也在側邊欄以連結標示 RAWG。</li>\n  <li><strong>ES-DE 保留它在抓取順序中的位置。</strong>當它不是主要來源時,後面的來源和 AI 會取代它的文字和封面,它的螢幕截圖也會被丟棄。現在這些都會保留。它不再複製遊戲已有的媒體,並會讀取遊戲自己 ROM 檔案對應的條目。PS3 資料夾遊戲現在能找到 ES-DE 封面。匯入系統標誌時不再取到無關的圖片。完整重新抓取也不再刪除其他來源剛下載的包裝盒圖。</li>\n  <li><strong>螢幕截圖審查。</strong>ROM 工具中的新工具會列出 ZX Spectrum、Commodore 64 和 Game Boy 的螢幕截圖,最可疑的排在最前面,只會移除你選擇的項目。抓取時現在會拒絕原圖色階遠超 Game Boy 所能顯示的螢幕截圖。在 8 位元和 16 位元系統上,不再為在多個系統發行的遊戲加入 IGDB 或 RAWG 螢幕截圖。</li>\n  <li><strong>RetroAchievements 登入會傳到 DuckStation 和 PCSX2</strong>,在你按下遊玩時生效。</li>\n  <li><strong>在遊戲頁面:</strong>左右方向鍵可切換到上一個和下一個遊戲,金手指區塊可收合並會記住狀態,下方面板會配合視窗大小,模擬器則顯示在其模擬器設定卡片上,而不是在遊玩旁邊。</li>\n  <li><strong>匯入 3D 盒圖</strong>現在位於編輯視窗中,就在其他圖片旁邊。</li>\n  <li><strong>以文字框為起點的視窗</strong>(例如抓取)現在會把游標放在文字框內,而不是在關閉按鈕上。</li>\n</ul>\n"
- version: 3.34.0
  date: '2026-10-30'
  tags:
  - type: feature
    label: RetroArch (RetroDB)、DuckStation 和 PCSX2 的金手指
  - type: feature
    label: 為遊戲匯入 Slipcase 3D 包裝盒
  - type: feature
    label: 把遊戲的 3D 包裝盒拿在手上轉動
  - type: fix
    label: 設定中有連到模擬器頁面的連結
  - type: fix
    label: 封面放大不再被選單遮住
  - type: feature
    label: 'AI 可用 Claude 5.5 模型'
  - type: feature
    label: '手動填寫遊戲銷量'
  - type: fix
    label: '在設定中測試 AI 金鑰'
  - type: feature
    label: 'Claude 可上網搜尋銷量數據'
  - type: feature
    label: '一次為整個系統執行 AI 填充'
  - type: fix
    label: "任務通知採用你的主題配色"
  - type: fix
    label: '模擬器頁面與其他設定分頁風格一致'
  - type: feature
    label: '按鈕旁顯示下載進度'
  - type: feature
    label: '從清單中為每個系統選擇模擬器'
  - type: feature
    label: '每個路徑框都有「瀏覽」按鈕'
  - type: feature
    label: '在 RetroDB 的 RetroArch 中，左搖桿可當方向鍵使用'
  - type: feature
    label: '從設定登入 RetroAchievements'
  - type: feature
    label: "查看「遊玩」將使用哪個模擬器"
  - type: fix
    label: "金手指面板會說明遊戲為何沒有金手指"
  - type: fix
    label: "長資料夾路徑可在手機上正常顯示"
  body: |
    <ul>
      <li><strong>RetroArch (RetroDB)、DuckStation 和 PCSX2 的金手指。</strong>設定 &gt; 模擬器 中有一個新的「金手指」區塊。你可以在那裡下載免費的公開金手指包，或匯入你已有的金手指資料夾；RetroDB 會複製檔案，絕不改動你的資料夾。之後，遊戲頁面會列出它的金手指，每個都有開／關切換，金手指很多時還有搜尋框。在 RetroArch (RetroDB) 中，你開啟的金手指會在你下次按下遊玩時生效，而你在遊玩時於 RetroArch 選單中所做的變更會被保留。對於 DuckStation 和 PCSX2，開關會儲存在模擬器自己為該遊戲建立的設定中，所以在模擬器內所做的變更也會顯示在頁面上。RetroDB 絕不覆寫模擬器已有的金手指檔案。開啟金手指會暫停 RetroAchievements 硬核模式。</li>
      <li><strong>為遊戲匯入 Slipcase 3D 包裝盒。</strong>遊戲頁面的封面下方有一個「匯入 3D 包裝盒」按鈕。選擇 Slipcase 儲存的 <code>.box.json</code> 檔案以及它的圖片，RetroDB 就會為該遊戲保存包裝盒的正面、側脊、背面和其他各面。Slipcase 1.4.0 或更新版本會在每張匯出的圖片旁儲存此檔案。你的 3D 封面圖片不會被改動。已經有各面圖片的遊戲會在取代前先詢問，「移除」會刪除它們。</li>
      <li><strong>把遊戲的 3D 包裝盒拿在手上轉動。</strong>點擊已匯入 Slipcase 包裝盒的遊戲封面，包裝盒就會以 3D 顯示。拖曳它或使用方向鍵來轉動，查看側脊、背面、頂部和底部。捲動或按 + 和 - 縮放；按兩下或按 Home 鍵恢復原狀。沒有匯入包裝盒的遊戲仍會放大顯示其封面圖片。</li>
      <li><strong>設定中有連到模擬器頁面的連結。</strong>以前設定中沒有任何連到模擬器頁面的連結，你只能輸入網址才能進入。現在管理員會在「系統」之後看到「模擬器」分頁，而模擬器頁面也顯示同樣的分頁列，其他分頁只需按一下即可到達。</li>
      <li><strong>封面放大不再被選單遮住。</strong>在手機上，頂部和底部的列會蓋住放大的封面並遮住它的關閉按鈕；在電腦上，側邊欄會蓋住它的左側。現在放大畫面會顯示在所有內容之上。</li>
      <li><strong>AI 可用 Claude 5.5 模型.</strong> 設定 &gt; 抓取 列出 Anthropic 最新的 Claude 模型：新的預設且最便宜的 Haiku 5.5、Sonnet 5.5 和 Opus 5.5，並附目前價格。RetroDB 不再傳送 Sonnet 5.5 會拒絕的設定。</li>
      <li><strong>手動填寫遊戲銷量.</strong> 兩個編輯畫面的「開發商」下方都有「銷量」欄位。填寫的數字會像 AI 找到的一樣顯示在遊戲頁面上。清空該欄位即可刪除。</li>
      <li><strong>在設定中測試 AI 金鑰.</strong> 設定 &gt; 抓取 的 AI 提供者下方新增「測試已儲存的 AI 金鑰」按鈕。它會顯示金鑰是否有效；若無效，會說明原因：金鑰遭拒、沒有餘額或達到使用上限。以前，遭拒的金鑰看起來也像是有效的。</li>
      <li><strong>Claude 可上網搜尋銷量數據。</strong>設定 &gt; 抓取 在 Claude 模型下方新增「允許 Claude 上網搜尋」開關，預設關閉。不搜尋時，Claude 只根據已知資訊回答，並將「銷量」留空。開啟後，Claude 會查找這些數據。Anthropic 按每次搜尋收費，因此 AI 填充每個遊戲最多搜尋 5 次，最多 5 美分；進行大規模批次抓取前請關閉該開關。</li>
      <li><strong>一次為整個系統執行 AI 填充。</strong>ROM 工具中新增了批量 AI 填充頁面，官方名稱也在其中。選擇一個系統或「所有系統」，開啟你想填充的欄位，然後點擊「用 AI 填充」：RetroDB 會對每個遊戲執行 AI 填充，與遊戲頁面上的 AI 填充按鈕相同，並將結果直接儲存到遊戲中。進度列和 AI 填充通知會顯示進度，執行期間你可以離開此頁面。它會顯示將填充多少個遊戲並先徵求確認，因為你的 AI 提供者按每個遊戲收費。已做過 AI 填充的遊戲會被略過，除非你重新把它們納入；如果 AI 停止回應，工作會自動停止。</li>
      <li><strong>任務通知採用你的主題配色。</strong>顯示執行中工作的方塊，例如批量抓取和 RA Sync，以及進度列，現在使用你所選主題的配色。無法暫停的工作不再用暫停的顏色顯示標題。</li>
      <li><strong>模擬器頁面與其他設定分頁風格一致。</strong>設定 &gt; 模擬器現在分成多張卡片，分頁下方的導覽列可跳到每張卡片：RetroArch、在 RetroDB 中遊玩、核心、金手指、資料夾、模擬器和對應。捲動時導覽列固定在頂端，並標出你所在的區段。</li>
      <li><strong>按鈕旁顯示下載進度。</strong>下載 RetroArch、播放器核心或金手指套件時，按鈕旁的提示會以百分比顯示進度。以前，按鈕下方會出現一行文字，把頁面其餘部分往下推。</li>
      <li><strong>從清單中為每個系統選擇模擬器。</strong>設定 &gt; 模擬器中的「各系統對應」現在每個系統只顯示一次，並附有與之連結的模擬器清單。你選取的模擬器就是「遊玩」在該系統遊戲中使用的模擬器，除非某個遊戲設定了自己的模擬器。RetroDB 找不到的模擬器會標示為「找不到」。以前，每個系統的每個模擬器各佔一列，用一個小圓點選擇預設模擬器。RetroDB 內建的 RetroArch 現在會出現在它能執行的每個已列出系統的清單中，包括尚無遊戲的系統。</li>
      <li><strong>每個路徑框都有「瀏覽」按鈕。</strong>管理員現在可以逐層點選電腦上的資料夾來選擇資料夾或程式，不必輸入路徑：設定 &gt; 模擬器、遊戲庫、抓取和帳戶，以及 ROM 工具的設定。需要程式的框也會顯示檔案。<code>.config</code> 等隱藏資料夾排在最後。</li>
      <li><strong>在 RetroDB 的 RetroArch 中，左搖桿可當方向鍵使用。</strong>在沒有搖桿的系統（如 NES 或 Mega Drive）的遊戲中，現在除了方向鍵，也可以用左搖桿移動。當遊戲的模擬器核心自行讀取搖桿時（如 Nintendo 64），搖桿仍是真正的搖桿。</li>
      <li><strong>從設定登入 RetroAchievements。</strong>設定 &gt; 帳戶現在可以為 RetroDB 的 RetroArch 登入，這樣遊玩時成就就會解鎖，無需在模擬器內登入。你的密碼只會傳送給 RetroAchievements，不會保存。每個 RetroDB 使用者都有自己的登入和硬核模式開關，預設關閉。DuckStation 和 PCSX2 仍從各自的選單登入。</li>
      <li><strong>查看「遊玩」將使用哪個模擬器.</strong> 遊戲頁面現在會在「遊玩」按鈕旁顯示「啟動方式：」和模擬器名稱，或提示尚未設定模擬器。</li>
      <li><strong>金手指面板會說明遊戲為何沒有金手指.</strong> 當遊戲的模擬器無法使用金手指時，面板現在會說明原因，而不再隱藏。</li>
      <li><strong>長資料夾路徑可在手機上正常顯示.</strong> 設定中的長資料夾路徑不再使頁面左右捲動。</li>
    </ul>
