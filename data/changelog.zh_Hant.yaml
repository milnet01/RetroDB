  body: |
    <ul>
      <li><strong>RetroDB 已為自己的遊戲播放器做好準備。</strong>一款以 RetroArch 為基礎的播放器正在為 RetroDB 打造。它推出後，RetroDB 會用為每款遊戲選定的設定在其中啟動遊戲，並保留你在遊玩時變更的任何設定。它會把存檔與設定放在自己的資料夾中，與你自己的 RetroArch 分開。它會為每台主機挑選最合適的核心，並在你第一次按下遊玩時下載；下載期間按鈕會顯示「正在下載核心…」。它可以執行任何沒有可用模擬器的主機，而且絕不會取代你已設定好的模擬器。你可以為每款遊戲選擇其他核心、畫面效果、整數縮放與輸入延遲降低。管理員可以一次安裝或更新所有核心，也可以關閉下載。在播放器安裝之前什麼都不會改變；在此之前，它不會出現在 設定 &gt; 模擬器 中。</li>
      <li><strong>博物館的分頁又能切換了。</strong>自 3.30.0 版起，在某台主機的博物館頁面上點選「規格參數」、「遊戲 Top 10」或「手把」都沒有反應，並顯示「意外錯誤」訊息。現在每個分頁都能開啟。</li>
      <li><strong>以資料夾形式存放的 PlayStation 3 遊戲可以遊玩了。</strong>PS3 光碟遊戲通常是一個以「.PS3」結尾的資料夾。RetroDB 因為預期的是單一檔案，所以拒絕啟動它，也不顯示遊玩按鈕。現在它會依照 RPCS3 的要求，把資料夾交給模擬器。</li>
      <li><strong>「搜尋中繼資料」的各欄對齊了，也能符合手機畫面。</strong>結果多到放不下的來源會出現捲軸，擠窄了標題，於是同一個標題在一欄中換行，在下一欄中卻不換行。現在每一欄都保持相同的寬度，並使用配合主題的細捲軸。在手機或窄視窗上，搜尋視窗曾被擠在一個隱藏的側邊欄旁邊；現在它會佔滿整個螢幕。</li>
      <li><strong>在 Windows 或 Mac 上全新安裝時，RetroArch 核心名稱正確。</strong>RetroDB 在所有系統上都用 Linux 的核心檔名設定 RetroArch，所以在 Windows 與 macOS 上找不到任何核心。現在全新安裝會使用每台電腦自己的名稱。現有的安裝保留目前的名稱；請在對應表中變更。</li>
      <li><strong>螢幕截圖檢視器顯示兩個箭頭，並各自位於按鈕內。</strong>側邊欄遮住了左箭頭，所以無法用滑鼠回到上一張螢幕截圖。右箭頭也落在按鈕下方。現在兩個箭頭都會顯示，並在各自的按鈕中置中。</li>
      <li><strong>模擬器設定頁面以你的語言顯示。</strong>無論你選擇哪種語言，設定 &gt; 模擬器 的大部分內容都是英文：標題、模擬器表格、掃描結果與「編輯模擬器」視窗。現在全部都已翻譯。</li>
      <li><strong>「玩家人數」欄位可以填入大於 16 的數字。</strong>兩個編輯視窗都停在 16，所以無法填入 MAG 的 256 名玩家。抓取器給出大於 16 的遊戲，在你調低數字之前根本無法儲存。現在沒有上限了。</li>
      <li><strong>AI 填充為 PC 遊戲設定 PC 存檔類型，而不是主機的。</strong>由於 AI 描述的是 PlayStation 2 版本，Windows 遊戲可能會得到「記憶卡」。現在會要求 AI 描述你的遊戲所在平台上的版本。PC 以及 PlayStation 3 與 Xbox 360 之後的主機，都存檔到內部儲存空間。</li>
      <li>要修正已經存有錯誤存檔類型的遊戲，請重新抓取或執行 AI 填充。兩者都會重新詢問 AI 並取代舊值。</li>
      <li><strong>連接 PlayStation 時會提示你先登入。</strong>在 設定 &gt; 帳戶 &gt; PSN 中，除非你已經登入 PlayStation，否則 Sony 帳戶頁面只會顯示「Invalid login」，而步驟說明也沒有提到這一點。現在第 1 步有一個「登入 PlayStation」按鈕，請先按下它。</li>
      <li><strong>為遊戲庫排序，並只顯示未抓取的遊戲。</strong>遊戲庫與每個系統頁面的遊戲數量旁邊都有「排序方式」選單：名稱、最新或最早發行、媒體評分、使用者評分，或最近新增。沒有日期或評分的遊戲排在最後。A–Z 列在依名稱排序時可用，其他情況下會變成灰色。新的「未抓取」按鈕只顯示還沒有被任何抓取器填寫過的遊戲。</li>
      <li><strong>沒有符合結果的篩選會明確告訴你。</strong>以前頁面會變成空白。現在它會說明沒有符合的遊戲，並提供一個清除篩選的按鈕。</li>
      <li><strong>遊戲庫的篩選列讓一切保持原位。</strong>以前按下「選擇」、篩選或排序都會把遊戲往頁面下方推。現在選取工具出現在視窗底部的一列中。「清除」始終存在，在啟用篩選之前呈灰色。生效中的篩選會顯示在遊戲數量旁邊。「Show Bonus」現在改為「附贈光碟」，開啟時會亮起。在手機上，篩選按鈕會從一個「篩選」按鈕展開，覆蓋在頁面上方。</li>
      <li><strong>空的遊戲庫會顯示附有掃描按鈕的歡迎訊息。</strong>以前全新安裝會顯示一個卡在 0% 的健康分數和一個空白的遊戲庫。現在這兩個頁面都會說明遊戲庫是空的，並提供「掃描遊戲庫」按鈕。儀表板也會連結到 ROM 資料夾設定。非管理員使用者會被告知去找管理員。在有可選的遊戲之前，「隨機遊戲」會被隱藏。</li>
      <li><strong>「掃描遊戲庫」在系統頁面與設定中可以使用了。</strong>那兩個「掃描遊戲庫」按鈕按下後都沒有反應。只有儀表板上的那個能用。現在儀表板自己的「掃描遊戲庫」按鈕只會向管理員顯示，因為只有管理員可以掃描。</li>
      <li><strong>設定精靈會顯示你所在的步驟，以及哪些步驟可略過。</strong>它會顯示「第 3 步，共 6 步」，為每一步編號，勾選你已完成的步驟，並把 ES-DE 與「API 金鑰」標為選用。在手機上，它會顯示編號與目前步驟的名稱。</li>
      <li><strong>同時依多個類型、系列或發行商篩選遊戲庫。</strong>在「類型」、「系列」、「發行商」、「開發商」、「遊玩模式」、「視角」與「維度」篩選中，勾選任意多個值並按下「套用」：遊戲只要有其中任何一個值就會顯示。把視窗切換為「不是」，即可隱藏含有任何已勾選值的遊戲。每個值都有自己的標籤，點它的 ✕ 只會移除該值。</li>
    </ul>
