    </ul>
- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: RetroDB 現在明確表示不支持盜版
  - type: fix
    label: 關於對話框再次以完整大小開啟
  body: |
    <ul>
      <li><strong>應用程式中現在有一則反盜版聲明。</strong>它出現在關於對話框
        中，以及設定裡的 ROM 庫路徑下方，並提供所有語言版本。聲明指出
        RetroDB 不散布也不託管 ROM 檔案，你只應使用從自己擁有的光碟與卡匣
        複製而來的遊戲，而且 RetroDB 與任何主機廠商、發行商或遊戲資料庫都
        沒有關聯。措辭與 RetroDB 網站及預告片一致。</li>
      <li><strong>關於對話框原本被擠進側邊欄裡。</strong>現在它會以正常大小
        在畫面中央開啟，在小螢幕上則可以捲動，而不會把標題與關閉按鈕藏
        起來。</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: RetroDB 只會啟動或重新命名為真正的 ROM 檔案類型
  body: |
    <ul>
      <li><strong>遊戲可能會以一個不是 ROM 的檔案啟動。</strong>重新命名
        ROM 時接受任何名稱，因此 <code>crash.bin</code> 可以變成
        <code>crash.cfg</code>，然後被交給模擬器。現在啟動時會依照該系統
        資料夾中 <code>systeminfo.txt</code> 的清單檢查檔案類型 &mdash; 與
        遊戲庫掃描使用的是同一份清單，而重新命名也會拒絕清單中沒有的類型。
        如果某個系統資料夾沒有這份清單，它的遊戲將無法啟動，訊息會指出缺少
        的檔案。</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: 只有管理員可以變更遊戲的啟動參數
  - type: fix
    label: 含有多個詞或多餘引號的啟動參數現在可以正常運作
  - type: fix
    label: RetroDB 不再把每一次已結束的啟動都留在記憶體中
  body: |
    <ul>
      <li><strong>編輯者可以加入會執行其他程式碼的啟動參數。</strong>遊戲的
        <em>自訂啟動參數</em>會直接傳給模擬器，而在 RetroArch 中，它們可以
        載入電腦上的任何程式檔案。現在變更它們需要管理員角色，其他人則看不到
        這個欄位。</li>
      <li><strong>含有多個詞的啟動參數到達模擬器時被當成一個。</strong>
        <code>--a --b</code> 現在會以兩個參數傳入，空值則不會加入任何東西。
        以前少了結尾引號會讓該遊戲的每次啟動都出現伺服器錯誤；現在則會顯示
        訊息，指出需要修正的欄位。<code>{disc_paths}</code> 標記已移除：它
        一直都是空的。</li>
      <li><strong>已結束的啟動會在記憶體中不斷堆積，直到 RetroDB 重新
        啟動。</strong>結束超過一小時的啟動現在會被清除。</li>
    </ul>
