  body: |
    <ul>
      <li><strong>一款遊戲的各地區版本顯示為一款遊戲。</strong>把你擁有的各個版本（例如美版、歐版與日版）連結起來，遊戲庫就只會顯示一張帶有 &#127760; 徽章的卡片。這張卡片會開啟並執行你「預設地區」的版本。遊戲頁面會並排列出所有版本，並讓你在它們之間切換。ROM 工具 &gt; 地區版本會建議分組，由編輯者確認；沒有你的同意，什麼都不會被連結。它絕不會把續作當成第一款遊戲的一個版本。已連結的版本不再因名稱相同而被回報為重複。執行一次「回填別名標題」，可以讓建議有更多依據。</li>
      <li><strong>AI 可以總結各地區版本之間的差異。</strong>在有連結版本的遊戲上，編輯者可以在「地區版本」區段按下「用 AI 總結差異」。AI 會列出已知的差異，例如審查刪改、難度或被移除的內容。這份清單會標明由 AI 撰寫，顯示在每個版本的頁面上；當你連結或取消連結某個版本時，它會隱藏，直到重新產生為止。需要先在 設定 &gt; 抓取 中設定一個 AI 提供者。</li>
      <li><strong>PlayStation 遊戲一開始就有合適的設定。</strong>對於 DuckStation、PCSX2 與 RPCS3，RetroDB 現在會在你按下遊玩時，在模擬器自己的單一遊戲設定檔中寫入該遊戲的解析度縮放與長寬比，以及是否以全螢幕啟動。你可以用 設定 &gt; 模擬器 中的「設定」按鈕為整個系統變更它們，也可以在遊戲頁面新增的「模擬器設定」面板中只為一款遊戲變更。你在模擬器內部變更的設定一律優先。RetroDB 會讀取每張光碟的序號來找到正確的檔案；CHD 光碟需要安裝 chdman。</li>
      <li><strong>AI 填充不再會被輸入到遊戲欄位中的文字操控。</strong>AI 填充在檢查遊戲現有的發行商、開發商、版本或其他平台時，現在會先清理這些文字，就像它早已對標題所做的那樣。</li>
      <li><strong>ROM 工具的掃描會留在你的 ROM 資料夾內。</strong>CHD 轉換器與 CHD 校驗不再跟隨指向資料夾外部的捷徑（符號連結），解開多光碟壓縮檔時也會忽略壓縮檔內打包的任何捷徑。</li>
      <li><strong>頁面會拒絕執行被偷偷塞進來的指令碼。</strong>你的瀏覽器現在會封鎖任何不是 RetroDB 自己撰寫的指令碼，因此混入遊戲標題、標籤或抓取到的描述中的程式碼無法執行。按鈕與選單照常運作。</li>
      <li><strong>一張損壞的螢幕截圖不再讓某款遊戲的重複檢查停下來。</strong>無法讀取的螢幕截圖會被擱在一旁，檢查繼續進行。</li>
      <li><strong>ROM 工具作業不再卡在「執行中」。</strong>CHD 校驗掃描後被刪除的檔案會被算作無效，而 CHD 轉換、CHD 校驗或重複查找器中的任何意外錯誤都會讓作業以失敗結束，錯誤會記錄在它的日誌中。</li>
      <li><strong>在完成初始設定之前，應用程式的資料請求會得到明確的回覆。</strong>它們會回覆「需要初始設定」，而不是傳回設定頁面。一般頁面仍會帶你進入設定精靈。</li>
      <li><strong>續作不再顯示第一款遊戲的成就。</strong>RetroAchievements 比對時忽略了標題中的數字，所以 Donkey Kong Country 2 與 3 被連結到了 Donkey Kong Country。現在數字（2、II、3、III 等）會被納入考量。要更正已經連結的遊戲，請為所有系統執行一次 RetroAchievements 重新整理。</li>
      <li><strong>PlayStation 同步不再清空你的獎盃數量。</strong>當 PlayStation 的回覆漏掉某款遊戲的獎盃總數時，RetroDB 會以零覆寫既有的數量。現在它會保留這些數量，批次獎盃重新整理也是如此。</li>
      <li><strong>開啟一個已不在磁碟上的獎盃組會顯示一則訊息。</strong>獎盃頁面以前會出錯失敗；現在它會說明找不到該獎盃組，並帶你回到清單。</li>
      <li><strong>ROM 工具表格中按鈕欄的標題在每種語言中都正確了。</strong>這個欄標題與「動作」遊戲類型共用同一個詞，所以有些語言在那裡顯示的是類型名稱。</li>
      <li><strong>GameCube、3DS 與 Super Famicom 遊戲會自動設定好模擬器。</strong>RetroDB 以前用遊戲庫並不使用的資料夾名稱（gamecube、3ds、superfamicom，而不是 gc、n3ds、sfc）尋找這些系統，所以 Dolphin 與 Citra 從未與它們連接。重新啟動一次 RetroDB 即可生效。</li>
      <li><strong>不需要 Python 的（獨立版）下載又能設定模擬器了。</strong>它缺少列出模擬器的那個檔案。</li>
      <li><strong>大約 170 個按鈕、標籤與訊息在每種語言中都翻譯好了。</strong>它們以前顯示為英文，還有幾個顯示的是錯誤的猜測（有些語言在遊戲啟動失敗時顯示「備份失敗」）。</li>
      <li><strong>Esc 鍵只會關閉最上層的視窗。</strong>當一個詢問框開在另一個視窗之上時，按 Esc 以前會把兩者都關閉；有些視窗被 Esc 隱藏後還在繼續執行，在遊戲頁面上按 Esc 還可能讓你暫停的批次抓取恢復執行。現在每個視窗都透過自己的「關閉」動作關閉，開啟期間鍵盤焦點會留在視窗內，關閉後焦點會回到開啟它的按鈕上。執行中作業的進度視窗會一直開著，直到作業結束。</li>
      <li><strong>分析圖表使用你的語言。</strong>類型、視角、維度與模式名稱，以及圖表標題、座標軸名稱與圖例，以前在每種語言中都是英文。</li>
      <li><strong>RetroAchievements 資料更安全了。</strong>如果某部主機的 RetroAchievements 遊戲清單載入失敗，RA 重新整理現在會讓該主機的遊戲保持連結，而不是全部取消連結。「清除 RA 資料」現在只會清除 RetroAchievements 進度；Steam 與 Xbox 進度會保留。</li>
      <li><strong>密碼在所有地方都必須至少 12 個字元。</strong>首次設定接受任意長度的管理員密碼，強制變更密碼頁面與設定頁面也說 4 個字元就夠了。現在這三處都要求 12 個字元，與應用程式的其他部分一致。</li>
      <li><strong>成就總數正確，而且只算你自己的。</strong>從 RetroAchievements 同步單一遊戲時，現在會儲存它擁有的成就數量，而不是 0。儀表板的成就總數只統計你的遊戲，收藏家獎盃也不再把每個 Steam 或 Xbox 成就算兩次。</li>
      <li><strong>背景同步使用你自己的帳戶。</strong>如果你設定了自己的 RetroAchievements 帳戶，RetroAchievements 系統同步會用它登入。PlayStation 批次重新整理會重複使用你儲存的登入資訊，而不是每次都從頭登入。</li>
      <li><strong>只有你自己能停止或恢復你的同步。</strong>其他使用者不再能取消你的 RetroAchievements、Steam 或 Xbox 同步，恢復一個被中斷的作業所需的權限與啟動它相同。管理員仍然可以做這兩件事。</li>
      <li><strong>儲存 RPCS3 獎盃資料夾時會進行檢查。</strong>不存在的資料夾、不是完整路徑的資料夾或系統資料夾都會被拒絕，與主要設定中原有的做法一樣。</li>
      <li><strong>博物館的「擷取所有圖片」在背景執行。</strong>頁面不再為了每一張手把圖片等上好幾分鐘。它會顯示擷取進度，提供「取消」按鈕，並在你離開頁面後再回來時繼續顯示進度。</li>
      <li><strong>ROM 工具能更好地保護你的檔案。</strong>「清理」不再會把壓縮檔清空：像 <code>*</code> 這樣的規則無法儲存，如果這些規則會移除所有檔案，「清理」就會停止。CHD 轉換器在關閉「校驗」時會保留原始檔案，在開啟「略過已存在」時不會動到既有的 CHD。重複查找器一律為每款遊戲保留一份副本，即使請求要求刪除全部副本。</li>
      <li><strong>ROM 工具作業的行為與按鈕所說一致。</strong>「暫停」現在可以暫停 CHD 轉換、CHD 校驗、重複查找器與螢幕截圖去重，已暫停的作業也可以取消。遇到錯誤的螢幕截圖去重掃描現在會以失敗結束，而不是一直執行下去。</li>
      <li><strong>建立 M3U 不再把壓縮檔暫放在暫存資料夾中。</strong>被移走的壓縮檔現在會放進 RetroDB 自己的資料資料夾，重新啟動時不會被清空。壓縮檔掃描器會顯示它們被放到了哪裡，批次確認也會說明它們將被移動。重設 ROM 工具設定現在會重設每一個選項。</li>
      <li><strong>在 RetroDB 中切換光碟。</strong>當一款從 .m3u 光碟清單啟動的 RetroArch 遊戲正在執行時，每個頁面頂端的 &#9654; 正在遊玩清單會顯示遊戲標題與一個「下一張光碟」按鈕，因此遊戲要求換到第二面時，只要按一下就能繼續，無論是在瀏覽器中還是在手機上。RetroArch 必須開啟 Settings &gt; Network &gt; Network Commands（連接埠 55355）；如果沒有開啟，按鈕會提示你。</li>
      <li><strong>啟動指令碼會在 RetroDB 準備好之後再開啟它。</strong>start.sh、start.command 與 start.bat 以前固定在 3 秒後開啟瀏覽器，常常早於伺服器能夠回應，導致頁面載入失敗。RetroDB 現在會在伺服器開始監聽後再開啟頁面。如果是從 LocalWebServerManager 啟動的，它根本不會開啟頁面；請使用管理器的 Open 按鈕。</li>
      <li><strong>遊戲影片最大可達 500 MB。</strong>以前的上限是 50 MB，對大多數遊戲預告片來說太小了。過大的上傳現在會在遊戲頁面上顯示一則訊息，而不是用純文字取代整個頁面。被拒絕的影片（太大或檔案類型不對）現在會給出說明，而不是無聲無息地被丟棄。</li>
      <li><strong>啟動會使用你設定的路徑。</strong>在 設定 &gt; 模擬器 中，RetroArch 那一列上的執行檔路徑覆蓋現在優先於頁面頂端的 RetroArch 路徑；以前那一列的路徑會被忽略。按兩次「停止」不再會要求遊戲結束兩次；在 Linux 上，RetroArch 會把第二次請求當作「不儲存直接結束」，因此你的遊戲內存檔可能會遺失。一個尚未實作的遠端模式遺留下來的啟動器設定，不再導致所有遊戲都無法啟動。</li>
      <li><strong>失敗的操作會正確回報錯誤。</strong>當儲存、匯入、同步或掃描失敗時，RetroDB 現在會傳回真正的錯誤狀態，並在訊息中說明原因，而不是像成功了一樣回覆。儲存一個無法連線的 PSN 登入代碼時，不再顯示內部錯誤細節。登入、使用者管理、你的個人資料、成就、匯入、AI 填充與 HowLongToBeat 查詢現在也是如此；無法儲存語言時會說明原因，而不是顯示「網路錯誤」。</li>
      <li><strong>以 No-Intro 方式命名的遊戲現在可以抓取了。</strong>像「Legend of Zelda, The」或「Legend of Zelda, The - Ocarina of Time」這樣的標題，現在能比對到「The Legend of Zelda」的結果，而不會被比對篩選拒絕。ROM 報告也不再把這些名稱標記為不相符。</li>
      <li><strong>從檔案名稱取得的標題會去掉所有標記。</strong>像「(USA, Europe)」這樣的組合地區與「(UK)」現在都會被移除。在 ZX Spectrum 等家用電腦上，從年份開始往後的內容都會去掉，所以「Chuckie Egg 2 (UK) (1985) (A'n'F Software) (tzx)」會變成「Chuckie Egg 2」。以「..zip」結尾的檔案名稱不再留下多餘的句點。抓取器搜尋、重設遊戲資料與地區版本建議都會使用這些更乾淨的名稱。</li>
      <li><strong>錯誤的標題不再在重新抓取時重複出現。</strong>批次抓取現在使用 ROM 檔案中的名稱搜尋，而不是遊戲已儲存的標題。曾經比對到錯誤遊戲的遊戲，再次抓取時會找到正確的遊戲。</li>
      <li><strong>抓取器優先使用你的預設地區。</strong>當兩個結果不分高下時，現在會選擇來自你的預設地區或「世界」版的那個，而不是總是選美版。兩個只有地區標記的標題不再被算作完全相符。地區版本不再把「X-Men」中的 X 誤當成續作編號。選擇卡片顯示哪個版本時，現在只讀取 ROM 的檔案名稱，而不看它上層的資料夾，並且能理解「(U)」與「(E)」這類舊標記。</li>
      <li><strong>日誌會顯示每款遊戲的抓取時間花在哪裡。</strong>每款遊戲抓取完後，RetroDB 會記錄一行，列出在搜尋、各個來源、下載、圖片處理、AI 與儲存上花費的秒數。這是讓抓取變快的第一步。</li>
      <li><strong>抓取更快完成：小圖片會在之後再變清晰。</strong>抓取現在會先以下載下來的原圖儲存遊戲。較小的封面與螢幕截圖隨後會在背景放大，一次處理一款遊戲。重複的螢幕截圖會在這些處理之前就被丟棄。如果 RetroDB 中途停止，下次啟動時會接著處理。</li>
      <li><strong>在遊戲頁面上閱讀遊戲說明書。</strong>說明書按鈕現在會在遊戲頁面上方的視窗中開啟 PDF。你可以用「上一頁」與「下一頁」、方向鍵、Home 與 End 鍵，或在手機上滑動來翻頁；每一頁都會像書一樣翻過去，如果你的系統要求減少動畫，則直接切換。「在新分頁中開啟 PDF」仍然保留，按住 Ctrl 點按說明書會直接開啟新分頁。</li>
      <li><strong>側邊欄會顯示圖片仍在優化中。</strong>當圖片在背景變清晰時，側邊欄會顯示「正在優化圖片 — 剩餘遊戲：N」。仍在等待的遊戲會在自己的頁面上說明這一點，準備好後，更清晰的圖片會自動出現在那裡。2D/3D 封面切換開關不再擋住這一行。</li>
      <li><strong>備用來源會同時被詢問。</strong>當主要來源留下空缺時，RetroDB 現在會一次詢問其他所有來源，而不是一個接一個地問。它們的回覆仍依你在設定中的順序使用，因此每個欄位仍由同一個來源勝出。</li>
      <li><strong>ES-DE 的遊戲清單只讀取一次。</strong>以前每次抓取（包括批次抓取）都會為每款遊戲把系統的 ES-DE gamelist.xml 讀取兩次。RetroDB 現在只讀取一次，只有在檔案變更時才重新讀取。</li>
      <li><strong>「搜尋中繼資料」的「套用」不再重新搜尋。</strong>在遊戲頁面上，你勾選的結果會直接從其來源取得，而不是再查找一遍。如果什麼都沒有勾選，就只由你套用的來源與 AI 來填補空缺。</li>
      <li><strong>ScreenScraper 能找到帶有副標題的遊戲。</strong>對於「Alone in the Dark: The New Nightmare」這樣的標題，除非冒號前有一個空格，否則它什麼也找不到。RetroDB 現在會以那種方式搜尋；如果仍然找不到，再用冒號前面的部分搜尋。</li>
      <li><strong>沒有可玩內容的遊戲不再提供遊玩。</strong>從 CLZ、Steam、Xbox 或 PSN 匯入加入的遊戲沒有 ROM 檔案。現在它的頁面不會顯示遊玩按鈕、不會顯示「模擬器設定」，編輯時也不會顯示「啟動」區段，與遊戲庫卡片保持一致。</li>
      <li><strong>RetroArch 遊戲不再受兩個不良設定影響。</strong>RetroDB 現在每次啟動遊戲時，都會在你的設定之上再給 RetroArch 一個它自己的小設定檔。這個檔案會讓鍵盤與你的桌面（Wayland 或 X11）相符，因此鍵盤永遠不會失靈；它還會讓快轉以全速執行，Commodore 64 遊戲就是靠快轉來快速載入的。你的其他 RetroArch 設定都保持不變。</li>
      <li><strong>建立 M3U 後遊戲仍留在你的遊戲庫中。</strong>把多光碟壓縮檔轉成播放清單後，遊戲以前仍指向那個已被移走的壓縮檔。現在遊戲會指向新的播放清單，並保留它的詳細資料與圖片。當一個壓縮檔裡有同一款遊戲的多個發行版本、各自有一套光碟時，播放清單現在只使用第一個版本的光碟，而不是全部，並會說明它略過了哪些光碟。</li>
      <li><strong>完整重新抓取可以保留你已有的媒體。</strong>勾選「完整重新抓取」開關旁邊的「保留現有媒體」。文字資訊仍會更新，但已經在磁碟上的圖片、影片與說明書會維持原樣，不會重新下載。不勾選時，完整重新抓取也不再丟掉它先前下載過的螢幕截圖。</li>
      <li><strong>背景作業不再遺失或略過工作。</strong>RetroAchievements 重新整理遇到一款有問題的遊戲時，不再丟棄它已經更新過的遊戲。恢復的同步或重新整理不再略過它停下時正在處理的那款遊戲。從非常舊的快照恢復的 RetroAchievements 或 Steam 同步現在會停止並顯示訊息，而不是什麼都沒同步卻回報成功。WebP 轉換會先檢查遺留的 WebP 檔案再信任它，如果無法讀取磁碟剩餘空間，就不會開始。</li>
      <li><strong>升級非常舊的安裝不再會悄悄遺失資料。</strong>三個舊的資料庫升級步驟在少數情況下可能丟棄資料列。現在它們會複製這些資料列，或停止並給出明確的錯誤，而不是讓資料遺失。</li>
      <li><strong>關於視窗的按鈕不再被截斷。</strong>視窗變寬了，四個按鈕分成兩列排列，因此每個按鈕的文字都能完整顯示；在手機上它們會上下堆疊。</li>
      <li><strong>你的主題會跟著你到新的瀏覽器。</strong>在一個從未用過的瀏覽器上登入時，現在會顯示你儲存的主題。以前登入頁面會先存下賽博龐克主題，然後就一直維持那樣。</li>
      <li><strong>登入密碼框不再寫著「管理員登入」。</strong>每個帳戶都用密碼登入，所以這個對話框現在只寫「登入」。帳戶頁面與幫助頁面也是這麼說的。</li>
      <li><strong>每種語言的幫助都是最新的。</strong>翻譯後的幫助頁面現在介紹了地區版本，說明每個帳戶都需要密碼，並說明你的主題會隨帳戶儲存。每種語言的幫助（包括英文）現在都列出了真實的 12 個字元密碼下限。</li>
      <li><strong>小修正：</strong>檔案名稱含有撇號的同人圖現在能在遊戲與獎盃頁面上顯示；設定頁面不再對非管理員帳戶顯示指令碼錯誤，螢幕閱讀器現在也能聽出選取的是哪個設定分頁；離開頁面時不再在瀏覽器主控台中留下大量「請求已取消」的錯誤；放大模型會先從一個可用的網址下載；安裝程式在 Windows 上把輸出儲存到檔案時不再當機。</li>
      <li><strong>一大批可靠性修正。</strong>儲存標題為空白的遊戲時，不再遺失你的其他編輯。重新啟動現在會先讓執行中的作業乾淨地停止。建立 M3U 會拒絕覆寫既有的播放清單或資料夾。在 ROM 工具中清空「不需要的檔案」清單現在表示「什麼都不刪除」，並且有兩條規則不再誤中「Release of the Dragon」這類真實的 ROM 名稱。一個損壞的 PS3 獎盃檔案不再讓所有遊戲的獎盃都變成空白。AI 填充只會寫入一個地區。分析在評分圖表中把每款遊戲只統計一次。CLZ 匯入使用標準的類型名稱。在編輯對話框中，類型與其他標籤在每種語言中都能移除，鍵盤快速鍵也不再搶走 Ctrl+D 或 Ctrl+G。檢視者能看到遊戲的完成狀態，但不再能變更它，因為它是所有人共用的。</li>
      <li><strong>螢幕閱讀器會依 Platform Match Required 開關的可見名稱朗讀它</strong>，位於 設定 → 抓取。</li>
      <li>在其他語言中，設定現在會翻譯「預設地區」，「抓取」分頁讀起來是一個名稱，而不是「抓取中」。幫助頁面也使用相同的用詞。</li>
      <li><strong>無法關閉的遊戲不再顯示為已關閉。</strong>如果模擬器在按下「停止」後仍在執行，RetroDB 會繼續顯示它正在執行。被拒絕的 RetroArch 啟動不再先寫入它的設定檔，一啟動就失敗的模擬器會在第一次檢查時就顯示它的錯誤訊息。</li>
      <li>更新的程式庫：Pillow 13（圖片處理）、numpy 2.5.4 與 onnxruntime 1.31（圖片放大），以及最新版本的建置與發布工具。</li>
      <li>幕後改進：遊戲啟動程式碼經過整理，更容易看懂；移除了未使用的程式碼（一個 API 位址、一個 PSN 輔助程式、一個沒有頁面載入的獎盃指令碼，以及一個沒有任何地方讀取的全站主題設定）；應用程式對瀏覽器的回覆現在在同一處產生；幾份設計文件已更正為與程式碼一致；測試套件經過整理；還新增了一項檢查，會在發布前抓出 JavaScript 語法錯誤。描述那些已移除程式碼的舊更新日誌項目現在也註明了這一點。</li>
    </ul>
- version: 3.29.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 遊戲的其他名稱會顯示它們來自哪個地區
  body: |
    <ul>
      <li><strong>遊戲的其他名稱會顯示它們來自哪個地區。</strong>遊戲頁面的「又名」卡片會用你的語言為每個名稱標上它的國家或地區，例如「Rockman」標為日本。帶有標記的名稱排在前面，並依地區分組。把滑鼠游標停在名稱上，可以看到它的來源與任何備註，例如「開發代號」。</li>
      <li>來自 IGDB 的名稱現在會保留它們的地區。以前只有 ScreenScraper 的名稱才有地區。</li>
      <li>ScreenScraper 的「SS」標記不再顯示為地區。它是 ScreenScraper 自己為遊戲取的名稱，而不是一個地方。</li>
      <li>ROM 工具 → 回填別名標題現在會檢查每款已抓取的遊戲，因此你已有的名稱也會取得地區。執行一次，就能為你現有的遊戲庫加上標記。</li>
    </ul>
- version: 3.28.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 把 RetroDB 指向你的模擬器資料夾，它就會幫你設定好
  - type: fix
    label: 設定 → 模擬器頁面的修正
  body: |
    <ul>
      <li><strong>把 RetroDB 指向你的模擬器資料夾，它就會幫你設定好。</strong>設定 → 模擬器 中新增了「模擬器資料夾」清單。加入存放模擬器的資料夾後，RetroDB 會在其中找到每一個模擬器（無論是 AppImage、可攜式指令碼還是已安裝的 Flatpak），並把它連接到它能執行的系統。已經有可用模擬器的系統會保留原本的模擬器。</li>
      <li><strong>看看哪些系統已經可以遊玩。</strong>各系統對應表現在會列出每個系統的模擬器，說明每個是否可用，並讓你選擇系統的預設模擬器。對於 DuckStation、PCSX2、RPCS3 與 RetroArch，它還會說明 BIOS 檔案是否就位，並列出缺少的檔案。RetroDB 只讀取 BIOS 檔案，從不複製或下載任何 BIOS。</li>
      <li>模擬器掃描現在能在大型模擬器硬碟上找到每一個模擬器。以前它可能在某個模擬器自己的設定資料夾裡提前停下。</li>
      <li>RetroArch 的「自動偵測」與「儲存」按鈕又能用了，「編輯模擬器」視窗也不再在你按下「編輯」之前就顯示在頁面上。</li>
    </ul>
- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 套用中繼資料時會顯示進度
  body: |
    <ul>
      <li><strong>套用中繼資料時會顯示進度。</strong>在「搜尋中繼資料」中選擇一個結果後，一個圓環會從 0 填滿到 100%，中央顯示百分比，下方的一行說明正在進行的作業：正在搜尋哪個網站、正在下載哪張圖片或哪部影片，或是正在處理圖片。較大的下載（例如影片）會隨著資料抵達推動圓環前進。到達 100% 時，頁面會像以往一樣重新載入並顯示結果。</li>
      <li>圓環的前進可能不平均。每個來源要到回應時才決定傳送多少張圖片，因此第一個圖片很多的來源可能填滿圓環的大部分，之後的來源則較少。</li>
      <li>如果套用失敗，圓環會關閉，並顯示一則說明失敗的訊息，頁面不會重新載入。</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 每個頁面現在都會配合所在視窗的大小
  - type: enhancement
    label: 遊戲頁面以獨立卡片顯示其他名稱，並新增說明書按鈕
  body: |
    <ul>
      <li><strong>每個頁面現在都會配合所在視窗的大小。</strong>卡片式頁面
        （系統、博物館、標籤、列表、ROM 工具、獎盃與成就）只要還放得下一整張
        卡片，就會多加一欄，每列最多四張。表格、工具與詳細資料頁面會稍微變寬，
        但若再寬只會把欄位拉開，就會停下來。設定頁面的方框則維持容易閱讀的
        寬度。</li>
      <li><strong>幫助與更新日誌保持舒適的行長。</strong>在寬視窗中，幫助的
        章節連結會移到文字旁邊的一欄；在窄視窗中，它們會排成可以左右滑動的
        單獨一列，而不再是遮住大半個手機畫面的一整塊。</li>
      <li><strong>遊戲頁面：</strong>在寬視窗中，螢幕截圖橫排在頁面上方，
        下方則並排顯示影片與新的<strong>又名</strong>卡片，與封面同高。
        其他名稱原本是標題下方淡淡的文字，現在放在一張容易閱讀的卡片上。
        <strong>說明書</strong>成了遊玩旁邊的一個按鈕，抓取歷史則預設為
        收合。</li>
      <li>PSN 獎盃會依視窗大小顯示一到四欄，而不再固定為三欄。</li>
      <li>多個頁面在手機上不再左右捲動：獎盃、收藏家獎盃、RetroAchievements
        系統頁面、幫助、設定、分析、遊戲匯入，以及成就與獎盃的詳細資料頁面。
        較寬的表格現在會在表格本身內捲動。</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 遊戲庫、系統與遊戲頁面現在會配合所在視窗的大小
  body: |
    <ul>
      <li><strong>頁面只在有幫助時才使用寬視窗。</strong>遊戲庫與每個系統
        頁面只要還放得下一整張遊戲卡片，就會多加一欄，每列最多四張。手機顯示
        一張，半個螢幕的視窗顯示兩到三張，寬視窗顯示四張。以前頁面停在固定
        寬度，讓大視窗大半空著。</li>
      <li><strong>遊戲頁面會把封面與詳細資料放在螢幕截圖與影片旁邊</strong>
        &mdash; 前提是並排放得下，否則就上下堆疊。簡介保持舒適的行長。</li>
      <li><strong>遊玩按鈕移到了每張卡片的右上角，</strong>變得更小並置中。
        它現在也會檢查遊戲的 ROM 檔案是否還在、檔案類型是否為該系統所接受，
        因此只會出現在按下後真的能啟動遊戲的地方。在你批次選取遊戲時，它會
        隱藏起來。</li>
      <li>返回頂部按鈕與進度彈出視窗現在緊貼在頁面內容旁邊，而不是在視窗的
        最邊緣。</li>
      <li>遊戲頁面在手機上不再左右捲動。</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: 「Pseudo」測試語言只提供給管理員
  body: |
    <ul>
      <li><strong>「Pseudo」不再出現在所有人的語言清單中。</strong>它是一個
        開發者工具，會把每個字都加上括號與重音符號顯示，因此現在只提供給
        管理員。其他先前選了它的人會看到英文介面，設定中也會選為英文。</li>
    </ul>
- version: 3.24.1
  date: '2026-10-17'
  tags:
  - type: fix
    label: Windows 下載版又能安裝了，調整視窗大小後也不再狂跳錯誤
  body: |
    <ul>
      <li><strong>一般的 Windows 下載版無法安裝。</strong>安裝程式停在
        「Core dependencies failed to install」，因為它鎖定的套件清單漏掉了
        一個只有 Windows 需要的套件。清單現在涵蓋所有平台。不需要 Python 的
        Windows 下載版不受影響。</li>
      <li><strong>錯誤訊息不斷出現在右上角</strong> &mdash; 這發生在
        Cyberpunk 主題下，把瀏覽器視窗拉寬之後，例如將它最大化。動態背景
        現在能順利調整大小。</li>
    </ul>
- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: 直接從遊戲庫與系統頁面遊玩遊戲
  body: |
    <ul>
      <li><strong>每張遊戲卡片上都有一個 ▶ 遊玩按鈕。</strong>它出現在遊戲庫
        頁面與每個系統頁面的封面左下角。按下它，遊戲就會在模擬器中啟動；你會
        留在清單上，不必先開啟遊戲頁面。</li>
      <li>按鈕只會出現在按下後能夠運作的地方：你的帳戶獲准啟動遊戲，而且該
        遊戲的模擬器已啟用、已安裝，若是 RetroArch 則還需有對應的核心。所在
        系統沒有可用模擬器的遊戲不會顯示按鈕。</li>
      <li>如果啟動仍然失敗，例如 ROM 檔案被移走了，原因會以訊息顯示，頁面
        則保持原樣。</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: 更短的側邊欄，所有平台共用一個成就頁面
  body: |
    <ul>
      <li><strong>一個「成就」連結取代了五個。</strong>RetroAchievements、
        RPCS3、PSN、Steam 與 Xbox 現在是同一頁面上的分頁，連結會重新開啟你
        上次使用的分頁。如果你沒有任何 RetroAchievements 遊戲，它會改為開啟
        RPCS3 分頁，而不是把你送回儀表板。</li>
      <li><strong>ROM 報告現在位於 ROM 工具中，</strong>成為其他工具旁邊的
        一個分頁，以及 ROM 工具頁面上的一張卡片。</li>
      <li><strong>側邊欄的連結不再共用同一個圖示：</strong>儀表板現在是 🏠，
        日誌檢視器是 🧾。側邊欄從 21 個連結減為 16 個。</li>
      <li>ROM 工具設定頁面上的工具分頁以前一律顯示英文；現在會跟隨你的
        語言。</li>
    </ul>
- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: 通關時長（How Long To Beat）查詢恢復正常
  body: |
    <ul>
      <li><strong>每次查詢 How Long To Beat 都說找不到遊戲。</strong>該網站
        把搜尋移到了新的網址，因此 RetroDB 的請求遭到拒絕；問題出現在七月底
        到九月底之間。RetroDB 現在改用新網址，並以網站的新格式傳送平台與年份
        篩選條件 &mdash; 網站先前已開始忽略舊格式。單一遊戲查詢與 ROM 工具
