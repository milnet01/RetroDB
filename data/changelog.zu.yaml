  body: "<ul>\n  <li><strong>I-scraper ngayinye iseshela i-console efanele.</strong> I-Atari\n    Lynx, i-arcade CPS, i-Super Famicom nezinye zazifunwa\n    emshinini ongafanele, futhi izistimu eziningi manje ziyafunwa,\n    yilo lonke imithombo nakuzimpumelelo.</li>\n  <li><strong>Isifunda somdlalo siqala egameni lefayela lawo.</strong>\n    Ithegi enjengokuthi (USA) manje inquma isifunda, futhi i-AI ayisabuzwa.\n    I-ROM Tools inethuluzi elisha, Fix Regions from File Names, lemidlalo\n    ama-scrape amadala ayiphutha.</li>\n  <li><strong>I-ScreenScraper ilandela isifunda somdlalo.</strong> Ibhokisi,\n    ibhokisi le-3D, Incwadi Yokusebenzisa, isihloko nosuku lokukhishwa manje kuvela\n    esifundeni somdlalo uqobo, hhayi kwesaqala ngama-alfabhethi. I-ROM Tools inethuluzi\n    elisha, Lungisa Izifunda Zebhokisi Nencwadi Yokusebenzisa, lama-scrape amadala. Amavidiyo manje\n    azama kuqala ifayela elincane.</li>\n  <li><strong>Izithombe ze-RAWG azisabi ubuciko bebhokisi.</strong> Kaningi\n    zimifanekiso-skrini, futhi zazivimbela isikhava sangempela. Manje zisetshenziswa\n    njenge-Fanart. I-ROM Tools inethuluzi elisha, Clear RAWG Pictures from Box Art,\n    lezo ama-scrape amadala azilondoloza. I-RetroDB iyayidumisa\n    i-RAWG ngesixhumanisi kusidebhari, njengoba i-RAWG icela.</li>\n  <li><strong>I-ES-DE igcina indawo yayo ohlwini lwakho lwama-scraper.</strong> Uma\n    ingeyona imithombo eyinhloko, imithombo eyalandela ne-AI kwakubeka esikhundleni umbhalo\n    nezikhava zayo, futhi imifanekiso-skrini yayo yayilahlwa. Manje iyahlala.\n    Ayisakopishi imidiya umdlalo osenayo, futhi ifunda okufakiwe\n    kwefayela le-ROM lomdlalo uqobo. Imidlalo yefolda ye-PS3 manje ithola izikhava\n    zayo ze-ES-DE. Ukungenisa amalogo ezistimu akusayithathi isithombe esingahlobene.\n    Ukuphinda Uscraphe Ngokugcwele akusasusi ibhokisi umthombo omunye osanda\n    kulidawuniloda.</li>\n  <li><strong>Screenshot Review.</strong> Ithuluzi elisha ku-ROM Tools libhala\n    imifanekiso-skrini ye-ZX Spectrum, Commodore 64 ne-Game Boy ngeyokusola kakhulu\n    kuqala, futhi lisusa kuphela osikhethile. Ukuscrapha manje kwenqaba umfanekiso-skrini\n    we-Game Boy okungumthombo wawo onamithunzi eminingi kakhulu kunalokho umshini\n    ongakubonisa. Ezistimini ze-8-bit ne-16-bit akusafaki\n    imifanekiso-skrini ye-IGDB noma ye-RAWG emdlalweni okhishwe ezistimini\n    eziningi.</li>\n  <li><strong>Ukungena kwe-RetroAchievements kufinyelela ku-DuckStation nku-PCSX2</strong>\n    uma ucindezela Dlala.</li>\n  <li><strong>Ekhasini lomdlalo:</strong> okhiye bemicibisholo yesobunxele nesokudla baya\n    emdlalweni owandulelayo nolandelayo, isigaba Sama-cheat siyasongeka\n    futhi siyakhumbula, amaphaneli aphansi ahambisana newindi, futhi i-emulator\n    iqanjwe kukhadi layo lezilungiselelo ze-Emulator, hhayi eduze kwe-Dlala.</li>\n  <li><strong>Ngenisa ibhokisi le-3D</strong> manje isefasiteleni Hlela, eduze\n    kwezinye izithombe.</li>\n  <li><strong>Iwindi eliqala ebhokisini lombhalo,</strong> njengokuthi Scrapha,\n    manje libeka ikhesa kuleli bhokisi esikhundleni sebhokisi lokuvala.</li>\n</ul>\n"
