  body: |
    <ul>
      <li><strong>I-RetroDB isilungele isidlali sayo semidlalo.</strong>
        Isidlali esisekelwe ku-RetroArch siyakhiwa ku-RetroDB. Uma sesifikile,
        i-RetroDB izoqala imidlalo kuso ngezilungiselelo ezikhethelwe
        umdlalo ngamunye, futhi igcine noma yiziphi izilungiselelo
        ozishintshayo ngenkathi udlala. Sizogcina okulondoloziwe kwaso
        nezilungiselelo zaso kufolda yaso, ngokwehlukile ku-RetroArch yakho.
        Sikhetha i-core engcono kakhulu yekhonsoli ngayinye futhi siyidawunilode
        okokuqala uma ucindezela okuthi Dlala; ngaleso sikhathi inkinobho ithi
        "Kudawunilodwa i-core…". Sidlala noma iyiphi ikhonsoli engenayo
        i-emulator esebenzayo, futhi asikaze sithathe isikhundla saleyo
        oyisethile. Kumdlalo ngamunye ungakhetha enye i-core, umphumela
        wesikrini, ukukala ngezinombolo eziphelele nokunciphisa
        ukubambezeleka kokufaka. Abaphathi bangafaka noma babuyekeze wonke
        ama-core ngesikhathi esisodwa, noma bavale ukudawunilodwa. Akukho
        lutho olushintshayo kuze kube isidlali sifakiwe; kuze kube yileso
        sikhathi asibalwa ngaphansi kwe-Izilungiselelo &gt;
        Ama-emulator.</li>
      <li><strong>Amathebhu eMnyuziyamu ayashintsha futhi.</strong> Ekhasini
        leMnyuziyamu lekhonsoli, ukuchofoza i-Imininingwane, Imidlalo Engu-10
        Ephezulu noma Izilawuli akwenzanga lutho futhi kwakhombisa umlayezo
        othi "Iphutha elingalindelekile", kusukela enguqulweni 3.30.0. Wonke
        amathebhu manje ayavuleka.</li>
      <li><strong>Imidlalo ye-PlayStation 3 egcinwe njengefolda
        iyadlaleka.</strong> Umdlalo wediski we-PS3 uvame ukuba yifolda
        egcina ngo-".PS3". I-RetroDB yenqaba ukuwuqala futhi ayizange
        ikhombise inkinobho ethi Dlala, ngoba yayilindele ifayela elilodwa.
        Manje inika i-emulator ifolda, njengoba i-RPCS3 ilindele.</li>
      <li><strong>Amakholomu ka-Sesha i-Metadata ayaqondana, futhi ingena
        kufoni.</strong> Umthombo onemiphumela engaphezu kwalena engenayo
        wathola ibha yokuskrola, eyenza izihloko zawo zaba mncane, ngakho
        isihloko esifanayo sasigoqeka kukholomu eyodwa kodwa hhayi kwelandelayo.
        Manje ikholomu ngayinye igcina isikhala esifanayo, nebha yokuskrola
        encane enemibala yetimu. Kufoni noma ewindini elincane, iwindi
        lokusesha lalicindezelwe eceleni kwebha eseceleni efihliwe; manje
        ligcwalisa isikrini.</li>
      <li><strong>Ukufaka okusha ku-Windows noma ku-Mac kunika ama-core
        e-RetroArch amagama afanele.</strong> I-RetroDB yasetha i-RetroArch
        ngamagama amafayela e-core e-Linux yonke indawo, ngakho ku-Windows
        naku-macOS ayikho i-core eyatholakala. Ukufaka okusha manje
        kusebenzisa amagama ekhompyutha ngayinye. Ukufaka osekukhona kugcina
        amagama okunawo; washintshe ethebhulini lokuxhumanisa.</li>
      <li><strong>Isibukisi semifanekiso-skrini sikhombisa yomibili
        imicibisholo, ngamunye ngaphakathi kwenkinobho yawo.</strong> Ibha
        eseceleni yayimboza umcibisholo wesobunxele, ngakho wawungakwazi
        ukubuyela emfanekisweni-skrini wangaphambilini ngegundane. Umcibisholo
        wesokudla nawo wawuhlala ngaphansi kwenkinobho yawo. Yomibili manje
        iyavela, phakathi nendawo ezinkinobhweni zayo.</li>
      <li><strong>Ikhasi lezilungiselelo zama-emulator livela ngolimi
        lwakho.</strong> Okuningi kwe-Izilungiselelo &gt; Ama-emulator
        bekungesiNgisi noma ngabe ukhethe luphi ulimi: izihloko zalo,
        ithebula lama-emulator, imiphumela yokuskena newindi elithi Hlela
        i-emulator. Konke manje kuhunyushiwe.</li>
      <li><strong>Ibhokisi ethi Abadlali yamukela inombolo engaphezu
        kuka-16.</strong> Womabili amawindi okuhlela ayema ku-16, ngakho
        wawungakwazi ukufaka abadlali abangu-256 be-MAG. Umdlalo
        isiscraphi esasiwunike ngaphezu kuka-16 wawungakwazi ukulondolozwa
        nhlobo uze wehlise inombolo. Manje awukho umkhawulo ophezulu.</li>
      <li><strong>Ukugcwalisa nge-AI kunika imidlalo ye-PC uhlobo lokulondoloza
        lwe-PC, hhayi olwekhonsoli.</strong> Umdlalo we-Windows wawungathola
        "Ikhadi Lememori" ngoba i-AI yayichaza inguqulo yawo ye-PlayStation
        2. I-AI manje itshelwa ukuthi ichaze ukukhishwa enkundleni yomdlalo
        wakho. Ama-PC, namakhonsoli kusukela ku-PlayStation 3 no-Xbox 360
        kuqhubeke, alondoloza kuSitoreji Sangaphakathi.</li>
      <li>Ukulungisa umdlalo osunohlobo lokulondoloza olungalungile,
        wuscraphe futhi noma uqalise Ukugcwalisa nge-AI. Kokubili kubuza
        i-AI futhi bese kuthatha isikhundla senani elidala.</li>
      <li><strong>Ukuxhuma i-PlayStation kukutshela ukuthi ungene
        kuqala.</strong> Ngaphansi kwe-Izilungiselelo &gt; I-akhawunti &gt;
        PSN, ikhasi le-akhawunti ye-Sony lalikhombisa kuphela "Invalid login"
        ngaphandle uma usuvele ungene ku-PlayStation, futhi izinyathelo
        bezingakusho lokho. Isinyathelo 1 manje sinenkinobho ethi "Ngena
        ku-PlayStation" okufanele uyicindezele kuqala.</li>
      <li><strong>Hlela uMtapo, futhi ukhombise kuphela imidlalo
        engascraphiwe.</strong> UMtapo nekhasi lesistimu ngalinye kunemenyu
        ethi Hlela nge eceleni kwesibalo semidlalo: igama, ukukhishwa
        okusha kakhulu noma okudala kakhulu, amaphuzu abagxeki, amaphuzu
        abasebenzisi, noma okungezwe muva nje. Imidlalo engenalo usuku noma
        amaphuzu iba ngeyokugcina. Ibha ye-A–Z iyasebenza uma uhlela ngegama
        futhi ifiphele uma kungenjalo. Inkinobho entsha ethi Okungascraphiwe
        ikhombisa kuphela imidlalo okungakabikho siscraphi esiyigcwalisile.</li>
      <li><strong>Isihlungi esingatholi lutho siyakusho lokho.</strong>
        Ikhasi lalivele lingabi nalutho. Manje lithi ayikho imidlalo
        efanayo, nenkinobho yokusula izihlungi.</li>
      <li><strong>Ibha yezihlungi yoMtapo igcina yonke into endaweni
        yayo.</strong> Ukucindezela okuthi Khetha, ukuhlunga noma ukuhlela
        bekuphushela imidlalo phansi ekhasini. Amathuluzi okukhetha manje
        avela ebheni elingezansi kwewindi. Okuthi Sula kuhlala kukhona,
        kufiphele kuze kuvulwe isihlungi. Izihlungi ezisebenzayo zivela
        eceleni kwesibalo semidlalo. "Bonisa iBhonasi" manje ithi
        "Amadiski Ebhonasi", ekhanyayo uma ivuliwe. Kufoni, izinkinobho
        zezihlungi zivuleka enkinobhweni eyodwa ethi Izihlungi phezu
        kwekhasi.</li>
      <li><strong>Umtapo ongenalutho ukhombisa ukwamukela nenkinobho
        yokuskena.</strong> Ukufaka okusha bekukhombisa amaphuzu empilo
        abambeke ku-0% noMtapo ongenalutho. Manje womabili amakhasi athi
        umtapo awunalutho futhi anikeza inkinobho ethi Skena Umtapo.
        Ideshibhodi nayo ixhuma esilungiselelweni sefolda ye-ROM. Abasebenzisi
        abangebona abaphathi batshelwa ukuthi babuze umphathi. Umdlalo
        Ongahleliwe ufihliwe kuze kube nemidlalo yokukhetha kuyo.</li>
      <li><strong>Skena Umtapo iyasebenza ekhasini lezistimu
        nase-Izilungiselelo.</strong> Lezo zinkinobho ezimbili ezithi Skena
        Umtapo bezingenzi lutho uma zicindezelwa. Eyodwa yeDeshibhodi kuphela
        eyayisebenza. Inkinobho yeDeshibhodi ethi Skena Umtapo manje ivela
        kuphela kubaphathi, okuyibo kuphela abasebenzisi abavunyelwe
        ukuskena.</li>
      <li><strong>I-wizard yokusetha ikhombisa ukuthi ukusiphi isinyathelo,
        nokuthi iziphi ezingaphoqelekile.</strong> Ithi "Isinyathelo 3 kwezi-6",
        inika isinyathelo ngasinye inombolo, imaka lezo osuzidlulile, futhi
        imaka i-ES-DE no-Okhiye be-API njengokungaphoqelekile. Kufoni
        ikhombisa izinombolo negama lesinyathelo samanje.</li>
      <li><strong>Hlunga uMtapo ngezinhlobo, uchungechunge noma abashicileli
        abaningana ngesikhathi esisodwa.</strong> Ezihlungini ezithi Uhlobo,
        Uchungechunge, Umshicileli, Umqambi, Amamodi Okudlala, Umbono
        no-Ubukhulu, maka amanani amaningi ngendlela othanda ngayo bese
        ucindezela okuthi Faka: umdlalo uyavela uma unanoma yiliphi lawo.
        Shintshela iwindi ku-AKUYONA ukuze ufihle imidlalo enanoma yiliphi
        lamanani amakiwe. Inani ngalinye lithola ithegi yalo, futhi i-✕
        yayo isusa lelo nani kuphela.</li>
    </ul>
