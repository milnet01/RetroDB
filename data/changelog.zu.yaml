  body: "<ul>\n  <li><strong>Ukuscrapha kuyayeka ukuthatha umdlalo oyiphutha.</strong> Umlandelanelo\n    awusadlula njengomdlalo onawo, ngakho i-Street Fighter II ayithole lutho\n    ku-Street Fighter, nokuscrapha ngobuningi kudinga isihloko sifane, hhayi\n    i-console kuphela. Ama-mod, i-DLC namabhandlela e-IGDB akusafani ngaphandle uma\n    i-ROM yakho inaleli gama ngqo.</li>\n  <li><strong>I-RAWG iyayeka ukuxuba izinguqulo zomdlalo.</strong> Uma irekhodi layo\n    lihlanganisa ama-console amaningi ayisanikezi umqambi, umshicileli, isilinganiso\n    seminyaka noma izindlela zabadlali abaningi, futhi ayisakulinganisi inani labadlali.\n    Ayisafunwa imidlalo ye-Commodore 64 ne-DOS.</li>\n  <li><strong>Ukulandelana kwakho kwama-scraper kunquma phakathi kwemiphumela elinganayo.</strong>\n    I-RAWG ayisakhokhelwa amaphuzu engeziwe ngesithombe noma amaphuzu e-Metacritic, futhi ukufakwa\n    okusha kuyibeka yokugcina.</li>\n  <li><strong>Usuku lokukhishwa lubonisa kuphela lokho umthombo walo owaziyo.</strong> Umdlalo\n    owaziwa ngonyaka kuphela ubonisa lowo nyaka. Izinsuku ze-IGDB ne-RAWG\n    zingezaleyo i-console yomdlalo, futhi uhlu lwe-Release Dates manje lugcwaliswa\n    yi-IGDB ne-ScreenScraper nayo.</li>\n  <li><strong>Isethi eyodwa yamagama ezinhlobo, iziqondo nezindlela.</strong>\n    Izihlungi manje zithola yonke imidlalo, futhi imidlalo ye-inthanethi kuphela ayisadweliswa\n    njengabadlali abaningi basekhaya.</li>\n  <li><strong>Amakhadi amabili amasha e-ROM Tools.</strong> I-Tidy Release Dates ne-Tidy\n    Genres, Perspectives and Modes zilungisa okugcinwe ukuscrapha kwangaphambili. Zicindezele,\n    bese uqhuba ukuscrapha ngobuningi nge-Fill Missing.</li>\n  <li><strong>Izinombolo zabadlali zivela ku-console yomdlalo ngokwayo,</strong> futhi\n    umphumela we-ScreenScraper owukhethayo njalo ungumdlalo owuthola.</li>\n</ul>\n"
