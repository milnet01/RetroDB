- version: 4.0.0
  date: '2026-11-27'
  tags:
  - type: enhancement
    label: "Imnyuziyamu manje inamamodeli e-3D ongawajikelezisa futhi uwakhulise, njengamabhokisi emidlalo: amakhonsoli angu-11 (Atari 2600, NES, Famicom, SNES, Nintendo 64, GameCube, Master System, Mega Drive, Saturn, PlayStation kanye ne- PlayStation 2) kanye nezilawuli ezingu-10, kuhlanganise ne-NES Zapper. Cindezela Buka nge-3D ngaphansi kwesithombe sekhonsoli, noma kusilawuli kuthebhu ye-Izilawuli. Donsa noma sebenzisa okhiye bemicibisholo ukujikelezisa imodeli, kanye nevili lempunga noma + no - ukukhulisa. Ngaphansi kwemodeli ngayinye kunokubonga umuntu owayenza, isixhumanisi sekhasi lakhe, kanye nelayisense yayo"
    en: "The museum now has 3D models you can turn and zoom, as with game boxes: 11 consoles (Atari 2600, NES, Famicom, SNES, Nintendo 64, GameCube, Master System, Mega Drive, Saturn, PlayStation and PlayStation 2) and 10 controllers, the NES Zapper among them. Press View in 3D under a console's picture, or on a controller in the Controllers tab. Drag or use the arrow keys to turn the model, and the mouse wheel or + and - to zoom. Under each model is a credit to the person who made it, a link to its page, and its licence"
  - type: fix
    label: "Ku-Imnyuziyamu, inkinobho eyindilinga yokubuyela phezulu ayisabonakali phezu kwesithombe sekhonsoli noma sesilawuli esikhuliswe"
    en: "In the museum, the round back-to-top button no longer shows on top of an enlarged console or controller picture"
  - type: fix
    label: "Emnyuziyamu, izinkinobho ezithi Dala Okuqukethwe, Landa Zonke Izithombe, Sesha, Layisha kanye nethi Susa Ingemuva manje ziboniswa kuphela kubahleli nakubaphathi, okuwukuphela kwabo ezisebenzela bona. Ukukhetha Injini kusihlungi sezinhlobo somnyuziyamu manje kuthola izinhlelo zezinjini ezifana ne-ScummVM, i-PICO-8 nama-Ports"
    en: "In the museum, the Generate Content, Fetch All Images, Search, Upload and Remove BG buttons now show only to editors and admins, who are the only ones they work for. The Engine choice in the museum's type filter now finds engine systems such as ScummVM, PICO-8 and Ports"
  - type: enhancement
    label: "Imidlalo eminingi manje ithola inani lokuthengisa. Uma umdlalo ungenalo, i-RetroDB manje ibuza i-AI ngokuthengisa ngokwehlukile, hhayi phakathi kwemibuzo eyishumi nambili; ekuhloleni lokhu kutholele imidlalo eyi-7 kweyi-10 inani, uma kuqhathaniswa no-1 kwemi-3 ngaphambili. Lapho kushicilelwe inani eliphelele kuphela lamakhonsoli amaningi, njengezigidi eziyi-8 ze-Battlefield Hardline ku-PS4, Xbox One nePC, i-RetroDB iligcina lodwa futhi ishiye inani lekhonsoli ngokwayo lingenalutho. Ikhasi Lokuhlaziya line-sethi entsha Yokuthengisa ebala imidlalo ethengiswa kakhulu kanye nala manani onke amakhonsoli. Ukubuza ngemidlalo ekhishwe ngaphambilini, qalisa Ukugcwalisa nge-AI kuphawulwe Amakhophi athengisiwe"
    en: "More games now get a sales figure. When a game has none, RetroDB now asks the AI about sales on their own, instead of among a dozen other questions; in a test this found a figure for 7 games in 10, against 1 in 3 before. Where only a total across several consoles is published, such as 8 million for Battlefield Hardline on PS4, Xbox One and PC, RetroDB keeps it apart and leaves the console's own figure empty. The Analytics page has a new Sales section listing the best-selling games and these all-console totals. To ask about games scraped before, run AI Fill with Copies sold ticked"
  - type: enhancement
    label: "Amabhokisi e-3D e-PS3 akhiwe manje afana nangaphakathi kwekheyisi langempela, kufundwe ezithombeni zelinye. Uma livuliwe, idiski ihlala endandatheni ephakanyisiwe enomgodi weminwe ezinhlangothini zombili phezulu, ehabhini eyindilinga enenkinobho engunxantathu namaflephu amathathu anesprinki abamba idiski. Izibambi ezimbili zikhona onqenqemeni lokuvula lengxenye ngayinye, ngaphezulu nangaphansi komgodi weminwe, futhi udonga oluphansi luvala umugqa obonakalayo phezulu. Uhlangothi lwencwajana lunezibambi ezimbili ezifanayo nezekheyisi le-PS5. Ipulasitiki yekheyisi manje iyabonakala ngaphakathi, futhi lapho kungekho skena sangaphakathi kwekhava, isithombe sekhava uqobo sibonakala kancane ngethreyi. Ngaphandle, ikhava manje iqala ngaphansi komucu osobala phezulu, onePLAYSTATION 3 nelogo yeBlu-ray ebunjwe kuwo, ngakho amakhava e-PS3 awasadonswa ukuze alingane"
    en: "Built 3D PS3 boxes now match the inside of the real case, read from photos of one. Opened, the disc sits in a raised ring with a finger dip either side of the top, on a round hub with a triangular button and three sprung flaps that hold the disc. Two catches sit on the opening edge of each half, above and below the finger slot, and a low wall closes off the clear strip at the top. The booklet side has the same two clips as the PS5 case. The case's plastic is now see-through, and where there is no scan of the inside of the cover, the cover's own picture shows faintly through the tray"
  - type: enhancement
    label: "Umuntu ngamunye endlini manje une-status yakhe yokuqeda kumdlalo ngamunye. Ukubeka umdlalo ku-Kuqediwe akusayishintshi ilayisheri yomunye umuntu, futhi wonke umuntu ongenile angabeka eyakhe, kuhlanganise nabakwa-viewer. Uma udlala umdlalo ngenkinobho ethi Dlala imizuzu eyi-10 noma ngaphezulu, futhi i-player ehlanganisiwe igcine umdlalo noma uthole i-RetroAchievement, i-Akuqalisiwe yakho iya ngokwayo ku-Kuyaqhubeka. Ngemva kwesikhathi eside sokudlala ngaphandle kwakho kokubili, ikhasi lomdlalo likubuza kanye, ngokuchofoza kanye. Ikhasi lomdlalo liphinde libonise ukuthi sekudlale isikhathi esingakanani umdlalo usuka ku-RetroDB. Ama-status abekwe ngaphambi kwalesi sibuyekezo manje angawe-akhawunti yomlawuli wokuqala"
    en: "Each person in the house now has their own completion status for every game. Setting a game to Completed no longer changes anyone else's library, and everyone signed in can set their own, viewers included. When you play a game with the Play button for 10 minutes or more, and the built-in player saved the game or you earned a RetroAchievement, your Not Started moves to In Progress by itself. After a long session with neither, the game page asks you once, with one click. The game page also shows how long you have played the game from RetroDB. Statuses set before this update now belong to the first admin account"
  - type: fix
    label: "Ukuklwebha manje kuthola umdlalo noma ngabe umthombo uzibhala kanjani izimpawu zawo zomsindo. Uma ukusesha kungatholi lutho, kuyabuzwa futhi ngaphandle kwezimpawu, ngakho i-Ghost of Yōtei ibuye ithole umthombo obhala i-Ghost of Yotei. I-MobyGames, egcina izimpawu, nayo iyabuzwa futhi, ngakho i-Ghost of Yotei ithola i-Ghost of Yōtei lapho"
    en: "Scraping now finds a game however a source spells its accents. When a search finds nothing, it is asked again without the accents, so Ghost of Yōtei also finds a source that writes Ghost of Yotei. MobyGames, which keeps the accents, is asked again too, so Ghost of Yotei finds Ghost of Yōtei there"
  - type: fix
    label: "Ocingweni, ikhasi lomdlalo noma lempumelelo alisaphenduki liye eceleni uma isihloko somdlalo siyigama elilodwa elide. Isihloko sincane kancane lapho, futhi sehlukaniswa siye emugqeni wesibili uma singakalingani"
    en: "On a phone, a game or achievements page no longer scrolls sideways when the game's title is one long word. The title is a little smaller there, and breaks onto a second line if it still does not fit"
  - type: fix
    label: "Umbhalo usulula ukuwufunda ezindaweni eziningi. Igama lethegi manje livela limnyama noma limhlophe, noma yikuphi okufundeka kangcono phezu kombala wethegi; ilebula ye-Hardcore yempumelelo inombhalo omnyama phezu kobomvu bayo; futhi izinombolo zemigqa ku-Isibuki Selogi azisafiphele. Ku-Ukususa Amaphindwa Emifanekiso-skrini, umfanekiso-skrini ozosuswa manje unomngcele obomvu nebheji ethi Susa, esikhundleni sokubukeka ufiphele nje. Amalebula kumafomu ezilungiselelo manje abukeka ngendlela efanayo nakuwo wonke amanye amakhasi"
    en: "Text is easier to read in more places. A tag's name now shows in dark or white, whichever reads better on the tag's colour; an achievement's Hardcore label has dark text on its red; and line numbers in the Log Viewer are no longer faded. In Screenshot Dedup, a screenshot that will be deleted now has a red border and a Delete badge, instead of only looking faded. Labels in Settings forms now look the same as on every other page"
  - type: enhancement
    label: "Amabhokisi e-3D e-PS5 akhiwe manje afana nangaphakathi kwekheyisi langempela, elikalwe ezithombeni ngerula. Uma livuliwe, idiski ihlala endilinganeni ephakanyisiwe enemigodi emine yeminwe, phezu kwehabhu eyindilinga enezikhala eziyishumi nezilimi ezinhlanu ezinesipringi. Uhlangothi lwencwajana lunesiqeshana eduze kwekhona ngalinye lomphetho walo wokuvula nomzila phezulu nangezansi, futhi udonga oluphansi luzungeza ngaphakathi kwengxenye ngayinye. Ikheyisi futhi lijiyile ngo-14 mm, njengelangempela. Phinda usebenzise Yakha Amabhokisi e-3D ukuze ubuyekeze amabhokisi akhiwe ngaphambili"
    en: "Built 3D PS5 boxes now match the inside of the real case, measured from photos with a ruler. Opened, the disc sits in a raised ring with four finger dips, on a round hub with ten slits and five sprung tongues. The booklet side has a clip near each corner of its opening edge and a rail along its top and bottom, and a low wall runs round the inside of each half. The case is also 14 mm thick, as the real one is. Run Build 3D Boxes again to update boxes built before"
  - type: fix
    label: "Uma i-RetroDB imiswa, umsebenzi we-Yakha Amabhokisi e-3D osebenzayo manje uyama kanye neminye imisebenzi. Uqala qede ibhokisi owenza kuyo, ngakho akukho bhokisi eliyashiywa lakhiwe uhhafu"
    en: "When RetroDB is stopped, a running Build 3D Boxes job now stops with the other jobs. It finishes the box it is on first, so no box is left half built"
  - type: fix
    label: "Efonini, ukuthinta unhlamvu kubha ye-A-Z ye-Umtapo manje kuletha umdlalo wokuqala walowo nhlamvu phezulu esikrinini, ngisho noma i-RetroDB kufanele iqale ilayishe leyo midlalo. Ngaphambili umdlalo wawusala phansi esikrinini, ngemuva kwebha engezansi"
    en: "On a phone, tapping a letter in the Library's A-Z bar now brings that letter's first game to the top of the screen, even when RetroDB has to load those games first. Before, the game was left at the bottom of the screen, behind the bottom bar"
  - type: fix
    label: "Utolo oluncane kuhlu ngalunye olwehlayo manje luthatha umbala wethimu yakho yemibala, esikhundleni sokuhlala luluhlaza okwesibhakabhaka"
    en: "The small arrow on each drop-down list now takes your colour theme's colour, instead of always being blue-green"
  - type: fix
    label: "Idiski noma ikhatriji ebhokisini ye-3D evuliwe ayisahlali phezu kwesikwele esimhlophe. I-RetroDB manje isika isithombe ngasinye esilandiwe sediski noma sekhatriji siphume ngemuva laso elimhlophe, elimpunga noma elimnyama elingenalutho, isinqume silingane nediski. Sebenzisa u-Yakha Amabhokisi e-3D kanye ukuze uhlanze izithombe ezilandwe ngaphambili"
    en: "The disc or cartridge in an open 3D box no longer sits on a white square. RetroDB now cuts each downloaded disc and cartridge picture out of its plain white, grey or black background and trims it to the disc. Run Build 3D Boxes once to clean up pictures downloaded before"
  - type: enhancement
    label: "Amabhokisi e-3D e-GameCube akhiwe manje afana nekesi yangempela: 134 ngo-190 ngo-15 mm, anomsele womunwe nembobo yesikwele yokuvala ohlangothini oluvulekayo. Uma ivuliwe, ikesi ikhombisa ithreyi yediski enezinhlangothi eziyisithupha, isibambi sekhadi lememori, ilogo ye-Nintendo GameCube ebunjiwe nezithombe ezimbili zokubamba idiski, futhi umdlalo onamadiski amabili ubamba idiski yawo yokuqala esivalweni esinehinji ngaphezu kweyesibili. Phinda usebenzise u-Yakha Amabhokisi e-3D ukuze ubuyekeze amabhokisi akhiwe ngaphambili"
    en: "Built 3D GameCube boxes now match the real case: 134 by 190 by 15 mm, with the finger groove and the square latch hole on the opening edge. Opened, the case shows the six-sided disc tray, the memory card holder, the moulded Nintendo GameCube logo and the two disc-handling pictures, and a two-disc game holds its first disc on a hinged flap over the second. Run Build 3D Boxes again to update boxes built before"
  - type: enhancement
    label: "Amabhokisi e-3D akhiwe manje afika ezimeni zangempela eziningi. Uhlelo lomdlalo manje lukhetha isimo sawo: umdlalo we-PS3 we-Greatest Hits uthola isimo esibomvu, umdlalo we-PS4 we-PlayStation Hits obomvu, nomdlalo waseYurophu we-Platinum osiliva. Umdlalo wasePlayStation waseYurophu emadiskini amathathu noma ngaphezulu uthola isimo esijiyile samadiski amaningi, i-New Super Luigi U isimo sayo esiluhlaza se-Wii U, namabhokisi aseJapan e-Game Gear alahlekelwa yithebhu yokulengisa. Iwindi lokuHlela linohlu olusha lweSimo sebhokisi le-3D lokukhetha nanoma yimuphi omunye isimo ngesandla, njengesimo sakuqala se-Xbox One esinelogo eyakhiwe phambili"
    en: "Built 3D boxes come in more of the real cases. A game's Edition now picks its case: a Greatest Hits PS3 game gets the red case, a PlayStation Hits PS4 game the red one, and a European Platinum game the silver one. A European PlayStation game on three or more discs gets the thick multi-disc case, New Super Luigi U its green Wii U case, and Japanese Game Gear boxes lose the hanging tab. The Edit window has a new 3D box case list for picking any other case by hand, such as an early Xbox One case with the logo moulded into the front"
  - type: fix
    label: "Ukuvumelanisa kwePlayStation Network manje kubuza kuSony kanye kuphela njalo ngemizuzwana emi-3, isivinini esiphakanyiswa yilayibhrari yePSN ngokwayo, ngakho-ke i-akhawunti yakho yePSN ayikho kangako engaphawulwa. Amalayibhrari amakhulu athatha isikhathi eside kancane ukuvumelanisa"
    en: "PlayStation Network syncs now ask Sony at most once every 3 seconds, the pace the PSN library itself recommends, so your PSN account is less likely to be flagged. Large libraries take a little longer to sync"
  - type: fix
    label: "Isishintshi Sosayizi Wesithombe kuMathuluzi e-ROM manje silinda ukuguqulwa kwezithombe kube yi-WebP kuqede, ukuze lokhu kokubili kungabe kusashintsha izithombe zebhokisi ezifanayo ngesikhathi esisodwa kushiye ikhophi elahlekile. Ukuvumelanisa izimpumelelo ze-Steam ne-Xbox manje kuyama kancane ngemva komdlalo isevisi engenalutho ngawo, njengoba kwenza ngemva kwayo yonke eminye imidlalo"
    en: "The Image Resizer in ROM Tools now waits for a conversion of pictures to WebP to finish, so the two no longer change the same box pictures at once and leave a stray copy behind. Steam and Xbox achievement syncs now pause after a game the service had nothing for, as they do after every other game"
  - type: fix
    label: "Izinkinobho, amathebhu, amaphaneli namabheji abehlala eluhlaza okwesibhakabhaka nokuluhlaza noma ngabe ukhethe iyiphi ithimu yemibala, manje athatha umbala wethimu oyikhethile. Kanjalo namashadi asekhasini Lokuhlaziya. Ku-Uhlu Lwezifiso, ibheji ngalinye lokubaluleka liphinde laba nesizinda nomngcele onombala"
    en: "Buttons, tabs, panels and badges that stayed blue-green whatever colour theme you chose now take the chosen theme's colour. So do the charts on the Analytics page. On the Wishlist, each priority badge has its coloured background and border back"
  - type: fix
    label: "Efonini, imigoqo yezihlungi emakhasini e-Umtapo, Izistimu namakhasi e-log manje iyaskrola ihambe nekhasi, esikhundleni sokuhlala esikrinini imboze kuze kufike kwezimbili kwezintathu zaso. Imigqa yamathebhu, njengaleyo ese-Amathuluzi e-ROM nase-Izilungiselelo, ihlala phezulu njengomugqa owodwa owuswayiphela eceleni, nethebhu yamanje ibonakala"
    en: "On a phone, the filter bars on the Library, Systems and log pages now scroll away with the page, instead of staying on screen and covering up to two thirds of it. Tab rows, such as those in ROM Tools and Settings, stay at the top as one row you swipe sideways, with the current tab in view"
  - type: enhancement
    label: "Amabhokisi e-3D akhiwe manje afana kakhulu namakheyisi angempela. Amakheyisi e-Mega Drive (Genesis) ne-Master System mancane kancane, ukuze afane nekheyisi langempela elikalwe ngerula, futhi amakheyisi e-Mega Drive aseJapan awasenalo ithebhu lokulengisa. Umdlalo wokuqala we-PlayStation wase-US onekhava eskeniwe ende uthola ibhokisi elide, futhi umdlalo we-NES wase-US okhishwe kusukela ngo-Okthoba 1985 kuya ku-Septhemba 1987 uthola ibhokisi elinethebhu lokulengisa. Phinda usebenzise Yakha Amabhokisi e-3D ukuze ubuyekeze amabhokisi akhiwe ngaphambili"
    en: "Built 3D boxes look more like the real cases. Mega Drive (Genesis) and Master System cases are a little smaller, to match a real case measured with a ruler, and Japanese Mega Drive cases no longer have a hanging tab. An early US PlayStation game whose scanned cover is tall gets the tall long box, and a US NES game released from October 1985 to September 1987 gets the box with a hanging tab. Run Build 3D Boxes again to update boxes built before"
  - type: enhancement
    label: "Ibhokisi le-3D elakhiwe manje liyafana nesithombe sebhokisi le-3D lomdlalo ekhasini lomdlalo. Uma kungekho mgogodla oskeniwe, lithatha umgogodla walo ophrintiwe kulesosithombe, kanye nengaphambili lalo uma ikhava eskeniwe ingukhishwa kwelinye izwe. Izithombe eziskeniwe ze-MobyGames manje zivela ekukhishweni okukhonjiswa yilesosithombe, uma i-MobyGames inakho, futhi umdlalo we-Saturn waseYurophu uthola ukheyisi olude lwe-Saturn esikhundleni sokheyisi lwe-CD. Phinda usebenzise Yakha Amabhokisi e-3D ukuze ubuyekeze amabhokisi akhiwe ngaphambili"
    en: "A built 3D box now matches the game's 3D box picture on the game page. With no spine scan it takes its printed spine from that picture, and its front too when the scanned cover is another country's release. MobyGames' scans now come from the release that picture shows, where MobyGames has it, and a European Saturn game gets the tall Saturn case instead of a CD case. Run Build 3D Boxes again to update boxes built before"
  - type: security
    label: "Uma isixhumanisi sesithombe noma sevidiyo sithumela i-RetroDB kwelinye ikheli, i-RetroDB manje iya kuphela ekhelini esanda kulihlola, ngakho iwebhusayithi ayikwazi ukuyiqondisa kudivayisi esenethiwekhini yakho yasekhaya"
    en: "When a picture or video link sends RetroDB on to another address, RetroDB now goes only to the address it has just checked, so a web site cannot steer it to a device on your home network"
  - type: security
    label: "Umhleli Wamadiski Amaningi ku-Amathuluzi e-ROM manje uyalenqaba igama lekhonsoli noma lomdlalo elikhomba kwenye ifolda, ngakho uhambisa amadiski ngaphakathi kwefolda yaleyo khonsoli kuphela"
    en: "The Multi-Disc Organizer in ROM Tools now refuses a console or game name that points to another folder, so it only ever moves discs inside that console's own folder"
  - type: fix
    label: "Uma ikhompyutha yakho isethelwe ukunciphisa ukunyakaza, i-RetroDB ayisashelelezi uma ikuskrolela ikhasi, njengokuthi Buyela phezulu noma ukweqela esigabeni: iya khona ngokushesha"
    en: "If your computer is set to reduce motion, RetroDB no longer glides when it scrolls the page for you, such as Back to top or jumping to a section: it moves there at once"
  - type: fix
    label: "Ekhasini le-Izistimu, amabhokisi amabili okuhlunga manje athatha umbala wetimu yakho esikhundleni sokuluhlaza okumnyama okungashintshi"
    en: "On the Systems page, the two filter boxes now take their colour from your theme instead of a fixed dark blue"
  - type: fix
    label: "Efonini, ikhasi leIzistimu alisashiyi isikhala esikhulu esingenalutho ngaphansi kwekhadi ngalinye lekhonsoli, ngisho nangemva kokuba iwindi lenziwe laba lincane. Isihloko eside segama elilodwa kuIzilungiselelo manje sehlela emgqeni olandelayo esikhundleni sokuphuma esikrinini"
    en: "On a phone, the Systems page no longer leaves a large empty space under each console card, even after the window is made narrower. A long one-word heading in Settings now breaks onto the next line instead of running off the screen"
  - type: fix
    label: "I-MobyGames manje iyawuthola umdlalo eyibhala ngegama elinamachashazi, njenge-M.U.S.H.A. ye-MUSHA: uma igama lonke lingatholi lutho, iphinda isesha uhlamvu ngohlamvu"
    en: "MobyGames now finds a game it lists under a name written with dots, such as M.U.S.H.A. for MUSHA: when the whole name finds nothing, it asks again letter by letter"
  - type: fix
    label: "Umbhalo ompunga ofiphele usufundeka kalula kuzo zonke izindikimba: amacebiso, imibhalo yezibonelo namalebula amancane akhanya kakhulu. Amabheji obekunzima ukuwafunda nawo acace kakhulu: ibheji le-PEGI emakhadini emidlalo, amabheji amakhonsoli, inkinobho ethi Qamba kabusha, inani le-RetroAchievements nombala obomvu wendikimba ye-Cathedral"
    en: "Faint grey text is easier to read in every theme: hints, placeholders and small labels are brighter. Badges that were hard to read are clearer too: the PEGI badge on game cards, the console badges, the Rename button, the RetroAchievements count and the Cathedral theme's red"
  - type: fix
    label: "I-MobyGames manje ibuzwa ngaphambi kwe-AI, njengoba bekuhleliwe, ngisho noma ukulandelana kwemithombo kwagcinwa ngaphambi kokuthi i-MobyGames yengezwe, ngakho i-AI ayisagcwalisi lokho i-MobyGames ekwaziyo. I-MobyGames futhi yenqaba izicelo ze-RetroDB kancane: i-RetroDB manje ilinda isikhashana eside phakathi kwazo, futhi ukulondoloza okhiye bakho be-API akusavumeli isicelo ukuthi seqe ulayini"
    en: "MobyGames is now asked before the AI, as planned, even where the order of sources was saved before MobyGames was added, so the AI no longer fills in what MobyGames knows. MobyGames also refuses RetroDB's requests less often: RetroDB now waits a little longer between them, and saving your API keys no longer lets a request jump the queue"
  - type: fix
    label: "I-AI Fill ayisabonisi i-AI lutho olunikezwe yi-MobyGames, futhi ishiya lezo zinhlobo zolwazi njengoba i-MobyGames izinikeze, ngoba imigomo ye-MobyGames inqabela ukuthi idatha yayo inikezwe i-AI. Isikweletu esithi “Data by MobyGames.com” manje sifundeka ngokufanayo kuyo yonke ulimi, njengoba i-MobyGames icela"
    en: "AI Fill no longer shows the AI anything MobyGames supplied, and leaves those details as MobyGames gave them, because MobyGames' terms forbid passing its data to an AI. The \"Data by MobyGames.com\" credit now reads the same in every language, as MobyGames asks"
  - type: fix
    label: "Kufoni, uhlu lwemithombo ku-Izilungiselelo > Ukuscrapha luyafundeka futhi: igama nencazelo ngayinye kusebenzisa ububanzi obugcwele, nesimo sayo neswishi yokuvula/ukuvala emugqeni ongezansi. Ngaphambilini umbhalo wawuminyaniswe waba yigama elilodwa emugqeni futhi iswishi yayinqunyiwe"
    en: "On a phone, the list of sources in Settings > Scraping is readable again: each name and description uses the full width, with its status and on/off switch on the line below. Before, the text was squeezed to one word a line and the switch was cut off"
  - type: fix
    label: "Izingxenye eziningi ze-RetroDB manje zisebenza ngekhibhodi kuphela. Amakholomu emibiko ahlelwa nge-Enter, futhi inkinobho yokuSusa yezithombe-skrini ivela uma i-Tab iyifinyelela. Ukususa ithegi noma isihlungi sethala, ukucindezela Load More ekhasini Lerekhodi Lezinguquko, noma ukuvuselela uhlu lwezifiso ngesikhathi sokukrola manje kukugcina lapho ukhona esikhundleni sokukubuyisela phezulu ekhasini"
    en: "More of RetroDB now works with the keyboard alone. Report columns sort with Enter, and the screenshot Delete button appears when Tab reaches it. Removing a tag or a library filter, pressing Load More on the Changelog, or a wishlist refresh during a scrape now keeps your place instead of sending you back to the top of the page"
  - type: fix
    label: "Ngesifundi sesikrini, izinkinobho nezikhala eziningi manje ziyasitshela ukuthi yini. Amabhokisi okumaka abiza umdlalo noma ifayela lawo, futhi amabhokisi okusesha nokuhlunga anamagama. Izinkinobho ezibonisa uphawu kuphela (×, ✎, 🗑️) zisho into ezenzayo, futhi amashadi e-Analytics anamagama. Izinkinobho zokuhlunga kuma-Log, emibikweni nakuma-PSN Trophies zisho ukuthi ziyavuliwe yini, futhi amaphutha okungena nawokusetha ayafundwa ngokuzwakalayo"
    en: "With a screen reader, more buttons and boxes now say what they are. Tick boxes name their game or file, and search and filter boxes have names. Buttons showing only a symbol (×, ✎, 🗑️) say what they do, and Analytics charts are named. The filter buttons on Logs, Reports and PSN Trophies say whether they are on, and sign-in and setup errors are read out"
  - type: feature
    label: "Ibhokisi ye-3D evuliwe manje ibonisa idiski noma ikhatriji yangempela emidlalweni eminingi: uma i-MobyGames ingenaso isithombe sayo, i-RetroDB isebenzisa esika-ScreenScraper, noma leso i-ES-DE esivele isilandile. Phinda u-scrape umdlalo ukuze usengeze"
    en: "The open 3D box now shows the real disc or cartridge for more games: when MobyGames has no picture of it, RetroDB uses ScreenScraper's, or the one ES-DE has already downloaded. Scrape a game again to add it"
  - type: enhancement
    label: "Ikhasi Lerekhodi Lezinguquko manje kulula ukulifunda: inguqulo ngayinye ikhombisa ibheji elincane elilodwa ohlobo ngalunye loshintsho, futhi izinguquko ngokwazo ziwumbhalo ojwayelekile ohlelwe ngaphansi kokuthi Izici ezintsha, Ukuthuthukiswa, Ukulungiswa Nokuphepha. Ikhasi futhi selibanzi kakhulu"
    en: "The Changelog page is easier to read: each version shows one small badge for each kind of change, and the changes themselves are ordinary text grouped under New features, Improvements, Fixes and Security. The page is also wider"
  - type: feature
    label: "Ibhokisi ye-3D yomdlalo we-Mega Drive, Genesis noma Master System manje inethebhu yokulengisa yesitolo phezulu, enembobo yayo, kanye nonqenqema oluphakeme nesinyathelo esijulile lapho ikesi livuleka khona, njengasekesini langempela. Amabhokisi e-Game Gear nawo athola ithebhu. Phinda usebenzise Yakha Amabhokisi e-3D ukuze ubuyekeze unqenqema emabhokisini akhiwe ngaphambili"
    en: "The 3D box of a Mega Drive, Genesis or Master System game now has the shop's hanging tab at the top, with its slot, and a raised lip and a deeper step where the case opens, as on the real case. Game Gear boxes get the tab too. Run Build 3D Boxes again to update the lip on boxes built before"
  - type: fix
    label: "Bala Osayizi Bamafayela ku-Izilungiselelo > Isistimu manje isho lokho ekutholile, ebhokisini ehlala ngaphansi kwenkinobho, futhi ayisabheki kudiski imidlalo engenisiwe, engenalo ifayela"
    en: "Calculate File Sizes in Settings > System now says what it found, in a box that stays under the button, and no longer looks on disk for imported games, which have no file"
  - type: fix
    label: "I-MobyGames manje iyawutholakala umdlalo onegama elibhalwe ngokuhlukile kancane, njenge-'Castlevania Bloodlines' esikhundleni se-'Castlevania: Bloodlines', futhi izama igama eliyinhloko legama uma igama lonke lingathole lutho. Usesho lwangemva nje kokuvula Ideshibhodi noma Izilungiselelo alusabuyi lungenalutho, futhi isimo se-MobyGames lapho asisasho Iphutha lokuxhuma uma i-MobyGames ihamba kancane"
    en: "MobyGames now finds a game whose name is written a little differently, such as 'Castlevania Bloodlines' for 'Castlevania: Bloodlines', and tries the name's main word when the whole name finds nothing. A search just after opening the Dashboard or Settings no longer comes back empty, and the MobyGames status there no longer says Connection error when MobyGames is slow"
  - type: feature
    label: "Umsebenzisi ngamunye manje angasula inqubekela phambili yakhe ye-RetroAchievements kukhonsoli eyodwa, nge-Clear My Progress ('Sula Inqubekela Phambili Yami') ekhasini lakhe le-Izimpumelelo. Abanye abasebenzisi bagcina eyabo; ukusula idatha yawo wonke umuntu kusala kumphathi"
    en: "Every user can now clear their own RetroAchievements progress for one console, with Clear My Progress on its Achievements page. Other users keep theirs; clearing everyone's data stays with the admin"
  - type: fix
    label: "Umugqa Imidlalo Efanayo ekhasini lomdlalo awusahluleki ukubonakala uma iseva iphendula ngokushesha"
    en: "The Similar Games row on a game page no longer fails to show when the server answers quickly"
  - type: fix
    label: "Iwindi Sesha i-Metadata manje liyanda ukuze lihlale wonke umthombo owuvulile, futhi esikrinini esincane lihlukanisa imithombo libe imigqa elinganayo esikhundleni sokuyicindezela"
    en: "The Search Metadata window now widens to fit every source you have switched on, and on a smaller screen splits the sources into even rows instead of squeezing them"
  - type: feature
    label: "I-MobyGames iyisiphumo esisha se-scrape, ebuzwa yokugcina ngaphambi kwe-AI uma ugcina ukhiye wakho we-API we-MobyGames. Igcwalisa imininingwane engenalutho, ingaphambili nangemuva lebhokisi kanye nama-screenshot, futhi igcina konke ukuskena kwebhokisi langempela, umgogodla, idiski nencwadi yemiyalo yebhokisi le-3D. I-MobyGames ivumela izicelo ezimbalwa ezingamakhulu ngehora; igeyimu eweqiwe lapho ihora liphelile ibuzwa futhi ngokwayo ngemuva kokusetha kabusha. Ikhasi lomdlalo elinemininingwane evela ku-MobyGames lixhuma kulowo mdlalo ku-MobyGames.com"
    en: "MobyGames is a new scrape source, asked last before the AI once you save your own MobyGames API key. It fills empty details, the box front and back and screenshots, and keeps every scan of the real box, spine, disc and manual for the 3D box. MobyGames allows a few hundred requests an hour; a game skipped when the hour runs out is asked about again by itself after the reset"
  - type: feature
    label: "Imidlalo eqoqiwe enekhava manje ithola ngokwayo ibhokisi ye-3D ephendukayo, kukheyisi langempela lekhonsoli nesifunda sayo, elenziwe ngezithombe eziskeniwe zebhokisi, nomgogodla ophrintiwe uma kungekho oskeniwe. Yakha Amabhokisi e-3D ku-Amathuluzi e-ROM yenza lokhu emidlalweni eqoqwe ngaphambili. Ibhokisi elingeniswe ku-Slipcase alishintshwa neze"
    en: "Scraped games with a cover now get a turning 3D box by themselves, on the real case for their console and region, made from the box scans, with a printed spine when none was scanned. Build 3D Boxes in ROM Tools does this for games scraped before. A box imported from Slipcase is never changed"
  - type: feature
    label: "Ibhokisi ye-3D manje iyavuleka. Isivalo sayo sivuleka ehinjini futhi sibonise okungaphakathi, njengasekheyisini langempela: idiski esibambini sayo noma ikhatriji, incwajana yemiyalelo ngaphansi kweziqeshana zayo nangaphakathi kwekhava, kusukela ezithombeni eziskeniwe zebhokisi lomdlalo. Isithombe ngasinye esiskeniwe singabukwa sisodwa. Amakheyisi e-DVD, amakheyisi avulekayo namakheyisi amakhonsoli aphathwayo nawo abonisa imiphetho yawo eyindilinga nomthungo lapho evuleka khona; phinda usebenzise Yakha Amabhokisi e-3D ukuze ubuyekeze amabhokisi akhiwe ngaphambili"
    en: "The 3D box now opens. Its lid swings open on the hinge and shows what is inside, as in the real case: the disc on its hub or the cartridge, the manual under its clips and the inside cover, from the game's box scans. Each scan can also be viewed on its own. Keep cases, clamshells and handheld cases also show their rounded edges and the seam where they open; run Build 3D Boxes again to update boxes built before"
  - type: fix
    label: "Sula ekhasini legeyimu akusasusi izithombe zebhokisi elalethwe ku-Slipcase"
    en: "Clear on the game page no longer deletes the pictures of a box imported from Slipcase"
  - type: fix
    label: "Izilungiselelo > Ama-emulator manje athola i-Azahar, i-emulator ye-3DS: uhlelo lwayo lwe-Windows, i-AppImage yayo ye-Linux ne-Flatpak yayo"
    en: "Settings > Emulators now finds Azahar, the 3DS emulator: its Windows program, its Linux AppImage and its Flatpak"
  - type: fix
    label: "Igeyimu evaleka ngokushesha nje uma iqala manje ihlale ihlanzwa ngemuva, njengokubuyisa ukungena kwe-RetroAchievements i-RetroDB ebikunikeze lokho kuqalisa"
    en: "A game that closes the moment it starts is now always tidied up after, such as taking back the RetroAchievements sign-in RetroDB gave that launch"
  - type: fix
    label: "I-emulator ezenzakalelayo oyikhethele uhlelo manje ihlala iyiyona kuphela ezenzakalelayo uma i-RetroDB yengeza iziphakamiso zayo zama-emulator lapho iqala"
    en: "A default emulator you picked for a system now stays its only default when RetroDB adds its own emulator suggestions at start-up"
  - type: fix
    label: "Uma ukubuyekezwa kwama-shader omdlali kwehluleka, ama-shader obunawo ayagcinwa. Uhlu lwama-core afakiwe alusakwazi ukulahleka phakathi nokulondoloza, futhi uhlu lwama-core oluhluleka ukulandwa luzanywa futhi ngemuva kwemizuzu emihlanu esikhundleni sehora"
    en: "If updating the player's shaders fails, the shaders you had are kept. The list of installed cores can no longer be lost part-way through saving, and a core list that fails to download is tried again after five minutes instead of an hour"
  - type: fix
    label: "Ezinhlelweni ze-Linux ezivikela i-Python yazo, njenge-Debian, i-Ubuntu ne-Fedora, isifaki manje senzela i-RetroDB ifolda yayo ye-Python esikhundleni sokuphoqa izingxenye zayo ku-Python yohlelo, okwakungaphula amathuluzi ohlelo"
    en: "On Linux systems that protect their own Python, such as Debian, Ubuntu and Fedora, the installer now gives RetroDB its own Python folder instead of forcing its parts into the system's Python, which could break system tools"
  - type: security
    label: "Amafayela ezilungiselelo isifaki esiwenzayo, aqukethe amaphasiwedi nokhiye, manje angafundwa i-akhawunti yakho kuphela, hhayi abanye abantu abasebenzisa ikhompyutha efanayo"
    en: "The settings files the installer creates, which hold passwords and keys, can now be read only by your own account, not by other people who use the same computer"
  - type: fix
    label: "Ngemuva kokufaka, isifaki manje sivula i-RetroDB ethekwini esilisebenzisa ngempela, uma nje i-RetroDB isilungile. Ngaphambilini sasihlala sivula itheku 5000 ngemuva kokulinda isikhathi esinqunyiwe, okwakungabonisa ikhasi lephutha"
    en: "After installing, the installer now opens RetroDB on the port it really uses, once RetroDB is ready. Before, it always opened port 5000 after a fixed wait, which could show an error page"
  - type: enhancement
    label: "KuWindows nakuma-macOS, i-RetroDB manje ingakutholela ama-emulator akho ne-RetroArch kokuthi Izilungiselelo > Ama-emulator, ibheka kumafolda ajwayelekile alolo hlelo ngaphandle uma ubhala awakho"
    en: "On Windows and macOS, RetroDB can now find your emulators and RetroArch for you in Settings > Emulators, looking in the usual folders for that system unless you list your own"
  - type: fix
    label: "KuWindows nakuma-macOS, i-RetroDB manje ithola amafolda wezilungiselelo zeDuckStation nePCSX2, ngakho izilungiselelo zomdlalo ngamunye nokuhlola i-BIOS kuyasebenza lapho. KuLinux, ifolda yeDuckStation iyatholakala nalapho i-XDG_CONFIG_HOME isethiwe"
    en: "On Windows and macOS, RetroDB now finds DuckStation's and PCSX2's settings folders, so per-game settings and the BIOS check work there. On Linux, DuckStation's folder is also found when XDG_CONFIG_HOME is set"
  - type: fix
    label: "Ukuguqula idiski ibe yi-CHD akusakwazi ukususa ifayela elingaphandle kwefolda yomdlalo uqobo uma ishidi layo le-.cue noma le-.gdi likhomba lapho"
    en: "Converting a disc to CHD can no longer delete a file outside the game's own folder when its .cue or .gdi sheet points there"
  - type: fix
    label: "Uma idiski iqanjwa kabusha noma iguqulwa, uhlu lwayo lokudlala lwamadiski amaningi (.m3u) lubuyekezwa ngokuphephile: uhlu olungafundeki lushiywa lunjalo esikhundleni sokuthi luthululwe, futhi amagama amadiski anezinhlamvu ezinama-accent avela ezinhlelweni ezindala agcina izinhlamvu zawo"
    en: "When a disc is renamed or converted, its multi-disc playlist (.m3u) is updated safely: a playlist that cannot be read is left alone instead of being emptied, and disc names with accented letters from older systems keep their letters"
  - type: fix
    label: "Ukukhetha i-emulator ezenzakalelayo entsha yohlelo bese ihluleka ukulondolozwa manje kugcina ezenzakalelayo endala, esikhundleni sokushiya uhlelo lungenayo i-emulator ezenzakalelayo"
    en: "Choosing a new default emulator for a system that then fails to save keeps the old default, instead of leaving the system with no default emulator"
  - type: fix
    label: "Uma ikhadi lezithombe liyeka ukuphendula ngesikhathi sokukhulisa isithombe nge-AI, manje i-RetroDB iyalikhulula cishe ngemizuzu emibili bese iqhubeka ikhulisa ngeprosesa. Ngaphambilini, ikhadi lalihlala limatasa kuze kube i-RetroDB iqalwa kabusha"
    en: "If the graphics card stops responding during an AI upscale, RetroDB now lets go of it within about two minutes and carries on upscaling with the processor. Before, the card stayed busy until RetroDB was restarted"
  - type: fix
    label: "Ekuxhumaneni kwe-inthanethi okunensayo, ukulanda kokuqala kwamamodeli e-AI okukhulisa nokususa ingemuva akusanqanyulwa sengathi kumile. Uma ukulanda kokukhulisa kwehluleka, i-RetroDB izama futhi ngemuva kwemizuzu eyi-15, esikhundleni sokushiya ukukhulisa nge-AI kuvaliwe kuze kuqalwe kabusha"
    en: "On a slow internet connection, the first download of the AI upscaling and background-removal models is no longer cut off as if it had stopped. If the upscaling download fails, RetroDB tries again 15 minutes later instead of leaving AI upscaling off until a restart"
  - type: fix
    label: "Isithombe se-Imnyuziyamu esonakele asisenzi ukuthi ukususwa kwengemuva kuyeke ukusebenzisa ikhadi lezithombe kuzo zonke izithombe ezilandelayo"
    en: "A damaged Museum photo no longer makes background removal stop using the graphics card for every photo after it"
  - type: security
    label: "Ngaphambi kokuba isibuyekezo sifakwe, i-RetroDB manje ihlola ukuthi siphethe isiginesha yangempela evela ohlelweni lokukhipha lwe-RetroDB uqobo. Ukulanda okushintshwe noma okushintshaniswe umuntu kuyenqatshwa, ngisho noma nefayela lako le-checksum nalo lishintshanisiwe"
    en: "Before an update installs, RetroDB now checks that it carries a genuine signature from RetroDB's own release process. A download someone has changed or swapped is refused, even if its checksum file was swapped too"
  - type: fix
    label: "Uma isibuyekezo sehluleka futhi i-RetroDB ibuyela enguqulweni obunayo, akukho lutho olulondolozile ngesikhathi ivala olulahlekayo. Ikhophi yomtapo wakho eyibuyiselayo manje ithathwa ngemva kokuba i-RetroDB isimile ngokuphelele, futhi ibuyiselwa kuphela uma inguqulo entsha iqalile. Imitapo yezinhlelo efakwe yisibuyekezo nayo ibuyiselwa ezinguqulweni ezindala"
    en: "If an update fails and RetroDB goes back to the version you had, nothing you saved while it was closing down is lost. The copy of your library it restores is now taken after RetroDB has fully stopped, and is only restored if the new version started. Program libraries the update installed are put back to the old versions too"
  - type: fix
    label: "Amawindi avelayo manje amboza amabha aphezulu naphansi efonini, kanye nebha eseceleni kukhompyutha. Ngaphambili, amabha ayehlala ekhanya phezu kwamawindi afana nohlu lwezihlungi zeLabhulali, ukuskena izindebe, namawindi Emibiko Nezilungiselelo, futhi ayesengacindezelwa"
    en: "Pop-up windows now cover the phone's top and bottom bars, and the sidebar on a computer. Before, the bars stayed bright on top of windows such as the Library's filter lists, the trophy scans and the Reports and Settings windows, and could still be pressed"
  - type: fix
    label: "Amakhadi emidlalo eLabhulali nasekhasini lesistimu awasagqithi ekhadini elingezansi uma uhlu lubonisa amakholomu amabili noma ngaphezulu. Ikhadi elikhule ngemva kokubekwa, njengelinezithonjana zokulinganisa ezehlele emugqeni wesibili, lalivame ukumboza ingaphezulu lekhadi elilandelayo"
    en: "Game cards in the Library and on a system's page no longer run over the card below them when the list shows two or more columns. A card that grew after it was placed, such as one whose rating icons wrapped onto a second row, used to cover the top of the next card"
  - type: fix
    label: Umlayezo obonakala ngenkathi iwindi livuliwe, njengokuthi "Lo mdlalo usuvele ukuhlu Lwezifiso zakho", manje ubonakala phezu kwewindi. Ngaphambili wawufihleka ngemuva kwangemuva okumnyama, ngakho ukucindezela inkinobho efana nethi Engeza ku-Uhlu Lwezifiso kwakubonakala sengathi akwenzeki lutho
    en: A message shown while a window is open, such as "This game is already on your wishlist", now shows on top of the window. Before, it hid behind the dark backdrop, so pressing a button like Add to Wishlist seemed to do nothing
  - type: fix
    label: Isixhumanisi se-ROM Tools endlebeni eseceleni manje siyakhanya kuzo zonke izinhla ze-ROM Tools. Regional Versions, Bulk AI Fill, MAME Names, Fix Box and Manual Regions kanye ne-HLTB Pending Review zazisishiya simnyama
    en: The ROM Tools link in the sidebar now lights up on every ROM Tools page. Regional Versions, Bulk AI Fill, MAME Names, Fix Box and Manual Regions and HLTB Pending Review left it dark
  - type: fix
    label: I-Lungisa Izifunda Zebhokisi Nencwadi Yokusebenzisa kanye ne-Ukubuyekeza kwe-HLTB Okulindile manje kubonisa umugqa wamathebhu e-Amathuluzi e-ROM phezulu, njengamanye amathuluzi, ukuze ukwazi ukusuka kuthuluzi elilodwa uye kwelinye. I-Lungisa Izifunda Zebhokisi Nencwadi Yokusebenzisa inethebhu yayo ekhasini lethuluzi ngalinye
    en: Fix Box and Manual Regions and HLTB Pending Review now show the row of ROM Tools tabs at the top, like the other tools, so you can go from one tool to the next. Fix Box and Manual Regions has a tab of its own on every tool page
  - type: fix
    label: Izinkinobho nemilayezo ebivela ngesiNgisi noma ngabe ulimi lwakho luyini manje ivela ngolimi lwakho, kuzo zonke izilimi ezifakwe yi-RetroDB. Eminye yayingenakho ukuhunyushwa, eminye ibonisa umbhalo ongalungile, njengokuthi Create Backup ifundeka ngokuthi "buyisela i-Backup"esiJalimani
    en: Buttons and messages that showed in English whatever your language now show in it, in every language RetroDB offers. Some had no translation, and some showed a wrong one, such as Create Backup reading as "restore backup" in German
  - type: enhancement
    label: Abaphathi nabahleli bangakhetha izilimi abazifundayo ngaphansi kwe-Izilungiselelo > I-akhawunti > Izilimi engizifundayo. Uma umdlalo ungenayo isithombe sebhokisi noma igama lesifunda sawo, RetroDB ikhetha olulimini lapho umuntu a-Scrapha esiwufunda khona. Noma ubani ongakhethi lutho kubalwa njengofunda ulimi lwesikrini sakhe
    en: Admins and editors can tick the languages they read, under Settings > Account > Languages I can read. When a game has no box picture or name from its own region, RetroDB picks one in a language someone who scrapes can read. Anyone who ticks none counts as reading their screen language
  - type: fix
    label: Ikhophi yase-Europe ayisathole isithombe sebhokisi noma igama lesi-German, isiFrench, isiSpanish noma isiItalian ngoba nje ScreenScraper ayinalo elijwayelekile le-Europe. Ithola elase-UK, noma elivelaohlwini lwezifunda zakho njenge-World noma i-USA, ngaphandle uma umuntu a-Scrapha efunda lolo limi. Lungisa Izifunda Zebhokisi Nencwadi Yokusebenzisa ibheka kabusha amabhokisi nama-Incwadi Yokusebenzisa ayiwashintshele olimini lapho kungafundi muntu
    en: A Europe copy no longer gets a German, French, Spanish or Italian box picture or name just because ScreenScraper has no general Europe one. It gets the UK one, or one from your region list such as World or USA, unless someone who scrapes reads that language. Fix Box and Manual Regions looks again at the boxes and manuals it swapped into a language nobody reads
  - type: enhancement
    label: Lungisa Izifunda Zebhokisi Nencwadi Yokusebenzisa inekhasi layo, elivulwa kukhadi layo le-ROM Tools. Uhlu lwayo lwe-Okushintshile lubonisa wonke umdlalo lesi sixazululo esiwushintshele ibhokisi, ibhokisi le-3D noma Incwadi Yokusebenzisa, lihlelwe nge-console, nebhokisi njengoba injalo manje nesifunda sefayela ngalinye elisha, ukuze uhlole. Imidlalo esivele ilungisiwe ngaphambi kwalolu hlelo olusha nayo iyabalwa
    en: Fix Box and Manual Regions has its own page, opened from its ROM Tools card. Its What changed list shows every game the fix swapped a box, 3D box or manual for, grouped by console, with the box as it is now and the region each new file came from, so you can check them. Games already fixed before this update are listed too
  - type: enhancement
    label: Lungisa Izifunda Zebhokisi Nencwadi Yokusebenzisa ingamiswa isikhashana, iqhubeke futhi imiswe ngezinkinobho ekhasini layo. Ngaphambili, kwakukhona indlela eyodwa kuphela yokuyimisa, ukucindezela ikhadi layo futhi, okungazange kubhalwe esikrinini
    en: Fix Box and Manual Regions can be paused, resumed and stopped with buttons on its page. Before, the only way to stop it was to press its card again, which nothing on screen said
  - type: enhancement
    label: Lungisa Izifunda Zebhokisi Nencwadi Yokusebenzisa ibonisa ibha yenqubekelaphambili eduze kwezinkinobho zayo ngenkathi isebenza. Uhlu lwayo lwe-Okushintshile lukhumbula ama-console owavale, ngakho ahlala evaliwe ngesikhathi esilandelayo uvula ikhasi kule browser
    en: Fix Box and Manual Regions shows a progress bar beside its buttons while it runs. Its What changed list remembers which consoles you closed, so they stay closed the next time you open the page in this browser
  - type: enhancement
    label: Ngenkathi Lungisa Izifunda Zebhokisi Nencwadi Yokusebenzisa isebenza, umdlalo ngamunye oshintshayo uhlanganyela noma ngempelaohlwini lwayo lwe-Okushintshile, ngaphansi kwe-console yawo. Ngaphambili, bekufanele uvule kabusha ikhasi ukuze uwabone
    en: While Fix Box and Manual Regions runs, each game it swaps joins its What changed list straight away, under its console. Before, you had to reload the page to see them
  - type: fix
    label: Ibha yenqubekelaphambili engakaqali ayisabonisi uphawu "%" lodwa ekugcineni kwayo kwesobunxele
    en: A progress bar that has not started yet no longer shows a lone "%" at its left end
  - type: fix
    label: Amalogo e-Wii U, PlayStation Vita, Xbox ne-Xbox One ekhasini lama-Izistimu manje agcwalisa isikhala sawo njengamanye. Ilogo ye-PlayStation Vita ne-ONE ku-Xbox One manje abamhlophe, ukuze zifundeke kuzo zonke izitimu
    en: The Wii U, PlayStation Vita, Xbox and Xbox One logos on the Systems page fill their space like the others. The PlayStation Vita logo and the ONE in Xbox One are now white, so they can be read on every theme
  - type: enhancement
    label: I-Xbox Series X|S, engezwa ukungenisa kwe-Xbox, inelogo yayo, futhi iwindi elivulwa inkinobho yayo ye-ℹ️ libonisa isithombe sama-console. Inalo negama layo eliphelele, Microsoft Xbox Series X|S, nezincazelo zayo
    en: Xbox Series X|S, which the Xbox import adds, has its own logo, and the window its ℹ️ button opens shows a picture of the consoles. It also has its full name, Microsoft Xbox Series X|S, and its specifications
  - type: fix
    label: Isistimu engezwa ukungenisa kwe-Steam, Xbox, PSN noma CLZ manje ithola ilogo yayo, uhlobo lwayo negama layo eliphelele lapho RetroDB ilazi khona. Izistimu ezengezwe kanjalo ngaphambili ziyakuthola uma RetroDB ivuselelwa
    en: A system the Steam, Xbox, PSN or CLZ import adds now gets its logo, its type and its full name where RetroDB knows one. Systems added that way before get them when RetroDB updates
  - type: enhancement
    label: Lungisa Izifunda Zebhokisi Nencwadi Yokusebenzisa ibuza ScreenScraper ngomdlalo ngamunye kanye kuphela. Ngaphambili, ukusebenza ngakunye kwakuqala kumdlalo wokuqala futhi kubuze ngawo wonke, ngisho nalawo esevele ewahlolile. Imidlalo eshaphiwe ngemva kokusebenza kwayo kokuqala isinamabhokisi alungile, ngakho iyayeqa ingabuzi
    en: Fix Box and Manual Regions asks ScreenScraper about each game only once. Before, every run started again at the first game and asked about every one, even games it had already checked. Games scraped after its first run already have the right boxes, so it skips them without asking
  - type: fix
    label: Amakhasi amathuluzi e-ROM ahlola noma aguqula (Screenshot Dedup, Screenshot Review, Duplicate Finder, CHD Converter ne-CHD Verify) agcina ukusebenza kwawo kokugcina uma ushiya ikhasi uphinde ubuye. Ukuhlola okusebenzayo kuqhubeka kubonisa inqubekelaphambili yako, nokuqediwe kubonisa imiphumela yako futhi, imizuzu engu-30 ngemva kokuphela. Ngaphambili, ikhasi belibuya lize
    en: The ROM tool pages that scan or convert (Screenshot Dedup, Screenshot Review, Duplicate Finder, CHD Converter and CHD Verify) keep their last run when you leave the page and come back. A running scan carries on showing its progress, and a finished one shows its results again, for 30 minutes after it ends. Before, the page came back empty
  - type: fix
    label: Amakhasi osizo ahunyushiwe abiza inkinobho, ithebhu nekhasi ngalinye ngegama iapp elibonisa ngalo kuleyo limi, futhi aphinde imiyalezo njengoba iapp iyibonisa. Isigaba se-Bulk AI Fill asisaqambi ikhadi iapp engenalo. Inkinobho ye-Background manje ifundeka kahle ngesi-Italian, isi-Korean nesi-Chinese, futhi amalebula athile esi-Zulu awasaqali nge-"N:" engafanele
    en: Translated help pages call every button, tab and page by the name the app shows in that language, and quote its messages as the app shows them. The Bulk AI Fill section no longer names a card the app does not have. The Background button now reads correctly in Italian, Korean and Chinese, and some Zulu labels no longer start with a stray "N:"
  - type: feature
    label: 'Imidlalo ye-arcade ene-RetroAchievements manje iyazitholela. Iqala ku-RetroArch (RetroDB) nge-core ye-FinalBurn Neo, esekelwa yi-RetroAchievements, esikhundleni se-MAME engayisekeli; yonke eminye imidlalo ye-arcade ihlala ku-MAME. Iphakheji entsha yama-cheat e-arcade ye-FinalBurn Neo ngaphansi kwe-Izilungiselelo → Ama-emulator → Ama-cheat ibala ama-cheat omdlalo ngamunye ekhasini lawo. FinalBurn Neo ivala ama-cheat njalo uma umdlalo uqala, ngakho uwavula kumenyu ye-RetroArch ngenkathi udlala: F1, bese Core Options, bese Cheat'
    en: 'Arcade games with RetroAchievements now earn them. They start in RetroArch (RetroDB) with the FinalBurn Neo core, which RetroAchievements supports, instead of MAME, which it does not; every other arcade game stays in MAME. A new FinalBurn Neo arcade cheats pack under Settings → Emulators → Cheats lists each such game''s cheats on its page. FinalBurn Neo turns cheats off each time a game starts, so you switch them on in RetroArch''s menu while you play: F1, then Core Options, then Cheat'
  - type: performance
    label: 'Izilungiselelo ziyavuleka ngokushesha kubaphathi. Azisahlola ilogo nesithombe sehardware sesistimu ngayinye lapho zivuleka: leyo thebula igcwala uma uvula ithebhu ye-Customization. Londoloza ecindezelwe ngokushesha ngemva kokuvula ayisalindi lezo zihlolo'
    en: 'Settings opens faster for admins. It no longer checks every system''s logo and hardware picture as it opens: that table fills when you open the Customization tab. A Save pressed straight after opening no longer waits behind those checks'
  - type: enhancement
    label: 'Izilungiselelo zihlelekile kangcono. Okuthandayo kwakho kuhlangene ngaphansi kwe-Izilungiselelo → I-akhawunti: Itimu nolimi (nesingemuva esihambayo), nokuthi imiyalezo ihlala isikhathi esingakanani esikrinini, manje okungokwomuntu ngamunye. Umtapo → Paths ubamba zonke izinhlobo ezine zamafolda ngaphansi kwe-Londoloza eyodwa. Isistimu → Server ibonisa i-port nalapho kukhona idathabheyisi. Support Development ihambele ekupheleni kwekhasi le-Help'
    en: 'Settings is tidier. Your own choices sit together under Settings → Account: Theme and Language (with the moving background), and how long messages stay on screen, which is now each person''s own. Library → Paths holds all four folders under one Save. System → Server shows the port and where the database is. Support Development moved to the end of the Help page'
  - type: enhancement
    label: 'Izilawuli zinekhasi lazo. Izilungiselelo → Customization → Open Controllers lisha lapho: setha izilawuli ezizenzakalelayo zesistimu ngayinye, engeza ezakho futhi uhlele umtapo wezilawuli'
    en: 'Controllers have their own page. Settings → Customization → Open Controllers goes there: set each system''s default controllers, add your own and edit the controller library'
  - type: enhancement
    label: 'Bulk Scrape Match Filtering inikeza ukukhetha okuthathu okulula esikhundleni senombolo yesikolo netafula layo: Strict, Normal ne-Loose. I-Normal iyisijwayelekile sakudala. Isilungiselelo osenze wena ngaphambili sibonakala njenge-Custom uze ukhethe esinye'
    en: 'Bulk Scrape Match Filtering offers three plain choices instead of a score number and its table: Strict, Normal and Loose. Normal is the old default. A setting you made yourself before shows as Custom until you pick another'
  - type: enhancement
    label: My Profile inenkinobho eyodwa ethi Save My Profile esikhundleni sezintathu. Ihlola isiqalo se-PlayStation esisha noma ukhiye we-Xbox ngenkathi iloondoloza, futhi igcina isiqalo sakho se-PlayStation esisebenzayo uma i-Sony inqaba esisha. Change Password manje ithi idinga okungenani izinhlamvu eziyi-12 futhi icela iphasiwedi entsha kabili
    en: My Profile has one Save My Profile button instead of three. It checks a new PlayStation token or Xbox key as it saves, and keeps your working PlayStation token if Sony refuses the new one. Change Password now says it needs at least 12 characters and asks for the new password twice
  - type: fix
    label: Amagama alula kuma-Izilungiselelo. My Profile ichaza ukuthi ukhiye we-RetroAchievements nokungena ngephasiwedi ngalinye lenzani. API Keys ithi ukhiye womuntu siqu we-RetroAchievements noma we-Steam usetshenziswa kuqala. Okhiye be-TheGamesDB bebizwa ngokuthi Main key ne-Backup key. Iwindi le-Hlela i-emulator lithi Program location ne-Command-line options. Clear Scraped Data ithi amafayela ezithombe neevidiyo ahlala kudiski ngaphandle uma ubeka uphawu. Izinhlu zamamodeli e-AI azisabonisi amanani, ayesephelelwe isikhathi
    en: Plainer words in Settings. My Profile says what the RetroAchievements key and the password sign-in each do. API Keys says a person's own RetroAchievements or Steam key is used first. TheGamesDB's keys are named Main key and Backup key. The Edit emulator window says Program location and Command-line options. Clear Scraped Data says the picture and video files stay on disk unless you tick the box. The AI model lists no longer show prices, which went out of date
  - type: fix
    label: 'Izilungiselelo zisusa okwakukhona kabili noma okungenzi lutho: ikhadi le-Library Statistics (i-Dashboard linalo), ikhophi yezilungiselelo ye-Scan Trophies (ikhasi lama-trophy e-PS3 linayo), inkinobho ehlukile ye-Import System Logos (Refresh System Logos manje ikopisha amalogo e-ES-DE kuqala) nezilungiselelo eziyisithupha ezigcinwe ezingasetshenziswa. Isikhathi somlayezo esingu-0 amasekhondi siyenqatshwa esikhundleni sokulondolozwa buthule, futhi ukulondoloza ifolda entsha ye-ROM akusasho ukuthi RetroDB kufanele iqale kabusha'
    en: 'Settings drops what was there twice or did nothing: the Library Statistics card (the Dashboard has it), the Settings copy of Scan Trophies (the PS3 trophies page has it), the separate Import System Logos button (Refresh System Logos now copies ES-DE''s logos first) and six stored settings nothing used. A message time of 0 seconds is refused instead of quietly saved, and saving a new ROM folder no longer says RetroDB must restart'
  - type: performance
    label: RetroDB manje ilula kakhulu kukhompyutha yakho. Inkungu ehambayo yetimu ye-Cyberpunk yayigcina i-core eyodwa yeprosesa isebenza ngokugcwele inqobo nje uma noma yiliphi ikhasi le-RetroDB livuliwe; manje ikhadi lezithombe liyidwebe, futhi iprosesa icishe ingazizwa. Idweba nesigamu samafreyimu, okubukeka kunjalo ngoba inkungu ihamba kancane
    en: RetroDB is far lighter on your computer. The Cyberpunk theme's moving mist kept one processor core fully busy for as long as any RetroDB page was open; the graphics card now draws it, and the processor barely notices. It also draws half as many frames, which looks the same because the mist drifts slowly
  - type: feature
    label: 'Izingemuva ezihambayo (inkungu, imvula, izinkanyezi, uthuli) manje ziyama umaungasebenzisi RetroDB: lapho iwindi layo lingekho phambili, ithebhu yayo ifihliwe, noma kudlule iminithi ngaphandle kokusebenzisa imawusi noma ikhibhodi. Ziqala futhi ngokushesha uma ubuya. Iswishi entsha ye-Isingemuva esihambayo ngaphansi kwe-Izilungiselelo → I-akhawunti → Itimu nolimi ibagcina bemile kuleyo khompyutha'
    en: 'Moving backgrounds (mist, rain, stars, dust) now pause when you are not using RetroDB: when its window is not in front, its tab is hidden, or a minute passes without the mouse or keyboard. They start again the moment you come back. A new Moving background switch under Settings → Account → Theme and Language keeps them still on that computer'
  - type: performance
    label: Amathayitela amakhasi agcina ukukhanya kwawo kodwa awasagquma njalo, futhi amathayitela "glitch" ayakhazimula ohlwini lwama-console nemidlalo kuphela uma imawusi iphezu kwawo
    en: Page titles keep their glow but no longer pulse all the time, and the flickering "glitch" titles on the console and game lists flicker only while the mouse is over them
  - type: feature
    label: 'Ama-cheat emidlalo ye-arcade ku-MAME. Dawuniloda i-"MAME XML Cheats Collection" ku-mamecheat.co.uk kubhrawusa yakho bese uyingenisa ngaphansi kwe-Izilungiselelo → Ama-emulator → Ama-cheat. Ikhasi lomdlalo ngamunye we-arcade libe selibala ama-cheat awo ngeziswishi zokuvula/zokuvala, futhi MAME iqala ngalawo owavulile. I-cheat edinga inani isethwa ku-MAME ngenkathi udlala: cindezela Tab, bese Plugin Options, bese Cheat'
    en: 'Cheats for arcade games in MAME. Download the "MAME XML Cheats Collection" from mamecheat.co.uk in your browser and import it under Settings → Emulators → Cheats. Each arcade game''s page then lists its cheats with on/off switches, and MAME starts with the ones you switched on. A cheat that takes a value is set in MAME while you play: press Tab, then Plugin Options, then Cheat'
  - type: fix
    label: Okwangaphambilini nokulandelayo ekhasini lomdlalo manje kuhlalaohlwini lwakho olusefiwe ngemva kokuba usi-Scraphe lowo mdlalo. Ngesihlungi se-Unscraped sivuliwe, ukuscrapha umdlalo bekuwususa ohlwini, ngakho Okulandelayo bekuhamba kulo lonke i-console esikhundleni sokuya komdlalo olandelayo ongashaphiwe
    en: Previous and Next on a game's page now stay in your filtered list after you scrape that game. With the Unscraped filter on, scraping a game took it out of the list, so Next stepped through the whole console instead of going to the next unscraped game
  - type: fix
    label: 'Okuningi kwe-RetroDB manje kulandela ulimi lwakho: izingxenye ze-Bonus Discs, Backup ne-ROM Naming ze-Izilungiselelo, isihloko se-My Profile, iwindi lokusesha le-scrape nemiyalezo ethi "akukho mvume". Bekuhlala kungesiNgisi noma ukhetheluphi ulimi'
    en: 'More of RetroDB now follows your language: the Bonus Discs, Backup and ROM Naming parts of Settings, the My Profile heading, the scrape search window and the "no permission" messages. They stayed in English whatever language you chose'
  - type: fix
    label: Add User manje icela iphasiwedi yokuqala yomuntu omusha (izinhlamvu ezingu-12 noma ngaphezulu), futhi bazikhethela eyabo ngesikhathi bengena okokuqala. Ngaphambili, i-akhawunti ngayinye entsha yayithola iphasiwedi efanayo "changeme", ebingasetshenziswa yinoma ubani kuze kungene umnikazi wayo
    en: Add User now asks for the new person's first password (12 characters or more), and they choose their own the first time they sign in. Before, every new account quietly got the same password, "changeme", which anyone could use until its owner signed in
  - type: fix
    label: Izilungiselelo zibonisa umuntu ngamunye kuphela lokho indima yakhe engakushintsha. Ababukeli nabadlali babona ithebhu ye-I-akhawunti; abahleli babona ne-Bonus Discs ne-Izilawuli. Ngaphambili babebona izilungiselelo zomphathi ezinkinobho yazo ye-Londoloza yayenqatshwa, ezinye zibonisa amanani angalungile
    en: Settings shows each person only what their role can change. Viewers and players see the Account tab; editors also see Bonus Discs and Controllers. They used to see admin settings whose Save button was then refused, some showing wrong values
  - type: fix
    label: Izilungiselelo → Isistimu azisenayo inkinobho ethi Clear Stuck RA Sync. Bekuthi isisuse i-sync noma ingayisusanga; misa i-sync ye-RetroAchievements ngezinkinobho esaziso senqubekelaphambili yayo
    en: Settings → System no longer has the Clear Stuck RA Sync button. It said it had cleared the sync even when it had not; stop a RetroAchievements sync with the buttons on its progress notice
  - type: fix
    label: 'Izilungiso ezincane ze-Izilungiselelo: Reset to Defaultohlwini lwe-scraper ithi cindezela Save Scraper Settings ukuyigcina; ukufakwa okusha kubonisa ScreenScraper ivuliwe, njengoba injalo; usizo lwe-Steam ID lucela inombolo yezinhlamvu eziyi-17; ikhasi lama-Ama-emulator alisakhulumi ngenkinobho ethi Add engekho; I-Setup Wizard ifihla okhiye bakho be-API njengoba ubaloba'
    en: 'Small Settings fixes: Reset to Default on the scraper list says to press Save Scraper Settings to keep it; a new install shows ScreenScraper switched on, as it really is; the Steam ID help asks for the 17-digit number; the Emulators page no longer mentions an Add button it does not have; the Setup Wizard hides your API keys as you type them'
  - type: enhancement
    label: Incwadi yosizo manje inebhokisi lokusesha. Thayipha igama ukuze ubone izingxenye zencwadi ezilishoyo kuphela, igama lihlanzwe. Ayinaki ama-accent futhi isebenza kuzo zonke izilimi
    en: The help manual now has a search box. Type a word to see only the parts of the manual that mention it, with the word marked. It ignores accents and works in every language
  - type: fix
    label: 'Isigaba se-Troubleshooting sencwadi yosizo manje sihlanganisa isici ngasinye: ukwengeza imidlalo, ukuscrapha, Ukugcwalisa nge-AI, izithombe, ukudlala, ama-cheat, izimpumelelo, ama-akhawunti, ama-Backup nezibuyekezo. Ezinye zeziluleko zaso zakudala zazikhomba izinkinobho ezingasekho. Futhi asisathi ukusesha kwe-HowLongToBeat kusebenza ngaphandle kwe-inthanethi noma ukuthi isivinini se-scraper singasethwa'
    en: 'The help manual''s Troubleshooting section now covers each feature: adding games, scraping, AI Fill, pictures, playing, cheats, achievements, accounts, backups and updates. Some of its old advice pointed at buttons that no longer exist. It also no longer says HowLongToBeat lookups work offline or that scraper speed can be set'
  - type: fix
    label: Izilungiselelo → Isistimu azisenayo ibhokisi le-Bulk Scrape troubleshooting. Belifunda izinsalela ze-bulk scrape endala futhi lingakwazi ukumisa eyiqiniso; misa i-bulk scrape ngo-Khansela ewindini layo
    en: Settings → System no longer has the Bulk Scrape troubleshooting box. It read leftovers of the old bulk scrape and could not stop a real one; stop a bulk scrape with Cancel in its window
  - type: fix
    label: Isifaki manje sicela i-Python 3.12 noma entsha, edingwa yimitapo ye-RetroDB. Beyidlulisa izinguqulo ezindala, bese ukufaka kwehluleka phakathi. I-README inesigaba esisha se-Troubleshooting sezinkinga zokufaka nokuqala
    en: The installer now asks for Python 3.12 or newer, which RetroDB's libraries need. It let older versions through, and the install then failed partway. The README has a new Troubleshooting section for install and start-up problems
  - type: fix
    label: Ithebhu ye-PSN ye-Game Imports manje ithi isiqalo se-NPSSO sifakwa ngaphansi kwe-Izilungiselelo → My Profile. Bekuqamba ikhasi le-API Keys elingenalo ibhokisi elinjalo
    en: Game Imports' PSN tab now says the NPSSO token goes under Settings → My Profile. It named an API Keys page that has no such box
  - type: fix
    label: Incwadi yosizo manje ibala isilinganiso seminyaka saseChina (CADPA) nezinye, ibiza ingxenye ye-Continue Playing yekhasi lokuqala ngegama layo langempela, futhi inikeza iseluleko esiphephile uma izithombe zingalondolozeki
    en: The help manual now lists the Chinese age rating (CADPA) with the others, calls the home page's Continue Playing section by its real name, and gives safer advice when pictures will not save
  - type: fix
    label: 'Izilungiselelo → Scraping manje zilandela ulimi lwakho: uhlu lwe-scraper, okhiye be-API, izindlela ze-ES-DE, ukuhlunga okufanayo nezilungiselelo ze-AI, nemiyalezo yazo yesimo nemiphumela. Bekuhlala kungesiNgisi noma ukhethe luphi ulimi'
    en: 'Settings → Scraping now follows your language: the scraper list, API keys, ES-DE paths, match filtering and AI settings, with their status and result messages. It stayed in English whatever language you chose'
  - type: enhancement
    label: Uma isevisi ye-AI inqaba i-scrape (ukhiye we-API ongalungile, akukho credit noma i-billing esele, noma izicelo eziningi kakhulu), RetroDB manje ithi iyiphi, nokuthi uhlole ini, esikhundleni sokushiya ngokuthula izinsimu ezinjengamanani ezintengo yokuthengisa nezinsuku zokukhululwa zingenalutho. Bese iyayeka ukubuza loyo AI isikhashana, ukuze utshelwe kanye, hhayi kanye ngomdlalo ngamunye
    en: When the AI service refuses a scrape (a wrong API key, no credit or billing left, or too many requests), RetroDB now says which, and what to check, instead of quietly leaving fields such as sales figures and release dates empty. It then stops asking that AI for a while, so you are told once, not once per game
  - type: enhancement
    label: 'Ibhokisi le-3D manje libonisa isikhala somunwe njengoba Slipcase yasenza: ngemiphetho ethe tye, futhi ngenhla noma ngaphansi kwenkabazwe yohlangothi, lapho ikesi linalo kanjalo. Ngenisa ibhokisi futhi ukuze ubone'
    en: 'The 3D box now shows the finger slot as Slipcase made it: with square ends, and above or below the middle of the side, where the case has it so. Import the box again to see it'
  - type: fix
    label: 'Izilungiselelo → Isistimu manje ilandela ulimi lwakho: amathuluzi okugcinwa, izilungiselelo zokubhala imininingwane yomsebenzi nezigaba zokuxazulula izinkinga, kanye nemiphumela nemiyalezo yamaphutha. Bezihlala ngesiNgisi noma ngabe ukhethe luphi ulimi. Eminye imiyalezo esalayo yesiNgisi emakhasini angaphandle nayo manje ihunyushiwe'
    en: 'Settings → System now follows your language: the maintenance tools, logging settings and troubleshooting sections, with their results and error messages. They stayed in English whatever language you chose. Leftover English messages on other pages are translated too'
  - type: fix
    label: Ekhasini le-console ye-Izimpumelelo, umugqa wamabhathani e-console awusashelelela ngaphansi kwamathebhu ezigaba uma uskrola; manje uyaskrola uphume. Kuwo wonke amakhasi e-Izimpumelelo, ibha yezinhlamvu ze-A–Z manje ihlala ngaphansi kwamathebhu ezigaba esikhundleni sokufihlwa ngemuva kwawo
    en: On an Achievements console page, the row of console buttons no longer slides under the section tabs as you scroll; it now scrolls away. On every Achievements page the A–Z letter bar now stays just below the section tabs instead of hiding behind them
  - type: fix
    label: Ukususa isithombe kwindawo ethi Hlela Umdlalo akusasusi ifayela uma omunye umdlalo usebenzisa isithombe esifanayo; omunye umdlalo uyasigcina
    en: Removing a picture in the Edit Game window no longer deletes the file when another game uses the same picture; the other game keeps it
  - type: fix
    label: Izithombe zangemuva kwebhokisi ezigcinwa zincane yi-Scrapha manje ziyakhushulwa ngemuva, njengoba kwenziwa ngezikhava zangaphambili
    en: Back-of-box pictures that a scrape saves small are now enlarged in the background, as front covers already are
  - type: fix
    label: Ukulondoloza ewindini elithi Hlela Umdlalo akusalindi ngenkathi imifanekiso emincane yebhokisi noma Imifanekiso-skrini ethunyelwe ikhushulwa; lokho manje kwenzeka kamuva, kuboniswe ngokuthi "Ukuthuthukisa izithombe". Isithombe esisaziwe ukuthi sisuswe siyasuswa kuphela uma ukulondoloza kuphumelele, ngakho ukulondoloza okwehlulekile akusalahlisi isithombe
    en: Saving in the Edit Game window no longer waits while small uploaded box art or screenshots are enlarged; that now happens afterwards, shown as "Improving images". A picture ticked for removal is deleted only once the save has worked, so a failed save no longer loses it
  - type: fix
    label: Isibalo se-"metadata engekho" phezulu emakhasini Omtapo ne-console manje sibala umdlalo onezinguqulo eziningi zezifunda kanye kuphela, njengesihlungi esithi Ongenasikhulumi. Besibala inguqulo ngayinye
    en: The "missing metadata" count at the top of the Library and console pages now counts a game with several regional versions once, as the Unscraped filter does. It counted each version
  - type: enhancement
    label: Izilungiselelo → Amadiski Ebhonasi manje abala wonke amadiski amakwe njengebhonasi, nomdlalo wawo. Inkinobho yawo ethi "Akusona isiki sebhonasi" (abahleli nabaphathi) ibuyisela idiski ekhelwe iphutha ohlwini lwemidlalo yakho, futhi i-Auto-Link manje iyayeka ukuyithinta
    en: Settings → Bonus Discs now lists every disc marked as a bonus disc, with the game it belongs to. Its "Not a bonus disc" button (editors and admins) puts a wrongly marked disc back in your game lists, and Auto-Link then leaves it alone
  - type: fix
    label: Amagama ezinkampani afana no-"Nintendo Co., Ltd." no-"GameTek, Inc." manje ahlala ephelele. Bekuhlukaniswa ekhomeni, ngakho u-"Ltd." no-"Inc." bebevela njengamagama ahlukile ezihlungini Zomtapo, Izilungiselelo → Ukulinganisa Idatha nakwi-Stats. Amakhasi emidlalo nawo.awabonisa aphelele. Igama elinekhoma ngaphakathi kwabakaki, njengo-"Majesco (licensed from Konami, Disney)", nalo lihlala liphelele
    en: Company names such as "Nintendo Co., Ltd." and "GameTek, Inc." now stay whole. They were split at the comma, so "Ltd." and "Inc." showed as names of their own in the Library filters, Settings → Data Normalization and Stats. Game pages show them whole too. A name with a comma inside brackets, such as "Majesco (licensed from Konami, Disney)", stays whole as well
  - type: enhancement
    label: 'Izilungiselelo → Ukulinganisa Idatha manje ingahlanganisa amagama ahlukene enkampani eyodwa. Ngaphansi kuka-Umshicileli no-Umqambi, "Amagama angaba yinkampani eyodwa" ukhombisa afana kakhulu njengo-"Eidos" no-"Eidos Interactive". Akukho okuhlanganiswa ngokuzenzakalelayo, ngoba afana kakhulu angaba yizinkampani ezihlukile: khetha igama ozoligcina, maka amagama ayinkampani eyodwa bese ucindezela Hlanganisa. Amagama ayashintsha kuwo wonke umdlalo, futhi ama-Scrapha alandelayo asebenzisa igama ogcine lona'
    en: 'Settings → Data Normalization can now merge one company''s different names. Under Publisher and Developer, "Names that may be one company" lists look-alikes such as "Eidos" and "Eidos Interactive". Nothing is merged for you, because look-alikes can be different companies: pick the name to keep, tick the names that are the same company and press Merge. The names change on every game, and later scrapes use the kept name'
  - type: enhancement
    label: Izilungiselelo → Ukulinganisa Idatha manje inamabhathani e-Franchise, Umshicileli no-Umqambi. Ngalinye likhombisa amagama abhalwe ngezinhlamvu ezinkulu ezihlukile, njengo-"Doom" no-"DOOM", nokuthi yimidlalo emingaki esebenzisa ukubhala ngakunye, nelisetshenziswa kakhulu likhethiwe. Khetha elilodwa bese ucindezela Faka ukuze libe igama linye. Igama elisha le-Scrapha elehluka ngezinhlamvu ezinkulu kuphela lisebenzisa ukubhala komtapo wakho, futhi Ukugcwalisa nge-AI kucela izinhlamvu ezinkulu ezisemthethweni
    en: Settings → Data Normalization now has Franchise, Publisher and Developer buttons. Each lists the names spelled with different capitals, such as "Doom" and "DOOM", with how many games use each spelling and the most-used one picked. Choose one and press Apply to make them one name. A newly scraped name that differs only in capitals takes your library's spelling, and AI Fill asks for official capitals
  - type: fix
    label: Izihlungi Zomtapo manje zifanisa amanani aphelele. Ukukhetha uhlobo "Action" akusabonisi nemidlalo ethi "Action-Adventure", ngakho umphumela uyafana nesibalo eseceleni kwawo. Uhlu lwamathegi ekhasi lomdlalo kanye ne-Similar Games lufanisa ngendlela efanayo
    en: The Library's filters now match whole values. Choosing the genre "Action" no longer also shows "Action-Adventure" games, so the result matches the count beside it. A game page's tag lists and Similar Games match the same way
  - type: security
    label: Izilungiselelo → Iphrofayili Yami akusathumeli ukhiye wakhoogciniwe we-RetroAchievements, i-token ye-PSN noma ukhiye we-Steam ekhasini. Ibhokisi ngalinye likhombisa izinhlamvu zalo ezine zokugcina kuphela, njengoba okhiye beThebhu Yokuscrapha sebevele benza. Ukulondoloza ngaphandle kokubhala kabusha kugcina ukhiye ogciniwe
    en: Settings → My Profile no longer sends your saved RetroAchievements key, PSN token or Steam key to the page. Each box shows only its last four characters, as the Scraping tab's keys already did. Saving without retyping keeps the saved key
  - type: fix
    label: I-Log Viewer akusavuli ngokuthi "Ifayela lenkomba-msebenzi alivumelekile". Bekubhala amalogi esiza angeke ewabonise, futhi kuvulwa elinye kuqala; manje ibhala kuphela amalogi engawavula
    en: The Log Viewer no longer opens on "Invalid log file". It listed helper logs it would not show, and opened one of them first; it now lists only logs it can open
  - type: fix
    label: Ithebhu ye-PSN ye-Game Imports manje ikuyisa ku-Izilungiselelo → Iphrofayili Yami ukuze uthole i-token ye-NPSSO, lapho ibhokisi likhona, esikhundleni sika-Izilungiselelo → Okhiye be-API, futhi isimo salo sokuxhumeka singahunyushwa
    en: Game Imports' PSN tab now sends you to Settings → My Profile for the NPSSO token, where the box is, instead of Settings → API Keys, and its connection status can be translated
  - type: fix
    label: Uma ungene njengombukeli, amakhasi akasacela kuseva ulwazi lomphathi kuphela angeke alutholi, ngakho irekhodi leseva alisagcwaliswa izicelo ezenqatshiwe
    en: Signed in as a viewer, pages no longer ask the server for admin-only information they cannot have, so the server log no longer fills with refused requests
  - type: security
    label: Amagama avela ngaphandle kwe-RetroDB (idatha ekhishiwe, amagamaamafayela nezikhwama, izimpendulo zezinsizakalo zokuxhumanisa) manje ahlala ebonakala njengombhalo ongokwejwayelekile, ekhasini lomdlalo, Izilungiselelo, Imibiko, amathuluzi e-ROM, amakhasi ezindebe nokunye. Amakhasi futhi asebenzisa kuphela izenzo zamabhathani awo, ngakho igama elenziwe ngobuhlakani alikwazi ukwenza ikhasi lenze okuthile, futhi isixhumanisi se-"buyela ku" se-toast yenqubekela akusakwazi ukuholela kwelinye iwebhusayithi
    en: Names that come from outside RetroDB (scraped data, file and folder names, replies from online services) now always show as plain text, on the game page, Settings, Reports, the ROM tools, the trophy pages and more. Pages also run only their own buttons' actions, so a crafted name cannot make a page do something, and a progress toast's "return to" link can no longer lead to another website
  - type: enhancement
    label: Ama-Scrapha amaningi alandelana asenombhathani othi Hlela kabusha. Uvula i-Queue Manager, lapho i-Scrapha elindile ingasebenza ngokushesha, kamuva, noma ishintshane nenqubo esebenzayo manje. I-toast ngayinye elandelanayo igcina inombolo yendawo yayo ngemva kokushintsha
    en: Queued bulk scrapes get a Reorder button. It opens the Queue Manager, where a waiting scrape can run sooner, later, or swap with the one running now. Each queued toast also keeps its place number after a change
  - type: fix
    label: Inqubekela yomsebenzi akusafundeki noma ibuye iphinde. Ukuhlolwa noma ukuguqulwa kwe-CHD okuphahlazekayo manje kuphela nesizathu; Khansela ibuyisela ikhasi amabhathani alo; ukukhansela, ukuphumuza noma ukususa okwenqatshiwe kuyasho; "kuphelile" akusavela futhi emva kwehora; futhi inkinobho ethi Sync yekhasi lezimpumelelo ibuya uma ukuvumelanisa kuphela
    en: Job progress no longer gets stuck or repeats itself. A CHD check or conversion that crashes now ends with its reason; Cancel gives the page its buttons back; a refused cancel, pause or remove says so; "completed" no longer pops up again an hour later; and the achievements page's Sync button comes back when its sync ends
  - type: fix
    label: Ukulondoloza ukufana kwe-HowLongToBeat ekhasini lomdlalo akusasusi isixhumanisi sayo se-HLTB nenani labadlali, futhi ukulondoloza okwehlulekile kungazanywa futhi. I-Quick Edit akusakhombisi wonke ukufana okulondoloziwe njengo-"100% match". Amathegi esihlungi Somtapo akhombisa igama lesistimu esikhundleni senombolo yayo, futhi ukusesha ngenkathi ubhala kusebenza emakhasinioluhlu nase-Compare
    en: Saving a HowLongToBeat match on the game page no longer wipes its HLTB link and player count, and a failed save can be retried. Quick Edit no longer shows every saved match as "100% match". Library filter tags show a system's name instead of its number, and search-as-you-type works on list pages and Compare
  - type: fix
    label: Wonke ama-akhawunti angashintsha iphasiwedi yawo ku-Izilungiselelo → Iphrofayili Yami, futhi umphathi angayisetha kabusha eyanoma ubani. Amafolda e-emulator manje asebenza ku-Windows. Ideshibhodi akusatsheli abahleli nabbabukeli ukuthi ama-API abo ayasebenzi, futhi "Imidlalo engenaso isithombe sebhokisi" ivula Umtapo ikhombisa leyo midlalo kuphela. Umphathi wamaphasiwedi manje ungagcwalisa ibhokisi lokungena
    en: Every account can change its own password in Settings → My Profile, and an admin can reset anyone's. Emulator folders now work on Windows. The dashboard no longer tells editors and viewers that their APIs are offline, and "Games missing box art" opens the Library showing just those games. A password manager can now fill the sign-in box
  - type: fix
    label: 'Amathuluzi e-ROM: I-CHD Verify ibeka uphawu ngalunye lokuthi Kuvumelekile noma Akuvumelekile kufayela elifanele; i-log viewer ibonisa amagama amamojula futhi futhi ithi uma uhlu lwayo lwamafayela lwehluleka; ukukhetha konke kwe-Game Imports kungenisa kuphela imidlalo ekhonjiswa yisihlungi sakho; futhi inkinobho Setha kabusha ye-ROM Tools Settings ibuyisela ifolda ye-ROM yale khompyutha'
    en: 'ROM tools: CHD Verify puts each Valid or Invalid badge on the right file; the log viewer shows module names again and says when its file list fails; Game Imports'' select-all imports only the games your filter shows; and ROM Tools Settings'' Reset restores this computer''s own ROM folder'
  - type: fix
    label: Izikhathi zokuvula ze-Steam ziboniswa njengezinsuku; ibha ye-A-Z isebenza kuma-Local Trophies; imodi yokukhetha ye-PSN iyaqhubeka isebenza emidlalweni elayishwa uma uskrola; ababukeli abasabonisi amabhathani Sync noma Qamba kabusha abangeke bawasebenzise; ukuqamba kabusha ngobuningi kweqa ifayela eliqanjwe kabusha kusukela ekuskeniweni; futhi i-Analytics ingakopisha kunethiwekhi ye-HTTP evamile futhi ithumela amanani njengezinombolo
    en: Steam unlock times show as dates; the A-Z bar works on Local Trophies; PSN Select mode keeps working on games that load as you scroll; viewers no longer see Sync or Rename buttons they cannot use; a batch rename skips a file renamed since the scan; and Analytics can copy on a plain-HTTP network and exports numbers as numbers
  - type: fix
    label: Efasiteleni lokuqinisekisa, i-Enter ku-Khansela noma × manje iyakhansela esikhundleni sokuqinisekisa. Ifasitela elivulwe yi-OK alisanyamalali, futhi i-Tab iyaqhubeka isebenza ngemva kokuvalwa kohlu lwezinqamuleli noma ifasitela lenqubekela
    en: In a confirm window, Enter on Cancel or × now cancels instead of confirming. A window opened by OK no longer vanishes, and Tab keeps working after the shortcuts list or a progress window closes
  - type: enhancement
    label: 'Izilawuli eziningi ebezisebenza ngegundane kuphela manje zisebenza ngekhibhodi (Tab, bese u-Enter noma Isikhala): amaphrofayili okungena, imiphumela yosesho ye-Compare, amathegi namabhathani awo Hlela no Susa, amakhadi emidlalo yezimpumelelo, amasesheni enkomba-msebenzi, ukukhetha itimu nesithombe somuntu, izithombe ze-Museum, i-× esusa uhlobo noma isihlungi, amafolda okusetha, amabhokisi okumaka imithombo ye-Scrapha nokungenisa kwe-CLZ. Oshintshi bokuvula/ukucisha manje babonisa indandatho yekhibhodi'
    en: 'Many controls that worked only with a mouse now work from the keyboard (Tab, then Enter or Space): the sign-in profiles, Compare search results, tags and their Edit and Delete buttons, achievement game cards, log sessions, theme and avatar choices, Museum pictures, the × that removes a genre or filter, setup folders, scrape-source tick boxes and the CLZ import. On/off switches now show the keyboard ring'
  - type: performance
    label: Isisusi sangemuva se-Museum asisahlali kumemori. Sasisika izithombe zesilawuli emuva kwazo ngemodeli ye-AI eyayithatha ngaphezu kuka-2 GB uma isisetshenzisiwe, kuze kufike cishe ku-9 GB ngesikhathi sesithombe, kuze kuqalwe kabusha i-RetroDB. Manje isebenza ohlelweni olusizayo oluqala uma kudingeka futhi oluvaleka emizuzwini emibili ngemuva kwesithombe salo sokugcina, lubuyisela yonke leyo memori
    en: The Museum's background remover no longer stays in memory. It cut controller photos out of their background with an AI model that took over 2 GB once used, and up to about 9 GB during a photo, until RetroDB restarted. It now runs in a helper that starts when needed and closes two minutes after its last photo, giving all of that memory back
  - type: feature
    label: 'Ukungenisa kwe-Xbox akusadingi i-akhawunti ye-Microsoft Azure. Manje umuntu ngamunye unamathisela ukhiye wakhe we-OpenXBL wamahhala (ovela ku-xbl.io) ku-Izilungiselelo → Iphrofayela Yami, futhi kusebenza kunoma iyiphi ikhompyutha kunethiwekhi yakho. Ukungenisa futhi kushiya ngaphandle ama-app nemidlalo yefoni kuphela, kufaka imidlalo ye-PC ngaphansi kwe-Windows esikhundleni se-Xbox One, kufunda izimpumelelo ze-Xbox 360 ngendlela efanele, futhi akubonisi usuku lwempumelelo ekhiyiwe. Ukhiye wamahhala uvumela izicelo eziyi-150 ngehora: ukuvumelanisa izimpumelelo okukhulu okufinyelela kulo mkhawulo kuyama, kukusho lokho, bese ngokulandelayo kuqala ngemidlalo okungakafiki kuyo'
    en: 'Xbox import no longer needs a Microsoft Azure account. Each person now pastes their own free OpenXBL key (from xbl.io) under Settings → My Profile, and it works from any computer on your network. The import also leaves out apps and phone-only games, files PC games under Windows instead of Xbox One, reads Xbox 360 achievements the right way, and shows no date for a locked achievement. The free key allows 150 requests an hour: a big achievement sync that reaches it stops, says so, and next time starts with the games it had not reached'
  - type: enhancement
    label: I-RetroAchievements Sync noma Refresh oyicelayo ngenkathi enye isasebenza manje ilinda kuseva futhi iqala yodwa uma leyo iphela, noma uvala ikhasi noma uyicele kwenye idivayisi. Wonke amakhasi abonisa uhlu olulodwa lokulinda nendawo yomsebenzi ngamunye emgqeni, futhi ✕ isusa umsebenzi. Ngemuva kokuqala kabusha kweseva, imisebenzi elindile iyabuyiselwa ekuphakameni ku-Dashboard
    en: A RetroAchievements Sync or Refresh you ask for while another one runs now waits on the server and starts by itself when that one finishes, even if you close the page or asked from another device. Every page shows the same waiting list with each job's place in line, and ✕ takes a job out. After a server restart, waiting jobs are offered back on the Dashboard
  - type: fix
    label: Inkinobho ethi Refresh RA ekhasini le-console isebenza futhi. Ibingasho ukuthi iyiphi i-console, ngakho iseva iphendule ngokuthi "Not found"
    en: The Refresh RA button on a console's page works again. It did not say which console, so the server answered "Not found"
  - type: fix
    label: Ukuhlola amagama e-ROM manje kubheka isistimu ngayinye njengohlobo oluboniswa ekhasini le-Izistimu. I-Macintosh, i-ZX Spectrum Next, i-Coleco Adam ne-Thomson zihlolwa njengamakhompyutha, kanti i-3DS ne-PS Vita njengezidlali ezibanjwa ngesandla, kunokuba zihlolwe njengama-console. Uhlobo osibekele ekhasini le-Izistimu manje selilandelwa nalo
    en: The ROM naming check now treats each system as the kind the Systems page shows. Macintosh, ZX Spectrum Next, Coleco Adam and Thomson are checked as computers, and 3DS and PS Vita as handhelds, instead of as consoles. A type you set on the Systems page is now followed too
  - type: performance
    label: I-RetroDB isebenzisa inkumbulo encane kakhulu uma ilindile. Isikhulisi sezithombe se-AI manje siyalayishwa kuphela ngenkathi sikhulisa, kumsizi evalwa ngemizuzu emibili ngemva kwesithombe sakhe sokugcina; iseva engenzi lutho yehle isuka cishe ku-1.4 GB yaya ngaphansi kuka-100 MB. Uma i-driver yezithombe iphahlazeka ngesikhathi sokukhulisa, kumiswa umsizi kuphela, akusoze kwaphazamiseka iseva
    en: RetroDB uses far less memory while it waits. The AI image upscaler now loads only while it is upscaling, in a helper that closes two minutes after its last picture; an idle server dropped from about 1.4 GB to under 100 MB. If the graphics driver crashes during an upscale, only the helper stops, never the server
  - type: performance
    label: Ukugcwalisa nge-AI nge-Claude web search kubiza kancane. U-Claude ufunda kabusha imiphumela yosesho ngemva kosesho ngalunye; manje i-RetroDB icela ku-Anthropic ukuthi iyigcine ilungile, bese ukufunda kabusha kubiza ingxenye eyodwa kweziyishumi yenani noma kuncane
    en: AI Fill with Claude web search costs less. Claude reads the search results again after each search; RetroDB now asks Anthropic to keep them ready, and a re-read then costs a tenth of the price or less
  - type: fix
    label: 'isiZulu nesiXhosa sifundeka kangcono: imigqa engu-133 eyeyisho into engafanele ilungisiwe, njengokuthi "Edition" ibisho "Chapter" no-"must be text" ibisho "must be a letter". Ukulungiswa ngakunye kuvunyelwene ngakho yizihloko ezimbili zokuhlola ze-AI ezizimele'
    en: 'Zulu and Xhosa read better: 133 lines that said the wrong thing are corrected, such as "Edition" shown as "Chapter" and "must be text" shown as "must be a letter". Each correction was agreed by two separate AI checks'
  - type: fix
    label: Uma umdlalo ungaqali, umlayezo manje usolimini lwakho futhi usabiza i-emulator, i-core noma ifayela elinenkinga. Ukwehluleka ngaphakathi kwekhompyutha uqobo manje kuthi "Could not start" kanye negama lohlelo, nemininingwane ikwilogi leseva, esikhundleni sombhalo ongahlelekile wesistimu. Ukuphikwa kokungena ku-RetroAchievements kubonisa isizathu sika-RetroAchievements uqobo ngaphakathi emshweni ohunyushiwe
    en: When a game will not start, the message is now in your language and still names the emulator, core or file at fault. A failure inside the computer itself now says "Could not start" and the program's name, with the details in the server log, instead of raw system text. A refused RetroAchievements sign-in shows RetroAchievements' own reason inside a translated sentence
  - type: fix
    label: Ukukhansela umsebenzi we-scrape, wokuvumelanisa noma wezithombe osuqedile manje kuvala ifasitela eliphelele lenqubekela eyenamathele. Ukuqala umsebenzi osuvele usebenza kubonisa isizathu sangempela, njenge-"A scrape for SNES is already running", esikhundleni se-"Network error". Amaphutha ezithombe zesilawuli ku-Museum manje asho ukuthi kuphutheke ini, futhi ukukhansela ukuvumelanisa kwe-RetroAchievements komunye umsebenzisi kusho ukuthi kungokwakhe esikhundleni sokuzenza sengathi kukhanselwe
    en: Cancelling a scrape, sync or image job that has already finished now clears its stuck progress popup. Starting a job that is already running shows the real reason, such as "A scrape for SNES is already running", instead of "Network error". Controller image errors in the Museum now say what went wrong, and cancelling another user's RetroAchievements sync says it is theirs instead of pretending to cancel it
  - type: security
    label: Isibukeli se-log manje sifihla amaphasiwedi nezihluthulelo ngisho emafayelini amadala e-log. Ama-log abhalwa ngaphambi kokuba i-RetroDB ifunde ukufihla iphasiwedi ethile, njengeye-ScreenScraper, ayeyibonisa ngokusobala uma ebukwa noma edawunilodwa
    en: The log viewer now hides passwords and keys in older log files too. Logs written before RetroDB learned to hide a particular password, such as ScreenScraper's, showed it in plain text when viewed or downloaded
  - type: security
    label: Ukusetha kabusha zonke izilungiselelo zibe yizinkambiso zazo manje kugcina ifolda yakho ye-ROM nokuthi ukusetha sekuqediwe. Ngaphambili, ukusetha kabusha kwakuvula kabusha amakhasi okusetha okokuqala, asebenza ngaphandle kokungena, kuze kube yilapho umlawuli esebenzisa ukusetha futhi
    en: Resetting all settings to their defaults now keeps your ROM folder and the fact that setup is done. Before, a reset reopened the first-time setup pages, which work without signing in, until an admin ran setup again
  - type: feature
    label: Imidlalo ye-arcade ingathola izimpumelelo ze-RetroAchievements futhi. I-RetroDB manje ixhuma umdlalo we-arcade kuphela uma i-RetroAchievements iyazi igama lawo eliqondile lefayela, njenge-sf2 ye-Street Fighter II, ngakho ayisakucabangeli ngamagama futhi ixhume umdlalo ongalungile. Imidlalo yakho ye-arcade izoxhumeka ngesikhathi esilandelayo lapho idatha yayo ye-RetroAchievements ivuselelwa noma isikhishwa nge-scrape
    en: Arcade games can earn RetroAchievements again. RetroDB now links an arcade game only when RetroAchievements knows its exact file name, such as sf2 for Street Fighter II, so it no longer guesses from titles and links the wrong game. Your arcade games link the next time their RetroAchievements data is refreshed or they are scraped
  - type: fix
    label: Ukuvumelanisa kwamabhaso e-PlayStation manje kulungisa izixhumanisi zemidlalo ezake zenziwa ngephutha, njengemidlalo eminingi exhumene nomdlalo ongahlobene obizwa ngokuthi "D". Isixhumanisi osibeke wena asishintshwa neze ukuvumelanisa. Ukuvumelanisa okulandelayo kuhlola zonke izixhumanisi zakudala futhi, ngakho ezinye ezifanayo kancane zingase zikhululeke; zixhume futhi ngesandla
    en: PlayStation trophy sync now corrects game links it made wrongly before, such as many games linked to an unrelated game called "D". A link you set yourself is never changed by a sync. The next sync checks all older links again, so a few near matches may come unlinked; link those again by hand
  - type: fix
    label: Ukuthuthela phambili i-scrape enkulu elindile ngaphambi kwesebenzayo akusayengezi umdlalo wokugcina we-scrape endala ezibalweni zensha. Ukuchofoza "Scrape all" ku-Uhlu Lwezifiso kuyilapho esinye sesivele sisebenza manje kusho lokho, esikhundleni sokuthi siqalile
    en: Moving a waiting bulk scrape ahead of a running one no longer adds the old scrape's last game to the new one's counts. Clicking "Scrape all" on the wishlist while one is already running now says so, instead of claiming it started
  - type: accessibility
    label: 'Ngesifundi sesikrini, inkinobho ethi "running" manje isho ukuthi "1 game running" kuphela uma inani lishintsha, esikhundleni sokufunda inombolo yodwa njalo ngemizuzwana embalwa. Uhlu lwayo luvuleka njengefasitela elinegama nekhesa ngaphakathi, izinkinobho zayo ze-Kill ne-Next disk zisho ukuthi zenzela muphi umdlalo, futhi ngemva kwe-Kill ikhesa libuyela endaweni efanele. Ikhadi lomdlalo ngalinye eMtatapweni manje livulwa ngekhibhodi kusukela ekhanda lalo, futhi izinkinobho zalo zokuhlunga zisho ukuthi zihlunga ini, njenge-"Filter by Developer: Konami"'
    en: 'With a screen reader, the "running" button now says "1 game running" only when the count changes, instead of reading a bare number every few seconds. Its list opens as a named window with the cursor inside, its Kill and Next disk buttons say which game they act on, and after Kill the cursor returns to a sensible place. Each game card in the library now opens with the keyboard from its title, and its filter buttons say what they filter, such as "Filter by Developer: Konami"'
  - type: feature
    label: Ilungu ngalinye manje lingafaka isihluthulelo sakhe se-Steam ne-Steam ID ku-Izilungiselelo → My Profile, futhi lingangenisa umtapo wakhe we-Steam nezimpumelelo. Kuze kube manje umlawuli kuphela owayekwazi
    en: Every member can now add their own Steam key and Steam ID under Settings → My Profile, and import their own Steam library and achievements. Until now only an admin could
  - type: fix
    label: Ukulondoloza imininingwane yomdlalo akusasethi inani labadlali elingenalutho libe ngu-1, futhi akusakumaka izilinganiso zeminyaka i-RetroDB ezibalile njengezibhalwe nguwe. Ukugcwalisa nge-AI kugcina umdlalo owumake ngokuthi Exclusive, futhi kugcina noma yiziphi izinguquko owenza emdlalweni usalindele impendulo ye-AI. Umlando we-scrape manje ubala kuphela imininingwane eyilondolozile ngempela
    en: Saving a game's details no longer sets an empty player count to 1, and no longer marks the age ratings RetroDB worked out for you as typed by you. AI Fill keeps a game you marked Exclusive, and keeps any change you make to a game while it is waiting for the AI's answer. A scrape's history now lists only the details it actually saved
  - type: fix
    label: Screenshot Review ayisaphumi phakathi uma isithombe esisodwa esigciniwe sikhulu kakhulu ukuvuleka; sibala lowo mfanekiso njengongafundeki bese iqhubeka. Uhlu lokuqukethwe kwekhasi losizo manje lunezixhumanisi ze-Ama-emulator ne-Playing, futhi amanothi omqambi ngokungena, imisebenzi yangemuva, i-scrape, izithombe, izibuyekezo nezimpendulo zamaphutha manje asho okwenziwa uhlelo ngempela
    en: Screenshot Review no longer stops halfway when one stored screenshot is far too large to open; it counts that picture as unreadable and carries on. The help page's contents list now links to Emulators and Playing, and the developer notes on sign-in, background jobs, scraping, pictures, updates and error replies now say what the program really does
  - type: fix
    label: Umhleli oqala ukuskena kwe-ROM Tools manje angakumisa isikhashana, aqhubeke noma akukhansele; ukuskena kwabanye kusala kumlawuli ukukumisa. Amathegi nezinhlu zenqaba igama elingekho noma umbala ongalungile ngomyalezo ocacile esikhundleni sekhasi lephutha, futhi ukuqamba kabusha umdlalo ku-Uhlu Lwezifiso ube ngomunye osuveleuwufisile kuyenqatshwa, njengoba nokuwengeza kunjalo. Clear RA Data manje iphinde ikhohlwe ukuthi ikhophi yakho ithola izimpumelelo yini. Ibhaso i-RetroDB engasanikezi alisabalwa ezingeni lakho lomqoqi. Izindlela ze-ROM ze-Windows manje zifanisa imidlalo ye-RetroAchievements ngegama lefayela
    en: An editor who starts a ROM Tools scan can now pause, resume or cancel it; other people's scans stay an admin's to stop. Tags and lists refuse a missing name or a bad colour with a clear message instead of an error page, and renaming a wishlist game onto another one you already wish for is refused, as adding it is. Clear RA Data now also forgets whether your copy earns achievements. A trophy RetroDB no longer offers stops counting toward your collector rank. Windows ROM paths now match RetroAchievements games by file name
  - type: fix
    label: Izilungiso zokunakekela. Iarchive yamadiski amaningiehluleka ukuvuleka akusasiyi ifolda eyenziwe uhhafu evimba wonke amazama. Calculate Storage manje ibala wonke amafayela angaphakathi kwefolda yomdlalo we-PS3. Clear Scraped Data isusa izithombe kuphela uma uyicela. Ukuskena komtapo okuhlangana nomdlalo osanda kwengezwa ukuskena okunye kuyaqhubeka nemidlalo esele ye-console leyo
    en: Maintenance fixes. A multi-disc archive that fails to unpack no longer leaves a half-made folder behind that blocks every retry. Calculate Storage now counts every file inside a PS3 game folder. Clear Scraped Data deletes pictures only when you ask it to. A library scan that meets a game another scan has just added carries on with the rest of that console's games
  - type: fix
    label: Ukubuyisela i-backup kuphephile kakhulu. Manje ibhalwa kusizindalwazi somtapo ngendlela isizindalwazi ngokwaso esiyilindele, ngakho ingxenye ye-RetroDB eyivulile ibona idatha ebuyisiwe esikhundleni sokubeka engcupheni yokonakala. Ukusula umdlalo manje kuphinde kusule izithombe zebhokisi lawo nokufakwa kwawo kwezithombe ezilindile nezilungiselelo ze-emulator, ukuze umdlalo omusha ungazizuzi neze. Izilungiselelo ezimbili ezilondolozwe ngasikhathi sinye azisalahlekelwa uyodwa
    en: Restoring a backup is safer. It is now written into the library database the way the database itself expects, so a part of RetroDB that has it open sees the restored data instead of risking damage. Deleting a game now also deletes its box pictures and its waiting picture and emulator-setting entries, so a new game can never inherit them. Two settings saved at the same moment no longer lose one of them
  - type: fix
    label: Izilungiso zezithombe. Ama-GIF akasadluliswa kumkhulisi bese alahlwa. Imodeli yomkhulisi ihlolwa ngophawu lwayo olushicilelwe, futhi ukudawuniloda okubi kuyalandwa futhi esikhundleni sokucisha ukukhulisa unomphela. Amalogo nezithombe ezinezingxenye ezibonisa ngale kugcina ukubonisa ngale uma zikhuliswa. Convert to WebP manje ithatha nezembozo zangemuva namalogo, futhi ayisenqabi umtapo omkhulu ngenxa yendawo engayidingi. Ubuso obubili befayela lebhokisi bungabelana ngesithombe esisodwa, futhi ukususa ibhokisi elinerekhodi elilimele kususa izithombe zalo
    en: Picture fixes. GIFs are no longer run through the upscaler only to be thrown away. The upscaler model is checked against its published fingerprint, and a bad download is fetched again instead of turning upscaling off for good. Logos and pictures with see-through parts keep their transparency when enlarged. Convert to WebP now takes back covers and logos too, and no longer refuses a large library for want of room it does not need. Two faces of a box file can share one picture, and removing a box with a damaged record removes its pictures
  - type: fix
    label: Ukungenisa okuvela ku-CLZ, Steam, Xbox ne-PlayStation akusabheka wonke amazwi abhalwe ngesiJapane kuphela noma olunye uhlelo lokubhala olungelona lesiLatini njengomdlalo owodwa, futhi akusafaki umdlalo ongenalo id. Ukubuka kuqala kwe-CLZ akusafaki ama-console ngaphambi kokuba uqinisekise ukungenisa, futhi umbukeli obuka umtapo we-Steam, Xbox noma PlayStation naye akasawafaki. Umdlalo we-Steam osusiwe esitolo ubuzwa kanye kuphela, hhayi ekuvumelanisweni ngakunye
    en: Imports from CLZ, Steam, Xbox and PlayStation no longer treat every title written only in Japanese or another non-Latin script as the same game, and no longer add a game with no id. The CLZ preview no longer adds consoles before you confirm the import, and a viewer looking at a Steam, Xbox or PlayStation library no longer adds them either. A Steam game removed from the store is asked about once, not on every sync
  - type: fix
    label: Analytics manje ihlanganisa ama-console amaningi kakhulu ngaphansi komkhiqizi wawo esikhundleni se-"Other", futhi uhlu lwe-Recently Scraped ku-dashboard lubonisa umdlalo owuskraphe futhi, hhayi kuphela imidlalo esanda kwengezwa
    en: Analytics now groups many more consoles under their maker instead of "Other", and the dashboard's Recently Scraped list shows a game you scraped again, not only newly added games
  - type: fix
    label: Izithombe zesilawuli ozengeza ku-Museum ziyagcinwa uma inguqulo ezimele ibuyekezwa. Lapho isevisi ye-inthanethi imiswa umkhawulo wayo, isikhathi ezocelwa ngaso futhi sibonakala endaweni yakho yesikhathi
    en: Controller pictures you add in the Museum are kept when the standalone version updates. When an online service pauses at its limit, the time it will be asked again is shown in your own time zone
  - type: fix
    label: Idiski yebhonasi ayisakwazi ukuxhumeka kuyo ngokwayo noma kenye idiski yebhonasi, futhi Auto-link ayisaxhumi idiski kweyodwa eyimaka njengedisk yebhonasi ekusebenzeni okufanayo
    en: A bonus disc can no longer be linked to itself or to another bonus disc, and Auto-link no longer links a disc to one it marks as a bonus disc in the same run
  - type: fix
    label: Amakhasi omtapo ne-console akasababali amafayela e-BIOS e-arcade njengemidlalo, ezibalweni zawo nakubha yezinhlamvu. Imidlalo efanayo, nohlu oluvela ngokuchofoza uhlobo noma umshicileli ekhasini lomdlalo, akusabonisi izinguqulo zesifunda zomdlalo uqobo, amadiski ebhonasi noma amafayela e-BIOS
    en: The Library and console pages no longer count arcade BIOS files as games, in their totals or the letter bar. Similar games, and the list you get by clicking a genre or publisher on a game's page, no longer show the game's own regional versions, bonus discs or BIOS files
  - type: fix
    label: Select all manje isho uma uhlu olukhulu kakhulu lunqunyiwe, esikhundleni sokukhetha ingxenye kuphela ngokuthula
    en: Select all now says so when a very large list is cut short, instead of quietly selecting only part of it
  - type: fix
    label: Amakhadi omtapo manje ayabuyekezwa uma inqubekela yakho yezimpumelelo noma yamabhaso ishintsha, nalapho umdlalo uba nokudlalwa noma ungasakwazi ukudlalwa
    en: Library cards now update when your achievement or trophy progress changes, and when a game becomes playable or stops being playable
  - type: fix
    label: Bulk edit ayisakwazi ukushintsha imidlalo engalungile uma ithunyelwe ukukhetha okubi, futhi i-bulk edit eyehlulekayo ayisayimaki imidlalo njengehlelwe nguwe
    en: Bulk edit can no longer change the wrong games when it is sent a bad selection, and a bulk edit that fails no longer marks the games as edited by you
  - type: fix
    label: Ukufana kwe-HowLongToBeat okungu-1% kuphela akusabonakali njengokufana okungu-100%, futhi ikhasi elehluleka ukulayisha libonisa ikhasi lephutha esikhundleni sombhalo ongahleliwe wephutha
    en: A HowLongToBeat match that is only a 1% fit is no longer shown as a 100% match, and a page that fails to load shows the error page instead of the raw error text
  - type: security
    label: Ukushintsha iphasiwedi yakho, noma umlawuli ayisetha kabusha, manje kukhipha leyo akhawunti kuwo wonke amanye amadivayisi. Ngenxa yalokhu, wonke umuntu uzongena kanye futhi ngemva kwalesi sibuyekezo. Ikhasi lokusetha lokuqala nalo manje linokuvikeleka okufanayo kwamanye amawebhusayithi njengawo wonke amanye amakhasi
    en: Changing your password, or an admin resetting it, now signs that account out on every other device. Because of this, everyone signs in once more after this update. The first-run setup page also gets the same protection against other websites as every other page
  - type: fix
    label: Isithombe esenqatshelwe njenge-avatar yakho akusayisusi i-avatar obunayo
    en: A picture that is refused as your avatar no longer deletes the avatar you had
  - type: fix
    label: Ama-scrape ayathantala ezevisini ze-inthanethi. Isevisi eqhubeka yehluleka iyeqiwa isikhashana lapho kugcwaliswa izikhala, njengoba kwase kwenziwa ekusesheni, futhi ukufuna imidlalo kwe-ScreenScraper manje kuhlonipha imikhawulo yayo yansuku zonke nakho
    en: Scrapes are gentler on the online services. A service that keeps failing is skipped for a while when filling gaps, as it already was in searches, and ScreenScraper game lookups now respect its daily limits too
  - type: fix
    label: I-scrape ayisahluleki emdlalweni ongaziwa unyaka wokukhishwa kwawo, njenge-"TBA", futhi umdlalo odwetshelwe izifunda ezingaphandle kohlu lwakho, njenge-"Brazil, Korea",ugcina isifunda sawo esikhundleni sokuba yisinqumo sakho
    en: A scrape no longer fails on a game whose release year is unknown, such as "TBA", and a game listed for regions outside your list, such as "Brazil, Korea", keeps its region instead of becoming your default
  - type: fix
    label: Amafolda e-ES-DE abhalwe nge-~/ manje asebenza, futhi ifayela le-ES-DE elikhulu kakhulu alisakopishwa. Izinguqulo zesifunda eziphakanyisiwe azisabuyiseli ndawonye imidlalo emibili owathi akuzona izinguqulo zomunye nomunye
    en: ES-DE folders written as ~/ now work, and a very large ES-DE file is no longer copied. Suggested regional versions never put back together two games you said are not versions of each other
  - type: security
    label: I-RetroDB inqaba ezinye izikhulumi zenethiwekhi eyimfihlo lapho ilanda izithombe kuwebhu, futhi ilandela kahle ukuqondiswa kabusha kwekheli lewebhu
    en: RetroDB refuses a few more private network addresses when fetching pictures from the web, and follows a web address's redirect correctly
  - type: fix
    label: Izikrini zokugcina ezisesiNgisini manje nazo ziyawulandelaolimi lwakho, kufaka phakathi i-setup wizard, Amathegi, Izinhlu, Compare Games, izilungiselelo ze-ROM Tools, ulayini we-scrape enkulu, uhlu lwemisebenzi enqamukile ku-dashboard, amalebula amakhadi omtapo namaphutha amaningi
    en: The last screens still in English now follow your language too, including the setup wizard, Tags, Lists, Compare Games, ROM Tools settings, the bulk scrape queue, the dashboard's interrupted-jobs list, the library card labels and many error messages
  - type: security
    label: Igama lesistimu eliqukethe ikhodi yewebhu alisakwazi ukuyisebenzisa efasitelani lolayini we-scrape enkulu
    en: A system name holding web code can no longer run it in the bulk scrape queue window
  - type: accessibility
    label: Noma ikuphi ekhasini, indawo yekhibhodi manje iphawulwa indandatho eshubile ngombala wetimu yakho, kunoma iyiphi inkinobho, ibhokisi nesixhumanisi. Ngaphambili, izilawuli eziningi zazibonisa kuphela umugqa ophaphathekile, ofana nalapho igundane lidlula phezu kwazo
    en: Wherever you are on a page, the keyboard's place is now marked with a bold ring in your theme's colour, on every button, box and link. Before, many controls showed only a faint line, the same as when the mouse passed over them
  - type: accessibility
    label: Izixhumanisi ze-Genre, Series, Developer ne-Publisher emakhadini omtapo manje ziyasebenza ngekhibhodi. Inkinobho ethi "running" yemidlalo edlalwayo nayo ivulwa ngekhibhodi, futhi i-Esc noma ukuchofoza kwenye indawo kuvala uhlu lwayo
    en: The Genre, Series, Developer and Publisher links on library cards now work from the keyboard. The "running" button for games in play opens from the keyboard too, and Esc or a click elsewhere closes its list
  - type: accessibility
    label: Izifundi zesikrini manje zibiza umbala wethegi ngalinye futhi zisho ukuthi iwuphi okhethiwe, futhi zifunda izithombe zamabhaso njenge-Platinum, Gold, Silver ne-Bronze esikhundleni sezinhlamvu ezizodwa. Ngenkathi umdlalo uqala, i-Tab ayisaya ngemuva kwesikrini sokuqala
    en: Screen readers now name each tag colour and say which one is chosen, and read trophy pictures as Platinum, Gold, Silver and Bronze instead of single letters. While a game starts, Tab no longer moves behind the starting screen
  - type: fix
    label: Uma isibuyekezo simiswa ngaphambi kokuqala ukushintshanisa amafayela, i-RetroDB manje iqala inguqulo obunayo futhi, esikhundleni sokuhlala ivaliwe
    en: If an update stops before it starts swapping files, RetroDB now starts the version you had again, instead of staying closed
  - type: fix
    label: Ukucindezela Dlala kabili ngasikhathi sinye akusakwazi ukuqalisa imidlalo emibili ku-player ehlanganisiwe. Ukulinda ukudawuniloda kwe-core manje kuyeka ngemva kwesikhathi, noma uma i-RetroDB iyeka ukuphendula, esikhundleni sokulinda unomphela, futhi umbuzo othi "already running" usebenzisa ikhasi lengxoxo le-RetroDB uqobo
    en: Pressing Play twice at once can no longer start two games on the built-in player. Waiting for a core download now gives up after a while, or when RetroDB stops answering, instead of waiting forever, and the "already running" question uses RetroDB's own dialog
  - type: fix
    label: Ama-cheat owavula noma owavala ngenkathi udlala agcinelwa umdlalo olungile, awathathwa neze komunye umdlalo ofayela lawo linegama elifanayo. Inkinga ye-cheat ayiwuvimbeli umdlalo ukuqala
    en: Cheats you switch on or off during play are kept for the right game, never taken from another game whose file has the same name. A cheat problem never stops a game starting
  - type: fix
    label: I-RetroDB ibhala ifayela lezilungiselelo le-emulator ngokuphepha kakhulu. Ifayela lezilungiselelo eliyisixhumanisi lihlala lisixhumanisi, ligcina izimvume zalo, futhi ligcina izinhlamvu elingazifundi, futhi ukulondoloza okwehlulekile akusiyi ifayela elilahlekile
    en: RetroDB writes an emulator's settings file more safely. A settings file that is a link stays a link, keeps its permissions, and keeps letters it cannot read, and a failed save leaves no stray file behind
  - type: fix
    label: I-scrape enkulu oyehlisela ngezansi kulayini, oyishintshanisa nenye noma oyiqhubekisa kuyilapho enye isebenza akusalahleki uma i-RetroDB iqala kabusha; i-dashboard iyinikeza, kusukela lapho imise khona. I-scrape eshintshanisiwe ayisaqhubeki isebenza eceleni kwensha, futhi ukuchofoza kabili ngokushesha ku-Resume kuqala umsebenzi kanye
    en: A bulk scrape you move down the queue, swap with another or resume while one runs is no longer lost when RetroDB restarts; the dashboard offers it, from where it stopped. A swapped-out scrape no longer keeps running beside the new one, and two quick clicks on Resume start a job once
  - type: fix
    label: Iphutha lomdlalo owodwa, njengenethiwekhi ehlehlayo, akusaphelisi uhlelo lonke lwe-Ukugcwalisa nge-AI noma lwe-Lungisa Izifunda Zebhokisi Nencwadi Yokusebenzisa; lowo mdlalo ubalwa njengohlulekile bese kuqhubeka okunye. Ukumisa i-RetroDB manje kumisa nokudawuniloda kwe-core ngokuhlanzekile
    en: One game's error, such as the network dropping, no longer ends a whole AI Fill run or a Fix Box and Manual Regions run; that game counts as failed and the rest go on. Stopping RetroDB now also stops core downloads cleanly
  - type: fix
    label: Izinto zoHlu Lwezifiso azisahlali ku-"scraping" unomphela ngemva kwephutha noma ukuqala kabusha, futhi ukusebenza kabili kwe-Scrape All kohlu olufanayo akusahlangani
    en: Wishlist items no longer stay on "scraping" forever after an error or a restart, and two Scrape All runs for the same wishlist no longer run at once
  - type: fix
    label: Iskripthi noma ikhophi yesibili ye-RetroDB eqalayo ayisaphawuli imisebenzi yeseva esebenzayo njengenqamukile, futhi amakhophi amabili aqala ngasikhathi sinye awasakwazi ukubuyisela idathabhesi emuva inguqulo
    en: A script or a second copy of RetroDB starting up no longer marks the running server's jobs as interrupted, and two copies starting at once can no longer set the database back a version
  - type: fix
    label: Ukuqala ukuvumelanisa kwe-PlayStation akusenzi amabha enqubekelaphambili abo bonke alinde ngenkathi ingena ku-Sony. I-PlayStation keep-alive ysonke usuku manje ivuselela ukungena kuphela ngasekupheleni kwezinsuku zayo eziyi-10, hhayi nsuku zonke
    en: Starting a PlayStation sync no longer makes everyone's progress bars wait while it signs in to Sony. The daily PlayStation keep-alive now renews a sign-in only near the end of its 10 days, instead of every day
  - type: fix
    label: I-scrape ayisabhali ngaphezu koshintsho owenza ngenkathi isebenza, futhi ayisayikhiphi uhlobo, imodi noma ukubuka okungenalo igama layo. Ayisashintshi inani labadlali elilondoloziwe ukuze lifane nemodi zomdlalo
    en: A scrape no longer writes over a change you make while it runs, and no longer empties a genre, mode or view it has no name for. It no longer changes a stored player count to match the game's modes
  - type: fix
    label: Ukugcwalisa nge-AI akusashintshi lokho oyibhale ngokwakho, njengomshicileli noma uhlobo owalungisa ngesandla; kulungisa kuphela amanani ascrapha. Akusabikeli inani njengelishintshiwe uma kubhalwe ngenye indlela kuphela, njengabadlali abangu-4 ngokuthi "1-4" noma izinhlobo ezifanayo ngenye indlela ehleliwe
    en: AI Fill no longer changes what you typed yourself, such as a publisher or genre you corrected by hand; it corrects only scraped values. It no longer reports a value as changed when it only wrote it differently, such as 4 players as "1-4" or the same genres in another order
  - type: fix
    label: Isilawuli oshayela umdlalo siyagcinwa; isilawuli esizenzakalelayo se-console manje sithatha indawo yamanani ascrapha nawe-AI kuphela. Isilinganiso seminyaka esiguqulwe ekuqageleni kwe-AI kwenye ibhodi manje siphawulwa nanjengokuqagela
    en: A controller you type for a game is kept; the console's default controller now replaces only scraped and AI values. An age rating converted from another board's AI guess is now marked as a guess too
  - type: fix
    label: Ukulondoloza iwindi lokuhlela lomdlalo akusawakhiphi amasimu iwindi elingawaboniswa. Resetekhasini lomdlalo manje isusa konke okushoyo, kuhlanganise ukubuka, uhlelo namanye amagama, isuse izithombe nevidiyo zomdlalo ngaphandle kokuthi omunye umdlalo uzisebenzisa, futhi ivuselela izihlungi zomtapo masinyane
    en: Saving a game's edit window no longer empties fields the window does not show. Reset on a game's page now clears everything it says it does, including the view, edition and other names, deletes the game's pictures and videos unless another game uses them, and updates the library filters straight away
  - type: fix
    label: Clear Scraped Data manje ihlanza nokubuka, i-2D noma i-3D, nesakhiwo somdlalo. Ukungenisa kwe-CLZ komdlalo ononyaka kuphela kugcina unyaka kuphela, hhayi mhla-1 Januwari
    en: Clear Scraped Data now also clears the view, 2D or 3D, and game structure. A CLZ import of a game with only a year keeps just the year, not 1 January
  - type: security
    label: Ukuvumelanisa kwe-Steam akusasebenzisi ukhiye we-Steam wase-Izilungiselelo kuwo wonke amalungu omndeni. Ilungu elingenakho ukhiye lalithola umtapo we-Steam nezimpumelelo zomphathi ku-akhawunti yalo. Ukhiye wase-Izilungiselelo manje usebenzela abaphathi kuphela
    en: Steam sync no longer borrows the Steam key from Settings for every household member. A member with no Steam key of their own was getting the admin's Steam library and achievements under their account. The key in Settings now serves admins only
  - type: fix
    label: Ukusesha kwe-How Long to Beat kwemidlalo eminingi manje kulondoloza izikhathi eziqinisekile. Ngaphambili wonke amaphutha ahlulekile akukho okwalondolozwa. RetroAchievements Refresh manje ihlola nefayela lomdlalo ngohlu lwe-RetroAchievements, njengoba i-scrape yenza, ukuze umdlalo uxhunywe enguqulweni oyinayo ngqo
    en: How Long to Beat's lookup for many games now saves the times it is sure of. Before, every sure match failed and nothing was saved. RetroAchievements Refresh now also checks each game's file against RetroAchievements' list, as a scrape does, so a game is linked to the exact version you have
  - type: fix
    label: Umlayezo wokuthi umsebenzi wangemuva usuqediwe uyabuya, futhi ibhokisi lenqubekelaphambili yomsebenzi liyabona lapho iseva ithatha umsebenzi ngemva kokuqala kabusha. Ngaphambili akukho kwakubonakala
    en: The message that a background job has finished shows again, and a job's progress box notices when the server picks the job up after a restart. Before, neither ever appeared
  - type: fix
    label: 'Izindebe ze-PlayStation: umdlalo oxhumanise ngesandla uhlala uxhunyiwe ngemva kokuvumelanisa okuphelele, futhi ukuvumelanisa akusawuxhumanisi umdlalo nenxusa lawo, njengokuthi "Doom" ku-"Doom Eternal". Ukungenisa imidlalo ye-PlayStation manje kuxhumanisa umdlalo osuvele esemtapweni wakho, njengoba kwenza i-Steam ne-Xbox, ukuze izindebe zibonakale kuwo'
    en: 'PlayStation trophies: a game you linked by hand stays linked after a full sync, and a sync no longer links a game to its sequel, such as "Doom" to "Doom Eternal". Importing PlayStation games now links a game already in your library, as Steam and Xbox imports do, so its trophies show on it'
  - type: fix
    label: I-Xbox ayisakhombisi igamertag yakho njengokungaziwa ngemva kokuthi ukungena kuvuselele kwakho, futhi uxhumano olulinganiselayo noma olwehlulekile aluphumisi ku-Xbox. Yilapho kuphela uMicrosoft enqaba ukungena
    en: Xbox no longer shows your gamertag as Unknown after its sign-in renews itself, and a slow or failed connection no longer signs you out of Xbox. Only Microsoft refusing the sign-in does that
  - type: fix
    label: Abantu ababili manje bangabe nethegi enegama elifanayo; ngaphambili eyesibili yayihluleka ngephutha. Noma yimuphi umsebenzisi ongenile manje angaskena kabusha izindebe zakhe ze-RPCS3; ngaphambili kwakungumphathi kuphela, abanye babebona izindebe ezindala kuze kuqale kabusha i-RetroDB
    en: Two people can now each have a tag of the same name; before, the second one failed with an error. Any signed-in user can now rescan their own RPCS3 trophies; before, only an admin could, and everyone else saw old trophies until RetroDB restarted
  - type: security
    label: Ukungena kwakho kuhlala kuyimfihlo. Ama-backup edathabhesi awasafundeki ama-akhawunti amanye ekhompyutheni, futhi i-backup ehlulekile ayisasusi eyandulelayo. Ukususa noma ukuvala umsebenzisi kumphuma nakuma-RetroAchievements ku-DuckStation nase-PCSX2. Ukungena kwe-RetroAchievements okulondolozwe kumenyu yomdlali ngokwayo akusadluliseli komunye umuntu odlala ngokulandelayo. Amalogi namaphutha emisebenzi alondoloziwe afihla amathokheni e-RetroAchievements, iphutha le-PlayStation lelinye ilungu libonwa nguye kuphela, namafayela amadala okungena e-PlayStation ne-Xbox ayithekisthi evamile asuswa
    en: Your sign-ins stay private. Database backups can no longer be read by other accounts on the computer, and a failed backup no longer deletes the one before it. Deleting or switching off a user also signs them out of RetroAchievements in DuckStation and PCSX2. A RetroAchievements sign-in saved from the player's own menu no longer carries over to the next person who plays. Logs and saved job errors hide RetroAchievements tokens, another member's PlayStation error is shown only to them, and old plain-text PlayStation and Xbox sign-in files are removed
  - type: fix
    label: Ukuhlola kwe-RetroDB ngokwayo akusakwazi ukuthinta umtapo wakho ngenkathi kusebenza. Kusebenzisa njalo ikhophi yokulahla yedathabhesi, yezithombe nezilungiselelo, futhi kwenqaba ukuqala uma noma yikuphi kukhomba emafayeleni akhoangempela
    en: RetroDB's own checks can no longer touch your library while they run. They always use a throwaway copy of the database, pictures and settings, and refuse to start if any of them points at your real files
  - type: fix
    label: Clean orphaned files ayisasusi izithombe zoHlu Lwezifiso. Ukuvula umdlalo akusenzi uwukhohlwe imifanekiso-skrini engayitholi. Ngaphambili, uma idrayivu yezithombe ikhishiwe, wonke umdlalo owuvulile wawulahlekelwa uhlu lonke lwemifanekiso-skrini; manje uhlu luyagcinwa, futhi isithombe esingekho siyafihlwa kuphela
    en: Clean orphaned files no longer deletes your wishlist's pictures. Opening a game no longer makes it forget screenshots it cannot find. Before, with the picture drive unplugged, every game you opened lost its whole screenshot list; now the list is kept, and a missing picture is only hidden
  - type: fix
    label: Ukudawuniloda ividiyo noma incwadi yokusebenzisa okuhluleka maphakathi akusalimazi ikhophi umdlalo osenayo, futhi ukudawuniloda okuhlulekile akusashiyi ifayela eliyingxenye elifihlekile kufolda yemidiya. I-upscaler yangemuva ayisalondoloza isithombe esidala phezu kwesisha esidawunilodwe kamuva. Convert to WebP igcina yonke imidlalo abelana ngesithombe ikhomba kusona, futhi ayithinti ifayela elingaphandle kwamafolda ezithombe
    en: A video or manual download that fails part-way no longer damages the copy the game already had, and a failed download no longer leaves a hidden half-file in the media folder. The background upscaler no longer saves an old picture over a newer one downloaded meanwhile. Convert to WebP keeps every game that shares a picture pointing at it, and never touches a file outside the picture folders
  - type: fix
    label: Ukususa umdlalo noma into yoHlu Lwezifiso manje kususa nezithombe zayo, amavidiyo nezincwadi zokusebenzisa, kodwa kugcina noma yini omunye umdlalo noma into yohlu olusayisebenzisa. Izithombe ezilondoloziwe ziyafundeka kuma-akhawunti amanye ekhompyutheni futhi, futhi Resize Images ibala isithombe esingalondolozekanga njengesihlulekile, hhayi njengesiqediwe
    en: Deleting a game or a wishlist item now deletes its pictures, videos and manuals too, but keeps any another game or wishlist item still uses. Saved pictures can be read by other accounts on the computer again, and Resize Images counts a picture it could not save as failed, not as done
  - type: fix
    label: Duplicate Finder ayisalikhiphi ifayela elisebenzayo ukuze lisuswe. Uma ibheka ngegama, ayisabiza amakhophi omdlalo e-.cue ne-.bin njengamanye. Ayilikhiphi ifayela lethrekhi ledisk, ongabelwana ngalo izinguqulo ezimbili zomdlalo. Ngeke isuse idisk eshiwo uhlu lokudlala. Umdlalo osusa ifayela lawo manje uya kukhophi ogcinayo, ngakho uhlala emtapweni
    en: Duplicate Finder no longer offers a working file for deletion. Looking by name, it no longer calls a game's .cue and .bin copies of each other. It never offers a disc's track file, which two versions of a game can share. It will not delete a disc that a playlist lists. A game whose file you delete now moves to the copy you keep, so it stays in the library
  - type: fix
    label: Organize Multi-Disc ayisabhali phezu koluhlu lokudlala olukhona noma ifayela elisevele lisefolda yomdlalo; iyama ibike ukuthi kuyiphi. Uhlu lokudlala olwenzayo luhlu lwe-.cue yediski ngayinye, hhayi amafayela ethrekhi. Imidlalo esuswa amafayela ayo manje iwalandela efolda, ngakho Clean missing ROMs ayisayisusi
    en: Organize Multi-Disc no longer writes over an existing playlist or a file already in the game's folder; it stops and says which. The playlist it makes lists each disc's .cue, not its track files. Games whose files it moves now follow them into the folder, so Clean missing ROMs no longer removes them
  - type: fix
    label: Ukuguqulela ku-CHD nge-"delete originals" manje kususa namafayela ethrekhi edisk, kodwa kugcina ithrekhi esasetshenziswa enye i-.cue. Umdlalo noma uhlu lokudlala olwalubala idisk endala manje kukhomba ku-.chd entsha. Ukuqamba kabusha ifayela lomdlalo manje kuvuselela uhlu lokudlala olulibalayo, futhi ifayela lethrekhi elidingwa yi-.cue alinakuqanjwa kabusha. Ukususa amafayela ku-zip kususa kuphela owakhethile, naphezu kwegama elinoma ngu-[ noma ]. Screenshot Dedup isusa kuphela amakhophi etholwe yiskeni yayo, futhi igcina elilodwa njalo
    en: Converting to CHD with "delete originals" now deletes the disc's track files too, but keeps a track another .cue still uses. The game and any playlist that listed the old disc now point at the new .chd. Renaming a game's file now updates the playlist that lists it, and a track file a .cue needs cannot be renamed. Removing files from a zip removes only the files you picked, even when a name holds [ or ]. Screenshot Dedup deletes only the copies its scan found, and always keeps one
  - type: fix
    label: I-How Long to Beat ekhasini lomdlalo isesha lokho okuthayipha. Ngaphambili, isihloko esingatholakali sasenza isesha amanye amagama omdlalo, futhi lalingaphakamisa omunye umdlalo, njengokwenziwa kabusha ngabalandeli. Isazama amanye amagama uma ibhokisi linegama lomdlalo ngokwalo
    en: How Long to Beat on a game's page searches for what you type. Before, a title it could not find made it search the game's other names instead, and it could offer a different game, such as a fan remake. It still tries the other names when the box holds the game's own name
  - type: fix
    label: Izinyathelo ze-How Long to Beat encwadini yosizo ziyafana nesikrini. Zazithi khetha okufanayo ohlwini; ikhasi libonisa okukodwa kanye no-Londoloza no-Khansela. Usizo lwe-PlayStation alusasho ukuthi ukungena kuhlala cishe izinyanga ezimbili, ngoba i-RetroDB ingena futhi yodwa. Zonke izincwadi eziyi-20 ezihunyushiwe zinakho kokubili ushintsho
    en: The help manual's How Long to Beat steps match the screen. They said to pick a match from a list; the page shows one match with Save and Cancel. The PlayStation help no longer says the sign-in lasts about two months, since RetroDB signs in again by itself. All 20 translated manuals carry both changes
  - type: fix
    label: Ibha yezinhlamvu ngayinye manje iqala ngenkinobho ethi Konke. Emakhasini oMtapo, e-console nezindebe ze-PSN, ukukhetha uhlamvu kubonisa imidlalo yalo kuphela, futhi ngaphambili bekungekho nkinobho yokubuyisa abanye. Emakhasini amanye ezimpumelelo, Konke kubuyela emdlalweni wokuqala
    en: Every letter bar now starts with an All button. On the Library, console and PSN Trophies pages, picking a letter shows only that letter's games, and before there was no button to bring the rest back. On the other achievement pages, All goes back to the first game
  - type: fix
    label: Ithokheni entsha yokungena ye-PlayStation oyincikile Ezilungiselelweni manje isetshenziswa ngokushesha. Ngaphambili, i-RetroDB yayisasebenzisa ukungena okudala kuze kuphele, futhi Save & Test Connection yayibika lokho kungena okudala kusebenza. Ithokheni i-Sony ayinqabayo ayisafaki esikhundleni sesisebenzayo
    en: A new PlayStation sign-in token you paste in Settings is now used straight away. Before, RetroDB kept using the old sign-in until it ran out, and Save & Test Connection reported that old sign-in as working. A token Sony refuses no longer replaces one that works
  - type: enhancement
    label: 'Ukungena kwe-PlayStation Ezilungiselelweni kulula ukukugcina kuqhubeka. Ibhanela ayisabali izinsuku ongazange udinge ukwenza lutho kuzo, ngoba i-RetroDB ingena futhi yodwa; iba bomvu kuphela uma i-Sony inqaba ithokheni yakho elondoloziwe. Inkinobho ethi Paste here ayisenzi isiphequluli sicele ukufunda i-clipboard yakho: ibeka isikhombi ebhokisini ukuze usebenzise i-Ctrl+V. Izinyathelo manje zithi phuma ku-PlayStation kuqala uma ushintsha ithokheni esasebenza, futhi imilayezo yazo ingahunyushwa'
    en: 'The PlayStation sign-in in Settings is easier to keep going. The banner no longer counts down days you never had to act on, because RetroDB signs in again by itself; it turns red only when Sony refuses your saved token. The Paste here button no longer makes the browser ask to read your clipboard: it puts the cursor in the box for Ctrl+V. The steps now say to sign out of PlayStation first when you replace a token that still works, and their messages can be translated'
  - type: enhancement
    label: Imilayezo ye-pop-up namabhokisiemibuzo, njengokuthi "Settings saved" noma "Delete this list?", manje ingahunyushwa kuwo wonke amakhasi. Ngaphambili iningi lalihlala lisesiNgisini noma ikuphi ulimi olukhethile
    en: Pop-up messages and question boxes, such as "Settings saved" or "Delete this list?", can now be translated on every page. Before, most of them stayed in English whatever language you chose
  - type: enhancement
    label: Imilayezo echaza ukuthi kungani ukungena kwe-PlayStation kuhlulekile, njengokuthi "Your NPSSO may have expired", manje ingahunyushwa
    en: The messages that say why a PlayStation sign-in failed, such as "Your NPSSO may have expired", can now be translated
  - type: fix
    label: Incwadi yosizo ngolimi ngalunye manje iyafana neyesiNgisi. Ithola Search Anywhere, Keeping a Title, MAME Names nomhlane webhokisi, futhi izigaba ezindala ebezisalele manje ziyabuyekezwa
    en: The help manual in every language now matches the English one. It gains Search Anywhere, Keeping a Title, MAME Names and the back of the box, and older paragraphs that had fallen behind are up to date
  - type: fix
    label: NgesiJalimane, i-Afrikaans nesiSpanishi, inkinobho ethi Emuva ekhava yomdlalo manje ithi umhlane webhokisi, hhayi "buyela emuva"
    en: In German, Afrikaans and Spanish, the Back button on a game's cover now says the back of the box, not "go back"
  - type: feature
    label: Ukucindezela Dlala manje kugcwalisa isikrini ngelogo yomdlalo phezu kwesithombe sawo sangemuva ngenkathi umdlalo uqala, noma igama lawo ngezinhlamvu ezinkulu uma ingenalo ilogo. Iyanyamalala yodwa lapho iwindi lomdlalo livuleka, noma uma ucindezela u-Esc noma ucofa
    en: Pressing Play now fills the screen with the game's logo on its background picture while the game starts, or its name in large letters when it has no logo. It goes away by itself when the game's window opens, or when you press Esc or click
  - type: feature
    label: 'Ibhokisi le-3D elijikayo manje linesimo sangempela sesibhamu se-PS5: amakhona nemiphetho ethambile, umphetho ophakeme ozungeze ikhava, umugqa lapho uhhafu ababili behlangana, nomgodi weminwe ohlangothini oluvulekayo. Idinga ifayela lebhokisi elivela enguqulweni ye-Slipcase ebhala isimo; ngenisa ibhokisi futhi ukuzeuthole. Amanye amabhokisi abukeka njengakuqala'
    en: 'The turnable 3D box now has the real shape of a PS5 case: rounded corners and edges, the raised lip round the cover, the line where the two halves meet, and the finger slot in the opening side. It needs a box file from a Slipcase version that writes the shape; import the box again to get it. Other boxes look as before'
  - type: enhancement
    label: Refresh RetroAchievements isuswe Ezilungiselelweni yayiswa ekhasini le-RetroAchievements, futhi manje ibizwa ngokuthi Find Games with Achievements. Inkinobho ngayinye lapho manje inomugqa osho ukuthi yenzani, ukuze Find Games ne-Sync Progress zihlukaniseke kalula. Uma kungekho midlalo exhunyiwe okwamanje, ikhasi libonisa umphathi inkinobho ethi Find esikhundleni sokuya kuthebhu elandelayo
    en: Refresh RetroAchievements moved from Settings to the RetroAchievements page, and is now called Find Games with Achievements. Every button there now has a line saying what it does, so Find Games and Sync Progress are easy to tell apart. With no games linked yet, the page shows an admin the Find button instead of moving on to the next tab
  body: "<ul>\n  <li><strong>4.0 iyinguqulo enkulu yokugcina ye-RetroDB esebenza kuwebhu.</strong> Izinguqulo ezintsha zizoba uhlelo lwasekhompyutheni lwe-Windows, Linux ne-macOS, kanye nohlelo lwe-Android, futhi zizovula umtapo wakho okhona. Inguqulo yewebhu ihlala itholakala futhi isathola izixazululo zeziphazamisi, kanti ngezinye izikhathi nesici esisha. Izilungiselelo → Izibuyekezo zixhumanisa nohlelo lwasekhompyutheni uma selufikile.</li>\n  <li><strong>Incwadi Yokusebenzisa yosizo isesikhathini ngezilimi zonke.</strong>\n    Izingxenye ebezikhona kuphela encwadini yesiNgisi manje sezihunyushiwe.</li>\n</ul>\n"
  body_en: "<ul>\n  <li><strong>4.0 is the last big web version of RetroDB.</strong> New versions\n    will be a desktop app for Windows, Linux and macOS, and an Android app,\n    and will open your existing library. The web version stays available\n    and still gets bug fixes, and now and then a new feature.\n    Settings → Updates links to the desktop app when it is out.</li>\n  <li><strong>The help manual is up to date in every language.</strong>\n    Sections that were only in the English manual are now translated.</li>\n</ul>\n"
- version: 3.35.4
  date: '2026-11-03'
  tags:
  - type: fix
    label: Isithombe-skrini oyisusa kumdlalo manje sihlala sisusiwe. Ngaphambili, ukuscrapha okulandelayo kwakungasikopishela emuva kusuka ku-ES-DE noma kusidawunilodele futhi kusuka emthonjeni we-inthanethi. Ukususa ikhophi eyeqile ethuluzini le-Duplicate Screenshots akubalwa, ngobaugcina isithombe kanye.
  - type: feature
    label: 'Imidlalo manje iyatholakala nelogo yayo: ukuscrapha kuyilondoloza kusuka ku-ES-DE, ScreenScraper, TheGamesDB, IGDB ne-Steam, futhi ikhasi lomdlalo liyibonisa ngenhla kwesihloko, noma esikhundleni sebhokisi elingekho. Ungalayisha noma wesuse ilogo efasiteleni le-Hlela. Enza ukuscrapha ngobuningi nge-Fill Missing ukuze ugcwalise amalogo emidlalo oyiscraphe ngaphambili'
  - type: fix
    label: I-IGDB ayisayinikezi umdlalo ilogo yawo njengesizinda sekhasi
  - type: feature
    label: 'Imidlalo manje iyatholakala nangemuva lebhokisi layo: ukuscrapha kuyalilondoloza kusuka ku-ES-DE, ScreenScraper ne-TheGamesDB, futhi inkinobho ethi Back esibekweni sekhasi lomdlalo iyalibonisa. Chofoza ngemuva ukuze ulikhulise. Ungalayisha noma ususe ingemuva efasiteleni le-Hlela. Amabhokisi angemuva agcwala uma umdlalo uscraphwa; i-Fill Missing ayiphindi iscraphe umdlalo ngenxa yengemuva kuphela'
  - type: fix
    label: Umdlalo ongenasembozo sangaphambili ku-TheGamesDB awusathola ingemuva lebhokisi njengesembozo sawo
  - type: fix
    label: Uma uvala i-scraper ku-Izilungiselelo ngenkathi kuqhubeka ukuscrapha ngobuningi, inani lemidlalo engatholakalanga manje liyalungile kusukela emdlalweni olandelayo. Ngaphambili, umdlalo wawungabalwa njengomiswe esikhundleni salokho
  - type: enhancement
    label: Esistimini engenayo i-emulator elungiselelwe, inkinobho ethi Dlala iyimpunga. Yikhomba ukuze ubone isizathu, noma uyichofoze ukuze ubone ibhokisi elithi ayikho i-emulator elungiselelwe. Ngaphambili, umugqa wombhalo wawuhlala eceleni kwenkinobho
  body: "<ul>\n  <li><strong>Imidlalo itholakala nelogo yayo.</strong> Ukuscrapha kulondoloza\n    ilogo yomdlalo ngamunye, futhi ikhasi lomdlalo liyibonisa ngenhla kwesihloko, noma esikhundleni\n    sebhokisi elingekho. Enza ukuscrapha ngobuningi nge-Fill Missing ukuze ugcwalise amalogo\n    emidlalo oyiscraphe ngaphambili.</li>\n  <li><strong>Imidlalo itholakala nangemuva lebhokisi layo.</strong> Inkinobho ethi Back\n    esibekweni sekhasi lomdlalo iyalibonisa, futhi ungalichofoza ukuze ulikhulise. Amabhokisi angemuva\n    agcwala uma umdlalo uscraphwa.</li>\n  <li><strong>Isithombe-skrini esisusiwe sihlala sisusiwe.</strong> Ukuscrapha okulandelayo\n    akusasikopishi emuva noma ukusidawunilodela futhi.</li>\n  <li><strong>Dlala ichaza ukuthi kungani ingeke iqale.</strong> Esistimini engenayo\n    i-emulator elungiselelwe, inkinobho ethi Dlala iyimpunga futhi ichaza isizathu.</li>\n</ul>\n"
- version: 3.35.3
  date: '2026-11-02'
  tags:
  - type: feature
    label: 'Ithuluzi elisha le-MAME Names ku-ROM Tools: imidlalo ye-MAME ithola amagama ayo angempela, iminyaka nabakhiqizi kuhlu lwe-MAME uqobo, namafayela agcina amagama awo amafushane. Ukuscrapha kuyabe sekuthola umdlalo ngamunye, futhiungahlunga uhlu lwe-MAME ngesigaba, njengokushiya izinhlobo zemishini yezinhlamvu. Amasethi e-BIOS afihlwa ohlwini'
  - type: fix
    label: I-ROM Reports ayisakuphakamisi ukuqamba kabusha amafayela e-MAME, ngoba ifayela eliqanjwe kabusha liyayeka ukusebenza ku-MAME
  - type: fix
    label: Izilungiselelo manje zisho ukuthi iMicrosoft icela ini ngaphambi kokuba i-app ye-Xbox ibhaliswe. Ukungena ngemvume kwe-Xbox kwakungeke kuhlolwe ngenxa yalokhu
  - type: enhancement
    label: Ikhadi elihlukile le-Official Names alisekho ku-Bulk AI Fill, ngoba iswishi ye-Official name yokugcwalisa seyenza lo msebenzi
  - type: fix
    label: Uma iSony inqabela ukungena ngemvume kwe-PlayStation okulondoloziwe, ideshibhodi ne-Izilungiselelo manje kuyakusho futhi kukucele ukuthi uphinde uxhume. Ngaphambili, i-log yayibonisa iphutha elingenamqondo ekuqaleni kwenkonzo ngayinye, futhi akukho okwakukutshela
  - type: feature
    label: Ukungenisa kusuka ku-Steam manje kugcwalisa incazelo yomdlalo ngamunye, abadali, isikolo se-Metacritic, izilinganiso zeminyaka, izindlela zokudlala, ibhokisi, injulalwazi nemifanekiso-skrini ekhasini lawo lesitolo, ngemuva. Scrapha umdlalo ukuze uthole uhlobo nedethi yokukhishwa
  - type: feature
    label: Ukuvumelanisa kwe-Steam manje kugcina isikhathi osidlale ngaso nokuthi wawudlale nini kokugcina, futhi ikhasi lomdlalo liyakubonisa
  - type: fix
    label: Fetch Library ekhasini lokungenisa le-Steam manje isebenza kumlawuli onokhiye we-Steam olondoloziwe. Ngaphambili, yayithumela ku-Steam uhlobo olufihliwe lukakhiye, futhi ikhasi lalisho ngephutha ukuthi misa iphrofayela yakho ibe yi-Public
  - type: fix
    label: Umdlalo we-Steam noma we-Xbox osuvele usemtapweni wakho onegama elifanayo manje uxhumeka kuleyo mdlalo uma uwungenisa, ukuze izimpumelelo zawo zivumelanise. Ngaphambili, wawweqiwa futhiungaxhunywa
  - type: fix
    label: Imidlalo engeniswe kusuka ku-Steam, Xbox ne-PlayStation manje ihlelwa kahle masinyane, njenge-Final Fantasy IX ngaphambi kwe-Final Fantasy X, futhi izimpawu zomkhiqizo ze-Steam zishiywa emagameni abo
  - type: feature
    label: Ezistimini lapho i-RetroAchievements isebenzisa i-hash yefayela elula, njenge-Mega Drive ne-Game Boy, ikhasi lomdlalo lisho ukuthi ikhophi yakho iyawathola yini amaphuzu ezimpumelelo, futhi leyo hash ixhuma umdlalo ofanele. Sebenzisa i-RA Refresh ukuze ugcwalise lokhu
  - type: fix
    label: Ukuscrapha manje kubuza i-ScreenScraper ngefayela lakho ngqo ngaphambi kokusesha ngegama, ukuze kuthole umdlalo wakho hhayi omunye onegama elifanayo. Imiphumela oyikhethela wena isaphumelela
  - type: enhancement
    label: Ibhokisi eliqhubekayo le-Image Resize manje liyaqamba umdlalo nesistimu esithombeni ngasinye
  - type: feature
    label: Ukuscrapha manje kuletha izithombe zesihloko ezivela ku-ScreenScraper naku-TheGamesDB, amagama asemthethweni amaningi avela ku-IGDB naku-TheGamesDB (njengegama lomdlalo lesiJapane), nezinye ii-console umdlalo osukhishwe kuzo ezivela ku-IGDB
  - type: feature
    label: Umdlalo ongenaso isikolo somdlali manje uthatha isilinganiso esiqoqweni lakho le-ES-DE, uma sinaso
  - type: feature
    label: Ikhasi lomdlalo lisho ukuthi bangaki abadlali abalinganisele isikhathi somphumela we-HowLongToBeat futhi lixhuma ekhasini lawo. Imiphumela elondolozwe ngaphambili izobonisa lokhu ngokuzayo uma uyisesha
  - type: feature
    label: Ikhasi le-RetroAchievements libonisa ukuthi bangaki abadlala umdlalo nokuthi yisingaki isabelo sabo esithole isimpumelelo ngasinye
  - type: fix
    label: Isiphequluli sezikhwama se-ROM Tools sivulela efolda yakho ye-ROM uma singenayo efolda yokuqala, esikhundleni sokwehluleka. Impendulo eyonakele ye-IGDB manje iyabiza ulwazi olulodwa kuphela, hhayi konke okuthunyelwe yi-IGDB ngomdlalo
  - type: fix
    label: Umkhawulo wansuku zonke we-ScreenScraper manje wenza i-RetroDB iyeke ukubuza kuze kube ngemuva kwesikhathi, futhi ukuscrapha ngobuningi kuyakusho bese kuqhubeka nezinye izinsiza zakho. Ngaphambili, umkhawulo osetshenzisiwe wawubukeka sengathi "umdlalo awutholakali" futhi izicelo zaziqhubeka ubusuku bonke
  - type: fix
    label: Umdlalo ongaphendulwanga yinsiza lapho isevisi ifinyelele umkhawulo awusamaka njengoscraphiwe, ngakho ukusebenza okulandelayo kuzowuzama futhi
  - type: fix
    label: Uma ukhiye we-TheGamesDB usebenzise inyanga yawo, i-RetroDB iyaya kukhiye wakho omunye, futhi iyeka ukubuza uma bobabili sebeqediwe
  - type: fix
    label: Umkhawulo wanyanga zonke we-RAWG manje nawo wenza i-RetroDB iyeke ukubuza, futhi i-IGDB igcinwa emkhawulweni wayo wezicelo ezine ngesekhondi
  - type: fix
    label: Ukusesha ngobuningi kwe-HowLongToBeat manje kuphela ngomyalezo uma isayithi lisho ukuthi lithole izicelo eziningi kakhulu, futhi zonke izicelo ezisayithini zihlukaniswa isikhathi
  - type: fix
    label: I-Lungisa Izifunda Zebhokisi Nencwadi Yokusebenzisa ayisayeki ngemuva kwemidlalo engu-25 olandelanayo i-ScreenScraper engayaziyo. Iyeka kuphela uma i-ScreenScraper isho ukuthi umkhawulo wayo ufinyelelwe
  - type: fix
    label: Ekhasini lomdlalo, isilinganiso seminyaka ngasinye manje sihlala maphakathi ngenhla kwelebula yaso lesiqagelo se-AI
  - type: fix
    label: Isabelo se-TheGamesDB ku-Izilungiselelo manje sisebenzisa ukuhlola okungasebenzisi isabelo sakho, futhi asisabonisi idethi yokusetha kabusha eqanjiwe uma isevisi ingayinikezi
  body: |
    <ul>
      <li><strong>Imidlalo ye-MAME ithola amagama ayoeqiniso.</strong>Ithuluzi elisha le-MAME Names
        ku-ROM Tools lithatha amagama, iminyaka nabakhiqiziohlwini lwe-MAME uqobo.
        Amafayela agcina amagama awo amafushane, ngoba i-MAME iyawadinga.Ungakwazi
        ukuhlunga uhlu lwe-MAME ngesigaba, futhi amasethi e-BIOS ayafihlwa.</li>
      <li><strong>Ukungenisa kwe-Steam kuletha okuningi kakhulu.</strong> Umdlalo ngamunye ugcwalisa
        incazelo yawo, abasebenzile, amaphuzu e-Metacritic, izilinganiso zeminyaka, izindlela zokudlala nezithombe
        ezivela ekhasini lawo esitolo. Ukuvumelanisa kugcina isikhathi sakho sokudlala nokuthi
        udlale nini ngokugcina. Umdlalo osuvele ukumtapo wakho onegama elifanayo manje
        uyaxhumeka kuwo, ngakho izimpumelelo zawo ziyavumelana.</li>
      <li><strong>Ukuscrapha kuthola umdlalo wakho oqondile.</strong> Ukuscrapha kubuza
        i-ScreenScraper ngefayela lakho oqondile ngaphambi kokusesha ngegama. Ukuscrapha
        futhi kuletha izikrini zesihloko, amagama asemthethweni amaningi, nezinye
        i-console umdlalo owakhishwe kuzo.</li>
      <li><strong>I-RetroAchievements iyayazi ikhophi yakho.</strong> Ezistimini
        ezisebenzisa i-hash yefayela elula, njenge-Mega Drive ne-Game Boy, ikhasi lomdlalo
        lithi ingabe ikhophi yakho iyazuza izimpumelelo yini. Qalisa i-RA Refresh ukuze lokhu
        kugcwale. Ikhasi le-RetroAchievements liphinde libonise ukuthi bangaki abantu abadlala umdlalo
        nokuthi yiliphi iphesenti labo elizuze impumelelo ngayinye.</li>
      <li><strong>Imikhawulo ye-inthanethi iyahlonishwa.</strong> Uma i-ScreenScraper,
        i-TheGamesDB noma i-RAWG ifinyelela umkhawulo wayo, i-RetroDB iyayeka ukubuza kuze kube kamuva
        futhi ukuscrapha ngobuningi kuyaqhubeka ngezinye izinsiza zako. Umdlalo ongaphendulwanga
        yinoma iyiphi insiza ngaleso sikhathi uzanywa futhi ekuqaleni okulandelayo.</li>
      <li><strong>Ukungena kwe-PlayStation okwenqatshiwe kuyasho.</strong> Ideshibhodi
        ne-Izilungiselelo manje kukucela ukuthi uphinde uxhume uma i-Sony inqaba
        ukungena okulondoloziwe.</li>
      <li><strong>I-Official Names isihambile.</strong> Ikhadi layo elihlukile alisekho
        ku-Bulk AI Fill, ngoba iswishi ye-Official name ekugcwaliseni yenza
        umsebenziofanayo.</li>
    </ul>
