    <ul>
      <li><strong>I-RetroDB iyazibuyekeza.</strong> Uma kuphuma inguqulo
        entsha, abalawuli bayayibona kudeshibhodi naku-Izilungiselelo &gt;
        Isistimu &gt; Izibuyekezo, kanye nalokho okusha. Okuthi Dawuniloda
        isibuyekezo kuyayilanda futhi kuhlole ukuthi iyifayela elishicilelwe
        ngqo; okuthi Faka bese uqala kabusha kwenza ikhophi yesipele
        ye-database yakho, kufake inguqulo entsha endaweni yayo bese kuqala
        kabusha. Uma inguqulo entsha ingaqali, i-RetroDB ibuyela kwendala
        ngokwayo futhi isho isizathu. Imidlalo yakho, izilungiselelo,
        izithombe namalogi akuthintwa. I-RetroDB ihlola izibuyekezo kanye
        ngosuku; ungakuvala lokho. Ikhophi eqhutshwa kusuka ku-git, noma
        ngumphathi wezinqubo, iyatshelwa ngezibuyekezo kodwa
        ayibuyekezwa.</li>
      <li><strong>Thola i-RetroArch ngaphakathi ku-RetroDB.</strong>
        Izilungiselelo &gt; Ama-emulator inesigaba esisha esithi Dlala
        ku-RetroDB. Cindezela okuthi Thola i-RetroArch bese i-RetroDB
        idawuniloda i-RetroArch esemthethweni ku-libretro, ihlole ukuthi
        okudawunilodiwe kuyifayela elilindelwe ngqo, futhi iyisethe
        njenge-RetroArch (RetroDB), inezilungiselelo zayo nokulondoloza
        kwayo, kuhlukaniswe nanoma iyiphi i-RetroArch osuvele uyisebenzisa.
        Bese ilanda i-core engcono kakhulu yesistimu ngayinye okokuqala uma
        udlala. Isebenza ku-Linux naku-Windows; i-macOS ayikahlolwa.</li>
      <li><strong>Idiski elandelayo iyasebenza emidlalweni edlalwa
        ku-RetroDB.</strong> Emdlalweni onamadiski amaningi inkinobho ethi
        Idiski elandelayo manje ifinyelela ku-RetroArch ye-RetroDB uqobo
        ngaphandle kokusetha lutho. I-RetroArch ilalela imiyalo ye-RetroDB
        kuphela ngesikhathi umdlalo onjalo uqhubeka, futhi ku-Windows
        naku-macOS ngesikhathi noma imuphi umdlalo uqhubeka.</li>
      <li><strong>Amakhadi emidlalo ayahleleka kufoni nangemva kokushintsha
        usayizi wewindi.</strong> Kufoni amakhasi oMtapo nawekhonsoli
        ayebonisa ikhadi elilodwa bese kuba nesikhala eside esingenalutho;
        manje amakhadi abekwa elinye ngaphansi kwelinye. Ukwenza iwindi libe
        lincane noma libe libanzi kuhlela amakhadi kabusha esikhundleni
        sokuwashiya kumakholomu amadala.</li>
      <li><strong>Izilinganiso nenani labadlali okuscraphiwe kunembe
        kakhudlwana.</strong> Izilinganiso zeminyaka ezivela ku-IGDB
        ze-CERO, USK, GRAC, ClassInd ne-ACB manje zifundwa kahle, ngakho
        umdlalo olinganiswe nge-CERO Z noma i-USK 18 uthola leso
        silinganiso. I-TheGamesDB, i-RAWG, i-IGDB ne-ES-DE azisaqageli
        "umdlali o-1" uma zingazi; ukungenisa kwe-ES-DE akusabhali ngaphezu
        kwenani labadlali noma amamodi omdlalo owasethile. I-TheGamesDB
        ayisalondolozi inombolo esikhundleni segama lomshicileli noma
        lomthuthukisi ngemva kokubheka okwehlulekile.</li>
      <li><strong>I-ScreenScraper igcina imininingwane yayo uma ingumthombo
        omkhulu.</strong> Isihloko sayo, incazelo, usuku, umthuthukisi,
        umshicileli nabadlali kuyagcinwa kukho konke ukuscrapha, hhayi nje
        emizuzwini embalwa yokuqala ngemva kokusesha. Amavidiyo nezincwadi
        zemiyalelo ezidawunilodiwe kuthola igama lefayela elifanele.</li>
      <li><strong>Ukusula idatha escraphiwe kubuyisela igama lefayela
        njengesihloko.</strong> Kwakusula imininingwane kodwa kushiye
        isihloko esiscraphiwe.</li>
      <li><strong>Ukuvuselela i-RetroAchievements kwekhonsoli eyodwa
        kuyasebenza futhi.</strong> Kwakwehluleka ngephutha njalo.</li>
      <li><strong>Isithungathi semifanekiso-skrini ephindiwe siyasebenza
        ku-app edawunilodiwe.</strong> Sasingatholi mifanekiso-skrini lapho,
        futhi ukususa okuphindiwe kwakushiya ifayela kudiski.</li>
      <li><strong>Amaphasiwedi e-ScreenScraper ayafihlwa, futhi umlawuli
        wokugcina uhlala engumlawuli.</strong> Izilungiselelo manje zibonisa
        amaphasiwedi akho e-ScreenScraper efihliwe, njengabanye okhiye
        bakho. I-akhawunti okuwukuphela komlawuli ayisakwazi ukushintshelwa
        kumhleli noma ivalwe, okwakuzoshiya kungekho muntu ongaphatha
        i-RetroDB.</li>
      <li><strong>Imisebenzi ephazamisekile inikezwa kuphela abantu
        abavunyelwe ukuyiqhuba.</strong> Ibhena yemisebenzi ephazamisekile
        kudeshibhodi manje ibonisa umsebenzi kuphela kumuntu ovunyelwe
        ukuwuqala, isibonelo ukuscrapha okuyisixuku kuphela kubahleli
        nabalawuli. Amanye ama-akhawunti awasayiboni futhi awasakwazi
        ukuyivala.</li>
      <li><strong>Amalogo ekhonsoli angenisiwe, amagama angajwayelekile
        ku-Izilungiselelo namadiski ebhonasi.</strong> Ku-app edawunilodiwe,
        ukuvuselela amalogo manje kuthola amalogo ekhonsoli angeniswe
        ngokungenisa kusuka ku-ES-DE, futhi kuwakhetha kunalawo akhelwe
        ngaphakathi. Igama lesilawuli, lekhonsoli noma lesipele
        elinezinhlamvu ezinjengo-&lt; noma uphawu lokucaphuna alisaphuli
        ikhasi lezilungiselelo. Ukususa umaki kudiski yebhonasi
        kuyayihlukanisa ngokuphelele, ngakho ayisabalwa njengediski
        yebhonasi yomdlalo wayo omdala.</li>
      <li><strong>Izindondo, ukungeniswa komtapo namathuluzi okunakekela
        asheshayo.</strong> Ikhasi leZindondo, ukungeniswa komtapo we-Steam,
        we-Xbox nowe-PlayStation, izindondo zomqoqi, ukubala isitoreji
        nokuskena imidiya engasetshenziswa konke kwenza umsebenzi omncane
        kakhulu emtapweni omkhulu. Amawindi abonisa inqubekela phambili
        yomsebenzi aqhubeka ebuyekezeka uma iseva imatasa, futhi imisebenzi
        ye-HowLongToBeat neyezihloko ezinye ayisabambezeli ezinye izinguquko
        ngesikhathi iqhubeka.</li>
      <li><strong>Bona ukuthi umdlalo ngamunye we-PS3 uhamba kahle
        kangakanani ku-RPCS3.</strong> Imidlalo ye-PS3 eMtapweni, ekhasini
        le-PlayStation 3 nasekhasini lomdlalo ibonisa isimo sokuhambisana
        se-RPCS3: Uyadlaleka, Emdlalweni, Isingeniso, Uyalayisheka noma
        Akukho lutho, kanye nosuku egcine ngalo ukuhlolwa. I-RetroDB
        isifunda ku-RPCS3 esekhompyutheni yakho, ngakho ku-RPCS3 khetha
        Manage &gt; Databases &gt; Download Compatibility Database kanye,
        nanoma nini lapho ufuna imiphumela emisha. Kuboniswa kuphela
        imidlalo ene-ROM kudiski; imidlalo engenisiwe ayiboniswa. I-RetroDB
        manje iphinde ifunde i-ID yomdlalo ye-PSN namafolda emidlalo
        efakiwe, kanye namafolda namafayela anegama eliyiphethe,
        njenge-[BLUS30443].</li>
      <li><strong>Izibalo zokuthengisa zemidlalo yakho.</strong> Uma i-AI
        igcwalisa izikhala ngesikhathi sokuscrapha, nalapho ucindezela
        okuthi Ukugcwalisa nge-AI, manje iphinde ibuzwe ukuthi mangaki
        amakhophi omdlalo athengiswe kukhonsoli yawo, ngokwezibalo
        ezishicilelwe zamahhala ezifana nemibiko yomshicileli, uhlu
        lwezithengiswa kakhulu zepulatifomu, i-Famitsu, i-Wikipedia
        ne-VGChartz. Ikhasi lomdlalo libonisa inani. Umdlalo ongenaso
        isibalo esishicilelwe uhlala ungenalutho esikhundleni sokuthola
        ukuqagela.</li>
      <li><strong>Iswishi ye-franchise / Uchungechunge iyasebenza ekhasini
        lomdlalo.</strong> Ewindini lokuhlela lekhasi lomdlalo, ukuchofoza
        iswishi ye-franchise / Uchungechunge yomdlalo omakwe njengo-Ezimele
        kwakungenzi lutho, ngakho wawungeke ufakwe ochungechungeni. Manje
        iyashintsha, futhi neswishi yoKutholakala Kwepulatifomu
        iyashintsha.</li>
      <li><strong>Yonke ithebhu yeZimpumelelo inobubanzi obufanayo.</strong>
        I-RetroAchievements, i-RPCS3, i-PSN, i-Steam ne-Xbox ngayinye
        yayilinganisa ikhasi ngokwamakhadi ayo, ngakho ikhasi lalishintsha
        ububanzi njengoba uhamba phakathi kwamathebhu. Manje zabelana
        ngobubanzi obubodwa.</li>
      <li><strong>I-RetroDB ithola izilungiselelo ze-RPCS3 ku-Windows
        naku-macOS.</strong> Ku-Windows i-RPCS3 igcina izilungiselelo zayo
        eceleni kwe-rpcs3.exe, futhi i-RetroDB manje ibheka lapho
        nasefoldeni ephathekayo, ngakho izilungiselelo zomdlalo ngamunye
        nohlu lokuhambisana kuyatholakala.</li>
      <li><strong>Ukugcwalisa nge-AI kuyasebenza emidlalweni enamaphuzu
        kodwa engenaso isilinganiso seminyaka.</strong> Ukugcwalisa nge-AI
        kwakungehluleka ngephutha komdlalo onjalo ngesikhathi kuthola
        isilinganiso seminyaka sawo.</li>
      <li><strong>Amalebula amakhadi emidlalo alandela ulimi
        lwakho.</strong> Isimo sokuqeda namathiphu amaphuzu emakhadini
        oMtapo kwakuhlala kusesiNgisini.</li>
      <li><strong>Izinsuku zokukhishwa zesifunda ngasinye.</strong> Uma i-AI
        igcwalisa izikhala ngesikhathi sokuscrapha, nalapho ucindezela
        okuthi Ukugcwalisa nge-AI, manje iphinde ibuzwe usuku umdlalo
        owaphuma ngalo esifundeni ngasinye, njengeNyakatho Melika, iYurophu
        neJapane. Ikhasi lomdlalo nokubuka okusheshayo kuyazibala, esokuqala
        kuqala, nezinsuku namagama ezifunda ngolimi lwakho. Usuku
        lokukhishwa lomdlalo uqobo aluguquki.</li>
      <li><strong>Umdlalo odlule nolandelayo ekhasini lomdlalo.</strong>
        Eceleni kwendlela ephezulu yekhasi lomdlalo kunezixhumanisi ezithi
        Okwangaphambilini nethi Okulandelayo kanye nendawo umdlalo okuyo
        ohlwini. Zilandela ikhasi ovela kulo: uma livulwe eMtapweni zihamba
        eMtapweni, futhi kusuka ekhasini lekhonsoli zihamba kuleyo khonsoli,
        ngokuhleleka okufanayo nangezihlungi nokusesha okufanayo obunakho
        lapho.</li>
      <li><strong>Amakhava nemifanekiso-skrini elayishiwe kuphathwa
        njengokuscraphiwe.</strong> Ikhava, ibhokisi le-3D noma
        umfanekiso-skrini owulayisha ewindini lokuhlela manje ulondolozwa
        ngefomethi yesithombe efanayo neyezithombe eziscraphiwe, ushintshwe
        usayizi ufane, futhi amakhava athola amakhophi amancane
        asetshenziswa uMtapo. Umfanekiso-skrini obukeka ufana nomunye
        umdlalo osunawo awengezwa, futhi uyatshelwa ukuthi mingaki eshiywe
        ngaphandle. Ukulayisha ikhava entsha kuphinde kususe ifayela
        elithathelwa indawo yilo.</li>
      <li><strong>I-RetroAchievements iyavela ekhasini lomdlalo kuyo yonke
        imidlalo enayo.</strong> Eminye imidlalo yayinebheji ye-RA eMtapweni
        kodwa ingenalo ikhadi le-RetroAchievements ekhasini layo,
        njenge-Metroid Prime ne-Metroid Prime 2 ku-GameCube. Ikhasi manje
        lisebenzisa isixhumanisi se-RetroAchievements esifanayo nesebheji,
        futhi lilayisha ngokushesha ngoba alisabuzi i-RetroAchievements
        njalo.</li>
      <li><strong>Inani elingascraphiwe ekhasini leZistimu liyafana
        nesihlungi esithi Okungascraphiwe.</strong> Inani lalifaka amadiski
        ebhonasi, angaboniswa neze ohlwini lwemidlalo yekhonsoli, ngakho
        ikhonsoli yayingathi ezi-2 azikascraphwa kanti isihlungi sayo esithi
        Okungascraphiwe singabonisi lutho.</li>
      <li><strong>Amakhasi oMtapo nesistimu ayabuyekezeka ngokushesha
        ngesikhathi sokuscrapha okuyisixuku.</strong> Ikhadi lomdlalo
        ngamunye liyavuselelwa ngokushesha nje uma liscraphiwe, noma iwindi
        lokuscrapha okuyisixuku livuliwe, livaliwe noma liqhubeka
        ngemuva.</li>
      <li><strong>Ukugcwalisa nge-AI kunika umdlalo ngamunye igama lawo
        elisemthethweni.</strong> Uma i-AI igcwalisa izikhala, ekuscraphweni
        komdlalo owodwa, ekuscraphweni okuyisixuku nangenkinobho ethi
        Ukugcwalisa nge-AI, iphinde isho isihloko esisemthethweni somdlalo
        njengoba wakhishwa esifundeni se-ROM yawo, futhi umdlalo uqanjwa
        kabusha ngaso. Igama elidala ligcinwa njengesihloko esinye. Isihloko
        ozibhalele sona noma osamukele ku-Amagama Asemthethweni asisoze
        saqanjwa kabusha.</li>
      <li><strong>Amagama Asemthethweni aphinde aphakamisa amagama.</strong>
        Nge-OpenAI, futhi ngezinye izikhathi nge-Gemini, izimpendulo ze-AI
        zazingafundeki, ngakho ukuqhuba kwakuphela kungekho magama
        aphakanyisiwe.</li>
      <li><strong>Imithombo iseshwa kuphela ezistimini ezifakiwe
        kuyo.</strong> I-RAWG ayinayo imidlalo ye-Intellivision, ngakho
        ayisaseshwa kuyo; ngaphambili yayithola imidlalo yamanye
        amapulatifomu esikhundleni salokho. I-IGDB, i-TheGamesDB ne-RAWG
        manje zihlala zisesha kusistimu yomdlalo uqobo. Izixhumanisi
        eziningana zamapulatifomu e-RAWG ezazingalungile nazo zilungisiwe
        (Atari ST, ColecoVision, PC Engine, DOS).</li>
      <li><strong>Indandatho yenqubekela phambili yokuscrapha ayisagxumeli
        emuva.</strong> Ngemva kokusesha okungaphezu kokukodwa ewindini
        elithi Sesha i-Metadata, ukuchofoza okuthi Sebenzisa kanye kwakuqala
        ukuscrapha izikhathi eziningana, futhi indandatho yayigxuma phakathi
        kwazo.</li>
      <li><strong>Ubuciko bebhokisi ye-3D esondeziwe abusenaso isikwele
        ngemuva kwabo.</strong> Ibhokisi lihlala ngqo engemuva
        elifiphalisiwe.</li>
      <li><strong>Imilayezo ayisabonisi ikhodi ye-HTML.</strong> Amanye
        amawindi okuqinisekisa nawemiphumela ku-Amathuluzi e-ROM ayebonisa
        amathegi afana no-&lt;br&gt; esikhundleni sokwehlukanisa imigqa.
        Isibuki Selogi nesikhethi somdlalo ongumzali wediski yebhonasi
        ku-Izilungiselelo kuyasebenza futhi.</li>
    </ul>
