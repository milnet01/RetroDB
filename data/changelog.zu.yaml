    <ul>
      <li><strong>Ama-cheat e-RetroArch (RetroDB), i-DuckStation
        ne-PCSX2.</strong> Izilungiselelo &gt; Ama-emulator kunesigaba esisha
        sama-cheat. Dawuniloda lapho amaphakethe ama-cheat omphakathi
        wamahhala, noma ungenise amafolda ama-cheat osunawo; i-RetroDB
        ikopisha amafayela futhi ayiyishintshi neze ifolda yakho. Bese
        ikhasi lomdlalo libala ama-cheat awo, ngalinye linenkinobho
        yokuvula/ukuvala, kanye nebhokisi lokusesha uma emaningi.
        Ku-RetroArch (RetroDB) ama-cheat owavulayo asebenza ngokulandelayo
        lapho ucindezela u-Dlala, futhi izinguquko ozenza kumenyu ye-RetroArch
        ngesikhathi udlala ziyagcinwa. Nge-DuckStation ne-PCSX2 izinkinobho
        zigcinwa ezilungiselelweni ze-emulator uqobo zomdlalo, ngakho
        izinguquko ezenziwe ngaphakathi ku-emulator ziyavela nasekhasini.
        I-RetroDB ayilokothi ibhale phezu kwefayela le-cheat i-emulator
        esenalo. I-cheat evuliwe imisa okwesikhashana imodi ye-Hardcore
        ye-RetroAchievements.</li>
      <li><strong>Ngenisa ibhokisi le-3D le-Slipcase emdlalweni.</strong>
        Ikhasi lomdlalo linenkinobho ethi Ngenisa ibhokisi le-3D ngaphansi
        kwekhava. Khetha ifayela le-<code>.box.json</code> eligcinwe
        yi-Slipcase, kanye nezithombe zalo, bese i-RetroDB igcina
        uhlangothi lwangaphambili, umgogodla, ingemuva nezinye izinhlangothi
        zebhokisi zalowo mdlalo. I-Slipcase 1.4.0 noma entsha ilondoloza leli fayela eduze kwesithombe ngasinye esikhishiwe. Isithombe sakho se-boxart ye-3D
        asishintshwa. Umdlalo osunazo izinhlangothi uyabuza ngaphambi
        kokuzishintsha, futhi okuthi Susa kuyazisula.</li>
      <li><strong>Jikisa ibhokisi le-3D lomdlalo ezandleni zakho.</strong>
        Chofoza ikhava yomdlalo onebhokisi le-Slipcase elingenisiwe bese
        ibhokisi livela nge-3D. Lihudule, noma usebenzise okhiye bemicibisholo,
        ukuze ulijikise ubone umgogodla, ingemuva, phezulu nangezansi. Skrola
        noma ucindezele u-+ no-- ukuze usondeze; chofoza kabili noma
        ucindezele u-Home ukuze ulibuyisele. Umdlalo ongenalo ibhokisi
        elingenisiwe usasondeza esithombeni sawo sekhava.</li>
      <li><strong>Izilungiselelo zixhumanisa nekhasi lama-emulator.</strong>
        Ikhasi lama-emulator lalingenaso isixhumanisi ndawo ku-Izilungiselelo,
        ngakho ubungalifinyelela kuphela ngokuthayipha ikheli lalo. Manje
        abalawuli babona ithebhu ethi Ama-emulator ngemuva kokuthi Isistimu,
        futhi ikhasi lama-emulator libonisa ibha yamathebhu efanayo, ngakho
        amanye amathebhu asekuchofozeni okukodwa.</li>
      <li><strong>Ukusondeza ikhava akusafihleki ngemuva
        kwamamenyu.</strong> Kufoni amabha aphezulu nangezansi ayehlala
        phezu kwekhava esondeziwe futhi afihle inkinobho yayo yokuvala,
        kanti kukhompyutha i-sidebar yayimboza uhlangothi lwayo lwesobunxele.
        Manje ukusondeza kuvuleka ngaphezu kwakho konke.</li>
      <li><strong>Amamodeli e-Claude 5.5 e-AI.</strong> Izilungiselelo &gt; Ukuscrapha ibala amamodeli amasha e-Claude ka-Anthropic: i-Haiku 5.5, ezenzakalelayo entsha futhi eshibhe kakhulu, i-Sonnet 5.5 ne-Opus 5.5, namanani awo amanje. I-RetroDB ayisathumeli isilungiselelo i-Sonnet 5.5 esenqabayo.</li>
      <li><strong>Thayipha inani lokuthengiswa komdlalo.</strong> Zombili izikrini zokuhlela zinebhokisi ethi Amakhophi athengisiwe ngaphansi kuka-Umqambi. Inani olithayiphayo livela ekhasini lomdlalo, njengelitholwe yi-AI. Sula ibhokisi ukulisusa.</li>
      <li><strong>Hlola ukhiye wakho we-AI kokuthi Izilungiselelo.</strong> Izilungiselelo &gt; Ukuscrapha inenkinobho ethi Hlola ukhiye we-AI olondoloziwe ngaphansi komhlinzeki we-AI. Ikhombisa ukuthi ukhiye uyasebenza yini, futhi uma ungasebenzi, ukuthi kungani: ukhiye owenqatshiwe, ayikho imali, noma umkhawulo wokusebenzisa. Ngaphambili, ukhiye owenqatshiwe wawubukeka sengathi uyasebenza.</li>
      <li><strong>U-Claude angasesha amanani okuthengisa kuwebhu.</strong> Izilungiselelo &gt; Ukuscrapha inenkinobho yokushintsha ethi Vumela u-Claude asese kuwebhu ngaphansi kwemodeli ye-Claude, evaliwe ekuqaleni. Ngaphandle kokusesha, u-Claude uphendula ngalokho asevele ekwazi futhi ushiya Amakhophi athengisiwe engenalutho. Uma inkinobho ivuliwe, u-Claude uyawasesha amanani. I-Anthropic ikhokhisa ngokusesha ngakunye, ngakho Ukugcwalisa nge-AI kusesha okungafika ku-5 emdlalweni ngamunye, kufika kumasenti angu-5 aseMelika; vala inkinobho ngaphambi kwe-scrape enkulu eyisixuku.</li>
      <li><strong>Ukugcwalisa nge-AI isistimu yonke ngesikhathi esisodwa.</strong> Amathuluzi e-ROM anekhasi elisha elithi Ukugcwalisa nge-AI Ngobuningi, nalo elibamba Amagama Asemthethweni. Khetha isistimu, noma Zonke izistimu, vula izinkambu ofuna zigcwaliswe bese uchofoza Gcwalisa nge-AI: i-RetroDB isebenzisa Ukugcwalisa nge-AI emdlalweni ngamunye, njengenkinobho yokugcwalisa nge-AI ekhasini lomdlalo, futhi ilondoloze izimpendulo ngqo emdlalweni. Ibha yenqubekelaphambili nesaziso sokugcwalisa nge-AI kukhombisa ukuthi ifike kuphi, futhi ungayishiya ikhasi ngenkathi isebenza. Ikhombisa ukuthi imidlalo emingaki ezoyigcwalisa futhi iyabuza kuqala, ngoba umhlinzeki wakho we-AI ukhokhisa umdlalo ngamunye. Imidlalo esivele yenziwe Ukugcwalisa nge-AI iyeqiwa ngaphandle uma uyibuyisela, futhi ukusebenza kuzimisa ngokwako uma i-AI iyeka ukuphendula.</li>
      <li><strong>Izaziso zemisebenzi zithatha imibala yetimu yakho.</strong> Amabhokisi akhombisa umsebenzi osebenzayo, afana ne-Bulk Scrape ne-RA Sync, namabha enqubekelaphambili manje asebenzisa imibala yetimu oyikhethile. Umsebenzi ongakwazi ukuma okwesikhashana awusakhombisi isihloko sawo ngombala wokuma okwesikhashana.</li>
      <li><strong>Ikhasi lama-Emulator libukeka njengamanye amathebhu Ezilungiselelo.</strong> Izilungiselelo &gt; Ama-emulator manje kuhlukaniswe kwaba amakhadi, futhi ibha engaphansi kwamathebhu yeqela kulelo nalelo: RetroArch, Dlala ku-RetroDB, Ama-core, Ama-cheat, Amafolda, Ama-emulator kanye Nokuhlelwa. Ibha ihlala phezulu uma uskrola futhi iphawula isigaba okuso.</li>
      <li><strong>Inqubekelaphambili yokudawuniloda eduze kwenkinobho.</strong> Uma udawuniloda i-RetroArch, ama-core esidlali noma iphakethe lama-cheat, inothi eliseduze kwenkinobho likhombisa ukuthi sekufinyelelwe kuphi ngamaphesenti. Ngaphambilini, kwakuvela umugqa ngaphansi kwezinkinobho bese uphusha yonke enye ingxenye yekhasi phansi.</li>
      <li><strong>Khetha i-emulator yesistimu ngayinye ohlwini.</strong> Ukuhlelwa kwesistimu ngayinye ku-Izilungiselelo &gt; Ama-emulator manje kukhombisa isistimu ngayinye kanye, nohlu lwama-emulator axhunywe kuyo. Leyo oyikhethayo yiyona esetshenziswa ngu-Dlala emidlalweni yaleyo sistimu, ngaphandle uma umdlalo usetha eyawo. I-emulator i-RetroDB engakwazi ukuyithola imakwe ngokuthi "ayitholakali". Ngaphambilini, isistimu ngayinye yayinomugqa nge-emulator ngayinye, nechashazi elincane lokukhetha okuzenzakalelayo. I-RetroArch ka-RetroDB uqobo manje isohlwini lwesistimu ngayinye esohlwini engayisebenzisa, kuhlanganise namasistimu angakabi nayo imidlalo.</li>
      <li><strong>Inkinobho ethi Yeyisha ebhokisini ngalinye lendlela.</strong> Abaphathi manje bangakhetha ifolda noma uhlelo ngokuchofoza emafolda ekhompyutha esikhundleni sokuthayipha indlela yayo: Izilungiselelo &gt; Ama-emulator, Umtapo, Ukuscrapha ne-Akhawunti, kanye nezilungiselelo zamaThuluzi e-ROM. Amabhokisi adinga uhlelo abonisa namafayela. Amafolda afihliwe afana no-<code>.config</code> asohlwini lokugcina.</li>
      <li><strong>Induku yesokunxele isebenza njenge-D-Pad ku-RetroArch ka-RetroDB.</strong> Emidlalweni yamasistimu angenayo induku, njenge-NES noma i-Mega Drive, manje ungahamba ngenduku yesokunxele kanye ne-D-Pad. Uma i-core ye-emulator yomdlalo ifunda induku ngokwayo, njengaku-Nintendo 64, induku ihlala iyinduku yangempela.</li>
      <li><strong>Ngena ku-RetroAchievements kusuka Ezilungiselelweni.</strong> Izilungiselelo &gt; I-akhawunti manje ingakungenisa ku-RetroArch ka-RetroDB, ukuze izimpumelelo zivuleke njengoba udlala ngaphandle kokungena ngaphakathi ku-emulator. Iphasiwedi yakho iya ku-RetroAchievements kuphela futhi ayigcinwa. Umsebenzisi ngamunye we-RetroDB unokungena kwakhe neswishi yakhe yeModi ye-Hardcore, eqala ivaliwe. I-DuckStation ne-PCSX2 zisangena kumamenyu azo.</li>
      <li><strong>Bona ukuthi iyiphi i-emulator ezosetshenziswa yi-Dlala.</strong> Ikhasi lomdlalo manje libonisa "Iqala ku:" negama le-emulator eduze kwenkinobho ethi Dlala, noma lithi ayikho i-emulator emisiwe.</li>
      <li><strong>Iphaneli yama-cheat isho ukuthi kungani umdlalo ungenawo ama-cheat.</strong> Uma i-emulator yomdlalo ingakwazi ukusebenzisa ama-cheat, iphaneli manje inikeza isizathu esikhundleni sokuhlala ifihliwe.</li>
      <li><strong>Izindlela ezinde zamafolda ziyalingana kufoni.</strong> Indlela ende yefolda ku-Izilungiselelo ayisenzi ikhasi liskrole eceleni.</li>
    </ul>
