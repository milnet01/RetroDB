  - type: fix
    label: Ukuphinda Uscraphe Ngokugcwele akusayishintshi isilinganiso noma isilawuli osibekile ngokucabanga, futhi ukuscrapha okuhluleka phakathi akusabhali ngendlela engananaki kangako
  body: "<ul>\n  <li><strong>Izimpendulo ze-AI zithi ziyi-AI.</strong> Izilinganiso zeminyaka ezivela ku-AI\n    ziyahlala, ziphawulwe njengesiqibelo esisekelwe kokuqukethwe komdlalo, nonyaka\n    laqala ngawo ibhodi ngalinye lezilinganiso. Amaphuzu nokuthengiswa okuvela ku-AI kuphawulwe nakho.</li>\n  <li><strong>I-RetroAchievements ibonisa umdlalo olungile.</strong> Okulandelayo\n    akusathwali izimpumelelo zomdlalo wokuqala. Ngemva kokubuyekeza,\n    ideshibhodi ikunikeza i-RetroAchievements refresh kanye. Yichofoze ukuze\n    ulungise izixhumanisi ezindala. Inqubekelaphambili elondolozwe ngaphansi kwesixhumanisi esingalungile iyasuswa, futhi ukuvumelanisa okulandelayo\n    kuyayigcwalisa futhi.</li>\n  <li><strong>Izibalo zesikhathi sokudlala ziyiqiniso.</strong> Izikhathi ezingaphansi kwehora\n    zazibalwa njengamahora, ngakho izibalo ekudeshibhodi nasekuma-trophy omqoqi\n    zaziphezulu kakhulu. Ezinye izibalo nama-trophy zizokwehla.</li>\n  <li><strong>I-HowLongToBeat ithola umdlalo olungile.</strong> Okulandelayo akusadlulisi\n    njengomdlalo onawo, futhi isistimu nonyaka womdlalo manje kuyabalwa.\n    Okufanayo kwesinye isistimu, noma kweminyaka eyalandela, kukulinde\n    ekhasini lokubuyekeza.</li>\n  <li><strong>Hlola okulondoloziwe kakade.</strong> Chofoza Check Saved Play\n    Times ku-ROM Tools ukuze uthumele okufanayo okulondoloziwe okungabazekayo ekhasini lokubuyekeza.\n    Akukho okushintshayo kuze kube uthatha isinqumo.</li>\n  <li><strong>Amagama ochungechunge aliqiniso.</strong> Uchungechunge lomdlalo alusavela\n    ekusikeni isihloko sawo. Ngemva kokubuyekeza, amagama ochungechunge acatshangelwa\n    ayasuswa, kubandakanya amanye ayelungile. Ukuscrapha okulandelayo\n    kuwagcwalisa avela emithonjeni ethi igama loluchungechunge.</li>\n  <li><strong>Umbhalo ohlanzekile.</strong> Izincazelo azisabonisi amakhodi ewebhu noma\n    izimpawu zezihloko. Inkampani eyodwa inokubhalwa okukodwa, umdlalo owodwa uneSifunda esisodwa, futhi\n    amagama amafayela afana ne-dosbox.exe awasafakwa njengezinye izihloko. Lokhu\n    kwenzeka kanye, kuzenzakalela, ngemva kokubuyekeza.</li>\n  <li><strong>Ukuphinda Uscraphe Ngokugcwele kugcina ukukhetha kwakho.</strong> Isilinganiso noma\n    isilawuli osibekile siyahlala ngaphandle kwalapho umthombo uhlinzeka ngaso ngempela.</li>\n</ul>\n"
