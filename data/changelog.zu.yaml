  body: |
    <ul>
      <li><strong>Sesha noma imuphi umdlalo noma ikhonsoli kunoma yiliphi
        ikhasi.</strong> Ibhokisi lokusesha manje lingaphansi kwegama lakho
        kubha eseceleni. Thayipha izinhlamvu ezimbili noma ngaphezulu ukuze
        ubone amakhonsoli afanayo nemidlalo efanayo efika kweyisishiyagalombili,
        ngayinye nekhonsoli yayo. Chofoza owodwa, noma uwukhethe ngokhiye
        bemicibisholo bese ucindezela u-Enter, ukuze uwuvule. Okuthi "Bona
        yonke imiphumela" kuvula uMtapo nalokho kusesha. Cindezela u-/ ukuze
        weqele ebhokisini uma ikhasi lingenalo ibhokisi lalo lokusesha.</li>
      <li><strong>Kulula ukuhamba kufoni noma kuthebulethi.</strong>
        Esikrinini esincane, ibha phezulu iphethe inkinobho yemenyu kanye
        nenkinobho yokusesha evula imenyu nekhesa isivele isebhokisini
        lokusesha. Ibha ngezansi ikuyisa eDeshibhodi, eMtapweni, ku-Izistimu
        naku-Izimpumelelo ngokuthepha kanye. Imenyu manje iqinile, ngakho
        ikhasi alisabonakali ngemuva kwayo. Thepha ngaphandle kwayo noma
        ucindezele u-Escape ukuze uyivale. Emafasiteleni alingana nethebulethi
        inkinobho yemenyu yayingekho, ngakho imenyu yayingavuleki nhlobo;
        manje ikhona. Amabha amathebhu nezihlungi ahlala esikrinini lapho
        uskrola ama ngaphansi nje kwebha ephezulu, hhayi ngemuva kwayo.</li>
      <li><strong>Izilungiselelo &gt; Ama-emulator kungena kufoni.</strong>
        Amathebula ayo ayebanzi kunefoni, ngakho izinkinobho ezithi Hlela
        nethi Izilungiselelo zazingaphandle kwesikrini. Kufoni umugqa ngamunye
        manje ungukhadi elinezinkinobho zawo ngaphakathi.</li>
      <li><strong>Ukususa izithombe zomdlalo akusashiyi amafayela
        angasetshenziswa.</strong> Uma ususa izithombe zomdlalo ngesikhathi
        i-RetroDB isazicijisa ngemuva, yayingazibhala futhi njengamafayela
        angasetshenziswa yimuphi umdlalo. Manje ihlola kuqala bese iyazeqa.
        Isibalo esithi "Kuthuthukiswa izithombe" naso sikhipha umdlalo
        osuliwe ngokushesha.</li>
      <li><strong>Izihloko ozibhalayo ziyagcinwa lapho uscrapha.</strong>
        Ukuscrapha, ngisho nokuthi Ukuphinda Uscraphe Ngokugcwele, kwakushintsha
        isihloko obusibhale ewindini lokuhlela ngegama elivela ku-scraper.
        Manje isihloko osishintshayo siyagcinwa. Ibhokisi elisha elithi "Gcina
        lesi sihloko lapho uscrapha" ngaphansi kwesihloko likhombisa lokhu;
        susa uphawu kulo ukuze uvumele ama-scraper aphinde aqambe kabusha
        umdlalo. Okuthi Setha kabusha ekhasini lomdlalo nakho kuyawavumela.</li>
      <li><strong>Amagama asemthethweni emidlalo yakho, ahlolwe
        nguwe.</strong> Amathuluzi e-ROM anekhasi elisha elithi Amagama
        Asemthethweni. Cindezela okuthi "Buza i-AI" ngesistimu eyodwa noma
        zonke, bese i-AI iphakamisa igama eliphelele elisemthethweni lomdlalo
        ngamunye njengoba wakhishwa esifundeni se-ROM yawo, ngakho i-ROM
        yaseJapane ye-Mega Man iba yi-Rockman. Ubona igama ngalinye elidala
        nelisha eceleni komunye, umake lawo owafunayo bese uyawamukela. Akukho
        okushintshayo uze ukwenze. Igama elidala ligcinwa njengesihloko
        esinye, futhi igama elamukelwe liyagcinwa lapho uscrapha. Igama
        elenqatshiwe aliphinde liphakanyiswe. Kudingeka umhlinzeki we-AI
        ku-Izilungiselelo &gt; Iyascrapha.</li>
      <li><strong>Imidlalo enonyaka kuphela ingahlelwa, futhi igcina unyaka
        wayo.</strong> Imidlalo eminingi inonyaka kuphela njengosuku lwayo,
        njengo-1985. Ekhasini lomdlalo, iwindi lokuhlela lalenqaba
        ukuyilondoloza. Ewindini lokuhlela loMtapo, ukulondoloza owodwa
        kwakusula unyaka wawo. Kokubili manje kwamukela unyaka, unyaka
        nenyanga, noma usuku olugcwele.</li>
    </ul>
