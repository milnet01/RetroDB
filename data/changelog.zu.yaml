  body: |
    <ul>
      <li><strong>Izinguqulo zezifunda zomdlalo zivela njengomdlalo
        owodwa.</strong> Xhumanisa izinguqulo onazo (isibonelo, ezikhishwe
        e-USA, eYurophu naseJapane) bese uMtapo ukhombisa ikhadi elilodwa
        elinebheji ethi &#127760;. Ikhadi livula futhi lidlala inguqulo
        yeSifunda Esizenzakalelayo sakho. Ikhasi lomdlalo libala zonke
        izinguqulo eceleni komunye futhi likuvumela ushintshe phakathi
        kwazo. AmaThuluzi e-ROM &gt; Izinguqulo Zezifunda aphakamisa amaqembu
        ukuze abahleli bawaqinisekise; akukho lutho oluxhunywayo ngaphandle
        kwakho. Akaze aphakamise umdlalo olandelayo njengenguqulo yomdlalo
        wokuqala. Izinguqulo ezixhunyiwe azisabikwa njengamaphindwa ngegama.
        Qalisa i-Gcwalisa Izihloko Ezinye kanye ukuze iziphakamiso zibe
        nokuningi kokusebenza ngakho.</li>
      <li><strong>I-AI ingafinyeza ukuthi izinguqulo zezifunda zehluka
        kanjani.</strong> Emdlalweni onezinguqulo ezixhunyiwe, abahleli
        bangacindezela okuthi Finyeza umehluko nge-AI esigabeni seZinguqulo
        Zezifunda. I-AI ibala umehluko owaziwayo njengokuhlolwa
        (censorship), ubunzima noma okuqukethwe okususiwe. Uhlu lumakwa
        njengolubhalwe yi-AI, luvela ekhasini lenguqulo ngayinye, futhi
        luyacasha uma uxhumanisa noma uhlukanisa inguqulo kuze kube lubhalwa
        futhi. Kudingeka umhlinzeki we-AI osethwe ku-Izilungiselelo &gt;
        Ukuscrapha.</li>
      <li><strong>Imidlalo ye-PlayStation iqala nezilungiselelo
        ezinhle.</strong> Ku-DuckStation, PCSX2 no-RPCS3, i-RetroDB manje
        isetha isikali sokucaca (resolution) nesilinganiso sesithombe somdlalo
        ngamunye efayeleni lezilungiselelo ze-emulator lomdlalo ngamunye
        uma ucindezela okuthi Dlala, kanye nokuthi iqala ngesikrini esigcwele
        yini. Kushintshe kuyo yonke isistimu ngenkinobho yezilungiselelo
        ku-Izilungiselelo &gt; Ama-emulator, noma kumdlalo owodwa kuphaneli
        entsha ethi Izilungiselelo ze-emulator ekhasini lawo. Isilungiselelo
        osishintsha ngaphakathi ku-emulator sihlala siphumelela. I-RetroDB
        ifunda inombolo ye-serial yediski ngayinye ukuze ithole ifayela
        elifanele; amadiski e-CHD adinga ukuthi i-chdman ifakwe.</li>
      <li><strong>Ukugcwalisa nge-AI akusakwazi ukuqondiswa umbhalo
        othayiphwe ezinkambini zomdlalo.</strong> Uma Ukugcwalisa nge-AI
        kuhlola umshicileli, unjiniyela, uhlelo noma ezinye izinkundla
        zomdlalo ezikhona kakade, manje kuhlanza lowo mbhalo kuqala,
        ngendlela ebesekuhlanza ngayo isihloko.</li>
      <li><strong>Ukuskena kwamaThuluzi e-ROM kuhlala ngaphakathi kwefolda
        yakho ye-ROM.</strong> UMguquli we-CHD no-Qinisekisa i-CHD abasalandeli
        isinqamuleli (symlink) esikhomba ngaphandle kwayo, futhi ukukhipha
        i-archive yamadiski amaningi akunaki noma yisiphi isinqamuleli
        esipakishwe ngaphakathi kwe-archive.</li>
      <li><strong>Amakhasi ayenqaba ukuqalisa izikripthi ezishushumbiselwe
        kuwo.</strong> I-browser yakho manje ivimba noma yisiphi isikripthi
        i-RetroDB engazibhalelanga yona, ngakho umbhalo oshushumbisa ikhodi
        esihlokweni somdlalo, kuthegi noma encazelweni escraphiwe
        awukwazi ukuyiqalisa. Izinkinobho nemenyu zisebenza
        njengangaphambili.</li>
      <li><strong>Umfanekiso-skrini owodwa owonakele awusakumisi ukuhlolwa
        kwamaphindwa omdlalo.</strong> Umfanekiso-skrini ongafundeki
        ubekwa eceleni bese ukuhlola kuyaqhubeka.</li>
      <li><strong>Imisebenzi yamaThuluzi e-ROM ayisabambeki ku-"iyasebenza".</strong>
        Ifayela elisuswe ngemva kokuskena kuka-Qinisekisa i-CHD libalwa
        njengelingavumelekile, futhi noma yiliphi iphutha elingalindelekile
        kuMguquli we-CHD, ku-Qinisekisa i-CHD noma kuMtholi Wamaphindwa
        liqeda umsebenzi njengowehlulekile, nephutha lisengxenyeni yelogi
        yawo.</li>
      <li><strong>Ngaphambi kokuba ukusetha kuqedwe, izicelo zedatha ze-app
        zithola impendulo ecacile.</strong> Ziphendula ngokuthi "Kudingeka
        ukusetha" esikhundleni sokubuyisa ikhasi lokusetha. Amakhasi
        asakuyisa ku-wizard yokusetha.</li>
      <li><strong>Imidlalo elandelayo (sequels) ayisakhombisi izimpumelelo
        zomdlalo wokuqala.</strong> Ukufanisa kwe-RetroAchievements
        bekungayinaki inombolo esesihlokweni, ngakho i-Donkey Kong Country 2
        no-3 zazixhunywe ku-Donkey Kong Country. Izinombolo (2, II, 3, III
        njalonjalo) manje ziyabalwa. Ukulungisa imidlalo esixhunyiwe kakade,
        qalisa ukuvuselela kwe-RetroAchievements kwazo zonke izistimu
        kanye.</li>
      <li><strong>Ukuvumelanisa kwe-PlayStation akusazisuli izibalo zakho
        zezindondo.</strong> Uma impendulo ye-PlayStation ishiya ngaphandle
        izibalo eziphelele zezindondo zomdlalo, i-RetroDB yayilondoloza
        oziro phezu kwezibalo ebisinazo. Manje iyazigcina, nasekuvuseleleni
        izindondo ngobuningi.</li>
      <li><strong>Ukuvula isethi yezindondo engasekho kudiski kukhombisa
        umlayezo.</strong> Ikhasi lezindondo laliphela ngephutha; manje
        lithi isethi ayitholakalanga bese likubuyisela ohlwini.</li>
      <li><strong>Amathebula amaThuluzi e-ROM aqamba ikholomu yezinkinobho
        kahle kuzo zonke izilimi.</strong> Isihloko sekholomu sasabelana
        ngamagama nohlobo lomdlalo lwe-Action, ngakho ezinye izilimi
        zazikhombisa igama lohlobo lapho.</li>
      <li><strong>Imidlalo ye-GameCube, 3DS ne-Super Famicom ithola
        i-emulator yayo isethwa ngokuzenzakalelayo.</strong> I-RetroDB
        yayifuna lezi zistimu ngaphansi kwamagama amafolda angasetshenziswa
        imitapo (gamecube, 3ds, superfamicom esikhundleni se-gc, n3ds, sfc),
        ngakho i-Dolphin ne-Citra zazingakaze zixhunywe kuzo. Qala kabusha
        i-RetroDB kanye ukuze ikuthole lokhu.</li>
      <li><strong>Ukulanda okungadingi i-Python (standalone) kuyawasetha
        ama-emulator futhi.</strong> Kwakushoda ifayela elibala wona.</li>
      <li><strong>Cishe izinkinobho, amalebula nemilayezo engaba ngu-170
        engeziwe kuhunyushiwe</strong> kuzo zonke izilimi. Kwakuvela
        ngesiNgisi ngaphambili, futhi ezimbalwa zazikhombisa ukuqagela
        okungalungile (ezinye izilimi zazithi "i-backup yehlulekile" uma
        umdlalo wehluleka ukuqala).</li>
      <li><strong>I-Escape ivala iwindi elingaphezulu kuphela.</strong> Uma
        umbuzo uvulekile phezu kwelinye iwindi, i-Escape yayivala womabili;
        amanye amawindi ayeqhubeka nokusebenza ngemva kokuba i-Escape
        iwafihlile, futhi ukucindezela i-Escape ekhasini lomdlalo
        kwakungaqhubekisa ukuscrapha ngobuningi obekumisile. Wonke amawindi
        manje avalwa ngesenzo sawo sokuvala, agcina ukugxila kwekhibhodi
        ngaphakathi uma evulekile, futhi abuyisela ukugxila enkinobhweni
        eliwavulile. Amawindi enqubekela phambili emisebenzi esebenzayo
        ahlala evulekile kuze kuphele umsebenzi.</li>
      <li><strong>Amashadi oKuhlaziya asolimini lwakho.</strong> Amagama
        ezinhlobo, ombono, obukhulu namamodi, izihloko zamashadi, amagama
        ama-axis nezincazelo zamashadi (legends) ayesesiNgisini kuzo zonke
        izilimi.</li>
      <li><strong>Idatha ye-RetroAchievements iphephe kakhudlwana.</strong>
        Uma uhlu lwemidlalo ye-RetroAchievements lwekhonsoli lwehluleka
        ukulayisha, ukuvuselela kwe-RA manje kushiya imidlalo yaleyo khonsoli
        ixhunyiwe esikhundleni sokuyihlukanisa yonke. I-Sula Idatha ye-RA
        manje isula inqubekela phambili ye-RetroAchievements kuphela;
        inqubekela phambili ye-Steam ne-Xbox iyahlala.</li>
      <li><strong>Amaphasiwedi kumele abe nezinhlamvu eziyi-12 okungenani
        yonke indawo.</strong> Ukusetha kokuqala kwakwamukela iphasiwedi
        yomlawuli yanoma yibuphi ubude, futhi amakhasi okuphoqelelwa
        ukushintsha iphasiwedi nokusetha ayethi izinhlamvu ezi-4 zanele.
        Womathathu manje acela eziyi-12, njengayo yonke enye i-app.</li>
      <li><strong>Izibalo zezimpumelelo zilungile, futhi ezakho.</strong>
        Ukuvumelanisa umdlalo owodwa kusuka ku-RetroAchievements manje
        kulondoloza ukuthi unezimpumelelo ezingaki, esikhundleni sika-0.
        Izibalo zezimpumelelo kudeshibhodi zibala imidlalo yakho kuphela,
        futhi Izindondo Zomqoqi azisabali impumelelo ngayinye ye-Steam noma
        ye-Xbox kabili.</li>
      <li><strong>Ukuvumelanisa ngemuva kusebenzisa ama-akhawunti
        akho.</strong> Ukuvumelanisa kwesistimu ye-RetroAchievements
        kungena nge-akhawunti yakho ye-RetroAchievements uma uyisethile.
        Ukuvuselela ngobuningi kwe-PlayStation kusebenzisa futhi ukungena
        kwakho okulondoloziwe esikhundleni sokungena kabusha njalo.</li>
      <li><strong>Nguwe kuphela ongamisa noma uqhubekisele phambili
        ukuvumelanisa kwakho.</strong> Omunye umsebenzisi akasakwazi ukukhansela
        ukuvumelanisa kwakho kwe-RetroAchievements, i-Steam noma i-Xbox,
        futhi ukuqhubekisela phambili umsebenzi ophazanyisiwe kudinga
        amalungelo afanayo nokuwuqala. Abalawuli basengakwenza kokubili.</li>
      <li><strong>Ifolda yakho yezindondo ze-RPCS3 iyahlolwa uma
        uyilondoloza.</strong> Ifolda engekho, engeyona indlela ephelele,
        noma eyifolda yesistimu iyenqatshwa, njengoba bekuvele kunjalo
        ezilungiselelweni eziyinhloko.</li>
      <li><strong>Okuthi "Landa Zonke Izithombe" kwiMnyuziyamu kusebenza
        ngemuva.</strong> Ikhasi alisalindi imizuzu ngazo zonke izithombe
        zezilawuli. Likhombisa ukuthi ukulanda sekufike kuphi, linenkinobho
        ethi Khansela, futhi liphinde libonise inqubekela phambili uma
        ushiya ikhasi bese ubuya.</li>
      <li><strong>AmaThuluzi e-ROM avikela amafayela akho kangcono.</strong>
        Ukuhlanza akusayithululi i-archive: iphethini efana no-<code>*</code>
        ayikwazi ukulondolozwa, futhi Ukuhlanza kuyama uma amaphethini
        engasusa wonke amafayela. UMguquli we-CHD ugcina okwangempela uma
        okuthi "verify" kucishiwe, futhi ushiya i-CHD esikhona uma okuthi
        "skip existing" kuvuliwe. UMtholi Wamaphindwa uhlala egcina ikhophi
        eyodwa yomdlalo ngamunye, ngisho noma isicelo sicela zonke.</li>
      <li><strong>Imisebenzi yamaThuluzi e-ROM iziphatha njengoba izinkinobho
        zisho.</strong> Okuthi Misa manje kumisa uMguquli we-CHD,
        u-Qinisekisa i-CHD, uMtholi Wamaphindwa noKususa Amaphindwa
        Emifanekiso-skrini, futhi umsebenzi omisiwe ungakhanselwa. Ukuskena
        kokuKususa Amaphindwa Emifanekiso-skrini okuhlangabezana nephutha
        manje kuphela njengokwehlulekile esikhundleni sokusebenza
        unomphela.</li>
      <li><strong>I-Create M3U ayisabeki ama-archive efoldeni
        yesikhashana.</strong> Ama-archive athuthiwe manje aya efoldeni
        yedatha ye-RetroDB uqobo, engasulwa uma kuqalwa kabusha. Iskena
        se-archive sikhombisa ukuthi aye kuphi, futhi ukuqinisekisa iqoqo
        kuthi azothuthwa. Ukusetha kabusha izilungiselelo zamaThuluzi e-ROM
        manje kusetha kabusha zonke izinketho.</li>
      <li><strong>Shintsha amadiski kusuka ku-RetroDB.</strong> Ngesikhathi
        umdlalo we-RetroArch oqalwe ohlwini lwamadiski lwe-.m3u usebenza,
        uhlu oluthi &#9654; Kudlalwa manje phezulu ekhasini ngalinye
        lukhombisa isihloko somdlalo nenkinobho ethi Idiski elandelayo,
        ngakho umdlalo ocela uhlangothi lwesibili uqhubeka ngokuchofoza
        kanye, kusuka ku-browser noma efonini. I-RetroArch kumele ibe ne-Settings
        &gt; Network &gt; Network Commands evuliwe (iphothi 55355);
        inkinobho iyakusho uma kucishiwe.</li>
      <li><strong>Iskripthi sokuqalisa sivula i-RetroDB uma isilungile.</strong>
        I-start.sh, i-start.command ne-start.bat zazivula i-browser ngemva
        kwemizuzwana emi-3 engaguquki, kaningi ngaphambi kokuba iseva
        iphendule, ngakho ikhasi lalehluleka ukulayisha. I-RetroDB manje
        ilivula uma iseva isilalele. Uma iqalwe nge-LocalWebServerManager,
        ayivuli khasi nhlobo; sebenzisa inkinobho ethi Open yomphathi.</li>
      <li><strong>Amavidiyo emidlalo angafika ku-500 MB.</strong> Umkhawulo
        wawungu-50 MB, omncane kakhulu kuma-trailer amaningi emidlalo.
        Ukulayisha okukhulu kakhulu manje kukhombisa umlayezo ekhasini
        lomdlalo esikhundleni sokushintsha ikhasi ngombhalo ongenalutho.
        Ividiyo eyenqatshiwe (enkulu kakhulu noma enohlobo lwefayela
        olungalungile) manje iyakusho esikhundleni sokulahlwa
        ngokuthula.</li>
      <li><strong>Ukuqalisa kulandela indlela oyisethile.</strong> I-Binary
        path override emgqeni we-RetroArch ku-Izilungiselelo &gt;
        Ama-emulator manje iphumelela ngaphezu kwendlela ye-RetroArch
        phezulu kulelo khasi; ngaphambili, indlela yomugqa yayingananakwa.
        Ukucindezela okuthi Misa kabili akusacelanga umdlalo ukuthi uphume
        kabili; ku-Linux, i-RetroArch ithatha isicelo sesibili njengokuthi
        "phuma ngaphandle kokulondoloza", ngakho ukulondoloza kwakho
        ngaphakathi emdlalweni kwakungalahleka.
        Isilungiselelo sesiqalisi esasala emodini ekude engakaze yakhiwe
        asisavimbi yonke imidlalo ukuthi iqale.</li>
      <li><strong>Izenzo ezehlulekayo zibika amaphutha azo kahle.</strong>
        Uma ukulondoloza, ukungenisa, ukuvumelanisa noma ukuskena kwehluleka,
        i-RetroDB manje iphendula ngesimo sangempela sephutha futhi
        ikhombisa isizathu emlayezweni wayo, esikhundleni sokuphendula
        sengathi kuphumelele. Ukulondoloza ikhodi yokungena ye-PSN engakwazi
        ukuxhuma akusakhombisi imininingwane yangaphakathi yephutha.
        Ukungena, ukuphatha abasebenzisi, iphrofayili yakho, izimpumelelo,
        ukungenisa, Ukugcwalisa nge-AI nokusesha kwe-HowLongToBeat manje
        kwenza okufanayo, futhi ulimi olungakwazi ukulondolozwa luyasho
        isizathu esikhundleni sokuthi "Iphutha lenethiwekhi".</li>
      <li><strong>Imidlalo eqanjwe ngendlela ye-No-Intro manje
        iyascraphwa.</strong> Isihloko esifana no-"Legend of Zelda, The"
        noma "Legend of Zelda, The - Ocarina of Time" manje sifana nemiphumela
        ye-"The Legend of Zelda" esikhundleni sokwenqatshwa isihlungi
        sokufanisa. Imibiko ye-ROM nayo ayisawamaki lawo magama
        njengangafani.</li>
      <li><strong>Izihloko ezithathwe emagameni amafayela zilahla wonke
        amathegi azo.</strong> Isifunda esihlanganisiwe esifana no-"(USA,
        Europe)" no-"(UK)" manje kuyasuswa. Kumakhompyutha asekhaya afana
        ne-ZX Spectrum, konke kusukela onyakeni kuya phambili kuyasuswa,
        ngakho "Chuckie Egg 2 (UK) (1985) (A'n'F Software) (tzx)" iba
        "Chuckie Egg 2". Igama lefayela eliphela ngo-"..zip" alisashiyi
        ichashazi elingadingekile. Usesho lwe-scraper, ukusetha kabusha
        idatha yomdlalo neziphakamiso zeZinguqulo Zezifunda kusebenzisa
        lawa magama ahlanzekile.</li>
      <li><strong>Isihloko esingalungile asisaziphindi uma uphinda
        uscraphe.</strong> Ukuscrapha ngobuningi manje kusesha ngegama
        elivela efayeleni le-ROM, hhayi isihloko esilondolozwe emdlalweni.
        Umdlalo owake wafaniswa nomdlalo ongalungile uthola ofanele uma
        uscraphwa futhi.</li>
      <li><strong>Ama-scraper akhetha iSifunda Esizenzakalelayo sakho.</strong>
        Uma imiphumela emibili ilingana, lowo ovela eSifundeni
        Esizenzakalelayo sakho noma ku-World manje uyaphumelela, hhayi
        njalo owase-USA. Izihloko ezimbili eziyimathegi ezifunda kuphela
        azisabalwa njengezifana ngokuphelele. Izinguqulo Zezifunda
        azisayiphambanisi i-X ku-"X-Men" nenombolo yomdlalo olandelayo.
        Ukukhetha ukuthi iyiphi inguqulo ekhonjiswa yikhadi manje kufunda
        igama lefayela le-ROM kuphela, hhayi amafolda angaphezu kwalo, futhi
        kuyawaqonda amathegi amadala afana no-"(U)" no-"(E)".</li>
      <li><strong>Ilogi ikhombisa ukuthi isikhathi sokuscrapha umdlalo
        ngamunye siya kuphi.</strong> Ngemva komdlalo ngamunye, i-RetroDB
        ibhala umugqa owodwa onemizuzwana echithwe ekuseshweni, emthonjeni
        ngamunye, ekulandeni, ekucubunguleni izithombe, ku-AI
        nasekulondolozeni. Kuyisinyathelo sokuqala sokuscrapha
        ngokushesha.</li>
      <li><strong>Ukuscrapha kuqeda ngokushesha: izithombe ezincane zenziwa
        zicace kamuva.</strong> Ukuscrapha manje kulondoloza umdlalo
        nezithombe zawo njengoba zilandiwe. I-box art encane nemifanekiso-skrini
        bese kukhuliswa ngemuva, umdlalo owodwa ngesikhathi. Imifanekiso-skrini
        ephindiwe iyalahlwa ngaphambi kwanoma yimuphi walowo msebenzi. Uma
        i-RetroDB ima phakathi, iyaqhubeka uma iqala futhi.</li>
      <li><strong>Funda incwadi yokusebenzisa yomdlalo ekhasini lawo.</strong>
        Inkinobho ethi Incwadi Yokusebenzisa manje ivula i-PDF ewindini
        elingaphezu kwekhasi lomdlalo. Phenya amakhasi ngokuthi
        Okwangaphambilini nokuthi Okulandelayo, okhiye bemicibisholo, i-Home
        ne-End, noma ngokuswayipha efonini; ikhasi ngalinye liphenduka
        njengelencwadi, noma lishintshe nje uma isistimu yakho icela
        ukunyakaza okuncane. Okuthi "Vula i-PDF kuthebhu entsha" kusekhona,
        futhi u-Ctrl-click kokuthi Incwadi Yokusebenzisa uvula ithebhu
        ngqo.</li>
      <li><strong>Ibha eseceleni ikhombisa uma izithombe zisathuthukiswa.</strong>
        Ngesikhathi izithombe zenziwa zicace ngemuva, ibha eseceleni ithi
        "Kuthuthukiswa izithombe — Imidlalo esele: N". Umdlalo osalindile
        uyakusho ekhasini lawo, futhi izithombe zawo ezicace kakhudlwana
        zivela lapho ngokwazo uma sezilungile. Iswishi yekhava ye-2D/3D
        ayisawumbozi lowo mugqa.</li>
      <li><strong>Imithombo esekelayo ibuzwa ngesikhathi esisodwa.</strong>
        Uma umthombo oyinhloko ushiya izikhala, i-RetroDB manje ibuza
        eminye imithombo yonke ngesikhathi esisodwa esikhundleni sokuyibuza
        ngokulandelana. Izimpendulo zayo zisasetshenziswa ngokulandelana
        kwakho kwe-Izilungiselelo, ngakho umthombo ofanayo uphumelela
        enkundleni ngayinye.</li>
      <li><strong>I-ES-DE ifunda uhlu lwayo lwemidlalo kanye.</strong>
        Ukuscrapha ngakunye, kuhlanganise nokuscrapha ngobuningi, kwakufunda
        i-gamelist.xml ye-ES-DE yesistimu kabili emdlalweni ngamunye.
        I-RetroDB manje iyifunda kanye futhi iphinde iyifunde kuphela uma
        ifayela lishintsha.</li>
      <li><strong>Ukusebenzisa kwe-Sesha i-Metadata akusaseshi
        futhi.</strong> Ekhasini lomdlalo, imiphumela oyikhethile ilandwa
        ngqo emthonjeni wayo esikhundleni sokuseshwa okwesibili. Uma kungekho
        okukhethiwe, kuphela umthombo owusebenzisile ne-AI egcwalisa
        izikhala.</li>
      <li><strong>I-ScreenScraper ithola imidlalo enesihlokwana.</strong>
        Yayingatholi lutho esihlokweni esifana no-"Alone in the Dark: The
        New Nightmare" ngaphandle uma ikholoni inesikhala ngaphambi kwayo.
        I-RetroDB manje iyasesha ngaleyo ndlela, bese isesha ngengxenye
        engaphambi kwekholoni uma ingakatholi lutho.</li>
      <li><strong>Imidlalo engenalutho lokudlala ayisanikezi ngethi
        Dlala.</strong> Umdlalo ongeniswe ku-CLZ, Steam, Xbox noma PSN
        awunalo ifayela le-ROM. Ikhasi lawo manje alikhombisi nkinobho ethi
        Dlala, azikho Izilungiselelo ze-emulator futhi asikho isigaba
        sokuQalisa uma uwuhlela, kufana namakhadi oMtapo.</li>
      <li><strong>Imidlalo ye-RetroArch ivikelwe ezilungiselelweni ezimbili
        ezimbi.</strong> I-RetroDB manje inika i-RetroArch ifayela elincane
        lezilungiselelo elingelayo njalo uma iqala umdlalo, ngaphezu
        kwelakho. Lisetha ikhibhodi ukuthi ifane ne-desktop yakho (Wayland
        noma X11), ngakho ikhibhodi ayilokothi ife, futhi livumela
        ukusheshisa (fast-forward) kusebenze ngesivinini esigcwele, imidlalo
        ye-Commodore 64 ekusebenzisayo ukulayisha ngokushesha. Zonke ezinye
        izilungiselelo zakho ze-RetroArch azithintwa.</li>
      <li><strong>I-Create M3U igcina umdlalo emtapweni wakho.</strong>
        Ukuguqula i-archive yamadiski amaningi ibe yi-playlist kwakushiya
        umdlalo ukhomba ku-archive, ebisithuthiwe. Umdlalo manje ukhomba
        ku-playlist entsha futhi ugcina imininingwane nezithombe zawo. Uma
        i-archive eyodwa iqukethe ukukhishwa okuningana komdlalo, ngakunye
        kunesethi yako yamadiski, i-playlist manje isebenzisa amadiski
        okukhishwa kokuqala esikhundleni sawo wonke, futhi isho ukuthi
        yimaphi amadiski eyawashiya ngaphandle.</li>
      <li><strong>Ukuphinda Uscraphe Ngokugcwele kungagcina imidiya osuvele
        unayo.</strong> Khetha okuthi "Gcina imidiya ekhona" eceleni
        kweswishi yokuPhinda Uscraphe Ngokugcwele. Imininingwane yombhalo
        isavuselelwa, kodwa ubuciko, amavidiyo nezincwadi zokusebenzisa
        osekukhona kudiski kuhlala kunjalo esikhundleni sokulandwa futhi.
        Ngaphandle kokukhetha, Ukuphinda Uscraphe Ngokugcwele akusalahli
        imifanekiso-skrini ebekuyilande ngaphambili.</li>
      <li><strong>Imisebenzi yangemuva ayisalahli noma yeqe
        umsebenzi.</strong> Ukuvuselela kwe-RetroAchievements okuhlangabezane
        nomdlalo owodwa omubi akusayilahli imidlalo ebesekuyivuselele.
        Ukuvumelanisa noma ukuvuselela okuqhubekiselwa phambili akusaweqi
        umdlalo obekukuwo uma kume. Ukuvumelanisa kwe-RetroAchievements noma
        kwe-Steam okuqhubekiselwa phambili kusuka ku-snapshot endala kakhulu
        manje kuyama nomlayezo esikhundleni sokubika impumelelo kungavumelaniswanga
        lutho. Ukuguqulwa kwe-WebP kuhlola ifayela le-WebP elisele ngaphambi
        kokulithemba, futhi angeke kuqale uma kungakwazi ukufunda isikhala
        esikhululekile kudiski.</li>
      <li><strong>Ukuthuthukisa ukufakwa okudala kakhulu akusakwazi
        ukulahlekelwa yidatha ngokuthula.</strong> Izinyathelo ezintathu
        ezindala zokuthuthukisa isizindalwazi zazingalahla imigqa ezimeni
        ezingavamile. Manje ziyayikopisha imigqa, noma zime ngephutha
        elicacile esikhundleni sokuyilahla.</li>
      <li><strong>Izinkinobho zewindi elithi Mayelana azisanqunywa.</strong>
        Iwindi libanzi kakhudlwana futhi izinkinobho zalo ezine zihlala
        emigqeni emibili, ngakho wonke amalebula avela ngokugcwele; efonini
        zifakwa phezu komunye.</li>
      <li><strong>Itimu yakho ikulandela ku-browser entsha.</strong> Ukungena
        ku-browser ongakaze uyisebenzise ngaphambili manje kukhombisa itimu
        yakho elondoloziwe. Ngaphambili, ikhasi lokungena lalilondoloza
        i-Cyberpunk kuqala futhi yahlala.</li>
      <li><strong>Ibhokisi lephasiwedi lokungena alisathi "Admin
        Login".</strong> Wonke ama-akhawunti angena ngephasiwedi, ngakho
        ingxoxo manje ithi nje Ngena. Ikhasi le-akhawunti nekhasi loSizo
        nawo asho kanjalo.</li>
      <li><strong>Usizo lusesikhathini kuzo zonke izilimi.</strong> Amakhasi
        oSizo ahunyushiwe manje achaza Izinguqulo Zezifunda, athi wonke
        ama-akhawunti adinga iphasiwedi, futhi athi itimu yakho ilondolozwa
        ne-akhawunti yakho. Usizo kuzo zonke izilimi, kuhlanganise nesiNgisi,
        manje lunikeza ubuncane bangempela bephasiwedi obuyizinhlamvu
        eziyi-12.</li>
      <li><strong>Ukulungiswa okuncane:</strong> i-fanart enegama lefayela
        elinophawu lwe-apostrophe manje iyavela emakhasini emidlalo
        nawezindondo; Izilungiselelo azisakhombisi iphutha lesikripthi
        kuma-akhawunti angewona awabalawuli, futhi izifundi-skrini manje
        zizwa ukuthi iyiphi ithebhu ye-Izilungiselelo ekhethiwe; ukushiya
        ikhasi akusagcwalisi i-console ye-browser ngamaphutha ezicelo
        ezikhanseliwe; imodeli yokukhulisa izithombe ilandwa ekhelini
        elisebenzayo kuqala; futhi isifaki asisaphahlazeki ku-Windows uma
        okukhishwa yiso kulondolozwa efayeleni.</li>
      <li><strong>Umzuliswano obanzi wokulungiswa kokwethembeka.</strong>
        Ukulondoloza umdlalo onesihloko esingenalutho akusazilahli ezinye
        izinguquko zakho. Ukuqala kabusha manje kuvumela imisebenzi
        esebenzayo ukuthi ime kahle kuqala. I-Create M3U iyenqaba ukubhala
        phezu kwe-playlist noma ifolda esikhona. Ukusula uhlu lwamafayela
        angadingekile kumaThuluzi e-ROM manje kusho ukuthi "ungasusi lutho",
        futhi amaphethini amabili awasawabambi amagama angempela e-ROM afana
        no-"Release of the Dragon". Ifayela elilodwa lezindondo ze-PS3
        elonakele alisazisuli izindondo zayo yonke imidlalo. Ukugcwalisa
        nge-AI kubhala isifunda esisodwa. Ukuhlaziya kubala umdlalo ngamunye
        kanye eshadini lezilinganiso. Ukungenisa kwe-CLZ kusebenzisa amagama
        ajwayelekile ezinhlobo. Ezingxoxweni zokuhlela, uhlobo namanye
        amathegi angasuswa kuzo zonke izilimi, futhi izinqamuleli zekhibhodi
        azisazithathi u-Ctrl+D noma u-Ctrl+G. Ababukeli babona isimo
        sokuqedwa komdlalo kodwa abasakwazi ukusishintsha, ngoba sabelwana
        ngaso yibo bonke.</li>
      <li><strong>Izifundi-skrini zifunda iswishi ethi Platform Match
        Required ngegama layo elibonakalayo</strong> ku-Izilungiselelo →
        Ukuscrapha.</li>
      <li>Kwezinye izilimi, Izilungiselelo manje zihumusha okuthi "Default
        Region", futhi ithebhu yokuScrapha ifundeka njengegama esikhundleni
        sokuthi "ukuscrapha kuyaqhubeka". Amakhasi osizo asebenzisa amagama
        afanayo.</li>
      <li><strong>Umdlalo ongavaleki awusakhonjiswa
        njengovaliwe.</strong> Uma i-emulator isinda ku-Misa, i-RetroDB
        iqhubeka nokuyikhombisa njengesebenzayo. Ukuqalisa kwe-RetroArch
        okwenqatshiwe akusabhali ifayela layo lezilungiselelo kuqala, futhi
        i-emulator ehluleka ngokushesha ikhombisa umlayezo wayo wephutha
        ekuhloleni kokuqala.</li>
      <li>Imitapo yolwazi ebuyekeziwe: i-Pillow 13 (ukuphathwa kwezithombe),
        i-numpy 2.5.4 ne-onnxruntime 1.31 (ukukhulisa izithombe), kanye
        nezinguqulo zakamuva zamathuluzi okwakha nokukhipha.</li>
      <li>Ngemuva kwezigcawu: ikhodi yokuqalisa imidlalo ihlelwe kahle ukuze
        kube lula ukuyilandela, ikhodi engasetshenziswa isusiwe (ikheli le-API,
        umsizi we-PSN, isikripthi sezindondo esingazange silayishwe yinoma
        yiliphi ikhasi, nesilungiselelo setimu yesayithi yonke esingazange
        sifundwe yilutho), izimpendulo ze-app ku-browser zakhiwa endaweni
        eyodwa, amadokhumenti amaningana omklamo alungisiwe ukuze afane
        nekhodi, iqoqo lokuhlola lihlelwe kahle, futhi isihloli esisha
        sibamba iphutha le-syntax ye-JavaScript ngaphambi kokukhishwa.
        Okufakiwe okudala kwe-Ilogi Yezinguquko obekuchaza ikhodi esusiwe
        manje kuyasho.</li>
    </ul>
- version: 3.29.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Amanye amagama omdlalo akhombisa isifunda avela kuso
  body: |
    <ul>
      <li><strong>Amanye amagama omdlalo akhombisa isifunda avela
        kuso.</strong> Ikhadi elithi Yaziwa nangokuthi ekhasini lomdlalo
        limaka igama ngalinye ngezwe noma isifunda salo, njengeJapane
        ku-"Rockman", ngolimi lwakho. Amagama amakiwe eza kuqala, ahlelwe
        ngesifunda. Beka isikhombi phezu kwegama ukuze ubone umthombo walo
        nanoma yiliphi inothi, njengokuthi "Working title".</li>
      <li>Amagama avela ku-IGDB manje agcina isifunda sawo. Ngaphambili,
        amagama e-ScreenScraper kuphela ayenaso.</li>
      <li>Ilebula ethi "SS" ye-ScreenScraper ayisaveli njengesifunda.
        Yigama le-ScreenScraper lomdlalo, hhayi indawo.</li>
      <li>AmaThuluzi e-ROM → Gcwalisa Izihloko Ezinye manje ihlola yonke
        imidlalo escraphiwe, ngakho amagama osuvele unawo athola izifunda
        zawo. Yiqalise kanye ukuze umake umtapo wakho okhona.</li>
    </ul>
- version: 3.28.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Khombisa i-RetroDB ifolda yakho yama-emulator bese iyawasetha
  - type: fix
    label: Ukulungiswa kwekhasi le-Izilungiselelo → Ama-emulator
  body: |
    <ul>
      <li><strong>Khombisa i-RetroDB ifolda yakho yama-emulator bese
        iyawasetha.</strong> Izilungiselelo → Ama-emulator kunohlu olusha
        oluthi Amafolda ama-emulator. Engeza ifolda ama-emulator akho
        ahlala kuyo bese i-RetroDB ithola ngalinye kuyo, njenge-AppImage,
        isikripthi esiphathekayo noma i-Flatpak efakiwe, futhi ilixhumanise
        nezistimu elizisebenzisayo. Isistimu esivele ine-emulator esebenzayo
        iyayigcina.</li>
      <li><strong>Bona ukuthi yiziphi izistimu ezilungele ukudlalwa.</strong>
        Ithebula lokuhlobanisa isistimu ngayinye manje libala wonke
        ama-emulator esistimu ngayinye, lisho ukuthi ngalinye liyasebenza
        yini, futhi likuvumela ukhethe i-emulator ezenzakalelayo yesistimu.
        Ku-DuckStation, PCSX2, RPCS3 ne-RetroArch liphinde lisho ukuthi
        amafayela e-BIOS akhona yini, futhi liqambe lawo angekho. I-RetroDB
        ifunda kuphela amafayela e-BIOS; ayilokothi ikopishe noma ilande
        elilodwa.</li>
      <li>Ukuskena ama-emulator manje kuthola wonke ama-emulator kudrayivu
        enkulu yama-emulator. Ngaphambili, kwakungama kusenesikhathi
        ngaphakathi kwefolda yezilungiselelo ye-emulator uqobo.</li>
      <li>Izinkinobho ze-RetroArch ezithi Auto-detect nethi Londoloza
        ziyasebenza futhi, futhi iwindi lokuhlela i-emulator alisaveli
        ekhasini uze ucindezele okuthi Hlela.</li>
    </ul>
- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Ukufaka imethadatha kukhombisa ukuthi sekufike kuphi
  body: |
    <ul>
      <li><strong>Ukufaka imethadatha kukhombisa ukuthi sekufike
        kuphi.</strong> Uma ukhetha umphumela ku-Sesha i-Metadata, iringi
        iyagcwala kusuka ku-0 kuya ku-100% nephesenti phakathi nendawo yayo,
        futhi umugqa ongezansi uchaza okwenzekayo: iyiphi isayithi esheshwayo,
        isiphi isithombe noma ividiyo elandwayo, noma ukuthi izithombe
        ziyacutshungulwa. Ukulanda okukhulu, njengevidiyo, kuhambisa iringi
        njengoba kufika. Ku-100% ikhasi liyalayisha kabusha nomphumela,
        njengangaphambili.</li>
      <li>Iringi ingahamba ngokungalingani. Umthombo ngamunye unquma ukuthi
        zingaki izithombe ozithumelayo kuphela uma uphendula, ngakho umthombo
        wokuqala onezithombe eziningi ungagcwalisa ingxenye enkulu yeringi,
        kanti ezilandelayo zigcwalise kancane.</li>
      <li>Uma ukufaka kwehluleka, iringi iyavaleka futhi umlayezo uyakusho
        lokho, ngaphandle kokulayisha kabusha ikhasi.</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Wonke amakhasi manje alingana newindi akulo
  - type: enhancement
    label: Ikhasi lomdlalo likhombisa amanye amagama ekhadini lawo, kanye nenkinobho ethi Incwadi Yokusebenzisa
  body: |
    <ul>
      <li><strong>Wonke amakhasi manje alingana newindi akulo.</strong> Amakhasi
        amakhadi (Izistimu, Imnyuziyamu, Amathegi, Izinhlu, Amathuluzi e-ROM,
        izindondo nezimpumelelo) engeza ikholomu noma nini lapho elinye ikhadi
        eliphelele lingena khona, kuze kube amane emgqeni. Amathebula, amathuluzi
        namakhasi emininingwane ayanabela kancane kodwa ayama lapho ukwanabela
        kakhulu kungahlukanisa nje amakholomu awo. Izilungiselelo zigcina amabhokisi
        azo ebubanzi obufundekayo.</li>
      <li><strong>Usizo ne-Ilogi Yezinguquko kugcina imigqa enobude
        obunethezekile.</strong> Ewindini elibanzi, izixhumanisi zezigaba zoSizo
        zithuthela ekholomini eceleni kombhalo; ewindini elincane zihlala emgqeni
        owodwa ongawuswayipha, esikhundleni sebhulokhi elalimboza ingxenye enkulu
        yesikrini sefoni.</li>
      <li><strong>Ikhasi lomdlalo:</strong> ewindini elibanzi imifanekiso-skrini
        igijima phezulu, bese ividiyo nekhadi elisha elithi <strong>Yaziwa
        nangokuthi</strong> kuhlala eceleni komunye ngezansi, kulingana nekhava.
        Amanye amagama ayengumbhalo ofiphele ngaphansi kwesihloko; manje ahlala
        ekhadini okulula ukulifunda. <strong>Incwadi Yokusebenzisa</strong>
        iyinkinobho eceleni kwethi Dlala, futhi Umlando Wokuscrapha uqala
        ugoqiwe.</li>
      <li>Izindondo ze-PSN zikhombisa amakholomu kusuka kwelilodwa kuya kwamane
        ngokuya ngewindi esikhundleni sokuba njalo abe mathathu.</li>
      <li>Amakhasi amaningana awasashibhekeli eceleni efonini: Izindondo, Izindondo
        Zomqoqi, ikhasi lesistimu le-RetroAchievements, Usizo, Izilungiselelo,
        Ukuhlaziya, Okungeniswe Kwemidlalo kanye namakhasi emininingwane
        yezimpumelelo nezindondo. Amathebula abanzi manje ashibhekela ngaphakathi
        kwawo lapho.</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Amakhasi oMtapo, ezistimu nemidlalo manje alingana newindi akulo
  body: |
    <ul>
      <li><strong>Amakhasi asebenzisa iwindi elibanzi lapho kusiza, futhi kuphela
        lapho.</strong> UMtapo nawo wonke amakhasi ezistimu engeza ikholomu
        yamakhadi emidlalo noma nini lapho elinye ikhadi eliphelele lingena khona,
        kuze kube amane emgqeni. Ifoni ikhombisa elilodwa, iwindi elingangengxenye
        yesikrini amabili noma amathathu, iwindi elibanzi amane. Amakhasi ayevame
        ukuma ebubanzini obungaguquki futhi ashiye ingxenye enkulu yewindi elikhulu
        ingenalutho.</li>
      <li><strong>Ikhasi lomdlalo libeka ikhava yalo nemininingwane eceleni
        kwemifanekiso-skrini nevidiyo</strong> uma kungena kokubili eceleni
        komunye, bese kuyakwakhiwa phezu komunye uma kungenjalo. Incazelo igcina
        imigqa enobude obunethezekile.</li>
      <li><strong>Inkinobho ethi Dlala ithuthele ekhoneni eliphezulu kwesokudla
        lekhadi ngalinye,</strong> incane futhi iphakathi nendawo. Manje iphinde
        ihlole ukuthi ifayela le-ROM lomdlalo lisekhona futhi lingelohlobo
        isistimu yalo eyamukelayo, ngakho ivela kuphela lapho ukuyicindezela
        kuzoqala umdlalo. Iyacasha ngesikhathi ukhetha imidlalo ngobuningi.</li>
      <li>Inkinobho yokubuyela phezulu namaphopu-ap enqubekela phambili manje
        ahlala eduze kokuqukethwe kwekhasi esikhundleni sokuba semaphethelweni
        akude ewindi.</li>
      <li>Ikhasi lomdlalo alisashibhekeli eceleni efonini.</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: Ulimi lokuhlola oluthi "Pseudo" lunikezwa abalawuli kuphela
  body: |
    <ul>
      <li><strong>"Pseudo" alusaveli ohlwini lwezilimi kuwo wonke
        umuntu.</strong> Kuyithuluzi lonjiniyela elikhombisa wonke amagama
        phakathi kwamabakaki nezimpawu zokuphimisa, ngakho manje lunikezwa
        abalawuli kuphela. Noma ubani omunye obeluzikhethele ubona i-app
        ngesiNgisi, kukhethwe isiNgisi kwiZilungiselelo.</li>
    </ul>
- version: 3.24.1
  date: '2026-10-17'
  tags:
  - type: fix
    label: Ukulanda kwe-Windows kuyafakeka futhi, futhi akusekho zikhukhula zamaphutha ngemva kokushintsha usayizi
  body: |
    <ul>
      <li><strong>Ukulanda okujwayelekile kwe-Windows bekungakwazi
        ukufakeka.</strong> Isifaki sasima ku-"Core dependencies failed to
        install", ngoba uhlu lwaso lwamaphakheji oluvaliwe lwalushiya ngaphandle
        iphakheji edingwa yi-Windows kuphela. Manje uhlu luhlanganisa zonke
        izinkundla. Ukulanda kwe-Windows okungadingi i-Python akuzange
        kuthinteke.</li>
      <li><strong>Imilayezo yamaphutha yayiqhubeka ivela ekhoneni eliphezulu
        kwesokudla</strong> etimini ye-Cyberpunk ngemva kokwenza iwindi le-browser
        libe banzi, isibonelo ngokulikhulisa ngokugcwele. Isizinda esinyakazayo
        manje sishintsha usayizi kahle.</li>
    </ul>
- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Dlala umdlalo ngqo kusuka kumakhasi oMtapo nezistimu
  body: |
    <ul>
      <li><strong>Inkinobho ethi ▶ Dlala ekhadini ngalinye lomdlalo.</strong>
        Ivela ekhoneni elingezansi kwesokunxele le-box art ekhasini loMtapo
        nakuwo wonke amakhasi ezistimu. Yicindezele bese umdlalo uqala ku-emulator
        yawo; uhlala ohlwini esikhundleni sokuvula ikhasi lomdlalo kuqala.</li>
      <li>Inkinobho ivela kuphela lapho ukuyicindezela kungasebenza khona:
        i-akhawunti yakho ivunyelwe ukuqalisa imidlalo, futhi i-emulator yomdlalo
        ivuliwe, ifakiwe futhi, uma kuyi-RetroArch, ine-core yayo. Imidlalo
        esezistimini ezingenayo i-emulator esebenzayo ayikhombisi
        nkinobho.</li>
      <li>Uma ukuqalisa kusehluleka, isibonelo ngoba ifayela le-ROM
        lithuthiwe, isizathu sivela emlayezweni bese ikhasi lihlala linjengoba
        belinjalo.</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: Ibha eseceleni emfushane, enekhasi elilodwa lezimpumelelo lazo zonke izinkundla
  body: |
    <ul>
      <li><strong>Isixhumanisi esisodwa esithi "Izimpumelelo" sithatha indawo
        yezinhlanu.</strong> I-RetroAchievements, i-RPCS3, i-PSN, i-Steam ne-Xbox
        manje ngamathebhu ekhasini elilodwa, futhi isixhumanisi sivula kabusha
        ithebhu oyisebenzise ekugcineni. Uma ungenayo imidlalo ye-RetroAchievements,
        sivula kuthebhu ye-RPCS3 esikhundleni sokukubuyisela kuDeshibhodi.</li>
      <li><strong>Imibiko ye-ROM manje itholakala kumaThuluzi e-ROM,</strong>
        njengethebhu eceleni kwamanye amathuluzi nanjengekhadi ekhasini
        lamaThuluzi e-ROM.</li>
      <li><strong>Azikho izixhumanisi ezimbili zebha eseceleni ezabelana nge-icon:</strong>
        iDeshibhodi manje ingu-🏠 kanti iSibuki Selogi singu-🧾. Ibha eseceleni
        inezixhumanisi eziyi-16 esikhundleni sama-21.</li>
      <li>Amathebhu amathuluzi ekhasini lezilungiselelo zamaThuluzi e-ROM
        ayehlala ngesiNgisi; manje alandela ulimi lwakho.</li>
    </ul>
- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: Ukusesha kwe-How Long To Beat kuyasebenza futhi
  body: |
    <ul>
      <li><strong>Konke ukusesha kwe-How Long To Beat kwakuthi umdlalo
        awutholakali.</strong> Isayithi lathuthela usesho lwalo ekhelini elisha,
        ngakho izicelo ze-RetroDB zanqatshwa; lokhu kwaphuka phakathi kokuphela
        kukaJulayi nokuphela kukaSepthemba. I-RetroDB manje isebenzisa ikheli
        elisha, futhi ithumela izihlungi zenkundla nonyaka ngefomethi entsha
        yesayithi, isayithi elase liqale ukuzinganaki. Ukusesha komdlalo owodwa
        nokusesha ngobuningi kumaThuluzi e-ROM kokubili kuyasebenza futhi.</li>
    </ul>
- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: I-RetroDB manje isho ngokucacile ukuthi ayikusekeli ukuqopha ngokungemthetho
  - type: fix
    label: Ibhokisi elithi Mayelana livuleka ngosayizi ogcwele futhi
  body: |
    <ul>
      <li><strong>Isaziso esimelene nokuqopha ngokungemthetho manje sise-app.</strong>
        Sivela ebhokisini elithi Mayelana nangaphansi kwe-Indlela Yomtapo we-ROM
        kwiZilungiselelo, kuzo zonke izilimi. Sithi i-RetroDB ayisabalalisi futhi
        ayibambi amafayela e-ROM, ukuthi kufanele usebenzise kuphela imidlalo
        ekopishwe kumadiski nama-cartridge ongumnikazi wawo, nokuthi i-RetroDB
        ayihlangene nanoma yimuphi umenzi wekhonsoli, umshicileli noma umtapo
        wedatha wemidlalo. Amagama afana nawewebhusayithi ye-RetroDB ne-trailer
        yayo.</li>
      <li><strong>Ibhokisi elithi Mayelana laliminyaniswe ebheni
        eseceleni.</strong> Manje livuleka phakathi nesikrini ngosayizi walo
        ojwayelekile, futhi liyashibhekela esikrinini esincane esikhundleni
        sokufihla isihloko salo nenkinobho yokuvala.</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: I-RetroDB iqalisa noma iqamba kabusha kuphela ngezinhlobo zangempela zamafayela e-ROM
  body: |
    <ul>
      <li><strong>Umdlalo wawungaqaliswa ngefayela okungelona
        i-ROM.</strong> Ukuqamba kabusha i-ROM kwakwamukela noma yiliphi igama,
        ngakho <code>crash.bin</code> lalingaba <code>crash.cfg</code> bese
        i-emulator inikezwa lona. Manje ukuqalisa kuhlola uhlobo lwefayela
        kuqhathaniswa nohlu olukufolda yaleyo sistimu ku-<code>systeminfo.txt</code>,
        uhlu olufanayo olusetshenziswa ukuskena komtapo, futhi ukuqamba kabusha
        kuyalwenqaba uhlobo olungekho kulolo hlu. Uma ifolda yesistimu ingenalo
        uhlu, imidlalo yayo ngeke iqale, futhi umlayezo ubiza ngegama ifayela
        elingekho.</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: Umlawuli kuphela ongashintsha ama-args okuqalisa omdlalo
  - type: fix
    label: Ama-args okuqalisa anamagama amaningana, noma isicaphuno esedukile, manje ayasebenza
  - type: fix
    label: I-RetroDB ayisagcini konke ukuqalisa okuphelile kwimemori
  body: |
    <ul>
      <li><strong>Umhleli wayengangeza ama-args okuqalisa asebenzisa enye
        ikhodi.</strong> <em>Ama-args okuqalisa ozenzele wona</em> omdlalo aya
        ngqo ku-emulator, futhi nge-RetroArch ayengalayisha noma yiliphi ifayela
        lohlelo ekhompyutheni. Ukuwashintsha manje kudinga indima yomlawuli,
        futhi inkambu ifihliwe kuwo wonke omunye umuntu.</li>
      <li><strong>Ama-args okuqalisa anegama elingaphezu kwelilodwa ayefika
        ku-emulator njengelilodwa.</strong> <code>--a --b</code> manje kufika
        njengama-args amabili, futhi inani elingenalutho alengezi lutho.
        Isicaphuno sokuvala esingekho sasivame ukuphula konke ukuqalisa kwalowo
        mdlalo ngephutha leseva; manje sikhombisa umlayezo obiza ngegama inkambu
        okufanele ilungiswe. Ithokheni ethi <code>{disc_paths}</code> isusiwe:
        yayihlala ingenalutho.</li>
      <li><strong>Ukuqalisa okuphelile kwakunqwabelana kwimemori kuze kube
        yilapho i-RetroDB iqala kabusha.</strong> Ukuqalisa okuphele ngaphezu
        kwehora elidlule manje kuyasuswa.</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: Ukukhetha ulimi kwiZilungiselelo kuyasebenza futhi
  body: |
    <ul>
      <li><strong>Ukukhetha ulimi ngaphansi kwe-Izilungiselelo &rarr; Umtapo &rarr;
        Ukubukeka akwenzanga lutho.</strong> Kwakhombisa iphutha esikhundleni
        salokho futhi ikhasi lahlala ngolimi lwalo oludala. Lokhu kwaphuka
        ku-3.23.8. Ukukhetha ulimi manje kuyalugcina futhi kulayishe kabusha
        ikhasi ngalolo limi.</li>
    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: Ama-icon ezindondo nezinkundla abuyile ekulandeni
  body: |
    <ul>
      <li><strong>Ukulanda kwakuntula ama-icon ezindondo nezinkundla
        e-RetroDB.</strong> Wonke amakhadi emidlalo ane-RetroAchievements
        ayekhombisa isithombe esiphukile lapho ibheji layo kufanele libe khona,
        futhi amazinga ezindondo kanye nama-logo e-PSN, Steam, Xbox ne-RPCS3
        nawo ayengekho. Manje afika kukho konke ukulanda.</li>
    </ul>
- version: 3.23.14
  date: '2026-10-10'
  tags:
  - type: security
    label: Imitapo yolwazi emibili efakiwe ibuyekeziwe ukuze ithole ukulungiswa kokuphepha okushicilelwe
  body: |
    <ul>
      <li><strong>I-urllib3 ne-Werkzeug zazinezinkinga zokuphepha
        ezaziwayo.</strong> I-RetroDB manje ifika ne-urllib3 2.8.0 ne-Werkzeug
        3.1.9, izinguqulo ezizilungisayo. Ukufakwa kwe-source kuzithola ngokuphinda
        usebenzise <code>install.py</code>, efaka kusuka ku-<code>requirements.lock</code>.</li>
    </ul>
- version: 3.23.13
  date: '2026-09-26'
  tags:
  - type: fix
    label: Imidiya egcinwe njengendlela yefolda ayisabikwa njengengekho
  body: |
    <ul>
      <li><strong>Ku-build ezimele yodwa, okuthi "clear missing media references"
        kwakungasula imidiya ebikhona ngempela.</strong> Lokhu kwakwenzeka lapho
        umtapo wedatha ugcina imidiya njengendlela yefolda efana ne-<code>images/boxart/…</code>
        esikhundleni segama lefayela nje. I-RetroDB manje iyayifuna kufolda
        efanele.</li>
    </ul>
- version: 3.23.12
  date: '2026-09-26'
  tags:
  - type: fix
    label: IDeshibhodi ikhombisa ukuscrapha ngobuningi okuqhubekayo, nokulungiswa okuncane okune
  body: |
    <ul>
      <li><strong>Ikhadi lenqubekela phambili yokuscrapha kuDeshibhodi lalingaveli
        nhlobo.</strong> Manje liyavela ngesikhathi ukuscrapha ngobuningi
        kuqhubeka, futhi lisho lapho kumisiwe okwesikhashana.</li>
      <li><strong>Awasekho amaphutha ku-console ye-browser ekhasini
        lokungena.</strong> Liyekile ukuhlola imisebenzi yangemuva ngaphambi
        kokuba kungene noma ubani.</li>
      <li><strong>Iwizadi yokusetha ayisasho ukuthi "Setup complete!" lapho
        ukugcina kwehlulekile.</strong> Manje ikutshela ukuthi izilungiselelo
        azikwazanga ukugcinwa.</li>
      <li><strong>Ukuscrapha ngobuningi okubili okuqale ngomzuzwana ofanayo
        akusabelani nge-id</strong>, ngakho izenzo zomugqa ezifana nokukhansela
        zisebenza kokufanele.</li>
    </ul>
- version: 3.23.11
  date: '2026-09-26'
  tags:
  - type: ui
    label: Izinkinobho zeminikelo manje zisho ukuthi zisekela ini
  body: |
    <ul>
      <li><strong>Amagama eminikelo acacile.</strong> Izinkinobho eziphezulu
        manje zithi "Sponsor RetroDB" no-"Support RetroDB". I-README ithi zonke
        izinguqulo zamahhala, nokuthi iminikelo ixhasa i-RetroDB uqobo, hhayi
        ama-emulator nama-core engawaqalisa.</li>
    </ul>
- version: 3.23.10
  date: '2026-09-26'
  tags:
  - type: fix
    label: Amakhasi amaThuluzi e-ROM alandela izilungiselelo zakho ezigciniwe, futhi amakhasi amaLogi namaThuluzi e-ROM ayasebenza futhi
  body: |
    <ul>
      <li><strong>Ikhasi lamaLogi namanye amakhasi amaThuluzi e-ROM ayephukile.</strong>
        Iskripthi kulawo makhasi sasehluleka lapho silayisha, ngakho isibuki selogi
        nezinsiza ezabelwana ngazo zamaThuluzi e-ROM azange ziqale. Manje
        ziyalayisha kahle.</li>
      <li><strong>Izilungiselelo zamaThuluzi e-ROM manje ziyasebenza.</strong>
        Umtholi Wamaphindwa noMguquli we-CHD avuleka nezinketho zawo zisethwe
        kusuka ekhasini le-ROM Tools Settings, futhi usengazishintsha
        ekusebenzeni okukodwa.</li>
      <li><strong>Izishintshi zoMguquli we-CHD zazingananakwa.</strong>
        Ukucisha okuthi "Delete original files" ekhasini akuzange kukumise
        ukususa uma isilungiselelo sakho esigciniwe sasithi kususwe. Manje
        izishintshi ezisekhasini yizo ezinqumayo.</li>
      <li><strong>Isilungiselelo se-Temporary Path siyasetshenziswa.</strong>
        Amafayela abekwa okwesikhashana ngesikhathi kwakhiwa ama-playlist e-M3U
        manje aya ngaphakathi kwayo.</li>
    </ul>
- version: 3.23.9
  date: '2026-09-26'
  tags:
  - type: security
    label: Amafayela elogi e-scraper awasagcini amaphasiwedi namathokheni, futhi imizamo yokungena iphinde yakhawulelwa
  - type: fix
    label: Ukugcina izilungiselelo akusasuli izilungiselelo zakho, futhi ukususa umsebenzisi kuyasebenza
  body: |
    <ul>
      <li><strong>Amafayela elogi ayegcina izimfihlo ngombhalo ocacile.</strong>
        Amafayela elogi e-scraper ayehloselwe ukufihla amathokheni okungena
        nokhiye be-API, kodwa isinyathelo sokufihla asizange sisebenze, ngakho
        ayebhalwa ngokugcwele. Manje ayafihlwa. Amafayela elogi amadala
        asenawo; susa amafayela amadala ku-<code>logs/</code> uma wabelana
        ngokufakwa kwakho.</li>
      <li><strong>Imikhawulo yemizamo yokungena yayingaphoqelelwa.</strong>
        Imikhawulo yokungena okuphindaphindiwe neyezenzo ezinzima (ukuskena,
        ukuscrapha, ukungenisa) yayisethiwe kodwa ingakaze ivulwe. Manje
        iyasebenza, futhi isicelo esivinjiwe sithola umlayezo ocacile othi
        "izicelo eziningi kakhulu".</li>
      <li><strong>Ifayela lezilungiselelo elonakele lalingasulwa.</strong> Uma
        <code>data/settings.json</code> lalingakwazi ukufundwa, ukugcina
        okulandelayo kwakulifaka esikhundleni ngezilungiselelo ezizenzakalelayo.
        I-RetroDB manje igcina ifayela elonakele njenge-<code>settings.json.corrupt-&lt;time&gt;</code>
        ngaphambi kokugcina. Uma ifayela liphinde lifundeka kahle, ukugcina
        kuyenqatshwa esikhundleni salokho.</li>
      <li><strong>Umugqa wokuqamba we-Injini walahla ezinye izilungiselelo.</strong>
        Ukwengeza ithegi emgqeni we-Injini kuzilungiselelo zokuqamba kwehluleka,
        futhi kwalahla nezilungiselelo ze-article nesifunda ezigcinwe kanye nawo.
        Manje kugcina kahle.</li>
      <li><strong>Ukususa umsebenzisi kwehluleka.</strong> Umsebenzisi onamathegi,
        izinhlu, izinto zoHlu Lwezifiso noma idatha ye-PSN wayengakwazi ukususwa.
        Ukususa manje kususa umsebenzisi nakho konke akuphethe.</li>
      <li><strong>Ukuscrapha okubili kwakungasebenza ngesikhathi esisodwa.</strong>
        Ukushintshanisa noma ukuhambisa ukuscrapha ngobuningi okuqhubekayo
        emugqeni kwakuqala ukuscrapha okubili okwabelana ngesibalo esisodwa
        senqubekela phambili. Manje kusebenza okukodwa kuphela.</li>
      <li><strong>Inqubekela phambili yokuscrapha ngobuningi yayingabukeka
        njengephutha.</strong> Ngaphambi kwempumelelo yakho yokuqala, ukuscrapha
        ngobuningi kwakubika isimo sakho ngendlela ezinye izikrini ezayifunda
        njengokwehluleka. Lokho kulungisiwe.</li>
      <li><strong>Ukungena manje kukubuyisela ekhasini obulicelile.</strong>
        Kwakuvame ukuya njalo kudeshibhodi.</li>
      <li><strong>Izenzo zamafayela zomlawuli zihlala ngaphakathi kwamafolda
        akho.</strong> Ithuluzi lokushintsha usayizi wezithombe nezenzo zokuqamba
        kabusha ama-ROM manje zenqaba noma yini engaphandle kwefolda yakho
        yemidiya noma yefolda ye-ROM.</li>
      <li><strong>Amafayela amadala okungena e-PSN ne-Xbox athuthelwa
        ku-akhawunti yakho.</strong> I-<code>data/psn_tokens.json</code> noma
        i-<code>data/xbox_tokens.json</code> esele ilayishwa ku-akhawunti yakho
        bese iqanjwa kabusha ukuze iphele ngo-<code>.migrated-015</code>. Lelo
        fayela lisaphethe ithokheni, ngakho lisuse uma usuhlolile ukuthi ukungena
        kuyasebenza.</li>
      <li><strong>Amaphutha acacile avela kuseva.</strong> Isicelo esibi manje
        siphendulwa ngomlayezo wephutha ofanele esikhundleni sokuthi "An internal
        error occurred".</li>
    </ul>
- version: 3.23.8
  date: '2026-09-25'
  tags:
  - type: fix
    label: Ukungenisa kwe-CLZ kuyasebenza futhi, amakhava ezinhlu ayavela, futhi amakhasi amaningana ayeka ukuphuka ngenxa ye-apostrophe
  - type: security
    label: Amagama ascraphiwe nezindlela zamafayela azisakwazi ukuphunyuka ezinkinobhweni zekhasi
  body: |
    <ul>
      <li><strong>Ukungenisa kwe-CLZ kwakungenzi lutho.</strong> Ukulayisha
        i-PDF ye-CLZ kwakuyithumela ekhelini iseva engenalo, ngakho konke
        ukulayisha kwakwehluleka ngokuthi "Parse failed". Manje ifika
        kumhlaziyi.</li>
      <li><strong>Amakhava ekhasini lohlu ayengekho wonke.</strong> Ikhasi lohlu
        lalicela ikhava ngayinye ekhelini elingalungile, futhi ikholomu yeSistimu
        yayihlala ingenalutho. Manje kokubili kuyavela. Izithombe zamakhava
        kusesho lwekhasi oluthi "engeza umdlalo" nazo zilungisiwe.</li>
      <li><strong>Izinkinobho zaziphuka emagameni ane-apostrophe.</strong>
        Ukususa i-"Assassin's Creed" ohlwini, ukususa umfanekiso-skrini,
        ukusondeza ikhava noma ukususa ithegi yohlobo kwakungenza lutho
        ngokuthula lapho igama linalo i-apostrophe. Iphutha elifanayo lavumela
        igama ascraphiwe elakhiwe ngamabomu ukuthi lisebenzise ikhodi ekhasini.
        Manje amagama ahamba aye kulezo zinkinobho ngendlela engeke ifundeke
        ngephutha njengekhodi.</li>
      <li><strong>Amakheli ezithombe nezixhumanisi ayaphunyukiswa yonke
        indawo.</strong> Amakhasi ambalwa ayakha amakheli ezithombe kusuka
        emagameni amafayela ascraphiwe ngaphandle kokuwaphunyukisa, futhi amakhasi
        amahlanu ayephethe ikhophi yawo ebuthakathaka yensiza yokuphunyukisa.
        Manje wonke asebenzisa leyo okwabelwana ngayo.</li>
      <li><strong>Ikhasi leZilungiselelo lalingavuleka lingenalutho.</strong> Uma
        ithebhu obuyisebenzise ekugcineni yayiqanjwe kabusha ngesibuyekezo,
        iZilungiselelo zazivuleka kungabonakali iphaneli. Manje ayinaki ithebhu
        engasekho. Izixhumanisi ezifana ne-<code>/settings#account</code>
        ziyayivula futhi leyo thebhu.</li>
      <li><strong>Ithimu yakho manje ikulandela kwamanye amadivayisi.</strong>
        Ithimu oyikhethayo igcinwa ku-akhawunti yakho. I-browser engakaze
        itshelwe ithimu isebenzisa leyo oyigcinile esikhundleni sezenzakalelayo.</li>
      <li><strong>Amaphopu-ap enqubekela phambili yemisebenzi akhombisa i-icon
        efanele.</strong> Imisebenzi emisiwe okwesikhashana, eqediwe nesemugqeni
        yayikhombisa i-icon efanayo ethi "iyasebenza". Manje isimo ngasinye sine-icon
        yaso, ngethimu ngayinye.</li>
      <li><strong>Uhlu lwezindlela ezisheshayo zekhibhodi manje lungahunyushwa.</strong>
        Amalebula alo ayengabonakali kumathuluzi okuhumusha, ngakho ayehlala
        ngesiNgisi kuzo zonke izilimi.</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: Izilinganiso zeminyaka zazivame ukungalungi, futhi imidlalo escraphiwe yayingalahlekelwa yimininingwane yayo
  body: |
    <ul>
      <li><strong>Izilinganiso zeminyaka zazivame ukungalungi, futhi iphutha
        lasabalala.</strong> Lapho isilinganiso sivela ku-TheGamesDB, i-app
        yayifuna ikhodi yesilinganiso noma kuphi ngaphakathi kombhalo esikhundleni
        sokuyifunda kahle &mdash; ngakho "T - Teen", "M - Mature 17+", "AO - Adults
        Only 18+" no-"RP - Rating Pending" konke kwagcinwa njengesilinganiso
        esingalungile, futhi umdlalo we-Mature wawungafakwa njengofanele wonke
        umuntu. Okubi kakhulu, leso silinganiso esingalungile sasesisetshenziswa
        ukugcwalisa ezinye izinhlelo eziyisishiyagalombili zezilinganiso, ngakho
        ukufunda okukodwa okubi kwasabalala kukho konke. Izilinganiso manje
        zifundwa kusuka kwikhodi esekuqaleni kombhalo.</li>
      <li><strong>Izilinganiso eziguquliwe zaziphuma zixegile kakhulu.</strong>
        Lapho igcwalisa isilinganiso esingekho kusuka kwesisodwa obusunaso, i-app
        yayingasebenzisa isilinganiso esisanda kusibala imizuzwana ngaphambili
        esikhundleni salesi oqale ngaso ngempela. Isinyathelo ngasinye salahlekelwa
        ubunzima obuncane. Manje ihlala iguqula kusuka ezilinganisweni umdlalo
        onazo ngempela.</li>
      <li><strong>Ukuphinda Uscraphe Ngokugcwele kwasula Isifunda noHlobo
        Lokulondoloza obekukhethwe ngesandla.</strong> Akukho kulokhu okuvela
        ku-scraper &mdash; i-app iyakubala &mdash; ngakho Ukuphinda Uscraphe
        Ngokugcwele kwakufaka u-"USA" ozenzakalelayo esikhundleni sika-"Japan"
        wakho owukhethile. Amanani akho manje ayagcinwa ngaphandle kokuthi umthombo
        unikeze elisha ngempela.</li>
      <li><strong>I-scraper yayingamukela umdlalo ongalungile.</strong> Imiphumela
        ye-ScreenScraper ivamise ukuhlolwa ngamaphuzu okufana ngaphambi
        kokusetshenziswa, kodwa usesho olubuyisa umphumela owodwa kuphela lwaleqa
        lokho kuhlola ngokuphelele. Manje wonke umphumela uthola amaphuzu.</li>
      <li><strong>Umdlalo wawungalahlekelwa yiyo yonke imininingwane yawo
        escraphiwe ngenxa yenkambu eyodwa engekho.</strong> Uma i-IGDB noma
        i-ScreenScraper ishiye inkambu eyodwa ingenalutho ngendlela engalindelekile,
        sonke isibuyekezo sasilahlwa &mdash; umshicileli, unjiniyela, ubuciko
        nakho konke. Lezo zimo manje ziyaphathwa futhi enye imininingwane
        iyagcinwa.</li>
      <li><strong>Isithombe esehlulekile sasingabhalwa njengempumelelo.</strong>
        Uma isithombe esilandiwe sasiba yisithombe esingasebenziseki, i-app
        yayingasusi lutho futhi isagcina igama lefayela, ishiye ireferensi
        ephukile. Ifayela manje liyasuswa futhi inkambu ishiywa injalo.</li>
      <li><strong>Amamodi omdlalo manje asebenzisa amagama afanayo.</strong>
        Ama-scraper ahlukene ayebhala "Single-player" no-"Single-Player" kanye
        no-"Multiplayer" nje okwakungelona elinye lamalebula e-app uqobo, ngakho
        leyo midlalo yayingakwazi ukuhunyushwa noma ukufaniswa yisihlungi
        samaMamodi. Yonke imithombo manje ibhala amalebula afanayo. Imidlalo
        ekhona igcina amagama ayo amadala uze uyiscraphe kabusha noma usebenzise
        ithuluzi lokulinganisa kwiZilungiselelo.</li>
      <li><strong>Ukusesha kwe-Xbox manje kuziphatha njengayo yonke eminye
        imithombo.</strong> Kwakwenza izicelo zakho ze-web, ngakho kwakungenakho
        ukuzama futhi lapho i-Xbox Live ikucela ukuthi kwehlise ijubane, futhi
        kungekho mkhawulo wokuthi impendulo ingadonsa idatha engakanani. Manje
        kusebenzisa ukuxhumana okufanayo okwabelwana ngakho njengamanye
        ama-scraper.</li>
      <li><strong>Ikhodi ye-ScreenScraper engasetshenziswa isusiwe.</strong>
        Imisebenzi emibili okungekho lutho ku-app olwalubiza yona isusiwe. Omunye
        wayo wawubuyisa ikheli le-web nephasiwedi yakho ye-ScreenScraper
        isekulo, okwakungase kunikeze iphasiwedi kunoma yini eyawusebenzisa.
        I-"System Media Endpoint" ebalwe kuma-release notes e-3.6.x yayingomunye
        wale &mdash; yayingakaze ifinyeleleke kunoma iyiphi indawo ku-app.</li>
    </ul>
- version: 3.23.5
  date: '2026-09-02'
  tags:
  - type: fix
    label: Ukulanda okupakishiwe bekungakwazi ukuqala, nokunye ukulungiswa kwe-build
  body: |
    <ul>
      <li><strong>Ukulanda okuzimele (Standalone) bekungakwazi ukuqala nhlobo.</strong>
        I-build epakishiwe iphethe i-Python yayo, kodwa i-launcher engaphakathi
        kwayo kwakuyileyo ebhalelwe ukufakwa kwe-source &mdash; yayifuna amafayela
        e-Python i-build epakishiwe engenawo, futhi yama emgqeni wokuqala. Manje
        iphakheji ifika ne-launcher yayo, evele iqalise i-app futhi ivule i-browser
        yakho uma iseva isisebenza.</li>
      <li><strong>Isinqamuleli sedeskithophu ekulandeni kwe-Linux sasingaqalisi
        lutho.</strong> Safika nombhalo wesikhashana lapho indlela eya ku-app
        bekufanele ibe khona. Manje kukhona i-<code>install-launcher.sh</code>
        eduze kwe-launcher &mdash; yisebenzise kanye bese isinqamuleli sibhalwa
        nendlela yangempela eya noma kuphi lapho uyivule khona.</li>
      <li><strong>Ukuqala kusuka ku-source kwakufaka ama-dependency
        angaqinisekisiwe.</strong> Lapho i-Flask ingekho, iskripthi sokuqala
        sasilanda amaphakheji ngqo ku-inthanethi ngaphandle kokuhlola i-checksum,
        futhi sidlula ngenkani isiphathi samaphakheji sesistimu yakho endleleni.
        Manje sidlulisela ku-<code>install.py</code>, esebenzisa ifayela lokukhiya
        elinama-checksum.</li>
      <li><strong>Ukulanda kwe-source kwakuphethe amafayela omnakekeli
        okwakungafanele kube nawo.</strong> Uhlu lwalokho okufanele kushiywe
        ngaphandle lwalugcinwa ngesandla futhi lwalusalele emuva, ngakho okuphume
        ekuhloleni namafolda e-build asele kwakupakishwa ne-app. Ukulanda manje
        kwakhiwa kusuka ohlwini lwamafayela akhona ngempela kuphrojekthi, okungeke
        kuhlehle.</li>
      <li><strong>Amaphaneli amabili eZilungiselelo aphuka ku-build
        epakishiwe.</strong> Amaphaneli ezibalo zomtapo nesimo se-API ayefuna
        uhlelo oluyinhloko ngegama elingenalo ngaphakathi kwe-build epakishiwe,
        ngakho womabili ehluleka.</li>
      <li><strong>Omunye umbhalo osesikrinini wawungeke uhunyushwe.</strong>
        Izingxenye ezintathu ezintsha ze-app &mdash; izilungiselelo ze-emulator,
        inkinobho yokuqalisa nebha ethi "iyadlalwa manje" &mdash; zeqiwa
        ukuskena kokuhumusha, futhi ukuhlola okwakuhloselwe ukubamba lokho
        kwakubheka uhlu olufanayo olungaphelele. Ukuskena manje kuhlanganisa wonke
        amafayela ngokuzenzakalelayo, futhi umbhalo wazo usufakiwe
        ezinguqulweni.</li>
      <li><strong>Ukwakha kabusha izinguqulo kwakungenza lutho
        ngokuthula.</strong> Ukwengeza umbhalo esikriphthini sekhasi elithile
        kwashiya ukwakha kabusha kukholelwa ukuthi akukho okufanele kwenziwe,
        ngakho umbhalo omusha awuzange ufike kwifayela lokuhumusha.</li>
      <li><strong>Isixazululo sekhadi lemifanekiso sasisetshenziswa kuwo wonke
        umuntu.</strong> Iskripthi sokuqala se-Linux sasiphoqa isilungiselelo
        esihloselwe ikhadi elilodwa elithile le-AMD kuyo yonke imishini, okwakungase
        kuminyanise isikhulisi sezithombe kwezinye izingxenyekazi zekhompyutha ze-AMD.
        Manje sisebenza kuphela lapho lelo khadi likhona ngempela, futhi asikaze
        sibhale ngaphezu kwenani olisethe wena.</li>
      <li><strong>Iskripthi sokukhipha sasingashicilela inguqulo
        engalungile.</strong> Ithegi esele emzamweni wangaphambili yaphinde
        yasetshenziswa ngokuthula, ngakho i-build yayingenziwa kusuka ku-snapshot
        endala ngenkathi ibika impumelelo.</li>
    </ul>
- version: 3.23.4
  date: '2026-09-02'
  tags:
  - type: fix
    label: Izindlela eziyisishiyagalolunye umtapo wakho owawungalahlekelwa ngazo yidatha, zivaliwe
  body: |
    <ul>
      <li><strong>"Clear scraped data" yasula wonke umtapo wakho.</strong>
        Ibhokisi lokuqinisekisa lalibala kuphela imidlalo eyayiscraphiwe ngempela,
        bese isenzo sisula yonke imidlalo noma kunjalo &mdash; ngakho sasingathembisa
        ishumi nambili bese sisula izinkulungwane. Lapho izithombe zivuliwe,
        sasusa nobuciko bekhava obulayishe ngesandla futhi sasetha kabusha
        izihloko ozihlele wena, emidlalweni engakaze iscraphwe nhlobo. Manje
        senza ncamashi lokho okushiwo yibhokisi.</li>
      <li><strong>I-box art ye-3D yashiya isixhumanisi esiphukile.</strong>
        Ukusula nezithombe kwasusa ikhava ye-3D kudiski kodwa kwagcina umtapo
        wedatha uyikhomba, ngakho i-app yafuna ifayela elingasekho.</li>
      <li><strong>Isishintshi esithi "Nezela" sokuHlela Okuyisixuku safaka
        esikhundleni kunokwengeza.</strong> KuMbono naku-Ubukhulu senza okuphambene
        ncamashi nelebula yaso, sibhala ngaphezu kwamanani akhona kuyo yonke
        imidlalo ekhethiwe ngesikhathi esisodwa, kungekho ukuhlehlisa.</li>
      <li><strong>Ama-build azimele ayengasula zonke izinkomba zezithombe
        ngokuchofoza kanye.</strong> Ekulandeni okupakishiwe i-app yayifuna
        imidiya yakho endaweni engafanele, yanquma ukuthi zonke izithombe
        azikho, bese okuthi "clear missing media references" kwakhipha konke
        okufakiwe kobuciko, imifanekiso-skrini, ividiyo nencwadi yokusebenzisa
        kuwo wonke umtapo. Ukuhlola kokuphepha okukhona ukuze kubambe ncamashi
        lokhu kwakungakuboni. Kwathinteka i-build epakishiwe kuphela.</li>
      <li><strong>Ukushanela amafayela azintandane kwakungasusa ubuciko
        ngesikhathi bufika.</strong> Ikhava elandwe ngesikhathi ukushanela
        kuqhubeka yayingathathwa njengentandane bese isuswa.</li>
      <li><strong>Ukudala ama-playlist kwathutha ama-archive akho ngaphandle
        kokubuza.</strong> Ukudala ama-playlist e-M3U ngeqoqo kwathutha
        amafayela akho e-archive angempela ngisho noma ushiye leyo nketho icishiwe
        &mdash; futhi lapho uyicelile, kwabika ukwehluleka kokuthutha
        okwakusebenzile.</li>
      <li><strong>Isishintshi sosayizi wezithombe sasikhukhumeza ifolda yakho
        yemidiya.</strong> Sasithatha ama-thumbnail amancane esiwakhiqizayo
        njengezithombe ezintsha okufanele zikhuliswe, sizikhulise zibe
        ngosayizi ogcwele bese senza ama-thumbnail alezo. Konke ukusebenza
        kwengeza amafayela engeziwe, amakhasi athula ethumela izithombe ezigcwele
        esikhundleni sama-thumbnail, futhi isikhulisi se-AI sasebenza emafayeleni
        acishe aphindwe kathathu kunenani elihlosiwe.</li>
      <li><strong>Ukugcwalisa nge-AI kwabhala ngaphezu kwemininingwane
        obuyilungisile.</strong> Ekuscraphweni okujwayelekile kwakungafaka
        esikhundleni somshicileli wakho, unjiniyela, uhlobo, izilinganiso zeminyaka
        nokunye. Manje kugcwalisa izikhala kuphela; inkinobho ethi Ukugcwalisa
        nge-AI oyicindezela ngokwakho ayishintshile.</li>
      <li><strong>Ukuscrapha okuphindaphindiwe kwakungasusa umfanekiso-skrini
        omuhle.</strong> Imidlalo escraphwe ku-RAWG yayiphinda isebenzise
        amagama afanayo amafayela, ngakho ukuscrapha kwesibili kwabhala ngaphezu
        komfanekiso-skrini ogciniwe, bese kuwususa njengempinda ngenkathi umtapo
        usawubala.</li>
    </ul>
- version: 3.23.3
  date: '2026-09-01'
  tags:
  - type: fix
    label: Izindima zasekhaya manje zenza ncamashi lokho ezikushoyo, futhi i-akhawunti ecishiwe ivaleleka ngempela ngaphandle
  body: |
    <ul>
      <li><strong>Ukucisha umuntu manje kuqeda iseshini yakhe.</strong> Ukucisha
        i-akhawunti kwayifihla kuzo zonke izikrini, kodwa noma ubani owayesengene
        ngaleyo akhawunti waqhubeka esebenza njengokujwayelekile isikhathi esifika
        evikini. Ukucisha kuwukuphela kwendlela yokuvalela umuntu ngaphandle
        ngaphandle kokumsusa, ngakho manje kusebenza ngokuchofoza kwakhe
        okulandelayo.</li>
      <li><strong>Ama-akhawunti okufunda kuphela awasakwazi ukushintsha idatha
        yemidlalo.</strong> Izenzo ezintathu ze-"how long to beat" zazivulekele
        wonke umuntu ongenile, kuhlanganise nabokubuka kuphela &mdash; ngakho
        i-akhawunti yokufunda kuphela yayingabhala ngaphezu kwesikhathi sokudlala,
        noma isisule kuyo yonke imidlalo emtapweni. Manje zidinga amalungelo
        okuhlela, njengazo zonke ezinye izenzo ezishintsha umdlalo.</li>
      <li><strong>Umlandeli wezindondo uyasebenza kuwo wonke umuntu futhi.</strong>
        Ukuvuselela izindondo zakho zomqoqi kwakudinga amalungelo omhleli, izindima
        zoMdlali noMbukeli ezingenawo &mdash; futhi kuwukuphela kwento ebhala
        lezo zindondo. Lawo ma-akhawunti ayengeke azuze eyodwa, futhi inkinobho
        ethi Vuselela yayikhombisa iphutha nje. Kuyinqubekela phambili yakho,
        ngakho manje ayidingi malungelo akhethekile nhlobo.</li>
      <li><strong>Ukuvuselela kwe-PlayStation komuntu oyedwa akusiko okomunye
        umuntu ukukumisa.</strong> Noma iyiphi i-akhawunti engenile yayingamisa
        okwesikhashana noma ikhansele ukuvuselela okuqalwe ngomunye umuntu, futhi
        ibone ukuthi lowo muntu ukuwuphi umdlalo. Kokubili manje kukhawulelwe
        kulowo okuqalile.</li>
      <li><strong>Ukungenisa kwe-Steam kusebenzisa i-akhawunti yakho, hhayi
        kalowo owagcina eyakhe kuqala.</strong> Ukungenisa umtapo kwakufunda
        ikhophi eyodwa okwabelwana ngayo yeziqinisekiso ze-Steam esikhundleni
        sezakho, ngakho kwakungalanda umtapo womunye umuntu &mdash; ngenkathi
        imininingwane yakho egciniwe ibonakala ingekho.</li>
      <li><strong>Ukuqagela iphasiwedi yomlawuli kunzima futhi.</strong> Umkhawulo
        wemizamo yokungena ehlulekile wawabelwana ngawo yibo bonke abasenethiwekhini,
        ngakho noma ubani one-akhawunti yakhe wayengawusula ngokungena bese
        eqhubeka eqagela unomphela. Umkhawulo manje ungowe-akhawunti ngayinye.</li>
      <li><strong>Amaphutha avela ku-app manje afika ekhasini esikhundleni
        sokunyamalala.
        </strong> Lapho isenzo senqatshwa, ezingu-115 zazo zaziphendula
        ngendlela ikhasi elalingakwazi ukuyifunda, ngakho kwakubukeka sengathi
        isenzo sisebenzile. Manje zibika ukwenqatshwa kahle, futhi ubona
        umlayezo wangempela.</li>
    </ul>
- version: 3.23.2
  date: '2026-08-06'
  tags:
  - type: fix
    label: Amakhasi ezilungiselelo ze-scraper alayisha ngokushesha futhi akaze akhombise ukhiye we-API omdala
  body: |
    <ul>
      <li><strong>Amakhasi eZilungiselelo ne-Scraper Config ayeka ukuphinda
        afunde ifayela lezilungiselelo ze-scraper kuso sonke isicelo.</strong>
        Izindawo ezine zazivula futhi ziphinde zihlaziye ifayela kudiski njalo
        lapho ikhasi noma ukuhlola kusebenza, nakuba isifundi esabelwana ngaso
        esine-cache sasivele sikhona. Manje zonke ziyasisebenzisa, ngakho lawo
        makhasi enza umsebenzi omncane ngokuvakasha ngakunye.</li>
      <li><strong>Ukugcina kusasebenza ngokushesha.</strong> I-cache ekhohlwa
        ngesikhathi esibekiwe yayingakukhombisa amanani amadala isikhathi esifika
        engxenyeni yomzuzu ngemva kokugcina. Konke ukugcina manje kusula i-cache
        ngesikhathi kubhala, ngakho okubonayo yilokho osanda kukugcina.</li>
      <li><strong>Okhiye bakho bangempela be-API abasakwazi ukufakwa esikhundleni
        ngenani labo elifihliwe lokubonisa.</strong> Amakhasi ezilungiselelo
        akhombisa okhiye abagciniwe njenge-<code>***1234</code> esikhundleni
        sokhiye wangempela. Ngoba ikhasi lalinikezwa ikhophi efanayo yezilungiselelo
        esetshenziswa ama-scraper, lokho kufihla kwakungabhala ngaphezu kokhiye
        bangempela kwimemori futhi kushiye ama-scraper engena ngezinkanyezi
        kuze kuphele isikhathi se-cache.</li>
      <li><strong>Ama-build azimele manje afuna izilungiselelo ze-scraper
        endaweni efanele.</strong> Ama-scraper ayethola indawo yefayela ngendlela
        ehlukile kunamakhasi alilondolozayo. Ekufakweni okujwayelekile kokubili
        kwakufika efayeleni elifanayo; ku-build ezimele (yokuchofoza kabili)
        kwakungeke kube njalo, ngakho okhiye be-API abagciniwe babengaya lapho
        ama-scraper angakaze abheke khona.</li>
    </ul>
- version: 3.23.1
  date: '2026-08-06'
  tags:
  - type: fix
    label: I-port yeseva oyigcina kwiZilungiselelo manje iyiyo i-port eyisebenzisayo
  body: |
    <ul>
      <li><strong>Ukugcina i-port yeseva kuyithutha ngempela iseva.</strong>
        IZilungiselelo zazamukela i-port, ziyihlole, ziyigcine, futhi zikutshele
        ukuthi kudingeka ukuqala kabusha ukuze isebenze &mdash; bese iseva iqala
        ku-5000 noma kunjalo. Akukho okwake kwalifunda futhi lelo nani. Manje
        liyingxenye yochungechunge lokuqala, ngakho ukuqala kabusha kuyithutha
        ngempela i-RetroDB iye ku-port oyikhethile. Noma yini esethwe
        endaweni yokusebenza isawina, ngakho i-launcher noma i-container
        enikeza i-port ayithinteki.</li>
      <li><strong>Izilungiselelo ezimbili ezingakaze zenze lutho zisusiwe
        esikhundleni sokulungiswa.</strong> Okuthi "Server host" no-"debug mode"
        kwakugcinwa futhi kubike isithembiso esifanayo samanga. Ukuvula i-debug
        mode kusuka kufomu ye-web kwakungaveza i-console ye-Python esebenzisanayo
        ku-browser, futhi ikheli lokubopha lilawula ukuthi yimiphi imishini
        engafinyelela i-RetroDB nhlobo &mdash; akukho kokubili okufanele kube
        ngemuva kwefomu lezilungiselelo. Kokubili kuhlala kulungiseleleka kusuka
        endaweni yokusebenza, lapho bekuvele kuhlala khona. Uma ifayela lakho
        lezilungiselelo lisenakho kuyalahlwa ngokuthula lapho kulayishwa;
        akukho okufanele ukwenze.</li>
      <li><strong>Akusekho lutho oluthi ukuqala kabusha kuzolusebenzisa ngaphandle
        uma ukuqala kabusha kulusebenzisa ngempela.</strong> Lelo kwakuyiphutha
        langempela &mdash; isilungiselelo esifile asihlanzekile, kodwa isithembiso
        samanga sichitha intambama.</li>
    </ul>
- version: 3.23.0
  date: '2026-08-06'
  tags:
  - type: enhancement
    label: Qala i-RetroDB ku-port ekhethwe ngomunye umuntu
  body: |
    <ul>
      <li><strong>I-RetroDB manje ifunda isilungiselelo se-<code>PORT</code>
        endaweni yayo yokusebenza.</strong> Uma uqalisa i-RetroDB kusuka kwelinye
        ithuluzi &mdash; ideshibhodi, i-container, iphaneli yeseva yasekhaya
        &mdash; lelo thuluzi manje lingayinikeza i-RetroDB i-port elifuna ibe
        kuyo, ngaphandle kokuthi kube nomuntu ohlela ifayela. Setha
        i-<code>PORT</code> bese i-RetroDB ibophela lapho; uma uyiyeka akukho
        okushintshayo nhlobo. I-<code>RETRODB_PORT</code> ekhona isasebenza
        ncamashi njengakuqala, futhi i-<code>PORT</code> iyawina uma kokubili
        kusethiwe.</li>
      <li><strong>Inombolo ye-port embi manje iyasho esikhundleni
        sokuqagela.</strong> Ngaphambili i-port engafundeki yayikhiqiza udonga
        lombhalo wamaphutha e-Python, futhi i-port engaphandle kobubanzi
        obusebenzisekayo yayitholakala kuphela lapho iseva yehluleka ukuqala.
        I-RetroDB manje ima ngokushesha ngomugqa owodwa obiza ngegama inani
        engakwazanga ukulisebenzisa. Ngeke iqale ngokuthula ku-port ehlukile
        kuneyo eceliwe &mdash; ukuthuthwa ngokuthula kubi kakhulu kunokutshelwa
        ukuthi cha.</li>
      <li><strong>Isibhengezo sokuqala nethebhu ye-browser kulandela i-port
        yangempela.</strong> Ikheli eliphrintwa lapho i-RetroDB iqala, nekhasi
        elikuvulela lona, kokubili kwakuvame ukusho u-5000 noma ngabe iyiphi
        i-port eyayisetshenziswa ngempela.</li>
    </ul>
- version: 3.22.1
  date: '2026-07-31'
  tags:
  - type: fix
    label: Ivimbela ifayela lokusebenza lomtapo wedatha ukuthi likhule ngaphandle komkhawulo
  body: |
    <ul>
      <li><strong>Ijenali yomtapo wedatha isinomkhawulo futhi.</strong> I-SQLite igcina ifayela lokusebenza (ifayela le-<code>-wal</code>) eceleni komtapo wakho wedatha. I-RetroDB yayihlose ukulinciphisa libe ngu-64&nbsp;MB, kodwa lo mkhawulo wawusebenza kuphela emisebenzini yangemuva &mdash; ukulayisha amakhasi nokuhlela okujwayelekile kwakusebenza ngaphandle komkhawulo nhlobo. Ngemuva kokubhala okukhulu ngokungajwayelekile, ifayela lalihlala kusayizi walo omkhulu kuze kube phakade, kwesinye isikhathi likhulu kunomtapo wedatha uqobo. Manje umkhawulo usebenza yonke indawo, ngakho isikhala siyabuyiswa.</li>
    </ul>
- version: 3.22.0
  date: '2026-07-05'
  tags:
  - type: enhancement
    label: Scrapha umdlalo ngokuthe ngqo kusuka kuphopu-ap yawo, ngaphandle kwesinyathelo esengeziwe
  body: |
    <ul>
      <li><strong>Scrapha kusuka kuphopu-ap yomdlalo.</strong> Iphopu-ap
        esheshayo yomdlalo (leyo evela lapho uchofoza umdlalo kuMtapo wakho) manje
        ine-nkinobho ethi <strong>Scrapha</strong> eceleni kwe-Ukugcwalisa&nbsp;nge-AI
        ne-Hlela. Yichofoze bese i-RetroDB ikusa ngqo kulowo mdlalo nosesho
        lwe-metadata seluvuliwe &mdash; awusadingi ukuvula ikhasi eliphelele bese
        ufuna inkinobho ethi Scrapha kuqala.</li>
    </ul>
- version: 3.21.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Qalisa ngokuchofoza kanye — qalisa i-RetroDB kusuka ku-icon ephiniweyo, ngaphandle kwe-terminal
  - type: feature
    label: I-app icon yangempela — i-neon gamepad kuthebhu ye-browser yakho ne-taskbar
  - type: feature
    label: Inkinobho entsha ye-Shut Down Server ekhasini le-Settings
  body: |
    <ul>
      <li><strong>Qalisa ngokuchofoza kanye.</strong> I-RetroDB manje ine-launcher
        efanele ongayiphina ku-taskbar yakho &mdash; yichofoze bese i-app iyaqala
        (uma ingakaqali) futhi ivuleke ku-browser yakho ngokuzenzakalelayo.
        Awusadingi ukuvula i-terminal futhi uthayiphe umyalo. Ku-Linux, sebenzisa
        <code>python3 scripts/install_launcher.py</code> kanye ukuze ufake
        &ldquo;RetroDB&rdquo; kumenyu yakho ye-app, bese uyayiphina.</li>
      <li><strong>I-app icon yangempela.</strong> I-RetroDB manje igqoke i-icon
        ye-neon gamepad &mdash; i-cyberpunk cyan ne-magenta kuthayela elimnyama
        &mdash; kuthebhu ye-browser yakho (i-favicon), ku-launcher ye-taskbar,
        nakuhlelo lwe-Windows uqobo. Ithatha indawo ye-emoji placeholder elula.</li>
      <li><strong>Inkinobho ye-Shut Down Server.</strong> I-Server Controls
        yekhasi le-Settings manje ine-nkinobho ebomvu ethi <strong>Shut Down
        Server</strong> eceleni kwe-Restart. Imisa i-app ngokuhlanzekile (ivumela
        noma yimiphi imisebenzi esebenzayo iqede ukugcina kuqala), ngakho
        awusadingi ukushintshela ku-terminal bese ucindezela u-Ctrl+C.</li>
      <li><strong>Ama-build angalandwa akuvulela i-browser.</strong> Ama-download
        e-Windows, e-Mac ne-Linux akulungele-ukusebenza manje avula i-browser
        yakho ngomzuzwana ngemva kokuqala, ngakho i-app iphambi kwakho ngaphandle
        kwesinyathelo esengeziwe.</li>
    </ul>
- version: 3.20.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Izilimi ezintsha eziyishumi nanye — RetroDB manje ikhuluma izilimi ezingama-21
  - type: fix
    label: 'Kulungiswe iphutha lekhonsoli elingenabungozi lapho ushiya uhlu lwemidlalo'
  body: |
    <ul>
      <li><strong>Amaphakethe olimi amasha ayishumi nanye.</strong> I-interface
        ye-RetroDB, ama-release notes, kanye ne-help manual manje kuhunyushelwe
        ku-<strong>Afrikaans, isiZulu, isiXhosa, Dutch, Norwegian (Bokm&aring;l),
        Russian, Polish, Turkish, Ukrainian, Indonesian, kanye ne-Hebrew</strong>
        &mdash; kujoyina i-German, Spanish, French, Italian, Japanese, Korean,
        Brazilian Portuguese, kanye ne-Simplified &amp; Traditional Chinese
        esivele ikhona. Khetha eyakho ngaphansi kwe-Settings &rarr; Display
        Preferences &rarr; Language; i-app iyaphinda ilayishe ngolimi
        olukhethayo.</li>
      <li>Ulimi ngalunye lufaka lonke uhlelo lokusebenza: yonke inkinobho,
        ilebula nomlayezo, wonke umlando wama-release notes, kanye nesiqondiso
        esiphelele sosizo.</li>
      <li><strong>isiZulu &amp; isiXhosa</strong> nazo zifakiwe. Njengezilimi
        ezinamagama amancane we-software akhona, zigcina amagama e-tech avamile
        (ROM, scraper, box art) ngesiNgisi lapho kungekho khona igama elifanele
        &mdash; ukuhlolwa kwesipelingi umuntu okhuluma ulimi lwebele
        kuyamukelekile ngaphambi kokuba uthembele kuzo.</li>
      <li><strong>Hebrew</strong> ihamba nombhalo ohunyushwe ngokugcwele;
        isakhiwo sekhasi elicwengekile sokusuka-kwesokudla-kuya-kwesokunxele
        (ukuze i-interface ibonakalise ngokufanele) sizofika esibuyekezweni
        esilandelayo. Arabic izolandela lapho lowo msebenzi wesakhiwo usufike.</li>
      <li><strong>Ukulungiswa kwephutha:</strong> ukushiya Umtapo noma uhlu lwemidlalo lwesistimu akusabhali &ldquo;ReferenceError&rdquo; engenabungozi kukhonsoli yesiphequluli (insalela yokuhlanzwa kwangaphambili). Awukho umphumela obonakalayo &mdash; nje ikhonsoli ehlanzekile.</li>
    </ul>
- version: 3.19.1
  date: '2026-07-05'
  tags:
  - type: performance
    label: Ukukhipha idatha ngokushesha — izithombe-skrini zomdlalo manje zilanda ngasikhathi sinye
  body: |
    <ul>
      <li><strong>Izithombe-skrini zilanda ngokufana.</strong> Ilandela indlela
        efanayo neye-frontend edumile ye-ES-DE (elanda wonke ama-media omdlalo
        ngasikhathi sinye), i-RetroDB manje ilanda izithombe-skrini zomdlalo
        <strong>ngasikhathi sinye</strong> esikhundleni sokuzilanda enye ngemuva
        kwenye, kuyo yonke imithombo (TheGamesDB, IGDB, RAWG, ScreenScraper).
        Imidlalo enezithombe-skrini eziningi iqeda ngokushesha okuphawulekayo.</li>
      <li>Ukuhlolwa kwezithombe-skrini eziphindaphindiwe kusasebenza ngemuva
        kwalokho ngokulandelana, ngakho ukususwa kwezithombe eziphindiwe
        kuhlala kunembe njengangaphambili &mdash; ukulanda kuphela okwenziwe
        ngokushesha. Ukulanda kunomkhawulo wokune ngasikhathi sinye ukuze
        umthombo owodwa ungalokothi ugcwaliswe ngokweqile.</li>
      <li>Ukuthuthukiswa kwesivinini ngaphakathi; kuqala ukusebenza ngemuva
        kokuqalisa kabusha okulandelayo.</li>
    </ul>
- version: 3.19.0
  date: '2026-07-05'
  tags:
  - type: performance
    label: Ukukhipha idatha ngokushesha — imithombo manje ibuzwa ngasikhathi sinye
  body: |
    <ul>
      <li><strong>Ukukhipha idatha kushesha ngomdlalo ngamunye.</strong> Uma
        i-RetroDB icinga umdlalo, ihlola izinombolodatha eziningana (ES-DE,
        TheGamesDB, IGDB, RAWG, ScreenScraper). Ngaphambili yayizibuza
        <em>enye ngenye</em> futhi ilinde impendulo yenye ngayinye ngaphambi
        kokubuza elandelayo &mdash; ngakho ukulinda kwakuyisamba sazo zonke.
        Manje izibuza zonke <strong>ngasikhathi sinye</strong> bese ilinda
        kuphela ephuza kunazo zonke, okuyisisheshiso esiphawulekayo kuwo wonke
        umdlalo. Imiphumela isahlelwa futhi inikwa amaphuzu ngendlela efanayo
        neyangaphambili.</li>
      <li><strong>Ukuxhawulana okuncane okumoshwayo lapho kulandwa ubuciko.</strong>
        Ukulanda kwezithombe manje kuphinda kusebenzise uxhumano oluvele
        luvuliwe esikhundleni sokuvula olusha kuso sonke isithombe, kwehlisa
        isikhathi emidlalweni enezithombe-skrini eziningi.</li>
      <li>Lezi ziwukuthuthukiswa kwesivinini ngaphakathi &mdash; akukho
        okushintshayo endleleni osebenzisa ngayo i-RetroDB, futhi ayigcindezeli
        izinombolodatha kakhulu (izicelo ezifanayo, nje ezenziwe ngasikhathi
        sinye). Kuqala ukusebenza ngemuva kokuqalisa kabusha okulandelayo.</li>
    </ul>
- version: 3.18.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Kufakwe izilinganiso zeminyaka zaseChina (China) njengesistimu yesi-9 yezilinganiso
  body: |
    <ul>
      <li><strong>Isistimu entsha yezilinganiso zeminyaka: China (CADPA).</strong>
        I-RetroDB manje isekela uhlelo lwaseChina olusemthethweni lwesikhumbuzo
        seminyaka semidlalo (&ldquo;网络游戏适龄提示&rdquo;, olukhishwa yi-CADPA)
        kanye namabhodi ayisishiyagalombili akhona (ESRB, PEGI, CERO, USK, ACB,
        FPB, GRAC ne-ClassInd). Lusebenzisa amazinga amathathu &mdash;
        <strong>8+</strong>, <strong>12+</strong> ne-<strong>16+</strong>
        &mdash; abonakala ngebheji eluhlaza elilula.</li>
      <li><strong>Luzigcwalisa lona, njengamanye.</strong> Uma umdlalo usuvele
        unesilinganiso esivela kwelinye izwe, i-RetroDB isibala izinga
        elifanele laseChina ngokuzenzakalelayo (nangokuphambene). Ungalikhetha
        noma ulishintshe ngesandla esikrinini sokuHlela somdlalo, futhi
        ulikhethe njengesistimu oyithandayo yokubukwa ngaphansi
        kwe-Izilungiselelo &rarr; Umtapo. Qaphela: iningi lezinombolodatha
        zemidlalo yaseNtshonalanga alishicileli isilinganiso saseChina, ngakho
        emidlalweni engenaso isilinganiso nhlobo sigcwaliswa ngokususela
        kokuqukethwe komdlalo ngesikhathi sokukhipha idatha / i-AI Fill.</li>
      <li>Amabheji aluhlaza abuciko obulula obuka-RetroDB (obufana nesitayela
        sasekhaya samanye amabhodi), hhayi ilogo esemthethweni ye-CADPA, ukuze
        kungabi khona izibopho zelayisensi yesithombe.</li>
    </ul>
- version: 3.17.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Sula okufakwe kudathabheyisi kwamafayela e-media angekho kudiski
  - type: security
    label: Vikela ukususwa kobuciko bawo wonke umtapo wakho lapho ifolda ye-media ilahleka
  body: |
    <ul>
      <li><strong>Ithuluzi elisha lokugcina: &ldquo;Missing Media References&rdquo;</strong>
        (Izilungiselelo &rarr; System &rarr; Maintenance). Liyisithombe
        esiphambene nokuhlanza okukhona kwe-&ldquo;Orphaned Media&rdquo;:
        esikhundleni sokuthola amafayela ezithombe asele angenawo umdlalo,
        lithola imidlalo egcina ubuciko bebhokisi, ubuciko bebhokisi be-3D,
        izithombe-skrini, i-fanart, ividiyo noma incwadi yesandla ekhomba
        emafayeleni angasekho kudiski. Wawaskene, bese usula lezo zinkomba
        eziphelelwe yisikhathi ngokuchofoza kanye ukuze ama-scraper
        akwazi ukuphinda alande ubuciko. Okufakwe komdlalo wakho ngokwakho
        akulokothi kuthintwe.</li>
      <li><strong>Ukuhlanza okuzenzakalelayo okuphephile ngesikhathi
        sokukhipha idatha.</strong> Uma i-RetroDB iphinda ikhipha idatha
        yomdlalo iyasula ngokuthula izinkomba zamafayela e-media asenyamalele
        kudiski. Ngaphambili, uma ifolda ye-media yonke inyamalela ngasikhathi
        sinye &mdash; idrayivu yangaphandle engahlanganisiwe, noma ukususwa
        okuningi &mdash; lokho kuhlanza kwakungasusa irekhodi lobuciko
        emidlalweni eyizinkulungwane bebunayo, kuphoqe ukuphinda kukhishwe
        idatha okubizayo. I-RetroDB manje iyasibona lesi siginali: uma ifolda
        ye-media ilahlekile noma ingenalutho ngokuphelele, igcina izinkomba
        futhi ibhale isexwayiso esikhundleni sokuzisula. Ithuluzi elisha
        lokugcina lisebenzisa isivikelo esifanayo futhi liphawula ngokucacile
        noma iyiphi ifolda eyayigodliwe.</li>
    </ul>
- version: 3.16.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Iphaneli entsha ye-"Quick Fixes" kudeshibhodi
  body: |
    <ul>
      <li><strong>Iphaneli entsha ye-&ldquo;Quick Fixes&rdquo; kudeshibhodi</strong>
        iguqula imisebenzi yomtapo ehlakazekile ibe uhlu lokwenza olubonakala
        ngokushesha. Ikhombisa ukuthi mingaki imidlalo esaswela ubuciko
        bebhokisi, futhi inikeza izinqamuleli zokuchofoza kanye zokuthola
        ama-ROM aphindaphindiwe nokuhlola imizila ye-ROM ephukile (imidlalo
        emafayela ayo asuke ahanjisiwe noma asusiwe). Isinqamuleli ngasinye
        sixhumana ngokuqondile nekhasi elisilungisayo. Iphaneli ivela uma
        usunemidlalo emtapweni wakho.</li>
    </ul>
- version: 3.15.0
  date: '2026-07-03'
  tags:
  - type: accessibility
    label: Abafundi bezikrini manje bamemezela intuthuko yomsebenzi ngokuzwakalayo
  body: |
    <ul>
      <li><strong>Imisebenzi ethatha isikhathi eside manje ikhuluma intuthuko
        yayo kubafundi bezikrini.</strong> Uma ukukhipha idatha okuningi,
        ukuvumelanisa impumelelo (RetroAchievements noma PlayStation), noma
        ukushintsha usayizi wezithombe kusebenza, abasebenzisi bomfundi
        wesikrini babejwayele ukungezwa lutho phakathi
        kwe-&ldquo;kuqaliwe&rdquo; ne-&ldquo;kuqediwe&rdquo;. I-RetroDB manje
        imemezela izigaba ezithile ngezikhathi ezithile (isibonelo
        &ldquo;Bulk Scrape: 12 kwangu-40&rdquo;) nokuqedwa okukhulunywayo
        &mdash; ngaphandle kwezaziso ezivelayo ezengeziwe esikrinini.
        Izaziso zihanjiswa ngesivinini esazisa ngaphandle kokuqhwaphaza,
        futhi zilandela ulimi olukhethile.</li>
    </ul>
- version: 3.14.0
  date: '2026-07-01'
  tags:
  - type: feature
    label: Izilimi ezintsha — isiShayina (esilula & esendabuko) manje siyatholakala
  body: |
    <ul>
      <li><strong>I-RetroDB manje iyatholakala ngesiShayina.</strong>
        Kunezinketho ezimbili ngaphansi kwe-<strong>Izilungiselelo &rarr;
        System &rarr; Language</strong>: <strong>中文 (简体)</strong>
        (esilula, sesizwe saseChina) ne-<strong>中文 (繁體)</strong>
        (esendabuko, seHong Kong neTaiwan). Isixhumi sonke &mdash; amamenyu,
        izinkinobho, imilayezo, nencwadi yesandla ye-Help engaphakathi
        kohlelo &mdash; sihunyushiwe, futhi noma yini engakahunyushwa
        ibuyela ngokuthula esiNgisini. Lokhu kwenza izilimi ezisekelwayo
        zibe yishumi (isiNgisi, isiJalimane, isiSpanishi, isiFulentshi,
        isiNtaliyane, isiJapane, isiPutukezi saseBrazil, isiKorea, futhi
        manje isiShayina esilula &amp; esendabuko).</li>
    </ul>
- version: 3.12.0
  date: '2026-06-30'
  tags:
  - type: feature
    label: Ulimi olusha — isiKorea (한국어) manje luyatholakala
  body: |
    <ul>
      <li><strong>I-RetroDB manje iyatholakala ngesiKorea (한국어).</strong>
        Lukhethe ngaphansi kwe-Izilungiselelo &rarr; System &rarr; Language.
        Isixhumi sonke &mdash; amamenyu, izinkinobho, imilayezo, nencwadi
        yesandla ye-Help engaphakathi kohlelo &mdash; sihunyushiwe, kwenza
        izilimi ezisekelwayo zibe yisishiyagalombili (isiNgisi, isiJalimane,
        isiSpanishi, isiFulentshi, isiNtaliyane, isiJapane, isiPutukezi
        saseBrazil, kanye nesiKorea). IsiKorea siphelelisa ukusekelwa kwawo
        wonke amabhodi ezilinganiso zeminyaka yemidlalo i-RetroDB
        ewakhombisayo, kufaka phakathi i-GRAC yaseNingizimu Korea.</li>
    </ul>
- version: 3.11.0
  date: '2026-06-30'
  tags:
  - type: enhancement
    label: Sekela i-RetroDB ku-Patreon — isixhumanisi esisha somnikelo sifakiwe
  body: |
    <ul>
      <li><strong>Manje usungasekela i-RetroDB ku-Patreon.</strong>
        Isixhumanisi se-Patreon simi eduze kwenkinobho ekhona
        ye-&ldquo;Sponsor on GitHub&rdquo; ku-<strong>Izilungiselelo &rarr;
        System &rarr; Support Development</strong>, kuphaneli ye-About, naku-README
        yephrojekthi. I-RetroDB ihlala imahhala ngokuphelele futhi iyi-open
        source &mdash; iminikelo ingokuzikhethela ngokuphelele futhi nje
        isiza ukugcina ukuthuthukiswa komuntu oyedwa kuqhubeka.</li>
    </ul>
- version: 3.10.0
  date: '2026-06-26'
  tags:
  - type: enhancement
    label: I-Changelog manje ilayisha ngokushesha ngenkinobho ye-"Load More"
  body: |
    <ul>
      <li><strong>Ikhasi le-Changelog manje livuleka ngokushesha kakhulu.</strong>
        Esikhundleni sokudweba wonke umlando wokukhishwa (amakhulu okufakiwe)
        njalo lapho ulivula, i-RetroDB manje ikhombisa okungu-20 kwakamuva
        futhi yengeza inkinobho ye-<strong>Load More</strong> ngezansi.
        Ichofoze ukuze uveze iqoqo elilandelayo, kanjalo kanjalo &mdash;
        umlando omdala usekhona wonke, ulayisha nje ngokudingekayo esikhundleni
        sokwehlisa ukubuka kokuqala.</li>
    </ul>
- version: 3.9.0
  date: '2026-06-17'
  tags:
  - type: feature
    label: Incwadi yesandla ye-Help & amanothi okukhishwa kwakamuva manje ahunyushelwe kuzo zonke izilimi eziyi-6
  body: |
    <ul>
      <li><strong>Incwadi yesandla ye-Help egcwele engaphakathi kohlelo manje
        iyatholakala kuzo zonke izilimi eziyisithupha</strong> &mdash;
        isiJalimane, isiFulentshi, isiSpanishi, isiNtaliyane, isiJapane
        nesiPutukezi saseBrazil &mdash; hhayi isiNgisi kuphela. I-RetroDB
        ikhombisa incwadi yesandla ngolimi olukhethile ku-Izilungiselelo,
        futhi ibuyela ngokuthula esiNgisini uma okuthile kungakahunyushwa.</li>
      <li><strong>Le Changelog manje ivela ngolimi lwakho futhi</strong>
        ekukhishweni kwakamuva, futhi ukukhishwa okusha kuzohunyushwa kusukela
        manje kuya phambili. Umlando omdala uhlala ngesiNgisi.</li>
      <li><strong>Ikhasi le-Wishlist nabasele abancane bombhalo wesiNgisi</strong>
        &mdash; iqoqo lemilayezo yephutha nesimo evelayo eyayikhweshiwe lapho
        amaphakethe olimi eqala afika ku-3.8.0 &mdash; manje ahumusheka
        ngendlela efanele kulo lonke uhlelo.</li>
    </ul>
- version: 3.8.2
  date: '2026-06-17'
  tags:
  - type: security
    label: Ukubuyekezwa kokuncikile kokuphepha + ukulungiswa kwe-CI
  body: |
    <ul>
      <li><strong>Ukuphepha:</strong> kubuyekezwe umtapo we-<code>cryptography</code>
        obekelwe ndawonye (47 → 49) ukuze kucaciswe iseluleko esishicilelwe
        (GHSA-537c-gmf6-5ccf). Akukho ukushintsha kokusebenza — inguqulo
        ephephile nje.</li>
      <li>Kulungiswe ipayipi lokuhlola okuzenzakalelayo: umsizi wokuhlola
        kuphela owawungekho (<code>beautifulsoup4</code>) wawuhlulekile
        ukuhlola kusukela ku-v3.7.0, futhi iskripthi esisha sokwakha
        amaphakethe sikhubaze ukuhlolwa kokuhlaziya okuma okwaziwa
        njengokungathembeki (usebenzisa imiyalo yokwakha ethenjiwe, hhayi
        okufakwa umsebenzisi) — manje kubhaliwe futhi kulungisiwe. Ukugcina
        kuphela; akukho okushintshayo ohlelweni ngokwalo.</li>
    </ul>
- version: 3.8.1
  date: '2026-06-17'
  tags:
  - type: improvement
    label: Inketho yokulanda encane, ukulungiswa komnikelo & ukulungiswa kokuhumusha (Pass 46.3 / 47.6)
  body: |
    <ul>
      <li><strong>Ukulanda okuncane kakhulu kuyeza.</strong> Inguqulo
        &ldquo;vula uphinde uchofoze kabili&rdquo; esikulungele ukusebenza
        ye-RetroDB manje ingakhiwa ngesimo se-<strong>CPU kuphela</strong>
        (~600&nbsp;MB) kubantu abangenalo ikhadi lezithombe le-AMD &mdash;
        cishe okwesithupha kobukhulu benguqulo egcwele. Zombili zizonikezwa
        eduze komunye ukuze ukhethe leyo elingana nomshini wakho.</li>
      <li><strong>Iphaneli ye-&ldquo;Support Development&rdquo;
        ku-Izilungiselelo manje iyahumusheka</strong> kanye nohlelo lonke
        &mdash; yayishiywe ngesiNgisi ngephutha lapho amaphakethe olimi
        efika ku-3.8.0.</li>
      <li>Kulungiswe izixhumanisi zomnikelo (ibheji ye-GitHub Sponsors
        ku-README; ifayela lemali silungele i-Patreon ne-Buy&nbsp;Me&nbsp;A&nbsp;Coffee
        uma lezo sezisethiwe). Akukho izikrini zokuncenga, nanini.</li>
      <li>Ngemuva kwesigcawu: ipayipi lokukhishwa manje lingakha izinguqulo
        esizilungele ukusebenza ze-Windows, macOS neLinux ngokuzenzakalelayo.
        Qaphela: incwadi yesandla ye-<em>Help</em> ende engaphakathi kohlelo
        isengesiNgisi kuphela okwamanje &mdash; lokho kubhalwe njengomsebenzi
        wesikhathi esizayo.</li>
    </ul>
- version: 3.8.0
  date: '2026-06-12'
  tags:
  - type: feature
    label: Ukuhumusha kwesixhumi esigcwele + izilimi eziyi-6 (Pass 43.2/43.3/43.5)
  body: |
    <ul>
      <li><strong>I-RetroDB manje ikhuluma izilimi ezingu-6 ezengeziwe.</strong>
        Yakhela phezu kwesisekelo se-3.7.0, isixhumi sonke senziwe sahumusheka
        futhi sahunyushwa ngomshini saya ku-<strong>isiJalimane,
        isiFulentshi, isiSpanishi, isiNtaliyane, isiJapane, nesiPutukezi
        saseBrazil</strong>. Khetha ulimi lwakho ngaphansi
        kwe-Izilungiselelo &rarr; Display Preferences &rarr; Language;
        lulandela okukhethile okugciniwe, bese isiphequluli sakho, bese
        libuyela esiNgisini &mdash; alusoze lwabhajwa olimini olungekho.</li>
      <li><strong>Konke okusesikrinini kuhlanganisiwe</strong>: umbhalo
        wekhasi nezinkinobho, imilayezo evelayo (izaziso ezincane
        &ldquo;toast&rdquo;), izingxoxo zokuhlela nezilungiselelo, ama-tooltip,
        namalebula omfundi wesikrini. Izinhlobo zemidlalo, imibono
        nezindlela zokudlala (isb. &ldquo;First-Person-Shooter&rdquo;) manje
        zibonakala ngolimi lwakho futhi &mdash; kuyilapho idatha
        engaphansi ihlala ngesiNgisi ukuze umtapo wakho nezihlungi zakho
        ziqhubeke zisebenza ngokufana nangaphambili.</li>
      <li>Ulimi lwe-<strong>&ldquo;Pseudo&rdquo;</strong> olwakhelwe ngaphakathi
        (olubonakala kumenyu ye-Language) luyithuluzi le-QA lomhumushi
        elibeka ababakaki futhi eliphawula wonke amalebula, kwenza kucace
        ngokushesha uma noma yimuphi umbhalo ushiywe.</li>
      <li>Ukuhumusha ngomshini kuyisiqalo futhi kungase kufundeke kancane
        kuqinile ezindaweni ezithile &mdash; kulula ukukuthuthukisa
        ngokuhamba kwesikhathi, futhi noma yimuphi umbhalo ongenayo
        inguqulo ubonakala nje ngesiNgisi.</li>
    </ul>
