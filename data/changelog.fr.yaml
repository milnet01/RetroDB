  body: |
    <ul>
      <li><strong>Des codes de triche pour RetroArch (RetroDB), DuckStation
        et PCSX2.</strong> Paramètres &gt; Émulateurs a une nouvelle
        section Codes de triche. Téléchargez-y les packs publics et
        gratuits de codes de triche, ou importez des dossiers de codes de
        triche que vous avez déjà ; RetroDB copie les fichiers et ne
        modifie jamais votre dossier. La page d'un jeu affiche alors ses
        codes de triche, chacun avec un interrupteur marche/arrêt, et un
        champ de recherche quand il y en a beaucoup. Dans RetroArch
        (RetroDB), les codes de triche que vous activez s'appliquent la
        prochaine fois que vous appuyez sur Jouer, et les changements que
        vous faites dans le menu de RetroArch pendant la partie sont
        conservés. Pour DuckStation et PCSX2, les interrupteurs sont
        enregistrés dans les réglages propres à l'émulateur pour ce jeu,
        donc les changements faits dans l'émulateur s'affichent aussi sur
        la page. RetroDB n'écrase jamais un fichier de codes de triche
        que l'émulateur possède déjà. Un code de triche activé suspend le
        mode hardcore de RetroAchievements.</li>
      <li><strong>Importez une boîte 3D Slipcase sur un jeu.</strong> La
        page d'un jeu a un bouton Importer une boîte 3D sous la jaquette.
        Choisissez le fichier <code>.box.json</code> enregistré par
        Slipcase, avec ses images, et RetroDB conserve pour ce jeu la
        face avant, la tranche, le dos et les autres faces de la boîte. Slipcase 1.4.0 ou plus récent enregistre ce fichier à côté de chaque image exportée.
        Votre image de jaquette 3D n'est pas modifiée. Un jeu qui a déjà
        des faces demande avant de les remplacer, et Supprimer les
        efface.</li>
      <li><strong>Faites tourner la boîte 3D d'un jeu entre vos
        mains.</strong> Cliquez sur la jaquette d'un jeu avec une boîte
        Slipcase importée et la boîte apparaît en 3D. Faites-la glisser,
        ou utilisez les flèches du clavier, pour la tourner et voir la
        tranche, le dos, le dessus et le dessous. Faites défiler ou
        appuyez sur + et - pour zoomer ; double-cliquez ou appuyez sur
        Début pour la remettre en place. Un jeu sans boîte importée
        agrandit toujours son image de jaquette.</li>
      <li><strong>Les Paramètres mènent à la page Émulateurs.</strong> La
        page Émulateurs n'avait aucun lien dans les Paramètres, on ne
        pouvait donc y accéder qu'en tapant son adresse. Les
        administrateurs voient maintenant un onglet Émulateurs après
        Système, et la page Émulateurs affiche la même barre d'onglets,
        donc les autres onglets sont à un clic.</li>
      <li><strong>Le zoom de la jaquette n'est plus caché derrière les
        menus.</strong> Sur un téléphone, les barres du haut et du bas
        recouvraient la jaquette agrandie et cachaient son bouton de
        fermeture, et sur un ordinateur la barre latérale couvrait son
        côté gauche. Le zoom s'ouvre maintenant au-dessus de tout.</li>
      <li><strong>Modèles Claude 5.5 pour l'IA.</strong> Paramètres &gt; Récupération liste les modèles Claude les plus récents d'Anthropic : Haiku 5.5, le nouveau choix par défaut et le moins cher, Sonnet 5.5 et Opus 5.5, avec leurs prix actuels. RetroDB n'envoie plus un réglage que Sonnet 5.5 refuse.</li>
      <li><strong>Saisir les ventes d'un jeu.</strong> Les deux écrans de modification ont un champ « Exemplaires vendus » sous Développeur. Le chiffre saisi s'affiche sur la page du jeu, comme un chiffre trouvé par l'IA. Videz le champ pour le retirer.</li>
      <li><strong>Testez votre clé IA dans les paramètres.</strong> Paramètres &gt; Récupération a un bouton « Tester la clé IA enregistrée » sous le fournisseur d’IA. Il indique si la clé fonctionne et, sinon, pourquoi : clé refusée, plus de crédit ou limite d’utilisation atteinte. Avant, une clé refusée semblait fonctionner.</li>
      <li><strong>Claude peut chercher les chiffres de ventes sur le web.</strong> Paramètres &gt; Récupération a un interrupteur « Laisser Claude chercher sur le web » sous le modèle Claude, désactivé au départ. Sans recherche, Claude répond avec ce qu'il sait déjà et laisse vides les exemplaires vendus. Activé, Claude cherche les chiffres. Anthropic facture chaque recherche, donc Remplissage IA fait au plus 5 recherches par jeu, jusqu'à 5 cents US ; désactivez l'interrupteur avant une grosse récupération groupée.</li>
      <li><strong>Remplissage IA d'un système entier en une fois.</strong> Outils ROM a une nouvelle page Remplissage IA en masse, qui contient aussi Noms officiels. Choisissez un système, ou Tous les systèmes, activez les champs à remplir et appuyez sur Remplir avec l'IA : RetroDB lance le Remplissage IA sur chaque jeu, comme le bouton Remplissage IA de la page d'un jeu, et enregistre les réponses directement dans le jeu. Une barre de progression et une boîte de notification du Remplissage IA montrent où il en est, et vous pouvez quitter la page pendant qu'il tourne. Il indique combien de jeux il va remplir et demande d'abord, car votre fournisseur d'IA facture chaque jeu. Les jeux que le Remplissage IA a déjà traités sont ignorés sauf si vous les réactivez, et le passage s'arrête de lui-même si l'IA ne répond plus.</li>
      <li><strong>Les boîtes de notification des tâches prennent les couleurs de votre thème.</strong> Les boîtes qui montrent une tâche en cours, comme le scraping en masse et RA Sync, et les barres de progression utilisent maintenant les couleurs du thème que vous avez choisi. Une tâche qui ne peut pas être mise en pause n'affiche plus son titre dans la couleur de pause.</li>
      <li><strong>La page Émulateurs ressemble aux autres onglets des Paramètres.</strong> Paramètres &gt; Émulateurs est maintenant découpée en cartes, et une barre sous les onglets mène à chacune : RetroArch, Jouer dans RetroDB, Cœurs, Codes de triche, Dossiers, Émulateurs et Associations. La barre reste en haut pendant le défilement et signale la section où vous êtes.</li>
      <li><strong>La progression du téléchargement à côté du bouton.</strong> Quand vous téléchargez RetroArch, les cœurs du lecteur ou un pack de codes de triche, une note à côté du bouton indique en pourcentage où en est le téléchargement. Avant, une ligne apparaissait sous les boutons et repoussait le reste de la page vers le bas.</li>
      <li><strong>Choisissez l'émulateur de chaque système dans une liste.</strong> Association par système dans Paramètres &gt; Émulateurs affiche maintenant chaque système une seule fois, avec la liste des émulateurs qui y sont liés. Celui que vous choisissez est celui qu'utilise Jouer pour les jeux de ce système, sauf si un jeu définit le sien. Un émulateur que RetroDB ne trouve pas est marqué « introuvable ». Avant, chaque système avait une ligne par émulateur, avec un petit point pour choisir celui par défaut. Le RetroArch intégré à RetroDB figure désormais dans la liste de chaque système répertorié qu'il peut exécuter, y compris les systèmes qui n'ont pas encore de jeux.</li>
      <li><strong>Un bouton Parcourir sur chaque champ de chemin.</strong> Les administrateurs peuvent maintenant choisir un dossier ou un programme en parcourant les dossiers de l'ordinateur au lieu de saisir son chemin : Paramètres &gt; Émulateurs, Bibliothèque, Récupération et Compte, ainsi que les paramètres des Outils ROM. Les champs qui attendent un programme affichent aussi les fichiers. Les dossiers cachés comme <code>.config</code> sont listés en dernier.</li>
      <li><strong>Le stick gauche sert de D-Pad dans le RetroArch de RetroDB.</strong> Dans les jeux des systèmes sans stick, comme la NES ou la Mega Drive, vous pouvez maintenant vous déplacer avec le stick gauche aussi bien qu'avec le D-Pad. Quand le cœur d'émulation d'un jeu lit lui-même le stick, comme sur Nintendo 64, le stick reste un vrai stick.</li>
      <li><strong>Connectez-vous à RetroAchievements depuis les Paramètres.</strong> Paramètres &gt; Compte peut maintenant vous connecter pour le RetroArch de RetroDB : les succès se débloquent pendant que vous jouez, sans connexion dans l'émulateur. Votre mot de passe est envoyé uniquement à RetroAchievements et n'est pas conservé. Chaque utilisateur de RetroDB a sa propre connexion et son propre interrupteur Mode hardcore, désactivé au départ. DuckStation et PCSX2 se connectent toujours depuis leurs propres menus.</li>
      <li><strong>Voir quel émulateur Jouer utilisera.</strong> La page d'un jeu affiche désormais « Se lance dans : » et le nom de l'émulateur à côté du bouton Jouer, ou indique qu'aucun émulateur n'est configuré.</li>
      <li><strong>Le panneau Codes de triche explique pourquoi un jeu n'en a pas.</strong> Quand l'émulateur d'un jeu ne peut pas utiliser de codes de triche, le panneau en donne désormais la raison au lieu de rester masqué.</li>
      <li><strong>Les longs chemins de dossier tiennent sur un téléphone.</strong> Un long chemin de dossier dans les Paramètres ne fait plus défiler la page sur le côté.</li>
    </ul>
