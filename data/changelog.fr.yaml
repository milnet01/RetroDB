  body: |
    <ul>
      <li><strong>Les versions régionales d'un jeu s'affichent comme un seul
        jeu.</strong> Liez les versions que vous possédez (par exemple les
        éditions américaine, européenne et japonaise) et la Bibliothèque
        affiche une seule carte avec un badge &#127760;. La carte ouvre et
        lance la version de votre Région par défaut. La page du jeu liste
        toutes les versions côte à côte et vous permet de passer de l'une à
        l'autre. Outils ROM &gt; Versions régionales propose des groupes que
        les éditeurs confirment ; rien n'est lié sans vous. Il ne propose
        jamais une suite comme version de son premier jeu. Les versions liées
        ne sont plus signalées comme doublons d'après leur nom. Lancez une fois
        Compléter les titres alternatifs pour donner plus de matière aux
        propositions.</li>
      <li><strong>L'IA peut résumer ce qui distingue les versions
        régionales.</strong> Sur un jeu dont des versions sont liées, les
        éditeurs peuvent cliquer sur Résumer les différences avec l'IA dans la
        section Versions régionales. L'IA liste les différences connues, comme
        la censure, la difficulté ou du contenu retiré. La liste est marquée
        comme rédigée par l'IA, s'affiche sur la page de chaque version et se
        masque quand vous liez ou déliez une version, jusqu'à ce qu'elle soit
        rédigée de nouveau. Il faut un fournisseur d'IA configuré dans
        Paramètres &gt; Récupération.</li>
      <li><strong>Les jeux PlayStation démarrent avec de bons
        réglages.</strong> Pour DuckStation, PCSX2 et RPCS3, RetroDB règle
        désormais l'échelle de résolution et le format d'image de chaque jeu
        dans le propre fichier de réglages par jeu de l'émulateur quand vous
        cliquez sur Jouer, ainsi que le démarrage en plein écran ou non.
        Modifiez-les pour tout un système avec le bouton Settings dans
        Paramètres &gt; Emulators, ou pour un seul jeu dans le nouveau panneau
        Paramètres de l'émulateur de sa page. Un réglage que vous modifiez dans
        l'émulateur l'emporte toujours. RetroDB lit le numéro de série de
        chaque disque pour trouver le bon fichier ; les disques CHD
        nécessitent que chdman soit installé.</li>
      <li><strong>Remplissage IA ne peut plus être manipulé par du texte saisi
        dans les champs d'un jeu.</strong> Quand Remplissage IA vérifie
        l'éditeur, le développeur, l'édition ou les autres plateformes déjà
        renseignés d'un jeu, il nettoie désormais ce texte d'abord, comme il
        le faisait déjà pour le titre.</li>
      <li><strong>Les analyses des Outils ROM restent dans votre dossier de
        ROMs.</strong> Convertisseur CHD et Vérification CHD ne suivent plus un
        raccourci (lien symbolique) qui pointe en dehors, et la décompression
        d'une archive multidisque ignore tout raccourci contenu dans
        l'archive.</li>
      <li><strong>Les pages refusent d'exécuter les scripts qu'on y
        glisse.</strong> Votre navigateur bloque désormais tout script que
        RetroDB n'a pas écrit lui-même : un texte qui glisse du code dans le
        titre d'un jeu, une étiquette ou une description récupérée ne peut pas
        l'exécuter. Les boutons et les menus fonctionnent comme avant.</li>
      <li><strong>Une capture d'écran abîmée n'arrête plus la recherche de
        doublons d'un jeu.</strong> Une capture illisible est mise de côté et
        la vérification continue.</li>
      <li><strong>Les tâches des Outils ROM ne restent plus bloquées sur « en
        cours ».</strong> Un fichier supprimé après une analyse Vérification
        CHD est compté comme invalide, et toute erreur inattendue dans
        Convertisseur CHD, Vérification CHD ou Détecteur de doublons termine la
        tâche en échec, avec l'erreur dans son journal.</li>
      <li><strong>Avant la fin de la configuration, les requêtes de données de
        l'application reçoivent une réponse claire.</strong> Elles répondent
        « Configuration requise » au lieu de renvoyer la page de
        configuration. Les pages vous mènent toujours à l'assistant de
        configuration.</li>
      <li><strong>Les suites n'affichent plus les succès du premier
        jeu.</strong> La correspondance RetroAchievements ignorait le numéro
        d'un titre, si bien que Donkey Kong Country 2 et 3 étaient liés à
        Donkey Kong Country. Les numéros (2, II, 3, III, etc.) comptent
        désormais. Pour corriger les jeux déjà liés, lancez une fois
        l'actualisation RetroAchievements pour tous les systèmes.</li>
      <li><strong>Une synchronisation PlayStation n'efface plus vos compteurs
        de trophées.</strong> Quand la réponse de PlayStation omettait les
        totaux de trophées d'un jeu, RetroDB enregistrait des zéros à la place
        des compteurs qu'il avait déjà. Il les conserve désormais, y compris
        lors de l'actualisation groupée des trophées.</li>
      <li><strong>Ouvrir un ensemble de trophées qui n'est plus sur le disque
        affiche un message.</strong> La page Trophées échouait avec une
        erreur ; elle indique maintenant que l'ensemble est introuvable et vous
        ramène à la liste.</li>
      <li><strong>Les tableaux des Outils ROM nomment correctement leur
        colonne de boutons dans toutes les langues.</strong> L'en-tête de la
        colonne partageait son texte avec le genre de jeu Action, si bien que
        certaines langues y affichaient le nom du genre.</li>
      <li><strong>Les jeux GameCube, 3DS et Super Famicom ont leur émulateur
        configuré automatiquement.</strong> RetroDB cherchait ces systèmes sous
        des noms de dossier que les bibliothèques n'utilisent pas (gamecube,
        3ds, superfamicom au lieu de gc, n3ds, sfc), si bien que Dolphin et
        Citra ne leur étaient jamais associés. Redémarrez RetroDB une fois pour
        en tenir compte.</li>
      <li><strong>Le téléchargement sans Python (autonome) configure de
        nouveau les émulateurs.</strong> Il lui manquait le fichier qui les
        liste.</li>
      <li><strong>Environ 170 boutons, libellés et messages de plus sont
        traduits</strong> dans toutes les langues. Ils s'affichaient en anglais
        auparavant, et quelques-uns affichaient une traduction erronée
        (certaines langues disaient « la sauvegarde a échoué » quand un jeu ne
        se lançait pas).</li>
      <li><strong>Échap ne ferme que la fenêtre du dessus.</strong> Avec une
        question ouverte par-dessus une autre fenêtre, Échap fermait les deux ;
        certaines fenêtres continuaient aussi de tourner après qu'Échap les
        avait masquées, et appuyer sur Échap sur la page d'un jeu pouvait
        relancer une récupération groupée que vous aviez mise en pause.
        Désormais, chaque fenêtre se ferme par sa propre action Fermer, garde
        le focus clavier à l'intérieur tant qu'elle est ouverte, et rend le
        focus au bouton qui l'a ouverte. Les fenêtres de progression des tâches
        en cours restent ouvertes jusqu'à la fin de la tâche.</li>
      <li><strong>Les graphiques d'Analyses sont dans votre langue.</strong>
        Les noms de genres, de perspectives, de dimensions et de modes, les
        titres des graphiques, les noms des axes et les légendes étaient en
        anglais dans toutes les langues.</li>
      <li><strong>Les données RetroAchievements sont mieux protégées.</strong>
        Si la liste des jeux RetroAchievements d'une console ne se charge pas,
        RA Refresh laisse désormais les jeux de cette console liés au lieu de
        tous les délier. Effacer les données RA n'efface plus que la
        progression RetroAchievements ; la progression Steam et Xbox est
        conservée.</li>
      <li><strong>Les mots de passe doivent compter au moins 12 caractères
        partout.</strong> La première configuration acceptait un mot de passe
        administrateur de n'importe quelle longueur, et les pages de
        changement forcé du mot de passe et de configuration disaient que 4
        caractères suffisaient. Les trois en demandent désormais 12, comme le
        reste de l'application.</li>
      <li><strong>Les totaux de succès sont justes, et ce sont les
        vôtres.</strong> Synchroniser un seul jeu depuis RetroAchievements
        enregistre désormais son nombre de succès, au lieu de 0. Les totaux de
        succès du Tableau de bord ne comptent que vos jeux, et les Trophées de
        collectionneur ne comptent plus deux fois chaque succès Steam ou
        Xbox.</li>
      <li><strong>Les synchronisations en arrière-plan utilisent vos propres
        comptes.</strong> Une synchronisation de système RetroAchievements se
        connecte avec votre propre compte RetroAchievements quand vous en avez
        configuré un. L'actualisation groupée PlayStation réutilise votre
        connexion enregistrée au lieu de se reconnecter de zéro à chaque
        fois.</li>
      <li><strong>Vous seul pouvez arrêter ou reprendre votre propre
        synchronisation.</strong> Un autre utilisateur ne peut plus annuler
        votre synchronisation RetroAchievements, Steam ou Xbox, et reprendre
        une tâche interrompue demande les mêmes droits que la lancer. Les
        administrateurs peuvent toujours faire les deux.</li>
      <li><strong>Votre dossier de trophées RPCS3 est vérifié quand vous
        l'enregistrez.</strong> Un dossier qui n'existe pas, qui n'est pas un
        chemin complet ou qui est un dossier système est refusé, comme c'était
        déjà le cas dans les paramètres principaux.</li>
      <li><strong>« Récupérer toutes les images » du Musée s'exécute en
        arrière-plan.</strong> La page n'attend plus pendant des minutes chaque
        image de manette. Elle montre où en est le téléchargement, propose un
        bouton Annuler et reprend l'affichage de la progression si vous quittez
        la page puis revenez.</li>
      <li><strong>Les Outils ROM protègent mieux vos fichiers.</strong> Clean
        ne vide plus une archive : un motif comme <code>*</code> ne peut pas
        être enregistré, et Clean s'arrête si les motifs supprimaient tous les
        fichiers. Convertisseur CHD conserve l'original quand « verify » est
        désactivé, et laisse tranquille un CHD existant quand « skip
        existing » est activé. Détecteur de doublons garde toujours une copie
        de chaque jeu, même si une requête les demande toutes.</li>
      <li><strong>Les tâches des Outils ROM font ce que disent les
        boutons.</strong> Pause met désormais en pause Convertisseur CHD,
        Vérification CHD, Détecteur de doublons et Déduplication de captures,
        et une tâche en pause peut être annulée. Une analyse Déduplication de
        captures qui rencontre une erreur se termine désormais en échec au lieu
        de tourner indéfiniment.</li>
      <li><strong>Create M3U ne dépose plus les archives dans un dossier
        temporaire.</strong> Les archives déplacées vont désormais dans le
        dossier de données de RetroDB, qui n'est pas vidé au redémarrage.
        L'analyseur d'archives indique où elles sont parties, et la
        confirmation par lot précise qu'elles seront déplacées. Réinitialiser
        les paramètres des Outils ROM réinitialise désormais toutes les
        options.</li>
      <li><strong>Changez de disque depuis RetroDB.</strong> Pendant qu'un jeu
        RetroArch lancé depuis une liste de disques .m3u tourne, la liste
        &#9654; En cours de lecture en haut de chaque page affiche le titre du
        jeu et un bouton Disque suivant : un jeu qui réclame la face deux
        continue en un clic, depuis le navigateur ou un téléphone. RetroArch
        doit avoir Settings &gt; Network &gt; Network Commands activé (port
        55355) ; le bouton le signale si ce n'est pas le cas.</li>
      <li><strong>Le script de démarrage ouvre RetroDB quand il est
        prêt.</strong> start.sh, start.command et start.bat ouvraient le
        navigateur après 3 secondes fixes, souvent avant que le serveur puisse
        répondre, si bien que la page ne se chargeait pas. RetroDB l'ouvre
        désormais dès que le serveur écoute. Lancé depuis
        LocalWebServerManager, il n'ouvre aucune page ; utilisez le bouton Open
        du gestionnaire.</li>
      <li><strong>Les vidéos de jeu peuvent atteindre 500 Mo.</strong> La
        limite était de 50 Mo, trop peu pour la plupart des bandes-annonces. Un
        envoi trop lourd affiche désormais un message sur la page du jeu au
        lieu de remplacer la page par du texte brut. Une vidéo refusée (trop
        lourde ou du mauvais type de fichier) le signale désormais au lieu
        d'être écartée sans un mot.</li>
      <li><strong>Le lancement suit le chemin que vous avez indiqué.</strong>
        Un Binary path override sur la ligne RetroArch de Paramètres &gt;
        Emulators l'emporte désormais sur le chemin RetroArch en haut de cette
        page ; auparavant, le chemin de la ligne était ignoré. Appuyer deux
        fois sur Stop ne demande plus deux fois au jeu de quitter ; sous Linux,
        RetroArch comprend une seconde demande comme « quitter sans
        sauvegarder », et votre sauvegarde en jeu pouvait être perdue.
        Un réglage du lanceur resté d'un mode distant jamais terminé n'empêche
        plus tous les jeux de démarrer.</li>
      <li><strong>Les actions qui échouent signalent correctement leurs
        erreurs.</strong> Quand un enregistrement, un import, une
        synchronisation ou une analyse échoue, RetroDB répond désormais avec un
        vrai statut d'erreur et donne la raison dans son message, au lieu de
        répondre comme si tout avait fonctionné. Enregistrer un code de
        connexion PSN qui ne parvient pas à se connecter n'affiche plus de
        détails internes de l'erreur. La connexion, la gestion des
        utilisateurs, votre profil, les succès, les imports, Remplissage IA et
        les recherches HowLongToBeat font désormais de même, et une langue qui
        ne peut pas être enregistrée explique pourquoi au lieu d'afficher
        « Erreur réseau ».</li>
      <li><strong>Les jeux nommés à la manière No-Intro sont désormais
        récupérés.</strong> Un titre comme « Legend of Zelda, The » ou
        « Legend of Zelda, The - Ocarina of Time » correspond désormais aux
        résultats « The Legend of Zelda » au lieu d'être rejeté par le filtre
        de correspondance. Rapports ROM cesse aussi de signaler ces noms comme
        des incohérences.</li>
      <li><strong>Les titres tirés des noms de fichier perdent toutes leurs
        étiquettes.</strong> Les régions combinées comme « (USA, Europe) » et
        « (UK) » sont désormais retirées. Sur les ordinateurs familiaux comme le
        ZX Spectrum, tout ce qui suit l'année disparaît, année comprise : ainsi
        « Chuckie Egg 2 (UK) (1985) (A'n'F Software) (tzx) » devient « Chuckie
        Egg 2 ». Un nom de fichier qui se termine par « ..zip » ne laisse plus
        de point en trop. Les recherches des récupérateurs, la réinitialisation
        des données d'un jeu et les propositions de Versions régionales
        utilisent ces noms plus propres.</li>
      <li><strong>Un mauvais titre ne se répète plus à la
        re-récupération.</strong> La récupération groupée cherche désormais
        avec le nom du fichier ROM, et non avec le titre enregistré pour le
        jeu. Un jeu qui avait un jour été associé au mauvais jeu trouve le bon
        lors d'une nouvelle récupération.</li>
      <li><strong>Les récupérateurs privilégient votre Région par
        défaut.</strong> Quand deux résultats sont à égalité, celui de votre
        Région par défaut ou de World l'emporte désormais, et plus toujours
        celui des États-Unis. Deux titres qui ne sont que des étiquettes de
        région ne comptent plus comme une correspondance parfaite. Versions
        régionales ne prend plus le X de « X-Men » pour un numéro de suite.
        Le choix de la version affichée par une carte ne lit désormais que le
        nom du fichier ROM, et non les dossiers au-dessus, et comprend les
        anciennes étiquettes comme « (U) » et « (E) ».</li>
      <li><strong>Le journal montre où passe le temps de récupération de
        chaque jeu.</strong> Après chaque jeu, RetroDB écrit une ligne avec les
        secondes passées à chercher, dans chaque source, à télécharger, à
        traiter les images, dans l'IA et à enregistrer. C'est la première étape
        vers des récupérations plus rapides.</li>
      <li><strong>Les récupérations se terminent plus tôt : les petites images
        sont affinées ensuite.</strong> Une récupération enregistre désormais
        le jeu avec ses images telles que téléchargées. Les petites jaquettes et
        captures d'écran sont ensuite agrandies en arrière-plan, un jeu à la
        fois. Les captures en double sont écartées avant tout ce travail. Si
        RetroDB s'arrête en cours de route, il reprend à son prochain
        démarrage.</li>
      <li><strong>Lisez le manuel d'un jeu sur sa page.</strong> Le bouton
        Manuel ouvre désormais le PDF dans une fenêtre par-dessus la page du
        jeu. Tournez les pages avec Précédent et Suivant, les touches fléchées,
        Début et Fin, ou d'un glissement du doigt sur un téléphone ; chaque
        page se tourne comme celle d'un livre, ou change simplement si votre
        système demande moins d'animations. « Ouvrir le PDF dans un nouvel
        onglet » est toujours là, et Ctrl+clic sur Manuel ouvre directement
        l'onglet.</li>
      <li><strong>La barre latérale indique quand des images sont encore en
        cours d'amélioration.</strong> Pendant que des images sont affinées en
        arrière-plan, la barre latérale affiche « Amélioration des images —
        Jeux restants : N ». Un jeu encore en attente l'indique sur sa page, et
        ses images plus nettes y apparaissent d'elles-mêmes quand elles sont
        prêtes. L'interrupteur de jaquette 2D/3D ne masque plus cette
        ligne.</li>
      <li><strong>Les sources de secours sont interrogées en même
        temps.</strong> Quand la source principale laisse des trous, RetroDB
        interroge désormais toutes les autres sources à la fois au lieu de
        l'une après l'autre. Leurs réponses sont toujours utilisées dans l'ordre
        de vos Paramètres : la même source l'emporte donc pour chaque
        champ.</li>
      <li><strong>ES-DE lit sa liste de jeux une seule fois.</strong> Chaque
        récupération, groupée ou non, lisait le gamelist.xml ES-DE d'un système
        deux fois pour chaque jeu. RetroDB le lit désormais une fois et ne le
        relit que si le fichier change.</li>
      <li><strong>Appliquer dans Rechercher des métadonnées ne relance plus la
        recherche.</strong> Sur la page d'un jeu, les résultats que vous avez
        cochés sont récupérés directement depuis leur source au lieu d'être
        recherchés une seconde fois. Si rien n'est coché, seules la source que
        vous avez appliquée et l'IA comblent les trous.</li>
      <li><strong>ScreenScraper trouve les jeux avec un sous-titre.</strong> Il
        ne trouvait rien pour un titre comme « Alone in the Dark: The New
        Nightmare » à moins que les deux-points soient précédés d'une espace.
        RetroDB le cherche désormais ainsi, puis avec la partie avant les
        deux-points si cela ne donne toujours rien.</li>
      <li><strong>Les jeux sans rien à lancer ne proposent plus
        Jouer.</strong> Un jeu ajouté par un import CLZ, Steam, Xbox ou PSN n'a
        pas de fichier ROM. Sa page n'affiche plus de bouton Jouer, ni
        Paramètres de l'émulateur, ni de section Lancer quand vous le modifiez,
        comme les cartes de la Bibliothèque.</li>
      <li><strong>Les jeux RetroArch sont protégés contre deux mauvais
        réglages.</strong> RetroDB donne désormais à RetroArch un petit fichier
        de réglages à lui chaque fois qu'il lance un jeu, par-dessus le vôtre.
        Il règle le clavier selon votre bureau (Wayland ou X11), pour que le
        clavier ne soit jamais muet, et laisse l'avance rapide tourner à pleine
        vitesse, ce dont les jeux Commodore 64 se servent pour charger vite.
        Tous vos autres réglages RetroArch restent intacts.</li>
      <li><strong>Create M3U garde le jeu dans votre bibliothèque.</strong>
        Transformer une archive multidisque en liste de lecture laissait le jeu
        pointer vers l'archive, qui avait été déplacée. Le jeu pointe désormais
        vers la nouvelle liste de lecture et garde ses détails et ses images.
        Quand une archive contient plusieurs éditions d'un jeu, chacune avec
        son propre jeu de disques, la liste de lecture utilise désormais les
        disques de la première édition au lieu de tous, et indique quels
        disques elle a laissés de côté.</li>
      <li><strong>La Récupération complète peut conserver les médias que vous
        avez déjà.</strong> Cochez « Conserver les médias existants » à côté de
        l'interrupteur Récupération complète. Les informations textuelles sont
        toujours actualisées, mais les images, vidéos et manuels déjà sur le
        disque restent tels quels au lieu d'être téléchargés de nouveau. Sans
        cette case, une Récupération complète ne perd plus les captures d'écran
        qu'elle avait téléchargées auparavant.</li>
      <li><strong>Les tâches en arrière-plan ne perdent ni ne sautent plus de
        travail.</strong> Une actualisation RetroAchievements qui tombait sur
        un jeu problématique ne jette plus les jeux qu'elle avait déjà mis à
        jour. Une synchronisation ou une actualisation reprise ne saute plus le
        jeu sur lequel elle s'était arrêtée. Une synchronisation
        RetroAchievements ou Steam reprise depuis un instantané très ancien
        s'arrête désormais avec un message au lieu d'annoncer une réussite sans
        avoir rien synchronisé. La conversion WebP vérifie un fichier WebP
        restant avant de s'y fier, et ne démarre pas si elle ne peut pas lire
        l'espace disque libre.</li>
      <li><strong>Mettre à jour une installation très ancienne ne peut plus
        faire perdre de données sans prévenir.</strong> Trois anciennes étapes
        de mise à jour de la base de données pouvaient perdre des lignes dans
        de rares cas. Elles copient désormais les lignes, ou s'arrêtent avec
        une erreur claire au lieu de les perdre.</li>
      <li><strong>Les boutons de la fenêtre À propos ne sont plus
        coupés.</strong> La fenêtre est plus large et ses quatre boutons sont
        sur deux rangées, si bien que chaque libellé s'affiche en entier ; sur
        un téléphone, ils s'empilent.</li>
      <li><strong>Votre thème vous suit sur un nouveau navigateur.</strong> Se
        connecter depuis un navigateur que vous n'avez jamais utilisé affiche
        désormais votre thème enregistré. Auparavant, la page de connexion
        enregistrait d'abord Cyberpunk, et il restait.</li>
      <li><strong>La fenêtre de mot de passe de connexion n'affiche plus
        « Connexion administrateur ».</strong> Chaque compte se connecte avec
        un mot de passe, donc la fenêtre indique désormais simplement
        Connexion. La page Compte et la page d'Aide le disent aussi.</li>
      <li><strong>L'Aide est à jour dans toutes les langues.</strong> Les pages
        d'Aide traduites décrivent désormais Versions régionales, indiquent que
        chaque compte a besoin d'un mot de passe et que votre thème est
        enregistré avec votre compte. L'Aide dans toutes les langues, anglais
        compris, donne désormais le vrai minimum de 12 caractères pour le mot
        de passe.</li>
      <li><strong>Petites corrections :</strong> le fanart dont le nom de
        fichier contient une apostrophe s'affiche désormais sur les pages de
        jeu et de trophées ; Paramètres n'affiche plus d'erreur de script pour
        les comptes non administrateurs, et les lecteurs d'écran annoncent
        désormais quel onglet des Paramètres est sélectionné ; quitter une page
        ne remplit plus la console du navigateur d'erreurs de requêtes
        annulées ; le modèle d'agrandissement d'images se télécharge d'abord
        depuis une adresse qui fonctionne ; et l'installateur ne plante plus
        sous Windows quand sa sortie est enregistrée dans un fichier.</li>
      <li><strong>Une large série de corrections de fiabilité.</strong>
        Enregistrer un jeu avec un titre vide ne fait plus perdre vos autres
        modifications. Le redémarrage laisse désormais les tâches en cours
        s'arrêter proprement d'abord. Create M3U refuse d'écraser une liste de
        lecture ou un dossier existant. Vider la liste des fichiers indésirables
        dans les Outils ROM signifie désormais « ne rien supprimer », et deux
        motifs n'attrapent plus de vrais noms de ROM comme « Release of the
        Dragon ». Un fichier de trophées PS3 abîmé ne vide plus les trophées de
        tous les jeux. Remplissage IA écrit une seule région. Analyses compte
        chaque jeu une seule fois dans le graphique des notes. Les imports CLZ
        utilisent les noms de genre standard. Dans les fenêtres de
        modification, les genres et autres étiquettes peuvent être retirés dans
        toutes les langues, et les raccourcis clavier ne détournent plus Ctrl+D
        ni Ctrl+G. Les spectateurs voient l'état d'avancement d'un jeu mais ne
        peuvent plus le modifier, puisqu'il est partagé par tout le
        monde.</li>
      <li><strong>Les lecteurs d'écran lisent l'interrupteur Platform Match
        Required sous son nom visible</strong> dans Paramètres →
        Récupération.</li>
      <li>Dans les autres langues, Paramètres traduit désormais « Région par
        défaut », et l'onglet Récupération se lit comme un nom plutôt que
        comme « récupération en cours ». Les pages d'aide utilisent les mêmes
        mots.</li>
      <li><strong>Un jeu qui refuse de se fermer n'est plus affiché comme
        fermé.</strong> Si un émulateur survit à Stop, RetroDB continue de
        l'afficher comme en cours d'exécution. Un lancement RetroArch refusé
        n'écrit plus d'abord son fichier de réglages, et un émulateur qui
        échoue aussitôt affiche son message d'erreur dès la première
        vérification.</li>
      <li>Bibliothèques mises à jour : Pillow 13 (traitement des images), numpy
        2.5.4 et onnxruntime 1.31 (agrandissement des images), ainsi que les
        dernières versions des outils de compilation et de publication.</li>
      <li>En coulisses : le code de lancement des jeux a été remis en ordre
        pour être plus facile à suivre, du code inutilisé a été retiré (une
        adresse d'API, une fonction d'aide PSN, un script de trophées
        qu'aucune page ne chargeait et un réglage de thème global que rien ne
        lisait), les réponses de l'application au navigateur sont construites
        à un seul endroit, plusieurs documents de conception ont été corrigés
        pour correspondre au code, la suite de tests a été remise en ordre, et
        une nouvelle vérification détecte une erreur de syntaxe JavaScript
        avant une publication. Les anciennes entrées du journal des
        modifications qui décrivaient le code retiré le signalent
        désormais.</li>
    </ul>
- version: 3.29.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Les autres noms d'un jeu indiquent la région d'où ils viennent
  body: |
    <ul>
      <li><strong>Les autres noms d'un jeu indiquent la région d'où ils
        viennent.</strong> La carte Autres titres de la page du jeu marque
        chaque nom de son pays ou de sa région, comme Japon pour « Rockman »,
        dans votre propre langue. Les noms marqués viennent en premier,
        regroupés par région. Survolez un nom pour voir sa source et une
        éventuelle note, comme « Titre de travail ».</li>
      <li>Les noms venant d'IGDB conservent désormais leur région. Auparavant,
        seuls les noms de ScreenScraper en avaient une.</li>
      <li>L'étiquette « SS » de ScreenScraper ne s'affiche plus comme une
        région. C'est le nom propre de ScreenScraper pour le jeu, pas un
        lieu.</li>
      <li>Outils ROM → Compléter les titres alternatifs vérifie désormais
        chaque jeu récupéré, si bien que les noms que vous avez déjà gagnent
        leur région. Lancez-le une fois pour marquer votre bibliothèque
        existante.</li>
    </ul>
- version: 3.28.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Indiquez à RetroDB votre dossier d'émulateurs et il les configure
  - type: fix
    label: Corrections de la page Paramètres → Emulators
  body: |
    <ul>
      <li><strong>Indiquez à RetroDB votre dossier d'émulateurs et il les
        configure.</strong> Paramètres → Emulators propose une nouvelle liste
        Dossiers d'émulateurs. Ajoutez le dossier où se trouvent vos émulateurs
        et RetroDB y trouve chacun d'eux, qu'il s'agisse d'un AppImage, d'un
        script portable ou d'un Flatpak installé, et l'associe aux systèmes
        qu'il fait tourner. Un système qui a déjà un émulateur fonctionnel le
        garde.</li>
      <li><strong>Voyez quels systèmes sont prêts à jouer.</strong> Le tableau
        Per-system mapping liste désormais les émulateurs de chaque système,
        indique si chacun fonctionne et vous permet de choisir l'émulateur par
        défaut d'un système. Pour DuckStation, PCSX2, RPCS3 et RetroArch, il
        indique aussi si les fichiers BIOS sont en place, et nomme ceux qui
        manquent. RetroDB ne fait que lire les fichiers BIOS ; il n'en copie ni
        n'en télécharge jamais.</li>
      <li>L'analyse des émulateurs trouve désormais tous les émulateurs d'un
        grand disque d'émulateurs. Auparavant, elle pouvait s'arrêter trop tôt
        dans le propre dossier de réglages d'un émulateur.</li>
      <li>Les boutons Auto-detect et Save de RetroArch fonctionnent de nouveau,
        et la fenêtre Edit emulator ne s'affiche plus sur la page tant que vous
        n'avez pas cliqué sur Edit.</li>
    </ul>
- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: L'application des métadonnées montre où elle en est
  body: |
    <ul>
      <li><strong>L'application des métadonnées montre où elle en
        est.</strong> Lorsque vous choisissez un résultat dans Rechercher des
        métadonnées, un anneau se remplit de 0 à 100 % avec le pourcentage en
        son centre, et la ligne en dessous indique ce qui se passe : quel site
        est interrogé, quelle image ou vidéo est en cours de téléchargement,
        ou que les images sont en cours de traitement. Un gros téléchargement,
        comme une vidéo, fait avancer l'anneau à mesure qu'il arrive. À 100 %,
        la page se recharge avec le résultat, comme avant.</li>
      <li>L'anneau peut avancer de façon irrégulière. Chaque source ne décide
        du nombre d'images qu'elle envoie qu'au moment où elle répond : la
        première source riche en images peut donc remplir une grande partie de
        l'anneau, et les suivantes moins.</li>
      <li>Si une application échoue, l'anneau se ferme et un message
        l'indique, sans recharger la page.</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Chaque page s'adapte désormais à la fenêtre qui l'affiche
  - type: enhancement
    label: La page du jeu affiche les autres noms dans leur propre carte, et un bouton Manuel
  body: |
    <ul>
      <li><strong>Chaque page s'adapte désormais à la fenêtre qui l'affiche.</strong>
        Les pages en cartes (Systèmes, Musée, Étiquettes, Listes, Outils ROM,
        trophées et succès) ajoutent une colonne chaque fois qu'une carte
        entière de plus y tient, jusqu'à quatre par ligne. Les tableaux, les
        outils et les pages de détail s'élargissent un peu, mais s'arrêtent là
        où plus de largeur ne ferait qu'écarter leurs colonnes. Les Paramètres
        gardent leurs encadrés à une largeur lisible.</li>
      <li><strong>L'Aide et le Journal des modifications gardent des lignes
        de longueur confortable.</strong> Sur une fenêtre large, les liens vers
        les sections de l'Aide passent dans une colonne à côté du texte ; sur
        une fenêtre étroite, ils tiennent sur une seule ligne que l'on fait
        défiler du doigt, au lieu d'un bloc qui couvrait une bonne partie d'un
        écran de téléphone.</li>
      <li><strong>La page du jeu :</strong> sur une fenêtre large, les captures
        d'écran s'étendent en haut, avec en dessous, côte à côte, la vidéo et
        une nouvelle carte <strong>Également connu sous le nom de</strong>, à
        hauteur de la jaquette. Les autres noms étaient un texte pâle sous le
        titre ; ils figurent maintenant sur une carte facile à lire.
        <strong>Manuel</strong> est un bouton à côté de Jouer, et l'Historique
        de récupération s'affiche replié au départ.</li>
      <li>Trophées PSN affiche d'une à quatre colonnes selon la fenêtre, au lieu
        de toujours trois.</li>
      <li>Plusieurs pages ne défilent plus de côté sur un téléphone : Trophées,
        Trophées de collectionneur, la page système RetroAchievements, Aide,
        Paramètres, Analyses, Imports de jeux et les pages de détail des succès
        et des trophées. Les tableaux larges y défilent désormais à l'intérieur
        de leur propre cadre.</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: La Bibliothèque, les pages système et la page du jeu s'adaptent désormais à leur fenêtre
  body: |
    <ul>
      <li><strong>Les pages utilisent une fenêtre large quand c'est utile, et
        seulement dans ce cas.</strong> La Bibliothèque et chaque page système
        ajoutent une colonne de cartes de jeu chaque fois qu'une carte entière
        de plus y tient, jusqu'à quatre par ligne. Un téléphone en affiche une,
        une fenêtre en demi-écran deux ou trois, une fenêtre large quatre.
        Auparavant, les pages s'arrêtaient à une largeur fixe et laissaient
        vide la plus grande partie d'une grande fenêtre.</li>
      <li><strong>La page du jeu place sa jaquette et ses détails à côté des
        captures d'écran et de la vidéo</strong> quand les deux tiennent côte à
        côte, et les empile sinon. La description garde des lignes de longueur
        confortable.</li>
      <li><strong>Le bouton Jouer a rejoint le coin supérieur droit de chaque
        carte,</strong> plus petit et centré. Il vérifie aussi désormais que le
        fichier ROM du jeu est toujours présent et d'un type accepté par son
        système : il n'apparaît donc que là où un clic lancera vraiment le jeu.
        Il se masque pendant que vous sélectionnez des jeux en groupe.</li>
      <li>Le bouton de retour en haut et les fenêtres de progression se placent
        juste à côté du contenu de la page, au lieu des bords extrêmes de la
        fenêtre.</li>
      <li>La page du jeu ne défile plus de côté sur un téléphone.</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: La langue de test « Pseudo » n'est proposée qu'aux administrateurs
  body: |
    <ul>
      <li><strong>« Pseudo » n'apparaît plus pour tout le monde dans la liste
        des langues.</strong> C'est un outil de développement qui affiche chaque
        mot entre crochets et avec des accents ; il n'est donc plus proposé
        qu'aux administrateurs. Toute autre personne qui l'avait choisi voit
        l'application en anglais, avec l'anglais sélectionné dans les
        Paramètres.</li>
    </ul>
- version: 3.24.1
  date: '2026-10-17'
  tags:
  - type: fix
    label: Le téléchargement Windows s'installe de nouveau, et plus d'avalanche d'erreurs après un redimensionnement
  body: |
    <ul>
      <li><strong>Le téléchargement Windows normal ne pouvait pas
        s'installer.</strong> L'installateur s'arrêtait sur « Core dependencies
        failed to install », car sa liste verrouillée de paquets omettait un
        paquet dont seul Windows a besoin. La liste couvre désormais toutes les
        plateformes. Le téléchargement Windows sans Python n'était pas
        concerné.</li>
      <li><strong>Des messages d'erreur apparaissaient sans cesse dans le coin
        supérieur droit</strong> avec le thème Cyberpunk après avoir élargi la
        fenêtre du navigateur, par exemple en l'agrandissant au maximum. Le
        fond animé se redimensionne désormais proprement.</li>
    </ul>
- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Lancez un jeu directement depuis la Bibliothèque et les pages système
  body: |
    <ul>
      <li><strong>Un bouton ▶ Jouer sur chaque carte de jeu.</strong> Il
        apparaît dans le coin inférieur gauche de la jaquette, sur la page
        Bibliothèque et sur chaque page système. Cliquez dessus et le jeu
        démarre dans son émulateur ; vous restez sur la liste au lieu d'ouvrir
        d'abord la page du jeu.</li>
      <li>Le bouton n'apparaît que là où un clic peut fonctionner : votre
        compte a le droit de lancer des jeux, et l'émulateur du jeu est activé,
        installé et, pour RetroArch, dispose de son cœur. Les jeux des systèmes
        sans émulateur fonctionnel n'ont pas de bouton.</li>
      <li>Si un lancement échoue malgré tout, par exemple parce que le fichier
        ROM a été déplacé, la raison s'affiche dans un message et la page reste
        telle quelle.</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: Une barre latérale plus courte, avec une seule page Succès pour toutes les plateformes
  body: |
    <ul>
      <li><strong>Un seul lien « Succès » en remplace cinq.</strong>
        RetroAchievements, RPCS3, PSN, Steam et Xbox sont désormais des onglets
        d'une même page, et le lien rouvre le dernier onglet utilisé. Si vous
        n'avez aucun jeu RetroAchievements, il s'ouvre sur l'onglet RPCS3 au
        lieu de vous renvoyer au Tableau de bord.</li>
      <li><strong>Rapports ROM se trouve désormais dans Outils ROM,</strong>
        sous forme d'onglet à côté des autres outils et de carte sur la page
        Outils ROM.</li>
      <li><strong>Deux liens de la barre latérale ne partagent plus la même
        icône :</strong> le Tableau de bord est désormais 🏠 et la Visionneuse
        de journaux 🧾. La barre latérale compte 16 liens au lieu de
        21.</li>
      <li>Les onglets des outils de la page des paramètres des Outils ROM
        étaient toujours en anglais ; ils suivent désormais votre langue.</li>
    </ul>
- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: Les recherches How Long To Beat fonctionnent de nouveau
  body: |
    <ul>
      <li><strong>Chaque recherche How Long To Beat indiquait que le jeu était
        introuvable.</strong> Le site a déplacé sa recherche vers une nouvelle
        adresse, si bien que les requêtes de RetroDB étaient refusées ; la panne
        est survenue entre fin juillet et fin septembre. RetroDB utilise
        désormais la nouvelle adresse et envoie les filtres de plateforme et
        d'année dans le nouveau format du site, que celui-ci avait commencé à
        ignorer. La recherche pour un seul jeu et la recherche groupée dans les
        Outils ROM fonctionnent de nouveau.</li>
    </ul>
- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: RetroDB indique désormais clairement qu'il ne cautionne pas le piratage
  - type: fix
    label: La fenêtre À propos s'ouvre de nouveau en taille normale
  body: |
    <ul>
      <li><strong>Un avertissement contre le piratage figure désormais dans
        l'application.</strong> Il apparaît dans la fenêtre À propos et sous le
        Chemin de la bibliothèque de ROM dans les Paramètres, dans toutes les
        langues. Il indique que RetroDB ne distribue ni n'héberge de fichiers
        ROM, que vous ne devez utiliser que des jeux copiés à partir de disques
        et de cartouches que vous possédez, et que RetroDB n'est affilié à aucun
        fabricant de consoles, éditeur ou base de données de jeux. Le texte
        correspond à celui du site web et de la bande-annonce de RetroDB.</li>
      <li><strong>La fenêtre À propos était comprimée dans la barre
        latérale.</strong> Elle s'ouvre désormais au milieu de l'écran, à sa
        taille normale, et défile sur un petit écran au lieu de masquer son
        titre et son bouton de fermeture.</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: RetroDB ne lance et ne renomme plus que de vrais types de fichiers ROM
  body: |
    <ul>
      <li><strong>Un jeu pouvait être lancé avec un fichier qui n'est pas une
        ROM.</strong> Renommer une ROM acceptait n'importe quel nom, si bien que
        <code>crash.bin</code> pouvait devenir <code>crash.cfg</code> et être
        transmis à l'émulateur. Le lancement vérifie désormais le type de
        fichier d'après la liste du <code>systeminfo.txt</code> du dossier de ce
        système, la même liste que celle utilisée par l'analyse de la
        bibliothèque, et le renommage refuse un type absent de cette liste. Si
        un dossier système n'a pas de liste, ses jeux ne se lanceront pas, et le
        message indique le fichier manquant.</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: Seul un administrateur peut modifier les arguments de lancement d'un jeu
  - type: fix
    label: Les arguments de lancement de plusieurs mots, ou avec un guillemet isolé, fonctionnent désormais
  - type: fix
    label: RetroDB ne garde plus en mémoire chaque lancement terminé
  body: |
    <ul>
      <li><strong>Un éditeur pouvait ajouter des arguments de lancement qui
        exécutaient un autre code.</strong> Les <em>Arguments de lancement
        personnalisés</em> d'un jeu sont transmis tels quels à l'émulateur, et
        avec RetroArch ils pouvaient charger n'importe quel fichier programme de
        l'ordinateur. Les modifier exige désormais le rôle administrateur, et le
        champ est masqué pour tous les autres.</li>
      <li><strong>Les arguments de lancement de plus d'un mot arrivaient à
        l'émulateur comme un seul.</strong> <code>--a --b</code> arrive
        désormais sous forme de deux arguments, et une valeur vide n'ajoute
        rien. Un guillemet fermant manquant faisait échouer chaque lancement de
        ce jeu avec une erreur du serveur ; un message indique maintenant le
        champ à corriger. Le jeton <code>{disc_paths}</code> a été supprimé : il
        était toujours vide.</li>
      <li><strong>Les lancements terminés s'accumulaient en mémoire jusqu'au
        redémarrage de RetroDB.</strong> Un lancement terminé depuis plus d'une
        heure est désormais effacé.</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: Le choix de la langue dans les Paramètres fonctionne de nouveau
  body: |
    <ul>
      <li><strong>Choisir une langue dans Paramètres &rarr; Bibliothèque &rarr;
        Affichage ne faisait rien.</strong> Une erreur s'affichait à la place et
        la page restait dans son ancienne langue. Le problème datait de la
        3.23.8. Choisir une langue l'enregistre désormais et recharge la page
        dans cette langue.</li>
    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: Les icônes des trophées et des plateformes sont de retour dans le téléchargement
  body: |
    <ul>
      <li><strong>Il manquait au téléchargement les icônes de trophées et de
        plateformes de RetroDB.</strong> Chaque carte de jeu avec
        RetroAchievements affichait une image cassée à la place de son badge,
        et les niveaux de trophées ainsi que les logos PSN, Steam, Xbox et RPCS3
