- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: L'application des métadonnées montre où elle en est
  body: |
    <ul>
      <li><strong>L'application des métadonnées montre où elle en
        est.</strong> Lorsque vous choisissez un résultat dans Rechercher des
        métadonnées, un anneau se remplit de 0 à 100 % avec le pourcentage en
        son centre, et la ligne en dessous indique ce qui se passe : quel site
        est interrogé, quelle image ou vidéo est en cours de téléchargement,
        ou que les images sont en cours de traitement. Un gros téléchargement,
        comme une vidéo, fait avancer l'anneau à mesure qu'il arrive. À 100 %,
        la page se recharge avec le résultat, comme avant.</li>
      <li>L'anneau peut avancer de façon irrégulière. Chaque source ne décide
        du nombre d'images qu'elle envoie qu'au moment où elle répond : la
        première source riche en images peut donc remplir une grande partie de
        l'anneau, et les suivantes moins.</li>
      <li>Si une application échoue, l'anneau se ferme et un message
        l'indique, sans recharger la page.</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Chaque page s'adapte désormais à la fenêtre qui l'affiche
  - type: enhancement
    label: La page du jeu affiche les autres noms dans leur propre carte, et un bouton Manuel
  body: |
    <ul>
      <li><strong>Chaque page s'adapte désormais à la fenêtre qui l'affiche.</strong>
        Les pages en cartes (Systèmes, Musée, Étiquettes, Listes, Outils ROM,
        trophées et succès) ajoutent une colonne chaque fois qu'une carte
        entière de plus y tient, jusqu'à quatre par ligne. Les tableaux, les
        outils et les pages de détail s'élargissent un peu, mais s'arrêtent là
        où plus de largeur ne ferait qu'écarter leurs colonnes. Les Paramètres
        gardent leurs encadrés à une largeur lisible.</li>
      <li><strong>L'Aide et le Journal des modifications gardent des lignes
        de longueur confortable.</strong> Sur une fenêtre large, les liens vers
        les sections de l'Aide passent dans une colonne à côté du texte ; sur
        une fenêtre étroite, ils tiennent sur une seule ligne que l'on fait
        défiler du doigt, au lieu d'un bloc qui couvrait une bonne partie d'un
        écran de téléphone.</li>
      <li><strong>La page du jeu :</strong> sur une fenêtre large, les captures
        d'écran s'étendent en haut, avec en dessous, côte à côte, la vidéo et
        une nouvelle carte <strong>Également connu sous le nom de</strong>, à
        hauteur de la jaquette. Les autres noms étaient un texte pâle sous le
        titre ; ils figurent maintenant sur une carte facile à lire.
        <strong>Manuel</strong> est un bouton à côté de Jouer, et l'Historique
        de récupération s'affiche replié au départ.</li>
      <li>Trophées PSN affiche d'une à quatre colonnes selon la fenêtre, au lieu
        de toujours trois.</li>
      <li>Plusieurs pages ne défilent plus de côté sur un téléphone : Trophées,
        Trophées de collectionneur, la page système RetroAchievements, Aide,
        Paramètres, Analyses, Imports de jeux et les pages de détail des succès
        et des trophées. Les tableaux larges y défilent désormais à l'intérieur
        de leur propre cadre.</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: La Bibliothèque, les pages système et la page du jeu s'adaptent désormais à leur fenêtre
  body: |
    <ul>
      <li><strong>Les pages utilisent une fenêtre large quand c'est utile, et
        seulement dans ce cas.</strong> La Bibliothèque et chaque page système
        ajoutent une colonne de cartes de jeu chaque fois qu'une carte entière
        de plus y tient, jusqu'à quatre par ligne. Un téléphone en affiche une,
        une fenêtre en demi-écran deux ou trois, une fenêtre large quatre.
        Auparavant, les pages s'arrêtaient à une largeur fixe et laissaient
        vide la plus grande partie d'une grande fenêtre.</li>
      <li><strong>La page du jeu place sa jaquette et ses détails à côté des
        captures d'écran et de la vidéo</strong> quand les deux tiennent côte à
        côte, et les empile sinon. La description garde des lignes de longueur
        confortable.</li>
      <li><strong>Le bouton Jouer a rejoint le coin supérieur droit de chaque
        carte,</strong> plus petit et centré. Il vérifie aussi désormais que le
        fichier ROM du jeu est toujours présent et d'un type accepté par son
        système : il n'apparaît donc que là où un clic lancera vraiment le jeu.
        Il se masque pendant que vous sélectionnez des jeux en groupe.</li>
      <li>Le bouton de retour en haut et les fenêtres de progression se placent
        juste à côté du contenu de la page, au lieu des bords extrêmes de la
        fenêtre.</li>
      <li>La page du jeu ne défile plus de côté sur un téléphone.</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: La langue de test « Pseudo » n'est proposée qu'aux administrateurs
  body: |
    <ul>
      <li><strong>« Pseudo » n'apparaît plus pour tout le monde dans la liste
        des langues.</strong> C'est un outil de développement qui affiche chaque
        mot entre crochets et avec des accents ; il n'est donc plus proposé
        qu'aux administrateurs. Toute autre personne qui l'avait choisi voit
        l'application en anglais, avec l'anglais sélectionné dans les
        Paramètres.</li>
    </ul>
- version: 3.24.1
  date: '2026-10-17'
  tags:
  - type: fix
    label: Le téléchargement Windows s'installe de nouveau, et plus d'avalanche d'erreurs après un redimensionnement
  body: |
    <ul>
      <li><strong>Le téléchargement Windows normal ne pouvait pas
        s'installer.</strong> L'installateur s'arrêtait sur « Core dependencies
        failed to install », car sa liste verrouillée de paquets omettait un
        paquet dont seul Windows a besoin. La liste couvre désormais toutes les
        plateformes. Le téléchargement Windows sans Python n'était pas
        concerné.</li>
      <li><strong>Des messages d'erreur apparaissaient sans cesse dans le coin
        supérieur droit</strong> avec le thème Cyberpunk après avoir élargi la
        fenêtre du navigateur, par exemple en l'agrandissant au maximum. Le
        fond animé se redimensionne désormais proprement.</li>
    </ul>
- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Lancez un jeu directement depuis la Bibliothèque et les pages système
  body: |
    <ul>
      <li><strong>Un bouton ▶ Jouer sur chaque carte de jeu.</strong> Il
        apparaît dans le coin inférieur gauche de la jaquette, sur la page
        Bibliothèque et sur chaque page système. Cliquez dessus et le jeu
        démarre dans son émulateur ; vous restez sur la liste au lieu d'ouvrir
        d'abord la page du jeu.</li>
      <li>Le bouton n'apparaît que là où un clic peut fonctionner : votre
        compte a le droit de lancer des jeux, et l'émulateur du jeu est activé,
        installé et, pour RetroArch, dispose de son cœur. Les jeux des systèmes
        sans émulateur fonctionnel n'ont pas de bouton.</li>
      <li>Si un lancement échoue malgré tout, par exemple parce que le fichier
        ROM a été déplacé, la raison s'affiche dans un message et la page reste
        telle quelle.</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: Une barre latérale plus courte, avec une seule page Succès pour toutes les plateformes
  body: |
    <ul>
      <li><strong>Un seul lien « Succès » en remplace cinq.</strong>
        RetroAchievements, RPCS3, PSN, Steam et Xbox sont désormais des onglets
        d'une même page, et le lien rouvre le dernier onglet utilisé. Si vous
        n'avez aucun jeu RetroAchievements, il s'ouvre sur l'onglet RPCS3 au
        lieu de vous renvoyer au Tableau de bord.</li>
      <li><strong>Rapports ROM se trouve désormais dans Outils ROM,</strong>
        sous forme d'onglet à côté des autres outils et de carte sur la page
        Outils ROM.</li>
      <li><strong>Deux liens de la barre latérale ne partagent plus la même
        icône :</strong> le Tableau de bord est désormais 🏠 et la Visionneuse
        de journaux 🧾. La barre latérale compte 16 liens au lieu de
        21.</li>
      <li>Les onglets des outils de la page des paramètres des Outils ROM
        étaient toujours en anglais ; ils suivent désormais votre langue.</li>
    </ul>
- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: Les recherches How Long To Beat fonctionnent de nouveau
  body: |
    <ul>
      <li><strong>Chaque recherche How Long To Beat indiquait que le jeu était
        introuvable.</strong> Le site a déplacé sa recherche vers une nouvelle
        adresse, si bien que les requêtes de RetroDB étaient refusées ; la panne
        est survenue entre fin juillet et fin septembre. RetroDB utilise
        désormais la nouvelle adresse et envoie les filtres de plateforme et
        d'année dans le nouveau format du site, que celui-ci avait commencé à
        ignorer. La recherche pour un seul jeu et la recherche groupée dans les
        Outils ROM fonctionnent de nouveau.</li>
    </ul>
- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: RetroDB indique désormais clairement qu'il ne cautionne pas le piratage
  - type: fix
    label: La fenêtre À propos s'ouvre de nouveau en taille normale
  body: |
    <ul>
      <li><strong>Un avertissement contre le piratage figure désormais dans
        l'application.</strong> Il apparaît dans la fenêtre À propos et sous le
        Chemin de la bibliothèque de ROM dans les Paramètres, dans toutes les
        langues. Il indique que RetroDB ne distribue ni n'héberge de fichiers
        ROM, que vous ne devez utiliser que des jeux copiés à partir de disques
        et de cartouches que vous possédez, et que RetroDB n'est affilié à aucun
        fabricant de consoles, éditeur ou base de données de jeux. Le texte
        correspond à celui du site web et de la bande-annonce de RetroDB.</li>
      <li><strong>La fenêtre À propos était comprimée dans la barre
        latérale.</strong> Elle s'ouvre désormais au milieu de l'écran, à sa
        taille normale, et défile sur un petit écran au lieu de masquer son
        titre et son bouton de fermeture.</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: RetroDB ne lance et ne renomme plus que de vrais types de fichiers ROM
  body: |
    <ul>
      <li><strong>Un jeu pouvait être lancé avec un fichier qui n'est pas une
        ROM.</strong> Renommer une ROM acceptait n'importe quel nom, si bien que
        <code>crash.bin</code> pouvait devenir <code>crash.cfg</code> et être
        transmis à l'émulateur. Le lancement vérifie désormais le type de
        fichier d'après la liste du <code>systeminfo.txt</code> du dossier de ce
        système, la même liste que celle utilisée par l'analyse de la
        bibliothèque, et le renommage refuse un type absent de cette liste. Si
        un dossier système n'a pas de liste, ses jeux ne se lanceront pas, et le
        message indique le fichier manquant.</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: Seul un administrateur peut modifier les arguments de lancement d'un jeu
  - type: fix
    label: Les arguments de lancement de plusieurs mots, ou avec un guillemet isolé, fonctionnent désormais
  - type: fix
    label: RetroDB ne garde plus en mémoire chaque lancement terminé
  body: |
    <ul>
      <li><strong>Un éditeur pouvait ajouter des arguments de lancement qui
        exécutaient un autre code.</strong> Les <em>Arguments de lancement
        personnalisés</em> d'un jeu sont transmis tels quels à l'émulateur, et
        avec RetroArch ils pouvaient charger n'importe quel fichier programme de
        l'ordinateur. Les modifier exige désormais le rôle administrateur, et le
        champ est masqué pour tous les autres.</li>
      <li><strong>Les arguments de lancement de plus d'un mot arrivaient à
        l'émulateur comme un seul.</strong> <code>--a --b</code> arrive
        désormais sous forme de deux arguments, et une valeur vide n'ajoute
        rien. Un guillemet fermant manquant faisait échouer chaque lancement de
        ce jeu avec une erreur du serveur ; un message indique maintenant le
        champ à corriger. Le jeton <code>{disc_paths}</code> a été supprimé : il
        était toujours vide.</li>
      <li><strong>Les lancements terminés s'accumulaient en mémoire jusqu'au
        redémarrage de RetroDB.</strong> Un lancement terminé depuis plus d'une
        heure est désormais effacé.</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: Le choix de la langue dans les Paramètres fonctionne de nouveau
  body: |
    <ul>
      <li><strong>Choisir une langue dans Paramètres &rarr; Bibliothèque &rarr;
        Affichage ne faisait rien.</strong> Une erreur s'affichait à la place et
        la page restait dans son ancienne langue. Le problème datait de la
        3.23.8. Choisir une langue l'enregistre désormais et recharge la page
        dans cette langue.</li>
    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: Les icônes des trophées et des plateformes sont de retour dans le téléchargement
  body: |
    <ul>
      <li><strong>Il manquait au téléchargement les icônes de trophées et de
        plateformes de RetroDB.</strong> Chaque carte de jeu avec
        RetroAchievements affichait une image cassée à la place de son badge,
        et les niveaux de trophées ainsi que les logos PSN, Steam, Xbox et RPCS3
        manquaient aussi. Ils sont désormais inclus dans chaque
        téléchargement.</li>
    </ul>
- version: 3.23.14
  date: '2026-10-10'
  tags:
  - type: security
    label: Deux bibliothèques incluses mises à jour pour des correctifs de sécurité publiés
  body: |
    <ul>
      <li><strong>urllib3 et Werkzeug présentaient des failles de sécurité
        connues.</strong> RetroDB inclut désormais urllib3 2.8.0 et Werkzeug
        3.1.9, les versions qui les corrigent. Une installation depuis les
        sources les obtient en relançant <code>install.py</code>, qui installe à
        partir de <code>requirements.lock</code>.</li>
    </ul>
- version: 3.23.13
  date: '2026-09-26'
  tags:
  - type: fix
    label: Un média enregistré sous forme de chemin de dossier n'est plus signalé comme manquant
  body: |
    <ul>
      <li><strong>Dans la version autonome, « effacer les références aux médias
        manquants » pouvait vider des médias pourtant bien présents.</strong>
        Cela arrivait lorsque la base de données enregistrait le média sous
        forme de chemin de dossier, comme <code>images/boxart/…</code>, plutôt
        que d'un simple nom de fichier. RetroDB le cherche désormais dans le bon
        dossier.</li>
    </ul>
- version: 3.23.12
  date: '2026-09-26'
  tags:
  - type: fix
    label: Le tableau de bord affiche une récupération groupée en cours, et quatre petites corrections
  body: |
    <ul>
      <li><strong>La carte de progression de la récupération sur le tableau de
        bord n'apparaissait jamais.</strong> Elle s'affiche désormais pendant
        une récupération groupée et indique quand celle-ci est en
        pause.</li>
      <li><strong>Plus d'erreurs dans la console du navigateur sur la page de
        connexion.</strong> Elle ne vérifie plus les tâches en arrière-plan
        avant que quelqu'un soit connecté.</li>
      <li><strong>L'assistant de configuration n'affiche plus « Configuration
        terminée ! » quand l'enregistrement a échoué.</strong> Il vous indique
        désormais que les paramètres n'ont pas pu être enregistrés.</li>
      <li><strong>Deux récupérations groupées lancées dans la même seconde ne
        partagent plus le même identifiant</strong>, si bien que les actions de
        la file d'attente, comme l'annulation, agissent sur la bonne.</li>
    </ul>
- version: 3.23.11
  date: '2026-09-26'
  tags:
  - type: ui
    label: Les boutons de don indiquent désormais ce qu'ils soutiennent
  body: |
    <ul>
      <li><strong>Un texte plus clair pour les dons.</strong> Les boutons de
        l'en-tête affichent désormais « Sponsor » et « Soutenir sur Patreon ».
        Le README précise que chaque version est gratuite et que les dons
        financent RetroDB lui-même, et non les émulateurs et les cœurs qu'il
        peut lancer.</li>
    </ul>
- version: 3.23.10
  date: '2026-09-26'
  tags:
  - type: fix
    label: Les pages des Outils ROM suivent vos paramètres enregistrés, et les pages Journaux et Outils ROM fonctionnent de nouveau
  body: |
    <ul>
      <li><strong>La page des journaux et certaines pages des Outils ROM ne
        fonctionnaient pas.</strong> Un script de ces pages échouait au
        chargement, si bien que la visionneuse de journaux et les fonctions
        partagées des Outils ROM ne démarraient jamais. Elles se chargent
        correctement désormais.</li>
      <li><strong>Les paramètres des Outils ROM ont désormais un effet.</strong>
        Le Détecteur de doublons et le Convertisseur CHD s'ouvrent avec les
        options réglées sur la page des paramètres des Outils ROM, et vous
        pouvez toujours les modifier le temps d'une exécution.</li>
      <li><strong>Les interrupteurs du Convertisseur CHD étaient
        ignorés.</strong> Désactiver « Supprimer les fichiers originaux » sur
        la page n'empêchait pas la suppression si votre paramètre enregistré
        disait de supprimer. Ce sont désormais les interrupteurs de la page qui
        décident.</li>
      <li><strong>Le paramètre Chemin temporaire est utilisé.</strong> Les
        fichiers préparés lors de la création de listes de lecture M3U y sont
        désormais placés.</li>
    </ul>
- version: 3.23.9
  date: '2026-09-26'
  tags:
  - type: security
    label: Les journaux des récupérateurs n'enregistrent plus les mots de passe et jetons, et les tentatives de connexion sont de nouveau limitées
  - type: fix
    label: L'enregistrement des paramètres ne les efface plus, et la suppression d'un utilisateur fonctionne
  body: |
    <ul>
      <li><strong>Les fichiers journaux conservaient des secrets en clair.</strong>
        Les journaux des récupérateurs devaient masquer les jetons de connexion
        et les clés d'API, mais l'étape de masquage ne s'exécutait jamais, si
        bien qu'ils étaient écrits en entier. Ils sont désormais masqués. Les
        anciens fichiers journaux les contiennent toujours ; supprimez les
        anciens fichiers de <code>logs/</code> si vous partagez votre
        installation.</li>
      <li><strong>Les limites de tentatives de connexion n'étaient pas
        appliquées.</strong> Les limites sur les connexions répétées et sur les
        actions lourdes (analyses, récupérations, imports) étaient configurées
        mais jamais activées. Elles fonctionnent désormais, et une requête
        bloquée reçoit un message clair « trop de requêtes ».</li>
      <li><strong>Un fichier de paramètres endommagé pouvait être effacé.</strong>
        Si <code>data/settings.json</code> ne pouvait pas être lu, le prochain
        enregistrement le remplaçait par les valeurs par défaut. RetroDB conserve
        désormais le fichier endommagé sous le nom
        <code>settings.json.corrupt-&lt;time&gt;</code> avant d'enregistrer. Si
        le fichier se lit de nouveau correctement, l'enregistrement est refusé à
        la place.</li>
      <li><strong>La ligne de nommage Moteur faisait perdre d'autres
        paramètres.</strong> Ajouter une étiquette à la ligne Moteur dans les
        paramètres de nommage échouait, et supprimait aussi les paramètres
        d'article et de région enregistrés avec elle. Elle s'enregistre
        correctement désormais.</li>
      <li><strong>La suppression d'un utilisateur échouait.</strong> Un
        utilisateur possédant des étiquettes, des listes, des éléments de liste
        de souhaits ou des données PSN ne pouvait pas être supprimé. La
        suppression retire désormais l'utilisateur et tout ce qui lui
        appartient.</li>
      <li><strong>Deux récupérations pouvaient tourner en même temps.</strong>
        Échanger ou déplacer une récupération groupée en cours dans la file
        d'attente lançait deux récupérations qui partageaient un même compteur
        de progression. Une seule s'exécute désormais.</li>
      <li><strong>La progression d'une récupération groupée pouvait ressembler à
        une erreur.</strong> Avant son premier succès, une récupération groupée
        signalait son état d'une manière que certains écrans interprétaient
        comme un échec. C'est corrigé.</li>
      <li><strong>La connexion vous ramène désormais à la page demandée.</strong>
        Elle menait auparavant toujours au tableau de bord.</li>
      <li><strong>Les actions d'administration sur les fichiers restent dans vos
        dossiers.</strong> L'outil de redimensionnement d'images et les actions
        de renommage de ROM refusent désormais tout ce qui se trouve hors de
        votre dossier de médias ou de votre dossier de ROM.</li>
      <li><strong>Les anciens fichiers de connexion PSN et Xbox sont transférés
        dans votre compte.</strong> Un fichier <code>data/psn_tokens.json</code>
        ou <code>data/xbox_tokens.json</code> restant est chargé dans votre
        compte et renommé pour se terminer par <code>.migrated-015</code>. Ce
        fichier contient toujours le jeton : supprimez-le une fois que vous avez
        vérifié que la connexion fonctionne.</li>
      <li><strong>Des erreurs plus claires de la part du serveur.</strong> Une
        requête incorrecte reçoit désormais un vrai message d'erreur au lieu de
        « An internal error occurred ».</li>
    </ul>
- version: 3.23.8
  date: '2026-09-25'
  tags:
  - type: fix
    label: L'import CLZ fonctionne de nouveau, les jaquettes des listes s'affichent, et plusieurs pages ne se cassent plus sur une apostrophe
  - type: security
    label: Les noms récupérés et les chemins de fichiers ne peuvent plus sortir des boutons de la page
  body: |
    <ul>
      <li><strong>L'import CLZ ne faisait rien.</strong> L'envoi d'un PDF CLZ
        visait une adresse que le serveur ne possède pas, si bien que chaque
        envoi échouait avec « Parse failed ». Il atteint désormais
        l'analyseur.</li>
      <li><strong>Toutes les jaquettes d'une page de liste manquaient.</strong>
        La page de liste demandait chaque jaquette à la mauvaise adresse, et la
        colonne Système était toujours vide. Les deux s'affichent désormais. Les
        images de jaquette dans la recherche « ajouter un jeu » de la page sont
        également corrigées.</li>
      <li><strong>Des boutons se cassaient sur les noms contenant une
        apostrophe.</strong> Retirer « Assassin's Creed » d'une liste, supprimer
        une capture d'écran, agrandir une jaquette ou retirer une étiquette de
        genre pouvait ne rien faire, sans prévenir, quand le nom contenait une
        apostrophe. Le même défaut permettait à un nom récupéré spécialement
        conçu d'exécuter du code dans la page. Les noms parviennent désormais à
        ces boutons d'une manière qui ne peut pas être prise pour du code.</li>
      <li><strong>Les adresses d'images et de liens sont échappées
        partout.</strong> Quelques pages construisaient des adresses d'images à
        partir de noms de fichiers récupérés sans les échapper, et cinq pages
        avaient leur propre copie, plus faible, de la fonction d'échappement.
        Elles utilisent désormais toutes la fonction partagée.</li>
      <li><strong>La page Paramètres pouvait s'ouvrir vide.</strong> Si le
        dernier onglet utilisé avait été renommé par une mise à jour, les
        Paramètres s'ouvraient sans aucun panneau visible. La page ignore
        désormais un onglet qui n'existe plus. Les liens comme
        <code>/settings#account</code> ouvrent de nouveau cet onglet.</li>
      <li><strong>Votre thème vous suit désormais sur vos autres
        appareils.</strong> Le thème que vous choisissez est enregistré dans
        votre compte. Un navigateur à qui aucun thème n'a jamais été indiqué
        utilise votre thème enregistré au lieu de celui par défaut.</li>
      <li><strong>Les fenêtres de progression des tâches affichent la bonne
        icône.</strong> Les tâches en pause, terminées et en file d'attente
        affichaient la même icône « en cours ». Chaque état a désormais la
        sienne, pour chaque thème.</li>
      <li><strong>La liste des raccourcis clavier peut désormais être
        traduite.</strong> Ses libellés étaient invisibles pour les outils de
        traduction, si bien qu'ils restaient en anglais dans toutes les
        langues.</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: Les classifications d'âge étaient souvent fausses, et les jeux récupérés pouvaient perdre leurs détails
  body: |
    <ul>
      <li><strong>Les classifications d'âge étaient souvent fausses, et l'erreur se propageait.</strong>
        Quand une classification venait de TheGamesDB, l'application cherchait
        le code de classification n'importe où dans le texte au lieu de le lire
        correctement &mdash; si bien que « T - Teen », « M - Mature 17+ »,
        « AO - Adults Only 18+ » et « RP - Rating Pending » étaient tous
        enregistrés avec la mauvaise classification, et un jeu Mature pouvait
        être classé comme adapté à tous. Pire, cette classification erronée
        servait ensuite à remplir les huit autres systèmes de classification,
        si bien qu'une seule mauvaise lecture se propageait à tous. Les
        classifications sont désormais lues à partir du code en début de
        texte.</li>
      <li><strong>Les classifications converties étaient trop
        indulgentes.</strong> En complétant une classification manquante à
        partir d'une autre déjà connue, l'application pouvait utiliser une
        classification qu'elle venait elle-même de calculer quelques instants
        plus tôt plutôt que celle dont vous disposiez réellement au départ.
        Chaque étape perdait un peu de sévérité. Elle convertit désormais
        toujours à partir des classifications que le jeu possède
        réellement.</li>
      <li><strong>La Récupération complète effaçait la Région et le Type de
        sauvegarde choisis à la main.</strong> Aucun des deux ne vient d'un
        récupérateur &mdash; l'application les déduit elle-même &mdash; si bien
        qu'une Récupération complète remplaçait votre « Japon » soigneusement
        choisi par le « USA » par défaut. Vos valeurs sont désormais conservées,
        sauf si une source en fournit réellement une nouvelle.</li>
      <li><strong>Un récupérateur pouvait accepter le mauvais jeu.</strong> Les
        résultats de ScreenScraper sont normalement comparés à un score de
        correspondance avant d'être utilisés, mais une recherche ne renvoyant
        qu'un seul résultat sautait entièrement cette vérification. Chaque
        résultat est désormais noté.</li>
      <li><strong>Un jeu pouvait perdre tous ses détails récupérés à cause d'un
        seul champ manquant.</strong> Si IGDB ou ScreenScraper laissait un seul
        champ vide d'une manière inattendue, toute la mise à jour était
        abandonnée &mdash; éditeur, développeur, illustrations et tout le reste.
        Ces cas sont désormais gérés et le reste des détails est
        conservé.</li>
      <li><strong>Une image ratée pouvait être enregistrée comme un
        succès.</strong> Si une image téléchargée se révélait inutilisable,
        l'application ne supprimait rien et enregistrait quand même le nom du
        fichier, laissant une référence cassée. Le fichier est désormais
        supprimé et le champ laissé tel quel.</li>
      <li><strong>Les modes de jeu utilisent désormais des libellés
        cohérents.</strong> Différents récupérateurs écrivaient
        « Single-player » et « Single-Player », ainsi qu'un simple
        « Multiplayer » qui ne faisait pas partie des libellés de
        l'application ; ces jeux ne pouvaient donc pas être traduits ni trouvés
        par le filtre Modes. Toutes les sources écrivent désormais les mêmes
        libellés. Les jeux existants gardent leur ancien libellé jusqu'à ce que
        vous les récupériez de nouveau ou lanciez l'outil de normalisation dans
        les Paramètres.</li>
      <li><strong>Les recherches Xbox se comportent désormais comme toutes les
        autres sources.</strong> Elles effectuaient leurs propres requêtes web,
        sans nouvelle tentative quand Xbox Live leur demandait de ralentir, et
        sans limite sur la quantité de données qu'une réponse pouvait apporter.
        Elles utilisent désormais la même connexion partagée que les autres
        récupérateurs.</li>
      <li><strong>Code ScreenScraper inutilisé supprimé.</strong> Deux fonctions
        que rien dans l'application n'appelait ont été supprimées. L'une d'elles
        renvoyait une adresse web contenant encore votre mot de passe
        ScreenScraper, ce qui aurait transmis le mot de passe à tout ce qui
        l'utilisait. Le « System Media Endpoint » mentionné dans les notes de
        version 3.6.x était l'une d'elles &mdash; il n'a jamais été accessible
        depuis aucun endroit de l'application.</li>
    </ul>
- version: 3.23.5
  date: '2026-09-02'
  tags:
  - type: fix
    label: Le téléchargement empaqueté ne pouvait pas démarrer, et d'autres corrections de compilation
  body: |
    <ul>
      <li><strong>Le téléchargement autonome ne pouvait pas démarrer du
        tout.</strong> La version empaquetée embarque son propre Python, mais le
        lanceur qu'elle contenait était celui écrit pour l'installation depuis
        les sources &mdash; il cherchait des fichiers Python qu'une version
        empaquetée ne contient pas, et s'arrêtait dès la première ligne. Le
        paquet inclut désormais son propre lanceur, qui exécute simplement
        l'application et ouvre votre navigateur une fois le serveur
        démarré.</li>
      <li><strong>Le raccourci de bureau du téléchargement Linux ne lançait
        rien.</strong> Il était livré avec un texte provisoire à la place du
        chemin vers l'application. Il y a désormais un
        <code>install-launcher.sh</code> à côté du lanceur &mdash; exécutez-le
        une fois et le raccourci est écrit avec le vrai chemin de l'endroit où
        vous l'avez décompressé.</li>
      <li><strong>Le démarrage depuis les sources installait des dépendances
        non vérifiées.</strong> Quand Flask manquait, le script de démarrage
        téléchargeait des paquets directement depuis Internet sans vérification
        de somme de contrôle, en passant outre le gestionnaire de paquets de
        votre système. Il passe désormais la main à <code>install.py</code>, qui
        utilise le fichier de verrouillage avec sommes de contrôle.</li>
      <li><strong>Le téléchargement des sources contenait des fichiers de
        maintenance qui n'avaient rien à y faire.</strong> La liste des
        éléments à exclure était tenue à la main et n'était plus à jour, si bien
        que des résultats d'audit et des dossiers de compilation restants
        étaient empaquetés avec l'application. Le téléchargement est désormais
        construit à partir de la liste des fichiers réellement présents dans le
        projet, qui ne peut pas se désynchroniser.</li>
      <li><strong>Deux panneaux des Paramètres ne fonctionnaient pas dans la
        version empaquetée.</strong> Les panneaux des statistiques de la
        bibliothèque et de l'état des API cherchaient le programme principal
        sous un nom qu'il ne porte pas dans une version empaquetée, si bien que
        les deux échouaient.</li>
      <li><strong>Certains textes à l'écran ne pouvaient jamais être
        traduits.</strong> Trois parties récentes de l'application &mdash; les
        paramètres des émulateurs, le bouton de lancement et la barre « En
        cours de lecture » &mdash; étaient ignorées par l'analyse des
        traductions, et la vérification censée le détecter examinait la même
        liste incomplète. L'analyse couvre désormais automatiquement tous les
        fichiers, et leurs textes ont été ajoutés aux traductions.</li>
      <li><strong>La reconstruction des traductions pouvait ne rien faire sans
        prévenir.</strong> Ajouter du texte à un script propre à une page
        laissait la reconstruction persuadée qu'il n'y avait rien à faire, si
        bien que le nouveau texte n'atteignait jamais le fichier de
        traduction.</li>
      <li><strong>Un contournement pour carte graphique était appliqué à tout
        le monde.</strong> Le script de démarrage Linux imposait à toutes les
        machines un réglage destiné à une carte AMD précise, ce qui pouvait
        bloquer l'agrandisseur d'images sur d'autres matériels AMD. Il ne
        s'applique désormais que lorsque cette carte est réellement présente, et
        ne remplace jamais une valeur que vous avez définie vous-même.</li>
      <li><strong>Le script de publication pouvait publier la mauvaise
        version.</strong> Une étiquette restante d'une tentative précédente
        était réutilisée sans prévenir, si bien que la version pouvait être
        construite à partir d'un état plus ancien tout en signalant un
        succès.</li>
    </ul>
- version: 3.23.4
  date: '2026-09-02'
  tags:
  - type: fix
    label: Neuf façons dont votre bibliothèque pouvait perdre des données, corrigées
  body: |
    <ul>
      <li><strong>« Effacer les données récupérées » effaçait toute votre
        bibliothèque.</strong> La fenêtre de confirmation ne comptait que les
        jeux réellement récupérés, puis l'action effaçait tous les jeux sans
        distinction &mdash; elle pouvait donc en annoncer une douzaine et en
        effacer des milliers. Avec les images activées, elle supprimait aussi
        les jaquettes que vous aviez ajoutées à la main et réinitialisait les
        titres que vous aviez modifiés vous-même, sur des jeux qui n'avaient
        jamais été récupérés. Elle fait désormais exactement ce qu'annonce la
        fenêtre.</li>
      <li><strong>Les jaquettes 3D laissaient derrière elles un lien
        cassé.</strong> L'effacement avec images supprimait la jaquette 3D du
        disque mais la base de données continuait d'y faire référence, si bien
        que l'application cherchait un fichier disparu.</li>
      <li><strong>L'interrupteur « Ajouter » de la Modification groupée
        remplaçait au lieu d'ajouter.</strong> Pour Perspective et Dimension, il
        faisait exactement l'inverse de son libellé, écrasant d'un coup les
        valeurs existantes de tous les jeux sélectionnés, sans annulation
        possible.</li>
      <li><strong>Les versions autonomes pouvaient effacer toutes les références
        d'images en un clic.</strong> Dans le téléchargement empaqueté,
        l'application cherchait vos médias au mauvais endroit, concluait que
        chaque image manquait, et « effacer les références aux médias
        manquants » vidait alors les entrées d'illustrations, de captures
        d'écran, de vidéos et de manuels de toute la bibliothèque. La
        vérification de sécurité prévue précisément pour ce cas ne pouvait pas
        le voir. Seule la version empaquetée était concernée.</li>
      <li><strong>Le nettoyage des fichiers orphelins pouvait supprimer des
        illustrations à leur arrivée.</strong> Une jaquette téléchargée pendant
        le nettoyage pouvait être prise pour un fichier orphelin et
        supprimée.</li>
      <li><strong>La création de listes de lecture déplaçait vos archives sans
        demander.</strong> La création groupée de listes de lecture M3U
        déplaçait vos fichiers d'archive d'origine même lorsque vous aviez
        laissé cette option désactivée &mdash; et lorsque vous la demandiez,
        elle signalait un échec pour un déplacement qui avait réussi.</li>
      <li><strong>Le redimensionneur d'images gonflait votre dossier de
        médias.</strong> Il traitait les petites miniatures qu'il génère comme
        de nouvelles images à agrandir, les portant en pleine taille puis en
        faisant des miniatures. Chaque exécution ajoutait des fichiers, les
        pages servaient discrètement des images en pleine taille à la place des
        miniatures, et l'agrandisseur IA traitait environ trois fois le nombre
        de fichiers prévu.</li>
      <li><strong>Le remplissage par IA écrasait des détails que vous aviez
        corrigés.</strong> Lors d'une récupération normale, il pouvait remplacer
        vos propres éditeur, développeur, genre, classifications d'âge et
        plus encore. Il ne remplit désormais que les champs vides ; le bouton
        Remplissage IA sur lequel vous cliquez vous-même ne change pas.</li>
      <li><strong>Des récupérations répétées pouvaient supprimer une bonne
        capture d'écran.</strong> Les jeux récupérés depuis RAWG réutilisaient
        les mêmes noms de fichiers, si bien qu'une deuxième récupération
        écrasait une capture enregistrée, puis la supprimait comme doublon alors
        que la bibliothèque la listait encore.</li>
    </ul>
- version: 3.23.3
  date: '2026-09-01'
  tags:
  - type: fix
    label: Les rôles du foyer font désormais exactement ce qu'ils annoncent, et un compte désactivé est vraiment bloqué
  body: |
    <ul>
      <li><strong>Désactiver quelqu'un met désormais fin à sa session.</strong>
        Désactiver un compte le masquait de tous les écrans, mais toute
        personne déjà connectée avec ce compte continuait de travailler
        normalement pendant jusqu'à une semaine. La désactivation est le seul
        moyen de bloquer quelqu'un sans le supprimer ; elle prend donc
        désormais effet dès son clic suivant.</li>
      <li><strong>Les comptes en lecture seule ne peuvent plus modifier les
        données des jeux.</strong> Trois actions « How Long To Beat » étaient
        ouvertes à toute personne connectée, y compris en simple consultation —
        un compte en lecture seule pouvait donc écraser une durée de jeu, ou
        l'effacer de tous les jeux de la bibliothèque. Elles exigent désormais
        des droits de modification, comme toute autre action qui modifie un
        jeu.</li>
      <li><strong>Le suivi des trophées fonctionne de nouveau pour tout le
        monde.</strong> Actualiser vos propres trophées de collectionneur
        exigeait des droits d'éditeur, que les rôles Joueur et Spectateur n'ont
        pas — et c'est la seule chose qui enregistre ces trophées. Ces comptes
        ne pouvaient donc jamais en gagner, et le bouton Actualiser affichait
        simplement une erreur. Il s'agit de votre propre progression : cela
        n'exige donc plus aucun droit particulier.</li>
      <li><strong>L'actualisation PlayStation d'une personne ne peut plus être
        arrêtée par quelqu'un d'autre.</strong> N'importe quel compte connecté
        pouvait mettre en pause ou annuler une actualisation lancée par
        quelqu'un d'autre, et voir sur quel jeu en était cette personne. Les
        deux sont désormais réservés à la personne qui l'a lancée.</li>
      <li><strong>Les imports Steam utilisent votre propre compte, et non celui
        de la première personne à avoir enregistré le sien.</strong> L'import de
        la bibliothèque lisait une seule copie partagée des identifiants Steam
        au lieu des vôtres ; il pouvait donc récupérer la bibliothèque de
        quelqu'un d'autre — alors que vos propres informations enregistrées
        semblaient manquantes.</li>
      <li><strong>Deviner un mot de passe administrateur est de nouveau
        difficile.</strong> La limite de tentatives de connexion échouées était
        partagée par tout le réseau, si bien que n'importe qui ayant son propre
        compte pouvait la remettre à zéro en se connectant et continuer à
        deviner indéfiniment. La limite s'applique désormais par compte.</li>
      <li><strong>Les erreurs de l'application parviennent désormais à la page au lieu de disparaître.
        </strong> Lorsqu'une action était refusée, 115 d'entre elles répondaient
        sous une forme que la page ne pouvait pas lire, si bien que l'action
        semblait avoir réussi. Elles signalent désormais correctement le refus,
        et vous voyez le vrai message.</li>
    </ul>
- version: 3.23.2
  date: '2026-08-06'
  tags:
  - type: fix
    label: Les pages de paramètres des récupérateurs se chargent plus vite et n'affichent jamais une clé d'API périmée
  body: |
    <ul>
      <li><strong>Les pages Paramètres et Configuration des récupérateurs ne
        relisent plus le fichier de paramètres des récupérateurs à chaque
        requête.</strong> Quatre endroits l'ouvraient et l'analysaient de
        nouveau depuis le disque à chaque affichage de page ou vérification,
        alors qu'un lecteur partagé avec cache existait déjà. Ils l'utilisent
        tous désormais, si bien que ces pages travaillent moins à chaque
        visite.</li>
      <li><strong>L'enregistrement prend toujours effet immédiatement.</strong>
        Un cache qui s'efface après un délai aurait pu vous montrer les
        anciennes valeurs jusqu'à une demi-minute après un enregistrement.
        Chaque enregistrement vide désormais le cache au moment d'écrire, si
        bien que ce que vous voyez est ce que vous venez d'enregistrer.</li>
      <li><strong>Vos vraies clés d'API ne peuvent plus être remplacées par leur
        propre valeur masquée.</strong> Les pages de paramètres affichent les
        clés enregistrées sous la forme <code>***1234</code> plutôt que la
        vraie valeur. Comme la page recevait la même copie des paramètres que
        celle utilisée par les récupérateurs, ce masquage aurait pu écraser les
        vraies clés en mémoire, et les récupérateurs se seraient connectés avec
        des astérisques jusqu'à l'expiration du cache.</li>
      <li><strong>Les versions autonomes cherchent désormais les paramètres des
        récupérateurs au bon endroit.</strong> Les récupérateurs déterminaient
        l'emplacement du fichier autrement que les pages qui l'enregistrent.
        Dans une installation normale, les deux aboutissaient au même fichier ;
        dans une version autonome (lancée d'un double-clic), ce n'aurait pas été
        le cas, et les clés d'API enregistrées auraient pu aller à un endroit où
        les récupérateurs ne regardaient jamais.</li>
    </ul>
- version: 3.23.1
  date: '2026-08-06'
  tags:
  - type: fix
    label: Le port du serveur enregistré dans les Paramètres est désormais celui qu'il utilise
  body: |
    <ul>
      <li><strong>Enregistrer un port de serveur déplace réellement le serveur.</strong>
        Les Paramètres acceptaient un port, le vérifiaient, l'enregistraient et
        vous indiquaient qu'un redémarrage était nécessaire pour l'appliquer
        &mdash; puis le serveur démarrait quand même sur 5000. Rien ne relisait
        jamais la valeur. Elle fait désormais partie de la séquence de
        démarrage, si bien qu'un redémarrage déplace vraiment RetroDB sur le
        port choisi. Une valeur définie dans l'environnement reste prioritaire :
        un lanceur ou un conteneur qui attribue un port n'est pas
        concerné.</li>
      <li><strong>Deux paramètres qui n'avaient jamais servi à rien ont été
        supprimés plutôt que réparés.</strong> « Hôte du serveur » et « mode
        débogage » étaient enregistrés et faisaient la même fausse promesse.
        Activer le mode débogage depuis un formulaire web aurait exposé une
        console Python interactive dans le navigateur, et l'adresse d'écoute
        détermine quelles machines peuvent seulement atteindre RetroDB &mdash;
        ni l'un ni l'autre n'a sa place derrière un formulaire de paramètres.
        Les deux restent configurables depuis l'environnement, où ils se
        trouvaient déjà. Si votre fichier de paramètres les contient encore, ils
        sont ignorés discrètement au chargement ; rien à faire.</li>
      <li><strong>Plus rien ne prétend qu'un redémarrage l'appliquera si ce
        n'est pas le cas.</strong> C'était là le vrai défaut &mdash; un
        paramètre mort fait désordre, mais une fausse promesse fait perdre un
        après-midi.</li>
    </ul>
- version: 3.23.0
  date: '2026-08-06'
  tags:
  - type: enhancement
    label: Démarrez RetroDB sur un port choisi par un autre outil
  body: |
    <ul>
      <li><strong>RetroDB lit désormais un réglage <code>PORT</code> depuis son
        environnement.</strong> Si vous lancez RetroDB depuis un autre outil
        &mdash; un tableau de bord, un conteneur, un panneau de serveur
        domestique &mdash; cet outil peut désormais indiquer à RetroDB le port
        qu'il souhaite, sans que personne ne modifie de fichier. Définissez
        <code>PORT</code> et RetroDB s'y lie ; ne le touchez pas et rien ne
        change. Le réglage existant <code>RETRODB_PORT</code> fonctionne
        toujours exactement comme avant, et <code>PORT</code> l'emporte si les
        deux sont définis.</li>
      <li><strong>Un numéro de port incorrect est désormais signalé au lieu
        d'être deviné.</strong> Auparavant, un port illisible produisait un mur
        de messages d'erreur Python, et un port hors de la plage utilisable
        n'était découvert qu'au moment où le serveur échouait à démarrer.
        RetroDB s'arrête désormais immédiatement avec une seule ligne indiquant
        la valeur qu'il n'a pas pu utiliser. Il ne démarrera jamais
        discrètement sur un autre port que celui demandé &mdash; être déplacé
        sans prévenir est pire que d'essuyer un refus.</li>
      <li><strong>Le message de démarrage et l'onglet du navigateur suivent le
        vrai port.</strong> L'adresse affichée au démarrage de RetroDB, et la
        page qu'il ouvre pour vous, indiquaient toujours 5000, quel que soit le
        port réellement utilisé.</li>
    </ul>
- version: 3.22.1
  date: '2026-07-31'
  tags:
  - type: fix
    label: Le fichier temporaire de la base de données ne grossit plus sans limite
  body: |
    <ul>
      <li><strong>Le journal de la base de données est de nouveau borné.</strong> SQLite conserve un fichier temporaire (le fichier <code>-wal</code>) à côté de la base de votre bibliothèque. RetroDB voulait le plafonner à 64&nbsp;Mo, mais le plafond ne s&rsquo;appliquait qu&rsquo;aux tâches en arrière-plan &mdash; les chargements de page et les modifications ordinaires n&rsquo;en avaient aucun. Après une écriture inhabituellement volumineuse, le fichier restait indéfiniment à sa taille maximale, parfois plus gros que la base elle-même. Il est désormais plafonné partout, et l&rsquo;espace est rendu.</li>
    </ul>
- version: 3.22.0
  date: '2026-07-05'
  tags:
  - type: enhancement
    label: Récupérez un jeu directement depuis sa fenêtre contextuelle, sans détour
  body: |
    <ul>
      <li><strong>Récupérez depuis la fenêtre contextuelle du jeu.</strong> La
        fenêtre contextuelle rapide du jeu (celle qui apparaît lorsque vous cliquez
        sur un jeu dans votre Bibliothèque) comporte désormais un bouton
        <strong>Récupérer</strong> à côté de Remplissage IA et Modifier. Cliquez
        dessus et RetroDB vous amène directement à ce jeu avec la recherche de
        métadonnées déjà ouverte &mdash; fini d&rsquo;ouvrir la page complète et de
        chercher d&rsquo;abord le bouton Récupérer.</li>
    </ul>
- version: 3.21.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Lancement en un clic — démarrez RetroDB depuis une icône épinglée, sans terminal
  - type: feature
    label: Une vraie icône d&rsquo;application — une manette néon dans votre onglet et votre barre des tâches
  - type: feature
    label: Nouveau bouton Arrêter le serveur sur la page Paramètres
  body: |
    <ul>
      <li><strong>Lancez en un clic.</strong> RetroDB dispose désormais d&rsquo;un
        vrai lanceur que vous pouvez épingler à votre barre des tâches &mdash;
        cliquez dessus et l&rsquo;application démarre (si elle n&rsquo;est pas
        déjà en cours) et s&rsquo;ouvre automatiquement dans votre navigateur.
        Fini d&rsquo;ouvrir un terminal et de taper une commande. Sous Linux,
        exécutez une seule fois <code>python3 scripts/install_launcher.py</code>
        pour ajouter &ldquo;RetroDB&rdquo; à votre menu d&rsquo;applications, puis
        épinglez-le.</li>
      <li><strong>Une vraie icône d&rsquo;application.</strong> RetroDB arbore
        désormais une icône de manette néon &mdash; cyan et magenta cyberpunk sur
        une tuile sombre &mdash; dans votre onglet de navigateur (le favicon), sur
        le lanceur de la barre des tâches et sur le programme Windows lui-même.
        Elle remplace le simple emoji provisoire.</li>
      <li><strong>Bouton Arrêter le serveur.</strong> Les Contrôles du serveur de
        la page Paramètres comportent désormais un bouton rouge
        <strong>Arrêter le serveur</strong> à côté de Redémarrer. Il arrête
        proprement l&rsquo;application (en laissant d&rsquo;abord les tâches en
        cours terminer leur enregistrement), de sorte que vous n&rsquo;avez plus
        besoin de passer au terminal et d&rsquo;appuyer sur Ctrl+C.</li>
      <li><strong>Les versions téléchargeables ouvrent le navigateur pour
        vous.</strong> Les téléchargements prêts à l&rsquo;emploi pour Windows,
        Mac et Linux ouvrent désormais votre navigateur un instant après le
        démarrage, pour que l&rsquo;application soit devant vous sans aucune étape
        supplémentaire.</li>
    </ul>
- version: 3.20.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Onze nouvelles langues — RetroDB parle désormais 21 langues
  body: |
    <ul>
      <li><strong>Onze nouveaux packs de langue.</strong> L&rsquo;interface de
        RetroDB, les notes de version et le manuel d&rsquo;aide sont désormais
        traduits en Afrikaans, isiZulu, isiXhosa, Dutch, Norwegian
        (Bokm&aring;l), Russian, Polish, Turkish, Ukrainian, Indonesian et
        Hebrew &mdash; rejoignant les langues déjà prises en charge : German,
        Spanish, French, Italian, Japanese, Korean, Portuguese brésilien,
        ainsi que le Chinese simplifié et traditionnel. Choisissez la vôtre
        dans Paramètres &rarr; Préférences d&rsquo;affichage &rarr; Langue ;
        l&rsquo;application se recharge dans la langue choisie.</li>
      <li>Chaque langue couvre l&rsquo;application entière : chaque bouton,
        étiquette et message, tout l&rsquo;historique des notes de version, et
        le guide d&rsquo;aide complet.</li>
      <li><strong>isiZulu &amp; isiXhosa</strong> sont également inclus. Ces
        langues disposant de peu de vocabulaire informatique existant, elles
        conservent les termes techniques courants (ROM, scraper, box art) en
        anglais lorsqu&rsquo;il n&rsquo;existe pas de mot naturel &mdash; une
        relecture par un locuteur natif est bienvenue avant de s&rsquo;y fier
        pleinement.</li>
      <li><strong>Hebrew</strong> est livré avec un texte entièrement
        traduit ; une mise en page droite-à-gauche soignée (pour que
        l&rsquo;interface se reflète correctement) arrivera dans une
        prochaine mise à jour. Arabic suivra une fois ce travail de mise en
        page terminé.</li>
    </ul>
- version: 3.19.1
  date: '2026-07-05'
  tags:
  - type: performance
    label: Scraping plus rapide — les captures d'écran d'un jeu se téléchargent désormais en même temps
  body: |
    <ul>
      <li><strong>Les captures d&rsquo;écran se téléchargent en parallèle.</strong>
        En suivant la même approche que le populaire frontend ES-DE (qui récupère
        tous les médias d&rsquo;un jeu d&rsquo;un coup), RetroDB télécharge
        désormais les captures d&rsquo;écran d&rsquo;un jeu
        <strong>simultanément</strong> au lieu de l&rsquo;une après l&rsquo;autre,
        pour toutes les sources (TheGamesDB, IGDB, RAWG, ScreenScraper). Les jeux
        comptant plusieurs captures d&rsquo;écran se terminent nettement plus
        vite.</li>
      <li>La vérification des captures en double s&rsquo;exécute toujours ensuite
        dans l&rsquo;ordre, de sorte que la suppression des images en double reste
        exactement aussi précise qu&rsquo;avant &mdash; seul le téléchargement a
        été accéléré. Les téléchargements sont limités à quatre à la fois pour ne
        jamais surcharger une source.</li>
      <li>Amélioration de vitesse en coulisses ; prend effet après le prochain
        redémarrage.</li>
    </ul>
- version: 3.19.0
  date: '2026-07-05'
  tags:
  - type: performance
    label: Scraping plus rapide — les sources sont désormais interrogées en même temps
  body: |
    <ul>
      <li><strong>Le scraping est plus rapide pour chaque jeu.</strong> Lorsque
        RetroDB recherche un jeu, il consulte plusieurs bases de données (ES-DE,
        TheGamesDB, IGDB, RAWG, ScreenScraper). Auparavant, il les interrogeait
        <em>une par une</em> et attendait la réponse de chacune avant de passer à
        la suivante &mdash; l&rsquo;attente correspondait donc à la somme de toutes.
        Désormais, il les interroge toutes <strong>en même temps</strong> et
        n&rsquo;attend que la plus lente, ce qui représente une accélération
        notable sur chaque jeu. Les résultats sont toujours classés et notés
        exactement comme avant.</li>
      <li><strong>Moins de connexions inutiles lors du téléchargement des
        images.</strong> Les téléchargements d&rsquo;images réutilisent désormais
        une connexion déjà ouverte au lieu d&rsquo;en ouvrir une nouvelle pour
        chaque image, ce qui fait gagner du temps sur les jeux comportant
        beaucoup de captures d&rsquo;écran.</li>
      <li>Ce sont des améliorations de vitesse en coulisses &mdash; rien ne change
        dans votre façon d&rsquo;utiliser RetroDB, et cela ne sollicite pas
        davantage les bases de données (mêmes requêtes, simplement effectuées en
        parallèle). Prennent effet après le prochain redémarrage.</li>
    </ul>
- version: 3.18.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Ajout des classifications par âge chinoises (Chine) comme 9e système de classification
  body: |
    <ul>
      <li><strong>Nouveau système de classification par âge : Chine (CADPA).</strong>
        RetroDB prend désormais en charge le dispositif officiel chinois de
        recommandation d&rsquo;âge pour les jeux (&ldquo;网络游戏适龄提示&rdquo;,
        émis par CADPA) aux côtés des huit organismes existants (ESRB, PEGI, CERO,
        USK, ACB, FPB, GRAC et ClassInd). Il utilise trois niveaux &mdash;
        <strong>8+</strong>, <strong>12+</strong> et <strong>16+</strong> &mdash;
        affichés avec un simple badge vert.</li>
      <li><strong>Il se remplit tout seul, comme les autres.</strong> Lorsqu&rsquo;un
        jeu possède déjà une classification d&rsquo;un autre pays, RetroDB détermine
        automatiquement le niveau chinois correspondant (et inversement). Vous
        pouvez aussi le choisir ou le modifier à la main dans l&rsquo;écran
        d&rsquo;édition d&rsquo;un jeu, et le sélectionner comme système
        d&rsquo;affichage préféré sous Paramètres &rarr; Bibliothèque. Remarque :
        la plupart des bases de données de jeux occidentales ne publient pas de
        classification chinoise, donc pour les jeux sans aucune classification,
        elle est déduite du contenu du jeu lors du scraping / de l&rsquo;AI Fill.</li>
      <li>Les badges verts sont une illustration simple propre à RetroDB
        (conforme au style maison des autres organismes), et non le logo officiel
        de CADPA, afin qu&rsquo;aucune contrainte de licence d&rsquo;image ne
        s&rsquo;applique.</li>
    </ul>
- version: 3.17.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Effacer les entrées de la base de données pour les fichiers médias absents du disque
  - type: security
    label: Protection contre l'effacement de toutes les illustrations de votre bibliothèque lorsqu'un dossier de médias disparaît
  body: |
    <ul>
      <li><strong>Nouvel outil de maintenance : &ldquo;Références de médias manquantes&rdquo;</strong>
        (Paramètres &rarr; Système &rarr; Maintenance). C&rsquo;est l&rsquo;image
        inversée du nettoyage existant &ldquo;Médias orphelins&rdquo; : au lieu de
        repérer des fichiers images restants sans jeu, il repère les jeux dont la
        jaquette, la jaquette 3D, les captures d&rsquo;écran, les fan-arts, la
        vidéo ou le manuel pointent vers des fichiers qui ne sont plus sur le
        disque. Recherchez-les, puis effacez ces références obsolètes en un clic
        afin que les scrapers puissent retélécharger les illustrations. Les fiches
        de vos jeux elles-mêmes ne sont jamais modifiées.</li>
      <li><strong>Un nettoyage automatique plus sûr pendant le scraping.</strong>
        Lorsque RetroDB rescanne un jeu, il efface discrètement les références aux
        fichiers médias qui ont disparu du disque. Auparavant, si tout un dossier
        de médias disparaissait d&rsquo;un coup &mdash; un disque externe démonté
        ou une suppression en masse &mdash; ce nettoyage pouvait effacer la trace
        des illustrations que possédaient des milliers de jeux, imposant des
        rescans coûteux. RetroDB reconnaît désormais ce signal : si un dossier de
        médias est manquant ou totalement vide, il conserve les références et
        consigne un avertissement au lieu de les effacer. Le nouvel outil de
        maintenance applique la même protection et signale clairement tout dossier
        qu&rsquo;il a préservé.</li>
    </ul>
- version: 3.16.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Nouveau panneau "Corrections rapides" sur le tableau de bord
  body: |
    <ul>
      <li><strong>Un nouveau panneau &ldquo;Corrections rapides&rdquo; sur le
        tableau de bord</strong> transforme les tâches éparses de votre
        bibliothèque en une liste de choses à faire d&rsquo;un coup d&rsquo;œil. Il
        indique combien de jeux n&rsquo;ont toujours pas de jaquette et propose des
        raccourcis en un clic pour trouver les ROMs en double et pour vérifier les
        chemins de ROM cassés (jeux dont les fichiers ont été déplacés ou
        supprimés). Chaque raccourci mène directement à la page qui permet de le
        corriger. Le panneau apparaît dès que votre bibliothèque contient des
        jeux.</li>
    </ul>
- version: 3.15.0
  date: '2026-07-03'
  tags:
  - type: accessibility
    label: Les lecteurs d'écran annoncent désormais la progression des tâches
  body: |
    <ul>
      <li><strong>Les tâches longues annoncent désormais leur progression aux
        lecteurs d'écran.</strong> Pendant un scraping en masse, une
        synchronisation de succès (RetroAchievements ou PlayStation) ou un
        redimensionnement d'images, les utilisateurs de lecteurs d'écran
        n'entendaient rien entre &laquo;&nbsp;démarré&nbsp;&raquo; et
        &laquo;&nbsp;terminé&nbsp;&raquo;. RetroDB annonce maintenant des étapes
        régulières (par exemple &laquo;&nbsp;12 sur 40&nbsp;&raquo;) ainsi que la
        fin &mdash; sans fenêtre supplémentaire. Les annonces sont espacées pour
        informer sans bavarder, et elles suivent la langue que vous avez
        choisie.</li>
    </ul>
- version: 3.14.0
  date: '2026-07-01'
  tags:
  - type: feature
    label: Nouvelles langues — le chinois (simplifié et traditionnel) désormais disponible
  body: "<ul>\n  <li><strong>RetroDB est désormais disponible en chinois.</strong> Deux choix se\n    trouvent sous <strong>Paramètres &rarr; Système &rarr; Langue</strong> :\n    <strong>中文 (简体)</strong> (simplifié, pour la Chine continentale) et\n    <strong>中文 (繁體)</strong> (traditionnel, pour Hong Kong et Taïwan). Toute\n    l'interface &mdash; menus, boutons, messages et le manuel d'aide intégré\n    &mdash; est traduite, et tout ce qui n'est pas encore traduit revient\n    discrètement à l'anglais. Le nombre de langues prises en charge passe ainsi\n    à dix (anglais, allemand, espagnol, français, italien, japonais, portugais\n    brésilien, coréen et maintenant chinois simplifié &amp; traditionnel).</li>\n</ul>\n"
- version: 3.12.0
  date: '2026-06-30'
  tags:
  - type: feature
    label: Nouvelle langue — le coréen (한국어) est désormais disponible
  body: |
    <ul>
      <li><strong>RetroDB est désormais disponible en coréen (한국어).</strong>
        Sélectionnez-le dans Paramètres &rarr; Système &rarr; Langue. Toute
        l&rsquo;interface &mdash; menus, boutons, messages et le manuel
        d&rsquo;aide intégré &mdash; est traduite, portant à huit le nombre de
        langues prises en charge (anglais, allemand, espagnol, français,
        italien, japonais, portugais brésilien et coréen). Le coréen complète
        la couverture de tous les organismes de classification par âge affichés
        par RetroDB, y compris le GRAC sud-coréen.</li>
    </ul>
- version: 3.11.0
  date: '2026-06-30'
  tags:
  - type: enhancement
    label: Soutenez RetroDB sur Patreon — nouveau lien de don ajouté
  body: |
    <ul>
      <li><strong>Vous pouvez désormais soutenir RetroDB sur Patreon.</strong>
        Un lien Patreon se trouve à côté du bouton « Parrainer sur GitHub »
        existant dans <strong>Paramètres &rarr; Système &rarr; Soutenir le
        développement</strong>, dans le panneau À propos et dans le fichier
        README du projet. RetroDB reste entièrement gratuit et open source
        &mdash; les dons sont totalement facultatifs et aident simplement à
        poursuivre le développement en solo.</li>
    </ul>
- version: 3.10.0
  date: '2026-06-26'
  tags:
  - type: enhancement
    label: Le journal des modifications se charge plus vite grâce à un bouton « Charger plus »
  body: "<ul>\n  <li><strong>La page du journal des modifications s'ouvre désormais beaucoup plus\n    vite.</strong> Au lieu d'afficher tout l'historique des versions (des centaines\n    d'entrées) à chaque ouverture, RetroDB affiche maintenant les 20 entrées les plus\n    récentes et ajoute un bouton <strong>Charger plus</strong> en bas. Cliquez dessus\n    pour révéler le lot suivant, et ainsi de suite &mdash; l'historique plus ancien\n    est toujours là, il se charge simplement à la demande au lieu de ralentir le\n    premier affichage.</li>\n</ul>\n"
- version: 3.9.0
  date: '2026-06-17'
  tags:
  - type: feature
    label: Le manuel d'aide et les notes de version récentes sont désormais traduits dans les 6 langues
  body: "<ul>\n  <li><strong>Le manuel d'aide intégré complet est désormais disponible dans les six\n\
    \    langues</strong> &mdash; allemand, français, espagnol, italien, japonais\n    et portugais brésilien\
    \ &mdash; et plus seulement en anglais. RetroDB affiche le\n    manuel dans la langue que vous avez\
    \ choisie dans les Paramètres, et revient\n    discrètement à l'anglais si un élément n'est pas encore\
    \ traduit.</li>\n  <li><strong>Ce journal des modifications apparaît lui aussi dans votre langue</strong>\
    \ pour les\n    versions les plus récentes, et les nouvelles versions seront traduites à partir de\
    \ maintenant.\n    L'historique plus ancien reste en anglais.</li>\n  <li><strong>La page Liste de\
    \ souhaits et les derniers vestiges de texte anglais</strong>\n    &mdash; un lot de messages d'erreur\
    \ et de statut sous forme de pop-up qui avaient été oubliés\n    lors de l'arrivée des packs de langue\
    \ dans la 3.8.0 &mdash; se traduisent désormais\n    correctement dans toute l'application.</li>\n\
    </ul>\n"
- version: 3.8.2
  date: '2026-06-17'
  tags:
  - type: security
    label: Mise à jour de dépendance de sécurité + corrections CI
  body: "<ul>\n  <li><strong>Sécurité :</strong> mise à jour de la bibliothèque <code>cryptography</code>\
    \ intégrée\n    (47 → 49) afin de corriger un avis de sécurité publié (GHSA-537c-gmf6-5ccf).\n   \
    \ Aucun changement de comportement — simplement une version plus sûre.</li>\n  <li>Correction du pipeline\
    \ de tests automatisés : un utilitaire réservé aux tests qui manquait\n    (<code>beautifulsoup4</code>)\
    \ faisait échouer l'exécution des tests depuis la v3.7.0,\n    et le nouveau script de génération\
    \ de package déclenchait une vérification d'analyse statique qui est\n    un faux positif connu (il\
    \ exécute des commandes de génération de confiance, pas des entrées utilisateur)\n    — désormais\
    \ documenté et calibré. Maintenance uniquement ; rien ne change dans\n    l'application elle-même.</li>\n\
    </ul>\n"
- version: 3.8.1
  date: '2026-06-17'
  tags:
  - type: improvement
    label: Option de téléchargement plus légère, nettoyage des dons et correction de traduction (Pass
      46.3 / 47.6)
  body: "<ul>\n  <li><strong>Un téléchargement bien plus léger arrive.</strong> La\n    version « il suffit\
    \ de décompresser et de double-cliquer » prête à l'emploi de RetroDB peut désormais être\n    générée\
    \ dans une variante <strong>CPU uniquement</strong> (~600&nbsp;Mo) destinée aux personnes qui\n  \
    \  ne disposent pas de carte graphique AMD &mdash; soit environ un sixième de la taille de la version\n\
    \    complète. Les deux seront proposées côte à côte afin que vous puissiez choisir celle qui\n  \
    \  convient à votre machine.</li>\n  <li><strong>Le panneau « Soutenir le développement » dans les\
    \ Paramètres se traduit désormais</strong>\n    avec le reste de l'application &mdash; il était resté\
    \ par accident en\n    anglais lors de l'arrivée des packs de langue dans la 3.8.0.</li>\n  <li>Nettoyage\
    \ des liens de dons (badge GitHub Sponsors dans le README ;\n    le fichier de financement est prêt\
    \ pour Patreon et Buy&nbsp;Me&nbsp;A&nbsp;Coffee dès que\n    ceux-ci seront configurés). Jamais de\
    \ fenêtres insistantes.</li>\n  <li>En coulisses : le pipeline de publication peut désormais générer\
    \ automatiquement les\n    versions prêtes à l'emploi pour Windows, macOS et Linux. Remarque : le\
    \ long\n    manuel d'<em>Aide</em> intégré reste pour l'instant uniquement en anglais &mdash; c'est\n\
    \    consigné comme un travail à venir.</li>\n</ul>\n"
- version: 3.8.0
  date: '2026-06-12'
  tags:
  - type: feature
    label: Traduction complète de l'interface + 6 langues (Pass 43.2/43.3/43.5)
  body: "<ul>\n  <li><strong>RetroDB parle désormais 6 langues de plus.</strong> En s'appuyant sur les\n\
    \    fondations de la 3.7.0, toute l'interface a été rendue traduisible et\n    traduite automatiquement\
    \ en <strong>allemand, français, espagnol, italien,\n    japonais et portugais brésilien</strong>.\
    \ Choisissez votre langue dans\n    Paramètres &rarr; Préférences d'affichage &rarr; Langue ; elle\
    \ suit votre\n    préférence enregistrée, puis votre navigateur, puis revient à l'anglais &mdash;\
    \ elle ne peut\n    jamais rester bloquée sur une langue manquante.</li>\n  <li><strong>Tout ce qui\
    \ s'affiche à l'écran est couvert</strong> : le texte des pages et les boutons,\n    les messages\
    \ pop-up (les petites notifications « toast »), les boîtes de dialogue d'édition\n    et de paramètres,\
    \ les info-bulles et les libellés pour lecteurs d'écran. Les genres de jeux,\n    les perspectives\
    \ et les modes de jeu (par ex. « First-Person-Shooter ») s'affichent\n    désormais dans votre langue\
    \ également &mdash; tandis que les données sous-jacentes restent en\n    anglais, de sorte que votre\
    \ bibliothèque et vos filtres continuent de fonctionner exactement comme avant.</li>\n  <li>Une <strong>langue\
    \ « Pseudo »</strong> intégrée (visible dans le\n    menu Langue) est un outil de contrôle qualité\
    \ pour traducteurs qui encadre et accentue chaque\n    libellé, rendant instantanément évident tout\
    \ texte qui aurait été oublié.</li>\n  <li>Les traductions automatiques sont un point de départ et\
    \ peuvent sembler un peu rigides par\n    endroits &mdash; elles sont faciles à affiner au fil du\
    \ temps, et tout texte sans\n    traduction s'affiche simplement en anglais.</li>\n</ul>\n"
