- version: 4.0.0
  date: '2026-11-10'
  tags:
  - type: fix
    label: 'Les filtres de la Bibliothèque comparent désormais des valeurs entières. Choisir le genre « Action » n''affiche plus aussi les jeux « Action-Aventure », donc le résultat correspond au nombre affiché à côté. Les listes d''étiquettes de la page d''un jeu et Jeux similaires fonctionnent de la même façon'
  - type: security
    label: 'Paramètres → Mon profil n''envoie plus à la page votre clé RetroAchievements, votre jeton PSN ou votre clé Steam enregistrés. Chaque champ n''affiche que ses quatre derniers caractères, comme le faisaient déjà les clés de l''onglet Récupération. Enregistrer sans retaper conserve la clé enregistrée, et le bouton PSN « Enregistrer & Tester la connexion » teste le jeton enregistré'
  - type: fix
    label: 'La Visionneuse de journaux ne s''ouvre plus sur « Fichier journal invalide ». Elle listait des journaux auxiliaires qu''elle n''affichait pas, et ouvrait l''un d''eux en premier ; elle ne liste plus que les journaux qu''elle peut ouvrir'
  - type: fix
    label: 'L''onglet PSN des Imports de jeux vous envoie désormais vers Paramètres → Mon profil pour le jeton NPSSO, là où se trouve le champ, au lieu de Paramètres → Clés API, et son état de connexion peut être traduit'
  - type: fix
    label: 'Connecté en tant que spectateur, les pages ne demandent plus au serveur des informations réservées aux administrateurs qu''elles ne peuvent pas obtenir : le journal du serveur ne se remplit donc plus de requêtes refusées'
  - type: security
    label: 'Les noms venus de l''extérieur de RetroDB (données récupérées, noms de fichiers et de dossiers, réponses des services en ligne) s''affichent désormais toujours en texte brut : sur la page du jeu, dans les Paramètres, les Rapports, les outils ROM, les pages de trophées et ailleurs. Les pages n''exécutent plus que les actions de leurs propres boutons : un nom piégé ne peut donc pas faire agir une page, et le lien « retour à » d''une notification de progression ne peut plus mener vers un autre site'
  - type: enhancement
    label: 'Les récupérations en masse en file d''attente ont un bouton Réordonner. Il ouvre le Gestionnaire de file d''attente, où une récupération en attente peut passer plus tôt, plus tard, ou échanger sa place avec celle en cours. Chaque notification en file garde aussi son numéro de position après un changement'
  - type: fix
    label: 'La progression des tâches ne reste plus bloquée et ne se répète plus. Une vérification ou une conversion CHD qui plante se termine désormais avec sa raison ; Annuler rend ses boutons à la page ; une annulation, une pause ou une suppression refusée le signale ; « terminé » ne réapparaît plus une heure plus tard ; et le bouton Synchroniser de la page des succès revient à la fin de sa synchronisation'
  - type: fix
    label: 'Enregistrer une correspondance HowLongToBeat sur la page du jeu n''efface plus son lien HLTB ni son nombre de joueurs, et un enregistrement échoué peut être relancé. La Modification rapide n''affiche plus chaque correspondance enregistrée comme « 100 % de correspondance ». Les étiquettes de filtre de la Bibliothèque affichent le nom d''un système au lieu de son numéro, et la recherche pendant la saisie fonctionne sur les pages de liste et dans Comparer'
  - type: fix
    label: 'Chaque compte peut changer son propre mot de passe dans Paramètres → Mon profil, et un administrateur peut réinitialiser celui de n''importe qui. Les dossiers d''émulateurs fonctionnent désormais sous Windows. Le Tableau de bord n''indique plus aux éditeurs et aux lecteurs que leurs API sont hors ligne, et « Jeux sans jaquette » ouvre la Bibliothèque en ne montrant que ces jeux. Un gestionnaire de mots de passe peut désormais remplir la case de connexion'
  - type: fix
    label: 'Outils ROM : Vérification CHD place chaque badge Valide ou Invalide sur le bon fichier ; la visionneuse de journaux affiche de nouveau les noms de modules et signale quand sa liste de fichiers échoue ; Tout sélectionner dans Imports de jeux n''importe que les jeux affichés par votre filtre ; et Réinitialiser dans Paramètres des outils ROM rétablit le dossier ROM propre à cet ordinateur'
  - type: fix
    label: 'Les heures de déblocage Steam s''affichent comme des dates ; la barre A-Z fonctionne dans Trophées locaux ; le mode Sélection PSN continue de fonctionner sur les jeux chargés pendant le défilement ; les lecteurs ne voient plus les boutons Synchroniser ou Renommer qu''ils ne peuvent pas utiliser ; un renommage par lot ignore un fichier renommé depuis l''analyse ; et Analyses peut copier sur un réseau en HTTP simple et exporte les nombres comme des nombres'
  - type: fix
    label: 'Dans une fenêtre de confirmation, Entrée sur Annuler ou × annule désormais au lieu de confirmer. Une fenêtre ouverte par OK ne disparaît plus, et Tab fonctionne toujours après la fermeture de la liste des raccourcis ou d''une fenêtre de progression'
  - type: enhancement
    label: 'De nombreuses commandes qui ne marchaient qu''à la souris fonctionnent désormais au clavier (Tab, puis Entrée ou Espace) : les profils de connexion, les résultats de recherche de Comparer, les étiquettes et leurs boutons Modifier et Supprimer, les cartes de jeux des succès, les sessions de journal, le choix du thème et de l''avatar, les images du Musée, le × qui retire un genre ou un filtre, les dossiers de configuration, les cases des sources de scraping et l''import CLZ. Les interrupteurs affichent maintenant l''anneau du clavier'
  - type: performance
    label: 'L''outil de suppression d''arrière-plan du Musée ne reste plus en mémoire. Il détourait les photos de manettes avec un modèle d''AI qui occupait plus de 2 GB après sa première utilisation, et jusqu''à environ 9 GB pendant une photo, jusqu''au redémarrage de RetroDB. Il tourne désormais dans un programme d''aide qui démarre quand il le faut et se ferme deux minutes après sa dernière photo, ce qui libère toute cette mémoire'
    en: 'The Museum''s background remover no longer stays in memory. It cut controller photos out of their background with an AI model that took over 2 GB once used, and up to about 9 GB during a photo, until RetroDB restarted. It now runs in a helper that starts when needed and closes two minutes after its last photo, giving all of that memory back'
  - type: feature
    label: 'L''import Xbox n''a plus besoin d''un compte Microsoft Azure. Chaque personne colle désormais sa propre clé OpenXBL gratuite (obtenue sur xbl.io) dans Paramètres → Mon profil, et cela fonctionne depuis n''importe quel ordinateur de votre réseau. L''import laisse aussi de côté les applications et les jeux réservés aux téléphones, range les jeux PC sous Windows au lieu de Xbox One, lit correctement les succès Xbox 360 et n''affiche aucune date pour un succès verrouillé. La clé gratuite autorise 150 requêtes par heure : une grosse synchronisation des succès qui atteint cette limite s''arrête, le signale, et la fois suivante commence par les jeux qu''elle n''avait pas encore atteints'
    en: 'Xbox import no longer needs a Microsoft Azure account. Each person now pastes their own free OpenXBL key (from xbl.io) under Settings → My Profile, and it works from any computer on your network. The import also leaves out apps and phone-only games, files PC games under Windows instead of Xbox One, reads Xbox 360 achievements the right way, and shows no date for a locked achievement. The free key allows 150 requests an hour: a big achievement sync that reaches it stops, says so, and next time starts with the games it had not reached'
  - type: enhancement
    label: Une synchronisation (Sync) ou un rafraîchissement (Refresh) RetroAchievements demandé pendant qu'un autre est en cours attend désormais sur le serveur et démarre tout seul à la fin du précédent, même si vous fermez la page ou l'avez lancé depuis un autre appareil. Chaque page affiche la même file d'attente avec la position de chaque tâche, et ✕ retire une tâche. Après un redémarrage du serveur, les tâches en attente vous sont reproposées sur le Tableau de bord
    en: A RetroAchievements Sync or Refresh you ask for while another one runs now waits on the server and starts by itself when that one finishes, even if you close the page or asked from another device. Every page shows the same waiting list with each job's place in line, and ✕ takes a job out. After a server restart, waiting jobs are offered back on the Dashboard
  - type: fix
    label: Le bouton Refresh RA de la page d'une console fonctionne de nouveau. Il n'indiquait pas de quelle console il s'agissait, donc le serveur répondait « Introuvable »
    en: The Refresh RA button on a console's page works again. It did not say which console, so the server answered "Not found"
  - type: fix
    label: La vérification des noms de ROM traite désormais chaque système selon le type affiché sur la page Systèmes. Macintosh, ZX Spectrum Next, Coleco Adam et Thomson sont vérifiés comme des ordinateurs, et la 3DS et la PS Vita comme des portables, et non plus comme des consoles. Un type défini sur la page Systèmes est aussi pris en compte désormais
    en: The ROM naming check now treats each system as the kind the Systems page shows. Macintosh, ZX Spectrum Next, Coleco Adam and Thomson are checked as computers, and 3DS and PS Vita as handhelds, instead of as consoles. A type you set on the Systems page is now followed too
  - type: performance
    label: RetroDB utilise beaucoup moins de mémoire en veille. L'agrandisseur d'images par IA ne se charge plus que pendant l'agrandissement, dans un module d'assistance qui se ferme deux minutes après sa dernière image ; un serveur inactif est passé d'environ 1,4 Go à moins de 100 Mo. Si le pilote graphique plante pendant un agrandissement, seul le module d'assistance s'arrête, jamais le serveur
    en: RetroDB uses far less memory while it waits. The AI image upscaler now loads only while it is upscaling, in a helper that closes two minutes after its last picture; an idle server dropped from about 1.4 GB to under 100 MB. If the graphics driver crashes during an upscale, only the helper stops, never the server
  - type: performance
    label: Le Remplissage IA avec la recherche web de Claude coûte moins cher. Claude relit les résultats après chaque recherche ; RetroDB demande désormais à Anthropic de les garder à disposition, et une relecture coûte alors un dixième du prix, voire moins
    en: AI Fill with Claude web search costs less. Claude reads the search results again after each search; RetroDB now asks Anthropic to keep them ready, and a re-read then costs a tenth of the price or less
  - type: fix
    label: 'Le zoulou et le xhosa sont plus agréables à lire : 133 lignes qui disaient autre chose ont été corrigées, par exemple « Edition » affiché comme « Chapitre » et « doit être du texte » affiché comme « doit être une lettre ». Chaque correction a été validée par deux contrôles distincts réalisés par IA'
    en: 'Zulu and Xhosa read better: 133 lines that said the wrong thing are corrected, such as "Edition" shown as "Chapter" and "must be text" shown as "must be a letter". Each correction was agreed by two separate AI checks'
  - type: fix
    label: Quand un jeu ne démarre pas, le message est désormais dans votre langue et indique toujours l'émulateur, le cœur ou le fichier en cause. Une défaillance interne à l'ordinateur affiche désormais « Démarrage impossible » ainsi que le nom du programme, avec les détails dans le journal du serveur, au lieu d'un texte système brut. Lorsqu'une connexion à RetroAchievements est refusée, le motif donné par RetroAchievements s'affiche dans une phrase traduite
    en: When a game will not start, the message is now in your language and still names the emulator, core or file at fault. A failure inside the computer itself now says "Could not start" and the program's name, with the details in the server log, instead of raw system text. A refused RetroAchievements sign-in shows RetroAchievements' own reason inside a translated sentence
  - type: fix
    label: Annuler une tâche de récupération, de synchronisation ou d'images déjà terminée supprime désormais sa fenêtre de progression bloquée. Lancer une tâche déjà en cours affiche la vraie raison, par exemple « Une récupération pour SNES est déjà en cours », au lieu de « Erreur réseau ». Les erreurs d'images de manette dans le Musée disent maintenant ce qui s'est passé, et annuler la synchronisation RetroAchievements d'un autre utilisateur indique qu'elle lui appartient au lieu de faire semblant de l'annuler
    en: Cancelling a scrape, sync or image job that has already finished now clears its stuck progress popup. Starting a job that is already running shows the real reason, such as "A scrape for SNES is already running", instead of "Network error". Controller image errors in the Museum now say what went wrong, and cancelling another user's RetroAchievements sync says it is theirs instead of pretending to cancel it
  - type: security
    label: Le visualiseur de journaux masque désormais les mots de passe et les clés aussi dans les anciens fichiers de journal. Les journaux écrits avant que RetroDB sache masquer un mot de passe donné, comme celui de ScreenScraper, l'affichaient en clair lors de la consultation ou du téléchargement
    en: The log viewer now hides passwords and keys in older log files too. Logs written before RetroDB learned to hide a particular password, such as ScreenScraper's, showed it in plain text when viewed or downloaded
  - type: security
    label: Réinitialiser tous les paramètres aux valeurs par défaut conserve maintenant votre dossier de ROM et le fait que la configuration est terminée. Avant, une réinitialisation rouvrait les pages de première configuration, accessibles sans connexion, jusqu'à ce qu'un administrateur relance la configuration
    en: Resetting all settings to their defaults now keeps your ROM folder and the fact that setup is done. Before, a reset reopened the first-time setup pages, which work without signing in, until an admin ran setup again
  - type: feature
    label: Les jeux d'arcade peuvent de nouveau obtenir des succès RetroAchievements. RetroDB ne lie un jeu d'arcade que si RetroAchievements connaît son nom de fichier exact, comme sf2 pour Street Fighter II, et ne devine donc plus d'après les titres au risque de lier le mauvais jeu. Vos jeux d'arcade seront liés lors de la prochaine actualisation de leurs données RetroAchievements ou de leur récupération
    en: Arcade games can earn RetroAchievements again. RetroDB now links an arcade game only when RetroAchievements knows its exact file name, such as sf2 for Street Fighter II, so it no longer guesses from titles and links the wrong game. Your arcade games link the next time their RetroAchievements data is refreshed or they are scraped
  - type: fix
    label: La synchronisation des trophées PlayStation corrige maintenant les liens de jeux faits à tort auparavant, comme de nombreux jeux liés à un jeu sans rapport appelé « D ». Un lien que vous avez défini vous-même n'est jamais modifié par une synchronisation. La prochaine synchronisation revérifie tous les anciens liens, donc quelques correspondances approximatives peuvent être déliées ; liez-les à nouveau à la main
    en: PlayStation trophy sync now corrects game links it made wrongly before, such as many games linked to an unrelated game called "D". A link you set yourself is never changed by a sync. The next sync checks all older links again, so a few near matches may come unlinked; link those again by hand
  - type: fix
    label: Placer une récupération groupée en attente avant une récupération en cours n'ajoute plus le dernier jeu de l'ancienne récupération aux totaux de la nouvelle. Cliquer sur « Tout récupérer » dans la liste de souhaits alors qu'une récupération est déjà en cours l'indique, au lieu de prétendre qu'elle a démarré
    en: Moving a waiting bulk scrape ahead of a running one no longer adds the old scrape's last game to the new one's counts. Clicking "Scrape all" on the wishlist while one is already running now says so, instead of claiming it started
  - type: accessibility
    label: 'Avec un lecteur d''écran, le bouton « en cours » n''annonce « 1 jeu en cours » que lorsque le nombre change, au lieu de lire un simple chiffre toutes les quelques secondes. Sa liste s''ouvre comme une fenêtre nommée avec le curseur à l''intérieur, ses boutons Arrêter de force et Disque suivant indiquent le jeu concerné, et après Arrêter de force le curseur revient à un endroit logique. Chaque carte de jeu de la Bibliothèque s''ouvre maintenant au clavier depuis son titre, et ses boutons de filtre indiquent ce qu''ils filtrent, par exemple « Filtrer par Développeur : Konami »'
    en: 'With a screen reader, the "running" button now says "1 game running" only when the count changes, instead of reading a bare number every few seconds. Its list opens as a named window with the cursor inside, its Kill and Next disk buttons say which game they act on, and after Kill the cursor returns to a sensible place. Each game card in the library now opens with the keyboard from its title, and its filter buttons say what they filter, such as "Filter by Developer: Konami"'
  - type: feature
    label: Chaque membre peut désormais ajouter sa propre clé Steam et son propre identifiant Steam dans Paramètres → Mon profil, et importer sa propre bibliothèque Steam et ses succès. Jusqu'ici, seul un administrateur pouvait le faire
    en: Every member can now add their own Steam key and Steam ID under Settings → My Profile, and import their own Steam library and achievements. Until now only an admin could
  - type: fix
    label: Enregistrer les détails d'un jeu ne met plus un nombre de joueurs vide à 1, et ne marque plus comme saisies par vous les classifications d'âge que RetroDB a déterminées. Le Remplissage IA conserve un jeu que vous avez marqué Exclusif, ainsi que toute modification faite à un jeu pendant l'attente de la réponse de l'IA. L'historique d'une récupération ne liste plus que les détails réellement enregistrés
    en: Saving a game's details no longer sets an empty player count to 1, and no longer marks the age ratings RetroDB worked out for you as typed by you. AI Fill keeps a game you marked Exclusive, and keeps any change you make to a game while it is waiting for the AI's answer. A scrape's history now lists only the details it actually saved
  - type: fix
    label: La revue des captures d'écran ne s'arrête plus à mi-chemin quand une capture stockée est beaucoup trop grande pour être ouverte ; elle la compte comme illisible et continue. Le sommaire de la page d'aide renvoie maintenant vers Émulateurs et Jouer, et les notes de développeur sur la connexion, les tâches en arrière-plan, la récupération, les images, les mises à jour et les réponses d'erreur décrivent maintenant ce que fait vraiment le programme
    en: Screenshot Review no longer stops halfway when one stored screenshot is far too large to open; it counts that picture as unreadable and carries on. The help page's contents list now links to Emulators and Playing, and the developer notes on sign-in, background jobs, scraping, pictures, updates and error replies now say what the program really does
  - type: fix
    label: Un éditeur qui lance une analyse des outils ROM peut maintenant la mettre en pause, la reprendre ou l'annuler ; les analyses des autres restent réservées à un administrateur. Les tags et les listes refusent un nom manquant ou une mauvaise couleur avec un message clair au lieu d'une page d'erreur, et renommer un jeu de la liste de souhaits avec le nom d'un autre déjà souhaité est refusé, comme pour son ajout. Effacer les données RA oublie aussi si votre copie rapporte des succès. Un trophée que RetroDB ne propose plus ne compte plus pour votre rang de collectionneur. Les chemins de ROM Windows correspondent maintenant aux jeux RetroAchievements par nom de fichier
    en: An editor who starts a ROM Tools scan can now pause, resume or cancel it; other people's scans stay an admin's to stop. Tags and lists refuse a missing name or a bad colour with a clear message instead of an error page, and renaming a wishlist game onto another one you already wish for is refused, as adding it is. Clear RA Data now also forgets whether your copy earns achievements. A trophy RetroDB no longer offers stops counting toward your collector rank. Windows ROM paths now match RetroAchievements games by file name
  - type: fix
    label: Corrections de maintenance. Une archive multi-disques dont la décompression échoue ne laisse plus un dossier à moitié créé qui bloque chaque nouvel essai. Calculer le stockage compte maintenant tous les fichiers d'un dossier de jeu PS3. Effacer les données récupérées ne supprime les images que si vous le demandez. Une analyse de la Bibliothèque qui rencontre un jeu qu'une autre analyse vient d'ajouter continue avec le reste des jeux de cette console
    en: Maintenance fixes. A multi-disc archive that fails to unpack no longer leaves a half-made folder behind that blocks every retry. Calculate Storage now counts every file inside a PS3 game folder. Clear Scraped Data deletes pictures only when you ask it to. A library scan that meets a game another scan has just added carries on with the rest of that console's games
  - type: fix
    label: La restauration d'une sauvegarde est plus sûre. Elle est maintenant écrite dans la base de données de la Bibliothèque comme la base l'attend, de sorte qu'une partie de RetroDB qui l'a ouverte voit les données restaurées au lieu de risquer des dégâts. Supprimer un jeu supprime aussi ses images de boîte ainsi que ses entrées d'images en attente et de paramètres d'émulateur, afin qu'un nouveau jeu ne puisse jamais en hériter. Deux paramètres enregistrés au même moment ne s'écrasent plus
    en: Restoring a backup is safer. It is now written into the library database the way the database itself expects, so a part of RetroDB that has it open sees the restored data instead of risking damage. Deleting a game now also deletes its box pictures and its waiting picture and emulator-setting entries, so a new game can never inherit them. Two settings saved at the same moment no longer lose one of them
  - type: fix
    label: Corrections d'images. Les GIF ne passent plus par l'agrandisseur pour être ensuite jetés. Le modèle de l'agrandisseur est vérifié avec son empreinte publiée, et un mauvais téléchargement est récupéré à nouveau au lieu de désactiver l'agrandissement pour de bon. Les logos et images avec des parties transparentes gardent leur transparence une fois agrandis. Convertir en WebP prend maintenant aussi en compte les dos de boîte et les logos, et ne refuse plus une grande bibliothèque faute d'un espace dont il n'a pas besoin. Deux faces d'un fichier de boîte peuvent partager une même image, et supprimer une boîte dont l'enregistrement est endommagé supprime ses images
    en: Picture fixes. GIFs are no longer run through the upscaler only to be thrown away. The upscaler model is checked against its published fingerprint, and a bad download is fetched again instead of turning upscaling off for good. Logos and pictures with see-through parts keep their transparency when enlarged. Convert to WebP now takes back covers and logos too, and no longer refuses a large library for want of room it does not need. Two faces of a box file can share one picture, and removing a box with a damaged record removes its pictures
  - type: fix
    label: Les imports depuis CLZ, Steam, Xbox et PlayStation ne traitent plus comme un même jeu tous les titres écrits uniquement en japonais ou dans une autre écriture non latine, et n'ajoutent plus de jeu sans identifiant. L'aperçu CLZ n'ajoute plus de consoles avant que vous confirmiez l'import, et un lecteur qui consulte une bibliothèque Steam, Xbox ou PlayStation n'en ajoute plus non plus. Un jeu Steam retiré de la boutique n'est signalé qu'une fois, pas à chaque synchronisation
    en: Imports from CLZ, Steam, Xbox and PlayStation no longer treat every title written only in Japanese or another non-Latin script as the same game, and no longer add a game with no id. The CLZ preview no longer adds consoles before you confirm the import, and a viewer looking at a Steam, Xbox or PlayStation library no longer adds them either. A Steam game removed from the store is asked about once, not on every sync
  - type: fix
    label: Les statistiques regroupent maintenant beaucoup plus de consoles sous leur fabricant au lieu de « Autre », et la liste Récemment récupérés du tableau de bord affiche un jeu récupéré à nouveau, pas seulement les jeux nouvellement ajoutés
    en: Analytics now groups many more consoles under their maker instead of "Other", and the dashboard's Recently Scraped list shows a game you scraped again, not only newly added games
  - type: fix
    label: Les images de manette que vous ajoutez dans le Musée sont conservées lors de la mise à jour de la version autonome. Quand un service en ligne se met en pause à sa limite, l'heure de la prochaine requête s'affiche dans votre fuseau horaire
    en: Controller pictures you add in the Museum are kept when the standalone version updates. When an online service pauses at its limit, the time it will be asked again is shown in your own time zone
  - type: fix
    label: Un disque bonus ne peut plus être lié à lui-même ni à un autre disque bonus, et la liaison automatique ne lie plus un disque à un autre qu'elle marque comme disque bonus dans la même exécution
    en: A bonus disc can no longer be linked to itself or to another bonus disc, and Auto-link no longer links a disc to one it marks as a bonus disc in the same run
  - type: fix
    label: Les pages Bibliothèque et console ne comptent plus les fichiers BIOS d'arcade comme des jeux, ni dans leurs totaux ni dans la barre de lettres. Les jeux similaires et la liste obtenue en cliquant sur un genre ou un éditeur sur la page d'un jeu n'affichent plus les versions régionales, disques bonus ou fichiers BIOS du jeu lui-même
    en: The Library and console pages no longer count arcade BIOS files as games, in their totals or the letter bar. Similar games, and the list you get by clicking a genre or publisher on a game's page, no longer show the game's own regional versions, bonus discs or BIOS files
  - type: fix
    label: Tout sélectionner l'indique maintenant quand une très grande liste est tronquée, au lieu de n'en sélectionner qu'une partie en silence
    en: Select all now says so when a very large list is cut short, instead of quietly selecting only part of it
  - type: fix
    label: Les cartes de la Bibliothèque se mettent à jour quand votre progression de succès ou de trophées change, et quand un jeu devient jouable ou ne l'est plus
    en: Library cards now update when your achievement or trophy progress changes, and when a game becomes playable or stops being playable
  - type: fix
    label: La modification groupée ne peut plus changer les mauvais jeux lorsqu'elle reçoit une mauvaise sélection, et une modification groupée qui échoue ne marque plus les jeux comme modifiés par vous
    en: Bulk edit can no longer change the wrong games when it is sent a bad selection, and a bulk edit that fails no longer marks the games as edited by you
  - type: fix
    label: Une correspondance HowLongToBeat qui ne convient qu'à 1 % n'est plus affichée comme une correspondance à 100 %, et une page qui ne se charge pas affiche la page d'erreur au lieu du texte d'erreur brut
    en: A HowLongToBeat match that is only a 1% fit is no longer shown as a 100% match, and a page that fails to load shows the error page instead of the raw error text
  - type: security
    label: Changer votre mot de passe, ou le voir réinitialisé par un administrateur, déconnecte ce compte de tous les autres appareils. À cause de cela, tout le monde doit se reconnecter une fois après cette mise à jour. La page de configuration du premier lancement bénéficie aussi de la même protection contre les autres sites web que toutes les autres pages
    en: Changing your password, or an admin resetting it, now signs that account out on every other device. Because of this, everyone signs in once more after this update. The first-run setup page also gets the same protection against other websites as every other page
  - type: fix
    label: Une image refusée comme avatar ne supprime plus l'avatar que vous aviez
    en: A picture that is refused as your avatar no longer deletes the avatar you had
  - type: fix
    label: Les récupérations ménagent davantage les services en ligne. Un service qui échoue sans cesse est ignoré un moment lors du comblement des manques, comme c'était déjà le cas dans les recherches, et les recherches de jeux ScreenScraper respectent aussi ses limites quotidiennes
    en: Scrapes are gentler on the online services. A service that keeps failing is skipped for a while when filling gaps, as it already was in searches, and ScreenScraper game lookups now respect its daily limits too
  - type: fix
    label: Une récupération n'échoue plus sur un jeu dont l'année de sortie est inconnue, comme « TBA », et un jeu listé pour des régions absentes de votre liste, comme « Brésil, Corée », garde sa région au lieu de prendre votre valeur par défaut
    en: A scrape no longer fails on a game whose release year is unknown, such as "TBA", and a game listed for regions outside your list, such as "Brazil, Korea", keeps its region instead of becoming your default
  - type: fix
    label: Les dossiers ES-DE écrits avec ~/ fonctionnent maintenant, et un très gros fichier ES-DE n'est plus copié. Les versions régionales suggérées ne réunissent jamais deux jeux que vous avez indiqués comme n'étant pas des versions l'un de l'autre
    en: ES-DE folders written as ~/ now work, and a very large ES-DE file is no longer copied. Suggested regional versions never put back together two games you said are not versions of each other
  - type: security
    label: RetroDB refuse quelques adresses de réseau privé de plus lors du téléchargement d'images depuis le web, et suit correctement la redirection d'une adresse web
    en: RetroDB refuses a few more private network addresses when fetching pictures from the web, and follows a web address's redirect correctly
  - type: fix
    label: Les derniers écrans encore en anglais suivent maintenant aussi votre langue, y compris l'assistant de configuration, les tags, les listes, Comparer les jeux, les paramètres des outils ROM, la file de récupération groupée, la liste des tâches interrompues du tableau de bord, les libellés des cartes de la Bibliothèque et de nombreux messages d'erreur
    en: The last screens still in English now follow your language too, including the setup wizard, Tags, Lists, Compare Games, ROM Tools settings, the bulk scrape queue, the dashboard's interrupted-jobs list, the library card labels and many error messages
  - type: security
    label: Un nom de système contenant du code web ne peut plus l'exécuter dans la fenêtre de la file de récupération groupée
    en: A system name holding web code can no longer run it in the bulk scrape queue window
  - type: accessibility
    label: Où que vous soyez sur une page, la position du clavier est maintenant marquée par un anneau épais dans la couleur de votre thème, sur chaque bouton, case et lien. Avant, beaucoup de contrôles n'affichaient qu'un trait léger, identique à celui du survol de la souris
    en: Wherever you are on a page, the keyboard's place is now marked with a bold ring in your theme's colour, on every button, box and link. Before, many controls showed only a faint line, the same as when the mouse passed over them
  - type: accessibility
    label: Les liens Genre, Série, Développeur et Éditeur des cartes de la Bibliothèque fonctionnent maintenant au clavier. Le bouton « en cours » des jeux lancés s'ouvre aussi au clavier, et Échap ou un clic ailleurs ferme sa liste
    en: The Genre, Series, Developer and Publisher links on library cards now work from the keyboard. The "running" button for games in play opens from the keyboard too, and Esc or a click elsewhere closes its list
  - type: accessibility
    label: Les lecteurs d'écran nomment maintenant chaque couleur de tag et indiquent laquelle est choisie, et lisent les images de trophées comme Platine, Or, Argent et Bronze au lieu de simples lettres. Pendant le démarrage d'un jeu, Tab ne passe plus derrière l'écran de démarrage
    en: Screen readers now name each tag colour and say which one is chosen, and read trophy pictures as Platinum, Gold, Silver and Bronze instead of single letters. While a game starts, Tab no longer moves behind the starting screen
  - type: fix
    label: Si une mise à jour s'arrête avant de commencer à remplacer les fichiers, RetroDB relance maintenant la version que vous aviez, au lieu de rester fermé
    en: If an update stops before it starts swapping files, RetroDB now starts the version you had again, instead of staying closed
  - type: fix
    label: Appuyer deux fois sur Jouer en même temps ne peut plus lancer deux jeux dans le lecteur intégré. L'attente d'un téléchargement de cœur abandonne maintenant au bout d'un moment, ou quand RetroDB ne répond plus, au lieu d'attendre indéfiniment, et la question « déjà en cours » utilise la boîte de dialogue propre à RetroDB
    en: Pressing Play twice at once can no longer start two games on the built-in player. Waiting for a core download now gives up after a while, or when RetroDB stops answering, instead of waiting forever, and the "already running" question uses RetroDB's own dialog
  - type: fix
    label: Les codes de triche que vous activez ou désactivez pendant une partie sont conservés pour le bon jeu, jamais pris d'un autre jeu dont le fichier porte le même nom. Un problème de code de triche n'empêche jamais un jeu de démarrer
    en: Cheats you switch on or off during play are kept for the right game, never taken from another game whose file has the same name. A cheat problem never stops a game starting
  - type: fix
    label: RetroDB écrit plus sûrement le fichier de paramètres d'un émulateur. Un fichier de paramètres qui est un lien reste un lien, garde ses permissions et conserve les lettres qu'il ne sait pas lire, et un enregistrement échoué ne laisse aucun fichier parasite
    en: RetroDB writes an emulator's settings file more safely. A settings file that is a link stays a link, keeps its permissions, and keeps letters it cannot read, and a failed save leaves no stray file behind
  - type: fix
    label: Une récupération groupée que vous descendez dans la file, échangez avec une autre ou reprenez pendant qu'une autre tourne n'est plus perdue au redémarrage de RetroDB ; le tableau de bord la propose, là où elle s'était arrêtée. Une récupération remplacée ne continue plus de tourner à côté de la nouvelle, et deux clics rapides sur Reprendre ne lancent la tâche qu'une fois
    en: A bulk scrape you move down the queue, swap with another or resume while one runs is no longer lost when RetroDB restarts; the dashboard offers it, from where it stopped. A swapped-out scrape no longer keeps running beside the new one, and two quick clicks on Resume start a job once
  - type: fix
    label: L'erreur d'un seul jeu, comme une coupure réseau, ne met plus fin à toute une exécution du Remplissage IA ou de Corriger boîtes et régions de manuels ; ce jeu est compté comme échoué et les autres continuent. Arrêter RetroDB arrête aussi proprement les téléchargements de cœurs
    en: One game's error, such as the network dropping, no longer ends a whole AI Fill run or a Fix Box and Manual Regions run; that game counts as failed and the rest go on. Stopping RetroDB now also stops core downloads cleanly
  - type: fix
    label: Les éléments de la liste de souhaits ne restent plus bloqués sur « récupération » après une erreur ou un redémarrage, et deux lancements de Tout récupérer pour la même liste de souhaits ne s'exécutent plus en même temps
    en: Wishlist items no longer stay on "scraping" forever after an error or a restart, and two Scrape All runs for the same wishlist no longer run at once
  - type: fix
    label: Un script ou une seconde copie de RetroDB qui démarre ne marque plus les tâches du serveur en cours comme interrompues, et deux copies démarrant en même temps ne peuvent plus ramener la base de données à une version antérieure
    en: A script or a second copy of RetroDB starting up no longer marks the running server's jobs as interrupted, and two copies starting at once can no longer set the database back a version
  - type: fix
    label: Lancer une synchronisation PlayStation ne fait plus attendre les barres de progression de tout le monde pendant la connexion à Sony. Le maintien de connexion PlayStation quotidien ne renouvelle plus la connexion qu'à l'approche de la fin de ses 10 jours, et non plus chaque jour
    en: Starting a PlayStation sync no longer makes everyone's progress bars wait while it signs in to Sony. The daily PlayStation keep-alive now renews a sign-in only near the end of its 10 days, instead of every day
  - type: fix
    label: Une récupération n'écrase plus une modification faite pendant son exécution, et ne vide plus un genre, un mode ou une vue dont elle ne connaît pas le nom. Elle ne modifie plus le nombre de joueurs enregistré pour l'aligner sur les modes du jeu
    en: A scrape no longer writes over a change you make while it runs, and no longer empties a genre, mode or view it has no name for. It no longer changes a stored player count to match the game's modes
  - type: fix
    label: Remplissage IA ne modifie plus ce que vous avez saisi vous-même, comme un éditeur ou un genre corrigé à la main ; il ne corrige que les valeurs récupérées. Il n'indique plus une valeur comme modifiée quand elle est seulement écrite autrement, comme 4 joueurs en « 1-4 » ou les mêmes genres dans un autre ordre
    en: AI Fill no longer changes what you typed yourself, such as a publisher or genre you corrected by hand; it corrects only scraped values. It no longer reports a value as changed when it only wrote it differently, such as 4 players as "1-4" or the same genres in another order
  - type: fix
    label: Une manette que vous saisissez pour un jeu est conservée ; la manette par défaut de la console ne remplace plus que les valeurs récupérées et celles de l'IA. Une classification d'âge convertie à partir d'une estimation IA d'un autre organisme est maintenant aussi marquée comme estimation
    en: A controller you type for a game is kept; the console's default controller now replaces only scraped and AI values. An age rating converted from another board's AI guess is now marked as a guess too
  - type: fix
    label: Enregistrer la fenêtre de modification d'un jeu ne vide plus les champs qu'elle n'affiche pas. Réinitialiser sur la page d'un jeu efface maintenant tout ce qu'il annonce, y compris la vue, l'édition et les autres noms, supprime les images et vidéos du jeu sauf si un autre jeu les utilise, et met à jour les filtres de la bibliothèque immédiatement
    en: Saving a game's edit window no longer empties fields the window does not show. Reset on a game's page now clears everything it says it does, including the view, edition and other names, deletes the game's pictures and videos unless another game uses them, and updates the library filters straight away
  - type: fix
    label: Effacer les données récupérées efface aussi la vue, 2D ou 3D, et la structure du jeu. Un import CLZ d'un jeu avec seulement une année conserve uniquement l'année, pas le 1er janvier
    en: Clear Scraped Data now also clears the view, 2D or 3D, and game structure. A CLZ import of a game with only a year keeps just the year, not 1 January
  - type: security
    label: La synchronisation Steam n'emprunte plus la clé Steam des Paramètres pour tous les membres du foyer. Un membre sans clé Steam personnelle recevait la bibliothèque Steam et les succès de l'administrateur sur son compte. La clé des Paramètres ne sert plus qu'aux administrateurs
    en: Steam sync no longer borrows the Steam key from Settings for every household member. A member with no Steam key of their own was getting the admin's Steam library and achievements under their account. The key in Settings now serves admins only
  - type: fix
    label: La recherche How Long to Beat pour de nombreux jeux enregistre maintenant les durées dont elle est sûre. Avant, chaque correspondance sûre échouait et rien n'était enregistré. L'actualisation RetroAchievements vérifie aussi le fichier de chaque jeu dans la liste de RetroAchievements, comme une récupération, afin qu'un jeu soit lié à la version exacte que vous possédez
    en: How Long to Beat's lookup for many games now saves the times it is sure of. Before, every sure match failed and nothing was saved. RetroAchievements Refresh now also checks each game's file against RetroAchievements' list, as a scrape does, so a game is linked to the exact version you have
  - type: fix
    label: Le message indiquant qu'une tâche en arrière-plan est terminée s'affiche de nouveau, et la boîte de progression d'une tâche remarque quand le serveur la reprend après un redémarrage. Avant, ni l'un ni l'autre n'apparaissaient
    en: The message that a background job has finished shows again, and a job's progress box notices when the server picks the job up after a restart. Before, neither ever appeared
  - type: fix
    label: 'Trophées PlayStation : un jeu lié à la main reste lié après une synchronisation complète, et une synchronisation ne lie plus un jeu à sa suite, comme « Doom » à « Doom Eternal ». L''import de jeux PlayStation lie maintenant un jeu déjà présent dans votre bibliothèque, comme les imports Steam et Xbox, afin que ses trophées s''y affichent'
    en: 'PlayStation trophies: a game you linked by hand stays linked after a full sync, and a sync no longer links a game to its sequel, such as "Doom" to "Doom Eternal". Importing PlayStation games now links a game already in your library, as Steam and Xbox imports do, so its trophies show on it'
  - type: fix
    label: Xbox n'affiche plus votre gamertag comme Inconnu après le renouvellement automatique de sa connexion, et une connexion lente ou en échec ne vous déconnecte plus de Xbox. Seul un refus de Microsoft le fait
    en: Xbox no longer shows your gamertag as Unknown after its sign-in renews itself, and a slow or failed connection no longer signs you out of Xbox. Only Microsoft refusing the sign-in does that
  - type: fix
    label: Deux personnes peuvent maintenant avoir chacune une étiquette du même nom ; avant, la seconde échouait avec une erreur. Tout utilisateur connecté peut maintenant réanalyser ses propres trophées RPCS3 ; avant, seul un administrateur le pouvait, et les autres voyaient d'anciens trophées jusqu'au redémarrage de RetroDB
    en: Two people can now each have a tag of the same name; before, the second one failed with an error. Any signed-in user can now rescan their own RPCS3 trophies; before, only an admin could, and everyone else saw old trophies until RetroDB restarted
  - type: security
    label: Vos connexions restent privées. Les sauvegardes de la base de données ne peuvent plus être lues par les autres comptes de l'ordinateur, et une sauvegarde échouée ne supprime plus la précédente. Supprimer ou désactiver un utilisateur le déconnecte aussi de RetroAchievements dans DuckStation et PCSX2. Une connexion RetroAchievements enregistrée depuis le menu du lecteur ne passe plus à la personne suivante qui joue. Les journaux et les erreurs de tâches enregistrées masquent les jetons RetroAchievements, l'erreur PlayStation d'un autre membre n'est montrée qu'à lui, et les anciens fichiers de connexion PlayStation et Xbox en texte clair sont supprimés
    en: Your sign-ins stay private. Database backups can no longer be read by other accounts on the computer, and a failed backup no longer deletes the one before it. Deleting or switching off a user also signs them out of RetroAchievements in DuckStation and PCSX2. A RetroAchievements sign-in saved from the player's own menu no longer carries over to the next person who plays. Logs and saved job errors hide RetroAchievements tokens, another member's PlayStation error is shown only to them, and old plain-text PlayStation and Xbox sign-in files are removed
  - type: fix
    label: Les vérifications internes de RetroDB ne peuvent plus toucher à votre bibliothèque pendant leur exécution. Elles utilisent toujours une copie jetable de la base de données, des images et des paramètres, et refusent de démarrer si l'un d'eux pointe vers vos vrais fichiers
    en: RetroDB's own checks can no longer touch your library while they run. They always use a throwaway copy of the database, pictures and settings, and refuse to start if any of them points at your real files
  - type: fix
    label: Nettoyer les fichiers orphelins ne supprime plus les images de votre liste de souhaits. Ouvrir un jeu ne lui fait plus oublier les captures d'écran introuvables. Avant, avec le disque d'images débranché, chaque jeu ouvert perdait toute sa liste de captures d'écran ; maintenant la liste est conservée, et une image manquante est seulement masquée
    en: Clean orphaned files no longer deletes your wishlist's pictures. Opening a game no longer makes it forget screenshots it cannot find. Before, with the picture drive unplugged, every game you opened lost its whole screenshot list; now the list is kept, and a missing picture is only hidden
  - type: fix
    label: Un téléchargement de vidéo ou de manuel qui échoue en cours de route n'abîme plus la copie que le jeu avait déjà, et un téléchargement échoué ne laisse plus de fichier partiel caché dans le dossier des médias. L'agrandisseur d'images en arrière-plan n'enregistre plus une ancienne image par-dessus une plus récente téléchargée entre-temps. Convertir en WebP garde tous les jeux qui partagent une image liés à elle, et ne touche jamais un fichier hors des dossiers d'images
    en: A video or manual download that fails part-way no longer damages the copy the game already had, and a failed download no longer leaves a hidden half-file in the media folder. The background upscaler no longer saves an old picture over a newer one downloaded meanwhile. Convert to WebP keeps every game that shares a picture pointing at it, and never touches a file outside the picture folders
  - type: fix
    label: Supprimer un jeu ou un élément de la liste de souhaits supprime aussi ses images, vidéos et manuels, mais conserve ceux qu'un autre jeu ou élément de la liste de souhaits utilise encore. Les images enregistrées peuvent de nouveau être lues par les autres comptes de l'ordinateur, et Redimensionner les images compte une image qu'il n'a pas pu enregistrer comme échouée, et non comme terminée
    en: Deleting a game or a wishlist item now deletes its pictures, videos and manuals too, but keeps any another game or wishlist item still uses. Saved pictures can be read by other accounts on the computer again, and Resize Images counts a picture it could not save as failed, not as done
  - type: fix
    label: Recherche de doublons ne propose plus de supprimer un fichier qui fonctionne. En recherchant par nom, il ne considère plus les copies .cue et .bin d'un jeu comme des doublons. Il ne propose jamais le fichier de piste d'un disque, que deux versions d'un jeu peuvent partager. Il ne supprimera pas un disque listé dans une playlist. Un jeu dont vous supprimez le fichier passe maintenant à la copie que vous gardez, et reste donc dans la bibliothèque
    en: Duplicate Finder no longer offers a working file for deletion. Looking by name, it no longer calls a game's .cue and .bin copies of each other. It never offers a disc's track file, which two versions of a game can share. It will not delete a disc that a playlist lists. A game whose file you delete now moves to the copy you keep, so it stays in the library
  - type: fix
    label: Organiser multi-disques n'écrase plus une playlist existante ni un fichier déjà présent dans le dossier du jeu ; il s'arrête et indique lequel. La playlist créée liste le .cue de chaque disque, et non ses fichiers de piste. Les jeux dont les fichiers sont déplacés les suivent maintenant dans le dossier, si bien que Nettoyer les ROM manquantes ne les supprime plus
    en: Organize Multi-Disc no longer writes over an existing playlist or a file already in the game's folder; it stops and says which. The playlist it makes lists each disc's .cue, not its track files. Games whose files it moves now follow them into the folder, so Clean missing ROMs no longer removes them
  - type: fix
    label: La conversion en CHD avec « supprimer les originaux » supprime maintenant aussi les fichiers de piste du disque, mais garde une piste qu'un autre .cue utilise encore. Le jeu et toute playlist qui listait l'ancien disque pointent maintenant vers le nouveau .chd. Renommer le fichier d'un jeu met maintenant à jour la playlist qui le liste, et un fichier de piste nécessaire à un .cue ne peut pas être renommé. Retirer des fichiers d'un zip ne retire que les fichiers choisis, même si un nom contient [ ou ]. Dédoublonnage des captures d'écran ne supprime que les copies trouvées par son analyse, et en garde toujours une
    en: Converting to CHD with "delete originals" now deletes the disc's track files too, but keeps a track another .cue still uses. The game and any playlist that listed the old disc now point at the new .chd. Renaming a game's file now updates the playlist that lists it, and a track file a .cue needs cannot be renamed. Removing files from a zip removes only the files you picked, even when a name holds [ or ]. Screenshot Dedup deletes only the copies its scan found, and always keeps one
  - type: fix
    label: How Long to Beat sur la page d'un jeu recherche ce que vous saisissez. Avant, un titre introuvable lui faisait chercher les autres noms du jeu, et il pouvait proposer un autre jeu, comme un remake de fans. Il essaie toujours les autres noms quand la zone contient le nom du jeu lui-même
    en: How Long to Beat on a game's page searches for what you type. Before, a title it could not find made it search the game's other names instead, and it could offer a different game, such as a fan remake. It still tries the other names when the box holds the game's own name
  - type: fix
    label: Les étapes How Long to Beat du manuel d'aide correspondent à l'écran. Elles disaient de choisir une correspondance dans une liste ; la page en montre une seule avec Enregistrer et Annuler. L'aide PlayStation ne dit plus que la connexion dure environ deux mois, puisque RetroDB se reconnecte tout seul. Les 20 manuels traduits contiennent ces deux changements
    en: The help manual's How Long to Beat steps match the screen. They said to pick a match from a list; the page shows one match with Save and Cancel. The PlayStation help no longer says the sign-in lasts about two months, since RetroDB signs in again by itself. All 20 translated manuals carry both changes
  - type: fix
    label: Chaque barre de lettres commence maintenant par un bouton Tout. Sur les pages Bibliothèque, console et Trophées PSN, choisir une lettre n'affiche que les jeux de cette lettre, et il n'y avait avant aucun bouton pour retrouver les autres. Sur les autres pages de succès, Tout revient au premier jeu
    en: Every letter bar now starts with an All button. On the Library, console and PSN Trophies pages, picking a letter shows only that letter's games, and before there was no button to bring the rest back. On the other achievement pages, All goes back to the first game
  - type: fix
    label: Un nouveau jeton de connexion PlayStation collé dans les Paramètres est maintenant utilisé immédiatement. Avant, RetroDB gardait l'ancienne connexion jusqu'à son expiration, et Enregistrer et tester la connexion indiquait que cette ancienne connexion fonctionnait. Un jeton refusé par Sony ne remplace plus un jeton qui fonctionne
    en: A new PlayStation sign-in token you paste in Settings is now used straight away. Before, RetroDB kept using the old sign-in until it ran out, and Save & Test Connection reported that old sign-in as working. A token Sony refuses no longer replaces one that works
  - type: enhancement
    label: 'La connexion PlayStation dans les Paramètres est plus facile à maintenir. La bannière ne décompte plus des jours où vous n''aviez rien à faire, car RetroDB se reconnecte tout seul ; elle ne devient rouge que si Sony refuse votre jeton enregistré. Le bouton Coller ici ne fait plus demander au navigateur l''accès à votre presse-papiers : il place le curseur dans la zone pour Ctrl+V. Les étapes indiquent maintenant de se déconnecter d''abord de PlayStation quand vous remplacez un jeton qui fonctionne encore, et leurs messages peuvent être traduits'
    en: 'The PlayStation sign-in in Settings is easier to keep going. The banner no longer counts down days you never had to act on, because RetroDB signs in again by itself; it turns red only when Sony refuses your saved token. The Paste here button no longer makes the browser ask to read your clipboard: it puts the cursor in the box for Ctrl+V. The steps now say to sign out of PlayStation first when you replace a token that still works, and their messages can be translated'
  - type: enhancement
    label: Les messages contextuels et les boîtes de question, comme « Paramètres enregistrés » ou « Supprimer cette liste ? », peuvent maintenant être traduits sur toutes les pages. Avant, la plupart restaient en anglais quelle que soit la langue choisie
    en: Pop-up messages and question boxes, such as "Settings saved" or "Delete this list?", can now be translated on every page. Before, most of them stayed in English whatever language you chose
  - type: enhancement
    label: Les messages expliquant pourquoi une connexion PlayStation a échoué, comme « Votre NPSSO a peut-être expiré », peuvent maintenant être traduits
    en: The messages that say why a PlayStation sign-in failed, such as "Your NPSSO may have expired", can now be translated
  - type: fix
    label: Le manuel d'aide dans toutes les langues correspond maintenant à la version anglaise. Il gagne Recherche partout, Garder un titre, Noms MAME et le dos de la boîte, et les anciens paragraphes en retard sont à jour
    en: The help manual in every language now matches the English one. It gains Search Anywhere, Keeping a Title, MAME Names and the back of the box, and older paragraphs that had fallen behind are up to date
  - type: fix
    label: En allemand, en afrikaans et en espagnol, le bouton Retour sur la jaquette d'un jeu indique maintenant le dos de la boîte, et non « retour en arrière »
    en: In German, Afrikaans and Spanish, the Back button on a game's cover now says the back of the box, not "go back"
  - type: feature
    label: Appuyer sur Jouer remplit maintenant l'écran avec le logo du jeu sur son image de fond pendant le démarrage du jeu, ou avec son nom en grandes lettres s'il n'a pas de logo. Il disparaît tout seul à l'ouverture de la fenêtre du jeu, ou quand vous appuyez sur Échap ou cliquez
    en: Pressing Play now fills the screen with the game's logo on its background picture while the game starts, or its name in large letters when it has no logo. It goes away by itself when the game's window opens, or when you press Esc or click
  - type: feature
    label: 'La boîte 3D rotative a maintenant la vraie forme d''un boîtier PS5 : coins et bords arrondis, rebord surélevé autour de la jaquette, ligne de jonction des deux moitiés et encoche pour le doigt du côté qui s''ouvre. Elle nécessite un fichier de boîte d''une version de Slipcase qui écrit cette forme ; importez à nouveau la boîte pour l''obtenir. Les autres boîtes restent comme avant'
    en: 'The turnable 3D box now has the real shape of a PS5 case: rounded corners and edges, the raised lip round the cover, the line where the two halves meet, and the finger slot in the opening side. It needs a box file from a Slipcase version that writes the shape; import the box again to get it. Other boxes look as before'
  - type: enhancement
    label: Actualiser RetroAchievements est passé des Paramètres à la page RetroAchievements, et s'appelle maintenant Trouver les jeux avec succès. Chaque bouton y a maintenant une ligne expliquant son rôle, pour distinguer facilement Trouver les jeux et Synchroniser la progression. Si aucun jeu n'est encore lié, la page montre à un administrateur le bouton Trouver au lieu de passer à l'onglet suivant
    en: Refresh RetroAchievements moved from Settings to the RetroAchievements page, and is now called Find Games with Achievements. Every button there now has a line saying what it does, so Find Games and Sync Progress are easy to tell apart. With no games linked yet, the page shows an admin the Find button instead of moving on to the next tab
  body: "<ul>\n  <li><strong>4.0 est la dernière version web de RetroDB.</strong> Les nouvelles versions\n    seront une application de bureau pour Windows, Linux et macOS, et une application Android.\n    Elles ouvriront votre Bibliothèque existante. La version 4.0 reste disponible\n    en Télécharger, et ne recevra que des correctifs de sécurité et des correctifs de bugs qui font perdre des données.\n    Paramètres → Mises à jour renvoie vers l'application de bureau dès sa sortie.</li>\n  <li><strong>Le manuel d'aide est à jour dans toutes les langues.</strong>\n    Les sections qui n'existaient qu'en anglais dans le manuel sont maintenant traduites.</li>\n</ul>\n"
  body_en: "<ul>\n  <li><strong>4.0 is the last web version of RetroDB.</strong> New versions\n    will be a desktop app for Windows, Linux and macOS, and an Android app.\n    They will open your existing library. Version 4.0 stays available to\n    download, and gets only security fixes and fixes for bugs that lose data.\n    Settings → Updates links to the desktop app when it is out.</li>\n  <li><strong>The help manual is up to date in every language.</strong>\n    Sections that were only in the English manual are now translated.</li>\n</ul>\n"
- version: 3.35.4
  date: '2026-11-03'
  tags:
  - type: fix
    label: Une capture d'écran que vous supprimez d'un jeu reste désormais supprimée. Avant, la récupération suivante pouvait la recopier depuis ES-DE ou la télécharger de nouveau depuis une source en ligne. Supprimer un doublon avec l'outil des captures d'écran en double n'est pas concerné, car l'image est conservée une fois
  - type: feature
    label: 'Les jeux ont maintenant leur logo : la récupération l''enregistre depuis ES-DE, ScreenScraper, TheGamesDB, IGDB et Steam, et la page du jeu l''affiche au-dessus du titre, ou à la place d''une boîte manquante. Vous pouvez téléverser ou supprimer un logo dans la fenêtre Modifier. Lancez une récupération en masse avec Fill Missing pour ajouter les logos des jeux déjà récupérés'
  - type: fix
    label: IGDB ne fournit plus le logo d'un jeu comme arrière-plan de la page
  - type: feature
    label: 'Les jeux ont maintenant le dos de leur boîte : la récupération l''enregistre depuis ES-DE, ScreenScraper et TheGamesDB, et un bouton Dos sur la jaquette de la page du jeu l''affiche. Cliquez sur le dos pour l''agrandir. Vous pouvez téléverser ou supprimer un dos dans la fenêtre Modifier. Les dos se remplissent à chaque récupération d''un jeu ; Fill Missing ne récupère pas à nouveau un jeu uniquement pour son dos'
  - type: fix
    label: Un jeu sans jaquette avant sur TheGamesDB n'obtient plus le dos de la boîte comme jaquette
  - type: fix
    label: Si vous désactivez un outil de récupération dans les Paramètres pendant une récupération en masse, le nombre de jeux introuvables est maintenant juste dès le jeu suivant. Avant, un jeu pouvait être compté comme arrêté
  - type: enhancement
    label: Sur un système sans émulateur configuré, le bouton Jouer est grisé. Pointez-le pour savoir pourquoi, ou cliquez dessus pour voir un message indiquant qu'aucun émulateur n'est configuré. Avant, une ligne de texte s'affichait à côté du bouton
  body: "<ul>\n  <li><strong>Les jeux ont leur logo.</strong> La récupération enregistre le\n    logo de chaque jeu, et la page du jeu l'affiche au-dessus du titre, ou à la place d'une\n    boîte manquante. Lancez une récupération en masse avec Fill Missing pour ajouter les logos des\n    jeux déjà récupérés.</li>\n  <li><strong>Les jeux ont le dos de leur boîte.</strong> Un bouton Dos sur\n    la jaquette de la page du jeu l'affiche, et vous pouvez cliquer dessus pour l'agrandir. Les dos\n    se remplissent à chaque récupération d'un jeu.</li>\n  <li><strong>Une capture d'écran supprimée reste supprimée.</strong> La récupération suivante\n    ne la recopie plus et ne la télécharge plus de nouveau.</li>\n  <li><strong>Jouer indique pourquoi il ne peut pas démarrer.</strong> Sur un système sans\n    émulateur configuré, le bouton Jouer est grisé et explique pourquoi.</li>\n</ul>\n"
- version: 3.35.3
  date: '2026-11-02'
  tags:
  - type: feature
    label: 'Nouvel outil Noms MAME dans Outils ROM : les jeux MAME reçoivent leurs vrais noms, années et éditeurs depuis la liste propre à MAME, et les fichiers gardent leurs noms courts. Une récupération trouve ensuite chaque jeu, et vous pouvez filtrer la liste MAME par catégorie, par exemple pour exclure les machines à sous. Les sets BIOS sont masqués de la liste'
  - type: fix
    label: Les Rapports ROM ne proposent plus de renommer les fichiers MAME, car un fichier renommé ne fonctionne plus dans MAME
  - type: fix
    label: Les Paramètres indiquent désormais ce que Microsoft exige avant l'enregistrement d'une application Xbox. La connexion Xbox n'a pas pu être testée à cause de cela
  - type: enhancement
    label: La carte séparée Noms officiels a disparu du Remplissage IA en masse, car l'option Nom officiel du remplissage fait déjà ce travail
  - type: fix
    label: Quand Sony refuse une connexion PlayStation enregistrée, le tableau de bord et les Paramètres l'indiquent et vous demandent de relier à nouveau le compte. Avant, le journal affichait une erreur sans sens à chaque démarrage du serveur et rien ne vous prévenait
  - type: feature
    label: L'importation depuis Steam remplit désormais, en arrière-plan, la description, les crédits, la note Metacritic, les classifications d'âge, les modes de jeu, la boîte, l'arrière-plan et les captures d'écran de chaque jeu à partir de sa page de boutique. Récupérez un jeu pour obtenir son genre et sa date de sortie
  - type: feature
    label: Une synchronisation Steam conserve désormais votre temps de jeu et la date de votre dernière partie, et la page du jeu les affiche
  - type: fix
    label: Récupérer la bibliothèque sur la page d'importation Steam fonctionne maintenant pour un administrateur ayant une clé Steam enregistrée. Avant, la page envoyait à Steam la version masquée de la clé et indiquait à tort de passer votre profil en Public
  - type: fix
    label: Un jeu Steam ou Xbox déjà présent dans votre bibliothèque sous le même nom est désormais lié à ce jeu lors de l'importation, et ses succès se synchronisent. Avant, il était ignoré et jamais lié
  - type: fix
    label: Les jeux importés depuis Steam, Xbox et PlayStation sont maintenant triés correctement dès le départ, par exemple Final Fantasy IX avant Final Fantasy X, et les symboles de marque de Steam sont retirés de leurs noms
  - type: feature
    label: Sur les systèmes où RetroAchievements utilise un simple hash de fichier, comme la Mega Drive et la Game Boy, la page du jeu indique si votre copie donne des succès, et ce hash relie le bon jeu. Lancez RA Refresh pour renseigner cela
  - type: fix
    label: Une récupération interroge maintenant ScreenScraper avec votre fichier exact avant de chercher par nom, et obtient ainsi votre jeu plutôt qu'un titre similaire. Les résultats que vous cochez vous-même restent prioritaires
  - type: enhancement
    label: La fenêtre de progression du Redimensionnement d'images indique maintenant le jeu et le système de chaque image
  - type: feature
    label: La récupération apporte désormais des écrans-titres depuis ScreenScraper et TheGamesDB, plus de noms officiels depuis IGDB et TheGamesDB (comme le titre japonais d'un jeu), et les autres consoles sur lesquelles un jeu est sorti depuis IGDB
  - type: feature
    label: Un jeu sans note d'utilisateur reprend désormais la classification de votre collection ES-DE, s'il en a une
  - type: feature
    label: La page du jeu indique combien de joueurs ont chronométré un résultat HowLongToBeat et renvoie vers sa page. Les résultats enregistrés avant cela les afficheront à la prochaine recherche
  - type: feature
    label: La page RetroAchievements montre combien de personnes jouent à un jeu et la part d'entre elles qui a obtenu chaque succès
  - type: fix
    label: Le navigateur de dossiers des Outils ROM s'ouvre sur votre dossier ROM quand il n'a pas de dossier de départ, au lieu d'échouer. Une réponse illisible d'IGDB ne fait plus perdre que ce détail, et non tout ce qu'IGDB a envoyé pour le jeu
  - type: fix
    label: La limite quotidienne de ScreenScraper empêche désormais RetroDB de l'interroger jusqu'à plus tard, et une récupération en masse l'indique et continue avec ses autres sources. Avant, une limite épuisée ressemblait à « jeu introuvable » et les appels continuaient toute la nuit
  - type: fix
    label: Un jeu pour lequel aucune source n'a pu répondre pendant qu'un service était à sa limite n'est plus marqué comme récupéré, donc la prochaine exécution le réessaie
  - type: fix
    label: Quand une clé TheGamesDB a épuisé son mois, RetroDB passe à votre autre clé, et arrête d'interroger quand les deux sont épuisées
  - type: fix
    label: La limite mensuelle de RAWG empêche aussi RetroDB d'interroger ce service, et IGDB est maintenu sous sa limite de quatre requêtes par seconde
  - type: fix
    label: La recherche en masse de HowLongToBeat se termine maintenant par un message quand le site indique avoir reçu trop de requêtes, et chaque requête vers le site est espacée
  - type: fix
    label: Corriger régions des boîtes et manuels n'abandonne plus après 25 jeux d'affilée inconnus de ScreenScraper. Il ne s'arrête que lorsque ScreenScraper indique que sa limite est atteinte
  - type: fix
    label: Sur la page du jeu, chaque classification d'âge est maintenant centrée au-dessus de son étiquette d'estimation IA
  - type: fix
    label: Le quota TheGamesDB dans les Paramètres utilise désormais la vérification qui ne consomme pas votre quota, et n'affiche plus de fausse date de réinitialisation quand le service n'en donne aucune
  body: |
    <ul>
      <li><strong>Les jeux MAME retrouvent leur vrai nom.</strong> Le nouvel outil Noms MAME
        dans les outils ROM reprend les noms, les années et les éditeurs de la liste officielle de MAME.
        Les fichiers gardent leur nom court, car MAME en a besoin. Vous pouvez
        filtrer la liste MAME par catégorie, et les jeux BIOS sont masqués.</li>
      <li><strong>Les imports Steam apportent bien plus.</strong> Chaque jeu récupère sa
        description, ses crédits, sa note Metacritic, ses classifications d'âge, ses modes de jeu
        et ses images depuis sa page de boutique. Une synchronisation conserve votre temps de jeu et la date de
        votre dernière partie. Un jeu déjà présent dans votre bibliothèque sous le même nom est maintenant
        lié à celui-ci, et ses succès se synchronisent.</li>
      <li><strong>Les récupérations trouvent votre jeu exact.</strong> Une récupération interroge
        ScreenScraper sur votre fichier exact avant de chercher par nom. Elle
        apporte aussi les écrans-titres, davantage de noms officiels et les autres consoles
        sur lesquelles un jeu est sorti.</li>
      <li><strong>RetroAchievements reconnaît votre exemplaire.</strong> Sur les systèmes qui
        utilisent une simple empreinte de fichier, comme la Mega Drive et la Game Boy, la page du jeu
        indique si votre exemplaire permet d'obtenir des succès. Lancez RA Refresh pour renseigner
        cette information. La page RetroAchievements montre aussi combien de personnes jouent à un jeu
        et quelle part d'entre elles a obtenu chaque succès.</li>
      <li><strong>Les limites en ligne sont respectées.</strong> Quand ScreenScraper,
        TheGamesDB ou RAWG atteint sa limite, RetroDB arrête de l'interroger jusqu'à plus tard
        et une récupération en masse continue avec ses autres sources. Un jeu pour lequel aucune source
        n'a pu répondre à ce moment-là est réessayé au prochain passage.</li>
      <li><strong>Une connexion PlayStation refusée est signalée.</strong> Le tableau de bord
        et les Paramètres vous demandent maintenant de relier à nouveau votre compte quand Sony refuse une
        connexion enregistrée.</li>
      <li><strong>Noms officiels a changé de place.</strong> Sa carte séparée a disparu
        du Remplissage IA en masse, car l'option Nom officiel du remplissage
        remplit le même rôle.</li>
    </ul>
- version: 3.35.2
  date: '2026-11-02'
  tags:
  - type: fix
    label: Le temps de jeu total ne compte plus les minutes comme des heures, sur le tableau de bord, les trophées de collectionneur et le graphique d'analyse. Un jeu de 36 minutes était compté comme 36 heures
  - type: fix
    label: HowLongToBeat ne prend plus une suite pour votre jeu. Double Dragon II ne reçoit plus les durées de Double Dragon III
  - type: fix
    label: Une recherche groupée HowLongToBeat n'enregistre plus la durée d'un jeu sur un autre système. Mario Golf sur Game Boy Color ne reçoit plus la durée de la Nintendo 64. Ces correspondances attendent désormais sur la page de vérification
  - type: fix
    label: 'Les recherches HowLongToBeat, groupées ou unitaires, utilisent maintenant l''année de sortie du jeu : Doom de 1993 ne reçoit plus les durées de Doom de 2016'
  - type: new
    label: Vérifier les temps de jeu enregistrés, dans Outils ROM, envoie les correspondances enregistrées qui semblent erronées vers la page de vérification, où vous gardez ou effacez chacune d'elles
  - type: fix
    label: Une recherche groupée HowLongToBeat avec Seulement les manquants réessaie maintenant les jeux associés sans durée, et laisse une seconde entre les requêtes
  - type: fix
    label: Un score de correspondance de 72 % ne s'affiche plus comme 100 % sur la page du jeu
  - type: fix
    label: Les jeux n'affichent plus les RetroAchievements d'un autre jeu. Resident Evil 4 sur GameCube n'affiche plus l'ensemble de Resident Evil, et Ratchet Deadlocked n'affiche plus celui de Ratchet & Clank
  - type: fix
    label: Une récupération supprime maintenant le lien RetroAchievements quand RetroAchievements n'a pas ce jeu. Si RetroAchievements est inaccessible, le lien reste
  - type: fix
    label: RetroAchievements trouve maintenant plus de vos jeux, grâce au nom du fichier ROM, aux titres alternatifs, aux accents comme dans Ōkami, et aux titres à deux noms
  - type: fix
    label: RetroAchievements ne lie plus un jeu à un ensemble bonus, un hack ou une démo, et X-Men n'est plus égal à G-Men
  - type: new
    label: La page du jeu affiche le nom que RetroAchievements donne au jeu lié, ce qui permet de repérer facilement un mauvais lien
  - type: fix
    label: L'actualisation RA enregistre maintenant les points de chaque jeu, donc un jeu n'affiche plus 0 point
  - type: new
    label: La page du jeu signale les classifications d'âge issues de l'IA comme une estimation fondée sur le contenu du jeu, et indique quand chaque organisme de classification a commencé. OutRun de 1987 ne semble plus officiellement classé par l'ESRB
  - type: new
    label: La page du jeu signale les notes de critiques et les chiffres de ventes issus de l'IA. Si vous modifiez vous-même une classification ou un chiffre de ventes, la mention disparaît
  - type: fix
    label: 'Une note de l''IA sur une mauvaise échelle est refusée : un jeu apprécié ne reçoit plus 7 sur 100 après une nouvelle récupération'
  - type: fix
    label: Un nombre d'avis issu de l'IA n'est plus enregistré à côté de la note d'un autre site, et la page du jeu n'affiche plus ceux qui l'ont été
  - type: fix
    label: Une fourchette de ventes ou une somme d'argent issue de l'IA ne devient plus quelques exemplaires vendus
  - type: fix
    label: Les réponses de l'IA ne stockent plus de listes sous forme de code, ni les mots N/A ou None comme valeurs, ni la propre console d'un jeu parmi les autres plateformes
  - type: fix
    label: Remplissage IA conserve maintenant dans l'historique du jeu la valeur qu'il remplace
  - type: fix
    label: Les jeux sur cartouche ne reçoivent plus un type de sauvegarde sur pile inventé, et les nouvelles réponses de l'IA n'adoptent plus Édition standard par défaut
  - type: fix
    label: 'La série d''un jeu ne vient plus du découpage de son titre : Need For Speed n''est plus dans une série appelée Need. Les noms de séries d''IGDB sont de nouveau lus, et les anciennes suppositions sont effacées pour que la prochaine récupération les remplisse'
  - type: fix
    label: Les descriptions n'affichent plus de codes web à la place des guillemets, ni de marques de titre comme
  - type: fix
    label: Une société a maintenant une seule orthographe, donc cliquer sur Sega trouve tous les jeux SEGA. Les régions n'ont qu'une valeur, et les plateformes utilisent les noms de la liste
  - type: fix
    label: Les titres de jeux venant de RAWG n'ajoutent plus d'année, et les titres alternatifs ne listent plus de noms de fichiers comme dosbox.exe
  - type: fix
    label: Récupération complète ne remplace plus par une supposition une classification ou une manette que vous avez définie, et une récupération qui échoue en cours de route n'écrit plus par une voie moins soignée
  body: "<ul>\n  <li><strong>Les réponses de l'IA indiquent qu'elles viennent de l'IA.</strong> Les classifications d'âge de l'IA\n    sont conservées, signalées comme une estimation fondée sur le contenu du jeu, avec l'année où chaque\n    organisme de classification a commencé. Les notes et les ventes issues de l'IA sont aussi signalées.</li>\n  <li><strong>RetroAchievements affiche le bon jeu.</strong> Les suites ne\n    portent plus les succès du premier jeu. Après la mise à jour, le\n    tableau de bord propose une fois une actualisation RetroAchievements. Appuyez dessus pour réparer\n    les anciens liens. La progression enregistrée sous un mauvais lien est supprimée, et la prochaine\n    synchronisation la remplit de nouveau.</li>\n  <li><strong>Les totaux de temps de jeu sont justes.</strong> Les durées de moins d'une heure étaient\n    comptées comme des heures, donc les totaux du tableau de bord et les trophées de collectionneur\n    étaient trop élevés. Certains totaux et trophées vont baisser.</li>\n  <li><strong>HowLongToBeat trouve le bon jeu.</strong> Une suite ne\n    passe plus pour le jeu que vous avez, et le système et l'année du jeu comptent maintenant.\n    Une correspondance sur un autre système, ou d'années plus tard, vous attend\n    sur la page de vérification.</li>\n  <li><strong>Vérifiez ce qui est déjà enregistré.</strong> Appuyez sur Vérifier les temps de\n    jeu enregistrés dans Outils ROM pour envoyer les correspondances douteuses vers la page de vérification.\n    Rien ne change tant que vous n'avez pas décidé.</li>\n  <li><strong>Les noms de séries sont fiables.</strong> La série d'un jeu ne vient plus\n    du découpage de son titre. Après la mise à jour, les noms de séries qui étaient\n    devinés sont effacés, dont certains qui étaient justes. La prochaine récupération\n    les remplit à partir de sources qui nomment une série.</li>\n  <li><strong>Textes propres.</strong> Les descriptions n'affichent plus de codes web ni\n    de marques de titre. Une société a une seule orthographe, un jeu a une seule région, et\n    les noms de fichiers comme dosbox.exe ne sont plus listés comme autres titres. Cela\n    se fait une fois, automatiquement, après la mise à jour.</li>\n  <li><strong>Récupération complète respecte vos choix.</strong> Une classification ou\n    une manette que vous avez définie reste, sauf si une source en fournit vraiment une.</li>\n</ul>\n"
- version: 3.35.1
  date: '2026-11-02'
  tags:
  - type: fix
    label: Le scraping ne prend plus une suite pour le jeu que vous avez. Street Fighter II ne reçoit plus les détails de Street Fighter, ni Sonic the Hedgehog ceux de Sonic 2, quand le jeu exact est absent
  - type: fix
    label: Une récupération en masse n'accepte désormais une correspondance que si le titre correspond vraiment. La bonne console et une date de sortie ne suffisent plus à elles seules pour valider
  - type: fix
    label: Les mods, DLC, bundles et mises à jour d'IGDB ne correspondent plus à un jeu, sauf si votre ROM porte exactement ce nom
  - type: fix
    label: 'RAWG ne garde qu''une fiche pour toutes les versions d''un jeu : quand elle couvre plusieurs consoles, elle ne fournit plus développeur, éditeur, classification par âge ni modes multijoueur. Elle ne devine plus du tout le nombre de joueurs'
  - type: fix
    label: Les nombres de joueurs et les modes multijoueur d'IGDB viennent désormais de la console propre au jeu
  - type: fix
    label: Quand plusieurs sources correspondent aussi bien, c'est désormais l'ordre de vos scrapers qui décide. RAWG ne gagne plus de points pour une image ou une note Metacritic, et les nouvelles installations placent RAWG en dernier
  - type: fix
    label: RAWG n'est plus interrogé pour les jeux Commodore 64 et DOS, car il les classe sous Amiga et PC, et le jeu d'une autre plateforme pourrait correspondre
  - type: fix
    label: Un résultat ScreenScraper que vous choisissez est désormais toujours le jeu que vous obtenez, même si les résultats sont restés ouverts plus de 10 minutes
  - type: fix
    label: 'Les accents et la ponctuation ne diminuent plus la correspondance d''un titre : Pokémon trouve Pokemon et R.B.I. trouve RBI'
  - type: fix
    label: Une date de sortie n'affiche plus que ce que sa source connaît. Un jeu connu seulement par son année affiche cette année, et non un 1er janvier ou un 31 décembre inventé
  - type: fix
    label: 'Les dates d''IGDB et de RAWG appartiennent désormais à la console propre au jeu, et celles d''IGDB à sa propre région : un exemplaire USA n''affiche plus la date japonaise, ni un portage l''année de l''original'
  - type: feature
    label: La liste des dates de sortie sur la page d'un jeu se remplit désormais depuis IGDB et ScreenScraper, et pas seulement par l'IA
  - type: added
    label: 'Nouvelle carte Outils ROM : Nettoyer les dates de sortie supprime les jours inventés que stockaient d''anciennes récupérations, pour qu''une récupération puisse renseigner la vraie date'
  - type: fix
    label: Les genres, perspectives et modes de jeu utilisent désormais un seul jeu de noms quelle que soit la source, donc les filtres trouvent tous les jeux. Un même genre ne s'affiche plus à la fois comme RPG et Role Playing Game
  - type: added
    label: 'Nouvelle carte Outils ROM : Nettoyer genres, perspectives et modes convertit ce que stockaient d''anciennes récupérations, place des termes comme FPV dans le bon champ et corrige les nombres de joueurs qui contredisent les modes d''un jeu'
  - type: fix
    label: Les jeux en ligne uniquement d'IGDB ne sont plus listés comme multijoueur local, et un jeu qui exige deux joueurs n'est plus listé comme solo
  body: "<ul>\n  <li><strong>Le scraping cesse de prendre le mauvais jeu.</strong> Une suite ne\n    passe plus pour le jeu que vous avez : Street Fighter II ne reçoit rien\n    de Street Fighter, et une récupération en masse exige que le titre corresponde, pas\n    seulement la console. Les mods, DLC et bundles d'IGDB ne correspondent plus, sauf si votre\n    ROM porte exactement ce nom.</li>\n  <li><strong>RAWG cesse de mélanger les versions d'un jeu.</strong> Quand sa fiche\n    couvre plusieurs consoles, il ne fournit plus développeur, éditeur, classification\n    par âge ni modes multijoueur, et il ne devine plus le nombre de joueurs.\n    Il n'est plus interrogé pour les jeux Commodore 64 et DOS.</li>\n  <li><strong>L'ordre de vos scrapers départage les correspondances égales.</strong>\n    RAWG ne gagne plus de points pour une image ou une note Metacritic, et les nouvelles\n    installations le placent en dernier.</li>\n  <li><strong>Une date de sortie n'affiche que ce que sa source connaît.</strong> Un\n    jeu connu seulement par son année affiche cette année. Les dates d'IGDB et de RAWG\n    appartiennent à la console propre au jeu, et la liste des dates de sortie se remplit désormais\n    aussi depuis IGDB et ScreenScraper.</li>\n  <li><strong>Un seul jeu de noms pour les genres, perspectives et modes.</strong>\n    Les filtres trouvent désormais tous les jeux, et les jeux en ligne uniquement ne sont plus listés\n    comme multijoueur local.</li>\n  <li><strong>Deux nouvelles cartes Outils ROM.</strong> Nettoyer les dates de sortie et Nettoyer\n    genres, perspectives et modes corrigent ce que stockaient d'anciennes récupérations. Appuyez\n    dessus, puis lancez une récupération en masse avec Remplir les manquants.</li>\n  <li><strong>Les nombres de joueurs viennent de la console propre au jeu,</strong> et\n    un résultat ScreenScraper que vous choisissez est toujours le jeu que vous obtenez.</li>\n</ul>\n"
- version: 3.35.0
  date: '2026-11-01'
  tags:
  - type: fix
    label: ES-DE garde désormais sa place dans l'ordre de vos sources de récupération quand ce n'est pas la source principale. Ses descriptions, ses sociétés et ses jaquettes étaient remplacées par celles des sources suivantes et par l'IA
  - type: fix
    label: Les captures d'écran et les écrans titres d'ES-DE sont désormais ajoutés à un jeu quand ES-DE n'est pas la source principale, sauf s'ils ressemblent à une image que le jeu a déjà
  - type: fix
    label: ES-DE ne copie plus un fanart, une vidéo ou un manuel que le jeu possède déjà, et une Récupération complète ne supprime plus une jaquette qu'une autre source vient de télécharger
  - type: fix
    label: ES-DE lit désormais l'entrée du fichier ROM propre au jeu, de sorte qu'une autre version du même nom ne peut plus fournir ses informations, et les jeux PS3 en dossier trouvent maintenant leurs jaquettes ES-DE
  - type: fix
    label: L'importation des logos de systèmes depuis ES-DE ne prend plus une image sans rapport parce que son nom contient des lettres comme "gb"
  - type: fix
    label: Une balise dans le nom de fichier d'une ROM, comme (USA), détermine désormais sa région. L'IA n'est plus sollicitée, car elle pouvait classer une copie USA en Europe ou au Japon
  - type: feature
    label: Nouvel outil dans Outils ROM, Corriger les régions d'après les noms de fichiers, qui corrige les jeux mal traités par les anciennes récupérations
  - type: fix
    label: Les images de fond de RAWG ne sont plus enregistrées comme jaquettes, car ce sont souvent des captures d'écran et elles bloquaient une vraie jaquette. Elles sont utilisées comme Fanart
  - type: feature
    label: Nouvel outil dans Outils ROM, Retirer les images RAWG des jaquettes, qui supprime celles enregistrées par les anciennes récupérations afin qu'une récupération puisse trouver de vraies jaquettes
  - type: feature
    label: RetroDB cite désormais RAWG avec un lien dans la barre latérale, comme RAWG le demande
  - type: fix
    label: ScreenScraper donne désormais à chaque jeu la jaquette, la jaquette 3D, le manuel, l'écran titre et la date de sortie de sa propre région, et non plus ceux de la première région par ordre alphabétique
  - type: feature
    label: Nouvel outil dans Outils ROM, Corriger les régions des jaquettes et manuels, qui échange les jaquettes et manuels pris dans la mauvaise région par d'anciennes récupérations ScreenScraper
  - type: fix
    label: Les vidéos ScreenScraper utilisent d'abord le fichier le plus petit, et le plus grand seulement en cas d'échec
  - type: fix
    label: Chaque source de récupération cherche désormais la bonne console. L'Atari Lynx, le CPS d'arcade, la Super Famicom et d'autres étaient cherchés sur la mauvaise machine, et bien d'autres systèmes sont maintenant cherchés, par toutes les sources et pour les succès
  - type: feature
    label: Sur la page d'un jeu, les flèches gauche et droite mènent au jeu précédent et au jeu suivant
  - type: feature
    label: La section Codes de triche de la page d'un jeu peut maintenant se replier, et se souvient si vous l'avez laissée ouverte
  - type: fix
    label: L'ouverture d'une fenêtre qui commence par une zone de texte, comme Récupérer, place désormais le curseur dans cette zone au lieu du bouton de fermeture
  - type: feature
    label: 'Nouvel outil Revue des captures d''écran dans Outils ROM : il liste les captures d''écran ZX Spectrum, Commodore 64 et Game Boy en commençant par les plus suspectes, et ne supprime que ce que vous choisissez'
  - type: fix
    label: La récupération refuse désormais une capture d'écran Game Boy dont l'original a bien plus de nuances que la machine ne pouvait en afficher
  - type: fix
    label: Les panneaux du bas d'un jeu s'adaptent maintenant à la fenêtre au lieu de dépasser du bord droit
  - type: feature
    label: Importez une jaquette 3D depuis la fenêtre Modifier, à côté des autres images
  - type: feature
    label: La connexion à RetroAchievements est maintenant transmise à DuckStation et PCSX2 quand vous appuyez sur Jouer
  - type: fix
    label: Sur les systèmes 8 bits et 16 bits, la récupération n'ajoute plus de captures d'écran IGDB ou RAWG à un jeu sorti sur plusieurs systèmes, car elles pouvaient montrer la version d'un autre système
  - type: fix
    label: L'émulateur d'un jeu est maintenant indiqué sur sa carte de Paramètres de l'émulateur, et non à côté de Jouer
  body: "<ul>\n  <li><strong>Chaque source cherche la bonne console.</strong> L'Atari\n    Lynx, le CPS d'arcade, la Super Famicom et d'autres étaient cherchés\n    sur la mauvaise machine, et bien d'autres systèmes sont maintenant\n    cherchés, par toutes les sources et pour les succès.</li>\n  <li><strong>La région d'un jeu vient d'abord de son nom de fichier.</strong>\n    Une balise comme (USA) détermine désormais la région, et l'IA n'est\n    plus sollicitée. Outils ROM a un nouvel outil, Corriger les régions\n    d'après les noms de fichiers, pour les jeux mal traités par les\n    anciennes récupérations.</li>\n  <li><strong>ScreenScraper suit la région du jeu.</strong> La jaquette,\n    la jaquette 3D, le manuel, l'écran titre et la date de sortie viennent\n    maintenant de la région du jeu, et non de la première par ordre\n    alphabétique. Outils ROM a un nouvel outil, Corriger les régions des\n    jaquettes et manuels, pour les anciennes récupérations. Les vidéos\n    essaient d'abord le fichier le plus petit.</li>\n  <li><strong>Les images RAWG ne sont plus des jaquettes.</strong> Ce sont\n    souvent des captures d'écran, et elles bloquaient une vraie jaquette.\n    Elles sont maintenant utilisées comme Fanart. Outils ROM a un nouvel\n    outil, Retirer les images RAWG des jaquettes, pour celles enregistrées\n    par les anciennes récupérations. RetroDB cite aussi RAWG avec un lien\n    dans la barre latérale, comme RAWG le demande.</li>\n  <li><strong>ES-DE garde sa place dans l'ordre de vos sources.</strong>\n    Quand ce n'était pas la source principale, les sources suivantes et\n    l'IA remplaçaient ses textes et ses jaquettes, et ses captures d'écran\n    étaient écartées. Elles sont maintenant conservées. ES-DE ne copie\n    plus ce qu'un jeu possède déjà et lit l'entrée du fichier ROM propre\n    au jeu. Les jeux PS3 en dossier trouvent leurs jaquettes ES-DE.\n    L'importation des logos de systèmes ne prend plus d'image sans\n    rapport. Une Récupération complète ne supprime plus une jaquette\n    qu'une autre source vient de télécharger.</li>\n  <li><strong>Revue des captures d'écran.</strong> Un nouvel outil dans\n    Outils ROM liste les captures d'écran ZX Spectrum, Commodore 64 et\n    Game Boy en commençant par les plus suspectes, et ne supprime que ce\n    que vous choisissez. La récupération refuse désormais une capture\n    d'écran Game Boy dont l'original a bien plus de nuances que la machine\n    ne pouvait en afficher. Sur les systèmes 8 bits et 16 bits, elle\n    n'ajoute plus de captures d'écran IGDB ou RAWG à un jeu sorti sur\n    plusieurs systèmes.</li>\n  <li><strong>La connexion à RetroAchievements est transmise à DuckStation et PCSX2</strong>\n    quand vous appuyez sur Jouer.</li>\n  <li><strong>Sur la page d'un jeu :</strong> les flèches gauche et droite\n    mènent au jeu précédent et au jeu suivant, la section Codes de triche\n    se replie et s'en souvient, les panneaux du bas s'adaptent à la\n    fenêtre, et l'émulateur est indiqué sur sa carte de Paramètres de\n    l'émulateur, et non à côté de Jouer.</li>\n  <li><strong>Importer une jaquette 3D</strong> se trouve maintenant dans\n    la fenêtre Modifier, à côté des autres images.</li>\n  <li><strong>Une fenêtre qui commence par une zone de texte,</strong>\n    comme Récupérer, place désormais le curseur dans cette zone au lieu\n    du bouton de fermeture.</li>\n</ul>\n"
