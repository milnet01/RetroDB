  body: |
    <ul>
      <li><strong>Cheats voor RetroArch (RetroDB), DuckStation en
        PCSX2.</strong> Instellingen &gt; Emulators heeft een nieuw onderdeel
        Cheats. Download daar de gratis openbare cheatpakketten, of importeer
        cheatmappen die je al hebt; RetroDB kopieert de bestanden en wijzigt
        je map nooit. De pagina van een game toont dan de cheats, elk met een
        aan/uit-schakelaar, en een zoekvak als het er veel zijn. In
        RetroArch (RetroDB) gelden de cheats die je aanzet vanaf de volgende
        keer dat je op Spelen drukt, en wijzigingen die je tijdens het spelen
        in het menu van RetroArch maakt, blijven bewaard. Voor DuckStation en
        PCSX2 worden de schakelaars opgeslagen in de eigen instellingen van de
        emulator voor die game, dus wijzigingen in de emulator zelf zie je ook
        op de pagina. RetroDB overschrijft nooit een cheatbestand dat een
        emulator al heeft. Een cheat die aan staat, pauzeert de hardcore-modus
        van RetroAchievements.</li>
      <li><strong>Importeer een Slipcase-3D-doos bij een game.</strong> De
        pagina van een game heeft onder de cover een knop 3D-doos importeren.
        Kies het <code>.box.json</code>-bestand dat Slipcase heeft opgeslagen,
        samen met de afbeeldingen, en RetroDB bewaart de voorkant, rug,
        achterkant en andere zijden van de doos bij die game. Je
        3D-boxartafbeelding blijft ongewijzigd. Bij een game die al zijden
        heeft, wordt eerst gevraagd of ze vervangen mogen worden, en
        Verwijderen wist ze.</li>
      <li><strong>Draai de 3D-doos van een game rond in je handen.</strong>
        Klik op de cover van een game met een geïmporteerde Slipcase-doos en
        de doos verschijnt in 3D. Sleep hem, of gebruik de pijltjestoetsen,
        om hem te draaien en de rug, achterkant, bovenkant en onderkant te
        zien. Scroll of druk op + en - om te zoomen; dubbelklik of druk op
        Home om hem terug te zetten. Een game zonder geïmporteerde doos zoomt
        nog steeds in op de coverafbeelding.</li>
      <li><strong>Instellingen linkt naar de pagina Emulators.</strong> De
        pagina Emulators had nergens in Instellingen een link, dus je kon er
        alleen komen door het adres in te typen. Beheerders zien nu een
        tabblad Emulators na Systeem, en de pagina Emulators toont dezelfde
        tabbalk, zodat de andere tabbladen één klik verwijderd zijn.</li>
      <li><strong>De coverzoom zit niet meer verstopt achter de
        menu's.</strong> Op een telefoon lagen de boven- en onderbalk over de
        ingezoomde cover en verborgen ze de sluitknop, en op een computer
        bedekte de zijbalk de linkerkant. De zoom opent nu boven alles.</li>
      <li><strong>Claude 5.5-modellen voor de AI.</strong> Instellingen &gt; Scrapen toont de nieuwste Claude-modellen van Anthropic: Haiku 5.5, de nieuwe standaard en de goedkoopste, Sonnet 5.5 en Opus 5.5, met hun huidige prijzen. RetroDB stuurt geen instelling meer die Sonnet 5.5 weigert.</li>
      <li><strong>Vul de verkoopcijfers van een game in.</strong> Beide bewerkschermen hebben een vak Verkochte exemplaren onder Ontwikkelaar. Een getal dat je invult, verschijnt op de gamepagina, net als een getal dat de AI vond. Maak het vak leeg om het te verwijderen.</li>
      <li><strong>Test je AI-sleutel in Instellingen.</strong> Instellingen &gt; Scrapen heeft een knop Opgeslagen AI-sleutel testen onder de AI-aanbieder. Die laat zien of de sleutel werkt en, zo niet, waarom: een geweigerde sleutel, geen tegoed of een gebruikslimiet. Eerder leek een geweigerde sleutel te werken.</li>
    </ul>
