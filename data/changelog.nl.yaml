  - type: fix
    label: Games met alleen een jaartal kunnen worden bewerkt en houden hun jaar
  body: |
    <ul>
      <li><strong>Zoek vanaf elke pagina naar elke game of console.</strong>
        Er staat nu een zoekvak onder je naam in de zijbalk. Typ twee of meer
        letters om overeenkomende consoles te zien en tot acht overeenkomende
        games, elk met zijn console. Klik op een resultaat, of kies het met de
        pijltjestoetsen en druk op Enter, om het te openen. "Alle resultaten
        bekijken" opent de Bibliotheek met die zoekopdracht. Druk op / om naar
        het vak te springen als een pagina geen eigen zoekvak heeft.</li>
      <li><strong>Makkelijker navigeren op een telefoon of tablet.</strong>
        Op een smal scherm staat bovenaan een balk met de menuknop en een
        zoekknop die het menu opent met de cursor al in het zoekvak. Een balk
        onderaan brengt je met één tik naar het Dashboard, de Bibliotheek,
        Systemen en Prestaties. Het menu is nu ondoorzichtig, zodat de pagina
        er niet meer doorheen schijnt. Tik ernaast of druk op Escape om het te
        sluiten. In vensters zo groot als een tablet ontbrak de menuknop,
        zodat het menu helemaal niet kon worden geopend; nu is hij er. Tab- en
        filterbalken die bij het scrollen in beeld blijven, stoppen net onder
        de bovenste balk, niet erachter.</li>
      <li><strong>Instellingen &gt; Emulators past op een telefoon.</strong> De
        tabellen waren breder dan een telefoon, zodat de knoppen Bewerken en
        Instellingen buiten het scherm vielen. Op een telefoon is elke rij nu
        een kaart met de knoppen erin.</li>
      <li><strong>De afbeeldingen van een game wissen laat geen losse
        bestanden meer achter.</strong> Als je de afbeeldingen van een game
        wiste terwijl RetroDB ze nog op de achtergrond verscherpte, kon het ze
        terugschrijven als bestanden die geen enkele game gebruikt. Het
        controleert dat nu eerst en slaat ze over. De teller "Afbeeldingen
        verbeteren" laat de gewiste game ook meteen vallen.</li>
      <li><strong>Titels die je typt, blijven behouden bij het
        scrapen.</strong> Een scrape, zelfs een Volledige herscrape, verving
        vroeger een titel die je in het bewerkvenster had getypt door de naam
        van de scraper. Nu blijft een titel die je wijzigt behouden. Een nieuw
        vakje "Deze titel behouden bij scrapen" onder de titel toont dit; vink
        het uit om scrapers de game weer te laten hernoemen. Resetten op de
        pagina van een game staat dat ook toe.</li>
      <li><strong>Officiële namen voor je games, door jou
        gecontroleerd.</strong> ROM-tools heeft een nieuwe pagina Officiële
        namen. Druk op "Vraag het de AI" voor één systeem of voor alle
        systemen, en de AI stelt voor elke game de volledige officiële naam
        voor zoals die is uitgebracht in de eigen regio van de ROM, zodat een
        Japanse Mega Man-ROM Rockman wordt. Je ziet elke oude en nieuwe naam
        naast elkaar, vinkt de namen aan die je wilt en accepteert ze. Er
        verandert niets tot je dat doet. De oude naam blijft bewaard als
        alternatieve titel, en een geaccepteerde naam blijft behouden bij het
        scrapen. Een afgewezen naam wordt niet opnieuw voorgesteld. Er is een
        AI-aanbieder nodig in Instellingen &gt; Scrapen.</li>
      <li><strong>Games met alleen een jaartal kunnen worden bewerkt en houden
        hun jaar.</strong> Veel games hebben alleen een jaartal als datum,
        zoals 1985. Op de pagina van een game weigerde het bewerkvenster ze op
        te slaan. In het bewerkvenster van de Bibliotheek wiste opslaan het
        jaar. Beide accepteren nu een jaar, een jaar en maand, of een volledige
        datum.</li>
    </ul>
