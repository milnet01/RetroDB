- version: 4.0.0
  date: '2026-11-09'
  tags:
  - type: performance
    label: RetroDB braucht im Leerlauf deutlich weniger Arbeitsspeicher. Der KI-Bildhochskalierer wird jetzt nur noch geladen, solange er wirklich skaliert, und zwar in einem Hilfsprozess, der sich zwei Minuten nach dem letzten Bild beendet. Ein ruhender Server sank dadurch von etwa 1,4 GB auf unter 100 MB. Stürzt der Grafiktreiber beim Hochskalieren ab, wird nur der Hilfsprozess beendet, nie der Server
    en: RetroDB uses far less memory while it waits. The AI image upscaler now loads only while it is upscaling, in a helper that closes two minutes after its last picture; an idle server dropped from about 1.4 GB to under 100 MB. If the graphics driver crashes during an upscale, only the helper stops, never the server
  - type: performance
    label: AI-Auffüllen mit Claude-Websuche kostet jetzt weniger. Claude liest die Suchergebnisse nach jeder Suche erneut; RetroDB bittet Anthropic nun, sie bereitzuhalten, und ein erneutes Lesen kostet dann nur noch ein Zehntel des Preises oder weniger
    en: AI Fill with Claude web search costs less. Claude reads the search results again after each search; RetroDB now asks Anthropic to keep them ready, and a re-read then costs a tenth of the price or less
  - type: fix
    label: 'Zulu und Xhosa lesen sich jetzt besser: 133 Zeilen, die etwas Falsches aussagten, wurden korrigiert, zum Beispiel „Edition“, das als „Kapitel“ angezeigt wurde, und „muss Text sein“, das als „muss ein Buchstabe sein“ angezeigt wurde. Jede Korrektur wurde von zwei getrennten KI-Prüfungen bestätigt'
    en: 'Zulu and Xhosa read better: 133 lines that said the wrong thing are corrected, such as "Edition" shown as "Chapter" and "must be text" shown as "must be a letter". Each correction was agreed by two separate AI checks'
  - type: fix
    label: Wenn ein Spiel nicht startet, erscheint die Meldung jetzt in deiner Sprache und nennt weiterhin den fehlerhaften Emulator, Core oder die fehlerhafte Datei. Ein Fehler im Computer selbst zeigt jetzt „Konnte nicht gestartet werden“ und den Namen des Programms an, die Details stehen im Server-Log, statt roher Systemtexte. Wird die Anmeldung bei RetroAchievements abgelehnt, erscheint der Grund von RetroAchievements in einem übersetzten Satz
    en: When a game will not start, the message is now in your language and still names the emulator, core or file at fault. A failure inside the computer itself now says "Could not start" and the program's name, with the details in the server log, instead of raw system text. A refused RetroAchievements sign-in shows RetroAchievements' own reason inside a translated sentence
  - type: fix
    label: Wenn du einen Scrape-, Sync- oder Bild-Auftrag abbrichst, der bereits beendet ist, wird sein hängengebliebenes Fortschrittsfenster jetzt geschlossen. Wenn du einen Auftrag startest, der schon läuft, wird der echte Grund angezeigt, zum Beispiel „Ein Scrape für SNES läuft bereits“, statt „Netzwerkfehler“. Fehler bei Controller-Bildern im Museum sagen jetzt, was schiefgelaufen ist, und wenn du den RetroAchievements-Sync eines anderen Benutzers abbrichst, wird gemeldet, dass er ihm gehört, statt so zu tun, als würde er abgebrochen
    en: Cancelling a scrape, sync or image job that has already finished now clears its stuck progress popup. Starting a job that is already running shows the real reason, such as "A scrape for SNES is already running", instead of "Network error". Controller image errors in the Museum now say what went wrong, and cancelling another user's RetroAchievements sync says it is theirs instead of pretending to cancel it
  - type: security
    label: Der Log-Viewer blendet jetzt auch in älteren Logdateien Passwörter und Schlüssel aus. Logs, die geschrieben wurden, bevor RetroDB ein bestimmtes Passwort verbergen konnte, etwa das von ScreenScraper, zeigten es beim Ansehen oder Herunterladen im Klartext
    en: The log viewer now hides passwords and keys in older log files too. Logs written before RetroDB learned to hide a particular password, such as ScreenScraper's, showed it in plain text when viewed or downloaded
  - type: security
    label: Wenn du alle Einstellungen auf die Standardwerte zurücksetzt, bleiben jetzt dein ROM-Ordner und die Tatsache erhalten, dass die Einrichtung abgeschlossen ist. Früher öffnete ein Zurücksetzen wieder die Seiten der Ersteinrichtung, die ohne Anmeldung funktionieren, bis ein Admin die Einrichtung erneut durchführte
    en: Resetting all settings to their defaults now keeps your ROM folder and the fact that setup is done. Before, a reset reopened the first-time setup pages, which work without signing in, until an admin ran setup again
  - type: feature
    label: Arcade-Spiele können wieder Achievements über RetroAchievements freischalten. RetroDB verknüpft ein Arcade-Spiel jetzt nur noch, wenn RetroAchievements seinen genauen Dateinamen kennt, etwa sf2 für Street Fighter II, und rät nicht mehr anhand von Titeln, wodurch das falsche Spiel verknüpft wurde. Deine Arcade-Spiele werden beim nächsten Aktualisieren ihrer RetroAchievements-Daten oder beim Scrapen verknüpft
    en: Arcade games can earn RetroAchievements again. RetroDB now links an arcade game only when RetroAchievements knows its exact file name, such as sf2 for Street Fighter II, so it no longer guesses from titles and links the wrong game. Your arcade games link the next time their RetroAchievements data is refreshed or they are scraped
  - type: fix
    label: Der PlayStation-Trophäen-Sync korrigiert jetzt Spielverknüpfungen, die er früher fälschlich erstellt hat, zum Beispiel viele Spiele, die mit einem fremden Spiel namens „D“ verknüpft waren. Eine Verknüpfung, die du selbst gesetzt hast, ändert ein Sync nie. Der nächste Sync prüft alle älteren Verknüpfungen erneut, daher können einige knappe Treffer entknüpft werden; verknüpfe diese dann von Hand neu
    en: PlayStation trophy sync now corrects game links it made wrongly before, such as many games linked to an unrelated game called "D". A link you set yourself is never changed by a sync. The next sync checks all older links again, so a few near matches may come unlinked; link those again by hand
  - type: fix
    label: Wenn du einen wartenden Massen-Scrape vor einen laufenden schiebst, wird das letzte Spiel des alten Scrapes nicht mehr zu den Zählern des neuen addiert. Wenn du in der Wunschliste auf „Alle scrapen“ klickst, während schon einer läuft, wird das jetzt gemeldet, statt zu behaupten, er sei gestartet
    en: Moving a waiting bulk scrape ahead of a running one no longer adds the old scrape's last game to the new one's counts. Clicking "Scrape all" on the wishlist while one is already running now says so, instead of claiming it started
  - type: accessibility
    label: 'Mit einem Screenreader sagt die Schaltfläche „läuft“ jetzt nur noch „1 Spiel läuft“, wenn sich die Anzahl ändert, statt alle paar Sekunden eine nackte Zahl vorzulesen. Ihre Liste öffnet sich als benanntes Fenster mit dem Cursor darin, ihre Schaltflächen „Beenden“ und „Nächste Disc“ nennen das jeweilige Spiel, und nach „Beenden“ springt der Cursor an eine sinnvolle Stelle. Jede Spielkarte in der Bibliothek lässt sich jetzt per Tastatur über ihren Titel öffnen, und ihre Filter-Schaltflächen sagen, wonach sie filtern, zum Beispiel „Filtern nach Entwickler: Konami“'
    en: 'With a screen reader, the "running" button now says "1 game running" only when the count changes, instead of reading a bare number every few seconds. Its list opens as a named window with the cursor inside, its Kill and Next disk buttons say which game they act on, and after Kill the cursor returns to a sensible place. Each game card in the library now opens with the keyboard from its title, and its filter buttons say what they filter, such as "Filter by Developer: Konami"'
  - type: feature
    label: Jedes Mitglied kann jetzt unter Einstellungen → Mein Profil seinen eigenen Steam-Schlüssel und seine Steam-ID hinterlegen und seine eigene Steam-Bibliothek und Achievements importieren. Bisher ging das nur als Admin
    en: Every member can now add their own Steam key and Steam ID under Settings → My Profile, and import their own Steam library and achievements. Until now only an admin could
  - type: fix
    label: Beim Speichern der Spieldetails wird eine leere Spielerzahl nicht mehr auf 1 gesetzt, und die von RetroDB ermittelten Altersfreigaben werden nicht mehr als von dir eingegeben markiert. AI-Auffüllen behält ein Spiel, das du als Exklusiv markiert hast, und behält jede Änderung, die du an einem Spiel machst, während es auf die Antwort der KI wartet. Der Verlauf eines Scrapes listet nur noch die Details auf, die er tatsächlich gespeichert hat
    en: Saving a game's details no longer sets an empty player count to 1, and no longer marks the age ratings RetroDB worked out for you as typed by you. AI Fill keeps a game you marked Exclusive, and keeps any change you make to a game while it is waiting for the AI's answer. A scrape's history now lists only the details it actually saved
  - type: fix
    label: Die Screenshot-Prüfung bricht nicht mehr auf halbem Weg ab, wenn ein gespeicherter Screenshot viel zu groß zum Öffnen ist; sie zählt das Bild als nicht lesbar und macht weiter. Das Inhaltsverzeichnis der Hilfeseite verweist jetzt auf Emulatoren und Spielen, und die Entwicklerhinweise zu Anmeldung, Hintergrundaufträgen, Scraping, Bildern, Updates und Fehlerantworten beschreiben jetzt, was das Programm wirklich tut
    en: Screenshot Review no longer stops halfway when one stored screenshot is far too large to open; it counts that picture as unreadable and carries on. The help page's contents list now links to Emulators and Playing, and the developer notes on sign-in, background jobs, scraping, pictures, updates and error replies now say what the program really does
  - type: fix
    label: Ein Editor, der einen ROM-Tools-Scan startet, kann ihn jetzt pausieren, fortsetzen oder abbrechen; Scans anderer Personen kann weiterhin nur ein Admin beenden. Tags und Listen weisen einen fehlenden Namen oder eine ungültige Farbe mit einer klaren Meldung statt einer Fehlerseite zurück, und ein Wunschlisten-Spiel auf ein anderes umzubenennen, das du dir schon wünschst, wird abgelehnt, genau wie beim Hinzufügen. RA-Daten löschen vergisst jetzt auch, ob deine Kopie Achievements bringt. Eine Trophäe, die RetroDB nicht mehr anbietet, zählt nicht mehr für deinen Sammlerrang. Windows-ROM-Pfade werden jetzt anhand des Dateinamens mit RetroAchievements-Spielen abgeglichen
    en: An editor who starts a ROM Tools scan can now pause, resume or cancel it; other people's scans stay an admin's to stop. Tags and lists refuse a missing name or a bad colour with a clear message instead of an error page, and renaming a wishlist game onto another one you already wish for is refused, as adding it is. Clear RA Data now also forgets whether your copy earns achievements. A trophy RetroDB no longer offers stops counting toward your collector rank. Windows ROM paths now match RetroAchievements games by file name
  - type: fix
    label: Wartungskorrekturen. Ein mehrteiliges Disc-Archiv, das sich nicht entpacken lässt, hinterlässt keinen halbfertigen Ordner mehr, der jeden erneuten Versuch blockiert. Speicher berechnen zählt jetzt jede Datei in einem PS3-Spielordner. Gescrapte Daten löschen entfernt Bilder nur, wenn du es verlangst. Ein Bibliotheks-Scan, der auf ein Spiel trifft, das ein anderer Scan gerade hinzugefügt hat, macht mit den übrigen Spielen dieser Konsole weiter
    en: Maintenance fixes. A multi-disc archive that fails to unpack no longer leaves a half-made folder behind that blocks every retry. Calculate Storage now counts every file inside a PS3 game folder. Clear Scraped Data deletes pictures only when you ask it to. A library scan that meets a game another scan has just added carries on with the rest of that console's games
  - type: fix
    label: Das Wiederherstellen einer Sicherung ist jetzt sicherer. Sie wird so in die Bibliotheksdatenbank geschrieben, wie es die Datenbank selbst erwartet, sodass ein Teil von RetroDB, der sie geöffnet hat, die wiederhergestellten Daten sieht, statt Schaden zu riskieren. Beim Löschen eines Spiels werden jetzt auch seine Box-Bilder sowie seine wartenden Bild- und Emulator-Einstellungs-Einträge gelöscht, sodass ein neues Spiel sie nie erben kann. Zwei Einstellungen, die gleichzeitig gespeichert werden, überschreiben sich nicht mehr
    en: Restoring a backup is safer. It is now written into the library database the way the database itself expects, so a part of RetroDB that has it open sees the restored data instead of risking damage. Deleting a game now also deletes its box pictures and its waiting picture and emulator-setting entries, so a new game can never inherit them. Two settings saved at the same moment no longer lose one of them
  - type: fix
    label: Bildkorrekturen. GIFs werden nicht mehr durch den Hochskalierer geschickt, nur um dann verworfen zu werden. Das Hochskalierer-Modell wird anhand seines veröffentlichten Fingerabdrucks geprüft, und ein fehlerhafter Download wird erneut geladen, statt das Hochskalieren dauerhaft abzuschalten. Logos und Bilder mit durchsichtigen Teilen behalten beim Vergrößern ihre Transparenz. In WebP umwandeln erfasst jetzt auch Rückseiten und Logos und lehnt eine große Bibliothek nicht mehr wegen unnötig verlangtem Platz ab. Zwei Seiten einer Box-Datei können sich ein Bild teilen, und das Entfernen einer Box mit beschädigtem Eintrag entfernt auch ihre Bilder
    en: Picture fixes. GIFs are no longer run through the upscaler only to be thrown away. The upscaler model is checked against its published fingerprint, and a bad download is fetched again instead of turning upscaling off for good. Logos and pictures with see-through parts keep their transparency when enlarged. Convert to WebP now takes back covers and logos too, and no longer refuses a large library for want of room it does not need. Two faces of a box file can share one picture, and removing a box with a damaged record removes its pictures
  - type: fix
    label: Importe aus CLZ, Steam, Xbox und PlayStation behandeln nicht mehr jeden Titel, der nur auf Japanisch oder in einer anderen nicht-lateinischen Schrift geschrieben ist, als dasselbe Spiel und fügen kein Spiel ohne ID mehr hinzu. Die CLZ-Vorschau fügt keine Konsolen mehr hinzu, bevor du den Import bestätigst, und ein Betrachter, der eine Steam-, Xbox- oder PlayStation-Bibliothek ansieht, fügt sie ebenfalls nicht mehr hinzu. Bei einem Steam-Spiel, das aus dem Store entfernt wurde, wird nur einmal nachgefragt, nicht bei jedem Sync
    en: Imports from CLZ, Steam, Xbox and PlayStation no longer treat every title written only in Japanese or another non-Latin script as the same game, and no longer add a game with no id. The CLZ preview no longer adds consoles before you confirm the import, and a viewer looking at a Steam, Xbox or PlayStation library no longer adds them either. A Steam game removed from the store is asked about once, not on every sync
  - type: fix
    label: Die Analyse ordnet jetzt viel mehr Konsolen ihrem Hersteller zu statt unter „Andere“, und die Liste „Zuletzt gescrapt“ im Dashboard zeigt auch ein Spiel, das du erneut gescrapt hast, nicht nur neu hinzugefügte Spiele
    en: Analytics now groups many more consoles under their maker instead of "Other", and the dashboard's Recently Scraped list shows a game you scraped again, not only newly added games
  - type: fix
    label: Controller-Bilder, die du im Museum hinzufügst, bleiben erhalten, wenn die Standalone-Version aktualisiert wird. Wenn ein Online-Dienst an seinem Limit pausiert, wird die Zeit der nächsten Anfrage in deiner eigenen Zeitzone angezeigt
    en: Controller pictures you add in the Museum are kept when the standalone version updates. When an online service pauses at its limit, the time it will be asked again is shown in your own time zone
  - type: fix
    label: Eine Bonus-Disc kann nicht mehr mit sich selbst oder mit einer anderen Bonus-Disc verknüpft werden, und die automatische Verknüpfung verknüpft eine Disc nicht mehr mit einer, die sie im selben Durchlauf als Bonus-Disc markiert
    en: A bonus disc can no longer be linked to itself or to another bonus disc, and Auto-link no longer links a disc to one it marks as a bonus disc in the same run
  - type: fix
    label: Die Bibliotheks- und Konsolenseiten zählen Arcade-BIOS-Dateien nicht mehr als Spiele, weder in den Summen noch in der Buchstabenleiste. Ähnliche Spiele und die Liste, die du durch Klicken auf ein Genre oder einen Publisher auf der Seite eines Spiels erhältst, zeigen nicht mehr die eigenen regionalen Versionen, Bonus-Discs oder BIOS-Dateien des Spiels
    en: The Library and console pages no longer count arcade BIOS files as games, in their totals or the letter bar. Similar games, and the list you get by clicking a genre or publisher on a game's page, no longer show the game's own regional versions, bonus discs or BIOS files
  - type: fix
    label: Alle auswählen weist jetzt darauf hin, wenn eine sehr große Liste gekürzt wird, statt stillschweigend nur einen Teil auszuwählen
    en: Select all now says so when a very large list is cut short, instead of quietly selecting only part of it
  - type: fix
    label: Bibliothekskarten werden jetzt aktualisiert, wenn sich dein Achievement- oder Trophäenfortschritt ändert und wenn ein Spiel spielbar wird oder nicht mehr spielbar ist
    en: Library cards now update when your achievement or trophy progress changes, and when a game becomes playable or stops being playable
  - type: fix
    label: Die Massenbearbeitung kann bei einer fehlerhaften Auswahl nicht mehr die falschen Spiele ändern, und eine fehlgeschlagene Massenbearbeitung markiert die Spiele nicht mehr als von dir bearbeitet
    en: Bulk edit can no longer change the wrong games when it is sent a bad selection, and a bulk edit that fails no longer marks the games as edited by you
  - type: fix
    label: Ein HowLongToBeat-Treffer, der nur zu 1 % passt, wird nicht mehr als 100 % Übereinstimmung angezeigt, und eine Seite, die nicht lädt, zeigt die Fehlerseite statt des rohen Fehlertextes
    en: A HowLongToBeat match that is only a 1% fit is no longer shown as a 100% match, and a page that fails to load shows the error page instead of the raw error text
  - type: security
    label: Wenn du dein Passwort änderst oder ein Admin es zurücksetzt, wird dieses Konto auf allen anderen Geräten abgemeldet. Deshalb melden sich nach diesem Update alle einmal neu an. Die Einrichtungsseite beim ersten Start erhält außerdem denselben Schutz vor anderen Websites wie jede andere Seite
    en: Changing your password, or an admin resetting it, now signs that account out on every other device. Because of this, everyone signs in once more after this update. The first-run setup page also gets the same protection against other websites as every other page
  - type: fix
    label: Ein Bild, das als Avatar abgelehnt wird, löscht nicht mehr den Avatar, den du hattest
    en: A picture that is refused as your avatar no longer deletes the avatar you had
  - type: fix
    label: Scrapes gehen schonender mit den Online-Diensten um. Ein Dienst, der immer wieder fehlschlägt, wird beim Füllen von Lücken eine Weile übersprungen, wie es bei Suchen schon der Fall war, und Spielabfragen bei ScreenScraper beachten jetzt auch dessen Tageslimits
    en: Scrapes are gentler on the online services. A service that keeps failing is skipped for a while when filling gaps, as it already was in searches, and ScreenScraper game lookups now respect its daily limits too
  - type: fix
    label: Ein Scrape schlägt bei einem Spiel mit unbekanntem Erscheinungsjahr, etwa „TBA“, nicht mehr fehl, und ein Spiel, das für Regionen außerhalb deiner Liste erscheint, etwa „Brasilien, Korea“, behält seine Region, statt zu deiner Standardregion zu werden
    en: A scrape no longer fails on a game whose release year is unknown, such as "TBA", and a game listed for regions outside your list, such as "Brazil, Korea", keeps its region instead of becoming your default
  - type: fix
    label: ES-DE-Ordner, die mit ~/ geschrieben sind, funktionieren jetzt, und eine sehr große ES-DE-Datei wird nicht mehr kopiert. Vorgeschlagene regionale Versionen führen nie wieder zwei Spiele zusammen, von denen du gesagt hast, dass sie keine Versionen voneinander sind
    en: ES-DE folders written as ~/ now work, and a very large ES-DE file is no longer copied. Suggested regional versions never put back together two games you said are not versions of each other
  - type: security
    label: RetroDB lehnt beim Abrufen von Bildern aus dem Web noch ein paar weitere private Netzwerkadressen ab und folgt der Weiterleitung einer Webadresse korrekt
    en: RetroDB refuses a few more private network addresses when fetching pictures from the web, and follows a web address's redirect correctly
  - type: fix
    label: Die letzten Bildschirme, die noch auf Englisch waren, folgen jetzt auch deiner Sprache, darunter der Einrichtungsassistent, Tags, Listen, Spiele vergleichen, die ROM-Tools-Einstellungen, die Massen-Scrape-Warteschlange, die Liste unterbrochener Aufträge im Dashboard, die Beschriftungen der Bibliothekskarten und viele Fehlermeldungen
    en: The last screens still in English now follow your language too, including the setup wizard, Tags, Lists, Compare Games, ROM Tools settings, the bulk scrape queue, the dashboard's interrupted-jobs list, the library card labels and many error messages
  - type: security
    label: Ein Systemname, der Webcode enthält, kann diesen im Fenster der Massen-Scrape-Warteschlange nicht mehr ausführen
    en: A system name holding web code can no longer run it in the bulk scrape queue window
  - type: accessibility
    label: Egal wo du auf einer Seite bist, die Position der Tastatur wird jetzt mit einem kräftigen Ring in der Farbe deines Designs markiert, bei jeder Schaltfläche, jedem Feld und jedem Link. Vorher zeigten viele Bedienelemente nur eine schwache Linie, dieselbe wie beim Darüberfahren mit der Maus
    en: Wherever you are on a page, the keyboard's place is now marked with a bold ring in your theme's colour, on every button, box and link. Before, many controls showed only a faint line, the same as when the mouse passed over them
  - type: accessibility
    label: Die Links zu Genre, Serie, Entwickler und Publisher auf Bibliothekskarten funktionieren jetzt per Tastatur. Auch die Schaltfläche „läuft“ für laufende Spiele lässt sich per Tastatur öffnen, und Esc oder ein Klick woanders schließt ihre Liste
    en: The Genre, Series, Developer and Publisher links on library cards now work from the keyboard. The "running" button for games in play opens from the keyboard too, and Esc or a click elsewhere closes its list
  - type: accessibility
    label: Screenreader nennen jetzt jede Tag-Farbe und sagen, welche gewählt ist, und lesen Trophäenbilder als Platin, Gold, Silber und Bronze statt als einzelne Buchstaben vor. Während ein Spiel startet, springt Tab nicht mehr hinter den Startbildschirm
    en: Screen readers now name each tag colour and say which one is chosen, and read trophy pictures as Platinum, Gold, Silver and Bronze instead of single letters. While a game starts, Tab no longer moves behind the starting screen
  - type: fix
    label: Wenn ein Update abbricht, bevor es mit dem Austauschen der Dateien beginnt, startet RetroDB jetzt wieder die bisherige Version, statt geschlossen zu bleiben
    en: If an update stops before it starts swapping files, RetroDB now starts the version you had again, instead of staying closed
  - type: fix
    label: Wenn du zweimal gleichzeitig auf Spielen drückst, können nicht mehr zwei Spiele im eingebauten Player starten. Das Warten auf einen Core-Download gibt jetzt nach einer Weile auf oder wenn RetroDB nicht mehr antwortet, statt ewig zu warten, und die Frage „läuft bereits“ nutzt den eigenen Dialog von RetroDB
    en: Pressing Play twice at once can no longer start two games on the built-in player. Waiting for a core download now gives up after a while, or when RetroDB stops answering, instead of waiting forever, and the "already running" question uses RetroDB's own dialog
  - type: fix
    label: Cheats, die du während des Spielens ein- oder ausschaltest, werden für das richtige Spiel gespeichert und nie von einem anderen Spiel übernommen, dessen Datei denselben Namen hat. Ein Cheat-Problem verhindert nie, dass ein Spiel startet
    en: Cheats you switch on or off during play are kept for the right game, never taken from another game whose file has the same name. A cheat problem never stops a game starting
  - type: fix
    label: RetroDB schreibt die Einstellungsdatei eines Emulators jetzt sicherer. Eine Einstellungsdatei, die ein Link ist, bleibt ein Link, behält ihre Berechtigungen und behält Zeichen, die sie nicht lesen kann, und ein fehlgeschlagenes Speichern hinterlässt keine überflüssige Datei
    en: RetroDB writes an emulator's settings file more safely. A settings file that is a link stays a link, keeps its permissions, and keeps letters it cannot read, and a failed save leaves no stray file behind
  - type: fix
    label: Ein Massen-Scrape, den du in der Warteschlange nach hinten schiebst, mit einem anderen tauschst oder fortsetzt, während einer läuft, geht beim Neustart von RetroDB nicht mehr verloren; das Dashboard bietet ihn an, ab der Stelle, an der er aufgehört hat. Ein ausgetauschter Scrape läuft nicht mehr neben dem neuen weiter, und zwei schnelle Klicks auf Fortsetzen starten einen Auftrag nur einmal
    en: A bulk scrape you move down the queue, swap with another or resume while one runs is no longer lost when RetroDB restarts; the dashboard offers it, from where it stopped. A swapped-out scrape no longer keeps running beside the new one, and two quick clicks on Resume start a job once
  - type: fix
    label: Der Fehler eines einzelnen Spiels, etwa ein Netzwerkabbruch, beendet nicht mehr einen ganzen Lauf von AI-Auffüllen oder von „Box und Handbuch-Regionen korrigieren“; dieses Spiel zählt als fehlgeschlagen und die übrigen werden weiter bearbeitet. Wenn du RetroDB beendest, werden jetzt auch Core-Downloads sauber gestoppt
    en: One game's error, such as the network dropping, no longer ends a whole AI Fill run or a Fix Box and Manual Regions run; that game counts as failed and the rest go on. Stopping RetroDB now also stops core downloads cleanly
  - type: fix
    label: Einträge der Wunschliste bleiben nach einem Fehler oder einem Neustart nicht mehr für immer bei „Scrapen“ hängen, und zwei Läufe von „Alle scrapen“ für dieselbe Wunschliste laufen nicht mehr gleichzeitig
    en: Wishlist items no longer stay on "scraping" forever after an error or a restart, and two Scrape All runs for the same wishlist no longer run at once
  - type: fix
    label: Ein Skript oder eine zweite RetroDB-Instanz beim Start markiert die Aufgaben des laufenden Servers nicht mehr als unterbrochen, und zwei gleichzeitig startende Instanzen können die Datenbank nicht mehr auf eine ältere Version zurücksetzen
    en: A script or a second copy of RetroDB starting up no longer marks the running server's jobs as interrupted, and two copies starting at once can no longer set the database back a version
  - type: fix
    label: Der Start einer PlayStation-Synchronisierung lässt die Fortschrittsbalken aller anderen nicht mehr warten, während die Anmeldung bei Sony läuft. Der tägliche PlayStation-Keep-alive erneuert die Anmeldung nur noch kurz vor Ablauf der 10 Tage statt jeden Tag
    en: Starting a PlayStation sync no longer makes everyone's progress bars wait while it signs in to Sony. The daily PlayStation keep-alive now renews a sign-in only near the end of its 10 days, instead of every day
  - type: fix
    label: Ein Scrapen überschreibt keine Änderung mehr, die du währenddessen machst, und leert kein Genre, keinen Modus und keine Ansicht, für die es keinen Namen kennt. Eine gespeicherte Spielerzahl wird nicht mehr an die Modi des Spiels angepasst
    en: A scrape no longer writes over a change you make while it runs, and no longer empties a genre, mode or view it has no name for. It no longer changes a stored player count to match the game's modes
  - type: fix
    label: AI-Auffüllen ändert nicht mehr, was du selbst eingegeben hast, etwa einen von Hand korrigierten Publisher oder ein korrigiertes Genre; es korrigiert nur gescrapte Werte. Ein Wert wird nicht mehr als geändert gemeldet, wenn er nur anders geschrieben wurde, etwa 4 Spieler als „1-4“ oder dieselben Genres in anderer Reihenfolge
    en: AI Fill no longer changes what you typed yourself, such as a publisher or genre you corrected by hand; it corrects only scraped values. It no longer reports a value as changed when it only wrote it differently, such as 4 players as "1-4" or the same genres in another order
  - type: fix
    label: Ein Controller, den du für ein Spiel eingibst, bleibt erhalten; der Standard-Controller der Konsole ersetzt jetzt nur gescrapte und KI-Werte. Eine Altersfreigabe, die aus der KI-Vermutung eines anderen Systems umgerechnet wurde, wird jetzt ebenfalls als Vermutung markiert
    en: A controller you type for a game is kept; the console's default controller now replaces only scraped and AI values. An age rating converted from another board's AI guess is now marked as a guess too
  - type: fix
    label: Das Speichern im Bearbeiten-Fenster eines Spiels leert keine Felder mehr, die das Fenster nicht zeigt. Zurücksetzen auf der Seite eines Spiels löscht jetzt alles, was angegeben ist, auch Ansicht, Edition und andere Namen, löscht die Bilder und Videos des Spiels, sofern kein anderes Spiel sie nutzt, und aktualisiert die Filter der Bibliothek sofort
    en: Saving a game's edit window no longer empties fields the window does not show. Reset on a game's page now clears everything it says it does, including the view, edition and other names, deletes the game's pictures and videos unless another game uses them, and updates the library filters straight away
  - type: fix
    label: „Gescrapte Daten löschen“ leert jetzt auch Ansicht, 2D oder 3D, und Spielstruktur. Ein CLZ-Import eines Spiels mit nur einer Jahreszahl behält nur das Jahr, nicht den 1. Januar
    en: Clear Scraped Data now also clears the view, 2D or 3D, and game structure. A CLZ import of a game with only a year keeps just the year, not 1 January
  - type: security
    label: Die Steam-Synchronisierung nutzt den Steam-Schlüssel aus den Einstellungen nicht mehr für jedes Haushaltsmitglied. Ein Mitglied ohne eigenen Steam-Schlüssel bekam die Steam-Bibliothek und Achievements des Admins in seinem Konto. Der Schlüssel in den Einstellungen gilt jetzt nur noch für Admins
    en: Steam sync no longer borrows the Steam key from Settings for every household member. A member with no Steam key of their own was getting the admin's Steam library and achievements under their account. The key in Settings now serves admins only
  - type: fix
    label: Die Suche von How Long to Beat für viele Spiele speichert jetzt die Zeiten, bei denen sie sicher ist. Früher schlug jeder sichere Treffer fehl und nichts wurde gespeichert. Die Aktualisierung von RetroAchievements prüft jetzt auch die Datei jedes Spiels anhand der Liste von RetroAchievements, wie es ein Scrapen tut, sodass ein Spiel mit genau der Version verknüpft wird, die du hast
    en: How Long to Beat's lookup for many games now saves the times it is sure of. Before, every sure match failed and nothing was saved. RetroAchievements Refresh now also checks each game's file against RetroAchievements' list, as a scrape does, so a game is linked to the exact version you have
  - type: fix
    label: Die Meldung, dass eine Hintergrundaufgabe beendet ist, erscheint wieder, und das Fortschrittsfeld einer Aufgabe bemerkt, wenn der Server sie nach einem Neustart wieder aufnimmt. Früher erschien beides nie
    en: The message that a background job has finished shows again, and a job's progress box notices when the server picks the job up after a restart. Before, neither ever appeared
  - type: fix
    label: 'PlayStation-Trophäen: Ein von Hand verknüpftes Spiel bleibt nach einer vollständigen Synchronisierung verknüpft, und eine Synchronisierung verknüpft ein Spiel nicht mehr mit seinem Nachfolger, etwa „Doom“ mit „Doom Eternal“. Der Import von PlayStation-Spielen verknüpft jetzt ein Spiel, das schon in deiner Bibliothek ist, wie bei Steam und Xbox, sodass seine Trophäen dort erscheinen'
    en: 'PlayStation trophies: a game you linked by hand stays linked after a full sync, and a sync no longer links a game to its sequel, such as "Doom" to "Doom Eternal". Importing PlayStation games now links a game already in your library, as Steam and Xbox imports do, so its trophies show on it'
  - type: fix
    label: Xbox zeigt deinen Gamertag nach der automatischen Erneuerung der Anmeldung nicht mehr als Unbekannt an, und eine langsame oder fehlgeschlagene Verbindung meldet dich nicht mehr von Xbox ab. Das passiert nur noch, wenn Microsoft die Anmeldung ablehnt
    en: Xbox no longer shows your gamertag as Unknown after its sign-in renews itself, and a slow or failed connection no longer signs you out of Xbox. Only Microsoft refusing the sign-in does that
  - type: fix
    label: Zwei Personen können jetzt jeweils einen Tag mit demselben Namen haben; früher schlug der zweite mit einem Fehler fehl. Jeder angemeldete Benutzer kann jetzt seine eigenen RPCS3-Trophäen neu einlesen; früher ging das nur als Admin, und alle anderen sahen alte Trophäen, bis RetroDB neu startete
    en: Two people can now each have a tag of the same name; before, the second one failed with an error. Any signed-in user can now rescan their own RPCS3 trophies; before, only an admin could, and everyone else saw old trophies until RetroDB restarted
  - type: security
    label: Deine Anmeldungen bleiben privat. Datenbanksicherungen können nicht mehr von anderen Konten auf dem Computer gelesen werden, und eine fehlgeschlagene Sicherung löscht nicht mehr die vorherige. Das Löschen oder Deaktivieren eines Benutzers meldet ihn auch von RetroAchievements in DuckStation und PCSX2 ab. Eine RetroAchievements-Anmeldung, die im eigenen Menü des Spielers gespeichert wurde, wird nicht mehr an die nächste Person weitergegeben, die spielt. Protokolle und gespeicherte Aufgabenfehler verbergen RetroAchievements-Tokens, der PlayStation-Fehler eines anderen Mitglieds wird nur ihm angezeigt, und alte PlayStation- und Xbox-Anmeldedateien im Klartext werden entfernt
    en: Your sign-ins stay private. Database backups can no longer be read by other accounts on the computer, and a failed backup no longer deletes the one before it. Deleting or switching off a user also signs them out of RetroAchievements in DuckStation and PCSX2. A RetroAchievements sign-in saved from the player's own menu no longer carries over to the next person who plays. Logs and saved job errors hide RetroAchievements tokens, another member's PlayStation error is shown only to them, and old plain-text PlayStation and Xbox sign-in files are removed
  - type: fix
    label: Die eigenen Prüfungen von RetroDB können deine Bibliothek während der Ausführung nicht mehr berühren. Sie nutzen immer eine Wegwerfkopie von Datenbank, Bildern und Einstellungen und starten nicht, wenn eines davon auf deine echten Dateien zeigt
    en: RetroDB's own checks can no longer touch your library while they run. They always use a throwaway copy of the database, pictures and settings, and refuse to start if any of them points at your real files
  - type: fix
    label: Verwaiste Dateien bereinigen löscht die Bilder deiner Wunschliste nicht mehr. Das Öffnen eines Spiels lässt es keine Screenshots mehr vergessen, die es nicht findet. Früher verlor bei abgetrenntem Bilderlaufwerk jedes geöffnete Spiel seine ganze Screenshot-Liste; jetzt bleibt die Liste erhalten, und ein fehlendes Bild wird nur ausgeblendet
    en: Clean orphaned files no longer deletes your wishlist's pictures. Opening a game no longer makes it forget screenshots it cannot find. Before, with the picture drive unplugged, every game you opened lost its whole screenshot list; now the list is kept, and a missing picture is only hidden
  - type: fix
    label: Ein Video- oder Handbuch-Download, der zwischendurch fehlschlägt, beschädigt die vorhandene Kopie des Spiels nicht mehr, und ein fehlgeschlagener Download hinterlässt keine versteckte halbe Datei im Medienordner. Der Upscaler im Hintergrund überschreibt kein neueres, zwischenzeitlich heruntergeladenes Bild mehr mit einem alten. „In WebP umwandeln“ lässt alle Spiele, die sich ein Bild teilen, darauf verweisen und berührt nie eine Datei außerhalb der Bilderordner
    en: A video or manual download that fails part-way no longer damages the copy the game already had, and a failed download no longer leaves a hidden half-file in the media folder. The background upscaler no longer saves an old picture over a newer one downloaded meanwhile. Convert to WebP keeps every game that shares a picture pointing at it, and never touches a file outside the picture folders
  - type: fix
    label: Das Löschen eines Spiels oder Wunschlisten-Eintrags löscht jetzt auch dessen Bilder, Videos und Handbücher, behält aber alles, was ein anderes Spiel oder ein anderer Eintrag noch nutzt. Gespeicherte Bilder können wieder von anderen Konten auf dem Computer gelesen werden, und „Bilder verkleinern“ zählt ein Bild, das nicht gespeichert werden konnte, als fehlgeschlagen und nicht als erledigt
    en: Deleting a game or a wishlist item now deletes its pictures, videos and manuals too, but keeps any another game or wishlist item still uses. Saved pictures can be read by other accounts on the computer again, and Resize Images counts a picture it could not save as failed, not as done
  - type: fix
    label: Der Duplikate-Finder bietet keine funktionierende Datei mehr zum Löschen an. Bei der Suche nach Namen hält er die .cue- und .bin-Kopien eines Spiels nicht mehr für Duplikate voneinander. Er bietet nie die Track-Datei einer Disc an, die sich zwei Versionen eines Spiels teilen können. Er löscht keine Disc, die in einer Playlist steht. Ein Spiel, dessen Datei du löschst, wechselt zur Kopie, die du behältst, und bleibt so in der Bibliothek
    en: Duplicate Finder no longer offers a working file for deletion. Looking by name, it no longer calls a game's .cue and .bin copies of each other. It never offers a disc's track file, which two versions of a game can share. It will not delete a disc that a playlist lists. A game whose file you delete now moves to the copy you keep, so it stays in the library
  - type: fix
    label: „Multi-Disc organisieren“ überschreibt keine vorhandene Playlist und keine Datei, die schon im Ordner des Spiels liegt; es hält an und nennt die Datei. Die erstellte Playlist führt die .cue jeder Disc auf, nicht ihre Track-Dateien. Spiele, deren Dateien verschoben werden, folgen ihnen jetzt in den Ordner, sodass „Fehlende ROMs bereinigen“ sie nicht mehr entfernt
    en: Organize Multi-Disc no longer writes over an existing playlist or a file already in the game's folder; it stops and says which. The playlist it makes lists each disc's .cue, not its track files. Games whose files it moves now follow them into the folder, so Clean missing ROMs no longer removes them
  - type: fix
    label: Die Umwandlung in CHD mit „Originale löschen“ löscht jetzt auch die Track-Dateien der Disc, behält aber einen Track, den eine andere .cue noch nutzt. Das Spiel und jede Playlist, die die alte Disc aufführte, zeigen jetzt auf die neue .chd. Das Umbenennen der Datei eines Spiels aktualisiert jetzt die Playlist, die sie aufführt, und eine Track-Datei, die eine .cue braucht, kann nicht umbenannt werden. Das Entfernen von Dateien aus einer ZIP entfernt nur die gewählten Dateien, auch wenn ein Name [ oder ] enthält. Die Screenshot-Bereinigung löscht nur die Kopien, die ihr Scan gefunden hat, und behält immer eine
    en: Converting to CHD with "delete originals" now deletes the disc's track files too, but keeps a track another .cue still uses. The game and any playlist that listed the old disc now point at the new .chd. Renaming a game's file now updates the playlist that lists it, and a track file a .cue needs cannot be renamed. Removing files from a zip removes only the files you picked, even when a name holds [ or ]. Screenshot Dedup deletes only the copies its scan found, and always keeps one
  - type: fix
    label: How Long to Beat auf der Seite eines Spiels sucht nach dem, was du eingibst. Früher suchte es bei einem nicht gefundenen Titel stattdessen nach den anderen Namen des Spiels und konnte ein anderes Spiel anbieten, etwa ein Fan-Remake. Es probiert die anderen Namen weiterhin, wenn das Feld den eigenen Namen des Spiels enthält
    en: How Long to Beat on a game's page searches for what you type. Before, a title it could not find made it search the game's other names instead, and it could offer a different game, such as a fan remake. It still tries the other names when the box holds the game's own name
  - type: fix
    label: Die Schritte zu How Long to Beat im Handbuch passen jetzt zur Anzeige. Dort stand, man solle einen Treffer aus einer Liste wählen; die Seite zeigt einen Treffer mit Speichern und Abbrechen. Die PlayStation-Hilfe sagt nicht mehr, die Anmeldung halte etwa zwei Monate, da RetroDB sich selbst neu anmeldet. Alle 20 übersetzten Handbücher enthalten beide Änderungen
    en: The help manual's How Long to Beat steps match the screen. They said to pick a match from a list; the page shows one match with Save and Cancel. The PlayStation help no longer says the sign-in lasts about two months, since RetroDB signs in again by itself. All 20 translated manuals carry both changes
  - type: fix
    label: Jede Buchstabenleiste beginnt jetzt mit einer Schaltfläche „Alle“. Auf den Seiten Bibliothek, Konsole und PSN-Trophäen zeigt die Wahl eines Buchstabens nur die Spiele mit diesem Buchstaben, und früher gab es keine Schaltfläche, um den Rest zurückzuholen. Auf den anderen Achievement-Seiten springt „Alle“ zum ersten Spiel
    en: Every letter bar now starts with an All button. On the Library, console and PSN Trophies pages, picking a letter shows only that letter's games, and before there was no button to bring the rest back. On the other achievement pages, All goes back to the first game
  - type: fix
    label: Ein neues PlayStation-Anmelde-Token, das du in den Einstellungen einfügst, wird jetzt sofort verwendet. Früher nutzte RetroDB die alte Anmeldung weiter, bis sie ablief, und „Speichern & Verbindung testen“ meldete diese alte Anmeldung als funktionierend. Ein Token, das Sony ablehnt, ersetzt kein funktionierendes mehr
    en: A new PlayStation sign-in token you paste in Settings is now used straight away. Before, RetroDB kept using the old sign-in until it ran out, and Save & Test Connection reported that old sign-in as working. A token Sony refuses no longer replaces one that works
  - type: enhancement
    label: 'Die PlayStation-Anmeldung in den Einstellungen lässt sich leichter am Laufen halten. Das Banner zählt keine Tage mehr herunter, an denen du nichts tun musstest, weil RetroDB sich selbst neu anmeldet; es wird nur rot, wenn Sony dein gespeichertes Token ablehnt. Die Schaltfläche „Hier einfügen“ lässt den Browser nicht mehr um Zugriff auf die Zwischenablage bitten: Sie setzt den Cursor ins Feld für Strg+V. Die Schritte sagen jetzt, dass du dich zuerst von PlayStation abmelden sollst, wenn du ein noch funktionierendes Token ersetzt, und ihre Meldungen können übersetzt werden'
    en: 'The PlayStation sign-in in Settings is easier to keep going. The banner no longer counts down days you never had to act on, because RetroDB signs in again by itself; it turns red only when Sony refuses your saved token. The Paste here button no longer makes the browser ask to read your clipboard: it puts the cursor in the box for Ctrl+V. The steps now say to sign out of PlayStation first when you replace a token that still works, and their messages can be translated'
  - type: enhancement
    label: Pop-up-Meldungen und Rückfragen, etwa „Einstellungen gespeichert“ oder „Diese Liste löschen?“, können jetzt auf jeder Seite übersetzt werden. Früher blieben die meisten unabhängig von der gewählten Sprache auf Englisch
    en: Pop-up messages and question boxes, such as "Settings saved" or "Delete this list?", can now be translated on every page. Before, most of them stayed in English whatever language you chose
  - type: enhancement
    label: Die Meldungen, die erklären, warum eine PlayStation-Anmeldung fehlgeschlagen ist, etwa „Dein NPSSO ist möglicherweise abgelaufen“, können jetzt übersetzt werden
    en: The messages that say why a PlayStation sign-in failed, such as "Your NPSSO may have expired", can now be translated
  - type: fix
    label: Das Handbuch in jeder Sprache entspricht jetzt dem englischen. Es enthält neu „Überall suchen“, „Titel behalten“, „MAME-Namen“ und die Rückseite der Box, und ältere Absätze, die veraltet waren, sind aktualisiert
    en: The help manual in every language now matches the English one. It gains Search Anywhere, Keeping a Title, MAME Names and the back of the box, and older paragraphs that had fallen behind are up to date
  - type: fix
    label: In Deutsch, Afrikaans und Spanisch heißt die Schaltfläche „Zurück“ auf dem Cover eines Spiels jetzt „Rückseite der Box“ und nicht mehr „zurückgehen“
    en: In German, Afrikaans and Spanish, the Back button on a game's cover now says the back of the box, not "go back"
  - type: feature
    label: Beim Drücken von Spielen füllt jetzt das Logo des Spiels auf seinem Hintergrundbild den Bildschirm, während das Spiel startet, oder sein Name in großen Buchstaben, wenn es kein Logo hat. Es verschwindet von selbst, wenn sich das Fenster des Spiels öffnet, oder wenn du Esc drückst oder klickst
    en: Pressing Play now fills the screen with the game's logo on its background picture while the game starts, or its name in large letters when it has no logo. It goes away by itself when the game's window opens, or when you press Esc or click
  - type: feature
    label: 'Die drehbare 3D-Box hat jetzt die echte Form einer PS5-Hülle: abgerundete Ecken und Kanten, den erhöhten Rand um das Cover, die Linie, an der die beiden Hälften zusammentreffen, und die Fingerkerbe an der Öffnungsseite. Dafür braucht es eine Box-Datei aus einer Slipcase-Version, die die Form schreibt; importiere die Box erneut, um sie zu erhalten. Andere Boxen sehen aus wie bisher'
    en: 'The turnable 3D box now has the real shape of a PS5 case: rounded corners and edges, the raised lip round the cover, the line where the two halves meet, and the finger slot in the opening side. It needs a box file from a Slipcase version that writes the shape; import the box again to get it. Other boxes look as before'
  - type: enhancement
    label: „RetroAchievements aktualisieren“ wurde von den Einstellungen auf die Seite RetroAchievements verschoben und heißt jetzt „Spiele mit Achievements finden“. Jede Schaltfläche dort hat jetzt eine Zeile, die erklärt, was sie tut, sodass „Spiele finden“ und „Fortschritt synchronisieren“ leicht zu unterscheiden sind. Sind noch keine Spiele verknüpft, zeigt die Seite einem Admin die Schaltfläche „Finden“, statt zum nächsten Tab zu wechseln
    en: Refresh RetroAchievements moved from Settings to the RetroAchievements page, and is now called Find Games with Achievements. Every button there now has a line saying what it does, so Find Games and Sync Progress are easy to tell apart. With no games linked yet, the page shows an admin the Find button instead of moving on to the next tab
  body: "<ul>\n  <li><strong>Das Handbuch ist in jeder Sprache auf dem neuesten Stand.</strong>\n    Abschnitte, die es nur im englischen Handbuch gab, sind jetzt übersetzt.</li>\n</ul>\n"
  body_en: "<ul>\n  <li><strong>The help manual is up to date in every language.</strong>\n    Sections that were only in the English manual are now translated.</li>\n</ul>\n"
- version: 3.35.4
  date: '2026-11-03'
  tags:
  - type: fix
    label: Ein Screenshot, den du bei einem Spiel löschst, bleibt jetzt gelöscht. Früher konnte der nächste Scrape ihn aus ES-DE zurückkopieren oder aus einer Online-Quelle erneut herunterladen. Das Löschen einer überzähligen Kopie im Werkzeug für doppelte Screenshots zählt nicht, denn das Bild bleibt einmal erhalten
  - type: feature
    label: 'Spiele bekommen jetzt ihr Logo: Beim Scrapen wird es aus ES-DE, ScreenScraper, TheGamesDB, IGDB und Steam gespeichert, und die Spieleseite zeigt es über dem Titel oder anstelle einer fehlenden Box. Im Fenster „Bearbeiten“ kannst du ein Logo hochladen oder löschen. Starte einen Massen-Scrape mit „Fehlendes ergänzen“, um Logos für Spiele zu füllen, die du früher gescrapt hast'
  - type: fix
    label: IGDB setzt das Logo eines Spiels nicht mehr als Seitenhintergrund
  - type: feature
    label: 'Spiele bekommen jetzt die Rückseite ihrer Box: Beim Scrapen wird sie aus ES-DE, ScreenScraper und TheGamesDB gespeichert, und eine Schaltfläche „Rückseite“ am Cover auf der Spieleseite zeigt sie an. Klicke auf die Rückseite, um sie zu vergrößern. Im Fenster „Bearbeiten“ kannst du eine Rückseite hochladen oder löschen. Rückseiten werden bei jedem Scrapen eines Spiels gefüllt; „Fehlendes ergänzen“ scrapt ein Spiel nicht erneut, nur um die Rückseite zu holen'
  - type: fix
    label: Ein Spiel ohne Vorderseite auf TheGamesDB bekommt nicht mehr die Rückseite der Box als Cover
  - type: fix
    label: Wenn du einen Scraper in den Einstellungen ausschaltest, während ein Massen-Scrape läuft, stimmt die Zahl der nicht gefundenen Spiele jetzt ab dem nächsten Spiel. Früher konnte ein Spiel stattdessen als gestoppt gezählt werden
  - type: enhancement
    label: Bei einem System ohne eingerichteten Emulator ist die Schaltfläche „Spielen“ ausgegraut. Zeige darauf, um den Grund zu sehen, oder klicke darauf, um ein Fenster mit dem Hinweis zu öffnen, dass kein Emulator eingerichtet ist. Früher stand neben der Schaltfläche eine Textzeile
  body: "<ul>\n  <li><strong>Spiele bekommen ihr Logo.</strong> Beim Scrapen wird das\n    Logo jedes Spiels gespeichert, und die Spieleseite zeigt es über dem Titel oder anstelle einer\n    fehlenden Box. Starte einen Massen-Scrape mit „Fehlendes ergänzen“, um Logos für\n    Spiele zu füllen, die du früher gescrapt hast.</li>\n  <li><strong>Spiele bekommen die Rückseite ihrer Box.</strong> Eine Schaltfläche „Rückseite“ am\n    Cover auf der Spieleseite zeigt sie an, und du kannst sie anklicken, um sie zu vergrößern. Rückseiten\n    werden bei jedem Scrapen eines Spiels gefüllt.</li>\n  <li><strong>Ein gelöschter Screenshot bleibt gelöscht.</strong> Der nächste Scrape\n    kopiert ihn nicht mehr zurück und lädt ihn nicht erneut herunter.</li>\n  <li><strong>„Spielen“ sagt, warum es nicht startet.</strong> Bei einem System ohne\n    eingerichteten Emulator ist die Schaltfläche „Spielen“ ausgegraut und nennt den Grund.</li>\n</ul>\n"
- version: 3.35.3
  date: '2026-11-02'
  tags:
  - type: feature
    label: 'Neues Tool „MAME-Namen“ in den ROM-Tools: MAME-Spiele erhalten ihre echten Namen, Jahre und Hersteller aus der eigenen Liste von MAME, und die Dateien behalten ihre Kurznamen. Ein Scrapen findet dann jedes Spiel, und du kannst die MAME-Liste nach Kategorie filtern, zum Beispiel ohne Spielautomaten. BIOS-Sets werden in der Liste ausgeblendet'
  - type: fix
    label: ROM-Berichte bieten das Umbenennen von MAME-Dateien nicht mehr an, weil eine umbenannte Datei in MAME nicht mehr funktioniert
  - type: fix
    label: In den Einstellungen steht jetzt, was Microsoft verlangt, bevor eine Xbox-App registriert werden kann. Die Xbox-Anmeldung konnte deshalb nicht getestet werden
  - type: enhancement
    label: Die separate Karte „Offizielle Namen“ ist aus dem Massen-AI-Auffüllen entfernt, weil der Schalter „Offizieller Name“ des Auffüllens diese Aufgabe bereits übernimmt
  - type: fix
    label: Wenn Sony eine gespeicherte PlayStation-Anmeldung ablehnt, zeigen das Dashboard und die Einstellungen das jetzt an und bitten dich, das Konto neu zu verknüpfen. Vorher zeigte das Protokoll bei jedem Serverstart einen unverständlichen Fehler, und nichts hat dich informiert
  - type: feature
    label: Beim Importieren von Steam werden jetzt Beschreibung, Mitwirkende, Metacritic-Wertung, Altersfreigaben, Spielmodi, Cover, Hintergrund und Screenshots jedes Spiels im Hintergrund von seiner Store-Seite übernommen. Scrape ein Spiel, um Genre und Erscheinungsdatum zu erhalten
  - type: feature
    label: Ein Steam-Abgleich behält jetzt deine Spielzeit und wann du zuletzt gespielt hast, und die Spielseite zeigt beides an
  - type: fix
    label: „Bibliothek abrufen“ auf der Steam-Importseite funktioniert jetzt für einen Admin mit gespeichertem Steam-Schlüssel. Vorher wurde Steam die verborgene Form des Schlüssels geschickt, und die Seite forderte fälschlich, dein Profil auf „Öffentlich“ zu stellen
  - type: fix
    label: Ein Steam- oder Xbox-Spiel, das unter demselben Namen schon in deiner Bibliothek ist, wird beim Importieren jetzt mit diesem Spiel verknüpft, sodass seine Achievements synchronisiert werden. Vorher wurde es übersprungen und nie verknüpft
  - type: fix
    label: Von Steam, Xbox und PlayStation importierte Spiele werden jetzt sofort richtig sortiert, zum Beispiel Final Fantasy IX vor Final Fantasy X, und die Markenzeichen von Steam werden aus ihren Namen entfernt
  - type: feature
    label: Bei Systemen, auf denen RetroAchievements einen einfachen Datei-Hash verwendet, etwa Mega Drive und Game Boy, zeigt die Spielseite an, ob deine Kopie Achievements bringt, und dieser Hash verknüpft das richtige Spiel. Führe RA Refresh aus, um das zu füllen
  - type: fix
    label: Ein Scrapen fragt ScreenScraper jetzt zuerst nach deiner genauen Datei, bevor nach dem Namen gesucht wird, sodass du dein Spiel bekommst und nicht eines mit ähnlichem Titel. Ergebnisse, die du selbst anhakst, haben weiterhin Vorrang
  - type: enhancement
    label: Das Fortschrittsfenster von Bildgröße ändern nennt jetzt Spiel und System, zu denen jedes Bild gehört
  - type: feature
    label: Das Scrapen liefert jetzt Titelbildschirme von ScreenScraper und TheGamesDB, mehr offizielle Namen von IGDB und TheGamesDB (etwa den japanischen Titel eines Spiels) und die anderen Konsolen, auf denen ein Spiel erschienen ist, von IGDB
  - type: feature
    label: Ein Spiel ohne Nutzerwertung übernimmt jetzt die Bewertung aus deiner ES-DE-Sammlung, falls dort eine vorhanden ist
  - type: feature
    label: Die Spielseite zeigt, wie viele Spieler ein HowLongToBeat-Ergebnis gemessen haben, und verlinkt auf dessen Seite. Früher gespeicherte Ergebnisse zeigen das bei der nächsten Abfrage
  - type: feature
    label: Die RetroAchievements-Seite zeigt, wie viele Leute ein Spiel spielen und welcher Anteil von ihnen jedes Achievement erreicht hat
  - type: fix
    label: Der Ordnerbrowser der ROM-Tools öffnet sich im ROM-Ordner, wenn kein Startordner vorhanden ist, statt zu scheitern. Eine unlesbare Antwort von IGDB kostet jetzt nur diese eine Angabe, nicht alles, was IGDB zum Spiel gesendet hat
  - type: fix
    label: Das Tageslimit von ScreenScraper hält RetroDB jetzt davon ab, bis später weiter anzufragen, und ein Massen-Scrapen weist darauf hin und macht mit seinen anderen Quellen weiter. Vorher sah ein ausgeschöpftes Limit wie „Spiel nicht gefunden“ aus, und die Anfragen liefen die ganze Nacht weiter
  - type: fix
    label: Ein Spiel, zu dem keine Quelle antworten konnte, weil ein Dienst am Limit war, wird nicht mehr als gescrapt markiert, sodass der nächste Durchlauf es erneut versucht
  - type: fix
    label: Wenn ein TheGamesDB-Schlüssel sein Monatskontingent verbraucht hat, wechselt RetroDB zu deinem anderen Schlüssel und fragt nicht mehr an, sobald beide aufgebraucht sind
  - type: fix
    label: Das Monatslimit von RAWG hält RetroDB jetzt ebenfalls vom Anfragen ab, und IGDB wird auf höchstens vier Anfragen pro Sekunde begrenzt
  - type: fix
    label: Die Massenabfrage von HowLongToBeat endet jetzt mit einer Meldung, wenn die Seite zu viele Anfragen meldet, und alle Anfragen an die Seite werden zeitlich gestreckt
  - type: fix
    label: „Box- und Handbuch-Regionen korrigieren“ gibt nicht mehr nach 25 Spielen in Folge auf, die ScreenScraper nicht kennt. Es stoppt nur, wenn ScreenScraper meldet, dass sein Limit erreicht ist
  - type: fix
    label: Auf der Spielseite steht jede Altersfreigabe jetzt zentriert über ihrem Label „KI-Vermutung“
  - type: fix
    label: Das TheGamesDB-Kontingent in den Einstellungen nutzt jetzt die Prüfung, die dein Kontingent nicht verbraucht, und zeigt kein erfundenes Rücksetzdatum mehr an, wenn der Dienst keines nennt
  body: |
    <ul>
      <li><strong>MAME-Spiele bekommen ihre echten Namen.</strong> Das neue Tool „MAME-Namen“ in den ROM-Tools übernimmt Namen, Jahre und Hersteller aus der eigenen Liste von MAME.
        Die Dateien behalten ihre Kurznamen, weil MAME sie braucht. Du kannst die MAME-Liste nach Kategorie filtern, und BIOS-Sets sind ausgeblendet.</li>
      <li><strong>Steam-Importe bringen viel mehr mit.</strong> Jedes Spiel füllt Beschreibung, Mitwirkende, Metacritic-Wertung, Altersfreigaben, Spielmodi und Bilder von seiner Store-Seite aus. Ein Abgleich behält deine Spielzeit und wann du zuletzt gespielt hast. Ein Spiel, das unter demselben Namen schon in deiner Bibliothek ist, wird jetzt damit verknüpft, sodass seine Achievements synchronisiert werden.</li>
      <li><strong>Beim Scrapen wird genau dein Spiel gefunden.</strong> Ein Scrape fragt zuerst bei ScreenScraper nach deiner genauen Datei, bevor er nach dem Namen sucht. Außerdem bringt das Scrapen Titelbildschirme, mehr offizielle Namen und die anderen Konsolen, für die ein Spiel erschienen ist.</li>
      <li><strong>RetroAchievements kennt deine Version.</strong> Bei Systemen, die einen einfachen Datei-Hash nutzen, etwa Mega Drive und Game Boy, zeigt die Spielseite, ob deine Version Achievements freischaltet. Führe RA Refresh aus, um das aufzufüllen. Die RetroAchievements-Seite zeigt außerdem, wie viele Leute ein Spiel spielen und wie viel Prozent von ihnen jedes Achievement erreicht haben.</li>
      <li><strong>Online-Limits werden beachtet.</strong> Wenn ScreenScraper, TheGamesDB oder RAWG sein Limit erreicht, fragt RetroDB bis später nicht mehr an, und ein Massen-Scrape macht mit seinen anderen Quellen weiter. Ein Spiel, für das zu diesem Zeitpunkt keine Quelle antworten konnte, wird beim nächsten Durchlauf erneut versucht.</li>
      <li><strong>Eine abgelehnte PlayStation-Anmeldung wird angezeigt.</strong> Das Dashboard und die Einstellungen bitten dich jetzt, neu zu verknüpfen, wenn Sony eine gespeicherte Anmeldung ablehnt.</li>
      <li><strong>„Offizielle Namen“ ist umgezogen.</strong> Die eigene Karte dafür ist aus dem Massen-AI-Auffüllen verschwunden, weil der Schalter „Offizieller Name“ des Auffüllens dasselbe tut.</li>
    </ul>
- version: 3.35.2
  date: '2026-11-02'
  tags:
  - type: fix
    label: Die gesamte Spielzeit zählt Minuten nicht mehr als Stunden – im Dashboard, bei den Sammler-Trophäen und im Analyse-Diagramm. Ein Spiel mit 36 Minuten wurde als 36 Stunden gezählt
  - type: fix
    label: HowLongToBeat hält keinen Nachfolger mehr für dein Spiel. Double Dragon II bekommt nicht mehr die Zeiten von Double Dragon III
  - type: fix
    label: Eine HowLongToBeat-Massensuche speichert nicht mehr die Zeit eines Spiels auf einem anderen System. Mario Golf auf Game Boy Color bekommt nicht mehr die Zeit für Nintendo 64. Diese Treffer warten jetzt auf der Prüfseite
  - type: fix
    label: Massen- und Einzelsuchen bei HowLongToBeat nutzen jetzt das Erscheinungsjahr des Spiels, damit Doom von 1993 nicht mehr die Zeiten von Doom von 2016 bekommt
  - type: new
    label: „Gespeicherte Spielzeiten prüfen“ in den ROM-Tools schickt gespeicherte Treffer, die falsch aussehen, auf die Prüfseite, wo du jeden einzelnen behältst oder löschst
  - type: fix
    label: Eine HowLongToBeat-Massensuche mit „Nur fehlende“ versucht es jetzt erneut bei Spielen, die ohne Zeit zugeordnet wurden, und lässt eine Sekunde zwischen den Anfragen
  - type: fix
    label: Ein Trefferwert von 72 % wird auf der Spielseite nicht mehr als 100 % angezeigt
  - type: fix
    label: Spiele zeigen keine RetroAchievements eines anderen Spiels mehr. Resident Evil 4 auf GameCube zeigt nicht mehr das Set von Resident Evil, und Ratchet Deadlocked nicht mehr das Set von Ratchet & Clank
  - type: fix
    label: Ein Scrapen entfernt jetzt eine RetroAchievements-Verknüpfung, wenn es bei RetroAchievements kein solches Spiel gibt. Ist RetroAchievements nicht erreichbar, bleibt die Verknüpfung bestehen
  - type: fix
    label: RetroAchievements findet jetzt mehr deiner Spiele – über den Namen der ROM-Datei, alternative Titel, Akzente wie bei Ōkami und Titel mit zwei Namen
  - type: fix
    label: RetroAchievements verknüpft ein Spiel nicht mehr mit einem Bonus-Set, einem Hack oder einer Demo, und X-Men wird nicht mehr mit G-Men gleichgesetzt
  - type: new
    label: Die Spielseite zeigt den Namen, den RetroAchievements selbst für das verknüpfte Spiel verwendet, sodass eine falsche Verknüpfung leicht auffällt
  - type: fix
    label: Die RA-Aktualisierung speichert jetzt die Punkte jedes Spiels, sodass ein Spiel nicht mehr 0 Punkte zeigt
  - type: new
    label: Die Spielseite kennzeichnet Altersfreigaben von der KI als Vermutung auf Basis des Spielinhalts und nennt, wann die jeweilige Bewertungsstelle gestartet ist. OutRun von 1987 sieht nicht mehr offiziell von der ESRB eingestuft aus
  - type: new
    label: Die Spielseite kennzeichnet Testwertungen und Verkaufszahlen, die von der KI stammen. Änderst du eine Bewertung oder Verkaufszahl selbst, verschwindet die Kennzeichnung
  - type: fix
    label: Eine KI-Wertung auf der falschen Skala wird abgelehnt, sodass ein beliebtes Spiel bei einem neuen Scrapen nicht mehr 7 von 100 erhält
  - type: fix
    label: Eine Anzahl von Wertungen von der KI wird nicht mehr neben der Wertung einer anderen Seite gespeichert, und die Spielseite zeigt keine solche mehr an
  - type: fix
    label: Eine Verkaufsspanne oder ein Geldbetrag von der KI wird nicht mehr zu ein paar verkauften Exemplaren
  - type: fix
    label: KI-Antworten speichern keine Listen mehr als Code, nicht mehr die Wörter N/A oder None als Werte und nicht mehr die eigene Konsole eines Spiels unter anderen Plattformen
  - type: fix
    label: AI-Auffüllen behält jetzt den ersetzten Wert im Verlauf des Spiels
  - type: fix
    label: Modulspiele bekommen keinen erfundenen Batteriespeicher-Typ mehr, und neue KI-Antworten setzen nicht mehr standardmäßig Standard Edition
  - type: fix
    label: Die Serie eines Spiels wird nicht mehr aus dem zerschnittenen Titel abgeleitet, sodass Need For Speed nicht mehr in einer Serie namens Need steht. Serienamen von IGDB werden wieder gelesen, und alte Vermutungen werden gelöscht, damit das nächste Scrapen sie neu füllt
  - type: fix
    label: Beschreibungen zeigen keine Web-Codes mehr anstelle von Anführungszeichen oder Überschriftzeichen wie
  - type: fix
    label: Ein Unternehmen hat jetzt eine Schreibweise, sodass ein Klick auf Sega alle SEGA-Spiele findet. Regionen haben einen Wert, und Plattformen verwenden die Namen aus der Liste
  - type: fix
    label: Spieltitel von RAWG bekommen keine Jahreszahl mehr, und alternative Titel listen keine Dateinamen wie dosbox.exe mehr auf
  - type: fix
    label: Vollständiges Neu-Scrapen ersetzt eine von dir gesetzte Bewertung oder einen Controller nicht mehr durch eine Vermutung, und ein Scrapen, das zwischendurch fehlschlägt, schreibt nicht mehr über einen weniger sorgfältigen Weg
  body: "<ul>\n  <li><strong>KI-Antworten sind als KI erkennbar.</strong> Altersfreigaben von der KI\n    bleiben erhalten, gekennzeichnet als Vermutung auf Basis des Spielinhalts, mit dem Jahr, in dem die jeweilige\n    Bewertungsstelle gestartet ist. Wertungen und Verkaufszahlen von der KI sind ebenfalls gekennzeichnet.</li>\n  <li><strong>RetroAchievements zeigt das richtige Spiel.</strong> Nachfolger\n    tragen nicht mehr die Achievements des ersten Spiels. Nach dem Update\n    bietet das Dashboard einmal eine RetroAchievements-Aktualisierung an. Drücke darauf, um\n    alte Verknüpfungen zu reparieren. Fortschritt, der unter einer falschen Verknüpfung gespeichert wurde, wird entfernt, und die nächste\n    Synchronisierung füllt ihn neu auf.</li>\n  <li><strong>Die Gesamtspielzeiten stimmen.</strong> Zeiten unter einer Stunde wurden\n    als Stunden gezählt, daher waren die Summen im Dashboard und bei den Sammler-Trophäen zu hoch.\n    Manche Summen und Trophäen werden sinken.</li>\n  <li><strong>HowLongToBeat findet das richtige Spiel.</strong> Ein Nachfolger\n    gilt nicht mehr als dein Spiel, und das System und das Jahr des Spiels zählen jetzt.\n    Ein Treffer auf einem anderen System oder aus Jahren später wartet auf der\n    Prüfseite auf dich.</li>\n  <li><strong>Prüfe, was bereits gespeichert ist.</strong> Drücke in den ROM-Tools auf „Gespeicherte Spielzeiten prüfen“,\n    um zweifelhafte gespeicherte Treffer auf die Prüfseite zu schicken.\n    Nichts ändert sich, bis du entscheidest.</li>\n  <li><strong>Serienamen sind echt.</strong> Die Serie eines Spiels wird nicht mehr\n    aus dem zerschnittenen Titel abgeleitet. Nach dem Update werden vermutete Serienamen gelöscht, auch manche, die richtig waren. Das nächste Scrapen\n    füllt sie aus Quellen, die eine Serie nennen.</li>\n  <li><strong>Saubere Texte.</strong> Beschreibungen zeigen keine Web-Codes oder\n    Überschriftzeichen mehr. Ein Unternehmen hat eine Schreibweise, ein Spiel hat eine Region, und\n    Dateinamen wie dosbox.exe werden nicht mehr als andere Titel aufgelistet. Das\n    geschieht nach dem Update einmalig von selbst.</li>\n  <li><strong>Vollständiges Neu-Scrapen behält deine Entscheidungen.</strong> Eine von dir gesetzte Bewertung oder ein\n    Controller bleibt, es sei denn, eine Quelle liefert wirklich einen.</li>\n</ul>\n"
- version: 3.35.1
  date: '2026-11-02'
  tags:
  - type: fix
    label: Scrapen nimmt keinen Nachfolger mehr für das Spiel, das du hast. Street Fighter II bekommt keine Angaben mehr von Street Fighter und Sonic the Hedgehog keine von Sonic 2, wenn das genaue Spiel fehlt
  - type: fix
    label: Ein Massen-Scrape akzeptiert einen Treffer jetzt nur noch, wenn der Titel wirklich passt. Die richtige Konsole und ein Veröffentlichungsdatum reichen allein nicht mehr aus
  - type: fix
    label: IGDB-Mods, DLC, Bundles und Updates passen nicht mehr zu einem Spiel, es sei denn, deine ROM heißt genau so
  - type: fix
    label: RAWG führt einen Eintrag für alle Versionen eines Spiels. Deckt er mehrere Konsolen ab, liefert er daher keine Entwickler, Publisher, Altersfreigaben oder Mehrspielermodi mehr. Eine Spielerzahl wird gar nicht mehr geraten
  - type: fix
    label: IGDB-Spielerzahlen und Mehrspielermodi stammen jetzt von der eigenen Konsole des Spiels
  - type: fix
    label: Passen mehrere Quellen gleich gut, entscheidet jetzt deine Scraper-Reihenfolge. RAWG bekommt keine Extrapunkte mehr für ein Bild oder eine Metacritic-Wertung, und bei Neuinstallationen steht RAWG zuletzt
  - type: fix
    label: RAWG wird für Commodore-64- und DOS-Spiele nicht mehr durchsucht, da es sie unter Amiga und PC ablegt und so das Spiel einer anderen Plattform passen könnte
  - type: fix
    label: Ein von dir gewähltes ScreenScraper-Ergebnis ist jetzt immer das Spiel, das du bekommst, auch wenn die Ergebnisse länger als 10 Minuten offen waren
  - type: fix
    label: Akzente und Satzzeichen senken die Titelübereinstimmung nicht mehr, sodass Pokémon auch Pokemon findet und R.B.I. auch RBI
  - type: fix
    label: Ein Veröffentlichungsdatum zeigt nur noch so viel, wie die Quelle weiß. Ein Spiel, von dem nur das Jahr bekannt ist, zeigt dieses Jahr, kein erfundenes 1. Januar oder 31. Dezember
  - type: fix
    label: IGDB- und RAWG-Daten gehören jetzt zur eigenen Konsole des Spiels, die von IGDB auch zur eigenen Region. Eine USA-Version zeigt so nicht mehr das japanische Datum und eine Portierung nicht mehr das Jahr des Originals
  - type: feature
    label: Die Liste der Veröffentlichungsdaten auf der Seite eines Spiels wird jetzt aus IGDB und ScreenScraper gefüllt, nicht nur von der KI
  - type: added
    label: 'Neue Karte bei den ROM-Tools: Veröffentlichungsdaten bereinigen entfernt die erfundenen Tage, die ältere Scrapes gespeichert haben, damit ein Scrape das echte Datum eintragen kann'
  - type: fix
    label: Genres, Perspektiven und Spielmodi verwenden jetzt einheitliche Namen, egal welche Quelle sie geliefert hat, sodass Filter jedes Spiel finden. Ein Genre wird nicht mehr zugleich als RPG und Role Playing Game angezeigt
  - type: added
    label: 'Neue Karte bei den ROM-Tools: Genres, Perspektiven und Modi bereinigen wandelt um, was ältere Scrapes gespeichert haben, verschiebt Begriffe wie FPV ins richtige Feld und korrigiert Spielerzahlen, die den Modi eines Spiels widersprechen'
  - type: fix
    label: Reine Online-Spiele von IGDB werden nicht mehr als lokaler Mehrspielermodus geführt, und ein Spiel, das zwei Spieler braucht, nicht mehr als Einzelspieler-Spiel
  body: "<ul>\n  <li><strong>Scrapen nimmt nicht mehr das falsche Spiel.</strong> Ein Nachfolger\n    gilt nicht mehr als das Spiel, das du hast. Street Fighter II bekommt also nichts\n    von Street Fighter, und ein Massen-Scrape verlangt einen passenden Titel, nicht\n    nur die richtige Konsole. IGDB-Mods, DLC und Bundles passen nur noch, wenn deine\n    ROM genau so heißt.</li>\n  <li><strong>RAWG vermischt keine Versionen eines Spiels mehr.</strong> Deckt sein Eintrag\n    mehrere Konsolen ab, liefert er keine Entwickler, Publisher, Altersfreigaben\n    oder Mehrspielermodi mehr und rät keine Spielerzahl. Für Commodore-64- und\n    DOS-Spiele wird er nicht mehr durchsucht.</li>\n  <li><strong>Deine Scraper-Reihenfolge entscheidet bei gleichen Treffern.</strong>\n    RAWG bekommt keine Extrapunkte mehr für ein Bild oder eine Metacritic-Wertung, und bei Neuinstallationen\n    steht es zuletzt.</li>\n  <li><strong>Ein Veröffentlichungsdatum zeigt nur, was die Quelle weiß.</strong> Ein\n    Spiel, von dem nur das Jahr bekannt ist, zeigt dieses Jahr. Daten von IGDB und RAWG\n    gehören zur eigenen Konsole des Spiels, und die Liste der Veröffentlichungsdaten wird jetzt\n    auch aus IGDB und ScreenScraper gefüllt.</li>\n  <li><strong>Einheitliche Namen für Genres, Perspektiven und Modi.</strong>\n    Filter finden jetzt jedes Spiel, und reine Online-Spiele werden nicht mehr\n    als lokaler Mehrspielermodus geführt.</li>\n  <li><strong>Zwei neue ROM-Tools-Karten.</strong> Veröffentlichungsdaten bereinigen und Genres,\n    Perspektiven und Modi bereinigen korrigieren, was ältere Scrapes gespeichert haben. Drücke\n    darauf und starte dann einen Massen-Scrape mit Fehlendes ergänzen.</li>\n  <li><strong>Spielerzahlen stammen von der eigenen Konsole des Spiels,</strong> und\n    ein von dir gewähltes ScreenScraper-Ergebnis ist immer das Spiel, das du bekommst.</li>\n</ul>\n"
- version: 3.35.0
  date: '2026-11-01'
  tags:
  - type: fix
    label: ES-DE behält jetzt seinen Platz in deiner Scraper-Reihenfolge, wenn es nicht die Hauptquelle ist. Seine Beschreibungen, Firmen und Cover wurden von späteren Quellen und der KI ersetzt
  - type: fix
    label: Screenshots und Titelbilder von ES-DE werden jetzt einem Spiel hinzugefügt, wenn ES-DE nicht die Hauptquelle ist, außer sie sehen genauso aus wie eines, das es schon hat
  - type: fix
    label: ES-DE kopiert kein Fanart-Bild, Video oder Handbuch mehr, das das Spiel schon hat, und ein Vollständiges Neu-Scrapen löscht keine Box mehr, die eine andere Quelle gerade heruntergeladen hat
  - type: fix
    label: ES-DE liest jetzt den Eintrag für die ROM-Datei des Spiels selbst, sodass keine andere Version mit gleichem Namen die Details liefern kann, und PS3-Ordnerspiele finden jetzt ihre ES-DE-Cover
  - type: fix
    label: Beim Importieren von System-Logos aus ES-DE wird kein unpassendes Bild mehr genommen, nur weil sein Name Buchstaben wie "gb" enthält
  - type: fix
    label: Ein Tag im Dateinamen einer ROM, etwa (USA), bestimmt jetzt ihre Region. Die KI wird nicht mehr gefragt, da sie eine USA-Kopie als Europa oder Japan eintragen konnte
  - type: feature
    label: Neues Tool in ROM Tools, Regionen aus Dateinamen korrigieren, korrigiert die Spiele, die ältere Scrapes so falsch erfasst haben
  - type: fix
    label: RAWG-Hintergrundbilder werden nicht mehr als Box-Art gespeichert, da sie oft Screenshots sind und ein echtes Cover blockierten. Sie werden stattdessen als Fanart verwendet
  - type: feature
    label: Neues Tool in ROM Tools, RAWG-Bilder aus Box-Art entfernen, entfernt die Bilder, die ältere Scrapes gespeichert haben, damit ein Scrapen echte Cover finden kann
  - type: feature
    label: RetroDB nennt RAWG jetzt mit einem Link in der Seitenleiste, wie RAWG es verlangt
  - type: fix
    label: ScreenScraper liefert jetzt für jedes Spiel Box, 3D-Box, Handbuch, Titelbild und Veröffentlichungsdatum der eigenen Region, statt der Region, die alphabetisch zuerst kam
  - type: feature
    label: Neues Tool in ROM Tools, Box- und Handbuch-Regionen korrigieren, tauscht Boxen und Handbücher aus, die ältere ScreenScraper-Scrapes aus der falschen Region genommen haben
  - type: fix
    label: ScreenScraper-Videos verwenden jetzt zuerst die kleinere Datei und die größere nur, wenn das fehlschlägt
  - type: fix
    label: Jeder Scraper durchsucht jetzt die richtige Konsole. Atari Lynx, Arcade CPS, Super Famicom und andere wurden auf der falschen Maschine gesucht, und viele weitere Systeme werden jetzt überhaupt durchsucht, von allen Quellen und für Achievements
  - type: feature
    label: Auf der Seite eines Spiels springen die Pfeiltasten links und rechts jetzt zum vorherigen und nächsten Spiel
  - type: feature
    label: Der Bereich Cheats auf der Seite eines Spiels lässt sich jetzt einklappen und merkt sich, ob du ihn offen gelassen hast
  - type: fix
    label: Wenn sich ein Fenster öffnet, das mit einem Textfeld beginnt, etwa Scrapen, steht der Cursor jetzt in diesem Feld statt auf der Schließen-Schaltfläche
  - type: feature
    label: Das neue Tool Screenshot-Prüfung in ROM Tools listet Screenshots von ZX Spectrum, Commodore 64 und Game Boy mit den verdächtigsten zuerst auf und entfernt nur, was du auswählst
  - type: fix
    label: Beim Scrapen wird jetzt ein Game-Boy-Screenshot abgelehnt, dessen Original weit mehr Graustufen hat, als die Maschine darstellen könnte
  - type: fix
    label: Die unteren Bereiche eines Spiels passen jetzt ins Fenster, statt über den rechten Rand hinauszulaufen
  - type: feature
    label: Importiere eine 3D-Box im Fenster Bearbeiten, neben den anderen Bildern
  - type: feature
    label: Die RetroAchievements-Anmeldung erreicht jetzt DuckStation und PCSX2, wenn du auf Spielen drückst
  - type: fix
    label: Auf 8-Bit- und 16-Bit-Systemen fügt das Scrapen einem Spiel, das auf mehreren Systemen erschien, keine IGDB- oder RAWG-Screenshots mehr hinzu, da sie die Version eines anderen Systems zeigen konnten
  - type: fix
    label: Der Emulator eines Spiels steht jetzt auf seiner Emulator-Einstellungskarte, nicht neben Spielen
  body: "<ul>\n  <li><strong>Jeder Scraper durchsucht die richtige Konsole.</strong> Atari\n    Lynx, Arcade CPS, Super Famicom und andere wurden auf der\n    falschen Maschine gesucht, und viele weitere Systeme werden jetzt überhaupt durchsucht,\n    von allen Quellen und für Achievements.</li>\n  <li><strong>Die Region eines Spiels kommt zuerst aus seinem eigenen Dateinamen.</strong>\n    Ein Tag wie (USA) bestimmt jetzt die Region, und die KI wird nicht mehr\n    gefragt. ROM Tools hat ein neues Tool, Regionen aus Dateinamen korrigieren, für\n    die Spiele, die ältere Scrapes falsch erfasst haben.</li>\n  <li><strong>ScreenScraper folgt der Region des Spiels.</strong> Box,\n    3D-Box, Handbuch, Titelbild und Veröffentlichungsdatum kommen jetzt aus der eigenen\n    Region des Spiels, nicht aus der, die alphabetisch zuerst kam. ROM Tools hat ein\n    neues Tool, Box- und Handbuch-Regionen korrigieren, für ältere Scrapes. Videos\n    versuchen es jetzt zuerst mit der kleineren Datei.</li>\n  <li><strong>RAWG-Bilder sind keine Box-Art mehr.</strong> Sie sind oft\n    Screenshots und blockierten ein echtes Cover. Sie werden jetzt als\n    Fanart verwendet. ROM Tools hat ein neues Tool, RAWG-Bilder aus Box-Art entfernen,\n    für die Bilder, die ältere Scrapes gespeichert haben. RetroDB nennt RAWG außerdem mit einem\n    Link in der Seitenleiste, wie RAWG es verlangt.</li>\n  <li><strong>ES-DE behält seinen Platz in deiner Scraper-Reihenfolge.</strong> Wenn\n    es nicht die Hauptquelle war, ersetzten spätere Quellen und die KI seine\n    Texte und Cover, und seine Screenshots wurden verworfen. Jetzt bleiben sie erhalten.\n    Es kopiert keine Medien mehr, die ein Spiel schon hat, und es liest den Eintrag\n    für die ROM-Datei des Spiels selbst. PS3-Ordnerspiele finden jetzt ihre ES-DE-\n    Cover. Beim Importieren von System-Logos wird kein unpassendes Bild mehr genommen.\n    Ein Vollständiges Neu-Scrapen löscht keine Box mehr, die eine andere Quelle gerade\n    heruntergeladen hat.</li>\n  <li><strong>Screenshot-Prüfung.</strong> Ein neues Tool in ROM Tools listet\n    Screenshots von ZX Spectrum, Commodore 64 und Game Boy mit den\n    verdächtigsten zuerst auf und entfernt nur, was du auswählst. Beim Scrapen wird jetzt ein Game-Boy-Screenshot abgelehnt, dessen Original weit mehr Graustufen hat\n    als die Maschine darstellen könnte. Auf 8-Bit- und 16-Bit-Systemen fügt es\n    keine IGDB- oder RAWG-Screenshots mehr zu einem Spiel hinzu, das auf mehreren\n    Systemen erschien.</li>\n  <li><strong>Die RetroAchievements-Anmeldung erreicht DuckStation und PCSX2,</strong>\n    wenn du auf Spielen drückst.</li>\n  <li><strong>Auf der Seite eines Spiels:</strong> Die Pfeiltasten links und rechts springen\n    zum vorherigen und nächsten Spiel, der Bereich Cheats lässt sich einklappen und\n    merkt sich das, die unteren Bereiche passen ins Fenster, und der Emulator\n    steht auf seiner Emulator-Einstellungskarte, nicht neben Spielen.</li>\n  <li><strong>Eine 3D-Box importieren</strong> geht jetzt im Fenster Bearbeiten, neben\n    den anderen Bildern.</li>\n  <li><strong>Ein Fenster, das mit einem Textfeld beginnt,</strong> etwa Scrapen,\n    setzt den Cursor jetzt in dieses Feld statt auf die Schließen-Schaltfläche.</li>\n</ul>\n"
