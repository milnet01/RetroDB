  body: |
    <ul>
      <li><strong>Cheats für RetroArch (RetroDB), DuckStation und
        PCSX2.</strong> Einstellungen &gt; Emulatoren hat einen neuen Bereich
        Cheats. Laden Sie dort die freien öffentlichen Cheat-Pakete herunter
        oder importieren Sie Cheat-Ordner, die Sie schon haben; RetroDB
        kopiert die Dateien und ändert Ihren Ordner nie. Die Seite eines
        Spiels listet dann seine Cheats auf, jeden mit einem An/Aus-Schalter,
        und bei vielen Cheats mit einem Suchfeld. In RetroArch (RetroDB)
        gelten die eingeschalteten Cheats beim nächsten Drücken von Spielen,
        und Änderungen, die Sie während des Spielens im Menü von RetroArch
        vornehmen, bleiben erhalten. Für DuckStation und PCSX2 werden die
        Schalter in den eigenen Einstellungen des Emulators für das Spiel
        gespeichert, sodass Änderungen im Emulator auch auf der Seite
        erscheinen. RetroDB überschreibt nie eine Cheat-Datei, die ein
        Emulator schon hat. Ein eingeschalteter Cheat pausiert den
        RetroAchievements-Hardcore-Modus.</li>
      <li><strong>Eine Slipcase-3D-Box in ein Spiel importieren.</strong> Die
        Seite eines Spiels hat unter dem Cover eine Schaltfläche „3D-Box
        importieren“. Wählen Sie die <code>.box.json</code>-Datei, die
        Slipcase gespeichert hat, zusammen mit ihren Bildern, und RetroDB
        behält Vorderseite, Rücken, Rückseite und die anderen Seiten der Box
        für dieses Spiel. Slipcase 1.4.0 oder neuer speichert diese Datei neben jedem exportierten Bild. Ihr 3D-Boxart-Bild wird nicht geändert. Ein Spiel,
        das schon Seiten hat, fragt vor dem Ersetzen nach, und Entfernen
        löscht sie.</li>
      <li><strong>Die 3D-Box eines Spiels in den Händen drehen.</strong>
        Klicken Sie auf das Cover eines Spiels mit importierter Slipcase-Box,
        und die Box erscheint in 3D. Ziehen Sie sie oder nutzen Sie die
        Pfeiltasten, um sie zu drehen und Rücken, Rückseite, Ober- und
        Unterseite zu sehen. Scrollen oder + und - drücken zum Zoomen;
        Doppelklick oder Pos1 setzt sie zurück. Ein Spiel ohne importierte
        Box zoomt weiterhin auf sein Cover-Bild.</li>
      <li><strong>Einstellungen verlinken auf die Emulatoren-Seite.</strong>
        Die Emulatoren-Seite hatte nirgends in den Einstellungen einen Link,
        man erreichte sie nur durch Eintippen ihrer Adresse. Admins sehen
        jetzt einen Reiter Emulatoren nach System, und die Emulatoren-Seite
        zeigt dieselbe Reiterleiste, sodass die anderen Reiter einen Klick
        entfernt sind.</li>
      <li><strong>Der Cover-Zoom ist nicht mehr hinter den Menüs
        versteckt.</strong> Auf einem Handy lagen die obere und untere Leiste
        über dem gezoomten Cover und verdeckten seine Schließen-Schaltfläche,
        und auf einem Computer verdeckte die Seitenleiste seine linke Seite.
        Der Zoom öffnet sich jetzt über allem.</li>
      <li><strong>Claude-5.5-Modelle für die KI.</strong> Einstellungen &gt; Scraping listet Anthropics neueste Claude-Modelle: Haiku 5.5, die neue Voreinstellung und das günstigste, Sonnet 5.5 und Opus 5.5, mit ihren aktuellen Preisen. RetroDB sendet keine Einstellung mehr, die Sonnet 5.5 ablehnt.</li>
      <li><strong>Die Verkaufszahl eines Spiels eintragen.</strong> Beide Bearbeitungsfenster haben unter Entwickler ein Feld „Verkaufte Exemplare“. Eine eingetragene Zahl erscheint auf der Spielseite wie eine, die die KI gefunden hat. Leeren Sie das Feld, um sie zu entfernen.</li>
      <li><strong>Den KI-Schlüssel in den Einstellungen testen.</strong> Einstellungen &gt; Scraping hat unter dem KI-Anbieter die Schaltfläche „Gespeicherten KI-Schlüssel testen“. Sie zeigt, ob der Schlüssel funktioniert, und wenn nicht, warum: ein abgelehnter Schlüssel, kein Guthaben oder ein Nutzungslimit. Bisher sah ein abgelehnter Schlüssel wie ein funktionierender aus.</li>
      <li><strong>Claude kann im Web nach Verkaufszahlen suchen.</strong> Einstellungen &gt; Scraping hat unter dem Claude-Modell den Schalter „Claude im Web suchen lassen“, anfangs aus. Ohne Suche antwortet Claude mit dem, was es schon weiß, und lässt verkaufte Exemplare leer. Ist er an, schlägt Claude Zahlen nach. Anthropic berechnet jede Suche, daher macht AI-Auffüllen höchstens 5 Suchen pro Spiel, bis zu 5 US-Cent; schalten Sie den Schalter vor einem großen Massen-Scraping aus.</li>
      <li><strong>AI-Auffüllen für ein ganzes System auf einmal.</strong> ROM-Werkzeuge hat eine neue Seite Massen-AI-Auffüllen, die auch Offizielle Namen enthält. Wählen Sie ein System oder Alle Systeme, schalten Sie die Felder ein, die gefüllt werden sollen, und drücken Sie Mit KI auffüllen: RetroDB führt AI-Auffüllen für jedes Spiel aus, genauso wie die Schaltfläche AI-Auffüllen auf der Seite eines Spiels, und speichert die Antworten direkt im Spiel. Ein Fortschrittsbalken und ein AI-Auffüllen-Benachrichtigungsfeld zeigen, wie weit es ist, und Sie können die Seite verlassen, während es läuft. Es zeigt, wie viele Spiele es auffüllen wird, und fragt vorher, denn Ihr KI-Anbieter berechnet jedes Spiel. Spiele, die AI-Auffüllen schon erledigt hat, werden übersprungen, sofern Sie sie nicht wieder einschalten, und der Durchlauf hält von selbst an, wenn die KI nicht mehr antwortet.</li>
      <li><strong>Benachrichtigungsfelder für Aufträge übernehmen die Farben Ihres Designs.</strong> Die Benachrichtigungsfelder, die einen laufenden Auftrag zeigen, etwa Massen-Scraping und RA Sync, und die Fortschrittsbalken nutzen jetzt die Farben des gewählten Designs. Ein Auftrag, der sich nicht pausieren lässt, zeigt seinen Titel nicht mehr in der Pausenfarbe.</li>
      <li><strong>Die Emulatoren-Seite sieht aus wie die anderen Einstellungs-Tabs.</strong> Einstellungen &gt; Emulatoren ist jetzt in Karten aufgeteilt, und eine Leiste unter den Tabs springt zu jeder davon: RetroArch, In RetroDB spielen, Cores, Cheats, Ordner, Emulatoren und Zuordnung. Die Leiste bleibt beim Scrollen oben und markiert den Bereich, in dem Sie sich befinden.</li>
      <li><strong>Download-Fortschritt neben der Schaltfläche.</strong> Wenn Sie RetroArch, die Cores des Players oder ein Cheat-Paket herunterladen, zeigt ein Hinweis neben der Schaltfläche in Prozent, wie weit der Download ist. Bisher erschien eine Zeile unter den Schaltflächen und schob den Rest der Seite nach unten.</li>
      <li><strong>Den Emulator jedes Systems aus einer Liste wählen.</strong> Zuordnung pro System unter Einstellungen &gt; Emulatoren zeigt jetzt jedes System einmal, mit einer Liste der damit verknüpften Emulatoren. Den gewählten verwendet Spielen für die Spiele dieses Systems, sofern ein Spiel keinen eigenen festlegt. Ein Emulator, den RetroDB nicht finden kann, ist als „nicht gefunden“ markiert. Bisher hatte jedes System eine Zeile pro Emulator, mit einem kleinen Punkt zur Wahl des Standards. RetroDBs eigenes RetroArch steht jetzt in der Liste jedes aufgeführten Systems, das es ausführen kann, auch bei Systemen, die noch keine Spiele haben.</li>
      <li><strong>Eine Durchsuchen-Schaltfläche an jedem Pfadfeld.</strong> Administratoren können jetzt einen Ordner oder ein Programm auswählen, indem sie sich durch die Ordner des Computers klicken, statt den Pfad einzutippen: Einstellungen &gt; Emulatoren, Bibliothek, Scraping und Konto sowie die Einstellungen von ROM-Werkzeuge. Felder, die ein Programm erwarten, zeigen auch Dateien an. Versteckte Ordner wie <code>.config</code> stehen am Ende der Liste.</li>
      <li><strong>Der linke Stick funktioniert in RetroDBs RetroArch als D-Pad.</strong> In Spielen für Systeme ohne Stick, etwa NES oder Mega Drive, können Sie sich jetzt mit dem linken Stick ebenso wie mit dem D-Pad bewegen. Wenn der Emulator-Core eines Spiels den Stick selbst ausliest, wie beim Nintendo 64, bleibt der Stick ein echter Stick.</li>
      <li><strong>Von den Einstellungen aus bei RetroAchievements anmelden.</strong> Einstellungen &gt; Konto kann Sie jetzt für RetroDBs RetroArch anmelden, sodass Achievements beim Spielen freigeschaltet werden, ohne Anmeldung im Emulator. Ihr Passwort geht nur an RetroAchievements und wird nicht gespeichert. Jeder RetroDB-Benutzer hat seine eigene Anmeldung und seinen eigenen Schalter für den Hardcore-Modus, der zunächst aus ist. DuckStation und PCSX2 melden sich weiterhin über ihre eigenen Menüs an.</li>
      <li><strong>Sehen, welchen Emulator „Spielen“ verwendet.</strong> Die Seite eines Spiels zeigt neben der Schaltfläche „Spielen“ jetzt „Startet in:“ und den Namen des Emulators oder meldet, dass kein Emulator eingerichtet ist.</li>
      <li><strong>Das Cheats-Feld sagt, warum ein Spiel keine Cheats hat.</strong> Kann der Emulator eines Spiels keine Cheats verwenden, nennt das Feld jetzt den Grund, statt verborgen zu bleiben.</li>
      <li><strong>Lange Ordnerpfade passen aufs Handy.</strong> Ein langer Ordnerpfad in den Einstellungen lässt die Seite nicht mehr seitlich scrollen.</li>
    </ul>
