- version: 3.34.0
  date: '2026-10-29'
  tags:
  - type: feature
    label: 'Cheats für RetroArch (RetroDB), DuckStation und PCSX2'
  - type: feature
    label: 'Eine Slipcase-3D-Box in ein Spiel importieren'
  - type: feature
    label: 'Die 3D-Box eines Spiels in den Händen drehen'
  - type: fix
    label: 'Einstellungen verlinken auf die Emulatoren-Seite'
  - type: fix
    label: 'Der Cover-Zoom ist nicht mehr hinter den Menüs versteckt'
  body: |
    <ul>
      <li><strong>Cheats für RetroArch (RetroDB), DuckStation und
        PCSX2.</strong> Einstellungen &gt; Emulatoren hat einen neuen Bereich
        Cheats. Laden Sie dort die freien öffentlichen Cheat-Pakete herunter
        oder importieren Sie Cheat-Ordner, die Sie schon haben; RetroDB
        kopiert die Dateien und ändert Ihren Ordner nie. Die Seite eines
        Spiels listet dann seine Cheats auf, jeden mit einem An/Aus-Schalter,
        und bei vielen Cheats mit einem Suchfeld. In RetroArch (RetroDB)
        gelten die eingeschalteten Cheats beim nächsten Drücken von Spielen,
        und Änderungen, die Sie während des Spielens im Menü von RetroArch
        vornehmen, bleiben erhalten. Für DuckStation und PCSX2 werden die
        Schalter in den eigenen Einstellungen des Emulators für das Spiel
        gespeichert, sodass Änderungen im Emulator auch auf der Seite
        erscheinen. RetroDB überschreibt nie eine Cheat-Datei, die ein
        Emulator schon hat. Ein eingeschalteter Cheat pausiert den
        RetroAchievements-Hardcore-Modus.</li>
      <li><strong>Eine Slipcase-3D-Box in ein Spiel importieren.</strong> Die
        Seite eines Spiels hat unter dem Cover eine Schaltfläche „3D-Box
        importieren“. Wählen Sie die <code>.box.json</code>-Datei, die
        Slipcase gespeichert hat, zusammen mit ihren Bildern, und RetroDB
        behält Vorderseite, Rücken, Rückseite und die anderen Seiten der Box
        für dieses Spiel. Ihr 3D-Boxart-Bild wird nicht geändert. Ein Spiel,
        das schon Seiten hat, fragt vor dem Ersetzen nach, und Entfernen
        löscht sie.</li>
      <li><strong>Die 3D-Box eines Spiels in den Händen drehen.</strong>
        Klicken Sie auf das Cover eines Spiels mit importierter Slipcase-Box,
        und die Box erscheint in 3D. Ziehen Sie sie oder nutzen Sie die
        Pfeiltasten, um sie zu drehen und Rücken, Rückseite, Ober- und
        Unterseite zu sehen. Scrollen oder + und - drücken zum Zoomen;
        Doppelklick oder Pos1 setzt sie zurück. Ein Spiel ohne importierte
        Box zoomt weiterhin auf sein Cover-Bild.</li>
      <li><strong>Einstellungen verlinken auf die Emulatoren-Seite.</strong>
        Die Emulatoren-Seite hatte nirgends in den Einstellungen einen Link,
        man erreichte sie nur durch Eintippen ihrer Adresse. Admins sehen
        jetzt einen Reiter Emulatoren nach System, und die Emulatoren-Seite
        zeigt dieselbe Reiterleiste, sodass die anderen Reiter einen Klick
        entfernt sind.</li>
      <li><strong>Der Cover-Zoom ist nicht mehr hinter den Menüs
        versteckt.</strong> Auf einem Handy lagen die obere und untere Leiste
        über dem gezoomten Cover und verdeckten seine Schließen-Schaltfläche,
        und auf einem Computer verdeckte die Seitenleiste seine linke Seite.
        Der Zoom öffnet sich jetzt über allem.</li>
    </ul>
