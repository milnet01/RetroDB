- version: 4.0.0
  date: '2026-11-27'
  tags:
  - type: enhancement
    label: "In der Protokoll-Anzeige kann ein Scraping-Protokoll jetzt nur die Spiele zeigen, die aktualisiert, übersprungen oder fehlgeschlagen sind oder einen Fehler hatten, und nur ein Spiel, wenn du seinen Namen in das neue Feld Spiel tippst. Jedes Spiel eines Massen-Scrapings erscheint jetzt als ein Eintrag, übersprungene Spiele eingeschlossen, und Steam-Spiele zeigen ihren Namen statt ihrer Store-Nummer"
    en: "In the Log Viewer, a scraping log can now show only the games that were updated, skipped or failed, or that had an error, and only one game when you type its name in the new Game box. Each game in a bulk scrape now shows as one entry, skipped games included, and Steam games show their names instead of their store numbers"
  - type: enhancement
    label: "Jeder kann jetzt die schwachen Bildschirmlinien ausschalten, die wie bei einem alten Fernseher über jeder Seite liegen. Der Schalter Bildschirmlinien ist in den Einstellungen unter Design und Sprache, neben Bewegter Hintergrund, und die Wahl folgt dir auf jedes Gerät"
    en: "Each person can now turn off the faint screen lines drawn over every page, like an old TV screen. The Screen lines switch is in Settings, under Theme and Language, beside Moving background, and the choice follows you to every device"
  - type: enhancement
    label: "Wenn ein Massen-Scraping endet, siehst du jetzt, bei welchen Spielen es fehlgeschlagen ist oder die es übersprungen hat, und warum. Das Fenster Massen-Scraping listet sie auf; jeder Name öffnet die Seite des Spiels, damit du es von Hand scrapen kannst, die übersprungenen Spiele stehen unter einer eigenen Überschrift. Auf jeder Seite zeigt eine Karte, wie viele Spiele fehlgeschlagen sind oder übersprungen wurden, mit einer Schaltfläche Spiele anzeigen. Die Karte bleibt, auch nach einem Neuladen oder einem Neustart, bis du sie schließt oder das nächste Massen-Scraping startest"
    en: "When a bulk scrape ends, you can now see which games it failed or skipped, and why. The Bulk Scraping window lists them, each name opening the game's page so you can scrape it by hand, with the skipped games under a heading of their own. On every page, a card says how many games failed or were skipped, with a Show the games button. The card stays, even after a reload or a restart, until you close it or start the next bulk scrape"
  - type: enhancement
    label: "Das Museum hat jetzt 3D-Modelle, die du drehen und zoomen kannst, wie bei den Spielboxen: 11 Konsolen (Atari 2600, NES, Famicom, SNES, Nintendo 64, GameCube, Master System, Mega Drive, Saturn, PlayStation und PlayStation 2) und 10 Controller, darunter der NES Zapper. Tippe unter dem Bild einer Konsole auf In 3D ansehen, oder bei einem Controller im Tab Controller. Zieh mit der Maus oder nimm die Pfeiltasten, um das Modell zu drehen, und das Mausrad oder + und - zum Zoomen. Unter jedem Modell stehen der Name der Person, die es gemacht hat, ein Link zu ihrer Seite und die Lizenz"
    en: "The museum now has 3D models you can turn and zoom, as with game boxes: 11 consoles (Atari 2600, NES, Famicom, SNES, Nintendo 64, GameCube, Master System, Mega Drive, Saturn, PlayStation and PlayStation 2) and 10 controllers, the NES Zapper among them. Press View in 3D under a console's picture, or on a controller in the Controllers tab. Drag or use the arrow keys to turn the model, and the mouse wheel or + and - to zoom. Under each model is a credit to the person who made it, a link to its page, and its licence"
  - type: fix
    label: "Im Museum liegt der runde Nach-oben-Button nicht mehr über einem vergrößerten Konsolen- oder Controller-Bild"
    en: "In the museum, the round back-to-top button no longer shows on top of an enlarged console or controller picture"
  - type: fix
    label: "Im Museum sehen die Schaltflächen Inhalt generieren, Alle Bilder abrufen, Suchen, Hochladen und Hintergrund entfernen jetzt nur noch Redakteure und Admins, denn nur bei ihnen funktionieren sie. Die Auswahl Engine im Typfilter des Museums findet jetzt Engine-Systeme wie ScummVM, PICO-8 und Ports"
    en: "In the museum, the Generate Content, Fetch All Images, Search, Upload and Remove BG buttons now show only to editors and admins, who are the only ones they work for. The Engine choice in the museum's type filter now finds engine systems such as ScummVM, PICO-8 and Ports"
  - type: enhancement
    label: "Mehr Spiele bekommen jetzt eine Verkaufszahl. Hat ein Spiel keine, fragt RetroDB die KI jetzt gezielt nach den Verkäufen, statt unter einem Dutzend anderer Fragen; in einem Test fand sich so für 7 von 10 Spielen eine Zahl, vorher für 1 von 3. Wird nur eine Summe über mehrere Konsolen veröffentlicht, etwa 8 Millionen für Battlefield Hardline auf PS4, Xbox One und PC, speichert RetroDB sie getrennt und lässt die Zahl der einzelnen Konsole leer. Die Seite Analyse hat einen neuen Bereich Verkäufe mit den meistverkauften Spielen und diesen Summen über alle Konsolen. Um früher gescrapte Spiele abzufragen, führe AI-Auffüllen mit angehaktem Verkaufte Exemplare aus"
    en: "More games now get a sales figure. When a game has none, RetroDB now asks the AI about sales on their own, instead of among a dozen other questions; in a test this found a figure for 7 games in 10, against 1 in 3 before. Where only a total across several consoles is published, such as 8 million for Battlefield Hardline on PS4, Xbox One and PC, RetroDB keeps it apart and leaves the console's own figure empty. The Analytics page has a new Sales section listing the best-selling games and these all-console totals. To ask about games scraped before, run AI Fill with Copies sold ticked"
  - type: enhancement
    label: "Erstellte 3D-PS3-Boxen entsprechen jetzt dem Inneren der echten Hülle, abgelesen von Fotos einer echten. Geöffnet liegt die Disc in einem erhöhten Ring mit je einer Fingermulde links und rechts oben, auf einer runden Nabe mit dreieckigem Knopf und drei federnden Laschen, die die Disc halten. An der Öffnungskante jeder Hälfte sitzen zwei Verschlüsse, über und unter der Griffmulde, und eine niedrige Wand schließt den durchsichtigen Streifen oben ab. Die Seite mit dem Heft hat dieselben zwei Klammern wie die PS5-Hülle. Der Kunststoff der Hülle ist jetzt durchsichtig, und wo kein Scan der Innenseite des Covers vorliegt, scheint das Bild des Covers selbst schwach durch die Schale. Außen beginnt das Cover jetzt unter dem klaren Streifen oben, in den PLAYSTATION 3 und das Blu-ray-Logo eingeprägt sind, sodass PS3-Cover nicht mehr in die Höhe gezogen werden"
    en: "Built 3D PS3 boxes now match the inside of the real case, read from photos of one. Opened, the disc sits in a raised ring with a finger dip either side of the top, on a round hub with a triangular button and three sprung flaps that hold the disc. Two catches sit on the opening edge of each half, above and below the finger slot, and a low wall closes off the clear strip at the top. The booklet side has the same two clips as the PS5 case. The case's plastic is now see-through, and where there is no scan of the inside of the cover, the cover's own picture shows faintly through the tray"
  - type: enhancement
    label: "Jede Person im Haushalt hat jetzt ihren eigenen Abschlussstatus für jedes Spiel. Wenn du ein Spiel auf Abgeschlossen setzt, ändert das die Bibliothek anderer nicht mehr, und alle Angemeldeten können ihren eigenen setzen, auch Viewer. Wenn du ein Spiel mit der Schaltfläche Spielen 10 Minuten oder länger spielst und der eingebaute Player das Spiel gespeichert hat oder du eine RetroAchievement verdient hast, springt dein Nicht begonnen von selbst auf In Bearbeitung. Nach einer langen Sitzung mit keinem von beiden fragt dich die Spielseite einmal, mit einem Klick. Die Spielseite zeigt außerdem, wie lange du das Spiel in RetroDB gespielt hast. Status, die vor diesem Update gesetzt wurden, gehören jetzt dem ersten Admin-Konto"
    en: "Each person in the house now has their own completion status for every game. Setting a game to Completed no longer changes anyone else's library, and everyone signed in can set their own, viewers included. When you play a game with the Play button for 10 minutes or more, and the built-in player saved the game or you earned a RetroAchievement, your Not Started moves to In Progress by itself. After a long session with neither, the game page asks you once, with one click. The game page also shows how long you have played the game from RetroDB. Statuses set before this update now belong to the first admin account"
  - type: fix
    label: "Das Scraping findet ein Spiel jetzt, egal wie eine Quelle seine Akzente schreibt. Findet eine Suche nichts, wird ohne die Akzente erneut gefragt, sodass Ghost of Yōtei auch eine Quelle findet, die Ghost of Yotei schreibt. MobyGames, das die Akzente behält, wird ebenfalls erneut gefragt, sodass Ghost of Yotei dort Ghost of Yōtei findet"
    en: "Scraping now finds a game however a source spells its accents. When a search finds nothing, it is asked again without the accents, so Ghost of Yōtei also finds a source that writes Ghost of Yotei. MobyGames, which keeps the accents, is asked again too, so Ghost of Yotei finds Ghost of Yōtei there"
  - type: fix
    label: "Auf dem Handy lässt sich eine Spiel- oder Erfolgsseite nicht mehr seitlich verschieben, wenn der Titel des Spiels ein einziges langes Wort ist. Der Titel ist dort etwas kleiner und bricht in eine zweite Zeile um, wenn er sonst nicht passt"
    en: "On a phone, a game or achievements page no longer scrolls sideways when the game's title is one long word. The title is a little smaller there, and breaks onto a second line if it still does not fit"
  - type: fix
    label: "Text ist an mehr Stellen leichter zu lesen. Der Name eines Tags erscheint jetzt dunkel oder weiß, je nachdem, was auf der Farbe des Tags besser lesbar ist; das Hardcore-Etikett eines Erfolgs hat dunkle Schrift auf seinem Rot; und Zeilennummern in der Protokoll-Anzeige sind nicht mehr blass. In der Screenshot-Deduplizierung hat ein Screenshot, der gelöscht wird, jetzt einen roten Rahmen und ein Löschen-Abzeichen, statt nur blass auszusehen. Beschriftungen in den Formularen der Einstellungen sehen jetzt so aus wie auf jeder anderen Seite"
    en: "Text is easier to read in more places. A tag's name now shows in dark or white, whichever reads better on the tag's colour; an achievement's Hardcore label has dark text on its red; and line numbers in the Log Viewer are no longer faded. In Screenshot Dedup, a screenshot that will be deleted now has a red border and a Delete badge, instead of only looking faded. Labels in Settings forms now look the same as on every other page"
  - type: enhancement
    label: "Erstellte 3D-Boxen für PS5 entsprechen jetzt dem Inneren der echten Hülle, gemessen an Fotos mit Lineal. Geöffnet liegt die Disc in einem erhöhten Ring mit vier Griffmulden, auf einer runden Nabe mit zehn Schlitzen und fünf federnden Zungen. Die Heftseite hat nahe jeder Ecke ihrer Öffnungskante einen Halter und oben und unten eine Leiste, und eine niedrige Wand läuft innen um jede Hälfte. Die Hülle ist außerdem 14 mm dick, wie die echte. Führe 3D-Boxen bauen erneut aus, um früher erstellte Boxen zu aktualisieren"
    en: "Built 3D PS5 boxes now match the inside of the real case, measured from photos with a ruler. Opened, the disc sits in a raised ring with four finger dips, on a round hub with ten slits and five sprung tongues. The booklet side has a clip near each corner of its opening edge and a rail along its top and bottom, and a low wall runs round the inside of each half. The case is also 14 mm thick, as the real one is. Run Build 3D Boxes again to update boxes built before"
  - type: fix
    label: "Wenn RetroDB beendet wird, hält jetzt auch ein laufender Auftrag 3D-Boxen erstellen zusammen mit den anderen Aufträgen an. Die Box, an der er gerade arbeitet, wird noch fertig gebaut, damit keine Box halb fertig bleibt"
    en: "When RetroDB is stopped, a running Build 3D Boxes job now stops with the other jobs. It finishes the box it is on first, so no box is left half built"
  - type: fix
    label: "Auf einem Handy bringt ein Tippen auf einen Buchstaben in der A-Z-Leiste der Bibliothek jetzt das erste Spiel dieses Buchstabens an den oberen Bildschirmrand, auch wenn RetroDB diese Spiele erst laden muss. Vorher blieb das Spiel am unteren Bildschirmrand hinter der unteren Leiste"
    en: "On a phone, tapping a letter in the Library's A-Z bar now brings that letter's first game to the top of the screen, even when RetroDB has to load those games first. Before, the game was left at the bottom of the screen, behind the bottom bar"
  - type: fix
    label: "Der kleine Pfeil an jeder Dropdown-Liste übernimmt jetzt die Farbe deines Farbdesigns, statt immer blaugrün zu sein"
    en: "The small arrow on each drop-down list now takes your colour theme's colour, instead of always being blue-green"
  - type: fix
    label: "Die Disc oder das Modul in einer geöffneten 3D-Box liegt nicht mehr auf einem weißen Quadrat. RetroDB schneidet jetzt jedes heruntergeladene Bild einer Disc oder eines Moduls aus seinem einfarbigen weißen, grauen oder schwarzen Hintergrund aus und beschneidet es auf die Disc. Führe 3D-Boxen erstellen einmal aus, um früher heruntergeladene Bilder zu bereinigen"
    en: "The disc or cartridge in an open 3D box no longer sits on a white square. RetroDB now cuts each downloaded disc and cartridge picture out of its plain white, grey or black background and trims it to the disc. Run Build 3D Boxes once to clean up pictures downloaded before"
  - type: enhancement
    label: "Erstellte 3D-Boxen für GameCube sehen jetzt wie die echte Hülle aus: 134 mal 190 mal 15 mm, mit der Griffmulde und dem eckigen Verschlussloch an der Öffnungsseite. Geöffnet zeigt die Hülle die sechseckige Disc-Halterung, den Speicherkartenhalter, das eingeprägte Nintendo-GameCube-Logo und die zwei Bilder zum Umgang mit der Disc, und ein Spiel mit zwei Discs hält die erste Disc auf einer Klappe mit Scharnier über der zweiten. Führe 3D-Boxen erstellen erneut aus, um früher erstellte Boxen zu aktualisieren"
    en: "Built 3D GameCube boxes now match the real case: 134 by 190 by 15 mm, with the finger groove and the square latch hole on the opening edge. Opened, the case shows the six-sided disc tray, the memory card holder, the moulded Nintendo GameCube logo and the two disc-handling pictures, and a two-disc game holds its first disc on a hinged flap over the second. Run Build 3D Boxes again to update boxes built before"
  - type: enhancement
    label: "Erstellte 3D-Boxen gibt es jetzt in mehr der echten Hüllen. Die Edition eines Spiels wählt jetzt seine Hülle: Ein PS3-Spiel der Greatest Hits bekommt die rote Hülle, ein PS4-Spiel der PlayStation Hits die rote, und ein europäisches Platinum-Spiel die silberne. Ein europäisches PlayStation-Spiel auf drei oder mehr Discs bekommt die dicke Mehrfach-Disc-Hülle, New Super Luigi U seine grüne Wii-U-Hülle, und japanische Game-Gear-Boxen verlieren die Aufhängelasche. Das Fenster Bearbeiten hat eine neue Liste 3D-Box-Hülle, um jede andere Hülle von Hand zu wählen, zum Beispiel eine frühe Xbox-One-Hülle mit dem in die Front geprägten Logo"
    en: "Built 3D boxes come in more of the real cases. A game's Edition now picks its case: a Greatest Hits PS3 game gets the red case, a PlayStation Hits PS4 game the red one, and a European Platinum game the silver one. A European PlayStation game on three or more discs gets the thick multi-disc case, New Super Luigi U its green Wii U case, and Japanese Game Gear boxes lose the hanging tab. The Edit window has a new 3D box case list for picking any other case by hand, such as an early Xbox One case with the logo moulded into the front"
  - type: fix
    label: "PlayStation-Network-Abgleiche fragen Sony jetzt höchstens einmal alle 3 Sekunden an, in dem Tempo, das die PSN-Bibliothek selbst empfiehlt, damit dein PSN-Konto seltener auffällt. Große Bibliotheken brauchen etwas länger beim Abgleich"
    en: "PlayStation Network syncs now ask Sony at most once every 3 seconds, the pace the PSN library itself recommends, so your PSN account is less likely to be flagged. Large libraries take a little longer to sync"
  - type: fix
    label: "Die Bildgrößenanpassung in ROM-Werkzeuge wartet jetzt, bis eine Umwandlung von Bildern in WebP fertig ist, damit beide nicht mehr gleichzeitig dieselben Boxbilder ändern und eine verirrte Kopie zurücklassen. Steam- und Xbox-Erfolgsabgleiche pausieren jetzt auch nach einem Spiel, für das der Dienst nichts hatte, wie nach jedem anderen Spiel"
    en: "The Image Resizer in ROM Tools now waits for a conversion of pictures to WebP to finish, so the two no longer change the same box pictures at once and leave a stray copy behind. Steam and Xbox achievement syncs now pause after a game the service had nothing for, as they do after every other game"
  - type: fix
    label: "Schaltflächen, Reiter, Bereiche und Abzeichen, die bei jedem Farbthema blaugrün blieben, nehmen jetzt die Farbe des gewählten Themas an. Das gilt auch für die Diagramme auf der Seite Analyse. Auf der Wunschliste hat jedes Prioritätsabzeichen wieder seinen farbigen Hintergrund und Rahmen"
    en: "Buttons, tabs, panels and badges that stayed blue-green whatever colour theme you chose now take the chosen theme's colour. So do the charts on the Analytics page. On the Wishlist, each priority badge has its coloured background and border back"
  - type: fix
    label: "Auf einem Handy scrollen die Filterleisten der Seiten Bibliothek, Systeme und Protokolle jetzt mit der Seite weg, statt stehen zu bleiben und bis zu zwei Drittel des Bildschirms zu verdecken. Reiterleisten, etwa in ROM-Werkzeuge und Einstellungen, bleiben oben als eine Zeile, die man seitwärts wischt, mit dem aktuellen Reiter im Blick"
    en: "On a phone, the filter bars on the Library, Systems and log pages now scroll away with the page, instead of staying on screen and covering up to two thirds of it. Tab rows, such as those in ROM Tools and Settings, stay at the top as one row you swipe sideways, with the current tab in view"
  - type: enhancement
    label: "Erstellte 3D-Boxen sehen den echten Hüllen jetzt ähnlicher. Hüllen für Mega Drive (Genesis) und Master System sind etwas kleiner, passend zu einer echten, mit dem Lineal gemessenen Hülle, und japanische Mega-Drive-Hüllen haben keine Aufhängelasche mehr. Ein frühes US-PlayStation-Spiel mit hohem gescanntem Cover bekommt die hohe Longbox, und ein US-NES-Spiel, das von Oktober 1985 bis September 1987 erschien, bekommt die Schachtel mit Aufhängelasche. Führe 3D-Boxen bauen erneut aus, um früher erstellte Boxen zu aktualisieren"
    en: "Built 3D boxes look more like the real cases. Mega Drive (Genesis) and Master System cases are a little smaller, to match a real case measured with a ruler, and Japanese Mega Drive cases no longer have a hanging tab. An early US PlayStation game whose scanned cover is tall gets the tall long box, and a US NES game released from October 1985 to September 1987 gets the box with a hanging tab. Run Build 3D Boxes again to update boxes built before"
  - type: enhancement
    label: "Eine erstellte 3D-Box passt jetzt zum 3D-Box-Bild des Spiels auf der Spielseite. Ohne Rücken-Scan nimmt sie ihren gedruckten Rücken aus diesem Bild, und auch ihre Vorderseite, wenn das gescannte Cover die Ausgabe eines anderen Landes ist. Die Scans von MobyGames kommen jetzt von der Ausgabe, die dieses Bild zeigt, sofern MobyGames sie hat, und ein europäisches Saturn-Spiel bekommt die hohe Saturn-Hülle statt einer CD-Hülle. Führe 3D-Boxen bauen erneut aus, um früher erstellte Boxen zu aktualisieren"
    en: "A built 3D box now matches the game's 3D box picture on the game page. With no spine scan it takes its printed spine from that picture, and its front too when the scanned cover is another country's release. MobyGames' scans now come from the release that picture shows, where MobyGames has it, and a European Saturn game gets the tall Saturn case instead of a CD case. Run Build 3D Boxes again to update boxes built before"
  - type: security
    label: "Leitet ein Bild- oder Videolink RetroDB an eine andere Adresse weiter, geht RetroDB jetzt nur zu der Adresse, die es gerade geprüft hat, sodass eine Website es nicht zu einem Gerät in Ihrem Heimnetz lenken kann"
    en: "When a picture or video link sends RetroDB on to another address, RetroDB now goes only to the address it has just checked, so a web site cannot steer it to a device on your home network"
  - type: security
    label: "Der Multi-Disc-Organizer in den ROM-Werkzeugen lehnt jetzt einen Konsolen- oder Spielnamen ab, der auf einen anderen Ordner zeigt, und verschiebt Discs so nur im eigenen Ordner der Konsole"
    en: "The Multi-Disc Organizer in ROM Tools now refuses a console or game name that points to another folder, so it only ever moves discs inside that console's own folder"
  - type: fix
    label: "Wenn dein Computer auf weniger Bewegung eingestellt ist, gleitet RetroDB nicht mehr, wenn es die Seite für dich scrollt, etwa bei Nach oben oder beim Sprung zu einem Abschnitt: Es springt sofort dorthin"
    en: "If your computer is set to reduce motion, RetroDB no longer glides when it scrolls the page for you, such as Back to top or jumping to a section: it moves there at once"
  - type: fix
    label: "Auf der Seite Systeme übernehmen die beiden Filterfelder jetzt die Farbe deines Themas statt eines festen Dunkelblaus"
    en: "On the Systems page, the two filter boxes now take their colour from your theme instead of a fixed dark blue"
  - type: fix
    label: "Auf dem Handy lässt die Seite Systeme unter jeder Konsolenkarte keine große Lücke mehr, auch nachdem das Fenster schmaler gemacht wurde. Eine lange Überschrift aus einem Wort in Einstellungen bricht jetzt in die nächste Zeile um, statt über den Bildschirmrand zu laufen"
    en: "On a phone, the Systems page no longer leaves a large empty space under each console card, even after the window is made narrower. A long one-word heading in Settings now breaks onto the next line instead of running off the screen"
  - type: fix
    label: "MobyGames findet jetzt ein Spiel, das es unter einem Namen mit Punkten führt, etwa M.U.S.H.A. für MUSHA: Findet der ganze Name nichts, fragt es Buchstabe für Buchstabe noch einmal"
    en: "MobyGames now finds a game it lists under a name written with dots, such as M.U.S.H.A. for MUSHA: when the whole name finds nothing, it asks again letter by letter"
  - type: fix
    label: "Blasser grauer Text ist in jedem Design leichter zu lesen: Hinweise, Platzhalter und kleine Beschriftungen sind heller. Schwer lesbare Abzeichen sind ebenfalls klarer: das PEGI-Abzeichen auf Spielkarten, die Konsolen-Abzeichen, die Schaltfläche Umbenennen, die RetroAchievements-Anzahl und das Rot des Designs Cathedral"
    en: "Faint grey text is easier to read in every theme: hints, placeholders and small labels are brighter. Badges that were hard to read are clearer too: the PEGI badge on game cards, the console badges, the Rename button, the RetroAchievements count and the Cathedral theme's red"
  - type: fix
    label: "MobyGames wird jetzt wie geplant vor der KI gefragt, auch wo die Reihenfolge der Quellen gespeichert wurde, bevor es MobyGames gab. Die KI füllt also nicht mehr aus, was MobyGames weiß. MobyGames lehnt Anfragen von RetroDB außerdem seltener ab: RetroDB wartet jetzt etwas länger zwischen ihnen, und das Speichern deiner API-Schlüssel lässt keine Anfrage mehr vordrängeln"
    en: "MobyGames is now asked before the AI, as planned, even where the order of sources was saved before MobyGames was added, so the AI no longer fills in what MobyGames knows. MobyGames also refuses RetroDB's requests less often: RetroDB now waits a little longer between them, and saving your API keys no longer lets a request jump the queue"
  - type: fix
    label: "AI-Auffüllen zeigt der KI nichts mehr, was MobyGames geliefert hat, und lässt diese Angaben so, wie MobyGames sie gegeben hat, weil die Bedingungen von MobyGames verbieten, seine Daten an eine KI weiterzugeben. Der Hinweis „Data by MobyGames.com“ lautet jetzt in jeder Sprache gleich, wie MobyGames es verlangt"
    en: "AI Fill no longer shows the AI anything MobyGames supplied, and leaves those details as MobyGames gave them, because MobyGames' terms forbid passing its data to an AI. The \"Data by MobyGames.com\" credit now reads the same in every language, as MobyGames asks"
  - type: fix
    label: "Auf dem Handy ist die Liste der Quellen unter Einstellungen > Scraping wieder lesbar: Name und Beschreibung nutzen die volle Breite, Status und Ein/Aus-Schalter stehen in der Zeile darunter. Vorher war der Text auf ein Wort pro Zeile gequetscht und der Schalter abgeschnitten"
    en: "On a phone, the list of sources in Settings > Scraping is readable again: each name and description uses the full width, with its status and on/off switch on the line below. Before, the text was squeezed to one word a line and the switch was cut off"
  - type: fix
    label: "Mehr von RetroDB lässt sich jetzt allein mit der Tastatur bedienen. Spalten in den Berichten sortieren mit Enter, und die Schaltfläche Löschen bei Screenshots erscheint, sobald Tab sie erreicht. Wenn du einen Tag oder einen Bibliotheksfilter entfernst, auf der Seite „Änderungsprotokoll“ Load More drückst oder während eines Scrapes die Wunschliste aktualisierst, bleibst du jetzt an deiner Stelle, statt an den Seitenanfang zurückgeworfen zu werden"
    en: "More of RetroDB now works with the keyboard alone. Report columns sort with Enter, and the screenshot Delete button appears when Tab reaches it. Removing a tag or a library filter, pressing Load More on the Changelog, or a wishlist refresh during a scrape now keeps your place instead of sending you back to the top of the page"
  - type: fix
    label: "Mit einem Screenreader sagen jetzt mehr Schaltflächen und Felder, was sie sind. Kontrollkästchen nennen ihr Spiel oder ihre Datei, und Such- und Filterfelder haben Namen. Schaltflächen, die nur ein Symbol zeigen (×, ✎, 🗑️), sagen, was sie tun, und Diagramme in Analytics haben Namen. Die Filter-Schaltflächen bei Logs, Berichten und PSN Trophies sagen, ob sie an sind, und Fehler bei Anmeldung und Einrichtung werden vorgelesen"
    en: "With a screen reader, more buttons and boxes now say what they are. Tick boxes name their game or file, and search and filter boxes have names. Buttons showing only a symbol (×, ✎, 🗑️) say what they do, and Analytics charts are named. The filter buttons on Logs, Reports and PSN Trophies say whether they are on, and sign-in and setup errors are read out"
  - type: feature
    label: "Die geöffnete 3D-Box zeigt jetzt bei mehr Spielen die echte Disc oder das echte Modul: Hat MobyGames kein Bild davon, nimmt RetroDB das von ScreenScraper oder das, das ES-DE schon heruntergeladen hat. Scrape ein Spiel erneut, um es hinzuzufügen"
    en: "The open 3D box now shows the real disc or cartridge for more games: when MobyGames has no picture of it, RetroDB uses ScreenScraper's, or the one ES-DE has already downloaded. Scrape a game again to add it"
  - type: enhancement
    label: "Die Seite „Änderungsprotokoll“ ist leichter zu lesen: Jede Version zeigt ein kleines Abzeichen für jede Art von Änderung, und die Änderungen selbst stehen als normaler Text unter Neue Funktionen, Verbesserungen, Fehlerbehebungen und Sicherheit. Die Seite ist außerdem breiter"
    en: "The Changelog page is easier to read: each version shows one small badge for each kind of change, and the changes themselves are ordinary text grouped under New features, Improvements, Fixes and Security. The page is also wider"
  - type: feature
    label: "Die 3D-Box eines Mega-Drive-, Genesis- oder Master-System-Spiels hat jetzt oben die Aufhängelasche aus dem Laden mit ihrem Schlitz sowie einen erhöhten Rand und eine tiefere Stufe, wo sich die Hülle öffnet, wie bei der echten Hülle. Game-Gear-Boxen bekommen die Lasche ebenfalls. Führe 3D-Boxen erstellen erneut aus, um den Rand bei früher erstellten Boxen zu aktualisieren"
    en: "The 3D box of a Mega Drive, Genesis or Master System game now has the shop's hanging tab at the top, with its slot, and a raised lip and a deeper step where the case opens, as on the real case. Game Gear boxes get the tab too. Run Build 3D Boxes again to update the lip on boxes built before"
  - type: fix
    label: "Dateigrößen berechnen unter Einstellungen > System sagt jetzt, was es gefunden hat, in einem Feld, das unter der Schaltfläche stehen bleibt, und sucht nicht mehr auf der Festplatte nach importierten Spielen, die keine Datei haben"
    en: "Calculate File Sizes in Settings > System now says what it found, in a box that stays under the button, and no longer looks on disk for imported games, which have no file"
  - type: fix
    label: "MobyGames findet jetzt ein Spiel, dessen Name etwas anders geschrieben ist, etwa „Castlevania Bloodlines“ für „Castlevania: Bloodlines“, und versucht das Hauptwort des Namens, wenn der ganze Name nichts findet. Eine Suche direkt nach dem Öffnen von Dashboard oder Einstellungen kommt nicht mehr leer zurück, und der MobyGames-Status dort zeigt nicht mehr Verbindungsfehler an, wenn MobyGames langsam ist"
    en: "MobyGames now finds a game whose name is written a little differently, such as 'Castlevania Bloodlines' for 'Castlevania: Bloodlines', and tries the name's main word when the whole name finds nothing. A search just after opening the Dashboard or Settings no longer comes back empty, and the MobyGames status there no longer says Connection error when MobyGames is slow"
  - type: feature
    label: "Jeder Nutzer kann jetzt seinen eigenen RetroAchievements-Fortschritt für eine Konsole löschen, mit Clear My Progress („Meinen Fortschritt löschen“) auf deren Achievements-Seite. Die anderen Nutzer behalten ihren; die Daten aller zu löschen bleibt dem Admin vorbehalten"
    en: "Every user can now clear their own RetroAchievements progress for one console, with Clear My Progress on its Achievements page. Other users keep theirs; clearing everyone's data stays with the admin"
  - type: fix
    label: "Die Zeile Ähnliche Spiele auf einer Spielseite wird jetzt auch dann angezeigt, wenn der Server schnell antwortet"
    en: "The Similar Games row on a game page no longer fails to show when the server answers quickly"
  - type: fix
    label: "Das Fenster Metadaten suchen wird jetzt breiter, damit jede eingeschaltete Quelle hineinpasst, und teilt die Quellen auf einem kleineren Bildschirm in gleichmäßige Zeilen auf, statt sie zusammenzuquetschen"
    en: "The Search Metadata window now widens to fit every source you have switched on, and on a smaller screen splits the sources into even rows instead of squeezing them"
  - type: feature
    label: "MobyGames ist eine neue Scrape-Quelle, die als letzte vor der KI abgefragt wird, sobald du deinen eigenen MobyGames-API-Schlüssel speicherst. Sie füllt leere Angaben, die Box-Vorder- und -Rückseite und Screenshots und behält jeden Scan der echten Box, des Rückens, der Disc und des Handbuchs für die 3D-Box. MobyGames erlaubt einige hundert Anfragen pro Stunde; ein Spiel, das übersprungen wurde, weil die Stunde aufgebraucht war, wird nach dem Zurücksetzen von selbst erneut abgefragt. Eine Spielseite mit Angaben von MobyGames verlinkt auf dieses Spiel bei MobyGames.com"
    en: "MobyGames is a new scrape source, asked last before the AI once you save your own MobyGames API key. It fills empty details, the box front and back and screenshots, and keeps every scan of the real box, spine, disc and manual for the 3D box. MobyGames allows a few hundred requests an hour; a game skipped when the hour runs out is asked about again by itself after the reset"
  - type: feature
    label: "Gescrapte Spiele mit Cover bekommen jetzt von selbst eine drehbare 3D-Box, auf der echten Hülle für ihre Konsole und Region, aus den Box-Scans gebaut, mit einem gedruckten Rücken, wenn keiner gescannt wurde. 3D-Boxen bauen in den ROM-Werkzeugen macht das für früher gescrapte Spiele. Eine aus Slipcase importierte Box wird nie verändert"
    en: "Scraped games with a cover now get a turning 3D box by themselves, on the real case for their console and region, made from the box scans, with a printed spine when none was scanned. Build 3D Boxes in ROM Tools does this for games scraped before. A box imported from Slipcase is never changed"
  - type: feature
    label: "Die 3D-Box lässt sich jetzt öffnen. Ihr Deckel schwingt am Scharnier auf und zeigt, was drin ist, wie in der echten Hülle: die Disc auf ihrer Halterung oder das Modul, das Handbuch unter seinen Klammern und das Inlay, aus den Box-Scans des Spiels. Jeder Scan lässt sich auch einzeln ansehen. Keep-Cases, Klappboxen und Handheld-Hüllen zeigen außerdem ihre abgerundeten Kanten und die Naht, an der sie sich öffnen; führe 3D-Boxen bauen erneut aus, um früher gebaute Boxen zu aktualisieren"
    en: "The 3D box now opens. Its lid swings open on the hinge and shows what is inside, as in the real case: the disc on its hub or the cartridge, the manual under its clips and the inside cover, from the game's box scans. Each scan can also be viewed on its own. Keep cases, clamshells and handheld cases also show their rounded edges and the seam where they open; run Build 3D Boxes again to update boxes built before"
  - type: fix
    label: "Löschen auf der Spielseite entfernt nicht mehr die Bilder einer aus Slipcase importierten Box"
    en: "Clear on the game page no longer deletes the pictures of a box imported from Slipcase"
  - type: fix
    label: "Einstellungen > Emulatoren findet jetzt Azahar, den 3DS-Emulator: sein Windows-Programm, sein Linux-AppImage und sein Flatpak"
    en: "Settings > Emulators now finds Azahar, the 3DS emulator: its Windows program, its Linux AppImage and its Flatpak"
  - type: fix
    label: "Ein Spiel, das sich sofort nach dem Start schließt, wird jetzt immer aufgeräumt, etwa indem die RetroAchievements-Anmeldung zurückgenommen wird, die RetroDB diesem Start gegeben hat"
    en: "A game that closes the moment it starts is now always tidied up after, such as taking back the RetroAchievements sign-in RetroDB gave that launch"
  - type: fix
    label: "Ein Standard-Emulator, den du für ein System gewählt hast, bleibt jetzt dessen einziger Standard, wenn RetroDB beim Start seine eigenen Emulator-Vorschläge hinzufügt"
    en: "A default emulator you picked for a system now stays its only default when RetroDB adds its own emulator suggestions at start-up"
  - type: fix
    label: "Schlägt das Aktualisieren der Shader des Players fehl, bleiben deine bisherigen Shader erhalten. Die Liste der installierten Cores kann beim Speichern nicht mehr halb verloren gehen, und eine Core-Liste, die sich nicht laden lässt, wird nach fünf Minuten statt nach einer Stunde erneut versucht"
    en: "If updating the player's shaders fails, the shaders you had are kept. The list of installed cores can no longer be lost part-way through saving, and a core list that fails to download is tried again after five minutes instead of an hour"
  - type: fix
    label: "Auf Linux-Systemen, die ihr eigenes Python schützen, etwa Debian, Ubuntu und Fedora, legt der Installer für RetroDB jetzt einen eigenen Python-Ordner an, statt seine Teile ins System-Python zu zwingen, was Systemwerkzeuge beschädigen konnte"
    en: "On Linux systems that protect their own Python, such as Debian, Ubuntu and Fedora, the installer now gives RetroDB its own Python folder instead of forcing its parts into the system's Python, which could break system tools"
  - type: security
    label: "Die Einstellungsdateien, die der Installer anlegt und die Passwörter und Schlüssel enthalten, kann jetzt nur noch dein eigenes Konto lesen, nicht andere Personen, die denselben Computer nutzen"
    en: "The settings files the installer creates, which hold passwords and keys, can now be read only by your own account, not by other people who use the same computer"
  - type: fix
    label: "Nach der Installation öffnet der Installer RetroDB jetzt auf dem Port, den es wirklich nutzt, sobald RetroDB bereit ist. Vorher öffnete er immer Port 5000 nach einer festen Wartezeit, was eine Fehlerseite zeigen konnte"
    en: "After installing, the installer now opens RetroDB on the port it really uses, once RetroDB is ready. Before, it always opened port 5000 after a fixed wait, which could show an error page"
  - type: enhancement
    label: "Unter Windows und macOS kann RetroDB jetzt deine Emulatoren und RetroArch unter Einstellungen > Emulatoren für dich finden und sucht dabei in den üblichen Ordnern des Systems, sofern du keine eigenen angibst"
    en: "On Windows and macOS, RetroDB can now find your emulators and RetroArch for you in Settings > Emulators, looking in the usual folders for that system unless you list your own"
  - type: fix
    label: "Unter Windows und macOS findet RetroDB jetzt die Einstellungsordner von DuckStation und PCSX2, sodass spielbezogene Einstellungen und die BIOS-Prüfung dort funktionieren. Unter Linux wird der DuckStation-Ordner auch gefunden, wenn XDG_CONFIG_HOME gesetzt ist"
    en: "On Windows and macOS, RetroDB now finds DuckStation's and PCSX2's settings folders, so per-game settings and the BIOS check work there. On Linux, DuckStation's folder is also found when XDG_CONFIG_HOME is set"
  - type: fix
    label: "Das Umwandeln einer Disc in CHD kann keine Datei außerhalb des eigenen Spielordners mehr löschen, wenn deren .cue- oder .gdi-Datei dorthin verweist"
    en: "Converting a disc to CHD can no longer delete a file outside the game's own folder when its .cue or .gdi sheet points there"
  - type: fix
    label: "Wird eine Disc umbenannt oder umgewandelt, wird ihre Multi-Disc-Playlist (.m3u) sicher aktualisiert: Eine Playlist, die nicht gelesen werden kann, bleibt unverändert statt geleert zu werden, und Disc-Namen mit Akzentbuchstaben von älteren Systemen behalten ihre Buchstaben"
    en: "When a disc is renamed or converted, its multi-disc playlist (.m3u) is updated safely: a playlist that cannot be read is left alone instead of being emptied, and disc names with accented letters from older systems keep their letters"
  - type: fix
    label: "Wird ein neuer Standard-Emulator für ein System gewählt und lässt sich dann nicht speichern, bleibt der alte Standard erhalten, statt das System ohne Standard-Emulator zu lassen"
    en: "Choosing a new default emulator for a system that then fails to save keeps the old default, instead of leaving the system with no default emulator"
  - type: fix
    label: "Reagiert die Grafikkarte während einer KI-Hochskalierung nicht mehr, gibt RetroDB sie jetzt innerhalb von etwa zwei Minuten frei und skaliert mit dem Prozessor weiter. Vorher blieb die Karte belegt, bis RetroDB neu gestartet wurde"
    en: "If the graphics card stops responding during an AI upscale, RetroDB now lets go of it within about two minutes and carries on upscaling with the processor. Before, the card stayed busy until RetroDB was restarted"
  - type: fix
    label: "Bei einer langsamen Internetverbindung wird der erste Download der KI-Modelle für Hochskalierung und Hintergrundentfernung nicht mehr abgebrochen, als wäre er stehen geblieben. Schlägt der Download für die Hochskalierung fehl, versucht RetroDB es 15 Minuten später erneut, statt die KI-Hochskalierung bis zu einem Neustart abzuschalten"
    en: "On a slow internet connection, the first download of the AI upscaling and background-removal models is no longer cut off as if it had stopped. If the upscaling download fails, RetroDB tries again 15 minutes later instead of leaving AI upscaling off until a restart"
  - type: fix
    label: "Ein beschädigtes Museum-Foto führt nicht mehr dazu, dass die Hintergrundentfernung für alle folgenden Fotos die Grafikkarte nicht mehr nutzt"
    en: "A damaged Museum photo no longer makes background removal stop using the graphics card for every photo after it"
  - type: security
    label: "Bevor ein Update installiert wird, prüft RetroDB jetzt, ob es eine echte Signatur aus RetroDBs eigenem Veröffentlichungsprozess trägt. Ein Download, den jemand verändert oder ausgetauscht hat, wird abgelehnt – auch wenn seine Prüfsummendatei ebenfalls ausgetauscht wurde"
    en: "Before an update installs, RetroDB now checks that it carries a genuine signature from RetroDB's own release process. A download someone has changed or swapped is refused, even if its checksum file was swapped too"
  - type: fix
    label: "Schlägt ein Update fehl und RetroDB kehrt zu deiner bisherigen Version zurück, geht nichts verloren, was du beim Herunterfahren noch gespeichert hast. Die Kopie deiner Bibliothek, die dabei zurückgespielt wird, entsteht jetzt erst, wenn RetroDB ganz beendet ist, und wird nur zurückgespielt, wenn die neue Version gestartet war. Vom Update installierte Programmbibliotheken werden ebenfalls auf die alten Versionen zurückgesetzt"
    en: "If an update fails and RetroDB goes back to the version you had, nothing you saved while it was closing down is lost. The copy of your library it restores is now taken after RetroDB has fully stopped, and is only restored if the new version started. Program libraries the update installed are put back to the old versions too"
  - type: fix
    label: "Pop-up-Fenster verdecken jetzt die obere und untere Leiste auf dem Handy und die Seitenleiste am Computer. Vorher blieben die Leisten hell über Fenstern wie den Filterlisten der Bibliothek, den Trophäen-Scans und den Fenstern unter Berichte und Einstellungen und ließen sich weiter antippen"
    en: "Pop-up windows now cover the phone's top and bottom bars, and the sidebar on a computer. Before, the bars stayed bright on top of windows such as the Library's filter lists, the trophy scans and the Reports and Settings windows, and could still be pressed"
  - type: fix
    label: "Spielkarten in der Bibliothek und auf der Seite eines Systems überlappen nicht mehr die Karte darunter, wenn die Liste zwei oder mehr Spalten zeigt. Eine Karte, die nach dem Platzieren wuchs, etwa weil ihre Altersfreigabe-Symbole in eine zweite Zeile umbrachen, verdeckte vorher den oberen Teil der nächsten Karte"
    en: "Game cards in the Library and on a system's page no longer run over the card below them when the list shows two or more columns. A card that grew after it was placed, such as one whose rating icons wrapped onto a second row, used to cover the top of the next card"
  - type: fix
    label: Eine Meldung, die bei geöffnetem Fenster erscheint, etwa "Dieses Spiel ist bereits auf deiner Wunschliste", wird jetzt über dem Fenster angezeigt. Vorher verschwand sie hinter dem dunklen Hintergrund, sodass ein Klick auf eine Schaltfläche wie „Zur Wunschliste hinzufügen“ scheinbar nichts bewirkte
    en: A message shown while a window is open, such as "This game is already on your wishlist", now shows on top of the window. Before, it hid behind the dark backdrop, so pressing a button like Add to Wishlist seemed to do nothing
  - type: fix
    label: Der Link „ROM Tools“ in der Seitenleiste leuchtet jetzt auf jeder ROM-Tools-Seite. Bei Regionalversionen, Massen-AI-Auffüllen, MAME-Namen, Fix Box und Handbuch-Regionen sowie HLTB – Prüfung ausstehend blieb er dunkel
    en: The ROM Tools link in the sidebar now lights up on every ROM Tools page. Regional Versions, Bulk AI Fill, MAME Names, Fix Box and Manual Regions and HLTB Pending Review left it dark
  - type: fix
    label: Cover- und Handbuch-Regionen korrigieren und HLTB-Überprüfung ausstehend zeigen jetzt oben die Reihe der ROM-Tools-Tabs an, wie die anderen Tools, sodass du von einem Tool zum nächsten wechseln kannst. Cover- und Handbuch-Regionen korrigieren hat auf jeder Tool-Seite einen eigenen Tab
    en: Fix Box and Manual Regions and HLTB Pending Review now show the row of ROM Tools tabs at the top, like the other tools, so you can go from one tool to the next. Fix Box and Manual Regions has a tab of its own on every tool page
  - type: fix
    label: Schaltflächen und Meldungen, die bisher unabhängig von der Sprache auf Englisch erschienen, werden jetzt in jeder von RetroDB angebotenen Sprache in dieser angezeigt. Manche hatten keine Übersetzung, andere eine falsche, zum Beispiel wurde „Create Backup“ im Deutschen als „Sicherung wiederherstellen“ angezeigt
    en: Buttons and messages that showed in English whatever your language now show in it, in every language RetroDB offers. Some had no translation, and some showed a wrong one, such as Create Backup reading as "restore backup" in German
  - type: enhancement
    label: Admins und Editoren können unter Einstellungen > Konto > Sprachen, die ich lese die Sprachen ankreuzen, die sie lesen. Hat ein Spiel kein Cover und keinen Namen aus seiner eigenen Region, wählt RetroDB eines in einer Sprache, die jemand, der scrapt, lesen kann. Wer nichts ankreuzt, gilt als Leser der eigenen Bildschirmsprache
    en: Admins and editors can tick the languages they read, under Settings > Account > Languages I can read. When a game has no box picture or name from its own region, RetroDB picks one in a language someone who scrapes can read. Anyone who ticks none counts as reading their screen language
  - type: fix
    label: Eine Europa-Kopie bekommt nicht mehr nur deshalb ein deutsches, französisches, spanisches oder italienisches Cover oder einen solchen Namen, weil ScreenScraper kein allgemeines Europa-Cover hat. Sie bekommt das britische oder eines aus deiner Regionsliste, etwa Welt oder USA, außer jemand, der scrapt, liest diese Sprache. Cover- und Handbuch-Regionen korrigieren prüft Cover und Handbücher erneut, die in eine Sprache getauscht wurden, die niemand liest
    en: A Europe copy no longer gets a German, French, Spanish or Italian box picture or name just because ScreenScraper has no general Europe one. It gets the UK one, or one from your region list such as World or USA, unless someone who scrapes reads that language. Fix Box and Manual Regions looks again at the boxes and manuals it swapped into a language nobody reads
  - type: enhancement
    label: Cover- und Handbuch-Regionen korrigieren hat eine eigene Seite, die du über die Karte in den ROM-Werkzeugen öffnest. Die Liste „Was sich geändert hat“ zeigt jedes Spiel, bei dem die Korrektur ein Cover, 3D-Cover oder Handbuch getauscht hat, nach Konsole gruppiert, mit dem aktuellen Cover und der Region, aus der jede neue Datei stammt, damit du sie prüfen kannst. Spiele, die schon vor diesem Update korrigiert wurden, stehen ebenfalls darin
    en: Fix Box and Manual Regions has its own page, opened from its ROM Tools card. Its What changed list shows every game the fix swapped a box, 3D box or manual for, grouped by console, with the box as it is now and the region each new file came from, so you can check them. Games already fixed before this update are listed too
  - type: enhancement
    label: Cover- und Handbuch-Regionen korrigieren lässt sich mit Schaltflächen auf seiner Seite pausieren, fortsetzen und stoppen. Früher ging das Stoppen nur durch erneutes Drücken der Karte, worauf nichts auf dem Bildschirm hinwies
    en: Fix Box and Manual Regions can be paused, resumed and stopped with buttons on its page. Before, the only way to stop it was to press its card again, which nothing on screen said
  - type: enhancement
    label: Cover- und Handbuch-Regionen korrigieren zeigt beim Ausführen einen Fortschrittsbalken neben den Schaltflächen. Die Liste „Was sich geändert hat“ merkt sich, welche Konsolen du zugeklappt hast, sodass sie beim nächsten Öffnen der Seite in diesem Browser zugeklappt bleiben
    en: Fix Box and Manual Regions shows a progress bar beside its buttons while it runs. Its What changed list remembers which consoles you closed, so they stay closed the next time you open the page in this browser
  - type: enhancement
    label: Während Cover- und Handbuch-Regionen korrigieren läuft, erscheint jedes getauschte Spiel sofort in der Liste „Was sich geändert hat“ unter seiner Konsole. Früher musstest du die Seite neu laden, um sie zu sehen
    en: While Fix Box and Manual Regions runs, each game it swaps joins its What changed list straight away, under its console. Before, you had to reload the page to see them
  - type: fix
    label: Ein Fortschrittsbalken, der noch nicht gestartet ist, zeigt am linken Ende kein einzelnes „%“ mehr
    en: A progress bar that has not started yet no longer shows a lone "%" at its left end
  - type: fix
    label: Die Logos von Wii U, PlayStation Vita, Xbox und Xbox One auf der Systeme-Seite füllen ihren Platz wie die anderen. Das PlayStation-Vita-Logo und das ONE in Xbox One sind jetzt weiß, damit sie in jedem Design lesbar sind
    en: The Wii U, PlayStation Vita, Xbox and Xbox One logos on the Systems page fill their space like the others. The PlayStation Vita logo and the ONE in Xbox One are now white, so they can be read on every theme
  - type: enhancement
    label: Xbox Series X|S, das der Xbox-Import hinzufügt, hat ein eigenes Logo, und das Fenster der ℹ️-Schaltfläche zeigt ein Bild der Konsolen. Außerdem hat es seinen vollen Namen, Microsoft Xbox Series X|S, und seine technischen Daten
    en: Xbox Series X|S, which the Xbox import adds, has its own logo, and the window its ℹ️ button opens shows a picture of the consoles. It also has its full name, Microsoft Xbox Series X|S, and its specifications
  - type: fix
    label: Ein System, das der Import von Steam, Xbox, PSN oder CLZ hinzufügt, bekommt jetzt sein Logo, seinen Typ und seinen vollen Namen, sofern RetroDB sie kennt. Auf diese Weise früher hinzugefügte Systeme bekommen sie, wenn RetroDB aktualisiert wird
    en: A system the Steam, Xbox, PSN or CLZ import adds now gets its logo, its type and its full name where RetroDB knows one. Systems added that way before get them when RetroDB updates
  - type: enhancement
    label: Cover- und Handbuch-Regionen korrigieren fragt ScreenScraper zu jedem Spiel nur einmal ab. Früher begann jeder Lauf wieder beim ersten Spiel und fragte zu jedem nach, auch zu bereits geprüften. Spiele, die nach dem ersten Lauf gescrapt wurden, haben schon die richtigen Cover und werden ohne Abfrage übersprungen
    en: Fix Box and Manual Regions asks ScreenScraper about each game only once. Before, every run started again at the first game and asked about every one, even games it had already checked. Games scraped after its first run already have the right boxes, so it skips them without asking
  - type: fix
    label: Die ROM-Werkzeugseiten, die scannen oder konvertieren (Screenshot Dedup, Screenshot Review, Duplicate Finder, CHD Converter und CHD Verify), behalten ihren letzten Lauf, wenn du die Seite verlässt und zurückkommst. Ein laufender Scan zeigt weiter seinen Fortschritt, ein beendeter zeigt seine Ergebnisse noch 30 Minuten nach dem Ende. Früher war die Seite danach leer
    en: The ROM tool pages that scan or convert (Screenshot Dedup, Screenshot Review, Duplicate Finder, CHD Converter and CHD Verify) keep their last run when you leave the page and come back. A running scan carries on showing its progress, and a finished one shows its results again, for 30 minutes after it ends. Before, the page came back empty
  - type: fix
    label: Übersetzte Hilfeseiten nennen jede Schaltfläche, jeden Tab und jede Seite so, wie die App sie in dieser Sprache anzeigt, und zitieren ihre Meldungen wie die App. Der Abschnitt Bulk AI Fill nennt keine Karte mehr, die es in der App nicht gibt. Die Schaltfläche Hintergrund ist jetzt auf Italienisch, Koreanisch und Chinesisch korrekt, und einige Zulu-Beschriftungen beginnen nicht mehr mit einem überflüssigen „N:“
    en: Translated help pages call every button, tab and page by the name the app shows in that language, and quote its messages as the app shows them. The Bulk AI Fill section no longer names a card the app does not have. The Background button now reads correctly in Italian, Korean and Chinese, and some Zulu labels no longer start with a stray "N:"
  - type: feature
    label: 'Arcade-Spiele mit RetroAchievements sammeln diese jetzt. Sie starten in RetroArch (RetroDB) mit dem Core FinalBurn Neo, den RetroAchievements unterstützt, statt in MAME, das nicht unterstützt wird; alle anderen Arcade-Spiele bleiben in MAME. Ein neues Cheat-Paket FinalBurn Neo Arcade unter Einstellungen → Emulatoren → Cheats listet die Cheats jedes solchen Spiels auf seiner Seite. FinalBurn Neo schaltet Cheats bei jedem Spielstart aus, daher aktivierst du sie beim Spielen im RetroArch-Menü: F1, dann Core-Optionen, dann Cheat'
    en: 'Arcade games with RetroAchievements now earn them. They start in RetroArch (RetroDB) with the FinalBurn Neo core, which RetroAchievements supports, instead of MAME, which it does not; every other arcade game stays in MAME. A new FinalBurn Neo arcade cheats pack under Settings → Emulators → Cheats lists each such game''s cheats on its page. FinalBurn Neo turns cheats off each time a game starts, so you switch them on in RetroArch''s menu while you play: F1, then Core Options, then Cheat'
  - type: performance
    label: 'Einstellungen öffnet sich für Admins schneller. Beim Öffnen werden nicht mehr das Logo und das Hardwarebild jedes Systems geprüft: Diese Tabelle füllt sich, wenn du den Tab Anpassung öffnest. Ein Speichern direkt nach dem Öffnen wartet nicht mehr auf diese Prüfungen'
    en: 'Settings opens faster for admins. It no longer checks every system''s logo and hardware picture as it opens: that table fills when you open the Customization tab. A Save pressed straight after opening no longer waits behind those checks'
  - type: enhancement
    label: 'Einstellungen sind aufgeräumter. Deine eigenen Optionen stehen zusammen unter Einstellungen → Konto: Design und Sprache (mit dem bewegten Hintergrund) und wie lange Meldungen auf dem Bildschirm bleiben, was jetzt für jede Person einzeln gilt. Bibliothek → Pfade enthält alle vier Ordner unter einem Speichern. System → Server zeigt den Port und den Ort der Datenbank. Support Development steht jetzt am Ende der Hilfeseite'
    en: 'Settings is tidier. Your own choices sit together under Settings → Account: Theme and Language (with the moving background), and how long messages stay on screen, which is now each person''s own. Library → Paths holds all four folders under one Save. System → Server shows the port and where the database is. Support Development moved to the end of the Help page'
  - type: enhancement
    label: 'Controller haben eine eigene Seite. Einstellungen → Anpassung → Controller öffnen führt dorthin: Lege die Standard-Controller jedes Systems fest, füge eigene hinzu und bearbeite die Controller-Bibliothek'
    en: 'Controllers have their own page. Settings → Customization → Open Controllers goes there: set each system''s default controllers, add your own and edit the controller library'
  - type: enhancement
    label: 'Bulk Scrape Match Filtering bietet drei einfache Optionen statt einer Punktzahl und ihrer Tabelle: Streng, Normal und Locker. Normal ist die frühere Standardeinstellung. Eine früher selbst gewählte Einstellung erscheint als Benutzerdefiniert, bis du eine andere wählst'
    en: 'Bulk Scrape Match Filtering offers three plain choices instead of a score number and its table: Strict, Normal and Loose. Normal is the old default. A setting you made yourself before shows as Custom until you pick another'
  - type: enhancement
    label: Mein Profil hat eine Schaltfläche Mein Profil speichern statt drei. Sie prüft beim Speichern ein neues PlayStation-Token oder einen Xbox-Schlüssel und behält dein funktionierendes PlayStation-Token, falls Sony das neue ablehnt. Passwort ändern nennt jetzt mindestens 12 Zeichen und fragt zweimal nach dem neuen Passwort
    en: My Profile has one Save My Profile button instead of three. It checks a new PlayStation token or Xbox key as it saves, and keeps your working PlayStation token if Sony refuses the new one. Change Password now says it needs at least 12 characters and asks for the new password twice
  - type: fix
    label: Einfachere Wörter in den Einstellungen. Mein Profil erklärt, wofür der RetroAchievements-Schlüssel und die Passwort-Anmeldung jeweils da sind. API-Schlüssel nennt, dass der eigene RetroAchievements- oder Steam-Schlüssel einer Person zuerst verwendet wird. Die Schlüssel von TheGamesDB heißen Hauptschlüssel und Ersatzschlüssel. Das Fenster Emulator bearbeiten zeigt Programmpfad und Befehlszeilenoptionen. Clear Scraped Data erklärt, dass Bild- und Videodateien auf der Festplatte bleiben, außer du kreuzt das Kästchen an. Die KI-Modelllisten zeigen keine Preise mehr, da sie veraltet waren
    en: Plainer words in Settings. My Profile says what the RetroAchievements key and the password sign-in each do. API Keys says a person's own RetroAchievements or Steam key is used first. TheGamesDB's keys are named Main key and Backup key. The Edit emulator window says Program location and Command-line options. Clear Scraped Data says the picture and video files stay on disk unless you tick the box. The AI model lists no longer show prices, which went out of date
  - type: fix
    label: 'Einstellungen verliert, was doppelt vorkam oder nichts tat: die Karte Bibliotheksstatistik (das Dashboard hat sie), die Kopie von Scan Trophies in den Einstellungen (die PS3-Trophäenseite hat sie), die separate Schaltfläche Import System Logos (Refresh System Logos kopiert jetzt zuerst die Logos von ES-DE) und sechs gespeicherte Einstellungen, die nichts nutzte. Eine Meldungsdauer von 0 Sekunden wird abgelehnt statt stillschweigend gespeichert, und beim Speichern eines neuen ROM-Ordners heißt es nicht mehr, RetroDB müsse neu starten'
    en: 'Settings drops what was there twice or did nothing: the Library Statistics card (the Dashboard has it), the Settings copy of Scan Trophies (the PS3 trophies page has it), the separate Import System Logos button (Refresh System Logos now copies ES-DE''s logos first) and six stored settings nothing used. A message time of 0 seconds is refused instead of quietly saved, and saving a new ROM folder no longer says RetroDB must restart'
  - type: performance
    label: RetroDB belastet deinen Computer jetzt deutlich weniger. Der bewegte Nebel des Cyberpunk-Designs hielt einen Prozessorkern voll beschäftigt, solange eine RetroDB-Seite offen war; jetzt zeichnet ihn die Grafikkarte, und der Prozessor merkt es kaum. Außerdem zeichnet er nur halb so viele Bilder, was gleich aussieht, weil der Nebel langsam zieht
    en: RetroDB is far lighter on your computer. The Cyberpunk theme's moving mist kept one processor core fully busy for as long as any RetroDB page was open; the graphics card now draws it, and the processor barely notices. It also draws half as many frames, which looks the same because the mist drifts slowly
  - type: feature
    label: 'Bewegte Hintergründe (Nebel, Regen, Sterne, Staub) pausieren jetzt, wenn du RetroDB nicht benutzt: wenn sein Fenster nicht vorne ist, sein Tab verborgen ist oder eine Minute lang weder Maus noch Tastatur benutzt wurden. Sie laufen sofort wieder, wenn du zurückkommst. Ein neuer Schalter Bewegter Hintergrund unter Einstellungen → Konto → Design und Sprache hält sie auf diesem Computer still'
    en: 'Moving backgrounds (mist, rain, stars, dust) now pause when you are not using RetroDB: when its window is not in front, its tab is hidden, or a minute passes without the mouse or keyboard. They start again the moment you come back. A new Moving background switch under Settings → Account → Theme and Language keeps them still on that computer'
  - type: performance
    label: Seitentitel behalten ihr Leuchten, pulsieren aber nicht mehr ständig, und die flackernden „Glitch“-Titel in den Konsolen- und Spielelisten flackern nur noch, solange die Maus darüber ist
    en: Page titles keep their glow but no longer pulse all the time, and the flickering "glitch" titles on the console and game lists flicker only while the mouse is over them
  - type: feature
    label: 'Cheats für Arcade-Spiele in MAME. Lade die „MAME XML Cheats Collection“ von mamecheat.co.uk in deinem Browser herunter und importiere sie unter Einstellungen → Emulatoren → Cheats. Die Seite jedes Arcade-Spiels listet dann seine Cheats mit Ein/Aus-Schaltern, und MAME startet mit den eingeschalteten. Ein Cheat mit Wert wird beim Spielen in MAME eingestellt: Drücke Tab, dann Plugin-Optionen, dann Cheat'
    en: 'Cheats for arcade games in MAME. Download the "MAME XML Cheats Collection" from mamecheat.co.uk in your browser and import it under Settings → Emulators → Cheats. Each arcade game''s page then lists its cheats with on/off switches, and MAME starts with the ones you switched on. A cheat that takes a value is set in MAME while you play: press Tab, then Plugin Options, then Cheat'
  - type: fix
    label: Zurück und Weiter auf der Seite eines Spiels bleiben nach dem Scrapen dieses Spiels in deiner gefilterten Liste. Bei aktivem Filter Nicht gescrapt nahm das Scrapen ein Spiel aus der Liste, sodass Weiter die ganze Konsole durchlief, statt zum nächsten nicht gescrapten Spiel zu gehen
    en: Previous and Next on a game's page now stay in your filtered list after you scrape that game. With the Unscraped filter on, scraping a game took it out of the list, so Next stepped through the whole console instead of going to the next unscraped game
  - type: fix
    label: 'Mehr von RetroDB folgt jetzt deiner Sprache: die Bereiche Bonus-Discs, Sicherung und ROM-Benennung in den Einstellungen, die Überschrift Mein Profil, das Scrape-Suchfenster und die Meldungen „keine Berechtigung“. Sie blieben auf Englisch, egal welche Sprache du gewählt hattest'
    en: 'More of RetroDB now follows your language: the Bonus Discs, Backup and ROM Naming parts of Settings, the My Profile heading, the scrape search window and the "no permission" messages. They stayed in English whatever language you chose'
  - type: fix
    label: Benutzer hinzufügen fragt jetzt nach dem ersten Passwort der neuen Person (mindestens 12 Zeichen), und sie wählt bei der ersten Anmeldung ihr eigenes. Früher bekam jedes neue Konto stillschweigend dasselbe Passwort „changeme“, das jeder nutzen konnte, bis der Besitzer sich anmeldete
    en: Add User now asks for the new person's first password (12 characters or more), and they choose their own the first time they sign in. Before, every new account quietly got the same password, "changeme", which anyone could use until its owner signed in
  - type: fix
    label: Einstellungen zeigt jeder Person nur, was ihre Rolle ändern darf. Betrachter und Spieler sehen den Tab Konto; Editoren sehen zusätzlich Bonus-Discs und Controller. Früher sahen sie Admin-Einstellungen, deren Speichern dann abgelehnt wurde, manche mit falschen Werten
    en: Settings shows each person only what their role can change. Viewers and players see the Account tab; editors also see Bonus Discs and Controllers. They used to see admin settings whose Save button was then refused, some showing wrong values
  - type: fix
    label: Einstellungen → System hat die Schaltfläche Clear Stuck RA Sync nicht mehr. Sie meldete, die Synchronisierung sei beendet, auch wenn das nicht stimmte; stoppe eine RetroAchievements-Synchronisierung mit den Schaltflächen in ihrer Fortschrittsmeldung
    en: Settings → System no longer has the Clear Stuck RA Sync button. It said it had cleared the sync even when it had not; stop a RetroAchievements sync with the buttons on its progress notice
  - type: fix
    label: 'Kleine Korrekturen in den Einstellungen: Reset to Default in der Scraper-Liste sagt, dass du Save Scraper Settings drücken musst, um es zu behalten; eine Neuinstallation zeigt ScreenScraper als eingeschaltet, wie es wirklich ist; die Hilfe zur Steam-ID verlangt die 17-stellige Nummer; die Emulatoren-Seite erwähnt keine Schaltfläche Hinzufügen mehr, die es nicht gibt; der Setup-Assistent verbirgt deine API-Schlüssel beim Tippen'
    en: 'Small Settings fixes: Reset to Default on the scraper list says to press Save Scraper Settings to keep it; a new install shows ScreenScraper switched on, as it really is; the Steam ID help asks for the 17-digit number; the Emulators page no longer mentions an Add button it does not have; the Setup Wizard hides your API keys as you type them'
  - type: enhancement
    label: Das Hilfehandbuch hat jetzt ein Suchfeld. Gib ein Wort ein, um nur die Teile des Handbuchs zu sehen, die es erwähnen, mit markiertem Wort. Es ignoriert Akzente und funktioniert in jeder Sprache
    en: The help manual now has a search box. Type a word to see only the parts of the manual that mention it, with the word marked. It ignores accents and works in every language
  - type: fix
    label: 'Der Abschnitt Fehlerbehebung des Hilfehandbuchs deckt jetzt jede Funktion ab: Spiele hinzufügen, Scrapen, AI-Auffüllen, Bilder, Spielen, Cheats, Achievements, Konten, Sicherungen und Updates. Einige alte Tipps verwiesen auf Schaltflächen, die es nicht mehr gibt. Außerdem steht dort nicht mehr, dass HowLongToBeat-Abfragen offline funktionieren oder dass sich die Scraper-Geschwindigkeit einstellen lässt'
    en: 'The help manual''s Troubleshooting section now covers each feature: adding games, scraping, AI Fill, pictures, playing, cheats, achievements, accounts, backups and updates. Some of its old advice pointed at buttons that no longer exist. It also no longer says HowLongToBeat lookups work offline or that scraper speed can be set'
  - type: fix
    label: Einstellungen → System hat das Feld zur Bulk-Scrape-Fehlerbehebung nicht mehr. Es las Überreste des alten Bulk-Scrapes und konnte keinen echten stoppen; stoppe einen Bulk-Scrape mit Abbrechen in seinem Fenster
    en: Settings → System no longer has the Bulk Scrape troubleshooting box. It read leftovers of the old bulk scrape and could not stop a real one; stop a bulk scrape with Cancel in its window
  - type: fix
    label: Das Installationsprogramm verlangt jetzt Python 3.12 oder neuer, was die Bibliotheken von RetroDB brauchen. Es ließ ältere Versionen durch, und die Installation scheiterte dann mittendrin. Die README hat einen neuen Abschnitt Fehlerbehebung für Probleme bei Installation und Start
    en: The installer now asks for Python 3.12 or newer, which RetroDB's libraries need. It let older versions through, and the install then failed partway. The README has a new Troubleshooting section for install and start-up problems
  - type: fix
    label: Der PSN-Tab von Game Imports sagt jetzt, dass das NPSSO-Token unter Einstellungen → Mein Profil eingetragen wird. Er nannte eine API-Schlüssel-Seite, die kein solches Feld hat
    en: Game Imports' PSN tab now says the NPSSO token goes under Settings → My Profile. It named an API Keys page that has no such box
  - type: fix
    label: Das Hilfehandbuch nennt jetzt auch die chinesische Altersfreigabe (CADPA) neben den anderen, bezeichnet den Bereich Weiterspielen der Startseite mit seinem echten Namen und gibt sicherere Tipps, wenn Bilder sich nicht speichern lassen
    en: The help manual now lists the Chinese age rating (CADPA) with the others, calls the home page's Continue Playing section by its real name, and gives safer advice when pictures will not save
  - type: fix
    label: 'Einstellungen → Scraping folgt jetzt deiner Sprache: Scraper-Liste, API-Schlüssel, ES-DE-Pfade, Match-Filterung und KI-Einstellungen mit ihren Status- und Ergebnismeldungen. Sie blieben auf Englisch, egal welche Sprache du gewählt hattest'
    en: 'Settings → Scraping now follows your language: the scraper list, API keys, ES-DE paths, match filtering and AI settings, with their status and result messages. It stayed in English whatever language you chose'
  - type: enhancement
    label: Wenn der KI-Dienst einen Scrape ablehnt (falscher API-Schlüssel, kein Guthaben oder Abrechnung mehr, oder zu viele Anfragen), sagt RetroDB jetzt, was der Grund ist und was du prüfen solltest, statt Felder wie Verkaufszahlen und Erscheinungsdaten stillschweigend leer zu lassen. Danach fragt es diese KI eine Weile nicht mehr an, sodass du es einmal erfährst und nicht einmal pro Spiel
    en: When the AI service refuses a scrape (a wrong API key, no credit or billing left, or too many requests), RetroDB now says which, and what to check, instead of quietly leaving fields such as sales figures and release dates empty. It then stops asking that AI for a while, so you are told once, not once per game
  - type: enhancement
    label: 'Das 3D-Cover zeigt den Fingerschlitz jetzt so, wie Slipcase ihn gemacht hat: mit eckigen Enden und über oder unter der Mitte der Seite, wo die Hülle ihn so hat. Importiere das Cover erneut, um ihn zu sehen'
    en: 'The 3D box now shows the finger slot as Slipcase made it: with square ends, and above or below the middle of the side, where the case has it so. Import the box again to see it'
  - type: fix
    label: 'Einstellungen → System folgt jetzt deiner Sprache: die Wartungswerkzeuge, die Protokolleinstellungen und die Abschnitte zur Fehlersuche, samt ihren Ergebnissen und Fehlermeldungen. Sie blieben auf Englisch, egal welche Sprache du gewählt hattest. Übrig gebliebene englische Meldungen auf anderen Seiten sind ebenfalls übersetzt'
    en: 'Settings → System now follows your language: the maintenance tools, logging settings and troubleshooting sections, with their results and error messages. They stayed in English whatever language you chose. Leftover English messages on other pages are translated too'
  - type: fix
    label: Auf einer Achievements-Konsolenseite rutscht die Reihe der Konsolen-Schaltflächen beim Scrollen nicht mehr unter die Abschnitts-Tabs, sondern scrollt jetzt weg. Auf jeder Achievements-Seite bleibt die A–Z-Buchstabenleiste jetzt direkt unter den Abschnitts-Tabs, statt sich dahinter zu verstecken
    en: On an Achievements console page, the row of console buttons no longer slides under the section tabs as you scroll; it now scrolls away. On every Achievements page the A–Z letter bar now stays just below the section tabs instead of hiding behind them
  - type: fix
    label: Wenn du im Fenster „Spiel bearbeiten“ ein Bild entfernst, wird die Datei nicht mehr gelöscht, falls ein anderes Spiel dasselbe Bild verwendet; das andere Spiel behält es
    en: Removing a picture in the Edit Game window no longer deletes the file when another game uses the same picture; the other game keeps it
  - type: fix
    label: Rückseitenbilder der Verpackung, die ein Scrape nur klein speichert, werden jetzt im Hintergrund vergrößert, so wie es bei den Titelbildern schon der Fall ist
    en: Back-of-box pictures that a scrape saves small are now enlarged in the background, as front covers already are
  - type: fix
    label: Das Speichern im Fenster „Spiel bearbeiten“ wartet nicht mehr, bis kleine hochgeladene Cover oder Screenshots vergrößert sind; das passiert jetzt danach und wird als „Bilder werden verbessert“ angezeigt. Ein zum Entfernen markiertes Bild wird erst gelöscht, wenn das Speichern geklappt hat, ein fehlgeschlagenes Speichern verliert es also nicht mehr
    en: Saving in the Edit Game window no longer waits while small uploaded box art or screenshots are enlarged; that now happens afterwards, shown as "Improving images". A picture ticked for removal is deleted only once the save has worked, so a failed save no longer loses it
  - type: fix
    label: Die Zahl „fehlende Metadaten“ oben in der Bibliothek und auf den Konsolenseiten zählt ein Spiel mit mehreren regionalen Versionen jetzt nur einmal, wie es der Filter „Nicht gescrapt“ tut. Zuvor wurde jede Version gezählt
    en: The "missing metadata" count at the top of the Library and console pages now counts a game with several regional versions once, as the Unscraped filter does. It counted each version
  - type: enhancement
    label: Einstellungen → Bonus-Discs listet jetzt jede als Bonus-Disc markierte Disc auf, mit dem Spiel, zu dem sie gehört. Mit der Schaltfläche „Keine Bonus-Disc“ (für Editoren und Admins) kommt eine falsch markierte Disc wieder in deine Spielelisten, und Auto-Link lässt sie danach in Ruhe
    en: Settings → Bonus Discs now lists every disc marked as a bonus disc, with the game it belongs to. Its "Not a bonus disc" button (editors and admins) puts a wrongly marked disc back in your game lists, and Auto-Link then leaves it alone
  - type: fix
    label: Firmennamen wie „Nintendo Co., Ltd.“ und „GameTek, Inc.“ bleiben jetzt ganz. Sie wurden am Komma getrennt, sodass „Ltd.“ und „Inc.“ als eigene Namen in den Filtern der Bibliothek, unter Einstellungen → Datennormalisierung und in den Statistiken auftauchten. Auch auf den Spielseiten erscheinen sie vollständig. Ein Name mit Komma in Klammern, etwa „Majesco (licensed from Konami, Disney)“, bleibt ebenfalls ganz
    en: Company names such as "Nintendo Co., Ltd." and "GameTek, Inc." now stay whole. They were split at the comma, so "Ltd." and "Inc." showed as names of their own in the Library filters, Settings → Data Normalization and Stats. Game pages show them whole too. A name with a comma inside brackets, such as "Majesco (licensed from Konami, Disney)", stays whole as well
  - type: enhancement
    label: 'Einstellungen → Datennormalisierung kann jetzt verschiedene Namen einer Firma zusammenführen. Unter Publisher und Entwickler listet „Namen, die eine Firma sein könnten“ ähnliche Namen wie „Eidos“ und „Eidos Interactive“ auf. Es wird nichts automatisch zusammengeführt, denn ähnliche Namen können verschiedene Firmen sein: Wähle den Namen, der bleiben soll, hake die Namen derselben Firma an und klicke auf Zusammenführen. Die Namen ändern sich bei jedem Spiel, und spätere Scrapes verwenden den behaltenen Namen'
    en: 'Settings → Data Normalization can now merge one company''s different names. Under Publisher and Developer, "Names that may be one company" lists look-alikes such as "Eidos" and "Eidos Interactive". Nothing is merged for you, because look-alikes can be different companies: pick the name to keep, tick the names that are the same company and press Merge. The names change on every game, and later scrapes use the kept name'
  - type: enhancement
    label: Einstellungen → Datennormalisierung hat jetzt die Schaltflächen Franchise, Publisher und Entwickler. Jede listet die Namen auf, die mit unterschiedlicher Groß- und Kleinschreibung geschrieben sind, etwa „Doom“ und „DOOM“, samt der Anzahl Spiele je Schreibweise, und die am häufigsten verwendete ist vorgewählt. Wähle eine aus und klicke auf Anwenden, um sie zu einem Namen zu machen. Ein neu gescrapter Name, der sich nur in der Groß- und Kleinschreibung unterscheidet, übernimmt die Schreibweise deiner Bibliothek, und AI-Auffüllen verlangt die offizielle Groß- und Kleinschreibung
    en: Settings → Data Normalization now has Franchise, Publisher and Developer buttons. Each lists the names spelled with different capitals, such as "Doom" and "DOOM", with how many games use each spelling and the most-used one picked. Choose one and press Apply to make them one name. A newly scraped name that differs only in capitals takes your library's spelling, and AI Fill asks for official capitals
  - type: fix
    label: Die Filter der Bibliothek passen jetzt auf ganze Werte. Wenn du das Genre „Action“ wählst, erscheinen nicht mehr auch „Action-Adventure“-Spiele, sodass das Ergebnis zur Zahl daneben passt. Die Tag-Listen einer Spielseite und „Ähnliche Spiele“ funktionieren genauso
    en: The Library's filters now match whole values. Choosing the genre "Action" no longer also shows "Action-Adventure" games, so the result matches the count beside it. A game page's tag lists and Similar Games match the same way
  - type: security
    label: Einstellungen → Mein Profil sendet deinen gespeicherten RetroAchievements-Schlüssel, PSN-Token oder Steam-Schlüssel nicht mehr an die Seite. Jedes Feld zeigt nur die letzten vier Zeichen, wie es die Schlüssel im Tab „Scraping“ schon taten. Speichern ohne erneute Eingabe behält den gespeicherten Schlüssel
    en: Settings → My Profile no longer sends your saved RetroAchievements key, PSN token or Steam key to the page. Each box shows only its last four characters, as the Scraping tab's keys already did. Saving without retyping keeps the saved key
  - type: fix
    label: Der Protokoll-Viewer öffnet sich nicht mehr mit „Ungültige Protokolldatei“. Er listete Hilfsprotokolle auf, die er nicht anzeigen wollte, und öffnete zuerst eines davon; jetzt listet er nur noch Protokolle, die er öffnen kann
    en: The Log Viewer no longer opens on "Invalid log file". It listed helper logs it would not show, and opened one of them first; it now lists only logs it can open
  - type: fix
    label: Der PSN-Tab bei den Spiele-Importen verweist für das NPSSO-Token jetzt auf Einstellungen → Mein Profil, wo das Feld ist, statt auf Einstellungen → API-Schlüssel, und sein Verbindungsstatus lässt sich übersetzen
    en: Game Imports' PSN tab now sends you to Settings → My Profile for the NPSSO token, where the box is, instead of Settings → API Keys, and its connection status can be translated
  - type: fix
    label: Wenn du als Betrachter angemeldet bist, fragen Seiten den Server nicht mehr nach Informationen, die nur für Admins gedacht sind und die du nicht bekommen kannst. Dadurch füllt sich das Server-Protokoll nicht mehr mit abgelehnten Anfragen
    en: Signed in as a viewer, pages no longer ask the server for admin-only information they cannot have, so the server log no longer fills with refused requests
  - type: security
    label: Namen, die von außerhalb von RetroDB stammen (gescrapte Daten, Datei- und Ordnernamen, Antworten von Online-Diensten), werden jetzt immer als einfacher Text angezeigt, auf der Spielseite, in den Einstellungen, in Berichten, in den ROM-Werkzeugen, auf den Trophäenseiten und mehr. Außerdem führen Seiten nur noch die Aktionen ihrer eigenen Schaltflächen aus, sodass ein präparierter Name nichts auf einer Seite auslösen kann, und der „Zurück zu“-Link einer Fortschrittsmeldung kann nicht mehr auf eine fremde Website führen
    en: Names that come from outside RetroDB (scraped data, file and folder names, replies from online services) now always show as plain text, on the game page, Settings, Reports, the ROM tools, the trophy pages and more. Pages also run only their own buttons' actions, so a crafted name cannot make a page do something, and a progress toast's "return to" link can no longer lead to another website
  - type: enhancement
    label: Wartende Massen-Scrapes bekommen eine Schaltfläche „Neu anordnen“. Sie öffnet den Warteschlangen-Manager, in dem ein wartender Scrape früher oder später laufen oder mit dem gerade laufenden tauschen kann. Jede Meldung in der Warteschlange behält außerdem nach einer Änderung ihre Platznummer
    en: Queued bulk scrapes get a Reorder button. It opens the Queue Manager, where a waiting scrape can run sooner, later, or swap with the one running now. Each queued toast also keeps its place number after a change
  - type: fix
    label: Der Fortschritt von Aufgaben bleibt nicht mehr hängen und wiederholt sich nicht mehr. Eine CHD-Prüfung oder -Umwandlung, die abstürzt, endet jetzt mit ihrem Grund; Abbrechen gibt der Seite ihre Schaltflächen zurück; eine abgelehnte Abbruch-, Pausen- oder Entfernen-Anfrage meldet das; „Abgeschlossen“ erscheint nicht mehr eine Stunde später erneut; und die Sync-Schaltfläche der Achievements-Seite kommt zurück, wenn die Synchronisierung endet
    en: Job progress no longer gets stuck or repeats itself. A CHD check or conversion that crashes now ends with its reason; Cancel gives the page its buttons back; a refused cancel, pause or remove says so; "completed" no longer pops up again an hour later; and the achievements page's Sync button comes back when its sync ends
  - type: fix
    label: Das Speichern eines HowLongToBeat-Treffers auf der Spielseite löscht nicht mehr den HLTB-Link und die Spielerzahl, und ein fehlgeschlagenes Speichern kann erneut versucht werden. Die Schnellbearbeitung zeigt nicht mehr jeden gespeicherten Treffer als „100 % Treffer“. Die Filter-Tags der Bibliothek zeigen den Namen eines Systems statt seiner Nummer, und die Suche während der Eingabe funktioniert auf Listenseiten und im Vergleich
    en: Saving a HowLongToBeat match on the game page no longer wipes its HLTB link and player count, and a failed save can be retried. Quick Edit no longer shows every saved match as "100% match". Library filter tags show a system's name instead of its number, and search-as-you-type works on list pages and Compare
  - type: fix
    label: Jedes Konto kann sein eigenes Passwort unter Einstellungen → Mein Profil ändern, und ein Admin kann das Passwort von jedem zurücksetzen. Emulator-Ordner funktionieren jetzt unter Windows. Das Dashboard meldet Editoren und Betrachtern nicht mehr, ihre APIs seien offline, und „Spiele ohne Cover“ öffnet die Bibliothek nur mit diesen Spielen. Ein Passwortmanager kann jetzt das Anmeldefeld ausfüllen
    en: Every account can change its own password in Settings → My Profile, and an admin can reset anyone's. Emulator folders now work on Windows. The dashboard no longer tells editors and viewers that their APIs are offline, and "Games missing box art" opens the Library showing just those games. A password manager can now fill the sign-in box
  - type: fix
    label: 'ROM-Werkzeuge: CHD prüfen setzt jedes Gültig- oder Ungültig-Abzeichen auf die richtige Datei; der Protokoll-Viewer zeigt wieder Modulnamen an und meldet, wenn seine Dateiliste fehlschlägt; „Alle auswählen“ bei den Spiele-Importen importiert nur die Spiele, die dein Filter anzeigt; und „Zurücksetzen“ in den ROM-Werkzeuge-Einstellungen stellt den eigenen ROM-Ordner dieses Computers wieder her'
    en: 'ROM tools: CHD Verify puts each Valid or Invalid badge on the right file; the log viewer shows module names again and says when its file list fails; Game Imports'' select-all imports only the games your filter shows; and ROM Tools Settings'' Reset restores this computer''s own ROM folder'
  - type: fix
    label: Steam-Freischaltzeiten werden als Datum angezeigt; die A-Z-Leiste funktioniert bei den lokalen Trophäen; der PSN-Auswahlmodus funktioniert weiter bei Spielen, die beim Scrollen nachgeladen werden; Betrachter sehen keine Schaltflächen für Sync oder Umbenennen mehr, die sie nicht nutzen können; eine Stapel-Umbenennung überspringt eine Datei, die seit dem Scan umbenannt wurde; und die Analyse kann in einem Netzwerk mit einfachem HTTP kopieren und exportiert Zahlen als Zahlen
    en: Steam unlock times show as dates; the A-Z bar works on Local Trophies; PSN Select mode keeps working on games that load as you scroll; viewers no longer see Sync or Rename buttons they cannot use; a batch rename skips a file renamed since the scan; and Analytics can copy on a plain-HTTP network and exports numbers as numbers
  - type: fix
    label: In einem Bestätigungsfenster bricht Enter auf Abbrechen oder × jetzt ab, statt zu bestätigen. Ein Fenster, das mit OK geöffnet wurde, verschwindet nicht mehr, und Tab funktioniert weiter, nachdem die Liste der Tastenkürzel oder ein Fortschrittsfenster geschlossen wurde
    en: In a confirm window, Enter on Cancel or × now cancels instead of confirming. A window opened by OK no longer vanishes, and Tab keeps working after the shortcuts list or a progress window closes
  - type: enhancement
    label: 'Viele Bedienelemente, die bisher nur mit der Maus funktionierten, lassen sich jetzt per Tastatur bedienen (Tab, dann Enter oder Leertaste): die Anmeldeprofile, Suchergebnisse im Vergleich, Tags samt ihren Schaltflächen Bearbeiten und Löschen, Achievement-Spielkarten, Protokollsitzungen, die Auswahl von Design und Avatar, Museumsbilder, das × zum Entfernen eines Genres oder Filters, Einrichtungsordner, die Kontrollkästchen der Scrape-Quellen und der CLZ-Import. Ein-/Aus-Schalter zeigen jetzt den Tastaturfokusring'
    en: 'Many controls that worked only with a mouse now work from the keyboard (Tab, then Enter or Space): the sign-in profiles, Compare search results, tags and their Edit and Delete buttons, achievement game cards, log sessions, theme and avatar choices, Museum pictures, the × that removes a genre or filter, setup folders, scrape-source tick boxes and the CLZ import. On/off switches now show the keyboard ring'
  - type: performance
    label: Der Hintergrund-Entferner im Museum bleibt nicht mehr im Speicher. Er schnitt Controller-Fotos mit einem AI-Modell aus ihrem Hintergrund aus, das nach der ersten Nutzung über 2 GB belegte, während eines Fotos bis zu etwa 9 GB, bis RetroDB neu gestartet wurde. Jetzt läuft er in einem Hilfsprogramm, das bei Bedarf startet und zwei Minuten nach seinem letzten Foto schließt und dabei diesen ganzen Speicher wieder freigibt
    en: The Museum's background remover no longer stays in memory. It cut controller photos out of their background with an AI model that took over 2 GB once used, and up to about 9 GB during a photo, until RetroDB restarted. It now runs in a helper that starts when needed and closes two minutes after its last photo, giving all of that memory back
  - type: feature
    label: 'Der Xbox-Import braucht kein Microsoft-Azure-Konto mehr. Jede Person fügt jetzt ihren eigenen kostenlosen OpenXBL-Schlüssel (von xbl.io) unter Einstellungen → Mein Profil ein, und das funktioniert von jedem Computer in deinem Netzwerk. Der Import lässt außerdem Apps und reine Handy-Spiele weg, ordnet PC-Spiele unter Windows statt Xbox One ein, liest Xbox-360-Achievements richtig und zeigt bei einem gesperrten Achievement kein Datum an. Der kostenlose Schlüssel erlaubt 150 Anfragen pro Stunde: Eine große Achievement-Synchronisierung, die dieses Limit erreicht, hält an, sagt das und beginnt beim nächsten Mal mit den Spielen, zu denen sie noch nicht gekommen ist'
    en: 'Xbox import no longer needs a Microsoft Azure account. Each person now pastes their own free OpenXBL key (from xbl.io) under Settings → My Profile, and it works from any computer on your network. The import also leaves out apps and phone-only games, files PC games under Windows instead of Xbox One, reads Xbox 360 achievements the right way, and shows no date for a locked achievement. The free key allows 150 requests an hour: a big achievement sync that reaches it stops, says so, and next time starts with the games it had not reached'
  - type: enhancement
    label: Wenn du eine Synchronisierung oder Aktualisierung von RetroAchievements anstößt, während schon eine läuft, wartet sie jetzt auf dem Server und startet von selbst, sobald die laufende fertig ist. Das gilt auch, wenn du die Seite schließt oder die Anfrage von einem anderen Gerät kam. Jede Seite zeigt dieselbe Warteliste mit der Position jedes Auftrags, und mit ✕ nimmst du einen Auftrag heraus. Nach einem Neustart des Servers werden wartende Aufträge im Dashboard erneut angeboten
    en: A RetroAchievements Sync or Refresh you ask for while another one runs now waits on the server and starts by itself when that one finishes, even if you close the page or asked from another device. Every page shows the same waiting list with each job's place in line, and ✕ takes a job out. After a server restart, waiting jobs are offered back on the Dashboard
  - type: fix
    label: Die Schaltfläche „Refresh RA“ auf der Seite einer Konsole funktioniert wieder. Sie hat nicht angegeben, um welche Konsole es geht, deshalb hat der Server „Not found“ geantwortet
    en: The Refresh RA button on a console's page works again. It did not say which console, so the server answered "Not found"
  - type: fix
    label: Die Prüfung der ROM-Benennung behandelt jedes System jetzt so, wie es die Seite „Systeme“ zeigt. Macintosh, ZX Spectrum Next, Coleco Adam und Thomson werden als Computer geprüft, 3DS und PS Vita als Handhelds, nicht mehr als Konsolen. Ein Typ, den du auf der Seite „Systeme“ festlegst, wird jetzt ebenfalls berücksichtigt
    en: The ROM naming check now treats each system as the kind the Systems page shows. Macintosh, ZX Spectrum Next, Coleco Adam and Thomson are checked as computers, and 3DS and PS Vita as handhelds, instead of as consoles. A type you set on the Systems page is now followed too
  - type: performance
    label: RetroDB braucht im Leerlauf deutlich weniger Arbeitsspeicher. Der KI-Bildhochskalierer wird jetzt nur noch geladen, solange er wirklich skaliert, und zwar in einem Hilfsprozess, der sich zwei Minuten nach dem letzten Bild beendet. Ein ruhender Server sank dadurch von etwa 1,4 GB auf unter 100 MB. Stürzt der Grafiktreiber beim Hochskalieren ab, wird nur der Hilfsprozess beendet, nie der Server
    en: RetroDB uses far less memory while it waits. The AI image upscaler now loads only while it is upscaling, in a helper that closes two minutes after its last picture; an idle server dropped from about 1.4 GB to under 100 MB. If the graphics driver crashes during an upscale, only the helper stops, never the server
  - type: performance
    label: AI-Auffüllen mit Claude-Websuche kostet jetzt weniger. Claude liest die Suchergebnisse nach jeder Suche erneut; RetroDB bittet Anthropic nun, sie bereitzuhalten, und ein erneutes Lesen kostet dann nur noch ein Zehntel des Preises oder weniger
    en: AI Fill with Claude web search costs less. Claude reads the search results again after each search; RetroDB now asks Anthropic to keep them ready, and a re-read then costs a tenth of the price or less
  - type: fix
    label: 'Zulu und Xhosa lesen sich jetzt besser: 133 Zeilen, die etwas Falsches aussagten, wurden korrigiert, zum Beispiel „Edition“, das als „Kapitel“ angezeigt wurde, und „muss Text sein“, das als „muss ein Buchstabe sein“ angezeigt wurde. Jede Korrektur wurde von zwei getrennten KI-Prüfungen bestätigt'
    en: 'Zulu and Xhosa read better: 133 lines that said the wrong thing are corrected, such as "Edition" shown as "Chapter" and "must be text" shown as "must be a letter". Each correction was agreed by two separate AI checks'
  - type: fix
    label: Wenn ein Spiel nicht startet, erscheint die Meldung jetzt in deiner Sprache und nennt weiterhin den fehlerhaften Emulator, Core oder die fehlerhafte Datei. Ein Fehler im Computer selbst zeigt jetzt „Konnte nicht gestartet werden“ und den Namen des Programms an, die Details stehen im Server-Log, statt roher Systemtexte. Wird die Anmeldung bei RetroAchievements abgelehnt, erscheint der Grund von RetroAchievements in einem übersetzten Satz
    en: When a game will not start, the message is now in your language and still names the emulator, core or file at fault. A failure inside the computer itself now says "Could not start" and the program's name, with the details in the server log, instead of raw system text. A refused RetroAchievements sign-in shows RetroAchievements' own reason inside a translated sentence
  - type: fix
    label: Wenn du einen Scrape-, Sync- oder Bild-Auftrag abbrichst, der bereits beendet ist, wird sein hängengebliebenes Fortschrittsfenster jetzt geschlossen. Wenn du einen Auftrag startest, der schon läuft, wird der echte Grund angezeigt, zum Beispiel „Ein Scrape für SNES läuft bereits“, statt „Netzwerkfehler“. Fehler bei Controller-Bildern im Museum sagen jetzt, was schiefgelaufen ist, und wenn du den RetroAchievements-Sync eines anderen Benutzers abbrichst, wird gemeldet, dass er ihm gehört, statt so zu tun, als würde er abgebrochen
    en: Cancelling a scrape, sync or image job that has already finished now clears its stuck progress popup. Starting a job that is already running shows the real reason, such as "A scrape for SNES is already running", instead of "Network error". Controller image errors in the Museum now say what went wrong, and cancelling another user's RetroAchievements sync says it is theirs instead of pretending to cancel it
  - type: security
    label: Der Log-Viewer blendet jetzt auch in älteren Logdateien Passwörter und Schlüssel aus. Logs, die geschrieben wurden, bevor RetroDB ein bestimmtes Passwort verbergen konnte, etwa das von ScreenScraper, zeigten es beim Ansehen oder Herunterladen im Klartext
    en: The log viewer now hides passwords and keys in older log files too. Logs written before RetroDB learned to hide a particular password, such as ScreenScraper's, showed it in plain text when viewed or downloaded
  - type: security
    label: Wenn du alle Einstellungen auf die Standardwerte zurücksetzt, bleiben jetzt dein ROM-Ordner und die Tatsache erhalten, dass die Einrichtung abgeschlossen ist. Früher öffnete ein Zurücksetzen wieder die Seiten der Ersteinrichtung, die ohne Anmeldung funktionieren, bis ein Admin die Einrichtung erneut durchführte
    en: Resetting all settings to their defaults now keeps your ROM folder and the fact that setup is done. Before, a reset reopened the first-time setup pages, which work without signing in, until an admin ran setup again
  - type: feature
    label: Arcade-Spiele können wieder Achievements über RetroAchievements freischalten. RetroDB verknüpft ein Arcade-Spiel jetzt nur noch, wenn RetroAchievements seinen genauen Dateinamen kennt, etwa sf2 für Street Fighter II, und rät nicht mehr anhand von Titeln, wodurch das falsche Spiel verknüpft wurde. Deine Arcade-Spiele werden beim nächsten Aktualisieren ihrer RetroAchievements-Daten oder beim Scrapen verknüpft
    en: Arcade games can earn RetroAchievements again. RetroDB now links an arcade game only when RetroAchievements knows its exact file name, such as sf2 for Street Fighter II, so it no longer guesses from titles and links the wrong game. Your arcade games link the next time their RetroAchievements data is refreshed or they are scraped
  - type: fix
    label: Der PlayStation-Trophäen-Sync korrigiert jetzt Spielverknüpfungen, die er früher fälschlich erstellt hat, zum Beispiel viele Spiele, die mit einem fremden Spiel namens „D“ verknüpft waren. Eine Verknüpfung, die du selbst gesetzt hast, ändert ein Sync nie. Der nächste Sync prüft alle älteren Verknüpfungen erneut, daher können einige knappe Treffer entknüpft werden; verknüpfe diese dann von Hand neu
    en: PlayStation trophy sync now corrects game links it made wrongly before, such as many games linked to an unrelated game called "D". A link you set yourself is never changed by a sync. The next sync checks all older links again, so a few near matches may come unlinked; link those again by hand
  - type: fix
    label: Wenn du einen wartenden Massen-Scrape vor einen laufenden schiebst, wird das letzte Spiel des alten Scrapes nicht mehr zu den Zählern des neuen addiert. Wenn du in der Wunschliste auf „Alle scrapen“ klickst, während schon einer läuft, wird das jetzt gemeldet, statt zu behaupten, er sei gestartet
    en: Moving a waiting bulk scrape ahead of a running one no longer adds the old scrape's last game to the new one's counts. Clicking "Scrape all" on the wishlist while one is already running now says so, instead of claiming it started
  - type: accessibility
    label: 'Mit einem Screenreader sagt die Schaltfläche „läuft“ jetzt nur noch „1 Spiel läuft“, wenn sich die Anzahl ändert, statt alle paar Sekunden eine nackte Zahl vorzulesen. Ihre Liste öffnet sich als benanntes Fenster mit dem Cursor darin, ihre Schaltflächen „Beenden“ und „Nächste Disc“ nennen das jeweilige Spiel, und nach „Beenden“ springt der Cursor an eine sinnvolle Stelle. Jede Spielkarte in der Bibliothek lässt sich jetzt per Tastatur über ihren Titel öffnen, und ihre Filter-Schaltflächen sagen, wonach sie filtern, zum Beispiel „Filtern nach Entwickler: Konami“'
    en: 'With a screen reader, the "running" button now says "1 game running" only when the count changes, instead of reading a bare number every few seconds. Its list opens as a named window with the cursor inside, its Kill and Next disk buttons say which game they act on, and after Kill the cursor returns to a sensible place. Each game card in the library now opens with the keyboard from its title, and its filter buttons say what they filter, such as "Filter by Developer: Konami"'
  - type: feature
    label: Jedes Mitglied kann jetzt unter Einstellungen → Mein Profil seinen eigenen Steam-Schlüssel und seine Steam-ID hinterlegen und seine eigene Steam-Bibliothek und Achievements importieren. Bisher ging das nur als Admin
    en: Every member can now add their own Steam key and Steam ID under Settings → My Profile, and import their own Steam library and achievements. Until now only an admin could
  - type: fix
    label: Beim Speichern der Spieldetails wird eine leere Spielerzahl nicht mehr auf 1 gesetzt, und die von RetroDB ermittelten Altersfreigaben werden nicht mehr als von dir eingegeben markiert. AI-Auffüllen behält ein Spiel, das du als Exklusiv markiert hast, und behält jede Änderung, die du an einem Spiel machst, während es auf die Antwort der KI wartet. Der Verlauf eines Scrapes listet nur noch die Details auf, die er tatsächlich gespeichert hat
    en: Saving a game's details no longer sets an empty player count to 1, and no longer marks the age ratings RetroDB worked out for you as typed by you. AI Fill keeps a game you marked Exclusive, and keeps any change you make to a game while it is waiting for the AI's answer. A scrape's history now lists only the details it actually saved
  - type: fix
    label: Die Screenshot-Prüfung bricht nicht mehr auf halbem Weg ab, wenn ein gespeicherter Screenshot viel zu groß zum Öffnen ist; sie zählt das Bild als nicht lesbar und macht weiter. Das Inhaltsverzeichnis der Hilfeseite verweist jetzt auf Emulatoren und Spielen, und die Entwicklerhinweise zu Anmeldung, Hintergrundaufträgen, Scraping, Bildern, Updates und Fehlerantworten beschreiben jetzt, was das Programm wirklich tut
    en: Screenshot Review no longer stops halfway when one stored screenshot is far too large to open; it counts that picture as unreadable and carries on. The help page's contents list now links to Emulators and Playing, and the developer notes on sign-in, background jobs, scraping, pictures, updates and error replies now say what the program really does
  - type: fix
    label: Ein Editor, der einen ROM-Tools-Scan startet, kann ihn jetzt pausieren, fortsetzen oder abbrechen; Scans anderer Personen kann weiterhin nur ein Admin beenden. Tags und Listen weisen einen fehlenden Namen oder eine ungültige Farbe mit einer klaren Meldung statt einer Fehlerseite zurück, und ein Wunschlisten-Spiel auf ein anderes umzubenennen, das du dir schon wünschst, wird abgelehnt, genau wie beim Hinzufügen. RA-Daten löschen vergisst jetzt auch, ob deine Kopie Achievements bringt. Eine Trophäe, die RetroDB nicht mehr anbietet, zählt nicht mehr für deinen Sammlerrang. Windows-ROM-Pfade werden jetzt anhand des Dateinamens mit RetroAchievements-Spielen abgeglichen
    en: An editor who starts a ROM Tools scan can now pause, resume or cancel it; other people's scans stay an admin's to stop. Tags and lists refuse a missing name or a bad colour with a clear message instead of an error page, and renaming a wishlist game onto another one you already wish for is refused, as adding it is. Clear RA Data now also forgets whether your copy earns achievements. A trophy RetroDB no longer offers stops counting toward your collector rank. Windows ROM paths now match RetroAchievements games by file name
  - type: fix
    label: Wartungskorrekturen. Ein mehrteiliges Disc-Archiv, das sich nicht entpacken lässt, hinterlässt keinen halbfertigen Ordner mehr, der jeden erneuten Versuch blockiert. Speicher berechnen zählt jetzt jede Datei in einem PS3-Spielordner. Gescrapte Daten löschen entfernt Bilder nur, wenn du es verlangst. Ein Bibliotheks-Scan, der auf ein Spiel trifft, das ein anderer Scan gerade hinzugefügt hat, macht mit den übrigen Spielen dieser Konsole weiter
    en: Maintenance fixes. A multi-disc archive that fails to unpack no longer leaves a half-made folder behind that blocks every retry. Calculate Storage now counts every file inside a PS3 game folder. Clear Scraped Data deletes pictures only when you ask it to. A library scan that meets a game another scan has just added carries on with the rest of that console's games
  - type: fix
    label: Das Wiederherstellen einer Sicherung ist jetzt sicherer. Sie wird so in die Bibliotheksdatenbank geschrieben, wie es die Datenbank selbst erwartet, sodass ein Teil von RetroDB, der sie geöffnet hat, die wiederhergestellten Daten sieht, statt Schaden zu riskieren. Beim Löschen eines Spiels werden jetzt auch seine Box-Bilder sowie seine wartenden Bild- und Emulator-Einstellungs-Einträge gelöscht, sodass ein neues Spiel sie nie erben kann. Zwei Einstellungen, die gleichzeitig gespeichert werden, überschreiben sich nicht mehr
    en: Restoring a backup is safer. It is now written into the library database the way the database itself expects, so a part of RetroDB that has it open sees the restored data instead of risking damage. Deleting a game now also deletes its box pictures and its waiting picture and emulator-setting entries, so a new game can never inherit them. Two settings saved at the same moment no longer lose one of them
  - type: fix
    label: Bildkorrekturen. GIFs werden nicht mehr durch den Hochskalierer geschickt, nur um dann verworfen zu werden. Das Hochskalierer-Modell wird anhand seines veröffentlichten Fingerabdrucks geprüft, und ein fehlerhafter Download wird erneut geladen, statt das Hochskalieren dauerhaft abzuschalten. Logos und Bilder mit durchsichtigen Teilen behalten beim Vergrößern ihre Transparenz. In WebP umwandeln erfasst jetzt auch Rückseiten und Logos und lehnt eine große Bibliothek nicht mehr wegen unnötig verlangtem Platz ab. Zwei Seiten einer Box-Datei können sich ein Bild teilen, und das Entfernen einer Box mit beschädigtem Eintrag entfernt auch ihre Bilder
    en: Picture fixes. GIFs are no longer run through the upscaler only to be thrown away. The upscaler model is checked against its published fingerprint, and a bad download is fetched again instead of turning upscaling off for good. Logos and pictures with see-through parts keep their transparency when enlarged. Convert to WebP now takes back covers and logos too, and no longer refuses a large library for want of room it does not need. Two faces of a box file can share one picture, and removing a box with a damaged record removes its pictures
  - type: fix
    label: Importe aus CLZ, Steam, Xbox und PlayStation behandeln nicht mehr jeden Titel, der nur auf Japanisch oder in einer anderen nicht-lateinischen Schrift geschrieben ist, als dasselbe Spiel und fügen kein Spiel ohne ID mehr hinzu. Die CLZ-Vorschau fügt keine Konsolen mehr hinzu, bevor du den Import bestätigst, und ein Betrachter, der eine Steam-, Xbox- oder PlayStation-Bibliothek ansieht, fügt sie ebenfalls nicht mehr hinzu. Bei einem Steam-Spiel, das aus dem Store entfernt wurde, wird nur einmal nachgefragt, nicht bei jedem Sync
    en: Imports from CLZ, Steam, Xbox and PlayStation no longer treat every title written only in Japanese or another non-Latin script as the same game, and no longer add a game with no id. The CLZ preview no longer adds consoles before you confirm the import, and a viewer looking at a Steam, Xbox or PlayStation library no longer adds them either. A Steam game removed from the store is asked about once, not on every sync
  - type: fix
    label: Die Analyse ordnet jetzt viel mehr Konsolen ihrem Hersteller zu statt unter „Andere“, und die Liste „Zuletzt gescrapt“ im Dashboard zeigt auch ein Spiel, das du erneut gescrapt hast, nicht nur neu hinzugefügte Spiele
    en: Analytics now groups many more consoles under their maker instead of "Other", and the dashboard's Recently Scraped list shows a game you scraped again, not only newly added games
  - type: fix
    label: Controller-Bilder, die du im Museum hinzufügst, bleiben erhalten, wenn die Standalone-Version aktualisiert wird. Wenn ein Online-Dienst an seinem Limit pausiert, wird die Zeit der nächsten Anfrage in deiner eigenen Zeitzone angezeigt
    en: Controller pictures you add in the Museum are kept when the standalone version updates. When an online service pauses at its limit, the time it will be asked again is shown in your own time zone
  - type: fix
    label: Eine Bonus-Disc kann nicht mehr mit sich selbst oder mit einer anderen Bonus-Disc verknüpft werden, und die automatische Verknüpfung verknüpft eine Disc nicht mehr mit einer, die sie im selben Durchlauf als Bonus-Disc markiert
    en: A bonus disc can no longer be linked to itself or to another bonus disc, and Auto-link no longer links a disc to one it marks as a bonus disc in the same run
  - type: fix
    label: Die Bibliotheks- und Konsolenseiten zählen Arcade-BIOS-Dateien nicht mehr als Spiele, weder in den Summen noch in der Buchstabenleiste. Ähnliche Spiele und die Liste, die du durch Klicken auf ein Genre oder einen Publisher auf der Seite eines Spiels erhältst, zeigen nicht mehr die eigenen regionalen Versionen, Bonus-Discs oder BIOS-Dateien des Spiels
    en: The Library and console pages no longer count arcade BIOS files as games, in their totals or the letter bar. Similar games, and the list you get by clicking a genre or publisher on a game's page, no longer show the game's own regional versions, bonus discs or BIOS files
  - type: fix
    label: Alle auswählen weist jetzt darauf hin, wenn eine sehr große Liste gekürzt wird, statt stillschweigend nur einen Teil auszuwählen
    en: Select all now says so when a very large list is cut short, instead of quietly selecting only part of it
  - type: fix
    label: Bibliothekskarten werden jetzt aktualisiert, wenn sich dein Achievement- oder Trophäenfortschritt ändert und wenn ein Spiel spielbar wird oder nicht mehr spielbar ist
    en: Library cards now update when your achievement or trophy progress changes, and when a game becomes playable or stops being playable
  - type: fix
    label: Die Massenbearbeitung kann bei einer fehlerhaften Auswahl nicht mehr die falschen Spiele ändern, und eine fehlgeschlagene Massenbearbeitung markiert die Spiele nicht mehr als von dir bearbeitet
    en: Bulk edit can no longer change the wrong games when it is sent a bad selection, and a bulk edit that fails no longer marks the games as edited by you
  - type: fix
    label: Ein HowLongToBeat-Treffer, der nur zu 1 % passt, wird nicht mehr als 100 % Übereinstimmung angezeigt, und eine Seite, die nicht lädt, zeigt die Fehlerseite statt des rohen Fehlertextes
    en: A HowLongToBeat match that is only a 1% fit is no longer shown as a 100% match, and a page that fails to load shows the error page instead of the raw error text
  - type: security
    label: Wenn du dein Passwort änderst oder ein Admin es zurücksetzt, wird dieses Konto auf allen anderen Geräten abgemeldet. Deshalb melden sich nach diesem Update alle einmal neu an. Die Einrichtungsseite beim ersten Start erhält außerdem denselben Schutz vor anderen Websites wie jede andere Seite
    en: Changing your password, or an admin resetting it, now signs that account out on every other device. Because of this, everyone signs in once more after this update. The first-run setup page also gets the same protection against other websites as every other page
  - type: fix
    label: Ein Bild, das als Avatar abgelehnt wird, löscht nicht mehr den Avatar, den du hattest
    en: A picture that is refused as your avatar no longer deletes the avatar you had
  - type: fix
    label: Scrapes gehen schonender mit den Online-Diensten um. Ein Dienst, der immer wieder fehlschlägt, wird beim Füllen von Lücken eine Weile übersprungen, wie es bei Suchen schon der Fall war, und Spielabfragen bei ScreenScraper beachten jetzt auch dessen Tageslimits
    en: Scrapes are gentler on the online services. A service that keeps failing is skipped for a while when filling gaps, as it already was in searches, and ScreenScraper game lookups now respect its daily limits too
  - type: fix
    label: Ein Scrape schlägt bei einem Spiel mit unbekanntem Erscheinungsjahr, etwa „TBA“, nicht mehr fehl, und ein Spiel, das für Regionen außerhalb deiner Liste erscheint, etwa „Brasilien, Korea“, behält seine Region, statt zu deiner Standardregion zu werden
    en: A scrape no longer fails on a game whose release year is unknown, such as "TBA", and a game listed for regions outside your list, such as "Brazil, Korea", keeps its region instead of becoming your default
  - type: fix
    label: ES-DE-Ordner, die mit ~/ geschrieben sind, funktionieren jetzt, und eine sehr große ES-DE-Datei wird nicht mehr kopiert. Vorgeschlagene regionale Versionen führen nie wieder zwei Spiele zusammen, von denen du gesagt hast, dass sie keine Versionen voneinander sind
    en: ES-DE folders written as ~/ now work, and a very large ES-DE file is no longer copied. Suggested regional versions never put back together two games you said are not versions of each other
  - type: security
    label: RetroDB lehnt beim Abrufen von Bildern aus dem Web noch ein paar weitere private Netzwerkadressen ab und folgt der Weiterleitung einer Webadresse korrekt
    en: RetroDB refuses a few more private network addresses when fetching pictures from the web, and follows a web address's redirect correctly
  - type: fix
    label: Die letzten Bildschirme, die noch auf Englisch waren, folgen jetzt auch deiner Sprache, darunter der Einrichtungsassistent, Tags, Listen, Spiele vergleichen, die ROM-Tools-Einstellungen, die Massen-Scrape-Warteschlange, die Liste unterbrochener Aufträge im Dashboard, die Beschriftungen der Bibliothekskarten und viele Fehlermeldungen
    en: The last screens still in English now follow your language too, including the setup wizard, Tags, Lists, Compare Games, ROM Tools settings, the bulk scrape queue, the dashboard's interrupted-jobs list, the library card labels and many error messages
  - type: security
    label: Ein Systemname, der Webcode enthält, kann diesen im Fenster der Massen-Scrape-Warteschlange nicht mehr ausführen
    en: A system name holding web code can no longer run it in the bulk scrape queue window
  - type: accessibility
    label: Egal wo du auf einer Seite bist, die Position der Tastatur wird jetzt mit einem kräftigen Ring in der Farbe deines Designs markiert, bei jeder Schaltfläche, jedem Feld und jedem Link. Vorher zeigten viele Bedienelemente nur eine schwache Linie, dieselbe wie beim Darüberfahren mit der Maus
    en: Wherever you are on a page, the keyboard's place is now marked with a bold ring in your theme's colour, on every button, box and link. Before, many controls showed only a faint line, the same as when the mouse passed over them
  - type: accessibility
    label: Die Links zu Genre, Serie, Entwickler und Publisher auf Bibliothekskarten funktionieren jetzt per Tastatur. Auch die Schaltfläche „läuft“ für laufende Spiele lässt sich per Tastatur öffnen, und Esc oder ein Klick woanders schließt ihre Liste
    en: The Genre, Series, Developer and Publisher links on library cards now work from the keyboard. The "running" button for games in play opens from the keyboard too, and Esc or a click elsewhere closes its list
  - type: accessibility
    label: Screenreader nennen jetzt jede Tag-Farbe und sagen, welche gewählt ist, und lesen Trophäenbilder als Platin, Gold, Silber und Bronze statt als einzelne Buchstaben vor. Während ein Spiel startet, springt Tab nicht mehr hinter den Startbildschirm
    en: Screen readers now name each tag colour and say which one is chosen, and read trophy pictures as Platinum, Gold, Silver and Bronze instead of single letters. While a game starts, Tab no longer moves behind the starting screen
  - type: fix
    label: Wenn ein Update abbricht, bevor es mit dem Austauschen der Dateien beginnt, startet RetroDB jetzt wieder die bisherige Version, statt geschlossen zu bleiben
    en: If an update stops before it starts swapping files, RetroDB now starts the version you had again, instead of staying closed
  - type: fix
    label: Wenn du zweimal gleichzeitig auf Spielen drückst, können nicht mehr zwei Spiele im eingebauten Player starten. Das Warten auf einen Core-Download gibt jetzt nach einer Weile auf oder wenn RetroDB nicht mehr antwortet, statt ewig zu warten, und die Frage „läuft bereits“ nutzt den eigenen Dialog von RetroDB
    en: Pressing Play twice at once can no longer start two games on the built-in player. Waiting for a core download now gives up after a while, or when RetroDB stops answering, instead of waiting forever, and the "already running" question uses RetroDB's own dialog
  - type: fix
    label: Cheats, die du während des Spielens ein- oder ausschaltest, werden für das richtige Spiel gespeichert und nie von einem anderen Spiel übernommen, dessen Datei denselben Namen hat. Ein Cheat-Problem verhindert nie, dass ein Spiel startet
    en: Cheats you switch on or off during play are kept for the right game, never taken from another game whose file has the same name. A cheat problem never stops a game starting
  - type: fix
    label: RetroDB schreibt die Einstellungsdatei eines Emulators jetzt sicherer. Eine Einstellungsdatei, die ein Link ist, bleibt ein Link, behält ihre Berechtigungen und behält Zeichen, die sie nicht lesen kann, und ein fehlgeschlagenes Speichern hinterlässt keine überflüssige Datei
    en: RetroDB writes an emulator's settings file more safely. A settings file that is a link stays a link, keeps its permissions, and keeps letters it cannot read, and a failed save leaves no stray file behind
  - type: fix
    label: Ein Massen-Scrape, den du in der Warteschlange nach hinten schiebst, mit einem anderen tauschst oder fortsetzt, während einer läuft, geht beim Neustart von RetroDB nicht mehr verloren; das Dashboard bietet ihn an, ab der Stelle, an der er aufgehört hat. Ein ausgetauschter Scrape läuft nicht mehr neben dem neuen weiter, und zwei schnelle Klicks auf Fortsetzen starten einen Auftrag nur einmal
    en: A bulk scrape you move down the queue, swap with another or resume while one runs is no longer lost when RetroDB restarts; the dashboard offers it, from where it stopped. A swapped-out scrape no longer keeps running beside the new one, and two quick clicks on Resume start a job once
  - type: fix
    label: Der Fehler eines einzelnen Spiels, etwa ein Netzwerkabbruch, beendet nicht mehr einen ganzen Lauf von AI-Auffüllen oder von „Box und Handbuch-Regionen korrigieren“; dieses Spiel zählt als fehlgeschlagen und die übrigen werden weiter bearbeitet. Wenn du RetroDB beendest, werden jetzt auch Core-Downloads sauber gestoppt
    en: One game's error, such as the network dropping, no longer ends a whole AI Fill run or a Fix Box and Manual Regions run; that game counts as failed and the rest go on. Stopping RetroDB now also stops core downloads cleanly
  - type: fix
    label: Einträge der Wunschliste bleiben nach einem Fehler oder einem Neustart nicht mehr für immer bei „Scrapen“ hängen, und zwei Läufe von „Alle scrapen“ für dieselbe Wunschliste laufen nicht mehr gleichzeitig
    en: Wishlist items no longer stay on "scraping" forever after an error or a restart, and two Scrape All runs for the same wishlist no longer run at once
  - type: fix
    label: Ein Skript oder eine zweite RetroDB-Instanz beim Start markiert die Aufgaben des laufenden Servers nicht mehr als unterbrochen, und zwei gleichzeitig startende Instanzen können die Datenbank nicht mehr auf eine ältere Version zurücksetzen
    en: A script or a second copy of RetroDB starting up no longer marks the running server's jobs as interrupted, and two copies starting at once can no longer set the database back a version
  - type: fix
    label: Der Start einer PlayStation-Synchronisierung lässt die Fortschrittsbalken aller anderen nicht mehr warten, während die Anmeldung bei Sony läuft. Der tägliche PlayStation-Keep-alive erneuert die Anmeldung nur noch kurz vor Ablauf der 10 Tage statt jeden Tag
    en: Starting a PlayStation sync no longer makes everyone's progress bars wait while it signs in to Sony. The daily PlayStation keep-alive now renews a sign-in only near the end of its 10 days, instead of every day
  - type: fix
    label: Ein Scrapen überschreibt keine Änderung mehr, die du währenddessen machst, und leert kein Genre, keinen Modus und keine Ansicht, für die es keinen Namen kennt. Eine gespeicherte Spielerzahl wird nicht mehr an die Modi des Spiels angepasst
    en: A scrape no longer writes over a change you make while it runs, and no longer empties a genre, mode or view it has no name for. It no longer changes a stored player count to match the game's modes
  - type: fix
    label: AI-Auffüllen ändert nicht mehr, was du selbst eingegeben hast, etwa einen von Hand korrigierten Publisher oder ein korrigiertes Genre; es korrigiert nur gescrapte Werte. Ein Wert wird nicht mehr als geändert gemeldet, wenn er nur anders geschrieben wurde, etwa 4 Spieler als „1-4“ oder dieselben Genres in anderer Reihenfolge
    en: AI Fill no longer changes what you typed yourself, such as a publisher or genre you corrected by hand; it corrects only scraped values. It no longer reports a value as changed when it only wrote it differently, such as 4 players as "1-4" or the same genres in another order
  - type: fix
    label: Ein Controller, den du für ein Spiel eingibst, bleibt erhalten; der Standard-Controller der Konsole ersetzt jetzt nur gescrapte und KI-Werte. Eine Altersfreigabe, die aus der KI-Vermutung eines anderen Systems umgerechnet wurde, wird jetzt ebenfalls als Vermutung markiert
    en: A controller you type for a game is kept; the console's default controller now replaces only scraped and AI values. An age rating converted from another board's AI guess is now marked as a guess too
  - type: fix
    label: Das Speichern im Bearbeiten-Fenster eines Spiels leert keine Felder mehr, die das Fenster nicht zeigt. Zurücksetzen auf der Seite eines Spiels löscht jetzt alles, was angegeben ist, auch Ansicht, Edition und andere Namen, löscht die Bilder und Videos des Spiels, sofern kein anderes Spiel sie nutzt, und aktualisiert die Filter der Bibliothek sofort
    en: Saving a game's edit window no longer empties fields the window does not show. Reset on a game's page now clears everything it says it does, including the view, edition and other names, deletes the game's pictures and videos unless another game uses them, and updates the library filters straight away
  - type: fix
    label: „Gescrapte Daten löschen“ leert jetzt auch Ansicht, 2D oder 3D, und Spielstruktur. Ein CLZ-Import eines Spiels mit nur einer Jahreszahl behält nur das Jahr, nicht den 1. Januar
    en: Clear Scraped Data now also clears the view, 2D or 3D, and game structure. A CLZ import of a game with only a year keeps just the year, not 1 January
  - type: security
    label: Die Steam-Synchronisierung nutzt den Steam-Schlüssel aus den Einstellungen nicht mehr für jedes Haushaltsmitglied. Ein Mitglied ohne eigenen Steam-Schlüssel bekam die Steam-Bibliothek und Achievements des Admins in seinem Konto. Der Schlüssel in den Einstellungen gilt jetzt nur noch für Admins
    en: Steam sync no longer borrows the Steam key from Settings for every household member. A member with no Steam key of their own was getting the admin's Steam library and achievements under their account. The key in Settings now serves admins only
  - type: fix
    label: Die Suche von How Long to Beat für viele Spiele speichert jetzt die Zeiten, bei denen sie sicher ist. Früher schlug jeder sichere Treffer fehl und nichts wurde gespeichert. Die Aktualisierung von RetroAchievements prüft jetzt auch die Datei jedes Spiels anhand der Liste von RetroAchievements, wie es ein Scrapen tut, sodass ein Spiel mit genau der Version verknüpft wird, die du hast
    en: How Long to Beat's lookup for many games now saves the times it is sure of. Before, every sure match failed and nothing was saved. RetroAchievements Refresh now also checks each game's file against RetroAchievements' list, as a scrape does, so a game is linked to the exact version you have
  - type: fix
    label: Die Meldung, dass eine Hintergrundaufgabe beendet ist, erscheint wieder, und das Fortschrittsfeld einer Aufgabe bemerkt, wenn der Server sie nach einem Neustart wieder aufnimmt. Früher erschien beides nie
    en: The message that a background job has finished shows again, and a job's progress box notices when the server picks the job up after a restart. Before, neither ever appeared
  - type: fix
    label: 'PlayStation-Trophäen: Ein von Hand verknüpftes Spiel bleibt nach einer vollständigen Synchronisierung verknüpft, und eine Synchronisierung verknüpft ein Spiel nicht mehr mit seinem Nachfolger, etwa „Doom“ mit „Doom Eternal“. Der Import von PlayStation-Spielen verknüpft jetzt ein Spiel, das schon in deiner Bibliothek ist, wie bei Steam und Xbox, sodass seine Trophäen dort erscheinen'
    en: 'PlayStation trophies: a game you linked by hand stays linked after a full sync, and a sync no longer links a game to its sequel, such as "Doom" to "Doom Eternal". Importing PlayStation games now links a game already in your library, as Steam and Xbox imports do, so its trophies show on it'
  - type: fix
    label: Xbox zeigt deinen Gamertag nach der automatischen Erneuerung der Anmeldung nicht mehr als Unbekannt an, und eine langsame oder fehlgeschlagene Verbindung meldet dich nicht mehr von Xbox ab. Das passiert nur noch, wenn Microsoft die Anmeldung ablehnt
    en: Xbox no longer shows your gamertag as Unknown after its sign-in renews itself, and a slow or failed connection no longer signs you out of Xbox. Only Microsoft refusing the sign-in does that
  - type: fix
    label: Zwei Personen können jetzt jeweils einen Tag mit demselben Namen haben; früher schlug der zweite mit einem Fehler fehl. Jeder angemeldete Benutzer kann jetzt seine eigenen RPCS3-Trophäen neu einlesen; früher ging das nur als Admin, und alle anderen sahen alte Trophäen, bis RetroDB neu startete
    en: Two people can now each have a tag of the same name; before, the second one failed with an error. Any signed-in user can now rescan their own RPCS3 trophies; before, only an admin could, and everyone else saw old trophies until RetroDB restarted
  - type: security
    label: Deine Anmeldungen bleiben privat. Datenbanksicherungen können nicht mehr von anderen Konten auf dem Computer gelesen werden, und eine fehlgeschlagene Sicherung löscht nicht mehr die vorherige. Das Löschen oder Deaktivieren eines Benutzers meldet ihn auch von RetroAchievements in DuckStation und PCSX2 ab. Eine RetroAchievements-Anmeldung, die im eigenen Menü des Spielers gespeichert wurde, wird nicht mehr an die nächste Person weitergegeben, die spielt. Protokolle und gespeicherte Aufgabenfehler verbergen RetroAchievements-Tokens, der PlayStation-Fehler eines anderen Mitglieds wird nur ihm angezeigt, und alte PlayStation- und Xbox-Anmeldedateien im Klartext werden entfernt
    en: Your sign-ins stay private. Database backups can no longer be read by other accounts on the computer, and a failed backup no longer deletes the one before it. Deleting or switching off a user also signs them out of RetroAchievements in DuckStation and PCSX2. A RetroAchievements sign-in saved from the player's own menu no longer carries over to the next person who plays. Logs and saved job errors hide RetroAchievements tokens, another member's PlayStation error is shown only to them, and old plain-text PlayStation and Xbox sign-in files are removed
  - type: fix
    label: Die eigenen Prüfungen von RetroDB können deine Bibliothek während der Ausführung nicht mehr berühren. Sie nutzen immer eine Wegwerfkopie von Datenbank, Bildern und Einstellungen und starten nicht, wenn eines davon auf deine echten Dateien zeigt
    en: RetroDB's own checks can no longer touch your library while they run. They always use a throwaway copy of the database, pictures and settings, and refuse to start if any of them points at your real files
  - type: fix
    label: Verwaiste Dateien bereinigen löscht die Bilder deiner Wunschliste nicht mehr. Das Öffnen eines Spiels lässt es keine Screenshots mehr vergessen, die es nicht findet. Früher verlor bei abgetrenntem Bilderlaufwerk jedes geöffnete Spiel seine ganze Screenshot-Liste; jetzt bleibt die Liste erhalten, und ein fehlendes Bild wird nur ausgeblendet
    en: Clean orphaned files no longer deletes your wishlist's pictures. Opening a game no longer makes it forget screenshots it cannot find. Before, with the picture drive unplugged, every game you opened lost its whole screenshot list; now the list is kept, and a missing picture is only hidden
  - type: fix
    label: Ein Video- oder Handbuch-Download, der zwischendurch fehlschlägt, beschädigt die vorhandene Kopie des Spiels nicht mehr, und ein fehlgeschlagener Download hinterlässt keine versteckte halbe Datei im Medienordner. Der Upscaler im Hintergrund überschreibt kein neueres, zwischenzeitlich heruntergeladenes Bild mehr mit einem alten. „In WebP umwandeln“ lässt alle Spiele, die sich ein Bild teilen, darauf verweisen und berührt nie eine Datei außerhalb der Bilderordner
    en: A video or manual download that fails part-way no longer damages the copy the game already had, and a failed download no longer leaves a hidden half-file in the media folder. The background upscaler no longer saves an old picture over a newer one downloaded meanwhile. Convert to WebP keeps every game that shares a picture pointing at it, and never touches a file outside the picture folders
  - type: fix
    label: Das Löschen eines Spiels oder Wunschlisten-Eintrags löscht jetzt auch dessen Bilder, Videos und Handbücher, behält aber alles, was ein anderes Spiel oder ein anderer Eintrag noch nutzt. Gespeicherte Bilder können wieder von anderen Konten auf dem Computer gelesen werden, und „Bilder verkleinern“ zählt ein Bild, das nicht gespeichert werden konnte, als fehlgeschlagen und nicht als erledigt
    en: Deleting a game or a wishlist item now deletes its pictures, videos and manuals too, but keeps any another game or wishlist item still uses. Saved pictures can be read by other accounts on the computer again, and Resize Images counts a picture it could not save as failed, not as done
  - type: fix
    label: Der Duplikate-Finder bietet keine funktionierende Datei mehr zum Löschen an. Bei der Suche nach Namen hält er die .cue- und .bin-Kopien eines Spiels nicht mehr für Duplikate voneinander. Er bietet nie die Track-Datei einer Disc an, die sich zwei Versionen eines Spiels teilen können. Er löscht keine Disc, die in einer Playlist steht. Ein Spiel, dessen Datei du löschst, wechselt zur Kopie, die du behältst, und bleibt so in der Bibliothek
    en: Duplicate Finder no longer offers a working file for deletion. Looking by name, it no longer calls a game's .cue and .bin copies of each other. It never offers a disc's track file, which two versions of a game can share. It will not delete a disc that a playlist lists. A game whose file you delete now moves to the copy you keep, so it stays in the library
  - type: fix
    label: „Multi-Disc organisieren“ überschreibt keine vorhandene Playlist und keine Datei, die schon im Ordner des Spiels liegt; es hält an und nennt die Datei. Die erstellte Playlist führt die .cue jeder Disc auf, nicht ihre Track-Dateien. Spiele, deren Dateien verschoben werden, folgen ihnen jetzt in den Ordner, sodass „Fehlende ROMs bereinigen“ sie nicht mehr entfernt
    en: Organize Multi-Disc no longer writes over an existing playlist or a file already in the game's folder; it stops and says which. The playlist it makes lists each disc's .cue, not its track files. Games whose files it moves now follow them into the folder, so Clean missing ROMs no longer removes them
  - type: fix
    label: Die Umwandlung in CHD mit „Originale löschen“ löscht jetzt auch die Track-Dateien der Disc, behält aber einen Track, den eine andere .cue noch nutzt. Das Spiel und jede Playlist, die die alte Disc aufführte, zeigen jetzt auf die neue .chd. Das Umbenennen der Datei eines Spiels aktualisiert jetzt die Playlist, die sie aufführt, und eine Track-Datei, die eine .cue braucht, kann nicht umbenannt werden. Das Entfernen von Dateien aus einer ZIP entfernt nur die gewählten Dateien, auch wenn ein Name [ oder ] enthält. Die Screenshot-Bereinigung löscht nur die Kopien, die ihr Scan gefunden hat, und behält immer eine
    en: Converting to CHD with "delete originals" now deletes the disc's track files too, but keeps a track another .cue still uses. The game and any playlist that listed the old disc now point at the new .chd. Renaming a game's file now updates the playlist that lists it, and a track file a .cue needs cannot be renamed. Removing files from a zip removes only the files you picked, even when a name holds [ or ]. Screenshot Dedup deletes only the copies its scan found, and always keeps one
  - type: fix
    label: How Long to Beat auf der Seite eines Spiels sucht nach dem, was du eingibst. Früher suchte es bei einem nicht gefundenen Titel stattdessen nach den anderen Namen des Spiels und konnte ein anderes Spiel anbieten, etwa ein Fan-Remake. Es probiert die anderen Namen weiterhin, wenn das Feld den eigenen Namen des Spiels enthält
    en: How Long to Beat on a game's page searches for what you type. Before, a title it could not find made it search the game's other names instead, and it could offer a different game, such as a fan remake. It still tries the other names when the box holds the game's own name
  - type: fix
    label: Die Schritte zu How Long to Beat im Handbuch passen jetzt zur Anzeige. Dort stand, man solle einen Treffer aus einer Liste wählen; die Seite zeigt einen Treffer mit Speichern und Abbrechen. Die PlayStation-Hilfe sagt nicht mehr, die Anmeldung halte etwa zwei Monate, da RetroDB sich selbst neu anmeldet. Alle 20 übersetzten Handbücher enthalten beide Änderungen
    en: The help manual's How Long to Beat steps match the screen. They said to pick a match from a list; the page shows one match with Save and Cancel. The PlayStation help no longer says the sign-in lasts about two months, since RetroDB signs in again by itself. All 20 translated manuals carry both changes
  - type: fix
    label: Jede Buchstabenleiste beginnt jetzt mit einer Schaltfläche „Alle“. Auf den Seiten Bibliothek, Konsole und PSN-Trophäen zeigt die Wahl eines Buchstabens nur die Spiele mit diesem Buchstaben, und früher gab es keine Schaltfläche, um den Rest zurückzuholen. Auf den anderen Achievement-Seiten springt „Alle“ zum ersten Spiel
    en: Every letter bar now starts with an All button. On the Library, console and PSN Trophies pages, picking a letter shows only that letter's games, and before there was no button to bring the rest back. On the other achievement pages, All goes back to the first game
  - type: fix
    label: Ein neues PlayStation-Anmelde-Token, das du in den Einstellungen einfügst, wird jetzt sofort verwendet. Früher nutzte RetroDB die alte Anmeldung weiter, bis sie ablief, und „Speichern & Verbindung testen“ meldete diese alte Anmeldung als funktionierend. Ein Token, das Sony ablehnt, ersetzt kein funktionierendes mehr
    en: A new PlayStation sign-in token you paste in Settings is now used straight away. Before, RetroDB kept using the old sign-in until it ran out, and Save & Test Connection reported that old sign-in as working. A token Sony refuses no longer replaces one that works
  - type: enhancement
    label: 'Die PlayStation-Anmeldung in den Einstellungen lässt sich leichter am Laufen halten. Das Banner zählt keine Tage mehr herunter, an denen du nichts tun musstest, weil RetroDB sich selbst neu anmeldet; es wird nur rot, wenn Sony dein gespeichertes Token ablehnt. Die Schaltfläche „Hier einfügen“ lässt den Browser nicht mehr um Zugriff auf die Zwischenablage bitten: Sie setzt den Cursor ins Feld für Strg+V. Die Schritte sagen jetzt, dass du dich zuerst von PlayStation abmelden sollst, wenn du ein noch funktionierendes Token ersetzt, und ihre Meldungen können übersetzt werden'
    en: 'The PlayStation sign-in in Settings is easier to keep going. The banner no longer counts down days you never had to act on, because RetroDB signs in again by itself; it turns red only when Sony refuses your saved token. The Paste here button no longer makes the browser ask to read your clipboard: it puts the cursor in the box for Ctrl+V. The steps now say to sign out of PlayStation first when you replace a token that still works, and their messages can be translated'
  - type: enhancement
    label: Pop-up-Meldungen und Rückfragen, etwa „Einstellungen gespeichert“ oder „Diese Liste löschen?“, können jetzt auf jeder Seite übersetzt werden. Früher blieben die meisten unabhängig von der gewählten Sprache auf Englisch
    en: Pop-up messages and question boxes, such as "Settings saved" or "Delete this list?", can now be translated on every page. Before, most of them stayed in English whatever language you chose
  - type: enhancement
    label: Die Meldungen, die erklären, warum eine PlayStation-Anmeldung fehlgeschlagen ist, etwa „Dein NPSSO ist möglicherweise abgelaufen“, können jetzt übersetzt werden
    en: The messages that say why a PlayStation sign-in failed, such as "Your NPSSO may have expired", can now be translated
  - type: fix
    label: Das Handbuch in jeder Sprache entspricht jetzt dem englischen. Es enthält neu „Überall suchen“, „Titel behalten“, „MAME-Namen“ und die Rückseite der Box, und ältere Absätze, die veraltet waren, sind aktualisiert
    en: The help manual in every language now matches the English one. It gains Search Anywhere, Keeping a Title, MAME Names and the back of the box, and older paragraphs that had fallen behind are up to date
  - type: fix
    label: In Deutsch, Afrikaans und Spanisch heißt die Schaltfläche „Zurück“ auf dem Cover eines Spiels jetzt „Rückseite der Box“ und nicht mehr „zurückgehen“
    en: In German, Afrikaans and Spanish, the Back button on a game's cover now says the back of the box, not "go back"
  - type: feature
    label: Beim Drücken von Spielen füllt jetzt das Logo des Spiels auf seinem Hintergrundbild den Bildschirm, während das Spiel startet, oder sein Name in großen Buchstaben, wenn es kein Logo hat. Es verschwindet von selbst, wenn sich das Fenster des Spiels öffnet, oder wenn du Esc drückst oder klickst
    en: Pressing Play now fills the screen with the game's logo on its background picture while the game starts, or its name in large letters when it has no logo. It goes away by itself when the game's window opens, or when you press Esc or click
  - type: feature
    label: 'Die drehbare 3D-Box hat jetzt die echte Form einer PS5-Hülle: abgerundete Ecken und Kanten, den erhöhten Rand um das Cover, die Linie, an der die beiden Hälften zusammentreffen, und die Fingerkerbe an der Öffnungsseite. Dafür braucht es eine Box-Datei aus einer Slipcase-Version, die die Form schreibt; importiere die Box erneut, um sie zu erhalten. Andere Boxen sehen aus wie bisher'
    en: 'The turnable 3D box now has the real shape of a PS5 case: rounded corners and edges, the raised lip round the cover, the line where the two halves meet, and the finger slot in the opening side. It needs a box file from a Slipcase version that writes the shape; import the box again to get it. Other boxes look as before'
  - type: enhancement
    label: „RetroAchievements aktualisieren“ wurde von den Einstellungen auf die Seite RetroAchievements verschoben und heißt jetzt „Spiele mit Achievements finden“. Jede Schaltfläche dort hat jetzt eine Zeile, die erklärt, was sie tut, sodass „Spiele finden“ und „Fortschritt synchronisieren“ leicht zu unterscheiden sind. Sind noch keine Spiele verknüpft, zeigt die Seite einem Admin die Schaltfläche „Finden“, statt zum nächsten Tab zu wechseln
    en: Refresh RetroAchievements moved from Settings to the RetroAchievements page, and is now called Find Games with Achievements. Every button there now has a line saying what it does, so Find Games and Sync Progress are easy to tell apart. With no games linked yet, the page shows an admin the Find button instead of moving on to the next tab
  body: "<ul>\n  <li><strong>4.0 ist die letzte große Web-Version von RetroDB.</strong> Neue Versionen erscheinen als Desktop-App für Windows, Linux und macOS sowie als Android-App und öffnen Ihre vorhandene Bibliothek. Die Web-Version bleibt verfügbar und erhält weiterhin Fehlerkorrekturen und ab und zu eine neue Funktion. Einstellungen → Updates verweist auf die Desktop-App, sobald sie erhältlich ist.</li>\n  <li><strong>Das Handbuch ist in allen Sprachen auf dem neuesten Stand.</strong>\n    Abschnitte, die es bisher nur im englischen Handbuch gab, sind jetzt übersetzt.</li>\n</ul>\n"
  body_en: "<ul>\n  <li><strong>4.0 is the last big web version of RetroDB.</strong> New versions\n    will be a desktop app for Windows, Linux and macOS, and an Android app,\n    and will open your existing library. The web version stays available\n    and still gets bug fixes, and now and then a new feature.\n    Settings → Updates links to the desktop app when it is out.</li>\n  <li><strong>The help manual is up to date in every language.</strong>\n    Sections that were only in the English manual are now translated.</li>\n</ul>\n"
- version: 3.35.4
  date: '2026-11-03'
  tags:
  - type: fix
    label: Ein Screenshot, den du bei einem Spiel löschst, bleibt jetzt gelöscht. Früher konnte der nächste Scrape ihn aus ES-DE zurückkopieren oder aus einer Online-Quelle erneut herunterladen. Das Löschen einer überzähligen Kopie im Werkzeug für doppelte Screenshots zählt nicht, denn das Bild bleibt einmal erhalten
  - type: feature
    label: 'Spiele bekommen jetzt ihr Logo: Beim Scrapen wird es aus ES-DE, ScreenScraper, TheGamesDB, IGDB und Steam gespeichert, und die Spieleseite zeigt es über dem Titel oder anstelle einer fehlenden Box. Im Fenster „Bearbeiten“ kannst du ein Logo hochladen oder löschen. Starte einen Massen-Scrape mit „Fehlendes ergänzen“, um Logos für Spiele zu füllen, die du früher gescrapt hast'
  - type: fix
    label: IGDB setzt das Logo eines Spiels nicht mehr als Seitenhintergrund
  - type: feature
    label: 'Spiele bekommen jetzt die Rückseite ihrer Box: Beim Scrapen wird sie aus ES-DE, ScreenScraper und TheGamesDB gespeichert, und eine Schaltfläche „Rückseite“ am Cover auf der Spieleseite zeigt sie an. Klicke auf die Rückseite, um sie zu vergrößern. Im Fenster „Bearbeiten“ kannst du eine Rückseite hochladen oder löschen. Rückseiten werden bei jedem Scrapen eines Spiels gefüllt; „Fehlendes ergänzen“ scrapt ein Spiel nicht erneut, nur um die Rückseite zu holen'
  - type: fix
    label: Ein Spiel ohne Vorderseite auf TheGamesDB bekommt nicht mehr die Rückseite der Box als Cover
  - type: fix
    label: Wenn du einen Scraper in den Einstellungen ausschaltest, während ein Massen-Scrape läuft, stimmt die Zahl der nicht gefundenen Spiele jetzt ab dem nächsten Spiel. Früher konnte ein Spiel stattdessen als gestoppt gezählt werden
  - type: enhancement
    label: Bei einem System ohne eingerichteten Emulator ist die Schaltfläche „Spielen“ ausgegraut. Zeige darauf, um den Grund zu sehen, oder klicke darauf, um ein Fenster mit dem Hinweis zu öffnen, dass kein Emulator eingerichtet ist. Früher stand neben der Schaltfläche eine Textzeile
  body: "<ul>\n  <li><strong>Spiele bekommen ihr Logo.</strong> Beim Scrapen wird das\n    Logo jedes Spiels gespeichert, und die Spieleseite zeigt es über dem Titel oder anstelle einer\n    fehlenden Box. Starte einen Massen-Scrape mit „Fehlendes ergänzen“, um Logos für\n    Spiele zu füllen, die du früher gescrapt hast.</li>\n  <li><strong>Spiele bekommen die Rückseite ihrer Box.</strong> Eine Schaltfläche „Rückseite“ am\n    Cover auf der Spieleseite zeigt sie an, und du kannst sie anklicken, um sie zu vergrößern. Rückseiten\n    werden bei jedem Scrapen eines Spiels gefüllt.</li>\n  <li><strong>Ein gelöschter Screenshot bleibt gelöscht.</strong> Der nächste Scrape\n    kopiert ihn nicht mehr zurück und lädt ihn nicht erneut herunter.</li>\n  <li><strong>„Spielen“ sagt, warum es nicht startet.</strong> Bei einem System ohne\n    eingerichteten Emulator ist die Schaltfläche „Spielen“ ausgegraut und nennt den Grund.</li>\n</ul>\n"
- version: 3.35.3
  date: '2026-11-02'
  tags:
  - type: feature
    label: 'Neues Tool „MAME-Namen“ in den ROM-Tools: MAME-Spiele erhalten ihre echten Namen, Jahre und Hersteller aus der eigenen Liste von MAME, und die Dateien behalten ihre Kurznamen. Ein Scrapen findet dann jedes Spiel, und du kannst die MAME-Liste nach Kategorie filtern, zum Beispiel ohne Spielautomaten. BIOS-Sets werden in der Liste ausgeblendet'
  - type: fix
    label: ROM-Berichte bieten das Umbenennen von MAME-Dateien nicht mehr an, weil eine umbenannte Datei in MAME nicht mehr funktioniert
  - type: fix
    label: In den Einstellungen steht jetzt, was Microsoft verlangt, bevor eine Xbox-App registriert werden kann. Die Xbox-Anmeldung konnte deshalb nicht getestet werden
  - type: enhancement
    label: Die separate Karte „Offizielle Namen“ ist aus dem Massen-AI-Auffüllen entfernt, weil der Schalter „Offizieller Name“ des Auffüllens diese Aufgabe bereits übernimmt
  - type: fix
    label: Wenn Sony eine gespeicherte PlayStation-Anmeldung ablehnt, zeigen das Dashboard und die Einstellungen das jetzt an und bitten dich, das Konto neu zu verknüpfen. Vorher zeigte das Protokoll bei jedem Serverstart einen unverständlichen Fehler, und nichts hat dich informiert
  - type: feature
    label: Beim Importieren von Steam werden jetzt Beschreibung, Mitwirkende, Metacritic-Wertung, Altersfreigaben, Spielmodi, Cover, Hintergrund und Screenshots jedes Spiels im Hintergrund von seiner Store-Seite übernommen. Scrape ein Spiel, um Genre und Erscheinungsdatum zu erhalten
  - type: feature
    label: Ein Steam-Abgleich behält jetzt deine Spielzeit und wann du zuletzt gespielt hast, und die Spielseite zeigt beides an
  - type: fix
    label: „Bibliothek abrufen“ auf der Steam-Importseite funktioniert jetzt für einen Admin mit gespeichertem Steam-Schlüssel. Vorher wurde Steam die verborgene Form des Schlüssels geschickt, und die Seite forderte fälschlich, dein Profil auf „Öffentlich“ zu stellen
  - type: fix
    label: Ein Steam- oder Xbox-Spiel, das unter demselben Namen schon in deiner Bibliothek ist, wird beim Importieren jetzt mit diesem Spiel verknüpft, sodass seine Achievements synchronisiert werden. Vorher wurde es übersprungen und nie verknüpft
  - type: fix
    label: Von Steam, Xbox und PlayStation importierte Spiele werden jetzt sofort richtig sortiert, zum Beispiel Final Fantasy IX vor Final Fantasy X, und die Markenzeichen von Steam werden aus ihren Namen entfernt
  - type: feature
    label: Bei Systemen, auf denen RetroAchievements einen einfachen Datei-Hash verwendet, etwa Mega Drive und Game Boy, zeigt die Spielseite an, ob deine Kopie Achievements bringt, und dieser Hash verknüpft das richtige Spiel. Führe RA Refresh aus, um das zu füllen
  - type: fix
    label: Ein Scrapen fragt ScreenScraper jetzt zuerst nach deiner genauen Datei, bevor nach dem Namen gesucht wird, sodass du dein Spiel bekommst und nicht eines mit ähnlichem Titel. Ergebnisse, die du selbst anhakst, haben weiterhin Vorrang
  - type: enhancement
    label: Das Fortschrittsfenster von Bildgröße ändern nennt jetzt Spiel und System, zu denen jedes Bild gehört
  - type: feature
    label: Das Scrapen liefert jetzt Titelbildschirme von ScreenScraper und TheGamesDB, mehr offizielle Namen von IGDB und TheGamesDB (etwa den japanischen Titel eines Spiels) und die anderen Konsolen, auf denen ein Spiel erschienen ist, von IGDB
  - type: feature
    label: Ein Spiel ohne Nutzerwertung übernimmt jetzt die Bewertung aus deiner ES-DE-Sammlung, falls dort eine vorhanden ist
  - type: feature
    label: Die Spielseite zeigt, wie viele Spieler ein HowLongToBeat-Ergebnis gemessen haben, und verlinkt auf dessen Seite. Früher gespeicherte Ergebnisse zeigen das bei der nächsten Abfrage
  - type: feature
    label: Die RetroAchievements-Seite zeigt, wie viele Leute ein Spiel spielen und welcher Anteil von ihnen jedes Achievement erreicht hat
  - type: fix
    label: Der Ordnerbrowser der ROM-Tools öffnet sich im ROM-Ordner, wenn kein Startordner vorhanden ist, statt zu scheitern. Eine unlesbare Antwort von IGDB kostet jetzt nur diese eine Angabe, nicht alles, was IGDB zum Spiel gesendet hat
  - type: fix
    label: Das Tageslimit von ScreenScraper hält RetroDB jetzt davon ab, bis später weiter anzufragen, und ein Massen-Scrapen weist darauf hin und macht mit seinen anderen Quellen weiter. Vorher sah ein ausgeschöpftes Limit wie „Spiel nicht gefunden“ aus, und die Anfragen liefen die ganze Nacht weiter
  - type: fix
    label: Ein Spiel, zu dem keine Quelle antworten konnte, weil ein Dienst am Limit war, wird nicht mehr als gescrapt markiert, sodass der nächste Durchlauf es erneut versucht
  - type: fix
    label: Wenn ein TheGamesDB-Schlüssel sein Monatskontingent verbraucht hat, wechselt RetroDB zu deinem anderen Schlüssel und fragt nicht mehr an, sobald beide aufgebraucht sind
  - type: fix
    label: Das Monatslimit von RAWG hält RetroDB jetzt ebenfalls vom Anfragen ab, und IGDB wird auf höchstens vier Anfragen pro Sekunde begrenzt
  - type: fix
    label: Die Massenabfrage von HowLongToBeat endet jetzt mit einer Meldung, wenn die Seite zu viele Anfragen meldet, und alle Anfragen an die Seite werden zeitlich gestreckt
  - type: fix
    label: „Box- und Handbuch-Regionen korrigieren“ gibt nicht mehr nach 25 Spielen in Folge auf, die ScreenScraper nicht kennt. Es stoppt nur, wenn ScreenScraper meldet, dass sein Limit erreicht ist
  - type: fix
    label: Auf der Spielseite steht jede Altersfreigabe jetzt zentriert über ihrem Label „KI-Vermutung“
  - type: fix
    label: Das TheGamesDB-Kontingent in den Einstellungen nutzt jetzt die Prüfung, die dein Kontingent nicht verbraucht, und zeigt kein erfundenes Rücksetzdatum mehr an, wenn der Dienst keines nennt
  body: |
    <ul>
      <li><strong>MAME-Spiele bekommen ihre echten Namen.</strong> Das neue Tool „MAME-Namen“ in den ROM-Tools übernimmt Namen, Jahre und Hersteller aus der eigenen Liste von MAME.
        Die Dateien behalten ihre Kurznamen, weil MAME sie braucht. Du kannst die MAME-Liste nach Kategorie filtern, und BIOS-Sets sind ausgeblendet.</li>
      <li><strong>Steam-Importe bringen viel mehr mit.</strong> Jedes Spiel füllt Beschreibung, Mitwirkende, Metacritic-Wertung, Altersfreigaben, Spielmodi und Bilder von seiner Store-Seite aus. Ein Abgleich behält deine Spielzeit und wann du zuletzt gespielt hast. Ein Spiel, das unter demselben Namen schon in deiner Bibliothek ist, wird jetzt damit verknüpft, sodass seine Achievements synchronisiert werden.</li>
      <li><strong>Beim Scrapen wird genau dein Spiel gefunden.</strong> Ein Scrape fragt zuerst bei ScreenScraper nach deiner genauen Datei, bevor er nach dem Namen sucht. Außerdem bringt das Scrapen Titelbildschirme, mehr offizielle Namen und die anderen Konsolen, für die ein Spiel erschienen ist.</li>
      <li><strong>RetroAchievements kennt deine Version.</strong> Bei Systemen, die einen einfachen Datei-Hash nutzen, etwa Mega Drive und Game Boy, zeigt die Spielseite, ob deine Version Achievements freischaltet. Führe RA Refresh aus, um das aufzufüllen. Die RetroAchievements-Seite zeigt außerdem, wie viele Leute ein Spiel spielen und wie viel Prozent von ihnen jedes Achievement erreicht haben.</li>
      <li><strong>Online-Limits werden beachtet.</strong> Wenn ScreenScraper, TheGamesDB oder RAWG sein Limit erreicht, fragt RetroDB bis später nicht mehr an, und ein Massen-Scrape macht mit seinen anderen Quellen weiter. Ein Spiel, für das zu diesem Zeitpunkt keine Quelle antworten konnte, wird beim nächsten Durchlauf erneut versucht.</li>
      <li><strong>Eine abgelehnte PlayStation-Anmeldung wird angezeigt.</strong> Das Dashboard und die Einstellungen bitten dich jetzt, neu zu verknüpfen, wenn Sony eine gespeicherte Anmeldung ablehnt.</li>
      <li><strong>„Offizielle Namen“ ist umgezogen.</strong> Die eigene Karte dafür ist aus dem Massen-AI-Auffüllen verschwunden, weil der Schalter „Offizieller Name“ des Auffüllens dasselbe tut.</li>
    </ul>
- version: 3.35.2
  date: '2026-11-02'
  tags:
  - type: fix
    label: Die gesamte Spielzeit zählt Minuten nicht mehr als Stunden – im Dashboard, bei den Sammler-Trophäen und im Analyse-Diagramm. Ein Spiel mit 36 Minuten wurde als 36 Stunden gezählt
  - type: fix
    label: HowLongToBeat hält keinen Nachfolger mehr für dein Spiel. Double Dragon II bekommt nicht mehr die Zeiten von Double Dragon III
  - type: fix
    label: Eine HowLongToBeat-Massensuche speichert nicht mehr die Zeit eines Spiels auf einem anderen System. Mario Golf auf Game Boy Color bekommt nicht mehr die Zeit für Nintendo 64. Diese Treffer warten jetzt auf der Prüfseite
  - type: fix
    label: Massen- und Einzelsuchen bei HowLongToBeat nutzen jetzt das Erscheinungsjahr des Spiels, damit Doom von 1993 nicht mehr die Zeiten von Doom von 2016 bekommt
  - type: new
    label: „Gespeicherte Spielzeiten prüfen“ in den ROM-Tools schickt gespeicherte Treffer, die falsch aussehen, auf die Prüfseite, wo du jeden einzelnen behältst oder löschst
  - type: fix
    label: Eine HowLongToBeat-Massensuche mit „Nur fehlende“ versucht es jetzt erneut bei Spielen, die ohne Zeit zugeordnet wurden, und lässt eine Sekunde zwischen den Anfragen
  - type: fix
    label: Ein Trefferwert von 72 % wird auf der Spielseite nicht mehr als 100 % angezeigt
  - type: fix
    label: Spiele zeigen keine RetroAchievements eines anderen Spiels mehr. Resident Evil 4 auf GameCube zeigt nicht mehr das Set von Resident Evil, und Ratchet Deadlocked nicht mehr das Set von Ratchet & Clank
  - type: fix
    label: Ein Scrapen entfernt jetzt eine RetroAchievements-Verknüpfung, wenn es bei RetroAchievements kein solches Spiel gibt. Ist RetroAchievements nicht erreichbar, bleibt die Verknüpfung bestehen
  - type: fix
    label: RetroAchievements findet jetzt mehr deiner Spiele – über den Namen der ROM-Datei, alternative Titel, Akzente wie bei Ōkami und Titel mit zwei Namen
  - type: fix
    label: RetroAchievements verknüpft ein Spiel nicht mehr mit einem Bonus-Set, einem Hack oder einer Demo, und X-Men wird nicht mehr mit G-Men gleichgesetzt
  - type: new
    label: Die Spielseite zeigt den Namen, den RetroAchievements selbst für das verknüpfte Spiel verwendet, sodass eine falsche Verknüpfung leicht auffällt
  - type: fix
    label: Die RA-Aktualisierung speichert jetzt die Punkte jedes Spiels, sodass ein Spiel nicht mehr 0 Punkte zeigt
  - type: new
    label: Die Spielseite kennzeichnet Altersfreigaben von der KI als Vermutung auf Basis des Spielinhalts und nennt, wann die jeweilige Bewertungsstelle gestartet ist. OutRun von 1987 sieht nicht mehr offiziell von der ESRB eingestuft aus
  - type: new
    label: Die Spielseite kennzeichnet Testwertungen und Verkaufszahlen, die von der KI stammen. Änderst du eine Bewertung oder Verkaufszahl selbst, verschwindet die Kennzeichnung
  - type: fix
    label: Eine KI-Wertung auf der falschen Skala wird abgelehnt, sodass ein beliebtes Spiel bei einem neuen Scrapen nicht mehr 7 von 100 erhält
  - type: fix
    label: Eine Anzahl von Wertungen von der KI wird nicht mehr neben der Wertung einer anderen Seite gespeichert, und die Spielseite zeigt keine solche mehr an
  - type: fix
    label: Eine Verkaufsspanne oder ein Geldbetrag von der KI wird nicht mehr zu ein paar verkauften Exemplaren
  - type: fix
    label: KI-Antworten speichern keine Listen mehr als Code, nicht mehr die Wörter N/A oder None als Werte und nicht mehr die eigene Konsole eines Spiels unter anderen Plattformen
  - type: fix
    label: AI-Auffüllen behält jetzt den ersetzten Wert im Verlauf des Spiels
  - type: fix
    label: Modulspiele bekommen keinen erfundenen Batteriespeicher-Typ mehr, und neue KI-Antworten setzen nicht mehr standardmäßig Standard Edition
  - type: fix
    label: Die Serie eines Spiels wird nicht mehr aus dem zerschnittenen Titel abgeleitet, sodass Need For Speed nicht mehr in einer Serie namens Need steht. Serienamen von IGDB werden wieder gelesen, und alte Vermutungen werden gelöscht, damit das nächste Scrapen sie neu füllt
  - type: fix
    label: Beschreibungen zeigen keine Web-Codes mehr anstelle von Anführungszeichen oder Überschriftzeichen wie
  - type: fix
    label: Ein Unternehmen hat jetzt eine Schreibweise, sodass ein Klick auf Sega alle SEGA-Spiele findet. Regionen haben einen Wert, und Plattformen verwenden die Namen aus der Liste
  - type: fix
    label: Spieltitel von RAWG bekommen keine Jahreszahl mehr, und alternative Titel listen keine Dateinamen wie dosbox.exe mehr auf
  - type: fix
    label: Vollständiges Neu-Scrapen ersetzt eine von dir gesetzte Bewertung oder einen Controller nicht mehr durch eine Vermutung, und ein Scrapen, das zwischendurch fehlschlägt, schreibt nicht mehr über einen weniger sorgfältigen Weg
  body: "<ul>\n  <li><strong>KI-Antworten sind als KI erkennbar.</strong> Altersfreigaben von der KI\n    bleiben erhalten, gekennzeichnet als Vermutung auf Basis des Spielinhalts, mit dem Jahr, in dem die jeweilige\n    Bewertungsstelle gestartet ist. Wertungen und Verkaufszahlen von der KI sind ebenfalls gekennzeichnet.</li>\n  <li><strong>RetroAchievements zeigt das richtige Spiel.</strong> Nachfolger\n    tragen nicht mehr die Achievements des ersten Spiels. Nach dem Update\n    bietet das Dashboard einmal eine RetroAchievements-Aktualisierung an. Drücke darauf, um\n    alte Verknüpfungen zu reparieren. Fortschritt, der unter einer falschen Verknüpfung gespeichert wurde, wird entfernt, und die nächste\n    Synchronisierung füllt ihn neu auf.</li>\n  <li><strong>Die Gesamtspielzeiten stimmen.</strong> Zeiten unter einer Stunde wurden\n    als Stunden gezählt, daher waren die Summen im Dashboard und bei den Sammler-Trophäen zu hoch.\n    Manche Summen und Trophäen werden sinken.</li>\n  <li><strong>HowLongToBeat findet das richtige Spiel.</strong> Ein Nachfolger\n    gilt nicht mehr als dein Spiel, und das System und das Jahr des Spiels zählen jetzt.\n    Ein Treffer auf einem anderen System oder aus Jahren später wartet auf der\n    Prüfseite auf dich.</li>\n  <li><strong>Prüfe, was bereits gespeichert ist.</strong> Drücke in den ROM-Tools auf „Gespeicherte Spielzeiten prüfen“,\n    um zweifelhafte gespeicherte Treffer auf die Prüfseite zu schicken.\n    Nichts ändert sich, bis du entscheidest.</li>\n  <li><strong>Serienamen sind echt.</strong> Die Serie eines Spiels wird nicht mehr\n    aus dem zerschnittenen Titel abgeleitet. Nach dem Update werden vermutete Serienamen gelöscht, auch manche, die richtig waren. Das nächste Scrapen\n    füllt sie aus Quellen, die eine Serie nennen.</li>\n  <li><strong>Saubere Texte.</strong> Beschreibungen zeigen keine Web-Codes oder\n    Überschriftzeichen mehr. Ein Unternehmen hat eine Schreibweise, ein Spiel hat eine Region, und\n    Dateinamen wie dosbox.exe werden nicht mehr als andere Titel aufgelistet. Das\n    geschieht nach dem Update einmalig von selbst.</li>\n  <li><strong>Vollständiges Neu-Scrapen behält deine Entscheidungen.</strong> Eine von dir gesetzte Bewertung oder ein\n    Controller bleibt, es sei denn, eine Quelle liefert wirklich einen.</li>\n</ul>\n"
- version: 3.35.1
  date: '2026-11-02'
  tags:
  - type: fix
    label: Scrapen nimmt keinen Nachfolger mehr für das Spiel, das du hast. Street Fighter II bekommt keine Angaben mehr von Street Fighter und Sonic the Hedgehog keine von Sonic 2, wenn das genaue Spiel fehlt
  - type: fix
    label: Ein Massen-Scrape akzeptiert einen Treffer jetzt nur noch, wenn der Titel wirklich passt. Die richtige Konsole und ein Veröffentlichungsdatum reichen allein nicht mehr aus
  - type: fix
    label: IGDB-Mods, DLC, Bundles und Updates passen nicht mehr zu einem Spiel, es sei denn, deine ROM heißt genau so
  - type: fix
    label: RAWG führt einen Eintrag für alle Versionen eines Spiels. Deckt er mehrere Konsolen ab, liefert er daher keine Entwickler, Publisher, Altersfreigaben oder Mehrspielermodi mehr. Eine Spielerzahl wird gar nicht mehr geraten
  - type: fix
    label: IGDB-Spielerzahlen und Mehrspielermodi stammen jetzt von der eigenen Konsole des Spiels
  - type: fix
    label: Passen mehrere Quellen gleich gut, entscheidet jetzt deine Scraper-Reihenfolge. RAWG bekommt keine Extrapunkte mehr für ein Bild oder eine Metacritic-Wertung, und bei Neuinstallationen steht RAWG zuletzt
  - type: fix
    label: RAWG wird für Commodore-64- und DOS-Spiele nicht mehr durchsucht, da es sie unter Amiga und PC ablegt und so das Spiel einer anderen Plattform passen könnte
  - type: fix
    label: Ein von dir gewähltes ScreenScraper-Ergebnis ist jetzt immer das Spiel, das du bekommst, auch wenn die Ergebnisse länger als 10 Minuten offen waren
  - type: fix
    label: Akzente und Satzzeichen senken die Titelübereinstimmung nicht mehr, sodass Pokémon auch Pokemon findet und R.B.I. auch RBI
  - type: fix
    label: Ein Veröffentlichungsdatum zeigt nur noch so viel, wie die Quelle weiß. Ein Spiel, von dem nur das Jahr bekannt ist, zeigt dieses Jahr, kein erfundenes 1. Januar oder 31. Dezember
  - type: fix
    label: IGDB- und RAWG-Daten gehören jetzt zur eigenen Konsole des Spiels, die von IGDB auch zur eigenen Region. Eine USA-Version zeigt so nicht mehr das japanische Datum und eine Portierung nicht mehr das Jahr des Originals
  - type: feature
    label: Die Liste der Veröffentlichungsdaten auf der Seite eines Spiels wird jetzt aus IGDB und ScreenScraper gefüllt, nicht nur von der KI
  - type: added
    label: 'Neue Karte bei den ROM-Tools: Veröffentlichungsdaten bereinigen entfernt die erfundenen Tage, die ältere Scrapes gespeichert haben, damit ein Scrape das echte Datum eintragen kann'
  - type: fix
    label: Genres, Perspektiven und Spielmodi verwenden jetzt einheitliche Namen, egal welche Quelle sie geliefert hat, sodass Filter jedes Spiel finden. Ein Genre wird nicht mehr zugleich als RPG und Role Playing Game angezeigt
  - type: added
    label: 'Neue Karte bei den ROM-Tools: Genres, Perspektiven und Modi bereinigen wandelt um, was ältere Scrapes gespeichert haben, verschiebt Begriffe wie FPV ins richtige Feld und korrigiert Spielerzahlen, die den Modi eines Spiels widersprechen'
  - type: fix
    label: Reine Online-Spiele von IGDB werden nicht mehr als lokaler Mehrspielermodus geführt, und ein Spiel, das zwei Spieler braucht, nicht mehr als Einzelspieler-Spiel
  body: "<ul>\n  <li><strong>Scrapen nimmt nicht mehr das falsche Spiel.</strong> Ein Nachfolger\n    gilt nicht mehr als das Spiel, das du hast. Street Fighter II bekommt also nichts\n    von Street Fighter, und ein Massen-Scrape verlangt einen passenden Titel, nicht\n    nur die richtige Konsole. IGDB-Mods, DLC und Bundles passen nur noch, wenn deine\n    ROM genau so heißt.</li>\n  <li><strong>RAWG vermischt keine Versionen eines Spiels mehr.</strong> Deckt sein Eintrag\n    mehrere Konsolen ab, liefert er keine Entwickler, Publisher, Altersfreigaben\n    oder Mehrspielermodi mehr und rät keine Spielerzahl. Für Commodore-64- und\n    DOS-Spiele wird er nicht mehr durchsucht.</li>\n  <li><strong>Deine Scraper-Reihenfolge entscheidet bei gleichen Treffern.</strong>\n    RAWG bekommt keine Extrapunkte mehr für ein Bild oder eine Metacritic-Wertung, und bei Neuinstallationen\n    steht es zuletzt.</li>\n  <li><strong>Ein Veröffentlichungsdatum zeigt nur, was die Quelle weiß.</strong> Ein\n    Spiel, von dem nur das Jahr bekannt ist, zeigt dieses Jahr. Daten von IGDB und RAWG\n    gehören zur eigenen Konsole des Spiels, und die Liste der Veröffentlichungsdaten wird jetzt\n    auch aus IGDB und ScreenScraper gefüllt.</li>\n  <li><strong>Einheitliche Namen für Genres, Perspektiven und Modi.</strong>\n    Filter finden jetzt jedes Spiel, und reine Online-Spiele werden nicht mehr\n    als lokaler Mehrspielermodus geführt.</li>\n  <li><strong>Zwei neue ROM-Tools-Karten.</strong> Veröffentlichungsdaten bereinigen und Genres,\n    Perspektiven und Modi bereinigen korrigieren, was ältere Scrapes gespeichert haben. Drücke\n    darauf und starte dann einen Massen-Scrape mit Fehlendes ergänzen.</li>\n  <li><strong>Spielerzahlen stammen von der eigenen Konsole des Spiels,</strong> und\n    ein von dir gewähltes ScreenScraper-Ergebnis ist immer das Spiel, das du bekommst.</li>\n</ul>\n"
- version: 3.35.0
  date: '2026-11-01'
  tags:
  - type: fix
    label: ES-DE behält jetzt seinen Platz in deiner Scraper-Reihenfolge, wenn es nicht die Hauptquelle ist. Seine Beschreibungen, Firmen und Cover wurden von späteren Quellen und der KI ersetzt
  - type: fix
    label: Screenshots und Titelbilder von ES-DE werden jetzt einem Spiel hinzugefügt, wenn ES-DE nicht die Hauptquelle ist, außer sie sehen genauso aus wie eines, das es schon hat
  - type: fix
    label: ES-DE kopiert kein Fanart-Bild, Video oder Handbuch mehr, das das Spiel schon hat, und ein Vollständiges Neu-Scrapen löscht keine Box mehr, die eine andere Quelle gerade heruntergeladen hat
  - type: fix
    label: ES-DE liest jetzt den Eintrag für die ROM-Datei des Spiels selbst, sodass keine andere Version mit gleichem Namen die Details liefern kann, und PS3-Ordnerspiele finden jetzt ihre ES-DE-Cover
  - type: fix
    label: Beim Importieren von System-Logos aus ES-DE wird kein unpassendes Bild mehr genommen, nur weil sein Name Buchstaben wie "gb" enthält
  - type: fix
    label: Ein Tag im Dateinamen einer ROM, etwa (USA), bestimmt jetzt ihre Region. Die KI wird nicht mehr gefragt, da sie eine USA-Kopie als Europa oder Japan eintragen konnte
  - type: feature
    label: Neues Tool in ROM Tools, Regionen aus Dateinamen korrigieren, korrigiert die Spiele, die ältere Scrapes so falsch erfasst haben
  - type: fix
    label: RAWG-Hintergrundbilder werden nicht mehr als Box-Art gespeichert, da sie oft Screenshots sind und ein echtes Cover blockierten. Sie werden stattdessen als Fanart verwendet
  - type: feature
    label: Neues Tool in ROM Tools, RAWG-Bilder aus Box-Art entfernen, entfernt die Bilder, die ältere Scrapes gespeichert haben, damit ein Scrapen echte Cover finden kann
  - type: feature
    label: RetroDB nennt RAWG jetzt mit einem Link in der Seitenleiste, wie RAWG es verlangt
  - type: fix
    label: ScreenScraper liefert jetzt für jedes Spiel Box, 3D-Box, Handbuch, Titelbild und Veröffentlichungsdatum der eigenen Region, statt der Region, die alphabetisch zuerst kam
  - type: feature
    label: Neues Tool in ROM Tools, Box- und Handbuch-Regionen korrigieren, tauscht Boxen und Handbücher aus, die ältere ScreenScraper-Scrapes aus der falschen Region genommen haben
  - type: fix
    label: ScreenScraper-Videos verwenden jetzt zuerst die kleinere Datei und die größere nur, wenn das fehlschlägt
  - type: fix
    label: Jeder Scraper durchsucht jetzt die richtige Konsole. Atari Lynx, Arcade CPS, Super Famicom und andere wurden auf der falschen Maschine gesucht, und viele weitere Systeme werden jetzt überhaupt durchsucht, von allen Quellen und für Achievements
  - type: feature
    label: Auf der Seite eines Spiels springen die Pfeiltasten links und rechts jetzt zum vorherigen und nächsten Spiel
  - type: feature
    label: Der Bereich Cheats auf der Seite eines Spiels lässt sich jetzt einklappen und merkt sich, ob du ihn offen gelassen hast
  - type: fix
    label: Wenn sich ein Fenster öffnet, das mit einem Textfeld beginnt, etwa Scrapen, steht der Cursor jetzt in diesem Feld statt auf der Schließen-Schaltfläche
  - type: feature
    label: Das neue Tool Screenshot-Prüfung in ROM Tools listet Screenshots von ZX Spectrum, Commodore 64 und Game Boy mit den verdächtigsten zuerst auf und entfernt nur, was du auswählst
  - type: fix
    label: Beim Scrapen wird jetzt ein Game-Boy-Screenshot abgelehnt, dessen Original weit mehr Graustufen hat, als die Maschine darstellen könnte
  - type: fix
    label: Die unteren Bereiche eines Spiels passen jetzt ins Fenster, statt über den rechten Rand hinauszulaufen
  - type: feature
    label: Importiere eine 3D-Box im Fenster Bearbeiten, neben den anderen Bildern
  - type: feature
    label: Die RetroAchievements-Anmeldung erreicht jetzt DuckStation und PCSX2, wenn du auf Spielen drückst
  - type: fix
    label: Auf 8-Bit- und 16-Bit-Systemen fügt das Scrapen einem Spiel, das auf mehreren Systemen erschien, keine IGDB- oder RAWG-Screenshots mehr hinzu, da sie die Version eines anderen Systems zeigen konnten
  - type: fix
    label: Der Emulator eines Spiels steht jetzt auf seiner Emulator-Einstellungskarte, nicht neben Spielen
  body: "<ul>\n  <li><strong>Jeder Scraper durchsucht die richtige Konsole.</strong> Atari\n    Lynx, Arcade CPS, Super Famicom und andere wurden auf der\n    falschen Maschine gesucht, und viele weitere Systeme werden jetzt überhaupt durchsucht,\n    von allen Quellen und für Achievements.</li>\n  <li><strong>Die Region eines Spiels kommt zuerst aus seinem eigenen Dateinamen.</strong>\n    Ein Tag wie (USA) bestimmt jetzt die Region, und die KI wird nicht mehr\n    gefragt. ROM Tools hat ein neues Tool, Regionen aus Dateinamen korrigieren, für\n    die Spiele, die ältere Scrapes falsch erfasst haben.</li>\n  <li><strong>ScreenScraper folgt der Region des Spiels.</strong> Box,\n    3D-Box, Handbuch, Titelbild und Veröffentlichungsdatum kommen jetzt aus der eigenen\n    Region des Spiels, nicht aus der, die alphabetisch zuerst kam. ROM Tools hat ein\n    neues Tool, Box- und Handbuch-Regionen korrigieren, für ältere Scrapes. Videos\n    versuchen es jetzt zuerst mit der kleineren Datei.</li>\n  <li><strong>RAWG-Bilder sind keine Box-Art mehr.</strong> Sie sind oft\n    Screenshots und blockierten ein echtes Cover. Sie werden jetzt als\n    Fanart verwendet. ROM Tools hat ein neues Tool, RAWG-Bilder aus Box-Art entfernen,\n    für die Bilder, die ältere Scrapes gespeichert haben. RetroDB nennt RAWG außerdem mit einem\n    Link in der Seitenleiste, wie RAWG es verlangt.</li>\n  <li><strong>ES-DE behält seinen Platz in deiner Scraper-Reihenfolge.</strong> Wenn\n    es nicht die Hauptquelle war, ersetzten spätere Quellen und die KI seine\n    Texte und Cover, und seine Screenshots wurden verworfen. Jetzt bleiben sie erhalten.\n    Es kopiert keine Medien mehr, die ein Spiel schon hat, und es liest den Eintrag\n    für die ROM-Datei des Spiels selbst. PS3-Ordnerspiele finden jetzt ihre ES-DE-\n    Cover. Beim Importieren von System-Logos wird kein unpassendes Bild mehr genommen.\n    Ein Vollständiges Neu-Scrapen löscht keine Box mehr, die eine andere Quelle gerade\n    heruntergeladen hat.</li>\n  <li><strong>Screenshot-Prüfung.</strong> Ein neues Tool in ROM Tools listet\n    Screenshots von ZX Spectrum, Commodore 64 und Game Boy mit den\n    verdächtigsten zuerst auf und entfernt nur, was du auswählst. Beim Scrapen wird jetzt ein Game-Boy-Screenshot abgelehnt, dessen Original weit mehr Graustufen hat\n    als die Maschine darstellen könnte. Auf 8-Bit- und 16-Bit-Systemen fügt es\n    keine IGDB- oder RAWG-Screenshots mehr zu einem Spiel hinzu, das auf mehreren\n    Systemen erschien.</li>\n  <li><strong>Die RetroAchievements-Anmeldung erreicht DuckStation und PCSX2,</strong>\n    wenn du auf Spielen drückst.</li>\n  <li><strong>Auf der Seite eines Spiels:</strong> Die Pfeiltasten links und rechts springen\n    zum vorherigen und nächsten Spiel, der Bereich Cheats lässt sich einklappen und\n    merkt sich das, die unteren Bereiche passen ins Fenster, und der Emulator\n    steht auf seiner Emulator-Einstellungskarte, nicht neben Spielen.</li>\n  <li><strong>Eine 3D-Box importieren</strong> geht jetzt im Fenster Bearbeiten, neben\n    den anderen Bildern.</li>\n  <li><strong>Ein Fenster, das mit einem Textfeld beginnt,</strong> etwa Scrapen,\n    setzt den Cursor jetzt in dieses Feld statt auf die Schließen-Schaltfläche.</li>\n</ul>\n"
