  body: |
    <ul>
      <li><strong>צ'יטים ל-RetroArch (RetroDB), ל-DuckStation
        ול-PCSX2.</strong> בהגדרות &gt; אמולטורים יש מקטע צ'יטים חדש.
        הורידו משם את חבילות הצ'יטים הציבוריות והחינמיות, או ייבאו
        תיקיות צ'יטים שכבר יש לכם; RetroDB מעתיק את הקבצים ולעולם לא
        משנה את התיקייה שלכם. עמוד המשחק מציג אז את הצ'יטים שלו, כל אחד
        עם מתג הפעלה/כיבוי, ותיבת חיפוש כשיש הרבה מהם.
        ב-RetroArch (RetroDB) הצ'יטים שהפעלתם נכנסים לתוקף בפעם הבאה
        שתלחצו על שחק, ושינויים שתעשו בתפריט של RetroArch במהלך המשחק
        נשמרים. ב-DuckStation וב-PCSX2 המתגים נשמרים בהגדרות של האמולטור
        עצמו עבור המשחק, כך ששינויים שנעשים בתוך האמולטור מופיעים גם
        בעמוד. RetroDB לעולם לא דורס קובץ צ'יטים שכבר יש לאמולטור. צ'יט
        פעיל משהה את מצב ההארדקור של RetroAchievements.</li>
      <li><strong>ייבאו קופסת תלת-ממד של Slipcase אל משחק.</strong> בעמוד
        המשחק יש כפתור ייבא קופסת תלת-ממד מתחת לעטיפה. בחרו את קובץ
        ה-<code>.box.json</code> ש-Slipcase שמר, יחד עם התמונות שלו,
        ו-RetroDB שומר את החזית, השדרה, הגב ושאר הפאות של הקופסה עבור
        המשחק. Slipcase 1.4.0 ומעלה שומר את הקובץ הזה לצד כל תמונה מיוצאת. תמונת עטיפת הקופסה התלת-ממדית שלכם לא משתנה. משחק שכבר יש
        לו פאות שואל לפני שהוא מחליף אותן, והסר מוחק אותן.</li>
      <li><strong>סובבו את קופסת התלת-ממד של משחק בידיים.</strong> לחצו על
        העטיפה של משחק עם קופסת Slipcase מיובאת, והקופסה מופיעה בתלת-ממד.
        גררו אותה, או השתמשו במקשי החצים, כדי לסובב אותה ולראות את השדרה,
        הגב, החלק העליון והתחתון. גללו או לחצו + ו- - כדי לשנות את הגודל;
        לחיצה כפולה או Home מחזירה אותה למקומה. משחק בלי קופסה מיובאת
        עדיין מגדיל את תמונת העטיפה שלו.</li>
      <li><strong>ההגדרות מקשרות לעמוד האמולטורים.</strong> לעמוד
        האמולטורים לא היה קישור בשום מקום בהגדרות, כך שאפשר היה להגיע
        אליו רק בהקלדת הכתובת שלו. מנהלים רואים עכשיו לשונית אמולטורים
        אחרי מערכת, ועמוד האמולטורים מציג את אותו סרגל לשוניות, כך
        שהלשוניות האחרות במרחק לחיצה אחת.</li>
      <li><strong>הגדלת העטיפה כבר לא מוסתרת מאחורי
        התפריטים.</strong> בטלפון, הסרגלים העליון והתחתון כיסו את העטיפה
        המוגדלת והסתירו את כפתור הסגירה שלה, ובמחשב הסרגל הצדדי כיסה את
        הצד השמאלי שלה. ההגדלה נפתחת עכשיו מעל הכול.</li>
      <li><strong>מודלי Claude 5.5 עבור הבינה המלאכותית.</strong> הגדרות &gt; מגרד מציג את מודלי Claude החדשים ביותר של Anthropic: ‏Haiku 5.5, ברירת המחדל החדשה והזול ביותר, Sonnet 5.5 ו-Opus 5.5, עם המחירים הנוכחיים. RetroDB כבר לא שולח הגדרה ש-Sonnet 5.5 דוחה.</li>
      <li><strong>הקלדת נתון המכירות של משחק.</strong> בשני מסכי העריכה יש תיבת „עותקים שנמכרו” מתחת למפתח. מספר שתקלידו מוצג בדף המשחק, כמו מספר שהבינה המלאכותית מצאה. רוקנו את התיבה כדי להסיר אותו.</li>
      <li><strong>בדיקת מפתח ה-AI בהגדרות.</strong> בהגדרות &gt; מגרד יש כפתור „בדיקת מפתח ה-AI השמור” מתחת לספק ה-AI. הוא מראה אם המפתח עובד, ואם לא, למה: מפתח שנדחה, אין יתרה, או מגבלת שימוש. קודם, מפתח שנדחה נראה כמו מפתח עובד.</li>
      <li><strong>Claude יכול לחפש נתוני מכירות באינטרנט.</strong> בהגדרות &gt; מגרד יש מתג „לאפשר ל-Claude לחפש באינטרנט” מתחת למודל Claude, כבוי בהתחלה. בלי חיפוש, Claude עונה ממה שהוא כבר יודע ומשאיר ריק את העותקים שנמכרו. כשהמתג מופעל, Claude מחפש את הנתונים. Anthropic גובה תשלום על כל חיפוש, ולכן מילוי AI מבצע לכל היותר 5 חיפושים למשחק, עד 5 סנט אמריקאי; כבו את המתג לפני גירוד המוני גדול.</li>
      <li><strong>מילוי AI למערכת שלמה בבת אחת.</strong> בכלי ROM יש עמוד חדש, מילוי AI המוני, שמכיל גם את שמות רשמיים. בחרו מערכת, או כל המערכות, הפעילו את השדות שתרצו למלא ולחצו על מילוי עם AI: RetroDB מריץ מילוי AI על כל משחק, בדיוק כמו כפתור מילוי AI בעמוד של משחק, ושומר את התשובות ישירות במשחק. סרגל התקדמות ותיבת התראה של מילוי AI מראים כמה הוא התקדם, ואפשר לעזוב את הדף בזמן שהוא רץ. הוא מציג כמה משחקים ימלא ושואל קודם, כי ספק ה-AI שלכם גובה תשלום על כל משחק. משחקים שמילוי AI כבר טיפל בהם מדולגים אלא אם תחזירו אותם, וההרצה נעצרת מעצמה אם ה-AI מפסיק לענות.</li>
      <li><strong>תיבות ההתראה של משימות לוקחות את צבעי ערכת הנושא שלכם.</strong> התיבות שמציגות משימה רצה, כמו גירוד המוני ו-RA Sync, וסרגלי ההתקדמות משתמשות עכשיו בצבעי ערכת הנושא שבחרתם. משימה שאי אפשר להשהות כבר לא מציגה את הכותרת שלה בצבע ההשהיה.</li>
      <li><strong>דף האמולטורים נראה כמו שאר לשוניות ההגדרות.</strong> הגדרות &gt; אמולטורים מחולק עכשיו לכרטיסים, וסרגל מתחת ללשוניות קופץ לכל אחד מהם: RetroArch, שחק ב-RetroDB, ליבות, צ'יטים, תיקיות, אמולטורים ומיפוי. הסרגל נשאר למעלה בזמן הגלילה ומסמן את החלק שבו אתם נמצאים.</li>
      <li><strong>התקדמות ההורדה ליד הכפתור.</strong> כשאתם מורידים את RetroArch, את הליבות של הנגן או חבילת צ'יטים, הערה ליד הכפתור מראה באחוזים כמה התקדמה ההורדה. בעבר הופיעה שורה מתחת לכפתורים ודחפה את שאר הדף למטה.</li>
      <li><strong>בחירת האמולטור של כל מערכת מתוך רשימה.</strong> מיפוי לכל מערכת בהגדרות &gt; אמולטורים מציג עכשיו כל מערכת פעם אחת, עם רשימה של האמולטורים המקושרים אליה. האמולטור שתבחרו הוא זה ששחק משתמש בו עבור המשחקים של אותה מערכת, אלא אם משחק מגדיר אמולטור משלו. אמולטור ש-RetroDB לא מוצא מסומן "לא נמצא". בעבר לכל מערכת הייתה שורה לכל אמולטור, עם נקודה קטנה לבחירת ברירת המחדל. ה-RetroArch של RetroDB עצמו מופיע עכשיו ברשימה של כל מערכת רשומה שהוא יכול להריץ, כולל מערכות שעדיין אין בהן משחקים.</li>
      <li><strong>כפתור עיין בכל שדה נתיב.</strong> מנהלים יכולים עכשיו לבחור תיקייה או תוכנה בלחיצה דרך התיקיות של המחשב במקום להקליד את הנתיב: הגדרות &gt; אמולטורים, ספרייה, גירוד וחשבון, וכן ההגדרות של כלי ROM. שדות שמצפים לתוכנה מציגים גם קבצים. תיקיות מוסתרות כמו <code>.config</code> מופיעות בסוף.</li>
      <li><strong>הסטיק השמאלי פועל כ-D-Pad ב-RetroArch של RetroDB.</strong> במשחקים למערכות ללא סטיק, כמו NES או Mega Drive, אפשר עכשיו לנוע גם בסטיק השמאלי וגם ב-D-Pad. כשליבת האמולטור של משחק קוראת את הסטיק בעצמה, כמו ב-Nintendo 64, הסטיק נשאר סטיק אמיתי.</li>
      <li><strong>התחברות ל-RetroAchievements מההגדרות.</strong> הגדרות &gt; חשבון יכול עכשיו לחבר אתכם עבור ה-RetroArch של RetroDB, כך שהישגים נפתחים בזמן המשחק בלי התחברות בתוך האמולטור. הסיסמה נשלחת רק ל-RetroAchievements ואינה נשמרת. לכל משתמש RetroDB יש התחברות משלו ומתג מצב הארדקור משלו, שמתחיל כבוי. DuckStation ו-PCSX2 עדיין מתחברים מהתפריטים שלהם.</li>
      <li><strong>לראות באיזה אמולטור ישתמש הכפתור שחק.</strong> דף המשחק מציג כעת „מופעל באמצעות:” ואת שם האמולטור ליד הכפתור שחק, או מציין שלא הוגדר אמולטור.</li>
      <li><strong>חלונית הצ'יטים מסבירה למה למשחק אין צ'יטים.</strong> כשהאמולטור של משחק אינו יכול להשתמש בצ'יטים, החלונית מציגה כעת את הסיבה במקום להישאר מוסתרת.</li>
      <li><strong>נתיבי תיקיות ארוכים נכנסים למסך הטלפון.</strong> נתיב תיקייה ארוך בהגדרות כבר לא גורם לדף להיגלל הצידה.</li>
    </ul>
