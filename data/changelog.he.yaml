        הרקע המונפש משנה כעת את גודלו בצורה נקייה.</li>
    </ul>
- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: הפעילו משחק ישירות מדף הספרייה ומדפי המערכות
  body: |
    <ul>
      <li><strong>כפתור ▶ שחק בכל כרטיס משחק.</strong> הוא מופיע בפינה
        השמאלית התחתונה של העטיפה בדף הספרייה ובכל דף מערכת. לחצו עליו והמשחק
        יופעל באמולטור שלו; אתם נשארים ברשימה במקום לפתוח קודם את דף
        המשחק.</li>
      <li>הכפתור מופיע רק במקום שבו לחיצה עליו יכולה לעבוד: לחשבון שלכם מותר
        להפעיל משחקים, והאמולטור של המשחק מופעל, מותקן, ובמקרה של RetroArch יש
        לו את הליבה שלו. משחקים במערכות שאין להן אמולטור תקין לא מציגים
        כפתור.</li>
      <li>אם ההפעלה בכל זאת נכשלת, למשל כי קובץ ה-ROM הועבר, הסיבה מופיעה
        בהודעה והדף נשאר כפי שהיה.</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: סרגל צד קצר יותר, עם דף הישגים אחד לכל הפלטפורמות
  body: |
    <ul>
      <li><strong>קישור "הישגים" אחד מחליף חמישה.</strong>
        RetroAchievements,‏ RPCS3,‏ PSN,‏ Steam ו-Xbox הם כעת לשוניות בדף אחד,
        והקישור פותח מחדש את הלשונית שבה השתמשתם לאחרונה. אם אין לכם משחקי
        RetroAchievements, הוא נפתח בלשונית RPCS3 במקום להחזיר אתכם ללוח
        הבקרה.</li>
      <li><strong>דוחות ROM נמצאים כעת בכלי ROM,</strong> כלשונית לצד הכלים
        האחרים וככרטיס בדף כלי ROM.</li>
      <li><strong>אין עוד שני קישורים בסרגל הצד עם אותו סמל:</strong> לוח
        הבקרה הוא כעת 🏠 ומציג היומנים 🧾. בסרגל הצד יש 16 קישורים במקום
        21.</li>
      <li>לשוניות הכלים בדף ההגדרות של כלי ROM היו תמיד באנגלית; כעת הן
        מוצגות בשפה שלכם.</li>
    </ul>
- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: חיפושי How Long To Beat עובדים שוב
  body: |
    <ul>
      <li><strong>כל חיפוש ב-How Long To Beat הודיע שהמשחק לא נמצא.</strong>
        האתר העביר את החיפוש שלו לכתובת חדשה, ולכן הבקשות של RetroDB נדחו;
        התקלה התחילה בין סוף יולי לסוף ספטמבר. RetroDB משתמש כעת בכתובת החדשה,
        ושולח את מסנני הפלטפורמה והשנה בפורמט החדש של האתר, מאחר שהאתר התחיל
        להתעלם מהם בפורמט הישן. גם חיפוש של משחק בודד וגם החיפוש ההמוני בכלי
        ROM עובדים שוב.</li>
    </ul>
- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: RetroDB אומר כעת במפורש שהוא אינו מצדד בפיראטיות
  - type: fix
    label: חלון אודות נפתח שוב בגודל מלא
  body: |
    <ul>
      <li><strong>הודעה נגד פיראטיות נמצאת כעת באפליקציה.</strong> היא מופיעה
        בחלון אודות ומתחת לנתיב ספריית ROM בהגדרות, בכל השפות. נאמר בה
        ש-RetroDB אינו מפיץ ואינו מאחסן קובצי ROM, שעליכם להשתמש רק במשחקים
        שהועתקו מתקליטורים ומקלטות שבבעלותכם, ושאין ל-RetroDB קשר לאף יצרן
        קונסולות, מוציא לאור או מסד נתונים של משחקים. הנוסח תואם את האתר
        והטריילר של RetroDB.</li>
      <li><strong>חלון אודות נדחס לתוך סרגל הצד.</strong> כעת הוא נפתח באמצע
        המסך בגודלו הרגיל, ונגלל במסך קטן במקום להסתיר את הכותרת ואת כפתור
        הסגירה שלו.</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: RetroDB מפעיל קבצים, או משנה שמות קבצים, רק לסוגי קובצי ROM אמיתיים
  body: |
    <ul>
      <li><strong>אפשר היה להפעיל משחק עם קובץ שאינו ROM.</strong> שינוי שם
        של ROM קיבל כל שם, כך ש-<code>crash.bin</code> יכול היה להפוך
        ל-<code>crash.cfg</code> והאמולטור קיבל אותו. ההפעלה בודקת כעת את סוג
        הקובץ מול הרשימה שבקובץ <code>systeminfo.txt</code> של תיקיית המערכת,
        אותה רשימה שסריקת הספרייה משתמשת בה, ושינוי שם מסרב לסוג שאינו ברשימה.
        אם לתיקיית מערכת אין רשימה, המשחקים שלה לא יופעלו, וההודעה מציינת את שם
        הקובץ החסר.</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: רק מנהל יכול לשנות את ארגומנטי ההפעלה של משחק
  - type: fix
    label: ארגומנטי הפעלה עם כמה מילים, או עם מירכאה תועה, עובדים כעת
  - type: fix
    label: RetroDB כבר לא שומר בזיכרון כל הפעלה שהסתיימה
  body: |
    <ul>
      <li><strong>עורך יכול היה להוסיף ארגומנטי הפעלה שהריצו קוד
        אחר.</strong> <em>ארגומנטי הפעלה מותאמים אישית</em> של משחק עוברים
        ישירות לאמולטור, ועם RetroArch הם יכלו לטעון כל קובץ תוכנה במחשב. שינוי
        שלהם דורש כעת תפקיד מנהל, והשדה מוסתר מכל השאר.</li>
      <li><strong>ארגומנטי הפעלה עם יותר ממילה אחת הגיעו לאמולטור כארגומנט
        אחד.</strong> <code>--a --b</code> מגיע כעת כשני ארגומנטים, וערך ריק
        לא מוסיף דבר. מירכאה סוגרת חסרה גרמה בעבר לכל הפעלה של אותו משחק
        להיכשל עם שגיאת שרת; כעת מוצגת הודעה שמציינת איזה שדה לתקן. האסימון
        <code>{disc_paths}</code> הוסר: הוא תמיד היה ריק.</li>
      <li><strong>הפעלות שהסתיימו הצטברו בזיכרון עד ש-RetroDB הופעל
        מחדש.</strong> הפעלה שהסתיימה לפני יותר משעה מנוקה כעת.</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: בחירת שפה בהגדרות עובדת שוב
  body: |
    <ul>
      <li><strong>בחירת שפה תחת הגדרות &rarr; ספרייה &rarr; תצוגה לא עשתה
        דבר.</strong> במקום זאת הוצגה שגיאה והדף נשאר בשפה הקודמת. התקלה
        התחילה בגרסה 3.23.8. בחירת שפה שומרת אותה כעת וטוענת מחדש את הדף
        בשפה הזו.</li>
    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: סמלי הגביעים והפלטפורמות חזרו להורדה
  body: |
    <ul>
      <li><strong>בהורדה חסרו סמלי הגביעים והפלטפורמות של RetroDB.</strong>
        כל כרטיס משחק עם RetroAchievements הציג תמונה שבורה במקום התג שלו, וגם
        דרגות הגביעים והסמלים של PSN,‏ Steam,‏ Xbox ו-RPCS3 היו חסרים. כעת הם
        נכללים בכל הורדה.</li>
    </ul>
- version: 3.23.14
  date: '2026-10-10'
  tags:
  - type: security
    label: שתי ספריות מצורפות עודכנו בעקבות תיקוני אבטחה שפורסמו
  body: |
    <ul>
      <li><strong>ב-urllib3 וב-Werkzeug היו בעיות אבטחה ידועות.</strong>
        RetroDB כולל כעת את urllib3 2.8.0 ואת Werkzeug 3.1.9, הגרסאות שמתקנות
        אותן. התקנה מקוד מקור מקבלת אותן בהרצה חוזרת של
        <code>install.py</code>, שמתקין מתוך
        <code>requirements.lock</code>.</li>
    </ul>
- version: 3.23.13
  date: '2026-09-26'
  tags:
  - type: fix
    label: מדיה שנשמרה כנתיב תיקייה כבר לא מדווחת כחסרה
  body: |
    <ul>
      <li><strong>בגרסה העצמאית, "ניקוי הפניות למדיה חסרה" יכול היה למחוק
        מדיה שהייתה קיימת בפועל.</strong> זה קרה כשמסד הנתונים שמר את המדיה
        כנתיב תיקייה, כמו <code>images/boxart/…</code>, ולא כשם קובץ בלבד.
        RetroDB מחפש אותה כעת בתיקייה הנכונה.</li>
    </ul>
- version: 3.23.12
  date: '2026-09-26'
  tags:
  - type: fix
    label: לוח הבקרה מציג גרידה המונית שרצה, וארבעה תיקונים קטנים
  body: |
    <ul>
      <li><strong>כרטיס התקדמות הגרידה בלוח הבקרה מעולם לא הופיע.</strong>
        כעת הוא מוצג בזמן שגרידה המונית רצה, ומציין מתי היא מושהית.</li>
      <li><strong>אין יותר שגיאות במסוף הדפדפן בדף ההתחברות.</strong> הדף
        הפסיק לבדוק משימות רקע לפני שמישהו מחובר.</li>
      <li><strong>אשף ההתקנה כבר לא אומר "ההתקנה הושלמה!" כשהשמירה
        נכשלה.</strong> כעת הוא מודיע לכם שלא ניתן היה לשמור את ההגדרות.</li>
      <li><strong>שתי גרידות המוניות שהתחילו באותה שנייה כבר לא חולקות
        מזהה</strong>, כך שפעולות בתור כמו ביטול פועלות על הגרידה הנכונה.</li>
    </ul>
- version: 3.23.11
  date: '2026-09-26'
  tags:
  - type: ui
    label: כפתורי התרומה אומרים כעת במה הם תומכים
  body: |
    <ul>
      <li><strong>נוסח ברור יותר לתרומות.</strong> הכפתורים בכותרת העליונה
        נקראים כעת "Sponsor RetroDB" ו-"Support RetroDB". קובץ ה-README מציין
        שכל גרסה ניתנת בחינם, ושהתרומות מממנות את RetroDB עצמו, ולא את
        האמולטורים והליבות שהוא יכול להפעיל.</li>
    </ul>
- version: 3.23.10
  date: '2026-09-26'
  tags:
  - type: fix
    label: דפי כלי ROM פועלים לפי ההגדרות השמורות שלכם, ודפי היומנים וכלי ROM עובדים שוב
  body: |
    <ul>
      <li><strong>דף היומנים וחלק מדפי כלי ROM היו שבורים.</strong> סקריפט
        באותם דפים נכשל בזמן הטעינה, ולכן מציג היומנים וכלי העזר המשותפים של
        כלי ROM מעולם לא התחילו לפעול. כעת הם נטענים כראוי.</li>
      <li><strong>הגדרות כלי ROM עושות כעת משהו.</strong> מאתר הכפילויות
        וממיר CHD נפתחים עם האפשרויות שנקבעו בדף ההגדרות של כלי ROM, ועדיין
        אפשר לשנות אותן להרצה אחת.</li>
      <li><strong>המתגים של ממיר CHD לא נלקחו בחשבון.</strong> כיבוי "מחק את
        הקבצים המקוריים" בדף לא מנע את המחיקה אם ההגדרה השמורה שלכם קבעה למחוק.
        כעת המתגים שבדף הם שקובעים.</li>
      <li><strong>נעשה שימוש בהגדרת הנתיב הזמני.</strong> קבצים שמוכנים בזמן
        בניית רשימות השמעה M3U נשמרים כעת בתוכו.</li>
    </ul>
- version: 3.23.9
  date: '2026-09-26'
  tags:
  - type: security
    label: קובצי היומן של המגרדים כבר לא שומרים סיסמאות ואסימונים, וניסיונות ההתחברות מוגבלים שוב
  - type: fix
    label: שמירת ההגדרות כבר לא מוחקת את ההגדרות שלכם, ומחיקת משתמש עובדת
  body: |
    <ul>
      <li><strong>קובצי יומן שמרו סודות כטקסט גלוי.</strong> קובצי היומן של
        המגרדים היו אמורים להסתיר אסימוני התחברות ומפתחות API, אבל שלב ההסתרה
        מעולם לא רץ, ולכן הם נכתבו במלואם. כעת הם מוסתרים. קובצי יומן ישנים
        עדיין מכילים אותם; מחקו קבצים ישנים ב-<code>logs/</code> אם אתם משתפים
        את ההתקנה שלכם.</li>
      <li><strong>מגבלות ניסיונות ההתחברות לא נאכפו.</strong> המגבלות על
        התחברויות חוזרות ועל פעולות כבדות (סריקות, גרידות, ייבוא) הוגדרו אך
        מעולם לא הופעלו. כעת הן עובדות, ובקשה שנחסמה מקבלת הודעת "יותר מדי
        בקשות" ברורה.</li>
      <li><strong>קובץ הגדרות פגום יכול היה להימחק.</strong> אם לא ניתן היה
        לקרוא את <code>data/settings.json</code>, השמירה הבאה החליפה אותו
        בברירות המחדל. RetroDB שומר כעת את הקובץ הפגום בשם
        <code>settings.json.corrupt-&lt;time&gt;</code> לפני השמירה. אם הקובץ
        שוב נקרא כראוי, השמירה נדחית במקום זאת.</li>
      <li><strong>שורת השמות של מנוע איבדה הגדרות אחרות.</strong> הוספת תגית
        לשורת מנוע בהגדרות מתן השמות נכשלה, וגם השליכה את הגדרות התווית
        והאזור שנשמרו איתה. כעת היא נשמרת כראוי.</li>
      <li><strong>מחיקת משתמש נכשלה.</strong> לא ניתן היה למחוק משתמש שיש לו
        תגיות, רשימות, פריטים ברשימת המשאלות או נתוני PSN. המחיקה מסירה כעת את
        המשתמש ואת כל מה שבבעלותו.</li>
      <li><strong>שתי גרידות יכלו לרוץ בו־זמנית.</strong> החלפה או הזזה של
        גרידה המונית שרצה בתור הפעילה שתי גרידות שחלקו מונה התקדמות אחד. כעת
        רצה רק אחת.</li>
      <li><strong>התקדמות של גרידה המונית יכלה להיראות כמו שגיאה.</strong>
        לפני ההצלחה הראשונה שלה, גרידה המונית דיווחה על מצבה בצורה שחלק
        מהמסכים פירשו ככישלון. זה תוקן.</li>
      <li><strong>התחברות מחזירה אתכם כעת לדף שביקשתם.</strong> בעבר היא
        תמיד הובילה ללוח הבקרה.</li>
      <li><strong>פעולות קבצים של מנהל נשארות בתוך התיקיות שלכם.</strong> כלי
        שינוי גודל התמונות ופעולות שינוי השם של ROM מסרבים כעת לכל דבר שמחוץ
        לתיקיית המדיה או לתיקיית ה-ROM שלכם.</li>
      <li><strong>קובצי התחברות ישנים של PSN ו-Xbox מועברים לחשבון
        שלכם.</strong> קובץ <code>data/psn_tokens.json</code> או
        <code>data/xbox_tokens.json</code> שנשאר נטען לחשבון שלכם, ושמו משתנה
        כך שיסתיים ב-<code>.migrated-015</code>. הקובץ הזה עדיין מכיל את
        האסימון, לכן מחקו אותו אחרי שבדקתם שההתחברות עובדת.</li>
      <li><strong>שגיאות ברורות יותר מהשרת.</strong> בקשה שגויה נענית כעת
        בהודעת שגיאה מתאימה במקום "אירעה שגיאה פנימית".</li>
    </ul>
- version: 3.23.8
