  body: |
    <ul>
      <li><strong>גרסאות אזוריות של משחק מוצגות כמשחק אחד.</strong> קשרו את
        הגרסאות שיש לכם (למשל, ההוצאות של ארה"ב, אירופה ויפן) והספרייה תציג
        כרטיס אחד עם תג &#127760;. הכרטיס פותח ומפעיל את הגרסה מאזור ברירת
        המחדל שלכם. דף המשחק מציג את כל הגרסאות זו לצד זו ומאפשר לעבור ביניהן.
        כלי ROM &gt; גרסאות אזוריות מציע קבוצות שהעורכים מאשרים; שום דבר לא
        נקשר בלעדיכם. הוא אף פעם לא מציע משחק המשך כגרסה של המשחק הראשון.
        גרסאות מקושרות כבר לא מדווחות ככפילויות לפי שם. הריצו פעם אחת את מלא
        כותרות חלופיות כדי לתת להצעות יותר חומר לעבוד איתו.</li>
      <li><strong>AI יכול לסכם במה גרסאות אזוריות שונות זו מזו.</strong>
        במשחק עם גרסאות מקושרות, עורכים יכולים ללחוץ על סכם הבדלים עם AI בסעיף
        גרסאות אזוריות. ה-AI מפרט הבדלים ידועים כמו צנזורה, רמת קושי או תוכן
        שהוסר. הרשימה מסומנת ככתובה בידי AI, מוצגת בדף של כל גרסה, ומוסתרת
        כשאתם מקשרים גרסה או מנתקים אותה, עד שהיא נכתבת שוב. נדרש ספק AI
        שהוגדר בהגדרות &gt; גירוד.</li>
      <li><strong>משחקי PlayStation נפתחים עם הגדרות טובות.</strong> עבור
        DuckStation,‏ PCSX2 ו-RPCS3, ‏RetroDB קובע כעת את קנה המידה של הרזולוציה
        ואת יחס הגובה-רוחב של כל משחק בקובץ ההגדרות של האמולטור עצמו לאותו משחק
        כשאתם לוחצים על שחק, וגם אם הוא נפתח במסך מלא. שנו אותם למערכת שלמה
        בכפתור ההגדרות בהגדרות &gt; אמולטורים, או למשחק אחד בחלונית הגדרות
        אמולטור החדשה בדף המשחק שלו. הגדרה שאתם משנים בתוך האמולטור תמיד גוברת.
        RetroDB קורא את המספר הסידורי של כל דיסק כדי למצוא את הקובץ הנכון; דיסקי
        CHD דורשים ש-chdman יהיה מותקן.</li>
      <li><strong>כבר אי אפשר להטות את מילוי AI באמצעות טקסט שהוקלד בשדות של
        משחק.</strong> כשמילוי AI בודק את המוציא לאור, המפתח, המהדורה או
        הפלטפורמות האחרות שכבר רשומים למשחק, הוא מנקה כעת את הטקסט הזה קודם,
        כמו שכבר ניקה את הכותרת.</li>
      <li><strong>סריקות של כלי ROM נשארות בתוך תיקיית ה-ROM שלכם.</strong>
        ממיר CHD ואימות CHD כבר לא עוקבים אחרי קיצור דרך (symlink) שמצביע אל
        מחוץ לה, ופריסת ארכיון מרובה דיסקים מתעלמת מכל קיצור דרך שנארז
        בתוכו.</li>
      <li><strong>הדפים מסרבים להריץ סקריפטים שהוחדרו אליהם.</strong> הדפדפן
        שלכם חוסם כעת כל סקריפט ש-RetroDB לא כתב בעצמו, כך שטקסט שמגניב קוד
        לכותרת של משחק, לתגית או לתיאור שגורד לא יכול להריץ אותו. כפתורים
        ותפריטים פועלים כמו קודם.</li>
      <li><strong>צילום מסך פגום אחד כבר לא עוצר את בדיקות הכפילויות של
        משחק.</strong> צילום מסך שלא ניתן לקרוא מונח בצד והבדיקה ממשיכה.</li>
      <li><strong>משימות של כלי ROM כבר לא נתקעות על "פועל".</strong> קובץ
        שנמחק אחרי סריקת אימות CHD נספר כלא תקין, וכל שגיאה בלתי צפויה בהמרת
        CHD, באימות CHD או במאתר כפילויות מסיימת את המשימה ככושלת, עם השגיאה
        ביומן שלה.</li>
      <li><strong>לפני שההגדרה הסתיימה, בקשות הנתונים של האפליקציה מקבלות
        תשובה ברורה.</strong> הן עונות "נדרשת הגדרה ראשונית" במקום להחזיר את דף
        ההגדרה. הדפים עדיין מעבירים אתכם לאשף ההגדרה.</li>
      <li><strong>משחקי המשך כבר לא מציגים את ההישגים של המשחק
        הראשון.</strong> ההתאמה ל-RetroAchievements התעלמה מהמספר שבכותרת, ולכן
        Donkey Kong Country 2 ו-3 קושרו ל-Donkey Kong Country. מספרים (2, II, 3,
        III וכן הלאה) נלקחים כעת בחשבון. כדי לתקן משחקים שכבר קושרו, הריצו פעם
        אחת את רענון RetroAchievements לכל המערכות.</li>
      <li><strong>סנכרון PlayStation כבר לא מוחק את ספירת הגביעים
        שלכם.</strong> כשהתשובה של PlayStation השמיטה את סך הגביעים של משחק,
        RetroDB שמר אפסים על הספירה שכבר הייתה לו. כעת הוא שומר אותה, גם ברענון
        הגביעים ההמוני.</li>
      <li><strong>פתיחת סט גביעים שכבר לא נמצא בדיסק מציגה הודעה.</strong> דף
        הגביעים נכשל בעבר עם שגיאה; כעת הוא אומר שהסט לא נמצא ומחזיר אתכם
        לרשימה.</li>
      <li><strong>הטבלאות בכלי ROM נותנות לעמודת הכפתורים את הכותרת הנכונה בכל
        שפה.</strong> כותרת העמודה חלקה את הניסוח שלה עם ז'אנר משחקי האקשן, ולכן
        בחלק מהשפות הופיע שם הז'אנר.</li>
      <li><strong>משחקי GameCube,‏ 3DS ו-Super Famicom מקבלים את האמולטור שלהם
        באופן אוטומטי.</strong> RetroDB חיפש את המערכות האלה בשמות תיקיות
        שספריות לא משתמשות בהם (gamecube,‏ 3ds,‏ superfamicom במקום gc,‏ n3ds,‏
        sfc), ולכן Dolphin ו-Citra אף פעם לא חוברו אליהן. הפעילו מחדש את RetroDB
        פעם אחת כדי שהשינוי ייכנס לתוקף.</li>
      <li><strong>ההורדה ללא Python (העצמאית) מגדירה שוב אמולטורים.</strong>
        חסר בה הקובץ שמפרט אותם.</li>
      <li><strong>כ-170 כפתורים, תוויות והודעות נוספים מתורגמים</strong> בכל
        שפה. בעבר הם הופיעו באנגלית, וכמה מהם הציגו ניחוש שגוי (בחלק מהשפות
        נכתב "הגיבוי נכשל" כשמשחק לא הצליח לעלות).</li>
      <li><strong>Escape סוגר רק את החלון העליון.</strong> כששאלה הייתה פתוחה
        מעל חלון אחר, Escape סגר את שניהם; חלונות מסוימים גם המשיכו לפעול אחרי
        ש-Escape הסתיר אותם, ולחיצה על Escape בדף משחק יכלה לחדש גירוד המוני
        שהשהיתם. כל חלון נסגר כעת דרך פעולת הסגירה שלו, שומר את מיקוד המקלדת
        בתוכו כל עוד הוא פתוח, ומחזיר את המיקוד לכפתור שפתח אותו. חלונות התקדמות
        של משימות פעילות נשארים פתוחים עד שהמשימה מסתיימת.</li>
      <li><strong>התרשימים בניתוח נתונים מוצגים בשפה שלכם.</strong> שמות
        הז'אנרים, נקודות המבט, הממדים והמצבים, כותרות התרשימים, שמות הצירים
        ומקראות היו באנגלית בכל שפה.</li>
      <li><strong>נתוני RetroAchievements בטוחים יותר.</strong> אם רשימת
        המשחקים של RetroAchievements לקונסולה לא נטענת, רענון RA משאיר כעת את
        המשחקים של אותה קונסולה מקושרים במקום לנתק את כולם. נקה נתוני RA מנקה
        כעת רק את ההתקדמות ב-RetroAchievements; ההתקדמות ב-Steam וב-Xbox
        נשארת.</li>
      <li><strong>סיסמאות חייבות להיות באורך 12 תווים לפחות בכל
        מקום.</strong> ההגדרה הראשונית קיבלה סיסמת מנהל בכל אורך, ודפי שינוי
        הסיסמה הכפוי וההגדרה אמרו ש-4 תווים מספיקים. שלושתם מבקשים כעת 12, כמו
        בשאר האפליקציה.</li>
      <li><strong>סיכומי ההישגים נכונים, ושלכם.</strong> סנכרון של משחק אחד
        מ-RetroAchievements שומר כעת כמה הישגים יש לו, במקום 0. סיכומי ההישגים
        בלוח הבקרה סופרים רק את המשחקים שלכם, וגביעי האספן כבר לא סופרים פעמיים
        כל הישג של Steam או Xbox.</li>
      <li><strong>סנכרונים ברקע משתמשים בחשבונות שלכם.</strong> סנכרון מערכת
        של RetroAchievements מתחבר עם חשבון RetroAchievements שלכם כשהגדרתם
        אחד. רענון PlayStation ההמוני משתמש שוב בהתחברות השמורה שלכם במקום
        להתחבר מאפס בכל פעם.</li>
      <li><strong>רק אתם יכולים לעצור או לחדש את הסנכרון שלכם.</strong> משתמש
        אחר כבר לא יכול לבטל את סנכרון RetroAchievements,‏ Steam או Xbox שלכם,
        וחידוש משימה שנקטעה דורש את אותן הרשאות כמו הפעלתה. מנהלים עדיין יכולים
        לעשות את שניהם.</li>
      <li><strong>תיקיית הגביעים של RPCS3 נבדקת כשאתם שומרים אותה.</strong>
        תיקייה שלא קיימת, שאינה נתיב מלא או שהיא תיקיית מערכת נדחית, כפי שכבר
        קרה בהגדרות הראשיות.</li>
      <li><strong>"אחזר את כל התמונות" במוזיאון פועל ברקע.</strong> הדף כבר לא
        ממתין דקות לכל תמונות הבקרים. הוא מראה כמה מהאחזור הושלם, יש בו כפתור
        ביטול, והוא ממשיך להציג את ההתקדמות אם עוזבים את הדף וחוזרים.</li>
      <li><strong>כלי ROM מגנים טוב יותר על הקבצים שלכם.</strong> ניקוי כבר לא
        מרוקן ארכיון: אי אפשר לשמור תבנית כמו <code>*</code>, והניקוי נעצר אם
        התבניות היו מסירות כל קובץ. ממיר CHD שומר את המקור כש"אימות" כבוי,
        ומשאיר קובץ CHD קיים כמות שהוא כש"דלג על קיימים" פועל. מאתר כפילויות
        תמיד שומר עותק אחד מכל משחק, גם אם בקשה מבקשת את כולם.</li>
      <li><strong>משימות של כלי ROM מתנהגות כפי שהכפתורים אומרים.</strong>
        השהה משהה כעת את המרת CHD, אימות CHD, מאתר כפילויות והסרת כפילויות
        צילומי מסך, ואפשר לבטל משימה מושהית. סריקה של הסרת כפילויות צילומי מסך
        שנתקלת בשגיאה מסתיימת כעת ככושלת במקום לרוץ לנצח.</li>
      <li><strong>יצירת M3U כבר לא מכינה ארכיונים בתיקייה זמנית.</strong>
        ארכיונים שהועברו עוברים כעת לתיקיית הנתונים של RetroDB עצמו, שאינה
        מתרוקנת בהפעלה מחדש. סורק הארכיונים מראה לאן הם הלכו, ואישור האצווה
        אומר שהם יועברו. איפוס ההגדרות של כלי ROM מאפס כעת כל אפשרות.</li>
      <li><strong>החליפו דיסקים מתוך RetroDB.</strong> בזמן שמשחק RetroArch
        שהופעל מרשימת דיסקים ‎.m3u‏ רץ, רשימת &#9654; משוחק כעת בראש כל דף מציגה
        את כותרת המשחק וכפתור הדיסק הבא, כך שמשחק שמבקש את הצד השני ממשיך בלחיצה
        אחת, מהדפדפן או מטלפון. ב-RetroArch צריך להפעיל את Settings &gt; Network
        &gt; Network Commands (פורט 55355); הכפתור אומר זאת אם האפשרות
        כבויה.</li>
      <li><strong>סקריפט ההפעלה פותח את RetroDB כשהוא מוכן.</strong> start.sh,‏
        start.command ו-start.bat פתחו את הדפדפן אחרי 3 שניות קבועות, לעתים
        קרובות לפני שהשרת יכול היה לענות, ולכן הדף לא נטען. RetroDB פותח אותו
        כעת ברגע שהשרת מאזין. כשהוא מופעל מ-LocalWebServerManager, הוא לא פותח
        דף בכלל; השתמשו בכפתור Open של המנהל.</li>
      <li><strong>סרטוני משחקים יכולים להגיע עד 500 MB.</strong> המגבלה הייתה
        50 MB, קטנה מדי לרוב הטריילרים. העלאה גדולה מדי מציגה כעת הודעה בדף
        המשחק במקום להחליף את הדף בטקסט פשוט. סרטון שנדחה (גדול מדי או מסוג
        קובץ שגוי) אומר זאת כעת במקום להיעלם בלי מילה.</li>
      <li><strong>ההפעלה הולכת לפי הנתיב שקבעתם.</strong> עקיפת נתיב קובץ
        ההפעלה בשורת RetroArch בהגדרות &gt; אמולטורים גוברת כעת על נתיב
        RetroArch שבראש אותו דף; בעבר התעלמו מהנתיב של השורה. לחיצה כפולה על
        עצור כבר לא מבקשת מהמשחק לצאת פעמיים; ב-Linux,‏ RetroArch מבין בקשה שנייה
        כ"צא בלי לשמור", כך שהשמירה שלכם בתוך המשחק הייתה יכולה ללכת לאיבוד.
        הגדרת מפעיל שנשארה ממצב מרוחק שמעולם לא נבנה כבר לא מונעת מכל משחק
        לעלות.</li>
      <li><strong>פעולות שנכשלות מדווחות על השגיאות שלהן כראוי.</strong> כששמירה,
        ייבוא, סנכרון או סריקה נכשלים, RetroDB עונה כעת עם סטטוס שגיאה אמיתי
        ומציג את הסיבה בהודעה שלו, במקום לענות כאילו הכול הצליח. שמירת קוד
        התחברות של PSN שלא מצליח להתחבר כבר לא מציגה פרטי שגיאה פנימיים.
        התחברות, ניהול משתמשים, הפרופיל שלכם, הישגים, ייבוא, מילוי AI וחיפושים
        ב-HowLongToBeat עושים כעת אותו דבר, ושפה שלא ניתן לשמור אומרת למה במקום
        "שגיאת רשת".</li>
      <li><strong>משחקים שנקראים בשיטת No-Intro עוברים כעת גירוד.</strong>
        כותרת כמו "Legend of Zelda, The" או "Legend of Zelda, The - Ocarina of
        Time" מתאימה כעת לתוצאות של "The Legend of Zelda" במקום להידחות במסנן
        ההתאמה. דוחות ROM גם מפסיקים לסמן שמות כאלה כאי-התאמות.</li>
      <li><strong>כותרות שנלקחו משמות קבצים מאבדות את כל התגיות שלהן.</strong>
        אזור משולב כמו "(USA, Europe)" וגם "(UK)" מוסרים כעת. במחשבים ביתיים
        כמו ZX Spectrum, כל מה שמהשנה והלאה נמחק, כך ש-"Chuckie Egg 2 (UK)
        (1985) (A'n'F Software) (tzx)" הופך ל-"Chuckie Egg 2". שם קובץ שמסתיים
        ב-"..zip" כבר לא משאיר נקודה מיותרת. חיפושים בגורדים, איפוס הנתונים של
        משחק והצעות של גרסאות אזוריות משתמשים בשמות הנקיים האלה.</li>
      <li><strong>כותרת שגויה כבר לא חוזרת על עצמה בגירוד מחדש.</strong> גירוד
        המוני מחפש כעת לפי השם מקובץ ה-ROM, לא לפי הכותרת השמורה למשחק. משחק
        שפעם הותאם למשחק הלא נכון מוצא את הנכון כשהוא מגורד שוב.</li>
      <li><strong>הגורדים מעדיפים את אזור ברירת המחדל שלכם.</strong> כששתי
        תוצאות שוות, זו מאזור ברירת המחדל שלכם או מ-World גוברת כעת, ולא תמיד
        זו של ארה"ב. שתי כותרות שהן רק תגיות אזור כבר לא נחשבות התאמה מושלמת.
        גרסאות אזוריות כבר לא מתבלבלות ומחשיבות את ה-X ב-"X-Men" כמספר של משחק
        המשך. הבחירה איזו גרסה הכרטיס מציג קוראת כעת רק את שם הקובץ של ה-ROM,
        לא את התיקיות שמעליו, ומבינה תגיות ישנות כמו "(U)" ו-"(E)".</li>
      <li><strong>היומן מראה לאן הולך זמן הגירוד של כל משחק.</strong> אחרי כל
        משחק, RetroDB רושם שורה אחת עם השניות שהושקעו בחיפוש, בכל מקור, בהורדה,
        בעיבוד תמונות, ב-AI ובשמירה. זהו הצעד הראשון לקראת גירודים מהירים
        יותר.</li>
      <li><strong>גירודים מסתיימים מהר יותר: תמונות קטנות מחודדות
        אחר כך.</strong> גירוד שומר כעת משחק עם התמונות שלו כפי שהורדו. עטיפות
        קטנות וצילומי מסך מוגדלים אחר כך ברקע, משחק אחד בכל פעם. צילומי מסך
        כפולים מושמטים לפני כל העבודה הזו. אם RetroDB נעצר באמצע, הוא ממשיך
        בהפעלה הבאה.</li>
      <li><strong>קראו את המדריך של משחק בדף שלו.</strong> כפתור מדריך פותח
        כעת את ה-PDF בחלון מעל דף המשחק. דפדפו בעזרת הקודם והבא, מקשי החצים,
        Home ו-End, או החלקה בטלפון; כל עמוד מתהפך כמו בספר, או פשוט מתחלף אם
        המערכת שלכם מבקשת פחות תנועה. "פתיחת PDF בכרטיסייה חדשה" עדיין שם,
        ו-Ctrl ולחיצה על מדריך פותחים את הכרטיסייה ישירות.</li>
      <li><strong>סרגל הצד מראה מתי תמונות עדיין משופרות.</strong> בזמן
        שתמונות מחודדות ברקע, בסרגל הצד כתוב "משפר תמונות — משחקים שנותרו: N".
        משחק שעדיין ממתין אומר זאת בדף שלו, והתמונות החדות יותר שלו מופיעות שם
        מעצמן כשהן מוכנות. מתג העטיפה 2D/3D כבר לא מסתיר את השורה הזו.</li>
      <li><strong>מקורות הגיבוי נשאלים בו-זמנית.</strong> כשהמקור הראשי
        משאיר פערים, RetroDB שואל כעת את כל המקורות האחרים בבת אחת במקום בזה
        אחר זה. התשובות שלהם עדיין משמשות לפי הסדר שבהגדרות שלכם, כך שאותו מקור
        גובר בכל שדה.</li>
      <li><strong>ES-DE קורא את רשימת המשחקים שלו פעם אחת.</strong> כל גירוד,
        כולל גירודים המוניים, קרא בעבר את gamelist.xml של ES-DE למערכת פעמיים
        לכל משחק. RetroDB קורא אותו כעת פעם אחת וקורא אותו שוב רק כשהקובץ
        משתנה.</li>
      <li><strong>"החל" בחפש מטא-נתונים כבר לא מחפש שוב.</strong> בדף משחק,
        התוצאות שסימנתם נשלפות ישירות מהמקור שלהן במקום שיחפשו אותן פעם שנייה.
        כששום דבר לא מסומן, רק המקור שהחלתם ו-AI ממלאים את הפערים.</li>
      <li><strong>ScreenScraper מוצא משחקים עם כותרת משנה.</strong> הוא לא מצא
        דבר עבור כותרת כמו "Alone in the Dark: The New Nightmare" אלא אם היה
        רווח לפני הנקודתיים. RetroDB מחפש אותה כעת כך, ואחר כך לפי החלק שלפני
        הנקודתיים אם עדיין לא נמצא דבר.</li>
      <li><strong>משחקים שאין בהם מה לשחק כבר לא מציעים שחק.</strong> למשחק
        שנוסף מייבוא של CLZ,‏ Steam,‏ Xbox או PSN אין קובץ ROM. הדף שלו לא מציג
        כעת כפתור שחק, הגדרות אמולטור או סעיף הפעלה כשעורכים אותו, בהתאם
        לכרטיסים בספרייה.</li>
      <li><strong>משחקי RetroArch מוגנים משתי הגדרות גרועות.</strong> RetroDB
        נותן כעת ל-RetroArch קובץ הגדרות קטן משלו בכל פעם שהוא מפעיל משחק, מעל
        ההגדרות שלכם. הוא מתאים את המקלדת לשולחן העבודה שלכם (Wayland או X11),
        כך שהמקלדת אף פעם לא מתה, ומאפשר להרצה המהירה לפעול במהירות מלאה, שבה
        משחקי Commodore 64 משתמשים כדי להיטען מהר. כל שאר הגדרות RetroArch
        שלכם לא נגעו בהן.</li>
      <li><strong>יצירת M3U משאירה את המשחק בספרייה שלכם.</strong> הפיכת
        ארכיון מרובה דיסקים לרשימת השמעה השאירה בעבר את המשחק מצביע על הארכיון,
        שכבר הועבר למקום אחר. המשחק מצביע כעת על רשימת ההשמעה החדשה ושומר את
        הפרטים והתמונות שלו. כשארכיון אחד מכיל כמה הוצאות של משחק, כל אחת עם
        סט דיסקים משלה, רשימת ההשמעה משתמשת כעת בדיסקים של ההוצאה הראשונה במקום
        בכולם, ואומרת אילו דיסקים היא השאירה בחוץ.</li>
      <li><strong>גירוד מלא מחדש יכול לשמור את המדיה שכבר יש לכם.</strong>
        סמנו את "שמירת המדיה הקיימת" לצד המתג גירוד מלא מחדש. פרטי הטקסט עדיין
        מתרעננים, אבל עטיפות, סרטונים ומדריכים שכבר בדיסק נשארים כמות שהם במקום
        לרדת שוב. בלי הסימון, גירוד מלא מחדש כבר לא משמיט צילומי מסך שהוריד
        קודם.</li>
      <li><strong>משימות ברקע כבר לא מאבדות עבודה או מדלגות עליה.</strong>
        רענון RetroAchievements שנתקל במשחק בעייתי אחד כבר לא זורק את המשחקים
        שכבר עדכן. סנכרון או רענון שחודשו כבר לא מדלגים על המשחק שבו הם עמדו
        כשנעצרו. סנכרון RetroAchievements או Steam שחודש מתמונת מצב ישנה מאוד
        נעצר כעת עם הודעה במקום לדווח על הצלחה בלי שסונכרן דבר. ההמרה ל-WebP
        בודקת קובץ WebP שנשאר מקודם לפני שהיא סומכת עליו, ולא תתחיל אם היא לא
        יכולה לקרוא את השטח הפנוי בדיסק.</li>
      <li><strong>שדרוג של התקנה ישנה מאוד כבר לא יכול לאבד נתונים
        בשקט.</strong> שלושה שלבי שדרוג ישנים של מסד הנתונים יכלו להשמיט שורות
        במצבים נדירים. כעת הם מעתיקים את השורות, או נעצרים עם שגיאה ברורה במקום
        לאבד אותן.</li>
      <li><strong>הכפתורים בחלון אודות כבר לא נחתכים.</strong> החלון רחב יותר
        וארבעת הכפתורים שלו יושבים בשתי שורות, כך שכל תווית מוצגת במלואה; בטלפון
        הם נערמים זה מעל זה.</li>
      <li><strong>ערכת הנושא שלכם עוברת איתכם לדפדפן חדש.</strong> התחברות
        בדפדפן שלא השתמשתם בו קודם מציגה כעת את ערכת הנושא השמורה שלכם. בעבר דף
        ההתחברות שמר קודם את Cyberpunk והיא נתקעה.</li>
      <li><strong>תיבת הסיסמה בהתחברות כבר לא אומרת "Admin Login".</strong>
        כל חשבון מתחבר עם סיסמה, ולכן החלון אומר כעת פשוט התחבר. דף החשבון ודף
        העזרה אומרים זאת גם כן.</li>
      <li><strong>העזרה מעודכנת בכל שפה.</strong> דפי העזרה המתורגמים מתארים
        כעת את הגרסאות האזוריות, אומרים שכל חשבון צריך סיסמה, ואומרים שערכת
        הנושא שלכם נשמרת עם החשבון. העזרה בכל שפה, כולל אנגלית, נותנת כעת את
        המינימום האמיתי של 12 תווים לסיסמה.</li>
      <li><strong>תיקונים קטנים:</strong> תמונת רקע ששם הקובץ שלה כולל גרש
        מוצגת כעת בדפי משחקים וגביעים; ההגדרות כבר לא מציגות שגיאת סקריפט
        לחשבונות שאינם מנהלים, וקוראי מסך שומעים כעת איזו לשונית בהגדרות
        נבחרה; עזיבת דף כבר לא ממלאת את מסוף הדפדפן בשגיאות של בקשות שבוטלו;
        מודל ההגדלה יורד קודם מכתובת שעובדת; ותוכנית ההתקנה כבר לא קורסת
        ב-Windows כשהפלט שלה נשמר לקובץ.</li>
      <li><strong>סבב רחב של תיקוני אמינות.</strong> שמירת משחק עם כותרת ריקה
        כבר לא מאבדת את העריכות האחרות שלכם. הפעלה מחדש נותנת כעת למשימות
        פעילות להיעצר בצורה נקייה קודם. יצירת M3U מסרבת לדרוס רשימת השמעה או
        תיקייה קיימות. ריקון רשימת הקבצים הלא רצויים בכלי ROM פירושו כעת "אל
        תמחק דבר", ושתי תבניות כבר לא תופסות שמות ROM אמיתיים כמו "Release of
        the Dragon". קובץ גביעים פגום אחד של PS3 כבר לא מרוקן את הגביעים של כל
        המשחקים. מילוי AI כותב אזור אחד. ניתוח נתונים סופר כל משחק פעם אחת
        בתרשים הדירוגים. ייבוא CLZ משתמש בשמות הז'אנרים הסטנדרטיים. בחלונות
        העריכה אפשר להסיר ז'אנר ותגיות אחרות בכל שפה, וקיצורי מקלדת כבר לא
        חוטפים את Ctrl+D או Ctrl+G. צופים רואים את סטטוס ההשלמה של משחק אבל כבר
        לא יכולים לשנות אותו, כי הוא משותף לכולם.</li>
      <li><strong>קוראי מסך מקריאים את המתג Platform Match Required בשמו
        הגלוי</strong> בהגדרות → גירוד.</li>
      <li>בשפות אחרות, ההגדרות מתרגמות כעת את "אזור ברירת מחדל", ולשונית
        הגירוד נקראת כשם ולא כ"גירוד מתבצע". דפי העזרה משתמשים באותן
        מילים.</li>
      <li><strong>משחק שלא נסגר כבר לא מוצג כסגור.</strong> אם אמולטור שורד
        את עצור, RetroDB ממשיך להציג אותו כפועל. הפעלת RetroArch שנדחית כבר לא
        כותבת קודם את קובץ ההגדרות שלה, ואמולטור שנכשל מיד מציג את הודעת
        השגיאה שלו כבר בבדיקה הראשונה.</li>
      <li>ספריות מעודכנות: Pillow 13 (טיפול בתמונות), numpy 2.5.4
        ו-onnxruntime 1.31 (הגדלה), וגם הגרסאות האחרונות של כלי הבנייה
        וההפצה.</li>
      <li>מאחורי הקלעים: קוד הפעלת המשחקים סודר כך שקל יותר לעקוב אחריו, קוד
        שלא היה בשימוש הוסר (כתובת API, פונקציית עזר של PSN, סקריפט גביעים
        ששום דף לא טען, והגדרת ערכת נושא כללית לאתר ששום דבר לא קרא), התשובות
        של האפליקציה לדפדפן נבנות במקום אחד, כמה מסמכי תכנון תוקנו כדי שיתאימו
        לקוד, חבילת הבדיקות סודרה, ובדיקה חדשה תופסת שגיאת תחביר של JavaScript
        לפני הפצה. רשומות יומן השינויים הישנות שתיארו את הקוד שהוסר אומרות זאת
        כעת.</li>
    </ul>
