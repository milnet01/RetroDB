  body: |
    <ul>
      <li><strong>RetroDB מתעדכן בעצמו.</strong> כשיוצאת גרסה חדשה, מנהלים
        רואים אותה בלוח הבקרה ובהגדרות &gt; מערכת &gt; עדכונים, יחד עם מה
        חדש. הורד עדכון מביא אותה ובודק שהיא בדיוק הקובץ שפורסם; התקן והפעל
        מחדש מגבה את מסד הנתונים שלכם, מציב את הגרסה החדשה במקומה ומפעיל
        מחדש. אם הגרסה החדשה לא עולה, RetroDB חוזר לגרסה הישנה בעצמו ומסביר
        למה. המשחקים, ההגדרות, התמונות והיומנים שלכם לא נפגעים. RetroDB בודק
        אם יש עדכונים פעם ביום; אפשר לכבות זאת. עותק שמופעל מ-git, או על ידי
        מנהל תהליכים, מקבל הודעה על עדכונים אבל לא מתעדכן.</li>
      <li><strong>קבלו את RetroArch מתוך RetroDB.</strong> בהגדרות &gt;
        אמולטורים יש מקטע חדש, שחק ב-RetroDB. לחצו על קבל את RetroArch
        ו-RetroDB יוריד את RetroArch הרשמי מ-libretro, יבדוק שההורדה היא
        בדיוק הקובץ הצפוי, ויגדיר אותו כ-RetroArch (RetroDB), עם הגדרות
        ושמירות משלו, בנפרד מכל RetroArch שאתם כבר משתמשים בו. לאחר מכן הוא
        מביא את הליבה הטובה ביותר לכל מערכת בפעם הראשונה שאתם משחקים. עובד
        ב-Linux וב-Windows; macOS עדיין לא נבדק.</li>
      <li><strong>הדיסק הבא עובד במשחקים שמשוחקים ב-RetroDB.</strong> במשחק
        מרובה דיסקים, הכפתור הדיסק הבא מגיע כעת ל-RetroArch של RetroDB עצמו
        בלי שום הגדרה. RetroArch מאזין לפקודות של RetroDB רק בזמן שמשחק כזה
        רץ, וב-Windows וב-macOS בזמן שכל משחק רץ.</li>
      <li><strong>כרטיסי המשחקים מסודרים בטלפון ואחרי שינוי גודל
        החלון.</strong> בטלפון, דפי הספרייה והקונסולות הציגו כרטיס אחד
        ואחריו רווח ריק וארוך; כעת הכרטיסים נערמים אחד מתחת לשני. הצרה או
        הרחבה של החלון מסדרת מחדש את הכרטיסים במקום להשאיר אותם בעמודות
        הישנות.</li>
      <li><strong>דירוגים ומספרי שחקנים שנגרדו מדויקים יותר.</strong> דירוגי
        גיל מ-IGDB עבור CERO, USK, GRAC, ClassInd ו-ACB נקראים כעת נכון, כך
        שמשחק שדורג CERO Z או USK 18 מקבל את הדירוג הזה. TheGamesDB, RAWG,
        IGDB ו-ES-DE כבר לא מנחשים "שחקן 1" כשהם לא יודעים; ייבוא מ-ES-DE
        כבר לא דורס מספר שחקנים או מצבי משחק שהגדרתם. TheGamesDB כבר לא שומר
        מספר במקום שם מפרסם או מפתח אחרי חיפוש שנכשל.</li>
      <li><strong>ScreenScraper שומר על הפרטים שלו כשהוא המקור
        הראשי.</strong> הכותרת, התיאור, התאריך, המפתח, המפרסם ומספר השחקנים
        שלו נשמרים בכל גירוד, ולא רק בדקות הראשונות אחרי חיפוש. סרטונים
        ומדריכים שהורדו מקבלים שם קובץ תקין.</li>
      <li><strong>ניקוי הנתונים שנגרדו מחזיר את שם הקובץ ככותרת.</strong>
        הוא ניקה את הפרטים אבל השאיר את הכותרת שנגרדה.</li>
      <li><strong>רענון RetroAchievements לקונסולה אחת עובד שוב.</strong>
        הוא נכשל עם שגיאה בכל פעם.</li>
      <li><strong>מאתר צילומי המסך הכפולים עובד באפליקציה שהורדה.</strong>
        הוא לא מצא שם אף צילום מסך, ומחיקת כפיל השאירה את הקובץ בדיסק.</li>
      <li><strong>סיסמאות ScreenScraper מוסתרות, והמנהל האחרון נשאר
        מנהל.</strong> ההגדרות מציגות כעת את סיסמאות ה-ScreenScraper שלכם
        מוסתרות, כמו שאר המפתחות שלכם. את חשבון המנהל היחיד כבר אי אפשר
        להפוך לעורך או להשבית, דבר שהיה משאיר את RetroDB בלי אף אחד שיכול
        לנהל אותו.</li>
      <li><strong>משימות שנקטעו מוצעות רק למי שמורשה להריץ אותן.</strong>
        הבאנר של משימה שנקטעה בלוח הבקרה מציג כעת משימה רק למי שמורשה להתחיל
        אותה, למשל גירוד המוני רק לעורכים ולמנהלים. חשבונות אחרים כבר לא
        רואים אותו ולא יכולים לסגור אותו.</li>
      <li><strong>לוגואי קונסולות מיובאים, שמות חריגים בהגדרות ודיסקי
        בונוס.</strong> באפליקציה שהורדה, רענון הלוגואים מוצא כעת את לוגואי
        הקונסולות שהובאו בייבוא מ-ES-DE, ומעדיף אותם על פני המובנים. שם של
        בקר, קונסולה או גיבוי עם תווים כמו &lt; או מירכאות כבר לא שובר את דף
        ההגדרות. ביטול הסימון של דיסק בונוס מנתק אותו לגמרי, כך שהוא כבר לא
        נספר כדיסק בונוס של המשחק הקודם שלו.</li>
      <li><strong>גביעים, ייבוא ספריות וכלי תחזוקה מהירים יותר.</strong> דף
        הגביעים, ייבוא הספריות מ-Steam, Xbox ו-PlayStation, גביעי האספנים,
        חישוב האחסון וסריקת המדיה שאינה בשימוש עושים כולם הרבה פחות עבודה
        בספרייה גדולה. חלונות ההתקדמות של משימות ממשיכים להתעדכן כשהשרת
        עמוס, ומשימות HowLongToBeat והכותרות החלופיות כבר לא מעכבות שינויים
        אחרים בזמן שהן רצות.</li>
      <li><strong>ראו כמה טוב כל משחק PS3 רץ ב-RPCS3.</strong> משחקי PS3
        בספרייה, בדף PlayStation 3 ובדף המשחק מציגים את מצב התאימות של
        RPCS3: ניתן לשחק, בתוך המשחק, פתיח, ניתן לטעינה או כלום, עם התאריך
        שבו נבדק לאחרונה. RetroDB קורא אותו מה-RPCS3 שבמחשב שלכם, אז ב-RPCS3
        בחרו Manage &gt; Databases &gt; Download Compatibility Database פעם
        אחת, ושוב בכל פעם שתרצו תוצאות חדשות יותר. מוצגים רק משחקים עם ROM
        בדיסק; משחקים מיובאים לא. RetroDB קורא כעת גם את מזהה המשחק של PSN
        ושל תיקיות משחק מותקנות, ושל תיקיות וקבצים שהשם שלהם כולל אותו, כמו
        [BLUS30443].</li>
      <li><strong>נתוני מכירות למשחקים שלכם.</strong> כשה-AI ממלא פערים
        במהלך גירוד, וכשאתם לוחצים על מילוי AI, הוא נשאל כעת גם כמה עותקים
        המשחק מכר בקונסולה שלו, לפי נתונים חופשיים שפורסמו כמו דוחות המפרסם,
        רשימות רבי-המכר של הפלטפורמה, Famitsu, Wikipedia ו-VGChartz. דף
        המשחק מציג את המספר. משחק בלי נתון שפורסם נשאר ריק במקום לקבל
        ניחוש.</li>
      <li><strong>המתג זכיין / סדרה עובד בדף המשחק.</strong> בחלון העריכה של
        דף המשחק, לחיצה על המתג זכיין / סדרה של משחק שסומן עצמאי לא עשתה
        כלום, כך שאי אפשר היה לשייך אותו לסדרה. כעת הוא מתחלף, וכך גם המתג
        זמינות בפלטפורמות.</li>
      <li><strong>כל לשוניות ההישגים באותו רוחב.</strong> RetroAchievements,
        RPCS3, PSN, Steam ו-Xbox קבעו כל אחד את רוחב הדף לפי הכרטיסים שלו,
        כך שהדף שינה רוחב כשעברתם בין הלשוניות. כעת יש להן רוחב משותף
        אחד.</li>
      <li><strong>RetroDB מוצא את ההגדרות של RPCS3 ב-Windows
        וב-macOS.</strong> ב-Windows, RPCS3 שומר את ההגדרות שלו ליד
        rpcs3.exe, ו-RetroDB מחפש כעת שם ובתיקייה ניידת, כך שההגדרות לכל
        משחק ורשימת התאימות נמצאות.</li>
      <li><strong>מילוי AI עובד במשחקים עם ציון אבל בלי דירוג גיל.</strong>
        מילוי AI עלול היה להיכשל עם שגיאה במשחק כזה בזמן שחישב את דירוג הגיל
        שלו.</li>
      <li><strong>תוויות כרטיסי המשחקים מוצגות בשפה שלכם.</strong> סטטוס
        ההשלמה ותיאורי הציונים בכרטיסי הספרייה היו תמיד באנגלית.</li>
      <li><strong>תאריכי השקה לכל אזור.</strong> כשה-AI ממלא פערים במהלך
        גירוד, וכשאתם לוחצים על מילוי AI, הוא נשאל כעת גם מתי המשחק יצא בכל
        אזור, כמו צפון אמריקה, אירופה ויפן. דף המשחק והתצוגה המהירה מציגים
        אותם, מהמוקדם ביותר, עם תאריכים ושמות אזורים בשפה שלכם. תאריך ההשקה
        של המשחק עצמו לא משתנה.</li>
      <li><strong>המשחק הקודם והבא בדף המשחק.</strong> ליד הנתיב בראש דף
        המשחק יש קישורי הקודם והבא, ואת המיקום של המשחק ברשימה. הם עוקבים
        אחרי הדף שממנו הגעתם: כשנפתח מהספרייה הם עוברים על הספרייה, וכשנפתח
        מדף קונסולה הם עוברים על הקונסולה הזו, באותו סדר ועם אותם מסננים
        וחיפוש שהיו לכם שם.</li>
      <li><strong>עטיפות וצילומי מסך שהעליתם מעובדים כמו אלה
        שנגרדו.</strong> עטיפה, קופסת תלת-ממד או צילום מסך שאתם מעלים בחלון
        העריכה נשמרים כעת באותו פורמט תמונה כמו תמונות שנגרדו, מוקטנים לאותו
        גודל, ועטיפות מקבלות את העותקים הקטנים שהספרייה משתמשת בהם. צילום
        מסך שנראה זהה לאחד שכבר יש למשחק לא נוסף, ואתם מקבלים הודעה כמה מהם
        הושמטו. העלאת עטיפה חדשה מסירה גם את הקובץ שהיא מחליפה.</li>
      <li><strong>RetroAchievements מוצג בדף המשחק לכל משחק שיש לו.</strong>
        לחלק מהמשחקים היה תג RA בספרייה אבל לא היה כרטיס RetroAchievements
        בדף שלהם, כמו Metroid Prime ו-Metroid Prime 2 ב-GameCube. הדף משתמש
        כעת באותו קישור RetroAchievements כמו התג, ונטען מהר יותר כי הוא כבר
        לא פונה ל-RetroAchievements בכל פעם.</li>
      <li><strong>מספר הלא-גרודים בדף המערכות תואם למסנן לא נגרד.</strong>
        הספירה כללה דיסקי בונוס, שרשימת המשחקים של הקונסולה אף פעם לא מציגה,
        כך שקונסולה יכלה להראות 2 לא נגרדו בזמן שהמסנן לא נגרד שלה לא הציג
        אף אחד.</li>
      <li><strong>דפי הספרייה והמערכות מתעדכנים בזמן אמת במהלך גירוד
        המוני.</strong> הכרטיס של כל משחק מתרענן ברגע שהוא נגרד, בין אם חלון
        הגירוד ההמוני פתוח, סגור או רץ ברקע.</li>
      <li><strong>מילוי AI נותן לכל משחק את שמו הרשמי.</strong> כשה-AI ממלא
        פערים, בגירוד של משחק בודד, בגירוד המוני ובכפתור מילוי AI, הוא גם
        נוקב בכותרת הרשמית של המשחק כפי שיצא באזור של ה-ROM שלו, והמשחק משנה
        את שמו אליה. השם הישן נשמר ככותרת חלופית. כותרת שהקלדתם בעצמכם או
        שקיבלתם בשמות רשמיים לעולם לא משתנה.</li>
      <li><strong>שמות רשמיים מציע שמות שוב.</strong> עם OpenAI, ולפעמים עם
        Gemini, לא ניתן היה לקרוא את התשובות של ה-AI, כך שהרצה הסתיימה בלי
        אף שם מוצע.</li>
      <li><strong>מקורות נבדקים רק עבור מערכות שהם מכסים.</strong> ב-RAWG
        אין משחקי Intellivision, כך שהוא כבר לא נבדק עבורם; קודם הוא מצא
        במקומם משחקים מפלטפורמות אחרות. IGDB, TheGamesDB ו-RAWG מחפשים כעת
        תמיד במערכת של המשחק עצמו. כמה קישורי פלטפורמה שגויים של RAWG תוקנו
        גם הם (Atari ST, ColecoVision, PC Engine, DOS).</li>
      <li><strong>טבעת התקדמות הגירוד כבר לא קופצת אחורה.</strong> אחרי יותר
        מחיפוש אחד בחלון חפש מטא-נתונים, לחיצה אחת על החל הפעילה את הגירוד
        כמה פעמים, והטבעת קפצה ביניהם.</li>
      <li><strong>עטיפת תלת-ממד מוגדלת בלי ריבוע מאחוריה.</strong> הקופסה
        יושבת ישירות על הרקע המעומעם.</li>
      <li><strong>הודעות כבר לא מציגות קוד HTML.</strong> חלק מחלונות האישור
        והתוצאות בכלי ROM הציגו תגים כמו &lt;br&gt; במקום מעברי שורה. מציג
        היומנים ובוחר משחק האב של דיסק בונוס בהגדרות עובדים שוב.</li>
    </ul>
