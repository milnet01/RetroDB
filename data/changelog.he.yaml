- version: 3.21.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: הפעלה בלחיצה אחת — הפעילו את RetroDB מסמל מוצמד, בלי טרמינל
  - type: feature
    label: סמל אפליקציה אמיתי — גיים־פד ניאון בלשונית הדפדפן ובשורת המשימות
  - type: feature
    label: כפתור חדש לכיבוי השרת בדף ההגדרות
  body: |
    <ul>
      <li><strong>הפעלה בלחיצה אחת.</strong> ל-RetroDB יש כעת משגר אמיתי שאפשר
        להצמיד לשורת המשימות &mdash; לחצו עליו והאפליקציה תתחיל (אם היא לא כבר
        פועלת) ותיפתח בדפדפן שלכם באופן אוטומטי. אין יותר צורך לפתוח טרמינל
        ולהקליד פקודה. ב-Linux, הריצו פעם אחת
        <code>python3 scripts/install_launcher.py</code> כדי להוסיף את
        &ldquo;RetroDB&rdquo; לתפריט האפליקציות שלכם, ואז הצמידו אותו.</li>
      <li><strong>סמל אפליקציה אמיתי.</strong> RetroDB עוטה כעת סמל של גיים־פד
        ניאון &mdash; ציאן ומגנטה בסגנון סייברפאנק על משבצת כהה &mdash; בלשונית
        הדפדפן (ה-favicon), במשגר שבשורת המשימות, ובתוכנית Windows עצמה. הוא מחליף
        את סמל האמוג&rsquo;י הפשוט ששימש כמציין מקום.</li>
      <li><strong>כפתור כיבוי השרת.</strong> באזור בקרות השרת שבדף ההגדרות יש כעת
        כפתור <strong>כיבוי השרת</strong> אדום ליד הפעלה מחדש. הוא עוצר את
        האפליקציה בצורה נקייה (ומאפשר לכל משימה שרצה לסיים תחילה את השמירה), כך
        שאין יותר צורך לעבור לטרמינל וללחוץ Ctrl+C.</li>
      <li><strong>גרסאות להורדה פותחות עבורכם את הדפדפן.</strong> הורדות ה-Windows,
        Mac ו-Linux המוכנות להפעלה פותחות כעת את הדפדפן שלכם רגע לאחר ההפעלה, כך
        שהאפליקציה מולכם ללא שום צעד נוסף.</li>
    </ul>
- version: 3.20.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: אחת עשרה שפות חדשות — RetroDB מדבר כעת ב-21 שפות
  body: |
    <ul>
      <li><strong>אחת עשרה חבילות שפה חדשות.</strong> הממשק של RetroDB, הערות
        ההפצה, ומדריך העזרה מתורגמים כעת ל-<strong>Afrikaans, isiZulu, isiXhosa,
        Dutch, Norwegian (Bokm&aring;l), Russian, Polish, Turkish, Ukrainian,
        Indonesian, ו-Hebrew</strong> &mdash; ומצטרפים ל-German, Spanish,
        French, Italian, Japanese, Korean, Brazilian Portuguese, ו-Simplified
        &amp; Traditional Chinese הקיימים. בחרו את שלכם תחת Settings &rarr;
        Display Preferences &rarr; Language; האפליקציה נטענת מחדש בשפה
        שבחרתם.</li>
      <li>כל שפה מכסה את כל האפליקציה: כל כפתור, תווית והודעה, כל היסטוריית הערות
        ההפצה, ומדריך העזרה המלא.</li>
      <li><strong>isiZulu &amp; isiXhosa</strong> כלולות אף הן. כשפות עם מעט
        אוצר מילים תוכנתי קיים, הן שומרות על מונחים טכניים נפוצים (ROM, scraper,
        box art) באנגלית היכן שאין מילה טבעית &mdash; הגהה של דובר שפת אם
        מתקבלת בברכה לפני שתסתמכו עליהן.</li>
      <li><strong>Hebrew</strong> מגיעה עם טקסט מתורגם במלואו; פריסת עמוד
        מלוטשת מימין-לשמאל (כך שהממשק ישקף כראוי) תגיע בעדכון מאוחר יותר.
        Arabic תבוא בעקבותיה ברגע שעבודת הפריסה הזו תושלם.</li>
    </ul>
- version: 3.19.1
  date: '2026-07-05'
  tags:
  - type: performance
    label: גירוד מהיר יותר — צילומי המסך של משחק יורדים כעת בו-זמנית
  body: |
    <ul>
      <li><strong>צילומי המסך יורדים במקביל.</strong> בעקבות אותה גישה של
        ה-frontend הפופולרי ES-DE (שמושך את כל המדיה של משחק בבת אחת), RetroDB
        מוריד כעת את צילומי המסך של משחק <strong>בו-זמנית</strong> במקום זה אחר
        זה, עבור כל המקורות (TheGamesDB, IGDB, RAWG, ScreenScraper). משחקים עם
        כמה צילומי מסך מסתיימים מהר יותר באופן ניכר.</li>
      <li>בדיקת צילומי המסך הכפולים עדיין רצה לאחר מכן לפי הסדר, כך שהסרת
        הכפילויות בתמונות נשארת מדויקת בדיוק כמו קודם &mdash; רק ההורדה הואצה.
        ההורדות מוגבלות לארבע בכל פעם כך שמקור בודד לעולם לא ייעמס יתר על
        המידה.</li>
      <li>שיפור מהירות מאחורי הקלעים; נכנס לתוקף לאחר ההפעלה מחדש הבאה.</li>
    </ul>
- version: 3.19.0
  date: '2026-07-05'
  tags:
  - type: performance
    label: גירוד מהיר יותר — המקורות נשאלים כעת בו-זמנית
  body: |
    <ul>
      <li><strong>הגירוד מהיר יותר לכל משחק.</strong> כאשר RetroDB מחפש משחק,
        הוא בודק כמה מסדי נתונים (ES-DE, TheGamesDB, IGDB, RAWG, ScreenScraper).
        בעבר הוא שאל אותם <em>אחד אחרי השני</em> והמתין לתשובה מכל אחד לפני
        שפנה לבא &mdash; כך שההמתנה הייתה סכום של כולם. כעת הוא שואל את כולם
        <strong>בבת אחת</strong> וממתין רק לאיטי ביותר, וזהו זירוז ניכר בכל
        משחק. התוצאות עדיין ממוינות ומדורגות בדיוק כמו קודם.</li>
      <li><strong>פחות לחיצות יד מבוזבזות בהורדת עטיפות.</strong> הורדות התמונות
        מנצלות כעת מחדש חיבור שכבר פתוח במקום לפתוח חדש לכל תמונה בודדת, וכך
        נחסך זמן במשחקים עם הרבה צילומי מסך.</li>
      <li>אלו שיפורי מהירות מאחורי הקלעים &mdash; שום דבר לא משתנה באופן שבו
        אתם משתמשים ב-RetroDB, וזה לא מעמיס יותר על מסדי הנתונים (אותן בקשות,
        פשוט חופפות). נכנסים לתוקף לאחר ההפעלה מחדש הבאה.</li>
    </ul>
- version: 3.18.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: נוספו דירוגי גיל סיניים (סין) כמערכת הדירוג התשיעית
  body: |
    <ul>
      <li><strong>מערכת דירוג גיל חדשה: סין (CADPA).</strong> RetroDB תומך כעת
        בתוכנית הרשמית הסינית להמלצת גיל למשחקים (&ldquo;网络游戏适龄提示&rdquo;,
        שהונפקה על ידי CADPA) לצד שמונה הגופים הקיימים (ESRB, PEGI, CERO,
        USK, ACB, FPB, GRAC ו-ClassInd). היא משתמשת בשלוש רמות &mdash;
        <strong>8+</strong>, <strong>12+</strong> ו-<strong>16+</strong>
        &mdash; המוצגות עם תג ירוק פשוט.</li>
      <li><strong>היא ממלאת את עצמה, כמו האחרות.</strong> כאשר למשחק כבר יש
        דירוג מכל מדינה אחרת, RetroDB מחשב את רמת סין המתאימה באופן אוטומטי
        (ולהפך). ניתן גם לבחור או לשנות אותה ידנית במסך העריכה של משחק, ולבחור
        אותה כמערכת התצוגה המועדפת שלכם תחת הגדרות &rarr; ספרייה. הערה: רוב
        מסדי הנתונים המערביים של משחקים אינם מפרסמים דירוג סיני, ולכן עבור
        משחקים ללא דירוג בכלל היא ממולאת מתוכן המשחק במהלך הגירוד / AI Fill.</li>
      <li>התגים הירוקים הם איור פשוט משל RetroDB (התואם את הסגנון הביתי של
        הגופים האחרים), ולא הלוגו הרשמי של CADPA, כך שאין שום מגבלות רישוי
        תמונה.</li>
    </ul>
- version: 3.17.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: ניקוי רשומות מסד הנתונים עבור קובצי מדיה שחסרים מהדיסק
  - type: security
    label: הגנה מפני מחיקת כל העטיפות של הספרייה שלכם כאשר תיקיית מדיה נעלמת
  body: |
    <ul>
      <li><strong>כלי תחזוקה חדש: &ldquo;הפניות מדיה חסרות&rdquo;</strong>
        (הגדרות &rarr; מערכת &rarr; תחזוקה). זוהי תמונת הראי של ניקוי
        &ldquo;מדיה יתומה&rdquo; הקיים: במקום למצוא קובצי תמונה שנותרו ללא
        משחק, הוא מוצא משחקים שעטיפת הקופסה, עטיפת הקופסה התלת-ממדית, צילומי
        המסך, ה-fanart, הווידאו או המדריך שלהם מפנים לקבצים שכבר אינם על
        הדיסק. סרקו אותם, ואז נקו את ההפניות המיושנות הללו בלחיצה אחת כדי
        שהגורדים יוכלו להוריד מחדש את העטיפות. רשומות המשחקים עצמן לעולם אינן
        נוגעות.</li>
      <li><strong>ניקוי אוטומטי בטוח יותר במהלך הגירוד.</strong> כאשר RetroDB
        גורד מחדש משחק הוא מנקה בשקט הפניות לקובצי מדיה שנעלמו מהדיסק. בעבר,
        אם תיקיית מדיה שלמה נעלמה בבת אחת &mdash; כונן חיצוני שלא הותקן, או
        מחיקה המונית &mdash; ניקוי זה עלול היה למחוק את הרשומה של אילו עטיפות
        היו לאלפי משחקים, ולאלץ גירודים מחדש יקרים. RetroDB מזהה כעת אות זה:
        אם תיקיית מדיה חסרה או ריקה לחלוטין, הוא שומר על ההפניות ורושם אזהרה
        ביומן במקום למחוק אותן. כלי התחזוקה החדש מיישם את אותה הגנה ומסמן
        בבירור כל תיקייה שהוא עצר.</li>
    </ul>
- version: 3.16.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: לוח "תיקונים מהירים" חדש בלוח המחוונים
  body: |
    <ul>
      <li><strong>לוח &ldquo;תיקונים מהירים&rdquo; חדש בלוח המחוונים</strong>
        הופך מטלות ספרייה מפוזרות לרשימת מטלות במבט אחד. הוא מציג לכמה משחקים
        עדיין חסרה עטיפת קופסה, ומספק קיצורי דרך בלחיצה אחת למציאת ROM-ים
        כפולים ולבדיקת נתיבי ROM שבורים (משחקים שהקבצים שלהם הועברו או נמחקו).
        כל קיצור דרך מקשר ישירות אל הדף שמתקן אותו. הלוח מופיע ברגע שיש לכם
        משחקים בספרייה.</li>
    </ul>
- version: 3.15.0
  date: '2026-07-03'
  tags:
  - type: accessibility
    label: קוראי מסך מכריזים כעת בקול על התקדמות המשימות
  body: |
    <ul>
      <li><strong>משימות ארוכות טווח מדווחות כעת על התקדמותן לקוראי
        מסך.</strong> כאשר גירוד המוני, סנכרון הישגים (RetroAchievements או
        PlayStation), או שינוי גודל תמונה רצים, משתמשי קוראי מסך היו רגילים
        לא לשמוע דבר בין &ldquo;התחיל&rdquo; ל&ldquo;הסתיים&rdquo;. RetroDB
        מכריז כעת על אבני דרך תקופתיות (לדוגמה &ldquo;גירוד המוני: 12 מתוך
        40&rdquo;) ועל השלמה מדוברת &mdash; ללא חלוניות קופצות נוספות על המסך.
        ההכרזות מקוצבות כך שהן מיידעות מבלי לפטפט, והן עוקבות אחר השפה
        שבחרתם.</li>
    </ul>
- version: 3.14.0
  date: '2026-07-01'
  tags:
  - type: feature
    label: שפות חדשות — סינית (מפושטת ומסורתית) זמינה כעת
  body: |
    <ul>
      <li><strong>RetroDB זמין כעת בסינית.</strong> שתי אפשרויות נמצאות תחת
        <strong>הגדרות &rarr; מערכת &rarr; שפה</strong>: <strong>中文
        (简体)</strong> (מפושטת, עבור סין היבשתית) ו-<strong>中文
        (繁體)</strong> (מסורתית, עבור הונג קונג וטייוואן). כל הממשק &mdash;
        תפריטים, כפתורים, הודעות, ומדריך העזרה שבתוך האפליקציה &mdash; מתורגם,
        וכל דבר שעדיין לא תורגם חוזר בשקט לאנגלית. זה מביא את השפות הנתמכות
        לעשר (אנגלית, גרמנית, ספרדית, צרפתית, איטלקית, יפנית, פורטוגזית
        ברזילאית, קוריאנית, וכעת סינית מפושטת ומסורתית).</li>
    </ul>
- version: 3.12.0
  date: '2026-06-30'
  tags:
  - type: feature
    label: שפה חדשה — קוריאנית (한국어) זמינה כעת
  body: |
    <ul>
      <li><strong>RetroDB זמין כעת בקוריאנית (한국어).</strong> בחרו אותה תחת
        הגדרות &rarr; מערכת &rarr; שפה. כל הממשק &mdash; תפריטים, כפתורים,
        הודעות, ומדריך העזרה שבתוך האפליקציה &mdash; מתורגם, ומביא את השפות
        הנתמכות לשמונה (אנגלית, גרמנית, ספרדית, צרפתית, איטלקית, יפנית,
        פורטוגזית ברזילאית, וקוריאנית). קוריאנית משלימה את הכיסוי לכל גוף
        דירוג גיל למשחקים ש-RetroDB מציג, כולל ה-GRAC של דרום קוריאה.</li>
    </ul>
- version: 3.11.0
  date: '2026-06-30'
  tags:
  - type: enhancement
    label: תמכו ב-RetroDB ב-Patreon — נוסף קישור תרומה חדש
  body: |
    <ul>
      <li><strong>כעת ניתן לתמוך ב-RetroDB ב-Patreon.</strong> קישור Patreon
        נמצא לצד כפתור &ldquo;Sponsor on GitHub&rdquo; הקיים תחת
        <strong>הגדרות &rarr; מערכת &rarr; תמיכה בפיתוח</strong>, בלוח האודות,
        וב-README של הפרויקט. RetroDB נשאר חינמי לחלוטין וקוד פתוח &mdash;
        תרומות הן אופציונליות לגמרי ופשוט עוזרות לשמור על המשך הפיתוח
        היחידני.</li>
    </ul>
- version: 3.10.0
  date: '2026-06-26'
  tags:
  - type: enhancement
    label: יומן השינויים נטען כעת מהר יותר עם כפתור "טען עוד"
  body: |
    <ul>
      <li><strong>דף יומן השינויים נפתח כעת הרבה יותר מהר.</strong> במקום לצייר
        את כל היסטוריית הגרסאות (מאות רשומות) בכל פעם שאתם פותחים אותו, RetroDB
        מציג כעת את 20 הרשומות האחרונות ומוסיף כפתור <strong>טען עוד</strong>
        בתחתית. לחצו עליו כדי לחשוף את האצווה הבאה, וכן הלאה &mdash; ההיסטוריה
        הישנה עדיין שם במלואה, היא פשוט נטענת לפי דרישה במקום להאט את התצוגה
        הראשונה.</li>
    </ul>
- version: 3.9.0
  date: '2026-06-17'
  tags:
  - type: feature
    label: מדריך העזרה והערות ההפצה האחרונות מתורגמים כעת לכל 6 השפות
  body: |
    <ul>
      <li><strong>מדריך העזרה המלא שבתוך האפליקציה זמין כעת בכל שש
        השפות</strong> &mdash; גרמנית, צרפתית, ספרדית, איטלקית, יפנית
        ופורטוגזית ברזילאית &mdash; לא רק באנגלית. RetroDB מציג את המדריך
        בשפה שבחרתם בהגדרות, וחוזר בשקט לאנגלית אם משהו עדיין לא תורגם.</li>
      <li><strong>יומן שינויים זה מופיע כעת גם בשפה שלכם</strong> עבור ההפצות
        האחרונות ביותר, וההפצות החדשות יתורגמו מכאן והלאה. היסטוריה ישנה
        נשארת באנגלית.</li>
      <li><strong>דף רשימת המשאלות והשאריות האחרונות של טקסט אנגלי</strong>
        &mdash; אצווה של הודעות שגיאה וסטטוס קופצות שהוחמצו כאשר חבילות השפה
        נחתו לראשונה ב-3.8.0 &mdash; מתורגמים כעת כראוי ברחבי האפליקציה.</li>
    </ul>
- version: 3.8.2
  date: '2026-06-17'
  tags:
  - type: security
    label: עדכון תלות אבטחה + תיקוני CI
  body: |
    <ul>
      <li><strong>אבטחה:</strong> עודכנה ספריית <code>cryptography</code>
        הכלולה (47 → 49) כדי לנקות התראה שפורסמה (GHSA-537c-gmf6-5ccf).
        אין שינוי בהתנהגות — פשוט גרסה בטוחה יותר.</li>
      <li>תוקן צינור הבדיקות האוטומטי: עוזר לבדיקה בלבד שחסר
        (<code>beautifulsoup4</code>) הכשיל את הרצת הבדיקות מאז v3.7.0,
        וסקריפט בניית האריזה החדש הפעיל בדיקת ניתוח סטטי שהיא תוצאה
        חיובית-כוזבת ידועה (הוא מריץ פקודות בנייה מהימנות, לא קלט משתמש)
        — כעת מתועד ומכויל. תחזוקה בלבד; שום דבר לא משתנה באפליקציה
        עצמה.</li>
    </ul>
- version: 3.8.1
  date: '2026-06-17'
  tags:
  - type: improvement
    label: אפשרות הורדה קטנה יותר, סידור תרומות ותיקון תרגום (Pass 46.3 / 47.6)
  body: |
    <ul>
      <li><strong>הורדה קטנה בהרבה בדרך.</strong> את גרסת ה&ldquo;פשוט לחלץ
        ולהקליק פעמיים&rdquo; המוכנה-להרצה של RetroDB ניתן כעת לבנות בגרסת
        <strong>מעבד-בלבד</strong> (~600&nbsp;MB) עבור אנשים שאין להם כרטיס
        מסך של AMD &mdash; בערך שישית מגודל הגרסה המלאה. שתיהן יוצעו זו לצד
        זו כדי שתוכלו לבחור את זו שמתאימה למחשב שלכם.</li>
      <li><strong>לוח &ldquo;תמיכה בפיתוח&rdquo; בהגדרות מתורגם כעת</strong>
        יחד עם שאר האפליקציה &mdash; הוא נשאר בטעות באנגלית כאשר חבילות השפה
        נחתו ב-3.8.0.</li>
      <li>סודרו קישורי התרומה (תג GitHub Sponsors ב-README; קובץ המימון מוכן
        ל-Patreon ול-Buy&nbsp;Me&nbsp;A&nbsp;Coffee ברגע שאלה יוגדרו). ללא
        מסכי נדנוד, לעולם.</li>
      <li>מאחורי הקלעים: צינור ההפצה יכול כעת לבנות את הגרסאות המוכנות-להרצה
        עבור Windows, macOS ו-Linux באופן אוטומטי. הערה: מדריך ה<em>עזרה</em>
        הארוך שבתוך האפליקציה עדיין באנגלית בלבד לעת עתה &mdash; זה רשום
        כעבודה עתידית.</li>
    </ul>
- version: 3.8.0
  date: '2026-06-12'
  tags:
  - type: feature
    label: תרגום ממשק מלא + 6 שפות (Pass 43.2/43.3/43.5)
  body: |
    <ul>
      <li><strong>RetroDB מדבר כעת ב-6 שפות נוספות.</strong> בהתבסס על התשתית
        מ-3.7.0, כל הממשק הפך לניתן-לתרגום ותורגם מכונה ל<strong>גרמנית,
        צרפתית, ספרדית, איטלקית, יפנית ופורטוגזית ברזילאית</strong>. בחרו את
        השפה שלכם תחת הגדרות &rarr; העדפות תצוגה &rarr; שפה; היא עוקבת אחר
        ההעדפה השמורה שלכם, אחר כך אחר הדפדפן שלכם, ואז חוזרת לאנגלית &mdash;
        היא לעולם לא יכולה להיתקע על שפה חסרה.</li>
      <li><strong>כל דבר שעל המסך מכוסה</strong>: טקסט הדף וכפתורים, הודעות
        קופצות (התראות ה&ldquo;טוסט&rdquo; הקטנות), חלוניות העריכה וההגדרות,
        טיפים, ותוויות קוראי מסך. ז'אנרים של משחקים, נקודות מבט ומצבי משחק
        (למשל &ldquo;First-Person-Shooter&rdquo;) מוצגים כעת גם בשפה שלכם
        &mdash; בעוד הנתונים הבסיסיים נשארים באנגלית כך שהספרייה והמסננים
        שלכם ממשיכים לעבוד בדיוק כמו קודם.</li>
      <li><strong>שפת &ldquo;פסאודו&rdquo; מובנית</strong> (הנראית בתפריט השפה)
        היא כלי בקרת איכות של מתרגם שמקיף בסוגריים ומדגיש כל תווית, וכך הופך
        למובן מיד אם טקסט כלשהו הוחמץ.</li>
      <li>תרגומי מכונה הם נקודת התחלה ועשויים להיקרא מעט נוקשים במקומות מסוימים
        &mdash; קל לחדד אותם עם הזמן, וכל טקסט ללא תרגום פשוט מוצג
        באנגלית.</li>
    </ul>
