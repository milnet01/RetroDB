    label: השמות הנוספים של משחק מראים מאיזה אזור הם מגיעים
  body: |
    <ul>
      <li><strong>השמות הנוספים של משחק מראים מאיזה אזור הם
        מגיעים.</strong> הכרטיס שמות נוספים בדף המשחק מתייג כל שם במדינה או
        באזור שלו, כמו יפן עבור "Rockman", בשפה שלכם. שמות מתויגים מופיעים
        ראשונים, מקובצים לפי אזור. רחפו מעל שם כדי לראות את המקור שלו וכל הערה,
        כמו "Working title".</li>
      <li>שמות מ-IGDB שומרים כעת על האזור שלהם. בעבר רק לשמות מ-ScreenScraper
        היה אזור.</li>
      <li>התווית "SS" של ScreenScraper כבר לא מוצגת כאזור. זה השם של
        ScreenScraper עצמו למשחק, לא מקום.</li>
      <li>כלי ROM → מלא כותרות חלופיות בודק כעת כל משחק שגורד, כך ששמות שכבר
        יש לכם מקבלים את האזורים שלהם. הריצו אותו פעם אחת כדי לתייג את הספרייה
        הקיימת שלכם.</li>
    </ul>
- version: 3.28.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: הפנו את RetroDB לתיקיית האמולטורים שלכם והוא יגדיר אותם
  - type: fix
    label: תיקונים בדף הגדרות → אמולטורים
  body: |
    <ul>
      <li><strong>הפנו את RetroDB לתיקיית האמולטורים שלכם והוא יגדיר
        אותם.</strong> בהגדרות → אמולטורים יש רשימה חדשה בשם תיקיות אמולטורים.
        הוסיפו את התיקייה שבה האמולטורים שלכם נמצאים, ו-RetroDB ימצא בה כל אחד
        מהם, כ-AppImage, כסקריפט נייד או כ-Flatpak מותקן, ויקשר אותו למערכות
        שהוא מריץ. מערכת שכבר יש לה אמולטור תקין שומרת עליו.</li>
      <li><strong>ראו אילו מערכות מוכנות למשחק.</strong> טבלת המיפוי לפי
        מערכת מפרטת כעת את האמולטורים של כל מערכת, אומרת אם כל אחד מהם עובד,
        ומאפשרת לבחור את ברירת המחדל של מערכת. עבור DuckStation,‏ PCSX2,‏ RPCS3
        ו-RetroArch היא גם אומרת אם קובצי ה-BIOS במקומם, ומציינת את אלה
        שחסרים. RetroDB רק קורא קובצי BIOS; הוא אף פעם לא מעתיק או מוריד
        אותם.</li>
      <li>סריקת האמולטורים מוצאת כעת כל אמולטור בכונן אמולטורים גדול. בעבר
        היא יכלה לעצור מוקדם בתוך תיקיית ההגדרות של אמולטור עצמו.</li>
      <li>הכפתורים זיהוי אוטומטי ושמור של RetroArch עובדים שוב, וחלון עריכת
        האמולטור כבר לא מוצג בדף עד שלוחצים על ערוך.</li>
    </ul>
- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: החלת מטא-נתונים מראה כמה ממנה הושלם
  body: |
    <ul>
      <li><strong>החלת מטא-נתונים מראה כמה ממנה הושלם.</strong> כשבוחרים תוצאה
        בחלון חפש מטא-נתונים, טבעת מתמלאת מ-0 עד 100% והאחוז מוצג במרכזה,
        והשורה שמתחתיה מתארת מה קורה: באיזה אתר מתבצע חיפוש, איזו תמונה או
        איזה סרטון יורדים, או שהתמונות בעיבוד. הורדה גדולה, כמו סרטון, מקדמת
        את הטבעת בזמן שהיא מגיעה. ב-100% הדף נטען מחדש עם התוצאה, כמו
        קודם.</li>
      <li>הטבעת עשויה להתקדם באופן לא אחיד. כל מקור מחליט כמה תמונות לשלוח רק
        כשהוא עונה, ולכן המקור הראשון עם תמונות רבות יכול למלא חלק גדול
        מהטבעת, והמקורות הבאים פחות.</li>
      <li>אם ההחלה נכשלת, הטבעת נסגרת והודעה מציינת זאת, בלי לטעון את הדף
        מחדש.</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: כל דף מתאים את עצמו כעת לחלון שבו הוא מוצג
  - type: enhancement
    label: דף המשחק מציג שמות נוספים בכרטיס משלהם, וכפתור מדריך
  body: |
    <ul>
      <li><strong>כל דף מתאים את עצמו כעת לחלון שבו הוא מוצג.</strong> דפי
        כרטיסים (מערכות, מוזיאון, תגיות, רשימות, כלי ROM, גביעים והישגים)
        מוסיפים עמודה בכל פעם שנכנס עוד כרטיס שלם, עד ארבעה בשורה. טבלאות,
        כלים ודפי פרטים מתרחבים מעט, אך נעצרים במקום שבו הרחבה רק הייתה
        מרחיקה את העמודות זו מזו. בדף ההגדרות התיבות נשארות ברוחב נוח
        לקריאה.</li>
      <li><strong>העזרה ויומן השינויים שומרים על אורך שורה נוח.</strong>
        בחלון רחב, קישורי הסעיפים של העזרה עוברים לעמודה לצד הטקסט; בחלון צר
        הם מופיעים בשורה אחת שאפשר להחליק, במקום גוש שכיסה חלק גדול ממסך
        הטלפון.</li>
      <li><strong>דף המשחק:</strong> בחלון רחב צילומי המסך נפרשים לאורך החלק
        העליון, ומתחתם, בגובה העטיפה, הווידאו וכרטיס חדש בשם <strong>ידוע גם
        כ:</strong> זה לצד זה. השמות הנוספים היו טקסט חיוור מתחת לכותרת; כעת הם
        מופיעים בכרטיס שקל לקרוא. <strong>מדריך</strong> הוא כפתור לצד שחק,
        והיסטוריית הגירוד מוצגת מקופלת בהתחלה.</li>
      <li>דף גביעי PSN מציג בין עמודה אחת לארבע עמודות לפי גודל החלון, במקום
        תמיד שלוש.</li>
      <li>כמה דפים כבר לא נגללים הצידה בטלפון: גביעים, גביעי אספן, דף המערכת
        של RetroAchievements, עזרה, הגדרות, ניתוח נתונים, ייבוא משחקים ודפי
        הפרטים של הישגים וגביעים. טבלאות רחבות נגללות שם כעת בתוך עצמן.</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: דפי הספרייה, המערכות והמשחקים מתאימים את עצמם כעת לחלון שבו הם מוצגים
  body: |
    <ul>
      <li><strong>הדפים מנצלים חלון רחב כשזה עוזר, ורק אז.</strong> הספרייה
        וכל דף מערכת מוסיפים עמודה של כרטיסי משחקים בכל פעם שנכנס עוד כרטיס
        שלם, עד ארבעה בשורה. טלפון מציג אחד, חלון בחצי מסך שניים או שלושה,
        וחלון רחב ארבעה. בעבר הדפים נעצרו ברוחב קבוע והשאירו את רוב החלון הגדול
        ריק.</li>
      <li><strong>דף המשחק מציב את העטיפה והפרטים לצד צילומי המסך
        והווידאו</strong> כשיש מקום לשניהם זה לצד זה, ואחרת מציג אותם זה מתחת
        לזה. התיאור שומר על אורך שורה נוח.</li>
      <li><strong>כפתור שחק עבר לפינה הימנית העליונה של כל כרטיס,</strong>
        קטן יותר וממורכז. הוא גם בודק כעת שקובץ ה-ROM של המשחק עדיין קיים ושהוא
        מסוג שהמערכת שלו מקבלת, כך שהוא מופיע רק במקום שבו לחיצה עליו אכן
        תפעיל את המשחק. הוא מוסתר בזמן שאתם בוחרים משחקים לפעולה המונית.</li>
      <li>כפתור החזרה למעלה וחלונות ההתקדמות הקופצים מופיעים כעת ממש לצד תוכן
        הדף, במקום בקצוות הרחוקים של החלון.</li>
      <li>דף המשחק כבר לא נגלל הצידה בטלפון.</li>
    </ul>
- version: 3.24.2
