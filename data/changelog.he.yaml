  body: |
    <ul>
      <li><strong>חיפוש כל משחק או קונסולה מכל דף.</strong> תיבת חיפוש
        נמצאת כעת מתחת לשם שלכם בסרגל הצד. הקלידו שתי אותיות או יותר כדי
        לראות קונסולות תואמות ועד שמונה משחקים תואמים, כל אחד עם הקונסולה
        שלו. לחצו על אחד, או בחרו אותו במקשי החיצים ולחצו Enter, כדי לפתוח
        אותו. "הצג את כל התוצאות" פותח את הספרייה עם החיפוש הזה. לחצו / כדי
        לקפוץ לתיבה כשלדף אין תיבת חיפוש משלו.</li>
      <li><strong>קל יותר להתנייד בטלפון או בטאבלט.</strong> במסך צר, סרגל
        לאורך החלק העליון מכיל את כפתור התפריט וכפתור חיפוש שפותח את התפריט
        כשהסמן כבר בתיבת החיפוש. סרגל לאורך החלק התחתון מביא אתכם ללוח
        הבקרה, לספרייה, למערכות ולהישגים בנגיעה אחת. התפריט כעת אטום, כך
        שהדף כבר לא נראה דרכו. געו מחוץ לו או לחצו Escape כדי לסגור אותו.
        בחלונות בגודל טאבלט כפתור התפריט היה חסר, כך שלא היה אפשר לפתוח את
        התפריט בכלל; כעת הוא שם. סרגלי לשוניות ומסננים שנשארים על המסך בזמן
        גלילה נעצרים ממש מתחת לסרגל העליון, ולא מאחוריו.</li>
      <li><strong>הגדרות &gt; אמולטורים מתאים לטלפון.</strong> הטבלאות שלו
        היו רחבות מהטלפון, כך שהכפתורים ערוך והגדרות היו מחוץ למסך. בטלפון
        כל שורה היא כעת כרטיס עם הכפתורים שלה בתוכו.</li>
      <li><strong>ניקוי התמונות של משחק כבר לא משאיר קבצים
        תועים.</strong> אם ניקיתם את התמונות של משחק בזמן ש-RetroDB עדיין
        חידד אותן ברקע, הוא היה עלול לכתוב אותן בחזרה כקבצים שאף משחק לא
        משתמש בהם. כעת הוא בודק קודם ומדלג עליהן. גם המונה "משפר תמונות"
        מוריד מיד את המשחק שנוקה.</li>
      <li><strong>כותרות שהקלדתם נשמרות בזמן גירוד.</strong> גירוד, אפילו
        גירוד מלא מחדש, היה מחליף כותרת שהקלדתם בחלון העריכה בשם מהמגרד. כעת
        כותרת ששיניתם נשמרת. תיבה חדשה, "שמור כותרת זו בזמן גירוד", מתחת
        לכותרת מראה זאת; בטלו את הסימון כדי לאפשר למגרדים לשנות שוב את שם
        המשחק. גם אפס בדף המשחק מאפשר להם.</li>
      <li><strong>שמות רשמיים למשחקים שלכם, שאתם בודקים.</strong> לכלי ROM
        נוסף דף חדש, שמות רשמיים. לחצו "שאל את ה-AI" עבור מערכת אחת או עבור
        כולן, וה-AI מציע לכל משחק את השם הרשמי המלא שלו כפי שיצא באזור של
        ה-ROM שלו, כך ש-ROM יפני של Mega Man הופך ל-Rockman. אתם רואים כל שם
        ישן וחדש זה לצד זה, מסמנים את אלה שאתם רוצים ומאשרים אותם. שום דבר לא
        משתנה עד שתעשו זאת. השם הישן נשמר ככותרת חלופית, ושם שאושר נשמר בזמן
        גירוד. שם שנדחה לא יוצע שוב. נדרש ספק AI בהגדרות &gt; גירוד.</li>
      <li><strong>אפשר לערוך משחקים שמתוארכים לפי שנה בלבד, והם שומרים על
        השנה.</strong> משחקים רבים מתוארכים לפי השנה בלבד, למשל 1985. בדף של
        משחק, חלון העריכה סירב לשמור אותם. בחלון העריכה של הספרייה, שמירת
        משחק כזה מחקה את השנה שלו. כעת שניהם מקבלים שנה, שנה וחודש, או תאריך
        מלא.</li>
    </ul>
