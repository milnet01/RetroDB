  - type: fix
    label: חיפושי HowLongToBeat, כמותיים ובודדים, משתמשים עכשיו בשנת היציאה של המשחק, כך ש-Doom מ-1993 כבר לא מקבל את הזמנים של Doom מ-2016
  - type: new
    label: '"בדיקת זמני משחק שמורים" ב-ROM Tools שולחת לדף הבדיקה התאמות שמורות שנראות שגויות, ושם אפשר להשאיר או לנקות כל אחת'
  - type: fix
    label: חיפוש כמותי ב-HowLongToBeat עם "רק חסרים" מנסה שוב משחקים שהותאמו בלי זמן, ומשאיר שנייה בין בקשות
  - type: fix
    label: ציון התאמה של 72% כבר לא מופיע כ-100% בדף המשחק
  - type: fix
    label: משחקים כבר לא מציגים הישגי RetroAchievements של משחק אחר. Resident Evil 4 ב-GameCube כבר לא מציג את הסט של Resident Evil, ו-Ratchet Deadlocked כבר לא מציג את הסט של Ratchet & Clank
  - type: fix
    label: גרידה מסירה עכשיו קישור ל-RetroAchievements כשאין ב-RetroAchievements משחק כזה. אם אי אפשר להגיע ל-RetroAchievements, הקישור נשאר
  - type: fix
    label: RetroAchievements מוצא עכשיו יותר מהמשחקים שלכם, לפי שם קובץ ה-ROM, כותרות חלופיות, מבטאים כמו ב-Ōkami, וכותרות עם שני שמות
  - type: fix
    label: RetroAchievements כבר לא מקשר משחק לסט בונוס, האק או הדגמה, ו-X-Men כבר לא שווה ל-G-Men
  - type: new
    label: דף המשחק מציג את השם של RetroAchievements עצמו למשחק המקושר, כך שקל להבחין בקישור שגוי
  - type: fix
    label: רענון RA שומר עכשיו את הנקודות של כל משחק, כך שמשחק כבר לא מציג 0 נקודות
  - type: new
    label: דף המשחק מסמן דירוגי גיל מה-AI כהערכה לפי תוכן המשחק, ואומר מתי כל גוף דירוג התחיל לפעול. OutRun מ-1987 כבר לא נראה כמדורג רשמית על ידי ESRB
  - type: new
    label: דף המשחק מסמן ציוני ביקורות ונתוני מכירות שהגיעו מה-AI. שינוי ידני של דירוג או של נתון מכירות מסיר את הסימון
  - type: fix
    label: ציון מה-AI בסולם הלא נכון נדחה, כך שמשחק אהוב כבר לא מקבל 7 מתוך 100 מגרידה חדשה
  - type: fix
