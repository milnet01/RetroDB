  body: "<ul>\n  <li><strong>כל גרדן מחפש את הקונסולה הנכונה.</strong> Atari\n    Lynx, ארקייד CPS, Super Famicom ואחרות חופשו במכונה הלא נכונה, והרבה מערכות נוספות מחופשות עכשיו, בכל המקורות ועבור הישגים.</li>\n  <li><strong>אזור המשחק נקבע קודם משם הקובץ שלו.</strong>\n    תגית כמו (USA) קובעת עכשיו את האזור, וה-AI כבר לא נשאל. ב-ROM Tools יש כלי חדש, Fix Regions from File Names, למשחקים שגרידות ישנות טעו בהם.</li>\n  <li><strong>ScreenScraper לפי אזור המשחק.</strong> העטיפה, עטיפת התלת-ממד, המדריך, הכותרת ותאריך ההוצאה באים עכשיו מהאזור של המשחק עצמו, ולא מהראשון לפי סדר האלפבית. ב-ROM Tools יש כלי חדש, Fix Box and Manual Regions, לגרידות ישנות. סרטוני וידאו מנסים עכשיו קודם את הקובץ הקטן.</li>\n  <li><strong>תמונות RAWG כבר אינן עטיפה.</strong> לעיתים קרובות הן צילומי מסך, והן חסמו עטיפה אמיתית. עכשיו הן משמשות כאמנות מעריצים. ב-ROM Tools יש כלי חדש, Clear RAWG Pictures from Box Art, לתמונות שגרידות ישנות שמרו. RetroDB גם נותן קרדיט ל-RAWG עם קישור בסרגל הצד, כפי ש-RAWG מבקשת.</li>\n  <li><strong>ES-DE שומר על מקומו בסדר הגרידה שלך.</strong> כשהוא לא היה המקור הראשי, מקורות מאוחרים יותר וה-AI החליפו את הטקסט והעטיפות שלו, וצילומי המסך שלו נזרקו. עכשיו הם נשארים. הוא כבר לא מעתיק מדיה שכבר יש למשחק, והוא קורא את הרשומה של קובץ ה-ROM של המשחק עצמו. משחקי PS3 בתיקיות מוצאים עכשיו את עטיפות ה-ES-DE שלהם. ייבוא לוגואים של מערכות כבר לא לוקח תמונה לא קשורה. גירוד מלא מחדש כבר לא מוחק עטיפה שמקור אחר הרגע הוריד.</li>\n  <li><strong>Screenshot Review.</strong> כלי חדש ב-ROM Tools מציג צילומי מסך של ZX Spectrum, Commodore 64 ו-Game Boy כשהחשודים ביותר קודם, ומסיר רק את מה שבחרת. הגרידה מסרבת עכשיו לצילום מסך של Game Boy שהמקור שלו מכיל הרבה יותר גוונים ממה שהמכונה יכולה להציג. במערכות 8 סיביות ו-16 סיביות היא כבר לא מוסיפה צילומי מסך של IGDB או RAWG למשחק שיצא על כמה מערכות.</li>\n  <li><strong>ההתחברות ל-RetroAchievements מגיעה ל-DuckStation ול-PCSX2</strong>\n    כשלוחצים על שחק.</li>\n  <li><strong>בדף של משחק:</strong> מקשי החצים שמאלה וימינה עוברים למשחק הקודם והבא, מדור הצ'יטים ניתן לכיווץ וזוכר את מצבו, החלוניות התחתונות מתאימות לחלון, והאמולטור מופיע בכרטיס הגדרות האמולטור, ולא ליד שחק.</li>\n  <li><strong>ייבא עטיפת תלת-ממד</strong> נמצא עכשיו בחלון הערוך, ליד שאר התמונות.</li>\n  <li><strong>חלון שמתחיל בתיבת טקסט,</strong> כמו גרד, מציב עכשיו את הסמן בתיבה במקום על כפתור הסגירה.</li>\n</ul>\n"
