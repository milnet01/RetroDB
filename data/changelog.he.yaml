  body: "<ul>\n  <li><strong>הגרידה מפסיקה לקחת משחק שגוי.</strong> סרט המשך כבר לא\n    עובר בתור המשחק שיש לך, ולכן Street Fighter II לא מקבל דבר\n    מ-Street Fighter, וגרידה קבוצתית דורשת שהכותרת תתאים, ולא רק\n    הקונסולה. מודים, DLC וחבילות מ-IGDB כבר לא מותאמים אלא אם\n    ל-ROM שלך יש בדיוק את השם הזה.</li>\n  <li><strong>RAWG מפסיק לערבב גרסאות של משחק.</strong> כשהרשומה שלו\n    מכסה כמה קונסולות הוא כבר לא מספק מפתח, מוציא לאור, דירוג\n    גיל או מצבי רב-משתתפים, והוא לא מנחש מספר שחקנים.\n    כבר לא מחפשים בו משחקי Commodore 64 ו-DOS.</li>\n  <li><strong>סדר הגרדים שלך קובע בין התאמות שוות.</strong>\n    RAWG כבר לא מקבל ניקוד נוסף על תמונה או ציון Metacritic, ובהתקנות\n    חדשות הוא מופיע אחרון.</li>\n  <li><strong>תאריך יציאה מציג רק את מה שהמקור מכיר.</strong>\n    משחק שידועה רק שנתו מציג את השנה. תאריכים מ-IGDB ו-RAWG\n    שייכים לקונסולה של המשחק עצמו, ורשימת תאריכי היציאה מתמלאת\n    עכשיו גם מ-IGDB ומ-ScreenScraper.</li>\n  <li><strong>סט שמות אחד לז'אנרים, נקודות מבט ומצבים.</strong>\n    המסננים מוצאים עכשיו כל משחק, ומשחקים מקוונים בלבד כבר לא מופיעים\n    כרב-משתתפים מקומי.</li>\n  <li><strong>שני כרטיסים חדשים בכלי ROM.</strong> ניקוי תאריכי יציאה וניקוי\n    ז'אנרים, נקודות מבט ומצבים מתקנים את מה שגרידות ישנות שמרו. לחץ\n    עליהם, ואז הפעל גרידה קבוצתית עם Fill Missing.</li>\n  <li><strong>מספרי שחקנים מגיעים מהקונסולה של המשחק עצמו,</strong> ו\n    תוצאת ScreenScraper שבחרת היא תמיד המשחק שתקבל.</li>\n</ul>\n"
