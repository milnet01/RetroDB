  body: |
    <ul>
      <li><strong>RetroDB מוכן לנגן משחקים משלו.</strong> נגן המבוסס על
        RetroArch נבנה עבור RetroDB. כשהוא יגיע, RetroDB יפעיל בו משחקים עם
        הגדרות שנבחרו לכל משחק, וישמור כל הגדרה שתשנו בזמן המשחק. הוא ישמור את
        השמירות וההגדרות שלו בתיקייה משלו, בנפרד מה-RetroArch שלכם. הוא בוחר את
        הליבה הטובה ביותר לכל קונסולה ומוריד אותה בפעם הראשונה שאתם לוחצים על
        שחק; בינתיים הכפתור אומר "מוריד את הליבה…". הוא מריץ כל קונסולה שאין לה
        אמולטור עובד, ואף פעם לא מחליף אמולטור שהגדרתם. לכל משחק אפשר לבחור
        ליבה אחרת, את אפקט המסך, שינוי קנה מידה בכפולות שלמות והפחתת השהיית
        קלט. מנהלים יכולים להתקין או לעדכן את כל הליבות בבת אחת, או לכבות את
        ההורדות. שום דבר לא משתנה עד שהנגן מותקן; עד אז הוא לא מופיע בהגדרות
        &gt; אמולטורים.</li>
      <li><strong>הלשוניות במוזיאון מתחלפות שוב.</strong> בדף המוזיאון של
        קונסולה, לחיצה על מפרטים, 10 המשחקים המובילים או בקרים לא עשתה דבר
        והציגה את ההודעה "שגיאה לא צפויה", מאז גרסה 3.30.0. כעת כל לשונית
        נפתחת.</li>
      <li><strong>אפשר לשחק במשחקי PlayStation 3 שמאוחסנים
        כתיקייה.</strong> משחק דיסק של PS3 הוא בדרך כלל תיקייה שמסתיימת
        ב-".PS3". RetroDB סירב להפעיל אותו ולא הציג כפתור שחק, כי הוא ציפה
        לקובץ יחיד. כעת הוא מעביר את התיקייה לאמולטור, כפי ש-RPCS3 מצפה.</li>
      <li><strong>העמודות בחפש מטא-נתונים מיושרות, והחלון מתאים
        לטלפון.</strong> מקור עם יותר תוצאות ממה שנכנס קיבל פס גלילה, שהצר את
        הכותרות שלו, כך שאותה כותרת נשברה לשורה חדשה בעמודה אחת ולא בבאה. כעת
        כל עמודה שומרת על אותו מקום, עם פס גלילה דק בצבעי ערכת הנושא. בטלפון
        או בחלון צר, חלון החיפוש נדחק לצד סרגל צד מוסתר; כעת הוא ממלא את
        המסך.</li>
      <li><strong>התקנה חדשה ב-Windows או ב-Mac נותנת לליבות של RetroArch את
        השמות הנכונים.</strong> RetroDB הגדיר את RetroArch עם שמות קבצי ליבה של
        Linux בכל מקום, ולכן ב-Windows וב-macOS לא נמצאה אף ליבה. התקנה חדשה
        משתמשת כעת בשמות של כל מחשב. התקנה קיימת שומרת על השמות שיש לה; שנו
        אותם בטבלת המיפוי.</li>
      <li><strong>מציג צילומי המסך מראה את שני החצים, כל אחד בתוך הכפתור
        שלו.</strong> סרגל הצד הסתיר את החץ השמאלי, כך שלא יכולתם לחזור לצילום
        מסך קודם עם העכבר. גם החץ הימני ישב מתחת לכפתור שלו. כעת שניהם מוצגים,
        במרכז הכפתורים שלהם.</li>
      <li><strong>דף הגדרות האמולטורים מוצג בשפה שלכם.</strong> רוב הדף
        הגדרות &gt; אמולטורים היה באנגלית בכל שפה שבחרתם: הכותרות, טבלת
        האמולטורים, תוצאות הסריקה וחלון עריכת אמולטור. כעת הכול מתורגם.</li>
      <li><strong>התיבה שחקנים מקבלת יותר מ-16.</strong> שני חלונות העריכה
        נעצרו ב-16, כך שלא יכולתם להזין את 256 השחקנים של MAG. משחק שגורד
        נתן לו יותר מ-16 לא נשמר בכלל עד שהורדתם את המספר. כעת אין גבול
        עליון.</li>
      <li><strong>מילוי AI נותן למשחקי PC סוג שמירה של PC, לא של
        קונסולה.</strong> משחק Windows יכול היה לקבל "כרטיס זיכרון" כי ה-AI
        תיאר את גרסת ה-PlayStation 2 שלו. כעת ה-AI מתבקש לתאר את ההוצאה
        בפלטפורמה של המשחק שלכם. מחשבי PC, וקונסולות מ-PlayStation 3 ו-Xbox 360
        ואילך, שומרים באחסון פנימי.</li>
      <li>כדי לתקן משחק שכבר יש לו סוג שמירה שגוי, גרדו אותו שוב או הריצו
        מילוי AI. שניהם שואלים את ה-AI מחדש ומחליפים את הערך הישן.</li>
      <li><strong>חיבור PlayStation אומר לכם להתחבר קודם.</strong> בהגדרות
        &gt; חשבון &gt; PSN, דף חשבון Sony הציג רק "Invalid login" אלא אם
        כבר הייתם מחוברים ל-PlayStation, והשלבים לא אמרו זאת. בשלב 1 יש כעת
        כפתור "התחברו ל-PlayStation" ללחוץ עליו קודם.</li>
      <li><strong>מיינו את הספרייה, והציגו רק משחקים שלא נגרדו.</strong>
        בספרייה ובכל דף מערכת יש תפריט מיין לפי ליד מספר המשחקים: שם, ההוצאה
        החדשה או הישנה ביותר, ציון מבקרים, ציון משתמשים, או נוספו לאחרונה.
        משחקים בלי תאריך או ציון מופיעים אחרונים. סרגל A–Z עובד במיון לפי שם
        ומואפר בכל מיון אחר. כפתור חדש, לא נגרד, מציג רק את המשחקים שאף גורד
        עוד לא מילא.</li>
      <li><strong>מסנן שלא מתאים לשום משחק אומר זאת.</strong> הדף היה
        מתרוקן. כעת הוא אומר שאין משחקים מתאימים, עם כפתור לניקוי
        המסננים.</li>
      <li><strong>סרגל המסננים בספרייה שומר כל דבר
        במקומו.</strong> לחיצה על בחר, סינון או מיון דחפו בעבר את המשחקים
        למטה בדף. כלי הבחירה מופיעים כעת בסרגל לאורך תחתית החלון. נקה נמצא
        תמיד שם, מואפר עד שמסנן מופעל. מסננים פעילים מוצגים ליד מספר המשחקים.
        "הצג בונוס" נקרא כעת "דיסקי בונוס", ומודגש כשהוא מופעל. בטלפון, כפתורי
        המסננים נפתחים מכפתור מסננים אחד מעל הדף.</li>
      <li><strong>ספרייה ריקה מציגה מסך פתיחה עם כפתור
        סריקה.</strong> התקנה חדשה הציגה בעבר ציון בריאות שתקוע על 0% וספרייה
        ריקה. כעת שני הדפים אומרים שהספרייה ריקה ומציעים כפתור סרוק ספרייה. לוח
        הבקרה גם מקשר להגדרת תיקיית ה-ROM. משתמשים שאינם מנהלים מתבקשים לפנות
        למנהל. משחק אקראי מוסתר עד שיש משחקים לבחור מהם.</li>
      <li><strong>סרוק ספרייה עובד מדף המערכות ומההגדרות.</strong> שני
        כפתורי סרוק ספרייה האלה לא עשו דבר כשלחצו עליהם. רק זה שבלוח הבקרה
        עבד. כפתור סרוק ספרייה של לוח הבקרה מוצג כעת רק למנהלים, שהם
        המשתמשים היחידים שמורשים לסרוק.</li>
      <li><strong>אשף ההגדרה מראה באיזה שלב אתם, ואילו שלבים
        אופציונליים.</strong> הוא אומר "שלב 3 מתוך 6", ממספר כל שלב, מסמן את
        השלבים שעברתם, ומסמן את ES-DE ואת מפתחות API כאופציונליים. בטלפון הוא
        מציג את המספרים ואת שם השלב הנוכחי.</li>
      <li><strong>סננו את הספרייה לפי כמה ז'אנרים, סדרות או מוציאים לאור בבת
        אחת.</strong> במסננים ז'אנר, סדרה, מוציא לאור, מפתח, מצבי משחק, נקודת
        מבט וממד, סמנו כמה ערכים שתרצו ולחצו על החל: משחק מוצג אם יש לו אחד
        מהם. העבירו את החלון ל-אינו כדי להסתיר משחקים שיש להם אחד מהערכים
        המסומנים. כל ערך מקבל תגית משלו, וה-✕ שלה מסיר רק את הערך הזה.</li>
    </ul>
