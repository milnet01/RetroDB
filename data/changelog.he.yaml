  body: "<ul>\n  <li><strong>תשובות AI מצהירות שהן AI.</strong> דירוגי גיל מה-AI\n    נשארים, מסומנים כהערכה לפי תוכן המשחק, עם השנה שבה כל גוף\n    דירוג התחיל. גם ציונים ומכירות מה-AI מסומנים.</li>\n  <li><strong>RetroAchievements מציג את המשחק הנכון.</strong> סרטי המשך\n    כבר לא נושאים את ההישגים של המשחק הראשון. אחרי העדכון,\n    לוח הבקרה יציע רענון RetroAchievements פעם אחת. לחצו עליו כדי לתקן\n    קישורים ישנים. התקדמות ששמורה תחת קישור שגוי נמחקת, והסנכרון הבא\n    ימלא אותה שוב.</li>\n  <li><strong>סך זמני המשחק נכונים.</strong> זמנים של פחות משעה\n    נספרו כשעות, ולכן הסכומים בלוח הבקרה ובגביעי האספן\n    היו גבוהים מדי. חלק מהסכומים והגביעים ירדו.</li>\n  <li><strong>HowLongToBeat מוצא את המשחק הנכון.</strong> סרט המשך כבר לא\n    נחשב למשחק שיש לכם, והמערכת והשנה של המשחק נלקחות עכשיו בחשבון.\n    התאמה במערכת אחרת, או משנים מאוחרות יותר, ממתינה לכם\n    בדף הבדיקה.</li>\n  <li><strong>בדקו מה כבר שמור.</strong> לחצו על \"בדיקת זמני משחק שמורים\"\n    ב-ROM Tools כדי לשלוח לדף הבדיקה התאמות שמורות מפוקפקות.\n    דבר לא משתנה עד שתחליטו.</li>\n  <li><strong>שמות הסדרות אמיתיים.</strong> הסדרה של משחק כבר לא נגזרת\n    מחיתוך הכותרת. אחרי העדכון, שמות סדרות שנוחשו נמחקים,\n    כולל כאלה שהיו נכונים. הגרידה הבאה\n    ממלאת אותם ממקורות שמציינים סדרה.</li>\n  <li><strong>טקסט נקי.</strong> תיאורים כבר לא מציגים קודי רשת או\n    סימני כותרת. לחברה אחת יש איות אחד, למשחק יש אזור אחד, ושמות\n    קבצים כמו dosbox.exe כבר לא מופיעים ככותרות אחרות. זה\n    קורה פעם אחת, מעצמו, אחרי העדכון.</li>\n  <li><strong>גירוד מלא מחדש שומר על הבחירות שלכם.</strong> דירוג או\n    בקר שהגדרתם נשארים אלא אם מקור באמת מספק אחד.</li>\n</ul>\n"
