- version: 3.23.9
  date: '2026-09-26'
  tags:
  - type: security
    label: קובצי היומן של המגרדים כבר לא שומרים סיסמאות ואסימונים, וניסיונות ההתחברות מוגבלים שוב
  - type: fix
    label: שמירת ההגדרות כבר לא מוחקת את ההגדרות שלכם, ומחיקת משתמש עובדת
  body: |
    <ul>
      <li><strong>קובצי יומן שמרו סודות כטקסט גלוי.</strong> קובצי היומן של
        המגרדים היו אמורים להסתיר אסימוני התחברות ומפתחות API, אבל שלב ההסתרה
        מעולם לא רץ, ולכן הם נכתבו במלואם. כעת הם מוסתרים. קובצי יומן ישנים
        עדיין מכילים אותם; מחקו קבצים ישנים ב-<code>logs/</code> אם אתם משתפים
        את ההתקנה שלכם.</li>
      <li><strong>מגבלות ניסיונות ההתחברות לא נאכפו.</strong> המגבלות על
        התחברויות חוזרות ועל פעולות כבדות (סריקות, גרידות, ייבוא) הוגדרו אך
        מעולם לא הופעלו. כעת הן עובדות, ובקשה שנחסמה מקבלת הודעת "יותר מדי
        בקשות" ברורה.</li>
      <li><strong>קובץ הגדרות פגום יכול היה להימחק.</strong> אם לא ניתן היה
        לקרוא את <code>data/settings.json</code>, השמירה הבאה החליפה אותו
        בברירות המחדל. RetroDB שומר כעת את הקובץ הפגום בשם
        <code>settings.json.corrupt-&lt;time&gt;</code> לפני השמירה. אם הקובץ
        שוב נקרא כראוי, השמירה נדחית במקום זאת.</li>
      <li><strong>שורת השמות של מנוע איבדה הגדרות אחרות.</strong> הוספת תגית
        לשורת מנוע בהגדרות מתן השמות נכשלה, וגם השליכה את הגדרות התווית
        והאזור שנשמרו איתה. כעת היא נשמרת כראוי.</li>
      <li><strong>מחיקת משתמש נכשלה.</strong> לא ניתן היה למחוק משתמש שיש לו
        תגיות, רשימות, פריטים ברשימת המשאלות או נתוני PSN. המחיקה מסירה כעת את
        המשתמש ואת כל מה שבבעלותו.</li>
      <li><strong>שתי גרידות יכלו לרוץ בו־זמנית.</strong> החלפה או הזזה של
        גרידה המונית שרצה בתור הפעילה שתי גרידות שחלקו מונה התקדמות אחד. כעת
        רצה רק אחת.</li>
      <li><strong>התקדמות של גרידה המונית יכלה להיראות כמו שגיאה.</strong>
        לפני ההצלחה הראשונה שלה, גרידה המונית דיווחה על מצבה בצורה שחלק
        מהמסכים פירשו ככישלון. זה תוקן.</li>
      <li><strong>התחברות מחזירה אתכם כעת לדף שביקשתם.</strong> בעבר היא
        תמיד הובילה ללוח הבקרה.</li>
      <li><strong>פעולות קבצים של מנהל נשארות בתוך התיקיות שלכם.</strong> כלי
        שינוי גודל התמונות ופעולות שינוי השם של ROM מסרבים כעת לכל דבר שמחוץ
        לתיקיית המדיה או לתיקיית ה-ROM שלכם.</li>
      <li><strong>קובצי התחברות ישנים של PSN ו-Xbox מועברים לחשבון
        שלכם.</strong> קובץ <code>data/psn_tokens.json</code> או
        <code>data/xbox_tokens.json</code> שנשאר נטען לחשבון שלכם, ושמו משתנה
        כך שיסתיים ב-<code>.migrated-015</code>. הקובץ הזה עדיין מכיל את
        האסימון, לכן מחקו אותו אחרי שבדקתם שההתחברות עובדת.</li>
      <li><strong>שגיאות ברורות יותר מהשרת.</strong> בקשה שגויה נענית כעת
        בהודעת שגיאה מתאימה במקום "אירעה שגיאה פנימית".</li>
    </ul>
- version: 3.23.8
  date: '2026-09-25'
  tags:
  - type: fix
    label: ייבוא CLZ עובד שוב, עטיפות הרשימות מוצגות, וכמה דפים כבר לא נשברים בגלל גרש
  - type: security
    label: שמות שנגרדו ונתיבי קבצים כבר לא יכולים לפרוץ מתוך כפתורי הדף
  body: |
    <ul>
      <li><strong>ייבוא CLZ לא עשה דבר.</strong> העלאת קובץ PDF של CLZ שלחה
        אותו לכתובת שאינה קיימת בשרת, ולכן כל העלאה נכשלה עם ההודעה "Parse
        failed". כעת הוא מגיע למנתח.</li>
      <li><strong>כל העטיפות בדף רשימה היו חסרות.</strong> דף הרשימה ביקש כל
        עטיפה מכתובת שגויה, ועמודת המערכת הייתה תמיד ריקה. כעת שתיהן מוצגות. גם
        תמונות העטיפה בחיפוש "הוסף משחק" שבדף תוקנו.</li>
      <li><strong>כפתורים נשברו בשמות עם גרש.</strong> הסרת "Assassin's
        Creed" מרשימה, מחיקת צילום מסך, הגדלת עטיפה או הסרת תגית ז'אנר יכלו
        בשקט לא לעשות דבר כשהשם הכיל גרש. אותה תקלה אפשרה לשם מגורד שנבנה
        במכוון להריץ קוד בדף. כעת השמות מועברים לכפתורים האלה בדרך שאי אפשר
        לפרש בטעות כקוד.</li>
      <li><strong>כתובות של תמונות וקישורים מוגנות כעת בכל מקום.</strong> כמה
        דפים בנו כתובות תמונה משמות קבצים שנגרדו בלי להגן עליהן, וחמישה דפים
        החזיקו עותק חלש יותר משלהם של כלי העזר להגנה. כעת כולם משתמשים בכלי
        המשותף.</li>
      <li><strong>דף ההגדרות יכול היה להיפתח ריק.</strong> אם עדכון שינה את
        שם הלשונית שבה השתמשתם לאחרונה, ההגדרות נפתחו בלי שום חלונית גלויה. כעת
        המערכת מתעלמת מלשונית שכבר לא קיימת. קישורים כמו
        <code>/settings#account</code> פותחים שוב את הלשונית הזו.</li>
      <li><strong>ערכת הנושא שלכם עוברת כעת איתכם למכשירים אחרים.</strong>
        ערכת הנושא שאתם בוחרים נשמרת בחשבון שלכם. דפדפן שמעולם לא נקבעה בו ערכת
        נושא משתמש בזו השמורה שלכם במקום בברירת המחדל.</li>
      <li><strong>חלונות ההתקדמות הקופצים של משימות מציגים את הסמל
        הנכון.</strong> משימות מושהות, שהסתיימו או שממתינות בתור הציגו אותו סמל
        "פועלת". כעת לכל מצב יש סמל משלו, לכל ערכת נושא.</li>
      <li><strong>אפשר כעת לתרגם את רשימת קיצורי המקלדת.</strong> התוויות שלה
        היו בלתי נראות לכלי התרגום, ולכן נשארו באנגלית בכל השפות.</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: דירוגי הגיל היו שגויים לעיתים קרובות, ומשחקים שנגרדו יכלו לאבד את הפרטים שלהם
  body: |
    <ul>
      <li><strong>דירוגי הגיל היו שגויים לעיתים קרובות, והטעות התפשטה.</strong>
        כשדירוג הגיע מ-TheGamesDB, האפליקציה חיפשה את קוד הדירוג בכל מקום
        בטקסט במקום לקרוא אותו כראוי &mdash; כך ש-"T - Teen", ‏"M - Mature
        17+", ‏"AO - Adults Only 18+" ו-"RP - Rating Pending" נשמרו כולם כדירוג
        הלא נכון, ומשחק למבוגרים יכול היה להיות מסווג כמתאים לכולם. גרוע מכך,
        הדירוג השגוי שימש אחר כך למילוי שמונה מערכות הדירוג האחרות, כך שקריאה
        שגויה אחת התפשטה לכולן. כעת הדירוגים נקראים מהקוד שבתחילת הטקסט.</li>
      <li><strong>דירוגים מומרים יצאו מקלים מדי.</strong> כשמילאה דירוג חסר
        מתוך דירוג שכבר היה לכם, האפליקציה יכלה להשתמש בדירוג שחישבה רגע קודם
        במקום בזה שהתחלתם ממנו בפועל. כל קפיצה איבדה מעט מהחומרה. כעת היא תמיד
        ממירה מהדירוגים שיש למשחק באמת.</li>
      <li><strong>גירוד מלא מחדש מחק אזור וסוג שמירה שנבחרו ידנית.</strong>
        אף אחד מהם לא מגיע ממגרד &mdash; האפליקציה מחשבת אותם &mdash; ולכן
        גירוד מלא מחדש היה מחליף את "Japan" שבחרתם בברירת המחדל "USA". כעת
        הערכים שלכם נשמרים, אלא אם מקור מספק באמת ערך חדש.</li>
      <li><strong>מגרד יכול היה לקבל את המשחק הלא נכון.</strong> תוצאות
        ScreenScraper נבדקות בדרך כלל מול ציון התאמה לפני השימוש בהן, אבל חיפוש
        שהחזיר תוצאה אחת בדיוק דילג לגמרי על הבדיקה הזו. כעת כל תוצאה מקבלת
        ציון.</li>
      <li><strong>משחק יכול היה לאבד את כל הפרטים שנגרדו בגלל שדה חסר
        אחד.</strong> אם IGDB או ScreenScraper השאירו שדה בודד ריק בצורה לא
        צפויה, כל העדכון נזרק &mdash; מוציא לאור, מפתח, תמונות והכול. כעת
        המקרים האלה מטופלים ושאר הפרטים נשמרים.</li>
      <li><strong>תמונה שנכשלה יכלה להירשם כהצלחה.</strong> אם תמונה שהורדה
        התבררה כלא שמישה, האפליקציה לא מחקה דבר ובכל זאת שמרה את שם הקובץ,
        והשאירה הפניה שבורה. כעת הקובץ מוסר והשדה נשאר כפי שהיה.</li>
      <li><strong>מצבי המשחק משתמשים כעת בניסוח אחיד.</strong> מגרדים שונים
        כתבו "Single-player" ו-"Single-Player" ו-"Multiplayer" פשוט שלא היה
        אחת מהתוויות של האפליקציה עצמה, ולכן לא ניתן היה לתרגם את המשחקים האלה
        או למצוא אותם במסנן המצבים. כעת כל המקורות כותבים את אותן תוויות.
        משחקים קיימים שומרים על הניסוח הישן עד שתגרדו אותם מחדש או תריצו את כלי
        הנרמול בהגדרות.</li>
      <li><strong>חיפושים ב-Xbox מתנהגים כעת כמו בכל מקור אחר.</strong> הם
        שלחו בקשות רשת משלהם, ולכן לא היה להם ניסיון חוזר כש-Xbox Live ביקש
        מהם להאט, ולא הייתה מגבלה על כמות הנתונים שתשובה יכלה למשוך. כעת הם
        משתמשים באותו חיבור משותף כמו שאר המגרדים.</li>
      <li><strong>קוד ScreenScraper שלא היה בשימוש הוסר.</strong> שתי פונקציות
        שאף חלק באפליקציה לא קרא להן נמחקו. אחת מהן החזירה כתובת אינטרנט שעדיין
        הכילה את סיסמת ScreenScraper שלכם, מה שהיה מוסר את הסיסמה לכל מה שהשתמש
        בה. "System Media Endpoint" שהופיע בהערות ההפצה של 3.6.x היה אחת מהן
        &mdash; אי אפשר היה להגיע אליה מאף מקום באפליקציה.</li>
    </ul>
- version: 3.23.5
  date: '2026-09-02'
  tags:
  - type: fix
    label: ההורדה הארוזה לא הצליחה לעלות, ותיקוני בנייה נוספים
  body: |
    <ul>
      <li><strong>ההורדה העצמאית לא הצליחה לעלות כלל.</strong> הגרסה הארוזה
        כוללת Python משלה, אבל המשגר שבתוכה היה זה שנכתב להתקנה מקוד מקור
        &mdash; הוא חיפש קובצי Python שגרסה ארוזה לא מכילה, ונעצר כבר בשורה
        הראשונה. כעת החבילה כוללת משגר משלה, שפשוט מריץ את האפליקציה ופותח את
        הדפדפן שלכם ברגע שהשרת עולה.</li>
      <li><strong>קיצור הדרך לשולחן העבודה בהורדה ל-Linux לא הפעיל
        כלום.</strong> הוא סופק עם טקסט ממלא מקום במקום הנתיב לאפליקציה. כעת יש
        <code>install-launcher.sh</code> לצד המשגר &mdash; הריצו אותו פעם אחת
        וקיצור הדרך ייכתב עם הנתיב האמיתי למקום שבו פרסתם אותה.</li>
      <li><strong>הפעלה מקוד מקור התקינה תלויות שלא אומתו.</strong> כש-Flask
        היה חסר, סקריפט ההפעלה הוריד חבילות ישירות מהאינטרנט בלי בדיקת סכום
        ביקורת, ובדרך גם עקף בכוח את מנהל החבילות של המערכת שלכם. כעת הוא מעביר
        את העבודה ל-<code>install.py</code>, שמשתמש בקובץ הנעילה עם סכומי
        הביקורת.</li>
      <li><strong>ההורדה מקוד מקור כללה קובצי מתחזק שלא היו צריכים להיות
        בה.</strong> רשימת הקבצים שיש להשמיט נוהלה ידנית ונשארה מאחור, ולכן
        פלט בדיקות ותיקיות בנייה שנשארו נארזו יחד עם האפליקציה. כעת ההורדה
        נבנית מרשימת הקבצים שנמצאים בפועל בפרויקט, ולכן היא לא יכולה לסטות.</li>
      <li><strong>שתי חלוניות בהגדרות נשברו בגרסה הארוזה.</strong> חלוניות
        סטטיסטיקת הספרייה ומצב ה-API חיפשו את התוכנית הראשית בשם שאין לה בתוך
        גרסה ארוזה, ולכן שתיהן נכשלו.</li>
      <li><strong>חלק מהטקסט שעל המסך לא ניתן היה לתרגם לעולם.</strong> שלושה
        חלקים חדשים יותר של האפליקציה &mdash; הגדרות האמולטור, כפתור ההפעלה
        וסרגל "משוחק כעת" &mdash; דולגו בסריקת התרגום, והבדיקה שנועדה לתפוס זאת
        הסתכלה על אותה רשימה חלקית. כעת הסריקה מכסה כל קובץ באופן אוטומטי,
        והטקסט שלהם נוסף לתרגומים.</li>
      <li><strong>בנייה מחדש של התרגומים יכלה בשקט לא לעשות דבר.</strong>
        הוספת טקסט לסקריפט של דף מסוים השאירה את הבנייה מחדש משוכנעת שאין מה
        לעשות, ולכן הטקסט החדש מעולם לא הגיע לקובץ התרגום.</li>
      <li><strong>עקיפה לבעיה בכרטיס מסך הוחלה על כולם.</strong> סקריפט
        ההפעלה ל-Linux כפה הגדרה שנועדה לכרטיס AMD מסוים אחד על כל מחשב, מה
        שיכול היה לתקוע את מגדיל התמונות בחומרת AMD אחרת. כעת היא חלה רק כשאותו
        כרטיס אכן קיים, ולעולם לא דורסת ערך שקבעתם בעצמכם.</li>
      <li><strong>סקריפט ההפצה יכול היה לפרסם את הגרסה הלא נכונה.</strong>
        תג שנשאר מניסיון קודם שימש שוב בשקט, כך שהבנייה יכלה להיעשות מתמונת
        מצב ישנה יותר תוך דיווח על הצלחה.</li>
    </ul>
- version: 3.23.4
  date: '2026-09-02'
  tags:
  - type: fix
    label: תשע דרכים שבהן הספרייה שלכם יכלה לאבד נתונים — נסגרו
  body: |
    <ul>
      <li><strong>"ניקוי נתונים שנגרדו" ניקה את כל הספרייה שלכם.</strong>
        תיבת האישור ספרה רק את המשחקים שאכן נגרדו, ואז הפעולה מחקה כל משחק
        בלי הבדל &mdash; כך שהיא יכלה להבטיח תריסר ולנקות אלפים. כשהתמונות
        היו מסומנות, היא גם מחקה עטיפות שהעליתם ידנית ואיפסה כותרות שערכתם
        בעצמכם, במשחקים שמעולם לא נגרדו. כעת היא עושה בדיוק את מה שהתיבה
        אומרת.</li>
      <li><strong>עטיפה תלת־ממדית השאירה אחריה קישור שבור.</strong> ניקוי עם
        תמונות מחק את העטיפה התלת־ממדית מהדיסק אבל השאיר את מסד הנתונים מצביע
        עליה, כך שהאפליקציה חיפשה קובץ שכבר לא היה קיים.</li>
      <li><strong>המתג "הוסף" בעריכה המונית החליף במקום להוסיף.</strong>
        בנקודת מבט ובממד הוא עשה את ההפך הגמור מהתווית שלו, ודרס את הערכים
        הקיימים בכל המשחקים שנבחרו בבת אחת, בלי אפשרות לבטל.</li>
      <li><strong>גרסאות עצמאיות יכלו למחוק כל הפניה לתמונה בלחיצה
        אחת.</strong> בהורדה הארוזה האפליקציה חיפשה את המדיה שלכם במקום הלא
        נכון, הסיקה שכל תמונה ותמונה חסרה, ו"ניקוי הפניות למדיה חסרה" רוקן אז
        את רשומות התמונות, צילומי המסך, הווידאו והמדריכים של הספרייה כולה.
        בדיקת הבטיחות שקיימת בדיוק כדי לתפוס מקרה כזה לא ראתה אותו. רק הגרסה
        הארוזה הושפעה.</li>
      <li><strong>ניקוי הקבצים היתומים יכול היה למחוק תמונות בזמן
        שהגיעו.</strong> עטיפה שהורדה בזמן שהניקוי רץ יכלה להיחשב כיתומה
        ולהימחק.</li>
      <li><strong>יצירת רשימות השמעה העבירה את הארכיונים שלכם בלי
        לשאול.</strong> יצירה של רשימות השמעה M3U באצווה העבירה את קובצי
        הארכיון המקוריים שלכם גם כשהשארתם את האפשרות הזו כבויה &mdash; וכשכן
        ביקשתם זאת, דיווחה על כישלון בהעברה שהצליחה.</li>
      <li><strong>כלי שינוי גודל התמונות ניפח את תיקיית המדיה שלכם.</strong>
        הוא התייחס לתמונות הממוזערות הקטנות שהוא עצמו יוצר כאל תמונות חדשות
        שיש להגדיל, ניפח אותן לגודל מלא ואז יצר מהן תמונות ממוזערות. כל הרצה
        הוסיפה עוד קבצים, דפים הגישו בשקט תמונות בגודל מלא במקום תמונות
        ממוזערות, ומגדיל ה-AI רץ על בערך פי שלושה מכמות הקבצים המתוכננת.</li>
      <li><strong>מילוי ה-AI דרס פרטים שתיקנתם.</strong> בגרידה רגילה הוא יכול
        היה להחליף את המוציא לאור, המפתח, הז'אנר, דירוגי הגיל ועוד שקבעתם
        בעצמכם. כעת הוא ממלא רק שדות ריקים; כפתור מילוי AI שאתם לוחצים עליו
        בעצמכם לא השתנה.</li>
      <li><strong>גרידות חוזרות יכלו למחוק צילום מסך תקין.</strong> משחקים
        שנגרדו מ-RAWG השתמשו שוב באותם שמות קבצים, כך שגרידה שנייה דרסה צילום
        מסך שמור, ואז מחקה אותו ככפילות בזמן שהספרייה עדיין הציגה אותו.</li>
    </ul>
- version: 3.23.3
  date: '2026-09-01'
  tags:
  - type: fix
    label: תפקידים בבית עושים כעת בדיוק את מה שהם אומרים, וחשבון שהושבת אכן ננעל
  body: |
    <ul>
      <li><strong>השבתת חשבון של מישהו מסיימת כעת את ההתחברות שלו.</strong>
        כיבוי חשבון הסתיר אותו מכל מסך, אבל מי שכבר היה מחובר לחשבון הזה המשיך
        לעבוד כרגיל עד שבוע. השבתה היא הדרך היחידה לנעול מישהו בחוץ בלי למחוק
        אותו, ולכן כעת היא נכנסת לתוקף כבר בלחיצה הבאה שלו.</li>
      <li><strong>חשבונות לקריאה בלבד כבר לא יכולים לשנות נתוני משחקים.</strong>
        שלוש פעולות של "how long to beat" היו פתוחות לכל אדם מחובר, כולל אלה
        שיכולים רק לצפות — כך שחשבון לקריאה בלבד יכול היה לדרוס זמן משחק, או
        למחוק אותו מכל משחק בספרייה. כעת הן דורשות הרשאות עריכה, כמו כל פעולה
        אחרת שמשנה משחק.</li>
      <li><strong>מעקב הגביעים עובד שוב לכולם.</strong> רענון גביעי האספן
        שלכם דרש הרשאות עורך, שאין לתפקידים שחקן וצופה — וזה הדבר היחיד שכותב
        את הגביעים האלה. החשבונות האלה לא יכלו לזכות באף גביע, וכפתור רענן רק
        הציג שגיאה. זו ההתקדמות שלכם, ולכן כעת הוא לא דורש שום הרשאה
        מיוחדת.</li>
      <li><strong>רענון PlayStation של אדם אחד כבר לא ניתן לעצירה על ידי
        אחרים.</strong> כל חשבון מחובר יכול היה להשהות או לבטל רענון שמישהו
        אחר התחיל, ולראות באיזה משחק אותו אדם נמצא. כעת שני הדברים מוגבלים למי
        שהתחיל אותו.</li>
      <li><strong>ייבוא מ-Steam משתמש בחשבון שלכם, ולא במי ששמר את שלו
        ראשון.</strong> ייבוא הספרייה קרא עותק משותף אחד של פרטי ההתחברות ל-Steam
        במקום את שלכם, ולכן יכול היה להביא ספרייה של מישהו אחר — בזמן שהפרטים
        השמורים שלכם נראו חסרים.</li>
      <li><strong>ניחוש סיסמת מנהל קשה שוב.</strong> המגבלה על ניסיונות
        התחברות כושלים הייתה משותפת לכל מי שברשת, כך שכל מי שיש לו חשבון משלו
        יכול היה לאפס אותה בהתחברות ולהמשיך לנחש ללא הגבלה. כעת המגבלה היא לכל
        חשבון בנפרד.</li>
      <li><strong>שגיאות מהאפליקציה מגיעות כעת לדף במקום להיעלם.
        </strong> כשפעולה נדחתה, 115 מהפעולות השיבו בצורה שהדף לא ידע לקרוא,
        כך שנראה כאילו הפעולה הצליחה. כעת הן מדווחות על הדחייה כראוי, ואתם רואים
        את ההודעה האמיתית.</li>
    </ul>
- version: 3.23.2
  date: '2026-08-06'
  tags:
  - type: fix
    label: דפי הגדרות המגרדים נטענים מהר יותר ולעולם לא מציגים מפתח API ישן
  body: |
    <ul>
      <li><strong>דפי ההגדרות ותצורת המגרדים מפסיקים לקרוא מחדש את קובץ
        הגדרות המגרדים בכל בקשה.</strong> ארבעה מקומות פתחו וניתחו אותו מחדש
        מהדיסק בכל פעם שדף או בדיקה רצו, אף שכבר היה קורא משותף עם מטמון. כעת
        כולם משתמשים בו, כך שהדפים האלה עושים פחות עבודה בכל ביקור.</li>
      <li><strong>השמירה עדיין נכנסת לתוקף מיד.</strong> מטמון ששוכח לפי
        טיימר יכול היה להציג לכם את הערכים הישנים עד חצי דקה אחרי שמירה. כעת
        כל שמירה מנקה את המטמון בזמן הכתיבה, כך שמה שאתם רואים הוא מה ששמרתם
        זה עתה.</li>
      <li><strong>מפתחות ה-API האמיתיים שלכם כבר לא יכולים להיות מוחלפים בערך
        התצוגה המוסתר שלהם.</strong> דפי ההגדרות מציגים מפתחות שמורים
        כ-<code>***1234</code> ולא את המפתח האמיתי. מכיוון שהדף קיבל את אותו עותק
        של ההגדרות שהמגרדים משתמשים בו, ההסתרה הזו יכלה לדרוס את המפתחות
        האמיתיים בזיכרון ולהשאיר את המגרדים מתחברים עם כוכביות עד שהמטמון
        פג.</li>
      <li><strong>גרסאות עצמאיות מחפשות כעת את הגדרות המגרדים במקום
        הנכון.</strong> המגרדים חישבו את מיקום הקובץ בצורה שונה מהדפים ששומרים
        אותו. בהתקנה רגילה שניהם הגיעו לאותו קובץ; בגרסה עצמאית (בלחיצה כפולה)
        לא, כך שמפתחות API שנשמרו יכלו להגיע למקום שהמגרדים מעולם לא חיפשו
        בו.</li>
    </ul>
- version: 3.23.1
  date: '2026-08-06'
  tags:
  - type: fix
    label: יציאת השרת שאתם שומרים בהגדרות היא כעת היציאה שבה הוא משתמש
  body: |
    <ul>
      <li><strong>שמירת יציאת שרת אכן מעבירה את השרת.</strong>
        ההגדרות קיבלו יציאה, בדקו אותה, שמרו אותה, ואמרו לכם שנדרשת הפעלה
        מחדש כדי להחיל אותה &mdash; ואז השרת עלה בכל זאת על 5000. שום דבר לא
        קרא את הערך בחזרה. כעת הוא חלק משרשרת ההפעלה, כך שהפעלה מחדש אכן מעבירה
        את RetroDB ליציאה שבחרתם. כל מה שנקבע בסביבה עדיין גובר, כך שמשגר או
        קונטיינר שמקצים יציאה לא מושפעים.</li>
      <li><strong>שתי הגדרות שמעולם לא עשו דבר הוסרו במקום שיתוקנו.</strong>
        "Server host" ו-"debug mode" נשמרו ודיווחו על אותה הבטחה כוזבת. הפעלת
        מצב ניפוי באגים מטופס אינטרנט הייתה חושפת מסוף Python אינטראקטיבי
        בדפדפן, וכתובת ההאזנה קובעת אילו מחשבים יכולים בכלל להגיע ל-RetroDB
        &mdash; אף אחת מהן לא שייכת לטופס הגדרות. שתיהן נשארות ניתנות להגדרה
        דרך הסביבה, שם הן כבר היו. אם קובץ ההגדרות שלכם עדיין מכיל אותן, הן
        מושמטות בשקט בטעינה; אין צורך לעשות דבר.</li>
      <li><strong>שום דבר כבר לא טוען שהפעלה מחדש תחיל אותו, אלא אם הפעלה
        מחדש אכן מחילה אותו.</strong> זו הייתה התקלה האמיתית &mdash; הגדרה
        מתה היא לא מסודרת, אבל הבטחה כוזבת מבזבזת אחר צהריים שלם.</li>
    </ul>
- version: 3.23.0
  date: '2026-08-06'
  tags:
  - type: enhancement
    label: הפעילו את RetroDB על יציאה שמישהו אחר בחר
  body: |
    <ul>
      <li><strong>RetroDB קורא כעת הגדרת <code>PORT</code> מהסביבה
        שלו.</strong> אם אתם מפעילים את RetroDB מכלי אחר &mdash; לוח בקרה,
        קונטיינר, לוח ניהול של שרת ביתי &mdash; הכלי הזה יכול כעת למסור
        ל-RetroDB את היציאה שהוא רוצה, בלי שמישהו יערוך קובץ. הגדירו את
        <code>PORT</code> ו-RetroDB יאזין שם; השאירו אותה כמו שהיא ושום דבר לא
        משתנה. ההגדרה הקיימת <code>RETRODB_PORT</code> עדיין עובדת בדיוק כמו
        קודם, ו-<code>PORT</code> גוברת אם שתיהן מוגדרות.</li>
      <li><strong>מספר יציאה שגוי אומר זאת כעת במקום לנחש.</strong> בעבר יציאה
        שלא ניתן היה לקרוא הפיקה חומה של טקסט שגיאה של Python, ויציאה מחוץ לטווח
        השמיש התגלתה רק כשהשרת נכשל לעלות. כעת RetroDB נעצר מיד עם שורה אחת
        שמציינת את הערך שלא הצליח להשתמש בו. הוא לעולם לא יעלה בשקט על יציאה
        שונה מזו שהתבקשה &mdash; להיות מועבר בשקט גרוע יותר מלקבל תשובה
        שלילית.</li>
      <li><strong>הודעת הפתיחה ולשונית הדפדפן עוקבות אחר היציאה
        האמיתית.</strong> הכתובת שמודפסת כש-RetroDB עולה, והדף שהוא פותח
        עבורכם, הציגו בעבר 5000 לא משנה באיזו יציאה נעשה שימוש בפועל.</li>
    </ul>
- version: 3.22.1
  date: '2026-07-31'
  tags:
  - type: fix
    label: קובץ העבודה של מסד הנתונים כבר לא גדל ללא הגבלה
  body: |
    <ul>
      <li><strong>ליומן מסד הנתונים יש שוב תקרה.</strong> SQLite שומר קובץ עבודה (קובץ ה־<code>-wal</code>) לצד מסד הנתונים של הספרייה שלך. RetroDB התכוון להגביל אותו ל־64&nbsp;MB, אך ההגבלה חלה רק על משימות רקע &mdash; טעינות דפים ועריכות רגילות פעלו ללא הגבלה כלל. אחרי כתיבה גדולה במיוחד הקובץ נשאר לנצח בגודלו המרבי, לעיתים גדול ממסד הנתונים עצמו. כעת ההגבלה חלה בכל מקום, והשטח מוחזר.</li>
    </ul>
- version: 3.22.0
  date: '2026-07-05'
  tags:
  - type: enhancement
    label: גרדו משחק ישירות מהחלון הקופץ שלו, בלי הקפיצה הנוספת
  body: |
    <ul>
      <li><strong>גרידה מהחלון הקופץ של המשחק.</strong> החלון הקופץ המהיר של המשחק
        (זה שמופיע כשלוחצים על משחק בספרייה שלכם) כולל כעת כפתור
        <strong>גרד</strong> ליד מילוי AI וערוך. לחצו עליו ו-RetroDB יעביר אתכם
        ישירות לאותו משחק כשחיפוש המטא-נתונים כבר פתוח &mdash; אין יותר צורך לפתוח
        את הדף המלא ולחפש תחילה את כפתור הגרידה.</li>
    </ul>
- version: 3.21.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: הפעלה בלחיצה אחת — הפעילו את RetroDB מסמל מוצמד, בלי טרמינל
  - type: feature
    label: סמל אפליקציה אמיתי — גיים־פד ניאון בלשונית הדפדפן ובשורת המשימות
  - type: feature
    label: כפתור חדש לכיבוי השרת בדף ההגדרות
  body: |
    <ul>
      <li><strong>הפעלה בלחיצה אחת.</strong> ל-RetroDB יש כעת משגר אמיתי שאפשר
        להצמיד לשורת המשימות &mdash; לחצו עליו והאפליקציה תתחיל (אם היא לא כבר
        פועלת) ותיפתח בדפדפן שלכם באופן אוטומטי. אין יותר צורך לפתוח טרמינל
        ולהקליד פקודה. ב-Linux, הריצו פעם אחת
        <code>python3 scripts/install_launcher.py</code> כדי להוסיף את
        &ldquo;RetroDB&rdquo; לתפריט האפליקציות שלכם, ואז הצמידו אותו.</li>
      <li><strong>סמל אפליקציה אמיתי.</strong> RetroDB עוטה כעת סמל של גיים־פד
        ניאון &mdash; ציאן ומגנטה בסגנון סייברפאנק על משבצת כהה &mdash; בלשונית
        הדפדפן (ה-favicon), במשגר שבשורת המשימות, ובתוכנית Windows עצמה. הוא מחליף
        את סמל האמוג&rsquo;י הפשוט ששימש כמציין מקום.</li>
      <li><strong>כפתור כיבוי השרת.</strong> באזור בקרות השרת שבדף ההגדרות יש כעת
        כפתור <strong>כיבוי השרת</strong> אדום ליד הפעלה מחדש. הוא עוצר את
        האפליקציה בצורה נקייה (ומאפשר לכל משימה שרצה לסיים תחילה את השמירה), כך
        שאין יותר צורך לעבור לטרמינל וללחוץ Ctrl+C.</li>
      <li><strong>גרסאות להורדה פותחות עבורכם את הדפדפן.</strong> הורדות ה-Windows,
        Mac ו-Linux המוכנות להפעלה פותחות כעת את הדפדפן שלכם רגע לאחר ההפעלה, כך
        שהאפליקציה מולכם ללא שום צעד נוסף.</li>
    </ul>
- version: 3.20.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: אחת עשרה שפות חדשות — RetroDB מדבר כעת ב-21 שפות
  - type: fix
    label: 'תוקנה שגיאת קונסולה לא מזיקה ביציאה מרשימת המשחקים'
  body: |
    <ul>
      <li><strong>אחת עשרה חבילות שפה חדשות.</strong> הממשק של RetroDB, הערות
        ההפצה, ומדריך העזרה מתורגמים כעת ל-<strong>Afrikaans, isiZulu, isiXhosa,
        Dutch, Norwegian (Bokm&aring;l), Russian, Polish, Turkish, Ukrainian,
        Indonesian, ו-Hebrew</strong> &mdash; ומצטרפים ל-German, Spanish,
        French, Italian, Japanese, Korean, Brazilian Portuguese, ו-Simplified
        &amp; Traditional Chinese הקיימים. בחרו את שלכם תחת Settings &rarr;
        Display Preferences &rarr; Language; האפליקציה נטענת מחדש בשפה
        שבחרתם.</li>
      <li>כל שפה מכסה את כל האפליקציה: כל כפתור, תווית והודעה, כל היסטוריית הערות
        ההפצה, ומדריך העזרה המלא.</li>
      <li><strong>isiZulu &amp; isiXhosa</strong> כלולות אף הן. כשפות עם מעט
        אוצר מילים תוכנתי קיים, הן שומרות על מונחים טכניים נפוצים (ROM, scraper,
        box art) באנגלית היכן שאין מילה טבעית &mdash; הגהה של דובר שפת אם
        מתקבלת בברכה לפני שתסתמכו עליהן.</li>
      <li><strong>Hebrew</strong> מגיעה עם טקסט מתורגם במלואו; פריסת עמוד
        מלוטשת מימין-לשמאל (כך שהממשק ישקף כראוי) תגיע בעדכון מאוחר יותר.
        Arabic תבוא בעקבותיה ברגע שעבודת הפריסה הזו תושלם.</li>
      <li><strong>תיקון באג:</strong> יציאה מהספרייה או מרשימת המשחקים של מערכת כבר לא רושמת &ldquo;ReferenceError&rdquo; לא מזיק בקונסולת הדפדפן (שארית מניקוי קודם). אין השפעה גלויה &mdash; רק קונסולה נקייה יותר.</li>
    </ul>
- version: 3.19.1
  date: '2026-07-05'
  tags:
  - type: performance
    label: גירוד מהיר יותר — צילומי המסך של משחק יורדים כעת בו-זמנית
  body: |
    <ul>
      <li><strong>צילומי המסך יורדים במקביל.</strong> בעקבות אותה גישה של
        ה-frontend הפופולרי ES-DE (שמושך את כל המדיה של משחק בבת אחת), RetroDB
        מוריד כעת את צילומי המסך של משחק <strong>בו-זמנית</strong> במקום זה אחר
        זה, עבור כל המקורות (TheGamesDB, IGDB, RAWG, ScreenScraper). משחקים עם
        כמה צילומי מסך מסתיימים מהר יותר באופן ניכר.</li>
      <li>בדיקת צילומי המסך הכפולים עדיין רצה לאחר מכן לפי הסדר, כך שהסרת
        הכפילויות בתמונות נשארת מדויקת בדיוק כמו קודם &mdash; רק ההורדה הואצה.
        ההורדות מוגבלות לארבע בכל פעם כך שמקור בודד לעולם לא ייעמס יתר על
        המידה.</li>
      <li>שיפור מהירות מאחורי הקלעים; נכנס לתוקף לאחר ההפעלה מחדש הבאה.</li>
    </ul>
- version: 3.19.0
  date: '2026-07-05'
  tags:
  - type: performance
    label: גירוד מהיר יותר — המקורות נשאלים כעת בו-זמנית
  body: |
    <ul>
      <li><strong>הגירוד מהיר יותר לכל משחק.</strong> כאשר RetroDB מחפש משחק,
        הוא בודק כמה מסדי נתונים (ES-DE, TheGamesDB, IGDB, RAWG, ScreenScraper).
        בעבר הוא שאל אותם <em>אחד אחרי השני</em> והמתין לתשובה מכל אחד לפני
        שפנה לבא &mdash; כך שההמתנה הייתה סכום של כולם. כעת הוא שואל את כולם
        <strong>בבת אחת</strong> וממתין רק לאיטי ביותר, וזהו זירוז ניכר בכל
        משחק. התוצאות עדיין ממוינות ומדורגות בדיוק כמו קודם.</li>
      <li><strong>פחות לחיצות יד מבוזבזות בהורדת עטיפות.</strong> הורדות התמונות
        מנצלות כעת מחדש חיבור שכבר פתוח במקום לפתוח חדש לכל תמונה בודדת, וכך
        נחסך זמן במשחקים עם הרבה צילומי מסך.</li>
      <li>אלו שיפורי מהירות מאחורי הקלעים &mdash; שום דבר לא משתנה באופן שבו
        אתם משתמשים ב-RetroDB, וזה לא מעמיס יותר על מסדי הנתונים (אותן בקשות,
        פשוט חופפות). נכנסים לתוקף לאחר ההפעלה מחדש הבאה.</li>
    </ul>
- version: 3.18.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: נוספו דירוגי גיל סיניים (סין) כמערכת הדירוג התשיעית
  body: |
    <ul>
      <li><strong>מערכת דירוג גיל חדשה: סין (CADPA).</strong> RetroDB תומך כעת
        בתוכנית הרשמית הסינית להמלצת גיל למשחקים (&ldquo;网络游戏适龄提示&rdquo;,
        שהונפקה על ידי CADPA) לצד שמונה הגופים הקיימים (ESRB, PEGI, CERO,
        USK, ACB, FPB, GRAC ו-ClassInd). היא משתמשת בשלוש רמות &mdash;
        <strong>8+</strong>, <strong>12+</strong> ו-<strong>16+</strong>
        &mdash; המוצגות עם תג ירוק פשוט.</li>
      <li><strong>היא ממלאת את עצמה, כמו האחרות.</strong> כאשר למשחק כבר יש
        דירוג מכל מדינה אחרת, RetroDB מחשב את רמת סין המתאימה באופן אוטומטי
        (ולהפך). ניתן גם לבחור או לשנות אותה ידנית במסך העריכה של משחק, ולבחור
        אותה כמערכת התצוגה המועדפת שלכם תחת הגדרות &rarr; ספרייה. הערה: רוב
        מסדי הנתונים המערביים של משחקים אינם מפרסמים דירוג סיני, ולכן עבור
        משחקים ללא דירוג בכלל היא ממולאת מתוכן המשחק במהלך הגירוד / AI Fill.</li>
      <li>התגים הירוקים הם איור פשוט משל RetroDB (התואם את הסגנון הביתי של
        הגופים האחרים), ולא הלוגו הרשמי של CADPA, כך שאין שום מגבלות רישוי
        תמונה.</li>
    </ul>
- version: 3.17.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: ניקוי רשומות מסד הנתונים עבור קובצי מדיה שחסרים מהדיסק
  - type: security
    label: הגנה מפני מחיקת כל העטיפות של הספרייה שלכם כאשר תיקיית מדיה נעלמת
  body: |
    <ul>
      <li><strong>כלי תחזוקה חדש: &ldquo;הפניות מדיה חסרות&rdquo;</strong>
        (הגדרות &rarr; מערכת &rarr; תחזוקה). זוהי תמונת הראי של ניקוי
        &ldquo;מדיה יתומה&rdquo; הקיים: במקום למצוא קובצי תמונה שנותרו ללא
        משחק, הוא מוצא משחקים שעטיפת הקופסה, עטיפת הקופסה התלת-ממדית, צילומי
        המסך, ה-fanart, הווידאו או המדריך שלהם מפנים לקבצים שכבר אינם על
        הדיסק. סרקו אותם, ואז נקו את ההפניות המיושנות הללו בלחיצה אחת כדי
        שהגורדים יוכלו להוריד מחדש את העטיפות. רשומות המשחקים עצמן לעולם אינן
        נוגעות.</li>
      <li><strong>ניקוי אוטומטי בטוח יותר במהלך הגירוד.</strong> כאשר RetroDB
        גורד מחדש משחק הוא מנקה בשקט הפניות לקובצי מדיה שנעלמו מהדיסק. בעבר,
        אם תיקיית מדיה שלמה נעלמה בבת אחת &mdash; כונן חיצוני שלא הותקן, או
        מחיקה המונית &mdash; ניקוי זה עלול היה למחוק את הרשומה של אילו עטיפות
        היו לאלפי משחקים, ולאלץ גירודים מחדש יקרים. RetroDB מזהה כעת אות זה:
        אם תיקיית מדיה חסרה או ריקה לחלוטין, הוא שומר על ההפניות ורושם אזהרה
        ביומן במקום למחוק אותן. כלי התחזוקה החדש מיישם את אותה הגנה ומסמן
        בבירור כל תיקייה שהוא עצר.</li>
    </ul>
- version: 3.16.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: לוח "תיקונים מהירים" חדש בלוח המחוונים
  body: |
    <ul>
      <li><strong>לוח &ldquo;תיקונים מהירים&rdquo; חדש בלוח המחוונים</strong>
        הופך מטלות ספרייה מפוזרות לרשימת מטלות במבט אחד. הוא מציג לכמה משחקים
        עדיין חסרה עטיפת קופסה, ומספק קיצורי דרך בלחיצה אחת למציאת ROM-ים
        כפולים ולבדיקת נתיבי ROM שבורים (משחקים שהקבצים שלהם הועברו או נמחקו).
        כל קיצור דרך מקשר ישירות אל הדף שמתקן אותו. הלוח מופיע ברגע שיש לכם
        משחקים בספרייה.</li>
    </ul>
- version: 3.15.0
  date: '2026-07-03'
  tags:
  - type: accessibility
    label: קוראי מסך מכריזים כעת בקול על התקדמות המשימות
  body: |
    <ul>
      <li><strong>משימות ארוכות טווח מדווחות כעת על התקדמותן לקוראי
        מסך.</strong> כאשר גירוד המוני, סנכרון הישגים (RetroAchievements או
        PlayStation), או שינוי גודל תמונה רצים, משתמשי קוראי מסך היו רגילים
        לא לשמוע דבר בין &ldquo;התחיל&rdquo; ל&ldquo;הסתיים&rdquo;. RetroDB
        מכריז כעת על אבני דרך תקופתיות (לדוגמה &ldquo;גירוד המוני: 12 מתוך
        40&rdquo;) ועל השלמה מדוברת &mdash; ללא חלוניות קופצות נוספות על המסך.
        ההכרזות מקוצבות כך שהן מיידעות מבלי לפטפט, והן עוקבות אחר השפה
        שבחרתם.</li>
    </ul>
- version: 3.14.0
  date: '2026-07-01'
  tags:
  - type: feature
    label: שפות חדשות — סינית (מפושטת ומסורתית) זמינה כעת
  body: |
    <ul>
      <li><strong>RetroDB זמין כעת בסינית.</strong> שתי אפשרויות נמצאות תחת
        <strong>הגדרות &rarr; מערכת &rarr; שפה</strong>: <strong>中文
        (简体)</strong> (מפושטת, עבור סין היבשתית) ו-<strong>中文
        (繁體)</strong> (מסורתית, עבור הונג קונג וטייוואן). כל הממשק &mdash;
        תפריטים, כפתורים, הודעות, ומדריך העזרה שבתוך האפליקציה &mdash; מתורגם,
        וכל דבר שעדיין לא תורגם חוזר בשקט לאנגלית. זה מביא את השפות הנתמכות
        לעשר (אנגלית, גרמנית, ספרדית, צרפתית, איטלקית, יפנית, פורטוגזית
        ברזילאית, קוריאנית, וכעת סינית מפושטת ומסורתית).</li>
    </ul>
- version: 3.12.0
  date: '2026-06-30'
  tags:
  - type: feature
    label: שפה חדשה — קוריאנית (한국어) זמינה כעת
  body: |
    <ul>
      <li><strong>RetroDB זמין כעת בקוריאנית (한국어).</strong> בחרו אותה תחת
        הגדרות &rarr; מערכת &rarr; שפה. כל הממשק &mdash; תפריטים, כפתורים,
        הודעות, ומדריך העזרה שבתוך האפליקציה &mdash; מתורגם, ומביא את השפות
        הנתמכות לשמונה (אנגלית, גרמנית, ספרדית, צרפתית, איטלקית, יפנית,
        פורטוגזית ברזילאית, וקוריאנית). קוריאנית משלימה את הכיסוי לכל גוף
        דירוג גיל למשחקים ש-RetroDB מציג, כולל ה-GRAC של דרום קוריאה.</li>
    </ul>
- version: 3.11.0
  date: '2026-06-30'
  tags:
  - type: enhancement
    label: תמכו ב-RetroDB ב-Patreon — נוסף קישור תרומה חדש
  body: |
    <ul>
      <li><strong>כעת ניתן לתמוך ב-RetroDB ב-Patreon.</strong> קישור Patreon
        נמצא לצד כפתור &ldquo;Sponsor on GitHub&rdquo; הקיים תחת
        <strong>הגדרות &rarr; מערכת &rarr; תמיכה בפיתוח</strong>, בלוח האודות,
        וב-README של הפרויקט. RetroDB נשאר חינמי לחלוטין וקוד פתוח &mdash;
        תרומות הן אופציונליות לגמרי ופשוט עוזרות לשמור על המשך הפיתוח
        היחידני.</li>
    </ul>
- version: 3.10.0
  date: '2026-06-26'
  tags:
  - type: enhancement
    label: יומן השינויים נטען כעת מהר יותר עם כפתור "טען עוד"
  body: |
    <ul>
      <li><strong>דף יומן השינויים נפתח כעת הרבה יותר מהר.</strong> במקום לצייר
        את כל היסטוריית הגרסאות (מאות רשומות) בכל פעם שאתם פותחים אותו, RetroDB
        מציג כעת את 20 הרשומות האחרונות ומוסיף כפתור <strong>טען עוד</strong>
        בתחתית. לחצו עליו כדי לחשוף את האצווה הבאה, וכן הלאה &mdash; ההיסטוריה
        הישנה עדיין שם במלואה, היא פשוט נטענת לפי דרישה במקום להאט את התצוגה
        הראשונה.</li>
    </ul>
- version: 3.9.0
  date: '2026-06-17'
  tags:
  - type: feature
    label: מדריך העזרה והערות ההפצה האחרונות מתורגמים כעת לכל 6 השפות
  body: |
    <ul>
      <li><strong>מדריך העזרה המלא שבתוך האפליקציה זמין כעת בכל שש
        השפות</strong> &mdash; גרמנית, צרפתית, ספרדית, איטלקית, יפנית
        ופורטוגזית ברזילאית &mdash; לא רק באנגלית. RetroDB מציג את המדריך
        בשפה שבחרתם בהגדרות, וחוזר בשקט לאנגלית אם משהו עדיין לא תורגם.</li>
      <li><strong>יומן שינויים זה מופיע כעת גם בשפה שלכם</strong> עבור ההפצות
        האחרונות ביותר, וההפצות החדשות יתורגמו מכאן והלאה. היסטוריה ישנה
        נשארת באנגלית.</li>
      <li><strong>דף רשימת המשאלות והשאריות האחרונות של טקסט אנגלי</strong>
        &mdash; אצווה של הודעות שגיאה וסטטוס קופצות שהוחמצו כאשר חבילות השפה
        נחתו לראשונה ב-3.8.0 &mdash; מתורגמים כעת כראוי ברחבי האפליקציה.</li>
    </ul>
- version: 3.8.2
  date: '2026-06-17'
  tags:
  - type: security
    label: עדכון תלות אבטחה + תיקוני CI
  body: |
    <ul>
      <li><strong>אבטחה:</strong> עודכנה ספריית <code>cryptography</code>
        הכלולה (47 → 49) כדי לנקות התראה שפורסמה (GHSA-537c-gmf6-5ccf).
        אין שינוי בהתנהגות — פשוט גרסה בטוחה יותר.</li>
      <li>תוקן צינור הבדיקות האוטומטי: עוזר לבדיקה בלבד שחסר
        (<code>beautifulsoup4</code>) הכשיל את הרצת הבדיקות מאז v3.7.0,
        וסקריפט בניית האריזה החדש הפעיל בדיקת ניתוח סטטי שהיא תוצאה
        חיובית-כוזבת ידועה (הוא מריץ פקודות בנייה מהימנות, לא קלט משתמש)
        — כעת מתועד ומכויל. תחזוקה בלבד; שום דבר לא משתנה באפליקציה
        עצמה.</li>
    </ul>
- version: 3.8.1
  date: '2026-06-17'
  tags:
  - type: improvement
    label: אפשרות הורדה קטנה יותר, סידור תרומות ותיקון תרגום (Pass 46.3 / 47.6)
  body: |
    <ul>
      <li><strong>הורדה קטנה בהרבה בדרך.</strong> את גרסת ה&ldquo;פשוט לחלץ
        ולהקליק פעמיים&rdquo; המוכנה-להרצה של RetroDB ניתן כעת לבנות בגרסת
        <strong>מעבד-בלבד</strong> (~600&nbsp;MB) עבור אנשים שאין להם כרטיס
        מסך של AMD &mdash; בערך שישית מגודל הגרסה המלאה. שתיהן יוצעו זו לצד
        זו כדי שתוכלו לבחור את זו שמתאימה למחשב שלכם.</li>
      <li><strong>לוח &ldquo;תמיכה בפיתוח&rdquo; בהגדרות מתורגם כעת</strong>
        יחד עם שאר האפליקציה &mdash; הוא נשאר בטעות באנגלית כאשר חבילות השפה
        נחתו ב-3.8.0.</li>
      <li>סודרו קישורי התרומה (תג GitHub Sponsors ב-README; קובץ המימון מוכן
        ל-Patreon ול-Buy&nbsp;Me&nbsp;A&nbsp;Coffee ברגע שאלה יוגדרו). ללא
        מסכי נדנוד, לעולם.</li>
      <li>מאחורי הקלעים: צינור ההפצה יכול כעת לבנות את הגרסאות המוכנות-להרצה
        עבור Windows, macOS ו-Linux באופן אוטומטי. הערה: מדריך ה<em>עזרה</em>
        הארוך שבתוך האפליקציה עדיין באנגלית בלבד לעת עתה &mdash; זה רשום
        כעבודה עתידית.</li>
    </ul>
- version: 3.8.0
  date: '2026-06-12'
  tags:
  - type: feature
    label: תרגום ממשק מלא + 6 שפות (Pass 43.2/43.3/43.5)
  body: |
    <ul>
      <li><strong>RetroDB מדבר כעת ב-6 שפות נוספות.</strong> בהתבסס על התשתית
        מ-3.7.0, כל הממשק הפך לניתן-לתרגום ותורגם מכונה ל<strong>גרמנית,
        צרפתית, ספרדית, איטלקית, יפנית ופורטוגזית ברזילאית</strong>. בחרו את
        השפה שלכם תחת הגדרות &rarr; העדפות תצוגה &rarr; שפה; היא עוקבת אחר
        ההעדפה השמורה שלכם, אחר כך אחר הדפדפן שלכם, ואז חוזרת לאנגלית &mdash;
        היא לעולם לא יכולה להיתקע על שפה חסרה.</li>
      <li><strong>כל דבר שעל המסך מכוסה</strong>: טקסט הדף וכפתורים, הודעות
        קופצות (התראות ה&ldquo;טוסט&rdquo; הקטנות), חלוניות העריכה וההגדרות,
        טיפים, ותוויות קוראי מסך. ז'אנרים של משחקים, נקודות מבט ומצבי משחק
        (למשל &ldquo;First-Person-Shooter&rdquo;) מוצגים כעת גם בשפה שלכם
        &mdash; בעוד הנתונים הבסיסיים נשארים באנגלית כך שהספרייה והמסננים
        שלכם ממשיכים לעבוד בדיוק כמו קודם.</li>
      <li><strong>שפת &ldquo;פסאודו&rdquo; מובנית</strong> (הנראית בתפריט השפה)
        היא כלי בקרת איכות של מתרגם שמקיף בסוגריים ומדגיש כל תווית, וכך הופך
        למובן מיד אם טקסט כלשהו הוחמץ.</li>
      <li>תרגומי מכונה הם נקודת התחלה ועשויים להיקרא מעט נוקשים במקומות מסוימים
        &mdash; קל לחדד אותם עם הזמן, וכל טקסט ללא תרגום פשוט מוצג
        באנגלית.</li>
    </ul>
