  - type: feature
    label: ライブラリを複数のジャンル、シリーズ、パブリッシャーで同時に絞り込めるように
  body: |
    <ul>
      <li><strong>RetroDB 専用のゲームプレイヤーを迎える準備が整いました。</strong>RetroArch をもとにしたプレイヤーを RetroDB 向けに開発中です。これが届くと、RetroDB はゲームごとに選んだ設定でゲームをそのプレイヤーで起動し、プレイ中に変更した設定も保持します。セーブと設定は専用のフォルダーに保存され、あなた自身の RetroArch とは分けられます。コンソールごとに最適なコアを選び、初めてプレイを押したときにダウンロードします。その間、ボタンには「コアをダウンロード中…」と表示されます。動作するエミュレーターがないコンソールをプレイでき、あなたが設定したエミュレーターを置き換えることはありません。ゲームごとに、別のコア、画面効果、整数倍スケーリング、入力遅延の軽減を選べます。管理者はすべてのコアを一度にインストールまたは更新したり、ダウンロードをオフにしたりできます。プレイヤーがインストールされるまでは何も変わりません。それまでは 設定 &gt; エミュレーター にも表示されません。</li>
      <li><strong>ミュージアムのタブがまた切り替わるように。</strong>バージョン 3.30.0 以降、コンソールのミュージアムページで「仕様」「トップ10ゲーム」「コントローラー」をクリックしても何も起きず、「予期しないエラー」というメッセージが表示されていました。現在はすべてのタブが開きます。</li>
      <li><strong>フォルダーとして保存された PlayStation 3 のゲームをプレイできるように。</strong>PS3 のディスクゲームは通常、名前が「.PS3」で終わるフォルダーです。RetroDB は単一のファイルを想定していたため、起動を拒否し、プレイボタンも表示しませんでした。現在は RPCS3 が想定するとおり、フォルダーをエミュレーターに渡します。</li>
      <li><strong>「メタデータを検索」の列がそろい、スマートフォンにも収まるように。</strong>表示しきれないほど結果が多いソースにはスクロールバーが付き、そのぶんタイトルの幅が狭くなっていました。そのため、同じタイトルがある列では折り返し、隣の列では折り返さないことがありました。現在はすべての列が同じ幅を保ち、テーマに合った細いスクロールバーが付きます。スマートフォンや狭いウィンドウでは、検索ウィンドウが隠れたサイドバーの横に押し込められていましたが、現在は画面いっぱいに表示されます。</li>
      <li><strong>Windows や Mac に新しくインストールすると RetroArch のコア名が正しく設定されるように。</strong>RetroDB はどこでも Linux のコアファイル名で RetroArch を設定していたため、Windows と macOS ではコアが見つかりませんでした。新しいインストールでは、各コンピューター固有の名前を使います。既存のインストールは今の名前のままです。マッピング表で変更してください。</li>
      <li><strong>スクリーンショットビューアーの左右の矢印が、どちらもボタンの中に表示されるように。</strong>サイドバーが左の矢印を覆っていたため、マウスで前のスクリーンショットに戻れませんでした。右の矢印もボタンの下にずれていました。現在はどちらも表示され、ボタンの中央に収まります。</li>
      <li><strong>エミュレーターの設定ページがあなたの言語で表示されるように。</strong>設定 &gt; エミュレーター の大部分は、どの言語を選んでも英語のままでした。見出し、エミュレーターの表、スキャン結果、「エミュレーターを編集」ウィンドウです。現在はすべて翻訳されています。</li>
      <li><strong>「プレイヤー数」欄に 16 より大きい数を入力できるように。</strong>どちらの編集ウィンドウも 16 で止まっていたため、MAG の 256 人を入力できませんでした。スクレイパーが 16 より大きい数を設定したゲームは、数を減らすまで保存すらできませんでした。現在は上限がありません。</li>
      <li><strong>AI補完が PC ゲームにコンソールではなく PC のセーブタイプを設定するように。</strong>AI が PlayStation 2 版について説明したため、Windows のゲームに「メモリーカード」が設定されることがありました。現在は、あなたのゲームのプラットフォームでのリリースについて説明するよう AI に指示しています。PC と、PlayStation 3 や Xbox 360 以降のコンソールは、本体ストレージにセーブします。</li>
      <li>すでに間違ったセーブタイプが設定されているゲームを直すには、もう一度スクレイピングするか、AI補完を実行してください。どちらも AI に改めて問い合わせ、古い値を置き換えます。</li>
      <li><strong>PlayStation の接続で、先にサインインするよう案内されるように。</strong>設定 &gt; アカウント &gt; PSN で、PlayStation にサインイン済みでない限り、Sony のアカウントページには「Invalid login」としか表示されず、手順にもそのことが書かれていませんでした。現在はステップ 1 に、最初に押す「PlayStation にサインイン」ボタンがあります。</li>
      <li><strong>ライブラリの並び替えと、未スクレイピングのゲームだけの表示。</strong>ライブラリと各システムページのゲーム数の横に「並び替え」メニューが付きました。名前、発売日の新しい順・古い順、評論家スコア、ユーザースコア、最近追加した順から選べます。日付やスコアのないゲームは最後に並びます。A–Z バーは名前で並び替えたときに使え、それ以外のときはグレー表示になります。新しい「未スクレイピング」ボタンは、まだどのスクレイパーも情報を入れていないゲームだけを表示します。</li>
      <li><strong>何も一致しないフィルターでは、そのことを表示。</strong>以前はページが空白になっていました。現在は一致するゲームがないことを表示し、フィルターを解除するボタンを出します。</li>
      <li><strong>ライブラリのフィルターバーで、すべてが定位置にとどまるように。</strong>以前は「選択」を押したり、絞り込んだり並び替えたりすると、ゲームがページの下へ押し下げられていました。現在は選択ツールがウィンドウ下部のバーに表示されます。「消去」は常に表示され、フィルターがオンになるまではグレー表示です。有効なフィルターはゲーム数の横に表示されます。「Show Bonus」は「ボーナスディスク」になり、オンのときは点灯します。スマートフォンでは、フィルターのボタンは 1 つの「フィルター」ボタンからページの上に開きます。</li>
      <li><strong>空のライブラリに、スキャンボタン付きの案内を表示。</strong>以前は、新しいインストールで健全性スコアが 0% のまま止まり、ライブラリは空白でした。現在はどちらのページもライブラリが空であることを伝え、「ライブラリをスキャン」ボタンを表示します。ダッシュボードには ROM フォルダーの設定へのリンクもあります。管理者でないユーザーには、管理者に頼むよう案内します。「ランダムゲーム」は、選べるゲームができるまで表示されません。</li>
      <li><strong>「ライブラリをスキャン」がシステムページと設定から動作するように。</strong>この 2 つの「ライブラリをスキャン」ボタンは、押しても何も起きませんでした。動いていたのはダッシュボードのボタンだけでした。ダッシュボードの「ライブラリをスキャン」ボタンは、スキャンを許可されている唯一のユーザーである管理者にだけ表示されるようになりました。</li>
      <li><strong>セットアップウィザードが、現在のステップと任意のステップを表示。</strong>「ステップ 3 / 6」と表示し、各ステップに番号を付け、通過したステップにチェックを入れ、ES-DE と「API キー」を任意として示します。スマートフォンでは、番号と現在のステップの名前を表示します。</li>
      <li><strong>ライブラリを複数のジャンル、シリーズ、パブリッシャーで同時に絞り込めるように。</strong>「ジャンル」「シリーズ」「パブリッシャー」「デベロッパー」「プレイモード」「視点」「次元」のフィルターで、好きなだけ値にチェックを入れて「適用」を押すと、そのどれかを持つゲームが表示されます。ウィンドウを「が一致しない」に切り替えると、チェックした値のどれかを持つゲームを隠せます。値ごとにタグが付き、その ✕ でその値だけを外せます。</li>
    </ul>
