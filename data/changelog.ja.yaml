- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: RetroDB は本物の ROM ファイル形式でのみ起動・名前変更を行うように
  body: |
    <ul>
      <li><strong>ROM ではないファイルでゲームが起動できてしまうことがありました。</strong>
        ROM の名前変更ではどんな名前でも受け付けていたため、
        <code>crash.bin</code> を <code>crash.cfg</code> に変えると、
        そのファイルがエミュレーターに渡されていました。現在は起動時に、そのシステムフォルダーの
        <code>systeminfo.txt</code> にある一覧（ライブラリのスキャンが使うのと同じ一覧）と
        ファイル形式を照合し、名前変更でもその一覧にない形式は拒否します。
        システムフォルダーに一覧がない場合、そのゲームは起動せず、
        メッセージに見つからないファイル名が表示されます。</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: ゲームの起動引数を変更できるのは管理者だけに
  - type: fix
    label: 複数の単語や余分な引用符を含む起動引数が正しく動作するように
  - type: fix
    label: 終了した起動の記録をすべてメモリに残し続けないように
  body: |
    <ul>
      <li><strong>編集者が、ほかのコードを実行する起動引数を追加できてしまいました。</strong>
        ゲームの<em>カスタム起動引数</em>はそのままエミュレーターに渡され、
        RetroArch ではコンピューター上の任意のプログラムファイルを読み込めてしまいました。
        現在は変更に管理者の役割が必要で、それ以外の人にはこの欄が表示されません。</li>
      <li><strong>複数の単語からなる起動引数が、1つにまとまってエミュレーターに届いていました。</strong>
        <code>--a --b</code> は2つの引数として届くようになり、空の値は何も追加しません。
        閉じ引用符が抜けていると、以前はそのゲームの起動がすべてサーバーエラーで
        失敗していましたが、現在は直すべき欄を示すメッセージが表示されます。
        <code>{disc_paths}</code> トークンは削除しました。常に空だったためです。</li>
      <li><strong>終了した起動の記録が、RetroDB を再起動するまでメモリにたまり続けていました。</strong>
        1時間以上前に終了した起動の記録は消去されるようになりました。</li>
    </ul>
