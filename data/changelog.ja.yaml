- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: メタデータの適用で進み具合が表示されるように
  body: |
    <ul>
      <li><strong>メタデータの適用で進み具合が表示されるように。</strong>メタデータを検索で結果を選ぶと、リングが0%から100%まで満ちていき、中央にその割合が表示されます。その下の行には、どのサイトを検索しているか、どの画像や動画をダウンロードしているか、または画像を処理中であるかといった、今行われている処理が表示されます。動画などの大きなダウンロードでは、データが届くにつれてリングが進みます。100%になると、これまでどおり結果を反映してページが再読み込みされます。</li>
      <li>リングの進み方は均一でないことがあります。各ソースは応答した時点で初めて送る画像の数を決めるため、画像の多い最初のソースがリングの大部分を満たし、後のソースの分が少なくなることがあります。</li>
      <li>適用に失敗した場合は、リングが閉じてその旨のメッセージが表示され、ページは再読み込みされません。</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: すべてのページがウィンドウの大きさに合わせて表示されるように
  - type: enhancement
    label: ゲームページで別名を専用のカードに表示、マニュアルボタンも追加
  body: |
    <ul>
      <li><strong>すべてのページがウィンドウの大きさに合わせて表示されるようになりました。</strong>
        カード形式のページ（システム、ミュージアム、タグ、リスト、ROMツール、トロフィー、実績）は、
        カードがもう1枚まるごと収まるたびに列が増え、1行に最大4枚まで並びます。
        表、ツール、詳細ページは少しだけ広がりますが、それ以上広げても列の間隔が
        空くだけになるところで止まります。設定ページの各ボックスは読みやすい幅を保ちます。</li>
      <li><strong>ヘルプと変更履歴は読みやすい行の長さを保ちます。</strong>
        広いウィンドウでは、ヘルプの各セクションへのリンクが本文の横の列に移ります。
        狭いウィンドウでは、スマートフォンの画面の大部分を覆っていたブロックの代わりに、
        スワイプできる1行に並びます。</li>
      <li><strong>ゲームページ：</strong>広いウィンドウでは、スクリーンショットが上部に横一列に並び、
        その下に動画と新しい<strong>別名</strong>カードがカバー画像と同じ高さで横並びになります。
        別名はこれまでタイトルの下に薄い文字で表示されていましたが、読みやすいカードに
        まとめられました。<strong>マニュアル</strong>はプレイの隣のボタンになり、
        取得履歴は最初は折りたたまれた状態で表示されます。</li>
      <li>PSNトロフィーは、常に3列ではなく、ウィンドウに合わせて1～4列で表示されます。</li>
      <li>スマートフォンで横スクロールしてしまうページがいくつか直りました：トロフィー、
        コレクタートロフィー、RetroAchievements のシステムページ、ヘルプ、設定、
        分析、ゲームインポート、実績とトロフィーの詳細ページ。
        これらのページでは、幅の広い表は表の中だけでスクロールするようになりました。</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: ライブラリ、システム、ゲームの各ページがウィンドウの大きさに合わせて表示されるように
  body: |
    <ul>
      <li><strong>広いウィンドウは、役に立つときだけ、その広さを使います。</strong>
        ライブラリと各システムページは、ゲームカードがもう1枚まるごと収まるたびに
        列が増え、1行に最大4枚まで並びます。スマートフォンでは1枚、画面半分のウィンドウでは
        2～3枚、広いウィンドウでは4枚です。これまでは決まった幅で止まり、
        大きなウィンドウの大部分が空いたままでした。</li>
      <li><strong>ゲームページでは、カバー画像と詳細情報がスクリーンショットと動画の横に並びます。</strong>
        横に並べて収まらないときは縦に積み重ねます。説明文は読みやすい行の長さを保ちます。</li>
      <li><strong>プレイボタンは各カードの右上に移動し、</strong>
        小さく中央揃えになりました。さらに、ゲームの ROM ファイルがまだ存在し、
        そのシステムが受け付けるファイル形式であるかも確認するようになったため、
        押せば確実にゲームが始まるところにだけ表示されます。ゲームをまとめて選択している間は
        非表示になります。</li>
      <li>「トップへ戻る」ボタンと進行状況のポップアップは、ウィンドウの端ではなく、
        ページの内容のすぐ横に表示されるようになりました。</li>
      <li>ゲームページがスマートフォンで横スクロールしなくなりました。</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: テスト用の「Pseudo」言語は管理者にのみ表示されるように
  body: |
    <ul>
      <li><strong>「Pseudo」が全員の言語一覧に表示されなくなりました。</strong>
        これはすべての文字を括弧とアクセント記号付きで表示する開発者向けのツールのため、
        管理者にのみ表示されるようになりました。それ以外の人がこれを選んでいた場合は、
        アプリが英語で表示され、設定でも英語が選択された状態になります。</li>
    </ul>
- version: 3.24.1
  date: '2026-10-17'
  tags:
  - type: fix
    label: Windows 版ダウンロードが再びインストールできるように、ウィンドウサイズ変更後のエラー連発も解消
  body: |
    <ul>
      <li><strong>通常の Windows 版ダウンロードがインストールできませんでした。</strong>
        インストーラーが「Core dependencies failed to install」で止まっていました。
        固定されたパッケージ一覧に、Windows だけが必要とするパッケージが含まれていなかったためです。
        現在の一覧はすべてのプラットフォームに対応しています。Python 不要の
        Windows 版ダウンロードには影響はありませんでした。</li>
      <li><strong>右上にエラーメッセージが表示され続けていました。</strong>
        Cyberpunk テーマで、ブラウザのウィンドウを広げたとき（たとえば最大化したとき）に
        起きていました。アニメーション背景が正しくサイズ変更されるようになりました。</li>
    </ul>
- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: ライブラリとシステムページから直接ゲームをプレイ
  body: |
    <ul>
      <li><strong>各ゲームカードに ▶ プレイボタン。</strong>ライブラリページと
        各システムページで、ボックスアートの左下に表示されます。押すとゲームが
        エミュレーターで起動します。先にゲームのページを開く必要はなく、一覧に留まったままです。</li>
      <li>このボタンは、押して実際に動く場合にだけ表示されます。つまり、あなたのアカウントに
        ゲームの起動が許可されていて、ゲームのエミュレーターが有効かつインストール済みで、
        RetroArch の場合はコアがそろっているときです。動作するエミュレーターがない
        システムのゲームにはボタンが表示されません。</li>
      <li>それでも起動に失敗した場合（たとえば ROM ファイルが移動されていたとき）は、
        理由がメッセージで表示され、ページはそのままの状態に保たれます。</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: サイドバーを短く、すべてのプラットフォームの実績を1つのページに
  body: |
    <ul>
      <li><strong>5つのリンクが1つの「実績」リンクになりました。</strong>
        RetroAchievements、RPCS3、PSN、Steam、Xbox が1つのページのタブになり、
        リンクを開くと前回使ったタブが表示されます。RetroAchievements のゲームが
        1つもない場合は、ダッシュボードに戻されるのではなく RPCS3 タブが開きます。</li>
      <li><strong>ROMレポートは ROMツールの中に移りました。</strong>ほかのツールと並ぶタブとして、
        また ROMツールページのカードとして表示されます。</li>
      <li><strong>サイドバーのリンクでアイコンが重複しなくなりました：</strong>ダッシュボードは
        🏠、ログビューアは 🧾 になりました。サイドバーのリンクは 21 個から
        16 個に減りました。</li>
      <li>ROMツール設定ページのツールタブは常に英語で表示されていましたが、
        選んだ言語で表示されるようになりました。</li>
    </ul>
- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: How Long To Beat の検索が再び動作するように
  body: |
    <ul>
      <li><strong>How Long To Beat で検索すると、どのゲームも見つからないと表示されていました。</strong>
        サイトが検索を新しいアドレスに移したため、RetroDB からの要求が拒否されていました。
        この不具合は7月下旬から9月下旬の間に発生しました。RetroDB は新しいアドレスを使い、
        プラットフォームと発売年の絞り込みを、サイトの新しい形式で送るようになりました
        （古い形式はサイトが無視するようになっていました）。1本ずつの検索も、ROMツールでの
        一括検索も、再び動作します。</li>
    </ul>
- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: RetroDB は海賊版を容認しないことを明記
  - type: fix
    label: 概要ダイアログが再び本来の大きさで開くように
  body: |
    <ul>
      <li><strong>アプリ内に海賊版に関する注意書きが加わりました。</strong>
        概要ダイアログと、設定の ROMライブラリパスの下に、すべての言語で表示されます。
        RetroDB は ROM ファイルを配布もホストもしないこと、自分が所有するディスクや
        カートリッジからコピーしたゲームだけを使うべきこと、そして RetroDB はどの
        ゲーム機メーカー、パブリッシャー、ゲームデータベースとも提携していないことを伝えています。
        文言は RetroDB のウェブサイトとトレーラーと同じです。</li>
      <li><strong>概要ダイアログがサイドバーの中に押し込まれていました。</strong>
        画面の中央に通常の大きさで開くようになり、小さな画面ではタイトルや閉じるボタンが
        隠れる代わりにスクロールするようになりました。</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: RetroDB は本物の ROM ファイル形式でのみ起動・名前変更を行うように
  body: |
    <ul>
      <li><strong>ROM ではないファイルでゲームが起動できてしまうことがありました。</strong>
        ROM の名前変更ではどんな名前でも受け付けていたため、
        <code>crash.bin</code> を <code>crash.cfg</code> に変えると、
        そのファイルがエミュレーターに渡されていました。現在は起動時に、そのシステムフォルダーの
        <code>systeminfo.txt</code> にある一覧（ライブラリのスキャンが使うのと同じ一覧）と
        ファイル形式を照合し、名前変更でもその一覧にない形式は拒否します。
        システムフォルダーに一覧がない場合、そのゲームは起動せず、
        メッセージに見つからないファイル名が表示されます。</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: ゲームの起動引数を変更できるのは管理者だけに
  - type: fix
    label: 複数の単語や余分な引用符を含む起動引数が正しく動作するように
  - type: fix
    label: 終了した起動の記録をすべてメモリに残し続けないように
  body: |
    <ul>
      <li><strong>編集者が、ほかのコードを実行する起動引数を追加できてしまいました。</strong>
        ゲームの<em>カスタム起動引数</em>はそのままエミュレーターに渡され、
        RetroArch ではコンピューター上の任意のプログラムファイルを読み込めてしまいました。
        現在は変更に管理者の役割が必要で、それ以外の人にはこの欄が表示されません。</li>
      <li><strong>複数の単語からなる起動引数が、1つにまとまってエミュレーターに届いていました。</strong>
        <code>--a --b</code> は2つの引数として届くようになり、空の値は何も追加しません。
        閉じ引用符が抜けていると、以前はそのゲームの起動がすべてサーバーエラーで
        失敗していましたが、現在は直すべき欄を示すメッセージが表示されます。
        <code>{disc_paths}</code> トークンは削除しました。常に空だったためです。</li>
      <li><strong>終了した起動の記録が、RetroDB を再起動するまでメモリにたまり続けていました。</strong>
        1時間以上前に終了した起動の記録は消去されるようになりました。</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: 設定での言語の選択が再び動作するように
  body: |
    <ul>
      <li><strong>設定 &rarr; ライブラリ &rarr; 表示 で言語を選んでも、
        何も起きませんでした。</strong>代わりにエラーが表示され、ページは元の言語のままでした。
        これは 3.23.8 で壊れていました。現在は言語を選ぶと保存され、
        ページがその言語で再読み込みされます。</li>
    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: トロフィーとプラットフォームのアイコンがダウンロードに戻りました
  body: |
    <ul>
      <li><strong>ダウンロードに RetroDB のトロフィーとプラットフォームのアイコンが
        含まれていませんでした。</strong>RetroAchievements のあるゲームカードでは、
        バッジの位置に壊れた画像が表示され、トロフィーのランクや PSN、Steam、
        Xbox、RPCS3 のロゴも表示されませんでした。現在はすべてのダウンロードに
        含まれています。</li>
    </ul>
- version: 3.23.14
  date: '2026-10-10'
  tags:
  - type: security
    label: 同梱の2つのライブラリを公開済みのセキュリティ修正版に更新
  body: |
    <ul>
      <li><strong>urllib3 と Werkzeug に既知のセキュリティ問題がありました。</strong>
        RetroDB は、それらを修正したバージョンである urllib3 2.8.0 と Werkzeug 3.1.9 を
        同梱するようになりました。ソースからインストールした場合は、
        <code>install.py</code> をもう一度実行すると更新されます。
        <code>requirements.lock</code> からインストールされます。</li>
    </ul>
- version: 3.23.13
  date: '2026-09-26'
  tags:
  - type: fix
    label: フォルダーパスとして保存されたメディアが見つからないと報告されなくなりました
  body: |
    <ul>
      <li><strong>スタンドアロン版で、「見つからないメディア参照の消去」が、
        実際には存在するメディアを空にしてしまうことがありました。</strong>これは、データベースが
        メディアをファイル名だけでなく <code>images/boxart/…</code> のような
        フォルダーパスとして保存していた場合に起きていました。RetroDB は
        正しいフォルダーを探すようになりました。</li>
    </ul>
- version: 3.23.12
  date: '2026-09-26'
  tags:
  - type: fix
    label: ダッシュボードに実行中の一括取得を表示、ほか4つの小さな修正
  body: |
    <ul>
      <li><strong>ダッシュボードの取得進行状況カードが表示されていませんでした。</strong>
        一括取得の実行中に表示されるようになり、一時停止中であればそのことも表示されます。</li>
      <li><strong>ログインページでブラウザのコンソールにエラーが出なくなりました。</strong>
        誰もログインしていない間は、バックグラウンドジョブを確認しないようにしました。</li>
      <li><strong>セットアップウィザードは、保存に失敗したときに「Setup complete!」と
        表示しなくなりました。</strong>代わりに、設定を保存できなかったことを知らせます。</li>
      <li><strong>同じ秒に開始された2つの一括取得が、同じ ID を共有しなくなりました。</strong>
        そのため、キャンセルなどのキュー操作が正しい方に働きます。</li>
    </ul>
- version: 3.23.11
  date: '2026-09-26'
  tags:
  - type: ui
    label: 寄付ボタンが何を支援するのかを明示するように
  body: |
    <ul>
      <li><strong>寄付の文言をわかりやすくしました。</strong>ヘッダーのボタンは
        「スポンサー」と「Patreon で支援」になりました。README には、すべての
        リリースが無料であること、そして寄付は RetroDB 自体の資金となり、RetroDB が
        起動できるエミュレーターやコアのためのものではないことが書かれています。</li>
    </ul>
- version: 3.23.10
  date: '2026-09-26'
  tags:
  - type: fix
    label: ROMツールのページが保存した設定に従うように、ログと ROMツールのページも再び動作
  body: |
    <ul>
      <li><strong>ログページと一部の ROMツールのページが壊れていました。</strong>
        これらのページのスクリプトが読み込み時に失敗していたため、ログビューアと
        ROMツール共通の補助機能が起動していませんでした。現在は正しく読み込まれます。</li>
      <li><strong>ROMツールの設定が実際に反映されるようになりました。</strong>重複ファインダーと
        CHDコンバーターは、ROMツール設定ページの値でオプションが設定された状態で開きます。
        1回の実行だけ変更することもこれまでどおり可能です。</li>
      <li><strong>CHDコンバーターのスイッチが無視されていました。</strong>ページ上で
        「元のファイルを削除」をオフにしても、保存した設定が削除する設定になっていれば
        削除が止まりませんでした。現在はページ上のスイッチが優先されます。</li>
      <li><strong>一時フォルダーの設定が使われるようになりました。</strong>M3U プレイリストの
        作成中に一時的に置かれるファイルは、そのフォルダーの中に置かれます。</li>
    </ul>
- version: 3.23.9
  date: '2026-09-26'
  tags:
  - type: security
    label: 取得ツールのログファイルにパスワードやトークンを保存しないように、ログイン試行の回数制限も復活
  - type: fix
    label: 設定の保存で設定が消えなくなり、ユーザーの削除も動作するように
  body: |
    <ul>
      <li><strong>ログファイルに秘密情報が平文で残っていました。</strong>取得ツールのログ
        ファイルではサインイン用のトークンや API キーを隠すはずでしたが、隠す処理が
        一度も実行されず、そのまま書き込まれていました。現在は隠されます。
        古いログファイルにはまだ含まれているため、インストールを他人と共有する場合は
        <code>logs/</code> 内の古いファイルを削除してください。</li>
      <li><strong>ログイン試行の回数制限が効いていませんでした。</strong>繰り返しのログインや
        負荷の大きい操作（スキャン、取得、インポート）への制限は、設定されていたものの
        一度も有効になっていませんでした。現在は動作し、ブロックされた要求には
        「試行回数が多すぎます」というわかりやすいメッセージが返ります。</li>
      <li><strong>壊れた設定ファイルが消されてしまうことがありました。</strong>
        <code>data/settings.json</code> を読み込めなかった場合、次の保存で既定値に
        置き換えられていました。現在は保存する前に、壊れたファイルを
        <code>settings.json.corrupt-&lt;time&gt;</code> として残します。
        ファイルがまた正常に読み込めるようになった場合は、代わりに保存を拒否します。</li>
      <li><strong>エンジンの命名行がほかの設定を失っていました。</strong>命名設定の
        エンジン行にタグを追加すると失敗し、さらに一緒に保存されていた冠詞と地域の設定も
        消えていました。現在は正しく保存されます。</li>
      <li><strong>ユーザーの削除に失敗していました。</strong>タグ、リスト、ウィッシュリストの
        項目、PSN データを持つユーザーは削除できませんでした。現在はユーザーと、
        そのユーザーが持つすべてのデータが削除されます。</li>
      <li><strong>2つの取得が同時に実行されることがありました。</strong>キューの中で
        実行中の一括取得を入れ替えたり移動したりすると、1つの進行状況カウントを共有する
        2つの取得が始まっていました。現在は1つだけが実行されます。</li>
      <li><strong>一括取得の進行状況がエラーのように見えることがありました。</strong>
        最初に成功するまでの間、一括取得は一部の画面が失敗と解釈する形で状態を
        報告していました。これを修正しました。</li>
      <li><strong>ログイン後、開こうとしていたページに戻るようになりました。</strong>
        以前は常にダッシュボードに移動していました。</li>
      <li><strong>管理者のファイル操作は、自分のフォルダーの中だけで行われます。</strong>
        画像サイズ変更ツールと ROM の名前変更操作は、メディアフォルダーや ROM フォルダーの
        外にあるものを拒否するようになりました。</li>
      <li><strong>古い PSN と Xbox のサインインファイルがあなたのアカウントに移されます。</strong>
        残っていた <code>data/psn_tokens.json</code> や
        <code>data/xbox_tokens.json</code> はアカウントに読み込まれ、名前の末尾が
        <code>.migrated-015</code> に変更されます。このファイルにはまだトークンが
        含まれているため、サインインが動作することを確認したら削除してください。</li>
      <li><strong>サーバーからのエラーがわかりやすくなりました。</strong>不正な要求には、
        「内部エラーが発生しました」ではなく、適切なエラーメッセージが返るようになりました。</li>
    </ul>
- version: 3.23.8
  date: '2026-09-25'
  tags:
  - type: fix
    label: CLZ インポートが再び動作、リストのカバーが表示、アポストロフィで複数のページが壊れなくなりました
  - type: security
    label: 取得した名前やファイルパスがページのボタンから抜け出せないように
  body: |
    <ul>
      <li><strong>CLZ インポートが何もしていませんでした。</strong>CLZ の PDF をアップロードすると、
        サーバーに存在しないアドレスに送られていたため、すべてのアップロードが
        「Parse failed」で失敗していました。現在は解析処理に届きます。</li>
      <li><strong>リストページのカバーがすべて表示されていませんでした。</strong>リストページが
        各カバーを間違ったアドレスに要求しており、システム列も常に空でした。
        どちらも表示されるようになりました。ページ内の「ゲームを追加」検索のカバー画像も
        修正しました。</li>
      <li><strong>アポストロフィを含む名前でボタンが壊れていました。</strong>
        「Assassin's Creed」をリストから外す、スクリーンショットを削除する、カバーを拡大する、
        ジャンルタグを外すといった操作が、名前にアポストロフィが含まれていると
        何も言わずに失敗することがありました。同じ欠陥により、細工された取得名で
        ページ内のコードを実行できてしまいました。現在は、名前がコードと誤解されない方法で
        ボタンに渡されます。</li>
      <li><strong>画像とリンクのアドレスがすべての場所でエスケープされるようになりました。</strong>
        いくつかのページが、取得したファイル名をエスケープせずに画像のアドレスを
        組み立てており、5つのページが独自の弱いエスケープ処理のコピーを持っていました。
        現在はすべて共通のものを使います。</li>
      <li><strong>設定ページが空白で開くことがありました。</strong>最後に使ったタブの名前が
        アップデートで変わっていた場合、設定はパネルが何も表示されない状態で開いていました。
        現在は存在しなくなったタブを無視します。<code>/settings#account</code> のような
        リンクで、そのタブが再び開くようになりました。</li>
      <li><strong>テーマがほかの端末にも引き継がれるようになりました。</strong>選んだテーマは
        アカウントに保存されます。一度もテーマを指定されていないブラウザでは、
        既定のテーマではなく保存されたテーマが使われます。</li>
      <li><strong>ジョブの進行状況ポップアップに正しいアイコンが表示されます。</strong>
        一時停止中、完了、待機中のジョブにも同じ「実行中」アイコンが表示されていました。
        現在は状態ごとに、テーマに合わせたアイコンがあります。</li>
      <li><strong>キーボードショートカット一覧が翻訳できるようになりました。</strong>その表示名が
        翻訳ツールから見えていなかったため、どの言語でも英語のままでした。</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: 年齢レーティングがよく間違っていた問題と、取得したゲームの詳細が失われる問題を修正
  body: |
    <ul>
      <li><strong>年齢レーティングが頻繁に間違っており、その誤りが広がっていました。</strong>
        TheGamesDB からレーティングを取得したとき、アプリは正しく読み取る代わりに
        文中のどこかにあるレーティングコードを探していました &mdash; そのため
        「T - Teen」「M - Mature 17+」「AO - Adults Only 18+」
        「RP - Rating Pending」はすべて間違ったレーティングとして保存され、Mature の
        ゲームが全年齢向けとして登録されることもありました。さらに悪いことに、その間違った
        レーティングがほかの8つのレーティングシステムの補完にも使われ、1回の読み違いが
        すべてに広がっていました。現在は文頭のコードからレーティングを読み取ります。</li>
      <li><strong>変換されたレーティングが甘くなっていました。</strong>すでにあるレーティングから
        欠けているレーティングを補完するとき、アプリは実際に元からあったものではなく、
        直前に算出したばかりのレーティングを使うことがありました。変換を重ねるたびに
        厳しさが少しずつ失われていました。現在は常に、ゲームが実際に持っている
        レーティングから変換します。</li>
      <li><strong>完全再取得が、手で選んだ地域とセーブタイプを消していました。</strong>
        どちらも取得元から来るものではなく、アプリが算出するものです &mdash; そのため
        完全再取得を行うと、あなたが設定した「Japan」が既定の「USA」に
        置き換えられていました。現在は、取得元が本当に新しい値を提供しない限り、
        あなたの値が保たれます。</li>
      <li><strong>取得ツールが間違ったゲームを採用することがありました。</strong>ScreenScraper の
        結果は通常、使う前に一致度スコアで確認されますが、検索結果がちょうど1件だった場合は
        その確認が完全に省かれていました。現在はすべての結果がスコア付けされます。</li>
      <li><strong>1つの欄が欠けているだけで、ゲームの取得した詳細がすべて失われることがありました。</strong>
        IGDB や ScreenScraper が予想外の形で1つの欄を空にしていると、パブリッシャー、
        デベロッパー、アートワークなどを含む更新全体が破棄されていました。現在はそうした
        場合も処理され、残りの詳細は保たれます。</li>
      <li><strong>失敗した画像が成功として記録されることがありました。</strong>ダウンロードした
        画像が使えない画像だった場合、アプリは何も削除せずにファイル名を保存しており、
        壊れた参照が残っていました。現在はファイルを削除し、欄はそのままにします。</li>
      <li><strong>ゲームモードの表記が統一されました。</strong>取得ツールによって
        「Single-player」と「Single-Player」、さらにアプリ独自の表示名にない単なる
        「Multiplayer」と書かれていたため、それらのゲームは翻訳されず、モードの
        絞り込みにも一致しませんでした。現在はすべての取得元が同じ表示名を書き込みます。
        既存のゲームは、再取得するか設定の正規化ツールを実行するまで古い表記のままです。</li>
      <li><strong>Xbox の検索がほかの取得元と同じ動作をするようになりました。</strong>
        Xbox の検索は独自にウェブ要求を行っていたため、Xbox Live から速度を落とすよう
        求められても再試行せず、応答で読み込むデータ量にも上限がありませんでした。
        現在はほかの取得ツールと同じ共通の接続を使います。</li>
      <li><strong>使われていない ScreenScraper のコードを削除しました。</strong>アプリのどこからも
        呼ばれていない2つの関数を削除しました。そのうち1つは ScreenScraper のパスワードを
        含んだままのウェブアドレスを返しており、それを使うものすべてにパスワードを渡して
        しまうおそれがありました。3.6.x のリリースノートに記載されていた
        「System Media Endpoint」はこのうちの1つです &mdash; アプリのどこからも
        到達できないものでした。</li>
    </ul>
- version: 3.23.5
  date: '2026-09-02'
  tags:
  - type: fix
    label: パッケージ版ダウンロードが起動できなかった問題と、そのほかのビルドの修正
  body: |
    <ul>
      <li><strong>スタンドアロン版ダウンロードがまったく起動できませんでした。</strong>
        パッケージ版は独自の Python を同梱していますが、中のランチャーはソース版インストール用に
        書かれたものでした &mdash; パッケージ版には含まれていない Python ファイルを探しに行き、
        最初の行で止まっていました。現在は専用のランチャーを同梱しており、アプリを実行して
        サーバーが起動したらブラウザを開くだけです。</li>
      <li><strong>Linux 版ダウンロードのデスクトップショートカットは何も起動しませんでした。</strong>
        アプリへのパスが入るべき場所に仮の文字列が入ったまま配布されていました。現在は
        ランチャーの隣に <code>install-launcher.sh</code> があります
        &mdash; 一度実行すると、展開した場所への実際のパスでショートカットが作成されます。</li>
      <li><strong>ソースから起動すると、検証されていない依存パッケージがインストールされていました。</strong>
        Flask がない場合、起動スクリプトはチェックサムの確認なしにインターネットから
        直接パッケージを取得し、その際にシステムのパッケージマネージャーも無理に
        押し切っていました。現在はチェックサム付きのロックファイルを使う
        <code>install.py</code> に処理を任せます。</li>
      <li><strong>ソース版ダウンロードに、含めるべきでない保守担当者向けのファイルが
        入っていました。</strong>除外するものの一覧は手作業で管理されており、更新が
        追いついていなかったため、監査の出力や残っていたビルドフォルダーがアプリと一緒に
        パッケージされていました。現在はプロジェクトに実際にあるファイルの一覧から
        ダウンロードが作られるため、ずれが生じることはありません。</li>
      <li><strong>パッケージ版で設定の2つのパネルが壊れていました。</strong>ライブラリ統計と
        API ステータスのパネルが、パッケージ版の中では使われていない名前でメイン
        プログラムを探していたため、どちらも失敗していました。</li>
      <li><strong>画面上の一部の文字が翻訳できませんでした。</strong>アプリの比較的新しい
        3つの部分 &mdash; エミュレーター設定、起動ボタン、「プレイ中」バー &mdash; が
        翻訳用のスキャンから漏れており、それを見つけるはずのチェックも同じ不完全な一覧を
        見ていました。現在はスキャンがすべてのファイルを自動的に対象にし、それらの文字も
        翻訳に追加されました。</li>
      <li><strong>翻訳の再構築が、何も言わずに何もしないことがありました。</strong>
        ページ専用のスクリプトに文字を追加しても、再構築は何もすることがないと判断して
        しまい、新しい文字が翻訳ファイルに届いていませんでした。</li>
      <li><strong>グラフィックカード向けの回避策が全員に適用されていました。</strong>
        Linux の起動スクリプトが、特定の AMD カード1種類のための設定をすべてのマシンに
        強制しており、ほかの AMD ハードウェアでは画像アップスケーラーが固まることが
        ありました。現在はそのカードが実際にある場合にだけ適用され、あなたが自分で
        設定した値を上書きすることはありません。</li>
      <li><strong>リリーススクリプトが間違ったバージョンを公開することがありました。</strong>
        以前の試行で残ったタグが何も言わずに再利用されたため、成功と報告しながら
        古いスナップショットからビルドされることがありました。</li>
    </ul>
- version: 3.23.4
  date: '2026-09-02'
  tags:
  - type: fix
    label: ライブラリのデータが失われる9つの経路をふさぎました
  body: |
    <ul>
      <li><strong>「取得データを消去」がライブラリ全体を消していました。</strong>
        確認ボックスは実際に取得済みのゲームだけを数えていましたが、操作はそれに関係なく
        すべてのゲームを消していました &mdash; そのため十数本と約束しながら何千本も
        消すことがありました。画像も対象にしていると、一度も取得していないゲームでも、
        手でアップロードしたカバーアートを削除し、自分で編集したタイトルを元に戻していました。
        現在は確認ボックスに書かれたとおりのことだけを行います。</li>
      <li><strong>3D ボックスアートが壊れたリンクを残していました。</strong>画像も含めて消去すると、
        3D カバーはディスクから削除されるのに、データベースはそれを指したままだったため、
        アプリはもう存在しないファイルを探していました。</li>
      <li><strong>一括編集の「追加」スイッチが、追加ではなく置き換えをしていました。</strong>
        視点と次元では表示とまったく逆の動作をし、選択したすべてのゲームの既存の値を
        一度に上書きしていました。元に戻すこともできませんでした。</li>
      <li><strong>スタンドアロン版で、1回のクリックですべての画像参照が消えることがありました。</strong>
        パッケージ版ダウンロードでは、アプリがメディアを間違った場所で探し、すべての画像が
        見つからないと判断していました。そのうえで「見つからないメディア参照の消去」を行うと、
        ライブラリ全体のアート、スクリーンショット、動画、マニュアルの項目が空になっていました。
        まさにこれを防ぐための安全チェックも、この状況を検出できませんでした。
        影響を受けたのはパッケージ版だけです。</li>
      <li><strong>不要ファイルの一掃処理が、届いたばかりのアートを削除することがありました。</strong>
        一掃処理の実行中にダウンロードされたカバーが、不要ファイルとして扱われて
        削除されることがありました。</li>
      <li><strong>プレイリスト作成が、確認なしにアーカイブを移動していました。</strong>
        M3U プレイリストを一括作成すると、そのオプションをオフにしていても元のアーカイブ
        ファイルが移動されていました &mdash; そしてオンにしたときは、成功した移動を
        失敗と報告していました。</li>
      <li><strong>画像リサイズ機能がメディアフォルダーを膨らませていました。</strong>
        自分で生成した小さなサムネイルを、拡大すべき新しい画像として扱い、フルサイズに
        拡大したうえで、さらにそのサムネイルを作っていました。実行するたびにファイルが増え、
        ページはサムネイルの代わりにフルサイズの画像を黙って配信し、AI アップスケーラーは
        想定のおよそ3倍のファイル数を処理していました。</li>
      <li><strong>AI による補完が、あなたが修正した詳細を上書きしていました。</strong>
        通常の取得で、パブリッシャー、デベロッパー、ジャンル、年齢レーティングなど、
        あなた自身が設定した値を置き換えることがありました。現在は空欄だけを埋めます。
        自分で押す AI補完ボタンの動作は変わりません。</li>
      <li><strong>繰り返し取得すると、正常なスクリーンショットが削除されることがありました。</strong>
        RAWG から取得したゲームは同じファイル名を使い回していたため、2回目の取得で
        保存済みのスクリーンショットが上書きされ、ライブラリにはまだ記載されているのに
        重複として削除されていました。</li>
    </ul>
- version: 3.23.3
  date: '2026-09-01'
  tags:
  - type: fix
    label: 家族向けの役割が書かれたとおりに動作し、無効にしたアカウントは確実に締め出されるように
  body: |
    <ul>
      <li><strong>アカウントを無効にすると、そのセッションも終了するようになりました。</strong>
        アカウントを無効にするとすべての画面から見えなくなりましたが、そのアカウントで
        すでにサインインしていた人は、最大1週間そのまま普通に使い続けられました。
        削除せずに締め出す方法は無効化しかないため、現在は相手の次のクリックで
        すぐに効果が出ます。</li>
      <li><strong>読み取り専用アカウントはゲームデータを変更できなくなりました。</strong>
        「クリア時間」に関する3つの操作が、閲覧のみのアカウントを含め、サインインしている
        全員に開放されていました — そのため読み取り専用アカウントでもプレイ時間を
        上書きしたり、ライブラリのすべてのゲームから消したりできました。現在は、ゲームを
        変更するほかの操作と同様に編集権限が必要です。</li>
      <li><strong>トロフィー記録機能が再び全員で使えるようになりました。</strong>
        自分のコレクタートロフィーを更新するには編集者の権限が必要でしたが、プレイヤーと
        閲覧者の役割にはその権限がありません — しかもトロフィーを書き込むのは
        この操作だけです。そのため、これらのアカウントは一度もトロフィーを獲得できず、
        更新ボタンはエラーを表示するだけでした。これは自分自身の進行状況なので、
        現在は特別な権限は一切不要です。</li>
      <li><strong>ある人の PlayStation の更新を、ほかの人が止めることはできなくなりました。</strong>
        サインインしているどのアカウントでも、ほかの人が始めた更新を一時停止したり
        キャンセルしたりでき、その人がどのゲームを処理中かも見えていました。
        現在はどちらも、更新を始めた本人だけに制限されています。</li>
      <li><strong>Steam のインポートは、最初に保存した人ではなく、あなた自身のアカウントを
        使います。</strong>ライブラリのインポートは、あなたのものではなく共有の Steam 認証情報を
        1つだけ読んでいたため、ほかの人のライブラリを取得してしまうことがありました
        — しかもあなた自身が保存した情報は見つからないように見えていました。</li>
      <li><strong>管理者パスワードの推測が再び難しくなりました。</strong>サインイン失敗回数の
        制限がネットワーク上の全員で共有されていたため、自分のアカウントを持つ人なら誰でも
        サインインして制限をリセットし、いつまでも推測を続けられました。現在の制限は
        アカウントごとです。</li>
      <li><strong>アプリのエラーが消えずにページに届くようになりました。
        </strong>操作が拒否されたとき、そのうち 115 件がページで読み取れない形で応答して
        いたため、操作が成功したように見えていました。現在は拒否を正しく報告し、
        本当のメッセージが表示されます。</li>
    </ul>
- version: 3.23.2
  date: '2026-08-06'
  tags:
  - type: fix
    label: 取得ツールの設定ページの読み込みが速くなり、古い API キーが表示されなくなりました
  body: |
    <ul>
      <li><strong>設定ページと取得ツール設定ページが、要求のたびに取得ツールの設定ファイルを
        読み直さなくなりました。</strong>共通のキャッシュ付き読み込み処理がすでにあるのに、
        4つの箇所がページやチェックを実行するたびにディスクからファイルを開いて
        解析し直していました。現在はすべてがその共通処理を使うため、これらのページの
        1回あたりの処理が減りました。</li>
      <li><strong>保存は今までどおりすぐに反映されます。</strong>時間が来ると内容を忘れる
        キャッシュだと、保存後最大30秒ほど古い値が表示される可能性がありました。現在は
        保存のたびに書き込みと同時にキャッシュを消去するため、表示されるのは今保存した
        内容です。</li>
      <li><strong>本物の API キーが、伏せ字の表示値で置き換えられることはなくなりました。</strong>
        設定ページでは、保存済みのキーを本物ではなく <code>***1234</code> のように
        表示します。ページに渡されていたのが取得ツールと同じ設定のコピーだったため、
        この伏せ字が本物のキーをメモリ上で上書きし、キャッシュが切れるまで取得ツールが
        アスタリスクでサインインしてしまう可能性がありました。</li>
      <li><strong>スタンドアロン版で、取得ツールが正しい場所の設定を探すようになりました。</strong>
        取得ツールは、設定を保存するページとは異なる方法でファイルの場所を決めていました。
        通常のインストールではどちらも同じファイルになりましたが、スタンドアロン版
        （ダブルクリックで起動する版）ではそうならず、保存した API キーが取得ツールの
        探さない場所に書き込まれる可能性がありました。</li>
    </ul>
- version: 3.23.1
  date: '2026-08-06'
  tags:
  - type: fix
    label: 設定で保存したサーバーポートが実際に使われるように
  body: |
    <ul>
      <li><strong>サーバーポートを保存すると、実際にサーバーがそのポートに移ります。</strong>
        設定はポートを受け付けて確認し、保存したうえで、反映には再起動が必要だと
        表示していました &mdash; ところが、サーバーはそれでも 5000 番で起動していました。
        保存した値を読み戻す処理がどこにもなかったのです。現在は起動処理の一部になっているため、
        再起動すると RetroDB は本当に選んだポートに移ります。環境変数で設定したものが
        引き続き優先されるため、ポートを割り当てるランチャーやコンテナーには影響ありません。</li>
      <li><strong>何の効果もなかった2つの設定は、修理せずに削除しました。</strong>
        「サーバーホスト」と「デバッグモード」も保存され、同じ偽りの約束をしていました。
        ウェブのフォームからデバッグモードをオンにすると、ブラウザ上で対話型の Python
        コンソールが公開されてしまいます。また、バインドアドレスはどのマシンが RetroDB に
        接続できるかそのものを決めます &mdash; どちらも設定フォームの奥に置くべきものでは
        ありません。どちらも、もともとあった環境変数から引き続き設定できます。
        設定ファイルにまだ残っている場合は、読み込み時に黙って取り除かれます。
        何もする必要はありません。</li>
      <li><strong>再起動で反映されないものについて、再起動で反映されると表示することは
        なくなりました。</strong>本当の欠陥はそこでした &mdash; 使われない設定は見苦しいだけですが、
        偽りの約束は午後をまるごと無駄にさせます。</li>
    </ul>
- version: 3.23.0
  date: '2026-08-06'
  tags:
  - type: enhancement
    label: ほかのツールが選んだポートで RetroDB を起動
  body: |
    <ul>
      <li><strong>RetroDB が環境変数の <code>PORT</code> 設定を読むようになりました。</strong>
        ほかのツール &mdash; ダッシュボード、コンテナー、ホームサーバーの管理画面 &mdash; から
        RetroDB を起動する場合、そのツールが誰にもファイルを編集させることなく、
        使ってほしいポートを RetroDB に渡せるようになりました。
        <code>PORT</code> を設定すれば RetroDB はそのポートで待ち受け、設定しなければ
        何も変わりません。既存の <code>RETRODB_PORT</code> もこれまでとまったく同じように動作し、
        両方が設定されている場合は <code>PORT</code> が優先されます。</li>
      <li><strong>不正なポート番号は、推測せずにそう伝えるようになりました。</strong>
        以前は、読み取れないポートを指定すると Python のエラー文が大量に表示され、
        使用できる範囲外のポートはサーバーの起動に失敗して初めてわかりました。
        現在の RetroDB は、使えなかった値を示す1行を表示してすぐに停止します。
        頼まれたポートと違うポートで黙って起動することは決してありません &mdash;
        黙って移されるのは、断られるよりも悪いことだからです。</li>
      <li><strong>起動時の表示とブラウザのタブが、実際のポートに従うようになりました。</strong>
        RetroDB の起動時に表示されるアドレスと、自動で開くページは、実際に使われている
        ポートに関係なく、以前はどちらも 5000 番になっていました。</li>
    </ul>
- version: 3.22.1
  date: '2026-07-31'
  tags:
  - type: fix
    label: データベースの作業ファイルが際限なく肥大化しないように
  body: |
    <ul>
      <li><strong>データベースジャーナルに再び上限。</strong>SQLite はライブラリのデータベースと並んで作業ファイル（<code>-wal</code> ファイル）を保持します。RetroDB はこれを 64&nbsp;MB に制限するつもりでしたが、その上限はバックグラウンドジョブにしか適用されていませんでした &mdash; 通常のページ表示や編集にはまったく上限がなかったのです。一度でも異常に大きな書き込みが起きると、作業ファイルは最大サイズのまま戻らず、データベース本体より大きくなることもありました。今ではどこでも上限が効くため、容量が解放されます。</li>
    </ul>
- version: 3.22.0
  date: '2026-07-05'
  tags:
  - type: enhancement
    label: ゲームをポップアップから直接取得、余計な手間なし
  body: |
    <ul>
      <li><strong>ゲームのポップアップから取得。</strong>クイックゲームポップアップ
        （ライブラリでゲームをクリックすると表示されるもの）に、AI補完と編集の隣に
        <strong>取得</strong>ボタンが追加されました。クリックすると RetroDB が
        メタデータ検索を開いた状態でそのゲームへ直接移動します &mdash; もう
        フルページを開いて取得ボタンを探す必要はありません。</li>
    </ul>
- version: 3.21.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: ワンクリック起動 — ピン留めしたアイコンから RetroDB を起動、ターミナル不要
  - type: feature
    label: 本物のアプリアイコン — ブラウザのタブとタスクバーにネオンのゲームパッド
  - type: feature
    label: 設定ページに新しい「サーバーをシャットダウン」ボタン
  body: |
    <ul>
      <li><strong>ワンクリックで起動。</strong>RetroDB にタスクバーへピン留めできる
        本格的なランチャーが追加されました &mdash; クリックするとアプリが起動し
        （まだ起動していない場合）、自動的にブラウザで開きます。ターミナルを開いて
        コマンドを入力する必要はもうありません。Linux では
        <code>python3 scripts/install_launcher.py</code> を一度実行して
        アプリメニューに &ldquo;RetroDB&rdquo; を追加し、ピン留めしてください。</li>
      <li><strong>本物のアプリアイコン。</strong>RetroDB がネオンのゲームパッド
        アイコンをまといました &mdash; 暗いタイルにサイバーパンクのシアンとマゼンタ
        &mdash; ブラウザのタブ（ファビコン）、タスクバーのランチャー、そして
        Windows のプログラム自体に表示されます。素っ気ない絵文字のプレースホルダーに
        代わるものです。</li>
      <li><strong>サーバーをシャットダウンボタン。</strong>設定ページの
        サーバー制御に、再起動の隣に赤い <strong>サーバーをシャットダウン</strong>
        ボタンが追加されました。アプリをクリーンに停止します（実行中のジョブが
        まず保存を完了できるようにします）。ターミナルに切り替えて Ctrl+C を
        押す必要はもうありません。</li>
      <li><strong>ダウンロード版はブラウザを自動で開きます。</strong>すぐに実行できる
        Windows、Mac、Linux 版のダウンロードは、起動の少し後に自動でブラウザを
        開くようになりました。余計な手順なしでアプリが目の前に表示されます。</li>
    </ul>
- version: 3.20.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: 新たに11言語を追加 — RetroDB は合計21言語に対応
  body: |
    <ul>
      <li><strong>新しい言語パックが11種類追加されました。</strong>RetroDB の
        インターフェース、リリースノート、ヘルプマニュアルが
        <strong>Afrikaans、isiZulu、isiXhosa、Dutch、Norwegian（Bokmål）、
        Russian、Polish、Turkish、Ukrainian、Indonesian、Hebrew</strong>に
        翻訳されました &mdash; 既存の German、Spanish、French、Italian、
        Japanese、Korean、Brazilian Portuguese、Simplified &amp; Traditional
        Chinese に加わります。設定 &rarr; 表示設定 &rarr; 言語 から
        お好みの言語を選べます。選んだ言語でアプリが再読み込みされます。</li>
      <li>各言語はアプリ全体をカバーします。すべてのボタン、ラベル、
        メッセージ、リリースノートの全履歴、ヘルプガイド全文が対象です。</li>
      <li><strong>isiZulu &amp; isiXhosa</strong> も含まれます。既存の
        ソフトウェア用語がまだ少ない言語のため、自然な訳語がない場合は
        一般的な技術用語（ROM、scraper、box art）を英語のまま残しています
        &mdash; ネイティブスピーカーによる校正を歓迎します。</li>
      <li><strong>Hebrew</strong> は翻訳テキストが完成していますが、右から
        左へのレイアウト（インターフェースが正しく反転する表示）の整備は
        今後のアップデートで提供予定です。Arabic はそのレイアウト対応が
        完了次第、追加されます。</li>
    </ul>
- version: 3.19.1
  date: '2026-07-05'
  tags:
  - type: performance
    label: スクレイピングが高速化 — ゲームのスクリーンショットを同時にダウンロード
  body: |
    <ul>
      <li><strong>スクリーンショットを並行してダウンロード。</strong>人気のフロント
        エンド ES-DE（ゲームのメディアを一度にまとめて取得する方式）と同じ考え方で、
        RetroDB はゲームのスクリーンショットを 1 枚ずつ順番にではなく
        <strong>同時に</strong>ダウンロードするようになりました。すべての取得元
        （TheGamesDB、IGDB、RAWG、ScreenScraper）に対応しています。スクリーン
        ショットが多いゲームでは、目に見えて早く完了します。</li>
      <li>重複スクリーンショットのチェックは、これまでどおりダウンロード後に順番に
        実行されるため、画像の重複除去の精度はまったく変わりません &mdash; 速く
        なったのはダウンロードの部分だけです。取得元に負荷をかけすぎないよう、
        同時ダウンロードは最大 4 件までに制限されています。</li>
      <li>内部的な速度改善で、次回の再起動後に有効になります。</li>
    </ul>
- version: 3.19.0
  date: '2026-07-05'
  tags:
  - type: performance
    label: スクレイピングが高速化 — 各データベースへの問い合わせを同時に実行
  body: |
    <ul>
      <li><strong>1 ゲームあたりのスクレイピングが高速化。</strong>RetroDB はゲームを
        調べるとき、複数のデータベース（ES-DE、TheGamesDB、IGDB、RAWG、
        ScreenScraper）を参照します。以前は<em>1 つずつ</em>問い合わせ、それぞれの
        応答を待ってから次に進んでいたため、待ち時間はすべての合計でした &mdash;
        いまはすべてに<strong>同時に</strong>問い合わせ、最も遅い 1 つを待つだけに
        なったので、どのゲームでも目に見えて高速化します。結果の並び順とスコア付けは
        これまでとまったく同じです。</li>
      <li><strong>アート画像のダウンロード時の無駄な接続を削減。</strong>画像の
        ダウンロードは、1 枚ごとに新しい接続を開くのではなく、すでに開いている接続を
        再利用するようになり、スクリーンショットの多いゲームで時間を短縮します。</li>
      <li>これらは内部的な速度改善で &mdash; RetroDB の使い方は何も変わらず、
        データベースへの負荷も増えません（リクエスト内容は同じで、重ねて実行する
        だけです）。次回の再起動後に有効になります。</li>
    </ul>
- version: 3.18.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: 9 つ目のレーティング機関として中国（China）の年齢レーティングを追加
  body: |
    <ul>
      <li><strong>新しい年齢レーティング機関: 中国（CADPA）。</strong>RetroDB は既存の
        8 機関（ESRB、PEGI、CERO、USK、ACB、FPB、GRAC、ClassInd）に加えて、中国の
        公式なゲーム年齢目安制度（&ldquo;网络游戏适龄提示&rdquo;、CADPA が発行）に
        対応しました。<strong>8+</strong>、<strong>12+</strong>、<strong>16+</strong>
        の 3 段階 &mdash; を、シンプルな緑色のバッジで表示します。</li>
      <li><strong>他の機関と同じように自動で入力されます。</strong>ゲームに他の国の
        レーティングがすでにある場合、RetroDB は対応する中国の段階を自動的に割り出します
        （逆も同様です）。ゲームの編集画面で手動で選択・変更したり、<strong>設定
        &rarr; ライブラリ</strong>で優先的に表示するレーティング機関として選んだりする
        こともできます。注意: 欧米のゲームデータベースの多くは中国のレーティングを
        公開していないため、どこにもレーティングがないゲームでは、スクレイピングや
        AI Fill の際にゲームの内容から入力されます。</li>
      <li>緑色のバッジは RetroDB 独自のシンプルな画像（他機関と同じデザイン様式）で
        あり、CADPA の公式ロゴではないため、画像のライセンス上の制約は一切ありません。</li>
    </ul>
- version: 3.17.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: ディスク上に存在しないメディアファイルへの参照をデータベースから削除
  - type: security
    label: メディアフォルダが見つからないときにライブラリ全体のアート情報が消えるのを防止
  body: |
    <ul>
      <li><strong>新しいメンテナンス機能: &ldquo;不明なメディア参照&rdquo;</strong>
        （設定 &rarr; システム &rarr; メンテナンス）。これは既存の
        &ldquo;孤立したメディア&rdquo;のクリーンアップの逆にあたる機能です。ゲームの
        ない余分な画像ファイルを探すのではなく、ボックスアート、3D ボックスアート、
        スクリーンショット、ファンアート、動画、マニュアルが、すでにディスク上に
        存在しないファイルを指しているゲームを見つけ出します。それらをスキャンし、
        古くなった参照をワンクリックで削除すれば、スクレイパーがアートを再ダウンロード
        できるようになります。ゲームの登録情報そのものには一切手を加えません。</li>
      <li><strong>スクレイピング中の自動クリーンアップをより安全に。</strong>RetroDB は
        ゲームを再スクレイピングする際、ディスクから消えたメディアファイルへの参照を
        そっと削除します。以前は、外付けドライブのアンマウントや一括削除などで
        メディアフォルダがまるごと一度に消えてしまった場合 &mdash; そのクリーンアップが
        何千ものゲームのアート情報の記録を消し去り、コストのかかる再スクレイピングを
        強いることがありました。RetroDB はこの兆候を認識するようになり、メディア
        フォルダが見つからない、または完全に空の場合は、参照を削除せずに保持して警告を
        記録します。新しいメンテナンス機能も同じ保護を備えており、保留にしたフォルダを
        はっきりと表示します。</li>
    </ul>
- version: 3.16.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: ダッシュボードに新しい「クイック修正」パネルを追加
  body: |
    <ul>
      <li><strong>ダッシュボードの新しい&ldquo;クイック修正&rdquo;パネル</strong>は、
        あちこちに散らばったライブラリの作業を、ひと目で分かるやることリストに
        まとめます。まだボックスアートが不足しているゲームの数を表示し、重複した
        ROM を見つける、リンク切れの ROM パス（ファイルが移動または削除されたゲーム）
        を確認する、といった操作へのワンクリックのショートカットを用意します。各
        ショートカットは、それを修正できるページへ直接つながっています。パネルは
        ライブラリにゲームが登録されると表示されます。</li>
    </ul>
- version: 3.15.0
  date: '2026-07-03'
  tags:
  - type: accessibility
    label: スクリーンリーダーが処理の進捗を読み上げるようになりました
  body: |
    <ul>
      <li><strong>時間のかかる処理の進捗を、スクリーンリーダーが読み上げるように
        なりました。</strong>一括スクレイピング、実績の同期（RetroAchievements や
        PlayStation）、画像のリサイズの実行中、スクリーンリーダーの利用者には
        「開始」から「完了」まで何も伝わりませんでした。RetroDB は途中の区切り
        （例：「40件中12件」）と完了を読み上げるようになり、画面に余分なポップアップ
        は表示されません。読み上げはうるさくなりすぎないよう間隔を空けて行われ、
        選択した言語に従います。</li>
    </ul>
- version: 3.14.0
  date: '2026-07-01'
  tags:
  - type: feature
    label: 新しい言語 — 中国語（簡体字・繁体字）に対応
  body: "<ul>\n  <li><strong>RetroDB が中国語に対応しました。</strong>\n    <strong>設定 &rarr; システム &rarr; 言語</strong> で 2 つの選択肢が用意されています:\n    <strong>中文 (简体)</strong>（簡体字、中国本土向け）と\n    <strong>中文 (繁體)</strong>（繁体字、香港・台湾向け）。メニュー、ボタン、\n    メッセージ、アプリ内ヘルプマニュアルまで &mdash; インターフェース全体が\n    &mdash; 翻訳されており、まだ翻訳されていない部分はさりげなく英語に\n    フォールバックします。これにより対応言語は 10 種類になりました（英語、\n    ドイツ語、スペイン語、フランス語、イタリア語、日本語、ブラジルポルトガル語、\n    韓国語、そして今回の簡体字 &amp; 繁体字中国語）。</li>\n</ul>\n"
- version: 3.12.0
  date: '2026-06-30'
  tags:
  - type: feature
    label: 新しい言語 — 韓国語（한국어）に対応しました
  body: |
    <ul>
      <li><strong>RetroDB が韓国語（한국어）に対応しました。</strong>設定 &rarr;
        システム &rarr; 言語 から選択できます。メニュー、ボタン、メッセージ、
        アプリ内のヘルプマニュアルまで、インターフェース全体が翻訳されており、
        対応言語は8つになりました（英語、ドイツ語、スペイン語、フランス語、
        イタリア語、日本語、ブラジルポルトガル語、韓国語）。韓国語の追加により、
        RetroDB が表示する年齢レーティング機関（韓国の GRAC を含む）すべてを
        カバーします。</li>
    </ul>
- version: 3.11.0
  date: '2026-06-30'
  tags:
  - type: enhancement
    label: Patreon で RetroDB を支援できるようになりました — 新しい寄付リンクを追加
  body: |
    <ul>
      <li><strong>Patreon で RetroDB を支援できるようになりました。</strong>既存の
        「GitHub でスポンサーになる」ボタンの隣、<strong>設定 &rarr; システム &rarr;
        開発を支援</strong>、バージョン情報パネル、およびプロジェクトの README に
        Patreon リンクが追加されました。RetroDB は引き続き完全に無料でオープンソース
        です &mdash; 寄付は完全に任意で、個人開発を続けるための助けになります。</li>
    </ul>
- version: 3.10.0
  date: '2026-06-26'
  tags:
  - type: enhancement
    label: 変更履歴が「もっと読み込む」ボタンで速く表示されるようになりました
  body: "<ul>\n  <li><strong>変更履歴ページが大幅に速く開くようになりました。</strong>\n    開くたびにすべてのリリース履歴（数百件）を描画する代わりに、RetroDB は最新の\n    20 件を表示し、下部に<strong>もっと読み込む</strong>ボタンを追加します。\n    クリックすると次の分が表示され、以降も同様です &mdash; 古い履歴もすべて残って\n    おり、最初の表示を遅くする代わりに必要に応じて読み込まれるだけです。</li>\n</ul>\n"
- version: 3.9.0
  date: '2026-06-17'
  tags:
  - type: feature
    label: ヘルプマニュアルと最近のリリースノートが全6言語に翻訳されました
  body: "<ul>\n  <li><strong>アプリ内の完全なヘルプマニュアルが全6言語でご利用いただけるようになりました</strong>\n    &mdash; ドイツ語、フランス語、スペイン語、イタリア語、日本語、ブラジルポルトガル語\
    \ &mdash; 英語だけではありません。RetroDB は設定で選択した言語でマニュアルを表示し、まだ翻訳されていない部分があれば自動的に英語に切り替えます。</li>\n  <li><strong>この変更履歴もお使いの言語で表示されるようになりました</strong>。最新のリリースが対象で、今後の新しいリリースもここから翻訳されます。それより古い履歴は英語のままです。</li>\n\
    \  <li><strong>ウィッシュリストのページと、残っていた英語のテキスト</strong>\n    &mdash; 3.8.0 で言語パックが最初に導入された際に見落とされていた、ポップアップのエラーメッセージやステータスメッセージのまとまり\
    \ &mdash; がアプリ全体で正しく翻訳されるようになりました。</li>\n</ul>\n"
- version: 3.8.2
  date: '2026-06-17'
  tags:
  - type: security
    label: セキュリティ関連の依存ライブラリ更新と CI の修正
  body: "<ul>\n  <li><strong>セキュリティ:</strong> 同梱の <code>cryptography</code>\n    ライブラリ（47 → 49）を更新し、公表された脆弱性（GHSA-537c-gmf6-5ccf）を解消しました。動作の変更はなく、より安全なバージョンになっただけです。</li>\n\
    \  <li>自動テストのパイプラインを修正しました。テスト専用のヘルパー（<code>beautifulsoup4</code>）が不足しており、v3.7.0 以降テストの実行が失敗していました。また、新しいパッケージングのビルドスクリプトが、既知の誤検知である静的解析のチェックに引っかかっていました（信頼されたビルドコマンドを実行するもので、ユーザー入力ではありません）&mdash;\
    \ この点を文書化し、調整しました。メンテナンスのみで、アプリ自体に変更はありません。</li>\n</ul>\n"
- version: 3.8.1
  date: '2026-06-17'
  tags:
  - type: improvement
    label: より小さいダウンロード版、寄付まわりの整理、翻訳の修正（Pass 46.3 / 47.6）
  body: "<ul>\n  <li><strong>はるかに小さいダウンロード版を準備中です。</strong> すぐに使える「解凍してダブルクリックするだけ」版の RetroDB を、AMD のグラフィックカードをお持ちでない方向けに\
    \ <strong>CPU 専用</strong>\n    の形式（約 600&nbsp;MB）でビルドできるようになりました &mdash; フル版の約 6 分の 1 のサイズです。両方を並べて提供しますので、お使いのマシンに合った方をお選びいただけます。</li>\n\
    \  <li><strong>設定内の「開発を支援する」パネルも翻訳されるようになりました</strong>\n    &mdash; アプリの他の部分と同様にです。3.8.0 で言語パックが導入された際に、誤って英語のまま残されていました。</li>\n\
    \  <li>寄付のリンクを整理しました（README の GitHub Sponsors バッジ。資金提供ファイルは、設定が整い次第 Patreon や Buy&nbsp;Me&nbsp;A&nbsp;Coffee\
    \ に対応できるよう準備済みです）。しつこい催促画面は一切ありません。</li>\n  <li>裏側では、リリースのパイプラインで Windows、macOS、Linux 向けのすぐに使える版を自動でビルドできるようになりました。なお、長文のアプリ内\
    \ <em>ヘルプ</em> マニュアルは現時点ではまだ英語のみです &mdash; これは今後の作業として記録されています。</li>\n</ul>\n"
- version: 3.8.0
  date: '2026-06-12'
  tags:
  - type: feature
    label: インターフェース全体の翻訳と 6 言語対応（Pass 43.2/43.3/43.5）
  body: "<ul>\n  <li><strong>RetroDB がさらに 6 つの言語に対応しました。</strong> 3.7.0 の基盤の上に、インターフェース全体を翻訳可能にし、<strong>ドイツ語、フランス語、スペイン語、イタリア語、日本語、ブラジルポルトガル語</strong>に機械翻訳しました。設定\
    \ &rarr; 表示設定 &rarr; 言語 から言語をお選びください。保存した設定、次にブラウザの設定の順に従い、最後に英語に切り替わります &mdash; 存在しない言語で止まってしまうことは決してありません。</li>\n\
    \  <li><strong>画面上のすべてが対象です</strong>: ページのテキストやボタン、ポップアップメッセージ（小さな「トースト」通知）、編集ダイアログや設定ダイアログ、ツールチップ、スクリーンリーダー用のラベル。ゲームのジャンル、視点、プレイモード（例:&nbsp;&ldquo;First-Person-Shooter&rdquo;）もお使いの言語で表示されるようになりました\
    \ &mdash; 一方で、基になるデータは英語のまま保たれるので、ライブラリやフィルターはこれまでどおり正しく機能します。</li>\n  <li>組み込みの<strong>「Pseudo」言語</strong>（言語メニューに表示されます）は翻訳者向けの品質チェックツールで、すべてのラベルを括弧で囲みアクセント記号を付けることで、翻訳が漏れているテキストが一目でわかるようにします。</li>\n\
    \  <li>機械翻訳はあくまで出発点であり、場所によっては少しぎこちなく読めることがあります &mdash; 時間をかけて改善していくのは容易で、翻訳がないテキストは単に英語で表示されます。</li>\n\
    </ul>\n"
