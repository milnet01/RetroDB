  body: |
    <ul>
      <li><strong>RetroDB が自分自身を更新できるように。</strong>新しいバージョンが出ると、管理者にはダッシュボードと 設定 &gt; システム &gt; 更新 に、新機能とともに表示されます。「更新をダウンロード」はそれを取得し、公開されたファイルとまったく同じかを確認します。「インストールして再起動」はデータベースをバックアップし、新しいバージョンを配置して再起動します。新しいバージョンが起動しない場合、RetroDB は自動的に古いバージョンに戻り、その理由を表示します。ゲーム、設定、画像、ログには手を加えません。RetroDB は 1 日 1 回更新を確認します。これはオフにできます。git から実行しているコピーや、プロセスマネージャーで実行しているコピーには、更新が通知されますが、更新はされません。</li>
      <li><strong>RetroDB の中から RetroArch を入手。</strong>設定 &gt; エミュレーター に新しい「RetroDB でプレイ」セクションがあります。「RetroArch を入手」を押すと、RetroDB は libretro から公式の RetroArch をダウンロードし、ダウンロードが想定どおりのファイルとまったく同じかを確認して、RetroArch (RetroDB) として設定します。設定とセーブは専用で、すでにお使いの RetroArch とは分けて保持されます。その後、各システムを初めてプレイするときに最適なコアを取得します。Linux と Windows で動作します。macOS はまだテストしていません。</li>
      <li><strong>RetroDB でプレイするゲームで「次のディスク」が動作するように。</strong>複数ディスクのゲームでは、「次のディスク」ボタンが設定なしで RetroDB 専用の RetroArch に届くようになりました。RetroArch が RetroDB からの命令を受け付けるのは、そのようなゲームの実行中だけです。Windows と macOS では、いずれかのゲームの実行中に受け付けます。</li>
      <li><strong>スマートフォンやウィンドウのサイズ変更後もゲームカードがそろうように。</strong>スマートフォンでは、ライブラリとコンソールのページにカードが 1 枚表示された後、長い空白が続いていました。現在はカードが縦に並びます。ウィンドウを狭くしたり広くしたりすると、カードが古い列のまま残らず、並び直されます。</li>
      <li><strong>取得したレーティングとプレイヤー数がより正確に。</strong>IGDB の CERO、USK、GRAC、ClassInd、ACB の年齢レーティングが正しく読み取られるようになり、CERO Z や USK 18 のゲームにはそのレーティングが付きます。TheGamesDB、RAWG、IGDB、ES-DE は、わからないときに「1 人」と推測しなくなりました。ES-DE のインポートは、あなたが設定したプレイヤー数やゲームモードを上書きしなくなりました。TheGamesDB は、検索に失敗した後に発売元や開発元の名前の代わりに数値を保存しなくなりました。</li>
      <li><strong>ScreenScraper がメインのソースのとき、その詳細が保持されるように。</strong>タイトル、説明、日付、開発元、発売元、プレイヤー数が、検索後の最初の数分間だけでなく、毎回の取得で保持されます。ダウンロードした動画とマニュアルには適切なファイル名が付きます。</li>
      <li><strong>「取得データを消去」でファイル名がタイトルに戻るように。</strong>これまでは詳細を消去しても、取得したタイトルが残っていました。</li>
      <li><strong>1 つのコンソールの RetroAchievements の更新がまた動作するように。</strong>毎回エラーで失敗していました。</li>
      <li><strong>ダウンロード版アプリで重複スクリーンショットの検出が動作するように。</strong>そこではスクリーンショットが 1 枚も見つからず、重複を削除してもファイルがディスクに残っていました。</li>
      <li><strong>ScreenScraper のパスワードを非表示にし、最後の管理者は管理者のままに。</strong>設定で ScreenScraper のパスワードが、ほかのキーと同様に伏せて表示されるようになりました。唯一の管理者アカウントは、編集者に変更したり無効にしたりできなくなりました。そうすると、RetroDB を管理できる人が誰もいなくなってしまうためです。</li>
      <li><strong>中断されたジョブは、実行を許可された人にだけ表示。</strong>ダッシュボードの中断ジョブのバナーは、そのジョブを開始できる人にだけ表示されるようになりました。たとえば一括取得は編集者と管理者にだけ表示されます。ほかのアカウントには表示されず、閉じることもできなくなりました。</li>
      <li><strong>インポートしたコンソールロゴ、設定での特殊な名前、ボーナスディスク。</strong>ダウンロード版アプリで「ロゴを更新」が、ES-DE からのインポートで取り込んだコンソールロゴを見つけ、内蔵のロゴより優先するようになりました。&lt; や引用符などの文字を含むコントローラー、コンソール、バックアップの名前で、設定ページが壊れなくなりました。ボーナスディスクの指定を外すと完全に切り離され、元のゲームのボーナスディスクとして数えられなくなりました。</li>
      <li><strong>トロフィー、ライブラリのインポート、メンテナンスツールを高速化。</strong>トロフィーページ、Steam・Xbox・PlayStation のライブラリのインポート、コレクタートロフィー、「ストレージを計算」、未使用メディアのスキャンは、大きなライブラリでも処理がずっと少なくなりました。サーバーが混み合っていても、ジョブの進行状況ポップアップは更新され続けます。HowLongToBeat と別タイトルのジョブは、実行中にほかの変更を妨げなくなりました。</li>
      <li><strong>各 PS3 ゲームが RPCS3 でどの程度動くかを表示。</strong>ライブラリ、PlayStation 3 のページ、ゲームのページで、PS3 ゲームに RPCS3 の互換性ステータス（プレイ可能、ゲーム内、イントロ、読み込み可能、動作せず）が、最後にテストされた日付とともに表示されます。RetroDB はこれをお使いのコンピューターの RPCS3 から読み取るので、RPCS3 で Manage &gt; Databases &gt; Download Compatibility Database を一度選んでください。新しい結果が欲しいときも同様です。ディスク上に ROM があるゲームだけが表示され、インポートしたゲームは表示されません。RetroDB は、PSN やインストール済みゲームのフォルダー、また [BLUS30443] のように名前にゲーム ID を含むフォルダーやファイルからも、ゲーム ID を読み取るようになりました。</li>
      <li><strong>ゲームの販売本数。</strong>取得中に AI が欠けている項目を補うときと、AI補完を押したときに、そのゲームがそのコンソールで何本売れたかも AI に尋ねるようになりました。情報源は、発売元の報告、プラットフォームのベストセラーリスト、ファミ通、Wikipedia、VGChartz などの無料で公開されている数値です。ゲームのページにその数が表示されます。公表された数値がないゲームは、推測値を入れず空欄のままです。</li>
      <li><strong>ゲームのページで「フランチャイズ / シリーズ」スイッチが動作するように。</strong>ゲームのページの編集ウィンドウで、「単独」と指定したゲームの「フランチャイズ / シリーズ」スイッチをクリックしても何も起こらず、シリーズに入れられませんでした。現在は切り替わり、「プラットフォーム提供状況」スイッチも同様に切り替わります。</li>
      <li><strong>すべての実績タブが同じ幅に。</strong>RetroAchievements、RPCS3、PSN、Steam、Xbox がそれぞれ自分のカードに合わせてページの幅を決めていたため、タブを移動するたびにページの幅が変わっていました。現在は同じ幅を共有します。</li>
      <li><strong>Windows と macOS で RetroDB が RPCS3 の設定を見つけられるように。</strong>Windows では RPCS3 は設定を rpcs3.exe の隣に保存します。RetroDB はそこと、ポータブルフォルダーを探すようになったので、ゲームごとの設定と互換性リストが見つかります。</li>
      <li><strong>スコアはあるが年齢レーティングのないゲームでも AI補完が動作するように。</strong>そのようなゲームでは、年齢レーティングを判断する途中で AI補完がエラーで失敗することがありました。</li>
      <li><strong>ゲームカードのラベルがあなたの言語で表示されるように。</strong>ライブラリのカードの達成ステータスとスコアのツールチップが、常に英語で表示されていました。</li>
      <li><strong>すべての地域の発売日。</strong>取得中に AI が欠けている項目を補うときと、AI補完を押したときに、北米、ヨーロッパ、日本など、各地域でゲームが発売された日付も AI に尋ねるようになりました。ゲームのページとクイックビューに、早い順に、日付と地域名をあなたの言語で一覧表示します。ゲーム自体の発売日は変わりません。</li>
      <li><strong>ゲームのページに前後のゲームへのリンク。</strong>ゲームのページ上部のパスの隣に、「前へ」と「次へ」のリンクと、リスト内でのそのゲームの位置が表示されます。これらは開いたページに従います。ライブラリから開いた場合はライブラリを、コンソールのページから開いた場合はそのコンソールを、そこで使っていたのと同じ順序、フィルター、検索で移動します。</li>
      <li><strong>アップロードしたカバーとスクリーンショットを、取得した画像と同じように処理。</strong>編集ウィンドウでアップロードしたカバー、3D ボックス、スクリーンショットは、取得した画像と同じ画像形式で保存され、同じサイズに変換されるようになりました。カバーにはライブラリで使う小さなコピーも作られます。ゲームにすでにあるものと同じに見えるスクリーンショットは追加されず、除外された枚数が表示されます。新しいカバーをアップロードすると、置き換えられたファイルも削除されます。</li>
      <li><strong>RetroAchievements があるすべてのゲームで、ゲームのページにそれが表示されるように。</strong>ゲームキューブの Metroid Prime や Metroid Prime 2 のように、ライブラリでは RA バッジがあるのに、ゲームのページに RetroAchievements のカードがないゲームがありました。現在はページがバッジと同じ RetroAchievements のリンクを使い、毎回 RetroAchievements に問い合わせなくなったため、読み込みも速くなりました。</li>
      <li><strong>システムページの未取得数が「未スクレイピング」フィルターと一致するように。</strong>この数にはボーナスディスクが含まれていましたが、コンソールのゲーム一覧にはボーナスディスクは表示されません。そのため、未取得が 2 件と表示されるのに、「未スクレイピング」フィルターでは 1 件も表示されないコンソールがありました。</li>
      <li><strong>一括取得中にライブラリとシステムのページがリアルタイムで更新されるように。</strong>一括取得のウィンドウが開いていても、閉じていても、バックグラウンドで実行中でも、各ゲームのカードは取得されるとすぐに更新されます。</li>
      <li><strong>AI補完が各ゲームに公式名を付けるように。</strong>単一ゲームの取得、一括取得、AI補完ボタンで AI が欠けている項目を補うとき、そのゲームの ROM の地域で発売された公式タイトルも答え、ゲームはその名前に変更されます。古い名前は別タイトルとして残ります。自分で入力したタイトルや、公式名で承認したタイトルは、決して変更されません。</li>
      <li><strong>公式名がまた名前を提案するように。</strong>OpenAI では、また Gemini でもときどき、AI の回答を読み取れず、名前が 1 つも提案されないまま処理が終わっていました。</li>
      <li><strong>ソースは対応しているシステムでのみ検索されるように。</strong>RAWG には Intellivision のゲームがないため、それらについては検索しなくなりました。以前は代わりにほかのプラットフォームのゲームを見つけていました。IGDB、TheGamesDB、RAWG は常にゲーム自身のシステムで検索するようになりました。RAWG のプラットフォームの誤ったリンクもいくつか修正しました（Atari ST、ColecoVision、PC Engine、DOS）。</li>
      <li><strong>取得の進行状況リングが逆戻りしないように。</strong>「メタデータを検索」ウィンドウで複数回検索した後、「適用」を 1 回押すと取得が何回も始まり、リングがそれらの間を行き来していました。</li>
      <li><strong>拡大した 3D ボックスアートの後ろに四角が出ないように。</strong>ボックスが暗くした背景の上に直接表示されます。</li>
      <li><strong>メッセージに HTML コードが表示されないように。</strong>ROMツールの一部の確認ウィンドウと結果ウィンドウで、改行の代わりに &lt;br&gt; のようなタグが表示されていました。設定のログビューアーと、ボーナスディスクの親ゲームの選択も、また動作するようになりました。</li>
    </ul>
