  body: |
    <ul>
      <li><strong>どのページからでもゲームやコンソールを検索できるように。</strong>サイドバーのあなたの名前の下に検索ボックスが付きました。2 文字以上入力すると、一致するコンソールと、一致するゲーム最大 8 件が、それぞれのコンソールとともに表示されます。項目をクリックするか、矢印キーで選んで Enter を押すと開きます。「すべての結果を表示」を押すと、その検索でライブラリが開きます。専用の検索ボックスがないページでは、/ を押すと検索ボックスに移動します。</li>
      <li><strong>スマートフォンやタブレットで操作しやすく。</strong>狭い画面では、上部のバーにメニューボタンと検索ボタンが並びます。検索ボタンを押すと、カーソルが検索ボックスに入った状態でメニューが開きます。下部のバーから、ダッシュボード、ライブラリ、システム、実績へワンタップで移動できます。メニューは不透明になり、後ろのページが透けて見えなくなりました。メニューの外をタップするか Escape を押すと閉じます。タブレットサイズのウィンドウではメニューボタンがなく、メニューをまったく開けませんでしたが、現在は表示されます。スクロールしても画面に残るタブバーやフィルターバーは、上部のバーの裏ではなく、そのすぐ下で止まります。</li>
      <li><strong>設定 &gt; エミュレーター がスマートフォンに収まるように。</strong>表がスマートフォンの画面より幅広く、「編集」と「設定」のボタンが画面の外にはみ出していました。現在はスマートフォンでは各行がカードになり、ボタンもその中に収まります。</li>
      <li><strong>ゲームの画像を消去しても、不要なファイルが残らないように。</strong>RetroDB がバックグラウンドで画像を鮮明にしている最中にそのゲームの画像を消去すると、どのゲームも使わないファイルとして書き戻されることがありました。現在は先に確認し、書き込みを省きます。「画像を改善中」の件数からも、消去したゲームがすぐに外れます。</li>
      <li><strong>入力したタイトルがスクレイピングで保持されるように。</strong>これまでスクレイピングは、完全再取得も含めて、編集ウィンドウで入力したタイトルをスクレイパーの名前に置き換えていました。現在は、変更したタイトルが保持されます。タイトルの下にある新しい「取得時にこのタイトルを保持」チェックボックスがその状態を示します。チェックを外すと、スクレイパーが再びゲーム名を変更できます。ゲームのページで「リセット」を押した場合も同様です。</li>
      <li><strong>ゲームの公式名を、あなたの確認のうえで設定。</strong>ROMツールに新しい「公式名」ページを追加しました。1 つのシステム、またはすべてのシステムで「AI に聞く」を押すと、AI が各ゲームの正式な公式名を、その ROM の地域で発売されたとおりに提案します。たとえば日本版の Mega Man の ROM はロックマンになります。新旧の名前が並んで表示されるので、採用したいものにチェックを入れて承認します。承認するまで何も変わりません。古い名前は別タイトルとして残り、承認した名前はスクレイピングでも保持されます。却下した名前は再び提案されません。設定 &gt; 取得 で AI プロバイダーを設定しておく必要があります。</li>
      <li><strong>年だけの日付のゲームを編集でき、年も保持されるように。</strong>多くのゲームは 1985 のように年だけで日付が登録されています。ゲームのページの編集ウィンドウでは、これらを保存できませんでした。ライブラリの編集ウィンドウでは、保存すると年が消えていました。現在はどちらも、年だけ、年と月、または完全な日付を受け付けます。</li>
    </ul>
