  - type: feature
    label: 'すべてのパス入力欄に参照ボタン'
  body: |
    <ul>
      <li><strong>RetroArch (RetroDB)、DuckStation、PCSX2 のチート。</strong>設定 &gt; エミュレーター に新しい「チート」セクションがあります。そこで無料で公開されているチートパックをダウンロードするか、手持ちのチートフォルダーをインポートしてください。RetroDB はファイルをコピーし、フォルダーは一切変更しません。その後、ゲームのページにそのゲームのチートが一覧表示され、それぞれにオン/オフのスイッチが付きます。チートが多い場合は検索ボックスも表示されます。RetroArch (RetroDB) では、オンにしたチートは次にプレイを押したときから適用され、プレイ中に RetroArch のメニューで行った変更も保持されます。DuckStation と PCSX2 では、スイッチはそのゲーム用のエミュレーター自身の設定に保存されるため、エミュレーター内で行った変更もページに表示されます。RetroDB は、エミュレーターがすでに持っているチートファイルを上書きしません。オンのチートがあると、RetroAchievements のハードコアモードが一時停止します。</li>
      <li><strong>Slipcase の 3D ボックスをゲームにインポート。</strong>ゲームのページのカバーの下に「3D ボックスをインポート」ボタンがあります。Slipcase が保存した <code>.box.json</code> ファイルをその画像と一緒に選ぶと、RetroDB はボックスの表、背、裏などの面をそのゲーム用に保存します。3D ボックスアートの画像は変更されません。すでに面があるゲームでは置き換える前に確認し、「削除」で面を消せます。</li>
      <li><strong>ゲームの 3D ボックスを手に取るように回転。</strong>Slipcase のボックスをインポートしたゲームのカバーをクリックすると、ボックスが 3D で表示されます。ドラッグするか矢印キーで回転させ、背、裏、上面、底面を見られます。スクロールまたは + と - でズームし、ダブルクリックまたは Home キーで元に戻します。ボックスをインポートしていないゲームは、これまでどおりカバー画像を拡大表示します。</li>
      <li><strong>設定からエミュレーターのページへのリンク。</strong>エミュレーターのページには設定のどこからもリンクがなく、アドレスを入力しないと開けませんでした。現在は管理者に「システム」の次に「エミュレーター」タブが表示され、エミュレーターのページにも同じタブバーが表示されるので、他のタブへもワンクリックで移動できます。</li>
      <li><strong>カバーのズームがメニューの後ろに隠れないように。</strong>スマートフォンでは上下のバーがズームしたカバーに重なって閉じるボタンを隠し、パソコンではサイドバーがその左側を覆っていました。現在、ズームはすべての上に開きます。</li>
      <li><strong>AI 用の Claude 5.5 モデル.</strong> 設定 &gt; 取得 に Anthropic の最新 Claude モデルが並びます。新しい既定で最も安い Haiku 5.5、Sonnet 5.5、Opus 5.5 を現在の料金とともに表示します。Sonnet 5.5 が受け付けない設定は送らなくなりました。</li>
      <li><strong>ゲームの販売本数を入力.</strong> 両方の編集画面のデベロッパーの下に「販売本数」欄ができました。入力した数値は、AI が見つけたものと同じようにゲームページに表示されます。消すには欄を空にします。</li>
      <li><strong>設定で AI キーをテスト.</strong> 設定 &gt; 取得 の AI プロバイダーの下に「保存済みの AI キーをテスト」ボタンができました。キーが有効かどうか、無効ならその理由（キーの拒否、クレジット不足、使用上限）を表示します。これまでは拒否されたキーも有効に見えていました。</li>
      <li><strong>Claude がウェブで販売本数を検索.</strong> 設定 &gt; 取得 の Claude モデルの下に「Claude にウェブ検索を許可」スイッチができました（初期状態はオフ）。検索なしでは、Claude は既に知っている内容から答え、販売本数は空欄のままにします。オンにすると、Claude が数値を調べます。Anthropic は検索ごとに料金を請求するため、AI補完が行う検索は 1 ゲームにつき最大 5 回、最大 5 米セントです。大規模な一括取得の前にはスイッチをオフにしてください。</li>
      <li><strong>システム全体を一度にAI補完。</strong> ROMツールに新しい「一括AI補完」ページができました。公式名もここにあります。システムまたは「すべてのシステム」を選び、埋めたい項目をオンにして「AIで埋める」を押します。RetroDB は各ゲームでAI補完を実行し（ゲームのページのAI補完ボタンと同じです）、答えをゲームに直接保存します。進行バーとAI補完の通知ボックスで進み具合がわかり、実行中はページを離れてもかまいません。埋めるゲーム数を表示して先に確認します。AIプロバイダーはゲームごとに料金を請求するためです。AI補完済みのゲームは、含める設定に戻さない限りスキップされ、AIが応答しなくなると処理は自動で停止します。</li>
      <li><strong>ジョブの通知ボックスがテーマの色になりました.</strong> 一括スクレイピングや RA Sync など、実行中のジョブを表示するボックスと進行バーが、選んだテーマの色を使うようになりました。一時停止できないジョブは、タイトルが一時停止の色で表示されなくなりました。</li>
      <li><strong>エミュレーターのページがほかの設定タブと同じ見た目に。</strong> 設定 &gt; エミュレーターがカードに分かれ、タブの下のバーから各カードへ移動できます：RetroArch、RetroDB でプレイ、コア、チート、フォルダー、エミュレーター、割り当て。バーはスクロールしても上に残り、今いるセクションを示します。</li>
      <li><strong>ボタンの横にダウンロードの進行状況。</strong> RetroArch、プレーヤーのコア、チートパックをダウンロードすると、ボタンの横のメモに進み具合がパーセントで表示されます。以前はボタンの下に行が現れ、ページの残りを下に押し下げていました。</li>
      <li><strong>システムごとのエミュレーターをリストから選択。</strong> 設定 &gt; エミュレーターの「システムごとの割り当て」で、各システムが一度だけ表示され、そのシステムに関連付けられたエミュレーターの一覧から選べるようになりました。選んだエミュレーターが、そのシステムのゲームで「プレイ」に使われます（ゲーム側で独自に設定している場合を除く）。RetroDB が見つけられないエミュレーターには「見つかりません」と表示されます。以前は、システムごとにエミュレーターの数だけ行があり、小さな点で既定を選んでいました。RetroDB の RetroArch は、一覧にあるシステムのうち実行できるものすべてのリストに表示されるようになりました。まだゲームがないシステムも対象です。</li>
      <li><strong>すべてのパス入力欄に参照ボタン。</strong> 管理者は、パスを入力する代わりに、コンピューターのフォルダーをクリックしてたどり、フォルダーやプログラムを選べるようになりました。対象は設定 &gt; エミュレーター、ライブラリ、スクレイピング、アカウント、および ROMツール の設定です。プログラムを指定する欄ではファイルも表示されます。<code>.config</code> などの隠しフォルダーは最後に表示されます。</li>
    </ul>
