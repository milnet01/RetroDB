  - type: feature
    label: ライブラリの並び替えと、未スクレイピングのゲームだけの表示
  - type: ui
    label: 何も一致しないフィルターでは、そのことを表示
  - type: ui
    label: ライブラリのフィルターバーで、すべてが定位置にとどまるように
  - type: ui
    label: 空のライブラリに、スキャンボタン付きの案内を表示
