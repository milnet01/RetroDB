    label: すべてのポップアップウィンドウで、Esc キー、キーボードフォーカス、スクリーンリーダーの扱いを統一
  - type: performance
    label: スクレイピングが早く終わるように、小さな画像はバックグラウンドで拡大
  - type: feature
    label: 完全再取得で、すでにあるメディアを残せるように
  - type: fix
    label: ScreenScraper が副題付きのタイトルのゲームを見つけられるように
  - type: fix
    label: Create M3U の後もゲームがライブラリに残るように
  - type: fix
    label: 「実績」リンクが空白のページではなく前回のシステムを開くように
  - type: fix
    label: RetroArch のゲームが、キーボードが使える状態で起動し、読み込みも全速に
  - type: fix
    label: C64、Amiga、DOS などのホームコンピューターのゲームに、入力したキーがすべて届くように
  - type: fix
    label: C64 のゲームで、コントローラーの右スティックがカーソルキーを、Start が F1 を押すように
  - type: ui
    label: 画像がまだバックグラウンドで改善中であることをサイドバーに表示し、ゲームのより鮮明な画像が自動で表示されるように
  - type: feature
    label: ゲームのマニュアルがゲームページで開き、本のようにめくれるように
  - type: docs
    label: ヘルプに RetroArch のキー一覧を掲載し、キーボードを使うコンピューターのゲームではプレイの横に Scroll Lock の注意を表示
  - type: ui
    label: ROM ファイルのないインポートしたゲームに、プレイが表示されなくなりました
  - type: fix
    label: スクリーンショットの削除が、成功した後に失敗と表示されなくなりました
  - type: fix
    label: エミュレーターの行で設定した RetroArch のパスが実際に起動に使われるように
  - type: fix
    label: 終了しないゲームが、終了したと表示されなくなりました
  - type: deps
    label: Pillow 13 とその他のライブラリの更新
  body: |
    <ul>
      <li><strong>ゲームの地域版が1つのゲームとして表示されるように。</strong>
        持っている版（たとえば米国版、欧州版、日本版）をリンクすると、ライブラリには
        &#127760; バッジの付いたカードが1枚だけ表示されます。そのカードは、デフォルト地域の
        版を開いてプレイします。ゲームページではすべての版が横に並び、切り替えることが
        できます。ROMツール &gt; 地域版 では、編集者が確認するためのグループが提案されます。
        あなたの確認なしに何かがリンクされることはありません。続編が1作目の別の版として
        提案されることもありません。リンクされた版は、名前による重複として報告されなく
        なりました。提案の材料を増やすには、別名を補充 を一度実行してください。</li>
      <li><strong>AI が地域版の違いを要約できるように。</strong>版がリンクされたゲームでは、
        編集者が地域版セクションの「AI で違いを要約」を押せます。AI は、検閲、難易度、
        削除された内容など、知られている違いを一覧にします。この一覧には AI が書いたものと
        表示され、どの版のページにも表示されます。版をリンクまたはリンク解除すると、
        書き直されるまで非表示になります。設定 &gt; 取得 で AI プロバイダーを設定しておく
        必要があります。</li>
      <li><strong>PlayStation のゲームが良い設定で始まるように。</strong>DuckStation、PCSX2、
        RPCS3 では、プレイを押すと、RetroDB がエミュレーター自身のゲームごとの設定ファイルに、
        各ゲームの解像度の倍率とアスペクト比、そして全画面で始めるかどうかを書き込むように
        なりました。システム全体の設定は 設定 &gt; エミュレーター の「設定」ボタンで、
        1本のゲームの設定はゲームページの新しい「エミュレーター設定」パネルで変更できます。
        エミュレーターの中で変更した設定が常に優先されます。RetroDB は正しいファイルを
        見つけるために各ディスクのシリアル番号を読みます。CHD ディスクには chdman の
        インストールが必要です。</li>
      <li><strong>ゲームの項目に入力された文字で AI補完が操られることがなくなりました。</strong>
        AI補完がゲームの既存のパブリッシャー、開発元、エディション、他のプラットフォームを
        確認するとき、タイトルですでに行っていたのと同じように、まずその文字を
        きれいにするようになりました。</li>
      <li><strong>ROMツールのスキャンが ROM フォルダーの外に出なくなりました。</strong>
        CHDコンバーターと CHD検証は、フォルダーの外を指すショートカット（シンボリックリンク）を
        たどらなくなりました。また、複数ディスクのアーカイブを展開するときは、アーカイブの
        中に入っているショートカットを無視します。</li>
      <li><strong>ページに紛れ込んだスクリプトを実行しないように。</strong>RetroDB 自身が
        書いたものではないスクリプトを、ブラウザーがすべてブロックするようになりました。
        そのため、ゲームのタイトル、タグ、取得した説明文にコードを忍び込ませた文字があっても、
        それが実行されることはありません。ボタンやメニューはこれまでどおり動作します。</li>
      <li><strong>壊れたスクリーンショットが1枚あっても、ゲームの重複チェックが止まらなく
        なりました。</strong>読めないスクリーンショットは脇に置かれ、チェックは続きます。</li>
      <li><strong>ROMツールのジョブが「実行中」のまま止まらなくなりました。</strong>
        CHD検証のスキャン後に削除されたファイルは無効として数えられます。また、CHD 変換、
        CHD検証、重複ファインダーで予期しないエラーが起きると、ジョブは失敗として終了し、
        そのエラーがログに記録されます。</li>
      <li><strong>セットアップが終わる前でも、アプリへのデータ要求にはっきりした答えが
        返るように。</strong>セットアップページを返す代わりに「セットアップが必要です」と
        答えます。ページを開いた場合は、これまでどおりセットアップウィザードに移動します。</li>
      <li><strong>続編に1作目の実績が表示されなくなりました。</strong>RetroAchievements との
        照合でタイトルの数字が無視されていたため、Donkey Kong Country 2 と 3 が
        Donkey Kong Country にリンクされていました。現在は数字（2、II、3、III など）も
        考慮されます。すでにリンクされたゲームを直すには、すべてのシステムで
        RetroAchievements の更新を一度実行してください。</li>
      <li><strong>PlayStation の同期でトロフィー数が消えなくなりました。</strong>
        PlayStation の応答にゲームのトロフィー総数が含まれていないとき、RetroDB は
        すでに持っていた数を0で上書きしていました。現在はその数を保持します。
        トロフィーの一括更新でも同様です。</li>
      <li><strong>ディスク上にもうないトロフィーセットを開くと、メッセージが表示される
        ように。</strong>以前はトロフィーページがエラーになっていましたが、現在はセットが
        見つからないと表示して一覧に戻ります。</li>
      <li><strong>ROMツールの表で、ボタンの列の見出しがどの言語でも正しく表示される
        ように。</strong>列の見出しがアクションというゲームジャンルと同じ文言を共有して
        いたため、一部の言語ではそこにジャンル名が表示されていました。</li>
      <li><strong>ゲームキューブ、3DS、スーパーファミコンのゲームに、エミュレーターが
        自動で設定されるように。</strong>RetroDB はこれらのシステムを、ライブラリでは使われない
        フォルダー名（gc、n3ds、sfc ではなく gamecube、3ds、superfamicom）で探していたため、
        Dolphin と Citra が結び付けられることがありませんでした。反映するには RetroDB を
        一度再起動してください。</li>
      <li><strong>Python 不要（スタンドアロン）版のダウンロードで、再びエミュレーターが
        設定されるように。</strong>エミュレーターの一覧を記したファイルが含まれていません
        でした。</li>
      <li><strong>ボタン、ラベル、メッセージが約170個多く翻訳されました</strong>（すべての
        言語）。これまでは英語で表示され、いくつかは誤った訳になっていました（ゲームの起動に
        失敗したときに「バックアップに失敗しました」と表示する言語もありました）。</li>
      <li><strong>Esc キーで閉じるのは一番手前のウィンドウだけに。</strong>別のウィンドウの
        上に確認が開いているとき、Esc で両方が閉じていました。また、Esc で隠れた後も
        動き続けるウィンドウがあり、ゲームページで Esc を押すと、一時停止していた一括
        スクレイピングが再開されてしまうことがありました。現在は、どのウィンドウも自分の
        「閉じる」操作で閉じ、開いている間はキーボードフォーカスを内側に保ち、閉じると
        開いたボタンにフォーカスを戻します。実行中のジョブの進行状況ウィンドウは、ジョブが
        終わるまで開いたままです。</li>
      <li><strong>分析のグラフがあなたの言語で表示されるように。</strong>ジャンル、視点、
        次元、モードの名前、グラフのタイトル、軸の名前、凡例が、どの言語でも英語の
        ままでした。</li>
      <li><strong>RetroAchievements のデータがより安全に。</strong>あるゲーム機の
        RetroAchievements のゲーム一覧を読み込めなかった場合、RA の更新はそのゲーム機の
        ゲームをすべてリンク解除するのではなく、リンクしたままにするようになりました。
        RAデータを消去 は RetroAchievements の進捗だけを消去するようになり、Steam と Xbox の
        進捗は残ります。</li>
      <li><strong>パスワードはどこでも12文字以上が必要に。</strong>初回セットアップでは
        管理者パスワードの長さを問わず受け付けており、パスワードの強制変更ページと
        セットアップページには4文字で十分と書かれていました。現在はこの3つすべてで、
        アプリのほかの部分と同じく12文字を求めます。</li>
      <li><strong>実績の合計が正しく、しかもあなた自身のものに。</strong>
        RetroAchievements から1本のゲームを同期すると、0ではなく、そのゲームの実績の数が
        保存されるようになりました。ダッシュボードの実績の合計はあなたのゲームだけを数え、
        コレクタートロフィーは Steam や Xbox の実績を二重に数えなくなりました。</li>
      <li><strong>バックグラウンドの同期があなた自身のアカウントを使うように。</strong>
        RetroAchievements のシステム同期は、あなたが RetroAchievements アカウントを設定して
        いれば、そのアカウントでサインインします。PlayStation の一括更新は、毎回最初から
        サインインするのではなく、保存されたサインイン情報を再利用します。</li>
      <li><strong>あなたの同期を止めたり再開したりできるのは、あなただけに。</strong>
        ほかのユーザーがあなたの RetroAchievements、Steam、Xbox の同期をキャンセルすることは
        できなくなりました。また、中断したジョブを再開するには、開始するときと同じ権限が
        必要です。管理者は引き続きどちらも行えます。</li>
      <li><strong>RPCS3 のトロフィーフォルダーを保存するときに確認されるように。</strong>
        存在しないフォルダー、完全なパスでないもの、システムフォルダーは、メインの設定で
        すでにそうだったように拒否されます。</li>
      <li><strong>ミュージアムの「すべての画像を取得」がバックグラウンドで動くように。</strong>
        ページがコントローラーの画像をすべて取得するまで何分も待つことはなくなりました。
        取得の進み具合を表示し、キャンセルボタンがあり、ページを離れて戻ってきても
        進行状況の表示を再開します。</li>
      <li><strong>ROMツールがファイルをよりしっかり守るように。</strong>クリーンアップで
        アーカイブが空になることはなくなりました。<code>*</code> のようなパターンは保存できず、
        パターンがすべてのファイルを削除することになる場合はクリーンアップが止まります。
        CHDコンバーターは「検証」がオフのときは元のファイルを残し、「既存をスキップ」が
        オンのときは既存の CHD に手を付けません。重複ファインダーは、要求がすべての削除を
        求めていても、各ゲームのコピーを必ず1つ残します。</li>
      <li><strong>ROMツールのジョブがボタンの表示どおりに動くように。</strong>一時停止で
        CHD 変換、CHD検証、重複ファインダー、スクリーンショット重複除去が実際に一時停止する
        ようになり、一時停止中のジョブもキャンセルできます。スクリーンショット重複除去の
        スキャンでエラーが起きた場合は、いつまでも実行し続けるのではなく、失敗として
        終了するようになりました。</li>
      <li><strong>Create M3U がアーカイブを一時フォルダーに置かなくなりました。</strong>
        移動したアーカイブは、再起動しても消されない RetroDB 自身のデータフォルダーに
        入るようになりました。アーカイブスキャナーは移動先を表示し、一括処理の確認では
        アーカイブが移動されることを伝えます。ROMツール設定のリセットで、すべての
        オプションがリセットされるようになりました。</li>
      <li><strong>RetroDB からディスクを入れ替えられるように。</strong>.m3u のディスク
        一覧から起動した RetroArch のゲームの実行中は、各ページ上部の &#9654; プレイ中 の
        一覧にゲームのタイトルと「次のディスク」ボタンが表示されます。ゲームが
        2枚目を求めてきても、ブラウザーやスマートフォンからワンクリックで続けられます。
        RetroArch で Settings &gt; Network &gt; Network Commands をオンにしておく必要が
        あります（ポート 55355）。オフの場合はボタンがそのことを伝えます。</li>
      <li><strong>起動スクリプトが、準備ができてから RetroDB を開くように。</strong>
        start.sh、start.command、start.bat は決まった3秒後にブラウザーを開いていたため、
        サーバーが応答できる前に開いてしまい、ページの読み込みに失敗することがよく
        ありました。現在の RetroDB は、サーバーが待ち受けを始めてからページを開きます。
        LocalWebServerManager から起動した場合はページを開きません。マネージャーの
        Open ボタンを使ってください。</li>
      <li><strong>ゲームの動画は最大 500 MB まで。</strong>これまでの上限は 50 MB で、
        ほとんどのゲームのトレーラーには小さすぎました。大きすぎるアップロードでは、
        ページがただの文字に置き換わるのではなく、ゲームページにメッセージが表示される
        ようになりました。拒否された動画（大きすぎる、またはファイル形式が違う）も、
        黙って捨てられるのではなく、その旨が表示されるようになりました。</li>
      <li><strong>起動に、設定したパスが使われるように。</strong>設定 &gt; エミュレーター の
        RetroArch の行にある Binary path override が、同じページ上部の RetroArch のパスより
        優先されるようになりました。以前は行のパスが無視されていました。停止を2回押しても、
        ゲームに2回終了を求めることはなくなりました。Linux では RetroArch が2回目の要求を
        「保存せずに終了」と受け取るため、ゲーム内のセーブが失われることがありました。
        作られなかったリモートモードの名残の起動設定によって、すべてのゲームが起動
        できなくなることもなくなりました。</li>
      <li><strong>失敗した操作がエラーを正しく報告するように。</strong>保存、インポート、
        同期、スキャンに失敗したとき、RetroDB は成功したかのように答えるのではなく、
        本当のエラー状態で答え、メッセージにその理由を表示するようになりました。
        接続できない PSN サインインコードを保存しても、内部のエラー詳細は表示されなく
        なりました。サインイン、ユーザー管理、プロフィール、実績、インポート、AI補完、
        HowLongToBeat の検索も同様になり、保存できない言語は「ネットワークエラー」ではなく
        その理由を表示します。</li>
      <li><strong>No-Intro 方式の名前のゲームもスクレイピングできるように。</strong>
        「Legend of Zelda, The」や「Legend of Zelda, The - Ocarina of Time」のような
        タイトルが、一致フィルターではじかれることなく「The Legend of Zelda」の結果に
        一致するようになりました。ROMレポートも、こうした名前を不一致として報告しなく
        なりました。</li>
      <li><strong>ファイル名から取ったタイトルからタグがすべて取り除かれるように。</strong>
        「(USA, Europe)」のような組み合わせの地域や「(UK)」も削除されるようになりました。
        ZX Spectrum などのホームコンピューターでは、年以降がすべて削除されるため、
        「Chuckie Egg 2 (UK) (1985) (A'n'F Software) (tzx)」は「Chuckie Egg 2」になります。
        「..zip」で終わるファイル名で余分な点が残ることもなくなりました。スクレイパーの検索、
        ゲームのデータのリセット、地域版の提案では、このすっきりした名前が使われます。</li>
      <li><strong>再スクレイピングで間違ったタイトルが繰り返されなくなりました。</strong>
        一括スクレイピングは、ゲームに保存されたタイトルではなく、ROM ファイルの名前で
        検索するようになりました。以前に間違ったゲームと一致したゲームも、もう一度
        スクレイピングすれば正しいゲームが見つかります。</li>
      <li><strong>スクレイパーがデフォルト地域を優先するように。</strong>2つの結果が
        同点のとき、いつも米国版ではなく、デフォルト地域または World の結果が選ばれる
        ようになりました。地域タグだけの2つのタイトルが完全一致とみなされることは
        なくなりました。地域版は「X-Men」の X を続編の番号と間違えなくなりました。
        カードにどの版を表示するかは、上のフォルダーではなく ROM のファイル名だけを
        見て決めるようになり、「(U)」や「(E)」のような古いタグも理解します。</li>
      <li><strong>ゲームごとのスクレイピング時間の内訳がログに表示されるように。</strong>
        RetroDB はゲームごとに、検索、各ソース、ダウンロード、画像処理、AI、保存に
        かかった秒数を1行でログに記録します。スクレイピングを速くするための第一歩です。</li>
      <li><strong>スクレイピングが早く終わるように：小さな画像は後から鮮明に。</strong>
        スクレイピングでは、ダウンロードしたままの画像でゲームが保存されるように
        なりました。小さなボックスアートとスクリーンショットは、その後バックグラウンドで
        1本ずつ拡大されます。重複したスクリーンショットは、この処理の前に取り除かれます。
        RetroDB が途中で止まっても、次に起動したときに続きから再開します。</li>
      <li><strong>ゲームのマニュアルをゲームページで読めるように。</strong>マニュアル
        ボタンで、ゲームページの上のウィンドウに PDF が開くようになりました。
        前へ・次へ、矢印キー、Home と End、スマートフォンではスワイプでページをめくれます。
        各ページは本のようにめくれ、システムで動きを減らす設定にしている場合は単に
        切り替わります。「新しいタブでPDFを開く」も引き続き使え、マニュアルを Ctrl+クリック
        すると直接タブで開きます。</li>
      <li><strong>画像がまだ改善中であることをサイドバーに表示。</strong>画像を
        バックグラウンドで鮮明にしている間、サイドバーに「画像を改善中 — 残りのゲーム: N」と
        表示されます。まだ順番待ちのゲームはそのページにその旨が表示され、準備ができると
        より鮮明な画像が自動でそこに表示されます。2D/3D カバーの切り替えスイッチが
        その行を隠すこともなくなりました。</li>
      <li><strong>予備のソースに同時に問い合わせるように。</strong>メインのソースで
        埋まらない項目があるとき、RetroDB はほかのソースに1つずつではなく、まとめて
        同時に問い合わせるようになりました。答えは引き続き設定の順番で使われるため、
        各項目では同じソースが優先されます。</li>
      <li><strong>ES-DE のゲーム一覧の読み込みが1回だけに。</strong>一括スクレイピングを
        含むどのスクレイピングでも、システムの ES-DE gamelist.xml をゲームごとに2回
        読んでいました。現在の RetroDB は1回だけ読み、ファイルが変わったときにだけ
        読み直します。</li>
      <li><strong>メタデータを検索の「適用」で再検索しなくなりました。</strong>ゲーム
        ページでチェックを付けた結果は、もう一度検索し直すのではなく、そのソースから
        直接取得されます。何もチェックしていない場合は、適用したソースと AI だけが
        空いた項目を埋めます。</li>
      <li><strong>ScreenScraper が副題付きのゲームを見つけられるように。</strong>
        「Alone in the Dark: The New Nightmare」のようなタイトルは、コロンの前に空白が
        ないと何も見つかりませんでした。現在の RetroDB はその形で検索し、それでも
        見つからなければコロンより前の部分で検索します。</li>
      <li><strong>プレイするものがないゲームにプレイが表示されなくなりました。</strong>
        CLZ、Steam、Xbox、PSN のインポートで追加したゲームには ROM ファイルがありません。
        そのページには、ライブラリのカードと同じく、プレイボタン、エミュレーター設定、
        編集時の起動セクションが表示されなくなりました。</li>
      <li><strong>RetroArch のゲームを2つの困った設定から守るように。</strong>RetroDB は
        ゲームを起動するたびに、あなたの設定に重ねて、RetroArch 専用の小さな設定ファイルを
        渡すようになりました。キーボードをデスクトップ（Wayland または X11）に合わせるため
        キーボードが反応しなくなることがなく、早送りを全速で動かせるので、Commodore 64 の
        ゲームの素早い読み込みに使えます。RetroArch のほかの設定はすべてそのままです。</li>
      <li><strong>Create M3U の後もゲームがライブラリに残るように。</strong>複数ディスクの
        アーカイブをプレイリストに変えると、ゲームはすでに移動されたアーカイブを指したまま
        になっていました。現在は新しいプレイリストを指し、詳細情報や画像もそのまま残ります。
        1つのアーカイブにゲームの複数のリリースがそれぞれ別のディスク一式で入っている場合、
        プレイリストはすべてではなく最初のリリースのディスクを使い、どのディスクを
        外したかを伝えます。</li>
      <li><strong>完全再取得で、すでにあるメディアを残せるように。</strong>完全再取得
        スイッチの横にある「既存のメディアを保持」にチェックを付けてください。文字情報は
        更新されますが、ディスク上にあるアート、動画、マニュアルは再ダウンロードせずに
        そのまま残ります。チェックを付けない場合でも、完全再取得で以前ダウンロードした
        スクリーンショットが消えることはなくなりました。</li>
      <li><strong>バックグラウンドのジョブが作業を失ったり飛ばしたりしなくなりました。</strong>
        問題のあるゲームが1本あっても、RetroAchievements の更新がすでに更新したゲームを
        捨てることはなくなりました。再開した同期や更新が、止まったときのゲームを飛ばすことも
        なくなりました。とても古いスナップショットから再開した RetroAchievements や Steam の
        同期は、何も同期しないまま成功と報告するのではなく、メッセージを出して止まります。
        WebP 変換は、残っていた WebP ファイルを信用する前に確認し、ディスクの空き容量を
        読み取れない場合は開始しません。</li>
      <li><strong>とても古いインストールをアップグレードしても、知らないうちにデータが
        失われることがなくなりました。</strong>古いデータベースのアップグレード手順のうち
        3つが、まれな状態で行を削除することがありました。現在は行をコピーするか、
        失う代わりに分かりやすいエラーで止まります。</li>
      <li><strong>「概要」ウィンドウのボタンが切れなくなりました。</strong>ウィンドウが
        広くなり、4つのボタンが2列に並ぶので、どのラベルも全部表示されます。
        スマートフォンでは縦に並びます。</li>
      <li><strong>テーマが新しいブラウザーでも引き継がれるように。</strong>初めて使う
        ブラウザーでサインインすると、保存したテーマが表示されるようになりました。
        以前はログインページが先に Cyberpunk を記録し、それが残っていました。</li>
      <li><strong>ログインのパスワード欄に「Admin Login」と表示されなくなりました。</strong>
        どのアカウントもパスワードでサインインするため、ダイアログは単に「ログイン」と
        表示します。アカウントページとヘルプページもそのように説明しています。</li>
      <li><strong>ヘルプがすべての言語で最新に。</strong>翻訳されたヘルプページで、
        地域版の説明、すべてのアカウントにパスワードが必要なこと、テーマがアカウントと
        一緒に保存されることが書かれるようになりました。英語を含むすべての言語のヘルプで、
        実際のパスワードの最小文字数である12文字が示されるようになりました。</li>
      <li><strong>小さな修正：</strong>ファイル名にアポストロフィを含むファンアートが、
        ゲームとトロフィーのページに表示されるようになりました。設定ページで管理者以外の
        アカウントにスクリプトエラーが表示されなくなり、スクリーンリーダーで選択中の
        設定タブが読み上げられるようになりました。ページを離れたときに、キャンセルされた
        要求のエラーでブラウザーのコンソールが埋まらなくなりました。アップスケーラーの
        モデルを、まず動作しているアドレスからダウンロードするようになりました。
        また、出力をファイルに保存したときに Windows でインストーラーが
        クラッシュしなくなりました。</li>
      <li><strong>信頼性に関する幅広い修正。</strong>タイトルを空にしてゲームを保存しても、
        ほかの編集内容が失われなくなりました。再起動では、実行中のジョブがまず
        きちんと止まるのを待つようになりました。Create M3U は既存のプレイリストや
        フォルダーを上書きしません。ROMツールで不要ファイルの一覧を空にすると「何も
        削除しない」という意味になり、2つのパターンが「Release of the Dragon」のような
        実際の ROM 名に引っかからなくなりました。PS3 のトロフィーファイルが1つ壊れていても、
        すべてのゲームのトロフィーが空になることはなくなりました。AI補完が書き込む地域は
        1つだけになりました。分析では評価のグラフで各ゲームを1回だけ数えます。
        CLZ のインポートは標準のジャンル名を使います。編集ダイアログでは、ジャンルや
        その他のタグをどの言語でも削除でき、キーボードショートカットが Ctrl+D や Ctrl+G を
        横取りしなくなりました。閲覧者はゲームの達成ステータスを見られますが、全員で
        共有されているため変更はできなくなりました。</li>
      <li><strong>スクリーンリーダーが Platform Match Required スイッチを表示どおりの名前で
        読み上げるように</strong>なりました（設定 → 取得）。</li>
      <li>英語以外の言語で、設定ページの「デフォルト地域」が翻訳され、取得タブが
        「取得中」ではなく名前として読めるようになりました。ヘルプページも同じ言葉を
        使います。</li>
      <li><strong>終了しないゲームが、終了したと表示されなくなりました。</strong>
        停止の後もエミュレーターが残っている場合、RetroDB は実行中として表示し続けます。
        拒否された RetroArch の起動で、先に設定ファイルが書き込まれることはなくなり、
        すぐに失敗したエミュレーターは最初の確認でエラーメッセージを表示します。</li>
      <li>ライブラリの更新：Pillow 13（画像処理）、numpy 2.5.4 と onnxruntime 1.31
        （アップスケーリング）、そしてビルドとリリース用ツールの最新版。</li>
      <li>内部の改善：ゲーム起動のコードを整理して追いやすくし、使われていないコード
        （API のアドレス1つ、PSN の補助機能、どのページも読み込んでいなかったトロフィーの
        スクリプト、どこからも読まれていなかったサイト全体のテーマ設定）を削除しました。
        ブラウザーへのアプリの応答は1か所で作られるようになり、いくつかの設計文書を
        コードに合わせて修正し、テストスイートを整理し、リリース前に JavaScript の構文エラーを
        見つける新しいチェックを追加しました。削除したコードについて書かれていた
        古い変更履歴の項目にも、そのことを記しました。</li>
    </ul>
- version: 3.29.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: ゲームの別名に、その名前が使われる地域を表示
  body: |
    <ul>
      <li><strong>ゲームの別名に、その名前が使われる地域が表示されるように。</strong>
        ゲームページの「別名」カードで、それぞれの名前に国や地域（たとえば「Rockman」なら
        日本）が、あなたの言語で付くようになりました。地域の付いた名前が先に、地域ごとに
        まとめて表示されます。名前にポインターを合わせると、その出典と、「仮題」などの
        メモが表示されます。</li>
      <li>IGDB からの名前にも地域が残るようになりました。以前は ScreenScraper の名前に
        しか地域がありませんでした。</li>
      <li>ScreenScraper の「SS」ラベルが地域として表示されなくなりました。これは
        ScreenScraper 独自のゲーム名で、場所ではありません。</li>
      <li>ROMツール → 別名を補充 が、スクレイピング済みのすべてのゲームを確認するように
        なったため、すでにある名前にも地域が付きます。一度実行して、既存のライブラリに
        地域を付けてください。</li>
    </ul>
- version: 3.28.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: エミュレーターのフォルダーを指定するだけで、RetroDB が設定
  - type: fix
    label: 設定 → エミュレーター ページの修正
  body: |
    <ul>
      <li><strong>エミュレーターのフォルダーを指定するだけで、RetroDB が設定します。</strong>
        設定 → エミュレーター に新しい「エミュレーターフォルダー」一覧ができました。
        エミュレーターが入っているフォルダーを追加すると、RetroDB がその中から AppImage、
        ポータブルスクリプト、インストール済みの Flatpak として1つずつ見つけ、動かせる
        システムに結び付けます。すでに動作するエミュレーターがあるシステムは、それを
        そのまま使います。</li>
      <li><strong>どのシステムがプレイできる状態かが分かるように。</strong>Per-system
        mapping の表に、各システムのエミュレーターがすべて表示され、それぞれが動作するか
        どうかが示され、システムのデフォルトを選べるようになりました。DuckStation、PCSX2、
        RPCS3、RetroArch では BIOS ファイルがそろっているかも表示し、足りないものの名前を
        挙げます。RetroDB は BIOS ファイルを読むだけで、コピーやダウンロードは一切
        しません。</li>
      <li>エミュレーターのスキャンが、大きなエミュレーター用ドライブ上のすべての
        エミュレーターを見つけるようになりました。以前は、エミュレーター自身の設定フォルダーの
        中で途中で止まることがありました。</li>
      <li>RetroArch の Auto-detect ボタンと保存ボタンが再び動作するようになり、
        エミュレーターの編集ウィンドウも、編集を押すまでページに表示されなくなりました。</li>
    </ul>
- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: メタデータの適用で進み具合が表示されるように
  body: |
    <ul>
      <li><strong>メタデータの適用で進み具合が表示されるように。</strong>メタデータを検索で結果を選ぶと、リングが0%から100%まで満ちていき、中央にその割合が表示されます。その下の行には、どのサイトを検索しているか、どの画像や動画をダウンロードしているか、または画像を処理中であるかといった、今行われている処理が表示されます。動画などの大きなダウンロードでは、データが届くにつれてリングが進みます。100%になると、これまでどおり結果を反映してページが再読み込みされます。</li>
      <li>リングの進み方は均一でないことがあります。各ソースは応答した時点で初めて送る画像の数を決めるため、画像の多い最初のソースがリングの大部分を満たし、後のソースの分が少なくなることがあります。</li>
      <li>適用に失敗した場合は、リングが閉じてその旨のメッセージが表示され、ページは再読み込みされません。</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: すべてのページがウィンドウの大きさに合わせて表示されるように
  - type: enhancement
    label: ゲームページで別名を専用のカードに表示、マニュアルボタンも追加
  body: |
    <ul>
      <li><strong>すべてのページがウィンドウの大きさに合わせて表示されるようになりました。</strong>
        カード形式のページ（システム、ミュージアム、タグ、リスト、ROMツール、トロフィー、実績）は、
        カードがもう1枚まるごと収まるたびに列が増え、1行に最大4枚まで並びます。
        表、ツール、詳細ページは少しだけ広がりますが、それ以上広げても列の間隔が
        空くだけになるところで止まります。設定ページの各ボックスは読みやすい幅を保ちます。</li>
      <li><strong>ヘルプと変更履歴は読みやすい行の長さを保ちます。</strong>
        広いウィンドウでは、ヘルプの各セクションへのリンクが本文の横の列に移ります。
        狭いウィンドウでは、スマートフォンの画面の大部分を覆っていたブロックの代わりに、
        スワイプできる1行に並びます。</li>
      <li><strong>ゲームページ：</strong>広いウィンドウでは、スクリーンショットが上部に横一列に並び、
        その下に動画と新しい<strong>別名</strong>カードがカバー画像と同じ高さで横並びになります。
        別名はこれまでタイトルの下に薄い文字で表示されていましたが、読みやすいカードに
        まとめられました。<strong>マニュアル</strong>はプレイの隣のボタンになり、
        取得履歴は最初は折りたたまれた状態で表示されます。</li>
      <li>PSNトロフィーは、常に3列ではなく、ウィンドウに合わせて1～4列で表示されます。</li>
      <li>スマートフォンで横スクロールしてしまうページがいくつか直りました：トロフィー、
        コレクタートロフィー、RetroAchievements のシステムページ、ヘルプ、設定、
        分析、ゲームインポート、実績とトロフィーの詳細ページ。
        これらのページでは、幅の広い表は表の中だけでスクロールするようになりました。</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: ライブラリ、システム、ゲームの各ページがウィンドウの大きさに合わせて表示されるように
  body: |
    <ul>
      <li><strong>広いウィンドウは、役に立つときだけ、その広さを使います。</strong>
        ライブラリと各システムページは、ゲームカードがもう1枚まるごと収まるたびに
        列が増え、1行に最大4枚まで並びます。スマートフォンでは1枚、画面半分のウィンドウでは
        2～3枚、広いウィンドウでは4枚です。これまでは決まった幅で止まり、
        大きなウィンドウの大部分が空いたままでした。</li>
      <li><strong>ゲームページでは、カバー画像と詳細情報がスクリーンショットと動画の横に並びます。</strong>
        横に並べて収まらないときは縦に積み重ねます。説明文は読みやすい行の長さを保ちます。</li>
      <li><strong>プレイボタンは各カードの右上に移動し、</strong>
        小さく中央揃えになりました。さらに、ゲームの ROM ファイルがまだ存在し、
        そのシステムが受け付けるファイル形式であるかも確認するようになったため、
        押せば確実にゲームが始まるところにだけ表示されます。ゲームをまとめて選択している間は
        非表示になります。</li>
      <li>「トップへ戻る」ボタンと進行状況のポップアップは、ウィンドウの端ではなく、
        ページの内容のすぐ横に表示されるようになりました。</li>
      <li>ゲームページがスマートフォンで横スクロールしなくなりました。</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: テスト用の「Pseudo」言語は管理者にのみ表示されるように
  body: |
    <ul>
      <li><strong>「Pseudo」が全員の言語一覧に表示されなくなりました。</strong>
        これはすべての文字を括弧とアクセント記号付きで表示する開発者向けのツールのため、
        管理者にのみ表示されるようになりました。それ以外の人がこれを選んでいた場合は、
        アプリが英語で表示され、設定でも英語が選択された状態になります。</li>
    </ul>
- version: 3.24.1
  date: '2026-10-17'
  tags:
  - type: fix
    label: Windows 版ダウンロードが再びインストールできるように、ウィンドウサイズ変更後のエラー連発も解消
  body: |
    <ul>
      <li><strong>通常の Windows 版ダウンロードがインストールできませんでした。</strong>
        インストーラーが「Core dependencies failed to install」で止まっていました。
        固定されたパッケージ一覧に、Windows だけが必要とするパッケージが含まれていなかったためです。
        現在の一覧はすべてのプラットフォームに対応しています。Python 不要の
        Windows 版ダウンロードには影響はありませんでした。</li>
      <li><strong>右上にエラーメッセージが表示され続けていました。</strong>
        Cyberpunk テーマで、ブラウザのウィンドウを広げたとき（たとえば最大化したとき）に
        起きていました。アニメーション背景が正しくサイズ変更されるようになりました。</li>
    </ul>
- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: ライブラリとシステムページから直接ゲームをプレイ
  body: |
    <ul>
      <li><strong>各ゲームカードに ▶ プレイボタン。</strong>ライブラリページと
        各システムページで、ボックスアートの左下に表示されます。押すとゲームが
        エミュレーターで起動します。先にゲームのページを開く必要はなく、一覧に留まったままです。</li>
      <li>このボタンは、押して実際に動く場合にだけ表示されます。つまり、あなたのアカウントに
        ゲームの起動が許可されていて、ゲームのエミュレーターが有効かつインストール済みで、
        RetroArch の場合はコアがそろっているときです。動作するエミュレーターがない
        システムのゲームにはボタンが表示されません。</li>
      <li>それでも起動に失敗した場合（たとえば ROM ファイルが移動されていたとき）は、
        理由がメッセージで表示され、ページはそのままの状態に保たれます。</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: サイドバーを短く、すべてのプラットフォームの実績を1つのページに
  body: |
    <ul>
      <li><strong>5つのリンクが1つの「実績」リンクになりました。</strong>
        RetroAchievements、RPCS3、PSN、Steam、Xbox が1つのページのタブになり、
        リンクを開くと前回使ったタブが表示されます。RetroAchievements のゲームが
        1つもない場合は、ダッシュボードに戻されるのではなく RPCS3 タブが開きます。</li>
      <li><strong>ROMレポートは ROMツールの中に移りました。</strong>ほかのツールと並ぶタブとして、
        また ROMツールページのカードとして表示されます。</li>
      <li><strong>サイドバーのリンクでアイコンが重複しなくなりました：</strong>ダッシュボードは
        🏠、ログビューアは 🧾 になりました。サイドバーのリンクは 21 個から
        16 個に減りました。</li>
      <li>ROMツール設定ページのツールタブは常に英語で表示されていましたが、
        選んだ言語で表示されるようになりました。</li>
    </ul>
