  body: "<ul>\n  <li><strong>Elke skraper soek die regte konsole.</strong> Atari\n    Lynx, arcade CPS, Super Famicom en ander is op die verkeerde\n    masjien gesoek, en baie meer stelsels word nou glad gesoek,\n    deur elke bron en vir prestasies.</li>\n  <li><strong>'n Speletjie se streek kom eerste uit sy eie lêernaam.</strong>\n    'n Merker soos (USA) bepaal nou die streek, en die KI word nie meer\n    gevra nie. ROM Tools het 'n nuwe hulpmiddel, Regstreeks Streke volgens Lêernaam, vir\n    die speletjies wat ouer skrape verkeerd gekry het.</li>\n  <li><strong>ScreenScraper volg die speletjie se streek.</strong> Die boks,\n    3D-boks, handleiding, titel en verskyningsdatum kom nou uit die speletjie se eie\n    streek, nie die een wat alfabeties eerste was nie. ROM Tools het 'n\n    nuwe hulpmiddel, Herstel boks- en handleidingstreke, vir ouer skrape. Video's\n    probeer nou eers die kleiner lêer.</li>\n  <li><strong>RAWG-prente is nie meer bokskuns nie.</strong> Dit is dikwels\n    skermkiekies, en hulle het 'n regte omslag geblokkeer. Hulle word nou as\n    fankuns gebruik. ROM Tools het 'n nuwe hulpmiddel, Verwyder RAWG-prente uit bokskuns,\n    vir dié wat ouer skrape gestoor het. RetroDB gee ook erkenning aan RAWG met 'n\n    skakel in die kantbalk, soos RAWG vra.</li>\n  <li><strong>ES-DE behou sy plek in jou skraapvolgorde.</strong> Wanneer\n    dit nie die hoofbron was nie, het latere bronne en die KI sy\n    teks en omslae vervang, en sy skermkiekies is weggelaat. Hulle bly nou.\n    Dit kopieer nie meer media wat 'n speletjie reeds het nie, en dit lees die inskrywing\n    vir die speletjie se eie ROM-lêer. PS3-gidsspeletjies vind nou hul ES-DE-\n    omslae. Die invoer van stelsellogo's neem nie meer 'n onverwante prent nie.\n    'n Volledige herskraap verwyder nie meer 'n boks wat 'n ander bron pas\n    afgelaai het nie.</li>\n  <li><strong>Skermkiekie-hersiening.</strong> 'n Nuwe hulpmiddel in ROM Tools lys\n    ZX Spectrum-, Commodore 64- en Game Boy-skermkiekies met die\n    verdagste eerste, en verwyder net wat jy kies. Skraap weier nou 'n Game Boy-skermkiekie waarvan die oorspronklike veel meer skakerings het\n    as wat die masjien kon wys. Op 8-bis- en 16-bis-stelsels voeg dit nie meer\n    IGDB- of RAWG-skermkiekies by 'n speletjie wat op verskeie\n    stelsels uitgereik is nie.</li>\n  <li><strong>RetroAchievements-aanmelding bereik DuckStation en PCSX2</strong>\n    wanneer jy Speel druk.</li>\n  <li><strong>Op 'n speletjie se bladsy:</strong> die links- en regspyltjies gaan\n    na die vorige en volgende speletjie, die Kulkodes-afdeling vou toe en\n    onthou dit, die onderste panele pas in die venster, en die emulator word\n    op sy Emulator-instellingskaart genoem, nie langs Speel nie.</li>\n  <li><strong>Voer 'n 3D-boks in</strong> sit nou in die Wysig-venster, langs\n    die ander prente.</li>\n  <li><strong>'n Venster wat by 'n teksblokkie begin,</strong> soos Skraap,\n    plaas nou die wyser in daardie blokkie in plaas van op die sluitknoppie.</li>\n</ul>\n"
