  body: |
    <ul>
      <li><strong>Kulkodes vir RetroArch (RetroDB), DuckStation en
        PCSX2.</strong> Instellings &gt; Emulators het 'n nuwe Kulkodes-afdeling.
        Laai die gratis openbare kulkodepakke daar af, of voer kulkodevouers
        in wat jy reeds het; RetroDB kopieer die lêers en verander nooit jou
        vouer nie. 'n Speletjie se bladsy lys dan sy kulkodes, elkeen met 'n
        aan/af-skakelaar, en 'n soekkassie wanneer daar baie is. In
        RetroArch (RetroDB) geld die kulkodes wat jy aanskakel die volgende
        keer dat jy Speel druk, en veranderinge wat jy tydens die spel in
        RetroArch se kieslys maak, word behou. Vir DuckStation en PCSX2 word
        die skakelaars in die emulator se eie instellings vir die speletjie
        gestoor, sodat veranderinge binne die emulator ook op die bladsy wys.
        RetroDB oorskryf nooit 'n kulkodelêer wat 'n emulator reeds het nie.
        'n Kulkode wat aan is, onderbreek RetroAchievements se
        hardcore-modus.</li>
      <li><strong>Voer 'n Slipcase-3D-boks vir 'n speletjie in.</strong> 'n
        Speletjie se bladsy het 'n Voer 3D-boks in-knoppie onder die omslag.
        Kies die <code>.box.json</code>-lêer wat Slipcase gestoor het, saam
        met sy prente, en RetroDB hou die boks se voorkant, rug, agterkant en
        ander vlakke vir daardie speletjie. Slipcase 1.4.0 of nuwer stoor hierdie lêer langs elke uitgevoerde prent. Jou 3D-bokskunsprent word nie
        verander nie. 'n Speletjie wat reeds vlakke het, vra voordat dit hulle
        vervang, en Verwyder skrap hulle.</li>
      <li><strong>Draai 'n speletjie se 3D-boks in jou hande.</strong> Klik
        op die omslag van 'n speletjie met 'n ingevoerde Slipcase-boks en die
        boks verskyn in 3D. Sleep dit, of gebruik die pyltjiesleutels, om dit
        te draai en die rug, agterkant, bo- en onderkant te sien. Rol of druk
        + en - om te zoem; dubbelklik of druk Home om dit terug te sit. 'n
        Speletjie sonder 'n ingevoerde boks zoem steeds na sy omslagprent.</li>
      <li><strong>Instellings skakel na die Emulators-bladsy.</strong> Die
        Emulators-bladsy het nêrens in Instellings 'n skakel gehad nie, so jy
        kon dit net bereik deur sy adres in te tik. Admins sien nou 'n
        Emulators-oortjie ná Stelsel, en die Emulators-bladsy wys dieselfde
        oortjiebalk, sodat die ander oortjies een klik ver is.</li>
      <li><strong>Die omslagzoem is nie meer agter die kieslyste versteek
        nie.</strong> Op 'n foon het die boonste en onderste balke oor die
        gezoemde omslag gelê en sy toemaakknoppie versteek, en op 'n rekenaar
        het die kantbalk sy linkerkant bedek. Die zoem maak nou bo-oor alles
        oop.</li>
      <li><strong>Claude 5.5-modelle vir die KI.</strong> Instellings &gt; Skraap lys Anthropic se nuutste Claude-modelle: Haiku 5.5, die nuwe verstek en die goedkoopste, Sonnet 5.5 en Opus 5.5, met hul huidige pryse. RetroDB stuur nie meer 'n instelling wat Sonnet 5.5 weier nie.</li>
      <li><strong>Tik 'n speletjie se verkoopsyfer in.</strong> Albei wysigskerms het 'n Kopieë verkoop-blokkie onder Ontwikkelaar. 'n Syfer wat jy intik, wys op die speletjie se bladsy, net soos een wat die KI gevind het. Maak die blokkie leeg om dit te verwyder.</li>
      <li><strong>Toets jou KI-sleutel in Instellings.</strong> Instellings &gt; Skraap het ’n knoppie Toets gestoorde KI-sleutel onder die KI-verskaffer. Dit sê of die sleutel werk en, indien nie, hoekom: ’n geweierde sleutel, geen krediet nie, of ’n gebruikslimiet. Voorheen het ’n geweierde sleutel gelyk of dit werk.</li>
      <li><strong>Claude kan die web vir verkoopsyfers deursoek.</strong> Instellings &gt; Skraap het 'n Laat Claude die web deursoek-skakelaar onder die Claude-model, eers af. Sonder soek antwoord Claude uit wat dit reeds weet en laat kopieë verkoop leeg. Met dit aan slaan Claude syfers na. Anthropic vra geld vir elke soektog, so AI-vul doen hoogstens 5 soektogte per speletjie, tot 5 VS-sente; skakel die skakelaar af voor 'n groot massa-skraap.</li>
      <li><strong>AI-vul 'n hele stelsel gelyk.</strong> ROM-gereedskap het 'n nuwe Massa-AI-vul-bladsy, wat ook Amptelike name bevat. Kies 'n stelsel, of Alle stelsels, skakel die velde aan wat jy gevul wil hê, en druk Vul met KI: RetroDB doen AI-vul op elke speletjie, dieselfde as die AI-vul-knoppie op 'n speletjie se bladsy, en stoor die antwoorde reguit in die speletjie. 'n Vorderingsbalk en 'n AI-vul-kennisgewingkassie wys hoe ver dit gevorder het, en jy kan die bladsy verlaat terwyl dit loop. Dit wys hoeveel speletjies dit sal vul en vra eers, omdat jou KI-verskaffer vir elke speletjie vra. Speletjies wat AI-vul reeds gedoen het, word oorgeslaan tensy jy hulle weer inskakel, en die lopie stop vanself as die KI ophou antwoord.</li>
      <li><strong>Taakkennisgewings gebruik jou tema se kleure.</strong> Die kennisgewingkassies wat 'n lopende taak wys, soos Massa-Skraap en RA Sync, en die vorderingsbalke gebruik nou die kleure van die tema wat jy gekies het. 'n Taak wat nie kan pouseer nie, wys nie meer sy titel in die gepouseerde kleur nie.</li>
      <li><strong>Die Emulators-bladsy lyk soos die ander Instellings-oortjies.</strong> Instellings &gt; Emulators is nou in kaarte verdeel, en 'n balk onder die oortjies spring na elkeen: RetroArch, Speel in RetroDB, Cores, Kulkodes, Vouers, Emulators en Toewysing. Die balk bly bo terwyl jy rol en merk die afdeling waarin jy is.</li>
      <li><strong>Aflaaivordering langs die knoppie.</strong> Wanneer jy RetroArch, die speler se cores of 'n kulkodepak aflaai, wys 'n nota langs die knoppie as 'n persentasie hoe ver dit gevorder het. Voorheen het 'n reël onder die knoppies verskyn en die res van die bladsy afgedruk.</li>
      <li><strong>Kies elke stelsel se emulator uit 'n lys.</strong> Toewysing per stelsel op Instellings &gt; Emulators wys nou elke stelsel een keer, met 'n lys van die emulators wat daaraan gekoppel is. Die een wat jy kies, is wat Speel vir daardie stelsel se speletjies gebruik, tensy 'n speletjie sy eie stel. 'n Emulator wat RetroDB nie kan vind nie, word as "nie gevind nie" gemerk. Voorheen het elke stelsel 'n ry per emulator gehad, met 'n klein kolletjie om die verstek te kies. RetroDB se eie RetroArch is nou in die lys vir elke gelyste stelsel wat dit kan laat loop, ook stelsels wat nog geen speletjies het nie.</li>
      <li><strong>'n Blaai-knoppie by elke padblokkie.</strong> Administrateurs kan nou 'n vouer of program kies deur deur die rekenaar se vouers te klik in plaas daarvan om die pad te tik: Instellings &gt; Emulators, Biblioteek, Skraap en Rekening, en die instellings van ROM-gereedskap. Blokkies wat 'n program verwag, wys ook lêers. Versteekte vouers soos <code>.config</code> word laaste gelys.</li>
      <li><strong>Die linkerstok werk as die D-Pad in RetroDB se RetroArch.</strong> In speletjies vir stelsels sonder 'n stok, soos NES of Mega Drive, kan jy nou met die linkerstok sowel as die D-Pad beweeg. Wanneer 'n speletjie se emulator-core self die stok lees, soos op Nintendo 64, bly die stok 'n regte stok.</li>
      <li><strong>Meld by RetroAchievements aan vanuit Instellings.</strong> Instellings &gt; Rekening kan jou nou aanmeld vir RetroDB se RetroArch, sodat prestasies ontsluit word terwyl jy speel sonder om binne die emulator aan te meld. Jou wagwoord gaan net na RetroAchievements en word nie gehou nie. Elke RetroDB-gebruiker het sy eie aanmelding en sy eie Hardcore-modus-skakelaar, wat af begin. DuckStation en PCSX2 meld steeds vanuit hul eie kieslyste aan.</li>
      <li><strong>Sien watter emulator Speel gaan gebruik.</strong> 'n Speletjie se bladsy sê nou "Begin in:" en die emulator se naam langs die Speel-knoppie, of sê dat geen emulator opgestel is nie.</li>
      <li><strong>Die Kulkodes-paneel sê waarom 'n speletjie geen kulkodes het nie.</strong> Wanneer 'n speletjie se emulator nie kulkodes kan gebruik nie, gee die paneel nou die rede in plaas daarvan om versteek te bly.</li>
      <li><strong>Lang vouerpaaie pas op 'n foon.</strong> 'n Lang vouerpad in Instellings laat die bladsy nie meer sywaarts rol nie.</li>
    </ul>
