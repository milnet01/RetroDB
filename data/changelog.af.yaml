  body: |
    <ul>
      <li><strong>RetroDB is gereed vir sy eie speletjiespeler.</strong> 'n
        Speler gebaseer op RetroArch word vir RetroDB gebou. Wanneer dit
        kom, sal RetroDB speletjies daarin begin met instellings wat vir
        elke speletjie gekies is, en enige instellings hou wat jy verander
        terwyl jy speel. Dit sal sy stoorlêers en instellings in sy eie vouer
        hou, apart van jou eie RetroArch. Dit kies die beste core vir elke
        konsole en laai dit af die eerste keer dat jy Speel druk; die knoppie
        sê intussen "Laai tans die core af…". Dit speel enige konsole wat
        geen werkende emulator het nie, en vervang nooit een wat jy opgestel
        het nie. Per speletjie kan jy 'n ander core kies, die skermeffek,
        heelgetal-skalering en vermindering van invoervertraging. Admins kan
        elke core gelyk installeer of opdateer, of aflaaie afskakel. Niks
        verander totdat die speler geïnstalleer is nie; tot dan word dit nie
        onder Instellings &gt; Emulators gelys nie.</li>
      <li><strong>Die Museum se oortjies wissel weer.</strong> Op 'n konsole se
        Museum-bladsy het 'n klik op Spesifikasies, Top 10 speletjies of
        Beheerders niks gedoen nie en 'n "Onverwagte fout"-boodskap gewys,
        sedert weergawe 3.30.0. Elke oortjie maak nou oop.</li>
      <li><strong>PlayStation 3-speletjies wat as 'n vouer gestoor is, kan
        gespeel word.</strong> 'n PS3-skyfspeletjie is gewoonlik 'n vouer wat
        op ".PS3" eindig. RetroDB het geweier om dit te begin en geen
        Speel-knoppie gewys nie, omdat dit 'n enkele lêer verwag het. Dit gee
        nou die vouer aan die emulator, soos RPCS3 verwag.</li>
      <li><strong>Soek Metadata se kolomme lyn op, en dit pas op 'n
        foon.</strong> 'n Bron met meer resultate as wat pas, het 'n rolstaaf
        gekry, wat sy titels smaller gemaak het, so dieselfde titel het in een
        kolom gevou en nie in die volgende nie. Elke kolom hou nou dieselfde
        ruimte, met 'n dun rolstaaf in die tema se kleure. Op 'n foon of smal
        venster is die soekvenster langs 'n versteekte sybalk saamgedruk; dit
        vul nou die skerm.</li>
      <li><strong>'n Nuwe Windows- of Mac-installasie benoem RetroArch-cores
        korrek.</strong> RetroDB het RetroArch oral met Linux se core-lêername
        opgestel, so op Windows en macOS is geen core gevind nie. 'n Nuwe
        installasie gebruik nou elke rekenaar se eie name. 'n Bestaande
        installasie hou die name wat dit het; verander hulle in die
        koppeltabel.</li>
      <li><strong>Die skermskootkyker wys albei pyltjies, elkeen binne sy
        knoppie.</strong> Die sybalk het die linkerpyltjie bedek, so jy kon
        nie met die muis na 'n vroeëre skermskoot teruggaan nie. Die
        regterpyltjie het ook onder sy knoppie gesit. Albei wys nou, in die
        middel van hul knoppies.</li>
      <li><strong>Die Emulators-instellingsbladsy wys in jou taal.</strong>
        Die meeste van Instellings &gt; Emulators was Engels, watter taal jy
        ook al gekies het: sy opskrifte, die emulatortabel, die
        skanderingsresultate en die Wysig emulator-venster. Alles is nou
        vertaal.</li>
      <li><strong>Die Spelers-blokkie neem meer as 16.</strong> Albei
        redigeervensters het by 16 gestop, so jy kon nie MAG se 256 spelers
        invoer nie. 'n Speletjie wat 'n skraper meer as 16 gegee het, kon
        glad nie gestoor word totdat jy die getal verlaag het nie. Daar is nou
        geen boonste grens nie.</li>
      <li><strong>AI-vul gee PC-speletjies 'n PC-stoortipe, nie 'n konsole
        s'n nie.</strong> 'n Windows-speletjie kon "Geheuekaart" kry omdat die
        KI sy PlayStation 2-weergawe beskryf het. Die KI word nou gesê om die
        uitgawe op jou speletjie se eie platform te beskryf. PC's, en konsoles
        vanaf PlayStation 3 en Xbox 360, stoor na Interne berging.</li>
      <li>Om 'n speletjie reg te stel wat reeds 'n verkeerde stoortipe het,
        skraap dit weer of laat AI-vul loop. Albei vra die KI weer en vervang
        die ou waarde.</li>
      <li><strong>Om PlayStation te koppel, sê nou dat jy eers moet
        aanmeld.</strong> Onder Instellings &gt; Rekening &gt; PSN het die
        Sony-rekeningbladsy net "Invalid login" gewys tensy jy reeds by
        PlayStation aangemeld was, en die stappe het dit nie gesê nie. Stap 1
        het nou 'n "Meld aan by PlayStation"-knoppie om eerste te druk.</li>
      <li><strong>Sorteer die Biblioteek, en wys slegs ongeskraapte
        speletjies.</strong> Die Biblioteek en elke stelselbladsy het 'n
        Sorteer volgens-kieslys langs die speletjietelling: naam, nuutste of
        oudste uitgawe, kritikustelling, gebruikertelling, of onlangs
        bygevoeg. Speletjies sonder 'n datum of telling kom laaste. Die
        A–Z-balk werk wanneer op naam gesorteer word en is andersins
        uitgegrys. 'n Nuwe Ongeskraap-knoppie wys net die speletjies wat nog
        geen skraper ingevul het nie.</li>
      <li><strong>'n Filter wat niks pas nie, sê so.</strong> Die bladsy het
        vroeër leeg geword. Dit sê nou dat geen speletjies pas nie, met 'n
        knoppie om die filters skoon te maak.</li>
      <li><strong>Die Biblioteek se filterbalk hou alles op sy
        plek.</strong> Om Kies te druk, te filter of te sorteer het die
        speletjies vroeër af in die bladsy gedruk. Die keusegereedskap
        verskyn nou in 'n balk onderaan die venster. Maak skoon is altyd
        daar, uitgegrys totdat 'n filter aan is. Aktiewe filters wys langs
        die speletjietelling. "Wys Bonus" is nou "Bonusskywe", en lig op
        wanneer dit aan is. Op 'n foon maak die filterknoppies oop vanaf een
        Filters-knoppie oor die bladsy.</li>
      <li><strong>'n Leë biblioteek wys 'n verwelkoming met 'n
        Skandeer-knoppie.</strong> 'n Nuwe installasie het vroeër 'n
        gesondheidstelling gewys wat op 0% vasgesit het, en 'n leë Biblioteek.
        Albei bladsye sê nou die biblioteek is leeg en bied 'n Skandeer
        biblioteek-knoppie aan. Die Kontrolebord skakel ook na die
        ROM-vouer-instelling. Gebruikers wat nie admins is nie, word gesê om
        'n admin te vra. Lukrake speletjie is versteek totdat daar speletjies
        is om uit te kies.</li>
      <li><strong>Skandeer biblioteek werk vanaf die Stelsels-bladsy en
        Instellings.</strong> Daardie twee Skandeer biblioteek-knoppies het
        niks gedoen wanneer hulle gedruk is nie. Net die Kontrolebord s'n het
        gewerk. Die Kontrolebord se eie Skandeer biblioteek-knoppie wys nou
        net aan admins, die enigste gebruikers wat mag skandeer.</li>
      <li><strong>Die opstellingsassistent wys by watter stap jy is, en
        watter stappe opsioneel is.</strong> Dit sê "Stap 3 van 6", nommer elke
        stap, merk die stappe af wat jy verby is, en merk ES-DE en
        API-sleutels as opsioneel. Op 'n foon wys dit die nommers en die
        huidige stap se naam.</li>
      <li><strong>Filtreer die Biblioteek op verskeie genres, reekse of
        uitgewers tegelyk.</strong> In die Genre-, Reeks-, Uitgewer-,
        Ontwikkelaar-, Speelmodusse-, Perspektief- en Dimensie-filters, merk
        soveel waardes as wat jy wil en druk Pas toe: 'n speletjie wys as dit
        enige daarvan het. Stel die venster op IS NIE om speletjies te
        versteek wat enige van die gemerkte waardes het. Elke waarde kry sy
        eie etiket, en sy ✕ verwyder net daardie waarde.</li>
    </ul>
