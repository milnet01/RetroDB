    label: Speletjies wat slegs aanlyn is van IGDB word nie meer as plaaslike multispeler gelys nie, en 'n speletjie wat twee spelers nodig het, word nie meer as enkelspeler gelys nie
  body: "<ul>\n  <li><strong>Skraap hou op om die verkeerde speletjie te neem.</strong> 'n Vervolg\n    gaan nie meer deur vir die speletjie wat jy het nie, so Street Fighter II kry niks\n    van Street Fighter nie, en 'n grootmaat-skraap vereis dat die titel ooreenstem, nie net\n    die konsole nie. IGDB-mods, DLC en bundels pas nie meer nie, tensy jou\n    ROM daardie presiese naam het.</li>\n  <li><strong>RAWG hou op om weergawes van 'n speletjie te meng.</strong> Wanneer sy rekord\n    verskeie konsole dek, verskaf dit nie meer ontwikkelaar, uitgewer, ouderdoms-\n    gradering of multispeler-modusse nie, en dit raai nie meer 'n spelertal nie.\n    Dit word nie meer vir Commodore 64- en DOS-speletjies deursoek nie.</li>\n  <li><strong>Jou skraapvolgorde besluit tussen ewe goeie ooreenkomste.</strong>\n    RAWG kry nie meer ekstra punte vir 'n prent of 'n Metacritic-telling nie, en nuwe\n    installasies lys dit laaste.</li>\n  <li><strong>'n Vrystellingsdatum wys net wat sy bron weet.</strong> 'n\n    Speletjie wat net volgens sy jaar bekend is, wys daardie jaar. Datums van IGDB en RAWG\n    behoort aan die speletjie se eie konsole, en die Vrystellingsdatums-lys word nou\n    ook van IGDB en ScreenScraper gevul.</li>\n  <li><strong>Een stel name vir genres, perspektiewe en modusse.</strong>\n    Filters vind nou elke speletjie, en speletjies wat slegs aanlyn is, word nie meer gelys\n    as plaaslike multispeler nie.</li>\n  <li><strong>Twee nuwe ROM-nutsgoed-kaarte.</strong> Maak Vrystellingsdatums Skoon en Maak\n    Genres, Perspektiewe en Modusse Skoon korrigeer wat ouer skraapwerk gestoor het. Druk\n    hulle, en doen dan 'n grootmaat-skraap met Vul Ontbrekende In.</li>\n  <li><strong>Spelertalle kom van die speletjie se eie konsole,</strong> en\n    'n ScreenScraper-resultaat wat jy kies, is altyd die speletjie wat jy kry.</li>\n</ul>\n"
