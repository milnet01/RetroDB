  body: |
    <ul>
      <li><strong>Soek enige speletjie of konsole vanaf elke bladsy.</strong>
        'n Soekblokkie sit nou onder jou naam in die sybalk. Tik twee of meer
        letters om ooreenstemmende konsoles en tot agt ooreenstemmende
        speletjies te sien, elk met sy konsole. Klik op een, of kies dit met
        die pyltjiesleutels en druk Enter, om dit oop te maak. "Sien alle
        resultate" maak die Biblioteek met daardie soektog oop. Druk / om na
        die blokkie te spring wanneer 'n bladsy nie sy eie soekblokkie het
        nie.</li>
      <li><strong>Makliker om op 'n foon of tablet rond te beweeg.</strong> Op
        'n smal skerm hou 'n balk bo die kieslysknoppie en 'n soekknoppie wat
        die kieslys oopmaak met die wyser reeds in die soekblokkie. 'n Balk
        onder neem jou met een tik na die Kontrolebord, Biblioteek, Stelsels
        en Prestasies. Die kieslys is nou solied, so die bladsy wys nie meer
        daardeur nie. Tik buite dit of druk Escape om dit toe te maak. Op
        vensters van tabletgrootte was die kieslysknoppie weg, so die kieslys
        kon glad nie oopgemaak word nie; dit is nou daar. Oortjie- en
        filterbalke wat op die skerm bly terwyl jy rol, stop net onder die
        boonste balk, nie agter dit nie.</li>
      <li><strong>Instellings &gt; Emulators pas op 'n foon.</strong> Sy
        tabelle was wyer as 'n foon, so die Wysig- en Instellings-knoppies het
        van die skerm af gesit. Op 'n foon is elke ry nou 'n kaart met sy
        knoppies binne-in.</li>
      <li><strong>Om 'n speletjie se prente skoon te maak, laat nie meer
        verdwaalde lêers agter nie.</strong> As jy 'n speletjie se prente
        skoongemaak het terwyl RetroDB hulle nog in die agtergrond skerper
        gemaak het, kon dit hulle terugskryf as lêers wat geen speletjie
        gebruik nie. Dit kyk nou eers en slaan hulle oor. Die "Prente word
        verbeter"-telling laat die skoongemaakte speletjie ook dadelik
        val.</li>
      <li><strong>Titels wat jy tik, word behou wanneer geskraap
        word.</strong> 'n Skraap, selfs 'n Volledige herskraap, het vroeër 'n
        titel wat jy in die redigeervenster getik het, met die skraper se naam
        vervang. Nou word 'n titel wat jy verander, behou. 'n Nuwe "Hou
        hierdie titel wanneer geskraap word"-blokkie onder die titel wys dit;
        ontmerk dit om skrapers weer die speletjie te laat hernoem. Herstel op
        'n speletjie se bladsy laat hulle ook toe.</li>
      <li><strong>Amptelike name vir jou speletjies, deur jou
        nagegaan.</strong> ROM-gereedskap het 'n nuwe Amptelike Name-bladsy.
        Druk "Vra die KI" vir een stelsel of almal, en die KI stel elke
        speletjie se volle amptelike naam voor soos dit in sy ROM se eie
        streek uitgereik is, so 'n Japannese Mega Man-ROM word Rockman. Jy
        sien elke ou en nuwe naam langs mekaar, merk dié wat jy wil hê en
        aanvaar hulle. Niks verander totdat jy dit doen nie. Die ou naam word
        as 'n alternatiewe titel gehou, en 'n aanvaarde naam word behou
        wanneer geskraap word. 'n Verwerpte naam word nie weer voorgestel nie.
        Dit het 'n KI-verskaffer in Instellings &gt; Skraap nodig.</li>
      <li><strong>Speletjies wat net met 'n jaar gedateer is, kan gewysig word
        en hou hul jaar.</strong> Baie speletjies is net met hul jaar
        gedateer, soos 1985. Op 'n speletjie se bladsy het die redigeervenster
        geweier om hulle te stoor. In die Biblioteek se redigeervenster het
        die stoor van een sy jaar uitgevee. Albei aanvaar nou 'n jaar, 'n jaar
        en maand, of 'n volle datum.</li>
    </ul>
