  - type: fix
    label: Kardoes-speletjies kry nie meer 'n versonne Battery Save-tipe nie, en nuwe AI-antwoorde verstek nie meer na Standard Edition nie
  - type: fix
    label: '''n Speletjie se reeks kom nie meer van die opsny van sy titel nie, so Need For Speed is nie meer in ''n reeks genaamd Need nie. IGDB se reeksname word weer gelees, en ou raaiskote word uitgevee sodat die volgende skraap dit weer vul'
  - type: fix
    label: Beskrywings wys nie meer webkodes in plaas van aanhalingstekens nie, of opskrifmerke soos
  - type: fix
    label: Een maatskappy het nou een spelling, so as jy op Sega klik, vind jy elke SEGA-speletjie. Streke hou een waarde, en platforms gebruik die name in die lys
  - type: fix
    label: Speletjietitels van RAWG kry nie meer 'n jaar by nie, en alternatiewe titels lys nie meer lêernaam soos dosbox.exe nie
  - type: fix
    label: Volledige herskraap vervang nie meer 'n gradering of beheerder wat jy gestel het met 'n raaiskoot nie, en 'n skraap wat halfpad misluk skryf nie meer deur 'n minder noukeurige roete nie
  body: "<ul>\n  <li><strong>AI-antwoorde sê hulle is AI.</strong> Ouderdomsgraderings van die AI\n    bly, gemerk as 'n raaiskoot gebaseer op die speletjie se inhoud, met die jaar waarin elke\n    graderingsraad begin het. Tellings en verkope van die AI is ook gemerk.</li>\n  <li><strong>RetroAchievements wys die regte speletjie.</strong> Vervolge dra\n    nie meer die eerste speletjie se prestasies nie. Nadat jy opdateer, bied die\n    kontroleskerm een keer 'n RetroAchievements-herlaai aan. Druk dit om\n    ou skakels reg te maak. Vordering wat onder 'n verkeerde skakel gestoor is, word verwyder, en die volgende\n    sinkronisering vul dit weer in.</li>\n  <li><strong>Speeltydtotale is korrek.</strong> Tye onder 'n uur is\n    as ure getel, so die totale op die kontroleskerm en die versamelaarstrofeë\n    was te hoog. Sommige totale en trofeë sal afgaan.</li>\n  <li><strong>HowLongToBeat vind die regte speletjie.</strong> 'n Vervolg gaan nie meer\n    vir die speletjie deur wat jy het nie, en die speletjie se stelsel en jaar tel nou.\n    'n Passing op 'n ander stelsel, of van jare later, wag vir jou\n    op die hersieningsbladsy.</li>\n  <li><strong>Gaan na wat reeds gestoor is.</strong> Druk Check Saved Play\n    Times in ROM Tools om twyfelagtige gestoorde passings na die hersieningsbladsy te stuur.\n    Niks verander voordat jy besluit nie.</li>\n  <li><strong>Reeksnames is eg.</strong> 'n Speletjie se reeks kom nie meer\n    van die opsny van sy titel nie. Nadat jy opdateer, word reeksname wat\n    geraai is uitgevee, ook sommige wat reg was. Die volgende skraap\n    vul hulle uit bronne wat 'n reeks noem.</li>\n  <li><strong>Skoon teks.</strong> Beskrywings wys nie meer webkodes of\n    opskrifmerke nie. Een maatskappy het een spelling, 'n speletjie het een streek, en\n    lêernaam soos dosbox.exe word nie meer as ander titels gelys nie. Dit\n    gebeur een keer, vanself, nadat jy opdateer.</li>\n  <li><strong>Volledige herskraap hou jou keuses.</strong> 'n Gradering of\n    beheerder wat jy gestel het bly, tensy 'n bron regtig een verskaf.</li>\n</ul>\n"
