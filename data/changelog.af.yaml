- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: "Elke bladsy pas nou in die venster waarin dit is"
  - type: enhancement
    label: "Die speletjiebladsy wys ander name op hul eie kaart, en 'n Handleiding-knoppie"
  body: |
    <ul>
      <li><strong>Elke bladsy pas nou in die venster waarin dit is.</strong> Kaartbladsye
        (Stelsels, Museum, Etikette, Lyste, ROM-gereedskap, trofeë en prestasies)
        voeg 'n kolom by wanneer nog 'n hele kaart pas, tot vier per ry.
        Tabelle, gereedskap en detailbladsye word 'n bietjie wyer, maar hou op
        waar breër net hul kolomme verder uitmekaar sou sprei. Instellings hou sy
        blokke op 'n leesbare breedte.</li>
      <li><strong>Hulp en die veranderingslog hou 'n gemaklike
        reëllengte.</strong> In 'n wye venster skuif die Hulp-afdelingskakels na 'n
        kolom langs die teks; in 'n smal venster staan hulle in 'n enkele ry wat jy
        kan swiep, in plaas van 'n blok wat 'n groot deel van 'n foon se
        skerm bedek het.</li>
      <li><strong>Die speletjiebladsy:</strong> in 'n wye venster loop die skermskote
        bo-oor die bladsy, met die video en 'n nuwe <strong>Ook bekend
        as</strong>-kaart langs mekaar daaronder, gelyk met die omslag. Die ander
        name was dowwe teks onder die titel; hulle staan nou op 'n kaart wat
        maklik is om te lees. <strong>Handleiding</strong> is 'n knoppie langs Speel, en die
        Skraapgeskiedenis begin toegevou.</li>
      <li>PSN-trofeë wys een tot vier kolomme na gelang van die venster, in plaas van
        altyd drie.</li>
      <li>Verskeie bladsye rol nie meer sywaarts op 'n foon nie: Trofeë,
        Versamelaartrofeë, die RetroAchievements-stelselbladsy, Hulp, Instellings,
        Analise, Speletjie-invoere en die prestasie- en trofeedetailbladsye.
        Wye tabelle rol nou daar binne hulself.</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: "Biblioteek-, stelsel- en speletjiebladsye pas nou in die venster waarin hulle is"
  body: |
    <ul>
      <li><strong>Bladsye gebruik 'n wye venster wanneer dit help, en net dan.</strong>
        Die Biblioteek en elke stelselbladsy voeg 'n kolom speletjiekaarte by
        wanneer nog 'n hele kaart pas, tot vier per ry. 'n Foon wys
        een, 'n halfskermvenster twee of drie, 'n wye venster vier. Bladsye het
        vroeër by 'n vaste breedte gestop en die grootste deel van 'n groot venster leeg gelaat.</li>
      <li><strong>Die speletjiebladsy sit sy omslag en besonderhede langs die
        skermskote en video</strong> wanneer albei langs mekaar pas, en stapel
        hulle andersins. Die beskrywing hou 'n gemaklike reëllengte.</li>
      <li><strong>Die Speel-knoppie het na elke kaart se regter-boonste hoek geskuif,</strong>
        kleiner en gesentreer. Dit kontroleer nou ook dat die speletjie se ROM-lêer nog
        daar is en van 'n tipe is wat sy stelsel aanvaar, sodat dit net verskyn waar
        'n druk daarop die speletjie sal begin. Dit verdwyn terwyl jy speletjies in
        grootmaat kies.</li>
      <li>Die terug-na-bo-knoppie en die vorderingsopspringers sit net langs die
        bladsy se inhoud in plaas van by die verste rande van die venster.</li>
      <li>Die speletjiebladsy rol nie meer sywaarts op 'n foon nie.</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: "Die \"Pseudo\"-toetstaal word net aan administrateurs aangebied"
  body: |
    <ul>
      <li><strong>"Pseudo" verskyn nie meer vir almal in die taallys
        nie.</strong> Dit is 'n ontwikkelaarshulpmiddel wat elke woord in
        hakies en aksente wys, en word nou net aan administrateurs aangebied. Enigiemand anders
        wat dit gekies het, sien die app in Engels, met Engels gekies in
        Instellings.</li>
    </ul>
- version: 3.24.1
  date: '2026-10-17'
  tags:
  - type: fix
    label: "Die Windows-aflaai installeer weer, en geen vloed foute ná die verander van grootte nie"
  body: |
    <ul>
      <li><strong>Die gewone Windows-aflaai kon nie installeer nie.</strong>
        Die installeerder het gestop by "Core dependencies failed to install",
        omdat sy vasgestelde pakketlys 'n pakket uitgelaat het wat net Windows
        nodig het. Die lys dek nou elke platform. Die Windows-aflaai sonder
        Python is nie geraak nie.</li>
      <li><strong>Foutboodskappe het aanhou verskyn in die regter-boonste hoek</strong>
        op die Cyberpunk-tema nadat die blaaiervenster wyer gemaak is, byvoorbeeld
        deur dit te maksimeer. Die geanimeerde agtergrond verander nou netjies
        van grootte.</li>
    </ul>
- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: "Speel 'n speletjie reguit vanaf die Biblioteek- en stelselbladsye"
  body: |
    <ul>
      <li><strong>'n ▶ Speel-knoppie op elke speletjiekaart.</strong> Dit verskyn in
        die onderste linkerhoek van die boksprent op die Biblioteek-bladsy en op
        elke stelselbladsy. Druk dit en die speletjie begin in sy emulator; jy
        bly op die lys in plaas daarvan om eers die speletjie se bladsy oop te maak.</li>
      <li>Die knoppie wys net waar dit kan werk om dit te druk: jou rekening
        mag speletjies begin, en die speletjie se emulator is aangeskakel, geïnstalleer
        en, vir RetroArch, het sy core. Speletjies op stelsels sonder 'n werkende
        emulator wys geen knoppie nie.</li>
      <li>As 'n begin steeds misluk, byvoorbeeld omdat die ROM-lêer
        geskuif is, verskyn die rede in 'n boodskap en die bladsy bly soos dit
        was.</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: "'n Korter sybalk, met een Prestasies-bladsy vir elke platform"
  body: |
    <ul>
      <li><strong>Een "Prestasies"-skakel vervang vyf.</strong>
        RetroAchievements, RPCS3, PSN, Steam en Xbox is nou oortjies op een
        bladsy, en die skakel maak weer die oortjie oop wat jy laaste gebruik het. As jy geen
        RetroAchievements-speletjies het nie, maak dit op die RPCS3-oortjie oop in plaas daarvan
        om jou terug na die Kontrolebord te stuur.</li>
      <li><strong>ROM-verslae is nou in ROM-gereedskap,</strong> as 'n oortjie
        langs die ander gereedskap en 'n kaart op die ROM-gereedskap-bladsy.</li>
      <li><strong>Geen twee sybalkskakels deel 'n ikoon nie:</strong> Kontrolebord is
        nou 🏠 en Logbekyker 🧾. Die sybalk het 16 skakels in plaas van
        21.</li>
      <li>Die gereedskapoortjies op die ROM-gereedskap-instellingsbladsy was altyd in
        Engels; hulle volg nou jou taal.</li>
    </ul>
- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: "How Long To Beat-opsoeke werk weer"
  body: |
    <ul>
      <li><strong>Elke How Long To Beat-opsoek het gesê die speletjie kon nie
        gevind word nie.</strong> Die webwerf het sy soektog na 'n nuwe adres geskuif, so
        RetroDB se versoeke is geweier; dit het tussen laat
        Julie en laat September gebreek. RetroDB gebruik nou die nuwe adres, en stuur die
        platform- en jaarfilters in die webwerf se nuwe formaat, wat die webwerf
        begin ignoreer het. Opsoeke vir een speletjie en die grootmaat-opsoek in ROM-gereedskap
        werk albei weer.</li>
    </ul>
- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: "RetroDB sê nou duidelik dat dit nie seerowery goedkeur nie"
  - type: fix
    label: "Die Oor-venster maak weer op volle grootte oop"
  body: |
    <ul>
      <li><strong>'n Kennisgewing teen seerowery is nou in die app.</strong> Dit
        verskyn in die Oor-venster en onder die ROM-teekpad in
        Instellings, in elke taal. Dit sê RetroDB versprei of
        huisves nie ROM-lêers nie, dat jy net speletjies moet gebruik wat gekopieer is van skywe en
        kassette wat jy besit, en dat RetroDB nie verbonde is aan enige
        konsolemaker, uitgewer of speletjiedatabasis nie. Die bewoording stem ooreen met die
        RetroDB-webwerf en -lokprent.</li>
      <li><strong>Die Oor-venster is in die sybalk ingedruk.</strong>
        Dit maak nou in die middel van die skerm op sy normale grootte oop, en
        rol op 'n klein skerm in plaas daarvan om sy titel en sluitknoppie
        te versteek.</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: "RetroDB begin of hernoem net na regte ROM-lêertipes"
  body: |
    <ul>
      <li><strong>'n Speletjie kon begin word met 'n lêer wat nie 'n
        ROM is nie.</strong> Om 'n ROM te hernoem het enige naam aanvaar, so
        <code>crash.bin</code> kon <code>crash.cfg</code> word en die
        emulator het dit gekry. Om te begin kontroleer nou die lêertipe teen die
        lys in daardie stelselgids se <code>systeminfo.txt</code>, dieselfde lys
        wat die biblioteekskandering gebruik, en hernoem weier 'n tipe wat nie in daardie lys
        is nie. As 'n stelselgids geen lys het nie, sal sy speletjies nie begin nie, en
        die boodskap noem die lêer wat ontbreek.</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: "Net 'n administrateur kan 'n speletjie se lanseerargumente verander"
  - type: fix
    label: "Lanseerargumente met verskeie woorde, of 'n verdwaalde aanhalingsteken, werk nou"
  - type: fix
    label: "RetroDB hou nie meer elke voltooide begin in die geheue nie"
  body: |
    <ul>
      <li><strong>'n Redigeerder kon lanseerargumente byvoeg wat ander kode
        laat loop het.</strong> 'n Speletjie se <em>Pasgemaakte lanseerargumente</em> gaan reguit na die
        emulator, en met RetroArch kon hulle enige programlêer op die
        rekenaar laai. Om hulle te verander het nou die administrateursrol nodig, en die veld is
        vir almal anders versteek.</li>
      <li><strong>Lanseerargumente met meer as een woord het die
        emulator as een bereik.</strong> <code>--a --b</code> kom nou as twee
        argumente aan, en 'n leë waarde voeg niks by nie. 'n Ontbrekende sluitende aanhalingsteken
        het vroeër elke begin van daardie speletjie met 'n bedienerfout gebreek; dit
        wys nou 'n boodskap wat die veld noem wat reggestel moet word. Die
        <code>{disc_paths}</code>-teken is weg: dit was altyd leeg.</li>
      <li><strong>Voltooide begins het in die geheue opgehoop totdat RetroDB
        herbegin het.</strong> 'n Begin wat meer as 'n uur gelede geëindig het, word nou
        uitgevee.</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: "Om 'n taal in Instellings te kies werk weer"
  body: |
    <ul>
      <li><strong>Om 'n taal onder Instellings &rarr; Biblioteek &rarr;
        Vertoon te kies, het niks gedoen nie.</strong> Dit het eerder 'n fout gewys en die bladsy
        het in sy ou taal gebly. Dit het in 3.23.8 gebreek. Om 'n taal te kies,
        stoor dit nou en laai die bladsy weer in daardie taal.</li>
    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: "Trofee- en platformikone is terug in die aflaai"
  body: |
    <ul>
      <li><strong>Die aflaai het RetroDB se trofee- en platformikone
        gemis.</strong> Elke speletjiekaart met RetroAchievements het 'n gebreekte
        prent gewys waar sy kenteken hoort, en trofeevlakke en die PSN-, Steam-,
        Xbox- en RPCS3-logo's het ook ontbreek. Hulle is nou in elke
        aflaai ingesluit.</li>
    </ul>
- version: 3.23.14
  date: '2026-10-10'
  tags:
  - type: security
    label: "Twee ingeslote biblioteke opgedateer vir gepubliseerde sekuriteitsoplossings"
  body: |
    <ul>
      <li><strong>urllib3 en Werkzeug het bekende sekuriteitsprobleme gehad.</strong>
        RetroDB sluit nou urllib3 2.8.0 en Werkzeug 3.1.9 in, die weergawes wat
        dit regstel. 'n Bron-installasie kry hulle deur
        <code>install.py</code> weer te laat loop, wat vanaf
        <code>requirements.lock</code> installeer.</li>
    </ul>
- version: 3.23.13
  date: '2026-09-26'
  tags:
  - type: fix
    label: "Media wat as 'n gidspad gestoor is, word nie meer as ontbrekend aangemeld nie"
  body: |
    <ul>
      <li><strong>In die selfstandige weergawe kon "verwyder ontbrekende
        mediaverwysings" media skoonmaak wat werklik daar was.</strong> Dit
        het gebeur wanneer die databasis die media as 'n gidspad soos
        <code>images/boxart/…</code> gestoor het eerder as net 'n lêernaam. RetroDB
        soek dit nou in die regte gids.</li>
    </ul>
- version: 3.23.12
  date: '2026-09-26'
  tags:
  - type: fix
    label: "Die kontrolebord wys 'n lopende grootmaatskraap, en vier klein regstellings"
  body: |
    <ul>
      <li><strong>Die kontrolebord se skraapvorderingskaart het nooit verskyn nie.</strong>
        Dit wys nou terwyl 'n grootmaatskraap loop, en sê wanneer dit
        onderbreek is.</li>
      <li><strong>Geen foute meer in die blaaierkonsole op die aanmeldbladsy
         nie.</strong> Dit kontroleer nie meer agtergrondtake voordat iemand
        aangemeld is nie.</li>
      <li><strong>Die opstelassistent sê nie meer "Setup complete!" wanneer
        stoor misluk het nie.</strong> Dit sê nou vir jou dat die instellings nie
        gestoor kon word nie.</li>
      <li><strong>Twee grootmaatskrapes wat in dieselfde sekonde begin is, deel nie meer
        'n id nie</strong>, sodat toustryaksies soos kanselleer op die regte
        een werk.</li>
    </ul>
- version: 3.23.11
  date: '2026-09-26'
  tags:
  - type: ui
    label: "Donasieknoppies sê nou wat hulle ondersteun"
  body: |
    <ul>
      <li><strong>Duideliker donasiebewoording.</strong> Die kopknoppies
        lees nou "Borg RetroDB" en "Ondersteun RetroDB". Die README sê elke
        weergawe is gratis, en dat donasies RetroDB self befonds, nie die
        emulators en cores wat dit kan begin nie.</li>
    </ul>
- version: 3.23.10
  date: '2026-09-26'
  tags:
  - type: fix
    label: "ROM-gereedskapbladsye volg jou gestoorde instellings, en die Logs- en ROM-gereedskapbladsye werk weer"
  body: |
    <ul>
      <li><strong>Die Logs-bladsy en sommige ROM-gereedskapbladsye was stukkend.</strong>
        'n Skrip op daardie bladsye het misluk terwyl dit gelaai het, so die logbekyker en
        die gedeelde ROM-gereedskap-hulpmiddels het nooit begin nie. Hulle laai nou
        behoorlik.</li>
      <li><strong>ROM-gereedskap-instellings doen nou iets.</strong> Die Duplikaatvinder
        en CHD-omskakelaar maak oop met hul opsies gestel vanaf die ROM-gereedskap-instellingsbladsy,
        en jy kan hulle steeds vir een lopie verander.</li>
      <li><strong>Die CHD-omskakelaar se skakelaars is geïgnoreer.</strong> Om
        "Verwyder oorspronklike lêers" op die bladsy af te skakel, het nie die verwydering gekeer nie as
        jou gestoorde instelling gesê het om te verwyder. Die skakelaars op die bladsy
        besluit nou.</li>
      <li><strong>Die Tydelike Pad-instelling word gebruik.</strong> Lêers wat
        voorberei word terwyl M3U-snitlyste gebou word, gaan nou daarin.</li>
    </ul>
- version: 3.23.9
  date: '2026-09-26'
  tags:
  - type: security
    label: "Skraperloglêers stoor nie meer wagwoorde en tokens nie, en aanmeldpogings word weer beperk"
  - type: fix
    label: "Om Instellings te stoor vee nie meer jou instellings uit nie, en om 'n gebruiker te verwyder werk"
  body: |
    <ul>
      <li><strong>Loglêers het geheime in gewone teks gehou.</strong> Skraperloglêers
         moes aanmeldtokens en API-sleutels versteek, maar die versteekstap
         het nooit geloop nie, so hulle is volledig geskryf. Hulle word nou versteek.
        Ouer loglêers bevat hulle steeds; verwyder ou lêers in
        <code>logs/</code> as jy jou installasie deel.</li>
      <li><strong>Perke op aanmeldpogings is nie toegepas nie.</strong> Die perke
        op herhaalde aanmeldings en op swaar aksies (skanderings, skrapes, invoere) is
        opgestel maar nooit aangeskakel nie. Hulle werk nou, en 'n geblokkeerde versoek
        kry 'n duidelike "te veel versoeke"-boodskap.</li>
      <li><strong>'n Beskadigde instellingslêer kon uitgevee word.</strong> As
        <code>data/settings.json</code> nie gelees kon word nie, het die volgende stoor
        dit met die verstekwaardes vervang. RetroDB hou nou die beskadigde lêer as
        <code>settings.json.corrupt-&lt;time&gt;</code> voordat dit stoor. As die
        lêer weer goed lees, word die stoor eerder geweier.</li>
      <li><strong>Die Enjin-benamingsry het ander instellings verloor.</strong> Om 'n
        etiket by die Enjin-ry in die benamingsinstellings te voeg, het misluk, en het ook
        die lidwoord- en streekinstellings wat daarmee gestoor is, weggegooi. Dit stoor
        nou behoorlik.</li>
      <li><strong>Om 'n gebruiker te verwyder het misluk.</strong> 'n Gebruiker met etikette, lyste,
        wenslysitems of PSN-data kon nie verwyder word nie. Verwydering verwyder nou
        die gebruiker en alles wat aan hulle behoort.</li>
      <li><strong>Twee skrapes kon gelyktydig loop.</strong> Om 'n lopende
        grootmaatskraap in die tou te ruil of te skuif, het twee skrapes begin wat
        een vorderingstelling gedeel het. Net een loop nou.</li>
      <li><strong>Grootmaatskraapvordering kon soos 'n fout lyk.</strong>
        Voor sy eerste sukses het 'n grootmaatskraap sy status gerapporteer op 'n manier wat
        sommige skerms as 'n mislukking gelees het. Dit is reggestel.</li>
      <li><strong>Aanmelding neem jou nou terug na die bladsy waarvoor jy gevra het.</strong>
        Dit het vroeër altyd na die kontrolebord gegaan.</li>
      <li><strong>Administrateur-lêeraksies bly binne jou gidse.</strong> Die
        prentgrootte-hulpmiddel en die ROM-hernoemaksies weier nou enigiets
        buite jou mediagids of ROM-gids.</li>
      <li><strong>Ou PSN- en Xbox-aanmeldlêers word na jou
        rekening geskuif.</strong> 'n Oorblywende <code>data/psn_tokens.json</code> of
        <code>data/xbox_tokens.json</code> word in jou rekening gelaai en
        hernoem sodat dit op <code>.migrated-015</code> eindig. Daardie lêer hou steeds
        die token, so verwyder dit sodra jy gekontroleer het dat aanmelding werk.</li>
      <li><strong>Duideliker foute van die bediener.</strong> 'n Slegte versoek
        antwoord nou met 'n behoorlike foutboodskap in plaas van "An internal error
        occurred".</li>
    </ul>
- version: 3.23.8
  date: '2026-09-25'
  tags:
  - type: fix
    label: "CLZ-invoer werk weer, lysomslae wys, en verskeie bladsye breek nie meer op 'n afkappingsteken nie"
  - type: security
    label: "Geskraapte name en lêerpaaie kan nie meer uit bladsyknoppies breek nie"
  body: |
    <ul>
      <li><strong>CLZ-invoer het niks gedoen nie.</strong> Om 'n CLZ-PDF op te laai, het dit
        na 'n adres gestuur wat die bediener nie het nie, so elke oplaai het misluk met
        "Parse failed". Dit bereik nou die ontleder.</li>
      <li><strong>Omslae op 'n lysbladsy het almal ontbreek.</strong> Die lysbladsy
        het elke omslag by die verkeerde adres gevra, en die Stelsel-kolom was
        altyd leeg. Albei wys nou. Die omslagprente in die bladsy se "voeg 'n
        speletjie by"-soektog is ook reggestel.</li>
      <li><strong>Knoppies het gebreek op name met 'n afkappingsteken.</strong> Om
        "Assassin's Creed" uit 'n lys te verwyder, 'n skermskoot te verwyder, op 'n omslag in te zoem
        of 'n genre-etiket te verwyder, kon stilweg niks doen nie wanneer die naam
        'n afkappingsteken bevat het. Dieselfde fout het 'n doelbewus vervaardigde geskraapte naam kode
        in die bladsy laat loop. Name bereik daardie knoppies nou op 'n manier wat
        nie as kode misgelees kan word nie.</li>
      <li><strong>Prent- en skakeladresse word oral ontsnap.</strong> 'n Paar
        bladsye het prentadresse uit geskraapte lêername gebou sonder om
        hulle te ontsnap, en vyf bladsye het hul eie swakker kopie van die ontsnaphulpmiddel
         gehad. Hulle gebruik nou almal die gedeelde een.</li>
      <li><strong>Die Instellings-bladsy kon leeg oopmaak.</strong> As die oortjie wat jy
        laaste gebruik het deur 'n opdatering hernoem is, het Instellings oopgemaak sonder dat enige paneel
        sigbaar was. Dit ignoreer nou 'n oortjie wat nie meer bestaan nie. Skakels soos
        <code>/settings#account</code> maak weer daardie oortjie oop.</li>
      <li><strong>Jou tema volg jou nou na ander toestelle.</strong> Die
        tema wat jy kies, word in jou rekening gestoor. 'n Blaaier wat nog nooit
        'n tema gekry het nie, gebruik jou gestoorde een in plaas van die verstek.</li>
      <li><strong>Taakvorderingsopspringers wys die regte ikoon.</strong> Onderbreekte,
        voltooide en waglys-take het dieselfde "loop"-ikoon gewys. Elke toestand het nou
        sy eie, per tema.</li>
      <li><strong>Die lys van kortpadsleutels kan nou vertaal word.</strong> Sy
        etikette was onsigbaar vir die vertaalgereedskap, so hulle het in
        Engels gebly in elke taal.</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: "Ouderdomsgraderings was dikwels verkeerd, en geskraapte speletjies kon hul besonderhede verloor"
  body: |
    <ul>
      <li><strong>Ouderdomsgraderings was dikwels verkeerd, en die fout het versprei.</strong>
        Wanneer 'n gradering van TheGamesDB gekom het, het die app oral binne die teks na die graderingskode
        gesoek in plaas daarvan om dit behoorlik te lees &mdash; so
        "T - Teen", "M - Mature 17+", "AO - Adults Only 18+" en
        "RP - Rating Pending" is almal as die verkeerde gradering gestoor, en 'n Mature-speletjie
         kon as geskik vir almal gelys word. Erger nog, daardie verkeerde gradering
        is toe gebruik om die agt ander graderingstelsels in te vul, so een slegte
        lesing het oor die hele lot versprei. Graderings word nou gelees vanaf die kode aan die
        begin van die teks.</li>
      <li><strong>Omgeskakelde graderings was te toegeeflik.</strong> Wanneer 'n ontbrekende
        gradering ingevul is vanaf een wat jy reeds gehad het, kon die app 'n
        gradering gebruik wat dit net oomblikke tevore uitgewerk het eerder as die een waarmee jy
        eintlik begin het. Elke stap het 'n bietjie strengheid verloor. Dit skakel nou altyd
        om vanaf die graderings wat die speletjie werklik het.</li>
      <li><strong>Volledige herskraap het handgekose Streek en Stoortipe uitgevee.</strong>
        Nie een van hulle kom van 'n skraper nie &mdash; die app werk hulle uit
        &mdash; so 'n Volledige herskraap sou jou gekose "Japan" met die
        verstek "USA" vervang. Jou waardes word nou behou tensy 'n bron werklik
        'n nuwe een verskaf.</li>
      <li><strong>'n Skraper kon die verkeerde speletjie aanvaar.</strong> ScreenScraper-resultate
         word normaalweg teen 'n ooreenstemtelling gekontroleer voordat dit gebruik word,
        maar 'n soektog wat presies een resultaat teruggegee het, het daardie kontrole heeltemal oorgeslaan.
        Elke resultaat kry nou 'n telling.</li>
      <li><strong>'n Speletjie kon al sy geskraapte besonderhede verloor oor een ontbrekende
        veld.</strong> As IGDB of ScreenScraper 'n enkele veld op 'n
        onverwagte manier leeg gelaat het, is die hele opdatering weggegooi &mdash; uitgewer,
        ontwikkelaar, kunswerk en alles. Daardie gevalle word nou hanteer en die res van
        die besonderhede word behou.</li>
      <li><strong>'n Mislukte prent kon as 'n sukses aangeteken word.</strong> As 'n
        afgelaaide prent nie 'n bruikbare beeld was nie, het die app
        niks verwyder nie en steeds die lêernaam gestoor, wat 'n gebreekte verwysing gelaat het. Die
        lêer word nou verwyder en die veld met rus gelaat.</li>
      <li><strong>Speletjiemodusse gebruik nou eenvormige bewoording.</strong> Verskillende
        skrapers het "Single-player" en "Single-Player" geskryf, en 'n gewone
        "Multiplayer" wat nie een van die app se eie etikette was nie, so daardie speletjies
        kon nie vertaal word of deur die Modusse-filter gevind word nie. Alle bronne
        skryf nou dieselfde etikette. Bestaande speletjies hou hul ou bewoording totdat jy
        hulle weer skraap of die normaliseringshulpmiddel in Instellings laat loop.</li>
      <li><strong>Xbox-opsoeke werk nou soos elke ander bron.</strong> Hulle
        het hul eie webversoeke gemaak, so hulle het nie weer probeer wanneer Xbox Live
        hulle gevra het om stadiger te gaan nie, en het geen perk gehad op hoeveel data 'n antwoord kon
        inbring nie. Hulle gebruik nou dieselfde gedeelde verbinding as die ander
        skrapers.</li>
      <li><strong>Ongebruikte ScreenScraper-kode verwyder.</strong> Twee funksies
        wat niks in die app geroep het nie, is verwyder. Een daarvan het 'n webadres
         teruggegee met jou ScreenScraper-wagwoord nog daarin, wat die
        wagwoord aan enigiets sou oorhandig wat dit gebruik het. Die "System Media
        Endpoint" wat in die 3.6.x-vrystellingsnotas gelys is, was een hiervan &mdash; dit
        was nooit van enige plek in die app bereikbaar nie.</li>
    </ul>
- version: 3.23.5
  date: '2026-09-02'
  tags:
  - type: fix
    label: "Die verpakte aflaai kon nie begin nie, en ander bouregstellings"
  body: |
    <ul>
      <li><strong>Die selfstandige aflaai kon glad nie begin nie.</strong> Die
        verpakte weergawe dra sy eie Python, maar die beginner daarin was
        die een wat vir die broninstallasie geskryf is &mdash; dit het gaan soek na
        Python-lêers wat 'n verpakte weergawe nie bevat nie, en het op die
        eerste reël gestop. Die bundel sluit nou sy eie beginner in, wat bloot
        die app laat loop en jou blaaier oopmaak sodra die bediener op is.</li>
      <li><strong>Die werkskermkortpad in die Linux-aflaai het niks
        begin nie.</strong> Dit is gestuur met plekhouerteks waar die pad na
        die app moes wees. Daar is nou 'n <code>install-launcher.sh</code>
        langs die beginner &mdash; laat loop dit een keer en die kortpad word geskryf
        met die regte pad na waar jy dit ook al uitgepak het.</li>
      <li><strong>Om vanaf bron te begin het ongeverifieerde
        afhanklikhede geïnstalleer.</strong> Wanneer Flask ontbreek het, het die beginskrip
        pakkette reguit van die internet gehaal sonder 'n kontrolesomkontrole, en het
        onderweg jou stelsel se pakketbestuurder oorheers. Dit gee nou oor aan
        <code>install.py</code>, wat die slotlêer met kontrolesomme gebruik.</li>
      <li><strong>Die bron-aflaai het onderhouerslêers gedra wat dit nie
        moes nie.</strong> Die lys van wat uitgelaat moet word, is met die hand onderhou en
        het agter geraak, so ouditafvoer en oorblywende bougidse is
        saam met die app verpak. Die aflaai word nou gebou vanaf die lys
        lêers wat werklik in die projek is, wat nie kan wegdryf nie.</li>
      <li><strong>Twee Instellings-panele het in die verpakte weergawe gebreek.</strong> Die
        biblioteekstatistieke- en API-statuspanele het die hoofprogram gesoek met
        'n naam wat dit nie binne 'n verpakte weergawe het nie, so albei het misluk.</li>
      <li><strong>Sommige teks op die skerm kon nooit vertaal word nie.</strong> Drie
        nuwer dele van die app &mdash; die emulatorinstellings, die beginknoppie
        en die "speel tans"-balk &mdash; is deur die vertaalskandering oorgeslaan,
        en die kontrole wat dit moes vang, het na dieselfde
        onvolledige lys gekyk. Die skandering dek nou outomaties elke lêer, en
        hul teks is by die vertalings gevoeg.</li>
      <li><strong>Om vertalings te herbou kon stilweg niks doen nie.</strong>
        Om teks by 'n bladsyspesifieke skrip te voeg, het die herbou oortuig dat daar
        niks te doen was nie, so die nuwe teks het nooit die vertaallêer
         bereik nie.</li>
      <li><strong>'n Grafiese kaart-oplossing is op almal toegepas.</strong>
        Die Linux-beginskrip het 'n instelling bedoel vir een spesifieke AMD-kaart
        op elke masjien afgedwing, wat die beeldvergroter op ander AMD-hardeware
         kon laat vashaak. Dit word nou net toegepas wanneer daardie kaart werklik teenwoordig is, en
        oorheers nooit 'n waarde wat jy self gestel het nie.</li>
      <li><strong>Die vrystellingskrip kon die verkeerde weergawe publiseer.</strong>
        'n Oorblywende etiket van 'n vroeëre poging is stilweg hergebruik, so die
        weergawe kon vanaf 'n ouer momentopname gebou word terwyl dit
        sukses rapporteer.</li>
    </ul>
- version: 3.23.4
  date: '2026-09-02'
  tags:
  - type: fix
    label: "Nege maniere waarop jou biblioteek data kon verloor, gesluit"
  body: |
    <ul>
      <li><strong>"Verwyder geskraapte data" het jou hele biblioteek skoongemaak.</strong> Die
        bevestigingsblok het net die speletjies getel wat werklik geskraap is,
        en toe het die aksie elke speletjie in elk geval uitgevee &mdash; so dit kon
        'n dosyn belowe en duisende skoonmaak. Met prente aangeskakel het dit ook
        omslagkuns verwyder wat jy met die hand opgelaai het, en titels teruggestel wat jy
        self gewysig het, op speletjies wat glad nooit geskraap is nie. Dit doen nou
        presies wat die blok sê.</li>
      <li><strong>3D-boksprent het 'n gebreekte skakel agtergelaat.</strong> Om skoon te maak met
        prente het die 3D-omslag van die skyf verwyder, maar die databasis het steeds daarna
        gewys, so die app het gaan soek na 'n lêer wat weg was.</li>
      <li><strong>Grootmaatwysiging se "Voeg by"-skakelaar het vervang in plaas van bygevoeg.</strong>
        Vir Perspektief en Dimensie het dit presies die teenoorgestelde van sy etiket gedoen, en
        die bestaande waardes op elke gekose speletjie gelyktydig oorskryf, sonder
        ontdoen.</li>
      <li><strong>Selfstandige weergawes kon elke prentverwysing met een
        klik uitvee.</strong> In die verpakte aflaai het die app op die verkeerde plek na jou media
        gesoek, besluit dat elke enkele prent ontbreek, en
        "verwyder ontbrekende mediaverwysings" het toe die kuns-, skermskoot-,
        video- en handleidinginskrywings vir die hele biblioteek leeggemaak. Die veiligheidskontrole wat
        bestaan om juis dit te vang, kon dit nie sien nie. Net die verpakte weergawe
        is geraak.</li>
      <li><strong>Die weeslêer-opruiming kon kuns verwyder terwyl dit aankom.</strong>
        'n Omslag wat afgelaai is terwyl die opruiming geloop het, kon as 'n
        wees behandel en verwyder word.</li>
      <li><strong>Snitlysskepping het jou argiewe geskuif sonder om te vra.</strong>
        Om M3U-snitlyste in grootmaat te skep, het jou oorspronklike argieflêers weggeskuif selfs
        wanneer jy daardie opsie af gelaat het &mdash; en wanneer jy wel daarvoor gevra het,
        'n mislukking gerapporteer vir 'n skuif wat gewerk het.</li>
      <li><strong>Die prentgrootteveranderaar het jou mediagids opgeblaas.</strong> Dit
        het die klein duimnaels wat dit genereer, as nuwe prente behandel om te vergroot,
        hulle tot volle grootte opgeblaas en dan duimnaels daarvan gemaak. Elke
        lopie het meer lêers bygevoeg, bladsye het stilweg volgrootte prente in plaas van
        duimnaels bedien, en die AI-vergroter het op omtrent drie keer die bedoelde
        aantal lêers geloop.</li>
      <li><strong>AI-invulling het besonderhede oorskryf wat jy reggestel het.</strong> Op 'n
        normale skraap kon dit jou eie uitgewer, ontwikkelaar, genre, ouderdomsgraderings
         en meer vervang. Dit vul nou net leë velde in; die AI-vul-knoppie wat jy
        self druk, is onveranderd.</li>
      <li><strong>Herhaalde skrapes kon 'n goeie skermskoot verwyder.</strong> Speletjies
        wat van RAWG geskraap is, het dieselfde lêername hergebruik, so 'n tweede skraap het
        'n gestoorde skermskoot oorskryf en dit toe as 'n duplikaat verwyder terwyl die
        biblioteek dit steeds gelys het.</li>
    </ul>
- version: 3.23.3
  date: '2026-09-01'
  tags:
  - type: fix
    label: "Huishoudelike rolle doen nou presies wat hulle sê, en 'n gedeaktiveerde rekening is werklik uitgesluit"
  body: |
    <ul>
      <li><strong>Om iemand te deaktiveer, beëindig nou hul sessie.</strong> Om
        'n rekening af te skakel het dit van elke skerm versteek, maar enigiemand wat reeds op
        daardie rekening aangemeld was, kon tot 'n week lank normaal aanhou werk. Deaktivering
        is die enigste manier om iemand uit te sluit sonder om hulle te verwyder, so dit
        tree nou in werking met hul heel volgende klik.</li>
      <li><strong>Leesalleen-rekeninge kan nie meer speletjiedata verander nie.</strong>
        Drie "how long to beat"-aksies was oop vir elke aangemelde persoon,
        insluitend dié wat net mag kyk &mdash; so 'n leesalleen-rekening kon 'n
        speeltyd oorskryf, of dit van elke speletjie in die biblioteek uitvee. Hulle het nou
        wysigingsregte nodig, soos elke ander aksie wat 'n speletjie verander.</li>
      <li><strong>Die trofee-opspoorder werk weer vir almal.</strong>
        Om jou eie versamelaartrofeë te verfris, het redigeerdersregte nodig gehad, wat die
        Speler- en Kyker-rolle nie het nie &mdash; en dit is die enigste ding wat
        daardie trofeë skryf. Daardie rekeninge kon nooit een verdien nie, en die
        Verfris-knoppie het net 'n fout gewys. Dit is jou eie vordering, so dit
        het nou glad geen spesiale regte nodig nie.</li>
      <li><strong>Een persoon se PlayStation-verfrissing is nie meer enigiemand anders s'n
        om te stop nie.</strong> Enige aangemelde rekening kon 'n verfrissing wat iemand
        anders begin het, onderbreek of kanselleer, en kon sien by watter speletjie daardie persoon
        was. Albei is nou beperk tot wie dit ook al begin het.</li>
      <li><strong>Steam-invoere gebruik jou eie rekening, nie wie ook al s'n eerste
        gestoor is nie.</strong> Die biblioteekinvoer het een gedeelde kopie van die Steam-aanmeldbesonderhede
         gelees in plaas van joune, so dit kon iemand anders se
        biblioteek haal &mdash; terwyl jou eie gestoorde besonderhede skynbaar ontbreek het.</li>
      <li><strong>Om 'n administrateurswagwoord te raai is weer moeilik.</strong> Die perk
        op mislukte aanmeldpogings is met almal op die netwerk gedeel,
        so enigiemand met hul eie rekening kon dit skoonmaak deur aan te meld en
        onbeperk aanhou raai. Die perk is nou per rekening.</li>
      <li><strong>Foute van die app bereik nou die bladsy in plaas daarvan om te verdwyn.
        </strong> Wanneer 'n aksie geweier is, het 115 van hulle geantwoord in 'n vorm wat die
        bladsy nie kon lees nie, so dit het gelyk of die aksie gewerk het. Hulle
        rapporteer nou die weiering behoorlik, en jy sien die regte boodskap.</li>
    </ul>
- version: 3.23.2
  date: '2026-08-06'
  tags:
  - type: fix
    label: "Skraperinstellingsbladsye laai vinniger en wys nooit 'n verouderde API-sleutel nie"
  body: |
    <ul>
      <li><strong>Die Instellings- en Skraperkonfigurasie-bladsye lees nie meer die
        skraperinstellingslêer by elke versoek weer nie.</strong> Vier plekke het
        dit elke keer van die skyf oopgemaak en weer ontleed wanneer 'n bladsy of kontrole geloop het,
        al het 'n gedeelde, gekasde leser reeds bestaan. Hulle gebruik dit almal
        nou, so daardie bladsye doen minder werk per besoek.</li>
      <li><strong>Om te stoor tree steeds onmiddellik in werking.</strong> 'n Kas wat
        op 'n tydhouer vergeet, kon jou tot 'n halwe minuut ná 'n stoor die ou waardes gewys het.
        Elke stoor maak nou die kas skoon terwyl dit skryf,
        so wat jy sien, is wat jy pas gestoor het.</li>
      <li><strong>Jou regte API-sleutels kan nie meer deur hul eie
        gemaskerde vertoonwaarde vervang word nie.</strong> Instellingsbladsye wys gestoorde sleutels as
        <code>***1234</code> eerder as die regte ding. Omdat die bladsy
        dieselfde kopie van die instellings gekry het wat die skrapers gebruik, kon daardie maskering
        die egte sleutels in die geheue oorskryf en skrapers laat
        aanmeld met sterretjies totdat die kas verval het.</li>
      <li><strong>Selfstandige weergawes soek nou op die regte plek na skraperinstellings.</strong> Die skrapers het die lêer se ligging anders afgelei
        as die bladsye wat dit stoor. In 'n normale installasie het albei by dieselfde
        lêer uitgekom; in 'n selfstandige (dubbelklik-) weergawe sou hulle nie,
        so gestoorde API-sleutels kon iewers beland het waar die skrapers nooit
        gekyk het nie.</li>
    </ul>
- version: 3.23.1
  date: '2026-08-06'
  tags:
  - type: fix
    label: "Die bedienerpoort wat jy in Instellings stoor, is nou die poort wat dit gebruik"
  body: |
    <ul>
      <li><strong>Om 'n bedienerpoort te stoor, skuif nou werklik die bediener.</strong>
        Instellings het 'n poort aanvaar, dit gekontroleer, gestoor, en vir jou gesê 'n herbegin
        is nodig om dit toe te pas &mdash; en toe het die bediener in elk geval op 5000 begin.
        Niks het die waarde ooit teruggelees nie. Dit is nou deel van die beginketting,
        so 'n herbegin skuif RetroDB werklik na die poort wat jy gekies het. Enigiets wat
        in die omgewing gestel is, wen steeds, so 'n beginner of houer wat
        'n poort toeken, word nie geraak nie.</li>
      <li><strong>Twee instellings wat nooit iets gedoen het nie, is verwyder
        eerder as herstel.</strong> "Bedienergasheer" en "ontfoutmodus" is
        gestoor en het dieselfde valse belofte gerapporteer. Om ontfoutmodus vanaf
        'n webvorm aan te skakel, sou 'n interaktiewe Python-konsole in die
        blaaier blootgestel het, en die bindadres beheer watter masjiene
        RetroDB hoegenaamd kan bereik &mdash; nie een hoort agter 'n instellingsvorm nie. Albei bly
        instelbaar vanaf die omgewing, waar hulle reeds gewoon het. As jou
        instellingslêer hulle nog bevat, word hulle stilweg by laai weggelaat;
        jy hoef niks te doen nie.</li>
      <li><strong>Niks beweer nou dat 'n herbegin dit sal toepas nie, tensy 'n herbegin
        dit toepas.</strong> Dit was die werklike fout &mdash; 'n dooie instelling is
        slordig, maar 'n valse belofte mors 'n middag.</li>
    </ul>
- version: 3.23.0
  date: '2026-08-06'
  tags:
  - type: enhancement
    label: "Begin RetroDB op 'n poort wat iemand anders kies"
  body: |
    <ul>
      <li><strong>RetroDB lees nou 'n <code>PORT</code>-instelling uit sy
        omgewing.</strong> As jy RetroDB vanaf 'n ander hulpmiddel begin &mdash; 'n
        kontrolebord, 'n houer, 'n tuisbedienerpaneel &mdash; kan daardie hulpmiddel nou
        vir RetroDB die poort gee waarop dit dit wil hê, sonder dat iemand 'n lêer wysig.
        Stel <code>PORT</code> en RetroDB bind daar; los dit uit en
        niks verander hoegenaamd nie. Die bestaande <code>RETRODB_PORT</code> werk steeds
        presies soos voorheen, en <code>PORT</code> wen as albei gestel is.</li>
      <li><strong>'n Slegte poortnommer sê dit nou in plaas daarvan om te raai.</strong>
        Voorheen het 'n onleesbare poort 'n muur Python-foutteks gelewer, en
        'n poort buite die bruikbare reeks is eers ontdek toe die bediener
        nie kon begin nie. RetroDB stop nou onmiddellik met een reël wat die
        waarde noem wat dit nie kon gebruik nie. Dit sal nooit stilweg op 'n ander poort begin
        as die een waarvoor gevra is nie &mdash; om stilweg geskuif te word is erger as
        om nee te hoor.</li>
      <li><strong>Die beginbanier en die blaaieroortjie volg die regte
        poort.</strong> Die adres wat gedruk word wanneer RetroDB begin, en die bladsy wat dit
        vir jou oopmaak, het albei vroeër 5000 gesê, maak nie saak watter poort werklik
        in gebruik was nie.</li>
    </ul>
- version: 3.22.1
  date: '2026-07-31'
  tags:
  - type: fix
    label: Keer dat die databasis se kladlêer sonder perk groei
  body: |
    <ul>
      <li><strong>Die databasisjoernaal het weer &rsquo;n perk.</strong> SQLite hou &rsquo;n kladlêer (die <code>-wal</code>-lêer) langs jou biblioteekdatabasis. RetroDB wou dit tot 64&nbsp;MB beperk, maar die perk is net op agtergrondtake toegepas &mdash; gewone bladsylaaie en wysigings het glad geen perk gehad nie. Ná een ongewoon groot skryfbewerking het die kladlêer vir altyd op sy grootste grootte gebly, soms groter as die databasis self. Dit word nou oral beperk, sodat die spasie teruggegee word.</li>
    </ul>
- version: 3.22.0
  date: '2026-07-05'
  tags:
  - type: enhancement
    label: Skraap 'n speletjie reguit vanaf sy opspringer, sonder die ekstra stap
  body: |
    <ul>
      <li><strong>Skraap vanaf die speletjie-opspringer.</strong> Die vinnige
        speletjie-opspringer (die een wat verskyn wanneer jy 'n speletjie in jou
        Biblioteek klik) het nou 'n <strong>Skraap</strong>-knoppie langs AI-vul
        en Wysig. Klik dit en RetroDB neem jou reguit na daardie speletjie met die
        metadata-soektog reeds oop &mdash; nie meer om die volledige bladsy oop te
        maak en eers vir die Skraap-knoppie te soek nie.</li>
    </ul>
- version: 3.21.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Begin met een klik — start RetroDB vanaf 'n vasgespelde ikoon, geen terminaal
  - type: feature
    label: "'n Regte app-ikoon — neon-speelbeheerder in jou blaaieroortjie en taakbalk"
  - type: feature
    label: Nuwe Sluit Bediener Af-knoppie op die Instellings-bladsy
  body: |
    <ul>
      <li><strong>Begin met een klik.</strong> RetroDB het nou 'n behoorlike
        beginner (launcher) wat jy aan jou taakbalk kan vasspeld &mdash; klik dit
        en die app begin (as dit nie reeds loop nie) en maak outomaties in jou
        blaaier oop. Nie meer 'n terminaal oopmaak en 'n opdrag tik nie. Op Linux,
        loop <code>python3 scripts/install_launcher.py</code> een keer om
        &ldquo;RetroDB&rdquo; by jou app-kieslys te voeg, en speld dit dan vas.</li>
      <li><strong>'n Regte app-ikoon.</strong> RetroDB dra nou 'n
        neon-speelbeheerder-ikoon &mdash; kuberpunk-siaan en magenta op 'n donker
        teël &mdash; in jou blaaieroortjie (die favicon), op die taakbalk-beginner,
        en op die Windows-program self. Dit vervang die eenvoudige emoji-plekhouer.</li>
      <li><strong>Sluit Bediener Af-knoppie.</strong> Die Instellings-bladsy se
        Bediener-kontroles het nou 'n rooi <strong>Sluit Bediener Af</strong>-knoppie
        langs Herbegin. Dit stop die app skoon (laat enige lopende take eers klaar
        stoor), sodat jy nie meer na die terminaal hoef oor te skakel en Ctrl+C te
        druk nie.</li>
      <li><strong>Aflaaibare weergawes maak die blaaier vir jou oop.</strong> Die
        gereed-om-te-loop Windows-, Mac- en Linux-aflaaie maak nou jou blaaier 'n
        oomblik na die begin oop, sodat die app voor jou is sonder enige ekstra
        stap.</li>
    </ul>
- version: 3.20.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Elf nuwe tale — RetroDB praat nou 21 tale
  body: |
    <ul>
      <li><strong>Elf nuwe taalpakkette.</strong> RetroDB se koppelvlak,
        vrystellingsnotas en Hulp-handleiding is nou vertaal na
        <strong>Afrikaans, isiZulu, isiXhosa, Dutch, Norwegian (Bokm&aring;l),
        Russian, Polish, Turkish, Ukrainian, Indonesian en Hebrew</strong>
        &mdash; wat aansluit by die bestaande Duits, Spaans, Frans, Italiaans,
        Japannees, Koreaans, Brasiliaanse Portugees, en Vereenvoudigde &amp;
        Tradisionele Chinees. Kies joune onder Instellings &rarr; Vertoonvoorkeure
        &rarr; Taal; die app herlaai in die taal wat jy kies.</li>
      <li>Elke taal dek die hele app: elke knoppie, etiket en boodskap,
        die volledige vrystellingsnotas-geskiedenis, en die volledige
        Hulp-handleiding.</li>
      <li><strong>isiZulu &amp; isiXhosa</strong> is ook ingesluit. As tale met min
        bestaande sagteware-woordeskat, behou hulle algemene tegniese terme (ROM,
        scraper, box art) in Engels waar daar geen natuurlike woord is nie
        &mdash; 'n moedertaalspreker se proeflees is welkom voordat jy op hulle
        staatmaak.</li>
      <li><strong>Hebrew</strong> word gelewer met volledig vertaalde teks;
        verfynde regs-na-links-bladuitleg (sodat die koppelvlak korrek spieël)
        kom in 'n latere opdatering. Arabic sal volg sodra daardie uitlegwerk
        klaar is.</li>
    </ul>
- version: 3.19.1
  date: '2026-07-05'
  tags:
  - type: performance
    label: Vinniger scraping — 'n speletjie se skermkiekies laai nou terselfdertyd af
  body: |
    <ul>
      <li><strong>Skermkiekies laai nou parallel af.</strong> Deur dieselfde
        benadering as die gewilde ES-DE-frontend te volg (wat al 'n speletjie se
        media in een slag gaan haal), laai RetroDB nou 'n speletjie se
        skermkiekies <strong>gelyktydig</strong> af in plaas van een-vir-een, vir
        elke bron (TheGamesDB, IGDB, RAWG, ScreenScraper). Speletjies met verskeie
        skermkiekies is merkbaar vinniger klaar.</li>
      <li>Die dubbel-skermkiekie-kontrole loop steeds daarna in volgorde, sodat
        die verwydering van duplikaatprente steeds net so akkuraat is soos
        voorheen &mdash; slegs die aflaai is vinniger gemaak. Aflaaie word tot
        vier op 'n slag beperk sodat 'n enkele bron nooit oorlaai word nie.</li>
      <li>Onder-die-kap-spoedverbetering; tree in werking ná die volgende
        herbegin.</li>
    </ul>
- version: 3.19.0
  date: '2026-07-05'
  tags:
  - type: performance
    label: Vinniger scraping — bronne word nou terselfdertyd bevra
  body: |
    <ul>
      <li><strong>Scraping is vinniger per speletjie.</strong> Wanneer RetroDB
        'n speletjie opsoek, gaan dit verskeie databasisse na (ES-DE, TheGamesDB,
        IGDB, RAWG, ScreenScraper). Voorheen het dit hulle <em>een-vir-een</em>
        gevra en op elkeen se antwoord gewag voordat die volgende gevra is
        &mdash; die wagtyd was dus die som van almal s'n. Nou vra dit hulle almal
        <strong>gelyktydig</strong> en wag net vir die stadigste, wat 'n merkbare
        spoedverbetering op elke speletjie is. Resultate word steeds presies
        dieselfde georden en gepunt soos voorheen.</li>
      <li><strong>Minder onnodige verbindings tydens die aflaai van
        illustrasies.</strong> Prent-aflaaie hergebruik nou 'n reeds-oop
        verbinding in plaas daarvan om vir elke enkele prent 'n nuwe een oop te
        maak, wat tyd bespaar op speletjies met baie skermkiekies.</li>
      <li>Dit is onder-die-kap-spoedverbeterings &mdash; niks verander aan hoe
        jy RetroDB gebruik nie, en dit belas die databasisse nie harder nie
        (dieselfde versoeke, net oorvleuelend uitgevoer). Tree in werking ná die
        volgende herbegin.</li>
    </ul>
- version: 3.18.0
  date: '2026-07-05'
  tags:
  - type: feature
    label: Chinese (China) ouderdomsgraderings bygevoeg as 'n 9de graderingstelsel
  body: |
    <ul>
      <li><strong>Nuwe ouderdomsgraderingstelsel: China (CADPA).</strong>
        RetroDB ondersteun nou China se amptelike speletjie-ouderdomsleidraad-
        skema (&ldquo;网络游戏适龄提示&rdquo;, uitgereik deur CADPA) langs die
        bestaande agt rade (ESRB, PEGI, CERO, USK, ACB, FPB, GRAC en ClassInd).
        Dit gebruik drie vlakke &mdash; <strong>8+</strong>, <strong>12+</strong>
        en <strong>16+</strong> &mdash; vertoon met 'n eenvoudige groen
        kentekentjie.</li>
      <li><strong>Dit vul homself in, soos die ander.</strong> Wanneer 'n
        speletjie reeds 'n gradering van enige ander land het, werk RetroDB die
        ooreenstemmende China-vlak outomaties uit (en andersom). Jy kan dit ook
        self kies of verander in 'n speletjie se Wysig-skerm, en dit as jou
        voorkeur-vertoonstelsel kies onder Instellings &rarr; Biblioteek. Let
        wel: die meeste Westerse speletjie-databasisse publiseer nie 'n
        China-gradering nie, dus vir speletjies sonder enige gradering word dit
        gedurende scraping / AI Fill uit die speletjie se inhoud afgelei.</li>
      <li>Die groen kentekens is RetroDB se eie eenvoudige kunswerk (wat by die
        huisstyl van die ander rade pas), nie CADPA se amptelike logo nie, sodat
        daar geen beeldlisensiëringsbeperkings aan verbonde is nie.</li>
    </ul>
- version: 3.17.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Maak databasisinskrywings skoon vir media-lêers wat van die skyf ontbreek
  - type: security
    label: Beskerm teen die uitwis van jou hele biblioteek se illustrasies wanneer 'n media-vouer verdwyn
  body: |
    <ul>
      <li><strong>Nuwe instandhoudingsnutsding: &ldquo;Ontbrekende
        Media-verwysings&rdquo;</strong> (Instellings &rarr; Stelsel &rarr;
        Instandhouding). Dit is die spieëlbeeld van die bestaande
        &ldquo;Weeskind-media&rdquo;-skoonmaak: in plaas daarvan om oorblywende
        prentlêers sonder 'n speletjie te vind, vind dit speletjies waarvan die
        bokskuns, 3D-bokskuns, skermkiekies, fan-kuns, video of handleiding na
        lêers verwys wat nie meer op die skyf is nie. Deursoek daarvoor, en maak
        dan daardie verouderde verwysings met een klik skoon sodat scrapers die
        kuns kan herlaai. Jou speletjie-inskrywings self word nooit aangeraak
        nie.</li>
      <li><strong>Veiliger outomatiese skoonmaak tydens scraping.</strong>
        Wanneer RetroDB 'n speletjie herskraap, maak dit stilweg verwysings na
        media-lêers wat van die skyf verdwyn het, skoon. Voorheen, as 'n hele
        media-vouer skielik verdwyn het &mdash; 'n ontkoppelde eksterne skyf, of
        'n grootskaalse uitvee &mdash; kon daardie skoonmaak die rekord van
        watter kuns duisende speletjies gehad het, uitwis, wat duur herskrapings
        genoodsaak het. RetroDB herken nou daardie sein: as 'n media-vouer
        ontbreek of heeltemal leeg is, behou dit die verwysings en teken 'n
        waarskuwing aan in plaas daarvan om hulle uit te wis. Die nuwe
        instandhoudingsnutsding pas dieselfde beskerming toe en dui duidelik
        enige vouer aan wat dit teruggehou het.</li>
    </ul>
- version: 3.16.0
  date: '2026-07-04'
  tags:
  - type: feature
    label: Nuwe "Vinnige Regstellings"-paneel op die paneelbord
  body: |
    <ul>
      <li><strong>'n Nuwe &ldquo;Vinnige Regstellings&rdquo;-paneel op die
        Paneelbord</strong> verander verspreide biblioteektake in 'n
        oogopslag-doenlys. Dit wys hoeveel speletjies nog bokskuns kortkom, en
        bied eenklik-kortpaaie om duplikaat-ROM's te vind en om stukkende
        ROM-paaie na te gaan (speletjies waarvan die lêers geskuif of uitgevee
        is). Elke kortpad skakel reguit na die bladsy wat dit regstel. Die
        paneel verskyn sodra jy speletjies in jou biblioteek het.</li>
    </ul>
- version: 3.15.0
  date: '2026-07-03'
  tags:
  - type: accessibility
    label: Skermlesers kondig nou taakvordering hardop aan
  body: |
    <ul>
      <li><strong>Langlopende take praat nou hul vordering hardop vir
        skermlesers.</strong> Terwyl 'n grootskaalse scrape, 'n
        prestasie-sinchronisasie (RetroAchievements of PlayStation), of 'n
        prentheraffronting aan die gang is, het skermleser-gebruikers voorheen
        niks gehoor tussen &ldquo;begin&rdquo; en &ldquo;klaar&rdquo; nie.
        RetroDB kondig nou gereelde mylpale aan (byvoorbeeld &ldquo;Grootskaalse
        Scrape: 12 van 40&rdquo;) sowel as 'n gesproke voltooiing &mdash; sonder
        enige ekstra opspringboodskappe op die skerm. Die aankondigings word so
        gepaseer dat hulle inlig sonder om te babbel, en hulle volg die taal wat
        jy gekies het.</li>
    </ul>
- version: 3.14.0
  date: '2026-07-01'
  tags:
  - type: feature
    label: Nuwe tale — Chinees (Vereenvoudig & Tradisioneel) nou beskikbaar
  body: |
    <ul>
      <li><strong>RetroDB is nou beskikbaar in Chinees.</strong> Twee keuses is
        onder <strong>Instellings &rarr; Stelsel &rarr; Taal</strong>:
        <strong>中文 (简体)</strong> (Vereenvoudig, vir vasteland-China) en
        <strong>中文 (繁體)</strong> (Tradisioneel, vir Hongkong en Taiwan). Die
        hele koppelvlak &mdash; kieslyste, knoppies, boodskappe en die
        ingeboude Hulp-handleiding &mdash; is vertaal, en enigiets wat nog nie
        vertaal is nie, val stilweg terug na Engels. Dit bring die aantal
        ondersteunde tale tot tien (Engels, Duits, Spaans, Frans, Italiaans,
        Japannees, Brasiliaanse Portugees, Koreaans, en nou Vereenvoudigde
        &amp; Tradisionele Chinees).</li>
    </ul>
- version: 3.12.0
  date: '2026-06-30'
  tags:
  - type: feature
    label: Nuwe taal — Koreaans (한국어) is nou beskikbaar
  body: |
    <ul>
      <li><strong>RetroDB is nou beskikbaar in Koreaans (한국어).</strong> Kies
        dit onder Instellings &rarr; Stelsel &rarr; Taal. Die hele koppelvlak
        &mdash; kieslyste, knoppies, boodskappe en die ingeboude
        Hulp-handleiding &mdash; is vertaal, wat die aantal ondersteunde tale
        tot agt bring (Engels, Duits, Spaans, Frans, Italiaans, Japannees,
        Brasiliaanse Portugees en Koreaans). Koreaans voltooi die dekking vir
        elke speletjie-ouderdomsgraderingsraad wat RetroDB vertoon, insluitend
        Suid-Korea se GRAC.</li>
    </ul>
- version: 3.11.0
  date: '2026-06-30'
  tags:
  - type: enhancement
    label: Ondersteun RetroDB op Patreon — nuwe skenkingskakel bygevoeg
  body: |
    <ul>
      <li><strong>Jy kan nou RetroDB op Patreon ondersteun.</strong> 'n
        Patreon-skakel is nou langs die bestaande &ldquo;Borg op
        GitHub&rdquo;-knoppie in <strong>Instellings &rarr; Stelsel &rarr;
        Ondersteun Ontwikkeling</strong>, in die Oor-paneel, en in die projek
        se README. RetroDB bly heeltemal gratis en oopbron &mdash; skenkings
        is heeltemal opsioneel en help eenvoudig net om die
        eenman-ontwikkeling aan die gang te hou.</li>
    </ul>
- version: 3.10.0
  date: '2026-06-26'
  tags:
  - type: enhancement
    label: Veranderingslog laai nou vinniger met 'n "Laai Meer"-knoppie
  body: |
    <ul>
      <li><strong>Die Veranderingslog-bladsy maak nou baie vinniger
        oop.</strong> In plaas daarvan om die hele vrystellingsgeskiedenis
        (honderde inskrywings) elke keer te teken wanneer jy dit oopmaak, wys
        RetroDB nou die mees onlangse 20 en voeg 'n <strong>Laai
        Meer</strong>-knoppie onderaan by. Klik daarop om die volgende bondel
        te wys, ensovoorts &mdash; die ouer geskiedenis is steeds almal daar,
        dit laai net op aanvraag in plaas daarvan om die eerste vertoning te
        vertraag.</li>
    </ul>
- version: 3.9.0
  date: '2026-06-17'
  tags:
  - type: feature
    label: Hulp-handleiding en onlangse vrystellingsnotas nou vertaal in al 6 tale
  body: |
    <ul>
      <li><strong>Die volledige ingeboude Hulp-handleiding is nou in al ses
        tale beskikbaar</strong> &mdash; Duits, Frans, Spaans, Italiaans,
        Japannees en Brasiliaanse Portugees &mdash; nie net Engels nie.
        RetroDB wys die handleiding in watter taal jy ook al in Instellings
        gekies het, en val stilweg terug na Engels as iets nog nie vertaal is
        nie.</li>
      <li><strong>Hierdie Veranderingslog verskyn nou ook in jou taal</strong>
        vir die mees onlangse vrystellings, en nuwe vrystellings sal van nou
        af vertaal word. Ouer geskiedenis bly in Engels.</li>
      <li><strong>Die Wenslys-bladsy en die laaste oorblyfsels van Engelse
        teks</strong> &mdash; 'n bondel opspringboodskappe vir foute en status
        wat gemis is toe die taalpakke die eerste keer in 3.8.0 aangekom het
        &mdash; vertaal nou behoorlik regoor die app.</li>
    </ul>
- version: 3.8.2
  date: '2026-06-17'
  tags:
  - type: security
    label: Sekuriteits-afhanklikheidopdatering + CI-regstellings
  body: |
    <ul>
      <li><strong>Sekuriteit:</strong> die ingeboude <code>cryptography</code>-
        biblioteek is opgedateer (47 → 49) om 'n gepubliseerde
        sekuriteitswaarskuwing (GHSA-537c-gmf6-5ccf) reg te stel. Geen
        gedragsverandering nie — net 'n veiliger weergawe.</li>
      <li>Die outomatiese toetspyplyn is reggestel: 'n ontbrekende
        toets-alleen-hulpmiddel (<code>beautifulsoup4</code>) het die
        toetslopie sedert v3.7.0 laat misluk, en die nuwe
        verpakkingsboukript het 'n statiese-ontleding-kontrole ontlok wat 'n
        bekende vals-positief is (dit voer vertroude boubevele uit, nie
        gebruikersinvoer nie) &mdash; nou gedokumenteer en gekalibreer. Slegs
        instandhouding; niks verander in die app self nie.</li>
    </ul>
- version: 3.8.1
  date: '2026-06-17'
  tags:
  - type: improvement
    label: Kleiner aflaai-opsie, skenking-opruiming en vertaalregstelling (Pass
      46.3 / 47.6)
  body: |
    <ul>
      <li><strong>'n Baie kleiner aflaai is op pad.</strong> Die gebruiksklaar
        &ldquo;pak net uit en dubbelklik&rdquo;-weergawe van RetroDB kan nou
        in 'n <strong>slegs-SVE (CPU-only)</strong>-variant (~600&nbsp;MB)
        gebou word vir mense sonder 'n AMD-grafiese kaart &mdash; ongeveer 'n
        sesde van die grootte van die volledige weergawe. Albei sal langs
        mekaar aangebied word sodat jy die een kan kies wat by jou masjien
        pas.</li>
      <li><strong>Die &ldquo;Ondersteun Ontwikkeling&rdquo;-paneel in
        Instellings vertaal nou</strong> saam met die res van die app
        &mdash; dit is per ongeluk in Engels laat staan toe die taalpakke in
        3.8.0 aangekom het.</li>
      <li>Die skenkingskakels is opgeruim (GitHub Sponsors-kenteken in die
        README; die befondsingslêer is gereed vir Patreon en
        Buy&nbsp;Me&nbsp;A&nbsp;Coffee sodra dié opgestel is). Nooit lastige
        opspringskerms nie.</li>
      <li>Agter die skerms: die vrystellingspyplyn kan nou outomaties die
        gebruiksklaar weergawes vir Windows, macOS en Linux bou. Let wel: die
        lang ingeboude <em>Hulp</em>-handleiding is vir eers steeds net in
        Engels &mdash; dit is aangeteken as toekomstige werk.</li>
    </ul>
- version: 3.8.0
  date: '2026-06-12'
  tags:
  - type: feature
    label: Volledige koppelvlakvertaling + 6 tale (Pass 43.2/43.3/43.5)
  body: |
    <ul>
      <li><strong>RetroDB praat nou 6 meer tale.</strong> Voortbouend op die
        grondslag van 3.7.0, is die hele koppelvlak vertaalbaar gemaak en
        masjienvertaal na <strong>Duits, Frans, Spaans, Italiaans, Japannees
        en Brasiliaanse Portugees</strong>. Kies jou taal onder Instellings
        &rarr; Vertoonvoorkeure &rarr; Taal; dit volg jou gestoorde voorkeur,
        dan jou blaaier, en val dan terug na Engels &mdash; dit kan nooit
        vasval op 'n ontbrekende taal nie.</li>
      <li><strong>Alles op die skerm word gedek</strong>: bladsyteks en
        knoppies, opspringboodskappe (die klein &ldquo;toast&rdquo;-
        kennisgewings), die wysig- en instellings-dialoë, nutswenke, en
        skermleser-etikette. Speletjiegenres, perspektiewe en speelmodusse
        (bv. &ldquo;First-Person-Shooter&rdquo;) verskyn nou ook in jou taal
        &mdash; terwyl die onderliggende data in Engels bly sodat jou
        biblioteek en filters presies soos voorheen bly werk.</li>
      <li>'n Ingeboude <strong>&ldquo;Pseudo&rdquo;-taal</strong> (sigbaar in
        die Taal-kieslys) is 'n vertaler se QA-hulpmiddel wat elke etiket
        omhaak en aksentueer, wat dit onmiddellik duidelik maak of enige teks
        gemis is.</li>
      <li>Masjienvertalings is 'n beginpunt en kan hier en daar 'n bietjie
        stroef lees &mdash; hulle is maklik om oor tyd te verfyn, en enige
        teks sonder 'n vertaling verskyn eenvoudig in Engels.</li>
    </ul>
