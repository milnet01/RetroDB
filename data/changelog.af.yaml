- version: 4.0.0
  date: '2026-11-08'
  tags:
  - type: performance
    label: AI-vul met Claude-websoektog kos minder. Claude lees die soekresultate ná elke soektog weer; RetroDB vra nou vir Anthropic om dit gereed te hou, en 'n herlees kos dan 'n tiende van die prys of minder
    en: AI Fill with Claude web search costs less. Claude reads the search results again after each search; RetroDB now asks Anthropic to keep them ready, and a re-read then costs a tenth of the price or less
  - type: fix
    label: As jy 'n skraap-, sinkroniseer- of beeldtaak kanselleer wat reeds klaar is, verdwyn die vasgesteekte vorderingsvenster nou. As jy 'n taak begin wat reeds loop, sien jy nou die werklike rede, soos "'n Skraap vir SNES loop reeds", in plaas van "Netwerkfout". Foute met beheerderbeelde in die Museum sê nou wat verkeerd gegaan het, en as jy 'n ander gebruiker se RetroAchievements-sinkronisering kanselleer, sê dit dat dit hulle s'n is in plaas van asof dit gekanselleer is
    en: Cancelling a scrape, sync or image job that has already finished now clears its stuck progress popup. Starting a job that is already running shows the real reason, such as "A scrape for SNES is already running", instead of "Network error". Controller image errors in the Museum now say what went wrong, and cancelling another user's RetroAchievements sync says it is theirs instead of pretending to cancel it
  - type: security
    label: Die logkyker versteek nou ook wagwoorde en sleutels in ouer loglêers. Logs wat geskryf is voordat RetroDB geleer het om 'n bepaalde wagwoord te versteek, soos dié van ScreenScraper, het dit in gewone teks gewys wanneer dit besigtig of afgelaai is
    en: The log viewer now hides passwords and keys in older log files too. Logs written before RetroDB learned to hide a particular password, such as ScreenScraper's, showed it in plain text when viewed or downloaded
  - type: security
    label: As jy al die instellings na verstek terugstel, bly jou ROM-gids en die feit dat die opstelling klaar is nou behoue. Voorheen het 'n terugstelling die eerste-keer-opstelbladsye weer oopgemaak, wat sonder aanmelding werk, totdat 'n admin die opstelling weer uitgevoer het
    en: Resetting all settings to their defaults now keeps your ROM folder and the fact that setup is done. Before, a reset reopened the first-time setup pages, which work without signing in, until an admin ran setup again
  - type: feature
    label: Arcade-speletjies kan weer RetroAchievements verdien. RetroDB koppel nou net 'n arcade-speletjie as RetroAchievements sy presiese lêernaam ken, soos sf2 vir Street Fighter II, so dit raai nie meer volgens titels en koppel nie die verkeerde speletjie nie. Jou arcade-speletjies koppel die volgende keer wanneer hul RetroAchievements-data herlaai word of hulle geskraap word
    en: Arcade games can earn RetroAchievements again. RetroDB now links an arcade game only when RetroAchievements knows its exact file name, such as sf2 for Street Fighter II, so it no longer guesses from titles and links the wrong game. Your arcade games link the next time their RetroAchievements data is refreshed or they are scraped
  - type: fix
    label: PlayStation-trofeesinkronisering korrigeer nou speletjiekoppelings wat dit vroeër verkeerd gemaak het, soos baie speletjies wat aan 'n onverwante speletjie genaamd "D" gekoppel was. 'n Koppeling wat jy self gestel het, word nooit deur 'n sinkronisering verander nie. Die volgende sinkronisering gaan alle ouer koppelings weer na, so 'n paar naby-passings kan ontkoppel word; koppel dié weer met die hand
    en: PlayStation trophy sync now corrects game links it made wrongly before, such as many games linked to an unrelated game called "D". A link you set yourself is never changed by a sync. The next sync checks all older links again, so a few near matches may come unlinked; link those again by hand
  - type: fix
    label: As jy 'n wagtende grootmaat-skraap voor een wat loop skuif, word die ou skraap se laaste speletjie nie meer by die nuwe een se tellings gevoeg nie. As jy op die wenslys op "Skraap alles" klik terwyl een reeds loop, sê dit dit nou, in plaas van te beweer dit het begin
    en: Moving a waiting bulk scrape ahead of a running one no longer adds the old scrape's last game to the new one's counts. Clicking "Scrape all" on the wishlist while one is already running now says so, instead of claiming it started
  - type: accessibility
    label: 'Met ''n skermleser sê die "loop"-knoppie nou net "1 speletjie loop" wanneer die telling verander, in plaas daarvan om elke paar sekondes ''n kaal getal te lees. Sy lys maak oop as ''n benoemde venster met die wyser binne, sy Kill- en Volgende skyf-knoppies sê watter speletjie hulle raak, en ná Kill keer die wyser terug na ''n sinvolle plek. Elke speletjiekaart in die Biblioteek maak nou met die sleutelbord oop vanaf sy titel, en sy filterknoppies sê wat hulle filter, soos "Filter volgens Ontwikkelaar: Konami"'
    en: 'With a screen reader, the "running" button now says "1 game running" only when the count changes, instead of reading a bare number every few seconds. Its list opens as a named window with the cursor inside, its Kill and Next disk buttons say which game they act on, and after Kill the cursor returns to a sensible place. Each game card in the library now opens with the keyboard from its title, and its filter buttons say what they filter, such as "Filter by Developer: Konami"'
  - type: feature
    label: Elke lid kan nou hul eie Steam-sleutel en Steam-ID onder Instellings → My profiel byvoeg, en hul eie Steam-biblioteek en prestasies invoer. Tot nou toe kon net 'n admin dit doen
    en: Every member can now add their own Steam key and Steam ID under Settings → My Profile, and import their own Steam library and achievements. Until now only an admin could
  - type: fix
    label: As jy 'n speletjie se besonderhede stoor, stel dit nie meer 'n leë spelertal op 1 nie, en merk dit nie meer die ouderdomsgraderings wat RetroDB vir jou bepaal het as deur jou ingetik nie. AI-vul behou 'n speletjie wat jy as Eksklusief gemerk het, en behou enige verandering wat jy aan 'n speletjie maak terwyl dit op die KI se antwoord wag. 'n Skraap se geskiedenis lys nou net die besonderhede wat dit werklik gestoor het
    en: Saving a game's details no longer sets an empty player count to 1, and no longer marks the age ratings RetroDB worked out for you as typed by you. AI Fill keeps a game you marked Exclusive, and keeps any change you make to a game while it is waiting for the AI's answer. A scrape's history now lists only the details it actually saved
  - type: fix
    label: Skermkiekie-hersiening stop nie meer halfpad wanneer een gestoorde skermkiekie veel te groot is om oop te maak nie; dit tel daardie prent as onleesbaar en gaan voort. Die inhoudslys van die hulpbladsy skakel nou na Emulators en Speel, en die ontwikkelaarnotas oor aanmelding, agtergrondtake, skraap, prente, opdaterings en foutantwoorde sê nou wat die program werklik doen
    en: Screenshot Review no longer stops halfway when one stored screenshot is far too large to open; it counts that picture as unreadable and carries on. The help page's contents list now links to Emulators and Playing, and the developer notes on sign-in, background jobs, scraping, pictures, updates and error replies now say what the program really does
  - type: fix
    label: '''n Redigeerder wat ''n ROM-gereedskap-skandering begin, kan dit nou onderbreek, hervat of kanselleer; ander mense se skanderings bly vir ''n admin om te stop. Etikette en lyste weier ''n ontbrekende naam of ''n slegte kleur met ''n duidelike boodskap in plaas van ''n foutbladsy, en om ''n wenslysspeletjie te hernoem na een wat jy reeds begeer word geweier, soos om dit by te voeg. Maak RA-data skoon vergeet nou ook of jou kopie prestasies verdien. ''n Trofee wat RetroDB nie meer aanbied nie, tel nie meer vir jou versamelaarrang nie. Windows-ROM-paaie pas nou by RetroAchievements-speletjies volgens lêernaam'
    en: An editor who starts a ROM Tools scan can now pause, resume or cancel it; other people's scans stay an admin's to stop. Tags and lists refuse a missing name or a bad colour with a clear message instead of an error page, and renaming a wishlist game onto another one you already wish for is refused, as adding it is. Clear RA Data now also forgets whether your copy earns achievements. A trophy RetroDB no longer offers stops counting toward your collector rank. Windows ROM paths now match RetroAchievements games by file name
  - type: fix
    label: Onderhoudsregstellings. 'n Multi-skyf-argief wat nie kan uitpak nie, laat nie meer 'n half-gemaakte gids agter wat elke herpoging blokkeer nie. Bereken stoorspasie tel nou elke lêer binne 'n PS3-speletjiegids. Maak geskraapte data skoon verwyder prente net wanneer jy daarvoor vra. 'n Biblioteekskandering wat 'n speletjie teëkom wat 'n ander skandering pas bygevoeg het, gaan voort met die res van daardie konsole se speletjies
    en: Maintenance fixes. A multi-disc archive that fails to unpack no longer leaves a half-made folder behind that blocks every retry. Calculate Storage now counts every file inside a PS3 game folder. Clear Scraped Data deletes pictures only when you ask it to. A library scan that meets a game another scan has just added carries on with the rest of that console's games
  - type: fix
    label: Die terugstel van 'n rugsteun is veiliger. Dit word nou in die biblioteekdatabasis geskryf soos die databasis self verwag, sodat 'n deel van RetroDB wat dit oop het die herstelde data sien in plaas van om skade te riskeer. As jy 'n speletjie verwyder, word sy boksprente en sy wagtende prent- en emulator-instellingsinskrywings nou ook verwyder, sodat 'n nuwe speletjie dit nooit kan erf nie. Twee instellings wat op dieselfde oomblik gestoor word, verloor nie meer een daarvan nie
    en: Restoring a backup is safer. It is now written into the library database the way the database itself expects, so a part of RetroDB that has it open sees the restored data instead of risking damage. Deleting a game now also deletes its box pictures and its waiting picture and emulator-setting entries, so a new game can never inherit them. Two settings saved at the same moment no longer lose one of them
  - type: fix
    label: Prentregstellings. GIF's word nie meer deur die opskaler gestuur net om weggegooi te word nie. Die opskaler-model word teen sy gepubliseerde vingerafdruk nagegaan, en 'n slegte aflaai word weer gehaal in plaas daarvan om opskaling vir goed af te skakel. Logo's en prente met deurskynende dele behou hul deursigtigheid wanneer hulle vergroot word. Skakel om na WebP neem nou ook agterblaaie en logo's, en weier nie meer 'n groot biblioteek weens spasie wat dit nie nodig het nie. Twee kante van 'n boksleêr kan een prent deel, en om 'n boks met 'n beskadigde rekord te verwyder, verwyder sy prente
    en: Picture fixes. GIFs are no longer run through the upscaler only to be thrown away. The upscaler model is checked against its published fingerprint, and a bad download is fetched again instead of turning upscaling off for good. Logos and pictures with see-through parts keep their transparency when enlarged. Convert to WebP now takes back covers and logos too, and no longer refuses a large library for want of room it does not need. Two faces of a box file can share one picture, and removing a box with a damaged record removes its pictures
  - type: fix
    label: Invoere van CLZ, Steam, Xbox en PlayStation behandel nie meer elke titel wat net in Japanees of 'n ander nie-Latynse skrif geskryf is as dieselfde speletjie nie, en voeg nie meer 'n speletjie sonder 'n id by nie. Die CLZ-voorskou voeg nie meer konsoles by voordat jy die invoer bevestig nie, en 'n kyker wat na 'n Steam-, Xbox- of PlayStation-biblioteek kyk, voeg hulle ook nie meer by nie. 'n Steam-speletjie wat uit die winkel verwyder is, word een keer gevra, nie met elke sinkronisering nie
    en: Imports from CLZ, Steam, Xbox and PlayStation no longer treat every title written only in Japanese or another non-Latin script as the same game, and no longer add a game with no id. The CLZ preview no longer adds consoles before you confirm the import, and a viewer looking at a Steam, Xbox or PlayStation library no longer adds them either. A Steam game removed from the store is asked about once, not on every sync
  - type: fix
    label: Analise groepeer nou baie meer konsoles onder hul vervaardiger in plaas van "Ander", en die paneelbord se lys Onlangs geskraap wys 'n speletjie wat jy weer geskraap het, nie net nuut bygevoegde speletjies nie
    en: Analytics now groups many more consoles under their maker instead of "Other", and the dashboard's Recently Scraped list shows a game you scraped again, not only newly added games
  - type: fix
    label: Beheerderbeelde wat jy in die Museum byvoeg, bly behoue wanneer die losstaande weergawe opdateer. Wanneer 'n aanlyndiens by sy limiet onderbreek, word die tyd wanneer dit weer gevra sal word in jou eie tydsone gewys
    en: Controller pictures you add in the Museum are kept when the standalone version updates. When an online service pauses at its limit, the time it will be asked again is shown in your own time zone
  - type: fix
    label: '''n Bonusskyf kan nie meer aan homself of aan ''n ander bonusskyf gekoppel word nie, en Outo-koppel koppel nie meer ''n skyf aan een wat dit in dieselfde lopie as bonusskyf merk nie'
    en: A bonus disc can no longer be linked to itself or to another bonus disc, and Auto-link no longer links a disc to one it marks as a bonus disc in the same run
  - type: fix
    label: Die Biblioteek- en konsolebladsye tel nie meer arcade-BIOS-lêers as speletjies in hul totale of die letterbalk nie. Soortgelyke speletjies, en die lys wat jy kry deur op 'n genre of uitgewer op 'n speletjie se bladsy te klik, wys nie meer die speletjie se eie streekweergawes, bonusskywe of BIOS-lêers nie
    en: The Library and console pages no longer count arcade BIOS files as games, in their totals or the letter bar. Similar games, and the list you get by clicking a genre or publisher on a game's page, no longer show the game's own regional versions, bonus discs or BIOS files
  - type: fix
    label: Kies alles sê nou so wanneer 'n baie groot lys afgesny word, in plaas van stilweg net 'n deel te kies
    en: Select all now says so when a very large list is cut short, instead of quietly selecting only part of it
  - type: fix
    label: Biblioteekkaarte werk nou op wanneer jou prestasie- of trofeevordering verander, en wanneer 'n speletjie speelbaar word of ophou speelbaar wees
    en: Library cards now update when your achievement or trophy progress changes, and when a game becomes playable or stops being playable
  - type: fix
    label: Grootmaat-wysiging kan nie meer die verkeerde speletjies verander wanneer dit 'n slegte keuse ontvang nie, en 'n grootmaat-wysiging wat misluk, merk nie meer die speletjies as deur jou gewysig nie
    en: Bulk edit can no longer change the wrong games when it is sent a bad selection, and a bulk edit that fails no longer marks the games as edited by you
  - type: fix
    label: '''n HowLongToBeat-treffer wat net ''n 1%-passing is, word nie meer as ''n 100%-treffer gewys nie, en ''n bladsy wat nie laai nie, wys die foutbladsy in plaas van die rou foutteks'
    en: A HowLongToBeat match that is only a 1% fit is no longer shown as a 100% match, and a page that fails to load shows the error page instead of the raw error text
  - type: security
    label: As jy jou wagwoord verander, of 'n admin dit terugstel, word daardie rekening nou op elke ander toestel afgemeld. Daarom meld almal ná hierdie opdatering weer een keer aan. Die eerste-keer-opstelbladsy kry ook dieselfde beskerming teen ander webwerwe as elke ander bladsy
    en: Changing your password, or an admin resetting it, now signs that account out on every other device. Because of this, everyone signs in once more after this update. The first-run setup page also gets the same protection against other websites as every other page
  - type: fix
    label: '''n Prent wat as jou avatar geweier word, verwyder nie meer die avatar wat jy gehad het nie'
    en: A picture that is refused as your avatar no longer deletes the avatar you had
  - type: fix
    label: Skrape is sagter op die aanlyndienste. 'n Diens wat aanhou misluk word 'n tydlank oorgeslaan wanneer gapings gevul word, soos dit reeds in soektogte was, en ScreenScraper-speletjieopsoeke respekteer nou ook sy daaglikse limiete
    en: Scrapes are gentler on the online services. A service that keeps failing is skipped for a while when filling gaps, as it already was in searches, and ScreenScraper game lookups now respect its daily limits too
  - type: fix
    label: '''n Skraap misluk nie meer op ''n speletjie met ''n onbekende uitreikjaar, soos "TBA", nie, en ''n speletjie wat vir streke buite jou lys gelys is, soos "Brasilië, Korea", behou sy streek in plaas daarvan om jou verstek te word'
    en: A scrape no longer fails on a game whose release year is unknown, such as "TBA", and a game listed for regions outside your list, such as "Brazil, Korea", keeps its region instead of becoming your default
  - type: fix
    label: ES-DE-gidse wat as ~/ geskryf is, werk nou, en 'n baie groot ES-DE-lêer word nie meer gekopieer nie. Voorgestelde streekweergawes sit nooit twee speletjies weer saam wat jy gesê het nie weergawes van mekaar is nie
    en: ES-DE folders written as ~/ now work, and a very large ES-DE file is no longer copied. Suggested regional versions never put back together two games you said are not versions of each other
  - type: security
    label: RetroDB weier 'n paar meer private netwerkadresse wanneer prente van die web gehaal word, en volg 'n webadres se aanstuur korrek
    en: RetroDB refuses a few more private network addresses when fetching pictures from the web, and follows a web address's redirect correctly
  - type: fix
    label: Die laaste skerms wat nog in Engels was, volg nou ook jou taal, insluitend die opstelassistent, Etikette, Lyste, Vergelyk speletjies, ROM-gereedskap-instellings, die grootmaat-skraapry, die paneelbord se lys onderbroke take, die biblioteekkaartetikette en baie foutboodskappe
    en: The last screens still in English now follow your language too, including the setup wizard, Tags, Lists, Compare Games, ROM Tools settings, the bulk scrape queue, the dashboard's interrupted-jobs list, the library card labels and many error messages
  - type: security
    label: '''n Stelselnaam wat webkode bevat, kan dit nie meer in die grootmaat-skraapry-venster laat loop nie'
    en: A system name holding web code can no longer run it in the bulk scrape queue window
  - type: accessibility
    label: Waar jy ook al op 'n bladsy is, word die sleutelbord se plek nou met 'n dik ring in jou tema se kleur gemerk, op elke knoppie, boks en skakel. Voorheen het baie kontroles net 'n flou lyn gewys, dieselfde as wanneer die muis daaroor beweeg het
    en: Wherever you are on a page, the keyboard's place is now marked with a bold ring in your theme's colour, on every button, box and link. Before, many controls showed only a faint line, the same as when the mouse passed over them
  - type: accessibility
    label: Die Genre-, Reeks-, Ontwikkelaar- en Uitgewer-skakels op biblioteekkaarte werk nou met die sleutelbord. Die "loop"-knoppie vir speletjies wat speel maak ook met die sleutelbord oop, en Esc of 'n klik elders sluit sy lys
    en: The Genre, Series, Developer and Publisher links on library cards now work from the keyboard. The "running" button for games in play opens from the keyboard too, and Esc or a click elsewhere closes its list
  - type: accessibility
    label: Skermlesers noem nou elke etiketkleur en sê watter een gekies is, en lees trofeeprente as Platinum, Goud, Silwer en Brons in plaas van enkele letters. Terwyl 'n speletjie begin, beweeg Tab nie meer agter die beginskerm nie
    en: Screen readers now name each tag colour and say which one is chosen, and read trophy pictures as Platinum, Gold, Silver and Bronze instead of single letters. While a game starts, Tab no longer moves behind the starting screen
  - type: fix
    label: As 'n opdatering stop voordat dit lêers begin ruil, begin RetroDB nou weer die weergawe wat jy gehad het, in plaas daarvan om gesluit te bly
    en: If an update stops before it starts swapping files, RetroDB now starts the version you had again, instead of staying closed
  - type: fix
    label: As jy twee keer gelyk op Speel druk, kan dit nie meer twee speletjies op die ingeboude speler begin nie. Wag vir 'n Core-aflaai gee nou ná 'n rukkie op, of wanneer RetroDB ophou antwoord, in plaas van vir ewig te wag, en die "loop reeds"-vraag gebruik RetroDB se eie dialoog
    en: Pressing Play twice at once can no longer start two games on the built-in player. Waiting for a core download now gives up after a while, or when RetroDB stops answering, instead of waiting forever, and the "already running" question uses RetroDB's own dialog
  - type: fix
    label: Kulkodes wat jy tydens spel aan- of afskakel, word vir die regte speletjie behou, nooit van 'n ander speletjie geneem waarvan die lêer dieselfde naam het nie. 'n Kulkode-probleem keer nooit dat 'n speletjie begin nie
    en: Cheats you switch on or off during play are kept for the right game, never taken from another game whose file has the same name. A cheat problem never stops a game starting
  - type: fix
    label: RetroDB skryf 'n emulator se instellingslêer veiliger. 'n Instellingslêer wat 'n skakel is, bly 'n skakel, behou sy toestemmings, en behou letters wat dit nie kan lees nie, en 'n mislukte stoor laat geen vreemde lêer agter nie
    en: RetroDB writes an emulator's settings file more safely. A settings file that is a link stays a link, keeps its permissions, and keeps letters it cannot read, and a failed save leaves no stray file behind
  - type: fix
    label: '''n Grootmaat-skraap wat jy af in die ry skuif, met ''n ander omruil of hervat terwyl een loop, gaan nie meer verlore wanneer RetroDB herbegin nie; die paneelbord bied dit aan, vanaf waar dit gestop het. ''n Uitgeruilde skraap bly nie meer langs die nuwe een loop nie, en twee vinnige klikke op Hervat begin ''n taak een keer'
    en: A bulk scrape you move down the queue, swap with another or resume while one runs is no longer lost when RetroDB restarts; the dashboard offers it, from where it stopped. A swapped-out scrape no longer keeps running beside the new one, and two quick clicks on Resume start a job once
  - type: fix
    label: Een speletjie se fout, soos wanneer die netwerk wegval, beëindig nie meer 'n hele AI-vul-lopie of 'n Maak boks en handleiding-streke reg-lopie nie; daardie speletjie tel as misluk en die res gaan voort. Wanneer RetroDB gestop word, stop dit nou ook Core-aflaaie netjies
    en: One game's error, such as the network dropping, no longer ends a whole AI Fill run or a Fix Box and Manual Regions run; that game counts as failed and the rest go on. Stopping RetroDB now also stops core downloads cleanly
  - type: fix
    label: Wenslys-items bly nie meer vir ewig op "skraap" staan ná 'n fout of 'n herbegin nie, en twee Skraap-alles-lopies vir dieselfde wenslys loop nie meer gelyktydig nie
    en: Wishlist items no longer stay on "scraping" forever after an error or a restart, and two Scrape All runs for the same wishlist no longer run at once
  - type: fix
    label: '''n Skrip of ''n tweede kopie van RetroDB wat begin, merk nie meer die lopende bediener se take as onderbreek nie, en twee kopieë wat gelyktydig begin, kan nie meer die databasis ''n weergawe terugstel nie'
    en: A script or a second copy of RetroDB starting up no longer marks the running server's jobs as interrupted, and two copies starting at once can no longer set the database back a version
  - type: fix
    label: Wanneer 'n PlayStation-sinkronisering begin, laat dit nie meer almal se vorderingsbalke wag terwyl dit by Sony aanmeld nie. Die daaglikse PlayStation-lewendig-hou hernu nou 'n aanmelding eers naby die einde van sy 10 dae, in plaas van elke dag
    en: Starting a PlayStation sync no longer makes everyone's progress bars wait while it signs in to Sony. The daily PlayStation keep-alive now renews a sign-in only near the end of its 10 days, instead of every day
  - type: fix
    label: '''n Skraap skryf nie meer oor ''n wysiging wat jy maak terwyl dit loop nie, en maak nie meer ''n genre, modus of aansig leeg waarvoor dit nie ''n naam het nie. Dit verander nie meer ''n gestoorde spelertal om by die speletjie se modusse te pas nie'
    en: A scrape no longer writes over a change you make while it runs, and no longer empties a genre, mode or view it has no name for. It no longer changes a stored player count to match the game's modes
  - type: fix
    label: AI-vul verander nie meer wat jy self ingetik het nie, soos 'n uitgewer of genre wat jy met die hand reggemaak het; dit korrigeer slegs geskraapte waardes. Dit meld nie meer 'n waarde as verander nie as dit dit net anders geskryf het nie, soos 4 spelers as "1-4" of dieselfde genres in 'n ander volgorde
    en: AI Fill no longer changes what you typed yourself, such as a publisher or genre you corrected by hand; it corrects only scraped values. It no longer reports a value as changed when it only wrote it differently, such as 4 players as "1-4" or the same genres in another order
  - type: fix
    label: '''n Beheerder wat jy vir ''n speletjie intik, word behou; die konsole se verstekbeheerder vervang nou slegs geskraapte en AI-waardes. ''n Ouderdomsgradering wat uit ''n ander bord se AI-raaiskoot omgeskakel is, word nou ook as ''n raaiskoot gemerk'
    en: A controller you type for a game is kept; the console's default controller now replaces only scraped and AI values. An age rating converted from another board's AI guess is now marked as a guess too
  - type: fix
    label: As jy 'n speletjie se wysigvenster stoor, maak dit nie meer velde leeg wat die venster nie wys nie. Terugstel op 'n speletjie se bladsy vee nou alles uit wat dit sê, insluitend die aansig, uitgawe en ander name, verwyder die speletjie se prente en video's tensy 'n ander speletjie dit gebruik, en werk die biblioteekfilters dadelik op
    en: Saving a game's edit window no longer empties fields the window does not show. Reset on a game's page now clears everything it says it does, including the view, edition and other names, deletes the game's pictures and videos unless another game uses them, and updates the library filters straight away
  - type: fix
    label: Vee geskraapte data uit vee nou ook die aansig, 2D of 3D, en speletjiestruktuur uit. 'n CLZ-invoer van 'n speletjie met net 'n jaar behou net die jaar, nie 1 Januarie nie
    en: Clear Scraped Data now also clears the view, 2D or 3D, and game structure. A CLZ import of a game with only a year keeps just the year, not 1 January
  - type: security
    label: Steam-sinkronisering leen nie meer die Steam-sleutel uit Instellings vir elke huishoudlid nie. 'n Lid sonder eie Steam-sleutel het die admin se Steam-biblioteek en prestasies onder sy rekening gekry. Die sleutel in Instellings dien nou slegs admins
    en: Steam sync no longer borrows the Steam key from Settings for every household member. A member with no Steam key of their own was getting the admin's Steam library and achievements under their account. The key in Settings now serves admins only
  - type: fix
    label: How Long to Beat se opsoek vir baie speletjies stoor nou die tye waaroor dit seker is. Voorheen het elke seker treffer misluk en niks is gestoor nie. RetroAchievements-herlaai kontroleer nou ook elke speletjie se lêer teen RetroAchievements se lys, soos 'n skraap, sodat 'n speletjie aan die presiese weergawe wat jy het gekoppel word
    en: How Long to Beat's lookup for many games now saves the times it is sure of. Before, every sure match failed and nothing was saved. RetroAchievements Refresh now also checks each game's file against RetroAchievements' list, as a scrape does, so a game is linked to the exact version you have
  - type: fix
    label: Die boodskap dat 'n agtergrondtaak klaar is, verskyn weer, en 'n taak se vorderingskassie merk wanneer die bediener die taak ná 'n herbegin optel. Voorheen het nie een ooit verskyn nie
    en: The message that a background job has finished shows again, and a job's progress box notices when the server picks the job up after a restart. Before, neither ever appeared
  - type: fix
    label: 'PlayStation-trofeë: ''n speletjie wat jy met die hand gekoppel het, bly gekoppel ná ''n volle sinkronisering, en ''n sinkronisering koppel nie meer ''n speletjie aan sy opvolger nie, soos "Doom" aan "Doom Eternal". Invoer van PlayStation-speletjies koppel nou ''n speletjie wat reeds in jou biblioteek is, soos Steam- en Xbox-invoere, sodat sy trofeë daarop wys'
    en: 'PlayStation trophies: a game you linked by hand stays linked after a full sync, and a sync no longer links a game to its sequel, such as "Doom" to "Doom Eternal". Importing PlayStation games now links a game already in your library, as Steam and Xbox imports do, so its trophies show on it'
  - type: fix
    label: Xbox wys nie meer jou gamertag as Onbekend nadat sy aanmelding homself hernu nie, en 'n stadige of mislukte verbinding meld jou nie meer van Xbox af nie. Slegs as Microsoft die aanmelding weier, gebeur dit
    en: Xbox no longer shows your gamertag as Unknown after its sign-in renews itself, and a slow or failed connection no longer signs you out of Xbox. Only Microsoft refusing the sign-in does that
  - type: fix
    label: Twee mense kan nou elk 'n etiket met dieselfde naam hê; voorheen het die tweede met 'n fout misluk. Enige aangemelde gebruiker kan nou sy eie RPCS3-trofeë herskandeer; voorheen kon net 'n admin, en almal anders het ou trofeë gesien tot RetroDB herbegin is
    en: Two people can now each have a tag of the same name; before, the second one failed with an error. Any signed-in user can now rescan their own RPCS3 trophies; before, only an admin could, and everyone else saw old trophies until RetroDB restarted
  - type: security
    label: Jou aanmeldings bly privaat. Databasis-rugsteune kan nie meer deur ander rekeninge op die rekenaar gelees word nie, en 'n mislukte rugsteun verwyder nie meer die een daarvoor nie. As 'n gebruiker verwyder of afgeskakel word, meld dit hom ook af by RetroAchievements in DuckStation en PCSX2. 'n RetroAchievements-aanmelding wat uit die speler se eie kieslys gestoor is, dra nie meer oor na die volgende persoon wat speel nie. Logboeke en gestoorde taakfoute versteek RetroAchievements-tekens, 'n ander lid se PlayStation-fout word slegs aan hom gewys, en ou platteks-PlayStation- en Xbox-aanmeldlêers word verwyder
    en: Your sign-ins stay private. Database backups can no longer be read by other accounts on the computer, and a failed backup no longer deletes the one before it. Deleting or switching off a user also signs them out of RetroAchievements in DuckStation and PCSX2. A RetroAchievements sign-in saved from the player's own menu no longer carries over to the next person who plays. Logs and saved job errors hide RetroAchievements tokens, another member's PlayStation error is shown only to them, and old plain-text PlayStation and Xbox sign-in files are removed
  - type: fix
    label: RetroDB se eie toetse kan nie meer jou biblioteek raak terwyl hulle loop nie. Hulle gebruik altyd 'n weggooi-kopie van die databasis, prente en instellings, en weier om te begin as enige een na jou regte lêers wys
    en: RetroDB's own checks can no longer touch your library while they run. They always use a throwaway copy of the database, pictures and settings, and refuse to start if any of them points at your real files
  - type: fix
    label: Maak weeslêers skoon verwyder nie meer jou wenslys se prente nie. Om 'n speletjie oop te maak laat dit nie meer skermkiekies vergeet wat dit nie kan vind nie. Voorheen, met die prentskyf uitgeskakel, het elke speletjie wat jy oopgemaak het sy hele skermkiekie-lys verloor; nou word die lys behou, en 'n ontbrekende prent word net versteek
    en: Clean orphaned files no longer deletes your wishlist's pictures. Opening a game no longer makes it forget screenshots it cannot find. Before, with the picture drive unplugged, every game you opened lost its whole screenshot list; now the list is kept, and a missing picture is only hidden
  - type: fix
    label: '''n Video- of handleiding-aflaai wat halfpad misluk, beskadig nie meer die kopie wat die speletjie reeds gehad het nie, en ''n mislukte aflaai laat nie ''n verskuilde halflêer in die media-gids agter nie. Die agtergrond-opskaler stoor nie meer ''n ou prent oor ''n nuwer een wat intussen afgelaai is nie. Skakel om na WebP laat elke speletjie wat ''n prent deel steeds daarna wys, en raak nooit ''n lêer buite die prentgidse nie'
    en: A video or manual download that fails part-way no longer damages the copy the game already had, and a failed download no longer leaves a hidden half-file in the media folder. The background upscaler no longer saves an old picture over a newer one downloaded meanwhile. Convert to WebP keeps every game that shares a picture pointing at it, and never touches a file outside the picture folders
  - type: fix
    label: As jy 'n speletjie of 'n wenslys-item verwyder, word sy prente, video's en handleidings nou ook verwyder, maar dit behou enigiets wat 'n ander speletjie of wenslys-item nog gebruik. Gestoorde prente kan weer deur ander rekeninge op die rekenaar gelees word, en Verander prentgrootte tel 'n prent wat dit nie kon stoor nie as misluk, nie as klaar nie
    en: Deleting a game or a wishlist item now deletes its pictures, videos and manuals too, but keeps any another game or wishlist item still uses. Saved pictures can be read by other accounts on the computer again, and Resize Images counts a picture it could not save as failed, not as done
  - type: fix
    label: Duplikaatvinder bied nie meer 'n werkende lêer vir verwydering aan nie. As dit volgens naam soek, noem dit nie meer 'n speletjie se .cue- en .bin-kopieë duplikate van mekaar nie. Dit bied nooit 'n skyf se snitlêer aan nie, wat twee weergawes van 'n speletjie kan deel. Dit sal nie 'n skyf verwyder wat 'n snitlys lys nie. 'n Speletjie wie se lêer jy verwyder, skuif nou na die kopie wat jy hou, sodat dit in die biblioteek bly
    en: Duplicate Finder no longer offers a working file for deletion. Looking by name, it no longer calls a game's .cue and .bin copies of each other. It never offers a disc's track file, which two versions of a game can share. It will not delete a disc that a playlist lists. A game whose file you delete now moves to the copy you keep, so it stays in the library
  - type: fix
    label: Organiseer multi-skyf skryf nie oor 'n bestaande snitlys of 'n lêer wat reeds in die speletjie se gids is nie; dit stop en sê watter een. Die snitlys wat dit maak, lys elke skyf se .cue, nie sy snitlêers nie. Speletjies wie se lêers dit skuif, volg hulle nou in die gids in, sodat Maak ontbrekende ROM's skoon hulle nie meer verwyder nie
    en: Organize Multi-Disc no longer writes over an existing playlist or a file already in the game's folder; it stops and says which. The playlist it makes lists each disc's .cue, not its track files. Games whose files it moves now follow them into the folder, so Clean missing ROMs no longer removes them
  - type: fix
    label: Omskakeling na CHD met "verwyder oorspronklikes" verwyder nou ook die skyf se snitlêers, maar behou 'n snit wat 'n ander .cue nog gebruik. Die speletjie en enige snitlys wat die ou skyf gelys het, wys nou na die nuwe .chd. As 'n speletjie se lêer hernoem word, werk dit nou die snitlys by wat dit lys, en 'n snitlêer wat 'n .cue nodig het, kan nie hernoem word nie. Verwydering van lêers uit 'n zip verwyder net die lêers wat jy gekies het, selfs wanneer 'n naam [ of ] bevat. Skermkiekie-duplikaatverwydering verwyder net die kopieë wat sy skandering gevind het, en behou altyd een
    en: Converting to CHD with "delete originals" now deletes the disc's track files too, but keeps a track another .cue still uses. The game and any playlist that listed the old disc now point at the new .chd. Renaming a game's file now updates the playlist that lists it, and a track file a .cue needs cannot be renamed. Removing files from a zip removes only the files you picked, even when a name holds [ or ]. Screenshot Dedup deletes only the copies its scan found, and always keeps one
  - type: fix
    label: How Long to Beat op 'n speletjie se bladsy soek na wat jy intik. Voorheen, as dit 'n titel nie kon vind nie, het dit eerder die speletjie se ander name gesoek, en dit kon 'n ander speletjie aanbied, soos 'n aanhangerhermaak. Dit probeer steeds die ander name wanneer die blokkie die speletjie se eie naam bevat
    en: How Long to Beat on a game's page searches for what you type. Before, a title it could not find made it search the game's other names instead, and it could offer a different game, such as a fan remake. It still tries the other names when the box holds the game's own name
  - type: fix
    label: Die stappe vir How Long to Beat in die hulphandleiding pas by die skerm. Hulle het gesê kies 'n treffer uit 'n lys; die bladsy wys een treffer met Stoor en Kanselleer. Die PlayStation-hulp sê nie meer die aanmelding duur omtrent twee maande nie, aangesien RetroDB self weer aanmeld. Al 20 vertaalde handleidings dra albei veranderings
    en: The help manual's How Long to Beat steps match the screen. They said to pick a match from a list; the page shows one match with Save and Cancel. The PlayStation help no longer says the sign-in lasts about two months, since RetroDB signs in again by itself. All 20 translated manuals carry both changes
  - type: fix
    label: Elke letterbalk begin nou met 'n Alles-knoppie. Op die Biblioteek-, konsole- en PSN-trofeë-bladsye wys die keuse van 'n letter net daardie letter se speletjies, en voorheen was daar geen knoppie om die res terug te bring nie. Op die ander prestasiebladsye gaan Alles terug na die eerste speletjie
    en: Every letter bar now starts with an All button. On the Library, console and PSN Trophies pages, picking a letter shows only that letter's games, and before there was no button to bring the rest back. On the other achievement pages, All goes back to the first game
  - type: fix
    label: '''n Nuwe PlayStation-aanmeldteken wat jy in Instellings plak, word nou dadelik gebruik. Voorheen het RetroDB die ou aanmelding gebruik totdat dit verval het, en Stoor en toets verbinding het daardie ou aanmelding as werkend gemeld. ''n Teken wat Sony weier, vervang nie meer een wat werk nie'
    en: A new PlayStation sign-in token you paste in Settings is now used straight away. Before, RetroDB kept using the old sign-in until it ran out, and Save & Test Connection reported that old sign-in as working. A token Sony refuses no longer replaces one that works
  - type: enhancement
    label: 'Die PlayStation-aanmelding in Instellings is makliker om aan die gang te hou. Die banier tel nie meer dae af waarop jy nooit hoef op te tree nie, want RetroDB meld self weer aan; dit word slegs rooi wanneer Sony jou gestoorde teken weier. Die Plak hier-knoppie laat nie meer die blaaier vra om jou knipbord te lees nie: dit plaas die wyser in die blokkie vir Ctrl+V. Die stappe sê nou om eers by PlayStation af te meld wanneer jy ''n teken vervang wat nog werk, en hul boodskappe kan vertaal word'
    en: 'The PlayStation sign-in in Settings is easier to keep going. The banner no longer counts down days you never had to act on, because RetroDB signs in again by itself; it turns red only when Sony refuses your saved token. The Paste here button no longer makes the browser ask to read your clipboard: it puts the cursor in the box for Ctrl+V. The steps now say to sign out of PlayStation first when you replace a token that still works, and their messages can be translated'
  - type: enhancement
    label: Opspringboodskappe en vraagkassies, soos "Instellings gestoor" of "Verwyder hierdie lys?", kan nou op elke bladsy vertaal word. Voorheen het die meeste in Engels gebly, watter taal jy ook al gekies het
    en: Pop-up messages and question boxes, such as "Settings saved" or "Delete this list?", can now be translated on every page. Before, most of them stayed in English whatever language you chose
  - type: enhancement
    label: Die boodskappe wat sê hoekom 'n PlayStation-aanmelding misluk het, soos "Jou NPSSO het dalk verval", kan nou vertaal word
    en: The messages that say why a PlayStation sign-in failed, such as "Your NPSSO may have expired", can now be translated
  - type: fix
    label: Die hulphandleiding in elke taal pas nou by die Engelse een. Dit kry Soek oral, Hou 'n titel, MAME-name en die agterkant van die boks, en ouer paragrawe wat agtergeraak het, is op datum
    en: The help manual in every language now matches the English one. It gains Search Anywhere, Keeping a Title, MAME Names and the back of the box, and older paragraphs that had fallen behind are up to date
  - type: fix
    label: In Duits, Afrikaans en Spaans sê die Terug-knoppie op 'n speletjie se omslag nou die agterkant van die boks, nie "gaan terug" nie
    en: In German, Afrikaans and Spanish, the Back button on a game's cover now says the back of the box, not "go back"
  - type: feature
    label: As jy Speel druk, vul die speletjie se logo op sy agtergrondprent nou die skerm terwyl die speletjie begin, of sy naam in groot letters as dit geen logo het nie. Dit verdwyn vanself wanneer die speletjie se venster oopgaan, of wanneer jy Esc druk of klik
    en: Pressing Play now fills the screen with the game's logo on its background picture while the game starts, or its name in large letters when it has no logo. It goes away by itself when the game's window opens, or when you press Esc or click
  - type: feature
    label: 'Die draaibare 3D-boks het nou die ware vorm van ''n PS5-houer: ronde hoeke en rande, die verhewe lip om die omslag, die lyn waar die twee helftes ontmoet, en die vingerspleet in die oopkant. Dit het ''n boks-lêer nodig van ''n Slipcase-weergawe wat die vorm skryf; voer die boks weer in om dit te kry. Ander bokse lyk soos voorheen'
    en: 'The turnable 3D box now has the real shape of a PS5 case: rounded corners and edges, the raised lip round the cover, the line where the two halves meet, and the finger slot in the opening side. It needs a box file from a Slipcase version that writes the shape; import the box again to get it. Other boxes look as before'
  - type: enhancement
    label: Herlaai RetroAchievements het van Instellings na die RetroAchievements-bladsy geskuif, en heet nou Vind speletjies met prestasies. Elke knoppie daar het nou 'n reël wat sê wat dit doen, sodat Vind speletjies en Sinkroniseer vordering maklik uitmekaar gehou kan word. As nog geen speletjies gekoppel is nie, wys die bladsy die Vind-knoppie aan 'n admin in plaas daarvan om na die volgende oortjie te gaan
    en: Refresh RetroAchievements moved from Settings to the RetroAchievements page, and is now called Find Games with Achievements. Every button there now has a line saying what it does, so Find Games and Sync Progress are easy to tell apart. With no games linked yet, the page shows an admin the Find button instead of moving on to the next tab
  body: "<ul>\n  <li><strong>Die hulphandleiding is in elke taal op datum.</strong>\n    Afdelings wat net in die Engelse handleiding was, is nou vertaal.</li>\n</ul>\n"
  body_en: "<ul>\n  <li><strong>The help manual is up to date in every language.</strong>\n    Sections that were only in the English manual are now translated.</li>\n</ul>\n"
- version: 3.35.4
  date: '2026-11-03'
  tags:
  - type: fix
    label: '''n Skermkiekie wat jy van ''n speletjie verwyder, bly nou verwyder. Voorheen kon die volgende skraap dit weer vanaf ES-DE terugkopieer of vanaf ''n aanlynbron weer aflaai. Om ''n oortollige kopie in die Duplikaat-skermkiekies-nutsprogram te verwyder tel nie, want jy hou die prent een keer'
  - type: feature
    label: 'Speletjies kry nou hul logo: skraap stoor dit vanaf ES-DE, ScreenScraper, TheGamesDB, IGDB en Steam, en die speletjiebladsy wys dit bo die titel, of in die plek van ''n ontbrekende boks. Jy kan ''n logo in die Wysig-venster oplaai of verwyder. Doen ''n grootmaat-skraap met Vul ontbrekende in om logo''s te vul vir speletjies wat jy voorheen geskraap het'
  - type: fix
    label: IGDB gee nie meer 'n speletjie se logo as die bladsyagtergrond nie
  - type: feature
    label: 'Speletjies kry nou die agterkant van hul boks: skraap stoor dit vanaf ES-DE, ScreenScraper en TheGamesDB, en ''n Terug-knoppie op die speletjiebladsy se omslag wys dit. Klik op die agterkant om dit te vergroot. Jy kan ''n agterkant in die Wysig-venster oplaai of verwyder. Agterkante word gevul wanneer ''n speletjie geskraap word; Vul ontbrekende skraap nie ''n speletjie weer net vir sy agterkant nie'
  - type: fix
    label: '''n Speletjie sonder voorblad op TheGamesDB kry nie meer die agterkant van die boks as sy omslag nie'
  - type: fix
    label: As jy 'n skraper in Instellings afskakel terwyl 'n grootmaat-skraap loop, is die telling van speletjies wat nie gevind is nie nou reg vanaf die volgende speletjie. Voorheen kon 'n speletjie eerder as gestop getel word
  - type: enhancement
    label: Op 'n stelsel sonder 'n opgestelde emulator is die Speel-knoppie gryserig. Wys daarheen om te sien hhoekom, of klik daarop vir 'n boks wat sê geen emulator is opgestel nie. Voorheen het 'n reël teks langs die knoppie gestaan
  body: "<ul>\n  <li><strong>Speletjies kry hul logo.</strong> Skraap stoor elke speletjie se\n    logo, en die speletjiebladsy wys dit bo die titel, of in die plek van 'n\n    ontbrekende boks. Doen 'n grootmaat-skraap met Vul ontbrekende in om logo's te vul vir\n    speletjies wat jy voorheen geskraap het.</li>\n  <li><strong>Speletjies kry die agterkant van hul boks.</strong> 'n Terug-knoppie op\n    die speletjiebladsy se omslag wys dit, en jy kan daarop klik om te vergroot. Agterkante\n    word gevul wanneer 'n speletjie geskraap word.</li>\n  <li><strong>'n Verwyderde skermkiekie bly verwyder.</strong> Die volgende skraap\n    kopieer dit nie meer terug nie en laai dit nie weer af nie.</li>\n  <li><strong>Speel sê hoekom dit nie kan begin nie.</strong> Op 'n stelsel sonder 'n\n    opgestelde emulator is die Speel-knoppie gryserig en sê hoekom.</li>\n</ul>\n"
- version: 3.35.3
  date: '2026-11-02'
  tags:
  - type: feature
    label: 'Nuwe MAME Names-hulpmiddel in ROM Tools: MAME-speletjies kry hul regte name, jare en vervaardigers uit MAME se eie lys, en die lêers behou hul kort name. ''n Skraap vind dan elke speletjie, en jy kan die MAME-lys volgens kategorie filtreer, byvoorbeeld om dobbelmasjiene uit te los. BIOS-stelle word uit die lys versteek'
  - type: fix
    label: ROM Reports bied nie meer aan om MAME-lêers te hernoem nie, want 'n hernoemde lêer werk nie meer in MAME nie
  - type: fix
    label: Instellings sê nou wat Microsoft vereis voordat 'n Xbox-program geregistreer kan word. Xbox-aanmelding kon hierdeur nie getoets word nie
  - type: enhancement
    label: Die aparte Official Names-kaart is weg uit Bulk AI-vul, omdat die AI-vul se Official name-skakelaar reeds hierdie werk doen
  - type: fix
    label: Wanneer Sony 'n gestoorde PlayStation-aanmelding van die hand wys, sê die paneelbord en Instellings dit nou en vra jou om weer te koppel. Voorheen het die logboek by elke bediener-aanskakeling 'n betekenislose fout gewys en niks het jou ingelig nie
  - type: feature
    label: Om van Steam af in te voer vul nou elke speletjie se beskrywing, erkennings, Metacritic-telling, ouderdomsgraderings, speletjiemodusse, voorblad, agtergrond en skermkiekies uit sy winkelblad, op die agtergrond. Skraap 'n speletjie vir sy genre en vrystellingsdatum
  - type: feature
    label: '''n Steam-sinkronisering behou nou jou speeltyd en wanneer jy laas gespeel het, en die speletjieblad wys dit'
  - type: fix
    label: Fetch Library op die Steam-invoerblad werk nou vir 'n admin met 'n gestoorde Steam-sleutel. Voorheen het dit die versteekte vorm van die sleutel na Steam gestuur, en die blad het verkeerdelik gesê jy moet jou profiel op Public stel
  - type: fix
    label: '''n Steam- of Xbox-speletjie wat reeds onder dieselfde naam in jou biblioteek is, koppel nou aan daardie speletjie wanneer jy dit invoer, sodat sy prestasies sinkroniseer. Voorheen is dit oorgeslaan en nooit gekoppel nie'
  - type: fix
    label: Speletjies wat van Steam, Xbox en PlayStation ingevoer word, sorteer nou dadelik reg, soos Final Fantasy IX voor Final Fantasy X, en Steam se handelsmerktekens word uit hul name gelaat
  - type: feature
    label: Op stelsels waar RetroAchievements 'n gewone lêer-hash gebruik, soos Mega Drive en Game Boy, sê die speletjieblad of jou kopie prestasies verdien, en daardie hash koppel die regte speletjie. Voer RA Refresh uit om dit in te vul
  - type: fix
    label: '''n Skraap vra nou ScreenScraper oor jou presiese lêer voordat dit op naam soek, sodat dit jou speletjie kry en nie een met ''n soortgelyke titel nie. Resultate wat jy self afmerk geld steeds eerste'
  - type: enhancement
    label: Die Image Resize-vorderingkassie noem nou die speletjie en stelsel waaraan elke prent behoort
  - type: feature
    label: Skraap bring nou titelskerms van ScreenScraper en TheGamesDB, meer amptelike name van IGDB en TheGamesDB (soos 'n speletjie se Japannese titel), en die ander konsoles waarop 'n speletjie uitgekom het van IGDB
  - type: feature
    label: '''n Speletjie sonder gebruikerstelling neem nou die gradering in jou ES-DE-versameling, as dit een het'
  - type: feature
    label: Die speletjieblad sê hoeveel spelers 'n HowLongToBeat-resultaat getyd het en skakel na sy blad. Resultate wat voorheen gestoor is, wys dit die volgende keer as jy hulle opsoek
  - type: feature
    label: Die RetroAchievements-blad wys hoeveel mense 'n speletjie speel en watter deel van hulle elke prestasie verdien het
  - type: fix
    label: Die ROM Tools-gidsblaaier maak by jou ROM-gids oop wanneer dit geen gids het om mee te begin nie, in plaas daarvan om te misluk. 'n Verwarde antwoord van IGDB kos nou net daardie een detail, nie alles wat IGDB vir die speletjie gestuur het nie
  - type: fix
    label: ScreenScraper se daaglikse limiet keer nou dat RetroDB tot later vra, en 'n grootmaat-skraap sê dit en gaan voort met sy ander bronne. Voorheen het 'n opgebruikte limiet soos "speletjie nie gevind" gelyk en oproepe het die hele nag voortgegaan
  - type: fix
    label: '''n Speletjie waarvoor geen bron kon antwoord terwyl ''n diens by sy limiet was, word nie meer as geskraap gemerk nie, sodat die volgende lopie dit weer probeer'
  - type: fix
    label: Wanneer 'n TheGamesDB-sleutel sy maand opgebruik het, skuif RetroDB na jou ander sleutel, en hou op vra sodra albei opgebruik is
  - type: fix
    label: RAWG se maandelikse limiet keer nou ook dat RetroDB vra, en IGDB word binne sy limiet van vier versoeke per sekonde gehou
  - type: fix
    label: HowLongToBeat se grootmaat-opsoek eindig nou met 'n boodskap wanneer die webwerf sê dit het te veel versoeke gehad, en elke versoek aan die webwerf word uitgestrek
  - type: fix
    label: Fix Box and Manual Regions gee nie meer op ná 25 speletjies agtereen wat ScreenScraper nie ken nie. Dit stop net wanneer ScreenScraper sê sy limiet is bereik
  - type: fix
    label: Op die speletjieblad sit elke ouderdomsgradering nou gesentreer bo sy AI-raaiskatting-etiket
  - type: fix
    label: Die TheGamesDB-toelae in Instellings gebruik nou die toets wat nie jou toelae opgebruik nie, en wys nie meer 'n versonne terugstel-datum as die diens nie een gee nie
  body: |
    <ul>
      <li><strong>MAME-speletjies kry hul regte name.</strong> Die nuwe MAME Names-hulpmiddel in ROM Tools haal name, jare en vervaardigers uit MAME se eie lys. Die lêers behou hul kort name, want MAME het dit nodig. Jy kan die MAME-lys volgens kategorie filter, en BIOS-stelle word versteek.</li>
      <li><strong>Steam-invoere bring baie meer.</strong> Elke speletjie vul sy beskrywing, krediete, Metacritic-telling, ouderdomsgraderings, speletjiemodusse en prente in vanaf sy winkelblad. 'n Sinkronisering behou jou speeltyd en wanneer jy laas gespeel het. 'n Speletjie wat reeds onder dieselfde naam in jou biblioteek is, skakel nou daaraan, sodat sy prestasies sinkroniseer.</li>
      <li><strong>Skraapwerk vind jou presiese speletjie.</strong> 'n Skraping vra ScreenScraper eers oor jou presiese lêer voordat dit op naam soek. Skrapings bring ook titelskerms, meer amptelike name, en die ander konsoles waarop 'n speletjie uitgekom het.</li>
      <li><strong>RetroAchievements ken jou kopie.</strong> Op stelsels wat 'n gewone lêer-hash gebruik, soos Mega Drive en Game Boy, sê die speletjiebladsy of jou kopie prestasies verdien. Voer RA Refresh uit om dit in te vul. Die RetroAchievements-bladsy wys ook hoeveel mense 'n speletjie speel en watter deel van hulle elke prestasie verdien het.</li>
      <li><strong>Aanlyn-limiete word gerespekteer.</strong> Wanneer ScreenScraper, TheGamesDB of RAWG sy limiet bereik, hou RetroDB op vra tot later en 'n grootmaat-skraping gaan voort met sy ander bronne. 'n Speletjie waarvoor geen bron op daardie stadium kon antwoord nie, word met die volgende uitvoering weer probeer.</li>
      <li><strong>'n Geweierde PlayStation-aanmelding sê so.</strong> Die kontroleskerm en Instellings vra jou nou om weer te skakel wanneer Sony 'n gestoorde aanmelding weier.</li>
      <li><strong>Official Names het verskuif.</strong> Sy aparte kaart is weg uit Bulk AI Fill, omdat die vul se Official name-skakelaar dieselfde werk doen.</li>
    </ul>
