  - type: fix
    label: Tanggal dari IGDB dan RAWG kini milik konsol game itu sendiri, dan tanggal IGDB juga sesuai wilayahnya, sehingga salinan AS tidak lagi menampilkan tanggal Jepang atau port menampilkan tahun versi aslinya
  - type: feature
