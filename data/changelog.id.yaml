- version: 4.0.0
  date: '2026-11-10'
  tags:
  - type: enhancement
    label: 'Pengaturan → Normalisasi Data kini punya tombol Waralaba, Penerbit, dan Pengembang. Masing-masing menampilkan nama yang ditulis dengan huruf besar berbeda, seperti "Doom" dan "DOOM", beserta jumlah game untuk tiap ejaan, dengan ejaan yang paling banyak dipakai sudah dipilih. Pilih satu lalu tekan Terapkan agar menjadi satu nama. Nama hasil scrape baru yang hanya berbeda huruf besarnya mengikuti ejaan di pustaka Anda, dan Isi dengan AI meminta huruf besar resmi'
  - type: fix
    label: 'Filter Pustaka kini mencocokkan nilai utuh. Memilih genre "Aksi" tidak lagi ikut menampilkan game "Action-Adventure", sehingga hasilnya sama dengan angka di sebelahnya. Daftar tag di halaman game dan Game Serupa mencocokkan dengan cara yang sama'
  - type: security
    label: 'Pengaturan → Profil Saya tidak lagi mengirim kunci RetroAchievements, token PSN, atau kunci Steam Anda yang tersimpan ke halaman. Setiap kotak hanya menampilkan empat karakter terakhirnya, seperti yang sudah dilakukan kunci di tab Scraping. Menyimpan tanpa mengetik ulang tetap memakai kunci yang tersimpan, dan tombol "Simpan & Uji Koneksi" PSN menguji token yang tersimpan'
  - type: fix
    label: 'Halaman Penampil Log tidak lagi terbuka dengan "Berkas log tidak valid". Halaman ini mencantumkan log pembantu yang tidak akan ditampilkannya, lalu membuka salah satunya lebih dulu; kini hanya log yang bisa dibuka yang dicantumkan'
  - type: fix
    label: 'Tab PSN di Impor Game kini mengarahkan Anda ke Pengaturan → Profil Saya untuk token NPSSO, tempat kotaknya berada, bukan ke Pengaturan → Kunci API, dan status koneksinya kini bisa diterjemahkan'
  - type: fix
    label: 'Saat masuk sebagai viewer, halaman tidak lagi meminta informasi khusus admin yang memang tidak bisa didapatnya dari server, sehingga log server tidak lagi penuh dengan permintaan yang ditolak'
  - type: security
    label: 'Nama yang berasal dari luar RetroDB (data hasil scraping, nama file dan folder, balasan dari layanan online) kini selalu tampil sebagai teks biasa: di halaman game, Pengaturan, Laporan, alat ROM, halaman trofi, dan lainnya. Halaman juga hanya menjalankan aksi tombolnya sendiri, sehingga nama yang direkayasa tidak bisa membuat halaman melakukan sesuatu, dan tautan "kembali ke" pada notifikasi progres tidak bisa lagi mengarah ke situs web lain'
  - type: enhancement
    label: 'Scrape massal dalam antrean kini punya tombol Atur Urutan. Tombol ini membuka Pengelola Antrean, tempat scrape yang menunggu bisa dijalankan lebih awal, lebih lambat, atau ditukar dengan yang sedang berjalan. Setiap notifikasi antrean juga mempertahankan nomor urutnya setelah ada perubahan'
  - type: fix
    label: 'Progres job tidak lagi macet atau berulang. Pemeriksaan atau konversi CHD yang crash kini berakhir dengan alasannya; Batal mengembalikan tombol-tombol halaman; pembatalan, jeda, atau penghapusan yang ditolak kini memberi tahu; "selesai" tidak muncul lagi satu jam kemudian; dan tombol Sync di halaman pencapaian kembali muncul saat sinkronisasinya selesai'
  - type: fix
    label: 'Menyimpan kecocokan HowLongToBeat di halaman game tidak lagi menghapus tautan HLTB dan jumlah pemainnya, dan penyimpanan yang gagal bisa dicoba lagi. Edit cepat tidak lagi menampilkan setiap kecocokan tersimpan sebagai "100% cocok". Tag filter Pustaka menampilkan nama sistem, bukan nomornya, dan pencarian saat mengetik berfungsi di halaman daftar dan Bandingkan'
  - type: fix
    label: 'Setiap akun bisa mengganti kata sandinya sendiri di Pengaturan → Profil Saya, dan admin bisa mengatur ulang kata sandi siapa pun. Folder emulator kini berfungsi di Windows. Dashboard tidak lagi memberi tahu editor dan penonton bahwa API mereka offline, dan "Game tanpa box art" membuka Pustaka yang hanya menampilkan game tersebut. Pengelola kata sandi kini bisa mengisi kotak masuk'
  - type: fix
    label: 'Alat ROM: Verifikasi CHD memasang setiap lencana Valid atau Tidak Valid pada file yang benar; Penampil Log kembali menampilkan nama modul dan memberi tahu saat daftar filenya gagal dimuat; Pilih semua di Impor Game hanya mengimpor game yang ditampilkan filter Anda; dan Atur Ulang di Pengaturan Alat ROM mengembalikan folder ROM milik komputer ini'
  - type: fix
    label: 'Waktu unlock Steam tampil sebagai tanggal; bilah A-Z berfungsi di Trofi Lokal; mode Pilih PSN tetap berfungsi pada game yang dimuat saat Anda menggulir; penonton tidak lagi melihat tombol Sync atau Ganti Nama yang tidak bisa mereka pakai; ganti nama massal melewati file yang sudah diganti namanya sejak pemindaian; dan Analitik bisa menyalin di jaringan HTTP biasa serta mengekspor angka sebagai angka'
  - type: fix
    label: 'Di jendela konfirmasi, Enter pada Batal atau × kini membatalkan, bukan mengonfirmasi. Jendela yang dibuka oleh OK tidak lagi menghilang, dan Tab tetap berfungsi setelah daftar pintasan atau jendela progres ditutup'
  - type: enhancement
    label: 'Banyak kontrol yang dulu hanya bisa dipakai dengan mouse kini bisa dipakai dengan keyboard (Tab, lalu Enter atau Spasi): profil masuk, hasil pencarian Bandingkan, tag beserta tombol Edit dan Hapus, kartu game pencapaian, sesi log, pilihan tema dan avatar, gambar Museum, tanda × yang menghapus genre atau filter, folder penyiapan, kotak centang sumber scraping, dan impor CLZ. Sakelar hidup/mati kini menampilkan cincin keyboard'
  - type: performance
    label: 'Penghapus latar belakang di Museum tidak lagi terus berada di memori. Fitur ini memotong foto kontroler dari latar belakangnya dengan model AI yang memakai lebih dari 2 GB setelah dipakai, dan hingga sekitar 9 GB saat memproses foto, sampai RetroDB dimulai ulang. Kini fitur ini berjalan di program pembantu yang menyala saat dibutuhkan dan menutup dua menit setelah foto terakhirnya, sehingga semua memori itu dikembalikan'
    en: 'The Museum''s background remover no longer stays in memory. It cut controller photos out of their background with an AI model that took over 2 GB once used, and up to about 9 GB during a photo, until RetroDB restarted. It now runs in a helper that starts when needed and closes two minutes after its last photo, giving all of that memory back'
  - type: feature
    label: 'Impor Xbox tidak lagi memerlukan akun Microsoft Azure. Kini setiap orang menempelkan kunci OpenXBL gratis miliknya sendiri (dari xbl.io) di Pengaturan → Profil Saya, dan impor berjalan dari komputer mana pun di jaringan Anda. Impor juga tidak menyertakan aplikasi dan game khusus ponsel, menempatkan game PC di Windows alih-alih Xbox One, membaca achievement Xbox 360 dengan benar, dan tidak menampilkan tanggal untuk achievement yang masih terkunci. Kunci gratis mengizinkan 150 permintaan per jam: sinkronisasi achievement besar yang mencapai batas itu akan berhenti, memberi tahu Anda, dan lain kali dimulai dari game yang belum sempat dijangkau'
    en: 'Xbox import no longer needs a Microsoft Azure account. Each person now pastes their own free OpenXBL key (from xbl.io) under Settings → My Profile, and it works from any computer on your network. The import also leaves out apps and phone-only games, files PC games under Windows instead of Xbox One, reads Xbox 360 achievements the right way, and shows no date for a locked achievement. The free key allows 150 requests an hour: a big achievement sync that reaches it stops, says so, and next time starts with the games it had not reached'
  - type: enhancement
    label: Sync atau Refresh RetroAchievements yang Anda minta saat yang lain masih berjalan sekarang menunggu di server dan dimulai sendiri saat yang itu selesai, meskipun Anda menutup halaman atau memintanya dari perangkat lain. Setiap halaman menampilkan daftar tunggu yang sama beserta urutan tiap tugas, dan ✕ menghapus tugas dari antrean. Setelah server dimulai ulang, tugas yang menunggu ditawarkan kembali di Dashboard
    en: A RetroAchievements Sync or Refresh you ask for while another one runs now waits on the server and starts by itself when that one finishes, even if you close the page or asked from another device. Every page shows the same waiting list with each job's place in line, and ✕ takes a job out. After a server restart, waiting jobs are offered back on the Dashboard
  - type: fix
    label: Tombol Refresh RA di halaman sebuah konsol kini berfungsi lagi. Sebelumnya tombol itu tidak menyebutkan konsol mana, sehingga server menjawab "Not found"
    en: The Refresh RA button on a console's page works again. It did not say which console, so the server answered "Not found"
  - type: fix
    label: Pemeriksaan penamaan ROM kini memperlakukan setiap sistem sesuai jenis yang ditampilkan di halaman Sistem. Macintosh, ZX Spectrum Next, Coleco Adam, dan Thomson diperiksa sebagai komputer, serta 3DS dan PS Vita sebagai konsol genggam, bukan sebagai konsol. Jenis yang Anda atur di halaman Sistem sekarang juga diikuti
    en: The ROM naming check now treats each system as the kind the Systems page shows. Macintosh, ZX Spectrum Next, Coleco Adam and Thomson are checked as computers, and 3DS and PS Vita as handhelds, instead of as consoles. A type you set on the Systems page is now followed too
  - type: performance
    label: RetroDB kini memakai memori jauh lebih sedikit saat menunggu. Peningkat kualitas gambar AI sekarang hanya dimuat ketika sedang bekerja, lewat sebuah proses pembantu yang menutup dua menit setelah gambar terakhirnya; server yang menganggur turun dari sekitar 1,4 GB menjadi di bawah 100 MB. Jika driver grafis mogok saat peningkatan kualitas berlangsung, hanya proses pembantu yang berhenti, bukan servernya
    en: RetroDB uses far less memory while it waits. The AI image upscaler now loads only while it is upscaling, in a helper that closes two minutes after its last picture; an idle server dropped from about 1.4 GB to under 100 MB. If the graphics driver crashes during an upscale, only the helper stops, never the server
  - type: performance
    label: Isi dengan AI memakai pencarian web Claude kini lebih murah. Claude membaca ulang hasil pencarian setelah setiap pencarian; RetroDB sekarang meminta Anthropic menyimpannya agar siap dipakai, sehingga membaca ulang hanya berharga sepersepuluh atau kurang
    en: AI Fill with Claude web search costs less. Claude reads the search results again after each search; RetroDB now asks Anthropic to keep them ready, and a re-read then costs a tenth of the price or less
  - type: fix
    label: 'Bahasa Zulu dan Xhosa kini lebih enak dibaca: 133 baris yang artinya salah sudah diperbaiki, misalnya "Edition" yang tampil sebagai "Chapter" dan "must be text" yang tampil sebagai "must be a letter". Setiap perbaikan disetujui oleh dua pemeriksaan AI yang terpisah'
    en: 'Zulu and Xhosa read better: 133 lines that said the wrong thing are corrected, such as "Edition" shown as "Chapter" and "must be text" shown as "must be a letter". Each correction was agreed by two separate AI checks'
  - type: fix
    label: Saat game tidak mau mulai, pesannya kini muncul dalam bahasa Anda dan tetap menyebut emulator, core, atau file yang bermasalah. Kegagalan di dalam komputer itu sendiri kini menampilkan "Tidak dapat memulai" beserta nama programnya, dengan detailnya ada di log server, bukan teks sistem mentah. Login RetroAchievements yang ditolak menampilkan alasan dari RetroAchievements sendiri di dalam kalimat yang sudah diterjemahkan
    en: When a game will not start, the message is now in your language and still names the emulator, core or file at fault. A failure inside the computer itself now says "Could not start" and the program's name, with the details in the server log, instead of raw system text. A refused RetroAchievements sign-in shows RetroAchievements' own reason inside a translated sentence
  - type: fix
    label: Membatalkan job scrape, sinkronisasi, atau gambar yang sudah selesai kini menghapus popup progres yang macet. Memulai job yang sudah berjalan menampilkan alasan sebenarnya, seperti "Scrape untuk SNES sudah berjalan", bukan "Kesalahan jaringan". Error gambar kontroler di Museum kini menjelaskan apa yang salah, dan membatalkan sinkronisasi RetroAchievements milik pengguna lain akan menyatakan bahwa itu milik mereka, bukan berpura-pura membatalkannya
    en: Cancelling a scrape, sync or image job that has already finished now clears its stuck progress popup. Starting a job that is already running shows the real reason, such as "A scrape for SNES is already running", instead of "Network error". Controller image errors in the Museum now say what went wrong, and cancelling another user's RetroAchievements sync says it is theirs instead of pretending to cancel it
  - type: security
    label: Penampil log kini juga menyembunyikan kata sandi dan kunci di file log lama. Log yang ditulis sebelum RetroDB bisa menyembunyikan kata sandi tertentu, seperti milik ScreenScraper, dulu tampil apa adanya saat dilihat atau diunduh
    en: The log viewer now hides passwords and keys in older log files too. Logs written before RetroDB learned to hide a particular password, such as ScreenScraper's, showed it in plain text when viewed or downloaded
  - type: security
    label: Mengatur ulang semua pengaturan ke default kini mempertahankan folder ROM Anda dan status bahwa penyiapan sudah selesai. Sebelumnya, reset membuka kembali halaman penyiapan awal, yang bisa dipakai tanpa masuk, sampai admin menjalankan penyiapan lagi
    en: Resetting all settings to their defaults now keeps your ROM folder and the fact that setup is done. Before, a reset reopened the first-time setup pages, which work without signing in, until an admin ran setup again
  - type: feature
    label: Game arcade bisa mendapat RetroAchievements lagi. RetroDB kini menautkan game arcade hanya jika RetroAchievements mengenal nama file persisnya, seperti sf2 untuk Street Fighter II, sehingga tidak lagi menebak dari judul dan salah menautkan game. Game arcade Anda akan tertaut saat data RetroAchievements-nya diperbarui atau saat di-scrape
    en: Arcade games can earn RetroAchievements again. RetroDB now links an arcade game only when RetroAchievements knows its exact file name, such as sf2 for Street Fighter II, so it no longer guesses from titles and links the wrong game. Your arcade games link the next time their RetroAchievements data is refreshed or they are scraped
  - type: fix
    label: Sinkronisasi trofi PlayStation kini memperbaiki tautan game yang dulu salah, seperti banyak game yang tertaut ke game tak terkait bernama "D". Tautan yang Anda atur sendiri tidak pernah diubah oleh sinkronisasi. Sinkronisasi berikutnya memeriksa ulang semua tautan lama, jadi beberapa kecocokan yang kurang pas bisa terlepas; tautkan lagi secara manual
    en: PlayStation trophy sync now corrects game links it made wrongly before, such as many games linked to an unrelated game called "D". A link you set yourself is never changed by a sync. The next sync checks all older links again, so a few near matches may come unlinked; link those again by hand
  - type: fix
    label: Memindahkan scrape massal yang menunggu ke depan scrape yang sedang berjalan tidak lagi menambahkan game terakhir scrape lama ke hitungan yang baru. Mengklik "Scrape semua" di wishlist saat scrape sudah berjalan kini memberi tahu hal itu, bukan mengklaim sudah dimulai
    en: Moving a waiting bulk scrape ahead of a running one no longer adds the old scrape's last game to the new one's counts. Clicking "Scrape all" on the wishlist while one is already running now says so, instead of claiming it started
  - type: accessibility
    label: 'Dengan pembaca layar, tombol "berjalan" kini mengucapkan "1 game berjalan" hanya saat jumlahnya berubah, bukan membacakan angka kosong tiap beberapa detik. Daftarnya terbuka sebagai jendela bernama dengan kursor di dalamnya, tombol Kill dan Disk berikutnya menyebut game yang dituju, dan setelah Kill kursor kembali ke tempat yang masuk akal. Setiap kartu game di pustaka kini bisa dibuka dengan keyboard dari judulnya, dan tombol filternya menyebut apa yang difilter, seperti "Filter berdasarkan Pengembang: Konami"'
    en: 'With a screen reader, the "running" button now says "1 game running" only when the count changes, instead of reading a bare number every few seconds. Its list opens as a named window with the cursor inside, its Kill and Next disk buttons say which game they act on, and after Kill the cursor returns to a sensible place. Each game card in the library now opens with the keyboard from its title, and its filter buttons say what they filter, such as "Filter by Developer: Konami"'
  - type: feature
    label: Setiap anggota kini bisa menambahkan kunci Steam dan Steam ID sendiri di Pengaturan → Profil Saya, serta mengimpor pustaka Steam dan achievement miliknya sendiri. Sebelumnya hanya admin yang bisa
    en: Every member can now add their own Steam key and Steam ID under Settings → My Profile, and import their own Steam library and achievements. Until now only an admin could
  - type: fix
    label: Menyimpan detail game tidak lagi mengubah jumlah pemain yang kosong menjadi 1, dan tidak lagi menandai rating usia yang dihitung RetroDB sebagai ketikan Anda. Isi dengan AI mempertahankan game yang Anda tandai Eksklusif, dan mempertahankan perubahan yang Anda buat pada game saat menunggu jawaban AI. Riwayat scrape kini hanya mencantumkan detail yang benar-benar disimpannya
    en: Saving a game's details no longer sets an empty player count to 1, and no longer marks the age ratings RetroDB worked out for you as typed by you. AI Fill keeps a game you marked Exclusive, and keeps any change you make to a game while it is waiting for the AI's answer. A scrape's history now lists only the details it actually saved
  - type: fix
    label: Tinjauan Screenshot tidak lagi berhenti di tengah jalan saat satu screenshot tersimpan terlalu besar untuk dibuka; gambar itu dihitung tidak terbaca lalu proses berlanjut. Daftar isi halaman bantuan kini menaut ke Emulator dan Bermain, dan catatan pengembang tentang masuk, job latar belakang, scrape, gambar, pembaruan, dan balasan error kini menjelaskan apa yang sebenarnya dilakukan program
    en: Screenshot Review no longer stops halfway when one stored screenshot is far too large to open; it counts that picture as unreadable and carries on. The help page's contents list now links to Emulators and Playing, and the developer notes on sign-in, background jobs, scraping, pictures, updates and error replies now say what the program really does
  - type: fix
    label: Editor yang memulai pemindaian Alat ROM kini bisa menjeda, melanjutkan, atau membatalkannya; pemindaian orang lain tetap hanya bisa dihentikan admin. Tag dan daftar menolak nama kosong atau warna yang salah dengan pesan jelas, bukan halaman error, dan mengganti nama game wishlist menjadi game lain yang sudah Anda inginkan ditolak, seperti saat menambahkannya. Hapus Data RA kini juga melupakan apakah salinan Anda mendapat achievement. Trofi yang tidak lagi ditawarkan RetroDB berhenti dihitung untuk peringkat kolektor Anda. Path ROM Windows kini cocok dengan game RetroAchievements berdasarkan nama file
    en: An editor who starts a ROM Tools scan can now pause, resume or cancel it; other people's scans stay an admin's to stop. Tags and lists refuse a missing name or a bad colour with a clear message instead of an error page, and renaming a wishlist game onto another one you already wish for is refused, as adding it is. Clear RA Data now also forgets whether your copy earns achievements. A trophy RetroDB no longer offers stops counting toward your collector rank. Windows ROM paths now match RetroAchievements games by file name
  - type: fix
    label: Perbaikan pemeliharaan. Arsip multi-disc yang gagal diekstrak tidak lagi meninggalkan folder setengah jadi yang menghalangi setiap percobaan ulang. Hitung Penyimpanan kini menghitung setiap file di dalam folder game PS3. Hapus Data Scrape menghapus gambar hanya jika Anda memintanya. Pemindaian pustaka yang menemukan game yang baru saja ditambahkan pemindaian lain melanjutkan sisa game konsol itu
    en: Maintenance fixes. A multi-disc archive that fails to unpack no longer leaves a half-made folder behind that blocks every retry. Calculate Storage now counts every file inside a PS3 game folder. Clear Scraped Data deletes pictures only when you ask it to. A library scan that meets a game another scan has just added carries on with the rest of that console's games
  - type: fix
    label: Memulihkan backup kini lebih aman. Backup ditulis ke database pustaka sesuai cara yang diharapkan database itu sendiri, sehingga bagian RetroDB yang sedang membukanya melihat data hasil pemulihan, bukan berisiko rusak. Menghapus game kini juga menghapus gambar boks, gambar yang menunggu, dan entri pengaturan emulatornya, sehingga game baru tidak akan mewarisinya. Dua pengaturan yang disimpan bersamaan tidak lagi menghilangkan salah satunya
    en: Restoring a backup is safer. It is now written into the library database the way the database itself expects, so a part of RetroDB that has it open sees the restored data instead of risking damage. Deleting a game now also deletes its box pictures and its waiting picture and emulator-setting entries, so a new game can never inherit them. Two settings saved at the same moment no longer lose one of them
  - type: fix
    label: Perbaikan gambar. GIF tidak lagi diproses upscaler lalu dibuang. Model upscaler diperiksa dengan sidik jari yang dipublikasikan, dan unduhan yang rusak diambil ulang, bukan mematikan upscaling selamanya. Logo dan gambar dengan bagian transparan tetap transparan saat diperbesar. Konversi ke WebP kini juga mencakup sampul belakang dan logo, dan tidak lagi menolak pustaka besar karena ruang yang sebenarnya tidak diperlukan. Dua sisi file boks bisa berbagi satu gambar, dan menghapus boks dengan data rusak juga menghapus gambarnya
    en: Picture fixes. GIFs are no longer run through the upscaler only to be thrown away. The upscaler model is checked against its published fingerprint, and a bad download is fetched again instead of turning upscaling off for good. Logos and pictures with see-through parts keep their transparency when enlarged. Convert to WebP now takes back covers and logos too, and no longer refuses a large library for want of room it does not need. Two faces of a box file can share one picture, and removing a box with a damaged record removes its pictures
  - type: fix
    label: Impor dari CLZ, Steam, Xbox, dan PlayStation tidak lagi menganggap setiap judul yang hanya ditulis dalam bahasa Jepang atau aksara non-Latin lainnya sebagai game yang sama, dan tidak lagi menambahkan game tanpa id. Pratinjau CLZ tidak lagi menambahkan konsol sebelum Anda mengonfirmasi impor, dan pengamat yang melihat pustaka Steam, Xbox, atau PlayStation juga tidak lagi menambahkannya. Game Steam yang dihapus dari toko ditanyakan sekali saja, bukan di setiap sinkronisasi
    en: Imports from CLZ, Steam, Xbox and PlayStation no longer treat every title written only in Japanese or another non-Latin script as the same game, and no longer add a game with no id. The CLZ preview no longer adds consoles before you confirm the import, and a viewer looking at a Steam, Xbox or PlayStation library no longer adds them either. A Steam game removed from the store is asked about once, not on every sync
  - type: fix
    label: Analitik kini mengelompokkan lebih banyak konsol di bawah pembuatnya, bukan "Lainnya", dan daftar Baru Di-scrape di dasbor menampilkan game yang Anda scrape ulang, bukan hanya game yang baru ditambahkan
    en: Analytics now groups many more consoles under their maker instead of "Other", and the dashboard's Recently Scraped list shows a game you scraped again, not only newly added games
  - type: fix
    label: Gambar kontroler yang Anda tambahkan di Museum tetap tersimpan saat versi mandiri diperbarui. Saat layanan online berhenti sementara karena batasnya, waktu ia akan ditanya lagi ditampilkan dalam zona waktu Anda sendiri
    en: Controller pictures you add in the Museum are kept when the standalone version updates. When an online service pauses at its limit, the time it will be asked again is shown in your own time zone
  - type: fix
    label: Disc bonus tidak lagi bisa ditautkan ke dirinya sendiri atau ke disc bonus lain, dan Tautkan Otomatis tidak lagi menautkan disc ke disc yang ditandainya sebagai disc bonus dalam proses yang sama
    en: A bonus disc can no longer be linked to itself or to another bonus disc, and Auto-link no longer links a disc to one it marks as a bonus disc in the same run
  - type: fix
    label: Halaman Pustaka dan konsol tidak lagi menghitung file BIOS arcade sebagai game, baik di total maupun di bilah huruf. Game serupa, dan daftar yang muncul saat mengklik genre atau penerbit di halaman game, tidak lagi menampilkan versi regional, disc bonus, atau file BIOS dari game itu sendiri
    en: The Library and console pages no longer count arcade BIOS files as games, in their totals or the letter bar. Similar games, and the list you get by clicking a genre or publisher on a game's page, no longer show the game's own regional versions, bonus discs or BIOS files
  - type: fix
    label: Pilih semua kini memberi tahu saat daftar yang sangat besar terpotong, bukan diam-diam memilih sebagian saja
    en: Select all now says so when a very large list is cut short, instead of quietly selecting only part of it
  - type: fix
    label: Kartu pustaka kini diperbarui saat progres achievement atau trofi Anda berubah, dan saat sebuah game menjadi bisa dimainkan atau tidak lagi bisa dimainkan
    en: Library cards now update when your achievement or trophy progress changes, and when a game becomes playable or stops being playable
  - type: fix
    label: Edit massal tidak lagi mengubah game yang salah saat menerima pilihan yang buruk, dan edit massal yang gagal tidak lagi menandai game sebagai diedit oleh Anda
    en: Bulk edit can no longer change the wrong games when it is sent a bad selection, and a bulk edit that fails no longer marks the games as edited by you
  - type: fix
    label: Kecocokan HowLongToBeat yang hanya cocok 1% tidak lagi ditampilkan sebagai kecocokan 100%, dan halaman yang gagal dimuat menampilkan halaman error, bukan teks error mentah
    en: A HowLongToBeat match that is only a 1% fit is no longer shown as a 100% match, and a page that fails to load shows the error page instead of the raw error text
  - type: security
    label: Mengganti kata sandi, atau admin yang meresetnya, kini mengeluarkan akun itu dari semua perangkat lain. Karena itu, semua orang harus masuk sekali lagi setelah pembaruan ini. Halaman penyiapan awal juga mendapat perlindungan yang sama terhadap situs web lain seperti halaman lainnya
    en: Changing your password, or an admin resetting it, now signs that account out on every other device. Because of this, everyone signs in once more after this update. The first-run setup page also gets the same protection against other websites as every other page
  - type: fix
    label: Gambar yang ditolak sebagai avatar Anda tidak lagi menghapus avatar yang sudah Anda punya
    en: A picture that is refused as your avatar no longer deletes the avatar you had
  - type: fix
    label: Scrape kini lebih ramah terhadap layanan online. Layanan yang terus gagal dilewati sementara saat mengisi bagian kosong, seperti yang sudah berlaku di pencarian, dan pencarian game ScreenScraper kini juga mematuhi batas hariannya
    en: Scrapes are gentler on the online services. A service that keeps failing is skipped for a while when filling gaps, as it already was in searches, and ScreenScraper game lookups now respect its daily limits too
  - type: fix
    label: Scrape tidak lagi gagal pada game dengan tahun rilis tidak diketahui, seperti "TBA", dan game yang dirilis untuk wilayah di luar daftar Anda, seperti "Brazil, Korea", mempertahankan wilayahnya, bukan berubah ke default Anda
    en: A scrape no longer fails on a game whose release year is unknown, such as "TBA", and a game listed for regions outside your list, such as "Brazil, Korea", keeps its region instead of becoming your default
  - type: fix
    label: Folder ES-DE yang ditulis dengan ~/ kini berfungsi, dan file ES-DE yang sangat besar tidak lagi disalin. Saran versi regional tidak pernah menyatukan kembali dua game yang Anda nyatakan bukan versi satu sama lain
    en: ES-DE folders written as ~/ now work, and a very large ES-DE file is no longer copied. Suggested regional versions never put back together two games you said are not versions of each other
  - type: security
    label: RetroDB menolak beberapa alamat jaringan privat lagi saat mengambil gambar dari web, dan mengikuti pengalihan alamat web dengan benar
    en: RetroDB refuses a few more private network addresses when fetching pictures from the web, and follows a web address's redirect correctly
  - type: fix
    label: Layar terakhir yang masih berbahasa Inggris kini juga mengikuti bahasa Anda, termasuk wizard penyiapan, Tag, Daftar, Bandingkan Game, pengaturan Alat ROM, antrean scrape massal, daftar job terputus di dasbor, label kartu pustaka, dan banyak pesan error
    en: The last screens still in English now follow your language too, including the setup wizard, Tags, Lists, Compare Games, ROM Tools settings, the bulk scrape queue, the dashboard's interrupted-jobs list, the library card labels and many error messages
  - type: security
    label: Nama sistem yang berisi kode web tidak lagi bisa menjalankannya di jendela antrean scrape massal
    en: A system name holding web code can no longer run it in the bulk scrape queue window
  - type: accessibility
    label: Di mana pun Anda berada di halaman, posisi keyboard kini ditandai dengan cincin tebal berwarna tema Anda, pada setiap tombol, kotak, dan tautan. Sebelumnya banyak kontrol hanya menampilkan garis samar, sama seperti saat mouse melewatinya
    en: Wherever you are on a page, the keyboard's place is now marked with a bold ring in your theme's colour, on every button, box and link. Before, many controls showed only a faint line, the same as when the mouse passed over them
  - type: accessibility
    label: Tautan Genre, Seri, Pengembang, dan Penerbit di kartu pustaka kini berfungsi dari keyboard. Tombol "berjalan" untuk game yang sedang dimainkan juga bisa dibuka dari keyboard, dan Esc atau klik di tempat lain menutup daftarnya
    en: The Genre, Series, Developer and Publisher links on library cards now work from the keyboard. The "running" button for games in play opens from the keyboard too, and Esc or a click elsewhere closes its list
  - type: accessibility
    label: Pembaca layar kini menyebut nama setiap warna tag dan mengatakan mana yang dipilih, serta membacakan gambar trofi sebagai Platinum, Emas, Perak, dan Perunggu, bukan huruf tunggal. Saat game dimulai, Tab tidak lagi pindah ke balik layar pemuatan
    en: Screen readers now name each tag colour and say which one is chosen, and read trophy pictures as Platinum, Gold, Silver and Bronze instead of single letters. While a game starts, Tab no longer moves behind the starting screen
  - type: fix
    label: Jika pembaruan berhenti sebelum mulai menukar file, RetroDB kini menjalankan lagi versi yang Anda punya, bukan tetap tertutup
    en: If an update stops before it starts swapping files, RetroDB now starts the version you had again, instead of staying closed
  - type: fix
    label: Menekan Mainkan dua kali sekaligus tidak lagi bisa memulai dua game di pemutar bawaan. Menunggu unduhan core kini menyerah setelah beberapa lama, atau saat RetroDB tidak menjawab, bukan menunggu selamanya, dan pertanyaan "sudah berjalan" memakai dialog RetroDB sendiri
    en: Pressing Play twice at once can no longer start two games on the built-in player. Waiting for a core download now gives up after a while, or when RetroDB stops answering, instead of waiting forever, and the "already running" question uses RetroDB's own dialog
  - type: fix
    label: Cheat yang Anda aktifkan atau matikan saat bermain disimpan untuk game yang tepat, tidak pernah diambil dari game lain yang file-nya bernama sama. Masalah pada cheat tidak pernah menghentikan game dimulai
    en: Cheats you switch on or off during play are kept for the right game, never taken from another game whose file has the same name. A cheat problem never stops a game starting
  - type: fix
    label: RetroDB menulis file pengaturan emulator dengan lebih aman. File pengaturan yang berupa tautan tetap berupa tautan, mempertahankan izinnya, dan mempertahankan huruf yang tidak bisa dibacanya, dan penyimpanan yang gagal tidak meninggalkan file sisa
    en: RetroDB writes an emulator's settings file more safely. A settings file that is a link stays a link, keeps its permissions, and keeps letters it cannot read, and a failed save leaves no stray file behind
  - type: fix
    label: Scrape massal yang Anda geser turun dalam antrean, tukar dengan yang lain, atau lanjutkan saat yang lain berjalan tidak lagi hilang saat RetroDB dimulai ulang; dasbor menawarkannya dari titik berhentinya. Scrape yang ditukar keluar tidak lagi terus berjalan di samping yang baru, dan dua klik cepat pada Lanjutkan hanya memulai job sekali
    en: A bulk scrape you move down the queue, swap with another or resume while one runs is no longer lost when RetroDB restarts; the dashboard offers it, from where it stopped. A swapped-out scrape no longer keeps running beside the new one, and two quick clicks on Resume start a job once
  - type: fix
    label: Error pada satu game, seperti jaringan terputus, tidak lagi mengakhiri seluruh proses Isi dengan AI atau Perbaiki Boks dan Wilayah Manual; game itu dihitung gagal dan sisanya dilanjutkan. Menghentikan RetroDB kini juga menghentikan unduhan core dengan rapi
    en: One game's error, such as the network dropping, no longer ends a whole AI Fill run or a Fix Box and Manual Regions run; that game counts as failed and the rest go on. Stopping RetroDB now also stops core downloads cleanly
  - type: fix
    label: Item Wishlist tidak lagi terjebak di status "scraping" selamanya setelah error atau restart, dan dua proses Scrape All untuk Wishlist yang sama tidak lagi berjalan bersamaan
    en: Wishlist items no longer stay on "scraping" forever after an error or a restart, and two Scrape All runs for the same wishlist no longer run at once
  - type: fix
    label: Skrip atau salinan kedua RetroDB yang dijalankan tidak lagi menandai tugas server yang sedang berjalan sebagai terhenti, dan dua salinan yang dijalankan bersamaan tidak lagi bisa menurunkan versi database
    en: A script or a second copy of RetroDB starting up no longer marks the running server's jobs as interrupted, and two copies starting at once can no longer set the database back a version
  - type: fix
    label: Memulai sinkronisasi PlayStation tidak lagi membuat bilah progres semua orang menunggu saat masuk ke Sony. Keep-alive PlayStation harian kini memperbarui login hanya mendekati akhir masa 10 harinya, bukan setiap hari
    en: Starting a PlayStation sync no longer makes everyone's progress bars wait while it signs in to Sony. The daily PlayStation keep-alive now renews a sign-in only near the end of its 10 days, instead of every day
  - type: fix
    label: Scrape tidak lagi menimpa perubahan yang Anda buat saat berjalan, dan tidak lagi mengosongkan genre, mode, atau tampilan yang tidak dikenalnya. Scrape juga tidak lagi mengubah jumlah pemain yang tersimpan agar sesuai dengan mode game
    en: A scrape no longer writes over a change you make while it runs, and no longer empties a genre, mode or view it has no name for. It no longer changes a stored player count to match the game's modes
  - type: fix
    label: Isi dengan AI tidak lagi mengubah isian Anda sendiri, seperti penerbit atau genre yang Anda koreksi manual; hanya nilai hasil scrape yang dikoreksi. Isi dengan AI juga tidak lagi melaporkan nilai berubah padahal hanya ditulis berbeda, seperti 4 pemain menjadi "1-4" atau genre yang sama dengan urutan lain
    en: AI Fill no longer changes what you typed yourself, such as a publisher or genre you corrected by hand; it corrects only scraped values. It no longer reports a value as changed when it only wrote it differently, such as 4 players as "1-4" or the same genres in another order
  - type: fix
    label: Kontroler yang Anda ketik untuk sebuah game tetap dipertahankan; kontroler bawaan konsol kini hanya menggantikan nilai hasil scrape dan AI. Rating usia yang dikonversi dari tebakan AI papan rating lain kini juga ditandai sebagai tebakan
    en: A controller you type for a game is kept; the console's default controller now replaces only scraped and AI values. An age rating converted from another board's AI guess is now marked as a guess too
  - type: fix
    label: Menyimpan jendela Edit game tidak lagi mengosongkan kolom yang tidak ditampilkan jendela itu. Reset di halaman game kini menghapus semua yang disebutkan, termasuk tampilan, edisi, dan nama lain, menghapus gambar dan video game kecuali dipakai game lain, serta langsung memperbarui filter Pustaka
    en: Saving a game's edit window no longer empties fields the window does not show. Reset on a game's page now clears everything it says it does, including the view, edition and other names, deletes the game's pictures and videos unless another game uses them, and updates the library filters straight away
  - type: fix
    label: Clear Scraped Data kini juga menghapus tampilan, 2D atau 3D, dan struktur game. Impor CLZ untuk game yang hanya punya tahun kini menyimpan tahunnya saja, bukan 1 Januari
    en: Clear Scraped Data now also clears the view, 2D or 3D, and game structure. A CLZ import of a game with only a year keeps just the year, not 1 January
  - type: security
    label: Sinkronisasi Steam tidak lagi memakai kunci Steam dari Pengaturan untuk setiap anggota rumah tangga. Anggota tanpa kunci Steam sendiri sebelumnya mendapat pustaka Steam dan achievement milik admin di akunnya. Kunci di Pengaturan kini hanya untuk admin
    en: Steam sync no longer borrows the Steam key from Settings for every household member. A member with no Steam key of their own was getting the admin's Steam library and achievements under their account. The key in Settings now serves admins only
  - type: fix
    label: Pencarian How Long to Beat untuk banyak game kini menyimpan waktu yang sudah pasti. Sebelumnya, setiap kecocokan pasti gagal dan tidak ada yang tersimpan. Refresh RetroAchievements kini juga memeriksa file setiap game terhadap daftar RetroAchievements, seperti Scrape, sehingga game terhubung ke versi persis yang Anda miliki
    en: How Long to Beat's lookup for many games now saves the times it is sure of. Before, every sure match failed and nothing was saved. RetroAchievements Refresh now also checks each game's file against RetroAchievements' list, as a scrape does, so a game is linked to the exact version you have
  - type: fix
    label: Pesan bahwa tugas latar belakang telah selesai kini muncul lagi, dan kotak progres tugas menyadari saat server melanjutkan tugas setelah restart. Sebelumnya, keduanya tidak pernah muncul
    en: The message that a background job has finished shows again, and a job's progress box notices when the server picks the job up after a restart. Before, neither ever appeared
  - type: fix
    label: 'Trofi PlayStation: game yang Anda tautkan manual tetap tertaut setelah sinkronisasi penuh, dan sinkronisasi tidak lagi menautkan game ke sekuelnya, seperti "Doom" ke "Doom Eternal". Impor game PlayStation kini menautkan game yang sudah ada di Pustaka Anda, seperti impor Steam dan Xbox, sehingga trofinya tampil di game itu'
    en: 'PlayStation trophies: a game you linked by hand stays linked after a full sync, and a sync no longer links a game to its sequel, such as "Doom" to "Doom Eternal". Importing PlayStation games now links a game already in your library, as Steam and Xbox imports do, so its trophies show on it'
  - type: fix
    label: Xbox tidak lagi menampilkan gamertag Anda sebagai Unknown setelah login-nya memperbarui diri, dan koneksi lambat atau gagal tidak lagi mengeluarkan Anda dari Xbox. Hanya penolakan login oleh Microsoft yang melakukannya
    en: Xbox no longer shows your gamertag as Unknown after its sign-in renews itself, and a slow or failed connection no longer signs you out of Xbox. Only Microsoft refusing the sign-in does that
  - type: fix
    label: Dua orang kini bisa memiliki tag dengan nama sama; sebelumnya yang kedua gagal dengan error. Setiap pengguna yang masuk kini bisa memindai ulang trofi RPCS3 miliknya; sebelumnya hanya admin, dan yang lain melihat trofi lama sampai RetroDB di-restart
    en: Two people can now each have a tag of the same name; before, the second one failed with an error. Any signed-in user can now rescan their own RPCS3 trophies; before, only an admin could, and everyone else saw old trophies until RetroDB restarted
  - type: security
    label: Login Anda tetap privat. Backup database tidak lagi bisa dibaca akun lain di komputer, dan backup yang gagal tidak lagi menghapus backup sebelumnya. Menghapus atau menonaktifkan pengguna juga mengeluarkannya dari RetroAchievements di DuckStation dan PCSX2. Login RetroAchievements yang disimpan dari menu pemain sendiri tidak lagi terbawa ke orang berikutnya yang bermain. Log dan error tugas yang tersimpan menyembunyikan token RetroAchievements, error PlayStation anggota lain hanya ditampilkan kepadanya, dan file login PlayStation dan Xbox teks biasa yang lama dihapus
    en: Your sign-ins stay private. Database backups can no longer be read by other accounts on the computer, and a failed backup no longer deletes the one before it. Deleting or switching off a user also signs them out of RetroAchievements in DuckStation and PCSX2. A RetroAchievements sign-in saved from the player's own menu no longer carries over to the next person who plays. Logs and saved job errors hide RetroAchievements tokens, another member's PlayStation error is shown only to them, and old plain-text PlayStation and Xbox sign-in files are removed
  - type: fix
    label: Pemeriksaan internal RetroDB tidak lagi bisa menyentuh Pustaka Anda saat berjalan. Pemeriksaan selalu memakai salinan sementara database, gambar, dan pengaturan, dan menolak berjalan jika salah satunya menunjuk ke file asli Anda
    en: RetroDB's own checks can no longer touch your library while they run. They always use a throwaway copy of the database, pictures and settings, and refuse to start if any of them points at your real files
  - type: fix
    label: Clean orphaned files tidak lagi menghapus gambar Wishlist Anda. Membuka game tidak lagi membuatnya melupakan screenshot yang tidak ditemukan. Sebelumnya, saat drive gambar dicabut, setiap game yang dibuka kehilangan seluruh daftar screenshot-nya; kini daftar dipertahankan, dan gambar yang hilang hanya disembunyikan
    en: Clean orphaned files no longer deletes your wishlist's pictures. Opening a game no longer makes it forget screenshots it cannot find. Before, with the picture drive unplugged, every game you opened lost its whole screenshot list; now the list is kept, and a missing picture is only hidden
  - type: fix
    label: Unduhan video atau manual yang gagal di tengah jalan tidak lagi merusak salinan yang sudah dimiliki game, dan unduhan gagal tidak lagi meninggalkan file setengah tersembunyi di folder media. Upscaler latar belakang tidak lagi menimpa gambar baru dengan gambar lama. Convert to WebP menjaga semua game yang berbagi gambar tetap menunjuk ke gambar itu, dan tidak pernah menyentuh file di luar folder gambar
    en: A video or manual download that fails part-way no longer damages the copy the game already had, and a failed download no longer leaves a hidden half-file in the media folder. The background upscaler no longer saves an old picture over a newer one downloaded meanwhile. Convert to WebP keeps every game that shares a picture pointing at it, and never touches a file outside the picture folders
  - type: fix
    label: Menghapus game atau item Wishlist kini juga menghapus gambar, video, dan manualnya, tetapi mempertahankan yang masih dipakai game atau item Wishlist lain. Gambar tersimpan kini bisa dibaca lagi oleh akun lain di komputer, dan Resize Images menghitung gambar yang gagal disimpan sebagai gagal, bukan selesai
    en: Deleting a game or a wishlist item now deletes its pictures, videos and manuals too, but keeps any another game or wishlist item still uses. Saved pictures can be read by other accounts on the computer again, and Resize Images counts a picture it could not save as failed, not as done
  - type: fix
    label: Duplicate Finder tidak lagi menawarkan file yang masih berfungsi untuk dihapus. Saat mencari berdasarkan nama, file .cue dan .bin sebuah game tidak lagi dianggap salinan satu sama lain. File track disc, yang bisa dipakai bersama oleh dua versi game, tidak pernah ditawarkan. Disc yang tercantum di playlist tidak akan dihapus. Game yang filenya Anda hapus kini berpindah ke salinan yang Anda simpan, sehingga tetap ada di Pustaka
    en: Duplicate Finder no longer offers a working file for deletion. Looking by name, it no longer calls a game's .cue and .bin copies of each other. It never offers a disc's track file, which two versions of a game can share. It will not delete a disc that a playlist lists. A game whose file you delete now moves to the copy you keep, so it stays in the library
  - type: fix
    label: Organize Multi-Disc tidak lagi menimpa playlist yang ada atau file yang sudah ada di folder game; prosesnya berhenti dan memberi tahu file mana. Playlist yang dibuat mencantumkan .cue setiap disc, bukan file track-nya. Game yang filenya dipindahkan kini ikut ke folder baru, sehingga Clean missing ROMs tidak lagi menghapusnya
    en: Organize Multi-Disc no longer writes over an existing playlist or a file already in the game's folder; it stops and says which. The playlist it makes lists each disc's .cue, not its track files. Games whose files it moves now follow them into the folder, so Clean missing ROMs no longer removes them
  - type: fix
    label: Konversi ke CHD dengan "delete originals" kini juga menghapus file track disc, tetapi mempertahankan track yang masih dipakai .cue lain. Game dan playlist yang mencantumkan disc lama kini menunjuk ke .chd baru. Mengganti nama file game kini memperbarui playlist yang mencantumkannya, dan file track yang dibutuhkan .cue tidak bisa diganti namanya. Menghapus file dari zip hanya menghapus file yang Anda pilih, bahkan saat nama berisi [ atau ]. Screenshot Dedup hanya menghapus salinan yang ditemukan pemindaiannya, dan selalu menyisakan satu
    en: Converting to CHD with "delete originals" now deletes the disc's track files too, but keeps a track another .cue still uses. The game and any playlist that listed the old disc now point at the new .chd. Renaming a game's file now updates the playlist that lists it, and a track file a .cue needs cannot be renamed. Removing files from a zip removes only the files you picked, even when a name holds [ or ]. Screenshot Dedup deletes only the copies its scan found, and always keeps one
  - type: fix
    label: How Long to Beat di halaman game mencari apa yang Anda ketik. Sebelumnya, judul yang tidak ditemukan membuatnya mencari nama lain game itu, dan bisa menawarkan game berbeda, seperti remake buatan penggemar. Nama lain tetap dicoba jika kotak berisi nama game itu sendiri
    en: How Long to Beat on a game's page searches for what you type. Before, a title it could not find made it search the game's other names instead, and it could offer a different game, such as a fan remake. It still tries the other names when the box holds the game's own name
  - type: fix
    label: Langkah How Long to Beat di manual bantuan kini sesuai dengan layar. Sebelumnya tertulis untuk memilih kecocokan dari daftar; halaman hanya menampilkan satu kecocokan dengan Simpan dan Batal. Bantuan PlayStation tidak lagi menyebut login berlaku sekitar dua bulan, karena RetroDB masuk lagi sendiri. Semua 20 manual terjemahan memuat kedua perubahan ini
    en: The help manual's How Long to Beat steps match the screen. They said to pick a match from a list; the page shows one match with Save and Cancel. The PlayStation help no longer says the sign-in lasts about two months, since RetroDB signs in again by itself. All 20 translated manuals carry both changes
  - type: fix
    label: Setiap bilah huruf kini diawali tombol All. Di halaman Pustaka, konsol, dan Trofi PSN, memilih huruf hanya menampilkan game berawalan huruf itu, dan sebelumnya tidak ada tombol untuk menampilkan sisanya lagi. Di halaman achievement lain, All kembali ke game pertama
    en: Every letter bar now starts with an All button. On the Library, console and PSN Trophies pages, picking a letter shows only that letter's games, and before there was no button to bring the rest back. On the other achievement pages, All goes back to the first game
  - type: fix
    label: Token login PlayStation baru yang Anda tempel di Pengaturan kini langsung dipakai. Sebelumnya, RetroDB tetap memakai login lama sampai habis, dan Save & Test Connection melaporkan login lama itu berfungsi. Token yang ditolak Sony tidak lagi menggantikan token yang masih berfungsi
    en: A new PlayStation sign-in token you paste in Settings is now used straight away. Before, RetroDB kept using the old sign-in until it ran out, and Save & Test Connection reported that old sign-in as working. A token Sony refuses no longer replaces one that works
  - type: enhancement
    label: 'Login PlayStation di Pengaturan kini lebih mudah dipertahankan. Spanduk tidak lagi menghitung mundur hari yang tidak perlu Anda tindaklanjuti, karena RetroDB masuk lagi sendiri; spanduk menjadi merah hanya saat Sony menolak token tersimpan Anda. Tombol Paste here tidak lagi membuat browser meminta izin membaca clipboard: tombol hanya menaruh kursor di kotak untuk Ctrl+V. Langkahnya kini meminta Anda keluar dari PlayStation dulu saat mengganti token yang masih berfungsi, dan pesannya bisa diterjemahkan'
    en: 'The PlayStation sign-in in Settings is easier to keep going. The banner no longer counts down days you never had to act on, because RetroDB signs in again by itself; it turns red only when Sony refuses your saved token. The Paste here button no longer makes the browser ask to read your clipboard: it puts the cursor in the box for Ctrl+V. The steps now say to sign out of PlayStation first when you replace a token that still works, and their messages can be translated'
  - type: enhancement
    label: Pesan pop-up dan kotak pertanyaan, seperti "Settings saved" atau "Delete this list?", kini bisa diterjemahkan di setiap halaman. Sebelumnya, sebagian besar tetap berbahasa Inggris apa pun bahasa yang Anda pilih
    en: Pop-up messages and question boxes, such as "Settings saved" or "Delete this list?", can now be translated on every page. Before, most of them stayed in English whatever language you chose
  - type: enhancement
    label: Pesan yang menjelaskan mengapa login PlayStation gagal, seperti "Your NPSSO may have expired", kini bisa diterjemahkan
    en: The messages that say why a PlayStation sign-in failed, such as "Your NPSSO may have expired", can now be translated
  - type: fix
    label: Manual bantuan di setiap bahasa kini sesuai dengan versi Inggris. Manual memuat Search Anywhere, Keeping a Title, MAME Names, dan bagian belakang kotak, dan paragraf lama yang tertinggal sudah diperbarui
    en: The help manual in every language now matches the English one. It gains Search Anywhere, Keeping a Title, MAME Names and the back of the box, and older paragraphs that had fallen behind are up to date
  - type: fix
    label: Dalam bahasa Jerman, Afrikaans, dan Spanyol, tombol Kembali pada sampul game kini berarti bagian belakang kotak, bukan "kembali"
    en: In German, Afrikaans and Spanish, the Back button on a game's cover now says the back of the box, not "go back"
  - type: feature
    label: Menekan Mainkan kini memenuhi layar dengan logo game di atas gambar latarnya selama game dimulai, atau namanya dengan huruf besar jika tidak ada logo. Tampilan hilang sendiri saat jendela game terbuka, atau saat Anda menekan Esc atau mengklik
    en: Pressing Play now fills the screen with the game's logo on its background picture while the game starts, or its name in large letters when it has no logo. It goes away by itself when the game's window opens, or when you press Esc or click
  - type: feature
    label: 'Kotak 3D yang bisa diputar kini berbentuk asli seperti case PS5: sudut dan tepi membulat, bibir yang menonjol di sekeliling sampul, garis pertemuan kedua belahan, dan celah jari di sisi pembuka. Ini membutuhkan file kotak dari versi Slipcase yang menulis bentuk ini; impor ulang kotak untuk mendapatkannya. Kotak lain tampil seperti sebelumnya'
    en: 'The turnable 3D box now has the real shape of a PS5 case: rounded corners and edges, the raised lip round the cover, the line where the two halves meet, and the finger slot in the opening side. It needs a box file from a Slipcase version that writes the shape; import the box again to get it. Other boxes look as before'
  - type: enhancement
    label: Refresh RetroAchievements dipindahkan dari Pengaturan ke halaman RetroAchievements, dan kini bernama Find Games with Achievements. Setiap tombol di sana kini punya keterangan tentang fungsinya, sehingga Find Games dan Sync Progress mudah dibedakan. Jika belum ada game tertaut, halaman menampilkan tombol Find kepada admin, bukan langsung pindah ke tab berikutnya
    en: Refresh RetroAchievements moved from Settings to the RetroAchievements page, and is now called Find Games with Achievements. Every button there now has a line saying what it does, so Find Games and Sync Progress are easy to tell apart. With no games linked yet, the page shows an admin the Find button instead of moving on to the next tab
  body: "<ul>\n  <li><strong>4.0 adalah versi web terakhir RetroDB.</strong> Versi baru\n    akan berupa aplikasi desktop untuk Windows, Linux, dan macOS, serta aplikasi Android.\n    Aplikasi itu akan membuka pustaka Anda yang sudah ada. Versi 4.0 tetap tersedia untuk\n    diunduh, dan hanya mendapat perbaikan keamanan serta perbaikan bug yang menyebabkan data hilang.\n    Pengaturan → Pembaruan akan menautkan ke aplikasi desktop saat sudah dirilis.</li>\n  <li><strong>Manual bantuan sudah diperbarui di semua bahasa.</strong>\n    Bagian yang sebelumnya hanya ada di manual bahasa Inggris kini sudah diterjemahkan.</li>\n</ul>\n"
  body_en: "<ul>\n  <li><strong>4.0 is the last web version of RetroDB.</strong> New versions\n    will be a desktop app for Windows, Linux and macOS, and an Android app.\n    They will open your existing library. Version 4.0 stays available to\n    download, and gets only security fixes and fixes for bugs that lose data.\n    Settings → Updates links to the desktop app when it is out.</li>\n  <li><strong>The help manual is up to date in every language.</strong>\n    Sections that were only in the English manual are now translated.</li>\n</ul>\n"
- version: 3.35.4
  date: '2026-11-03'
  tags:
  - type: fix
    label: Screenshot yang Anda hapus dari sebuah game kini tetap terhapus. Sebelumnya, scrape berikutnya bisa menyalinnya kembali dari ES-DE atau mengunduhnya lagi dari sumber online. Menghapus salinan ganda di alat Screenshot Ganda tidak termasuk, karena gambarnya tetap tersimpan satu kali
  - type: feature
    label: 'Game kini punya logo: scrape menyimpannya dari ES-DE, ScreenScraper, TheGamesDB, IGDB, dan Steam, lalu halaman game menampilkannya di atas judul, atau sebagai pengganti boks yang tidak ada. Anda bisa mengunggah atau menghapus logo di jendela Edit. Jalankan scrape massal dengan Isi yang Kosong untuk mengisi logo game yang pernah Anda scrape sebelumnya'
  - type: fix
    label: IGDB tidak lagi menjadikan logo game sebagai latar halaman
  - type: feature
    label: 'Game kini punya bagian belakang boksnya: scrape menyimpannya dari ES-DE, ScreenScraper, dan TheGamesDB, dan tombol Belakang pada sampul di halaman game menampilkannya. Klik bagian belakang untuk memperbesar. Anda bisa mengunggah atau menghapus bagian belakang di jendela Edit. Bagian belakang terisi setiap kali game di-scrape; Isi yang Kosong tidak men-scrape ulang game hanya demi bagian belakangnya'
  - type: fix
    label: Game tanpa sampul depan di TheGamesDB tidak lagi memakai bagian belakang boks sebagai sampulnya
  - type: fix
    label: Jika Anda mematikan sebuah scraper di Pengaturan saat scrape massal sedang berjalan, jumlah game yang tidak ditemukan kini benar mulai dari game berikutnya. Sebelumnya, sebuah game bisa terhitung sebagai dihentikan
  - type: enhancement
    label: Pada sistem tanpa emulator yang disiapkan, tombol Mainkan berwarna abu-abu. Arahkan kursor ke tombol itu untuk melihat alasannya, atau klik untuk membuka kotak yang menyatakan belum ada emulator yang disiapkan. Sebelumnya, ada satu baris teks di samping tombol
  body: "<ul>\n  <li><strong>Game punya logo.</strong> Scrape menyimpan logo setiap game, dan halaman game menampilkannya di atas judul, atau sebagai pengganti boks yang tidak ada. Jalankan scrape massal dengan Isi yang Kosong untuk mengisi logo game yang pernah Anda scrape sebelumnya.</li>\n  <li><strong>Game punya bagian belakang boks.</strong> Tombol Belakang pada sampul di halaman game menampilkannya, dan Anda bisa mengkliknya untuk memperbesar. Bagian belakang terisi setiap kali game di-scrape.</li>\n  <li><strong>Screenshot yang dihapus tetap terhapus.</strong> Scrape berikutnya tidak lagi menyalinnya kembali atau mengunduhnya lagi.</li>\n  <li><strong>Mainkan menjelaskan mengapa tidak bisa mulai.</strong> Pada sistem tanpa emulator yang disiapkan, tombol Mainkan berwarna abu-abu dan menjelaskan alasannya.</li>\n</ul>\n"
- version: 3.35.3
  date: '2026-11-02'
  tags:
  - type: feature
    label: 'Alat baru MAME Names di ROM Tools: game MAME mendapatkan nama asli, tahun, dan pembuatnya dari daftar resmi MAME sendiri, sementara file tetap memakai nama pendeknya. Setelah itu Scrape akan menemukan tiap game, dan Anda bisa menyaring daftar MAME menurut kategori, misalnya tanpa mesin slot. Set BIOS disembunyikan dari daftar'
  - type: fix
    label: ROM Reports tidak lagi menawarkan untuk mengganti nama file MAME, karena file yang diganti namanya tidak bisa berjalan di MAME
  - type: fix
    label: Pengaturan kini menjelaskan apa yang diminta Microsoft sebelum aplikasi Xbox bisa didaftarkan. Login Xbox tidak bisa diuji karena hal ini
  - type: enhancement
    label: Kartu Official Names yang terpisah sudah dihapus dari Bulk AI Fill, karena tombol Official name pada Isi dengan AI sudah menjalankan fungsi yang sama
  - type: fix
    label: Saat Sony menolak login PlayStation yang tersimpan, dasbor dan Pengaturan kini memberi tahu dan meminta Anda menautkan ulang. Sebelumnya, log menampilkan error yang tidak jelas setiap server dimulai dan tidak ada yang memberi tahu Anda
  - type: feature
    label: Impor dari Steam kini mengisi deskripsi, kredit, skor Metacritic, rating usia, mode game, sampul, latar, dan screenshot tiap game dari halaman tokonya, di latar belakang. Scrape sebuah game untuk mendapatkan genre dan tanggal rilisnya
  - type: feature
    label: Sinkronisasi Steam kini menyimpan waktu bermain dan kapan terakhir Anda memainkannya, dan halaman game menampilkannya
  - type: fix
    label: Fetch Library di halaman impor Steam kini berfungsi untuk admin yang punya kunci Steam tersimpan. Sebelumnya, halaman mengirim bentuk tersembunyi dari kunci itu ke Steam, dan salah menyuruh Anda mengatur profil ke Publik
  - type: fix
    label: Game Steam atau Xbox yang sudah ada di pustaka Anda dengan nama yang sama kini ditautkan ke game itu saat diimpor, sehingga achievement-nya tersinkron. Sebelumnya, game itu dilewati dan tidak pernah ditautkan
  - type: fix
    label: Game yang diimpor dari Steam, Xbox, dan PlayStation kini langsung terurut dengan benar, misalnya Final Fantasy IX sebelum Final Fantasy X, dan tanda merek dagang Steam dihilangkan dari namanya
  - type: feature
    label: Pada sistem yang RetroAchievements-nya memakai hash file biasa, seperti Mega Drive dan Game Boy, halaman game menunjukkan apakah salinan Anda mendapat achievement, dan hash itu menautkan game yang tepat. Jalankan RA Refresh untuk mengisinya
  - type: fix
    label: Scrape kini menanyakan file Anda yang persis ke ScreenScraper sebelum mencari berdasarkan nama, sehingga yang didapat adalah game Anda, bukan game berjudul mirip. Hasil yang Anda centang sendiri tetap diutamakan
  - type: enhancement
    label: Kotak progres Image Resize kini menyebutkan game dan sistem tempat setiap gambar berasal
  - type: feature
    label: Scrape kini mengambil layar judul dari ScreenScraper dan TheGamesDB, lebih banyak nama resmi dari IGDB dan TheGamesDB (seperti judul Jepang sebuah game), serta konsol lain tempat game itu dirilis dari IGDB
  - type: feature
    label: Game tanpa skor pengguna kini memakai rating di koleksi ES-DE Anda, jika ada
  - type: feature
    label: Halaman game menunjukkan berapa pemain yang mencatat waktu untuk hasil HowLongToBeat dan menautkan ke halamannya. Hasil yang disimpan sebelum ini akan menampilkannya saat Anda mencarinya lagi
  - type: feature
    label: Halaman RetroAchievements menunjukkan berapa banyak orang yang memainkan sebuah game dan berapa persen dari mereka yang meraih tiap achievement
  - type: fix
    label: Penjelajah folder ROM Tools kini terbuka di folder ROM Anda jika tidak ada folder awal, bukan gagal. Jawaban IGDB yang rusak kini hanya menghilangkan satu detail itu, bukan semua yang dikirim IGDB untuk game tersebut
  - type: fix
    label: Batas harian ScreenScraper kini membuat RetroDB berhenti meminta sampai nanti, dan Scrape massal memberi tahu hal itu lalu lanjut dengan sumber lainnya. Sebelumnya, batas yang habis tampak seperti "game tidak ditemukan" dan permintaan terus berjalan sepanjang malam
  - type: fix
    label: Game yang tidak bisa dijawab oleh sumber mana pun karena layanan sedang mencapai batas kini tidak ditandai sudah di-scrape, sehingga proses berikutnya mencobanya lagi
  - type: fix
    label: Saat satu kunci TheGamesDB sudah habis jatah bulanannya, RetroDB beralih ke kunci Anda yang lain, dan berhenti meminta setelah keduanya habis
  - type: fix
    label: Batas bulanan RAWG kini juga membuat RetroDB berhenti meminta, dan IGDB dijaga dalam batasnya empat permintaan per detik
  - type: fix
    label: Pencarian massal HowLongToBeat kini berakhir dengan pesan saat situs menyatakan sudah terlalu banyak permintaan, dan setiap permintaan ke situs diberi jeda
  - type: fix
    label: Fix Box and Manual Regions tidak lagi menyerah setelah 25 game berturut-turut yang tidak dikenal ScreenScraper. Proses berhenti hanya saat ScreenScraper menyatakan batasnya tercapai
  - type: fix
    label: Di halaman game, setiap rating usia kini berada di tengah di atas label tebakan AI-nya
  - type: fix
    label: Jatah TheGamesDB di Pengaturan kini memakai pengecekan yang tidak menghabiskan jatah Anda, dan tidak lagi menampilkan tanggal reset karangan saat layanan tidak memberikannya
  body: |
    <ul>
      <li><strong>Game MAME mendapat nama aslinya.</strong> Alat MAME Names yang baru di ROM Tools mengambil nama, tahun, dan pembuat dari daftar milik MAME sendiri.
        File tetap memakai nama pendeknya, karena MAME membutuhkannya. Daftar MAME bisa difilter menurut kategori, dan set BIOS disembunyikan.</li>
      <li><strong>Impor Steam membawa lebih banyak data.</strong> Setiap game mengisi deskripsi, kredit, skor Metacritic, rating usia, mode game, dan gambar dari halaman tokonya. Sinkronisasi menjaga waktu bermain dan kapan terakhir kali dimainkan. Game yang sudah ada di Pustaka Anda dengan nama yang sama kini ditautkan, sehingga achievement-nya ikut tersinkron.</li>
      <li><strong>Scrape menemukan game Anda dengan tepat.</strong> Scrape menanyakan file Anda yang persis ke ScreenScraper sebelum mencari berdasarkan nama. Scrape juga membawa layar judul, lebih banyak nama resmi, dan konsol lain tempat game itu dirilis.</li>
      <li><strong>RetroAchievements mengenali salinan Anda.</strong> Pada sistem yang memakai hash file biasa, seperti Mega Drive dan Game Boy, halaman game menunjukkan apakah salinan Anda mendapatkan achievement. Jalankan RA Refresh untuk mengisinya. Halaman RetroAchievements juga menampilkan berapa banyak orang yang memainkan sebuah game dan berapa persen dari mereka yang meraih tiap achievement.</li>
      <li><strong>Batas layanan online dihormati.</strong> Saat ScreenScraper, TheGamesDB, atau RAWG mencapai batasnya, RetroDB berhenti meminta sampai nanti dan scrape massal berlanjut dengan sumber lainnya. Game yang tidak bisa dijawab oleh sumber mana pun saat itu akan dicoba lagi pada proses berikutnya.</li>
      <li><strong>Penolakan masuk PlayStation kini diberi tahu.</strong> Dasbor dan Pengaturan kini meminta Anda menautkan ulang saat Sony menolak data masuk yang tersimpan.</li>
      <li><strong>Official Names telah dipindahkan.</strong> Kartu terpisahnya dihapus dari Bulk AI Fill, karena sakelar Official name pada fitur isi itu melakukan hal yang sama.</li>
    </ul>
- version: 3.35.2
  date: '2026-11-02'
  tags:
  - type: fix
    label: Total waktu bermain tidak lagi menghitung menit sebagai jam, di dasbor, trofi kolektor, dan grafik analitik. Game berdurasi 36 menit sempat dihitung 36 jam
