  body: |
    <ul>
      <li><strong>Cheat untuk RetroArch (RetroDB), DuckStation, dan
        PCSX2.</strong> Pengaturan &gt; Emulator memiliki bagian Cheat
        baru. Unduh paket cheat publik yang gratis di sana, atau impor
        folder cheat yang sudah Anda miliki; RetroDB menyalin berkasnya
        dan tidak pernah mengubah folder Anda. Halaman game kemudian
        menampilkan cheat-nya, masing-masing dengan sakelar nyala/mati,
        serta kotak pencarian bila jumlahnya banyak. Di RetroArch
        (RetroDB), cheat yang Anda nyalakan berlaku saat Anda menekan
        Mainkan berikutnya, dan perubahan yang Anda buat di menu RetroArch
        selama bermain tetap disimpan. Untuk DuckStation dan PCSX2,
        sakelarnya disimpan di pengaturan emulator itu sendiri untuk game
        tersebut, sehingga perubahan yang dibuat di dalam emulator juga
        tampil di halaman. RetroDB tidak pernah menimpa berkas cheat yang
        sudah dimiliki emulator. Cheat yang menyala menjeda mode hardcore
        RetroAchievements.</li>
      <li><strong>Impor kotak 3D Slipcase ke sebuah game.</strong> Halaman
        game memiliki tombol Impor kotak 3D di bawah sampul. Pilih berkas
        <code>.box.json</code> yang disimpan Slipcase, beserta
        gambar-gambarnya, dan RetroDB menyimpan sisi depan, punggung,
        belakang, dan sisi lain kotak itu untuk game tersebut. Gambar
        boxart 3D Anda tidak diubah. Game yang sudah memiliki sisi kotak
        akan bertanya sebelum menggantinya, dan Hapus akan menghapusnya.</li>
      <li><strong>Putar kotak 3D sebuah game di tangan Anda.</strong> Klik
        sampul game yang memiliki kotak Slipcase hasil impor, dan kotak itu
        muncul dalam 3D. Seret, atau gunakan tombol panah, untuk memutarnya
        dan melihat punggung, belakang, atas, dan bawahnya. Gulir atau tekan
        + dan - untuk memperbesar; klik dua kali atau tekan Home untuk
        mengembalikannya. Game tanpa kotak hasil impor tetap memperbesar
        gambar sampulnya.</li>
      <li><strong>Pengaturan menautkan ke halaman Emulator.</strong> Halaman
        Emulator tidak memiliki tautan di mana pun di Pengaturan, sehingga
        Anda hanya bisa membukanya dengan mengetik alamatnya. Admin kini
        melihat tab Emulator setelah Sistem, dan halaman Emulator
        menampilkan bilah tab yang sama, sehingga tab lainnya hanya sekali
        klik.</li>
      <li><strong>Perbesaran sampul tidak lagi tersembunyi di balik
        menu.</strong> Di ponsel, bilah atas dan bawah menutupi sampul yang
        diperbesar dan menyembunyikan tombol tutupnya, dan di komputer
        bilah samping menutupi sisi kirinya. Perbesaran kini terbuka di atas
        semuanya.</li>
      <li><strong>Model Claude 5.5 untuk AI.</strong> Pengaturan &gt; Scraping menampilkan model Claude terbaru dari Anthropic: Haiku 5.5, bawaan baru dan yang termurah, Sonnet 5.5, dan Opus 5.5, dengan harga terkininya. RetroDB tidak lagi mengirim pengaturan yang ditolak Sonnet 5.5.</li>
      <li><strong>Ketik angka penjualan game.</strong> Kedua layar edit kini punya kotak Kopi terjual di bawah Pengembang. Angka yang Anda ketik tampil di halaman game, sama seperti angka yang ditemukan AI. Kosongkan kotaknya untuk menghapusnya.</li>
      <li><strong>Uji kunci AI Anda di Pengaturan.</strong> Pengaturan &gt; Scraping punya tombol Uji kunci AI yang tersimpan di bawah penyedia AI. Tombol ini menunjukkan apakah kunci berfungsi dan, jika tidak, alasannya: kunci ditolak, tidak ada kredit, atau batas penggunaan. Sebelumnya, kunci yang ditolak tampak berfungsi.</li>
      <li><strong>Claude bisa mencari angka penjualan di web.</strong> Pengaturan &gt; Scraping punya sakelar Izinkan Claude mencari di web di bawah model Claude, mati pada awalnya. Tanpa pencarian, Claude menjawab dari yang sudah ia ketahui dan mengosongkan kopi terjual. Jika sakelar aktif, Claude mencari angkanya. Anthropic menarik biaya untuk setiap pencarian, jadi Isi dengan AI melakukan paling banyak 5 pencarian per game, hingga 5 sen AS; matikan sakelar sebelum scrape massal besar.</li>
      <li><strong>Isi dengan AI untuk seluruh sistem sekaligus.</strong> Alat ROM punya halaman baru Isi dengan AI Massal, yang juga memuat Nama Resmi. Pilih sebuah sistem, atau Semua sistem, aktifkan kolom yang ingin diisi, lalu tekan Isi dengan AI: RetroDB menjalankan Isi dengan AI pada setiap game, sama seperti tombol Isi dengan AI di halaman sebuah game, dan menyimpan jawabannya langsung ke game. Bilah progres dan kotak notifikasi Isi dengan AI menunjukkan sejauh mana prosesnya, dan Anda bisa meninggalkan halaman saat proses berjalan. Ia menampilkan berapa banyak game yang akan diisi dan bertanya dulu, karena penyedia AI Anda menagih biaya untuk setiap game. Game yang sudah pernah melalui Isi dengan AI dilewati kecuali Anda menyertakannya kembali, dan proses berhenti sendiri jika AI berhenti menjawab.</li>
      <li><strong>Kotak notifikasi tugas memakai warna tema Anda.</strong> Kotak yang menampilkan tugas yang sedang berjalan, seperti Scrape Massal dan RA Sync, serta bilah progres kini memakai warna tema yang Anda pilih. Tugas yang tidak bisa dijeda tidak lagi menampilkan judulnya dengan warna jeda.</li>
    </ul>
