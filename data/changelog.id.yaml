  body: "<ul>\n  <li><strong>Setiap scraper mencari konsol yang tepat.</strong> Atari\n    Lynx, arcade CPS, Super Famicom, dan lainnya sebelumnya dicari pada\n    mesin yang salah, dan kini lebih banyak sistem yang dicari,\n    oleh semua sumber dan untuk Achievement.</li>\n  <li><strong>Wilayah game kini ditentukan dari nama filenya sendiri.</strong>\n    Tag seperti (USA) kini menentukan wilayah, dan AI tidak lagi\n    ditanya. Alat ROM punya alat baru, Perbaiki Wilayah dari Nama File,\n    untuk game yang salah ditentukan oleh scrape lama.</li>\n  <li><strong>ScreenScraper mengikuti wilayah game.</strong> Box,\n    box 3D, manual, judul, dan tanggal rilis kini berasal dari wilayah\n    game itu sendiri, bukan yang kebetulan pertama menurut abjad. Alat ROM punya\n    alat baru, Perbaiki Wilayah Box dan Manual, untuk scrape lama. Video kini\n    mencoba file yang lebih kecil lebih dulu.</li>\n  <li><strong>Gambar RAWG tidak lagi menjadi box art.</strong> Gambar itu sering berupa\n    screenshot, dan menghalangi cover asli. Kini dipakai sebagai\n    fanart. Alat ROM punya alat baru, Hapus Gambar RAWG dari Box Art,\n    untuk gambar yang disimpan scrape lama. RetroDB juga mencantumkan kredit RAWG dengan\n    tautan di bilah samping, sesuai permintaan RAWG.</li>\n  <li><strong>ES-DE tetap di urutan scraper Anda.</strong> Saat\n    bukan sumber utama, sumber berikutnya dan AI menggantikan teks\n    dan cover-nya, dan screenshot-nya dibuang. Kini semuanya tetap ada.\n    ES-DE tidak lagi menyalin media yang sudah dimiliki game, dan membaca entri\n    untuk file ROM milik game itu sendiri. Game folder PS3 kini menemukan cover\n    ES-DE mereka. Mengimpor logo sistem tidak lagi mengambil gambar yang tidak terkait.\n    Scrape Ulang Penuh tidak lagi menghapus box yang baru saja\n    diunduh dari sumber lain.</li>\n  <li><strong>Tinjauan Screenshot.</strong> Alat baru di Alat ROM mendaftar\n    screenshot ZX Spectrum, Commodore 64, dan Game Boy dengan yang paling\n    mencurigakan di atas, dan hanya menghapus yang Anda pilih. Scrape kini\n    menolak screenshot Game Boy yang aslinya memiliki jauh lebih banyak tingkat warna\n    daripada yang bisa ditampilkan mesinnya. Pada sistem 8-bit dan 16-bit, scrape tidak\n    lagi menambahkan screenshot IGDB atau RAWG ke game yang dirilis di beberapa\n    sistem.</li>\n  <li><strong>Masuk RetroAchievements sampai ke DuckStation dan PCSX2</strong>\n    saat Anda menekan Mainkan.</li>\n  <li><strong>Di halaman game:</strong> tombol panah kiri dan kanan membuka\n    game sebelumnya dan berikutnya, bagian Cheat bisa dilipat dan\n    mengingatnya, panel bawah muat di jendela, dan emulator\n    ditampilkan pada kartu Pengaturan Emulator, bukan di samping Mainkan.</li>\n  <li><strong>Impor box 3D</strong> kini ada di jendela Edit, di samping\n    gambar lainnya.</li>\n  <li><strong>Jendela yang dimulai pada kotak teks,</strong> seperti Scrape,\n    kini menempatkan kursor di kotak itu, bukan di tombol tutup.</li>\n</ul>\n"
