  - type: fix
    label: Jumlah pemain dan mode multipemain dari IGDB kini berasal dari konsol asli game tersebut
  - type: fix
    label: Jika beberapa sumber sama cocoknya, urutan scraper Anda yang menentukan. RAWG tidak lagi mendapat skor tambahan karena memiliki gambar atau skor Metacritic, dan instalasi baru menempatkan RAWG di urutan terakhir
  - type: fix
    label: RAWG tidak lagi dicari untuk game Commodore 64 dan DOS, karena RAWG mengelompokkannya di Amiga dan PC, sehingga game dari platform lain bisa saja cocok
  - type: fix
    label: Hasil ScreenScraper yang Anda pilih kini selalu menjadi game yang Anda dapatkan, bahkan setelah hasilnya dibiarkan terbuka lebih dari 10 menit
