  - type: added
    label: 'Kartu Alat ROM baru: Rapikan Genre, Perspektif, dan Mode mengonversi data yang disimpan scrape lama, memindahkan kata seperti FPV ke kolom yang tepat, dan memperbaiki jumlah pemain yang bertentangan dengan mode game'
  - type: fix
    label: Game khusus online dari IGDB tidak lagi dicantumkan sebagai multipemain lokal, dan game yang butuh dua pemain tidak lagi dicantumkan sebagai pemain tunggal
  body: "<ul>\n  <li><strong>Scraping berhenti mengambil game yang salah.</strong> Sekuel tidak\n    lagi dianggap sebagai game yang Anda miliki, jadi Street Fighter II tidak mendapat apa pun\n    dari Street Fighter, dan scrape massal mensyaratkan judul yang cocok, bukan\n    hanya konsolnya. Mod, DLC, dan bundel dari IGDB tidak lagi cocok kecuali\n    ROM Anda memiliki nama yang persis sama.</li>\n  <li><strong>RAWG berhenti mencampur versi sebuah game.</strong> Jika datanya\n    mencakup beberapa konsol, RAWG tidak lagi memberikan pengembang, penerbit, rating\n    usia, atau mode multipemain, dan tidak lagi menebak jumlah pemain.\n    RAWG tidak lagi dicari untuk game Commodore 64 dan DOS.</li>\n  <li><strong>Urutan scraper Anda menentukan di antara kecocokan yang setara.</strong>\n    RAWG tidak lagi mendapat skor tambahan karena gambar atau skor Metacritic, dan instalasi\n    baru menempatkannya di urutan terakhir.</li>\n  <li><strong>Tanggal rilis hanya menampilkan yang diketahui sumbernya.</strong> Game\n    yang hanya diketahui tahunnya menampilkan tahun itu. Tanggal dari IGDB dan RAWG\n    milik konsol game itu sendiri, dan daftar Tanggal Rilis kini terisi\n    dari IGDB dan ScreenScraper juga.</li>\n  <li><strong>Satu set nama untuk genre, perspektif, dan mode.</strong>\n    Filter kini menemukan semua game, dan game khusus online tidak lagi dicantumkan\n    sebagai multipemain lokal.</li>\n  <li><strong>Dua kartu Alat ROM baru.</strong> Rapikan Tanggal Rilis dan Rapikan\n    Genre, Perspektif, dan Mode memperbaiki data yang disimpan scrape lama. Tekan\n    keduanya, lalu jalankan scrape massal dengan Isi yang Kosong.</li>\n  <li><strong>Jumlah pemain berasal dari konsol asli game,</strong> dan\n    hasil ScreenScraper yang Anda pilih selalu menjadi game yang Anda dapatkan.</li>\n</ul>\n"
