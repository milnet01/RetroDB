  body: |
    <ul>
      <li><strong>Versi regional sebuah game tampil sebagai satu game.</strong>
        Tautkan versi yang Anda miliki (misalnya rilis AS, Eropa, dan Jepang)
        dan Pustaka menampilkan satu kartu dengan lencana &#127760;. Kartu itu
        membuka dan memainkan versi dari Wilayah Bawaan Anda. Halaman game
        mencantumkan setiap versi berdampingan dan memungkinkan Anda beralih di
        antaranya. Alat ROM &gt; Versi Regional menyarankan kelompok untuk
        dikonfirmasi editor; tidak ada yang ditautkan tanpa Anda. Fitur ini
        tidak pernah menyarankan sekuel sebagai versi dari game pertamanya.
        Versi yang tertaut tidak lagi dilaporkan sebagai duplikat berdasarkan
        nama. Jalankan Isi Ulang Judul Alternatif sekali agar saran punya lebih
        banyak bahan.</li>
      <li><strong>AI bisa merangkum perbedaan antarversi regional.</strong> Pada
        game dengan versi yang tertaut, editor dapat menekan Ringkas perbedaan
        dengan AI di bagian Versi Regional. AI mencantumkan perbedaan yang
        diketahui, seperti sensor, tingkat kesulitan, atau konten yang dihapus.
        Daftar itu ditandai sebagai tulisan AI, tampil di halaman setiap versi,
        dan disembunyikan saat Anda menautkan atau melepas tautan sebuah versi
        sampai ditulis ulang. Memerlukan penyedia AI yang disiapkan di
        Pengaturan &gt; Scraping.</li>
      <li><strong>Game PlayStation dimulai dengan pengaturan yang baik.</strong>
        Untuk DuckStation, PCSX2, dan RPCS3, RetroDB kini mengatur skala
        resolusi dan rasio aspek setiap game di berkas pengaturan per-game milik
        emulator itu sendiri saat Anda menekan Mainkan, serta apakah game
        dimulai dalam layar penuh. Ubah pengaturan itu untuk seluruh sistem
        dengan tombol Pengaturan di Pengaturan &gt; Emulator, atau untuk satu
        game di panel Pengaturan emulator yang baru di halaman game-nya.
        Pengaturan yang Anda ubah di dalam emulator selalu menang. RetroDB
        membaca nomor seri setiap disk untuk menemukan berkas yang tepat; disk
        CHD memerlukan chdman terpasang.</li>
      <li><strong>Isi dengan AI tidak bisa lagi diarahkan oleh teks yang diketik
        di kolom sebuah game.</strong> Saat Isi dengan AI memeriksa penerbit,
        pengembang, edisi, atau platform lain yang sudah ada pada sebuah game,
        teks itu kini dibersihkan terlebih dahulu, sama seperti judul yang
        sudah dibersihkan sebelumnya.</li>
      <li><strong>Pemindaian Alat ROM tetap berada di dalam folder ROM
        Anda.</strong> Konverter CHD dan Verifikasi CHD tidak lagi mengikuti
        pintasan (symlink) yang menunjuk ke luar folder itu, dan membongkar
        arsip multi-disk mengabaikan pintasan apa pun yang dikemas di dalam
        arsip.</li>
      <li><strong>Halaman menolak menjalankan skrip yang diselipkan ke
        dalamnya.</strong> Browser Anda kini memblokir skrip apa pun yang tidak
        ditulis RetroDB sendiri, sehingga teks yang menyelundupkan kode ke judul
        game, tag, atau deskripsi hasil scrape tidak bisa menjalankannya. Tombol
        dan menu bekerja seperti sebelumnya.</li>
      <li><strong>Satu screenshot rusak tidak lagi menghentikan pemeriksaan
        duplikat untuk sebuah game.</strong> Screenshot yang tidak bisa dibaca
        disisihkan dan pemeriksaan berlanjut.</li>
      <li><strong>Tugas Alat ROM tidak lagi macet di "berjalan".</strong> Berkas
        yang dihapus setelah pemindaian Verifikasi CHD dihitung tidak valid, dan
        kesalahan tak terduga apa pun di Konversi CHD, Verifikasi CHD, atau
        Pencari Duplikat mengakhiri tugas sebagai gagal, dengan kesalahannya di
        log tugas.</li>
      <li><strong>Sebelum penyiapan selesai, permintaan data aplikasi mendapat
        jawaban yang jelas.</strong> Permintaan itu menjawab "Penyiapan
        diperlukan" alih-alih mengembalikan halaman penyiapan. Halaman tetap
        membawa Anda ke wizard penyiapan.</li>
      <li><strong>Sekuel tidak lagi menampilkan achievement game
        pertama.</strong> Pencocokan RetroAchievements mengabaikan angka pada
        judul, sehingga Donkey Kong Country 2 dan 3 ditautkan ke Donkey Kong
        Country. Angka (2, II, 3, III, dan seterusnya) kini diperhitungkan.
        Untuk memperbaiki game yang sudah tertaut, jalankan Refresh
        RetroAchievements untuk semua sistem sekali.</li>
      <li><strong>Sinkronisasi PlayStation tidak lagi menghapus jumlah trofi
        Anda.</strong> Saat balasan PlayStation tidak menyertakan total trofi
        sebuah game, RetroDB menyimpan angka nol menimpa jumlah yang sudah ada.
        Kini jumlah itu dipertahankan, termasuk pada refresh trofi massal.</li>
      <li><strong>Membuka set trofi yang sudah tidak ada di disk menampilkan
        pesan.</strong> Halaman Trofi dulu gagal dengan kesalahan; kini halaman
        itu mengatakan set tidak ditemukan dan membawa Anda kembali ke
        daftar.</li>
      <li><strong>Tabel Alat ROM memberi label kolom tombolnya dengan benar di
        setiap bahasa.</strong> Judul kolom itu berbagi kata dengan genre game
        Action, sehingga beberapa bahasa menampilkan nama genre di sana.</li>
      <li><strong>Game GameCube, 3DS, dan Super Famicom mendapat emulatornya
        secara otomatis.</strong> RetroDB mencari sistem ini dengan nama folder
        yang tidak dipakai pustaka (gamecube, 3ds, superfamicom alih-alih gc,
        n3ds, sfc), sehingga Dolphin dan Citra tidak pernah terhubung ke
        sistem itu. Mulai ulang RetroDB sekali agar perubahan ini
        diterapkan.</li>
      <li><strong>Unduhan tanpa Python (mandiri) kembali menyiapkan
        emulator.</strong> Unduhan itu tidak memiliki berkas yang
        mencantumkannya.</li>
      <li><strong>Sekitar 170 tombol, label, dan pesan lagi kini
        diterjemahkan</strong> di setiap bahasa. Sebelumnya semua itu tampil
        dalam bahasa Inggris, dan beberapa menampilkan tebakan yang salah
        (beberapa bahasa menulis "backup gagal" saat game gagal
        dijalankan).</li>
      <li><strong>Escape hanya menutup jendela paling atas.</strong> Saat
        sebuah pertanyaan terbuka di atas jendela lain, Escape dulu menutup
        keduanya; beberapa jendela juga tetap berjalan setelah Escape
        menyembunyikannya, dan menekan Escape di halaman game bisa melanjutkan
        scrape massal yang sudah Anda jeda. Setiap jendela kini ditutup lewat
        aksi Tutup-nya sendiri, menjaga fokus keyboard di dalamnya selama
        terbuka, dan mengembalikan fokus ke tombol yang membukanya. Jendela
        progres untuk tugas yang sedang berjalan tetap terbuka sampai tugasnya
        selesai.</li>
      <li><strong>Grafik Analitik tampil dalam bahasa Anda.</strong> Nama genre,
        perspektif, dimensi, dan mode, judul grafik, nama sumbu, serta legenda
        sebelumnya berbahasa Inggris di setiap bahasa.</li>
      <li><strong>Data RetroAchievements lebih aman.</strong> Jika daftar game
        RetroAchievements untuk sebuah konsol gagal dimuat, Refresh RA kini
        membiarkan game konsol itu tetap tertaut alih-alih melepas tautan
        semuanya. Hapus Data RA kini hanya menghapus progres RetroAchievements;
        progres Steam dan Xbox tetap ada.</li>
      <li><strong>Kata sandi harus minimal 12 karakter di mana
        pun.</strong> Penyiapan awal menerima kata sandi administrator dengan
        panjang berapa pun, dan halaman ganti kata sandi wajib serta halaman
        penyiapan mengatakan 4 karakter sudah cukup. Ketiganya kini meminta 12,
        sama seperti bagian aplikasi lainnya.</li>
      <li><strong>Total achievement kini benar, dan milik Anda sendiri.</strong>
        Menyinkronkan satu game dari RetroAchievements kini menyimpan berapa
        banyak achievement yang dimilikinya, bukan 0. Total achievement di
        dasbor hanya menghitung game Anda, dan trofi Kolektor tidak lagi
        menghitung setiap achievement Steam atau Xbox dua kali.</li>
      <li><strong>Sinkronisasi latar belakang memakai akun Anda sendiri.</strong>
        Sinkronisasi sistem RetroAchievements masuk dengan akun
        RetroAchievements Anda sendiri bila Anda sudah mengaturnya. Refresh
        massal PlayStation memakai ulang login Anda yang tersimpan alih-alih
        masuk dari awal setiap kali.</li>
      <li><strong>Hanya Anda yang bisa menghentikan atau melanjutkan
        sinkronisasi Anda.</strong> Pengguna lain tidak lagi bisa membatalkan
        sinkronisasi RetroAchievements, Steam, atau Xbox Anda, dan melanjutkan
        tugas yang terputus memerlukan hak yang sama seperti memulainya. Admin
        tetap bisa melakukan keduanya.</li>
      <li><strong>Folder trofi RPCS3 Anda diperiksa saat Anda
        menyimpannya.</strong> Folder yang tidak ada, bukan path lengkap, atau
        merupakan folder sistem akan ditolak, seperti yang sudah berlaku di
        pengaturan utama.</li>
      <li><strong>"Ambil Semua Gambar" di Museum berjalan di latar
        belakang.</strong> Halaman tidak lagi menunggu bermenit-menit untuk
        setiap gambar kontroler. Halaman menunjukkan seberapa jauh pengambilan
        berjalan, punya tombol Batal, dan melanjutkan tampilan progres jika Anda
        meninggalkan halaman lalu kembali.</li>
      <li><strong>Alat ROM melindungi berkas Anda dengan lebih baik.</strong>
        Bersihkan tidak lagi mengosongkan arsip: pola seperti <code>*</code>
        tidak bisa disimpan, dan Bersihkan berhenti jika pola akan menghapus
        setiap berkas. Konverter CHD mempertahankan berkas asli saat "verifikasi"
        mati, dan membiarkan CHD yang sudah ada saat "lewati yang sudah ada"
        aktif. Pencari Duplikat selalu menyimpan satu salinan setiap game,
        bahkan jika sebuah permintaan meminta semuanya.</li>
      <li><strong>Tugas Alat ROM berperilaku sesuai tombolnya.</strong> Jeda
        kini menjeda Konversi CHD, Verifikasi CHD, Pencari Duplikat, dan Dedup
        Screenshot, dan tugas yang dijeda bisa dibatalkan. Pemindaian Dedup
        Screenshot yang menemui kesalahan kini berakhir sebagai gagal alih-alih
        berjalan selamanya.</li>
      <li><strong>Membuat M3U tidak lagi menaruh arsip di folder
        sementara.</strong> Arsip yang dipindahkan kini masuk ke folder data
        milik RetroDB sendiri, yang tidak dikosongkan saat mulai ulang. Pemindai
        arsip menunjukkan ke mana arsip itu dipindahkan, dan konfirmasi batch
        mengatakan arsip akan dipindahkan. Mengatur ulang pengaturan Alat ROM
        kini mengatur ulang setiap opsi.</li>
      <li><strong>Ganti disk dari RetroDB.</strong> Saat game RetroArch yang
        dimulai dari daftar disk .m3u sedang berjalan, daftar &#9654; Sedang
        dimainkan di bagian atas setiap halaman menampilkan judul game dan
        tombol Disk berikutnya, sehingga game yang meminta sisi kedua bisa
        berlanjut dengan satu klik, dari browser atau ponsel. RetroArch harus
        mengaktifkan Settings &gt; Network &gt; Network Commands (port 55355);
        tombol akan memberi tahu jika opsi itu mati.</li>
      <li><strong>Skrip start-up membuka RetroDB saat sudah siap.</strong>
        start.sh, start.command, dan start.bat dulu membuka browser setelah 3
        detik tetap, sering sebelum server bisa menjawab, sehingga halaman
        gagal dimuat. RetroDB kini membukanya begitu server mendengarkan. Jika
        dijalankan dari LocalWebServerManager, tidak ada halaman yang dibuka
        sama sekali; gunakan tombol Open di manager itu.</li>
      <li><strong>Video game bisa berukuran hingga 500 MB.</strong> Batasnya
        dulu 50 MB, terlalu kecil untuk kebanyakan trailer game. Unggahan yang
        terlalu besar kini menampilkan pesan di halaman game alih-alih
        mengganti halaman dengan teks biasa. Video yang ditolak (terlalu besar
        atau jenis berkas salah) kini memberi tahu alih-alih dibuang tanpa
        sepatah kata.</li>
      <li><strong>Peluncuran mengikuti path yang Anda atur.</strong> Path
        binary pengganti di baris RetroArch di Pengaturan &gt; Emulator kini
        menang atas path RetroArch di bagian atas halaman itu; dulu path baris
        itu diabaikan. Menekan Stop dua kali tidak lagi meminta game keluar dua
        kali; di Linux, RetroArch menganggap permintaan kedua sebagai "keluar
        tanpa menyimpan", sehingga save dalam game Anda bisa hilang.
        Pengaturan peluncur sisa dari mode jarak jauh yang tidak pernah dibuat
        tidak lagi menghentikan setiap game untuk dimulai.</li>
      <li><strong>Aksi yang gagal melaporkan kesalahannya dengan benar.</strong>
        Saat menyimpan, mengimpor, menyinkronkan, atau memindai gagal, RetroDB
        kini menjawab dengan status kesalahan yang sebenarnya dan menampilkan
        alasannya di pesannya, alih-alih menjawab seolah-olah berhasil.
        Menyimpan kode login PSN yang tidak bisa terhubung tidak lagi
        menampilkan detail kesalahan internal. Login, pengelolaan pengguna,
        profil Anda, achievement, impor, Isi dengan AI, dan pencarian
        HowLongToBeat kini melakukan hal yang sama, dan bahasa yang tidak bisa
        disimpan mengatakan alasannya alih-alih "Kesalahan jaringan".</li>
      <li><strong>Game yang dinamai dengan gaya No-Intro kini bisa
        di-scrape.</strong> Judul seperti "Legend of Zelda, The" atau "Legend
        of Zelda, The - Ocarina of Time" kini cocok dengan hasil "The Legend of
        Zelda" alih-alih ditolak oleh filter pencocokan. Laporan ROM juga
        berhenti menandai nama seperti itu sebagai tidak cocok.</li>
      <li><strong>Judul yang diambil dari nama berkas kehilangan semua
        tagnya.</strong> Wilayah gabungan seperti "(USA, Europe)" dan "(UK)"
        kini dihapus. Pada komputer rumahan seperti ZX Spectrum, semua mulai
        dari tahun dan seterusnya dibuang, sehingga "Chuckie Egg 2 (UK) (1985)
        (A'n'F Software) (tzx)" menjadi "Chuckie Egg 2". Nama berkas yang
        diakhiri "..zip" tidak lagi menyisakan titik nyasar. Pencarian scraper,
        pengaturan ulang data game, dan saran Versi Regional memakai nama yang
        lebih bersih ini.</li>
      <li><strong>Judul yang salah tidak lagi terulang saat scrape
        ulang.</strong> Scrape massal kini mencari dengan nama dari berkas ROM,
        bukan judul yang tersimpan untuk game itu. Game yang pernah cocok
        dengan game yang salah akan menemukan yang benar saat di-scrape
        lagi.</li>
      <li><strong>Scraper mengutamakan Wilayah Bawaan Anda.</strong> Saat dua
        hasil seri, hasil dari Wilayah Bawaan Anda atau World kini menang, tidak
        selalu yang dari AS. Dua judul yang hanya berupa tag wilayah tidak lagi
        dihitung sebagai cocok sempurna. Versi Regional tidak lagi mengira X di
        "X-Men" sebagai nomor sekuel. Memilih versi yang ditampilkan kartu kini
        hanya membaca nama berkas ROM, bukan folder di atasnya, dan memahami
        tag lama seperti "(U)" dan "(E)".</li>
      <li><strong>Log menunjukkan ke mana waktu scrape setiap game
        terpakai.</strong> Setelah setiap game, RetroDB mencatat satu baris
        berisi detik yang dihabiskan untuk mencari, di setiap sumber, mengunduh,
        memproses gambar, di AI, dan menyimpan. Ini langkah pertama menuju
        scrape yang lebih cepat.</li>
      <li><strong>Scrape selesai lebih cepat: gambar kecil dipertajam
        sesudahnya.</strong> Scrape kini menyimpan game dengan gambarnya apa
        adanya seperti yang diunduh. Box art dan screenshot yang kecil lalu
        diperbesar di latar belakang, satu game setiap kali. Screenshot
        duplikat dibuang sebelum semua pekerjaan itu. Jika RetroDB berhenti di
        tengah jalan, prosesnya berlanjut saat RetroDB dimulai lagi.</li>
      <li><strong>Baca manual game di halamannya.</strong> Tombol Manual kini
        membuka PDF di jendela di atas halaman game. Balik halaman dengan
        Sebelumnya dan Berikutnya, tombol panah, Home dan End, atau geser di
        ponsel; setiap halaman dibalik seperti halaman buku, atau langsung
        berganti jika sistem Anda meminta lebih sedikit gerakan. "Buka PDF di
        tab baru" masih ada, dan Ctrl-klik pada Manual langsung membuka
        tab.</li>
      <li><strong>Bilah samping menunjukkan saat gambar masih
        disempurnakan.</strong> Selama gambar dipertajam di latar belakang,
        bilah samping bertuliskan "Menyempurnakan gambar — Game tersisa: N".
        Game yang masih menunggu memberi tahu di halamannya, dan gambarnya yang
        lebih tajam muncul di sana dengan sendirinya saat sudah siap. Sakelar
        sampul 2D/3D tidak lagi menutupi baris itu.</li>
      <li><strong>Sumber cadangan ditanya secara bersamaan.</strong> Saat
        sumber utama meninggalkan celah, RetroDB kini menanyai semua sumber
        lain sekaligus alih-alih satu per satu. Jawaban mereka tetap dipakai
        sesuai urutan di Pengaturan Anda, sehingga sumber yang sama menang di
        setiap kolom.</li>
      <li><strong>ES-DE membaca daftar game-nya sekali.</strong> Setiap scrape,
        termasuk scrape massal, dulu membaca gamelist.xml ES-DE sebuah sistem
        dua kali untuk setiap game. RetroDB kini membacanya sekali dan
        membacanya lagi hanya saat berkas itu berubah.</li>
      <li><strong>Terapkan di Cari Metadata tidak lagi mencari ulang.</strong>
        Di halaman game, hasil yang Anda centang diambil langsung dari
        sumbernya alih-alih dicari untuk kedua kalinya. Jika tidak ada yang
        dicentang, hanya sumber yang Anda terapkan dan AI yang mengisi
        celah.</li>
      <li><strong>ScreenScraper menemukan game dengan subjudul.</strong>
        ScreenScraper tidak menemukan apa pun untuk judul seperti "Alone in the
        Dark: The New Nightmare" kecuali titik dua diawali spasi. RetroDB kini
        mencarinya dengan cara itu, lalu dengan bagian sebelum titik dua jika
        masih tidak ditemukan apa-apa.</li>
      <li><strong>Game yang tidak punya apa pun untuk dimainkan tidak lagi
        menawarkan Mainkan.</strong> Game yang ditambahkan dari impor CLZ,
        Steam, Xbox, atau PSN tidak punya berkas ROM. Halamannya kini tidak
        menampilkan tombol Mainkan, Pengaturan emulator, atau bagian
        Peluncuran saat Anda mengeditnya, sama seperti kartu di Pustaka.</li>
      <li><strong>Game RetroArch terlindung dari dua pengaturan
        buruk.</strong> RetroDB kini memberi RetroArch berkas pengaturan kecil
        miliknya sendiri setiap kali memulai game, di atas pengaturan Anda.
        Berkas itu menyesuaikan keyboard dengan desktop Anda (Wayland atau X11),
        sehingga keyboard tidak pernah mati, dan membiarkan fast-forward
        berjalan dengan kecepatan penuh, yang dipakai game Commodore 64 untuk
        memuat dengan cepat. Semua pengaturan RetroArch Anda yang lain tidak
        disentuh.</li>
      <li><strong>Membuat M3U mempertahankan game di pustaka Anda.</strong>
        Mengubah arsip multi-disk menjadi playlist dulu membuat game tetap
        menunjuk ke arsip, yang sudah dipindahkan. Game kini menunjuk ke
        playlist baru dan mempertahankan detail serta gambarnya. Saat satu
        arsip berisi beberapa rilis sebuah game, masing-masing dengan set
        disknya sendiri, playlist kini memakai disk rilis pertama alih-alih
        semuanya, dan memberi tahu disk mana yang ditinggalkan.</li>
      <li><strong>Scrape Ulang Penuh bisa mempertahankan media yang sudah Anda
        punya.</strong> Centang "Pertahankan media yang ada" di samping sakelar
        Scrape Ulang Penuh. Detail teks tetap diperbarui, tetapi art, video, dan
        manual yang sudah ada di disk tetap seperti apa adanya alih-alih
        diunduh lagi. Tanpa centang itu, Scrape Ulang Penuh tidak lagi membuang
        screenshot yang sudah diunduhnya sebelumnya.</li>
      <li><strong>Tugas latar belakang tidak lagi kehilangan atau melewatkan
        pekerjaan.</strong> Refresh RetroAchievements yang menemui satu game
        bermasalah tidak lagi membuang game yang sudah diperbaruinya.
        Sinkronisasi atau refresh yang dilanjutkan tidak lagi melewatkan game
        yang sedang diproses saat berhenti. Sinkronisasi RetroAchievements atau
        Steam yang dilanjutkan dari snapshot yang sangat lama kini berhenti
        dengan pesan alih-alih melaporkan berhasil tanpa menyinkronkan apa pun.
        Konversi WebP memeriksa berkas WebP sisa sebelum memercayainya, dan
        tidak akan dimulai jika tidak bisa membaca ruang disk yang tersisa.</li>
      <li><strong>Memperbarui instalasi yang sangat lama tidak lagi bisa
        kehilangan data diam-diam.</strong> Tiga langkah pembaruan database
        lama bisa membuang baris dalam keadaan langka. Kini langkah itu
        menyalin baris, atau berhenti dengan kesalahan yang jelas alih-alih
        kehilangannya.</li>
      <li><strong>Tombol di jendela Tentang tidak lagi terpotong.</strong>
        Jendelanya lebih lebar dan keempat tombolnya berada di dua baris,
        sehingga setiap label tampil utuh; di ponsel tombol-tombol itu
        bertumpuk.</li>
      <li><strong>Tema Anda mengikuti Anda ke browser baru.</strong> Masuk di
        browser yang belum pernah Anda pakai kini menampilkan tema tersimpan
        Anda. Dulu halaman login menyimpan Cyberpunk lebih dulu dan tema itu
        terus melekat.</li>
      <li><strong>Kotak kata sandi login tidak lagi bertuliskan "Admin
        Login".</strong> Setiap akun masuk dengan kata sandi, jadi dialognya
        kini cukup bertuliskan Masuk. Halaman Akun dan halaman Bantuan juga
        mengatakan demikian.</li>
      <li><strong>Bantuan kini terbaru di setiap bahasa.</strong> Halaman
        Bantuan yang diterjemahkan kini menjelaskan Versi Regional, mengatakan
        setiap akun memerlukan kata sandi, dan mengatakan tema Anda disimpan
        bersama akun Anda. Bantuan di setiap bahasa, termasuk bahasa Inggris,
        kini menyebutkan batas minimum kata sandi 12 karakter yang
        sebenarnya.</li>
      <li><strong>Perbaikan kecil:</strong> fanart yang nama berkasnya memiliki
        apostrof kini tampil di halaman game dan trofi; Pengaturan tidak lagi
        menampilkan kesalahan skrip untuk akun non-admin, dan pembaca layar
        kini mendengar tab Pengaturan mana yang dipilih; meninggalkan halaman
        tidak lagi memenuhi konsol browser dengan kesalahan permintaan yang
        dibatalkan; model upscaler diunduh dari alamat yang berfungsi lebih
        dulu; dan installer tidak lagi crash di Windows saat keluarannya
        disimpan ke berkas.</li>
      <li><strong>Serangkaian luas perbaikan keandalan.</strong> Menyimpan game
        dengan judul kosong tidak lagi menghilangkan editan Anda yang lain.
        Mulai ulang kini membiarkan tugas yang berjalan berhenti dengan rapi
        lebih dulu. Membuat M3U menolak menimpa playlist atau folder yang sudah
        ada. Mengosongkan daftar berkas yang tidak diinginkan di Alat ROM kini
        berarti "jangan hapus apa pun", dan dua pola tidak lagi menangkap nama
        ROM sungguhan seperti "Release of the Dragon". Satu berkas trofi PS3
        yang rusak tidak lagi mengosongkan trofi setiap game. Isi dengan AI
        menulis satu wilayah. Analitik menghitung setiap game sekali di grafik
        rating. Impor CLZ memakai nama genre standar. Di dialog edit, genre dan
        tag lain bisa dihapus di setiap bahasa, dan pintasan keyboard tidak
        lagi membajak Ctrl+D atau Ctrl+G. Viewer bisa melihat status
        penyelesaian game tetapi tidak lagi bisa mengubahnya, karena status itu
        dibagi oleh semua orang.</li>
      <li><strong>Pembaca layar membacakan sakelar Platform Match Required
        dengan nama yang terlihat</strong> di Pengaturan → Scraping.</li>
      <li>Dalam bahasa lain, Pengaturan kini menerjemahkan "Wilayah Bawaan",
        dan tab Scraping terbaca sebagai nama, bukan "scraping sedang
        berlangsung". Halaman bantuan memakai kata-kata yang sama.</li>
      <li><strong>Game yang tidak mau tertutup tidak lagi ditampilkan sebagai
        tertutup.</strong> Jika emulator tetap hidup setelah Stop, RetroDB terus
        menampilkannya sebagai berjalan. Peluncuran RetroArch yang ditolak
        tidak lagi menulis berkas pengaturannya lebih dulu, dan emulator yang
        langsung gagal menampilkan pesan kesalahannya pada pemeriksaan
        pertama.</li>
      <li>Pustaka yang diperbarui: Pillow 13 (penanganan gambar), numpy 2.5.4
        dan onnxruntime 1.31 (upscaling), serta versi terbaru alat build dan
        rilis.</li>
      <li>Di balik layar: kode peluncuran game dirapikan agar lebih mudah
        diikuti, kode yang tidak terpakai dihapus (sebuah alamat API, sebuah
        helper PSN, skrip trofi yang tidak dimuat halaman mana pun, dan
        pengaturan tema seluruh situs yang tidak dibaca apa pun), balasan
        aplikasi ke browser dibuat di satu tempat, beberapa dokumen desain
        dikoreksi agar sesuai dengan kode, rangkaian tes dirapikan, dan
        pemeriksaan baru menangkap kesalahan sintaks JavaScript sebelum rilis.
        Entri log perubahan lama yang menjelaskan kode yang dihapus kini
        menyebutkannya.</li>
    </ul>
- version: 3.29.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Nama lain sebuah game menunjukkan wilayah asalnya
  body: |
    <ul>
      <li><strong>Nama lain sebuah game menunjukkan wilayah
        asalnya.</strong> Kartu Juga Dikenal Sebagai di halaman game menandai
        setiap nama dengan negara atau wilayahnya, seperti Jepang untuk
        "Rockman", dalam bahasa Anda sendiri. Nama yang bertanda tampil lebih
        dulu, dikelompokkan per wilayah. Arahkan kursor ke sebuah nama untuk
        melihat sumbernya dan catatan apa pun, seperti "Working title".</li>
      <li>Nama dari IGDB kini mempertahankan wilayahnya. Sebelumnya hanya nama
        dari ScreenScraper yang memilikinya.</li>
      <li>Label "SS" milik ScreenScraper tidak lagi tampil sebagai wilayah. Itu
        adalah nama ScreenScraper sendiri untuk game tersebut, bukan
        tempat.</li>
      <li>Alat ROM → Isi Ulang Judul Alternatif kini memeriksa setiap game yang
        sudah di-scrape, sehingga nama yang sudah Anda miliki mendapat
        wilayahnya. Jalankan sekali untuk menandai pustaka Anda yang
        ada.</li>
    </ul>
- version: 3.28.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Arahkan RetroDB ke folder emulator Anda dan RetroDB akan menyiapkannya
  - type: fix
    label: Perbaikan halaman Pengaturan → Emulator
  body: |
    <ul>
      <li><strong>Arahkan RetroDB ke folder emulator Anda dan RetroDB akan
        menyiapkannya.</strong> Pengaturan → Emulator memiliki daftar Folder
        emulator yang baru. Tambahkan folder tempat emulator Anda berada dan
        RetroDB menemukan setiap emulator di dalamnya, sebagai AppImage, skrip
        portabel, atau Flatpak yang terpasang, lalu menautkannya ke sistem yang
        dijalankannya. Sistem yang sudah punya emulator yang berfungsi tetap
        memakainya.</li>
      <li><strong>Lihat sistem mana yang siap dimainkan.</strong> Tabel
        pemetaan per sistem kini mencantumkan emulator setiap sistem,
        mengatakan apakah masing-masing berfungsi, dan memungkinkan Anda
        memilih emulator bawaan sebuah sistem. Untuk DuckStation, PCSX2, RPCS3,
        dan RetroArch, tabel itu juga mengatakan apakah berkas BIOS sudah ada,
        dan menyebutkan yang hilang. RetroDB hanya membaca berkas BIOS; RetroDB
        tidak pernah menyalin atau mengunduhnya.</li>
      <li>Pemindaian emulator kini menemukan setiap emulator di drive emulator
        yang besar. Sebelumnya pemindaian bisa berhenti terlalu awal di dalam
        folder pengaturan milik emulator itu sendiri.</li>
      <li>Tombol Deteksi otomatis dan Simpan untuk RetroArch berfungsi lagi, dan
        jendela Edit emulator tidak lagi tampil di halaman sampai Anda menekan
        Edit.</li>
    </ul>
- version: 3.27.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Penerapan metadata menampilkan seberapa jauh prosesnya
  body: |
    <ul>
      <li><strong>Penerapan metadata menampilkan seberapa jauh
        prosesnya.</strong> Saat Anda memilih hasil di Cari Metadata, sebuah
        cincin terisi dari 0 hingga 100% dengan persentase di tengahnya, dan
        baris di bawahnya menjelaskan apa yang sedang terjadi: situs mana yang
        sedang dicari, gambar atau video mana yang sedang diunduh, atau bahwa
        gambar sedang diproses. Unduhan besar, seperti video, menggerakkan
        cincin seiring datanya tiba. Pada 100%, halaman dimuat ulang dengan
        hasilnya, seperti sebelumnya.</li>
      <li>Cincin bisa bergerak tidak merata. Setiap sumber baru menentukan
        berapa banyak gambar yang dikirimnya saat menjawab, sehingga sumber
        pertama dengan banyak gambar bisa mengisi sebagian besar cincin dan
        sumber berikutnya lebih sedikit.</li>
      <li>Jika penerapan gagal, cincin ditutup dan sebuah pesan
        memberitahukannya, tanpa memuat ulang halaman.</li>
    </ul>
- version: 3.26.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Setiap halaman kini menyesuaikan dengan jendela tempatnya dibuka
  - type: enhancement
    label: Halaman game menampilkan nama lain di kartunya sendiri, plus tombol Manual
  body: |
    <ul>
      <li><strong>Setiap halaman kini menyesuaikan dengan jendela tempatnya dibuka.</strong>
        Halaman berisi kartu (Sistem, Museum, Tag, Daftar, Alat ROM, trofi, dan
        achievement) menambah satu kolom setiap kali satu kartu utuh lagi muat,
        hingga empat per baris. Tabel, alat, dan halaman detail sedikit melebar,
        tetapi berhenti ketika lebih lebar hanya akan merenggangkan kolomnya.
        Pengaturan menjaga kotak-kotaknya tetap selebar yang nyaman dibaca.</li>
      <li><strong>Bantuan dan log perubahan menjaga panjang baris yang
        nyaman.</strong> Di jendela lebar, tautan bagian Bantuan pindah ke
        kolom di samping teks; di jendela sempit, tautan itu berada dalam satu
        baris yang dapat Anda geser, bukan lagi blok yang menutupi sebagian
        besar layar ponsel.</li>
      <li><strong>Halaman game:</strong> di jendela lebar, tangkapan layar
        berjajar di bagian atas, dengan video dan kartu baru <strong>Juga
        Dikenal Sebagai</strong> berdampingan di bawahnya, sejajar dengan
        sampul. Nama-nama lain sebelumnya berupa teks samar di bawah judul;
        kini nama-nama itu ada di kartu yang mudah dibaca. <strong>Manual</strong>
        kini menjadi tombol di samping Mainkan, dan Riwayat Scrape mulai dalam
        keadaan terlipat.</li>
      <li>Trofi PSN menampilkan satu hingga empat kolom sesuai jendela, bukan
        selalu tiga.</li>
      <li>Beberapa halaman tidak lagi bergulir ke samping di ponsel: Trofi,
        Trofi Kolektor, halaman sistem RetroAchievements, Bantuan, Pengaturan,
        Analitik, Impor Game, serta halaman detail achievement dan trofi.
        Tabel lebar kini bergulir di dalam dirinya sendiri di sana.</li>
    </ul>
- version: 3.25.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Halaman Pustaka, sistem, dan game kini menyesuaikan dengan jendela tempatnya dibuka
  body: |
    <ul>
      <li><strong>Halaman memakai jendela lebar saat itu membantu, dan hanya saat itu.</strong>
        Pustaka dan setiap halaman sistem menambah satu kolom kartu game
        setiap kali satu kartu utuh lagi muat, hingga empat per baris. Ponsel
        menampilkan satu, jendela setengah layar dua atau tiga, jendela lebar
        empat. Dulu halaman berhenti pada lebar tetap dan membiarkan sebagian
        besar jendela besar kosong.</li>
      <li><strong>Halaman game menempatkan sampul dan detailnya di samping
        tangkapan layar dan video</strong> bila keduanya muat berdampingan, dan
        menumpuknya bila tidak. Deskripsi menjaga panjang baris yang
        nyaman.</li>
      <li><strong>Tombol Mainkan pindah ke pojok kanan atas setiap kartu,</strong>
        lebih kecil dan di tengah. Tombol ini kini juga memeriksa bahwa berkas
        ROM game masih ada dan jenisnya diterima oleh sistemnya, sehingga
        tombol hanya muncul di tempat menekannya akan memulai game. Tombol ini
        disembunyikan saat Anda memilih game secara massal.</li>
      <li>Tombol kembali-ke-atas dan pop-up progres kini berada tepat di samping
        konten halaman, bukan di tepi terjauh jendela.</li>
      <li>Halaman game tidak lagi bergulir ke samping di ponsel.</li>
    </ul>
- version: 3.24.2
  date: '2026-10-17'
  tags:
  - type: ui
    label: Bahasa uji "Pseudo" hanya ditawarkan kepada admin
  body: |
    <ul>
      <li><strong>"Pseudo" tidak lagi muncul di daftar bahasa untuk
        semua orang.</strong> Ini adalah alat pengembang yang menampilkan setiap
        kata dengan tanda kurung dan aksen, jadi kini hanya ditawarkan kepada
        admin. Pengguna lain yang sempat memilihnya akan melihat aplikasi dalam
        bahasa Inggris, dengan bahasa Inggris terpilih di Pengaturan.</li>
    </ul>
- version: 3.24.1
  date: '2026-10-17'
  tags:
  - type: fix
    label: Unduhan Windows bisa dipasang lagi, dan tidak ada lagi banjir galat setelah mengubah ukuran
  body: |
    <ul>
      <li><strong>Unduhan Windows biasa tidak bisa dipasang.</strong>
        Penginstal berhenti dengan pesan "Core dependencies failed to install",
        karena daftar paket terkuncinya melewatkan satu paket yang hanya
        dibutuhkan Windows. Daftar itu kini mencakup semua platform. Unduhan
        Windows tanpa Python tidak terpengaruh.</li>
      <li><strong>Pesan galat terus muncul di pojok kanan atas</strong>
        pada tema Cyberpunk setelah jendela browser dibuat lebih lebar, misalnya
        dengan memaksimalkannya. Latar belakang animasi kini menyesuaikan
        ukurannya dengan mulus.</li>
    </ul>
- version: 3.24.0
  date: '2026-10-17'
  tags:
  - type: feature
    label: Mainkan game langsung dari halaman Pustaka dan sistem
  body: |
    <ul>
      <li><strong>Tombol ▶ Mainkan di setiap kartu game.</strong> Tombol ini
        muncul di pojok kiri bawah gambar sampul di halaman Pustaka dan di
        setiap halaman sistem. Tekan, dan game dimulai di emulatornya; Anda
        tetap di daftar alih-alih membuka halaman game terlebih dahulu.</li>
      <li>Tombol hanya muncul di tempat menekannya bisa berhasil: akun Anda
        diizinkan meluncurkan game, dan emulator game itu aktif, terpasang,
        dan, untuk RetroArch, memiliki core-nya. Game pada sistem tanpa
        emulator yang berfungsi tidak menampilkan tombol.</li>
      <li>Jika peluncuran tetap gagal, misalnya karena berkas ROM telah
        dipindahkan, alasannya muncul dalam pesan dan halaman tetap seperti
        semula.</li>
    </ul>
- version: 3.23.21
  date: '2026-10-17'
  tags:
  - type: ui
    label: Bilah samping lebih pendek, dengan satu halaman Achievement untuk semua platform
  body: |
    <ul>
      <li><strong>Satu tautan "Achievement" menggantikan lima.</strong>
        RetroAchievements, RPCS3, PSN, Steam, dan Xbox kini menjadi tab di satu
        halaman, dan tautan itu membuka kembali tab yang terakhir Anda pakai.
        Jika Anda tidak punya game RetroAchievements, halaman dibuka di tab
        RPCS3 alih-alih mengembalikan Anda ke Dasbor.</li>
      <li><strong>Laporan ROM kini berada di Alat ROM,</strong> sebagai tab
        di samping alat lainnya dan sebagai kartu di halaman Alat ROM.</li>
      <li><strong>Tidak ada lagi dua tautan bilah samping yang memakai ikon sama:</strong>
        Dasbor kini 🏠 dan Penampil Log 🧾. Bilah samping kini berisi 16 tautan,
        bukan 21.</li>
      <li>Tab alat di halaman pengaturan Alat ROM sebelumnya selalu berbahasa
        Inggris; kini tab itu mengikuti bahasa Anda.</li>
    </ul>
- version: 3.23.20
  date: '2026-10-17'
  tags:
  - type: fix
    label: Pencarian How Long To Beat berfungsi lagi
  body: |
    <ul>
      <li><strong>Setiap pencarian How Long To Beat mengatakan game tidak
        ditemukan.</strong> Situs itu memindahkan pencariannya ke alamat baru,
        sehingga permintaan RetroDB ditolak; kerusakan ini terjadi antara akhir
        Juli dan akhir September. RetroDB kini memakai alamat baru, dan
        mengirim filter platform dan tahun dalam format baru situs itu, yang
        sudah mulai diabaikan oleh situs tersebut. Pencarian satu game maupun
        pencarian massal di Alat ROM berfungsi lagi.</li>
    </ul>
- version: 3.23.19
  date: '2026-10-17'
  tags:
  - type: ui
    label: RetroDB kini menyatakan dengan jelas bahwa ia tidak mendukung pembajakan
  - type: fix
    label: Dialog Tentang terbuka dalam ukuran penuh lagi
  body: |
    <ul>
      <li><strong>Pemberitahuan anti-pembajakan kini ada di aplikasi.</strong>
        Pemberitahuan ini muncul di dialog Tentang dan di bawah Jalur Pustaka
        ROM di Pengaturan, dalam setiap bahasa. Isinya: RetroDB tidak
        mendistribusikan atau menyimpan berkas ROM, Anda sebaiknya hanya
        memakai game yang disalin dari cakram dan kartrid milik Anda sendiri,
        dan RetroDB tidak berafiliasi dengan pembuat konsol, penerbit, atau
        basis data game mana pun. Kata-katanya sama dengan situs web dan
        trailer RetroDB.</li>
      <li><strong>Dialog Tentang terjepit di dalam bilah samping.</strong>
        Kini dialog itu terbuka di tengah layar dalam ukuran normalnya, dan
        dapat digulir di layar kecil alih-alih menyembunyikan judul dan tombol
        tutupnya.</li>
    </ul>
- version: 3.23.18
  date: '2026-10-15'
  tags:
  - type: security
    label: RetroDB hanya meluncurkan atau mengganti nama ke jenis berkas ROM yang sungguhan
  body: |
    <ul>
      <li><strong>Sebuah game dapat diluncurkan dengan berkas yang bukan
        ROM.</strong> Mengganti nama ROM menerima nama apa pun, sehingga
        <code>crash.bin</code> bisa menjadi <code>crash.cfg</code> dan berkas
        itu diserahkan ke emulator. Peluncuran kini memeriksa jenis berkas
        terhadap daftar di <code>systeminfo.txt</code> milik folder sistem itu,
        daftar yang sama yang dipakai pemindaian pustaka, dan penggantian nama
        menolak jenis yang tidak ada di daftar itu. Jika sebuah folder sistem
        tidak punya daftar, game-gamenya tidak akan diluncurkan, dan pesannya
        menyebutkan berkas yang hilang.</li>
    </ul>
- version: 3.23.17
  date: '2026-10-15'
  tags:
  - type: security
    label: Hanya admin yang dapat mengubah argumen peluncuran sebuah game
  - type: fix
    label: Argumen peluncuran dengan beberapa kata, atau tanda kutip yang tersesat, kini berfungsi
  - type: fix
    label: RetroDB tidak lagi menyimpan setiap peluncuran yang selesai di memori
  body: |
    <ul>
      <li><strong>Seorang editor dapat menambahkan argumen peluncuran yang
        menjalankan kode lain.</strong> <em>Argumen peluncuran khusus</em> sebuah
        game langsung diteruskan ke emulator, dan dengan RetroArch argumen itu
        dapat memuat berkas program apa pun di komputer. Mengubahnya kini
        memerlukan peran admin, dan kolom itu disembunyikan dari orang
        lain.</li>
      <li><strong>Argumen peluncuran yang lebih dari satu kata sampai ke
        emulator sebagai satu kata.</strong> <code>--a --b</code> kini tiba
        sebagai dua argumen, dan nilai kosong tidak menambahkan apa pun. Tanda
        kutip penutup yang hilang dulu merusak setiap peluncuran game itu
        dengan galat server; kini muncul pesan yang menyebutkan kolom yang
        perlu diperbaiki. Token <code>{disc_paths}</code> sudah dihapus: token
        itu selalu kosong.</li>
      <li><strong>Peluncuran yang sudah selesai menumpuk di memori sampai
        RetroDB dimulai ulang.</strong> Peluncuran yang berakhir lebih dari
        satu jam yang lalu kini dibersihkan.</li>
    </ul>
- version: 3.23.16
  date: '2026-10-15'
  tags:
  - type: fix
    label: Memilih bahasa di Pengaturan berfungsi lagi
  body: |
    <ul>
      <li><strong>Memilih bahasa di Pengaturan &rarr; Pustaka &rarr;
        Tampilan tidak berpengaruh apa-apa.</strong> Yang muncul justru galat,
        dan halaman tetap dalam bahasa lamanya. Ini rusak sejak 3.23.8. Memilih
        bahasa kini menyimpannya dan memuat ulang halaman dalam bahasa
        itu.</li>
    </ul>
- version: 3.23.15
  date: '2026-10-15'
  tags:
  - type: fix
    label: Ikon trofi dan platform kembali ada di unduhan
  body: |
    <ul>
      <li><strong>Unduhan tidak menyertakan ikon trofi dan platform
        RetroDB.</strong> Setiap kartu game dengan RetroAchievements
        menampilkan gambar rusak di tempat lencananya, dan tingkatan trofi
        serta logo PSN, Steam, Xbox, dan RPCS3 juga hilang. Semuanya kini
        disertakan di setiap unduhan.</li>
    </ul>
- version: 3.23.14
  date: '2026-10-10'
  tags:
  - type: security
    label: Dua pustaka bawaan diperbarui untuk perbaikan keamanan yang telah dipublikasikan
  body: |
    <ul>
      <li><strong>urllib3 dan Werkzeug memiliki masalah keamanan yang sudah diketahui.</strong>
        RetroDB kini menyertakan urllib3 2.8.0 dan Werkzeug 3.1.9, versi yang
        memperbaikinya. Instalasi dari kode sumber mendapatkannya dengan
        menjalankan <code>install.py</code> lagi, yang memasang dari
        <code>requirements.lock</code>.</li>
    </ul>
- version: 3.23.13
  date: '2026-09-26'
  tags:
  - type: fix
    label: Media yang disimpan sebagai jalur folder tidak lagi dilaporkan hilang
  body: |
    <ul>
      <li><strong>Di build mandiri, "hapus referensi media yang hilang" bisa
        mengosongkan media yang sebenarnya ada.</strong> Ini terjadi ketika
        basis data menyimpan media sebagai jalur folder seperti
        <code>images/boxart/…</code> alih-alih nama berkas saja. RetroDB
        kini mencarinya di folder yang benar.</li>
    </ul>
- version: 3.23.12
  date: '2026-09-26'
  tags:
  - type: fix
    label: Dasbor menampilkan scrape massal yang sedang berjalan, plus empat perbaikan kecil
  body: |
    <ul>
      <li><strong>Kartu progres scrape di dasbor tidak pernah muncul.</strong>
        Kini kartu itu tampil selama scrape massal berjalan, dan memberi tahu
        saat scrape dijeda.</li>
      <li><strong>Tidak ada lagi galat di konsol browser pada halaman
        masuk.</strong> Halaman itu berhenti memeriksa tugas latar belakang
        sebelum ada yang masuk.</li>
      <li><strong>Wizard penyiapan tidak lagi mengatakan "Penyiapan selesai!" saat
        penyimpanan gagal.</strong> Kini wizard memberi tahu Anda bahwa
        pengaturan tidak dapat disimpan.</li>
      <li><strong>Dua scrape massal yang dimulai pada detik yang sama tidak lagi
        berbagi id</strong>, sehingga tindakan antrean seperti batal
        mengenai scrape yang tepat.</li>
    </ul>
- version: 3.23.11
  date: '2026-09-26'
  tags:
  - type: ui
    label: Tombol donasi kini menyebutkan apa yang didukungnya
  body: |
    <ul>
      <li><strong>Kata-kata donasi yang lebih jelas.</strong> Tombol di header
        kini bertuliskan "Sponsor RetroDB" dan "Support RetroDB". README
        menyatakan bahwa setiap rilis gratis, dan bahwa donasi mendanai RetroDB
        sendiri, bukan emulator dan core yang dapat diluncurkannya.</li>
    </ul>
- version: 3.23.10
  date: '2026-09-26'
  tags:
  - type: fix
    label: Halaman Alat ROM mengikuti pengaturan tersimpan Anda, dan halaman Log serta Alat ROM berfungsi lagi
  body: |
    <ul>
      <li><strong>Halaman Log dan beberapa halaman Alat ROM rusak.</strong>
        Sebuah skrip di halaman-halaman itu gagal saat dimuat, sehingga
        penampil log dan alat bantu bersama Alat ROM tidak pernah berjalan.
        Kini semuanya dimuat dengan benar.</li>
      <li><strong>Pengaturan Alat ROM kini benar-benar berpengaruh.</strong>
        Pencari Duplikat dan Konverter CHD terbuka dengan opsi yang diatur dari
        halaman Pengaturan Alat ROM, dan Anda tetap dapat mengubahnya untuk
        satu kali jalan.</li>
      <li><strong>Sakelar di Konverter CHD diabaikan.</strong> Mematikan
        "Hapus berkas asli" di halaman tidak mencegah penghapusan jika
        pengaturan tersimpan Anda menyuruh untuk menghapus. Kini sakelar di
        halaman itulah yang menentukan.</li>
      <li><strong>Pengaturan Jalur Sementara kini dipakai.</strong> Berkas yang
        disiapkan saat membuat playlist M3U kini ditempatkan di dalamnya.</li>
    </ul>
- version: 3.23.9
  date: '2026-09-26'
  tags:
  - type: security
    label: Berkas log scraper tidak lagi menyimpan kata sandi dan token, dan percobaan masuk kembali dibatasi
  - type: fix
    label: Menyimpan Pengaturan tidak lagi menghapus pengaturan Anda, dan menghapus pengguna kini berfungsi
  body: |
    <ul>
      <li><strong>Berkas log menyimpan rahasia sebagai teks biasa.</strong>
        Berkas log scraper seharusnya menyembunyikan token masuk dan kunci API,
        tetapi langkah penyembunyiannya tidak pernah berjalan, sehingga
        semuanya ditulis utuh. Kini semuanya disembunyikan. Berkas log lama
        masih memuatnya; hapus berkas lama di <code>logs/</code> jika Anda
        membagikan instalasi Anda.</li>
      <li><strong>Batas percobaan masuk tidak diterapkan.</strong> Batas untuk
        percobaan masuk berulang dan untuk tindakan berat (pemindaian, scrape,
        impor) sudah disiapkan tetapi tidak pernah diaktifkan. Kini batas itu
        berfungsi, dan permintaan yang diblokir mendapat pesan "terlalu banyak
        permintaan" yang jelas.</li>
      <li><strong>Berkas pengaturan yang rusak bisa terhapus.</strong> Jika
        <code>data/settings.json</code> tidak dapat dibaca, penyimpanan
        berikutnya menggantinya dengan nilai bawaan. RetroDB kini menyimpan
        berkas yang rusak sebagai
        <code>settings.json.corrupt-&lt;time&gt;</code> sebelum menyimpan. Jika
        berkas itu bisa dibaca lagi, penyimpanan justru ditolak.</li>
      <li><strong>Baris penamaan Engine menghilangkan pengaturan lain.</strong>
        Menambahkan tag ke baris Engine di pengaturan penamaan gagal, dan juga
        membuang pengaturan artikel dan wilayah yang disimpan bersamanya. Kini
        tersimpan dengan benar.</li>
      <li><strong>Menghapus pengguna gagal.</strong> Pengguna yang memiliki tag,
        daftar, item wishlist, atau data PSN tidak dapat dihapus. Kini
        penghapusan menghapus pengguna itu beserta semua miliknya.</li>
      <li><strong>Dua scrape bisa berjalan bersamaan.</strong> Menukar atau
        memindahkan scrape massal yang sedang berjalan di antrean memulai dua
        scrape yang berbagi satu hitungan progres. Kini hanya satu yang
        berjalan.</li>
      <li><strong>Progres scrape massal bisa terlihat seperti galat.</strong>
        Sebelum keberhasilan pertamanya, scrape massal melaporkan statusnya
        dengan cara yang dibaca beberapa layar sebagai kegagalan. Itu sudah
        diperbaiki.</li>
      <li><strong>Setelah masuk, Anda kini dikembalikan ke halaman yang Anda minta.</strong>
        Dulu selalu menuju ke dasbor.</li>
      <li><strong>Tindakan berkas admin tetap berada di dalam folder Anda.</strong>
        Alat pengubah ukuran gambar dan tindakan ganti nama ROM kini menolak
        apa pun di luar folder media atau folder ROM Anda.</li>
      <li><strong>Berkas masuk PSN dan Xbox lama dipindahkan ke akun
        Anda.</strong> Sisa <code>data/psn_tokens.json</code> atau
        <code>data/xbox_tokens.json</code> dimuat ke akun Anda dan namanya
        diubah agar berakhiran <code>.migrated-015</code>. Berkas itu masih
        menyimpan token, jadi hapuslah setelah Anda memastikan bahwa proses
        masuk berfungsi.</li>
      <li><strong>Pesan galat yang lebih jelas dari server.</strong> Permintaan
        yang salah kini dijawab dengan pesan galat yang semestinya, bukan
        "Terjadi galat internal".</li>
    </ul>
- version: 3.23.8
  date: '2026-09-25'
  tags:
  - type: fix
    label: Impor CLZ berfungsi lagi, sampul daftar tampil, dan beberapa halaman tidak lagi rusak karena tanda apostrof
  - type: security
    label: Nama hasil scrape dan jalur berkas tidak bisa lagi keluar dari tombol halaman
  body: |
    <ul>
      <li><strong>Impor CLZ tidak melakukan apa-apa.</strong> Mengunggah PDF CLZ
        mengirimnya ke alamat yang tidak dimiliki server, sehingga setiap
        unggahan gagal dengan "Parse failed". Kini berkas itu sampai ke
        pengurainya.</li>
      <li><strong>Semua sampul di halaman daftar hilang.</strong> Halaman daftar
        meminta setiap sampul di alamat yang salah, dan kolom Sistem selalu
        kosong. Keduanya kini tampil. Gambar sampul di pencarian "tambah game"
        di halaman itu juga sudah diperbaiki.</li>
      <li><strong>Tombol rusak pada nama yang mengandung apostrof.</strong>
        Menghapus "Assassin's Creed" dari daftar, menghapus tangkapan layar,
        memperbesar sampul, atau menghapus tag genre bisa diam-diam tidak
        melakukan apa-apa jika namanya mengandung apostrof. Kesalahan yang sama
        memungkinkan nama hasil scrape yang direkayasa menjalankan kode di
        halaman. Kini nama dikirim ke tombol-tombol itu dengan cara yang tidak
        mungkin disalahartikan sebagai kode.</li>
      <li><strong>Alamat gambar dan tautan kini di-escape di mana-mana.</strong>
        Beberapa halaman menyusun alamat gambar dari nama berkas hasil scrape
        tanpa meng-escape-nya, dan lima halaman membawa salinan sendiri dari
        fungsi escape yang lebih lemah. Kini semuanya memakai fungsi bersama.</li>
      <li><strong>Halaman Pengaturan bisa terbuka kosong.</strong> Jika tab yang
        terakhir Anda pakai telah diganti namanya oleh pembaruan, Pengaturan
        terbuka tanpa panel yang terlihat. Kini halaman mengabaikan tab yang
        sudah tidak ada. Tautan seperti <code>/settings#account</code> kembali
        membuka tab tersebut.</li>
      <li><strong>Tema Anda kini mengikuti Anda ke perangkat lain.</strong> Tema
        yang Anda pilih disimpan ke akun Anda. Browser yang belum pernah diberi
        tema memakai tema tersimpan Anda, bukan tema bawaan.</li>
      <li><strong>Pop-up progres tugas menampilkan ikon yang benar.</strong>
        Tugas yang dijeda, selesai, dan mengantre menampilkan ikon "berjalan"
        yang sama. Kini setiap status punya ikonnya sendiri, per tema.</li>
      <li><strong>Daftar pintasan keyboard kini dapat diterjemahkan.</strong>
        Labelnya tidak terlihat oleh alat penerjemahan, sehingga tetap dalam
        bahasa Inggris di setiap bahasa.</li>
    </ul>
- version: 3.23.6
  date: '2026-09-03'
  tags:
  - type: fix
    label: Rating usia sering salah, dan game hasil scrape bisa kehilangan detailnya
  body: |
    <ul>
      <li><strong>Rating usia sering salah, dan kesalahannya menyebar.</strong>
        Ketika rating berasal dari TheGamesDB, aplikasi mencari kode rating di
        mana saja di dalam teks alih-alih membacanya dengan benar &mdash;
        sehingga "T - Teen", "M - Mature 17+", "AO - Adults Only 18+", dan
        "RP - Rating Pending" semuanya tersimpan sebagai rating yang salah, dan
        game Mature bisa dicatat sebagai cocok untuk semua umur. Lebih buruk
        lagi, rating yang salah itu kemudian dipakai untuk mengisi delapan
        sistem rating lainnya, sehingga satu pembacaan buruk menyebar ke
        semuanya. Rating kini dibaca dari kode di awal teks.</li>
      <li><strong>Rating hasil konversi menjadi terlalu longgar.</strong> Saat
        mengisi rating yang kosong dari rating yang sudah Anda miliki, aplikasi
        bisa memakai rating yang baru saja ia hitung beberapa saat sebelumnya,
        bukan rating yang benar-benar Anda miliki sejak awal. Setiap langkah
        mengurangi sedikit ketegasannya. Kini konversi selalu dilakukan dari
        rating yang benar-benar dimiliki game itu.</li>
      <li><strong>Scrape Ulang Penuh menghapus Wilayah dan Jenis Save yang dipilih manual.</strong>
        Keduanya tidak berasal dari scraper &mdash; aplikasi yang menentukannya
        &mdash; sehingga Scrape Ulang Penuh akan mengganti "Japan" pilihan Anda
        dengan bawaan "USA". Nilai Anda kini dipertahankan kecuali sebuah
        sumber benar-benar menyediakan nilai baru.</li>
      <li><strong>Scraper bisa menerima game yang salah.</strong> Hasil
        ScreenScraper biasanya diperiksa terhadap skor kecocokan sebelum
        dipakai, tetapi pencarian yang menghasilkan tepat satu hasil melewati
        pemeriksaan itu sepenuhnya. Kini setiap hasil diberi skor.</li>
      <li><strong>Sebuah game bisa kehilangan semua detail hasil scrape karena
        satu kolom yang hilang.</strong> Jika IGDB atau ScreenScraper membiarkan
        satu kolom kosong dengan cara yang tak terduga, seluruh pembaruan
        dibuang &mdash; penerbit, pengembang, gambar, dan semuanya. Kasus itu
        kini ditangani dan detail lainnya dipertahankan.</li>
      <li><strong>Gambar yang gagal bisa tercatat sebagai berhasil.</strong> Jika
        gambar yang diunduh ternyata tidak dapat dipakai, aplikasi tidak
        menghapus apa pun dan tetap menyimpan nama berkasnya, sehingga
        meninggalkan referensi yang rusak. Kini berkas itu dihapus dan kolomnya
        dibiarkan.</li>
      <li><strong>Mode game kini memakai kata-kata yang konsisten.</strong>
        Scraper yang berbeda menulis "Single-player" dan "Single-Player" serta
        "Multiplayer" polos yang bukan salah satu label aplikasi sendiri,
        sehingga game-game itu tidak dapat diterjemahkan atau dicocokkan oleh
        filter Mode. Semua sumber kini menulis label yang sama. Game yang sudah
        ada tetap memakai kata-kata lamanya sampai Anda melakukan scrape ulang
        atau menjalankan alat normalisasi di Pengaturan.</li>
      <li><strong>Pencarian Xbox kini berperilaku seperti sumber lainnya.</strong>
        Pencarian itu membuat permintaan web sendiri, sehingga tidak ada
        percobaan ulang saat Xbox Live meminta untuk memperlambat, dan tidak ada
        batas berapa banyak data yang bisa ditarik oleh satu balasan. Kini
        pencarian itu memakai koneksi bersama yang sama dengan scraper
        lainnya.</li>
      <li><strong>Kode ScreenScraper yang tidak terpakai dihapus.</strong> Dua
        fungsi yang tidak pernah dipanggil oleh bagian mana pun di aplikasi
        telah dihapus. Salah satunya mengembalikan alamat web yang masih memuat
        kata sandi ScreenScraper Anda, yang akan menyerahkan kata sandi itu
        kepada apa pun yang memakainya. "System Media Endpoint" yang tercantum
        di catatan rilis 3.6.x adalah salah satunya &mdash; fungsi itu tidak
        pernah dapat dijangkau dari bagian mana pun di aplikasi.</li>
    </ul>
- version: 3.23.5
  date: '2026-09-02'
  tags:
  - type: fix
    label: Unduhan paket tidak bisa dijalankan, dan perbaikan build lainnya
  body: |
    <ul>
      <li><strong>Unduhan Standalone sama sekali tidak bisa dijalankan.</strong>
        Build paket membawa Python-nya sendiri, tetapi peluncur di dalamnya
        adalah peluncur yang ditulis untuk instalasi dari kode sumber &mdash;
        peluncur itu mencari berkas Python yang tidak ada di build paket, dan
        berhenti di baris pertama. Bundel kini menyertakan peluncurnya sendiri,
        yang cukup menjalankan aplikasi dan membuka browser Anda begitu server
        siap.</li>
      <li><strong>Pintasan desktop di unduhan Linux tidak meluncurkan
        apa-apa.</strong> Pintasan itu dikirim dengan teks pengganti di tempat
        jalur ke aplikasi seharusnya berada. Kini ada
        <code>install-launcher.sh</code> di samping peluncur &mdash; jalankan
        sekali dan pintasan ditulis dengan jalur sebenarnya ke tempat Anda
        mengekstraknya.</li>
      <li><strong>Menjalankan dari kode sumber memasang dependensi yang tidak
        terverifikasi.</strong> Saat Flask tidak ada, skrip awal mengambil paket
        langsung dari internet tanpa pemeriksaan checksum, dan memaksa
        melewati pengelola paket sistem Anda dalam prosesnya. Kini skrip itu
        menyerahkannya ke <code>install.py</code>, yang memakai berkas kunci
        ber-checksum.</li>
      <li><strong>Unduhan kode sumber membawa berkas pengelola yang seharusnya
        tidak ada.</strong> Daftar berkas yang harus dikecualikan diurus secara
        manual dan sudah tertinggal, sehingga hasil audit dan sisa folder build
        ikut dikemas bersama aplikasi. Unduhan kini dibangun dari daftar berkas
        yang benar-benar ada di proyek, yang tidak mungkin menyimpang.</li>
      <li><strong>Dua panel Pengaturan rusak di build paket.</strong> Panel
        statistik pustaka dan status API mencari program utama dengan nama yang
        tidak dimilikinya di dalam build paket, sehingga keduanya gagal.</li>
      <li><strong>Sebagian teks di layar tidak pernah bisa diterjemahkan.</strong>
        Tiga bagian aplikasi yang lebih baru &mdash; pengaturan emulator, tombol
        luncur, dan bilah "sedang dimainkan" &mdash; terlewat oleh pemindaian
        terjemahan, dan pemeriksaan yang seharusnya menangkapnya melihat daftar
        tidak lengkap yang sama. Pemindaian kini mencakup setiap berkas secara
        otomatis, dan teks bagian-bagian itu sudah ditambahkan ke
        terjemahan.</li>
      <li><strong>Membangun ulang terjemahan bisa diam-diam tidak melakukan apa-apa.</strong>
        Menambahkan teks ke skrip khusus halaman membuat proses pembangunan
        ulang yakin tidak ada yang perlu dikerjakan, sehingga teks baru itu
        tidak pernah sampai ke berkas terjemahan.</li>
      <li><strong>Solusi untuk kartu grafis diterapkan ke semua orang.</strong>
        Skrip awal Linux memaksakan pengaturan yang dimaksudkan untuk satu kartu
        AMD tertentu ke setiap mesin, yang bisa membuat peningkat resolusi
        gambar macet di perangkat keras AMD lain. Kini pengaturan itu hanya
        diterapkan bila kartu tersebut memang ada, dan tidak pernah menimpa
        nilai yang Anda atur sendiri.</li>
      <li><strong>Skrip rilis bisa memublikasikan versi yang salah.</strong>
        Tag sisa dari percobaan sebelumnya diam-diam dipakai ulang, sehingga
        build bisa dibuat dari snapshot yang lebih lama sambil melaporkan
        berhasil.</li>
    </ul>
- version: 3.23.4
  date: '2026-09-02'
  tags:
  - type: fix
    label: Sembilan cara pustaka Anda bisa kehilangan data, kini ditutup
  body: |
    <ul>
      <li><strong>"Hapus data hasil scrape" menghapus seluruh pustaka Anda.</strong>
        Kotak konfirmasi hanya menghitung game yang benar-benar sudah di-scrape,
        lalu tindakan itu menghapus setiap game tanpa kecuali &mdash; sehingga
        bisa menjanjikan selusin dan menghapus ribuan. Dengan gambar diaktifkan,
        tindakan itu juga menghapus gambar sampul yang Anda unggah sendiri dan
        mengatur ulang judul yang Anda sunting sendiri, pada game yang sama
        sekali belum pernah di-scrape. Kini tindakan itu melakukan persis apa
        yang tertulis di kotak.</li>
      <li><strong>Gambar sampul 3D meninggalkan tautan rusak.</strong> Menghapus
        beserta gambar menghapus sampul 3D dari disk tetapi basis data tetap
        menunjuk ke sana, sehingga aplikasi mencari berkas yang sudah
        hilang.</li>
      <li><strong>Sakelar "Tambahkan" di Edit Massal mengganti alih-alih menambah.</strong>
        Untuk Perspektif dan Dimensi, sakelar itu melakukan kebalikan persis
        dari labelnya, menimpa nilai yang ada di setiap game yang dipilih
        sekaligus, tanpa bisa dibatalkan.</li>
      <li><strong>Build mandiri bisa menghapus setiap referensi gambar dalam
        satu klik.</strong> Di unduhan paket, aplikasi mencari media Anda di
        tempat yang salah, menyimpulkan bahwa setiap gambar hilang, lalu
        "hapus referensi media yang hilang" mengosongkan entri gambar, tangkapan
        layar, video, dan manual untuk seluruh pustaka. Pemeriksaan keamanan
        yang ada justru untuk menangkap hal ini tidak dapat melihatnya. Hanya
        build paket yang terpengaruh.</li>
      <li><strong>Pembersihan berkas yatim bisa menghapus gambar saat baru tiba.</strong>
        Sampul yang diunduh saat pembersihan berjalan bisa dianggap yatim dan
        dihapus.</li>
      <li><strong>Pembuatan playlist memindahkan arsip Anda tanpa bertanya.</strong>
        Membuat playlist M3U secara massal memindahkan berkas arsip asli Anda
        bahkan saat opsi itu Anda biarkan mati &mdash; dan saat Anda memang
        memintanya, melaporkan kegagalan untuk pemindahan yang sebenarnya
        berhasil.</li>
      <li><strong>Pengubah ukuran gambar menggelembungkan folder media Anda.</strong>
        Alat itu memperlakukan gambar mini kecil yang dibuatnya sebagai gambar
        baru untuk diperbesar, membesarkannya ke ukuran penuh lalu membuat
        gambar mini dari hasil itu. Setiap kali dijalankan, berkasnya bertambah,
        halaman diam-diam menyajikan gambar ukuran penuh sebagai pengganti
        gambar mini, dan peningkat resolusi AI berjalan pada kira-kira tiga kali
        jumlah berkas yang dimaksudkan.</li>
      <li><strong>Pengisian AI menimpa detail yang sudah Anda koreksi.</strong>
        Pada scrape biasa, pengisian itu bisa mengganti penerbit, pengembang,
        genre, rating usia, dan lainnya milik Anda. Kini pengisian itu hanya
        mengisi yang kosong; tombol Isi dengan AI yang Anda tekan sendiri tidak
        berubah.</li>
      <li><strong>Scrape berulang bisa menghapus tangkapan layar yang bagus.</strong>
        Game yang di-scrape dari RAWG memakai ulang nama berkas yang sama,
        sehingga scrape kedua menimpa tangkapan layar yang tersimpan, lalu
        menghapusnya sebagai duplikat sementara pustaka masih mencantumkannya.</li>
    </ul>
- version: 3.23.3
  date: '2026-09-01'
  tags:
  - type: fix
    label: Peran rumah tangga kini bekerja persis seperti yang tertulis, dan akun yang dinonaktifkan benar-benar terkunci
  body: |
    <ul>
      <li><strong>Menonaktifkan seseorang kini mengakhiri sesinya.</strong>
        Mematikan sebuah akun menyembunyikannya dari setiap layar, tetapi siapa
        pun yang sudah masuk dengan akun itu tetap bisa bekerja seperti biasa
        hingga seminggu. Penonaktifan adalah satu-satunya cara mengunci
        seseorang tanpa menghapusnya, jadi kini berlaku pada klik berikutnya.</li>
      <li><strong>Akun hanya-baca tidak lagi dapat mengubah data game.</strong>
        Tiga tindakan "how long to beat" terbuka untuk setiap orang yang sudah
        masuk, termasuk yang hanya bisa melihat &mdash; sehingga akun hanya-baca
        dapat menimpa waktu bermain, atau menghapusnya dari setiap game di
        pustaka. Kini tindakan itu memerlukan hak edit, seperti setiap tindakan
        lain yang mengubah game.</li>
      <li><strong>Pelacak trofi kembali berfungsi untuk semua orang.</strong>
        Menyegarkan trofi kolektor Anda sendiri memerlukan hak editor, yang
        tidak dimiliki peran Player dan Viewer &mdash; dan hanya tindakan itulah
        yang menulis trofi tersebut. Akun-akun itu tidak pernah bisa
        mendapatkannya, dan tombol Segarkan hanya menampilkan galat. Itu adalah
        progres Anda sendiri, jadi kini tidak memerlukan hak khusus sama
        sekali.</li>
      <li><strong>Penyegaran PlayStation milik seseorang tidak lagi bisa
        dihentikan orang lain.</strong> Akun mana pun yang sudah masuk dapat
        menjeda atau membatalkan penyegaran yang dimulai orang lain, dan dapat
        melihat game apa yang sedang diproses orang itu. Keduanya kini terbatas
        pada orang yang memulainya.</li>
      <li><strong>Impor Steam memakai akun Anda sendiri, bukan akun siapa pun
        yang pertama kali menyimpannya.</strong> Impor pustaka membaca satu
        salinan bersama kredensial Steam alih-alih milik Anda, sehingga bisa
        mengambil pustaka orang lain &mdash; sementara detail tersimpan Anda
        sendiri tampak hilang.</li>
      <li><strong>Menebak kata sandi admin kembali sulit.</strong> Batas
        percobaan masuk yang gagal dibagi oleh semua orang di jaringan, sehingga
        siapa pun yang punya akun sendiri dapat mengatur ulang batas itu dengan
        masuk dan terus menebak tanpa batas. Batas kini berlaku per akun.</li>
      <li><strong>Galat dari aplikasi kini sampai ke halaman alih-alih menghilang.
        </strong> Saat sebuah tindakan ditolak, 115 di antaranya menjawab dalam
        bentuk yang tidak dapat dibaca halaman, sehingga tampak seolah tindakan
        itu berhasil. Kini penolakan dilaporkan dengan benar, dan Anda melihat
        pesan yang sebenarnya.</li>
    </ul>
- version: 3.23.2
  date: '2026-08-06'
  tags:
  - type: fix
    label: Halaman pengaturan scraper dimuat lebih cepat dan tidak pernah menampilkan kunci API yang usang
  body: |
    <ul>
      <li><strong>Halaman Pengaturan dan Konfigurasi Scraper berhenti membaca ulang
        berkas pengaturan scraper pada setiap permintaan.</strong> Empat tempat
        membuka dan mengurai ulang berkas itu dari disk setiap kali halaman atau
        pemeriksaan berjalan, padahal pembaca bersama yang di-cache sudah ada.
        Kini semuanya memakainya, sehingga halaman-halaman itu bekerja lebih
        sedikit per kunjungan.</li>
      <li><strong>Penyimpanan tetap langsung berlaku.</strong> Cache yang lupa
        berdasarkan waktu bisa menampilkan nilai lama hingga setengah menit
        setelah penyimpanan. Kini setiap penyimpanan mengosongkan cache saat
        menulis, sehingga yang Anda lihat adalah yang baru saja Anda simpan.</li>
      <li><strong>Kunci API asli Anda tidak bisa lagi tergantikan oleh nilai
        tampilannya yang disamarkan.</strong> Halaman pengaturan menampilkan
        kunci tersimpan sebagai <code>***1234</code>, bukan kunci aslinya.
        Karena halaman diberi salinan pengaturan yang sama dengan yang dipakai
        scraper, penyamaran itu bisa menimpa kunci asli di memori dan membuat
        scraper masuk dengan tanda bintang sampai cache kedaluwarsa.</li>
      <li><strong>Build mandiri kini mencari pengaturan scraper di tempat yang
        benar.</strong> Scraper menentukan lokasi berkas dengan cara yang
        berbeda dari halaman yang menyimpannya. Pada instalasi biasa keduanya
        sampai di berkas yang sama; pada build mandiri (klik dua kali) tidak,
        sehingga kunci API yang tersimpan bisa berakhir di tempat yang tidak
        pernah dilihat scraper.</li>
    </ul>
- version: 3.23.1
  date: '2026-08-06'
  tags:
  - type: fix
    label: Port server yang Anda simpan di Pengaturan kini menjadi port yang dipakai
  body: |
    <ul>
      <li><strong>Menyimpan port server kini benar-benar memindahkan server.</strong>
        Pengaturan menerima port, memeriksanya, menyimpannya, dan memberi tahu
        Anda bahwa perlu mulai ulang untuk menerapkannya &mdash; lalu server
        tetap berjalan di 5000. Tidak ada yang pernah membaca kembali nilai itu.
        Kini nilai itu menjadi bagian dari rangkaian startup, sehingga mulai
        ulang benar-benar memindahkan RetroDB ke port yang Anda pilih. Apa pun
        yang diatur di environment tetap menang, sehingga peluncur atau
        container yang menetapkan port tidak terpengaruh.</li>
      <li><strong>Dua pengaturan yang tidak pernah berfungsi dihapus alih-alih
        diperbaiki.</strong> "Server host" dan "debug mode" disimpan dan
        memberikan janji palsu yang sama. Menyalakan debug mode dari formulir
        web akan membuka konsol Python interaktif di browser, dan alamat bind
        menentukan mesin mana yang dapat menjangkau RetroDB sama sekali &mdash;
        keduanya tidak pantas berada di balik formulir pengaturan. Keduanya
        tetap dapat dikonfigurasi dari environment, tempat keduanya memang
        sudah berada. Jika berkas pengaturan Anda masih memuatnya, keduanya
        dibuang diam-diam saat dimuat; tidak ada yang perlu Anda lakukan.</li>
      <li><strong>Tidak ada lagi yang mengklaim mulai ulang akan menerapkannya
        kecuali mulai ulang memang menerapkannya.</strong> Itulah cacat yang
        sebenarnya &mdash; pengaturan mati itu berantakan, tetapi janji palsu
        membuang satu sore.</li>
    </ul>
- version: 3.23.0
  date: '2026-08-06'
  tags:
  - type: enhancement
    label: Jalankan RetroDB di port pilihan pihak lain
  body: |
    <ul>
      <li><strong>RetroDB kini membaca pengaturan <code>PORT</code> dari
        environment-nya.</strong> Jika Anda menjalankan RetroDB dari alat lain
        &mdash; dasbor, container, panel server rumahan &mdash; alat itu kini
        dapat memberi RetroDB port yang diinginkannya, tanpa ada yang perlu
        menyunting berkas. Atur <code>PORT</code> dan RetroDB terikat di sana;
        biarkan saja dan tidak ada yang berubah sama sekali.
        <code>RETRODB_PORT</code> yang sudah ada tetap bekerja persis seperti
        sebelumnya, dan <code>PORT</code> menang jika keduanya diatur.</li>
      <li><strong>Nomor port yang salah kini dilaporkan alih-alih ditebak.</strong>
        Sebelumnya port yang tidak terbaca menghasilkan setumpuk teks galat
        Python, dan port di luar rentang yang bisa dipakai baru ketahuan saat
        server gagal dimulai. RetroDB kini langsung berhenti dengan satu baris
        yang menyebutkan nilai yang tidak dapat dipakainya. RetroDB tidak akan
        pernah diam-diam berjalan di port yang berbeda dari yang diminta
        &mdash; dipindahkan diam-diam lebih buruk daripada diberi tahu
        tidak.</li>
      <li><strong>Banner startup dan tab browser mengikuti port yang
        sebenarnya.</strong> Alamat yang dicetak saat RetroDB dimulai, dan
        halaman yang dibukanya untuk Anda, dulu sama-sama menyebut 5000 apa pun
        port yang sebenarnya dipakai.</li>
    </ul>
- version: 3.22.1
  date: '2026-07-31'
  tags:
  - type: fix
    label: Mencegah berkas kerja basis data membengkak tanpa batas
  body: |
    <ul>
      <li><strong>Jurnal basis data kembali dibatasi.</strong> SQLite menyimpan berkas kerja (berkas <code>-wal</code>) di samping basis data pustaka Anda. RetroDB seharusnya membatasinya pada 64&nbsp;MB, tetapi batas itu hanya berlaku untuk tugas latar belakang &mdash; pemuatan halaman dan penyuntingan biasa berjalan tanpa batas sama sekali. Setelah satu penulisan yang luar biasa besar, berkas itu tetap pada ukuran terbesarnya selamanya, kadang lebih besar daripada basis datanya sendiri. Kini batasnya berlaku di mana saja, sehingga ruangnya dikembalikan.</li>
    </ul>
- version: 3.22.0
  date: '2026-07-05'
  tags:
  - type: enhancement
    label: Scrape game langsung dari pop-up-nya, tanpa langkah tambahan
  body: |
    <ul>
      <li><strong>Scrape dari pop-up game.</strong> Pop-up game cepat
        (yang muncul saat Anda mengklik game di Perpustakaan Anda) kini memiliki
        tombol <strong>Scrape</strong> di samping Isi dengan AI dan Edit. Klik dan
        RetroDB membawa Anda langsung ke game tersebut dengan pencarian metadata
        sudah terbuka &mdash; tidak perlu lagi membuka halaman lengkap dan mencari
        tombol Scrape terlebih dahulu.</li>
    </ul>
- version: 3.21.0
  date: 2026-07-05
  tags:
  - type: feature
    label: Luncurkan satu klik — jalankan RetroDB dari ikon yang disematkan, tanpa terminal
  - type: feature
    label: Ikon aplikasi sungguhan — gamepad neon di tab browser dan taskbar Anda
  - type: feature
    label: Tombol Matikan Server baru di halaman Pengaturan
  body: |
    <ul>
      <li><strong>Luncurkan dengan satu klik.</strong> RetroDB kini memiliki
        peluncur yang tepat yang dapat Anda sematkan ke taskbar &mdash; klik dan
        aplikasi akan mulai (jika belum berjalan) lalu terbuka di browser Anda
        secara otomatis. Tidak perlu lagi membuka terminal dan mengetik perintah.
        Di Linux, jalankan <code>python3 scripts/install_launcher.py</code> sekali
        untuk menambahkan &ldquo;RetroDB&rdquo; ke menu aplikasi Anda, lalu
        sematkan.</li>
      <li><strong>Ikon aplikasi sungguhan.</strong> RetroDB kini mengenakan ikon
        gamepad neon &mdash; cyan dan magenta cyberpunk pada ubin gelap &mdash; di
        tab browser Anda (favicon), pada peluncur taskbar, dan pada program
        Windows itu sendiri. Ini menggantikan placeholder emoji polos.</li>
      <li><strong>Tombol Matikan Server.</strong> Kontrol Server di halaman
        Pengaturan kini memiliki tombol <strong>Matikan Server</strong> merah di
        samping Mulai Ulang. Ini menghentikan aplikasi dengan bersih (membiarkan
        tugas yang sedang berjalan menyelesaikan penyimpanan terlebih dahulu),
        sehingga Anda tidak perlu lagi beralih ke terminal dan menekan
        Ctrl+C.</li>
      <li><strong>Build yang dapat diunduh membuka browser untuk Anda.</strong>
        Unduhan Windows, Mac, dan Linux yang siap pakai kini membuka browser Anda
        sesaat setelah dimulai, sehingga aplikasi ada di depan Anda tanpa langkah
        tambahan.</li>
    </ul>
- version: 3.20.0
  date: 2026-07-05
  tags:
  - type: feature
    label: Sebelas bahasa baru — RetroDB kini berbicara dalam 21 bahasa
  - type: fix
    label: 'Memperbaiki galat konsol yang tidak berbahaya saat meninggalkan daftar game'
  body: |
    <ul>
      <li><strong>Sebelas paket bahasa baru.</strong> Antarmuka RetroDB,
        catatan rilis, dan manual bantuan kini diterjemahkan ke dalam
        <strong>Afrikaans, isiZulu, isiXhosa, Dutch, Norwegian (Bokm&aring;l),
        Russian, Polish, Turkish, Ukrainian, Indonesian, dan Hebrew</strong>
        &mdash; bergabung dengan German, Spanyol, French, Italia, Jepang,
        Korea, Portugis Brasil, dan Chinese Sederhana &amp; Tradisional yang
        sudah ada. Pilih bahasa Anda di Settings &rarr; Display Preferences
        &rarr; Language; aplikasi akan dimuat ulang dalam bahasa yang Anda
        pilih.</li>
      <li>Setiap bahasa mencakup seluruh aplikasi: setiap tombol, label dan
        pesan, seluruh riwayat catatan rilis, dan panduan bantuan
        lengkap.</li>
      <li><strong>isiZulu &amp; isiXhosa</strong> juga disertakan. Sebagai
        bahasa dengan sedikit kosakata perangkat lunak yang ada, keduanya
        mempertahankan istilah teknis umum (ROM, scraper, box art) dalam
        bahasa Inggris jika tidak ada padanan yang alami &mdash; koreksi dari
        penutur asli sangat diterima sebelum Anda mengandalkannya.</li>
      <li><strong>Hebrew</strong> hadir dengan teks yang diterjemahkan
        sepenuhnya; tata letak halaman kanan-ke-kiri yang rapi (agar
        antarmuka tercermin dengan benar) akan hadir pada pembaruan
        berikutnya. Arabic akan menyusul setelah pengerjaan tata letak
        tersebut selesai.</li>
      <li><strong>Perbaikan bug:</strong> meninggalkan Pustaka atau daftar game sebuah sistem tidak lagi mencatat &ldquo;ReferenceError&rdquo; yang tidak berbahaya di konsol peramban (sisa dari pembersihan sebelumnya). Tidak ada efek yang terlihat &mdash; hanya konsol yang lebih rapi.</li>
    </ul>
- version: 3.19.1
  date: 2026-07-05
  tags:
  - type: performance
    label: Scraping lebih cepat — screenshot game kini diunduh secara bersamaan
  body: |
    <ul>
      <li><strong>Screenshot diunduh secara paralel.</strong> Mengikuti
        pendekatan yang sama dengan frontend ES-DE yang populer (yang mengambil
        semua media game sekaligus), RetroDB kini mengunduh screenshot game
        <strong>secara bersamaan</strong> alih-alih satu per satu, untuk setiap
        sumber (TheGamesDB, IGDB, RAWG, ScreenScraper). Game dengan banyak
        screenshot selesai jauh lebih cepat.</li>
      <li>Pemeriksaan screenshot duplikat tetap berjalan berurutan setelahnya,
        sehingga penghapusan duplikat gambar tetap seakurat sebelumnya &mdash;
        hanya proses unduhan yang dipercepat. Unduhan dibatasi maksimal empat
        sekaligus agar satu sumber tidak pernah kelebihan beban.</li>
      <li>Peningkatan kecepatan di balik layar; berlaku setelah restart
        berikutnya.</li>
    </ul>
- version: 3.19.0
  date: 2026-07-05
  tags:
  - type: performance
    label: Scraping lebih cepat — sumber kini diminta secara bersamaan
  body: |
    <ul>
      <li><strong>Scraping kini lebih cepat untuk setiap game.</strong> Saat
        RetroDB mencari data sebuah game, ia memeriksa beberapa basis data
        (ES-DE, TheGamesDB, IGDB, RAWG, ScreenScraper). Sebelumnya ia
        menanyakannya <em>satu per satu</em> dan menunggu setiap jawaban
        sebelum bertanya ke yang berikutnya &mdash; sehingga waktu tunggu
        adalah jumlah dari semuanya. Kini ia menanyakan semuanya
        <strong>sekaligus</strong> dan hanya menunggu yang paling lambat, yang
        memberikan percepatan signifikan pada setiap game. Hasil tetap
        diurutkan dan dinilai persis seperti sebelumnya.</li>
      <li><strong>Lebih sedikit koneksi terbuang saat mengunduh
        gambar.</strong> Unduhan gambar kini menggunakan kembali koneksi yang
        sudah terbuka alih-alih membuka koneksi baru untuk setiap gambar,
        sehingga menghemat waktu pada game dengan banyak screenshot.</li>
      <li>Ini adalah peningkatan kecepatan di balik layar &mdash; tidak ada
        yang berubah dalam cara Anda menggunakan RetroDB, dan ini tidak
        membebani basis data lebih berat (permintaan yang sama, hanya
        dijalankan bersamaan). Berlaku setelah restart berikutnya.</li>
    </ul>
- version: 3.18.0
  date: 2026-07-05
  tags:
  - type: feature
    label: Menambahkan klasifikasi usia Tiongkok (China) sebagai sistem klasifikasi ke-9
  body: |
    <ul>
      <li><strong>Sistem klasifikasi usia baru: Tiongkok (CADPA).</strong>
        RetroDB kini mendukung skema resmi pengingat usia game Tiongkok
        (&ldquo;网络游戏适龄提示&rdquo;, diterbitkan oleh CADPA) di samping
        delapan badan yang sudah ada (ESRB, PEGI, CERO, USK, ACB, FPB, GRAC,
        dan ClassInd). Sistem ini menggunakan tiga tingkatan &mdash;
        <strong>8+</strong>, <strong>12+</strong>, dan <strong>16+</strong>
        &mdash; ditampilkan dengan lencana hijau sederhana.</li>
      <li><strong>Terisi otomatis, seperti yang lain.</strong> Ketika sebuah
        game sudah memiliki klasifikasi dari negara lain mana pun, RetroDB
        secara otomatis menghitung tingkatan Tiongkok yang sesuai (dan
        sebaliknya). Anda juga dapat memilih atau mengubahnya secara manual di
        layar Edit game, dan memilihnya sebagai sistem tampilan pilihan Anda di
        Pengaturan &rarr; Perpustakaan. Catatan: sebagian besar basis data game
        Barat tidak menerbitkan klasifikasi Tiongkok, jadi untuk game tanpa
        klasifikasi apa pun, nilainya diisi dari konten game selama scraping /
        AI Fill.</li>
      <li>Lencana hijau tersebut adalah ilustrasi sederhana buatan RetroDB
        sendiri (sesuai gaya khas badan-badan lainnya), bukan logo resmi
        CADPA, sehingga tidak ada keterikatan lisensi gambar.</li>
    </ul>
- version: 3.17.0
  date: 2026-07-04
  tags:
  - type: feature
    label: Bersihkan entri database untuk file media yang hilang dari disk
  - type: security
    label: Perlindungan agar seluruh gambar perpustakaan Anda tidak terhapus saat folder media hilang
  body: |
    <ul>
      <li><strong>Alat pemeliharaan baru: &ldquo;Referensi Media yang
        Hilang&rdquo;</strong> (Pengaturan &rarr; Sistem &rarr; Pemeliharaan).
        Ini adalah kebalikan dari pembersihan &ldquo;Media Yatim&rdquo; yang
        sudah ada: alih-alih mencari file gambar tersisa tanpa game, alat ini
        mencari game yang boxart, boxart 3D, screenshot, fanart, video, atau
        manualnya menunjuk ke file yang sudah tidak ada di disk. Pindai
        file-file tersebut, lalu bersihkan referensi basi itu dalam satu klik
        agar scraper dapat mengunduh ulang gambarnya. Data game Anda sendiri
        tidak pernah disentuh.</li>
      <li><strong>Pembersihan otomatis yang lebih aman saat scraping.</strong>
        Ketika RetroDB men-scrape ulang sebuah game, ia diam-diam membersihkan
        referensi ke file media yang telah hilang dari disk. Sebelumnya, jika
        satu folder media hilang sekaligus &mdash; drive eksternal yang tidak
        ter-mount, atau penghapusan massal &mdash; pembersihan tersebut dapat
        menghapus catatan gambar yang dimiliki ribuan game, memaksa scraping
        ulang yang mahal. RetroDB kini mengenali sinyal ini: jika sebuah folder
        media hilang atau benar-benar kosong, ia mempertahankan referensinya
        dan mencatat peringatan alih-alih menghapusnya. Alat pemeliharaan baru
        ini menerapkan perlindungan yang sama dan dengan jelas menandai folder
        mana pun yang ditahannya.</li>
    </ul>
- version: 3.16.0
  date: 2026-07-04
  tags:
  - type: feature
    label: Panel "Perbaikan Cepat" baru di dashboard
  body: |
    <ul>
      <li><strong>Panel &ldquo;Perbaikan Cepat&rdquo; baru di Dashboard</strong>
        mengubah tugas-tugas perpustakaan yang tersebar menjadi daftar tugas
        yang bisa dilihat sekilas. Panel ini menampilkan berapa banyak game
        yang masih belum memiliki boxart, dan menyediakan pintasan satu klik
        untuk menemukan ROM duplikat serta memeriksa jalur ROM yang rusak
        (game yang filenya telah dipindahkan atau dihapus). Setiap pintasan
        langsung menuju halaman yang memperbaikinya. Panel ini muncul setelah
        Anda memiliki game di perpustakaan.</li>
    </ul>
- version: 3.15.0
  date: 2026-07-03
  tags:
  - type: accessibility
    label: Pembaca layar kini mengumumkan kemajuan tugas secara lisan
  body: |
    <ul>
      <li><strong>Tugas yang berjalan lama kini mengucapkan kemajuannya kepada
        pembaca layar.</strong> Saat scraping massal, sinkronisasi pencapaian
        (RetroAchievements atau PlayStation), atau pengubahan ukuran gambar
        sedang berjalan, pengguna pembaca layar sebelumnya tidak mendengar apa
        pun di antara &ldquo;dimulai&rdquo; dan &ldquo;selesai&rdquo;. RetroDB
        kini mengumumkan tonggak berkala (misalnya &ldquo;Scraping Massal: 12
        dari 40&rdquo;) dan penyelesaian yang diucapkan &mdash; tanpa jendela
        pop-up tambahan di layar. Pengumuman ini diberi jeda agar memberi
        informasi tanpa berisik, dan mengikuti bahasa yang telah Anda
        pilih.</li>
    </ul>
- version: 3.14.0
  date: 2026-07-01
  tags:
  - type: feature
    label: Bahasa baru — Tiongkok (Sederhana & Tradisional) kini tersedia
  body: |
    <ul>
      <li><strong>RetroDB kini tersedia dalam bahasa Tionghoa.</strong> Dua
        pilihan tersedia di <strong>Pengaturan &rarr; Sistem &rarr;
        Bahasa</strong>: <strong>中文 (简体)</strong> (Sederhana, untuk Tiongkok
        daratan) dan <strong>中文 (繁體)</strong> (Tradisional, untuk Hong Kong
        dan Taiwan). Seluruh antarmuka &mdash; menu, tombol, pesan, dan manual
        Bantuan dalam aplikasi &mdash; telah diterjemahkan, dan apa pun yang
        belum diterjemahkan akan diam-diam kembali ke bahasa Inggris. Ini
        menjadikan jumlah bahasa yang didukung menjadi sepuluh (Inggris,
        Jerman, Spanyol, Prancis, Italia, Jepang, Portugis Brasil, Korea, dan
        kini Tionghoa Sederhana &amp; Tradisional).</li>
    </ul>
- version: 3.12.0
  date: 2026-06-30
  tags:
  - type: feature
    label: Bahasa baru — Korea (한국어) kini tersedia
  body: |
    <ul>
      <li><strong>RetroDB kini tersedia dalam bahasa Korea (한국어).</strong>
        Pilih di Pengaturan &rarr; Sistem &rarr; Bahasa. Seluruh antarmuka
        &mdash; menu, tombol, pesan, dan manual Bantuan dalam aplikasi &mdash;
        telah diterjemahkan, menjadikan jumlah bahasa yang didukung menjadi
        delapan (Inggris, Jerman, Spanyol, Prancis, Italia, Jepang, Portugis
        Brasil, dan Korea). Bahasa Korea melengkapi cakupan untuk setiap badan
        klasifikasi usia game yang ditampilkan RetroDB, termasuk GRAC dari
        Korea Selatan.</li>
    </ul>
- version: 3.11.0
  date: 2026-06-30
  tags:
  - type: enhancement
    label: Dukung RetroDB di Patreon — tautan donasi baru ditambahkan
  body: |
    <ul>
      <li><strong>Kini Anda dapat mendukung RetroDB di Patreon.</strong>
        Tautan Patreon kini berada di samping tombol &ldquo;Sponsor on
        GitHub&rdquo; yang sudah ada di <strong>Pengaturan &rarr; Sistem
        &rarr; Dukung Pengembangan</strong>, di panel Tentang, dan di README
        proyek. RetroDB tetap sepenuhnya gratis dan open source &mdash; donasi
        sepenuhnya opsional dan hanya membantu menjaga pengembangan solo tetap
        berjalan.</li>
    </ul>
- version: 3.10.0
  date: 2026-06-26
  tags:
  - type: enhancement
    label: Changelog kini dimuat lebih cepat dengan tombol "Muat Lebih Banyak"
  body: |
    <ul>
      <li><strong>Halaman Changelog kini terbuka jauh lebih cepat.</strong>
        Alih-alih menggambar seluruh riwayat rilis (ratusan entri) setiap kali
        Anda membukanya, RetroDB kini menampilkan 20 entri terbaru dan
        menambahkan tombol <strong>Muat Lebih Banyak</strong> di bagian
        bawah. Klik tombol tersebut untuk menampilkan kelompok berikutnya, dan
        seterusnya &mdash; riwayat yang lebih lama tetap ada semuanya, hanya
        saja dimuat sesuai permintaan alih-alih memperlambat tampilan
        pertama.</li>
    </ul>
- version: 3.9.0
  date: 2026-06-17
  tags:
  - type: feature
    label: Manual Bantuan & catatan rilis terbaru kini diterjemahkan ke dalam ke-6 bahasa
  body: |
    <ul>
      <li><strong>Manual Bantuan lengkap dalam aplikasi kini tersedia dalam
        keenam bahasa</strong> &mdash; Jerman, Prancis, Spanyol, Italia,
        Jepang, dan Portugis Brasil &mdash; tidak hanya bahasa Inggris.
        RetroDB menampilkan manual dalam bahasa apa pun yang telah Anda pilih
        di Pengaturan, dan diam-diam kembali ke bahasa Inggris jika sesuatu
        belum diterjemahkan.</li>
      <li><strong>Changelog ini kini juga tampil dalam bahasa Anda</strong>
        untuk rilis-rilis terbaru, dan rilis-rilis baru akan diterjemahkan
        mulai dari sini. Riwayat yang lebih lama tetap dalam bahasa
        Inggris.</li>
      <li><strong>Halaman Wishlist dan sisa-sisa terakhir teks berbahasa
        Inggris</strong> &mdash; sekumpulan pesan error dan status pop-up yang
        terlewat saat paket bahasa pertama kali hadir di 3.8.0 &mdash; kini
        diterjemahkan dengan benar di seluruh aplikasi.</li>
    </ul>
- version: 3.8.2
  date: 2026-06-17
  tags:
  - type: security
    label: Pembaruan dependensi keamanan + perbaikan CI
  body: |
    <ul>
      <li><strong>Keamanan:</strong> memperbarui pustaka <code>cryptography</code>
        bawaan (47 &rarr; 49) untuk mengatasi advisory yang telah
        dipublikasikan (GHSA-537c-gmf6-5ccf). Tidak ada perubahan perilaku —
        hanya versi yang lebih aman.</li>
      <li>Memperbaiki pipeline pengujian otomatis: sebuah helper khusus
        pengujian yang hilang (<code>beautifulsoup4</code>) telah menyebabkan
        pengujian gagal sejak v3.7.0, dan skrip build paket baru memicu
        pemeriksaan analisis statis yang merupakan false-positive yang telah
        diketahui (skrip ini menjalankan perintah build tepercaya, bukan input
        pengguna) — kini didokumentasikan dan dikalibrasi. Hanya pemeliharaan;
        tidak ada yang berubah pada aplikasi itu sendiri.</li>
    </ul>
- version: 3.8.1
  date: 2026-06-17
  tags:
  - type: improvement
    label: Opsi unduhan lebih kecil, perapian donasi & perbaikan terjemahan (Pass 46.3 / 47.6)
  body: |
    <ul>
      <li><strong>Unduhan yang jauh lebih kecil akan segera hadir.</strong>
        Versi RetroDB yang siap pakai "tinggal ekstrak dan klik dua kali" kini
        dapat dibangun dalam varian <strong>khusus CPU</strong> (~600&nbsp;MB)
        untuk pengguna yang tidak memiliki kartu grafis AMD &mdash; sekitar
        seperenam ukuran versi lengkap. Keduanya akan ditawarkan berdampingan
        sehingga Anda dapat memilih yang sesuai dengan perangkat Anda.</li>
      <li><strong>Panel "Dukung Pengembangan" di Pengaturan kini
        diterjemahkan</strong> bersama bagian aplikasi lainnya &mdash;
        sebelumnya tidak sengaja tertinggal dalam bahasa Inggris saat paket
        bahasa hadir di 3.8.0.</li>
      <li>Merapikan tautan donasi (lencana GitHub Sponsors di README; file
        pendanaan sudah siap untuk Patreon dan
        Buy&nbsp;Me&nbsp;A&nbsp;Coffee begitu keduanya disiapkan). Tidak ada
        layar ajakan yang mengganggu, sama sekali.</li>
      <li>Di balik layar: pipeline rilis kini dapat membangun versi siap
        pakai untuk Windows, macOS, dan Linux secara otomatis. Catatan: manual
        <em>Bantuan</em> dalam aplikasi yang panjang masih hanya berbahasa
        Inggris untuk saat ini &mdash; ini tercatat sebagai pekerjaan
        mendatang.</li>
    </ul>
- version: 3.8.0
  date: 2026-06-12
  tags:
  - type: feature
    label: Terjemahan antarmuka penuh + 6 bahasa (Pass 43.2/43.3/43.5)
  body: |
    <ul>
      <li><strong>RetroDB kini berbicara 6 bahasa tambahan.</strong> Dibangun
        di atas fondasi dari 3.7.0, seluruh antarmuka telah dibuat dapat
        diterjemahkan dan diterjemahkan secara otomatis ke dalam <strong>bahasa
        Jerman, Prancis, Spanyol, Italia, Jepang, dan Portugis
        Brasil</strong>. Pilih bahasa Anda di Pengaturan &rarr; Preferensi
        Tampilan &rarr; Bahasa; pilihan ini mengikuti preferensi tersimpan
        Anda, lalu browser Anda, lalu kembali ke bahasa Inggris &mdash;
        sehingga tidak akan pernah macet pada bahasa yang hilang.</li>
      <li><strong>Semua yang ada di layar telah tercakup</strong>: teks
        halaman dan tombol, pesan pop-up (notifikasi &ldquo;toast&rdquo;
        kecil), dialog edit dan pengaturan, tooltip, dan label pembaca layar.
        Genre game, perspektif, dan mode permainan (misalnya
        &ldquo;First-Person-Shooter&rdquo;) kini juga tampil dalam bahasa Anda
        &mdash; sementara data yang mendasarinya tetap dalam bahasa Inggris
        sehingga perpustakaan dan filter Anda tetap berfungsi persis seperti
        sebelumnya.</li>
      <li>Sebuah <strong>bahasa &ldquo;Pseudo&rdquo;</strong> bawaan (terlihat
        di menu Bahasa) adalah alat QA penerjemah yang memberi tanda kurung
        dan aksen pada setiap label, membuatnya langsung terlihat jelas jika
        ada teks yang terlewat.</li>
      <li>Terjemahan mesin adalah titik awal dan mungkin terasa sedikit kaku
        di beberapa tempat &mdash; mudah disempurnakan seiring waktu, dan teks
        apa pun tanpa terjemahan hanya akan tampil dalam bahasa Inggris.</li>
    </ul>
