  body: |
    <ul>
      <li><strong>Cari game atau konsol apa pun dari setiap halaman.</strong>
        Kini ada kotak pencarian di bawah nama Anda di bilah samping. Ketik
        dua huruf atau lebih untuk melihat konsol yang cocok dan hingga
        delapan game yang cocok, masing-masing dengan konsolnya. Klik salah
        satunya, atau pilih dengan tombol panah lalu tekan Enter, untuk
        membukanya. "Lihat semua hasil" membuka Pustaka dengan pencarian itu.
        Tekan / untuk melompat ke kotak itu jika halaman tidak punya kotak
        pencarian sendiri.</li>
      <li><strong>Lebih mudah berpindah-pindah di ponsel atau
        tablet.</strong> Di layar sempit, bilah di bagian atas berisi tombol
        menu dan tombol pencarian yang membuka menu dengan kursor sudah berada
        di kotak pencarian. Bilah di bagian bawah membawa Anda ke Dasbor,
        Pustaka, Sistem, dan Achievement dengan satu ketukan. Menu kini tidak
        tembus pandang, jadi halaman tidak lagi terlihat di baliknya. Ketuk di
        luar menu atau tekan Escape untuk menutupnya. Di jendela seukuran
        tablet, tombol menu hilang, sehingga menu sama sekali tidak bisa
        dibuka; kini tombolnya ada. Bilah tab dan filter yang tetap di layar
        saat Anda menggulir kini berhenti tepat di bawah bilah atas, bukan di
        belakangnya.</li>
      <li><strong>Pengaturan &gt; Emulator muat di ponsel.</strong> Tabelnya
        lebih lebar dari ponsel, sehingga tombol Edit dan Pengaturan berada di
        luar layar. Di ponsel, setiap baris kini menjadi kartu dengan
        tombolnya di dalam.</li>
      <li><strong>Menghapus gambar game tidak lagi meninggalkan berkas
        liar.</strong> Jika Anda menghapus gambar game saat RetroDB masih
        mempertajamnya di latar belakang, RetroDB bisa menulisnya kembali
        sebagai berkas yang tidak dipakai game mana pun. Kini RetroDB memeriksa
        dulu dan melewatinya. Hitungan "Menyempurnakan gambar" juga langsung
        tidak lagi menyertakan game yang dihapus.</li>
      <li><strong>Judul yang Anda ketik dipertahankan saat scraping.</strong>
        Scrape, bahkan Scrape Ulang Penuh, dulu mengganti judul yang Anda
        ketik di jendela edit dengan nama dari scraper. Kini judul yang Anda
        ubah dipertahankan. Kotak baru "Pertahankan judul ini saat scraping"
        di bawah judul menunjukkan hal ini; hapus centangnya agar scraper bisa
        mengganti nama game lagi. Atur Ulang di halaman game juga
        mengizinkannya.</li>
      <li><strong>Nama resmi untuk game Anda, diperiksa oleh Anda.</strong>
        Alat ROM punya halaman baru, Nama Resmi. Tekan "Tanya AI" untuk satu
        sistem atau semuanya, dan AI menyarankan nama resmi lengkap setiap
        game seperti saat dirilis di wilayah ROM-nya sendiri, jadi ROM Mega
        Man Jepang menjadi Rockman. Anda melihat setiap nama lama dan baru
        berdampingan, mencentang yang Anda inginkan, lalu menerimanya. Tidak
        ada yang berubah sampai Anda melakukannya. Nama lama disimpan sebagai
        judul alternatif, dan nama yang diterima dipertahankan saat scraping.
        Nama yang ditolak tidak disarankan lagi. Fitur ini memerlukan penyedia
        AI di Pengaturan &gt; Scraping.</li>
      <li><strong>Game yang hanya bertanggal tahun bisa diedit dan tetap
        menyimpan tahunnya.</strong> Banyak game hanya bertanggal tahun,
        misalnya 1985. Di halaman game, jendela edit menolak menyimpannya. Di
        jendela edit Pustaka, menyimpan game seperti itu menghapus tahunnya.
        Kini keduanya menerima tahun, tahun dan bulan, atau tanggal
        lengkap.</li>
    </ul>
