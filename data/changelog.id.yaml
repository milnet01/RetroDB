  - type: fix
    label: Game tidak lagi menampilkan RetroAchievements milik game lain. Resident Evil 4 di GameCube tidak lagi menampilkan set Resident Evil, dan Ratchet Deadlocked tidak lagi menampilkan set Ratchet & Clank
  - type: fix
    label: Scrape kini menghapus tautan RetroAchievements jika RetroAchievements tidak punya game tersebut. Jika RetroAchievements tidak dapat dijangkau, tautan tetap ada
  - type: fix
